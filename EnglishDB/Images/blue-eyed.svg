<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .eye { fill: #1E90FF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blue-eyed</text>
  <text x="50" y="120" class="subtitle">[ˌbluːˈaɪd] adj. 蓝眼睛的，受宠爱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blue (蓝色) + eye (眼睛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拥有"蓝色眼睛(blue-eye)"的人，
    <tspan x="50" dy="25">他的眼睛如同天空般清澈，让人一眼难忘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is the blue-eyed girl in the office.
  </text>
  <text x="50" y="310" class="content">
    她是办公室里备受宠爱的女孩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="20" class="eye" />
    <circle cx="140" cy="80" r="20" class="eye" />
    <!-- Pupils -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 60 140 Q 100 160 140 140" class="image" />
  </g>
</svg>