<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clubhouse</text>
  <text x="50" y="120" class="subtitle">[ˈklʌbhaʊs] n. 俱乐部会所</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> club (俱乐部) + house (房子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的房子，"俱乐部(club)"的成员们聚集在一起，
    <tspan x="50" dy="25">这个房子就是他们的"会所(house)"，充满了欢声笑语。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They often meet at the clubhouse for social events.
  </text>
  <text x="50" y="310" class="content">
    他们经常在俱乐部会所聚会参加社交活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Roof -->
    <polygon points="175,0 0,100 350,100" class="image" />
    <!-- Door -->
    <rect x="150" y="120" width="50" height="80" class="image" />
    <!-- Windows -->
    <rect x="50" y="50" width="50" height="50" class="image" />
    <rect x="250" y="50" width="50" height="50" class="image" />
    <!-- People -->
    <circle cx="70" cy="160" r="10" class="image" />
    <circle cx="100" cy="160" r="10" class="image" />
    <circle cx="130" cy="160" r="10" class="image" />
    <circle cx="270" cy="160" r="10" class="image" />
    <circle cx="300" cy="160" r="10" class="image" />
    <circle cx="330" cy="160" r="10" class="image" />
  </g>
</svg>