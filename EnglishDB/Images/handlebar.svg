<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handlebar</text>
  <text x="50" y="120" class="subtitle">[ˈhændlˌbɑːr] n. 车把</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> handle (把手) + bar (条)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骑自行车的人，双手紧紧握住"把手(handle)"，
    <tspan x="50" dy="25">而把手是由一根"条(bar)"构成的，这就是车把(handlebar)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gripped the handlebars tightly as he rode down the hill.
  </text>
  <text x="50" y="310" class="content">
    他骑下山坡时紧紧握住车把。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle frame -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Handlebars -->
    <line x1="50" y1="20" x2="250" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="50" class="image" />
    <line x1="250" y1="20" x2="250" y2="50" class="image" />
    <!-- Rider's hands -->
    <circle cx="70" cy="60" r="10" class="image" />
    <circle cx="230" cy="60" r="10" class="image" />
    <!-- Bicycle seat -->
    <rect x="150" y="100" width="50" height="20" class="image" />
    <!-- Bicycle wheels -->
    <circle cx="100" cy="180" r="30" class="image" />
    <circle cx="250" cy="180" r="30" class="image" />
  </g>
</svg>