<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4EBD0; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #A0522D; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #8B4513; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mahogany</text>
  <text x="50" y="120" class="subtitle">[məˈhɒɡəni] n. 桃花心木</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自西班牙语 "acajou"，意为“红木”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵巨大的红木树，树干呈现出深红色，
    <tspan x="50" dy="25">这种木材因其坚硬和美丽的纹理而被用于制作高档家具。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The antique table was made of mahogany.
  </text>
  <text x="50" y="310" class="content">
    这张古董桌子是用桃花心木制作的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="0" y="0" width="100" height="200" class="image" fill="#8B4513" />
    <!-- Tree branches -->
    <line x1="50" y1="0" x2="20" y2="50" class="image" />
    <line x1="50" y1="0" x2="80" y2="50" class="image" />
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <!-- Leaves -->
    <circle cx="20" cy="50" r="10" class="image" fill="#228B22" />
    <circle cx="80" cy="50" r="10" class="image" fill="#228B22" />
    <circle cx="50" cy="50" r="10" class="image" fill="#228B22" />
    <!-- Furniture -->
    <rect x="150" y="50" width="150" height="100" class="image" fill="#8B4513" />
    <line x1="150" y1="100" x2="300" y2="100" class="image" />
    <line x1="150" y1="150" x2="300" y2="150" class="image" />
  </g>
</svg>