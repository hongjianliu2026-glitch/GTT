<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bald</text>
  <text x="50" y="120" class="subtitle">[bɔːld] adj. 秃头的，光秃的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bald (光秃的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个光头的人，头顶"光秃秃(bald)"的，
    <tspan x="50" dy="25">没有一根头发，就像一片荒芜的沙漠。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He started to go bald in his thirties.
  </text>
  <text x="50" y="310" class="content">
    他在三十多岁时开始秃顶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Bald spot -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F9EBEA" />
    <!-- Eyes -->
    <circle cx="75" cy="85" r="5" class="image" fill="#000" />
    <circle cx="125" cy="85" r="5" class="image" fill="#000" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
  </g>
</svg>