<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">culture</text>
  <text x="50" y="120" class="subtitle">[ˈkʌltʃər] n. 文化，教养</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cult (耕作) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在田地里"耕作(cult)"，
    <tspan x="50" dy="25">他们不仅种植作物，还培育思想和艺术，</tspan>
    <tspan x="50" dy="25">这种培育过程形成了"文化(culture)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a deep appreciation for different cultures.
  </text>
  <text x="50" y="310" class="content">
    她对不同的文化有深刻的欣赏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Farmer -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Crops -->
    <line x1="100" y1="180" x2="120" y2="160" class="image" />
    <line x1="120" y1="160" x2="140" y2="180" class="image" />
    <line x1="150" y1="180" x2="170" y2="160" class="image" />
    <line x1="170" y1="160" x2="190" y2="180" class="image" />
    <!-- Art -->
    <rect x="220" y="20" width="100" height="160" class="image" />
    <line x1="230" y1="40" x2="290" y2="40" class="image" />
    <line x1="230" y1="70" x2="290" y2="70" class="image" />
    <line x1="230" y1="100" x2="290" y2="100" class="image" />
    <line x1="230" y1="130" x2="290" y2="130" class="image" />
  </g>
</svg>