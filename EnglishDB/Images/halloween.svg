<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Halloween</text>
  <text x="50" y="120" class="subtitle">[ˌhæləˈwiːn] n. 万圣节</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Hallo (神圣的) + ween (夜晚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神圣的夜晚(Hallo-ween)，孩子们穿着奇装异服，
    <tspan x="50" dy="25">提着南瓜灯，挨家挨户要糖果，这就是万圣节(Halloween)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We carved pumpkins for Halloween.
  </text>
  <text x="50" y="310" class="content">
    我们为万圣节雕刻了南瓜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Pumpkin -->
    <rect x="200" y="50" width="100" height="100" fill="#FF6F00" />
    <circle cx="250" cy="100" r="20" fill="#FFD700" />
    <!-- Trick or treaters -->
    <circle cx="50" cy="200" r="20" fill="#2ECC71" />
    <circle cx="100" cy="200" r="20" fill="#3498DB" />
    <circle cx="150" cy="200" r="20" fill="#E74C3C" />
    <!-- Candy -->
    <rect x="200" y="170" width="20" height="20" fill="#F39C12" />
    <rect x="230" y="170" width="20" height="20" fill="#F39C12" />
    <rect x="260" y="170" width="20" height="20" fill="#F39C12" />
  </g>
</svg>