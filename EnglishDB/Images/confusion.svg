<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confusion</text>
  <text x="50" y="120" class="subtitle">[kənˈfjuːʒn] n. 混乱，困惑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + fus (流) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象所有的思绪像水流一样"混在一起(con-fus)"，
    <tspan x="50" dy="25">结果就是一片混乱(confusion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The instructions caused confusion among the students.
  </text>
  <text x="50" y="310" class="content">
    这些指示让学生们感到困惑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Confused face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <path d="M 80 120 Q 100 140 120 120" class="image" />
    <!-- Swirling thoughts -->
    <path d="M 200 50 A 50 50 0 0 1 250 100 L 200 150 A 50 50 0 0 0 150 100 Z" class="image" />
    <path d="M 250 100 A 50 50 0 0 1 300 150 L 250 200 A 50 50 0 0 0 200 150 Z" class="image" />
    <path d="M 200 150 A 50 50 0 0 1 250 200 L 200 250 A 50 50 0 0 0 150 200 Z" class="image" />
  </g>
</svg>