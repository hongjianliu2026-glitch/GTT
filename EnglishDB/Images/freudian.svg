<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Freudian</text>
  <text x="50" y="120" class="subtitle">[frɔɪdiən] adj. 弗洛伊德学派的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Freud (弗洛伊德) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心理学家在分析梦境，"弗洛伊德(Freud)"
    <tspan x="50" dy="25">的理论深入人心，他的学派被称为弗洛伊德学派(Freudian)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The therapist used Freudian techniques to analyze the patient's dreams.
  </text>
  <text x="50" y="310" class="content">
    治疗师使用弗洛伊德学派的技术来分析病人的梦境。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Freud's face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="50" y1="90" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="120" x2="20" y2="110" class="image" />
    <line x1="50" y1="120" x2="80" y2="110" class="image" />
    <!-- Dream bubble -->
    <ellipse cx="200" cy="100" rx="80" ry="50" class="image" />
    <line x1="160" y1="100" x2="240" y2="100" class="image" />
    <line x1="180" y1="80" x2="220" y2="80" class="image" />
    <line x1="200" y1="60" x2="200" y2="120" class="image" />
  </g>
</svg>