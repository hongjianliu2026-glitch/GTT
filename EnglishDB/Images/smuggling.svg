<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smuggling</text>
  <text x="50" y="120" class="subtitle">[ˈsmʌɡlɪŋ] n. 走私</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smug (偷偷地) + -ling (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小偷(smug-ling)在夜色中偷偷地搬运(smug)
    <tspan x="50" dy="25">违禁品，这就是走私(smuggling)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The customs officers caught the smugglers red-handed.
  </text>
  <text x="50" y="310" class="content">
    海关官员当场抓获了走私者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Moon -->
    <circle cx="300" cy="50" r="20" class="image" fill="#F1C40F" />
    <!-- Smuggler -->
    <circle cx="50" cy="100" r="15" class="image" fill="#E74C3C" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Bag of contraband -->
    <rect x="80" y="120" width="40" height="30" class="image" fill="#D35400" />
    <!-- Border fence -->
    <line x1="0" y1="190" x2="350" y2="190" class="image" />
    <line x1="0" y1="195" x2="350" y2="195" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>