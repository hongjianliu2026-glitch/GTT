<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boulder</text>
  <text x="50" y="120" class="subtitle">[ˈboʊldər] n. 巨石，大圆石</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boul- (力量) + -der (表示物体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头(boul-der)，它拥有强大的力量，
    <tspan x="50" dy="25">能够阻挡河流，改变地形。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hiker found a huge boulder blocking the trail.
  </text>
  <text x="50" y="310" class="content">
    徒步旅行者发现一块巨大的巨石挡住了小径。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boulder -->
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- River -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="210" x2="350" y2="210" class="image" />
    <line x1="0" y1="220" x2="350" y2="220" class="image" />
    <!-- Hiker -->
    <circle cx="300" cy="150" r="15" class="image" />
    <line x1="300" y1="165" x2="300" y2="190" class="image" />
    <line x1="300" y1="190" x2="280" y2="220" class="image" />
    <line x1="300" y1="190" x2="320" y2="220" class="image" />
    <line x1="300" y1="175" x2="330" y2="165" class="image" />
  </g>
</svg>