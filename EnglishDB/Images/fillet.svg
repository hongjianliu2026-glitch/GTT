<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fillet</text>
  <text x="50" y="120" class="subtitle">[ˈfɪlɪt] n. 鱼片，肉片；v. 切成片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fil (线) + let (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师用刀将鱼切成"细线(fil)"，
    <tspan x="50" dy="25">每一片都薄如"小(let)"，这就是鱼片(fillet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prepared a delicious fillet of salmon for dinner.
  </text>
  <text x="50" y="310" class="content">
    她为晚餐准备了一道美味的三文鱼片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish -->
    <ellipse cx="100" cy="100" rx="80" ry="40" class="image" />
    <!-- Knife -->
    <line x1="200" y1="80" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="240" y2="130" class="image" />
    <!-- Fillet -->
    <rect x="50" y="150" width="150" height="30" class="image" />
    <text x="100" y="170" class="content">Fillet</text>
  </g>
</svg>