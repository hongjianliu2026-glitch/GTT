<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mess</text>
  <text x="50" y="120" class="subtitle">[mes] n. 混乱，脏乱；v. 弄乱，弄脏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mes- (混合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，各种物品"混合(mes-)"在一起，
    <tspan x="50" dy="25">形成了一个混乱的场景，这就是"mess"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was a complete mess after the party.
  </text>
  <text x="50" y="310" class="content">
    派对过后，房间完全是一片混乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Messy room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clothes -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="40" x2="100" y2="40" class="image" />
    <line x1="50" y1="60" x2="100" y2="60" class="image" />
    <!-- Books -->
    <line x1="150" y1="20" x2="200" y2="20" class="image" />
    <line x1="150" y1="40" x2="200" y2="40" class="image" />
    <line x1="150" y1="60" x2="200" y2="60" class="image" />
    <!-- Dishes -->
    <line x1="250" y1="20" x2="300" y2="20" class="image" />
    <line x1="250" y1="40" x2="300" y2="40" class="image" />
    <line x1="250" y1="60" x2="300" y2="60" class="image" />
    <!-- Random items -->
    <circle cx="75" cy="100" r="10" class="image" />
    <circle cx="175" cy="100" r="10" class="image" />
    <circle cx="275" cy="100" r="10" class="image" />
  </g>
</svg>