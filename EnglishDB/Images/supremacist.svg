<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supremacist</text>
  <text x="50" y="120" class="subtitle">[suːˈpreməsɪst] n. 至上主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (在上面) + -macy (统治) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个自认为"在所有人之上(super-macy)"的人，
    <tspan x="50" dy="25">他坚信自己是最优越的，这种信念使他成为了一个至上主义者(supremacist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The supremacist's views were widely condemned.
  </text>
  <text x="50" y="310" class="content">
    这个至上主义者的观点遭到了广泛的谴责。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <circle cx="100" cy="50" r="40" class="image" />
    <line x1="60" y1="50" x2="140" y2="50" class="image" />
    <line x1="80" y1="30" x2="120" y2="30" class="image" />
    <line x1="90" y1="10" x2="110" y2="10" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="260" class="image" />
    <line x1="100" y1="220" x2="120" y2="260" class="image" />
    <line x1="100" y1="190" x2="70" y2="180" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
    <!-- Arrow pointing up -->
    <line x1="100" y1="50" x2="100" y2="130" class="image" />
    <polygon points="90,50 110,50 100,30" class="image" />
  </g>
</svg>