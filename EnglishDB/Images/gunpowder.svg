<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gunpowder</text>
  <text x="50" y="120" class="subtitle">[ˈɡʌnˌpaʊdər] n. 火药</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gun (枪) + powder (粉末)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的战士，手持一把枪(gun)，
    <tspan x="50" dy="25">枪里装满了黑色的火药粉末(powder)，</tspan>
    <tspan x="50" dy="25">一旦点燃，就会爆发出巨大的威力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The invention of gunpowder changed the course of history.
  </text>
  <text x="50" y="310" class="content">
    火药的发明改变了历史的进程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gun -->
    <rect x="0" y="0" width="200" height="50" class="image" />
    <rect x="10" y="10" width="180" height="30" class="image" />
    <rect x="180" y="15" width="10" height="20" class="image" />
    <!-- Powder -->
    <rect x="220" y="0" width="100" height="50" class="image" />
    <rect x="230" y="10" width="80" height="30" class="image" />
    <rect x="240" y="20" width="60" height="10" class="image" />
    <!-- Explosion -->
    <circle cx="350" cy="25" r="20" class="image" />
    <circle cx="370" cy="25" r="15" class="image" />
    <circle cx="390" cy="25" r="10" class="image" />
  </g>
</svg>