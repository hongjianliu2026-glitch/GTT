<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bacon { fill: #D68910; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bacon</text>
  <text x="50" y="120" class="subtitle">[ˈbeɪkən] n. 培根，熏肉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bac (源自拉丁语，意为“猪”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猪被"熏制(bac-on)"成美味的培根，
    <tspan x="50" dy="25">金黄色的培根片在早餐桌上散发着诱人的香气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I love to have bacon and eggs for breakfast.
  </text>
  <text x="50" y="310" class="content">
    我喜欢早餐吃培根和鸡蛋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bacon slices -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="30" class="bacon" />
    <rect x="170" y="20" width="100" height="30" class="bacon" />
    <rect x="50" y="70" width="100" height="30" class="bacon" />
    <rect x="170" y="70" width="100" height="30" class="bacon" />
    <rect x="50" y="120" width="100" height="30" class="bacon" />
    <rect x="170" y="120" width="100" height="30" class="bacon" />
  </g>
</svg>