<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .pollution { fill: #808B96; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polluted</text>
  <text x="50" y="120" class="subtitle">[pəˈlutɪd] adj. 被污染的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pollu- (污染) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，原本清澈见底，但突然被工厂排放的废水"污染(pollu-)"，
    <tspan x="50" dy="25">河水变得浑浊不堪，这就是被污染的(polluted)河流。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The river was polluted by industrial waste.
  </text>
  <text x="50" y="310" class="content">
    这条河被工业废物污染了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="pollution" />
    <!-- Factory -->
    <rect x="20" y="150" width="50" height="30" class="image" />
    <rect x="30" y="140" width="30" height="10" class="image" />
    <!-- Pollution -->
    <line x1="70" y1="20" x2="70" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="130" y1="20" x2="130" y2="180" class="image" />
    <line x1="160" y1="20" x2="160" y2="180" class="image" />
    <line x1="190" y1="20" x2="190" y2="180" class="image" />
    <line x1="220" y1="20" x2="220" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
  </g>
</svg>