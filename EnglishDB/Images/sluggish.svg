<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sluggish</text>
  <text x="50" y="120" class="subtitle">[ˈslʌɡɪʃ] adj. 行动迟缓的，懒惰的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slug (缓慢移动的生物) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蜗牛在草地上缓慢爬行，"像蜗牛一样(slug-ish)"
    <tspan x="50" dy="25">行动迟缓，这就是sluggish的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a heavy meal, he felt sluggish and needed a nap.
  </text>
  <text x="50" y="310" class="content">
    吃完一顿大餐后，他感到行动迟缓，需要小睡一会儿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="0" y="180" width="350" height="20" fill="#27AE60" />
    <!-- Snail -->
    <circle cx="50" cy="150" r="20" fill="#D35400" />
    <circle cx="50" cy="130" r="10" fill="#D35400" />
    <line x1="50" y1="150" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Slow movement -->
    <line x1="50" y1="150" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
  </g>
</svg>