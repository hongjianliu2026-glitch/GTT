<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">session</text>
  <text x="50" y="120" class="subtitle">[ˈsɛʃən] n. 会议，学期，一段时间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sess (坐) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在桌子旁，"坐下来(sess)"
    <tspan x="50" dy="25">讨论问题，这段时间就是一次会议(session)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting session lasted for three hours.
  </text>
  <text x="50" y="310" class="content">
    会议持续了三个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People sitting -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Chairs -->
    <line x1="40" y1="70" x2="60" y2="70" class="image" />
    <line x1="140" y1="70" x2="160" y2="70" class="image" />
    <line x1="240" y1="70" x2="260" y2="70" class="image" />
    <!-- Table top -->
    <line x1="0" y1="30" x2="350" y2="30" class="image" />
  </g>
</svg>