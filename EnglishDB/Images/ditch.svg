<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ditch</text>
  <text x="50" y="120" class="subtitle">[dɪtʃ] n. 沟渠，水沟；v. 抛弃，摆脱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + tch (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在田野中，"分开(di-)"
    <tspan x="50" dy="25">土地挖出一条沟渠(ditch)，用来排水或种植。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer dug a ditch to drain the water from the field.
  </text>
  <text x="50" y="310" class="content">
    农夫挖了一条沟渠来排掉田里的水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ditch -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Farmer -->
    <circle cx="20" cy="50" r="15" class="image" />
    <line x1="20" y1="65" x2="20" y2="100" class="image" />
    <line x1="20" y1="100" x2="0" y2="130" class="image" />
    <line x1="20" y1="100" x2="40" y2="130" class="image" />
    <line x1="20" y1="80" x2="50" y2="70" class="image" />
    <!-- Shovel -->
    <line x1="20" y1="65" x2="70" y2="10" class="image" />
    <line x1="70" y1="10" x2="80" y2="20" class="image" />
  </g>
</svg>