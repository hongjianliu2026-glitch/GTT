<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">upstate</text>
  <text x="50" y="120" class="subtitle">[ʌpˈsteɪt] adj. 州北部的；adv. 在州北部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + state (州)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从城市中心"向上(up)"移动到"州(state)"的北部，
    <tspan x="50" dy="25">那里有广阔的田野和宁静的乡村生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They moved upstate to escape the city's hustle and bustle.
  </text>
  <text x="50" y="310" class="content">
    他们搬到州北部以逃离城市的喧嚣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="180" x2="50" y2="100" class="image" />
    <line x1="100" y1="180" x2="100" y2="120" class="image" />
    <line x1="150" y1="180" x2="150" y2="140" class="image" />
    <line x1="200" y1="180" x2="200" y2="160" class="image" />
    <line x1="250" y1="180" x2="250" y2="180" class="image" />
    <!-- Arrow pointing up -->
    <line x1="175" y1="20" x2="175" y2="80" class="image" />
    <line x1="175" y1="80" x2="165" y2="60" class="image" />
    <line x1="175" y1="80" x2="185" y2="60" class="image" />
    <!-- Countryside -->
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <line x1="100" y1="200" x2="100" y2="150" class="image" />
    <line x1="200" y1="200" x2="200" y2="170" class="image" />
    <line x1="250" y1="200" x2="250" y2="190" class="image" />
  </g>
</svg>