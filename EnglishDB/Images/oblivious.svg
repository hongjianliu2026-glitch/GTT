<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oblivious</text>
  <text x="50" y="120" class="subtitle">[əˈblɪviəs] adj. 遗忘的，不注意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (离开) + liv (生命) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走在路上，完全"离开(ob-)"了周围的环境，
    <tspan x="50" dy="25">仿佛他的"生命(liv)"被抽离，对周围的一切都"不注意(oblivious)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was so engrossed in her book that she was oblivious to the world around her.
  </text>
  <text x="50" y="310" class="content">
    她如此专注于她的书，以至于对周围的世界毫不在意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />

    <!-- Book -->
    <rect x="100" y="80" width="100" height="120" class="image" />
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <line x1="120" y1="120" x2="180" y2="120" class="image" />
    <line x1="120" y1="140" x2="180" y2="140" class="image" />
    <line x1="120" y1="160" x2="180" y2="160" class="image" />

    <!-- Environment -->
    <line x1="0" y1="250" x2="300" y2="250" class="image" />
    <line x1="0" y1="260" x2="300" y2="260" class="image" />
    <line x1="0" y1="270" x2="300" y2="270" class="image" />
  </g>
</svg>