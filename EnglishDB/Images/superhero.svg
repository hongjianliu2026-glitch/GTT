<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">superhero</text>
  <text x="50" y="120" class="subtitle">[ˈsuːpərˌhɪroʊ] n. 超级英雄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (超级) + hero (英雄)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"超级(super)"强大的"英雄(hero)"，
    <tspan x="50" dy="25">他穿着斗篷，飞翔在城市上空，保护着人们。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Batman is a well-known superhero.
  </text>
  <text x="50" y="310" class="content">
    蝙蝠侠是一个众所周知的超级英雄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Superhero -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <rect x="30" y="80" width="40" height="20" class="image" /> <!-- Cape -->
    <line x1="50" y1="80" x2="50" y2="60" class="image" /> <!-- Cape line -->
    <line x1="30" y1="80" x2="10" y2="60" class="image" /> <!-- Left cape line -->
    <line x1="70" y1="80" x2="90" y2="60" class="image" /> <!-- Right cape line -->
    <circle cx="50" cy="90" r="5" class="image" /> <!-- Mask -->
  </g>
</svg>