<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recommendation</text>
  <text x="50" y="120" class="subtitle">[ˌrekəmenˈdeɪʃn] n. 推荐，建议</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + com- (共同) + mend (委托)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在会议上，"再次共同委托(re-com-mend)"
    <tspan x="50" dy="25">某人去做某事，这就是推荐(recommendation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager made a strong recommendation for the new project.
  </text>
  <text x="50" y="310" class="content">
    经理强烈推荐了这个新项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Hand pointing -->
    <line x1="100" y1="70" x2="150" y2="100" class="image" />
    <!-- Speech bubble -->
    <path d="M150,100 Q200,100 200,150 Q150,150 150,100 Z" class="image" />
    <text x="160" y="130" class="content">推荐</text>
  </g>
</svg>