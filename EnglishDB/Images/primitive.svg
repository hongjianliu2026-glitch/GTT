<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">primitive</text>
  <text x="50" y="120" class="subtitle">[ˈprɪmətɪv] adj. 原始的，简单的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prim (第一) + -itive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始人，"第一(prim)"次使用简单的工具，
    <tspan x="50" dy="25">这些工具虽然简单，但却是人类文明的起点。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cave paintings are some of the earliest examples of primitive art.
  </text>
  <text x="50" y="310" class="content">
    这些洞穴壁画是早期原始艺术的例子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Primitive man -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="130" class="image" />
    <line x1="50" y1="150" x2="0" y2="130" class="image" />
    <!-- Simple tool -->
    <rect x="120" y="100" width="50" height="100" class="image" />
    <line x1="145" y1="100" x2="145" y2="50" class="image" />
  </g>
</svg>