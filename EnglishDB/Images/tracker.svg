<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tracker</text>
  <text x="50" y="120" class="subtitle">[ˈtrækər] n. 追踪器，跟踪器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> track (追踪) + -er (表示工具或人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个侦探拿着一个"追踪器(tracker)"，
    <tspan x="50" dy="25">他通过这个设备"追踪(track)"目标的行踪，</tspan>
    <tspan x="50" dy="25">就像猎人追踪猎物一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tracker helped the police locate the missing child.
  </text>
  <text x="50" y="310" class="content">
    追踪器帮助警察找到了失踪的孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tracker device -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <circle cx="75" cy="50" r="20" class="image" />
    <line x1="75" y1="70" x2="75" y2="100" class="image" />
    <line x1="75" y1="100" x2="50" y2="120" class="image" />
    <line x1="75" y1="100" x2="100" y2="120" class="image" />
    <!-- Detective -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="220" y2="210" class="image" />
    <line x1="250" y1="180" x2="280" y2="210" class="image" />
    <line x1="250" y1="150" x2="300" y2="140" class="image" />
    <!-- Path -->
    <path d="M250,180 Q300,250 350,180" class="image" />
  </g>
</svg>