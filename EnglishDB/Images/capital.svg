<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">capital</text>
  <text x="50" y="120" class="subtitle">[ˈkæpɪtl] n. 首都，资本；adj. 主要的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cap (头) + -ital (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的城市，它的"头(cap)"是首都(capital)，
    <tspan x="50" dy="25">所有的决策和资源都集中在这里，就像一个国家的"头"一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Beijing is the capital of China.
  </text>
  <text x="50" y="310" class="content">
    北京是中国的首都。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="10" width="50" height="120" class="image" />
    <rect x="190" y="30" width="50" height="90" class="image" />
    <rect x="260" y="0" width="50" height="130" class="image" />
    <!-- Capital building -->
    <rect x="120" y="130" width="100" height="50" class="image" />
    <line x1="120" y1="130" x2="170" y2="100" class="image" />
    <line x1="220" y1="130" x2="170" y2="100" class="image" />
    <!-- Flag -->
    <line x1="170" y1="100" x2="170" y2="50" class="image" />
    <rect x1="165" y1="50" width="10" height="50" class="image" />
  </g>
</svg>