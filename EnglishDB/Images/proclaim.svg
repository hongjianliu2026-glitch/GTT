<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">proclaim</text>
  <text x="50" y="120" class="subtitle">[prəˈkleɪm] v. 宣布，声明</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (在前面) + claim (喊叫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高台上，"在众人面前大声喊叫(pro-claim)"
    <tspan x="50" dy="25">宣布重要消息，这就是proclaim的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The president proclaimed a new policy.
  </text>
  <text x="50" y="310" class="content">
    总统宣布了一项新政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on stage -->
    <circle cx="175" cy="80" r="20" class="image" />
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="120" x2="220" y2="110" class="image" />
    <!-- Megaphone -->
    <polygon points="220,110 250,110 250,90 220,90" class="image" />
    <line x1="250" y1="100" x2="280" y2="100" class="image" />
    <!-- Audience -->
    <circle cx="50" cy="180" r="10" class="image" />
    <circle cx="100" cy="180" r="10" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
    <circle cx="200" cy="180" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
    <circle cx="300" cy="180" r="10" class="image" />
  </g>
</svg>