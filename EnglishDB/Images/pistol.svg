<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pistol</text>
  <text x="50" y="120" class="subtitle">[ˈpɪstl] n. 手枪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pist- (来自拉丁语 "pistola"，意为“手枪”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的牛仔，手持一把"手枪(pistol)"，
    <tspan x="50" dy="25">准备在西部荒野中保护自己。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective drew his pistol and aimed at the suspect.
  </text>
  <text x="50" y="310" class="content">
    侦探拔出手枪，瞄准了嫌疑人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pistol -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="200" height="50" class="image" />
    <rect x="50" y="100" width="150" height="20" class="image" />
    <rect x="200" y="100" width="50" height="20" class="image" />
    <rect x="250" y="100" width="50" height="20" class="image" />
    <!-- Cowboy -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>