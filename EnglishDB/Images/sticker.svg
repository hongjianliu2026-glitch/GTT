<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sticker</text>
  <text x="50" y="120" class="subtitle">[ˈstɪkər] n. 贴纸，粘贴物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stick (粘) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"粘(stick)"性物体，它像一个超级英雄一样，
    <tspan x="50" dy="25">能够"粘住(stick)"任何东西，这就是"贴纸(sticker)"的夸张画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She put a sticker on her laptop to personalize it.
  </text>
  <text x="50" y="310" class="content">
    她在笔记本电脑上贴了一个贴纸来个性化它。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sticker -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <text x="100" y="80" text-anchor="middle" class="image" fill="#A93226">STICKER</text>
    <!-- Glue -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="50" y1="155" x2="150" y2="155" class="image" />
    <line x1="50" y1="160" x2="150" y2="160" class="image" />
    <!-- Superhero -->
    <circle cx="100" cy="250" r="30" class="image" />
    <line x1="100" y1="280" x2="100" y2="350" class="image" />
    <line x1="100" y1="350" x2="70" y2="400" class="image" />
    <line x1="100" y1="350" x2="130" y2="400" class="image" />
    <line x1="100" y1="300" x2="50" y2="320" class="image" />
    <line x1="100" y1="300" x2="150" y2="320" class="image" />
  </g>
</svg>