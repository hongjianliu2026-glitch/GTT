<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">digest</text>
  <text x="50" y="120" class="subtitle">[daɪˈdʒest] v. 消化；理解；n. 摘要</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + gest (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在吃东西，食物被"分开(di-)"成小块，
    <tspan x="50" dy="25">"携带(gest)"到身体各处，这就是消化(digest)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It took me a while to digest the complex information.
  </text>
  <text x="50" y="310" class="content">
    我花了一段时间才理解了这些复杂的信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Food -->
    <rect x="30" y="70" width="40" height="20" class="image" />
    <!-- Stomach -->
    <ellipse cx="100" cy="150" rx="50" ry="30" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="70" x2="100" y2="120" class="image" />
    <polygon points="100,120 90,110 90,130" class="image" />
  </g>
</svg>