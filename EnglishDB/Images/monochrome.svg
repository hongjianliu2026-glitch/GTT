<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monochrome</text>
  <text x="50" y="120" class="subtitle">[ˈmɒnəkrəʊm] adj. 单色的，黑白的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mono- (单一) + chrome (颜色)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在画布上，只用一种颜色(mono-chrome)
    <tspan x="50" dy="25">创作，整个画面都是黑白的，没有其他色彩。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old photograph was in monochrome.
  </text>
  <text x="50" y="310" class="content">
    那张老照片是黑白的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Canvas -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Monochrome painting -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#808080" />
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Brush -->
    <line x1="20" y1="115" x2="70" y2="115" class="image" />
    <line x1="70" y1="115" x2="60" y2="105" class="image" />
  </g>
</svg>