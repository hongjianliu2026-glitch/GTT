<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heiress</text>
  <text x="50" y="120" class="subtitle">[ˈɛrɪs] n. 女继承人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heir (继承人) + -ess (表示女性)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个优雅的女士，头戴皇冠，手握权杖，
    <tspan x="50" dy="25">象征着她作为家族财富的"女继承人(heiress)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She became the heiress of a vast fortune after her father's death.
  </text>
  <text x="50" y="310" class="content">
    她父亲去世后，她成为了巨额财富的女继承人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <path d="M10 20 L20 0 L30 20 Z" class="image" />
    <path d="M15 25 L20 10 L25 25 Z" class="image" />
    <!-- Scepter -->
    <line x1="20" y1="30" x2="20" y2="150" class="image" />
    <circle cx="20" cy="160" r="10" class="image" />
    <!-- Lady -->
    <circle cx="20" cy="200" r="20" class="image" />
    <line x1="20" y1="220" x2="20" y2="260" class="image" />
    <line x1="20" y1="260" x2="0" y2="300" class="image" />
    <line x1="20" y1="260" x2="40" y2="300" class="image" />
    <line x1="20" y1="240" x2="50" y2="230" class="image" />
  </g>
</svg>