<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">respective</text>
  <text x="50" y="120" class="subtitle">[rɪˈspɛktɪv] adj. 各自的，分别的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + spect (看) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象三个人各自回头看(re-spect)自己的东西，
    <tspan x="50" dy="25">每个人看到的都是属于自己的(respective)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They went to their respective homes after the meeting.
  </text>
  <text x="50" y="310" class="content">
    会议结束后，他们各自回家了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person 1 -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="10" y2="140" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <line x1="50" y1="120" x2="10" y2="80" class="image" />
    <line x1="50" y1="120" x2="90" y2="80" class="image" />
    <rect x="20" y="20" width="60" height="60" class="image" />

    <!-- Person 2 -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="150" x2="160" y2="140" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
    <line x1="200" y1="120" x2="160" y2="80" class="image" />
    <line x1="200" y1="120" x2="240" y2="80" class="image" />
    <rect x="170" y="20" width="60" height="60" class="image" />

    <!-- Person 3 -->
    <circle cx="350" cy="100" r="20" class="image" />
    <line x1="350" y1="120" x2="350" y2="180" class="image" />
    <line x1="350" y1="180" x2="330" y2="220" class="image" />
    <line x1="350" y1="180" x2="370" y2="220" class="image" />
    <line x1="350" y1="150" x2="310" y2="140" class="image" />
    <line x1="350" y1="150" x2="390" y2="140" class="image" />
    <line x1="350" y1="120" x2="310" y2="80" class="image" />
    <line x1="350" y1="120" x2="390" y2="80" class="image" />
    <rect x="320" y="20" width="60" height="60" class="image" />
  </g>
</svg>