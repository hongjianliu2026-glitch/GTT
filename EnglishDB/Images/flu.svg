<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flu</text>
  <text x="50" y="120" class="subtitle">[fluː] n. 流感</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "fluere" (流动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象流感病毒像液体一样"流动(fluere)"，
    <tspan x="50" dy="25">迅速传播，让人感到不适。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She caught the flu during the winter.
  </text>
  <text x="50" y="310" class="content">
    她在冬天得了流感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Virus -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="80" cy="80" r="15" class="image" />
    <circle cx="110" cy="50" r="18" class="image" />
    <circle cx="140" cy="80" r="12" class="image" />
    <!-- Liquid flow -->
    <path d="M50 100 Q80 150 140 100" class="image" />
    <path d="M50 120 Q80 170 140 120" class="image" />
    <path d="M50 140 Q80 190 140 140" class="image" />
  </g>
</svg>