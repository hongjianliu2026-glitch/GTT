<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .pearl { fill: #FFF; stroke: #34495E; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pearl</text>
  <text x="50" y="120" class="subtitle">[pɜːrl] n. 珍珠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> perla (拉丁语，珍珠)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗珍珠在贝壳中，"贝壳孕育(perla)"
    <tspan x="50" dy="25">出这颗珍贵的珍珠(pearl)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a necklace of pearls at the wedding.
  </text>
  <text x="50" y="310" class="content">
    她在婚礼上戴了一条珍珠项链。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shell -->
    <path d="M50 50 Q100 20 150 50 T250 50 Q200 80 150 50 T50 50" class="image" />
    <!-- Pearl -->
    <circle cx="150" cy="50" r="20" class="pearl" />
  </g>
</svg>