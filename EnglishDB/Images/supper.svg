<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supper</text>
  <text x="50" y="120" class="subtitle">[ˈsʌpər] n. 晚餐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sup (吃) + per (表名词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一家人围坐在餐桌前，"吃(sup)"
    <tspan x="50" dy="25">着丰盛的晚餐(supper)，享受温馨的夜晚。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We usually have supper at 7 PM.
  </text>
  <text x="50" y="310" class="content">
    我们通常在晚上7点吃晚餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Plate -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Food -->
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <line x1="90" y1="120" x2="110" y2="120" class="image" />
    <!-- Family -->
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Chairs -->
    <line x1="180" y1="120" x2="180" y2="150" class="image" />
    <line x1="230" y1="120" x2="230" y2="150" class="image" />
    <line x1="280" y1="120" x2="280" y2="150" class="image" />
  </g>
</svg>