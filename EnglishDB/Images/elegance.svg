<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elegance</text>
  <text x="50" y="120" class="subtitle">[ˈɛlɪɡəns] n. 优雅，高雅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + leg (选择) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位女士在舞会上，"选择(leg)"
    <tspan x="50" dy="25">出最优雅(elegance)的舞步，</tspan>
    <tspan x="50" dy="25">她的每一个动作都让人惊叹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her elegance in handling the situation was remarkable.
  </text>
  <text x="50" y="310" class="content">
    她在处理这种情况时的优雅令人瞩目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elegant lady -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="250" class="image" /> <!-- Right leg -->
    <!-- Dress -->
    <path d="M50,200 Q80,150 50,100 Q20,150 50,200" class="image" />
    <!-- Dance floor -->
    <rect x="0" y="250" width="350" height="50" class="image" />
  </g>
</svg>