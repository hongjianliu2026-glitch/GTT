<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sexually</text>
  <text x="50" y="120" class="subtitle">[ˈsɛkʃuəli] adv. 性方面地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sex (性) + -ual (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在月光下，"性(sex)"
    <tspan x="50" dy="25">的互动，这种互动是"性方面地(sexually)"发生的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They communicated sexually through body language.
  </text>
  <text x="50" y="310" class="content">
    他们通过肢体语言进行性方面的交流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Couple -->
    <circle cx="50" cy="150" r="15" class="image" fill="#3498DB" />
    <circle cx="150" cy="150" r="15" class="image" fill="#E74C3C" />
    <line x1="50" y1="165" x2="150" y2="165" class="image" />
    <!-- Heart -->
    <path d="M100,200 C100,200 80,220 100,240 C120,220 100,200 100,200" class="image" fill="#E74C3C" />
  </g>
</svg>