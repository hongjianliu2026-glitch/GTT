<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">astounding</text>
  <text x="50" y="120" class="subtitle">[əˈstaʊndɪŋ] adj. 令人震惊的，惊人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + stound (震惊)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"加强的震惊(a-stound)"到，
    <tspan x="50" dy="25">嘴巴张得大大的，眼睛瞪得圆圆的，</tspan>
    <tspan x="50" dy="25">这就是astounding的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's tricks were astounding.
  </text>
  <text x="50" y="310" class="content">
    魔术师的把戏令人震惊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with open mouth and wide eyes -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <ellipse cx="40" cy="45" rx="5" ry="10" class="image" /> <!-- Left eye -->
    <ellipse cx="60" cy="45" rx="5" ry="10" class="image" /> <!-- Right eye -->
    <path d="M 30 70 Q 50 90 70 70" class="image" /> <!-- Mouth -->
    <line x1="50" y1="80" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="120" x2="70" y2="150" class="image" /> <!-- Right arm -->
    <line x1="50" y1="120" x2="50" y2="150" class="image" /> <!-- Legs -->
  </g>
</svg>