<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">moreover</text>
  <text x="50" y="120" class="subtitle">[mɔːrˈoʊvər] adv. 此外，而且</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> more (更多) + over (在上面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一堆书上，"更多(more)的书堆在上面(over)"，
    <tspan x="50" dy="25">表示还有更多的内容要补充，这就是"此外，而且(moreover)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The weather is nice today, and moreover, the flowers are blooming.
  </text>
  <text x="50" y="310" class="content">
    今天天气很好，而且花儿也在盛开。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Books -->
    <rect x="50" y="20" width="100" height="150" class="image" />
    <rect x="70" y="40" width="100" height="150" class="image" />
    <rect x="90" y="60" width="100" height="150" class="image" />
    <!-- Person on top -->
    <circle cx="140" cy="80" r="15" class="image" />
    <line x1="140" y1="95" x2="140" y2="130" class="image" />
    <line x1="140" y1="130" x2="120" y2="160" class="image" />
    <line x1="140" y1="130" x2="160" y2="160" class="image" />
    <line x1="140" y1="110" x2="170" y2="100" class="image" />
  </g>
</svg>