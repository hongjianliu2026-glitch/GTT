<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">low-income</text>
  <text x="50" y="120" class="subtitle">[ˈloʊ ˈɪnkʌm] adj. 低收入的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> low (低的) + income (收入)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭，他们的收入很低，只能住在简陋的小屋里，
    <tspan x="50" dy="25">屋子里只有一张破旧的床和一个小小的火炉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government provides assistance to low-income families.
  </text>
  <text x="50" y="310" class="content">
    政府为低收入家庭提供援助。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small house -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="100" x2="130" y2="100" class="image" />
    <line x1="75" y1="100" x2="75" y2="150" class="image" />
    <!-- Bed -->
    <rect x="20" y="110" width="110" height="30" class="image" />
    <!-- Stove -->
    <rect x="60" y="150" width="30" height="20" class="image" />
    <line x1="70" y1="150" x2="70" y2="170" class="image" />
  </g>
</svg>