<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glossy</text>
  <text x="50" y="120" class="subtitle">[ˈɡlɒsi] adj. 光滑的，有光泽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gloss (光泽) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫在阳光下，它的毛发"闪闪发光(gloss)"，
    <tspan x="50" dy="25">就像涂了一层油，光滑而有光泽(glossy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magazine has glossy pages.
  </text>
  <text x="50" y="310" class="content">
    这本杂志的页面光滑而有光泽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="170" class="image" />
    <line x1="100" y1="180" x2="150" y2="170" class="image" />
    <!-- Sunlight -->
    <circle cx="200" cy="50" r="30" class="image" fill="#F1C40F" />
    <line x1="200" y1="80" x2="100" y2="100" class="image" stroke="#F1C40F" stroke-width="3" />
    <line x1="200" y1="80" x2="150" y2="150" class="image" stroke="#F1C40F" stroke-width="3" />
    <line x1="200" y1="80" x2="50" y2="150" class="image" stroke="#F1C40F" stroke-width="3" />
  </g>
</svg>