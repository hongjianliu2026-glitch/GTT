<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">packed</text>
  <text x="50" y="120" class="subtitle">[pækt] adj. 挤满的，塞满的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pack (包裹) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的包裹，里面塞满了各种物品，"包裹(pack)得满满的(packed)"，
    <tspan x="50" dy="25">以至于没有一点空隙。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The train was packed with passengers.
  </text>
  <text x="50" y="310" class="content">
    火车上挤满了乘客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Items inside the box -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <rect x="160" y="40" width="30" height="30" class="image" />
    <circle cx="220" cy="60" r="15" class="image" />
    <rect x="260" y="50" width="20" height="20" class="image" />
    <circle cx="300" cy="70" r="10" class="image" />
    <!-- Overlapping items -->
    <rect x="80" y="80" width="30" height="30" class="image" />
    <circle cx="140" cy="90" r="15" class="image" />
    <rect x="200" y="100" width="20" height="20" class="image" />
    <circle cx="260" cy="110" r="10" class="image" />
    <rect x="300" y="120" width="15" height="15" class="image" />
  </g>
</svg>