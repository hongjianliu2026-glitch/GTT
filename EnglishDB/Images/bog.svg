<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5EFE6; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #A0522D; }
      .content { font: 18px sans-serif; fill: #654321; }
      .highlight { font-weight: bold; fill: #CD853F; }
      .story { font: 16px serif; fill: #8B4513; }
      .image { stroke: #654321; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bog</text>
  <text x="50" y="120" class="subtitle">[bɒɡ] n. 沼泽，泥塘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bog (源自中古英语 bogge，意为“泥潭”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片泥泞的沼泽地，"泥潭(bog)"
    <tspan x="50" dy="25">中充满了湿滑的泥浆，让人难以行走。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car got stuck in the bog and we had to push it out.
  </text>
  <text x="50" y="310" class="content">
    汽车陷入了泥潭，我们不得不把它推出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bog -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mud -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Water droplets -->
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="130" cy="110" r="10" class="image" />
    <circle cx="160" cy="140" r="10" class="image" />
    <!-- Stuck car -->
    <rect x="200" y="100" width="100" height="50" class="image" />
    <circle cx="220" cy="130" r="15" class="image" />
    <circle cx="280" cy="130" r="15" class="image" />
  </g>
</svg>