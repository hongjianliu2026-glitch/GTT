<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deficient</text>
  <text x="50" y="120" class="subtitle">[dɪˈfɪʃnt] adj. 不足的，缺乏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + fic (做) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图"做(fic)"某事，但因为"向下(de-)"的力量不足，
    <tspan x="50" dy="25">结果事情没有完成，这就是"不足的(deficient)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was deficient in resources.
  </text>
  <text x="50" y="310" class="content">
    这个项目在资源方面是不足的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person trying to lift a heavy box -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="100" class="image" /> <!-- Box -->
    <circle cx="250" cy="100" r="15" class="image" /> <!-- Person's head -->
    <line x1="250" y1="115" x2="250" y2="150" class="image" /> <!-- Person's body -->
    <line x1="250" y1="150" x2="230" y2="180" class="image" /> <!-- Person's left arm -->
    <line x1="250" y1="150" x2="270" y2="180" class="image" /> <!-- Person's right arm -->
    <line x1="250" y1="130" x2="220" y2="120" class="image" /> <!-- Person's left leg -->
    <line x1="250" y1="130" x2="280" y2="120" class="image" /> <!-- Person's right leg -->
    <line x1="250" y1="150" x2="100" y2="70" class="image" /> <!-- Person trying to lift the box -->
  </g>
</svg>