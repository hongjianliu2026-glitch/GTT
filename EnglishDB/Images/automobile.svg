<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">automobile</text>
  <text x="50" y="120" class="subtitle">[ˈɔːtəməbiːl] n. 汽车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auto- (自己) + mobile (移动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车"自己移动(auto-mobile)"，
    <tspan x="50" dy="25">就像一个自动行驶的机器，这就是汽车(automobile)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bought a new automobile last week.
  </text>
  <text x="50" y="310" class="content">
    他上周买了一辆新车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="120" r="20" class="image" />
    <circle cx="300" cy="120" r="20" class="image" />
    <!-- Windows -->
    <rect x="50" y="20" width="100" height="40" class="image" />
    <rect x="200" y="20" width="100" height="40" class="image" />
    <!-- Driver -->
    <circle cx="200" cy="60" r="15" class="image" />
    <line x1="200" y1="75" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="120" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
    <line x1="200" y1="85" x2="230" y2="75" class="image" />
  </g>
</svg>