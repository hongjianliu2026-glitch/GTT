<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">milieu</text>
  <text x="50" y="120" class="subtitle">[ˈmiːljə] n. 环境，周围</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mil (中间) + ieu (周围)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个圆圈的中心，"周围(ieu)"
    <tspan x="50" dy="25">的环境(milieu)包围着他，影响着他的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist's work is deeply influenced by his milieu.
  </text>
  <text x="50" y="310" class="content">
    这位艺术家的作品深受其环境的影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle representing the milieu -->
    <circle cx="175" cy="100" r="100" class="image" />
    <!-- Person in the center -->
    <circle cx="175" cy="100" r="15" class="image" />
    <!-- Surrounding elements -->
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <line x1="125" y1="50" x2="225" y2="150" class="image" />
    <line x1="125" y1="150" x2="225" y2="50" class="image" />
  </g>
</svg>