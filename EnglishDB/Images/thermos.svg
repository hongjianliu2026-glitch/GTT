<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .thermos { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thermos</text>
  <text x="50" y="120" class="subtitle">[ˈθɜːrməs] n. 热水瓶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thermo- (热) + -s (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的热水瓶，"热(thermo)"
    <tspan x="50" dy="25">气腾腾，里面装满了温暖的液体，</tspan>
    <tspan x="50" dy="25">这就是thermos(热水瓶)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always carries a thermos of hot tea.
  </text>
  <text x="50" y="310" class="content">
    她总是带着一个装满热茶的热水瓶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thermos -->
    <rect x="0" y="0" width="150" height="300" class="thermos" />
    <rect x="20" y="20" width="110" height="260" class="thermos" />
    <rect x="40" y="40" width="70" height="220" class="thermos" />
    <!-- Handle -->
    <rect x="160" y="120" width="20" height="80" class="thermos" />
    <rect x="150" y="140" width="40" height="40" class="thermos" />
    <!-- Steam -->
    <line x1="75" y1="0" x2="75" y2="-50" class="image" />
    <line x1="75" y1="0" x2="60" y2="-40" class="image" />
    <line x1="75" y1="0" x2="90" y2="-40" class="image" />
  </g>
</svg>