<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">left-wing</text>
  <text x="50" y="120" class="subtitle">[ˈlɛft wɪŋ] n. 左翼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> left (左) + wing (翼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的鸟，它的左翼(left-wing)
    <tspan x="50" dy="25">象征着政治上的左翼，代表着进步和自由。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The left-wing party won the election.
  </text>
  <text x="50" y="310" class="content">
    左翼政党赢得了选举。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Left wing -->
    <path d="M 50 100 Q 0 50, 50 0" class="image" />
    <!-- Right wing -->
    <path d="M 250 100 Q 300 50, 250 0" class="image" />
    <!-- Bird head -->
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Left wing label -->
    <text x="20" y="50" class="highlight">left-wing</text>
  </g>
</svg>