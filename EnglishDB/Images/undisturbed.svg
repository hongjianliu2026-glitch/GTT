<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undisturbed</text>
  <text x="50" y="120" class="subtitle">[ˌʌndɪˈstɜːrbd] adj. 未受干扰的，平静的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + disturb (打扰)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宁静的湖面，"不被打扰(un-disturbed)"
    <tspan x="50" dy="25">的湖水，平静如镜，没有一丝波纹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man sat undisturbed by the lake, enjoying the peace.
  </text>
  <text x="50" y="310" class="content">
    老人坐在湖边，享受着未受打扰的宁静。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" fill="#87CEEB" />
    <!-- Reflection -->
    <line x1="100" y1="180" x2="250" y2="180" class="image" />
    <line x1="120" y1="190" x2="230" y2="190" class="image" />
    <line x1="140" y1="200" x2="210" y2="200" class="image" />
    <!-- Old man -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>