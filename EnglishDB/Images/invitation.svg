<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">invitation</text>
  <text x="50" y="120" class="subtitle">[ˌɪnvɪˈteɪʃn] n. 邀请</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vit (生命) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个盛大的宴会，主人"邀请(in-vit)"
    <tspan x="50" dy="25">宾客进入(in)他们的生活(vit)，</tspan>
    <tspan x="50" dy="25">这就是邀请(invitation)的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received an invitation to the wedding.
  </text>
  <text x="50" y="310" class="content">
    她收到了婚礼的邀请。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Envelope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Letter -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Stamp -->
    <circle cx="300" cy="30" r="20" class="image" />
    <text x="290" y="40" class="content" text-anchor="middle">Stamp</text>
  </g>
</svg>