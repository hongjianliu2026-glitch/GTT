<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alternately</text>
  <text x="50" y="120" class="subtitle">[ˈɔːltərnətli] adv. 交替地，轮流地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alter (改变) + n + ate (动词后缀) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在玩跷跷板，他们"交替改变(alter-n-ate-ly)"
    <tspan x="50" dy="25">位置，轮流上下，这就是交替地(alternately)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They alternately took turns to speak at the meeting.
  </text>
  <text x="50" y="310" class="content">
    他们在会议上轮流发言。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seesaw -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="350" y1="20" x2="350" y2="100" class="image" />
    <!-- People -->
    <circle cx="100" cy="120" r="20" class="image" />
    <circle cx="300" cy="120" r="20" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="120" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="100" y2="220" class="image" />
    <line x1="300" y1="120" x2="250" y2="170" class="image" />
    <line x1="250" y1="170" x2="300" y2="220" class="image" />
  </g>
</svg>