<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uncharacteristically</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˌkærəktəˈrɪstɪkli] adv. 不寻常地，反常地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + character (特征) + -istic (形容词后缀) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个平时总是严肃的人，今天却"不寻常地(uncharacteristically)"
    <tspan x="50" dy="25">笑得像个孩子，这种反常的行为让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spoke uncharacteristically softly, surprising everyone.
  </text>
  <text x="50" y="310" class="content">
    他出人意料地轻声说话，让大家都很惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Serious face -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="35" y1="40" x2="45" y2="40" class="image" />
    <line x1="55" y1="40" x2="65" y2="40" class="image" />
    <line x1="45" y1="60" x2="55" y2="60" class="image" />
    <!-- Happy face -->
    <circle cx="150" cy="50" r="30" class="image" />
    <line x1="135" y1="40" x2="145" y2="40" class="image" />
    <line x1="155" y1="40" x2="165" y2="40" class="image" />
    <path d="M135,60 Q150,80 165,60" class="image" />
    <!-- Arrow -->
    <line x1="80" y1="50" x2="120" y2="50" class="image" />
    <polygon points="120,50 115,45 115,55" class="image" />
  </g>
</svg>