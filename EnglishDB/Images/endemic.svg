<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">endemic</text>
  <text x="50" y="120" class="subtitle">[ɛnˈdɛmɪk] adj. 地方性的，风土的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (在...里面) + dem (人民) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个地方性的疾病，"在人民(dem)中传播"，
    <tspan x="50" dy="25">这种疾病只在特定地区(en-)流行，这就是地方性的(endemic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Malaria is endemic in many tropical regions.
  </text>
  <text x="50" y="310" class="content">
    疟疾在许多热带地区是地方性的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Location marker -->
    <circle cx="175" cy="100" r="15" class="image" />
    <!-- Disease symbol -->
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="140" x2="155" y2="130" class="image" />
    <line x1="175" y1="140" x2="195" y2="130" class="image" />
    <line x1="175" y1="140" x2="155" y2="150" class="image" />
    <line x1="175" y1="140" x2="195" y2="150" class="image" />
  </g>
</svg>