<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">warrant</text>
  <text x="50" y="120" class="subtitle">[ˈwɒrənt] n. 授权令，许可证；v. 保证，担保</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> war- (保护) + -ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个警察拿着"保护(war-)"的"授权令(warrant)"，
    <tspan x="50" dy="25">他可以合法地进入某个地方进行搜查。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police officer had a warrant to search the house.
  </text>
  <text x="50" y="310" class="content">
    警察有一张搜查房屋的授权令。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Police officer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Warrant paper -->
    <rect x="70" y="80" width="200" height="100" class="image" />
    <line x1="80" y1="100" x2="260" y2="100" class="image" />
    <line x1="80" y1="120" x2="260" y2="120" class="image" />
    <line x1="80" y1="140" x2="260" y2="140" class="image" />
    <line x1="80" y1="160" x2="260" y2="160" class="image" />
    <!-- House -->
    <rect x="300" y="80" width="100" height="100" class="image" />
    <line x1="320" y1="80" x2="320" y2="180" class="image" />
    <line x1="340" y1="80" x2="340" y2="180" class="image" />
    <line x1="360" y1="80" x2="360" y2="180" class="image" />
    <line x1="380" y1="80" x2="380" y2="180" class="image" />
  </g>
</svg>