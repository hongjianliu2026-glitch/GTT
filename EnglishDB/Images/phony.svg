<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">phony</text>
  <text x="50" y="120" class="subtitle">[ˈfoʊni] adj. 假的，伪造的；n. 骗子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> phon (声音) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在电话里假装成另一个人，发出"假的声音(phon-y)"，
    <tspan x="50" dy="25">实际上他是个骗子(phony)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't believe him; he's a phony.
  </text>
  <text x="50" y="310" class="content">
    别相信他，他是个骗子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Phone -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <circle cx="75" cy="100" r="50" class="image" />
    <line x1="75" y1="150" x2="75" y2="200" class="image" />
    <!-- Fake voice -->
    <path d="M100,100 Q150,50 200,100" class="image" />
    <path d="M100,120 Q150,70 200,120" class="image" />
    <path d="M100,140 Q150,90 200,140" class="image" />
    <!-- Cheater -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
  </g>
</svg>