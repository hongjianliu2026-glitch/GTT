<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alleyway</text>
  <text x="50" y="120" class="subtitle">[ˈæliweɪ] n. 小巷，胡同</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alley (小巷) + way (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条狭窄的"小巷(alley)"，两边是高墙，
    <tspan x="50" dy="25">中间是一条"路(way)"，这就是alleyway。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They found the cat hiding in the alleyway.
  </text>
  <text x="50" y="310" class="content">
    他们发现猫躲在小巷里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Alley walls -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <rect x="200" y="0" width="200" height="300" class="image" />
    <!-- Alley path -->
    <line x1="100" y1="0" x2="100" y2="300" class="image" />
    <line x1="300" y1="0" x2="300" y2="300" class="image" />
    <!-- Cat -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="180" x2="230" y2="170" class="image" />
  </g>
</svg>