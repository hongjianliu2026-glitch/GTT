<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cheese { fill: #FFD700; }
      .burger { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheeseburger</text>
  <text x="50" y="120" class="subtitle">[ˈtʃiːzbɜːrɡər] n. 芝士汉堡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cheese (奶酪) + burger (汉堡)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个汉堡上覆盖着金黄的奶酪，"奶酪(cheese)"
    <tspan x="50" dy="25">融化在"汉堡(burger)"上，这就是芝士汉堡(cheeseburger)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He ordered a cheeseburger with extra cheese.
  </text>
  <text x="50" y="310" class="content">
    他点了一个加双份奶酪的芝士汉堡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cheese -->
    <rect x="50" y="20" width="250" height="50" class="cheese" />
    <!-- Burger -->
    <rect x="50" y="70" width="250" height="100" class="burger" />
    <!-- Cheese melting -->
    <polygon points="50,20 300,20 300,40 50,40" class="cheese" />
    <polygon points="50,20 300,20 300,30 50,30" class="cheese" />
  </g>
</svg>