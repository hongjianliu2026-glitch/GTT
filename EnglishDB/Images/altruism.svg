<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">altruism</text>
  <text x="50" y="120" class="subtitle">[ˈæltruɪzəm] n. 利他主义，无私</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> altru- (其他) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在帮助别人，"其他(altru-)"
    <tspan x="50" dy="25">人优先，这种无私的行为就是利他主义(altruism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His altruism was evident in his constant willingness to help others.
  </text>
  <text x="50" y="310" class="content">
    他的利他主义体现在他总是愿意帮助别人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <!-- Person helping another -->
    <circle cx="30" cy="100" r="15" class="image" />
    <line x1="30" y1="115" x2="30" y2="150" class="image" />
    <line x1="30" y1="150" x2="10" y2="180" class="image" />
    <line x1="30" y1="150" x2="50" y2="180" class="image" />
    <line x1="30" y1="130" x2="60" y2="120" class="image" />
    <!-- Person being helped -->
    <circle cx="60" cy="100" r="15" class="image" />
    <line x1="60" y1="115" x2="60" y2="150" class="image" />
    <line x1="60" y1="150" x2="40" y2="180" class="image" />
    <line x1="60" y1="150" x2="80" y2="180" class="image" />
    <line x1="60" y1="130" x2="90" y2="120" class="image" />
    <!-- Arrow indicating help -->
    <line x1="30" y1="120" x2="60" y2="120" class="image" />
    <polygon points="60,120 55,115 55,125" class="image" />
  </g>
</svg>