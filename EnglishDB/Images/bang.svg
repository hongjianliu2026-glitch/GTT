<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bang</text>
  <text x="50" y="120" class="subtitle">[bæŋ] n. 重击声，爆炸声；v. 重击，猛敲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bang (拟声词，模拟重击或爆炸声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"砰(bang)"地一声砸在墙上，
    <tspan x="50" dy="25">发出震耳欲聋的声音，这就是"bang"的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The door slammed with a loud bang.
  </text>
  <text x="50" y="310" class="content">
    门砰的一声关上了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hammer -->
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="170" y2="70" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
    <!-- Impact -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="150" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="180" y2="170" class="image" />
    <line x1="200" y1="150" x2="220" y2="170" class="image" />
  </g>
</svg>