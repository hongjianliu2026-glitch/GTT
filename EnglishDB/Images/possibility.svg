<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">possibility</text>
  <text x="50" y="120" class="subtitle">[ˌpɒsɪˈbɪlɪti] n. 可能性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poss- (能够) + -ibility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满无限可能的宇宙，"能够(poss-)"
    <tspan x="50" dy="25">实现任何事情，这就是可能性(possibility)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There is a possibility that it might rain tomorrow.
  </text>
  <text x="50" y="310" class="content">
    明天可能会下雨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Universe -->
    <circle cx="175" cy="100" r="100" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="250" cy="50" r="5" class="image" />
    <circle cx="175" cy="150" r="5" class="image" />
    <circle cx="125" cy="125" r="5" class="image" />
    <circle cx="225" cy="125" r="5" class="image" />
    <!-- Light rays -->
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <line x1="125" y1="50" x2="225" y2="150" class="image" />
    <line x1="225" y1="50" x2="125" y2="150" class="image" />
  </g>
</svg>