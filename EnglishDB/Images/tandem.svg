<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tandem</text>
  <text x="50" y="120" class="subtitle">[ˈtændəm] n. 双人自行车的后座；adv. 一前一后地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tan- (一起) + dem (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人"一起(tan-)"骑在一辆双人自行车上，
    <tspan x="50" dy="25">后座的人紧紧抓住前座的人，"地方(dem)"共享，共同前进。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They rode a tandem bicycle through the park.
  </text>
  <text x="50" y="310" class="content">
    他们骑着双人自行车穿过公园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle frame -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Front wheel -->
    <circle cx="100" cy="120" r="30" class="image" />
    <!-- Rear wheel -->
    <circle cx="250" cy="120" r="30" class="image" />
    <!-- Handlebars -->
    <line x1="70" y1="40" x2="100" y2="40" class="image" />
    <line x1="100" y1="40" x2="100" y2="20" class="image" />
    <!-- Seat -->
    <rect x="150" y="20" width="50" height="20" class="image" />
    <rect x="200" y="20" width="50" height="20" class="image" />
    <!-- Pedals -->
    <line x1="100" y1="90" x2="100" y2="120" class="image" />
    <line x1="250" y1="90" x2="250" y2="120" class="image" />
    <!-- Riders -->
    <circle cx="175" cy="10" r="15" class="image" />
    <circle cx="225" cy="10" r="15" class="image" />
  </g>
</svg>