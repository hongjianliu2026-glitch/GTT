<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sapphire { fill: #0F52BA; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sapphire</text>
  <text x="50" y="120" class="subtitle">[ˈsæfaɪər] n. 蓝宝石</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> saphir (源自拉丁语，意为“蓝宝石”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗深蓝色的蓝宝石(sapphire)，它闪耀着神秘的光芒，
    <tspan x="50" dy="25">仿佛能吸引所有人的目光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a necklace with a sapphire pendant.
  </text>
  <text x="50" y="310" class="content">
    她戴着一条带有蓝宝石吊坠的项链。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sapphire gem -->
    <circle cx="100" cy="100" r="50" class="sapphire" />
    <!-- Sparkle -->
    <line x1="80" y1="80" x2="90" y2="90" class="image" />
    <line x1="120" y1="80" x2="110" y2="90" class="image" />
    <line x1="100" y1="60" x2="100" y2="70" class="image" />
  </g>
</svg>