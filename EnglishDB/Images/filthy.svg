<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">filthy</text>
  <text x="50" y="120" class="subtitle">[ˈfɪlθi] adj. 肮脏的，污秽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> filth (污秽) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个满是污垢的房间，到处都是"污秽(filth)"，
    <tspan x="50" dy="25">整个环境让人感到非常"肮脏(filthy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bathroom was so filthy that I couldn't use it.
  </text>
  <text x="50" y="310" class="content">
    浴室太脏了，我无法使用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dirty room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dirt spots -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="80" r="25" class="image" />
    <circle cx="150" cy="120" r="30" class="image" />
    <circle cx="200" cy="160" r="35" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Trash -->
    <line x1="30" y1="180" x2="60" y2="180" class="image" />
    <line x1="45" y1="170" x2="45" y2="190" class="image" />
    <line x1="30" y1="180" x2="60" y2="180" class="image" />
    <line x1="45" y1="170" x2="45" y2="190" class="image" />
    <line x1="100" y1="180" x2="130" y2="180" class="image" />
    <line x1="115" y1="170" x2="115" y2="190" class="image" />
    <line x1="100" y1="180" x2="130" y2="180" class="image" />
    <line x1="115" y1="170" x2="115" y2="190" class="image" />
  </g>
</svg>