<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #4A4A4A; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #FF6F61; }
      .story { font: 16px serif; fill: #6A1B9A; }
      .image { stroke: #FF6F61; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lovable</text>
  <text x="50" y="120" class="subtitle">[ˈlʌvəbl] adj. 可爱的，讨人喜欢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> love (爱) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫，它"能够被爱(love-able)"，
    <tspan x="50" dy="25">因为它那柔软的毛发和无辜的眼神，让人忍不住想要拥抱它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The puppy is so lovable that everyone wants to pet it.
  </text>
  <text x="50" y="310" class="content">
    这只小狗太可爱了，每个人都想摸摸它。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="140" class="image" /> <!-- Body -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Front leg -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Back leg -->
    <line x1="50" y1="140" x2="20" y2="180" class="image" /> <!-- Tail -->
    <line x1="50" y1="140" x2="80" y2="180" class="image" /> <!-- Tail -->
    <!-- Eyes -->
    <circle cx="40" cy="40" r="5" class="image" />
    <circle cx="60" cy="40" r="5" class="image" />
    <!-- Mouth -->
    <path d="M45 60 Q50 55 55 60" class="image" />
  </g>
</svg>