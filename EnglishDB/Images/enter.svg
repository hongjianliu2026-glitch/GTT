<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enter</text>
  <text x="50" y="120" class="subtitle">[ˈɛntər] v. 进入，加入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + ter (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在门口，准备"进入(en-ter)"
    <tspan x="50" dy="25">一个新的地方，这个动作就是enter。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She entered the room with a smile.
  </text>
  <text x="50" y="310" class="content">
    她微笑着走进了房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="300" class="image" />
    <line x1="100" y1="250" x2="120" y2="300" class="image" />
    <line x1="100" y1="200" x2="140" y2="180" class="image" />
  </g>
</svg>