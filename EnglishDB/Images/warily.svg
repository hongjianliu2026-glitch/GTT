<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">warily</text>
  <text x="50" y="120" class="subtitle">[ˈwɛrəli] adv. 小心翼翼地，警惕地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> war (小心) + -ily (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在黑暗的房间里，"小心翼翼地(war-ily)"
    <tspan x="50" dy="25">探索，每一步都充满了警惕。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She walked warily through the dark alley.
  </text>
  <text x="50" y="310" class="content">
    她小心翼翼地走过黑暗的小巷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="90" r="5" fill="#E74C3C" />
    <circle cx="60" cy="90" r="5" fill="#E74C3C" />
    <!-- Steps -->
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>