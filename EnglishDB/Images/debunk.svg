<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">debunk</text>
  <text x="50" y="120" class="subtitle">[diːˈbʌŋk] v. 揭穿，揭露</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (去掉) + bunk (胡说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一把大锤子，"去掉(de-)"
    <tspan x="50" dy="25">一个巨大的"胡说(bunk)"气球，</tspan>
    <tspan x="50" dy="25">气球瞬间爆裂，真相大白。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The journalist debunked the politician's false claims.
  </text>
  <text x="50" y="310" class="content">
    记者揭穿了政客的虚假声明。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="250" class="image" />
    <line x1="150" y1="200" x2="170" y2="250" class="image" />
    <!-- Hammer -->
    <rect x="50" y="150" width="100" height="50" class="image" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="300" class="image" />
    <line x1="100" y1="250" x2="120" y2="300" class="image" />
    <!-- Explosion -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="130" cy="80" r="15" class="image" />
    <circle cx="170" cy="80" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
  </g>
</svg>