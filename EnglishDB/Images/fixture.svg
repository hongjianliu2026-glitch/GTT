<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fixture</text>
  <text x="50" y="120" class="subtitle">[ˈfɪkstʃər] n. 固定装置，固定物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fix (固定) + -ture (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的螺丝钉"固定(fix)"在墙上，
    <tspan x="50" dy="25">这个螺丝钉就成了一个"固定装置(fixture)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bathroom fixtures need to be replaced.
  </text>
  <text x="50" y="310" class="content">
    浴室的固定装置需要更换。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Screw -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <circle cx="175" cy="20" r="10" class="image" />
    <line x1="175" y1="20" x2="160" y2="40" class="image" />
    <line x1="175" y1="20" x2="190" y2="40" class="image" />
    <line x1="175" y1="20" x2="150" y2="30" class="image" />
    <line x1="175" y1="20" x2="200" y2="30" class="image" />
  </g>
</svg>