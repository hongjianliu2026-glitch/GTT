<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">schematic</text>
  <text x="50" y="120" class="subtitle">[skəˈmætɪk] adj. 示意性的，图解的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> schema- (计划，图表) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工程师在白板上，"画出(schema)"
    <tspan x="50" dy="25">一个电路图，这个图就是示意性的(schematic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The schematic diagram helped us understand the circuit.
  </text>
  <text x="50" y="310" class="content">
    示意图帮助我们理解了电路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Whiteboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Circuit lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Components -->
    <rect x="100" y="30" width="20" height="20" class="image" />
    <rect x="150" y="30" width="20" height="20" class="image" />
    <rect x="200" y="30" width="20" height="20" class="image" />
    <rect x="250" y="30" width="20" height="20" class="image" />
    <!-- Engineer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>