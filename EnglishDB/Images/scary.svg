<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scary</text>
  <text x="50" y="120" class="subtitle">[ˈskeri] adj. 可怕的，吓人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scare (惊吓) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幽灵突然出现在你面前，"惊吓(scare)"
    <tspan x="50" dy="25">得你心跳加速，这就是"可怕的(scary)"感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The horror movie was so scary that I couldn't sleep.
  </text>
  <text x="50" y="310" class="content">
    那部恐怖电影太吓人了，我晚上都睡不着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ghost -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="75" y1="120" x2="125" y2="120" class="image" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="140" x2="80" y2="160" class="image" />
    <line x1="100" y1="140" x2="120" y2="160" class="image" />
    <!-- Person -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="220" y2="220" class="image" />
    <line x1="250" y1="180" x2="280" y2="220" class="image" />
    <line x1="250" y1="150" x2="220" y2="140" class="image" />
    <line x1="250" y1="150" x2="280" y2="140" class="image" />
    <!-- Heartbeat -->
    <line x1="250" y1="250" x2="250" y2="280" class="image" />
    <line x1="250" y1="280" x2="230" y2="300" class="image" />
    <line x1="250" y1="280" x2="270" y2="300" class="image" />
  </g>
</svg>