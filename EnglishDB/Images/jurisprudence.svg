<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jurisprudence</text>
  <text x="50" y="120" class="subtitle">[ˌdʒʊrɪsˈpruːdəns] n. 法学，法律学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> juris (法律) + prudence (智慧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位法官坐在法庭上，手持法典，"用法律的智慧(juris-prudence)"
    <tspan x="50" dy="25">来裁决案件，这就是法学(jurisprudence)的精髓。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He studied jurisprudence at Harvard Law School.
  </text>
  <text x="50" y="310" class="content">
    他在哈佛法学院学习法学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Law book -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="70" y1="110" x2="130" y2="110" class="image" />
    <line x1="70" y1="140" x2="130" y2="140" class="image" />
    <!-- Court -->
    <rect x="170" y="20" width="150" height="160" class="image" />
    <line x1="190" y1="50" x2="300" y2="50" class="image" />
    <line x1="190" y1="80" x2="300" y2="80" class="image" />
    <line x1="190" y1="110" x2="300" y2="110" class="image" />
    <line x1="190" y1="140" x2="300" y2="140" class="image" />
  </g>
</svg>