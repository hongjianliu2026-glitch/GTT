<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .wave { fill: #1ABC9C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tsunami</text>
  <text x="50" y="120" class="subtitle">[tsuːˈnɑːmi] n. 海啸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tsu- (港口) + nami (波)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的波浪("波" nami)从港口("港口" tsu-)
    <tspan x="50" dy="25">涌出，形成了一场毁灭性的海啸(tsunami)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tsunami caused widespread destruction along the coast.
  </text>
  <text x="50" y="310" class="content">
    海啸造成了沿海地区的广泛破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wave -->
    <path d="M0 100 Q100 200 200 100 T400 100 T600 100 T800 100" class="wave" />
    <path d="M0 120 Q100 220 200 120 T400 120 T600 120 T800 120" class="wave" />
    <path d="M0 140 Q100 240 200 140 T400 140 T600 140 T800 140" class="wave" />
    <!-- Port -->
    <rect x="50" y="150" width="100" height="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="300" y2="150" class="image" />
  </g>
</svg>