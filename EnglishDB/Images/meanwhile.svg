<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meanwhile</text>
  <text x="50" y="120" class="subtitle">[ˈmiːnwaɪl] adv. 同时，在此期间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mean (中间) + while (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在不同的时间段做不同的事情，
    <tspan x="50" dy="25">但在"中间的时间(mean-while)"里，他们都在忙碌。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was cooking dinner, meanwhile, her husband was watching TV.
  </text>
  <text x="50" y="310" class="content">
    她在做饭，与此同时，她的丈夫在看电视。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Cooking pot -->
    <rect x="30" y="160" width="40" height="20" class="image" />
    <line x1="50" y1="160" x2="50" y2="180" class="image" />

    <!-- Second person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- TV screen -->
    <rect x="180" y="160" width="40" height="20" class="image" />
    <line x1="200" y1="160" x2="200" y2="180" class="image" />

    <!-- Time line -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="50" y1="190" x2="50" y2="210" class="image" />
    <line x1="200" y1="190" x2="200" y2="210" class="image" />
  </g>
</svg>