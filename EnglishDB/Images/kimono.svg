<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kimono</text>
  <text x="50" y="120" class="subtitle">[kiˈmoʊnoʊ] n. 和服</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ki (着る) + mono (物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着和服的人，"着る(ki)"
    <tspan x="50" dy="25">物(mono)，这件物就是和服(kimono)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a beautiful kimono to the festival.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件漂亮的和服去参加节日。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kimono outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Kimono body -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Kimono sleeves -->
    <rect x="20" y="20" width="30" height="160" class="image" />
    <rect x="300" y="20" width="30" height="160" class="image" />
    <!-- Kimono belt -->
    <rect x="125" y="180" width="100" height="10" class="image" />
    <!-- Person wearing kimono -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>