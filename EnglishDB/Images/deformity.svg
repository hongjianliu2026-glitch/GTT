<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deformity</text>
  <text x="50" y="120" class="subtitle">[dɪˈfɔːrmɪti] n. 畸形，残缺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + form (形状) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原本完美的形状被"离开(de-)"了它的正常状态，
    <tspan x="50" dy="25">变成了一个畸形的物体，这就是deformity。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The deformity of his leg was caused by a childhood accident.
  </text>
  <text x="50" y="310" class="content">
    他腿部的畸形是由童年时的一次事故造成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Normal shape -->
    <rect x="0" y="0" width="150" height="150" class="image" />
    <!-- Deformed shape -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <rect x="250" y="100" width="50" height="50" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="75" x2="200" y2="75" class="image" />
    <polygon points="200,75 190,65 190,85" class="image" />
    <!-- Labels -->
    <text x="50" y="180" class="content">Normal Shape</text>
    <text x="250" y="180" class="content">Deformed Shape</text>
  </g>
</svg>