<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">finally</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪnəli] adv. 最后，终于</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fin (结束) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个漫长的旅程，"结束(fin)"
    <tspan x="50" dy="25">的时刻终于(finally)到来，人们欢呼雀跃。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a long day, she finally got home.
  </text>
  <text x="50" y="310" class="content">
    经过漫长的一天，她终于到家了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Finish line -->
    <line x1="300" y1="80" x2="300" y2="120" class="image" />
    <line x1="290" y1="90" x2="310" y2="110" class="image" />
    <line x1="290" y1="110" x2="310" y2="90" class="image" />
    <!-- Celebration -->
    <circle cx="320" cy="100" r="10" class="image" />
    <line x1="320" y1="110" x2="320" y2="130" class="image" />
    <line x1="320" y1="130" x2="300" y2="150" class="image" />
    <line x1="320" y1="130" x2="340" y2="150" class="image" />
    <line x1="320" y1="120" x2="350" y2="110" class="image" />
  </g>
</svg>