<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">squabble</text>
  <text x="50" y="120" class="subtitle">[ˈskwɑːbl] v. 争吵，争论</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> squab (矮胖的) + ble (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个矮胖的人在激烈地"争吵(squabble)"，
    <tspan x="50" dy="25">他们的身体因为愤怒而颤抖，声音越来越大。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They often squabble over trivial matters.
  </text>
  <text x="50" y="310" class="content">
    他们经常为琐事争吵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two chubby figures -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Arms and legs -->
    <line x1="50" y1="130" x2="20" y2="160" class="image" />
    <line x1="50" y1="130" x2="80" y2="160" class="image" />
    <line x1="150" y1="130" x2="120" y2="160" class="image" />
    <line x1="150" y1="130" x2="180" y2="160" class="image" />
    <!-- Mouths -->
    <rect x="30" y="80" width="40" height="10" class="image" />
    <rect x="130" y="80" width="40" height="10" class="image" />
    <!-- Speech bubbles -->
    <path d="M 10 200 Q 50 180 100 200 T 150 200" class="image" />
    <path d="M 160 200 Q 200 180 250 200 T 300 200" class="image" />
  </g>
</svg>