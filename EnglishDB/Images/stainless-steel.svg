<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .steel { fill: #A9A9A9; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stainless-steel</text>
  <text x="50" y="120" class="subtitle">[ˈsteɪnlɪs stiːl] n. 不锈钢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stain (污点) + less (无) + steel (钢)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块钢板，"没有污点(stain-less)"，
    <tspan x="50" dy="25">它永远不会生锈，这就是不锈钢(stainless-steel)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kitchen utensils are made of stainless-steel.
  </text>
  <text x="50" y="310" class="content">
    厨房用具是由不锈钢制成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Steel plate -->
    <rect x="0" y="0" width="350" height="200" class="steel" />
    <!-- No stain symbol -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="125" y1="100" x2="225" y2="100" class="image" />
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
  </g>
</svg>