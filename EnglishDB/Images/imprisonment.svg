<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imprisonment</text>
  <text x="50" y="120" class="subtitle">[ɪmˈprɪzənmənt] n. 监禁，关押</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + prison (监狱) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"关进(im-prison)"
    <tspan x="50" dy="25">一个坚固的监狱(prison)，无法逃脱，这就是监禁(imprisonment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was sentenced to five years of imprisonment.
  </text>
  <text x="50" y="310" class="content">
    他被判处五年监禁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Prison cell -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Bars -->
    <line x1="70" y1="20" x2="70" y2="180" class="image" />
    <line x1="120" y1="20" x2="120" y2="180" class="image" />
    <line x1="170" y1="20" x2="170" y2="180" class="image" />
    <line x1="220" y1="20" x2="220" y2="180" class="image" />
    <line x1="270" y1="20" x2="270" y2="180" class="image" />
    <!-- Prisoner -->
    <circle cx="145" cy="100" r="15" class="image" />
    <line x1="145" y1="115" x2="145" y2="150" class="image" />
    <line x1="145" y1="150" x2="130" y2="180" class="image" />
    <line x1="145" y1="150" x2="160" y2="180" class="image" />
    <line x1="145" y1="130" x2="175" y2="120" class="image" />
  </g>
</svg>