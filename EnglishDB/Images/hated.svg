<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hated</text>
  <text x="50" y="120" class="subtitle">[ˈheɪtɪd] adj. 被憎恨的，讨厌的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hate (憎恨) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被一群愤怒的人包围，"憎恨(hate)"
    <tspan x="50" dy="25">的目光如利箭般射向他，他成了被憎恨的对象(hated)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The politician was hated by many for his policies.
  </text>
  <text x="50" y="310" class="content">
    这位政客因他的政策而被许多人憎恨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry faces -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Eyes -->
    <line x1="40" y1="40" x2="60" y2="40" class="image" />
    <line x1="140" y1="40" x2="160" y2="40" class="image" />
    <line x1="240" y1="40" x2="260" y2="40" class="image" />
    <!-- Mouths -->
    <path d="M35 60 Q50 70 65 60" class="image" />
    <path d="M135 60 Q150 70 165 60" class="image" />
    <path d="M235 60 Q250 70 265 60" class="image" />
    <!-- Target -->
    <circle cx="150" cy="150" r="30" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="120" y1="150" x2="180" y2="150" class="image" />
  </g>
</svg>