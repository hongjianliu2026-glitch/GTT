<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leaguer</text>
  <text x="50" y="120" class="subtitle">[ˈliːɡər] n. 同盟者，联盟成员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> league (联盟) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人手拉手围成一个圈，象征着他们是一个"联盟(league)"的成员，
    <tspan x="50" dy="25">这些人就是"同盟者(leaguer)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a loyal leaguer of the environmental protection group.
  </text>
  <text x="50" y="310" class="content">
    他是环境保护组织的忠实成员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle of people -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- People holding hands -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <!-- Heads -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="175" cy="100" r="10" class="image" />
  </g>
</svg>