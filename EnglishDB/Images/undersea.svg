<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undersea</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈsiː] adj. 海底的，海面下的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在...下面) + sea (海)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个潜水员在海底，"在海下面(under-sea)"
    <tspan x="50" dy="25">探索神秘的海底世界，那里充满了奇异的生物和宝藏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The undersea exploration team discovered a new species of fish.
  </text>
  <text x="50" y="310" class="content">
    海底探险队发现了一种新的鱼类。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea surface -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Undersea world -->
    <rect x="50" y="100" width="250" height="200" class="image" />
    <!-- Diver -->
    <circle cx="150" cy="250" r="15" class="image" />
    <line x1="150" y1="265" x2="150" y2="300" class="image" />
    <line x1="150" y1="300" x2="130" y2="330" class="image" />
    <line x1="150" y1="300" x2="170" y2="330" class="image" />
    <line x1="150" y1="280" x2="180" y2="270" class="image" />
    <!-- Fish -->
    <path d="M200,200 C210,190 220,210 210,220 Z" class="image" />
    <line x1="205" y1="205" x2="215" y2="215" class="image" />
    <line x1="205" y1="215" x2="215" y2="205" class="image" />
  </g>
</svg>