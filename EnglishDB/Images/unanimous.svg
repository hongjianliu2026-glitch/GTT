<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unanimous</text>
  <text x="50" y="120" class="subtitle">[juːˈnænɪməs] adj. 全体一致的，一致同意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (一个) + anim (心) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"一个心(un-anim)"
    <tspan x="50" dy="25">都同意某件事，这就是全体一致(unanimous)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The committee was unanimous in its decision.
  </text>
  <text x="50" y="310" class="content">
    委员会在决定上达成了一致。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Hearts -->
    <path d="M50 80 C50 100, 150 100, 150 80" class="image" />
    <path d="M150 80 C150 100, 250 100, 250 80" class="image" />
    <!-- Connecting lines -->
    <line x1="50" y1="80" x2="250" y2="80" class="image" />
    <!-- Unified heart -->
    <path d="M150 120 C150 140, 150 140, 150 120" class="image" />
    <text x="140" y="150" class="content" fill="#E74C3C">un-anim</text>
  </g>
</svg>