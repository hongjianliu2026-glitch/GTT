<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">emergent</text>
  <text x="50" y="120" class="subtitle">[ɪˈmɜːrdʒənt] adj. 新兴的，突然出现的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + merge (沉没)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个沉没的物体突然"浮出水面(e-merge)"，
    <tspan x="50" dy="25">这个物体就是"新兴的(emergent)"事物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The emergent technology has revolutionized the industry.
  </text>
  <text x="50" y="310" class="content">
    新兴技术已经彻底改变了这个行业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sunken object -->
    <rect x="150" y="100" width="50" height="50" class="image" />
    <!-- Emerging object -->
    <rect x="150" y="50" width="50" height="50" class="image" />
    <!-- Arrow -->
    <line x1="175" y1="100" x2="175" y2="50" class="image" />
    <polygon points="175,50 165,60 185,60" class="image" />
  </g>
</svg>