<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inflict</text>
  <text x="50" y="120" class="subtitle">[ɪnˈflɪkt] v. 使遭受（损伤、痛苦等），予以（打击）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + flict (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拳头"进入(in-)"并"打击(flict)"
    <tspan x="50" dy="25">一个目标，这就是"使遭受(inflict)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm inflicted severe damage on the village.
  </text>
  <text x="50" y="310" class="content">
    风暴给村庄造成了严重破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Target -->
    <circle cx="150" cy="100" r="50" class="image" />
    <!-- Fist -->
    <rect x="100" y="50" width="100" height="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="200" y1="100" x2="150" y2="100" class="image" />
    <!-- Impact -->
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
  </g>
</svg>