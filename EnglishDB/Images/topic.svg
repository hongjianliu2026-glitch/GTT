<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">topic</text>
  <text x="50" y="120" class="subtitle">[ˈtɒpɪk] n. 话题，主题</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> top (顶部) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者站在讲台上，"顶部(top)"
    <tspan x="50" dy="25">的主题(topic)吸引了所有人的注意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The topic of today's lecture is climate change.
  </text>
  <text x="50" y="310" class="content">
    今天讲座的主题是气候变化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lecturer -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="90" x2="240" y2="80" class="image" />
    <!-- Topic bubble -->
    <circle cx="200" cy="20" r="30" class="image" />
    <text x="185" y="25" class="content" fill="#FFFFFF">TOPIC</text>
  </g>
</svg>