<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">barrage</text>
  <text x="50" y="120" class="subtitle">[bəˈrɑːʒ] n. 弹幕，密集炮火；v. 以密集炮火攻击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> barr (障碍) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战场，"障碍(barr)"般的炮弹如雨点般落下，
    <tspan x="50" dy="25">形成一道密集的"弹幕(barrage)"，阻挡敌人的前进。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enemy launched a barrage of missiles.
  </text>
  <text x="50" y="310" class="content">
    敌人发射了一连串的导弹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Missiles -->
    <line x1="50" y1="20" x2="100" y2="180" class="image" />
    <line x1="120" y1="20" x2="170" y2="180" class="image" />
    <line x1="190" y1="20" x2="240" y2="180" class="image" />
    <line x1="260" y1="20" x2="310" y2="180" class="image" />
    <!-- Explosions -->
    <circle cx="100" cy="180" r="20" class="image" />
    <circle cx="170" cy="180" r="20" class="image" />
    <circle cx="240" cy="180" r="20" class="image" />
    <circle cx="310" cy="180" r="20" class="image" />
  </g>
</svg>