<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spasm</text>
  <text x="50" y="120" class="subtitle">[ˈspæzəm] n. 痉挛，抽搐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spasm- (抽搐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然"抽搐(spasm)"，
    <tspan x="50" dy="25">身体像被电击一样猛烈地抖动，这就是痉挛(spasm)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dancer suffered a spasm in her leg during the performance.
  </text>
  <text x="50" y="310" class="content">
    舞者在表演中腿部突然痉挛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Body outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Head -->
    <circle cx="175" cy="50" r="30" class="image" />
    <!-- Torso -->
    <line x1="175" y1="80" x2="175" y2="150" class="image" />
    <!-- Arms -->
    <line x1="175" y1="100" x2="120" y2="130" class="image" />
    <line x1="175" y1="100" x2="230" y2="130" class="image" />
    <!-- Legs -->
    <line x1="175" y1="150" x2="120" y2="200" class="image" />
    <line x1="175" y1="150" x2="230" y2="200" class="image" />
    <!-- Spasm effect -->
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="150" x2="160" y2="170" class="image" />
    <line x1="175" y1="150" x2="190" y2="170" class="image" />
  </g>
</svg>