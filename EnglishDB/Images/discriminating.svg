<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discriminating</text>
  <text x="50" y="120" class="subtitle">[dɪˈskrɪmɪˌneɪtɪŋ] adj. 有辨别力的，有识别力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + crimin (罪行) + -ate (动词后缀) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个侦探，"分开(dis-)"
    <tspan x="50" dy="25">罪行(crimin)"，通过细致的观察和分析，</tspan>
    <tspan x="50" dy="25">他能够"识别(ate)"出真相，</tspan>
    <tspan x="50" dy="25">这种能力就是"有辨别力的(discriminating)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> She has a discriminating taste in wine.
  </text>
  <text x="50" y="330" class="content">
    她对葡萄酒有很高的鉴赏力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Detective -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Magnifying glass -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="120" y1="100" x2="150" y2="100" class="image" />
    <!-- Crime scene -->
    <rect x="180" y="80" width="100" height="40" class="image" />
    <line x1="190" y1="90" x2="270" y2="90" class="image" />
    <line x1="190" y1="110" x2="270" y2="110" class="image" />
    <line x1="200" y1="130" x2="260" y2="130" class="image" />
  </g>
</svg>