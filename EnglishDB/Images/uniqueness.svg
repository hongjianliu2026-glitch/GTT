<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uniqueness</text>
  <text x="50" y="120" class="subtitle">[juˈniːknəs] n. 独特性，唯一性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (单一) + -que (形容词后缀) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宝石，"独一无二(uni-que)"
    <tspan x="50" dy="25">地闪耀着光芒，它的独特性(uniqueness)让人无法忽视。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The uniqueness of her artwork sets her apart from other artists.
  </text>
  <text x="50" y="310" class="content">
    她作品的独特性使她与其他艺术家区别开来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gemstone -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Shine -->
    <line x1="100" y1="50" x2="100" y2="30" class="image" stroke-width="3" stroke="#FFFFFF" />
    <line x1="100" y1="50" x2="120" y2="40" class="image" stroke-width="3" stroke="#FFFFFF" />
    <line x1="100" y1="50" x2="80" y2="40" class="image" stroke-width="3" stroke="#FFFFFF" />
  </g>
</svg>