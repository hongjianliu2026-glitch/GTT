<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">earmark</text>
  <text x="50" y="120" class="subtitle">[ˈɪrmɑːrk] n. 标记，特征；v. 标记，指定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ear- (耳朵) + mark (标记)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只羊的耳朵上被"标记(mark)"了一个独特的记号，
    <tspan x="50" dy="25">这个记号就是它的"特征(earmark)"，用来区分它和其他羊。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer earmarked the sheep with a red dot.
  </text>
  <text x="50" y="310" class="content">
    农夫用一个红点标记了这只羊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sheep -->
    <circle cx="50" cy="100" r="40" class="image" />
    <line x1="50" y1="140" x2="50" y2="200" class="image" />
    <line x1="50" y1="170" x2="20" y2="150" class="image" />
    <line x1="50" y1="170" x2="80" y2="150" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />
    <!-- Earmark -->
    <circle cx="50" cy="80" r="10" class="image" fill="#E74C3C" />
    <text x="45" y="85" class="content" fill="#FFFFFF">●</text>
  </g>
</svg>