<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lefty</text>
  <text x="50" y="120" class="subtitle">[ˈlɛfti] n. 左撇子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> left (左) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个左撇子(lefty)在用左手写字，
    <tspan x="50" dy="25">他的左手(left)就像一个魔术师的手，</tspan>
    <tspan x="50" dy="25">能够创造出不可思议的奇迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a lefty, so he writes with his left hand.
  </text>
  <text x="50" y="310" class="content">
    他是个左撇子，所以用左手写字。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Left hand -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="120" class="image" />
    <line x1="50" y1="150" x2="70" y2="120" class="image" />
    <!-- Pen -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="30" y2="280" class="image" />
    <line x1="50" y1="250" x2="70" y2="280" class="image" />
    <!-- Paper -->
    <rect x="0" y="280" width="100" height="50" class="image" />
    <!-- Writing -->
    <line x1="10" y1="300" x2="90" y2="300" class="image" />
    <line x1="10" y1="310" x2="90" y2="310" class="image" />
    <line x1="10" y1="320" x2="90" y2="320" class="image" />
  </g>
</svg>