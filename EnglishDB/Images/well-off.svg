<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">well-off</text>
  <text x="50" y="120" class="subtitle">[ˈwɛl ˈɒf] adj. 富裕的，境况好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> well (好) + off (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"好到可以离开(well-off)"工作，
    <tspan x="50" dy="25">因为他已经非常富裕，不再需要为生计奔波。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They are well-off enough to travel around the world.
  </text>
  <text x="50" y="310" class="content">
    他们非常富裕，足以环游世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Money bag -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Person -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="90" x2="230" y2="80" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <line x1="300" y1="20" x2="300" y2="0" class="image" />
    <line x1="330" y1="50" x2="350" y2="50" class="image" />
    <line x1="300" y1="80" x2="300" y2="100" class="image" />
    <line x1="270" y1="50" x2="250" y2="50" class="image" />
  </g>
</svg>