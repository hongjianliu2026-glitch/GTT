<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">telecom</text>
  <text x="50" y="120" class="subtitle">[ˈtelɪkɒm] n. 电信</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tele- (远) + com (通信)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天线塔，"远距离(tele-)"
    <tspan x="50" dy="25">传输着信息，这些信息通过"通信(com)"网络</tspan>
    <tspan x="50" dy="25">连接了整个世界，这就是电信(telecom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The telecom industry is rapidly evolving.
  </text>
  <text x="50" y="310" class="content">
    电信行业正在迅速发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Antenna tower -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="30" y1="20" x2="70" y2="20" class="image" />
    <line x1="20" y1="40" x2="80" y2="40" class="image" />
    <line x1="10" y1="60" x2="90" y2="60" class="image" />
    <line x1="0" y1="80" x2="100" y2="80" class="image" />
    <!-- Signal lines -->
    <line x1="50" y1="200" x2="50" y2="300" class="image" />
    <line x1="50" y1="300" x2="150" y2="400" class="image" />
    <line x1="50" y1="300" x2="350" y2="400" class="image" />
    <line x1="50" y1="300" x2="550" y2="400" class="image" />
    <!-- Globe -->
    <circle cx="500" cy="400" r="50" class="image" />
    <circle cx="500" cy="400" r="40" class="image" />
    <circle cx="500" cy="400" r="30" class="image" />
    <circle cx="500" cy="400" r="20" class="image" />
    <circle cx="500" cy="400" r="10" class="image" />
  </g>
</svg>