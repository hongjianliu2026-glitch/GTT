<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delirious</text>
  <text x="50" y="120" class="subtitle">[dɪˈlɪriəs] adj. 精神错乱的，极度兴奋的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + liri (床) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为极度兴奋或精神错乱，"离开(de-)"了正常的"床(liri)"，
    <tspan x="50" dy="25">四处乱跑，完全失去了理智。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd became delirious with joy when their team won.
  </text>
  <text x="50" y="310" class="content">
    当他们的队伍获胜时，人群变得极度兴奋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Person running away -->
    <circle cx="350" cy="100" r="20" class="image" />
    <line x1="350" y1="120" x2="350" y2="180" class="image" />
    <line x1="350" y1="180" x2="320" y2="220" class="image" />
    <line x1="350" y1="180" x2="380" y2="220" class="image" />
    <line x1="350" y1="150" x2="400" y2="140" class="image" />
    <!-- Exclamation marks -->
    <text x="340" y="80" class="highlight">!!!</text>
  </g>
</svg>