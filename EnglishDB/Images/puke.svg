<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">puke</text>
  <text x="50" y="120" class="subtitle">[pjuːk] v. 呕吐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "poken"，意为"呕吐"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在极度不适的情况下，"吐出(puke)"
    <tspan x="50" dy="25">胃里的东西，画面中他正对着一个桶呕吐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He felt so sick that he couldn't stop puking.
  </text>
  <text x="50" y="310" class="content">
    他感到非常难受，以至于不停地呕吐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bucket -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Person -->
    <circle cx="100" cy="200" r="30" class="image" />
    <line x1="100" y1="230" x2="100" y2="300" class="image" />
    <line x1="100" y1="250" x2="50" y2="280" class="image" />
    <line x1="100" y1="250" x2="150" y2="280" class="image" />
    <line x1="100" y1="300" x2="50" y2="350" class="image" />
    <line x1="100" y1="300" x2="150" y2="350" class="image" />
    <!-- Vomit -->
    <path d="M 100 230 Q 150 200 100 180 Q 50 200 100 230" class="image" />
  </g>
</svg>