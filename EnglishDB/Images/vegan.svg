<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vegan</text>
  <text x="50" y="120" class="subtitle">[ˈviːɡən] n. 素食主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> veg (植物) + an (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个素食主义者(vegan)，他只吃植物(veg)，不吃任何动物产品。
    <tspan x="50" dy="25">他每天都在花园里种植各种蔬菜，享受着纯植物的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She became a vegan after watching a documentary about animal rights.
  </text>
  <text x="50" y="310" class="content">
    她看完一部关于动物权利的纪录片后成为了一名素食主义者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Vegetables -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Tomato -->
    <rect x="100" y="80" width="30" height="40" class="image" /> <!-- Carrot -->
    <circle cx="150" cy="100" r="20" class="image" /> <!-- Lettuce -->
    <rect x="200" y="80" width="30" height="40" class="image" /> <!-- Broccoli -->
    <!-- Vegan -->
    <circle cx="250" cy="100" r="15" class="image" /> <!-- Head -->
    <line x1="250" y1="115" x2="250" y2="150" class="image" /> <!-- Body -->
    <line x1="250" y1="150" x2="230" y2="180" class="image" /> <!-- Left arm -->
    <line x1="250" y1="150" x2="270" y2="180" class="image" /> <!-- Right arm -->
    <line x1="250" y1="150" x2="250" y2="180" class="image" /> <!-- Legs -->
  </g>
</svg>