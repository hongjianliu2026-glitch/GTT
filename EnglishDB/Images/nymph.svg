<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nymph</text>
  <text x="50" y="120" class="subtitle">[nɪmf] n. 仙女，年轻女子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nymph (源自希腊语 nymphe, 意为“新娘”或“年轻女子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个美丽的仙女(nymph)在森林中翩翩起舞，
    <tspan x="50" dy="25">她的轻盈和优雅让人联想到年轻女子的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nymph in the forest enchanted all who saw her.
  </text>
  <text x="50" y="310" class="content">
    森林中的仙女让所有见到她的人都为之倾倒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Nymph -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="200" class="image" />
    <line x1="100" y1="160" x2="120" y2="200" class="image" />
    <line x1="100" y1="140" x2="150" y2="130" class="image" />
  </g>
</svg>