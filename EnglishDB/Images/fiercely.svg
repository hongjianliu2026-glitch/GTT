<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fiercely</text>
  <text x="50" y="120" class="subtitle">[ˈfɪrsli] adv. 猛烈地，激烈地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fierce (猛烈的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猛虎在丛林中"猛烈地(fierce)"
    <tspan x="50" dy="25">咆哮，声音震耳欲聋，这就是"fiercely"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm raged fiercely last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚的风暴猛烈地肆虐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tiger -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Tail -->
    <line x1="50" y1="180" x2="80" y2="200" class="image" /> <!-- Tail -->
    <!-- Roar -->
    <path d="M50,70 Q70,60 50,50 Q30,60 50,70" class="image" />
  </g>
</svg>