<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tax { fill: #F39C12; }
      .exempt { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tax-exempt</text>
  <text x="50" y="120" class="subtitle">[tæks ɪɡˈzempt] adj. 免税的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tax (税) + exempt (免除)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金币堆，上面有一个红色的"免税"标签，
    <tspan x="50" dy="25">表示这些金币不需要缴税，完全属于你。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The organization was granted tax-exempt status.
  </text>
  <text x="50" y="310" class="content">
    该组织获得了免税地位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coin stack -->
    <circle cx="100" cy="100" r="50" class="image tax" />
    <circle cx="100" cy="150" r="50" class="image tax" />
    <circle cx="100" cy="200" r="50" class="image tax" />
    <!-- Exempt label -->
    <rect x="50" y="250" width="100" height="30" class="image exempt" />
    <text x="75" y="270" class="content exempt">免税</text>
  </g>
</svg>