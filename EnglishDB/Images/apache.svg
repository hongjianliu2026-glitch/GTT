<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Apache</text>
  <text x="50" y="120" class="subtitle">[əˈpætʃi] n. 阿帕奇（一种开源的Web服务器软件）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自美洲原住民阿帕奇部落，象征力量和自由。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强大的战士，手持长矛，站在山巅，
    <tspan x="50" dy="25">象征着Apache服务器在网络世界中的主导地位和自由精神。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The website is hosted on an Apache server.
  </text>
  <text x="50" y="310" class="content">
    该网站托管在一个Apache服务器上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain -->
    <polygon points="0,200 200,0 400,200" class="image" />
    <!-- Warrior -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Spear -->
    <line x1="200" y1="120" x2="160" y2="80" class="image" />
  </g>
</svg>