<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pump</text>
  <text x="50" y="120" class="subtitle">[pʌmp] n. 泵，抽水机；v. 用泵抽水，打气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "pompa" (盛大的游行)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的游行队伍，"泵(pump)"
    <tspan x="50" dy="25">在队伍中不停地抽水，维持着游行的活力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a pump to fill the swimming pool.
  </text>
  <text x="50" y="310" class="content">
    他用泵给游泳池注水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pump -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="20" y="20" width="60" height="110" class="image" />
    <line x1="50" y1="20" x2="50" y2="0" class="image" />
    <line x1="50" y1="130" x2="50" y2="150" class="image" />
    <!-- Water flow -->
    <line x1="50" y1="0" x2="50" y2="-50" class="image" />
    <line x1="50" y1="-50" x2="50" y2="-100" class="image" />
    <line x1="50" y1="-100" x2="50" y2="-150" class="image" />
  </g>
</svg>