<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">global</text>
  <text x="50" y="120" class="subtitle">[ˈɡloʊbl] adj. 全球的，全世界的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glob (球) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，"球(glob)"
    <tspan x="50" dy="25">覆盖了整个世界，这就是全球(global)的概念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a global presence in over 50 countries.
  </text>
  <text x="50" y="310" class="content">
    该公司在全球50多个国家都有业务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Continents -->
    <path d="M175,20 A80,80 0 0,1 255,100 L175,100 Z" class="image" />
    <path d="M175,20 A80,80 0 0,0 95,100 L175,100 Z" class="image" />
    <path d="M175,180 A80,80 0 0,1 255,100 L175,100 Z" class="image" />
    <path d="M175,180 A80,80 0 0,0 95,100 L175,100 Z" class="image" />
    <!-- Earth's axis -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
  </g>
</svg>