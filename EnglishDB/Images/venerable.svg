<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #641E16; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">venerable</text>
  <text x="50" y="120" class="subtitle">[ˈvɛnərəbəl] adj. 值得尊敬的，庄严的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ven- (来) + er (走) + able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位长者缓缓走来，他的每一步都充满了智慧和尊严，
    <tspan x="50" dy="25">他的存在让人心生敬意，这就是"值得尊敬的(venerable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The venerable professor shared his wisdom with the students.
  </text>
  <text x="50" y="310" class="content">
    那位值得尊敬的教授与学生们分享了他的智慧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elderly person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="30" y2="250" class="image" />
    <line x1="50" y1="200" x2="70" y2="250" class="image" />
    <!-- Walking stick -->
    <line x1="50" y1="200" x2="50" y2="280" class="image" />
    <line x1="50" y1="280" x2="40" y2="300" class="image" />
    <!-- Halo -->
    <circle cx="50" cy="70" r="20" class="image" />
  </g>
</svg>