<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unthinkable</text>
  <text x="50" y="120" class="subtitle">[ʌnˈθɪŋkəbl] adj. 不可思议的，难以想象的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + think (思考) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的问号悬浮在空中，"无法思考(un-think-able)"
    <tspan x="50" dy="25">的事情就像这个问号一样，让人难以理解。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The idea of winning the lottery without buying a ticket is unthinkable.
  </text>
  <text x="50" y="310" class="content">
    不买彩票就中奖的想法是不可思议的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large question mark -->
    <path d="M50 50 Q100 100 150 50 T250 50" class="image" />
    <line x1="250" y1="50" x2="250" y2="100" class="image" />
    <!-- Thought bubble -->
    <circle cx="150" cy="150" r="50" class="image" />
    <circle cx="180" cy="120" r="30" class="image" />
    <circle cx="120" cy="120" r="30" class="image" />
    <circle cx="150" cy="180" r="30" class="image" />
  </g>
</svg>