<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disagreement</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈɡriːmənt] n. 分歧，不一致</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + agree (同意) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在争论，"不同意(dis-agree)"
    <tspan x="50" dy="25">对方的观点，这种分歧(disagreement)导致了激烈的讨论。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There was a disagreement about the best route to take.
  </text>
  <text x="50" y="310" class="content">
    关于最佳路线，他们之间存在分歧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people arguing -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <!-- Speech bubbles -->
    <path d="M50,160 Q70,180 100,160" class="image" />
    <path d="M150,160 Q130,180 100,160" class="image" />
  </g>
</svg>