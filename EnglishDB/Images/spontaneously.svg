<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spontaneously</text>
  <text x="50" y="120" class="subtitle">[spɒnˈteɪniəsli] adv. 自发地，自然地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spon- (自发) + tane (产生) + -ous (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球突然"自发地(spon-tane-ously)"
    <tspan x="50" dy="25">从盒子里飞出来，没有任何外力推动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd reacted spontaneously to the comedian's joke.
  </text>
  <text x="50" y="310" class="content">
    人群对喜剧演员的笑话自发地做出了反应。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Balloon -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <polygon points="90,250 100,240 110,250" class="image" />
  </g>
</svg>