<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">innumerable</text>
  <text x="50" y="120" class="subtitle">[ɪˈnjuːmərəbl] adj. 无数的，数不清的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + numer (数) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的星空，"无法数清(in-numer-able)"
    <tspan x="50" dy="25">的星星在夜空中闪烁，这就是无数的(innumerable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beach was covered with innumerable seashells.
  </text>
  <text x="50" y="310" class="content">
    海滩上覆盖着数不清的贝壳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#1E3A8A" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="3" class="image" fill="#FFFFFF" />
    <circle cx="100" cy="70" r="3" class="image" fill="#FFFFFF" />
    <circle cx="150" cy="30" r="3" class="image" fill="#FFFFFF" />
    <circle cx="200" cy="90" r="3" class="image" fill="#FFFFFF" />
    <circle cx="250" cy="60" r="3" class="image" fill="#FFFFFF" />
    <circle cx="300" cy="40" r="3" class="image" fill="#FFFFFF" />
    <circle cx="350" cy="80" r="3" class="image" fill="#FFFFFF" />
    <circle cx="400" cy="20" r="3" class="image" fill="#FFFFFF" />
    <circle cx="450" cy="100" r="3" class="image" fill="#FFFFFF" />
    <circle cx="500" cy="50" r="3" class="image" fill="#FFFFFF" />
    <circle cx="550" cy="70" r="3" class="image" fill="#FFFFFF" />
    <circle cx="600" cy="30" r="3" class="image" fill="#FFFFFF" />
    <circle cx="650" cy="90" r="3" class="image" fill="#FFFFFF" />
    <circle cx="700" cy="60" r="3" class="image" fill="#FFFFFF" />
    <circle cx="750" cy="40" r="3" class="image" fill="#FFFFFF" />
    <circle cx="800" cy="80" r="3" class="image" fill="#FFFFFF" />
  </g>
</svg>