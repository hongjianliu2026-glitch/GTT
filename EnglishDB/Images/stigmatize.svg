<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stigmatize</text>
  <text x="50" y="120" class="subtitle">[ˈstɪɡmətaɪz] v. 污名化，打上烙印</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stigma (烙印) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"打上烙印(stigma)"，
    <tspan x="50" dy="25">这个烙印象征着污名化(stigmatize)，</tspan>
    <tspan x="50" dy="25">让人们对他产生偏见。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The media often stigmatizes mental illness.
  </text>
  <text x="50" y="310" class="content">
    媒体经常污名化精神疾病。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Stigma -->
    <circle cx="50" cy="50" r="10" class="image" />
    <line x1="50" y1="50" x2="50" y2="80" class="image" />
    <line x1="50" y1="65" x2="30" y2="65" class="image" />
    <line x1="50" y1="65" x2="70" y2="65" class="image" />
  </g>
</svg>