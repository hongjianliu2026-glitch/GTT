<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hustler</text>
  <text x="50" y="120" class="subtitle">[ˈhʌslər] n. 骗子，忙碌的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hustl (匆忙) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个忙碌的人在街头，"匆忙地(hustl)"
    <tspan x="50" dy="25">四处奔波，试图快速完成各种任务，</tspan>
    <tspan x="50" dy="25">这个人就是个hustler。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He's a hustler, always looking for the next deal.
  </text>
  <text x="50" y="310" class="content">
    他是个忙碌的人，总是在寻找下一个交易。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hustler -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Running motion -->
    <line x1="50" y1="150" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="120" y2="130" class="image" />
    <line x1="120" y1="130" x2="140" y2="150" class="image" />
    <line x1="140" y1="150" x2="160" y2="130" class="image" />
    <line x1="160" y1="130" x2="180" y2="150" class="image" />
  </g>
</svg>