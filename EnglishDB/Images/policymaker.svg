<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">policymaker</text>
  <text x="50" y="120" class="subtitle">[ˈpɒləsiˌmeɪkə(r)] n. 政策制定者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> policy (政策) + maker (制造者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个政策制定者站在讲台上，手里拿着一张巨大的纸，上面写满了各种政策。
    <tspan x="50" dy="25">他正在向人们解释这些政策，就像一个"政策制造者(policy-maker)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The policymaker proposed a new tax reform.
  </text>
  <text x="50" y="310" class="content">
    这位政策制定者提出了一项新的税收改革。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Podium -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Policymaker -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="200" class="image" />
    <line x1="175" y1="180" x2="195" y2="200" class="image" />
    <line x1="175" y1="140" x2="140" y2="130" class="image" />
    <line x1="175" y1="140" x2="210" y2="130" class="image" />
    <!-- Policy paper -->
    <rect x="100" y="20" width="150" height="160" class="image" />
    <line x1="110" y1="50" x2="240" y2="50" class="image" />
    <line x1="110" y1="80" x2="240" y2="80" class="image" />
    <line x1="110" y1="110" x2="240" y2="110" class="image" />
    <line x1="110" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>