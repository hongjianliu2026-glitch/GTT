<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undisputed</text>
  <text x="50" y="120" class="subtitle">[ˌʌndɪˈspjuːtɪd] adj. 无可争议的，无异议的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + dis- (分开) + put (思考) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冠军站在领奖台上，"没有任何人分开(dis-)思考(put)"
    <tspan x="50" dy="25">质疑他的胜利，他就是无可争议的(undisputed)冠军。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is the undisputed king of the chess world.
  </text>
  <text x="50" y="310" class="content">
    他是国际象棋界无可争议的王者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Champion on podium -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="150" y="20" width="50" height="160" class="image" />
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Crown -->
    <polyline points="160,80 175,50 190,80" class="image" />
    <line x1="160" y1="80" x2="190" y2="80" class="image" />
  </g>
</svg>