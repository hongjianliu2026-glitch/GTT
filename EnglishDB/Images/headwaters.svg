<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">headwaters</text>
  <text x="50" y="120" class="subtitle">[ˈhɛdˌwɔtərz] n. 河源，源头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> head (头) + water (水) + s (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流的源头，就像一个巨大的"水头(head-water)"，
    <tspan x="50" dy="25">从这里开始，水流逐渐汇聚成一条大河。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The headwaters of the Amazon River are in the Andes.
  </text>
  <text x="50" y="310" class="content">
    亚马逊河的源头在安第斯山脉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Water source -->
    <circle cx="150" cy="100" r="20" class="image" fill="#1ABC9C" />
    <!-- Stream -->
    <line x1="150" y1="120" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="250" y2="300" class="image" />
    <line x1="250" y1="300" x2="350" y2="300" class="image" />
    <line x1="350" y1="300" x2="350" y2="400" class="image" />
    <!-- River -->
    <line x1="350" y1="400" x2="450" y2="400" class="image" />
    <line x1="450" y1="400" x2="450" y2="500" class="image" />
    <line x1="450" y1="500" x2="550" y2="500" class="image" />
    <line x1="550" y1="500" x2="550" y2="600" class="image" />
  </g>
</svg>