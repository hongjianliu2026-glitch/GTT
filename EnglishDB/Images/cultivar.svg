<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cultivar</text>
  <text x="50" y="120" class="subtitle">[ˈkʌltɪvɑːr] n. 栽培品种</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> culti- (耕作) + var (变种)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农民在田地里，"耕作(culti-)"
    <tspan x="50" dy="25">出各种不同的"变种(var)"植物，这些植物就是栽培品种(cultivar)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This cultivar of apple is known for its sweet taste.
  </text>
  <text x="50" y="310" class="content">
    这种苹果栽培品种以其甜味著称。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Farmer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Plants -->
    <line x1="70" y1="180" x2="70" y2="140" class="image" />
    <line x1="70" y1="140" x2="60" y2="120" class="image" />
    <line x1="70" y1="140" x2="80" y2="120" class="image" />
    <line x1="120" y1="180" x2="120" y2="140" class="image" />
    <line x1="120" y1="140" x2="110" y2="120" class="image" />
    <line x1="120" y1="140" x2="130" y2="120" class="image" />
    <line x1="170" y1="180" x2="170" y2="140" class="image" />
    <line x1="170" y1="140" x2="160" y2="120" class="image" />
    <line x1="170" y1="140" x2="180" y2="120" class="image" />
  </g>
</svg>