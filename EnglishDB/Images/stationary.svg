<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stationary</text>
  <text x="50" y="120" class="subtitle">[ˈsteɪʃəˌnɛri] adj. 静止的，固定的；n. 文具</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stat (站立) + -ion (名词后缀) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头雕像，"站立不动(stat-ion-ary)"
    <tspan x="50" dy="25">在广场上，它代表着静止和稳定。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car remained stationary at the traffic light.
  </text>
  <text x="50" y="310" class="content">
    汽车在红绿灯前保持静止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stationary statue -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="125" y2="250" class="image" />
    <line x1="175" y1="200" x2="225" y2="250" class="image" />
    <line x1="175" y1="170" x2="100" y2="160" class="image" />
    <line x1="175" y1="170" x2="250" y2="160" class="image" />
  </g>
</svg>