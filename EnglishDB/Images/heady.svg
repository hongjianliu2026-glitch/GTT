<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heady</text>
  <text x="50" y="120" class="subtitle">[ˈhɛdi] adj. 令人陶醉的，强烈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> head (头) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人喝了一杯非常浓烈的酒，"头(head)"
    <tspan x="50" dy="25">晕晕的，感觉整个世界都在旋转，这就是heady的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heady scent of the flowers filled the room.
  </text>
  <text x="50" y="310" class="content">
    房间里充满了令人陶醉的花香。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Dizzy lines -->
    <line x1="100" y1="50" x2="150" y2="0" class="image" />
    <line x1="150" y1="50" x2="100" y2="0" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <line x1="150" y1="150" x2="100" y2="200" class="image" />
    <!-- Wine glass -->
    <rect x="200" y="50" width="50" height="100" class="image" />
    <line x1="200" y1="50" x2="250" y2="50" class="image" />
    <line x1="200" y1="150" x2="250" y2="150" class="image" />
    <line x1="225" y1="50" x2="225" y2="0" class="image" />
  </g>
</svg>