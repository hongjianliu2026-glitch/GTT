<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transitory</text>
  <text x="50" y="120" class="subtitle">[ˈtrænsətɔːri] adj. 短暂的，瞬息的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + it (走) + -ory (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶在花丛中"跨越(trans-)"，"走(it)"过短暂的瞬间，
    <tspan x="50" dy="25">它的美丽是如此的"瞬息(transitory)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The joy of the moment was transitory, soon replaced by sorrow.
  </text>
  <text x="50" y="310" class="content">
    那一刻的喜悦是短暂的，很快就被悲伤所取代。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butterfly -->
    <path d="M50 50 C 70 20, 130 20, 150 50" class="image" />
    <path d="M50 50 C 70 80, 130 80, 150 50" class="image" />
    <!-- Flower -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="100" y1="135" x2="80" y2="130" class="image" />
    <line x1="100" y1="135" x2="120" y2="130" class="image" />
    <!-- Sun -->
    <circle cx="200" cy="50" r="30" class="image" />
    <!-- Clouds -->
    <ellipse cx="250" cy="70" rx="40" ry="20" class="image" />
    <ellipse cx="300" cy="60" rx="30" ry="15" class="image" />
  </g>
</svg>