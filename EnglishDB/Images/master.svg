<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">master</text>
  <text x="50" y="120" class="subtitle">[ˈmæstər] n. 大师，主人；v. 精通，掌握</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mast (船的桅杆) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个水手站在船的桅杆(mast)上，
    <tspan x="50" dy="25">他不仅掌控着船的方向，还精通(master)了航海的所有技能。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a master of the violin.
  </text>
  <text x="50" y="310" class="content">
    他是小提琴大师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship mast -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <!-- Sailor -->
    <circle cx="50" cy="20" r="15" class="image" />
    <line x1="50" y1="35" x2="50" y2="70" class="image" />
    <line x1="50" y1="70" x2="30" y2="100" class="image" />
    <line x1="50" y1="70" x2="70" y2="100" class="image" />
    <line x1="50" y1="50" x2="80" y2="40" class="image" />
    <!-- Ship -->
    <rect x="0" y="200" width="100" height="20" class="image" />
  </g>
</svg>