<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">post-traumatic</text>
  <text x="50" y="120" class="subtitle">[ˌpoʊst trɔˈmætɪk] adj. 创伤后的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> post- (在...之后) + traumatic (创伤的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人经历了一场可怕的"创伤(traumatic)"，
    <tspan x="50" dy="25">之后(post-)，他的心灵留下了深深的伤痕，这就是"创伤后的(post-traumatic)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffers from post-traumatic stress disorder after the accident.
  </text>
  <text x="50" y="310" class="content">
    事故后，他患上了创伤后应激障碍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trauma symbol -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Post-trauma symbol -->
    <rect x="200" y="50" width="100" height="100" class="image" />
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <!-- Person with trauma -->
    <circle cx="100" cy="250" r="20" class="image" />
    <line x1="100" y1="270" x2="100" y2="320" class="image" />
    <line x1="100" y1="320" x2="80" y2="350" class="image" />
    <line x1="100" y1="320" x2="120" y2="350" class="image" />
    <line x1="100" y1="290" x2="140" y2="280" class="image" />
    <!-- Person after trauma -->
    <circle cx="250" cy="250" r="20" class="image" />
    <line x1="250" y1="270" x2="250" y2="320" class="image" />
    <line x1="250" y1="320" x2="230" y2="350" class="image" />
    <line x1="250" y1="320" x2="270" y2="350" class="image" />
    <line x1="250" y1="290" x2="290" y2="280" class="image" />
    <line x1="250" y1="290" x2="210" y2="280" class="image" />
  </g>
</svg>