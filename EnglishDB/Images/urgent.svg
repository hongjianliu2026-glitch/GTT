<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">urgent</text>
  <text x="50" y="120" class="subtitle">[ˈɜːrdʒənt] adj. 紧急的，急迫的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ur- (原始) + gent (产生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始人(ur-)在荒野中，突然发现火种(gent)即将熄灭，
    <tspan x="50" dy="25">他必须立即采取行动，这种急迫感就是urgent。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor said the patient's condition was urgent.
  </text>
  <text x="50" y="310" class="content">
    医生说病人的情况很紧急。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Primitive man -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Fire -->
    <path d="M120,100 C130,80 150,80 160,100 S180,120 170,140" class="image" />
    <line x1="140" y1="140" x2="140" y2="160" class="image" />
    <line x1="130" y1="150" x2="150" y2="150" class="image" />
    <!-- Urgent action -->
    <line x1="50" y1="160" x2="140" y2="120" class="image" />
    <line x1="140" y1="120" x2="160" y2="100" class="image" />
  </g>
</svg>