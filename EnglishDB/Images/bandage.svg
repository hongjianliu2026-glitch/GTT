<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bandage</text>
  <text x="50" y="120" class="subtitle">[ˈbændɪdʒ] n. 绷带；v. 用绷带包扎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> band (捆绑) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个受伤的手臂被"捆绑(band)"上一条绷带(bandage)，
    <tspan x="50" dy="25">绷带紧紧地包裹着伤口，防止进一步的伤害。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nurse quickly bandaged the wound.
  </text>
  <text x="50" y="310" class="content">
    护士迅速地用绷带包扎了伤口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arm -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <!-- Bandage -->
    <rect x="100" y="70" width="150" height="30" class="image" />
    <rect x="100" y="110" width="150" height="30" class="image" />
    <rect x="100" y="150" width="150" height="30" class="image" />
  </g>
</svg>