<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">predetermined</text>
  <text x="50" y="120" class="subtitle">[ˌpriːdɪˈtɜːrmɪnd] adj. 预先确定的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + de- (向下) + term (界限) + ine (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个命运之神在时间线的前端，"提前划下(pre-de-term-ined)"
    <tspan x="50" dy="25">每个人的命运界限，这些界限就构成了预先确定的命运(predetermined)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outcome of the game was predetermined by the referee's decision.
  </text>
  <text x="50" y="310" class="content">
    比赛的结果被裁判的决定预先确定了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Time line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Fate boundary -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <!-- Fate boundary label -->
    <text x="105" y="220" class="content">Fate Boundary</text>
