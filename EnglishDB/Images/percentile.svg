<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">percentile</text>
  <text x="50" y="120" class="subtitle">[pərˈsentɪl] n. 百分位数</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (每) + cent (百) + -ile (表示位置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的百分比图表，"每百分之一(per-cent)"
    <tspan x="50" dy="25">的位置都被精确标记，这些标记就是百分位数(percentile)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The 90th percentile of test scores indicates that 90% of the scores are below this value.
  </text>
  <text x="50" y="310" class="content">
    测试成绩的第90百分位数表示90%的成绩低于这个值。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Percentage bar -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Markers -->
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <line x1="100" y1="0" x2="100" y2="50" class="image" />
    <line x1="150" y1="0" x2="150" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <line x1="250" y1="0" x2="250" y2="50" class="image" />
    <line x1="300" y1="0" x2="300" y2="50" class="image" />
    <!-- Labels -->
    <text x="50" y="70" class="content">10%</text>
    <text x="100" y="70" class="content">20%</text>
    <text x="150" y="70" class="content">30%</text>
    <text x="200" y="70" class="content">40%</text>
    <text x="250" y="70" class="content">50%</text>
    <text x="300" y="70" class="content">60%</text>
  </g>
</svg>