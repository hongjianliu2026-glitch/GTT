<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quartet</text>
  <text x="50" y="120" class="subtitle">[kwɔːrˈtɛt] n. 四重奏，四人一组</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quart (四) + et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐厅里，"四个人(quart-et)"
    <tspan x="50" dy="25">组成一个小团队，一起演奏美妙的四重奏(quartet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The quartet performed a beautiful piece of music.
  </text>
  <text x="50" y="310" class="content">
    四重奏演奏了一首美妙的乐曲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Music stand -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Musicians -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="190" cy="100" r="15" class="image" />
    <circle cx="260" cy="100" r="15" class="image" />
    <!-- Instruments -->
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="190" y1="115" x2="190" y2="150" class="image" />
    <line x1="260" y1="115" x2="260" y2="150" class="image" />
    <!-- Music notes -->
    <path d="M70 50 Q80 30 90 50 T110 50" class="image" />
    <path d="M140 50 Q150 30 160 50 T180 50" class="image" />
    <path d="M210 50 Q220 30 230 50 T250 50" class="image" />
    <path d="M280 50 Q290 30 300 50 T320 50" class="image" />
  </g>
</svg>