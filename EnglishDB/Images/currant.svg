<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
      .fruit { fill: #884EA0; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">currant</text>
  <text x="50" y="120" class="subtitle">[ˈkɜːrənt] n. 红醋栗，无核小葡萄干</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> curr (跑) + ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗红醋栗在果园里"奔跑(curr-ant)"，
    <tspan x="50" dy="25">它的小巧身形让人忍不住想抓住它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added currants to her homemade muffins.
  </text>
  <text x="50" y="310" class="content">
    她在自制的松饼中加入了无核小葡萄干。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree branch -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Currants -->
    <circle cx="50" cy="20" r="15" class="fruit" />
    <circle cx="100" cy="20" r="15" class="fruit" />
    <circle cx="150" cy="20" r="15" class="fruit" />
    <circle cx="200" cy="20" r="15" class="fruit" />
    <circle cx="250" cy="20" r="15" class="fruit" />
    <circle cx="300" cy="20" r="15" class="fruit" />
    <!-- Falling currant -->
    <circle cx="100" cy="100" r="15" class="fruit" />
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
  </g>
</svg>