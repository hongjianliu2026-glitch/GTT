<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grit</text>
  <text x="50" y="120" class="subtitle">[ɡrɪt] n. 沙砾，勇气；v. 研磨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grit (沙砾)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在沙漠中，脚下踩着"沙砾(grit)"，
    <tspan x="50" dy="25">他不仅没有退缩，反而展现出无比的勇气和决心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She showed great grit in overcoming the challenges.
  </text>
  <text x="50" y="310" class="content">
    她在克服挑战时展现了极大的勇气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert sand -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sand particles -->
    <circle cx="50" cy="100" r="5" class="image" />
    <circle cx="70" cy="120" r="5" class="image" />
    <circle cx="90" cy="140" r="5" class="image" />
    <circle cx="110" cy="160" r="5" class="image" />
    <circle cx="130" cy="180" r="5" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>