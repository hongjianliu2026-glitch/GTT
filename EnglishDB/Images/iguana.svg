<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">iguana</text>
  <text x="50" y="120" class="subtitle">[ɪˈɡwɑːnə] n. 鬣蜥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> iguana源自西班牙语，原指一种南美洲的蜥蜴。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的鬣蜥在热带雨林中悠闲地爬行，
    <tspan x="50" dy="25">它的绿色皮肤与周围的环境完美融合，仿佛是大自然的守护者。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The iguana basked in the sun on the warm rock.
  </text>
  <text x="50" y="310" class="content">
    鬣蜥在温暖的岩石上晒太阳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Iguana body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Head -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <!-- Tail -->
    <line x1="300" y1="100" x2="450" y2="100" class="image" />
    <line x1="450" y1="100" x2="420" y2="150" class="image" />
    <line x1="450" y1="100" x2="420" y2="50" class="image" />
    <!-- Legs -->
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="250" y1="180" x2="250" y2="250" class="image" />
  </g>
</svg>