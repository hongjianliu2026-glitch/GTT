<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">computational</text>
  <text x="50" y="120" class="subtitle">[ˌkɒmpjʊˈteɪʃənl] adj. 计算的，计算机的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> compute (计算) + -ational (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的计算器，上面布满了各种数字和符号，
    <tspan x="50" dy="25">这些数字和符号正在被快速处理，这就是"计算的(computational)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project requires advanced computational skills.
  </text>
  <text x="50" y="310" class="content">
    这个项目需要高级的计算技能。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calculator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Display screen -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Buttons -->
    <circle cx="80" cy="120" r="20" class="image" />
    <circle cx="130" cy="120" r="20" class="image" />
    <circle cx="180" cy="120" r="20" class="image" />
    <circle cx="230" cy="120" r="20" class="image" />
    <circle cx="80" cy="170" r="20" class="image" />
    <circle cx="130" cy="170" r="20" class="image" />
    <circle cx="180" cy="170" r="20" class="image" />
    <circle cx="230" cy="170" r="20" class="image" />
    <!-- Equals sign -->
    <line x1="155" y1="220" x2="205" y2="220" class="image" />
    <line x1="155" y1="240" x2="205" y2="240" class="image" />
  </g>
</svg>