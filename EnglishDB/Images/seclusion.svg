<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seclusion</text>
  <text x="50" y="120" class="subtitle">[sɪˈkluːʒn] n. 隔离，隐居</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + clus (关闭) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把自己"关在(clus)"一个"分开(se-)"的小屋里，
    <tspan x="50" dy="25">远离喧嚣，享受隐居(seclusion)的宁静。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sought seclusion in the mountains to write her novel.
  </text>
  <text x="50" y="310" class="content">
    她到山里寻求隐居，以便写她的小说。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Small house -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <!-- Door -->
    <rect x="80" y="110" width="40" height="40" class="image" />
    <!-- Window -->
    <rect x="140" y="20" width="40" height="40" class="image" />
    <!-- Person -->
    <circle cx="100" cy="75" r="15" class="image" />
    <line x1="100" y1="90" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="140" class="image" />
    <line x1="100" y1="120" x2="120" y2="140" class="image" />
    <line x1="100" y1="100" x2="130" y2="90" class="image" />
  </g>
</svg>