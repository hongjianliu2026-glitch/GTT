<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loin</text>
  <text x="50" y="120" class="subtitle">[lɔɪn] n. 腰部，腰肉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loin (来自古英语 lēoht, 意为“光，亮”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"光亮(loin)"
    <tspan x="50" dy="25">照亮了他的腰部(loin)，那里是他力量的源泉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The butcher cut the loin of pork into slices.
  </text>
  <text x="50" y="310" class="content">
    屠夫把猪腰肉切成片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="250" class="image" />
    <line x1="175" y1="200" x2="200" y2="250" class="image" />
    <line x1="175" y1="170" x2="125" y2="160" class="image" />
    <line x1="175" y1="170" x2="225" y2="160" class="image" />
    <!-- Light -->
    <line x1="175" y1="50" x2="175" y2="0" class="image" />
    <line x1="150" y1="50" x2="150" y2="0" class="image" />
    <line x1="200" y1="50" x2="200" y2="0" class="image" />
  </g>
</svg>