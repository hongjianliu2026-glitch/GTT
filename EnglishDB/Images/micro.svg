<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">micro</text>
  <text x="50" y="120" class="subtitle">[ˈmaɪkroʊ] adj. 微小的，微观的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> micro- (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的放大镜下，"微小(micro)"
    <tspan x="50" dy="25">的物体被放大到肉眼可见，仿佛进入了一个微观世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scientist used a microscope to observe the micro particles.
  </text>
  <text x="50" y="310" class="content">
    科学家使用显微镜观察微小颗粒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <!-- Small object -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="200" y2="130" class="image" />
    <line x1="200" y1="120" x2="190" y2="115" class="image" />
    <line x1="200" y1="120" x2="210" y2="115" class="image" />
  </g>
</svg>