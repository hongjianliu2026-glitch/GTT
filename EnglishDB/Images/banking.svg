<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">banking</text>
  <text x="50" y="120" class="subtitle">[ˈbæŋkɪŋ] n. 银行业务</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bank (银行) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的银行大楼，"银行(bank)"
    <tspan x="50" dy="25">正在进行(ing)各种业务，如存款、贷款等。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He has extensive experience in banking.
  </text>
  <text x="50" y="310" class="content">
    他在银行业务方面有丰富的经验。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bank building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Windows -->
    <rect x="70" y="40" width="30" height="30" class="image" />
    <rect x="120" y="40" width="30" height="30" class="image" />
    <rect x="170" y="40" width="30" height="30" class="image" />
    <rect x="220" y="40" width="30" height="30" class="image" />
    <rect x="70" y="90" width="30" height="30" class="image" />
    <rect x="120" y="90" width="30" height="30" class="image" />
    <rect x="170" y="90" width="30" height="30" class="image" />
    <rect x="220" y="90" width="30" height="30" class="image" />
    <!-- Door -->
    <rect x="140" y="140" width="70" height="40" class="image" />
    <!-- Money symbol -->
    <text x="250" y="100" font-size="48" fill="#FFD700">$</text>
  </g>
</svg>