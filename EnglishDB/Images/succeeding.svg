<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">succeeding</text>
  <text x="50" y="120" class="subtitle">[səkˈsiːdɪŋ] adj. 随后的，继承的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> suc- (在下面) + -ceed (走) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在楼梯上，"在下面走(suc-ceed)"，
    <tspan x="50" dy="25">每一步都紧随其后，这就是随后的(succeeding)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The succeeding chapters are more detailed.
  </text>
  <text x="50" y="310" class="content">
    随后的章节更加详细。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Staircase -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="250" y2="180" class="image" />
    <line x1="50" y1="140" x2="210" y2="140" class="image" />
    <line x1="50" y1="100" x2="170" y2="100" class="image" />
    <line x1="50" y1="60" x2="130" y2="60" class="image" />
    <line x1="50" y1="20" x2="90" y2="20" class="image" />
    <!-- Person on staircase -->
    <circle cx="70" cy="160" r="15" class="image" />
    <line x1="70" y1="175" x2="70" y2="210" class="image" />
    <line x1="70" y1="210" x2="50" y2="240" class="image" />
    <line x1="70" y1="210" x2="90" y2="240" class="image" />
    <line x1="70" y1="190" x2="110" y2="180" class="image" />
  </g>
</svg>