<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">garb</text>
  <text x="50" y="120" class="subtitle">[ɡɑːrb] n. 服装，装束</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> garb (服装)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着奇装异服的人，"装束(garb)"
    <tspan x="50" dy="25">奇特到让人一眼难忘，这就是garb的精髓。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a unique garb to the costume party.
  </text>
  <text x="50" y="310" class="content">
    她穿着独特的服装去参加化装舞会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Garb -->
    <rect x="30" y="120" width="40" height="60" class="image" />
    <line x1="30" y1="120" x2="70" y2="120" class="image" />
    <line x1="30" y1="150" x2="70" y2="150" class="image" />
    <line x1="30" y1="180" x2="70" y2="180" class="image" />
    <!-- Unique design -->
    <circle cx="50" cy="140" r="5" class="image" />
    <circle cx="40" cy="160" r="5" class="image" />
    <circle cx="60" cy="160" r="5" class="image" />
  </g>
</svg>