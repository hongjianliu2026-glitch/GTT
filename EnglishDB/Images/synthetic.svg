<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">synthetic</text>
  <text x="50" y="120" class="subtitle">[sɪnˈθetɪk] adj. 合成的，人造的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syn- (一起) + thet (放置) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"把各种元素一起放置(syn-thet-ic)"
    <tspan x="50" dy="25">创造出一种全新的合成材料。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fabric is made of synthetic fibers.
  </text>
  <text x="50" y="310" class="content">
    这种织物是由合成纤维制成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lab table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Beakers -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Synthetic material -->
    <rect x="200" y="20" width="100" height="160" class="image" />
    <line x1="220" y1="50" x2="280" y2="50" class="image" />
    <line x1="220" y1="80" x2="280" y2="80" class="image" />
    <line x1="220" y1="110" x2="280" y2="110" class="image" />
    <line x1="220" y1="140" x2="280" y2="140" class="image" />
  </g>
</svg>