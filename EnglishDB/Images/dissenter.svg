<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dissenter</text>
  <text x="50" y="120" class="subtitle">[dɪˈsentər] n. 持异议者，反对者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + sent (感觉) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在开会，突然有一个人站起来，"分开了(dis-)"
    <tspan x="50" dy="25">自己的感觉(sent)，表示不同意，这个人就是持异议者(dissenter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dissenter voiced his opposition to the proposal.
  </text>
  <text x="50" y="310" class="content">
    持异议者对提议表达了反对意见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People sitting -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Dissenter standing -->
    <circle cx="200" cy="30" r="15" class="image" />
    <line x1="200" y1="45" x2="200" y2="80" class="image" />
    <line x1="200" y1="80" x2="180" y2="110" class="image" />
    <line x1="200" y1="80" x2="220" y2="110" class="image" />
    <line x1="200" y1="60" x2="250" y2="50" class="image" />
    <!-- Speech bubble -->
    <path d="M250,30 Q280,30 280,60 Q280,90 250,90 Q220,90 220,60 Q220,30 250,30" class="image" />
    <text x="240" y="65" class="content" text-anchor="middle">NO!</text>
  </g>
</svg>