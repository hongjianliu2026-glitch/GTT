<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plunder</text>
  <text x="50" y="120" class="subtitle">[ˈplʌndər] v. 掠夺，抢劫；n. 掠夺物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plund (掠夺) + -er (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群海盗在船上，"掠夺(plund)"
    <tspan x="50" dy="25">所有的财宝，这些财宝就成了他们的掠夺物(plunder)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pirates plundered the village and took all the gold.
  </text>
  <text x="50" y="310" class="content">
    海盗们洗劫了村庄，带走了所有的黄金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pirate ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 250,150 200,120 50,120" class="image" />
    <!-- Pirate -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Treasure chest -->
    <rect x="200" y="120" width="100" height="60" class="image" />
    <line x1="200" y1="120" x2="300" y2="120" class="image" />
    <line x1="200" y1="180" x2="300" y2="180" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="300" y1="120" x2="300" y2="180" class="image" />
    <!-- Gold coins -->
    <circle cx="220" cy="150" r="10" class="image" />
    <circle cx="240" cy="150" r="10" class="image" />
    <circle cx="260" cy="150" r="10" class="image" />
  </g>
</svg>