<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">place</text>
  <text x="50" y="120" class="subtitle">[pleɪs] n. 地方，位置；v. 放置</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plac (平静，满足)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个平静的湖面，"放置(place)"
    <tspan x="50" dy="25">一块石头，湖面泛起涟漪，这就是一个地方(place)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She placed the book on the table.
  </text>
  <text x="50" y="310" class="content">
    她把书放在桌子上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Stone -->
    <rect x="150" y="75" width="50" height="50" class="image" />
    <!-- Ripples -->
    <circle cx="175" cy="100" r="20" class="image" />
    <circle cx="175" cy="100" r="40" class="image" />
    <circle cx="175" cy="100" r="60" class="image" />
  </g>
</svg>