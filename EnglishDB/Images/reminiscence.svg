<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reminiscence</text>
  <text x="50" y="120" class="subtitle">[ˌrɛmɪˈnɪsns] n. 回忆，怀旧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + min (想起) + -iscence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老人坐在摇椅上，"再次想起(re-min)"
    <tspan x="50" dy="25">过去的时光，那些美好的回忆(reminiscence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her reminiscence of childhood brought tears to her eyes.
  </text>
  <text x="50" y="310" class="content">
    她对童年的回忆让她热泪盈眶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old man in a rocking chair -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <!-- Rocking chair -->
    <line x1="50" y1="210" x2="30" y2="240" class="image" />
    <line x1="50" y1="210" x2="70" y2="240" class="image" />
    <line x1="30" y1="240" x2="70" y2="240" class="image" />
    <!-- Thought bubble -->
    <ellipse cx="200" cy="100" rx="100" ry="50" class="image" />
    <line x1="200" y1="150" x2="150" y2="200" class="image" />
    <line x1="200" y1="150" x2="250" y2="200" class="image" />
    <line x1="150" y1="200" x2="250" y2="200" class="image" />
    <!-- Memories -->
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="200" cy="80" r="10" class="image" />
    <circle cx="250" cy="80" r="10" class="image" />
  </g>
</svg>