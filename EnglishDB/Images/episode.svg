<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">episode</text>
  <text x="50" y="120" class="subtitle">[ˈɛpɪsoʊd] n. 插曲，一段经历</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> epi- (在...之间) + -sode (进入)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在漫长的旅程中，"在...之间进入(epi-sode)"
    <tspan x="50" dy="25">了一段特别的经历，这就是一个插曲(episode)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> That episode in the mountains was the most memorable part of our trip.
  </text>
  <text x="50" y="310" class="content">
    在山中的那段经历是我们旅行中最难忘的部分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <!-- Mountains -->
    <polyline points="100,100 150,50 200,100 250,50 300,100" class="image" />
    <!-- Episode bubble -->
    <rect x="150" y="20" width="100" height="60" class="image" />
    <text x="160" y="50" class="content">Episode</text>
  </g>
</svg>