<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ale</text>
  <text x="50" y="120" class="subtitle">[eɪl] n. 麦芽酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ale (源自中古英语，意为“麦芽酒”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的酒馆，里面摆满了装满麦芽酒(ale)的木桶，
    <tspan x="50" dy="25">酒香四溢，人们围坐在一起，享受着这美味的饮品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He ordered a pint of ale at the pub.
  </text>
  <text x="50" y="310" class="content">
    他在酒吧点了一品脱的麦芽酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Barrel -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="10" y="10" width="180" height="130" class="image" />
    <!-- Liquid inside -->
    <rect x="20" y="20" width="160" height="110" fill="#D35400" />
    <!-- Spigot -->
    <rect x="180" y="100" width="10" height="50" class="image" />
    <!-- Glass -->
    <rect x="220" y="50" width="50" height="100" class="image" />
    <rect x="230" y="60" width="30" height="80" fill="#D35400" />
  </g>
</svg>