<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">two-week</text>
  <text x="50" y="120" class="subtitle">[tuː wiːk] adj. 两周的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> two (二) + week (周)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个日历上，"两个(two)星期(week)"
    <tspan x="50" dy="25">的格子被特别标注出来，这就是两周(two-week)的时间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She planned a two-week vacation in Hawaii.
  </text>
  <text x="50" y="310" class="content">
    她计划在夏威夷度过两周的假期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Weeks -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="170" y="20" width="100" height="160" class="image" />
    <!-- Days -->
    <line x1="60" y1="40" x2="140" y2="40" class="image" />
    <line x1="60" y1="60" x2="140" y2="60" class="image" />
    <line x1="60" y1="80" x2="140" y2="80" class="image" />
    <line x1="60" y1="100" x2="140" y2="100" class="image" />
    <line x1="60" y1="120" x2="140" y2="120" class="image" />
    <line x1="60" y1="140" x2="140" y2="140" class="image" />
    <line x1="180" y1="40" x2="260" y2="40" class="image" />
    <line x1="180" y1="60" x2="260" y2="60" class="image" />
    <line x1="180" y1="80" x2="260" y2="80" class="image" />
    <line x1="180" y1="100" x2="260" y2="100" class="image" />
    <line x1="180" y1="120" x2="260" y2="120" class="image" />
    <line x1="180" y1="140" x2="260" y2="140" class="image" />
    <!-- Highlight -->
    <rect x="50" y="20" width="100" height="160" fill="#E74C3C" opacity="0.5" />
    <rect x="170" y="20" width="100" height="160" fill="#E74C3C" opacity="0.5" />
  </g>
</svg>