<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">revert</text>
  <text x="50" y="120" class="subtitle">[rɪˈvɜːrt] v. 恢复，回到原状</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + vert (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时间机器，"转回(re-vert)"
    <tspan x="50" dy="25">到过去的状态，一切恢复原状。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the storm, the city reverted to its peaceful state.
  </text>
  <text x="50" y="310" class="content">
    风暴过后，城市恢复了平静的状态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Time machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <!-- Arrow pointing back -->
    <polyline points="175,100 100,100 100,50" class="image" />
    <polygon points="100,50 90,60 110,60" class="image" />
    <!-- Text label -->
    <text x="100" y="150" class="content" text-anchor="middle">回到原状</text>
  </g>
</svg>