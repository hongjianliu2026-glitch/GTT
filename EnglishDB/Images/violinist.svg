<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">violinist</text>
  <text x="50" y="120" class="subtitle">[ˌvaɪəˈlɪnɪst] n. 小提琴家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> violin (小提琴) + -ist (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小提琴家(violinist)在舞台上，
    <tspan x="50" dy="25">优雅地演奏着小提琴(violin)，</tspan>
    <tspan x="50" dy="25">音符如同魔法般飘荡在空中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The violinist played a beautiful melody.
  </text>
  <text x="50" y="310" class="content">
    小提琴家演奏了一首优美的旋律。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Violin -->
    <path d="M50 50 L100 50 L120 70 L100 90 L50 90 Z" class="image" />
    <!-- Violinist -->
    <circle cx="80" cy="120" r="15" class="image" />
    <line x1="80" y1="135" x2="80" y2="170" class="image" />
    <line x1="80" y1="170" x2="60" y2="200" class="image" />
    <line x1="80" y1="170" x2="100" y2="200" class="image" />
    <line x1="80" y1="150" x2="110" y2="140" class="image" />
    <!-- Music notes -->
    <path d="M130 50 Q150 70 170 50 T210 50" class="image" />
    <path d="M130 70 Q150 90 170 70 T210 70" class="image" />
    <path d="M130 90 Q150 110 170 90 T210 90" class="image" />
  </g>
</svg>