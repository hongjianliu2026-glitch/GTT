<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">melt</text>
  <text x="50" y="120" class="subtitle">[melt] v. 融化，熔化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> melt (源自中古英语 meltan，意为“融化”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的冰块在阳光下，"逐渐融化(melt)"
    <tspan x="50" dy="25">成一滩水，这个过程就是融化(melt)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ice cream began to melt in the hot sun.
  </text>
  <text x="50" y="310" class="content">
    冰淇淋在炎热的阳光下开始融化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="200" cy="100" r="50" fill="#F1C40F" />
    <!-- Ice cube -->
    <rect x="150" y="180" width="100" height="100" fill="#BDC3C7" />
    <!-- Water droplets -->
    <circle cx="170" cy="290" r="10" fill="#1ABC9C" />
    <circle cx="200" cy="290" r="10" fill="#1ABC9C" />
    <circle cx="230" cy="290" r="10" fill="#1ABC9C" />
  </g>
</svg>