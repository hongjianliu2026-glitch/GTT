<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abound</text>
  <text x="50" y="120" class="subtitle">[əˈbaʊnd] v. 大量存在，充满</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + bound (边界)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个地方，"边界(bound)"被"加强(a-)"，
    <tspan x="50" dy="25">以至于到处都是东西，充满了(abound)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ocean abounds with fish.
  </text>
  <text x="50" y="310" class="content">
    海洋里鱼类丰富。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boundary -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fish -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="70" r="15" class="image" />
    <circle cx="150" cy="90" r="15" class="image" />
    <circle cx="200" cy="110" r="15" class="image" />
    <circle cx="250" cy="130" r="15" class="image" />
    <circle cx="300" cy="150" r="15" class="image" />
    <!-- More fish -->
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="100" cy="130" r="15" class="image" />
    <circle cx="150" cy="110" r="15" class="image" />
    <circle cx="200" cy="90" r="15" class="image" />
    <circle cx="250" cy="70" r="15" class="image" />
    <circle cx="300" cy="50" r="15" class="image" />
  </g>
</svg>