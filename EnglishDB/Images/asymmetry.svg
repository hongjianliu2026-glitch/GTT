<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">asymmetry</text>
  <text x="50" y="120" class="subtitle">[ˌeɪˈsɪmɪtri] n. 不对称</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (不) + symmetry (对称)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体，一边是"大象(elephant)"，
    <tspan x="50" dy="25">另一边是"蚂蚁(ant)"，这种极端的不对称(asymmetry)</tspan>
    <tspan x="50" dy="25">让人一眼就能记住。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The asymmetry of the building's design caught everyone's attention.
  </text>
  <text x="50" y="310" class="content">
    这座建筑不对称的设计吸引了所有人的注意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elephant -->
    <circle cx="50" cy="100" r="40" class="image" />
    <line x1="50" y1="140" x2="50" y2="200" class="image" />
    <line x1="50" y1="170" x2="20" y2="150" class="image" />
    <line x1="50" y1="170" x2="80" y2="150" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />

    <!-- Ant -->
    <circle cx="300" cy="100" r="10" class="image" />
    <line x1="300" y1="110" x2="300" y2="130" class="image" />
    <line x1="300" y1="120" x2="280" y2="110" class="image" />
    <line x1="300" y1="120" x2="320" y2="110" class="image" />
    <line x1="300" y1="130" x2="280" y2="140" class="image" />
    <line x1="300" y1="130" x2="320" y2="140" class="image" />
  </g>
</svg>