<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pack</text>
  <text x="50" y="120" class="subtitle">[pæk] n. 包，包裹；v. 打包，包装</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pack (来自古英语 pac, 意为“打包”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旅行者，他正在"打包(pack)"
    <tspan x="50" dy="25">行李，把所有东西都塞进一个包裹(pack)里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She packed her bags and left for the airport.
  </text>
  <text x="50" y="310" class="content">
    她打包好行李，前往机场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Backpack -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Straps -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <line x1="150" y1="0" x2="150" y2="150" class="image" />
    <!-- Items inside the pack -->
    <rect x="20" y="20" width="30" height="30" class="image" />
    <rect x="70" y="20" width="30" height="30" class="image" />
    <rect x="120" y="20" width="30" height="30" class="image" />
    <rect x="20" y="70" width="30" height="30" class="image" />
    <rect x="70" y="70" width="30" height="30" class="image" />
    <rect x="120" y="70" width="30" height="30" class="image" />
    <!-- Traveler -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="120" x2="280" y2="110" class="image" />
  </g>
</svg>