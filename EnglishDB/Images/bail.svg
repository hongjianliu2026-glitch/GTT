<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bail</text>
  <text x="50" y="120" class="subtitle">[beɪl] n. 保释；v. 保释，帮助脱离困境</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bail (桶)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被困在桶里，"保释(bail)"
    <tspan x="50" dy="25">就是用绳子把他从桶里拉出来，帮助他脱离困境。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was able to bail out of the sinking boat.
  </text>
  <text x="50" y="310" class="content">
    他能够从正在下沉的船上逃脱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bucket -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Person in the bucket -->
    <circle cx="100" cy="80" r="20" class="image" />
    <line x1="100" y1="100" x2="100" y2="140" class="image" />
    <line x1="100" y1="140" x2="80" y2="170" class="image" />
    <line x1="100" y1="140" x2="120" y2="170" class="image" />
    <line x1="100" y1="120" x2="130" y2="110" class="image" />
    <!-- Rope to bail out -->
    <line x1="100" y1="80" x2="300" y2="80" class="image" />
    <line x1="300" y1="80" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
  </g>
</svg>