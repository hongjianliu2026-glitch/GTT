<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intensify</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtensɪfaɪ] v. 加强，加剧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> intens (强烈的) + -ify (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个火焰在燃烧，"使(ify)"
    <tspan x="50" dy="25">火焰变得更加"强烈(intens)"，火势加剧(intensify)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heat intensified as the sun rose higher.
  </text>
  <text x="50" y="310" class="content">
    随着太阳升得更高，热度加剧了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flame -->
    <path d="M50 50 C 70 20, 90 20, 110 50 S 150 80, 170 50" class="image" />
    <path d="M50 70 C 70 40, 90 40, 110 70 S 150 100, 170 70" class="image" />
    <path d="M50 90 C 70 60, 90 60, 110 90 S 150 120, 170 90" class="image" />
    <!-- Intensified flame -->
    <path d="M50 50 C 70 20, 90 20, 110 50 S 150 80, 170 50" class="image" />
    <path d="M50 70 C 70 40, 90 40, 110 70 S 150 100, 170 70" class="image" />
    <path d="M50 90 C 70 60, 90 60, 110 90 S 150 120, 170 90" class="image" />
    <path d="M50 110 C 70 80, 90 80, 110 110 S 150 140, 170 110" class="image" />
    <path d="M50 130 C 70 100, 90 100, 110 130 S 150 160, 170 130" class="image" />
  </g>
</svg>