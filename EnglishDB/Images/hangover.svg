<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hangover</text>
  <text x="50" y="120" class="subtitle">[ˈhæŋˌoʊvər] n. 宿醉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hang (悬挂) + over (在上面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人喝醉后，"悬挂(hang)"在床边，
    <tspan x="50" dy="25">第二天早上醒来时，"在上面(over)"还残留着昨晚的醉意，</tspan>
    <tspan x="50" dy="25">这就是宿醉(hangover)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He had a terrible hangover after the party.
  </text>
  <text x="50" y="310" class="content">
    他在派对后宿醉得很厉害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person hanging over the bed -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <!-- Headache symbol -->
    <circle cx="180" cy="100" r="10" class="image" />
    <line x1="180" y1="110" x2="180" y2="130" class="image" />
    <line x1="170" y1="120" x2="190" y2="120" class="image" />
  </g>
</svg>