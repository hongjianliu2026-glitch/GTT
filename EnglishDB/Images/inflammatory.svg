<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inflammatory</text>
  <text x="50" y="120" class="subtitle">[ɪnˈflæmətɔːri] adj. 煽动性的，炎症的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + flam (火焰) + -atory (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一团火焰"进入(in-)"你的身体，引发"炎症(inflammatory)"，
    <tspan x="50" dy="25">或者一团火焰"进入(in-)"你的话语，煽动情绪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The inflammatory speech caused a riot.
  </text>
  <text x="50" y="310" class="content">
    煽动性的演讲引发了一场骚乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flame -->
    <polygon points="0,100 50,0 100,100" class="flame" />
    <polygon points="25,75 75,75 50,50" class="flame" />
    <!-- Body -->
    <circle cx="150" cy="100" r="50" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <polygon points="140,90 150,100 140,110" class="image" />
  </g>
</svg>