<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">internalize</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɜːrnəlaɪz] v. 使内化，使内在化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + -nal (内部的) + -ize (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在内心深处，"将外部信息转化为内在(inter-nal-ize)"
    <tspan x="50" dy="25">的知识，这些知识就成为了他的一部分。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She internalized the lessons from her mentor.
  </text>
  <text x="50" y="310" class="content">
    她将导师的教诲内化为自己的知识。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- External information -->
    <rect x="200" y="50" width="150" height="100" class="image" />
    <text x="225" y="100" class="content">External</text>
    <!-- Arrow -->
    <line x1="275" y1="150" x2="180" y2="150" class="image" />
    <polygon points="275,150 265,145 265,155" class="image" />
    <!-- Internalized information -->
    <rect x="50" y="170" width="150" height="100" class="image" />
    <text x="75" y="220" class="content">Internal</text>
  </g>
</svg>