<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">annexation</text>
  <text x="50" y="120" class="subtitle">[ˌænɛkˈseɪʃən] n. 吞并，合并</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (加强) + nex (连接) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的怪兽，"加强连接(an-nex)"
    <tspan x="50" dy="25">并吞并了一个小村庄，这个过程就是吞并(annexation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The annexation of the small country by the giant empire was controversial.
  </text>
  <text x="50" y="310" class="content">
    这个小国被巨型帝国吞并引起了争议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="50" cy="100" r="40" class="image" />
    <line x1="50" y1="140" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <line x1="50" y1="160" x2="100" y2="140" class="image" />
    <!-- Village -->
    <rect x="150" y="180" width="100" height="50" class="image" />
    <line x1="160" y1="190" x2="240" y2="190" class="image" />
    <line x1="160" y1="210" x2="240" y2="210" class="image" />
    <line x1="160" y1="230" x2="240" y2="230" class="image" />
    <!-- Connection -->
    <line x1="90" y1="140" x2="150" y2="200" class="image" />
  </g>
</svg>