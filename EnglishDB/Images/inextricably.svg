<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inextricably</text>
  <text x="50" y="120" class="subtitle">[ˌɪnɪkˈstrɪkəbli] adv. 无法摆脱地，紧密地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + extric (解开) + -able (能够) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人被一根绳子紧紧地绑在一起，"无法解开(in-extric-ably)"，
    <tspan x="50" dy="25">他们之间的关系紧密到无法分离。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Their fates were inextricably linked.
  </text>
  <text x="50" y="310" class="content">
    他们的命运紧密相连。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rope -->
    <path d="M50,50 Q100,100 150,50 Q200,0 250,50" class="image" />
    <path d="M50,100 Q100,150 150,100 Q200,50 250,100" class="image" />
    <!-- People -->
    <circle cx="70" cy="75" r="20" class="image" />
    <circle cx="230" cy="75" r="20" class="image" />
    <!-- Hands -->
    <line x1="70" y1="95" x2="230" y2="95" class="image" />
  </g>
</svg>