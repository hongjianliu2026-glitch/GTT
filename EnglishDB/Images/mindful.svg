<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mindful</text>
  <text x="50" y="120" class="subtitle">[ˈmaɪndfəl] adj. 留心的，注意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mind (心) + ful (充满的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路时，"心中充满(mind-ful)"
    <tspan x="50" dy="25">着周围的环境，时刻保持警觉，这就是留心的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is always mindful of her surroundings.
  </text>
  <text x="50" y="310" class="content">
    她总是留心周围的环境。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Mind bubble -->
    <ellipse cx="150" cy="80" rx="50" ry="30" class="image" />
    <line x1="150" y1="110" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
    <line x1="150" y1="140" x2="130" y2="160" class="image" />
    <line x1="150" y1="140" x2="170" y2="160" class="image" />
    <!-- Surroundings -->
    <rect x="200" y="50" width="100" height="100" class="image" />
    <rect x="250" y="100" width="100" height="100" class="image" />
    <rect x="300" y="150" width="100" height="100" class="image" />
  </g>
</svg>