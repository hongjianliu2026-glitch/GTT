<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #922B21; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misery</text>
  <text x="50" y="120" class="subtitle">[ˈmɪzəri] n. 痛苦，悲惨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> miser (可怜的) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个可怜的人(miser)，他周围充满了
    <tspan x="50" dy="25">痛苦的表情和悲惨的场景，这就是"痛苦(misery)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The loss of her pet brought her great misery.
  </text>
  <text x="50" y="310" class="content">
    失去宠物给她带来了巨大的痛苦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sad face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="35" y1="40" x2="45" y2="40" class="image" />
    <line x1="55" y1="40" x2="65" y2="40" class="image" />
    <path d="M35 60 Q50 80 65 60" class="image" />

    <!-- Torn clothes -->
    <rect x="100" y="20" width="80" height="100" class="image" />
    <line x1="110" y1="30" x2="120" y2="40" class="image" />
    <line x1="130" y1="30" x2="140" y2="40" class="image" />
    <line x1="110" y1="90" x2="120" y2="100" class="image" />
    <line x1="130" y1="90" x2="140" y2="100" class="image" />

    <!-- Rain cloud -->
    <ellipse cx="250" cy="50" rx="50" ry="30" class="image" />
    <line x1="225" y1="60" x2="225" y2="80" class="image" />
    <line x1="250" y1="60" x2="250" y2="80" class="image" />
    <line x1="275" y1="60" x2="275" y2="80" class="image" />
  </g>
</svg>