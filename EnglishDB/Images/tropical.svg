<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #F39C12; }
      .leaf { fill: #27AE60; }
      .coconut { fill: #D35400; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tropical</text>
  <text x="50" y="120" class="subtitle">[ˈtrɒpɪkl] adj. 热带的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trop (转) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太阳(sun)在旋转(trop)，
    <tspan x="50" dy="25">照耀着热带雨林，那里有茂密的树叶(leaf)和椰子(coconut)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tropical rainforest is home to many unique species.
  </text>
  <text x="50" y="310" class="content">
    热带雨林是许多独特物种的家园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="sun" />
    <!-- Leaves -->
    <path d="M 50 150 Q 100 50 150 150" class="leaf" />
    <path d="M 100 150 Q 150 50 200 150" class="leaf" />
    <!-- Coconut -->
    <circle cx="100" cy="200" r="20" class="coconut" />
    <circle cx="150" cy="200" r="20" class="coconut" />
  </g>
</svg>