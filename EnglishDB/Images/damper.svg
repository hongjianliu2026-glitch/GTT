<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">damper</text>
  <text x="50" y="120" class="subtitle">[ˈdæmpər] n. 减震器，阻尼器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> damp (潮湿) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"潮湿(damp)"海绵，它被用来"减缓(er)"
    <tspan x="50" dy="25">一个弹跳球的冲击力，这个海绵就是减震器(damper)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The damper on the piano needs to be adjusted.
  </text>
  <text x="50" y="310" class="content">
    钢琴的阻尼器需要调整。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sponge -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Ball -->
    <circle cx="200" cy="50" r="30" class="image" />
    <!-- Impact line -->
    <line x1="200" y1="80" x2="100" y2="100" class="image" />
    <!-- Dampening effect -->
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
  </g>
</svg>