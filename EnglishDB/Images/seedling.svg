<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seedling</text>
  <text x="50" y="120" class="subtitle">[ˈsiːdlɪŋ] n. 幼苗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seed (种子) + -ling (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗小小的种子(seed)，在土壤中发芽，
    <tspan x="50" dy="25">长成了一株嫩绿的幼苗(seedling)，象征着新生和希望。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gardener carefully tended to the seedlings in the greenhouse.
  </text>
  <text x="50" y="310" class="content">
    园丁在温室里精心照料着幼苗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soil -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#8B4513" />
    <!-- Seed -->
    <circle cx="175" cy="140" r="10" class="image" fill="#6B8E23" />
    <!-- Seedling -->
    <line x1="175" y1="140" x2="175" y2="80" class="image" />
    <line x1="175" y1="80" x2="160" y2="100" class="image" />
    <line x1="175" y1="80" x2="190" y2="100" class="image" />
    <line x1="175" y1="100" x2="160" y2="120" class="image" />
    <line x1="175" y1="100" x2="190" y2="120" class="image" />
  </g>
</svg>