<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mutt</text>
  <text x="50" y="120" class="subtitle">[mʌt] n. 杂种狗，混血儿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自俚语，原指杂种狗
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只杂种狗(mutt)，它可能是不同品种的狗的混合体，
    <tspan x="50" dy="25">拥有多种特征，就像一个混血儿一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mutt at the shelter was a mix of several breeds.
  </text>
  <text x="50" y="310" class="content">
    收容所里的那只杂种狗是几种品种的混合体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Dog head -->
    <circle cx="150" cy="50" r="30" class="image" />
    <!-- Dog ears -->
    <polygon points="130,30 140,10 150,30" class="image" />
    <polygon points="170,30 160,10 150,30" class="image" />
    <!-- Dog eyes -->
    <circle cx="140" cy="45" r="5" class="image" />
    <circle cx="160" cy="45" r="5" class="image" />
    <!-- Dog nose -->
    <circle cx="150" cy="60" r="5" class="image" />
    <!-- Dog mouth -->
    <line x1="145" y1="70" x2="155" y2="70" class="image" />
    <!-- Dog tail -->
    <line x1="250" y1="100" x2="280" y2="80" class="image" />
  </g>
</svg>