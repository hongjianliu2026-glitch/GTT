<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thus</text>
  <text x="50" y="120" class="subtitle">[ðʌs] adv. 因此，这样</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thu- (由此) + -s (表示方式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人指着某个方向说："由此(thu-)，这样(s)，
    <tspan x="50" dy="25">事情就这样发生了(thus)。"</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He studied hard, thus he passed the exam.
  </text>
  <text x="50" y="310" class="content">
    他努力学习，因此通过了考试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow pointing -->
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <polygon points="200,0 180,-10 180,10" class="image" />
    <!-- Person pointing -->
    <circle cx="20" cy="0" r="15" class="image" />
    <line x1="20" y1="15" x2="20" y2="50" class="image" />
    <line x1="20" y1="50" x2="0" y2="80" class="image" />
    <line x1="20" y1="50" x2="40" y2="80" class="image" />
    <line x1="20" y1="30" x2="50" y2="20" class="image" />
  </g>
</svg>