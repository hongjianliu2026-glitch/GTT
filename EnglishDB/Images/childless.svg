<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">childless</text>
  <text x="50" y="120" class="subtitle">[ˈtʃaɪldlɪs] adj. 无子女的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> child (孩子) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭，"没有孩子(child-less)"，
    <tspan x="50" dy="25">家里空荡荡的，只有一对夫妻孤独地坐在沙发上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They are a childless couple, but they have many pets.
  </text>
  <text x="50" y="310" class="content">
    他们是一对没有孩子的夫妇，但他们有很多宠物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Empty room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sofa -->
    <rect x="50" y="100" width="250" height="50" class="image" />
    <!-- Couple -->
    <circle cx="100" cy="80" r="15" class="image" />
    <circle cx="200" cy="80" r="15" class="image" />
    <line x1="100" y1="95" x2="100" y2="120" class="image" />
    <line x1="200" y1="95" x2="200" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="150" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
  </g>
</svg>