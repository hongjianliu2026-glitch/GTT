<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boardwalk</text>
  <text x="50" y="120" class="subtitle">[ˈbɔːrdwɔːk] n. 木板路</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> board (木板) + walk (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个海边，人们在"木板(board)"上"走(walk)"，
    <tspan x="50" dy="25">这条木板路(boardwalk)连接着沙滩和商店。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We strolled along the boardwalk by the beach.
  </text>
  <text x="50" y="310" class="content">
    我们在海边的木板路上散步。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Beach -->
    <rect x="0" y="100" width="350" height="100" class="image" />
    <!-- Boardwalk -->
    <rect x="50" y="50" width="250" height="50" class="image" />
    <!-- People -->
    <circle cx="80" cy="75" r="10" class="image" />
    <circle cx="120" cy="75" r="10" class="image" />
    <circle cx="160" cy="75" r="10" class="image" />
    <circle cx="200" cy="75" r="10" class="image" />
    <circle cx="240" cy="75" r="10" class="image" />
    <!-- Ocean -->
    <rect x="0" y="100" width="350" height="100" class="image" />
    <!-- Waves -->
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
  </g>
</svg>