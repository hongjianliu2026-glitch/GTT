<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preschool</text>
  <text x="50" y="120" class="subtitle">[ˈpriːskuːl] n. 幼儿园，学前班</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在...之前) + school (学校)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在进入正式学校之前，"提前(pre-)"
    <tspan x="50" dy="25">进入了一个充满玩具和游戏的"学校(school)"，这就是幼儿园(preschool)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She attended preschool before starting kindergarten.
  </text>
  <text x="50" y="310" class="content">
    她在上幼儿园之前上了学前班。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- School building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="120" width="50" height="80" class="image" />
    <!-- Window -->
    <rect x="50" y="50" width="50" height="50" class="image" />
    <rect x="120" y="50" width="50" height="50" class="image" />
    <rect x="200" y="50" width="50" height="50" class="image" />
    <rect x="270" y="50" width="50" height="50" class="image" />
    <!-- Child -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
    <!-- Toy -->
    <circle cx="100" cy="150" r="10" class="image" />
    <line x1="100" y1="160" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="90" y2="200" class="image" />
    <line x1="100" y1="180" x2="110" y2="200" class="image" />
  </g>
</svg>