<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scandal</text>
  <text x="50" y="120" class="subtitle">[ˈskændl] n. 丑闻，丑事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scand (跳跃) + -al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的丑闻像炸弹一样"跳跃(scand)"出来，
    <tspan x="50" dy="25">震惊了整个社会，这就是"丑闻(scandal)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's financial scandal shocked the public.
  </text>
  <text x="50" y="310" class="content">
    公司的财务丑闻震惊了公众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Explosion -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Newspaper -->
    <rect x="200" y="50" width="150" height="100" class="image" />
    <text x="210" y="100" class="content" style="font-size: 24px;">丑闻</text>
  </g>
</svg>