<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">downhill</text>
  <text x="50" y="120" class="subtitle">[ˌdaʊnˈhɪl] adv. 下坡地；adj. 下坡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> down (向下) + hill (山)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从山顶滑下，"向下(down)"
    <tspan x="50" dy="25">滑过"山(hill)"，这就是下坡(downhill)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The skier sped downhill, enjoying the thrill.
  </text>
  <text x="50" y="310" class="content">
    滑雪者飞速下坡，享受着刺激。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hill -->
    <path d="M0 200 Q100 50 200 200" class="image" />
    <!-- Skier -->
    <circle cx="100" cy="150" r="10" class="image" />
    <line x1="100" y1="160" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="90" y2="200" class="image" />
    <line x1="100" y1="180" x2="110" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="160" class="image" />
  </g>
</svg>