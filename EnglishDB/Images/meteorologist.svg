<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meteorologist</text>
  <text x="50" y="120" class="subtitle">[ˌmiːtiəˈrɒlədʒɪst] n. 气象学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meteor (天空) + -ologist (研究者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气象学家站在山顶，"研究天空(meteor-ologist)"
    <tspan x="50" dy="25">中的气象变化，预测天气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meteorologist forecasted a storm for tomorrow.
  </text>
  <text x="50" y="310" class="content">
    气象学家预测明天会有暴风雨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 50 L200 200 Z" class="image" />
    <!-- Meteorologist -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="200" height="50" class="image" />
    <!-- Clouds -->
    <ellipse cx="50" cy="30" rx="40" ry="20" class="image" />
    <ellipse cx="150" cy="30" rx="40" ry="20" class="image" />
  </g>
</svg>