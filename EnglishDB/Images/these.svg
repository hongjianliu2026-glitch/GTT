<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">these</text>
  <text x="50" y="120" class="subtitle">[ðiːz] adj. 这些</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thes- (放置) + -e (指示代词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你面前有一堆物品，你指着它们说："这些(these)"
    <tspan x="50" dy="25">就是我刚刚放置(thes-)的物品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> These books are mine.
  </text>
  <text x="50" y="310" class="content">
    这些书是我的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Items -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <rect x="120" y="0" width="100" height="50" class="image" />
    <rect x="240" y="0" width="100" height="50" class="image" />
    <!-- Pointer -->
    <line x1="360" y1="25" x2="300" y2="25" class="image" />
    <polygon points="360,20 360,30 380,25" class="image" />
  </g>
</svg>