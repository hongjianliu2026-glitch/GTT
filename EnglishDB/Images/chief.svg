<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chief</text>
  <text x="50" y="120" class="subtitle">[tʃiːf] n. 首领，酋长；adj. 主要的，首席的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> -chief (头，首领)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个酋长站在山顶，"头(chief)"
    <tspan x="50" dy="25">上戴着羽毛冠，象征着他的领导地位。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chief of the tribe made a decision.
  </text>
  <text x="50" y="310" class="content">
    部落的首领做出了决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain -->
    <polygon points="0,200 200,0 400,200" class="image" />
    <!-- Chief -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
    <!-- Feather crown -->
    <polyline points="170,70 200,40 230,70" class="image" />
    <polyline points="160,80 200,50 240,80" class="image" />
    <polyline points="150,90 200,60 250,90" class="image" />
  </g>
</svg>