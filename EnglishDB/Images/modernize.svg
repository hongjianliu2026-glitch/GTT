<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">modernize</text>
  <text x="50" y="120" class="subtitle">[ˈmɒdənaɪz] v. 使现代化，使适应现代需要</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mod (方式) + -ern (现代的) + -ize (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的村庄，突然被"现代方式(mod-ern)"
    <tspan x="50" dy="25">的科技所包围，变成了一个现代化的城市(modernize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government plans to modernize the public transportation system.
  </text>
  <text x="50" y="310" class="content">
    政府计划使公共交通系统现代化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old village -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Modern city -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <line x1="220" y1="20" x2="330" y2="20" class="image" />
    <line x1="220" y1="40" x2="330" y2="40" class="image" />
    <line x1="220" y1="60" x2="330" y2="60" class="image" />
    <line x1="220" y1="80" x2="330" y2="80" class="image" />
    <rect x="240" y="40" width="30" height="30" class="image" />
    <rect x="280" y="40" width="30" height="30" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <polygon points="190,50 180,45 180,55" class="image" />
  </g>
</svg>