<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alley</text>
  <text x="50" y="120" class="subtitle">[ˈæli] n. 小巷，胡同</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (小) + ley (空地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小巷(alley)，两边是高墙，中间是一条狭窄的"小空地(al-ley)"，
    <tspan x="50" dy="25">人们在这里穿梭，感受城市的另一面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We found a hidden gem in the alley behind the main street.
  </text>
  <text x="50" y="310" class="content">
    我们在主街后面的小巷里发现了一颗隐藏的宝石。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Alley walls -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="250" y="0" width="100" height="200" class="image" />
    <!-- Alley path -->
    <line x1="100" y1="0" x2="250" y2="0" class="image" />
    <line x1="100" y1="50" x2="250" y2="50" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <line x1="100" y1="200" x2="250" y2="200" class="image" />
    <!-- Person walking -->
    <circle cx="175" cy="100" r="10" class="image" />
    <line x1="175" y1="110" x2="175" y2="140" class="image" />
    <line x1="175" y1="140" x2="160" y2="170" class="image" />
    <line x1="175" y1="140" x2="190" y2="170" class="image" />
    <line x1="175" y1="120" x2="200" y2="110" class="image" />
  </g>
</svg>