<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commonality</text>
  <text x="50" y="120" class="subtitle">[ˌkɒməˈnæləti] n. 共性，共同特征</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + mon (公共) + -ality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一个巨大的公共(com-mon)桌子旁，
    <tspan x="50" dy="25">分享着共同的(common)食物和故事，这就是他们的共性(commonality)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The commonality of their experiences brought them closer.
  </text>
  <text x="50" y="310" class="content">
    他们经历的共性使他们更加亲近。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Food -->
    <rect x="70" y="50" width="20" height="20" class="image" />
    <rect x="170" y="50" width="20" height="20" class="image" />
    <rect x="270" y="50" width="20" height="20" class="image" />
    <!-- Shared items -->
    <line x1="50" y1="120" x2="250" y2="120" class="image" />
    <line x1="50" y1="140" x2="250" y2="140" class="image" />
    <line x1="50" y1="160" x2="250" y2="160" class="image" />
  </g>
</svg>