<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">canoeing</text>
  <text x="50" y="120" class="subtitle">[kəˈnuːɪŋ] n. 划独木舟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> canoe (独木舟) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在湖面上，"划着(canoeing)"
    <tspan x="50" dy="25">独木舟，享受着宁静的水面和微风。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They went canoeing on the lake last weekend.
  </text>
  <text x="50" y="310" class="content">
    他们上周末在湖上划独木舟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#A9CCE3" />
    <!-- Canoe -->
    <polygon points="100,150 150,100 200,150" class="image" fill="#D6DBDF" />
    <!-- Person -->
    <circle cx="150" cy="120" r="15" class="image" fill="#2ECC71" />
    <line x1="150" y1="135" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <line x1="150" y1="150" x2="180" y2="140" class="image" />
  </g>
</svg>