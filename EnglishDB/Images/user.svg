<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">user</text>
  <text x="50" y="120" class="subtitle">[ˈjuːzər] n. 用户，使用者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> use (使用) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"使用者(user)"在电脑前，
    <tspan x="50" dy="25">双手忙碌地操作着各种软件和应用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The app has over a million active users.
  </text>
  <text x="50" y="310" class="content">
    这个应用有超过一百万的活跃用户。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Computer screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hands -->
    <line x1="50" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="300" y2="100" class="image" />
    <!-- Keyboard -->
    <rect x="50" y="160" width="250" height="30" class="image" />
    <!-- Mouse -->
    <circle cx="320" cy="115" r="15" class="image" />
    <line x1="320" y1="130" x2="320" y2="160" class="image" />
  </g>
</svg>