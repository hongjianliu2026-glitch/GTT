<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yard</text>
  <text x="50" y="120" class="subtitle">[jɑːrd] n. 院子，码</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> yard (来自古英语geard，意为“围场”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的“围场(yard)”里，
    <tspan x="50" dy="25">有一群小动物在欢快地玩耍，</tspan>
    <tspan x="50" dy="25">这个围场就是它们的乐园。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were playing in the yard after school.
  </text>
  <text x="50" y="310" class="content">
    孩子们放学后在院子里玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Yard boundary -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fence -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Animals -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
  </g>
</svg>