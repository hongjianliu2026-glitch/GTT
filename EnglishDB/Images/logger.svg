<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">logger</text>
  <text x="50" y="120" class="subtitle">[ˈlɔːɡər] n. 伐木工，记录器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> log (木头) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个伐木工(logger)，他挥舞着斧头，
    <tspan x="50" dy="25">砍倒一棵棵大树(log)，木屑四溅，场面壮观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The logger carefully marked each tree before cutting it down.
  </text>
  <text x="50" y="310" class="content">
    伐木工在砍树前仔细标记每一棵树。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <!-- Axe -->
    <line x1="120" y1="100" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <!-- Logger -->
    <circle cx="135" cy="150" r="15" class="image" />
    <line x1="135" y1="165" x2="135" y2="200" class="image" />
    <line x1="135" y1="180" x2="120" y2="210" class="image" />
    <line x1="135" y1="180" x2="150" y2="210" class="image" />
    <line x1="135" y1="170" x2="160" y2="160" class="image" />
  </g>
</svg>