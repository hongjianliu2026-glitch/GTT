<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #F06292; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beautifully</text>
  <text x="50" y="120" class="subtitle">[ˈbjuːtɪfəli] adv. 美丽地，漂亮地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> beauti (美丽) + -ful (充满) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个花园里，"充满美丽(beauti-ful)"的花朵，
    <tspan x="50" dy="25">它们在微风中轻轻摇曳，"美丽地(ly)"绽放。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She danced beautifully at the party.
  </text>
  <text x="50" y="310" class="content">
    她在派对上跳得非常美丽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flowers -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="120" r="25" class="image" />
    <circle cx="150" cy="80" r="30" class="image" />
    <circle cx="200" cy="110" r="25" class="image" />
    <circle cx="250" cy="90" r="20" class="image" />
    <!-- Wind -->
    <line x1="50" y1="130" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="250" y2="130" class="image" />
  </g>
</svg>