<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">convoluted</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnvəˌlutɪd] adj. 复杂的，费解的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + volute (卷曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张纸被"卷曲在一起(con-volute)"，
    <tspan x="50" dy="25">形成了一个复杂的迷宫，让人难以理解(convoluted)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The instructions were so convoluted that no one could follow them.
  </text>
  <text x="50" y="310" class="content">
    这些指示如此复杂，以至于没人能理解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Convoluted paper -->
    <path d="M50,50 C100,0 150,100 200,50 C250,0 300,100 350,50" class="image" />
    <path d="M50,100 C100,50 150,150 200,100 C250,50 300,150 350,100" class="image" />
    <path d="M50,150 C100,100 150,200 200,150 C250,100 300,200 350,150" class="image" />
  </g>
</svg>