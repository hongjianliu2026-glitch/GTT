<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #922B21; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">harshly</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrʃli] adv. 严厉地，苛刻地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> harsh (严厉的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个严厉的老师，"严厉地(harshly)"
    <tspan x="50" dy="25">批评学生，声音如同风暴般刺耳。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher spoke harshly to the students.
  </text>
  <text x="50" y="310" class="content">
    老师严厉地对学生们说话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teacher -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Thunderstorm -->
    <line x1="100" y1="20" x2="150" y2="100" class="image" />
    <line x1="120" y1="20" x2="170" y2="100" class="image" />
    <line x1="140" y1="20" x2="190" y2="100" class="image" />
    <line x1="160" y1="20" x2="210" y2="100" class="image" />
    <line x1="180" y1="20" x2="230" y2="100" class="image" />
    <!-- Students -->
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="270" cy="100" r="10" class="image" />
    <circle cx="290" cy="100" r="10" class="image" />
  </g>
</svg>