<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insure</text>
  <text x="50" y="120" class="subtitle">[ɪnˈʃʊr] v. 保险，确保</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + sure (确定)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走进(in-)一家保险公司，"确保(sure)"
    <tspan x="50" dy="25">自己的未来安全，这就是保险(insure)的意义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He decided to insure his house against fire.
  </text>
  <text x="50" y="310" class="content">
    他决定为他的房子投保火灾险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Insurance office -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person entering -->
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <circle cx="40" cy="100" r="10" class="image" />
    <line x1="40" y1="110" x2="40" y2="150" class="image" />
    <line x1="40" y1="150" x2="30" y2="180" class="image" />
    <line x1="40" y1="150" x2="50" y2="180" class="image" />
    <line x1="40" y1="130" x2="60" y2="120" class="image" />
    <!-- Insurance sign -->
    <text x="150" y="50" class="content" style="font-size: 36px; fill: #2980B9;">INSURE</text>
  </g>
</svg>