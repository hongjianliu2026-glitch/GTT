<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unrest</text>
  <text x="50" y="120" class="subtitle">[ʌnˈrest] n. 不安，动荡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + rest (休息)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人无法"休息(rest)"，四处"不安(un-rest)"地走动，
    <tspan x="50" dy="25">场面混乱，这就是"动荡(unrest)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city was in a state of unrest after the election.
  </text>
  <text x="50" y="310" class="content">
    选举后，城市处于动荡状态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People moving -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="90" y2="70" class="image" />

    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="190" y2="70" class="image" />

    <circle cx="250" cy="50" r="15" class="image" />
    <line x1="250" y1="65" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
    <line x1="250" y1="80" x2="290" y2="70" class="image" />

    <!-- Chaos lines -->
    <line x1="30" y1="150" x2="300" y2="150" class="image" />
    <line x1="30" y1="170" x2="300" y2="170" class="image" />
    <line x1="30" y1="190" x2="300" y2="190" class="image" />
  </g>
</svg>