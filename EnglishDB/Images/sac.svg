<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sac</text>
  <text x="50" y="120" class="subtitle">[sæk] n. 囊，袋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sac (源自拉丁语 saccus，意为“袋子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的袋子(sac)，里面装满了各种奇异的物品，
    <tspan x="50" dy="25">从宝石到水果，应有尽有。这个袋子就像一个神奇的宝库，</tspan>
    <tspan x="50" dy="25">吸引着人们去探索和发现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kangaroo carries its baby in a pouch, which is a type of sac.
  </text>
  <text x="50" y="310" class="content">
    袋鼠把它的宝宝放在育儿袋里，这是一种囊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large bag -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Items inside the bag -->
    <circle cx="50" cy="50" r="15" class="image" /> <!-- Gem -->
    <rect x="80" y="40" width="20" height="20" class="image" /> <!-- Fruit -->
    <line x1="120" y1="40" x2="140" y2="60" class="image" /> <!-- Another item -->
    <line x1="120" y1="60" x2="140" y2="40" class="image" /> <!-- Another item -->
    <!-- Bag opening -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
  </g>
</svg>