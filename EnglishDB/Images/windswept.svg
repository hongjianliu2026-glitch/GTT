<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">windswept</text>
  <text x="50" y="120" class="subtitle">[ˈwɪndswɛpt] adj. 被风吹过的，荒凉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wind (风) + swept (sweep的过去分词，扫过)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片荒凉的草原，"风(wind)无情地扫过(swept)"
    <tspan x="50" dy="25">，将一切都吹得凌乱不堪，这就是windswept的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The windswept plains of the Midwest are often barren.
  </text>
  <text x="50" y="310" class="content">
    中西部的风吹过的平原通常是荒凉的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wind -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="20" x2="350" y2="220" class="image" />
    <line x1="0" y1="40" x2="350" y2="240" class="image" />
    <!-- Grass -->
    <line x1="50" y1="200" x2="70" y2="180" class="image" />
    <line x1="100" y1="200" x2="120" y2="180" class="image" />
    <line x1="150" y1="200" x2="170" y2="180" class="image" />
    <line x1="200" y1="200" x2="220" y2="180" class="image" />
    <line x1="250" y1="200" x2="270" y2="180" class="image" />
    <line x1="300" y1="200" x2="320" y2="180" class="image" />
    <!-- Windswept effect -->
    <line x1="50" y1="200" x2="40" y2="190" class="image" />
    <line x1="100" y1="200" x2="90" y2="190" class="image" />
    <line x1="150" y1="200" x2="140" y2="190" class="image" />
    <line x1="200" y1="200" x2="190" y2="190" class="image" />
    <line x1="250" y1="200" x2="240" y2="190" class="image" />
    <line x1="300" y1="200" x2="290" y2="190" class="image" />
  </g>
</svg>