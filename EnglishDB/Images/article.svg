<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">article</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrtɪkl] n. 文章，物品，条款</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> art- (技巧) + -icle (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小巧的"技巧(art-icle)"，就像一篇精巧的文章(article)，
    <tspan x="50" dy="25">每一句话都经过精心雕琢，构成了一篇完美的作品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wrote an article about climate change.
  </text>
  <text x="50" y="310" class="content">
    她写了一篇关于气候变化的文章。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lines on paper -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Pen -->
    <rect x="30" y="160" width="20" height="40" class="image" />
    <line x1="40" y1="160" x2="40" y2="140" class="image" />
    <!-- Hand -->
    <circle cx="40" cy="130" r="10" class="image" />
    <line x1="40" y1="130" x2="20" y2="110" class="image" />
    <line x1="40" y1="130" x2="60" y2="110" class="image" />
  </g>
</svg>