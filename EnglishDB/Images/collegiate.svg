<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">collegiate</text>
  <text x="50" y="120" class="subtitle">[kəˈliːdʒiət] adj. 学院的，大学的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (共同) + leg (选择) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群学生"共同选择(col-leg)"进入一所大学，
    <tspan x="50" dy="25">他们穿着统一的校服，象征着学院的集体精神。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The collegiate atmosphere was palpable during the graduation ceremony.
  </text>
  <text x="50" y="310" class="content">
    毕业典礼上，学院的氛围非常浓厚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- University building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Students -->
    <circle cx="70" cy="50" r="15" class="image" />
    <circle cx="120" cy="50" r="15" class="image" />
    <circle cx="170" cy="50" r="15" class="image" />
    <circle cx="220" cy="50" r="15" class="image" />
    <circle cx="270" cy="50" r="15" class="image" />
    <!-- Uniforms -->
    <line x1="60" y1="70" x2="80" y2="70" class="image" />
    <line x1="110" y1="70" x2="130" y2="70" class="image" />
    <line x1="160" y1="70" x2="180" y2="70" class="image" />
    <line x1="210" y1="70" x2="230" y2="70" class="image" />
    <line x1="260" y1="70" x2="280" y2="70" class="image" />
    <!-- Campus -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="130" x2="300" y2="130" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
  </g>
</svg>