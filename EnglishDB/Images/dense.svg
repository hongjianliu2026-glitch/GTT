<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dense</text>
  <text x="50" y="120" class="subtitle">[dɛns] adj. 密集的，稠密的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dens (密集)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市，"密集(dens)"到
    <tspan x="50" dy="25">连一只蚂蚁都难以穿行，这就是dense的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city's population is very dense.
  </text>
  <text x="50" y="310" class="content">
    这个城市的人口非常密集。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dense city -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Buildings -->
    <rect x="50" y="20" width="30" height="160" class="image" />
    <rect x="90" y="40" width="30" height="140" class="image" />
    <rect x="130" y="60" width="30" height="120" class="image" />
    <rect x="170" y="80" width="30" height="100" class="image" />
    <rect x="210" y="100" width="30" height="80" class="image" />
    <rect x="250" y="120" width="30" height="60" class="image" />
    <rect x="290" y="140" width="30" height="40" class="image" />
    <!-- Ant -->
    <circle cx="30" cy="180" r="5" class="image" />
    <line x1="30" y1="185" x2="30" y2="195" class="image" />
    <line x1="30" y1="195" x2="25" y2="200" class="image" />
    <line x1="30" y1="195" x2="35" y2="200" class="image" />
  </g>
</svg>