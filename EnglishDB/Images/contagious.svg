<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contagious</text>
  <text x="50" y="120" class="subtitle">[kənˈteɪdʒəs] adj. 传染性的，有感染力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + tag (接触) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满病毒的房间，"共同接触(con-tag)"
    <tspan x="50" dy="25">后，病毒迅速传播，每个人都变得"传染性(contagious)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flu is highly contagious.
  </text>
  <text x="50" y="310" class="content">
    流感具有高度传染性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Virus -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="80" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="80" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- People -->
    <circle cx="70" cy="150" r="15" class="image" />
    <circle cx="120" cy="150" r="15" class="image" />
    <circle cx="170" cy="150" r="15" class="image" />
    <circle cx="220" cy="150" r="15" class="image" />
    <circle cx="270" cy="150" r="15" class="image" />
    <!-- Contagion lines -->
    <line x1="50" y1="50" x2="70" y2="150" class="image" />
    <line x1="100" y1="80" x2="120" y2="150" class="image" />
    <line x1="150" y1="50" x2="170" y2="150" class="image" />
    <line x1="200" y1="80" x2="220" y2="150" class="image" />
    <line x1="250" y1="50" x2="270" y2="150" class="image" />
  </g>
</svg>