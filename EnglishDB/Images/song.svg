<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">song</text>
  <text x="50" y="120" class="subtitle">[sɔŋ] n. 歌曲，歌声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> son (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个歌手在舞台上，用美妙的声音(son)
    <tspan x="50" dy="25">唱出一首动人的歌曲(song)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sang a beautiful song at the concert.
  </text>
  <text x="50" y="310" class="content">
    她在音乐会上唱了一首美丽的歌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Singer -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Microphone -->
    <line x1="175" y1="130" x2="175" y2="80" class="image" />
    <circle cx="175" cy="80" r="10" class="image" />
    <!-- Sound waves -->
    <path d="M175 70 Q190 60, 205 70" class="image" />
    <path d="M175 60 Q190 50, 205 60" class="image" />
    <path d="M175 50 Q190 40, 205 50" class="image" />
  </g>
</svg>