<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slicker</text>
  <text x="50" y="120" class="subtitle">[ˈslɪkər] n. 更狡猾的人，更光滑的东西</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slick (光滑的) + -er (表示比较级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个更光滑的冰面，上面站着两个滑冰者，
    <tspan x="50" dy="25">一个比另一个更狡猾，他轻松地滑过冰面，</tspan>
    <tspan x="50" dy="25">而另一个则笨拙地摔倒了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a slicker salesman than his brother.
  </text>
  <text x="50" y="310" class="content">
    他比他兄弟更会推销。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Skater 1 -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Skater 2 -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
    <!-- Fallen skater -->
    <line x1="250" y1="150" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="230" y2="230" class="image" />
    <line x1="250" y1="200" x2="270" y2="230" class="image" />
  </g>
</svg>