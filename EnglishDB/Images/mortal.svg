<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mortal</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrtl] adj. 凡人的，致命的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mort (死亡) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个凡人(mortal)站在一个巨大的时钟前，
    <tspan x="50" dy="25">时钟的指针飞速转动，象征着生命的流逝和死亡(mort)的不可避免。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mortal wound was fatal and he did not survive.
  </text>
  <text x="50" y="310" class="content">
    致命的伤口是致命的，他没有活下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Person -->
    <circle cx="175" cy="220" r="20" class="image" />
    <line x1="175" y1="240" x2="175" y2="280" class="image" />
    <line x1="175" y1="280" x2="155" y2="320" class="image" />
    <line x1="175" y1="280" x2="195" y2="320" class="image" />
    <line x1="175" y1="260" x2="145" y2="250" class="image" />
    <line x1="175" y1="260" x2="205" y2="250" class="image" />
  </g>
</svg>