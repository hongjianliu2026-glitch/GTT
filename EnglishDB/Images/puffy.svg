<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">puffy</text>
  <text x="50" y="120" class="subtitle">[ˈpʌfi] adj. 肿胀的，蓬松的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> puff (膨胀) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫被吹风机吹得"膨胀(puff)"，
    <tspan x="50" dy="25">全身毛发都变得蓬松(puffy)，像个小毛球。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kitten's fur was puffy after the blow-dry.
  </text>
  <text x="50" y="310" class="content">
    吹干后，小猫的毛变得蓬松。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puffy cat -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="40" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <line x1="90" y1="110" x2="110" y2="110" class="image" />
  </g>
</svg>