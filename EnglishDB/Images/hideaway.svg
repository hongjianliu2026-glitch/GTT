<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hideaway</text>
  <text x="50" y="120" class="subtitle">[ˈhaɪdəweɪ] n. 藏身处，隐居地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hide (隐藏) + away (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在森林中找到一个"隐藏(hide)"的"离开(away)"
    <tspan x="50" dy="25">地方，这就是他的藏身处(hideaway)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a cozy hideaway in the woods.
  </text>
  <text x="50" y="310" class="content">
    她在树林里找到了一个舒适的藏身处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Hideaway -->
    <rect x="120" y="100" width="60" height="60" class="image" />
    <!-- Person -->
    <circle cx="150" cy="130" r="10" class="image" />
    <line x1="150" y1="140" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="140" y2="180" class="image" />
    <line x1="150" y1="160" x2="160" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="140" class="image" />
  </g>
</svg>