<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .food { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chutney</text>
  <text x="50" y="120" class="subtitle">[ˈtʃʌtni] n. 酸辣酱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自印地语 "chatni"，意为“调味品”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个印度厨师在厨房里，用各种香料和水果
    <tspan x="50" dy="25">制作出美味的酸辣酱(chutney)，为食物增添风味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She served the samosas with a tangy chutney.
  </text>
  <text x="50" y="310" class="content">
    她用酸辣酱搭配萨莫萨三角饺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Kitchen -->
    <rect x="50" y="20" width="300" height="200" class="image" />
    <!-- Chutney -->
    <rect x="70" y="50" width="100" height="80" class="food" />
    <text x="80" y="90" class="content">Chutney</text>
    <!-- Spices -->
    <circle cx="200" cy="70" r="10" class="image" />
    <circle cx="220" cy="70" r="10" class="image" />
    <circle cx="240" cy="70" r="10" class="image" />
    <circle cx="260" cy="70" r="10" class="image" />
  </g>
</svg>