<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ugh</text>
  <text x="50" y="120" class="subtitle">[ʌɡ] int. （表示厌恶、不快）呃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，拟声词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人吃到恶心的食物，发出"呃(ugh)"的声音，
    <tspan x="50" dy="25">这个声音直接表达了厌恶和不快。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Ugh, this food tastes terrible!
  </text>
  <text x="50" y="310" class="content">
    呃，这食物太难吃了！
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="80" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" />
    <!-- Food -->
    <rect x="150" y="80" width="50" height="30" class="image" />
    <line x1="160" y1="90" x2="190" y2="90" class="image" />
    <line x1="160" y1="100" x2="190" y2="100" class="image" />
    <line x1="160" y1="110" x2="190" y2="110" class="image" />
  </g>
</svg>