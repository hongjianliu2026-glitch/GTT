<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">edifice</text>
  <text x="50" y="120" class="subtitle">[ˈɛdɪfɪs] n. 大厦，宏伟的建筑物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + dic (说) + -fice (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座宏伟的建筑物，"说出(dic)"
    <tspan x="50" dy="25">并"做出(fice)"的壮丽建筑，</tspan>
    <tspan x="50" dy="25">这就是一座大厦(edifice)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The grand edifice stood tall in the city center.
  </text>
  <text x="50" y="310" class="content">
    这座宏伟的大厦矗立在市中心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Building -->
    <rect x="0" y="0" width="300" height="300" class="image" />
    <rect x="20" y="20" width="260" height="260" class="image" />
    <rect x="40" y="40" width="220" height="220" class="image" />
    <rect x="60" y="60" width="180" height="180" class="image" />
    <rect x="80" y="80" width="140" height="140" class="image" />
    <rect x="100" y="100" width="100" height="100" class="image" />
    <rect x="120" y="120" width="60" height="60" class="image" />
    <rect x="140" y="140" width="20" height="20" class="image" />
  </g>
</svg>