<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sparkle { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sparkle</text>
  <text x="50" y="120" class="subtitle">[ˈspɑːrkl] v. 闪耀，闪烁；n. 闪光，火花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spark (火花) + -le (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗钻石在阳光下，"反复闪烁(spark-le)"，
    <tspan x="50" dy="25">每一道光芒都像火花一样，令人目不暇接。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The diamond ring sparkled under the light.
  </text>
  <text x="50" y="310" class="content">
    钻石戒指在灯光下闪闪发光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diamond -->
    <polygon points="175,10 225,10 250,75 200,125 150,75" class="image" />
    <!-- Sparkles -->
    <circle cx="175" cy="10" r="5" class="sparkle" />
    <circle cx="225" cy="10" r="5" class="sparkle" />
    <circle cx="250" cy="75" r="5" class="sparkle" />
    <circle cx="200" cy="125" r="5" class="sparkle" />
    <circle cx="150" cy="75" r="5" class="sparkle" />
  </g>
</svg>