<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chute</text>
  <text x="50" y="120" class="subtitle">[ʃuːt] n. 滑道，降落伞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chute (来自法语，意为“下降”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从飞机上跳下，"下降(chute)"
    <tspan x="50" dy="25">通过降落伞(chute)安全着陆。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a chute to safely land after jumping from the plane.
  </text>
  <text x="50" y="310" class="content">
    他从飞机上跳下后使用降落伞安全着陆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parachute -->
    <path d="M50,50 Q100,20 150,50 T250,50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <!-- Person -->
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="120" y2="170" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
  </g>
</svg>