<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">devil</text>
  <text x="50" y="120" class="subtitle">[ˈdevl] n. 魔鬼，恶棍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + vil (邪恶)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶魔(devil)从地狱中"离开(de-)"，
    <tspan x="50" dy="25">带着邪恶(vil)的力量来到人间，制造混乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The devil made me do it.
  </text>
  <text x="50" y="310" class="content">
    是魔鬼让我这么做的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Devil's head -->
    <circle cx="100" cy="100" r="50" class="image" fill="#B03A2E" />
    <!-- Horns -->
    <path d="M 70 50 L 50 20 L 30 50 Z" class="image" fill="#B03A2E" />
    <path d="M 130 50 L 150 20 L 170 50 Z" class="image" fill="#B03A2E" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="10" class="image" fill="#000" />
    <circle cx="120" cy="90" r="10" class="image" fill="#000" />
    <!-- Mouth -->
    <path d="M 80 120 Q 100 140 120 120" class="image" fill="none" stroke="#000" stroke-width="3" />
    <!-- Tail -->
    <path d="M 100 150 Q 150 200 100 250" class="image" fill="none" stroke="#B03A2E" stroke-width="5" />
  </g>
</svg>