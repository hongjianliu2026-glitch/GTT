<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foe</text>
  <text x="50" y="120" class="subtitle">[foʊ] n. 敌人，对手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "foe"，意为敌人
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士在战场上，面对着他的"敌人(foe)"，
    <tspan x="50" dy="25">两人剑拔弩张，气氛紧张。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The knight faced his foe with courage.
  </text>
  <text x="50" y="310" class="content">
    骑士勇敢地面对他的敌人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warrior -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Sword -->
    <line x1="90" y1="140" x2="120" y2="110" class="image" />
    <!-- Foe -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
    <!-- Sword -->
    <line x1="240" y1="140" x2="270" y2="110" class="image" />
    <!-- Battleground -->
    <line x1="0" y1="250" x2="350" y2="250" class="image" />
  </g>
</svg>