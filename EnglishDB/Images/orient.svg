<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orient</text>
  <text x="50" y="120" class="subtitle">[ˈɔːriənt] v. 确定方向，使适应</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ori- (升起) + -ent (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在山顶，面向东方，"升起(ori-)"的太阳为他指引方向，
    <tspan x="50" dy="25">帮助他"确定方向(orient)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She needed to orient herself in the new city.
  </text>
  <text x="50" y="310" class="content">
    她需要在新城市中确定自己的方向。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L200 0 L400 200 Z" class="image" />
    <!-- Person -->
    <circle cx="200" cy="150" r="15" class="image" />
    <line x1="200" y1="165" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="180" x2="230" y2="170" class="image" />
    <!-- Sun -->
    <circle cx="350" cy="50" r="30" class="image" fill="#F1C40F" />
    <line x1="350" y1="20" x2="350" y2="0" class="image" />
    <line x1="380" y1="50" x2="400" y2="50" class="image" />
    <line x1="350" y1="80" x2="350" y2="100" class="image" />
    <line x1="320" y1="50" x2="300" y2="50" class="image" />
  </g>
</svg>