<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shy</text>
  <text x="50" y="120" class="subtitle">[ʃaɪ] adj. 害羞的，胆怯的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shy (来自古英语 scīgan，意为“躲避”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小动物，因为害怕而"躲避(shy)"在树后，
    <tspan x="50" dy="25">不敢出来，这就是害羞(shy)的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shy girl hid behind her mother.
  </text>
  <text x="50" y="310" class="content">
    那个害羞的女孩躲在她妈妈身后。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Shy animal -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="30" y2="210" class="image" />
    <line x1="50" y1="190" x2="70" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
  </g>
</svg>