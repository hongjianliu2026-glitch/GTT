<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">schoolgirl</text>
  <text x="50" y="120" class="subtitle">[ˈskuːlɡɜːrl] n. 女学生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> school (学校) + girl (女孩)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着校服的女孩，背着书包，
    <tspan x="50" dy="25">手里拿着书，正走在上学的路上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The schoolgirl was excited about her new book.
  </text>
  <text x="50" y="310" class="content">
    那个女学生对她的新书感到非常兴奋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- School uniform -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Girl -->
    <circle cx="75" cy="50" r="20" class="image" />
    <line x1="75" y1="70" x2="75" y2="120" class="image" />
    <line x1="75" y1="120" x2="50" y2="160" class="image" />
    <line x1="75" y1="120" x2="100" y2="160" class="image" />
    <line x1="75" y1="90" x2="110" y2="80" class="image" />
    <!-- Backpack -->
    <rect x="100" y="70" width="30" height="40" class="image" />
    <!-- Book -->
    <rect x="50" y="160" width="20" height="30" class="image" />
  </g>
</svg>