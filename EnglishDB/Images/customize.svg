<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">customize</text>
  <text x="50" y="120" class="subtitle">[ˈkʌstəmaɪz] v. 定制，定做</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> custom (习惯，风俗) + -ize (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠在"使(ize)"一件物品"符合(custom)"
    <tspan x="50" dy="25">某个人的独特习惯或需求，这就是定制(customize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You can customize your own shoes on this website.
  </text>
  <text x="50" y="310" class="content">
    你可以在这个网站上定制你自己的鞋子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Craftsman -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Shoe -->
    <rect x="70" y="80" width="100" height="50" class="image" />
    <line x1="70" y1="80" x2="170" y2="80" class="image" />
    <line x1="70" y1="130" x2="170" y2="130" class="image" />
    <line x1="70" y1="80" x2="70" y2="130" class="image" />
    <line x1="170" y1="80" x2="170" y2="130" class="image" />
    <!-- Customization tools -->
    <rect x="200" y="80" width="30" height="30" class="image" />
    <rect x="240" y="80" width="30" height="30" class="image" />
    <rect x="280" y="80" width="30" height="30" class="image" />
  </g>
</svg>