<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Croat</text>
  <text x="50" y="120" class="subtitle">[kroʊæt] n. 克罗地亚人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "Chroatus"，意为“克罗地亚人”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个克罗地亚人(Croat)站在克罗地亚的国旗前，
    <tspan x="50" dy="25">自豪地展示着他们的文化和传统。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Croat community in the city is very close-knit.
  </text>
  <text x="50" y="310" class="content">
    这个城市的克罗地亚人社群非常团结。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="130" class="image" />
    <line x1="50" y1="150" x2="0" y2="130" class="image" />

    <!-- Flag -->
    <rect x="120" y="80" width="150" height="100" class="image" />
    <line x1="120" y1="80" x2="270" y2="80" class="image" />
    <line x1="120" y1="130" x2="270" y2="130" class="image" />
    <line x1="120" y1="80" x2="120" y2="180" class="image" />
    <line x1="270" y1="80" x2="270" y2="180" class="image" />
    <line x1="120" y1="130" x2="270" y2="130" class="image" />
    <line x1="120" y1="180" x2="270" y2="180" class="image" />

    <!-- Flag colors -->
    <rect x="120" y="80" width="50" height="50" fill="#FF0000" />
    <rect x="170" y="80" width="50" height="50" fill="#FFFFFF" />
    <rect x="220" y="80" width="50" height="50" fill="#0000FF" />
    <rect x="120" y="130" width="50" height="50" fill="#0000FF" />
    <rect x="170" y="130" width="50" height="50" fill="#FFFFFF" />
    <rect x="220" y="130" width="50" height="50" fill="#FF0000" />
  </g>
</svg>