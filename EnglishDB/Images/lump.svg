<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lump</text>
  <text x="50" y="120" class="subtitle">[lʌmp] n. 块，肿块；v. 结块</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lump (块)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"块(lump)"从天而降，
    <tspan x="50" dy="25">砸在地上，形成了一个巨大的肿块。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a lump in her throat after watching the movie.
  </text>
  <text x="50" y="310" class="content">
    看完电影后，她发现喉咙里有个肿块。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Falling lump -->
    <rect x="100" y="0" width="100" height="100" class="image" />
    <!-- Ground -->
    <rect x="50" y="150" width="200" height="50" class="image" />
    <!-- Lump on the ground -->
    <rect x="125" y="150" width="50" height="50" class="image" />
  </g>
</svg>