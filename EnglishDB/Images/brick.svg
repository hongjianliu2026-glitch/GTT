<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brick</text>
  <text x="50" y="120" class="subtitle">[brɪk] n. 砖，砖块</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> br- (燃烧) + -ick (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小火苗在燃烧，"烧制(br-)"
    <tspan x="50" dy="25">出一块块小砖块(brick)，用来建造房屋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wall was built with red bricks.
  </text>
  <text x="50" y="310" class="content">
    这堵墙是用红砖砌成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brick -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <rect x="110" y="0" width="100" height="50" class="image" />
    <rect x="220" y="0" width="100" height="50" class="image" />
    <!-- Fire -->
    <circle cx="350" cy="25" r="20" class="image" />
    <line x1="350" y1="45" x2="350" y2="70" class="image" />
    <line x1="350" y1="70" x2="330" y2="90" class="image" />
    <line x1="350" y1="70" x2="370" y2="90" class="image" />
  </g>
</svg>