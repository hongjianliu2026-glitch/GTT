  <text x="50" y="120" class="subtitle">[ˌjʊərəˈpiːən] adj. 欧洲的；n. 欧洲人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Europe (欧洲) + -an (形容词后缀)
  </text>

