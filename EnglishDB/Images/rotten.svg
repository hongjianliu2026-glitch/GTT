<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .rotten { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rotten</text>
  <text x="50" y="120" class="subtitle">[ˈrɒtn] adj. 腐烂的，腐朽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rot (腐烂) + -en (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苹果，"腐烂(rot)"
    <tspan x="50" dy="25">到极致，变成了"腐朽的(rotten)"苹果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rotten apple was thrown away.
  </text>
  <text x="50" y="310" class="content">
    那个腐烂的苹果被扔掉了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rotten apple -->
    <circle cx="100" cy="100" r="50" class="rotten" />
    <!-- Worms -->
    <line x1="70" y1="80" x2="130" y2="120" class="image" />
    <line x1="70" y1="120" x2="130" y2="80" class="image" />
    <line x1="80" y1="90" x2="120" y2="110" class="image" />
    <line x1="80" y1="110" x2="120" y2="90" class="image" />
    <!-- Spots -->
    <circle cx="80" cy="80" r="5" class="rotten" />
    <circle cx="120" cy="90" r="5" class="rotten" />
    <circle cx="90" cy="110" r="5" class="rotten" />
  </g>
</svg>