<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rosary</text>
  <text x="50" y="120" class="subtitle">[ˈroʊzəri] n. 念珠，玫瑰经</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ros (玫瑰) + -ary (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个修女手持一串"玫瑰(ros)"形状的珠子，
    <tspan x="50" dy="25">这些珠子串在一起，形成了一个念珠(rosary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prayed the rosary every evening.
  </text>
  <text x="50" y="310" class="content">
    她每天晚上都念玫瑰经。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rosary beads -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="250" y2="65" class="image" />
    <!-- Nun -->
    <circle cx="300" cy="50" r="20" class="image" />
    <line x1="300" y1="70" x2="300" y2="120" class="image" />
    <line x1="300" y1="120" x2="280" y2="150" class="image" />
    <line x1="300" y1="120" x2="320" y2="150" class="image" />
    <line x1="300" y1="90" x2="270" y2="80" class="image" />
    <line x1="300" y1="90" x2="330" y2="80" class="image" />
  </g>
</svg>