<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">virus</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪrəs] n. 病毒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vir (毒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小小的"毒(vir)"，它悄悄地潜入人体，
    <tspan x="50" dy="25">像一个微小的入侵者，这就是病毒(virus)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flu virus spreads quickly in winter.
  </text>
  <text x="50" y="310" class="content">
    流感病毒在冬天传播得很快。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Virus -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="100" cy="50" r="30" class="image" />
    <circle cx="150" cy="50" r="30" class="image" />
    <circle cx="75" cy="100" r="30" class="image" />
    <circle cx="125" cy="100" r="30" class="image" />
    <!-- Spreading -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="75" y1="100" x2="125" y2="100" class="image" />
    <line x1="50" y1="50" x2="75" y2="100" class="image" />
    <line x1="150" y1="50" x2="125" y2="100" class="image" />
  </g>
</svg>