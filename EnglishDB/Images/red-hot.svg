<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">red-hot</text>
  <text x="50" y="120" class="subtitle">[ˌred ˈhɒt] adj. 炽热的，极热的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> red (红色) + hot (热)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块炽热的铁块，"红得发烫(red-hot)"，
    <tspan x="50" dy="25">仿佛火焰在上面跳舞，让人不敢触碰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The iron was red-hot after being in the furnace.
  </text>
  <text x="50" y="310" class="content">
    铁块在炉子里烧得通红。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red-hot iron -->
    <rect x="0" y="0" width="200" height="100" class="image" fill="#FF4500" />
    <!-- Flames -->
    <polygon points="100,0 70,30 130,30" class="flame" />
    <polygon points="100,10 60,40 140,40" class="flame" />
    <polygon points="100,20 50,50 150,50" class="flame" />
  </g>
</svg>