<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tumbling</text>
  <text x="50" y="120" class="subtitle">[ˈtʌmbliŋ] v. 翻滚，跌倒；n. 翻筋斗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tum (倒下) + -ble (可...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小丑在舞台上，"不停地倒下(tum-ble)"
    <tspan x="50" dy="25">又站起来，翻滚着表演，这就是tumbling。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The acrobat performed a series of tumbling moves.
  </text>
  <text x="50" y="310" class="content">
    杂技演员表演了一系列翻滚动作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clown -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Tumbling path -->
    <path d="M100,160 Q150,180 200,160" class="image" />
    <path d="M200,160 Q250,140 300,160" class="image" />
  </g>
</svg>