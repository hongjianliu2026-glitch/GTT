<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">osteoporosis</text>
  <text x="50" y="120" class="subtitle">[ˌɒstiəʊpəˈrəʊsɪs] n. 骨质疏松症</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> osteo- (骨) + porosis (孔)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骨头(osteo-)上布满了孔洞(porosis)，
    <tspan x="50" dy="25">这些孔洞使得骨头变得脆弱，这就是骨质疏松症(osteoporosis)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was diagnosed with osteoporosis after a bone density test.
  </text>
  <text x="50" y="310" class="content">
    她在骨密度测试后被诊断出患有骨质疏松症。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bone structure -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Holes in the bone -->
    <circle cx="100" cy="35" r="10" class="image" />
    <circle cx="150" cy="65" r="10" class="image" />
    <circle cx="200" cy="95" r="10" class="image" />
    <circle cx="250" cy="125" r="10" class="image" />
    <circle cx="300" cy="155" r="10" class="image" />
  </g>
</svg>