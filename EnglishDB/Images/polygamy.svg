<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polygamy</text>
  <text x="50" y="120" class="subtitle">[pəˈlɪɡəmi] n. 一夫多妻制，一妻多夫制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poly- (多) + gam (婚姻)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个男人同时拥有多个妻子，"多(poly)个婚姻(gam)"
    <tspan x="50" dy="25">构成了一个复杂的家庭结构，这就是一夫多妻制(polygamy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Polygamy is still practiced in some cultures.
  </text>
  <text x="50" y="310" class="content">
    一夫多妻制在某些文化中仍然被实践。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Multiple houses -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <!-- Man in the middle -->
    <circle cx="180" cy="150" r="20" class="image" />
    <line x1="180" y1="170" x2="180" y2="220" class="image" />
    <line x1="180" y1="220" x2="160" y2="250" class="image" />
    <line x1="180" y1="220" x2="200" y2="250" class="image" />
    <line x1="180" y1="190" x2="140" y2="180" class="image" />
    <line x1="180" y1="190" x2="220" y2="180" class="image" />
    <!-- Connecting lines to houses -->
    <line x1="180" y1="150" x2="50" y2="50" class="image" />
    <line x1="180" y1="150" x2="170" y2="50" class="image" />
    <line x1="180" y1="150" x2="290" y2="50" class="image" />
  </g>
</svg>