<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">townhouse</text>
  <text x="50" y="120" class="subtitle">[ˈtaʊnˌhaʊs] n. 联排别墅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> town (城镇) + house (房子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城镇(town)里，一排排紧密相连的房子(house)，
    <tspan x="50" dy="25">这些房子就是联排别墅(townhouse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They bought a townhouse in the city center.
  </text>
  <text x="50" y="310" class="content">
    他们在市中心买了一套联排别墅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Townhouse row -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="20" width="50" height="100" class="image" />
    <rect x="190" y="20" width="50" height="100" class="image" />
    <rect x="260" y="20" width="50" height="100" class="image" />
    <!-- Windows -->
    <rect x="60" y="40" width="20" height="20" class="image" />
    <rect x="130" y="40" width="20" height="20" class="image" />
    <rect x="200" y="40" width="20" height="20" class="image" />
    <rect x="270" y="40" width="20" height="20" class="image" />
    <!-- Doors -->
    <rect x="65" y="80" width="30" height="40" class="image" />
    <rect x="135" y="80" width="30" height="40" class="image" />
    <rect x="205" y="80" width="30" height="40" class="image" />
    <rect x="275" y="80" width="30" height="40" class="image" />
  </g>
</svg>