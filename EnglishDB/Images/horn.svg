<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">horn</text>
  <text x="50" y="120" class="subtitle">[hɔːrn] n. 角，号角</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> horn (角)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的犀牛，头上长着一对"角(horn)"，
    <tspan x="50" dy="25">它的角像号角一样，发出响亮的声音。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rhinoceros has a large horn on its nose.
  </text>
  <text x="50" y="310" class="content">
    犀牛的鼻子上有一个大角。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Rhinoceros body -->
    <ellipse cx="150" cy="150" rx="100" ry="50" class="image" />
    <!-- Head -->
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Horn -->
    <line x1="200" y1="100" x2="250" y2="50" class="image" />
    <!-- Eye -->
    <circle cx="220" cy="90" r="5" class="image" />
    <!-- Legs -->
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="200" y1="200" x2="200" y2="250" class="image" />
  </g>
</svg>