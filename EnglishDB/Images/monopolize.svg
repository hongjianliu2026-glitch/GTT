<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monopolize</text>
  <text x="50" y="120" class="subtitle">[məˈnɑːpəlaɪz] v. 垄断，独占</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mono- (单一) + pol (卖) + -ize (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人站在一个巨大的市场里，"独占(mono-)"
    <tspan x="50" dy="25">所有的摊位，不让其他人卖东西，这就是垄断(monopolize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company tried to monopolize the market for smartphones.
  </text>
  <text x="50" y="310" class="content">
    这家公司试图垄断智能手机市场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stalls -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <!-- Merchant -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Barrier -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="170" y1="0" x2="170" y2="200" class="image" />
    <line x1="240" y1="0" x2="240" y2="200" class="image" />
  </g>
</svg>