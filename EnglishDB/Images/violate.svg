<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">violate</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪəleɪt] v. 违反，侵犯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vi- (生命) + ol (生长) + ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手试图"侵犯(violate)"一棵正在"生长(ol)"的树，
    <tspan x="50" dy="25">这棵树象征着生命的力量，而手的侵犯行为则违反了自然的规律。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was fined for violating the traffic rules.
  </text>
  <text x="50" y="310" class="content">
    他因违反交通规则而被罚款。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="30" y2="80" class="image" />
    <line x1="50" y1="50" x2="70" y2="80" class="image" />
    <line x1="50" y1="50" x2="40" y2="30" class="image" />
    <line x1="50" y1="50" x2="60" y2="30" class="image" />
    <!-- Hand -->
    <line x1="150" y1="150" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />
    <line x1="150" y1="100" x2="140" y2="80" class="image" />
    <line x1="150" y1="100" x2="160" y2="80" class="image" />
    <!-- Violation -->
    <line x1="150" y1="100" x2="50" y2="100" class="image" />
  </g>
</svg>