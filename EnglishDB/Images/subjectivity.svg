<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subjectivity</text>
  <text x="50" y="120" class="subtitle">[ˌsʌbdʒekˈtɪvəti] n. 主观性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + ject (投掷) + -ivity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考时，"从内心深处投掷(sub-ject)"
    <tspan x="50" dy="25">出自己的观点，这些观点带有强烈的主观性(subjectivity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The essay was criticized for its high level of subjectivity.
  </text>
  <text x="50" y="310" class="content">
    这篇论文因其高度主观性而受到批评。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Thought bubble -->
    <path d="M 150 50 Q 250 20 300 100 Q 250 180 150 150 Z" class="image" />
    <!-- Thought lines -->
    <line x1="170" y1="70" x2="280" y2="90" class="image" />
    <line x1="180" y1="100" x2="270" y2="120" class="image" />
    <line x1="190" y1="130" x2="260" y2="150" class="image" />
  </g>
</svg>