<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resemblance</text>
  <text x="50" y="120" class="subtitle">[rɪˈzɛmbləns] n. 相似，类似</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + sembl (相似) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人站在镜子前，"再次(re-)"
    <tspan x="50" dy="25">看到彼此的"相似(sembl)"，这种相似性就是"resemblance"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The resemblance between the two sisters is striking.
  </text>
  <text x="50" y="310" class="content">
    这两姐妹之间的相似之处非常明显。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two people -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Mirror reflection -->
    <line x1="100" y1="130" x2="250" y2="130" class="image" />
    <line x1="100" y1="160" x2="250" y2="160" class="image" />
    <line x1="100" y1="190" x2="250" y2="190" class="image" />
  </g>
</svg>