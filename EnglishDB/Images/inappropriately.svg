<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inappropriately</text>
  <text x="50" y="120" class="subtitle">[ˌɪnəˈproʊpriətli] adv. 不适当地，不合适地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + appropriate (适当的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着泳衣去参加正式的晚宴，"不适当(in-appropriate)"
    <tspan x="50" dy="25">的行为让人侧目，这就是inappropriately。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He dressed inappropriately for the wedding.
  </text>
  <text x="50" y="310" class="content">
    他穿得不合适去参加婚礼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Formal dinner table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Dinner plate -->
    <circle cx="120" cy="100" r="30" class="image" />
    <!-- Fork and knife -->
    <line x1="160" y1="80" x2="160" y2="120" class="image" />
    <line x1="180" y1="80" x2="180" y2="120" class="image" />
    <!-- Person in swimwear -->
    <circle cx="280" cy="100" r="15" class="image" />
    <line x1="280" y1="115" x2="280" y2="150" class="image" />
    <line x1="280" y1="150" x2="260" y2="180" class="image" />
    <line x1="280" y1="150" x2="300" y2="180" class="image" />
    <line x1="280" y1="130" x2="310" y2="120" class="image" />
    <!-- Swimwear -->
    <line x1="270" y1="115" x2="290" y2="115" class="image" />
    <line x1="270" y1="125" x2="290" y2="125" class="image" />
  </g>
</svg>