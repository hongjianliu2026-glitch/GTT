<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">center</text>
  <text x="50" y="120" class="subtitle">[ˈsɛntər] n. 中心，中央；v. 集中，居中</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> centr- (中心)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆盘，"中心(centr-)"
    <tspan x="50" dy="25">有一个闪亮的宝石，所有人的目光都集中在这里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city center is always bustling with activity.
  </text>
  <text x="50" y="310" class="content">
    市中心总是热闹非凡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large circle -->
    <circle cx="175" cy="100" r="100" class="image" />
    <!-- Shiny gem in the center -->
    <circle cx="175" cy="100" r="20" fill="#FFD700" />
    <!-- People looking at the center -->
    <circle cx="50" cy="50" r="10" fill="#7F8C8D" />
    <line x1="50" y1="60" x2="175" y2="100" class="image" />
    <circle cx="300" cy="50" r="10" fill="#7F8C8D" />
    <line x1="300" y1="60" x2="175" y2="100" class="image" />
    <circle cx="175" cy="200" r="10" fill="#7F8C8D" />
    <line x1="175" y1="210" x2="175" y2="100" class="image" />
  </g>
</svg>