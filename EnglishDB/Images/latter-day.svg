<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">latter-day</text>
  <text x="50" y="120" class="subtitle">[ˈlætər deɪ] adj. 近代的，现代的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> latter (后面的) + day (日子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时间轴，"后面的日子(latter-day)"
    <tspan x="50" dy="25">代表着现代和近代的时期。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The latter-day technology has revolutionized our lives.
  </text>
  <text x="50" y="310" class="content">
    现代技术彻底改变了我们的生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Timeline -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Ancient -->
    <text x="20" y="-20" class="content">Ancient</text>
    <circle cx="50" cy="0" r="10" class="image" />
    <!-- Middle Ages -->
    <text x="120" y="-20" class="content">Middle Ages</text>
    <circle cx="150" cy="0" r="10" class="image" />
    <!-- Modern -->
    <text x="220" y="-20" class="content">Modern</text>
    <circle cx="250" cy="0" r="10" class="image" />
    <!-- Latter-day -->
    <text x="320" y="-20" class="content">Latter-day</text>
    <circle cx="350" cy="0" r="10" class="image" />
  </g>
</svg>