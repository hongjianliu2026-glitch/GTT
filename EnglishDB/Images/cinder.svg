<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cinder { fill: #808B96; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cinder</text>
  <text x="50" y="120" class="subtitle">[ˈsɪndər] n. 煤渣，灰烬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cin- (烧焦) + der (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场大火过后，地上留下了许多"烧焦的(cin-)"
    <tspan x="50" dy="25">小颗粒，这些就是煤渣(cinder)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fireplace was filled with cinders after the fire.
  </text>
  <text x="50" y="310" class="content">
    火炉在火熄灭后充满了煤渣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fireplace -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fire -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cinders -->
    <circle cx="100" cy="100" r="10" class="cinder" />
    <circle cx="150" cy="120" r="10" class="cinder" />
    <circle cx="200" cy="140" r="10" class="cinder" />
    <circle cx="250" cy="160" r="10" class="cinder" />
    <circle cx="300" cy="180" r="10" class="cinder" />
  </g>
</svg>