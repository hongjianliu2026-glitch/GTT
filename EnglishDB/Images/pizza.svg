<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .pizza { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pizza</text>
  <text x="50" y="120" class="subtitle">[ˈpiːtsə] n. 披萨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自意大利语 "pizza"，意为“扁平的面包”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的披萨，上面堆满了各种美味的配料，
    <tspan x="50" dy="25">从香肠到蘑菇，再到奶酪，每一口都是满满的幸福感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We ordered a large pizza with extra cheese.
  </text>
  <text x="50" y="310" class="content">
    我们点了一个大披萨，额外加了奶酪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pizza base -->
    <circle cx="100" cy="100" r="80" class="pizza" />
    <!-- Cheese -->
    <circle cx="100" cy="100" r="70" class="pizza" />
    <!-- Toppings -->
    <circle cx="60" cy="60" r="10" class="pizza" />
    <circle cx="140" cy="60" r="10" class="pizza" />
    <circle cx="100" cy="140" r="10" class="pizza" />
    <circle cx="60" cy="140" r="10" class="pizza" />
    <circle cx="140" cy="140" r="10" class="pizza" />
  </g>
</svg>