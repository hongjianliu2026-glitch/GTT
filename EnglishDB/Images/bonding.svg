<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bonding</text>
  <text x="50" y="120" class="subtitle">[ˈbɒndɪŋ] n. 联结，结合；v. 使结合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bond (联结) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人手拉手，"联结(bond)"在一起，
    <tspan x="50" dy="25">形成了一种紧密的"结合(bonding)"关系。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team-building activities helped with bonding.
  </text>
  <text x="50" y="310" class="content">
    团队建设活动有助于增进团队成员之间的联结。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hands -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Fingers -->
    <line x1="50" y1="100" x2="40" y2="120" class="image" />
    <line x1="50" y1="100" x2="60" y2="120" class="image" />
    <line x1="150" y1="100" x2="140" y2="120" class="image" />
    <line x1="150" y1="100" x2="160" y2="120" class="image" />
    <!-- Heart -->
    <path d="M100,150 C90,130 70,130 60,150 C50,170 100,200 100,200 C100,200 150,170 140,150 C130,130 110,130 100,150 Z" class="image" />
  </g>
</svg>