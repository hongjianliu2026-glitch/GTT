<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #4A4A4A; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #FF6F61; }
      .story { font: 16px serif; fill: #4A90E2; }
      .image { stroke: #FFCC33; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">joyous</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɔɪəs] adj. 快乐的，高兴的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> joy (快乐) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满快乐(joy)的场景，人们脸上洋溢着笑容，
    <tspan x="50" dy="25">周围是五彩缤纷的气球和鲜花，这就是joyous的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The joyous celebration lasted all night.
  </text>
  <text x="50" y="310" class="content">
    快乐的庆祝活动持续了整个晚上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Happy face -->
    <circle cx="50" cy="50" r="40" class="image" fill="#FFCC33" />
    <circle cx="35" cy="40" r="5" class="image" fill="#000000" />
    <circle cx="65" cy="40" r="5" class="image" fill="#000000" />
    <path d="M35 65 Q50 80 65 65" class="image" fill="#000000" />

    <!-- Balloons -->
    <line x1="100" y1="50" x2="100" y2="10" class="image" />
    <circle cx="100" cy="10" r="15" class="image" fill="#FF6F61" />
    <line x1="150" y1="50" x2="150" y2="10" class="image" />
    <circle cx="150" cy="10" r="15" class="image" fill="#4A90E2" />
    <line x1="200" y1="50" x2="200" y2="10" class="image" />
    <circle cx="200" cy="10" r="15" class="image" fill="#FFCC33" />

    <!-- Flowers -->
    <circle cx="250" cy="50" r="10" class="image" fill="#FF6F61" />
    <circle cx="260" cy="50" r="10" class="image" fill="#4A90E2" />
    <circle cx="270" cy="50" r="10" class="image" fill="#FFCC33" />
  </g>
</svg>