<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">toasted</text>
  <text x="50" y="120" class="subtitle">[ˈtoʊstɪd] adj. 烤过的，烘焙过的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> toast (烤面包) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片面包在烤箱里，"被烤得金黄酥脆(toasted)"，
    <tspan x="50" dy="25">散发出诱人的香气，这就是toasted的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves eating toasted bread with butter.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃涂了黄油的烤面包。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toaster -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bread -->
    <rect x="50" y="50" width="100" height="50" class="image" fill="#F4D03F" />
    <!-- Toaster slots -->
    <rect x="50" y="100" width="100" height="50" class="image" fill="#D4AC0D" />
    <rect x="200" y="100" width="100" height="50" class="image" fill="#D4AC0D" />
    <!-- Heat lines -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" stroke="#E67E22" stroke-width="4" />
    <line x1="200" y1="100" x2="300" y2="100" class="image" stroke="#E67E22" stroke-width="4" />
    <!-- Toasted bread -->
    <rect x="50" y="150" width="100" height="50" class="image" fill="#D35400" />
    <rect x="200" y="150" width="100" height="50" class="image" fill="#D35400" />
  </g>
</svg>