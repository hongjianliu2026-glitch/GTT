<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delusional</text>
  <text x="50" y="120" class="subtitle">[dɪˈluːʒənl] adj. 妄想的，幻想的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + lus (玩耍) + -ion (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在玩(lus)，但他的想法完全脱离(de-)了现实，
    <tspan x="50" dy="25">沉浸在自己的幻想世界中，这就是妄想(delusional)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a delusional belief that everyone loved her.
  </text>
  <text x="50" y="310" class="content">
    她有一种妄想，认为每个人都爱她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Thought bubble -->
    <path d="M 100 50 Q 150 20 200 50 T 300 100" class="image" />
    <circle cx="120" cy="70" r="10" class="image" />
    <circle cx="160" cy="60" r="10" class="image" />
    <circle cx="200" cy="80" r="10" class="image" />
    <circle cx="240" cy="100" r="10" class="image" />
  </g>
</svg>