<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alongside</text>
  <text x="50" y="120" class="subtitle">[əˈlɒŋsaɪd] prep. 在...旁边，与...一起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> along (沿着) + side (旁边)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人并肩行走，"沿着(along)"
    <tspan x="50" dy="25">旁边(side)一起走，这就是"在...旁边(alongside)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She walked alongside her friend in the park.
  </text>
  <text x="50" y="310" class="content">
    她在公园里和朋友并肩行走。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Path for the road -->
    <path d="M0 100 L800 100" class="image" />
    <!-- Person 1 -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Person 2 -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="200" class="image" />
    <line x1="300" y1="160" x2="320" y2="200" class="image" />
    <line x1="300" y1="140" x2="340" y2="130" class="image" />
  </g>
</svg>