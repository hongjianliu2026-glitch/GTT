<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shamelessly</text>
  <text x="50" y="120" class="subtitle">[ˈʃeɪmlɪsli] adv. 无耻地，厚颜无耻地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shame (羞耻) + less (没有) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公共场合大声唱歌，完全不顾周围人的目光，"没有羞耻(shameless)"
    <tspan x="50" dy="25">地做着各种夸张的事情，这就是"无耻地(shamelessly)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He shamelessly flirted with his boss's wife at the party.
  </text>
  <text x="50" y="310" class="content">
    他在派对上无耻地与老板的妻子调情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person singing -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="80" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Mouth -->
    <path d="M40,55 Q50,45 60,55" class="image" />
    <!-- Surrounding people -->
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Shocked expressions -->
    <path d="M140,55 Q150,45 160,55" class="image" />
    <path d="M190,55 Q200,45 210,55" class="image" />
    <path d="M240,55 Q250,45 260,55" class="image" />
  </g>
</svg>