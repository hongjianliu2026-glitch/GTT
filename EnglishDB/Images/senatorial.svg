<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">senatorial</text>
  <text x="50" y="120" class="subtitle">[ˌsɛnəˈtɔːriəl] adj. 参议院的，参议员的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sen (老) + ator (人) + ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位年长的参议员(senator)，他坐在参议院(senate)的
    <tspan x="50" dy="25">高背椅上，代表着senatorial的权威和尊严。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The senatorial debate was intense and lasted for hours.
  </text>
  <text x="50" y="310" class="content">
    参议院的辩论非常激烈，持续了数小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Senate chair -->
    <rect x="50" y="20" width="200" height="150" class="image" />
    <!-- Elderly senator -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="120" y2="220" class="image" />
    <line x1="150" y1="180" x2="180" y2="220" class="image" />
    <line x1="150" y1="150" x2="100" y2="140" class="image" />
    <line x1="150" y1="150" x2="200" y2="140" class="image" />
  </g>
</svg>