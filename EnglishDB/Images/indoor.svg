<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indoor</text>
  <text x="50" y="120" class="subtitle">[ˈɪndɔːr] adj. 室内的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (在...里面) + door (门)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门，门里面是一个温馨的室内空间，
    <tspan x="50" dy="25">所有的活动都在这个"门内(in-door)"进行，这就是室内(indoor)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The indoor swimming pool is heated.
  </text>
  <text x="50" y="310" class="content">
    室内游泳池是加热的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Indoor space -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Furniture -->
    <rect x="70" y="50" width="50" height="50" class="image" />
    <rect x="150" y="50" width="50" height="50" class="image" />
    <rect x="230" y="50" width="50" height="50" class="image" />
    <!-- Person -->
    <circle cx="200" cy="120" r="15" class="image" />
    <line x1="200" y1="135" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="180" y2="200" class="image" />
    <line x1="200" y1="170" x2="220" y2="200" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
  </g>
</svg>