<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neat</text>
  <text x="50" y="120" class="subtitle">[nit] adj. 整洁的，干净的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ne- (不) + at (在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，所有的东西都被"不留下(ne-at)"
    <tspan x="50" dy="25">任何痕迹地整理好了，这就是整洁(neat)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She keeps her room neat and tidy.
  </text>
  <text x="50" y="310" class="content">
    她保持房间整洁干净。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bed -->
    <rect x="50" y="20" width="250" height="80" class="image" />
    <!-- Desk -->
    <rect x="70" y="120" width="200" height="60" class="image" />
    <!-- Chair -->
    <rect x="20" y="120" width="40" height="60" class="image" />
    <!-- Bookshelf -->
    <rect x="280" y="20" width="50" height="160" class="image" />
    <!-- Books -->
    <line x1="290" y1="30" x2="320" y2="30" class="image" />
    <line x1="290" y1="60" x2="320" y2="60" class="image" />
    <line x1="290" y1="90" x2="320" y2="90" class="image" />
    <line x1="290" y1="120" x2="320" y2="120" class="image" />
    <line x1="290" y1="150" x2="320" y2="150" class="image" />
  </g>
</svg>