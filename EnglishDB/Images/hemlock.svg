<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #6C3483; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hemlock</text>
  <text x="50" y="120" class="subtitle">[ˈhɛmlɑk] n. 毒芹，毒草</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hemi- (半) + lock (锁)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一株植物，"半锁(hemi-lock)"住生命，
    <tspan x="50" dy="25">它的毒性如同一把锁，锁住了生机，这就是毒芹(hemlock)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient Greeks used hemlock for executions.
  </text>
  <text x="50" y="310" class="content">
    古希腊人用毒芹执行死刑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plant stem -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <!-- Leaves -->
    <polyline points="50,150 20,120 80,120 50,150" class="image" />
    <polyline points="50,130 10,100 90,100 50,130" class="image" />
    <polyline points="50,110 0,80 100,80 50,110" class="image" />
    <!-- Poison symbol -->
    <circle cx="50" cy="180" r="20" class="image" />
    <line x1="50" y1="160" x2="50" y2="200" class="image" />
    <line x1="40" y1="180" x2="60" y2="180" class="image" />
  </g>
</svg>