<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pharmacist</text>
  <text x="50" y="120" class="subtitle">[ˈfɑːrməsɪst] n. 药剂师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pharmaco- (药物) + -ist (从事...的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个药剂师站在药房里，"调配药物(pharmaco-)"
    <tspan x="50" dy="25">，确保每种药物都准确无误，这就是药剂师(pharmacist)的工作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pharmacist carefully checked the prescription before dispensing the medication.
  </text>
  <text x="50" y="310" class="content">
    药剂师在发放药物前仔细检查了处方。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pharmacy counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pharmacist -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Medicine bottles -->
    <rect x="100" y="20" width="50" height="100" class="image" />
    <rect x="160" y="20" width="50" height="100" class="image" />
    <rect x="220" y="20" width="50" height="100" class="image" />
    <!-- Prescription -->
    <rect x="280" y="20" width="50" height="100" class="image" />
    <line x1="285" y1="30" x2="325" y2="30" class="image" />
    <line x1="285" y1="50" x2="325" y2="50" class="image" />
    <line x1="285" y1="70" x2="325" y2="70" class="image" />
  </g>
</svg>