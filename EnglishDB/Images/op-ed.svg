<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">op-ed</text>
  <text x="50" y="120" class="subtitle">[ˈɒpɪd] n. 专栏文章</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> op- (opposite) + ed (editorial)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张报纸，"对面的(op-)"
    <tspan x="50" dy="25">编辑(ed)版面"上，</tspan>
    <tspan x="50" dy="25">刊登着一篇专栏文章(op-ed)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The op-ed in today's newspaper was very insightful.
  </text>
  <text x="50" y="310" class="content">
    今天报纸上的专栏文章非常有见地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Newspaper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Opposite sides -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Editorial box -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Text inside editorial box -->
    <text x="110" y="100" class="content" style="font-size: 14px;">Op-Ed</text>
  </g>
</svg>