<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sensational</text>
  <text x="50" y="120" class="subtitle">[sɛnˈseɪʃənl] adj. 轰动的，耸人听闻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sens (感觉) + -ation (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新闻主播在电视上报道一则"耸人听闻(sensational)"
    <tspan x="50" dy="25">的新闻，观众们都被这强烈的感官刺激所震撼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was sensational, with breathtaking special effects.
  </text>
  <text x="50" y="310" class="content">
    这部电影非常轰动，特效令人叹为观止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- TV screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- News anchor -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- News headline -->
    <text x="100" y="120" class="content" style="font-size: 24px; fill: #C0392B;">BREAKING NEWS</text>
    <!-- Audience reaction -->
    <circle cx="250" cy="80" r="15" class="image" />
    <circle cx="280" cy="80" r="15" class="image" />
    <circle cx="310" cy="80" r="15" class="image" />
    <line x1="250" y1="95" x2="250" y2="120" class="image" />
    <line x1="280" y1="95" x2="280" y2="120" class="image" />
    <line x1="310" y1="95" x2="310" y2="120" class="image" />
  </g>
</svg>