<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">medicinal</text>
  <text x="50" y="120" class="subtitle">[ˌmɛdɪˈsɪnəl] adj. 药用的，有药效的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> medic (治疗) + inal (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的药瓶，里面装满了各种"治疗(medic)"的药物，
    <tspan x="50" dy="25">这些药物都具有药效(medicinal)，能够治愈各种疾病。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plant has medicinal properties and is used in traditional medicine.
  </text>
  <text x="50" y="310" class="content">
    这种植物具有药用特性，常用于传统医学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large medicine bottle -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Liquid inside the bottle -->
    <rect x="10" y="10" width="180" height="280" fill="#85C1E9" />
    <!-- Medicine pills -->
    <circle cx="50" cy="50" r="10" fill="#F1C40F" />
    <circle cx="100" cy="70" r="10" fill="#F1C40F" />
    <circle cx="150" cy="90" r="10" fill="#F1C40F" />
    <circle cx="70" cy="120" r="10" fill="#F1C40F" />
    <circle cx="120" cy="140" r="10" fill="#F1C40F" />
    <!-- Label on the bottle -->
    <text x="20" y="320" class="content" fill="#2C3E50">Medicinal</text>
  </g>
</svg>