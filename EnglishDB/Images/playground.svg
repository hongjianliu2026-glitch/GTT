<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">playground</text>
  <text x="50" y="120" class="subtitle">[ˈpleɪɡraʊnd] n. 操场，游乐场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> play (玩耍) + ground (场地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群孩子在"玩耍的场地(play-ground)"上，
    <tspan x="50" dy="25">欢声笑语，尽情享受童年的乐趣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were playing on the playground.
  </text>
  <text x="50" y="310" class="content">
    孩子们在操场上玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Playground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Swings -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="60" x2="80" y2="60" class="image" />
    <line x1="50" y1="100" x2="80" y2="100" class="image" />
    <!-- Slide -->
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <line x1="150" y1="20" x2="200" y2="20" class="image" />
    <line x1="150" y1="60" x2="180" y2="60" class="image" />
    <line x1="150" y1="100" x2="180" y2="100" class="image" />
    <!-- Children -->
    <circle cx="70" cy="120" r="10" class="image" />
    <circle cx="170" cy="120" r="10" class="image" />
    <line x1="70" y1="130" x2="70" y2="150" class="image" />
    <line x1="170" y1="130" x2="170" y2="150" class="image" />
    <line x1="70" y1="150" x2="60" y2="170" class="image" />
    <line x1="70" y1="150" x2="80" y2="170" class="image" />
    <line x1="170" y1="150" x2="160" y2="170" class="image" />
    <line x1="170" y1="150" x2="180" y2="170" class="image" />
  </g>
</svg>