<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consul</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːnsəl] n. 领事，古罗马的执政官</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + sul (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古罗马的执政官，"共同统治(con-sul)"
    <tspan x="50" dy="25">着城市，维护秩序和和平。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The consul was responsible for the city's safety.
  </text>
  <text x="50" y="310" class="content">
    这位执政官负责城市的安全。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Roman Consul -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Consul's toga -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Consul's head -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Consul's arms -->
    <line x1="175" y1="130" x2="100" y2="180" class="image" />
    <line x1="175" y1="130" x2="250" y2="180" class="image" />
    <!-- Consul's scepter -->
    <line x1="175" y1="130" x2="175" y2="200" class="image" />
    <circle cx="175" cy="200" r="10" class="image" />
  </g>
</svg>