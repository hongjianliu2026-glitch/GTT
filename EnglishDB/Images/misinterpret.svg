<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misinterpret</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsɪnˈtɜːrprɪt] v. 误解，曲解</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + interpret (解释)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在听演讲，"错误地解释(mis-interpret)"
    <tspan x="50" dy="25">演讲者的意思，结果完全理解错了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She often misinterprets his intentions.
  </text>
  <text x="50" y="310" class="content">
    她经常误解他的意图。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Speaker -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M100,100 Q150,80 200,100 Q150,120 100,100" class="image" />
    <!-- Listener -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="280" y2="220" class="image" />
    <line x1="300" y1="180" x2="320" y2="220" class="image" />
    <line x1="300" y1="150" x2="340" y2="140" class="image" />
    <!-- Confusion bubble -->
    <path d="M350,100 Q400,80 450,100 Q400,120 350,100" class="image" />
    <text x="360" y="110" class="content">?</text>
  </g>
</svg>