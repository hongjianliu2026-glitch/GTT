<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">linear</text>
  <text x="50" y="120" class="subtitle">[ˈlɪniər] adj. 线性的，直线的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> line (线) + -ar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条笔直的线，"线(line)"
    <tspan x="50" dy="25">延伸出去，形成一个"线性的(linear)"世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The growth of the company was linear over the past decade.
  </text>
  <text x="50" y="310" class="content">
    过去十年，公司的增长是线性的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Straight line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Arrowheads -->
    <polygon points="350,0 340,-10 340,10" class="image" />
    <polygon points="0,0 10,-10 10,10" class="image" />
    <!-- Dots on the line -->
    <circle cx="50" cy="0" r="5" class="image" />
    <circle cx="150" cy="0" r="5" class="image" />
    <circle cx="250" cy="0" r="5" class="image" />
    <circle cx="300" cy="0" r="5" class="image" />
  </g>
</svg>