<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intimate</text>
  <text x="50" y="120" class="subtitle">[ˈɪntɪmət] adj. 亲密的，私人的；v. 暗示，透露</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (内部) + tim (害怕) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在房间里，"内部(in-)"的氛围让他们感到"害怕(tim)"，
    <tspan x="50" dy="25">因为他们分享了太多私人的秘密，这种亲密(intimate)关系让他们既紧张又依赖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had an intimate conversation with her best friend.
  </text>
  <text x="50" y="310" class="content">
    她和她的闺蜜进行了一次亲密的谈话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Heart -->
    <path d="M150,100 C150,50 200,50 200,100 C200,150 150,150 150,100 Z" class="image" />
    <!-- Speech bubble -->
    <path d="M250,80 Q280,60 300,80 Q280,100 250,80 Z" class="image" />
    <!-- Text in speech bubble -->
    <text x="260" y="90" class="content" text-anchor="middle">秘密</text>
  </g>
</svg>