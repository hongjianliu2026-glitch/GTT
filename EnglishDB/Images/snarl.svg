<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snarl</text>
  <text x="50" y="120" class="subtitle">[snɑːrl] v. 咆哮，纠缠；n. 咆哮声，纠缠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snarl (源自中古英语 snarlen，意为咆哮)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只愤怒的狗，"咆哮(snarl)"着露出锋利的牙齿，
    <tspan x="50" dy="25">声音如同雷鸣般震撼人心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog snarled at the stranger.
  </text>
  <text x="50" y="310" class="content">
    那只狗对着陌生人咆哮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry dog -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="30" y1="50" x2="70" y2="50" class="image" /> <!-- Mouth -->
    <line x1="40" y1="40" x2="40" y2="60" class="image" /> <!-- Tooth -->
    <line x1="60" y1="40" x2="60" y2="60" class="image" /> <!-- Tooth -->
    <line x1="50" y1="80" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="150" class="image" /> <!-- Leg -->
    <line x1="50" y1="120" x2="70" y2="150" class="image" /> <!-- Leg -->
    <line x1="50" y1="100" x2="30" y2="110" class="image" /> <!-- Tail -->
    <line x1="50" y1="100" x2="70" y2="110" class="image" /> <!-- Tail -->
  </g>
</svg>