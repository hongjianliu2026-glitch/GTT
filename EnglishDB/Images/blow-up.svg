<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blow-up</text>
  <text x="50" y="120" class="subtitle">[ˈbloʊˌʌp] n. 爆炸，放大照片；v. 爆炸，放大</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blow (吹) + up (向上)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球被吹得越来越大，最终"向上爆炸(blow-up)"，
    <tspan x="50" dy="25">或者一张照片被放大到极致，细节清晰可见。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The photographer made a blow-up of the winning photo.
  </text>
  <text x="50" y="310" class="content">
    摄影师放大了获奖照片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <!-- Explosion -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="80" x2="100" y2="60" class="image" />
    <line x1="120" y1="100" x2="140" y2="100" class="image" />
    <line x1="80" y1="100" x2="60" y2="100" class="image" />
    <line x1="100" y1="120" x2="100" y2="140" class="image" />
    <!-- Photo -->
    <rect x="200" y="50" width="150" height="100" class="image" />
    <line x1="220" y1="70" x2="330" y2="70" class="image" />
    <line x1="220" y1="90" x2="330" y2="90" class="image" />
    <line x1="220" y1="110" x2="330" y2="110" class="image" />
    <line x1="220" y1="130" x2="330" y2="130" class="image" />
  </g>
</svg>