<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undetected</text>
  <text x="50" y="120" class="subtitle">[ˌʌndɪˈtektɪd] adj. 未被发现的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + detect (发现)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫悄悄地穿过房间，"未被发现(un-detected)"，
    <tspan x="50" dy="25">因为它像影子一样安静。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thief managed to leave the scene undetected.
  </text>
  <text x="50" y="310" class="content">
    小偷成功地离开了现场，未被发现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="300" y="50" width="30" height="100" class="image" />
    <!-- Window -->
    <rect x="250" y="50" width="30" height="100" class="image" />
    <!-- Cat -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="35" y2="180" class="image" />
    <line x1="50" y1="150" x2="65" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Shadow -->
    <ellipse cx="50" cy="180" rx="30" ry="10" class="image" />
  </g>
</svg>