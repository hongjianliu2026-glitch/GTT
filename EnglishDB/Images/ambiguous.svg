<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ambiguous</text>
  <text x="50" y="120" class="subtitle">[æmˈbɪɡjuəs] adj. 模棱两可的，含糊不清的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ambi- (两边) + -gu- (走) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在两条路的交叉口，"两边走(ambi-gu-ous)"，
    <tspan x="50" dy="25">不知道该选择哪一条，这种状态就是模棱两可的(ambiguous)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The instructions were ambiguous, so we didn't know what to do.
  </text>
  <text x="50" y="310" class="content">
    指令含糊不清，所以我们不知道该怎么做。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crossroads -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <line x1="0" y1="125" x2="100" y2="125" class="image" />
    <!-- Person -->
    <circle cx="50" cy="125" r="15" class="image" />
    <line x1="50" y1="140" x2="50" y2="170" class="image" />
    <line x1="50" y1="170" x2="35" y2="200" class="image" />
    <line x1="50" y1="170" x2="65" y2="200" class="image" />
    <line x1="50" y1="155" x2="70" y2="145" class="image" />
  </g>
</svg>