<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dispatch</text>
  <text x="50" y="120" class="subtitle">[dɪˈspætʃ] v. 派遣，发送；n. 派遣，急件</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + patch (部分)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指挥官将部队"分开(dis-)"，"派遣(patch)"
    <tspan x="50" dy="25">到不同的战场，这就是dispatch的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company dispatched a team to handle the crisis.
  </text>
  <text x="50" y="310" class="content">
    公司派遣了一个团队来处理危机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Commander -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Soldiers -->
    <rect x="70" y="80" width="30" height="60" class="image" />
    <rect x="120" y="80" width="30" height="60" class="image" />
    <rect x="170" y="80" width="30" height="60" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <polygon points="95,200 105,200 100,210" class="image" />
    <polygon points="145,200 155,200 150,210" class="image" />
    <polygon points="195,200 205,200 200,210" class="image" />
  </g>
</svg>