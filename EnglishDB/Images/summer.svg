<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">summer</text>
  <text x="50" y="120" class="subtitle">[ˈsʌmər] n. 夏天，夏季</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sum (总和) + mer (季节)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个炎热的夏天，太阳高高挂在天空，
    <tspan x="50" dy="25">人们纷纷涌向海滩，享受阳光和海浪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We spent the summer vacation at the beach.
  </text>
  <text x="50" y="310" class="content">
    我们在海滩度过了暑假。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F39C12" />
    <!-- Beach -->
    <rect x="0" y="150" width="350" height="100" fill="#D35400" />
    <!-- Waves -->
    <path d="M0 150 Q50 130, 100 150 T200 150 T300 150" stroke="#3498DB" stroke-width="5" fill="none" />
    <!-- People -->
    <circle cx="50" cy="180" r="10" fill="#2C3E50" />
    <circle cx="100" cy="180" r="10" fill="#2C3E50" />
    <circle cx="150" cy="180" r="10" fill="#2C3E50" />
  </g>
</svg>