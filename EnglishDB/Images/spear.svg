<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spear</text>
  <text x="50" y="120" class="subtitle">[spɪər] n. 矛，枪；v. 用矛刺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sper (刺)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士手持"刺(sper)"向敌人投掷的画面，
    <tspan x="50" dy="25">那根锋利的武器就是矛(spear)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The knight wielded his spear with great skill.
  </text>
  <text x="50" y="310" class="content">
    骑士用他的矛展现了高超的技艺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spear -->
    <line x1="0" y1="0" x2="0" y2="200" class="image" />
    <polygon points="0,200 20,180 0,160 -20,180" class="image" />
    <!-- Warrior -->
    <circle cx="0" cy="250" r="20" class="image" />
    <line x1="0" y1="270" x2="0" y2="320" class="image" />
    <line x1="0" y1="320" x2="-20" y2="360" class="image" />
    <line x1="0" y1="320" x2="20" y2="360" class="image" />
    <line x1="0" y1="290" x2="40" y2="280" class="image" />
  </g>
</svg>