<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">amused</text>
  <text x="50" y="120" class="subtitle">[əˈmjuːzd] adj. 被逗乐的，感到有趣的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (使) + muse (沉思，娱乐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在看喜剧表演，"使(a-)他沉思(muse)"
    <tspan x="50" dy="25">并感到有趣，这个人就被逗乐了(amused)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were amused by the clown's antics.
  </text>
  <text x="50" y="310" class="content">
    孩子们被小丑的滑稽动作逗乐了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <!-- Smile -->
    <path d="M 60 120 Q 100 140 140 120" class="image" />
    <!-- Clown hat -->
    <path d="M 50 50 Q 100 20 150 50" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
  </g>
</svg>