<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boutique</text>
  <text x="50" y="120" class="subtitle">[buːˈtiːk] n. 精品店</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boulē (贸易) + -ique (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小巧精致的"贸易小店(boulē-ique)"，
    <tspan x="50" dy="25">里面摆满了各种独特而时尚的商品，这就是一家精品店(boutique)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves shopping at the local boutique.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在当地精品店购物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boutique store -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Store front -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Window display -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Clothing items -->
    <circle cx="100" cy="60" r="10" class="image" />
    <circle cx="150" cy="60" r="10" class="image" />
    <circle cx="200" cy="60" r="10" class="image" />
    <circle cx="250" cy="60" r="10" class="image" />
    <!-- Sign -->
    <text x="150" y="190" class="content" style="font-size: 24px; fill: #C0392B;">Boutique</text>
  </g>
</svg>