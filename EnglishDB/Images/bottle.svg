<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bottle</text>
  <text x="50" y="120" class="subtitle">[ˈbɒtl] n. 瓶子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bot (树) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的树(bot)，被砍下后制成了一个小(le)容器，
    <tspan x="50" dy="25">这个容器就是我们今天所说的瓶子(bottle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She filled the bottle with water.
  </text>
  <text x="50" y="310" class="content">
    她把瓶子装满了水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="25" y="200" width="50" height="20" class="image" />
    <circle cx="50" cy="20" r="20" class="image" />
    <!-- Tree -->
    <line x1="150" y1="200" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="130" y2="70" class="image" />
    <line x1="150" y1="50" x2="170" y2="70" class="image" />
    <line x1="150" y1="50" x2="140" y2="30" class="image" />
    <line x1="150" y1="50" x2="160" y2="30" class="image" />
  </g>
</svg>