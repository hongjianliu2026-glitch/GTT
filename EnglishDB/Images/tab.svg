<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tab</text>
  <text x="50" y="120" class="subtitle">[tæb] n. 标签，制表键</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tab (标签)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个文件夹上贴满了各种"标签(tab)"，
    <tspan x="50" dy="25">每个标签都代表不同的文件内容，方便查找。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Press the tab key to move to the next field.
  </text>
  <text x="50" y="310" class="content">
    按下Tab键移动到下一个字段。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Folder -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Tabs -->
    <rect x="20" y="20" width="260" height="40" class="image" />
    <rect x="20" y="80" width="260" height="40" class="image" />
    <rect x="20" y="140" width="260" height="40" class="image" />
    <!-- Tab labels -->
    <text x="30" y="50" class="content">Documents</text>
    <text x="30" y="110" class="content">Photos</text>
    <text x="30" y="170" class="content">Videos</text>
  </g>
</svg>