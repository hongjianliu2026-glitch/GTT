<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disaster</text>
  <text x="50" y="120" class="subtitle">[dɪˈzɑːstər] n. 灾难，不幸事件</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + aster (星)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗星星"不(dis-)"再闪耀，"星(aster)"
    <tspan x="50" dy="25">星坠落，带来了一场灾难(disaster)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hurricane caused a disaster in the coastal town.
  </text>
  <text x="50" y="310" class="content">
    飓风给沿海小镇带来了灾难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Falling star -->
    <line x1="50" y1="0" x2="150" y2="150" class="image" />
    <circle cx="50" cy="0" r="10" class="image" />
    <!-- Crashed star -->
    <circle cx="150" cy="150" r="20" class="image" />
    <!-- Explosion -->
    <circle cx="150" cy="150" r="30" class="image" stroke-dasharray="5,5" />
    <circle cx="150" cy="150" r="40" class="image" stroke-dasharray="5,5" />
    <circle cx="150" cy="150" r="50" class="image" stroke-dasharray="5,5" />
  </g>
</svg>