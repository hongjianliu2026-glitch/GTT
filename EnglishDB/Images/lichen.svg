<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lichen { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lichen</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪkən] n. 地衣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lichen (地衣)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片古老的石头上，"地衣(lichen)"
    <tspan x="50" dy="25">像绿色的苔藓一样覆盖着，形成了一层自然的保护膜。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lichen on the rock created a unique pattern.
  </text>
  <text x="50" y="310" class="content">
    岩石上的地衣形成了一种独特的图案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rock -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lichen -->
    <circle cx="50" cy="50" r="20" class="lichen" />
    <circle cx="100" cy="70" r="25" class="lichen" />
    <circle cx="150" cy="90" r="30" class="lichen" />
    <circle cx="200" cy="110" r="25" class="lichen" />
    <circle cx="250" cy="130" r="20" class="lichen" />
    <circle cx="300" cy="150" r="15" class="lichen" />
  </g>
</svg>