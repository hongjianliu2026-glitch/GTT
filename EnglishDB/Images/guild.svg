<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">guild</text>
  <text x="50" y="120" class="subtitle">[ɡɪld] n. 行会，协会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gild (镀金) + -ed (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群工匠，他们为了共同的目标聚集在一起，
    <tspan x="50" dy="25">形成了一个"镀金(gild)"的组织，这个组织就是行会(guild)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The blacksmiths formed a guild to protect their trade secrets.
  </text>
  <text x="50" y="310" class="content">
    铁匠们成立了一个行会来保护他们的行业秘密。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Guild Hall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Windows -->
    <rect x="50" y="50" width="50" height="50" class="image" />
    <rect x="250" y="50" width="50" height="50" class="image" />
    <!-- Roof -->
    <polygon points="0,0 350,0 175,100" class="image" />
    <!-- People -->
    <circle cx="70" cy="150" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="130" cy="150" r="10" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
    <circle cx="230" cy="150" r="10" class="image" />
    <circle cx="260" cy="150" r="10" class="image" />
  </g>
</svg>