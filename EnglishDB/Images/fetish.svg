<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fetish</text>
  <text x="50" y="120" class="subtitle">[ˈfɛtɪʃ] n. 恋物，迷信</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fet- (脚) + -ish (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人对鞋子(fet-)有着极端的迷恋，甚至到了迷信的程度，
    <tspan x="50" dy="25">这种迷恋就变成了恋物(fetish)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a fetish for high-heeled shoes.
  </text>
  <text x="50" y="310" class="content">
    她对高跟鞋有着恋物癖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shoe -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <rect x="20" y="20" width="160" height="60" class="image" />
    <line x1="40" y1="40" x2="160" y2="40" class="image" />
    <line x1="40" y1="60" x2="160" y2="60" class="image" />
    <line x1="40" y1="80" x2="160" y2="80" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Heart -->
    <path d="M100,250 C100,230 130,230 130,250 C130,270 100,270 100,250 Z" class="image" />
  </g>
</svg>