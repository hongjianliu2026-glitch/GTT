<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">permanently</text>
  <text x="50" y="120" class="subtitle">[ˈpɜːrmənəntli] adv. 永久地，持久地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + man (保持) + -ent (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一座"完全保持(per-man)"不动的山上，
    <tspan x="50" dy="25">这座山象征着永恒，这个人就"永久地(permanently)"站在那里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to live permanently in the countryside.
  </text>
  <text x="50" y="310" class="content">
    她决定永久地住在乡下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Person -->
    <circle cx="150" cy="180" r="15" class="image" />
    <line x1="150" y1="195" x2="150" y2="230" class="image" />
    <line x1="150" y1="230" x2="130" y2="260" class="image" />
    <line x1="150" y1="230" x2="170" y2="260" class="image" />
    <line x1="150" y1="210" x2="120" y2="200" class="image" />
    <line x1="150" y1="210" x2="180" y2="200" class="image" />
  </g>
</svg>