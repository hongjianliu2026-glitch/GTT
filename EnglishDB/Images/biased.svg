<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">biased</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪəst] adj. 有偏见的，偏袒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (两个) + as (朝向) + ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在两个方向之间，"偏向(bi-as)"
    <tspan x="50" dy="25">某一边，表现出偏见(biased)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge was accused of being biased towards the defendant.
  </text>
  <text x="50" y="310" class="content">
    法官被指控对被告有偏见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="140" x2="60" y2="160" class="image" />
    <line x1="100" y1="140" x2="140" y2="160" class="image" />
    <!-- Arrows -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="140" y2="90" class="image" />
    <line x1="150" y1="100" x2="140" y2="110" class="image" />
    <line x1="50" y1="100" x2="60" y2="90" class="image" />
    <line x1="50" y1="100" x2="60" y2="110" class="image" />
    <!-- Bias indicator -->
    <line x1="100" y1="100" x2="130" y2="100" class="image" stroke-dasharray="5,5" />
  </g>
</svg>