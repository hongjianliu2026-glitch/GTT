<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .thistle { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thistle</text>
  <text x="50" y="120" class="subtitle">[ˈθɪsəl] n. 蓟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thist (刺) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小刺球(thist-le)，它长满了尖刺，
    <tspan x="50" dy="25">就像一个微型的刺猬，这就是蓟(thistle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The field was full of thistles.
  </text>
  <text x="50" y="310" class="content">
    田野里长满了蓟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thistle plant -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Thistle head -->
    <circle cx="175" cy="100" r="50" class="thistle" />
    <!-- Thistle spines -->
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <line x1="150" y1="75" x2="200" y2="125" class="image" />
    <line x1="150" y1="125" x2="200" y2="75" class="image" />
    <line x1="125" y1="100" x2="225" y2="100" class="image" />
    <!-- Thistle stem -->
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
  </g>
</svg>