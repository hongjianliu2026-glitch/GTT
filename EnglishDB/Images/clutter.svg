<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clutter</text>
  <text x="50" y="120" class="subtitle">[ˈklʌtər] n. 杂乱，混乱；v. 使杂乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clud (关闭) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，所有的东西都被"关闭(clud)"在一起，
    <tspan x="50" dy="25">形成了一片杂乱(clutter)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was cluttered with old newspapers and magazines.
  </text>
  <text x="50" y="310" class="content">
    房间里堆满了旧报纸和杂志。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cluttered items -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="50" y="90" width="50" height="50" class="image" />
    <rect x="120" y="90" width="50" height="50" class="image" />
    <rect x="190" y="90" width="50" height="50" class="image" />
    <!-- Overlapping items -->
    <rect x="80" y="50" width="50" height="50" class="image" />
    <rect x="150" y="50" width="50" height="50" class="image" />
    <rect x="80" y="120" width="50" height="50" class="image" />
    <rect x="150" y="120" width="50" height="50" class="image" />
  </g>
</svg>