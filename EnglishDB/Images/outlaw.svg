<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outlaw</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtlɔː] n. 逃犯，歹徒；v. 宣布…为不合法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (外面) + law (法律)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个逃犯在法律之外("外面(out)" + "法律(law)")，
    <tspan x="50" dy="25">他是一个被法律追捕的"逃犯(outlaw)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police are searching for the outlaw who escaped from prison.
  </text>
  <text x="50" y="310" class="content">
    警察正在搜捕那个从监狱逃脱的逃犯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Outlaw -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Law symbol -->
    <rect x="150" y="80" width="100" height="100" class="image" />
    <line x1="150" y1="80" x2="250" y2="180" class="image" />
    <line x1="250" y1="80" x2="150" y2="180" class="image" />
    <!-- Outlaw running away -->
    <line x1="50" y1="220" x2="150" y2="320" class="image" />
    <line x1="50" y1="220" x2="150" y2="300" class="image" />
  </g>
</svg>