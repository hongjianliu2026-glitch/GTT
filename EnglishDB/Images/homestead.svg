<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">homestead</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊmstɛd] n. 家园，农庄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> home (家) + stead (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温馨的家园(home)，坐落在一片宁静的农庄(stead)上，
    <tspan x="50" dy="25">四周环绕着绿油油的田野和果树，这就是一个homestead。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They built a homestead in the countryside.
  </text>
  <text x="50" y="310" class="content">
    他们在乡下建了一个家园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- House -->
    <rect x="50" y="50" width="200" height="150" class="image" />
    <polygon points="50,50 250,50 150,0" class="image" />
    <!-- Door -->
    <rect x="130" y="150" width="40" height="50" class="image" />
    <!-- Windows -->
    <rect x="80" y="70" width="40" height="40" class="image" />
    <rect x="180" y="70" width="40" height="40" class="image" />
    <!-- Fence -->
    <line x1="50" y1="220" x2="250" y2="220" class="image" />
    <line x1="50" y1="230" x2="250" y2="230" class="image" />
    <line x1="50" y1="240" x2="250" y2="240" class="image" />
    <line x1="50" y1="250" x2="250" y2="250" class="image" />
    <!-- Trees -->
    <circle cx="30" cy="180" r="20" class="image" />
    <circle cx="270" cy="180" r="20" class="image" />
    <line x1="30" y1="200" x2="30" y2="220" class="image" />
    <line x1="270" y1="200" x2="270" y2="220" class="image" />
  </g>
</svg>