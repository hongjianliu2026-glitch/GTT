<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7FF; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dreaming</text>
  <text x="50" y="120" class="subtitle">[ˈdriːmɪŋ] n. 梦想，幻想；v. 做梦，想象</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dream (梦) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在床上，闭着眼睛，"正在做梦(dream-ing)"，
    <tspan x="50" dy="25">他的脑海中充满了五彩斑斓的幻想和梦想。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spends her nights dreaming of faraway places.
  </text>
  <text x="50" y="310" class="content">
    她晚上总是梦想着遥远的地方。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person sleeping -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="125" y2="140" class="image" />
    <line x1="175" y1="150" x2="225" y2="140" class="image" />
    <!-- Dream bubbles -->
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <circle cx="175" cy="20" r="20" class="image" />
  </g>
</svg>