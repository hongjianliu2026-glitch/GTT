<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-time</text>
  <text x="50" y="120" class="subtitle">[θriːtaɪm] adj. 三次的，三倍的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + time (次)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在比赛中，"三次(three)"
    <tspan x="50" dy="25">赢得冠军，这就是一个"三倍的(three-time)"胜利。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a three-time Olympic champion.
  </text>
  <text x="50" y="310" class="content">
    他是一位三次获得奥运冠军的选手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Three medals -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Athlete -->
    <circle cx="150" cy="150" r="30" class="image" />
    <line x1="150" y1="180" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="120" y2="300" class="image" />
    <line x1="150" y1="250" x2="180" y2="300" class="image" />
    <line x1="150" y1="200" x2="100" y2="220" class="image" />
    <line x1="150" y1="200" x2="200" y2="220" class="image" />
  </g>
</svg>