<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three</text>
  <text x="50" y="120" class="subtitle">[θriː] n. 三</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thri- (三)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师变出了三个球，"三(thri-)"
    <tspan x="50" dy="25">个球在空中旋转，形成了一个完美的三角形。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has three cats at home.
  </text>
  <text x="50" y="310" class="content">
    她家里有三只猫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Three balls -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="120" cy="50" r="20" class="image" />
    <circle cx="85" cy="100" r="20" class="image" />
    <!-- Triangle -->
    <line x1="50" y1="50" x2="120" y2="50" class="image" />
    <line x1="120" y1="50" x2="85" y2="100" class="image" />
    <line x1="85" y1="100" x2="50" y2="50" class="image" />
  </g>
</svg>