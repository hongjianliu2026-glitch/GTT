<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wolf</text>
  <text x="50" y="120" class="subtitle">[wʊlf] n. 狼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *wulfaz，意为“狼”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狼在月光下嚎叫，它的身影在雪地中显得格外凶猛。
    <tspan x="50" dy="25">这只狼(wolf)正准备捕猎，它的眼神充满了野性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wolf howled at the full moon.
  </text>
  <text x="50" y="310" class="content">
    狼对着满月嚎叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="175" cy="100" r="50" fill="#F1C40F" />
    <!-- Wolf -->
    <path d="M100,200 C120,150 180,150 200,200" stroke="#7F8C8D" stroke-width="10" fill="none" />
    <circle cx="150" cy="200" r="20" fill="#7F8C8D" />
    <line x1="150" y1="220" x2="150" y2="250" stroke="#7F8C8D" stroke-width="10" />
    <line x1="150" y1="250" x2="130" y2="280" stroke="#7F8C8D" stroke-width="10" />
    <line x1="150" y1="250" x2="170" y2="280" stroke="#7F8C8D" stroke-width="10" />
    <line x1="150" y1="230" x2="120" y2="220" stroke="#7F8C8D" stroke-width="10" />
    <line x1="150" y1="230" x2="180" y2="220" stroke="#7F8C8D" stroke-width="10" />
  </g>
</svg>