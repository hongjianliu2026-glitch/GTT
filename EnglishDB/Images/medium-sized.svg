<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">medium-sized</text>
  <text x="50" y="120" class="subtitle">[ˈmiːdiəm saɪzd] adj. 中等大小的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> medium (中间) + sized (尺寸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体，它既不大也不小，正好处于"中间(medium)"的尺寸，
    <tspan x="50" dy="25">这就是中等大小(medium-sized)的物体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store sells medium-sized furniture.
  </text>
  <text x="50" y="310" class="content">
    这家商店出售中等大小的家具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small object -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Medium-sized object -->
    <rect x="100" y="80" width="80" height="40" class="image" />
    <!-- Large object -->
    <circle cx="250" cy="100" r="40" class="image" />
    <!-- Arrows -->
    <line x1="70" y1="130" x2="180" y2="130" class="image" />
    <line x1="180" y1="130" x2="270" y2="130" class="image" />
    <polygon points="175,125 185,130 175,135" class="image" />
    <polygon points="265,125 275,130 265,135" class="image" />
    <!-- Labels -->
    <text x="40" y="160" class="content">Small</text>
    <text x="130" y="160" class="content">Medium-sized</text>
    <text x="240" y="160" class="content">Large</text>
  </g>
</svg>