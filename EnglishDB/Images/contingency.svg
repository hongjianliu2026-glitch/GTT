<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contingency</text>
  <text x="50" y="120" class="subtitle">[kənˈtɪndʒənsi] n. 意外事件，偶然性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + ting (接触) + -ency (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个计划中，"共同接触(con-ting)"
    <tspan x="50" dy="25">到各种意外情况，这些情况就构成了一个意外事件(contingency)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They prepared a contingency plan for any unexpected delays.
  </text>
  <text x="50" y="310" class="content">
    他们为任何意外的延迟准备了一个应急计划。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <!-- Wheel -->
    <circle cx="70" cy="80" r="15" class="image" />
    <circle cx="130" cy="80" r="15" class="image" />
    <!-- Traffic light -->
    <rect x="200" y="20" width="50" height="100" class="image" />
    <circle cx="225" cy="50" r="15" class="image" fill="#E74C3C" />
    <!-- Question mark -->
    <text x="280" y="80" class="image" font-size="60" fill="#34495E">?</text>
  </g>
</svg>