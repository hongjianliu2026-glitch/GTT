<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abortion</text>
  <text x="50" y="120" class="subtitle">[əˈbɔːrʃn] n. 流产，堕胎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + or (生长) + -tion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个生命在"生长(or)"的过程中，
    <tspan x="50" dy="25">"离开(ab-)"了母体，这就是流产(abortion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor advised her to have an abortion due to health risks.
  </text>
  <text x="50" y="310" class="content">
    医生建议她进行堕胎，因为存在健康风险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother figure -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="180" class="image" />
    <line x1="50" y1="160" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />

    <!-- Baby figure -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="150" y1="135" x2="130" y2="145" class="image" />
    <line x1="150" y1="135" x2="170" y2="145" class="image" />

    <!-- Arrow indicating separation -->
    <line x1="100" y1="100" x2="140" y2="100" class="image" />
    <polygon points="140,100 135,95 135,105" class="image" />
  </g>
</svg>