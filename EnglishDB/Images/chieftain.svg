<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chieftain</text>
  <text x="50" y="120" class="subtitle">[ˈtʃiːftən] n. 酋长，首领</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chief (主要的) + tain (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个部落中，"主要的(chief)"
    <tspan x="50" dy="25">人物站在高处，指挥着族人，</tspan>
    <tspan x="50" dy="25">他就是酋长(chieftain)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chieftain led his tribe through the forest.
  </text>
  <text x="50" y="310" class="content">
    酋长带领他的部落穿过森林。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chief -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="100" class="image" />
    <line x1="50" y1="90" x2="80" y2="100" class="image" />
    <!-- Tribal members -->
    <circle cx="150" cy="50" r="10" class="image" />
    <line x1="150" y1="60" x2="150" y2="80" class="image" />
    <line x1="150" y1="80" x2="140" y2="100" class="image" />
    <line x1="150" y1="80" x2="160" y2="100" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <line x1="200" y1="60" x2="200" y2="80" class="image" />
    <line x1="200" y1="80" x2="190" y2="100" class="image" />
    <line x1="200" y1="80" x2="210" y2="100" class="image" />
    <!-- Ground -->
    <line x1="0" y1="160" x2="300" y2="160" class="image" />
  </g>
</svg>