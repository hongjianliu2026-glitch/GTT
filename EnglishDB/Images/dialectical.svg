<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dialectical</text>
  <text x="50" y="120" class="subtitle">[ˌdaɪəˈlektɪkl] adj. 辩证的，方言的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dia- (通过) + lect (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在激烈辩论，"通过选择(dia-lect)"
    <tspan x="50" dy="25">不同的观点，进行辩证(dialectical)的交流。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The professor used a dialectical approach to teach the class.
  </text>
  <text x="50" y="310" class="content">
    教授采用辩证的方法来授课。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people debating -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <line x1="70" y1="100" x2="70" y2="150" class="image" />
    <line x1="230" y1="100" x2="230" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <line x1="230" y1="150" x2="210" y2="180" class="image" />
    <line x1="230" y1="150" x2="250" y2="180" class="image" />
    <!-- Speech bubbles -->
    <path d="M100,50 Q150,20 200,50 Q150,80 100,50" class="image" />
    <path d="M200,50 Q250,20 300,50 Q250,80 200,50" class="image" />
  </g>
</svg>