<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mink</text>
  <text x="50" y="120" class="subtitle">[mɪŋk] n. 貂，貂皮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语“minke”，可能来自斯堪的纳维亚语。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只貂（mink）在雪地里奔跑，它的皮毛闪闪发光，
    <tspan x="50" dy="25">就像一件珍贵的貂皮大衣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a coat made of mink to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件貂皮大衣去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowy background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#E5E8E8" />
    <!-- Mink -->
    <circle cx="100" cy="100" r="30" class="image" fill="#A9CCE3" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="130" class="image" />
    <line x1="100" y1="150" x2="130" y2="130" class="image" />
    <line x1="100" y1="180" x2="80" y2="200" class="image" />
    <line x1="100" y1="180" x2="120" y2="200" class="image" />
    <!-- Fur texture -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" stroke-dasharray="5,5" />
    <line x1="75" y1="110" x2="125" y2="110" class="image" stroke-dasharray="5,5" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" stroke-dasharray="5,5" />
  </g>
</svg>