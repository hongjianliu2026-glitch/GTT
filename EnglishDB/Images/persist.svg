<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">persist</text>
  <text x="50" y="120" class="subtitle">[pərˈsɪst] v. 坚持，持续</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + sist (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在风雨中"完全站立(per-sist)"，
    <tspan x="50" dy="25">无论环境多么恶劣，他都坚持不倒，这就是坚持(persist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Despite the difficulties, she persisted in her studies.
  </text>
  <text x="50" y="310" class="content">
    尽管困难重重，她仍然坚持学习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Rain -->
    <line x1="10" y1="50" x2="20" y2="60" class="image" />
    <line x1="30" y1="50" x2="40" y2="60" class="image" />
    <line x1="50" y1="50" x2="60" y2="60" class="image" />
    <line x1="70" y1="50" x2="80" y2="60" class="image" />
    <line x1="90" y1="50" x2="100" y2="60" class="image" />
    <!-- Wind -->
    <line x1="10" y1="30" x2="20" y2="40" class="image" />
    <line x1="30" y1="30" x2="40" y2="40" class="image" />
    <line x1="50" y1="30" x2="60" y2="40" class="image" />
    <line x1="70" y1="30" x2="80" y2="40" class="image" />
    <line x1="90" y1="30" x2="100" y2="40" class="image" />
  </g>
</svg>