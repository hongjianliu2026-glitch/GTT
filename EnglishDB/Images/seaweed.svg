<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .seaweed { fill: #1ABC9C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seaweed</text>
  <text x="50" y="120" class="subtitle">[ˈsiːwiːd] n. 海藻，海草</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sea (海) + weed (草)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的海洋，"海(sea)"中漂浮着"草(weed)"，
    <tspan x="50" dy="25">这些草就是海藻(seaweed)，它们在海浪中摇曳生姿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The divers collected various types of seaweed from the ocean floor.
  </text>
  <text x="50" y="310" class="content">
    潜水员从海底收集了各种类型的海藻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Seaweed -->
    <path d="M50,100 Q70,50 90,100 T130,100 T170,100 T210,100 T250,100 T290,100 T330,100" class="seaweed" />
    <path d="M50,120 Q70,70 90,120 T130,120 T170,120 T210,120 T250,120 T290,120 T330,120" class="seaweed" />
    <path d="M50,140 Q70,90 90,140 T130,140 T170,140 T210,140 T250,140 T290,140 T330,140" class="seaweed" />
  </g>
</svg>