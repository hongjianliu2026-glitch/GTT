<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feature</text>
  <text x="50" y="120" class="subtitle">[ˈfiːtʃə(r)] n. 特征，特点；v. 以...为特色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> feat (做) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"做(feat)"字，它像一个超级英雄一样，
    <tspan x="50" dy="25">站在一个产品旁边，展示它的"特征(feature)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new model features a larger screen and better battery life.
  </text>
  <text x="50" y="310" class="content">
    新款机型以更大的屏幕和更长的电池续航时间为特色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Product -->
    <rect x="50" y="50" width="200" height="150" class="image" />
    <!-- Superhero "feat" -->
    <text x="100" y="150" class="image" style="font: bold 60px sans-serif; fill: #E74C3C;">feat</text>
    <!-- Arrow -->
    <line x1="150" y1="150" x2="150" y2="220" class="image" />
    <polygon points="145,220 155,220 150,230" class="image" />
  </g>
</svg>