<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">farmer</text>
  <text x="50" y="120" class="subtitle">[ˈfɑːrmər] n. 农民，农场主</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> farm (农场) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农民在广阔的田野上，"耕种(farm)"
    <tspan x="50" dy="25">着他的土地，他就是农场的主人(farmer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer works hard to grow crops.
  </text>
  <text x="50" y="310" class="content">
    农民努力种植庄稼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Farmer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Crops -->
    <line x1="120" y1="180" x2="120" y2="140" class="image" />
    <line x1="150" y1="180" x2="150" y2="130" class="image" />
    <line x1="180" y1="180" x2="180" y2="150" class="image" />
    <line x1="210" y1="180" x2="210" y2="160" class="image" />
    <line x1="240" y1="180" x2="240" y2="170" class="image" />
  </g>
</svg>