<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glean</text>
  <text x="50" y="120" class="subtitle">[ɡliːn] v. 收集，拾取</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gleans (拾取)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农民在田地里，"拾取(glean)"
    <tspan x="50" dy="25">掉落的谷物，这些谷物就是他收集的粮食。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent the afternoon gleaning information from various sources.
  </text>
  <text x="50" y="310" class="content">
    她花了一个下午从各种来源收集信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Farmer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Wheat -->
    <line x1="120" y1="180" x2="120" y2="140" class="image" />
    <line x1="130" y1="180" x2="130" y2="130" class="image" />
    <line x1="140" y1="180" x2="140" y2="150" class="image" />
    <line x1="150" y1="180" x2="150" y2="160" class="image" />
    <!-- Basket -->
    <rect x="200" y="140" width="80" height="60" class="image" />
    <line x1="200" y1="140" x2="280" y2="140" class="image" />
    <line x1="200" y1="170" x2="280" y2="170" class="image" />
    <line x1="200" y1="200" x2="280" y2="200" class="image" />
  </g>
</svg>