<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">geographically</text>
  <text x="50" y="120" class="subtitle">[ˌdʒiːəˈɡræfɪkli] adv. 地理上地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> geo- (地球) + graph (写) + -ical (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在地球上，"写下(graph)"
    <tspan x="50" dy="25">关于地球(geo)的描述，这些描述就构成了地理(geographical)的叙述。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city is geographically located near the coast.
  </text>
  <text x="50" y="310" class="content">
    这座城市地理上位于海岸附近。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Continents -->
    <path d="M 20 100 Q 50 50 100 20 Q 150 50 180 100 Q 150 150 100 180 Q 50 150 20 100" class="image" />
    <!-- Explorer -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="90" y2="180" class="image" />
    <line x1="100" y1="150" x2="110" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
  </g>
</svg>