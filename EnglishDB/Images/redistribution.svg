<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">redistribution</text>
  <text x="50" y="120" class="subtitle">[ˌriːdɪstrɪˈbjuːʃn] n. 重新分配，再分配</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + distribute (分配)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的仓库，里面堆满了各种物品。
    <tspan x="50" dy="25">一群工人正在将这些物品重新分配(re-distribute)到不同的区域，</tspan>
    <tspan x="50" dy="25">确保每个区域都能得到合适的物品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government plans to implement a redistribution of wealth.
  </text>
  <text x="50" y="310" class="content">
    政府计划实施财富的重新分配。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warehouse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Items -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Workers -->
    <circle cx="75" cy="100" r="15" class="image" />
    <line x1="75" y1="115" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="60" y2="180" class="image" />
    <line x1="75" y1="150" x2="90" y2="180" class="image" />
    <line x1="75" y1="130" x2="100" y2="120" class="image" />
    <circle cx="145" cy="100" r="15" class="image" />
    <line x1="145" y1="115" x2="145" y2="150" class="image" />
    <line x1="145" y1="150" x2="130" y2="180" class="image" />
    <line x1="145" y1="150" x2="160" y2="180" class="image" />
    <line x1="145" y1="130" x2="170" y2="120" class="image" />
    <circle cx="215" cy="100" r="15" class="image" />
    <line x1="215" y1="115" x2="215" y2="150" class="image" />
    <line x1="215" y1="150" x2="200" y2="180" class="image" />
    <line x1="215" y1="150" x2="230" y2="180" class="image" />
    <line x1="215" y1="130" x2="240" y2="120" class="image" />
  </g>
</svg>