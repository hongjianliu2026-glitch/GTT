<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fable</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪbl] n. 寓言，神话</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fabl (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的智者，坐在火堆旁，"讲述(fabl)"
    <tspan x="50" dy="25">一个关于动物的寓言故事，这些故事代代相传，</tspan>
    <tspan x="50" dy="25">成为了我们今天所知的寓言(fable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher read the fable of the tortoise and the hare to the class.
  </text>
  <text x="50" y="310" class="content">
    老师给全班同学读了龟兔赛跑的寓言。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="50" cy="100" r="20" class="image" fill="#FFA07A" />
    <circle cx="70" cy="120" r="25" class="image" fill="#FF6347" />
    <circle cx="90" cy="140" r="30" class="image" fill="#FF4500" />
    <!-- Old man -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="190" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Animal -->
    <circle cx="220" cy="100" r="15" class="image" />
    <line x1="220" y1="115" x2="220" y2="150" class="image" />
    <line x1="220" y1="150" x2="200" y2="180" class="image" />
    <line x1="220" y1="150" x2="240" y2="180" class="image" />
    <line x1="220" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>