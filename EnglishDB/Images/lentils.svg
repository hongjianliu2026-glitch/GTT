<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lentils</text>
  <text x="50" y="120" class="subtitle">[ˈlɛntlɪz] n. 小扁豆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lentil (小扁豆) + -s (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的碗里装满了小扁豆(lentils)，
    <tspan x="50" dy="25">每一颗都像小宝石一样闪闪发光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cooked a delicious lentil soup for dinner.
  </text>
  <text x="50" y="310" class="content">
    她为晚餐煮了一碗美味的小扁豆汤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="150" rx="150" ry="70" class="image" />
    <!-- Lentils -->
    <circle cx="75" cy="100" r="10" class="image" />
    <circle cx="125" cy="120" r="10" class="image" />
    <circle cx="175" cy="140" r="10" class="image" />
    <circle cx="225" cy="120" r="10" class="image" />
    <circle cx="275" cy="100" r="10" class="image" />
    <!-- Glowing effect -->
    <circle cx="75" cy="100" r="15" class="image" fill="none" stroke-width="1" stroke="#FFD700" opacity="0.5" />
    <circle cx="125" cy="120" r="15" class="image" fill="none" stroke-width="1" stroke="#FFD700" opacity="0.5" />
    <circle cx="175" cy="140" r="15" class="image" fill="none" stroke-width="1" stroke="#FFD700" opacity="0.5" />
    <circle cx="225" cy="120" r="15" class="image" fill="none" stroke-width="1" stroke="#FFD700" opacity="0.5" />
    <circle cx="275" cy="100" r="15" class="image" fill="none" stroke-width="1" stroke="#FFD700" opacity="0.5" />
  </g>
</svg>