<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">troublesome</text>
  <text x="50" y="120" class="subtitle">[ˈtrʌblsəm] adj. 麻烦的，棘手的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trouble (麻烦) + -some (形容词后缀，表示“充满...的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满麻烦的场景，"麻烦(trouble)"
    <tspan x="50" dy="25">无处不在，让人感到棘手(troublesome)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The broken pipe was a troublesome issue for the homeowner.
  </text>
  <text x="50" y="310" class="content">
    破裂的水管对房主来说是个棘手的问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken pipe -->
    <line x1="0" y1="0" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="400" y2="200" class="image" />
    <line x1="400" y1="200" x2="600" y2="0" class="image" />
    <!-- Water drops -->
    <circle cx="250" cy="150" r="10" class="image" />
    <circle cx="350" cy="150" r="10" class="image" />
    <circle cx="450" cy="150" r="10" class="image" />
    <!-- Homeowner -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="100" y2="120" class="image" />
  </g>
</svg>