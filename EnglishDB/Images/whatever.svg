<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whatever</text>
  <text x="50" y="120" class="subtitle">[wʌtˈevər] pron. 无论什么，任何事物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> what (什么) + ever (曾经)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师在舞台上，"无论什么(what-ever)"
    <tspan x="50" dy="25">他都能变出来，从兔子到汽车，无所不能。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You can choose whatever you like.
  </text>
  <text x="50" y="310" class="content">
    你可以选择任何你喜欢的东西。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Hat -->
    <rect x="0" y="80" width="40" height="20" class="image" />
    <!-- Rabbit -->
    <circle cx="70" cy="100" r="10" class="image" />
    <line x1="70" y1="110" x2="70" y2="140" class="image" />
    <line x1="70" y1="140" x2="60" y2="170" class="image" />
    <line x1="70" y1="140" x2="80" y2="170" class="image" />
    <line x1="70" y1="120" x2="90" y2="110" class="image" />
    <!-- Car -->
    <rect x="100" y="90" width="60" height="30" class="image" />
    <rect x="110" y="100" width="40" height="10" class="image" />
    <circle cx="120" cy="130" r="10" class="image" />
    <circle cx="160" cy="130" r="10" class="image" />
  </g>
</svg>