<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">serotonin</text>
  <text x="50" y="120" class="subtitle">[ˌsɛrəˈtoʊnɪn] n. 血清素</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sero- (血清) + ton (紧张) + -in (化学物质后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满活力的早晨，"血清(sero-)"中充满了"紧张(ton)"的能量，
    <tspan x="50" dy="25">这种能量就是血清素(serotonin)，它让你感到快乐和满足。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Exercise can increase serotonin levels in the brain.
  </text>
  <text x="50" y="310" class="content">
    运动可以增加大脑中的血清素水平。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blood vessel -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Serotonin molecules -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Happy face -->
    <circle cx="175" cy="150" r="20" class="image" />
    <circle cx="165" cy="145" r="5" class="image" />
    <circle cx="185" cy="145" r="5" class="image" />
    <path d="M165 160 Q175 170 185 160" class="image" />
  </g>
</svg>