<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">band</text>
  <text x="50" y="120" class="subtitle">[bænd] n. 乐队，带子；v. 用带子捆扎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> band (捆绑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群音乐家被"捆绑(band)"在一起，
    <tspan x="50" dy="25">共同演奏出美妙的音乐，这就是乐队(band)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The band played a lively tune at the concert.
  </text>
  <text x="50" y="310" class="content">
    乐队在音乐会上演奏了一首欢快的曲子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Band members -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Instruments -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <!-- Music notes -->
    <path d="M50 110 Q70 130 90 110" class="image" />
    <path d="M150 110 Q170 130 190 110" class="image" />
    <path d="M250 110 Q270 130 290 110" class="image" />
  </g>
</svg>