<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">artifact</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrtɪfækt] n. 人工制品，手工艺品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arti- (技巧) + fact (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代工匠，用他的"技巧(arti)"
    <tspan x="50" dy="25">和"手工(fact)"制作出一个精美的陶罐，</tspan>
    <tspan x="50" dy="25">这个陶罐就是一个"人工制品(artifact)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The museum displayed ancient artifacts from Egypt.
  </text>
  <text x="50" y="310" class="content">
    博物馆展出了来自埃及的古代人工制品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pottery -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <line x1="75" y1="225" x2="125" y2="225" class="image" />
    <line x1="100" y1="250" x2="100" y2="275" class="image" />
    <!-- Craftsman -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="250" y2="140" class="image" />
    <line x1="250" y1="140" x2="230" y2="160" class="image" />
  </g>
</svg>