<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sixteen</text>
  <text x="50" y="120" class="subtitle">[sɪksˈtiːn] n. 十六</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> six (六) + teen (十)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“6”和“10”手牵手，
    <tspan x="50" dy="25">组成了一个“16”的数字，就像两个好朋友在一起玩耍。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are sixteen students in the class.
  </text>
  <text x="50" y="310" class="content">
    班里有十六个学生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Number 6 -->
    <path d="M0 0 L20 0 L20 20 L0 20 Z" class="image" />
    <path d="M10 20 L20 40 L0 40 Z" class="image" />
    <!-- Number 10 -->
    <line x1="30" y1="0" x2="30" y2="40" class="image" />
    <path d="M40 0 L60 0 L60 20 L40 20 Z" class="image" />
    <path d="M50 20 L60 40 L40 40 Z" class="image" />
    <!-- Hand holding -->
    <line x1="20" y1="20" x2="30" y2="20" class="image" />
  </g>
</svg>