<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">downfall</text>
  <text x="50" y="120" class="subtitle">[ˈdaʊnfɔːl] n. 垮台，衰落</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> down (向下) + fall (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高塔突然"向下(down)"倒塌"落下(fall)"，
    <tspan x="50" dy="25">象征着某人或某事的垮台(downfall)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's downfall was caused by poor management.
  </text>
  <text x="50" y="310" class="content">
    公司的垮台是由管理不善造成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tower -->
    <rect x="50" y="0" width="100" height="150" class="image" />
    <!-- Falling tower -->
    <rect x="70" y="160" width="60" height="100" class="image" transform="rotate(-45 100 210)" />
    <!-- Ground -->
    <line x1="0" y1="250" x2="350" y2="250" class="image" />
    <!-- Smoke -->
    <circle cx="150" cy="180" r="20" class="image" />
    <circle cx="170" cy="160" r="15" class="image" />
    <circle cx="190" cy="140" r="10" class="image" />
  </g>
</svg>