<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .shield { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">protection</text>
  <text x="50" y="120" class="subtitle">[prəˈtekʃn] n. 保护，防护</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (在前面) + tect (覆盖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在前面，"覆盖(tect)"
    <tspan x="50" dy="25">住另一个人，形成一道保护(protection)的屏障。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The helmet provides protection for the head.
  </text>
  <text x="50" y="310" class="content">
    头盔为头部提供保护。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <polygon points="50,10 90,90 10,90" class="shield" />
    <!-- Person -->
    <circle cx="70" cy="120" r="20" class="image" />
    <line x1="70" y1="140" x2="70" y2="180" class="image" />
    <line x1="70" y1="180" x2="50" y2="210" class="image" />
    <line x1="70" y1="180" x2="90" y2="210" class="image" />
    <line x1="70" y1="160" x2="100" y2="150" class="image" />
    <!-- Protected person -->
    <circle cx="150" cy="120" r="20" class="image" />
    <line x1="150" y1="140" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="210" class="image" />
    <line x1="150" y1="180" x2="170" y2="210" class="image" />
    <line x1="150" y1="160" x2="190" y2="150" class="image" />
  </g>
</svg>