<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">positive</text>
  <text x="50" y="120" class="subtitle">[ˈpɒzətɪv] adj. 积极的，肯定的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> posit (放置) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把"积极的(positive)"想法"放置(posit)"在心中，
    <tspan x="50" dy="25">这些想法就像阳光一样照亮了他的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always has a positive attitude towards life.
  </text>
  <text x="50" y="310" class="content">
    她总是对生活持有积极的态度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F39C12" />
    <!-- Rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Person -->
    <circle cx="300" cy="100" r="20" fill="#2ECC71" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="200" class="image" />
    <line x1="300" y1="160" x2="320" y2="200" class="image" />
    <line x1="300" y1="140" x2="340" y2="130" class="image" />
    <!-- Thought bubble -->
    <path d="M300,80 Q350,50 400,80 Q350,110 300,80" fill="none" stroke="#2980B9" stroke-width="2" />
    <text x="320" y="85" font-size="14" fill="#2980B9">"积极的想法"</text>
  </g>
</svg>