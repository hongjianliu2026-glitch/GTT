<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">repent</text>
  <text x="50" y="120" class="subtitle">[rɪˈpɛnt] v. 后悔，悔改</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + pent (痛苦)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为做了坏事而感到"再次痛苦(re-pent)"，
    <tspan x="50" dy="25">他后悔不已，决定悔改(repent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He repented his decision after realizing its consequences.
  </text>
  <text x="50" y="310" class="content">
    他意识到后果后，对自己的决定感到后悔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Pain expression -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="45" y1="85" x2="40" y2="90" class="image" />
    <line x1="55" y1="85" x2="60" y2="90" class="image" />
    <!-- Heart -->
    <path d="M100,100 C100,50 150,50 150,100 C150,150 100,150 100,100 Z" class="image" />
    <!-- Broken heart -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
  </g>
</svg>