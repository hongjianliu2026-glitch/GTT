<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chirp</text>
  <text x="50" y="120" class="subtitle">[tʃɜːrp] v. 鸟鸣，虫鸣；n. 鸟鸣声，虫鸣声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chirp (源自拟声词，模仿鸟鸣声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟在清晨的阳光下，"叽叽喳喳(chirp)"
    <tspan x="50" dy="25">地唱着歌，它的声音清脆悦耳，仿佛在唤醒沉睡的大地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The birds outside my window chirped merrily.
  </text>
  <text x="50" y="310" class="content">
    窗外的鸟儿欢快地鸣叫着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="110" x2="20" y2="100" class="image" />
    <line x1="50" y1="110" x2="80" y2="100" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <!-- Chirping sound -->
    <path d="M50,20 Q70,10 90,20 T130,40" class="image" />
    <path d="M50,30 Q70,20 90,30 T130,50" class="image" />
    <path d="M50,40 Q70,30 90,40 T130,60" class="image" />
  </g>
</svg>