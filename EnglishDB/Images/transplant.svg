<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transplant</text>
  <text x="50" y="120" class="subtitle">[trænsˈplænt] v. 移植；n. 移植</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + plant (种植)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个园丁将一棵树"跨越(trans-)"到另一个地方"种植(plant)"，
    <tspan x="50" dy="25">这个过程就是移植(transplant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor successfully transplanted a kidney into the patient.
  </text>
  <text x="50" y="310" class="content">
    医生成功地将一个肾脏移植到病人身上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree in original location -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <circle cx="50" cy="40" r="10" class="image" />
    <line x1="50" y1="50" x2="40" y2="60" class="image" />
    <line x1="50" y1="50" x2="60" y2="60" class="image" />
    <line x1="50" y1="50" x2="45" y2="70" class="image" />
    <line x1="50" y1="50" x2="55" y2="70" class="image" />

    <!-- Tree in new location -->
    <line x1="250" y1="150" x2="250" y2="50" class="image" />
    <circle cx="250" cy="40" r="10" class="image" />
    <line x1="250" y1="50" x2="240" y2="60" class="image" />
    <line x1="250" y1="50" x2="260" y2="60" class="image" />
    <line x1="250" y1="50" x2="245" y2="70" class="image" />
    <line x1="250" y1="50" x2="255" y2="70" class="image" />

    <!-- Transplant action -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="120" class="image" />
    <line x1="200" y1="100" x2="200" y2="120" class="image" />
    <line x1="100" y1="120" x2="200" y2="120" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="140" y2="160" class="image" />
    <line x1="150" y1="150" x2="160" y2="160" class="image" />
  </g>
</svg>