<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hardness</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrdnəs] n. 硬度，坚硬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hard (硬) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块巨大的石头，"硬(hard)"得连锤子都砸不碎，
    <tspan x="50" dy="25">这种"硬度(hardness)"让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hardness of the diamond makes it valuable.
  </text>
  <text x="50" y="310" class="content">
    钻石的硬度使其具有价值。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large stone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hammer -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="75" y1="20" x2="75" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <!-- Broken hammer -->
    <line x1="120" y1="20" x2="170" y2="20" class="image" />
    <line x1="145" y1="20" x2="145" y2="100" class="image" />
    <line x1="120" y1="100" x2="170" y2="100" class="image" />
    <line x1="145" y1="100" x2="145" y2="120" class="image" />
    <!-- Stone remains intact -->
    <rect x="200" y="20" width="100" height="160" class="image" />
  </g>
</svg>