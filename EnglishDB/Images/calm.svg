<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">calm</text>
  <text x="50" y="120" class="subtitle">[kɑːm] adj. 平静的，镇静的；v. 使平静，使镇静</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cal- (冷) + m (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在炎热的夏天，突然被一阵"冷风(cal-m)"吹过，
    <tspan x="50" dy="25">瞬间感到平静和镇定，这就是calm的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She took a deep breath to calm herself before the interview.
  </text>
  <text x="50" y="310" class="content">
    她在面试前深呼吸以使自己平静下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="40" class="image" fill="#F39C12" />
    <!-- Wind -->
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
    <line x1="100" y1="50" x2="120" y2="40" class="image" />
    <line x1="100" y1="50" x2="120" y2="60" class="image" />
    <!-- Person -->
    <circle cx="250" cy="50" r="20" class="image" fill="#2ECC71" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
    <line x1="250" y1="80" x2="280" y2="70" class="image" />
  </g>
</svg>