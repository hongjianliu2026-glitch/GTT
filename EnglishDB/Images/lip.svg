<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lip</text>
  <text x="50" y="120" class="subtitle">[lɪp] n. 嘴唇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lip (源自原始印欧语 *lep-，意为“舔”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用嘴唇("lip")轻轻地舔着冰淇淋，
    <tspan x="50" dy="25">这种动作让人联想到嘴唇的柔软和舔的动作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She pressed her lips together in concentration.
  </text>
  <text x="50" y="310" class="content">
    她集中注意力时紧闭双唇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Lips -->
    <path d="M 50 120 Q 100 150 150 120" class="image" />
    <!-- Ice cream -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="180" y1="150" x2="220" y2="150" class="image" />
    <!-- Tongue -->
    <path d="M 100 120 Q 150 110 200 100" class="image" />
  </g>
</svg>