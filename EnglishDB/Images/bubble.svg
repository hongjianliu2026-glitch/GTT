<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bubble { fill: #3498DB; stroke: #2980B9; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bubble</text>
  <text x="50" y="120" class="subtitle">[ˈbʌbl] n. 气泡，泡沫；v. 起泡，沸腾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bub (泡) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在浴缸里，"吹出(bub-le)"
    <tspan x="50" dy="25">无数的小气泡，这些气泡在水面上漂浮，形成了一幅欢乐的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child enjoyed blowing bubbles in the bathtub.
  </text>
  <text x="50" y="310" class="content">
    孩子在浴缸里吹泡泡玩得很开心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bubbles -->
    <circle cx="50" cy="50" r="20" class="bubble" />
    <circle cx="100" cy="70" r="15" class="bubble" />
    <circle cx="150" cy="60" r="25" class="bubble" />
    <circle cx="200" cy="80" r="18" class="bubble" />
    <circle cx="250" cy="55" r="22" class="bubble" />
    <!-- Child -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="270" y2="220" class="image" />
    <line x1="300" y1="180" x2="330" y2="220" class="image" />
    <line x1="300" y1="150" x2="350" y2="140" class="image" />
  </g>
</svg>