<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">distinction</text>
  <text x="50" y="120" class="subtitle">[dɪˈstɪŋkʃən] n. 区别，特征；卓越</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + stinct (刺)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个刺(stinct)将两个物体分开(di-)，
    <tspan x="50" dy="25">这种分开的行为就是一种区别(distinction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The distinction between the two theories is clear.
  </text>
  <text x="50" y="310" class="content">
    这两种理论之间的区别是明显的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two objects separated by a spike -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="200" y="0" width="150" height="100" class="image" />
    <line x1="150" y1="0" x2="150" y2="100" class="image" />
    <polygon points="145,50 155,50 150,60" class="image" />
  </g>
</svg>