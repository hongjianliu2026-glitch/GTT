<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neighborhood</text>
  <text x="50" y="120" class="subtitle">[ˈneɪbərhʊd] n. 邻里，街区</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neighbor (邻居) + -hood (状态或群体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温馨的街区，"邻居们(neighbor)"
    <tspan x="50" dy="25">聚集在一起，形成了一个温暖的"群体(hood)"，</tspan>
    <tspan x="50" dy="25">这就是邻里(neighborhood)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The neighborhood organized a block party.
  </text>
  <text x="50" y="310" class="content">
    邻里组织了一场街区派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Houses -->
    <rect x="0" y="0" width="100" height="80" class="image" />
    <rect x="120" y="0" width="100" height="80" class="image" />
    <rect x="240" y="0" width="100" height="80" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="170" cy="100" r="15" class="image" />
    <circle cx="290" cy="100" r="15" class="image" />
    <!-- Path -->
    <line x1="0" y1="120" x2="340" y2="120" class="image" />
  </g>
</svg>