<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aegis</text>
  <text x="50" y="120" class="subtitle">[ˈiːdʒɪs] n. 保护，庇护</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aegis (源自希腊神话中的宙斯盾)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象宙斯手持他的盾牌，"庇护(aegis)"
    <tspan x="50" dy="25">着整个奥林匹斯山，保护众神免受伤害。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was under the aegis of the university.
  </text>
  <text x="50" y="310" class="content">
    这个项目是在大学的庇护下进行的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <path d="M50 50 L150 50 L200 100 L150 150 L50 150 Z" class="image" />
    <!-- Lightning bolt -->
    <path d="M100 70 L120 90 L80 130 L120 130 Z" class="image" />
    <!-- Zeus -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
  </g>
</svg>