<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frailty</text>
  <text x="50" y="120" class="subtitle">[ˈfreɪlti] n. 脆弱，虚弱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frai- (打破) + -lty (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个易碎的玻璃杯，轻轻一碰就"打破(frai-)"，
    <tspan x="50" dy="25">象征着脆弱(frailty)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her frailty made her dependent on others.
  </text>
  <text x="50" y="310" class="content">
    她的虚弱使她依赖他人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass cup -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <line x1="20" y1="150" x2="80" y2="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="170" class="image" />
    <!-- Crack -->
    <line x1="20" y1="50" x2="80" y2="100" class="image" />
    <line x1="20" y1="100" x2="80" y2="50" class="image" />
  </g>
</svg>