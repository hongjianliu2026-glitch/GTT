<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">residential</text>
  <text x="50" y="120" class="subtitle">[ˌrɛzɪˈdɛnʃəl] adj. 住宅的，居住的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + sid (坐) + ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"回到(re-)"他们的"座位(sid)"，
    <tspan x="50" dy="25">这些座位就是他们的家，构成了一个住宅区(residential area)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The neighborhood is a quiet residential area.
  </text>
  <text x="50" y="310" class="content">
    这个社区是一个安静的住宅区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <polygon points="0,100 75,150 150,100" class="image" />
    <!-- Door -->
    <rect x="60" y="60" width="30" height="40" class="image" />
    <!-- Windows -->
    <rect x="20" y="20" width="30" height="30" class="image" />
    <rect x="100" y="20" width="30" height="30" class="image" />
    <!-- People -->
    <circle cx="20" cy="180" r="10" class="image" />
    <line x1="20" y1="190" x2="20" y2="210" class="image" />
    <line x1="20" y1="210" x2="10" y2="230" class="image" />
    <line x1="20" y1="210" x2="30" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="190" class="image" />
    <circle cx="130" cy="180" r="10" class="image" />
    <line x1="130" y1="190" x2="130" y2="210" class="image" />
    <line x1="130" y1="210" x2="120" y2="230" class="image" />
    <line x1="130" y1="210" x2="140" y2="230" class="image" />
    <line x1="130" y1="200" x2="150" y2="190" class="image" />
  </g>
</svg>