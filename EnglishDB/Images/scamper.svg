<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scamper</text>
  <text x="50" y="120" class="subtitle">[ˈskæmpər] v. 蹦跳，奔跑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scamper (源自中古英语 scamperen，意为“快速移动”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小兔子在草地上"蹦跳(scamper)"，
    <tspan x="50" dy="25">它的动作轻盈而迅速，就像在玩捉迷藏一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children scampered across the playground.
  </text>
  <text x="50" y="310" class="content">
    孩子们在操场上蹦蹦跳跳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#27AE60" />
    <!-- Rabbit -->
    <circle cx="50" cy="120" r="20" class="image" fill="#FFFFFF" />
    <line x1="50" y1="140" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="160" x2="80" y2="150" class="image" />
    <line x1="50" y1="160" x2="20" y2="150" class="image" />
    <!-- Path -->
    <path d="M50 120 Q100 100 150 120" class="image" />
  </g>
</svg>