<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skim</text>
  <text x="50" y="120" class="subtitle">[skɪm] v. 撇去，浏览，掠过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sk- (滑过) + im (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只海鸥在海面上"滑过(sk-)"，只"撇去(im)"
    <tspan x="50" dy="25">表面的泡沫，这就是"skim"的动作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She likes to skim through the newspaper in the morning.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在早上浏览报纸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sea foam -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <!-- Seagull -->
    <circle cx="20" cy="30" r="15" class="image" />
    <line x1="20" y1="45" x2="20" y2="80" class="image" />
    <line x1="20" y1="80" x2="0" y2="110" class="image" />
    <line x1="20" y1="80" x2="40" y2="110" class="image" />
    <line x1="20" y1="60" x2="50" y2="50" class="image" />
  </g>
</svg>