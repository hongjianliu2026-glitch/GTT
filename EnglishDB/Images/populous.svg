<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">populous</text>
  <text x="50" y="120" class="subtitle">[ˈpɒpjʊləs] adj. 人口稠密的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pop (人) + -ulous (多)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市里，"人(pop)"多得像蚂蚁一样，
    <tspan x="50" dy="25">密密麻麻地挤在一起，这就是人口稠密(populous)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Shanghai is one of the most populous cities in the world.
  </text>
  <text x="50" y="310" class="content">
    上海是世界上人口最多的城市之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Buildings -->
    <rect x="50" y="20" width="30" height="160" class="image" />
    <rect x="100" y="40" width="30" height="140" class="image" />
    <rect x="150" y="60" width="30" height="120" class="image" />
    <rect x="200" y="80" width="30" height="100" class="image" />
    <rect x="250" y="100" width="30" height="80" class="image" />
    <!-- People -->
    <circle cx="70" cy="180" r="5" class="image" />
    <circle cx="120" cy="160" r="5" class="image" />
    <circle cx="170" cy="140" r="5" class="image" />
    <circle cx="220" cy="120" r="5" class="image" />
    <circle cx="270" cy="100" r="5" class="image" />
    <circle cx="80" cy="170" r="5" class="image" />
    <circle cx="130" cy="150" r="5" class="image" />
    <circle cx="180" cy="130" r="5" class="image" />
    <circle cx="230" cy="110" r="5" class="image" />
    <circle cx="280" cy="90" r="5" class="image" />
  </g>
</svg>