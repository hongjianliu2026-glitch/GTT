<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outburst</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtbɜːrst] n. 爆发，突发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (向外) + burst (爆发)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个火山突然"向外爆发(out-burst)"，
    <tspan x="50" dy="25">熔岩喷涌而出，场面壮观而震撼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outburst of applause surprised everyone.
  </text>
  <text x="50" y="310" class="content">
    突如其来的掌声让所有人都感到惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Volcano -->
    <polygon points="0,150 100,0 200,150" class="image" />
    <!-- Lava -->
    <circle cx="100" cy="150" r="50" class="image" />
    <circle cx="120" cy="170" r="40" class="image" />
    <circle cx="80" cy="170" r="40" class="image" />
    <circle cx="100" cy="190" r="30" class="image" />
    <!-- Explosion -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="250" x2="0" y2="300" class="image" />
    <line x1="100" y1="250" x2="200" y2="300" class="image" />
  </g>
</svg>