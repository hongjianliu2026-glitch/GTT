<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lucid</text>
  <text x="50" y="120" class="subtitle">[ˈluːsɪd] adj. 清晰的，易懂的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> luc (光) + -id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个明亮的房间，"光(luc)"
    <tspan x="50" dy="25">照亮了每一个角落，一切都变得清晰(lucid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher explained the concept in a lucid manner.
  </text>
  <text x="50" y="310" class="content">
    老师用清晰的方式解释了这个概念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bright room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Light rays -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Clear objects -->
    <circle cx="100" cy="100" r="20" class="image" />
    <rect x="150" y="80" width="40" height="40" class="image" />
    <line x1="220" y1="80" x2="260" y2="120" class="image" />
    <line x1="260" y1="120" x2="220" y2="160" class="image" />
    <line x1="220" y1="160" x2="260" y2="200" class="image" />
  </g>
</svg>