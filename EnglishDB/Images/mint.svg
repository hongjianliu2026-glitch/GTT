<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9FBE7; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mint</text>
  <text x="50" y="120" class="subtitle">[mɪnt] n. 薄荷；造币厂；v. 铸造</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> min (薄荷) + t (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的薄荷(mint)叶子，上面有无数的硬币在滚动，
    <tspan x="50" dy="25">这些硬币就像是从薄荷叶子中"铸造(mint)"出来的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mint produced a new series of coins this year.
  </text>
  <text x="50" y="310" class="content">
    造币厂今年生产了一套新硬币。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mint leaf -->
    <path d="M0 0 C 50 100, 150 100, 200 0" class="image" />
    <path d="M0 0 C 50 -100, 150 -100, 200 0" class="image" />
    <!-- Coins -->
    <circle cx="70" cy="50" r="15" class="image" />
    <circle cx="130" cy="70" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="160" cy="80" r="15" class="image" />
  </g>
</svg>