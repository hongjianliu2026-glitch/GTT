<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turpentine</text>
  <text x="50" y="120" class="subtitle">[ˈtɜːrpəntaɪn] n. 松节油</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> turp (污秽) + -ent (名词后缀) + -ine (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家在画布前，用"污秽的(turp)"
    <tspan x="50" dy="25">松节油(turpentine)来清洗画笔，画面中充满了</tspan>
    <tspan x="50" dy="25">松树的树脂和油的味道。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used turpentine to clean his paintbrushes.
  </text>
  <text x="50" y="310" class="content">
    他用松节油清洗画笔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paintbrush -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="20" x2="30" y2="50" class="image" />
    <line x1="50" y1="20" x2="70" y2="50" class="image" />
    <!-- Turpentine bottle -->
    <rect x="100" y="50" width="100" height="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="200" class="image" />
    <!-- Tree -->
    <circle cx="300" cy="100" r="50" class="image" />
    <line x1="250" y1="150" x2="350" y2="150" class="image" />
    <line x1="250" y1="150" x2="270" y2="200" class="image" />
    <line x1="350" y1="150" x2="330" y2="200" class="image" />
  </g>
</svg>