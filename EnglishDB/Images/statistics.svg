<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">statistics</text>
  <text x="50" y="120" class="subtitle">[stəˈtɪstɪks] n. 统计学，统计数据</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stat (站立) + -istics (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数据表，"站立(stat)"
    <tspan x="50" dy="25">在那里，每一行数据都像士兵一样排列整齐，</tspan>
    <tspan x="50" dy="25">这些数据构成了统计学(statistics)的基础。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The statistics show a significant increase in sales.
  </text>
  <text x="50" y="310" class="content">
    统计数据显示销售额显著增加。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Data table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Data points -->
    <circle cx="75" cy="40" r="5" class="image" />
    <circle cx="175" cy="80" r="5" class="image" />
    <circle cx="275" cy="120" r="5" class="image" />
    <circle cx="100" cy="160" r="5" class="image" />
    <circle cx="200" cy="100" r="5" class="image" />
    <circle cx="300" cy="140" r="5" class="image" />
  </g>
</svg>