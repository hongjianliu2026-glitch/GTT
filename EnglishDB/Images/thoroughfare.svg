<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thoroughfare</text>
  <text x="50" y="120" class="subtitle">[ˈθʌrəfeər] n. 大道，通道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> through (通过) + fare (行走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条宽阔的"大道(thoroughfare)"，人们可以"通过(through)"
    <tspan x="50" dy="25">这条路"行走(fare)"，畅通无阻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The main thoroughfare was crowded with tourists.
  </text>
  <text x="50" y="310" class="content">
    主要大道上挤满了游客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Cars -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="150" y="20" width="50" height="30" class="image" />
    <rect x="250" y="20" width="50" height="30" class="image" />
    <!-- People -->
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="200" cy="70" r="10" class="image" />
    <circle cx="300" cy="70" r="10" class="image" />
  </g>
</svg>