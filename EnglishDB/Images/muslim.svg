<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Muslim</text>
  <text x="50" y="120" class="subtitle">[ˈmʊzlɪm] n. 穆斯林，伊斯兰教信徒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Mus- (源自阿拉伯语 "مسلم"，意为“顺从者”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穆斯林在祈祷，"顺从(Mus-)"
    <tspan x="50" dy="25">于真主的旨意，表现出虔诚和信仰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Muslim community celebrates Eid with great joy.
  </text>
  <text x="50" y="310" class="content">
    穆斯林社区以极大的喜悦庆祝开斋节。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Prayer mat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person praying -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Crescent moon and star -->
    <path d="M250,50 A50,50 0 0,1 300,100 L275,100 Z" class="image" />
    <line x1="275" y1="80" x2="275" y2="120" class="image" />
  </g>
</svg>