<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">excitement</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsaɪtmənt] n. 兴奋，激动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + cit (唤起) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在观看一场激动人心的比赛，"向外唤起(ex-cit)"
    <tspan x="50" dy="25">的情感，这种情感就是兴奋(excitement)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children's faces lit up with excitement when they saw the presents.
  </text>
  <text x="50" y="310" class="content">
    孩子们看到礼物时，脸上露出了兴奋的表情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Exclamation marks -->
    <text x="80" y="100" class="image" font-size="30">!</text>
    <text x="100" y="120" class="image" font-size="30">!</text>
    <text x="120" y="140" class="image" font-size="30">!</text>
    <!-- Heart -->
    <path d="M150,100 C150,100 160,80 180,100 C190,120 170,140 150,100 Z" class="image" />
  </g>
</svg>