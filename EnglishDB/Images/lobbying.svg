<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lobbying</text>
  <text x="50" y="120" class="subtitle">[ˈlɒbɪŋ] n. 游说</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lob (大厅) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在议会大厅(lob)里，"游说(lobbying)"
    <tspan x="50" dy="25">议员们支持他们的提案。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company hired a firm for lobbying efforts.
  </text>
  <text x="50" y="310" class="content">
    公司聘请了一家机构进行游说活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lobby -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Politician -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
    <line x1="250" y1="80" x2="280" y2="70" class="image" />
    <!-- Speech bubbles -->
    <path d="M50,70 Q70,60 90,70" class="image" />
    <path d="M100,70 Q120,60 140,70" class="image" />
    <path d="M150,70 Q170,60 190,70" class="image" />
    <path d="M250,70 Q270,60 290,70" class="image" />
  </g>
</svg>