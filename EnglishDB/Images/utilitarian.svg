<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">utilitarian</text>
  <text x="50" y="120" class="subtitle">[ˌjuːtɪlɪˈtɛəriən] adj. 功利的，实用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> util (使用) + -arian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工具箱里装满了各种实用的工具，每个工具都是为了解决特定问题而设计的，这就是"实用主义(utilitarian)"的体现。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The utilitarian design of the furniture made it easy to assemble.
  </text>
  <text x="50" y="310" class="content">
    家具的实用设计使其易于组装。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toolbox -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tools -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="110" x2="100" y2="110" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <!-- Hammer -->
    <rect x="120" y="50" width="50" height="10" class="image" />
    <line x1="145" y1="60" x2="145" y2="100" class="image" />
    <!-- Screwdriver -->
    <rect x="180" y="50" width="50" height="10" class="image" />
    <line x1="205" y1="60" x2="205" y2="100" class="image" />
    <!-- Wrench -->
    <rect x="240" y="50" width="50" height="10" class="image" />
    <line x1="265" y1="60" x2="265" y2="100" class="image" />
  </g>
</svg>