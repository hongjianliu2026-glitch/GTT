<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stub</text>
  <text x="50" y="120" class="subtitle">[stʌb] n. 树桩，残端；v. 使变钝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + ub (剩余)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树被砍倒后，"站立(st-)"的"剩余(ub)"部分变成了一个树桩(stub)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He tripped over a tree stub in the forest.
  </text>
  <text x="50" y="310" class="content">
    他在森林里被一个树桩绊倒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree stump -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Tree rings -->
    <circle cx="100" cy="75" r="20" class="image" />
    <circle cx="100" cy="75" r="40" class="image" />
    <circle cx="100" cy="75" r="60" class="image" />
    <!-- Broken tree -->
    <line x1="100" y1="150" x2="100" y2="300" class="image" />
    <line x1="100" y1="300" x2="50" y2="400" class="image" />
    <line x1="100" y1="300" x2="150" y2="400" class="image" />
  </g>
</svg>