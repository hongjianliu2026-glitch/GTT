<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smell</text>
  <text x="50" y="120" class="subtitle">[smel] v. 闻，嗅；n. 气味</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smel (来自古英语 smelian，意为“嗅”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在花园里，鼻子微微皱起，"嗅(smel)"
    <tspan x="50" dy="25">着花香，那种感觉就像是在享受一场嗅觉的盛宴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smell of roses filled the garden.
  </text>
  <text x="50" y="310" class="content">
    玫瑰的香味充满了花园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nose -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="80" y1="140" x2="120" y2="140" class="image" />
    <!-- Flower -->
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="180" cy="80" r="20" class="image" />
    <circle cx="220" cy="80" r="20" class="image" />
    <circle cx="190" cy="120" r="20" class="image" />
    <circle cx="210" cy="120" r="20" class="image" />
    <!-- Smell lines -->
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <line x1="120" y1="90" x2="170" y2="90" class="image" />
    <line x1="120" y1="80" x2="160" y2="80" class="image" />
  </g>
</svg>