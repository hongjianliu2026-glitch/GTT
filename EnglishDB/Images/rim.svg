<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rim</text>
  <text x="50" y="120" class="subtitle">[rɪm] n. 边缘，轮辋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rim (边缘)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的轮子，"边缘(rim)"
    <tspan x="50" dy="25">上镶嵌着闪闪发光的宝石，这个轮子在沙漠中滚动，</tspan>
    <tspan x="50" dy="25">留下一道闪耀的痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car's rim was damaged in the accident.
  </text>
  <text x="50" y="310" class="content">
    这辆车的轮辋在事故中受损了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wheel -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Rim -->
    <circle cx="150" cy="150" r="90" class="image" />
    <!-- Gems -->
    <circle cx="70" cy="70" r="10" fill="#FFD700" />
    <circle cx="230" cy="70" r="10" fill="#FFD700" />
    <circle cx="70" cy="230" r="10" fill="#FFD700" />
    <circle cx="230" cy="230" r="10" fill="#FFD700" />
  </g>
</svg>