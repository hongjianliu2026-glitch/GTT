<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">furnished</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrnɪʃt] adj. 配备家具的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> furn (家具) + -ish (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，"家具(furn)"被"使(ish)"得整整齐齐，
    <tspan x="50" dy="25">这个房间就是"配备家具的(furnished)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The apartment was fully furnished.
  </text>
  <text x="50" y="310" class="content">
    这套公寓是全配家具的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bed -->
    <rect x="50" y="20" width="150" height="80" class="image" />
    <!-- Table -->
    <rect x="220" y="20" width="100" height="50" class="image" />
    <!-- Chair -->
    <rect x="240" y="80" width="60" height="60" class="image" />
    <!-- Lamp -->
    <line x1="250" y1="150" x2="250" y2="180" class="image" />
    <circle cx="250" cy="140" r="10" class="image" />
  </g>
</svg>