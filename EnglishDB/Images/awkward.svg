<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">awkward</text>
  <text x="50" y="120" class="subtitle">[ˈɔːkwərd] adj. 尴尬的，笨拙的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> awk (反常的) + ward (方向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在舞会上，"反常地(awk)"
    <tspan x="50" dy="25">走向(ward)舞池中央，结果踩到了自己的脚，</tspan>
    <tspan x="50" dy="25">场面十分尴尬(awkward)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt awkward at the party when she tripped over her own feet.
  </text>
  <text x="50" y="310" class="content">
    她在派对上绊倒了自己的脚，感到非常尴尬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dance floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="200" class="image" />
    <line x1="100" y1="160" x2="120" y2="200" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Foot -->
    <rect x="80" y="190" width="40" height="10" class="image" />
    <!-- Tripping -->
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="150" y2="140" class="image" />
    <line x1="150" y1="140" x2="130" y2="160" class="image" />
  </g>
</svg>