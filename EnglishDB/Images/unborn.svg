<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unborn</text>
  <text x="50" y="120" class="subtitle">[ʌnˈbɔːrn] adj. 未出生的，未来的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + born (出生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个未出生的婴儿在妈妈的肚子里，"未出生(un-born)"
    <tspan x="50" dy="25">的婴儿代表着未来的希望和可能性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unborn child is a symbol of hope.
  </text>
  <text x="50" y="310" class="content">
    未出生的孩子是希望的象征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Baby in the womb -->
    <circle cx="100" cy="100" r="20" class="image" fill="#F1C40F" />
    <!-- Umbilical cord -->
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <!-- Heartbeat -->
    <circle cx="100" cy="160" r="5" class="image" fill="#E74C3C" />
    <circle cx="100" cy="160" r="5" class="image" fill="#E74C3C" />
    <circle cx="100" cy="160" r="5" class="image" fill="#E74C3C" />
  </g>
</svg>