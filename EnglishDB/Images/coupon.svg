<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coupon</text>
  <text x="50" y="120" class="subtitle">[ˈkuːpɒn] n. 优惠券，礼券</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自法语 "couper" (切)，原意为“切下”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个购物者从报纸上“切下(couper)”一张优惠券(coupon)，
    <tspan x="50" dy="25">这张小纸片能为他带来购物的惊喜折扣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a coupon to get a discount on her purchase.
  </text>
  <text x="50" y="310" class="content">
    她用了一张优惠券在购物时获得了折扣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Newspaper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Coupon -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Scissors -->
    <line x1="300" y1="50" x2="350" y2="100" class="image" />
    <line x1="300" y1="100" x2="350" y2="50" class="image" />
    <!-- Discount symbol -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="165" y1="90" x2="185" y2="110" class="image" />
    <line x1="165" y1="110" x2="185" y2="90" class="image" />
  </g>
</svg>