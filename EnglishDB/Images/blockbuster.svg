<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blockbuster</text>
  <text x="50" y="120" class="subtitle">[ˈblɒkˌbʌstə(r)] n. 大片，轰动一时的作品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> block (块) + buster (破坏者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一部电影，它的影响力如同"破坏者(buster)"，
    <tspan x="50" dy="25">能够"打破(block)"票房纪录，成为轰动一时的"大片(blockbuster)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new superhero movie is a real blockbuster.
  </text>
  <text x="50" y="310" class="content">
    这部新的超级英雄电影真是一部大片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Movie screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Explosion -->
    <circle cx="175" cy="100" r="50" fill="#FF4136" />
    <!-- Broken block -->
    <rect x="150" y="150" width="50" height="20" class="image" />
    <rect x="200" y="150" width="50" height="20" class="image" />
    <!-- Movie reel -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="270" cy="100" r="15" class="image" />
  </g>
</svg>