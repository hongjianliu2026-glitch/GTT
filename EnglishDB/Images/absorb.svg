<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">absorb</text>
  <text x="50" y="120" class="subtitle">[əbˈsɔːrb] v. 吸收，吸引</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + sorb (吸收)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的海绵，"离开(ab-)"
    <tspan x="50" dy="25">液体并将其吸收(sorb)，完全吞噬。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sponge can absorb a lot of water.
  </text>
  <text x="50" y="310" class="content">
    这块海绵可以吸收很多水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sponge -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Water droplets -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="70" r="10" class="image" />
    <circle cx="110" cy="90" r="10" class="image" />
    <circle cx="140" cy="110" r="10" class="image" />
    <!-- Absorbed water -->
    <line x1="20" y1="150" x2="180" y2="150" class="image" />
    <line x1="20" y1="160" x2="180" y2="160" class="image" />
    <line x1="20" y1="170" x2="180" y2="170" class="image" />
  </g>
</svg>