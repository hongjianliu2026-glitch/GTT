<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nostril</text>
  <text x="50" y="120" class="subtitle">[ˈnɑːstrəl] n. 鼻孔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nos (鼻子) + tr (孔)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的鼻子，鼻孔(nostril)
    <tspan x="50" dy="25">大到可以塞进一头大象，夸张的画面让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The strong smell made her nostril flare.
  </text>
  <text x="50" y="310" class="content">
    强烈的气味使她的鼻孔张开。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Nose -->
    <path d="M 0 100 Q 50 50 100 100 Q 150 150 200 100" class="image" />
    <!-- Nostrils -->
    <circle cx="70" cy="100" r="20" class="image" />
    <circle cx="130" cy="100" r="20" class="image" />
    <!-- Elephant in the nostril -->
    <rect x="50" y="80" width="40" height="40" class="image" />
    <line x1="70" y1="80" x2="70" y2="120" class="image" />
    <line x1="50" y1="100" x2="90" y2="100" class="image" />
  </g>
</svg>