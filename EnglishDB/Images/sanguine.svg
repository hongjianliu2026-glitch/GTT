<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .blood { fill: #8B0000; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sanguine</text>
  <text x="50" y="120" class="subtitle">[ˈsæŋɡwɪn] adj. 乐观的，充满希望的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sanguin- (血) + -e (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面色红润，"血液充沛(sanguin-)"，
    <tspan x="50" dy="25">脸上洋溢着乐观和希望(sanguine)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Despite the challenges, he remained sanguine about the future.
  </text>
  <text x="50" y="310" class="content">
    尽管面临挑战，他对未来仍然保持乐观。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Smile -->
    <path d="M 70 120 Q 100 140 130 120" class="image" />
    <!-- Blood drop -->
    <circle cx="150" cy="50" r="10" class="blood" />
    <line x1="150" y1="60" x2="150" y2="100" class="image" />
  </g>
</svg>