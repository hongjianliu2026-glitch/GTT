<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tick</text>
  <text x="50" y="120" class="subtitle">[tɪk] n. 滴答声，勾号；v. 发出滴答声，标记</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tick (滴答声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟在发出"滴答(tick)"声，
    <tspan x="50" dy="25">每滴答一声，时间就流逝一点。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clock ticked loudly in the quiet room.
  </text>
  <text x="50" y="310" class="content">
    时钟在安静的房间里发出响亮的滴答声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="100" y1="100" x2="100" y2="30" class="image" />
    <line x1="100" y1="100" x2="160" y2="100" class="image" />
    <!-- Tick mark -->
    <line x1="100" y1="20" x2="100" y2="30" class="image" />
    <line x1="160" y1="100" x2="150" y2="100" class="image" />
  </g>
</svg>