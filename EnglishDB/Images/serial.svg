<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">serial</text>
  <text x="50" y="120" class="subtitle">[ˈsɪəriəl] adj. 连续的，一系列的；n. 连续剧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seri (线) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条长长的线，"串联(seri-al)"
    <tspan x="50" dy="25">着一系列的事件或故事，就像一部连续剧(serial)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective story was published as a serial in the newspaper.
  </text>
  <text x="50" y="310" class="content">
    这部侦探小说以连载的形式在报纸上发表。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Long line -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <!-- Dots on the line -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="150" cy="50" r="5" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
    <circle cx="250" cy="50" r="5" class="image" />
    <circle cx="300" cy="50" r="5" class="image" />
    <!-- Text labels -->
    <text x="100" y="80" class="content">事件1</text>
    <text x="150" y="80" class="content">事件2</text>
    <text x="200" y="80" class="content">事件3</text>
    <text x="250" y="80" class="content">事件4</text>
    <text x="300" y="80" class="content">事件5</text>
  </g>
</svg>