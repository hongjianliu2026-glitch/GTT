<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">titanic</text>
  <text x="50" y="120" class="subtitle">[taɪˈtænɪk] adj. 巨大的，庞大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> titan (巨人) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨人(titan)站在城市中，他的身影"巨大(titanic)"到遮天蔽日，
    <tspan x="50" dy="25">整个城市都被他的阴影笼罩。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The titanic ship sank on its maiden voyage.
  </text>
  <text x="50" y="310" class="content">
    那艘巨大的船在其首航中沉没了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="180" x2="175" y2="280" class="image" />
    <line x1="175" y1="280" x2="100" y2="350" class="image" />
    <line x1="175" y1="280" x2="250" y2="350" class="image" />
    <line x1="175" y1="220" x2="100" y2="200" class="image" />
    <line x1="175" y1="220" x2="250" y2="200" class="image" />
    <!-- City skyline -->
    <rect x="50" y="350" width="50" height="50" class="image" />
    <rect x="125" y="300" width="50" height="100" class="image" />
    <rect x="200" y="320" width="50" height="80" class="image" />
    <rect x="275" y="310" width="50" height="90" class="image" />
  </g>
</svg>