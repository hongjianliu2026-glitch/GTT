<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impede</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpiːd] v. 阻碍，妨碍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + ped (脚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路时，突然"脚(ped)"被"进入(im-)"的障碍物绊倒，
    <tspan x="50" dy="25">这就是"阻碍(impede)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The construction work impeded traffic on the main road.
  </text>
  <text x="50" y="310" class="content">
    建筑工程阻碍了主干道上的交通。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Obstacle -->
    <rect x="100" y="160" width="50" height="40" class="image" />
    <!-- Fallen person -->
    <circle cx="150" cy="200" r="20" class="image" />
    <line x1="150" y1="220" x2="150" y2="280" class="image" />
    <line x1="150" y1="280" x2="130" y2="320" class="image" />
    <line x1="150" y1="280" x2="170" y2="320" class="image" />
    <line x1="150" y1="250" x2="180" y2="240" class="image" />
  </g>
</svg>