<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">angular</text>
  <text x="50" y="120" class="subtitle">[ˈæŋɡjələr] adj. 有角的，尖锐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> angul (角) + -ar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的角(angul)，它尖锐得像一把刀，
    <tspan x="50" dy="25">这个角就是"有角的(angular)"，让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The angular shape of the building made it stand out.
  </text>
  <text x="50" y="310" class="content">
    这座建筑的有角形状使它格外引人注目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large angular shape -->
    <polygon points="0,0 150,0 150,150 0,150" class="image" />
    <!-- Sharp corner -->
    <line x1="150" y1="0" x2="150" y2="150" class="image" />
    <!-- Annotation -->
    <text x="160" y="75" class="content" text-anchor="start">尖锐的角</text>
  </g>
</svg>