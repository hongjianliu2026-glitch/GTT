<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buckle</text>
  <text x="50" y="120" class="subtitle">[ˈbʌkl] v. 扣住，扣紧；n. 搭扣，扣环</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> buck (弯曲) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个金属扣环，"弯曲(buck)"成一个小(le)形状，
    <tspan x="50" dy="25">紧紧扣住你的腰带，防止它松开。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Remember to buckle your seatbelt before driving.
  </text>
  <text x="50" y="310" class="content">
    开车前记得系好安全带。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Belt -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Buckle -->
    <rect x="150" y="0" width="50" height="50" class="image" />
    <!-- Buckle details -->
    <line x1="160" y1="10" x2="200" y2="10" class="image" />
    <line x1="160" y1="20" x2="200" y2="20" class="image" />
    <line x1="160" y1="30" x2="200" y2="30" class="image" />
    <line x1="160" y1="40" x2="200" y2="40" class="image" />
    <!-- Buckle curve -->
    <path d="M150,25 Q175,0 200,25" class="image" />
  </g>
</svg>