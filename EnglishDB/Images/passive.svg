<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">passive</text>
  <text x="50" y="120" class="subtitle">[ˈpæsɪv] adj. 被动的，消极的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pass (忍受) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在椅子上，"忍受(pass)"
    <tspan x="50" dy="25">着周围的一切，没有任何反应，这就是被动的(passive)状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He remained passive during the argument.
  </text>
  <text x="50" y="310" class="content">
    他在争论中保持被动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="75" y1="100" x2="75" y2="150" class="image" />
    <line x1="25" y1="150" x2="125" y2="150" class="image" />
    <!-- Person sitting -->
    <circle cx="75" cy="70" r="20" class="image" />
    <line x1="75" y1="90" x2="75" y2="120" class="image" />
    <line x1="75" y1="120" x2="50" y2="140" class="image" />
    <line x1="75" y1="120" x2="100" y2="140" class="image" />
    <line x1="75" y1="100" x2="50" y2="110" class="image" />
    <line x1="75" y1="100" x2="100" y2="110" class="image" />
  </g>
</svg>