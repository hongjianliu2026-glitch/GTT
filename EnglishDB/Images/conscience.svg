<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conscience</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnʃəns] n. 良心，道德心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + sci (知道) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在做决定时，"共同知道(con-sci)"
    <tspan x="50" dy="25">内心和道德的声音在对话，这就是良心(conscience)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She followed her conscience and decided to return the lost wallet.
  </text>
  <text x="50" y="310" class="content">
    她听从了良心，决定归还丢失的钱包。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 Q100,20 150,50 Q100,80 50,50" class="image" />
    <!-- Thought bubble -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="120" cy="70" r="8" class="image" />
    <circle cx="80" cy="70" r="8" class="image" />
    <!-- Person -->
    <circle cx="100" cy="200" r="20" class="image" />
    <line x1="100" y1="220" x2="100" y2="260" class="image" />
    <line x1="100" y1="240" x2="80" y2="220" class="image" />
    <line x1="100" y1="240" x2="120" y2="220" class="image" />
    <line x1="100" y1="260" x2="80" y2="280" class="image" />
    <line x1="100" y1="260" x2="120" y2="280" class="image" />
  </g>
</svg>