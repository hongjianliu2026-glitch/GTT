<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chartered</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɑːrtəd] adj. 特许的，包租的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chart (图表) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个特许的飞机，"图表上(chart)"
    <tspan x="50" dy="25">标明了它的航线，这架飞机就是包租的(chartered)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We took a chartered flight to the conference.
  </text>
  <text x="50" y="310" class="content">
    我们乘坐包机去参加会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airplane -->
    <polygon points="0,0 100,0 120,20 100,40 0,40" class="image" />
    <!-- Chart -->
    <rect x="150" y="0" width="200" height="150" class="image" />
    <line x1="160" y1="20" x2="340" y2="20" class="image" />
    <line x1="160" y1="50" x2="340" y2="50" class="image" />
    <line x1="160" y1="80" x2="340" y2="80" class="image" />
    <line x1="160" y1="110" x2="340" y2="110" class="image" />
    <!-- Path on chart -->
    <path d="M160,20 Q250,110 340,20" class="image" />
  </g>
</svg>