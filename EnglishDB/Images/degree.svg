<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">degree</text>
  <text x="50" y="120" class="subtitle">[dɪˈɡriː] n. 度，程度；学位</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + gree (步)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生从地面"向下(de-)"迈出"步(gree)"，
    <tspan x="50" dy="25">每一步都代表着学习的深入，最终获得学位(degree)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She earned her degree in computer science.
  </text>
  <text x="50" y="310" class="content">
    她获得了计算机科学学位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Steps -->
    <line x1="50" y1="180" x2="50" y2="140" class="image" />
    <line x1="100" y1="180" x2="100" y2="100" class="image" />
    <line x1="150" y1="180" x2="150" y2="60" class="image" />
    <line x1="200" y1="180" x2="200" y2="20" class="image" />
    <!-- Student -->
    <circle cx="200" cy="20" r="15" class="image" />
    <line x1="200" y1="35" x2="200" y2="60" class="image" />
    <line x1="200" y1="60" x2="180" y2="90" class="image" />
    <line x1="200" y1="60" x2="220" y2="90" class="image" />
    <line x1="200" y1="45" x2="230" y2="35" class="image" />
  </g>
</svg>