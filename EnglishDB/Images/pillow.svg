<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pillow</text>
  <text x="50" y="120" class="subtitle">[ˈpɪloʊ] n. 枕头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pill (小块) + -ow (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个柔软的"小块(pill)"，它被设计成"枕头(pillow)"，
    <tspan x="50" dy="25">让你在睡觉时舒适地支撑头部。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She fluffed up her pillow before lying down.
  </text>
  <text x="50" y="310" class="content">
    她躺下前把枕头拍松了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pillow -->
    <rect x="0" y="0" width="200" height="100" rx="20" ry="20" class="image" fill="#F4D03F" />
    <!-- Head -->
    <circle cx="100" cy="150" r="30" class="image" fill="#E74C3C" />
    <!-- Neck -->
    <line x1="100" y1="180" x2="100" y2="220" class="image" />
    <!-- Body -->
    <rect x="70" y="220" width="60" height="100" class="image" fill="#2ECC71" />
  </g>
</svg>