<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">purely</text>
  <text x="50" y="120" class="subtitle">[ˈpjʊrli] adv. 纯粹地，完全地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pur- (纯净) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个透明的玻璃瓶，里面装满了"纯净(pur-)"的水，
    <tspan x="50" dy="25">没有任何杂质，这就是"纯粹地(purely)"的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke purely from the heart.
  </text>
  <text x="50" y="310" class="content">
    她完全发自内心地说话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="10" y="10" width="80" height="180" class="image" />
    <!-- Water inside the bottle -->
    <rect x="15" y="15" width="70" height="170" fill="#6495ED" />
    <!-- Reflection -->
    <line x1="20" y1="20" x2="80" y2="20" class="image" />
    <line x1="20" y1="40" x2="80" y2="40" class="image" />
    <line x1="20" y1="60" x2="80" y2="60" class="image" />
    <line x1="20" y1="80" x2="80" y2="80" class="image" />
    <line x1="20" y1="100" x2="80" y2="100" class="image" />
    <line x1="20" y1="120" x2="80" y2="120" class="image" />
    <line x1="20" y1="140" x2="80" y2="140" class="image" />
    <line x1="20" y1="160" x2="80" y2="160" class="image" />
  </g>
</svg>