<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">two-lane</text>
  <text x="50" y="120" class="subtitle">[tuː leɪn] adj. 双车道的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> two (二) + lane (车道)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条公路，上面有两条车道，"二(two)条车道(lane)"
    <tspan x="50" dy="25">并排行驶，这就是双车道(two-lane)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The highway was a two-lane road, making it difficult to pass.
  </text>
  <text x="50" y="310" class="content">
    这条公路是双车道，超车很困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Two lanes -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <!-- Cars -->
    <rect x="70" y="10" width="30" height="20" class="image" />
    <rect x="120" y="50" width="30" height="20" class="image" />
    <rect x="170" y="10" width="30" height="20" class="image" />
    <rect x="220" y="50" width="30" height="20" class="image" />
  </g>
</svg>