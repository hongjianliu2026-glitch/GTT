<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adjusted</text>
  <text x="50" y="120" class="subtitle">[əˈdʒʌstɪd] adj. 调整过的，适应的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + just (正确)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在调整(ad-just)一个不平衡的跷跷板，
    <tspan x="50" dy="25">直到它变得平衡(adjusted)，每个人都能愉快地玩耍。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher adjusted the seating arrangement to ensure everyone could see the board.
  </text>
  <text x="50" y="310" class="content">
    老师调整了座位安排，以确保每个人都能看到黑板。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seesaw -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="350" y1="20" x2="350" y2="100" class="image" />
    <!-- Person on the left -->
    <circle cx="100" cy="120" r="20" class="image" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <line x1="100" y1="160" x2="140" y2="150" class="image" />
    <!-- Person on the right -->
    <circle cx="300" cy="120" r="20" class="image" />
    <line x1="300" y1="140" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="280" y2="210" class="image" />
    <line x1="300" y1="180" x2="320" y2="210" class="image" />
    <line x1="300" y1="160" x2="340" y2="150" class="image" />
    <!-- Adjustment -->
    <line x1="200" y1="20" x2="200" y2="100" class="image" />
  </g>
</svg>