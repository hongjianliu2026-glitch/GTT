<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bladder</text>
  <text x="50" y="120" class="subtitle">[ˈblædər] n. 膀胱，囊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blad (膨胀) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球(bladder)，它不断膨胀，
    <tspan x="50" dy="25">直到它变得像一个巨大的水球，充满了液体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor checked his bladder for any abnormalities.
  </text>
  <text x="50" y="310" class="content">
    医生检查了他的膀胱是否有异常。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bladder shape -->
    <ellipse cx="175" cy="100" rx="100" ry="70" class="image" />
    <!-- Liquid inside -->
    <ellipse cx="175" cy="100" rx="90" ry="60" fill="#1ABC9C" />
    <!-- Inflating effect -->
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <line x1="175" y1="30" x2="175" y2="170" class="image" />
  </g>
</svg>