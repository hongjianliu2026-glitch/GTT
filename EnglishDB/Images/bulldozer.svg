<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bulldozer</text>
  <text x="50" y="120" class="subtitle">[ˈbʊldoʊzər] n. 推土机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bull (公牛) + doze (打盹) + er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头强壮的公牛(bull)在工地上，它没有打盹(doze)，
    <tspan x="50" dy="25">而是在推土(dozer)，这就是推土机(bulldozer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bulldozer cleared the land for the new building.
  </text>
  <text x="50" y="310" class="content">
    推土机为新建筑清理了土地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bulldozer body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Bulldozer blade -->
    <rect x="50" y="20" width="250" height="30" class="image" />
    <!-- Bulldozer cabin -->
    <rect x="150" y="50" width="100" height="80" class="image" />
    <!-- Bulldozer tracks -->
    <rect x="20" y="130" width="310" height="20" class="image" />
    <rect x="20" y="150" width="310" height="20" class="image" />
    <!-- Bulldozer windows -->
    <rect x="160" y="60" width="20" height="20" class="image" />
    <rect x="190" y="60" width="20" height="20" class="image" />
    <!-- Bulldozer exhaust -->
    <line x1="250" y1="50" x2="280" y2="20" class="image" />
  </g>
</svg>