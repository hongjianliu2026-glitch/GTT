<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">homage</text>
  <text x="50" y="120" class="subtitle">[ˈhɒmɪdʒ] n. 尊敬，敬意</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> homo- (相同) + age (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人向一位英雄鞠躬，"表现出相同的行为(homo-age)"，
    <tspan x="50" dy="25">以此表达对英雄的尊敬(homage)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd paid homage to the fallen hero.
  </text>
  <text x="50" y="310" class="content">
    人群向倒下的英雄表达了敬意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hero -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
    <line x1="100" y1="150" x2="50" y2="140" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />

    <!-- Crowd -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />

    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="300" y2="120" class="image" />

    <!-- Bowing -->
    <line x1="200" y1="150" x2="200" y2="180" class="image" />
    <line x1="250" y1="150" x2="250" y2="180" class="image" />
  </g>
</svg>