<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nurture</text>
  <text x="50" y="120" class="subtitle">[ˈnɜːrtʃər] v. 养育，培育；n. 养育，培育</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nur (滋养) + ture (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个母亲温柔地"滋养(nur)"她的孩子，
    <tspan x="50" dy="25">这种行为就是"养育(ture)"，即nurture。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She nurtured her garden with great care.
  </text>
  <text x="50" y="310" class="content">
    她非常细心地培育她的花园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother and child -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Mother's head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Mother's body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Mother's left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Mother's right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Mother's left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Mother's right leg -->

    <circle cx="120" cy="120" r="20" class="image" /> <!-- Child's head -->
    <line x1="120" y1="140" x2="120" y2="170" class="image" /> <!-- Child's body -->
    <line x1="120" y1="155" x2="100" y2="150" class="image" /> <!-- Child's left arm -->
    <line x1="120" y1="155" x2="140" y2="150" class="image" /> <!-- Child's right arm -->
    <line x1="120" y1="170" x2="100" y2="200" class="image" /> <!-- Child's left leg -->
    <line x1="120" y1="170" x2="140" y2="200" class="image" /> <!-- Child's right leg -->

    <!-- Heart symbol -->
    <path d="M100,100 C100,50 150,50 150,100" class="image" />
    <path d="M100,100 C100,150 150,150 150,100" class="image" />
  </g>
</svg>