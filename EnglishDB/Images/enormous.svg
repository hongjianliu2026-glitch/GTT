<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enormous</text>
  <text x="50" y="120" class="subtitle">[ɪˈnɔːrməs] adj. 巨大的，庞大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + norm (规则) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"超出(e-)"所有"规则(norm)"的"巨大(enormous)"怪兽，
    <tspan x="50" dy="25">它的体型大到无法用常规标准衡量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enormous whale breached the surface of the ocean.
  </text>
  <text x="50" y="310" class="content">
    巨大的鲸鱼跃出海面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="80" class="image" /> <!-- Head -->
    <line x1="100" y1="180" x2="100" y2="300" class="image" /> <!-- Body -->
    <line x1="100" y1="220" x2="20" y2="200" class="image" /> <!-- Left arm -->
    <line x1="100" y1="220" x2="180" y2="200" class="image" /> <!-- Right arm -->
    <line x1="100" y1="300" x2="50" y2="350" class="image" /> <!-- Left leg -->
    <line x1="100" y1="300" x2="150" y2="350" class="image" /> <!-- Right leg -->
    <!-- Exclamation marks -->
    <text x="200" y="150" class="content" font-size="48">!!!</text>
  </g>
</svg>