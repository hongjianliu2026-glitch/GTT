<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">face-lift</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪslɪft] n. 整容手术，翻新</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> face (脸) + lift (提升)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女人躺在手术台上，医生用"提升(lift)"
    <tspan x="50" dy="25">她的脸部(face)，使她看起来更年轻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to have a face-lift to look younger.
  </text>
  <text x="50" y="310" class="content">
    她决定做整容手术以显得更年轻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="80" r="5" class="image" />
    <circle cx="125" cy="80" r="5" class="image" />
    <!-- Mouth -->
    <line x1="75" y1="120" x2="125" y2="120" class="image" />
    <!-- Lift arrows -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="70" y2="30" class="image" />
    <line x1="150" y1="50" x2="130" y2="30" class="image" />
  </g>
</svg>