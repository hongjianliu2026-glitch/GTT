<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">matinee</text>
  <text x="50" y="120" class="subtitle">[ˌmætɪˈneɪ] n. 日场演出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> matin (早晨) + -ee (表示动作的接受者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阳光明媚的早晨，"早晨(matin)"
    <tspan x="50" dy="25">的演出(matinee)，观众们坐在剧院里，</tspan>
    <tspan x="50" dy="25">享受着日场的精彩表演。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We attended a matinee performance of the play.
  </text>
  <text x="50" y="310" class="content">
    我们参加了一场日场演出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Theater stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="30" cy="30" r="20" fill="#F1C40F" />
    <!-- Theater seats -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Curtain -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <!-- Audience -->
    <circle cx="80" cy="100" r="10" fill="#2C3E50" />
    <circle cx="120" cy="100" r="10" fill="#2C3E50" />
    <circle cx="160" cy="100" r="10" fill="#2C3E50" />
    <circle cx="200" cy="100" r="10" fill="#2C3E50" />
    <circle cx="240" cy="100" r="10" fill="#2C3E50" />
  </g>
</svg>