<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fidget</text>
  <text x="50" y="120" class="subtitle">[ˈfɪdʒɪt] v. 坐立不安，烦躁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fid (信任) + get (得到)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为"失去信任(fid-get)"而变得
    <tspan x="50" dy="25">坐立不安，不停地动来动去，这就是fidget。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She couldn't sit still and kept fidgeting during the lecture.
  </text>
  <text x="50" y="310" class="content">
    她在讲座中无法静坐，一直坐立不安。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person fidgeting -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="90" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="90" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Fidgeting motion -->
    <line x1="30" y1="100" x2="20" y2="90" class="image" />
    <line x1="70" y1="100" x2="80" y2="90" class="image" />
    <line x1="30" y1="160" x2="20" y2="170" class="image" />
    <line x1="70" y1="160" x2="80" y2="170" class="image" />
  </g>
</svg>