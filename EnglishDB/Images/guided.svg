<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">guided</text>
  <text x="50" y="120" class="subtitle">[ˈɡaɪdɪd] adj. 有指导的，受引导的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> guid (引导) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个迷路的人，突然看到一个"引导者(guid)"
    <tspan x="50" dy="25">在前方指引方向，这个人就变得"有指导的(guided)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The guided tour through the museum was very informative.
  </text>
  <text x="50" y="310" class="content">
    博物馆的导览非常具有教育意义。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path -->
    <path d="M50 50 Q150 150 250 50" class="image" />
    <!-- Person -->
    <circle cx="70" cy="50" r="15" class="image" />
    <line x1="70" y1="65" x2="70" y2="100" class="image" />
    <line x1="70" y1="100" x2="50" y2="130" class="image" />
    <line x1="70" y1="100" x2="90" y2="130" class="image" />
    <line x1="70" y1="80" x2="100" y2="70" class="image" />
    <!-- Guide -->
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
    <!-- Arrow -->
    <polygon points="200,150 180,140 180,160" class="image" />
  </g>
</svg>