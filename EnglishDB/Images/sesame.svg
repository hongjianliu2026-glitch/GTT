<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sesame</text>
  <text x="50" y="120" class="subtitle">[ˈsɛsəmi] n. 芝麻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sesam (芝麻)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小精灵在芝麻田里，"撒下(sesam)"
    <tspan x="50" dy="25">芝麻种子，这些种子就长成了芝麻(sesame)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sprinkled sesame seeds on her burger.
  </text>
  <text x="50" y="310" class="content">
    她在汉堡上撒了芝麻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sesame field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sesame seeds -->
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="100" cy="120" r="10" class="image" />
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="250" cy="90" r="10" class="image" />
    <circle cx="300" cy="130" r="10" class="image" />
    <!-- Elf -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>