<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .medal { fill: #D4AF37; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">medal</text>
  <text x="50" y="120" class="subtitle">[ˈmɛdl] n. 奖章，勋章</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> med (治疗) + -al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的医生，"治疗(med)"
    <tspan x="50" dy="25">了无数病人，最终获得了一枚金光闪闪的奖章(medal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was awarded a medal for her bravery.
  </text>
  <text x="50" y="310" class="content">
    她因勇敢而获得了一枚奖章。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Medal -->
    <circle cx="100" cy="100" r="50" class="medal" />
    <circle cx="100" cy="100" r="48" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Doctor -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="210" class="image" />
    <line x1="250" y1="180" x2="270" y2="210" class="image" />
    <line x1="250" y1="150" x2="220" y2="140" class="image" />
    <line x1="250" y1="150" x2="280" y2="140" class="image" />
    <!-- Hand holding medal -->
    <line x1="250" y1="120" x2="100" y2="120" class="image" />
  </g>
</svg>