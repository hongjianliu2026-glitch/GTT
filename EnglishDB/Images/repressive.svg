<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">repressive</text>
  <text x="50" y="120" class="subtitle">[rɪˈpresɪv] adj. 压抑的，压制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + press (压) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头"再次压下(re-press)"，
    <tspan x="50" dy="25">压得人们喘不过气，这就是压抑的(repressive)场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The repressive regime imposed strict censorship.
  </text>
  <text x="50" y="310" class="content">
    这个压抑的政权实施了严格的审查制度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant stone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People under the stone -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <line x1="200" y1="165" x2="200" y2="190" class="image" />
    <line x1="200" y1="190" x2="180" y2="220" class="image" />
    <line x1="200" y1="190" x2="220" y2="220" class="image" />
    <line x1="200" y1="175" x2="230" y2="165" class="image" />
  </g>
</svg>