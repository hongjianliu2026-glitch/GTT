<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">violent</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪələnt] adj. 暴力的，猛烈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> viol (力量) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满"力量(viol)"的场景，
    <tspan x="50" dy="25">一个人被猛烈地推倒在地，这就是"暴力的(violent)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie contains some violent scenes.
  </text>
  <text x="50" y="310" class="content">
    这部电影包含一些暴力场景。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Person being pushed -->
    <circle cx="100" cy="120" r="20" class="image" />
    <line x1="100" y1="140" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Forceful hand -->
    <line x1="150" y1="120" x2="100" y2="120" class="image" />
    <line x1="150" y1="120" x2="140" y2="110" class="image" />
    <line x1="150" y1="120" x2="140" y2="130" class="image" />
  </g>
</svg>