<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">romantic</text>
  <text x="50" y="120" class="subtitle">[roʊˈmæntɪk] adj. 浪漫的，多情的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rom (罗马) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古罗马的情侣，在月光下漫步，"罗马式的(rom-antic)"
    <tspan x="50" dy="25">爱情故事，充满了浪漫和激情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They had a romantic dinner by the sea.
  </text>
  <text x="50" y="310" class="content">
    他们在海边享用了一顿浪漫的晚餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Couple -->
    <circle cx="50" cy="150" r="15" fill="#E74C3C" />
    <circle cx="150" cy="150" r="15" fill="#E74C3C" />
    <line x1="50" y1="165" x2="150" y2="165" stroke="#E74C3C" stroke-width="2" />
    <!-- Heart -->
    <path d="M100,200 C80,180 60,220 100,240 C140,220 120,180 100,200" fill="#E74C3C" />
  </g>
</svg>