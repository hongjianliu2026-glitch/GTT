<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .vinegar { fill: #873600; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vinegar</text>
  <text x="50" y="120" class="subtitle">[ˈvɪnɪɡər] n. 醋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vin (葡萄酒) + -gar (酸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的酿酒师，将葡萄酒"变酸(vin-gar)"，
    <tspan x="50" dy="25">结果就得到了醋(vinegar)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added a splash of vinegar to the salad.
  </text>
  <text x="50" y="310" class="content">
    她在沙拉里加了一点醋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wine bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="20" class="image" />
    <!-- Vinegar bottle -->
    <rect x="150" y="0" width="100" height="200" class="image" />
    <circle cx="200" cy="220" r="20" class="image" />
    <!-- Acidic liquid -->
    <rect x="160" y="180" width="80" height="20" class="vinegar" />
    <!-- Transformation arrow -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <polygon points="145,95 150,100 145,105" class="image" />
  </g>
</svg>