<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">top-down</text>
  <text x="50" y="120" class="subtitle">[ˈtɒp daʊn] adj. 自上而下的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> top (顶部) + down (向下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的瀑布从山顶倾泻而下，"从顶部向下(top-down)"
    <tspan x="50" dy="25">流动，形成壮观的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company implemented a top-down management style.
  </text>
  <text x="50" y="310" class="content">
    公司采用了自上而下的管理风格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Waterfall -->
    <line x1="150" y1="0" x2="150" y2="200" class="image" />
    <line x1="140" y1="20" x2="160" y2="20" class="image" />
    <line x1="130" y1="40" x2="170" y2="40" class="image" />
    <line x1="120" y1="60" x2="180" y2="60" class="image" />
    <line x1="110" y1="80" x2="190" y2="80" class="image" />
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="90" y1="120" x2="210" y2="120" class="image" />
    <line x1="80" y1="140" x2="220" y2="140" class="image" />
    <line x1="70" y1="160" x2="230" y2="160" class="image" />
    <line x1="60" y1="180" x2="240" y2="180" class="image" />
    <line x1="50" y1="200" x2="250" y2="200" class="image" />
  </g>
</svg>