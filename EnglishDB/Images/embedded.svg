<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">embedded</text>
  <text x="50" y="120" class="subtitle">[ɪmˈbedɪd] adj. 嵌入的，植入的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (进入) + bed (床)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微型芯片被"放入(em-)"一个电路板中，
    <tspan x="50" dy="25">就像一颗种子被"植入(bed)"土壤中，完全融入其中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The system has an embedded security feature.
  </text>
  <text x="50" y="310" class="content">
    该系统具有嵌入式安全功能。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circuit board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Embedded chip -->
    <rect x="100" y="50" width="100" height="100" class="image" />
    <!-- Lines connecting chip to board -->
    <line x1="150" y1="50" x2="150" y2="0" class="image" />
    <line x1="200" y1="50" x2="200" y2="0" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
  </g>
</svg>