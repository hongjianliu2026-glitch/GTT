<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exaggerate</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzædʒəreɪt] v. 夸张，夸大</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + agger (堆积) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在说话时，"把事实堆积(agger)"
    <tspan x="50" dy="25">到外面(ex-)，结果就是夸张(exaggerate)了事实。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tends to exaggerate the difficulties.
  </text>
  <text x="50" y="310" class="content">
    她倾向于夸大困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Exaggerated words -->
    <text x="150" y="100" class="image" font-size="30" fill="#C0392B">WOW!</text>
    <text x="150" y="150" class="image" font-size="30" fill="#C0392B">HUGE!</text>
    <text x="150" y="200" class="image" font-size="30" fill="#C0392B">AMAZING!</text>
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" fill="#A93226" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="140" x2="60" y2="130" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
  </g>
</svg>