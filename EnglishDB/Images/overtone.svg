<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overtone</text>
  <text x="50" y="120" class="subtitle">[ˈoʊvərtəʊn] n. 泛音，暗示</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + tone (音调)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在演奏时，"在主音调之上(over-tone)"
    <tspan x="50" dy="25">叠加了额外的音调，这些音调就是泛音(overtone)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The speech had an overtone of sadness.
  </text>
  <text x="50" y="310" class="content">
    演讲中带有一丝悲伤的意味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main tone -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <text x="175" y="40" class="content" text-anchor="middle">Main Tone</text>
    <!-- Overtone -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <text x="175" y="90" class="content" text-anchor="middle">Overtone</text>
    <!-- Musician -->
    <circle cx="20" cy="75" r="15" class="image" />
    <line x1="20" y1="90" x2="20" y2="120" class="image" />
    <line x1="20" y1="120" x2="0" y2="150" class="image" />
    <line x1="20" y1="120" x2="40" y2="150" class="image" />
    <line x1="20" y1="105" x2="50" y2="95" class="image" />
  </g>
</svg>