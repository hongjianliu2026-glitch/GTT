<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">challenger</text>
  <text x="50" y="120" class="subtitle">[ˈtʃælɪndʒər] n. 挑战者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> challen (挑战) + -ger (者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的"挑战者(challenger)"，他站在
    <tspan x="50" dy="25">一座高山的顶端，面对着巨大的风暴，</tspan>
    <tspan x="50" dy="25">准备迎接任何挑战。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The challenger climbed the mountain without fear.
  </text>
  <text x="50" y="310" class="content">
    挑战者毫不畏惧地攀登了那座山。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Storm clouds -->
    <ellipse cx="150" cy="50" rx="100" ry="30" class="image" />
    <ellipse cx="200" cy="80" rx="80" ry="25" class="image" />
    <ellipse cx="100" cy="100" rx="90" ry="35" class="image" />
    <!-- Challenger -->
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="190" class="image" />
    <line x1="150" y1="190" x2="135" y2="210" class="image" />
    <line x1="150" y1="190" x2="165" y2="210" class="image" />
    <line x1="150" y1="175" x2="120" y2="165" class="image" />
    <line x1="150" y1="175" x2="180" y2="165" class="image" />
  </g>
</svg>