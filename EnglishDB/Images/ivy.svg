<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ivy</text>
  <text x="50" y="120" class="subtitle">[ˈaɪvi] n. 常春藤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "hedera"，意为常春藤
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堵墙上爬满了常春藤(ivy)，
    <tspan x="50" dy="25">它们像绿色的蛇一样蜿蜒而上，覆盖了整面墙。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house was covered in ivy.
  </text>
  <text x="50" y="310" class="content">
    那座老房子被常春藤覆盖了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="300" class="image" />
    <!-- Ivy -->
    <path d="M50,50 C60,30 100,30 110,50 S150,70 160,50" class="image" />
    <path d="M50,100 C60,80 100,80 110,100 S150,120 160,100" class="image" />
    <path d="M50,150 C60,130 100,130 110,150 S150,170 160,150" class="image" />
    <path d="M50,200 C60,180 100,180 110,200 S150,220 160,200" class="image" />
    <path d="M50,250 C60,230 100,230 110,250 S150,270 160,250" class="image" />
  </g>
</svg>