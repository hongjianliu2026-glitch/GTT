<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mother</text>
  <text x="50" y="120" class="subtitle">[ˈmʌðər] n. 母亲，妈妈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mot (移动) + her (她)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个母亲，她总是"移动(mot)"着，
    <tspan x="50" dy="25">照顾着她的孩子，这就是"她(her)"，我们的母亲(mother)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My mother always takes care of me.
  </text>
  <text x="50" y="310" class="content">
    我的妈妈总是照顾我。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother figure -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Child figure -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="190" class="image" />
    <line x1="150" y1="130" x2="120" y2="140" class="image" />
    <line x1="150" y1="130" x2="180" y2="140" class="image" />
    <!-- Heart symbol -->
    <path d="M200,50 C210,30 240,30 250,50 L250,100 C240,120 210,120 200,100 Z" class="image" />
  </g>
</svg>