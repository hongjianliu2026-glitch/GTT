<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gravy</text>
  <text x="50" y="120" class="subtitle">[ˈɡreɪvi] n. 肉汁，肉汤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grav (重) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一盘美味的肉汁，"重(grav)"
    <tspan x="50" dy="25">的香气扑鼻而来，让人垂涎欲滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roast beef was served with rich gravy.
  </text>
  <text x="50" y="310" class="content">
    烤牛肉配上了浓郁的肉汁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gravy -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#D6DBDF" />
    <!-- Dripping effect -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" stroke="#85929E" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" stroke="#85929E" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" stroke="#85929E" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" stroke="#85929E" />
    <!-- Spoon -->
    <line x1="20" y1="100" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>