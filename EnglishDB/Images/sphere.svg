<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sphere</text>
  <text x="50" y="120" class="subtitle">[sfɪər] n. 球体，范围，领域</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sphaira (希腊语，球体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的球体，"球体(sphaira)"
    <tspan x="50" dy="25">象征着无限的可能性和广阔的领域。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His influence extends beyond the political sphere.
  </text>
  <text x="50" y="310" class="content">
    他的影响力超出了政治领域。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sphere -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Globe lines -->
    <circle cx="175" cy="100" r="70" class="image" />
    <circle cx="175" cy="100" r="60" class="image" />
    <circle cx="175" cy="100" r="50" class="image" />
    <circle cx="175" cy="100" r="40" class="image" />
    <circle cx="175" cy="100" r="30" class="image" />
    <circle cx="175" cy="100" r="20" class="image" />
    <circle cx="175" cy="100" r="10" class="image" />
  </g>
</svg>