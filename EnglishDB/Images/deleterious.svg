<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deleterious</text>
  <text x="50" y="120" class="subtitle">[ˌdɛlɪˈtɪriəs] adj. 有害的，有毒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + leter (伤害) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个有毒的蘑菇，"向下伤害(de-leter)"
    <tspan x="50" dy="25">周围的一切，这就是有害的(deleterious)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The deleterious effects of smoking are well-known.
  </text>
  <text x="50" y="310" class="content">
    吸烟的有害影响是众所周知的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Poisonous mushroom -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="200" x2="50" y2="180" class="image" />
    <line x1="100" y1="200" x2="150" y2="180" class="image" />
    <line x1="100" y1="200" x2="70" y2="230" class="image" />
    <line x1="100" y1="200" x2="130" y2="230" class="image" />
    <!-- Poison symbol -->
    <circle cx="100" cy="100" r="10" class="image" fill="#E74C3C" />
    <line x1="90" y1="90" x2="110" y2="110" class="image" />
    <line x1="90" y1="110" x2="110" y2="90" class="image" />
  </g>
</svg>