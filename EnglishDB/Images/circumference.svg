<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">circumference</text>
  <text x="50" y="120" class="subtitle">[sərˈkʌmfərəns] n. 圆周，周长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> circum- (周围) + fer (携带) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆圈，"周围(circum-)"
    <tspan x="50" dy="25">携带(fer)着所有的点，这些点构成了圆的周长(circumference)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The circumference of the Earth is approximately 40,075 kilometers.
  </text>
  <text x="50" y="310" class="content">
    地球的周长大约是40,075公里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Points around the circle -->
    <circle cx="95" cy="100" r="5" class="image" />
    <circle cx="175" cy="20" r="5" class="image" />
    <circle cx="255" cy="100" r="5" class="image" />
    <circle cx="175" cy="180" r="5" class="image" />
    <!-- Arrows -->
    <line x1="95" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="20" x2="255" y2="100" class="image" />
    <line x1="255" y1="100" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="95" y2="100" class="image" />
  </g>
</svg>