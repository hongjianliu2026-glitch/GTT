<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clang</text>
  <text x="50" y="120" class="subtitle">[klæŋ] v. 发出叮当声，碰撞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cl- (表示声音) + ang (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钟摆，"叮当(cl-ang)"
    <tspan x="50" dy="25">作响，声音回荡在整个大厅，让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old bell clang loudly every morning.
  </text>
  <text x="50" y="310" class="content">
    那口老钟每天早晨都会发出响亮的叮当声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bell -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Clapper -->
    <line x1="100" y1="160" x2="100" y2="200" class="image" />
    <line x1="100" y1="180" x2="50" y2="180" class="image" />
    <!-- Sound waves -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
  </g>
</svg>