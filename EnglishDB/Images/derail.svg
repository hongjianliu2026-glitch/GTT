<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">derail</text>
  <text x="50" y="120" class="subtitle">[dɪˈreɪl] v. 使出轨，使偏离</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + rail (轨道)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆火车正在轨道上行驶，突然"离开(de-)"
    <tspan x="50" dy="25">轨道(rail)，冲出了轨道，这就是出轨(derail)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting was derailed by unexpected interruptions.
  </text>
  <text x="50" y="310" class="content">
    会议被意外的打断打乱了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Train tracks -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Train -->
    <rect x="150" y="50" width="100" height="50" class="image" />
    <circle cx="160" cy="100" r="10" class="image" />
    <circle cx="240" cy="100" r="10" class="image" />
    <!-- Derailed train -->
    <rect x="250" y="150" width="100" height="50" class="image" />
    <circle cx="260" cy="200" r="10" class="image" />
    <circle cx="340" cy="200" r="10" class="image" />
    <!-- Derailment -->
    <line x1="250" y1="150" x2="350" y2="250" class="image" />
  </g>
</svg>