<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dictatorial</text>
  <text x="50" y="120" class="subtitle">[ˌdɪktəˈtɔːriəl] adj. 独裁的，专制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dict (说) + ator (人) + ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个独裁者站在高台上，"大声说(dict)"
    <tspan x="50" dy="25">出他的命令，所有人都必须服从，这就是独裁(dictatorial)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leader's dictatorial behavior caused widespread discontent.
  </text>
  <text x="50" y="310" class="content">
    领导人的独裁行为引起了广泛的不满。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dictator -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="100" x2="120" y2="90" class="image" />
    <line x1="175" y1="100" x2="230" y2="90" class="image" />
    <!-- Speech bubble -->
    <path d="M200,30 Q250,30 250,60 Q200,60 200,30 Z" class="image" />
    <text x="210" y="50" class="content">"服从我！"</text>
  </g>
</svg>