<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ensue</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsuː] v. 接着发生，接踵而来</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + sue (跟随)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个事件发生后，"使(en-)"
    <tspan x="50" dy="25">另一个事件"跟随(sue)"而来，这就是接踵而至(ensue)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the storm, floods ensued.
  </text>
  <text x="50" y="310" class="content">
    暴风雨过后，洪水接踵而至。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First event: Storm -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="75" y1="20" x2="75" y2="70" class="image" />
    <line x1="75" y1="70" x2="50" y2="70" class="image" />
    <line x1="75" y1="70" x2="100" y2="70" class="image" />
    <line x1="75" y1="45" x2="50" y2="45" class="image" />
    <line x1="75" y1="45" x2="100" y2="45" class="image" />

    <!-- Second event: Flood -->
    <rect x="150" y="20" width="100" height="50" class="image" />
    <line x1="150" y1="20" x2="250" y2="20" class="image" />
    <line x1="150" y1="70" x2="250" y2="70" class="image" />
    <line x1="150" y1="20" x2="150" y2="70" class="image" />
    <line x1="250" y1="20" x2="250" y2="70" class="image" />

    <!-- Arrow indicating sequence -->
    <line x1="125" y1="45" x2="145" y2="45" class="image" />
    <polygon points="145,40 155,45 145,50" class="image" />
  </g>
</svg>