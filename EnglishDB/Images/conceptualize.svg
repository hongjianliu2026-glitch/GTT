<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conceptualize</text>
  <text x="50" y="120" class="subtitle">[kənˈsɛptʃuəˌlaɪz] v. 使概念化，构思</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + cept (拿) + -ual (形容词后缀) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在脑海中"共同拿取(con-cept)"
    <tspan x="50" dy="25">各种元素，将它们组合成一个全新的概念(conceptualize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She conceptualized a new design for the product.
  </text>
  <text x="50" y="310" class="content">
    她为产品构思了一个新的设计。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Lightning bolt -->
    <polyline points="100,20 150,100 100,180 50,100" class="image" />
    <!-- Elements -->
    <rect x="20" y="20" width="30" height="30" class="image" />
    <rect x="150" y="20" width="30" height="30" class="image" />
    <rect x="20" y="150" width="30" height="30" class="image" />
    <rect x="150" y="150" width="30" height="30" class="image" />
    <!-- Merging elements -->
    <line x1="55" y1="35" x2="145" y2="35" class="image" />
    <line x1="55" y1="165" x2="145" y2="165" class="image" />
    <line x1="35" y1="55" x2="35" y2="145" class="image" />
    <line x1="165" y1="55" x2="165" y2="145" class="image" />
  </g>
</svg>