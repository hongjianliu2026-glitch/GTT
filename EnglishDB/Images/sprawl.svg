<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sprawl</text>
  <text x="50" y="120" class="subtitle">[sprɔːl] v. 蔓延，伸展；n. 蔓延状</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (向外) + prau (伸展)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片城市区域，建筑物和道路"向外伸展(s-prawl)"，
    <tspan x="50" dy="25">形成一片无序蔓延的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city sprawls for miles in every direction.
  </text>
  <text x="50" y="310" class="content">
    这座城市向四面八方蔓延了数英里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Buildings -->
    <rect x="0" y="0" width="50" height="100" class="image" />
    <rect x="60" y="20" width="50" height="80" class="image" />
    <rect x="120" y="40" width="50" height="60" class="image" />
    <rect x="180" y="60" width="50" height="40" class="image" />
    <!-- Roads -->
    <line x1="0" y1="120" x2="230" y2="120" class="image" />
    <line x1="0" y1="140" x2="230" y2="140" class="image" />
    <line x1="0" y1="160" x2="230" y2="160" class="image" />
  </g>
</svg>