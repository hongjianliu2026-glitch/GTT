<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">claim</text>
  <text x="50" y="120" class="subtitle">[kleɪm] v. 声称，要求；n. 声明，要求</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clam (喊叫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在山顶上，大声"喊叫(clam)"
    <tspan x="50" dy="25">出自己的要求或声明，这就是claim的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He claimed that he had seen a UFO.
  </text>
  <text x="50" y="310" class="content">
    他声称自己看到了不明飞行物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,100 L100,0 L200,100 Z" class="image" />
    <!-- Person shouting -->
    <circle cx="100" cy="80" r="15" class="image" />
    <line x1="100" y1="95" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="150" class="image" />
    <line x1="100" y1="105" x2="130" y2="95" class="image" />
    <!-- Speech bubble -->
    <path d="M130,70 Q180,60 200,100" class="image" />
    <text x="140" y="85" class="content">I claim!</text>
  </g>
</svg>