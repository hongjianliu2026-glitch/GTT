<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">remorse</text>
  <text x="50" y="120" class="subtitle">[rɪˈmɔːrs] n. 懊悔，悔恨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + morse (痛苦)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为做错了事，内心"再次(re-)"感受到"痛苦(morse)"，
    <tspan x="50" dy="25">这种深深的懊悔(remorse)让他无法释怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He felt a deep remorse for his actions.
  </text>
  <text x="50" y="310" class="content">
    他对自己的行为感到深深的懊悔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <!-- Broken heart -->
    <line x1="10" y1="30" x2="70" y2="30" class="image" />
    <!-- Tears -->
    <circle cx="20" cy="40" r="5" class="image" />
    <circle cx="35" cy="45" r="5" class="image" />
    <circle cx="50" cy="40" r="5" class="image" />
    <circle cx="65" cy="45" r="5" class="image" />
  </g>
</svg>