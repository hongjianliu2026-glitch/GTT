<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rout</text>
  <text x="50" y="120" class="subtitle">[raʊt] v. 击溃，彻底打败</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ro- (root, 根) + ut (out, 出)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一支军队被彻底击溃，"根(ro-)"都被拔"出(ut)"了，
    <tspan x="50" dy="25">敌人四处逃散，这就是"rout"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enemy was routed in the battle.
  </text>
  <text x="50" y="310" class="content">
    敌人在战斗中被彻底击溃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Defeated soldiers -->
    <line x1="50" y1="20" x2="100" y2="180" class="image" />
    <line x1="100" y1="20" x2="150" y2="180" class="image" />
    <line x1="150" y1="20" x2="200" y2="180" class="image" />
    <line x1="200" y1="20" x2="250" y2="180" class="image" />
    <line x1="250" y1="20" x2="300" y2="180" class="image" />
    <!-- Routed soldiers -->
    <circle cx="75" cy="100" r="10" class="image" />
    <circle cx="125" cy="100" r="10" class="image" />
    <circle cx="175" cy="100" r="10" class="image" />
    <circle cx="225" cy="100" r="10" class="image" />
    <circle cx="275" cy="100" r="10" class="image" />
    <!-- Running arrows -->
    <line x1="75" y1="100" x2="50" y2="150" class="image" />
    <line x1="125" y1="100" x2="100" y2="150" class="image" />
    <line x1="175" y1="100" x2="150" y2="150" class="image" />
    <line x1="225" y1="100" x2="200" y2="150" class="image" />
    <line x1="275" y1="100" x2="250" y2="150" class="image" />
  </g>
</svg>