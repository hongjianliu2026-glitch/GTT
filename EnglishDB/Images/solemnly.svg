<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">solemnly</text>
  <text x="50" y="120" class="subtitle">[ˈsɒləmli] adv. 庄严地，严肃地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sol (太阳) + emn (庄严)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个庄严的仪式，太阳(sol)高照，
    <tspan x="50" dy="25">人们严肃地(emn)站立，整个场景庄严地(solemnly)进行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge solemnly swore in the new president.
  </text>
  <text x="50" y="310" class="content">
    法官庄严地宣誓新总统就职。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- People -->
    <rect x="200" y="50" width="50" height="100" class="image" />
    <rect x="260" y="50" width="50" height="100" class="image" />
    <rect x="320" y="50" width="50" height="100" class="image" />
    <!-- Ground -->
    <rect x="0" y="150" width="400" height="50" class="image" fill="#8B4513" />
  </g>
</svg>