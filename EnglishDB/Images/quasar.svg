<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quasar</text>
  <text x="50" y="120" class="subtitle">[ˈkweɪzɑːr] n. 类星体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quasi- (类似) + star (星星)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"类似星星(quasi-star)"的天体，
    <tspan x="50" dy="25">它释放出比整个星系还要强烈的光芒，这就是类星体(quasar)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Astronomers have discovered a new quasar in the distant universe.
  </text>
  <text x="50" y="310" class="content">
    天文学家在遥远的宇宙中发现了一个新的类星体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star-like object -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Rays of light -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Galaxy -->
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="270" cy="120" r="15" class="image" />
    <circle cx="230" cy="130" r="10" class="image" />
    <circle cx="280" cy="80" r="12" class="image" />
  </g>
</svg>