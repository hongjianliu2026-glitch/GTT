<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ease</text>
  <text x="50" y="120" class="subtitle">[iːz] n. 轻松，舒适；v. 减轻，缓和</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + -ase (放松)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在柔软的沙发上，"放松(ease)"
    <tspan x="50" dy="25">身体，享受着轻松的时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The massage helped to ease the tension in my shoulders.
  </text>
  <text x="50" y="310" class="content">
    按摩帮助缓解了我肩膀的紧张。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sofa -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Person relaxing -->
    <circle cx="100" cy="75" r="20" class="image" />
    <line x1="100" y1="95" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="80" y2="150" class="image" />
    <line x1="100" y1="130" x2="120" y2="150" class="image" />
    <line x1="100" y1="110" x2="130" y2="100" class="image" />
  </g>
</svg>