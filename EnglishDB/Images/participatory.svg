<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">participatory</text>
  <text x="50" y="120" class="subtitle">[pɑːrˌtɪsɪˈpætəri] adj. 参与的，有参与权的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> parti (部分) + cip (拿) + atory (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，每个人都在"拿(cip)"
    <tspan x="50" dy="25">出自己的"部分(parti)"，共同参与(participatory)一个决策。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting was highly participatory, with everyone contributing ideas.
  </text>
  <text x="50" y="310" class="content">
    会议非常具有参与性，每个人都贡献了想法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Hands -->
    <line x1="50" y1="65" x2="30" y2="90" class="image" />
    <line x1="150" y1="65" x2="130" y2="90" class="image" />
    <line x1="250" y1="65" x2="230" y2="90" class="image" />
    <!-- Ideas -->
    <circle cx="40" cy="100" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
    <circle cx="240" cy="100" r="10" class="image" />
  </g>
</svg>