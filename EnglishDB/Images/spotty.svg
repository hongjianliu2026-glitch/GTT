<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spotty</text>
  <text x="50" y="120" class="subtitle">[ˈspɒti] adj. 有斑点的，不均匀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spot (斑点) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的斑点怪兽，身上布满了各种大小不一的斑点，
    <tspan x="50" dy="25">这些斑点让它的皮肤看起来"有斑点的(spotty)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The weather was spotty today, with occasional showers.
  </text>
  <text x="50" y="310" class="content">
    今天的天气不均匀，偶尔有阵雨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spotty monster -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="70" cy="120" r="12" class="image" />
    <circle cx="130" cy="120" r="18" class="image" />
    <circle cx="100" cy="80" r="14" class="image" />
    <circle cx="60" cy="90" r="16" class="image" />
    <circle cx="140" cy="90" r="13" class="image" />
  </g>
</svg>