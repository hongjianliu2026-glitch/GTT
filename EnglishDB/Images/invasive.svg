<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">invasive</text>
  <text x="50" y="120" class="subtitle">[ɪnˈveɪsɪv] adj. 侵入的，侵略性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vas (走) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的章鱼，"走进(in-vas)"
    <tspan x="50" dy="25">一个平静的村庄，它的触手四处蔓延，</tspan>
    <tspan x="50" dy="25">侵入(invasive)每一个角落。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The invasive species has destroyed the local ecosystem.
  </text>
  <text x="50" y="310" class="content">
    这种侵入性物种破坏了当地的生态系统。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Octopus -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="150" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="180" class="image" />
    <line x1="200" y1="130" x2="175" y2="180" class="image" />
    <line x1="200" y1="130" x2="225" y2="180" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
  </g>
</svg>