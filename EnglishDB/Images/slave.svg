<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slave</text>
  <text x="50" y="120" class="subtitle">[sleɪv] n. 奴隶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slav (斯拉夫人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个斯拉夫人被"束缚(slav)"在枷锁中，
    <tspan x="50" dy="25">成为了奴隶(slave)，这个画面让人深感压迫。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The abolition of slavery was a significant milestone.
  </text>
  <text x="50" y="310" class="content">
    废除奴隶制是一个重要的里程碑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shackles -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <!-- Slave -->
    <circle cx="100" cy="150" r="30" class="image" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="220" class="image" />
    <line x1="100" y1="200" x2="150" y2="220" class="image" />
  </g>
</svg>