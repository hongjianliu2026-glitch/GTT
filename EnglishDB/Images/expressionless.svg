<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">expressionless</text>
  <text x="50" y="120" class="subtitle">[ɪkˈspreʃənləs] adj. 无表情的，呆板的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + press (压) + -ion (名词后缀) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人脸上"压(press)"不出任何表情，
    <tspan x="50" dy="25">就像一块僵硬的石头，完全没有表情(expressionless)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His expressionless face made it hard to tell what he was thinking.
  </text>
  <text x="50" y="310" class="content">
    他那无表情的脸让人难以猜透他在想什么。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="85" r="5" class="image" />
    <circle cx="125" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <line x1="75" y1="120" x2="125" y2="120" class="image" />
    <!-- Stone -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <text x="160" y="110" class="content">石头</text>
  </g>
</svg>