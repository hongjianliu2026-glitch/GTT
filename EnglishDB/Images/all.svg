<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">all</text>
  <text x="50" y="120" class="subtitle">[ɔːl] adj. 所有的，全部的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *alaz (全部)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆圈，里面包含了"所有(all)"的东西，
    <tspan x="50" dy="25">从微小的尘埃到巨大的星球，一切都在这个圆圈里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She ate all the cookies.
  </text>
  <text x="50" y="310" class="content">
    她把所有的饼干都吃了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large circle representing "all" -->
    <circle cx="175" cy="100" r="100" class="image" />
    <!-- Smaller elements inside the circle -->
    <circle cx="120" cy="70" r="10" class="image" />
    <rect x="150" y="50" width="20" height="20" class="image" />
    <line x1="200" y1="50" x2="230" y2="80" class="image" />
    <circle cx="220" cy="120" r="15" class="image" />
    <rect x="100" y="120" width="30" height="30" class="image" />
  </g>
</svg>