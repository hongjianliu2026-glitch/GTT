<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sloth</text>
  <text x="50" y="120" class="subtitle">[sloʊθ] n. 树懒，懒惰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sloth (懒惰)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只树懒挂在树上，"懒洋洋地(sloth)"
    <tspan x="50" dy="25">一动不动，仿佛时间都静止了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sloth moved so slowly that it seemed almost immobile.
  </text>
  <text x="50" y="310" class="content">
    这只树懒移动得如此缓慢，几乎像是静止不动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree branch -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Sloth -->
    <circle cx="175" cy="50" r="30" class="image" />
    <line x1="175" y1="80" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="145" y2="200" class="image" />
    <line x1="175" y1="150" x2="205" y2="200" class="image" />
    <line x1="175" y1="120" x2="225" y2="110" class="image" />
    <line x1="175" y1="120" x2="125" y2="110" class="image" />
  </g>
</svg>