<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mighty</text>
  <text x="50" y="120" class="subtitle">[ˈmaɪti] adj. 强大的，有力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> might (力量) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨人，"力量(might)"
    <tspan x="50" dy="25">无穷无尽，他就是"强大的(mighty)"象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mighty lion roared loudly.
  </text>
  <text x="50" y="310" class="content">
    那只强大的狮子大声咆哮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="150" class="image" />
    <line x1="100" y1="180" x2="150" y2="150" class="image" />
    <!-- Strength symbol -->
    <rect x="200" y="50" width="50" height="200" class="image" />
    <line x1="225" y1="50" x2="225" y2="250" class="image" />
    <line x1="200" y1="75" x2="250" y2="75" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="125" x2="250" y2="125" class="image" />
    <line x1="200" y1="150" x2="250" y2="150" class="image" />
    <line x1="200" y1="175" x2="250" y2="175" class="image" />
    <line x1="200" y1="200" x2="250" y2="200" class="image" />
    <line x1="200" y1="225" x2="250" y2="225" class="image" />
  </g>
</svg>