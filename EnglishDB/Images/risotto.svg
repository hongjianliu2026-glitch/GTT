<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .rice { fill: #FFD700; }
      .spoon { fill: #C0C0C0; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">risotto</text>
  <text x="50" y="120" class="subtitle">[riˈsɔtto] n. 意大利调味饭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> riso (米) + -otto (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"用米(riso)"
    <tspan x="50" dy="25">做成一小份(otto)美味的意大利调味饭(risotto)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prepared a delicious risotto for dinner.
  </text>
  <text x="50" y="310" class="content">
    她为晚餐准备了一道美味的意大利调味饭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rice -->
    <circle cx="50" cy="100" r="30" class="rice" />
    <circle cx="100" cy="100" r="30" class="rice" />
    <circle cx="150" cy="100" r="30" class="rice" />
    <circle cx="200" cy="100" r="30" class="rice" />
    <!-- Spoon -->
    <rect x="250" y="80" width="50" height="40" class="spoon" />
    <line x1="250" y1="120" x2="250" y2="160" class="spoon" />
    <line x1="250" y1="160" x2="220" y2="180" class="spoon" />
    <line x1="250" y1="160" x2="280" y2="180" class="spoon" />
  </g>
</svg>