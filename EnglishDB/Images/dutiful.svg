<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dutiful</text>
  <text x="50" y="120" class="subtitle">[ˈdjuːtɪfəl] adj. 尽职的，顺从的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> duty (职责) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个士兵，"充满职责(duty-ful)"，
    <tspan x="50" dy="25">他总是准时完成任务，从不抱怨，这就是尽职的(dutiful)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a dutiful daughter who always helps her parents.
  </text>
  <text x="50" y="310" class="content">
    她是一个尽职的女儿，总是帮助她的父母。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="30" y2="60" class="image" />
    <line x1="50" y1="20" x2="70" y2="60" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Task list -->
    <rect x="120" y="20" width="200" height="160" class="image" />
    <line x1="130" y1="50" x2="310" y2="50" class="image" />
    <line x1="130" y1="80" x2="310" y2="80" class="image" />
    <line x1="130" y1="110" x2="310" y2="110" class="image" />
    <line x1="130" y1="140" x2="310" y2="140" class="image" />
    <!-- Check marks -->
    <line x1="140" y1="65" x2="160" y2="85" class="image" />
    <line x1="160" y1="85" x2="180" y2="65" class="image" />
    <line x1="140" y1="95" x2="160" y2="115" class="image" />
    <line x1="160" y1="115" x2="180" y2="95" class="image" />
    <line x1="140" y1="125" x2="160" y2="145" class="image" />
    <line x1="160" y1="145" x2="180" y2="125" class="image" />
  </g>
</svg>