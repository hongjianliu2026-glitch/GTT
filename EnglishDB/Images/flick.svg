<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flick</text>
  <text x="50" y="120" class="subtitle">[flɪk] n. 轻打，轻弹；v. 轻弹，轻打</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flick (轻弹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫用爪子"轻弹(flick)"
    <tspan x="50" dy="25">一只飞虫，动作轻盈而迅速。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She flicked the switch to turn on the light.
  </text>
  <text x="50" y="310" class="content">
    她轻弹开关打开了灯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Tail -->
    <line x1="50" y1="180" x2="80" y2="200" class="image" /> <!-- Tail -->
    <!-- Fly -->
    <circle cx="150" cy="100" r="10" class="image" /> <!-- Body -->
    <line x1="150" y1="90" x2="150" y2="110" class="image" /> <!-- Antenna -->
    <line x1="140" y1="100" x2="160" y2="100" class="image" /> <!-- Wings -->
    <!-- Flick action -->
    <line x1="50" y1="130" x2="150" y2="100" class="image" /> <!-- Flick line -->
  </g>
</svg>