<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hallucination</text>
  <text x="50" y="120" class="subtitle">[ˌhæljuːsɪˈneɪʃn] n. 幻觉，幻视</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hallu- (听觉) + in (进入) + ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在寂静的夜晚，突然听到"进入(in)"
    <tspan x="50" dy="25">耳朵的"听觉(hallu)"，却发现自己看到的</tspan>
    <tspan x="50" dy="25">是幻觉(hallucination)，一只巨大的猫头鹰</tspan>
    <tspan x="50" dy="25">在空中飞翔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The patient reported seeing strange shapes, which were later diagnosed as hallucinations.
  </text>
  <text x="50" y="330" class="content">
    病人报告看到了奇怪的形状，后来被诊断为幻觉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Moon -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Owl -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="180" y1="80" x2="220" y2="80" class="image" />
    <line x1="180" y1="120" x2="220" y2="120" class="image" />
    <line x1="190" y1="70" x2="190" y2="130" class="image" />
    <line x1="210" y1="70" x2="210" y2="130" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
  </g>
</svg>