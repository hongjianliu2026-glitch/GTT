<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skyscraper</text>
  <text x="50" y="120" class="subtitle">[ˈskaɪˌskreɪpər] n. 摩天大楼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sky (天空) + scraper (刮擦者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的建筑，它高耸入云，仿佛在"刮擦(scraper)"天空，
    <tspan x="50" dy="25">这就是摩天大楼(skyscraper)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Empire State Building is a famous skyscraper in New York.
  </text>
  <text x="50" y="310" class="content">
    帝国大厦是纽约著名的摩天大楼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skyscraper -->
    <rect x="0" y="0" width="100" height="300" class="image" />
    <rect x="20" y="20" width="60" height="280" class="image" />
    <rect x="30" y="40" width="40" height="260" class="image" />
    <rect x="35" y="60" width="30" height="240" class="image" />
    <rect x="38" y="80" width="24" height="220" class="image" />
    <rect x="40" y="100" width="20" height="200" class="image" />
    <rect x="42" y="120" width="16" height="180" class="image" />
    <rect x="44" y="140" width="12" height="160" class="image" />
    <rect x="46" y="160" width="8" height="140" class="image" />
    <rect x="48" y="180" width="4" height="120" class="image" />
    <rect x="50" y="200" width="0" height="100" class="image" />
  </g>
</svg>