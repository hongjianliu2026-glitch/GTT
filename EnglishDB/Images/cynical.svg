<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cynical</text>
  <text x="50" y="120" class="subtitle">[ˈsɪnɪkl] adj. 愤世嫉俗的，怀疑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cyn (狗) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狗(cyn)，它对世界充满了怀疑和不满，
    <tspan x="50" dy="25">总是用一种愤世嫉俗的眼神看待一切，这就是cynical。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His cynical remarks made everyone uncomfortable.
  </text>
  <text x="50" y="310" class="content">
    他愤世嫉俗的言论让每个人都感到不舒服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog face -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="30" cy="40" r="5" class="image" />
    <circle cx="70" cy="40" r="5" class="image" />
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <line x1="50" y1="70" x2="50" y2="80" class="image" />
    <line x1="45" y1="80" x2="55" y2="80" class="image" />
    <!-- Skeptical expression -->
    <line x1="35" y1="35" x2="45" y2="35" class="image" />
    <line x1="65" y1="35" x2="75" y2="35" class="image" />
    <line x1="45" y1="65" x2="55" y2="65" class="image" />
  </g>
</svg>