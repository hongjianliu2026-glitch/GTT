<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sideline</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪdˌlaɪn] n. 边线，副业；v. 使退出比赛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> side (旁边) + line (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个足球运动员被裁判"赶到旁边(side)"，
    <tspan x="50" dy="25">站在"线(line)"上，无法参与比赛，这就是sideline。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was sidelined by an injury during the match.
  </text>
  <text x="50" y="310" class="content">
    他在比赛中因受伤而被换下场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Football field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Side line -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="300" y1="0" x2="300" y2="200" class="image" />
    <!-- Football player -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Referee -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="85" y2="150" class="image" />
    <line x1="100" y1="130" x2="115" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="110" class="image" />
    <!-- Arrow pointing to sideline -->
    <line x1="175" y1="100" x2="50" y2="100" class="image" />
    <polygon points="50,100 40,95 40,105" class="image" />
  </g>
</svg>