<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .snow { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frosty</text>
  <text x="50" y="120" class="subtitle">[ˈfrɒsti] adj. 霜冻的，寒冷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frost (霜) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的早晨，草地上覆盖着厚厚的霜(frost)，
    <tspan x="50" dy="25">整个世界都被冻得"冷冰冰的(frosty)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The morning air was frosty and crisp.
  </text>
  <text x="50" y="310" class="content">
    早晨的空气寒冷而清新。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#2ECC71" />
    <!-- Frost on grass -->
    <rect x="50" y="100" width="250" height="50" class="image snow" />
    <rect x="70" y="120" width="210" height="30" class="image snow" />
    <rect x="90" y="140" width="170" height="10" class="image snow" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Cold breath -->
    <line x1="20" y1="100" x2="40" y2="80" class="image" />
    <line x1="20" y1="100" x2="40" y2="120" class="image" />
    <line x1="20" y1="100" x2="60" y2="100" class="image" />
  </g>
</svg>