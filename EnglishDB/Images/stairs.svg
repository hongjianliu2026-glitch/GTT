<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stairs</text>
  <text x="50" y="120" class="subtitle">[sterz] n. 楼梯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sta- (站立) + ir (上升)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在(sta-)楼梯上，一步一步上升(ir)，
    <tspan x="50" dy="25">最终到达高处。这就是楼梯(stairs)的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She climbed the stairs to reach the top floor.
  </text>
  <text x="50" y="310" class="content">
    她爬楼梯到达了顶楼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stairs -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="350" y2="100" class="image" />
    <line x1="350" y1="100" x2="350" y2="250" class="image" />
    <line x1="350" y1="250" x2="500" y2="150" class="image" />
    <line x1="500" y1="150" x2="500" y2="300" class="image" />
    <!-- Person -->
    <circle cx="70" cy="180" r="15" class="image" />
    <line x1="70" y1="195" x2="70" y2="230" class="image" />
    <line x1="70" y1="230" x2="50" y2="260" class="image" />
    <line x1="70" y1="230" x2="90" y2="260" class="image" />
    <line x1="70" y1="210" x2="100" y2="200" class="image" />
  </g>
</svg>