<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">one-dimensional</text>
  <text x="50" y="120" class="subtitle">[ˌwʌn dɪˈmenʃənl] adj. 一维的，单向的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> one- (一) + dimension (维度)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个只有长度没有宽度和高度的世界，"一维(one-dimensional)"
    <tspan x="50" dy="25">的生物只能沿着一条直线移动，无法转向或改变方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The character in the story was too one-dimensional to be interesting.
  </text>
  <text x="50" y="310" class="content">
    故事中的角色过于单向，缺乏趣味性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- One-dimensional line -->
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <!-- Arrow at the end -->
    <polygon points="350,95 360,100 350,105" class="image" />
    <!-- Dots on the line -->
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="200" cy="100" r="5" class="image" />
    <circle cx="300" cy="100" r="5" class="image" />
    <!-- Text annotation -->
    <text x="175" y="130" class="content">一维世界</text>
  </g>
</svg>