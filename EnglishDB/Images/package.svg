<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">package</text>
  <text x="50" y="120" class="subtitle">[ˈpækɪdʒ] n. 包裹，包装；v. 打包</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pack (打包) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的礼物盒，里面装满了各种小盒子，每个小盒子都代表一个"打包(pack)"的物品，
    <tspan x="50" dy="25">整个大盒子就是一个"包裹(package)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carefully packaged the fragile items in bubble wrap.
  </text>
  <text x="50" y="310" class="content">
    她小心地将易碎物品用气泡膜打包。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large gift box -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Smaller boxes inside -->
    <rect x="50" y="20" width="80" height="60" class="image" />
    <rect x="150" y="20" width="80" height="60" class="image" />
    <rect x="250" y="20" width="80" height="60" class="image" />
    <rect x="50" y="100" width="80" height="60" class="image" />
    <rect x="150" y="100" width="80" height="60" class="image" />
    <rect x="250" y="100" width="80" height="60" class="image" />
  </g>
</svg>