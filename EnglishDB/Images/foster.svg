<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foster</text>
  <text x="50" y="120" class="subtitle">[ˈfɒstə(r)] v. 培养，促进；n. 养育者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fost (喂养) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温暖的场景，一位养育者(foster)
    <tspan x="50" dy="25">正在用爱心和耐心"喂养(fost)"一个孩子，</tspan>
    <tspan x="50" dy="25">帮助他成长和进步。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has been fostering children for over a decade.
  </text>
  <text x="50" y="310" class="content">
    她已经养育孩子超过十年了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Child -->
    <circle cx="40" cy="100" r="15" class="image" />
    <line x1="40" y1="115" x2="40" y2="150" class="image" />
    <line x1="40" y1="150" x2="20" y2="180" class="image" />
    <line x1="40" y1="150" x2="60" y2="180" class="image" />
    <line x1="40" y1="130" x2="70" y2="120" class="image" />
    <!-- Caregiver -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Feeding -->
    <line x1="100" y1="100" x2="40" y2="100" class="image" />
    <circle cx="70" cy="90" r="5" class="image" />
  </g>
</svg>