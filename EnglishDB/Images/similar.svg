<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">similar</text>
  <text x="50" y="120" class="subtitle">[ˈsɪmələr] adj. 相似的，类似的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> simi- (相同) + lar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两片树叶，"相同(simi-)"
    <tspan x="50" dy="25">的形状和颜色，它们就是相似的(similar)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two designs are quite similar.
  </text>
  <text x="50" y="310" class="content">
    这两个设计非常相似。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First leaf -->
    <path d="M50 50 C 50 100, 100 100, 100 50 Z" class="image" />
    <!-- Second leaf -->
    <path d="M150 50 C 150 100, 200 100, 200 50 Z" class="image" />
    <!-- Connecting line -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <!-- Text annotation -->
    <text x="125" y="40" class="content" text-anchor="middle">相似</text>
  </g>
</svg>