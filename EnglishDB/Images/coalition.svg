<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coalition</text>
  <text x="50" y="120" class="subtitle">[ˌkoʊəˈlɪʃən] n. 联盟，联合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + alis (成长) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人手拉手，"共同成长(co-alis)"，
    <tspan x="50" dy="25">形成了一个强大的联盟(coalition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coalition government was formed after the election.
  </text>
  <text x="50" y="310" class="content">
    选举后形成了联合政府。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People holding hands -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
    <!-- Growing symbol -->
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
  </g>
</svg>