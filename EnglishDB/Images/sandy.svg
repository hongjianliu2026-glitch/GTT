<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sandy</text>
  <text x="50" y="120" class="subtitle">[ˈsændi] adj. 沙的，含沙的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sand (沙) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片沙滩，"沙(sand)"
    <tspan x="50" dy="25">覆盖了整个地面，这就是"沙的(sandy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beach was covered with sandy soil.
  </text>
  <text x="50" y="310" class="content">
    海滩上覆盖着沙质的土壤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sand particles -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="110" cy="55" r="10" class="image" />
    <circle cx="140" cy="65" r="10" class="image" />
    <circle cx="170" cy="50" r="10" class="image" />
    <circle cx="200" cy="60" r="10" class="image" />
    <circle cx="230" cy="55" r="10" class="image" />
    <circle cx="260" cy="65" r="10" class="image" />
    <circle cx="290" cy="50" r="10" class="image" />
    <circle cx="320" cy="60" r="10" class="image" />
    <circle cx="350" cy="55" r="10" class="image" />
    <circle cx="380" cy="65" r="10" class="image" />
    <circle cx="410" cy="50" r="10" class="image" />
    <circle cx="440" cy="60" r="10" class="image" />
    <circle cx="470" cy="55" r="10" class="image" />
    <circle cx="500" cy="65" r="10" class="image" />
    <circle cx="530" cy="50" r="10" class="image" />
    <circle cx="560" cy="60" r="10" class="image" />
    <circle cx="590" cy="55" r="10" class="image" />
    <circle cx="620" cy="65" r="10" class="image" />
    <circle cx="650" cy="50" r="10" class="image" />
    <circle cx="680" cy="60" r="10" class="image" />
    <circle cx="710" cy="55" r="10" class="image" />
    <circle cx="740" cy="65" r="10" class="image" />
  </g>
</svg>