<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preferred</text>
  <text x="50" y="120" class="subtitle">[prɪˈfɜːrd] adj. 首选的，偏爱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + fer (拿，带) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在众多选择中，"提前拿(pre-fer)"
    <tspan x="50" dy="25">出他最喜爱的那个，这就是他"首选的(preferred)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is the preferred candidate for the job.
  </text>
  <text x="50" y="310" class="content">
    她是这份工作的首选候选人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person choosing -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Choices -->
    <rect x="70" y="80" width="50" height="50" class="image" />
    <rect x="140" y="80" width="50" height="50" class="image" />
    <rect x="210" y="80" width="50" height="50" class="image" />
    <!-- Preferred choice -->
    <rect x="140" y="80" width="50" height="50" class="image" fill="#16A085" />
    <!-- Arrow pointing to preferred choice -->
    <line x1="20" y1="100" x2="140" y2="100" class="image" />
    <polygon points="140,100 130,90 130,110" class="image" />
  </g>
</svg>