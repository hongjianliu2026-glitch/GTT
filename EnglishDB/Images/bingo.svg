<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bingo</text>
  <text x="50" y="120" class="subtitle">[ˈbɪŋɡoʊ] n. 宾果游戏，中奖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自意大利语 "bingo"，意为“中奖”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个玩家在宾果游戏中，突然喊出“Bingo!”
    <tspan x="50" dy="25">因为他发现自己的号码全部对上了，兴奋地跳了起来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She shouted "Bingo!" when she won the game.
  </text>
  <text x="50" y="310" class="content">
    她赢了游戏时大喊“Bingo!”。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bingo card -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Numbers -->
    <text x="70" y="50" class="content">1</text>
    <text x="120" y="50" class="content">2</text>
    <text x="170" y="50" class="content">3</text>
    <text x="220" y="50" class="content">4</text>
    <text x="270" y="50" class="content">5</text>
    <text x="70" y="80" class="content">6</text>
    <text x="120" y="80" class="content">7</text>
    <text x="170" y="80" class="content">8</text>
    <text x="220" y="80" class="content">9</text>
    <text x="270" y="80" class="content">10</text>
    <text x="70" y="110" class="content">11</text>
    <text x="120" y="110" class="content">12</text>
    <text x="170" y="110" class="content">13</text>
    <text x="220" y="110" class="content">14</text>
    <text x="270" y="110" class="content">15</text>
    <text x="70" y="140" class="content">16</text>
    <text x="120" y="140" class="content">17</text>
    <text x="170" y="140" class="content">18</text>
    <text x="220" y="140" class="content">19</text>
    <text x="270" y="140" class="content">20</text>
    <!-- Player -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Shouting "Bingo!" -->
    <text x="30" y="220" class="content" style="font-size: 36px;">Bingo!</text>
  </g>
</svg>