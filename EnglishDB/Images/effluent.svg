<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">effluent</text>
  <text x="50" y="120" class="subtitle">[ˈɛfluənt] n. 流出物，污水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ef- (出) + flu (流) + -ent (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂的排水管，"流出(ef-flu)"
    <tspan x="50" dy="25">的污水(effluent)，污染了河流。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The effluent from the factory contaminated the river.
  </text>
  <text x="50" y="310" class="content">
    工厂的污水污染了河流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Drain pipe -->
    <line x1="75" y1="100" x2="75" y2="150" class="image" />
    <!-- Water flowing out -->
    <path d="M75,150 Q75,200 125,200" class="water" />
    <path d="M75,150 Q75,200 25,200" class="water" />
    <!-- River -->
    <line x1="0" y1="220" x2="150" y2="220" class="image" />
    <line x1="0" y1="230" x2="150" y2="230" class="image" />
    <line x1="0" y1="240" x2="150" y2="240" class="image" />
  </g>
</svg>