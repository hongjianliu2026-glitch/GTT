<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">puzzle</text>
  <text x="50" y="120" class="subtitle">[ˈpʌzl] n. 谜题，难题；v. 使困惑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> puzz (困惑) + -le (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拼图(puzzle)，每一片都让人"困惑(puzz)"，
    <tspan x="50" dy="25">但当你一片片拼凑起来，最终的画面让人豁然开朗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mystery of the ancient artifact puzzled historians for years.
  </text>
  <text x="50" y="310" class="content">
    这件古代文物的谜团让历史学家困惑了多年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Person thinking -->
    <circle cx="180" cy="250" r="30" class="image" />
    <line x1="180" y1="280" x2="180" y2="350" class="image" />
    <line x1="180" y1="350" x2="150" y2="400" class="image" />
    <line x1="180" y1="350" x2="210" y2="400" class="image" />
    <line x1="180" y1="320" x2="130" y2="310" class="image" />
    <line x1="180" y1="320" x2="230" y2="310" class="image" />
  </g>
</svg>