<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">massage</text>
  <text x="50" y="120" class="subtitle">[məˈsɑːʒ] n. 按摩；v. 按摩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mass (块，团) + -age (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个按摩师用手"揉捏(mass)"
    <tspan x="50" dy="25">成块的肌肉，帮助放松和恢复活力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave him a massage to relieve his stress.
  </text>
  <text x="50" y="310" class="content">
    她给他按摩以缓解他的压力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Massage table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on the table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Massage therapist's hands -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="150" y2="115" class="image" />
    <line x1="100" y1="130" x2="150" y2="130" class="image" />
    <line x1="100" y1="145" x2="150" y2="145" class="image" />
  </g>
</svg>