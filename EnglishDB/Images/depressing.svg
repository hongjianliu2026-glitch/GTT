<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">depressing</text>
  <text x="50" y="120" class="subtitle">[dɪˈprɛsɪŋ] adj. 令人沮丧的，压抑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + press (压)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头"向下压(de-press)"在一个人身上，
    <tspan x="50" dy="25">这个人感到无比的沮丧和压抑(depressing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the accident was very depressing.
  </text>
  <text x="50" y="310" class="content">
    事故的消息非常令人沮丧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="230" class="image" />
    <line x1="175" y1="200" x2="195" y2="230" class="image" />
    <line x1="175" y1="180" x2="145" y2="170" class="image" />
    <line x1="175" y1="180" x2="205" y2="170" class="image" />
    <!-- Stone pressing down -->
    <rect x="125" y="50" width="100" height="100" class="image" />
  </g>
</svg>