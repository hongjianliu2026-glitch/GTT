<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">steeple</text>
  <text x="50" y="120" class="subtitle">[ˈstiːpl] n. 尖塔，教堂的塔尖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stee (站立) + ple (尖端)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座教堂的尖塔(steeple)，它高高"站立(stee)"
    <tspan x="50" dy="25">在空中，尖端(ple)直指天空，象征着信仰的顶峰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The steeple of the church was visible from miles away.
  </text>
  <text x="50" y="310" class="content">
    教堂的尖塔在几英里外就能看到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Church body -->
    <rect x="50" y="100" width="200" height="150" class="image" />
    <!-- Steeple -->
    <polygon points="150,0 100,100 200,100" class="image" />
    <!-- Cross on top of steeple -->
    <line x1="140" y1="10" x2="160" y2="10" class="image" />
    <line x1="150" y1="0" x2="150" y2="20" class="image" />
  </g>
</svg>