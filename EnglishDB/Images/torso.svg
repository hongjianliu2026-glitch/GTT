<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">torso</text>
  <text x="50" y="120" class="subtitle">[ˈtɔːrsoʊ] n. 躯干，上半身</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tor (转) + so (身体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在旋转(tor)一个雕塑，专注于雕刻
    <tspan x="50" dy="25">人体的躯干(torso)部分，这个部分是身体的中心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The statue was missing its head and arms, only the torso remained.
  </text>
  <text x="50" y="310" class="content">
    雕像失去了头部和手臂，只剩下躯干。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Torso outline -->
    <rect x="50" y="50" width="200" height="300" class="image" />
    <!-- Head placeholder -->
    <circle cx="150" cy="50" r="30" class="image" />
    <!-- Arms placeholder -->
    <line x1="50" y1="150" x2="0" y2="200" class="image" />
    <line x1="250" y1="150" x2="300" y2="200" class="image" />
    <!-- Legs placeholder -->
    <line x1="100" y1="350" x2="100" y2="450" class="image" />
    <line x1="200" y1="350" x2="200" y2="450" class="image" />
    <!-- Rotating effect -->
    <line x1="150" y1="50" x2="150" y2="350" class="image" />
    <line x1="50" y1="200" x2="250" y2="200" class="image" />
  </g>
</svg>