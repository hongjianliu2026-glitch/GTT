<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">asylum</text>
  <text x="50" y="120" class="subtitle">[əˈsaɪləm] n. 庇护，避难所</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (离开) + syl (安全) + -um (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人逃离危险，"离开(a-)"到一个"安全(syl)"的"地方(-um)"，
    <tspan x="50" dy="25">这个安全的地方就是庇护所(asylum)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He sought asylum in the embassy to escape persecution.
  </text>
  <text x="50" y="310" class="content">
    他为了逃避迫害，在使馆寻求庇护。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Safe house -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Person running -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
  </g>
</svg>