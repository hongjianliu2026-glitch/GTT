<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">devour</text>
  <text x="50" y="120" class="subtitle">[dɪˈvaʊər] v. 吞食，狼吞虎咽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (完全) + vour (吃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只饥饿的野兽，"完全吞食(de-vour)"
    <tspan x="50" dy="25">它的猎物，不留任何残渣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lion devoured the zebra in minutes.
  </text>
  <text x="50" y="310" class="content">
    狮子在几分钟内就吞食了斑马。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <line x1="50" y1="150" x2="0" y2="140" class="image" />
    <!-- Zebra -->
    <rect x="150" y="80" width="100" height="60" class="image" />
    <line x1="150" y1="110" x2="250" y2="110" class="image" />
    <line x1="150" y1="140" x2="250" y2="140" class="image" />
    <line x1="150" y1="110" x2="150" y2="140" class="image" />
    <line x1="250" y1="110" x2="250" y2="140" class="image" />
    <!-- Devouring action -->
    <line x1="50" y1="130" x2="150" y2="110" class="image" />
    <line x1="50" y1="130" x2="250" y2="110" class="image" />
  </g>
</svg>