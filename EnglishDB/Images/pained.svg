<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pained</text>
  <text x="50" y="120" class="subtitle">[peɪnd] adj. 痛苦的，苦恼的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pain (痛苦) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人脸上露出痛苦的表情，"痛苦(pain)"
    <tspan x="50" dy="25">的表情被"形容(ed)"出来，就是痛苦的(pained)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a pained expression when she heard the news.
  </text>
  <text x="50" y="310" class="content">
    她听到消息时脸上露出了痛苦的表情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="85" r="10" class="image" />
    <circle cx="125" cy="85" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 70 130 Q 100 150 130 130" class="image" />
    <!-- Pain expression -->
    <line x1="75" y1="100" x2="125" y2="100" class="image" />
    <line x1="75" y1="105" x2="125" y2="105" class="image" />
    <line x1="75" y1="110" x2="125" y2="110" class="image" />
  </g>
</svg>