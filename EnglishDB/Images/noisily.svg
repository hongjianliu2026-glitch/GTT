<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">noisily</text>
  <text x="50" y="120" class="subtitle">[ˈnɔɪzɪli] adv. 喧闹地，嘈杂地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> noise (噪音) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热闹的市场，"噪音(noise)"
    <tspan x="50" dy="25">四处飞扬，人们"喧闹地(noisily)"交谈和叫卖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children played noisily in the park.
  </text>
  <text x="50" y="310" class="content">
    孩子们在公园里喧闹地玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People talking -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Noise waves -->
    <path d="M50 80 Q75 100, 100 80" class="image" />
    <path d="M100 80 Q125 100, 150 80" class="image" />
    <path d="M150 80 Q175 100, 200 80" class="image" />
    <path d="M200 80 Q225 100, 250 80" class="image" />
    <path d="M250 80 Q275 100, 300 80" class="image" />
  </g>
</svg>