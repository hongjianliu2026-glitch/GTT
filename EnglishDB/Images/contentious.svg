<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contentious</text>
  <text x="50" y="120" class="subtitle">[kənˈtenʃəs] adj. 有争议的，引起争论的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + tent (持有) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在激烈争论，"共同持有(con-tent)"
    <tspan x="50" dy="25">不同观点，导致场面非常"有争议的(contentious)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy has been very contentious among the staff.
  </text>
  <text x="50" y="310" class="content">
    新政策在员工中引起了很大的争议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People arguing -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="150" y1="70" x2="250" y2="70" class="image" />
    <line x1="50" y1="90" x2="150" y2="90" class="image" />
    <line x1="150" y1="90" x2="250" y2="90" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="150" y1="110" x2="250" y2="110" class="image" />
    <!-- Speech bubbles -->
    <path d="M50,130 Q70,120 90,130 Q70,140 50,130" class="image" />
    <path d="M150,130 Q170,120 190,130 Q170,140 150,130" class="image" />
    <path d="M250,130 Q270,120 290,130 Q270,140 250,130" class="image" />
  </g>
</svg>