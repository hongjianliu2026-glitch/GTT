<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fella</text>
  <text x="50" y="120" class="subtitle">[ˈfɛlə] n. 家伙，小伙子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fell (来自古英语 "fēol"，意为 "伙伴")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"伙伴(fell)"在街头，他是个"小伙子(fella)"，
    <tspan x="50" dy="25">正和朋友们一起欢笑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> That fella over there is my best friend.
  </text>
  <text x="50" y="310" class="content">
    那边那个小伙子是我最好的朋友。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fella -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Friends -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Smiling faces -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="140" y1="90" x2="160" y2="90" class="image" />
    <line x1="240" y1="90" x2="260" y2="90" class="image" />
    <path d="M45 110 Q50 105 55 110" class="image" />
    <path d="M145 110 Q150 105 155 110" class="image" />
    <path d="M245 110 Q250 105 255 110" class="image" />
  </g>
</svg>