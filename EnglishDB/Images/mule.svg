<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mule</text>
  <text x="50" y="120" class="subtitle">[mjuːl] n. 骡子，顽固的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mul- (源自拉丁语 mulus，意为骡子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头骡子(mul-)，它既像马又像驴，
    <tspan x="50" dy="25">但比两者都更顽固，这就是“骡子(mule)”的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mule carried the heavy load up the mountain.
  </text>
  <text x="50" y="310" class="content">
    骡子驮着重物上山。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mule body -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <!-- Mule head -->
    <circle cx="50" cy="80" r="30" class="image" />
    <!-- Mule ears -->
    <line x1="30" y1="60" x2="10" y2="40" class="image" />
    <line x1="70" y1="60" x2="90" y2="40" class="image" />
    <!-- Mule legs -->
    <line x1="60" y1="150" x2="60" y2="200" class="image" />
    <line x1="140" y1="150" x2="140" y2="200" class="image" />
    <line x1="80" y1="150" x2="80" y2="200" class="image" />
    <line x1="120" y1="150" x2="120" y2="200" class="image" />
    <!-- Mule tail -->
    <line x1="180" y1="100" x2="200" y2="80" class="image" />
  </g>
</svg>