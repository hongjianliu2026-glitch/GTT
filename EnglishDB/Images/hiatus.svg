<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hiatus</text>
  <text x="50" y="120" class="subtitle">[haɪˈeɪtəs] n. 间断，中断</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hiatus (拉丁语，裂缝，空隙)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的裂缝(hiatus)横跨在一条繁忙的道路上，
    <tspan x="50" dy="25">车辆和行人不得不绕道而行，这就是一个中断(hiatus)的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The TV show went on hiatus for the summer.
  </text>
  <text x="50" y="310" class="content">
    这部电视剧在夏季停播了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <!-- Hiatus -->
    <rect x="150" y="-20" width="50" height="80" class="image" />
    <!-- Cars -->
    <rect x="50" y="-10" width="30" height="20" class="image" />
    <rect x="100" y="-10" width="30" height="20" class="image" />
    <rect x="250" y="-10" width="30" height="20" class="image" />
    <rect x="300" y="-10" width="30" height="20" class="image" />
  </g>
</svg>