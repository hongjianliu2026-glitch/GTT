<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sick { fill: #A93226; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diseased</text>
  <text x="50" y="120" class="subtitle">[dɪˈziːzd] adj. 患病的，有病的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不，无) + ease (舒适)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为疾病而"失去舒适(dis-ease)"，
    <tspan x="50" dy="25">变得"有病的(diseased)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor examined the diseased plant.
  </text>
  <text x="50" y="310" class="content">
    医生检查了那棵患病的植物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sick person -->
    <circle cx="50" cy="100" r="30" class="sick" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Cross symbol -->
    <line x1="30" y1="80" x2="70" y2="120" class="image" />
    <line x1="30" y1="120" x2="70" y2="80" class="image" />
  </g>
</svg>