<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mumble</text>
  <text x="50" y="120" class="subtitle">[ˈmʌmbl] v. 含糊地说，咕哝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mum (沉默) + -ble (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在黑暗中，"沉默地咕哝(mum-ble)"
    <tspan x="50" dy="25">着，声音低沉而含糊，仿佛在自言自语。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He mumbled something under his breath.
  </text>
  <text x="50" y="310" class="content">
    他低声咕哝着什么。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person's head -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Mouth -->
    <line x1="150" y1="120" x2="200" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 100 50 Q 150 70 200 50 T 250 70" class="image" />
    <!-- Mumbling lines -->
    <line x1="120" y1="60" x2="130" y2="65" class="image" />
    <line x1="140" y1="60" x2="150" y2="65" class="image" />
    <line x1="160" y1="60" x2="170" y2="65" class="image" />
    <line x1="180" y1="60" x2="190" y2="65" class="image" />
    <line x1="200" y1="60" x2="210" y2="65" class="image" />
  </g>
</svg>