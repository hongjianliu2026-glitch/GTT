<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vial</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪəl] n. 小瓶，小药瓶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vi- (生命) + al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小瓶子(vial)里装着"生命的精华(vi-al)"，
    <tspan x="50" dy="25">它可能是药水，也可能是珍贵的液体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chemist carefully labeled each vial with a different formula.
  </text>
  <text x="50" y="310" class="content">
    化学家小心地给每个小瓶贴上不同的配方标签。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vial -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="20" y="20" width="60" height="110" class="image" />
    <!-- Liquid inside -->
    <rect x="25" y="25" width="50" height="100" fill="#16A085" />
    <!-- Cap -->
    <rect x="10" y="150" width="80" height="20" class="image" />
  </g>
</svg>