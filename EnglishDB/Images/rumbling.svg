<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rumbling</text>
  <text x="50" y="120" class="subtitle">[ˈrʌmb(ə)lɪŋ] n. 隆隆声，低沉的响声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rumble (隆隆声) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆巨大的卡车在山谷中行驶，"隆隆(rumble)"
    <tspan x="50" dy="25">的声音回荡在整个山谷，这就是"隆隆声(rumbling)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rumbling of the train could be heard from miles away.
  </text>
  <text x="50" y="310" class="content">
    火车的隆隆声在几英里外都能听到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 50 L200 200 Z" class="image" />
    <path d="M100 200 L200 100 L300 200 Z" class="image" />
    <path d="M200 200 L300 150 L400 200 Z" class="image" />
    <!-- Truck -->
    <rect x="150" y="150" width="100" height="50" class="image" />
    <circle cx="170" cy="200" r="10" class="image" />
    <circle cx="230" cy="200" r="10" class="image" />
    <!-- Rumbling sound waves -->
    <path d="M100 100 Q150 50 200 100" class="image" />
    <path d="M100 120 Q150 70 200 120" class="image" />
    <path d="M100 140 Q150 90 200 140" class="image" />
  </g>
</svg>