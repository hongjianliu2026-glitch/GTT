<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">horseback</text>
  <text x="50" y="120" class="subtitle">[ˈhɔːrsbæk] n. 马背</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> horse (马) + back (背)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人骑在马背上，"马(horse)的背(back)"
    <tspan x="50" dy="25">就是horseback，骑马的场景让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He rode on horseback through the forest.
  </text>
  <text x="50" y="310" class="content">
    他骑马穿过森林。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Horse head -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Horse neck -->
    <line x1="80" y1="100" x2="120" y2="70" class="image" />
    <!-- Horse back -->
    <line x1="120" y1="70" x2="250" y2="70" class="image" />
    <!-- Rider -->
    <circle cx="180" cy="50" r="15" class="image" />
    <line x1="180" y1="65" x2="180" y2="100" class="image" />
    <line x1="180" y1="100" x2="160" y2="130" class="image" />
    <line x1="180" y1="100" x2="200" y2="130" class="image" />
    <line x1="180" y1="80" x2="210" y2="70" class="image" />
  </g>
</svg>