<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knee</text>
  <text x="50" y="120" class="subtitle">[niː] n. 膝盖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "knē"，与古英语 "cnēo" 相关，意为膝盖。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在跪下祈祷，他的"膝盖(knee)"
    <tspan x="50" dy="25">弯曲成一个完美的弧形，这就是膝盖的形状。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She fell and hurt her knee while playing soccer.
  </text>
  <text x="50" y="310" class="content">
    她在踢足球时摔倒了，伤到了膝盖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Leg and knee -->
    <line x1="50" y1="0" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <!-- Knee joint -->
    <circle cx="50" cy="100" r="15" class="image" />
  </g>
</svg>