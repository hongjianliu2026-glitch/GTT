<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loader</text>
  <text x="50" y="120" class="subtitle">[ˈloʊdər] n. 装载器，加载器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> load (装载) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机械臂，"装载(load)"
    <tspan x="50" dy="25">货物到卡车上，这个机械臂就是装载器(loader)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The loader is used to load materials into the truck.
  </text>
  <text x="50" y="310" class="content">
    装载器用于将材料装载到卡车上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Truck -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Loader arm -->
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="250" y2="20" class="image" />
    <line x1="250" y1="20" x2="300" y2="20" class="image" />
    <line x1="300" y1="20" x2="300" y2="100" class="image" />
    <!-- Cargo -->
    <rect x="280" y="80" width="40" height="40" class="image" />
    <!-- Truck bed -->
    <rect x="100" y="150" width="200" height="50" class="image" />
  </g>
</svg>