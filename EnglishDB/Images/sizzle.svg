<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sizzle</text>
  <text x="50" y="120" class="subtitle">[ˈsɪzəl] v. 发出咝咝声，炙烤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> siz (咝咝声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块牛排在热锅上，"咝咝作响(siz-zle)"，
    <tspan x="50" dy="25">炙烤的香气四溢，让人垂涎欲滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The steak sizzled as it hit the hot pan.
  </text>
  <text x="50" y="310" class="content">
    牛排一碰到热锅就咝咝作响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pan -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Steak -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Sizzling effect -->
    <circle cx="100" cy="100" r="10" class="flame" />
    <circle cx="150" cy="120" r="10" class="flame" />
    <circle cx="200" cy="140" r="10" class="flame" />
    <circle cx="250" cy="160" r="10" class="flame" />
  </g>
</svg>