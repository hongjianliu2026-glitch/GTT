<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turntable</text>
  <text x="50" y="120" class="subtitle">[ˈtɜːrnˌteɪbl] n. 转盘，唱盘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> turn (转动) + table (桌子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个DJ站在一个巨大的"转动的桌子(turn-table)"上，
    <tspan x="50" dy="25">随着音乐的节奏旋转，手中的唱片在转盘上飞速旋转。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The DJ used a turntable to mix the tracks.
  </text>
  <text x="50" y="310" class="content">
    DJ使用转盘来混合音轨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Turntable -->
    <circle cx="175" cy="100" r="80" class="image" />
    <rect x="135" y="100" width="80" height="20" class="image" />
    <!-- DJ -->
    <circle cx="175" cy="200" r="20" class="image" />
    <line x1="175" y1="220" x2="175" y2="260" class="image" />
    <line x1="175" y1="260" x2="155" y2="300" class="image" />
    <line x1="175" y1="260" x2="195" y2="300" class="image" />
    <line x1="175" y1="240" x2="215" y2="230" class="image" />
    <!-- Record -->
    <circle cx="175" cy="100" r="60" class="image" />
    <line x1="175" y1="40" x2="175" y2="160" class="image" />
    <line x1="115" y1="100" x2="235" y2="100" class="image" />
  </g>
</svg>