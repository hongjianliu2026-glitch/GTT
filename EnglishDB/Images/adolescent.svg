<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adolescent</text>
  <text x="50" y="120" class="subtitle">[ˌædəˈlesnt] n. 青少年；adj. 青春期的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + olescere (成长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子"朝向(ad-)"成长(olescere)，
    <tspan x="50" dy="25">从儿童逐渐变成青少年(adolescent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The adolescent years are often filled with challenges.
  </text>
  <text x="50" y="310" class="content">
    青少年时期常常充满挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Growing child -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Growing arrow -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="140" y2="90" class="image" />
    <line x1="150" y1="100" x2="140" y2="110" class="image" />
    <!-- Adolescent -->
    <circle cx="200" cy="100" r="40" class="image" />
    <line x1="200" y1="140" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="240" class="image" />
    <line x1="200" y1="200" x2="220" y2="240" class="image" />
    <line x1="200" y1="170" x2="170" y2="160" class="image" />
    <line x1="200" y1="170" x2="230" y2="160" class="image" />
  </g>
</svg>