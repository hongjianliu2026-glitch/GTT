<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">watchful</text>
  <text x="50" y="120" class="subtitle">[ˈwɒtʃfl] adj. 警惕的，注意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> watch (观察) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫头鹰，"充满观察力(watch-ful)"
    <tspan x="50" dy="25">地盯着周围的一切，时刻保持警惕。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The security guard was very watchful during the night shift.
  </text>
  <text x="50" y="310" class="content">
    保安在夜班时非常警惕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Owl -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="40" cy="40" r="5" class="image" />
    <circle cx="60" cy="40" r="5" class="image" />
    <line x1="45" y1="60" x2="55" y2="60" class="image" />
    <line x1="50" y1="60" x2="50" y2="70" class="image" />
    <line x1="40" y1="70" x2="60" y2="70" class="image" />
    <line x1="30" y1="80" x2="70" y2="80" class="image" />
    <line x1="20" y1="90" x2="80" y2="90" class="image" />
    <line x1="10" y1="100" x2="90" y2="100" class="image" />
    <line x1="0" y1="110" x2="100" y2="110" class="image" />
    <line x1="10" y1="120" x2="90" y2="120" class="image" />
    <line x1="20" y1="130" x2="80" y2="130" class="image" />
    <line x1="30" y1="140" x2="70" y2="140" class="image" />
    <line x1="40" y1="150" x2="60" y2="150" class="image" />
    <line x1="50" y1="160" x2="50" y2="170" class="image" />
  </g>
</svg>