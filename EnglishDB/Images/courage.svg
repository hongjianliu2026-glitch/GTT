<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">courage</text>
  <text x="50" y="120" class="subtitle">[ˈkɜːrɪdʒ] n. 勇气，胆量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cor (心) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面对巨大的怪兽，他的"心(cor)"中充满了
    <tspan x="50" dy="25">勇气(courage)，毫不畏惧地迎战。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She showed great courage in the face of danger.
  </text>
  <text x="50" y="310" class="content">
    她在危险面前表现出了极大的勇气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="150" cy="100" r="50" class="image" />
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="125" y1="75" x2="175" y2="75" class="image" />
    <line x1="125" y1="125" x2="175" y2="125" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Heart -->
    <path d="M20,200 C20,250 100,250 100,200" class="image" />
    <path d="M20,200 C20,150 100,150 100,200" class="image" />
  </g>
</svg>