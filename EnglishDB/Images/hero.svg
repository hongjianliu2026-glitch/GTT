<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hero</text>
  <text x="50" y="120" class="subtitle">[ˈhɪroʊ] n. 英雄，勇士</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> her- (粘附) + -o (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的战士，"粘附(her-)"在战场上，
    <tspan x="50" dy="25">他的勇气和力量让他成为了英雄(hero)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The firefighter was hailed as a hero for saving the trapped children.
  </text>
  <text x="50" y="310" class="content">
    这位消防员因救出被困儿童而被誉为英雄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hero -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="250" class="image" /> <!-- Right leg -->
    <!-- Shield -->
    <rect x="10" y="120" width="80" height="60" class="image" />
    <!-- Sword -->
    <line x1="90" y1="120" x2="120" y2="150" class="image" />
  </g>
</svg>