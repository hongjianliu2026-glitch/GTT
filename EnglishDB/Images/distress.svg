<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">distress</text>
  <text x="50" y="120" class="subtitle">[dɪˈstres] n. 痛苦，苦恼；v. 使痛苦，使苦恼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + stress (压力)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"分开(dis-)"成两半，承受着巨大的"压力(stress)"，
    <tspan x="50" dy="25">这种痛苦和苦恼就是distress。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the accident caused her great distress.
  </text>
  <text x="50" y="310" class="content">
    事故的消息使她非常痛苦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in distress -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="70" y2="250" class="image" />
    <line x1="100" y1="200" x2="130" y2="250" class="image" />
    <line x1="100" y1="200" x2="50" y2="230" class="image" />
    <line x1="100" y1="200" x2="150" y2="230" class="image" />
    <!-- Stress lines -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="150" y1="50" x2="50" y2="150" class="image" />
    <!-- Distress symbol -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="90" y1="90" x2="110" y2="110" class="image" />
    <line x1="90" y1="110" x2="110" y2="90" class="image" />
  </g>
</svg>