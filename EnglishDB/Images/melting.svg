<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">melting</text>
  <text x="50" y="120" class="subtitle">[ˈmeltɪŋ] adj. 融化的，熔化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> melt (融化) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的冰淇淋球在阳光下，"融化(melt)"
    <tspan x="50" dy="25">成一滩甜蜜的液体，这就是"融化的(melting)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The melting ice cream dripped down her hand.
  </text>
  <text x="50" y="310" class="content">
    融化的冰淇淋滴在她的手上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="200" cy="100" r="50" fill="#F1C40F" />
    <!-- Ice cream -->
    <circle cx="200" cy="200" r="40" fill="#E74C3C" />
    <circle cx="200" cy="160" r="30" fill="#F39C12" />
    <circle cx="200" cy="130" r="20" fill="#F1C40F" />
    <!-- Melting drips -->
    <line x1="200" y1="240" x2="200" y2="280" class="image" />
    <line x1="200" y1="280" x2="180" y2="320" class="image" />
    <line x1="200" y1="280" x2="220" y2="320" class="image" />
  </g>
</svg>