<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .volcano { fill: #F1C40F; }
      .lava { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">volcano</text>
  <text x="50" y="120" class="subtitle">[vɒlˈkeɪnəʊ] n. 火山</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Volc (火) + -ano (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座火山(volcano)，"火(Volc)"
    <tspan x="50" dy="25">山喷发出炽热的岩浆，形成壮观的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The eruption of the volcano caused widespread destruction.
  </text>
  <text x="50" y="310" class="content">
    火山的喷发造成了广泛的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Volcano -->
    <path d="M 0 200 Q 100 100 200 200 L 200 300 L 0 300 Z" class="volcano" />
    <!-- Lava -->
    <path d="M 50 250 Q 100 220 150 250 L 150 280 L 50 280 Z" class="lava" />
    <!-- Smoke -->
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="120" cy="130" r="15" class="image" />
    <circle cx="80" cy="130" r="15" class="image" />
  </g>
</svg>