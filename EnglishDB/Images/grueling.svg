<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grueling</text>
  <text x="50" y="120" class="subtitle">[ˈɡruːəlɪŋ] adj. 使人筋疲力尽的，折磨人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gruel (稀粥) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在吃着"稀粥(gruel)"，
    <tspan x="50" dy="25">这粥稀得让人"筋疲力尽(grueling)"，</tspan>
    <tspan x="50" dy="25">仿佛每一口都在折磨他的身体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The marathon was a grueling test of endurance.
  </text>
  <text x="50" y="310" class="content">
    马拉松是对耐力的折磨性考验。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Gruel -->
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <line x1="70" y1="110" x2="230" y2="110" class="image" />
    <line x1="70" y1="120" x2="230" y2="120" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Exhausted expression -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="45" y1="85" x2="55" y2="85" class="image" />
    <line x1="45" y1="110" x2="55" y2="110" class="image" />
  </g>
</svg>