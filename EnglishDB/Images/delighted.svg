<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delighted</text>
  <text x="50" y="120" class="subtitle">[dɪˈlaɪtɪd] adj. 高兴的，快乐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (完全) + light (快乐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人完全沉浸在快乐(de-light)中，
    <tspan x="50" dy="25">脸上洋溢着灿烂的笑容，仿佛整个世界都变得明亮了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was delighted by the surprise party.
  </text>
  <text x="50" y="310" class="content">
    她对那个惊喜派对感到非常高兴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="10" class="image" fill="#2C3E50" />
    <circle cx="120" cy="85" r="10" class="image" fill="#2C3E50" />
    <!-- Smile -->
    <path d="M 60 120 Q 100 140 140 120" class="image" fill="none" stroke="#2C3E50" stroke-width="5" />
    <!-- Light rays -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" stroke-dasharray="5,5" />
    <line x1="75" y1="175" x2="25" y2="225" class="image" stroke-dasharray="5,5" />
    <line x1="125" y1="175" x2="175" y2="225" class="image" stroke-dasharray="5,5" />
  </g>
</svg>