<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tranquility</text>
  <text x="50" y="120" class="subtitle">[træŋˈkwɪləti] n. 宁静，平静</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tran- (横过) + quil (安静)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片宁静的湖面，"横过(tran-)"湖面，
    <tspan x="50" dy="25">感受到的是一片"安静(quil)"的宁静(tranquility)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The park offers a sense of tranquility amidst the city's hustle and bustle.
  </text>
  <text x="50" y="310" class="content">
    公园在城市的喧嚣中提供了一片宁静。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water surface -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Ripples -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- Trees -->
    <line x1="50" y1="20" x2="50" y2="50" class="image" />
    <line x1="70" y1="20" x2="70" y2="50" class="image" />
    <line x1="90" y1="20" x2="90" y2="50" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="20" class="image" />
  </g>
</svg>