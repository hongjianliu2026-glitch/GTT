    <line x1="0" y1="360" x2="350" y2="360" class="image" />
    <line x1="0" y1="380" x2="350" y2="380" class="image" />
    <line x1="0" y1="400" x2="350" y2="400" class="image" />
    <line x1="0" y1="420" x2="350" y2="420" class="image" />
    <line x1="0" y1="440" x2="350" y2="440" class="image" />
