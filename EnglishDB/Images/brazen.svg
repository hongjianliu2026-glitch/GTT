<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brazen</text>
  <text x="50" y="120" class="subtitle">[ˈbreɪzn] adj. 厚颜无耻的，无耻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> braz (黄铜) + -en (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人脸上覆盖着黄铜(braz)，
    <tspan x="50" dy="25">黄铜的坚硬和无畏象征着他的厚颜无耻(brazen)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He had the brazen audacity to steal from his own mother.
  </text>
  <text x="50" y="310" class="content">
    他竟然厚颜无耻地偷了他母亲的东西。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face with brass mask -->
    <circle cx="100" cy="100" r="80" class="image" />
    <rect x="20" y="20" width="160" height="160" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <line x1="60" y1="140" x2="140" y2="140" class="image" />
  </g>
</svg>