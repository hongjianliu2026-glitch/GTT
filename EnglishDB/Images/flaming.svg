<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flaming</text>
  <text x="50" y="120" class="subtitle">[ˈfleɪmɪŋ] adj. 燃烧的，火红的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flam (火焰) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一团熊熊燃烧的火焰，"火焰(flam)"
    <tspan x="50" dy="25">在空中舞动，散发出炽热的光芒，这就是"燃烧的(flaming)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sky was painted with flaming colors at sunset.
  </text>
  <text x="50" y="310" class="content">
    日落时，天空被火红的色彩染红。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flame -->
    <polygon points="0,100 50,0 100,100" class="flame" />
    <polygon points="25,75 75,25 125,75" class="flame" />
    <polygon points="50,50 100,50 150,50" class="flame" />
  </g>
</svg>