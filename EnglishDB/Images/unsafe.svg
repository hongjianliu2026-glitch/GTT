<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unsafe</text>
  <text x="50" y="120" class="subtitle">[ʌnˈseɪf] adj. 不安全的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + safe (安全)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"不(un-)"安全的场景，一个人站在悬崖边，
    <tspan x="50" dy="25">脚下是深不见底的峡谷，这种状态就是"不安全(unsafe)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's unsafe to walk alone in this area at night.
  </text>
  <text x="50" y="310" class="content">
    晚上独自在这个区域行走是不安全的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on the edge -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Deep valley -->
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <line x1="50" y1="200" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="300" y2="250" class="image" />
  </g>
</svg>