<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #2C3E50; }
      .subtitle { font: italic 24px serif; fill: #7F8C8D; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dark</text>
  <text x="50" y="120" class="subtitle">[dɑːrk] adj. 黑暗的，深色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dark (源自中古英语 darc, 意为黑暗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚，天空完全被"黑暗(dark)"笼罩，
    <tspan x="50" dy="25">星星和月亮都隐藏在厚厚的云层后面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was so dark that I couldn't see anything.
  </text>
  <text x="50" y="310" class="content">
    房间太黑了，我什么都看不见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Moon hidden behind clouds -->
    <circle cx="175" cy="100" r="30" class="image" fill="#F1C40F" />
    <rect x="120" y="80" width="110" height="40" class="image" fill="#7F8C8D" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="3" class="image" fill="#ECF0F1" />
    <circle cx="100" cy="30" r="3" class="image" fill="#ECF0F1" />
    <circle cx="250" cy="70" r="3" class="image" fill="#ECF0F1" />
    <circle cx="300" cy="40" r="3" class="image" fill="#ECF0F1" />
  </g>
</svg>