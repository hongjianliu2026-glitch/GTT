<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">would-be</text>
  <text x="50" y="120" class="subtitle">[ˈwʊdˌbi] adj. 想要成为的，未来的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> would (意愿) + be (成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个年轻人站在镜子前，"意愿成为(would-be)"
    <tspan x="50" dy="25">一个成功的企业家，他穿着西装，手里拿着商业计划书。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The would-be entrepreneur is preparing for his first pitch.
  </text>
  <text x="50" y="310" class="content">
    这位未来的企业家正在为他的首次路演做准备。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Young man -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="150" x2="60" y2="140" class="image" />
    <line x1="100" y1="150" x2="140" y2="140" class="image" />
    <!-- Suit and tie -->
    <rect x="80" y="130" width="40" height="50" class="image" />
    <rect x="100" y="130" width="20" height="50" class="image" />
    <line x1="100" y1="130" x2="100" y2="150" class="image" />
    <!-- Business plan -->
    <rect x="150" y="80" width="100" height="120" class="image" />
    <line x1="160" y1="90" x2="240" y2="90" class="image" />
    <line x1="160" y1="110" x2="240" y2="110" class="image" />
    <line x1="160" y1="130" x2="240" y2="130" class="image" />
    <line x1="160" y1="150" x2="240" y2="150" class="image" />
  </g>
</svg>