<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anguish</text>
  <text x="50" y="120" class="subtitle">[ˈæŋɡwɪʃ] n. 极度痛苦，苦恼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ang (狭窄) + -uish (表状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"狭窄(ang)"的空间困住，
    <tspan x="50" dy="25">无法逃脱，内心充满了极度的痛苦(anguish)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The loss of her child caused her great anguish.
  </text>
  <text x="50" y="310" class="content">
    失去孩子让她极度痛苦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Narrow space -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person in anguish -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Tears -->
    <circle cx="190" cy="90" r="5" class="image" fill="#3498DB" />
    <circle cx="210" cy="90" r="5" class="image" fill="#3498DB" />
  </g>
</svg>