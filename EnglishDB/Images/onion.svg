<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">onion</text>
  <text x="50" y="120" class="subtitle">[ˈʌnjən] n. 洋葱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (一个) + on (在上面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个洋葱，它由一层层"一个在另一个上面(uni-on)"的薄皮组成，
    <tspan x="50" dy="25">每一层都包裹着内部的秘密，就像洋葱的层层结构一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She chopped the onion until it was very fine.
  </text>
  <text x="50" y="310" class="content">
    她把洋葱切得很细。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Onion layers -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="100" cy="100" r="60" class="image" />
    <circle cx="100" cy="100" r="40" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Onion core -->
    <circle cx="100" cy="100" r="10" fill="#F1C40F" />
  </g>
</svg>