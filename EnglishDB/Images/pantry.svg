<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pantry</text>
  <text x="50" y="120" class="subtitle">[ˈpæntri] n. 食品储藏室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pantr- (食物) + -y (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭主妇打开"食品储藏室(pantry)"，
    <tspan x="50" dy="25">里面堆满了各种食物，就像一个小型的食物仓库。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stocked the pantry with fresh vegetables and fruits.
  </text>
  <text x="50" y="310" class="content">
    她在食品储藏室里储存了新鲜的蔬菜和水果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Pantry door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Food items -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Apple -->
    <rect x="100" y="30" width="40" height="40" class="image" /> <!-- Box -->
    <line x1="150" y1="30" x2="150" y2="70" class="image" /> <!-- Carrot -->
    <line x1="160" y1="30" x2="160" y2="70" class="image" />
    <line x1="170" y1="30" x2="170" y2="70" class="image" />
    <circle cx="50" cy="150" r="20" class="image" /> <!-- Orange -->
    <rect x="100" y="130" width="40" height="40" class="image" /> <!-- Box -->
    <line x1="150" y1="130" x2="150" y2="170" class="image" /> <!-- Carrot -->
    <line x1="160" y1="130" x2="160" y2="170" class="image" />
    <line x1="170" y1="130" x2="170" y2="170" class="image" />
  </g>
</svg>