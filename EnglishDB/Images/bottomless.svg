<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bottomless</text>
  <text x="50" y="120" class="subtitle">[ˈbɒtəmləs] adj. 无底的，深不可测的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bottom (底部) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个深不见底的洞穴，"底部(bottom)"
    <tspan x="50" dy="25">消失得无影无踪，这就是"无底(bottomless)"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ocean is so deep, it seems bottomless.
  </text>
  <text x="50" y="310" class="content">
    海洋如此深邃，仿佛无底一般。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottomless pit -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="180" x2="175" y2="300" class="image" />
    <line x1="175" y1="300" x2="100" y2="400" class="image" />
    <line x1="175" y1="300" x2="250" y2="400" class="image" />
    <!-- Diver -->
    <circle cx="175" cy="200" r="10" class="image" />
    <line x1="175" y1="210" x2="175" y2="230" class="image" />
    <line x1="175" y1="230" x2="165" y2="250" class="image" />
    <line x1="175" y1="230" x2="185" y2="250" class="image" />
    <line x1="175" y1="220" x2="195" y2="210" class="image" />
  </g>
</svg>