<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peacock</text>
  <text x="50" y="120" class="subtitle">[ˈpiːkɒk] n. 孔雀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peac (显示) + -ock (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只孔雀展开它那五彩斑斓的尾巴，"显示(peac)"
    <tspan x="50" dy="25">出它的美丽，这就是孔雀(peacock)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The peacock spread its tail feathers in a dazzling display.
  </text>
  <text x="50" y="310" class="content">
    孔雀展开了它那令人眼花缭乱的尾羽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Peacock body -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Peacock tail -->
    <path d="M 100 130 C 50 150, 50 200, 100 220 C 150 200, 150 150, 100 130" class="image" />
    <path d="M 100 130 C 150 150, 150 200, 100 220 C 50 200, 50 150, 100 130" class="image" />
    <!-- Peacock head -->
    <circle cx="100" cy="70" r="10" class="image" />
    <!-- Peacock beak -->
    <path d="M 90 70 L 110 70 L 100 80 Z" class="image" />
  </g>
</svg>