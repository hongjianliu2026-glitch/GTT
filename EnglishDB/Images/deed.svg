<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deed</text>
  <text x="50" y="120" class="subtitle">[diːd] n. 行为，行动；契约</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (做) + ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在法庭上，"做(de-)"了一个重要的"行为(ed)"，
    <tspan x="50" dy="25">这个行为被记录下来，成为了一份契约(deed)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His brave deed was praised by everyone.
  </text>
  <text x="50" y="310" class="content">
    他的勇敢行为受到了大家的赞扬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Document -->
    <rect x="100" y="120" width="100" height="60" class="image" />
    <line x1="110" y1="130" x2="190" y2="130" class="image" />
    <line x1="110" y1="150" x2="190" y2="150" class="image" />
    <line x1="110" y1="170" x2="190" y2="170" class="image" />
  </g>
</svg>