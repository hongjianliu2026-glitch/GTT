<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hip</text>
  <text x="50" y="120" class="subtitle">[hɪp] n. 臀部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "hippe"，意为"臀部"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个舞者在舞台上，"扭动(hip)"
    <tspan x="50" dy="25">她的臀部，展现出优雅的舞姿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She moved her hips gracefully to the rhythm of the music.
  </text>
  <text x="50" y="310" class="content">
    她随着音乐的节奏优雅地扭动臀部。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hip -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Legs -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="350" class="image" />
    <line x1="100" y1="250" x2="150" y2="350" class="image" />
    <!-- Body -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Arms -->
    <line x1="70" y1="60" x2="20" y2="100" class="image" />
    <line x1="130" y1="60" x2="180" y2="100" class="image" />
  </g>
</svg>