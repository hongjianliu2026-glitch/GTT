<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hierarchical</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪəˈrɑːrkɪkl] adj. 分层的，层次的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hier- (神圣) + arch (统治) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神圣的统治结构，"神圣的统治(hier-arch)"
    <tspan x="50" dy="25">被分层管理，每一层都有其特定的职责和地位。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a hierarchical structure with several levels of management.
  </text>
  <text x="50" y="310" class="content">
    公司有一个分层结构，有几级管理层。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hierarchy levels -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="40" class="image" />
    <rect x="70" y="80" width="210" height="40" class="image" />
    <rect x="90" y="140" width="170" height="40" class="image" />
    <rect x="110" y="200" width="130" height="40" class="image" />
    <!-- Lines connecting levels -->
    <line x1="175" y1="60" x2="175" y2="80" class="image" />
    <line x1="175" y1="120" x2="175" y2="140" class="image" />
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
    <!-- Labels -->
    <text x="175" y="45" text-anchor="middle" class="content">Top Level</text>
    <text x="175" y="105" text-anchor="middle" class="content">Middle Level</text>
    <text x="175" y="165" text-anchor="middle" class="content">Lower Level</text>
    <text x="175" y="225" text-anchor="middle" class="content">Bottom Level</text>
  </g>
</svg>