<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dice</text>
  <text x="50" y="120" class="subtitle">[daɪs] n. 骰子；v. 切成方块</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (二) + -ce (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"切成两半(di-)"
    <tspan x="50" dy="25">再切成小块(ce)，这些小块就像骰子(dice)一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She diced the vegetables for the salad.
  </text>
  <text x="50" y="310" class="content">
    她把蔬菜切成了沙拉用的方块。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Cutting board -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Dice -->
    <rect x="70" y="50" width="30" height="30" class="image" />
    <rect x="110" y="50" width="30" height="30" class="image" />
    <rect x="150" y="50" width="30" height="30" class="image" />
    <rect x="70" y="90" width="30" height="30" class="image" />
    <rect x="110" y="90" width="30" height="30" class="image" />
    <rect x="150" y="90" width="30" height="30" class="image" />
  </g>
</svg>