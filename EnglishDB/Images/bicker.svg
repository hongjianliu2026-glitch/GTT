<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bicker</text>
  <text x="50" y="120" class="subtitle">[ˈbɪkər] v. 争吵，斗嘴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bick (小争吵) + -er (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在街头，"小争吵(bick)"
    <tspan x="50" dy="25">不断，互相斗嘴(bicker)，场面十分热闹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They often bicker over trivial matters.
  </text>
  <text x="50" y="310" class="content">
    他们经常为琐事争吵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Arrows representing bickering -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="130" y1="100" x2="70" y2="100" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="130" y1="100" x2="70" y2="100" class="image" />
    <!-- Speech bubbles -->
    <rect x="30" y="70" width="40" height="20" class="image" />
    <rect x="130" y="70" width="40" height="20" class="image" />
  </g>
</svg>