<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">queue</text>
  <text x="50" y="120" class="subtitle">[kjuː] n. 队列，排队；v. 排队</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> queu (来自法语，意为“尾巴”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人排成一条长长的"尾巴(queu)"，
    <tspan x="50" dy="25">他们都在等待进入一个热门的演唱会。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had to queue for hours to get tickets.
  </text>
  <text x="50" y="310" class="content">
    我们不得不排了几个小时的队才买到票。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Queue of people -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="90" y2="70" class="image" />

    <circle cx="120" cy="50" r="15" class="image" />
    <line x1="120" y1="65" x2="120" y2="100" class="image" />
    <line x1="120" y1="100" x2="100" y2="130" class="image" />
    <line x1="120" y1="100" x2="140" y2="130" class="image" />
    <line x1="120" y1="80" x2="160" y2="70" class="image" />

    <circle cx="190" cy="50" r="15" class="image" />
    <line x1="190" y1="65" x2="190" y2="100" class="image" />
    <line x1="190" y1="100" x2="170" y2="130" class="image" />
    <line x1="190" y1="100" x2="210" y2="130" class="image" />
    <line x1="190" y1="80" x2="230" y2="70" class="image" />

    <!-- Concert entrance -->
    <rect x="260" y="20" width="100" height="60" class="image" />
    <text x="280" y="55" class="content" fill="#2C3E50">Concert</text>
  </g>
</svg>