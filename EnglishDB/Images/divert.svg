<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">divert</text>
  <text x="50" y="120" class="subtitle">[daɪˈvɜːrt] v. 转移，转向；娱乐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + vert (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在道路上行驶，突然被"分开并转向(di-vert)"
    <tspan x="50" dy="25">到另一条路上，这就是转移(divert)的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The road was diverted due to construction.
  </text>
  <text x="50" y="310" class="content">
    由于施工，道路被改道了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Car -->
    <rect x="50" y="80" width="50" height="40" class="image" />
    <circle cx="70" cy="130" r="10" class="image" />
    <circle cx="110" cy="130" r="10" class="image" />
    <!-- Arrow indicating diversion -->
    <line x1="150" y1="110" x2="250" y2="110" class="image" />
    <line x1="250" y1="110" x2="240" y2="100" class="image" />
    <line x1="250" y1="110" x2="240" y2="120" class="image" />
  </g>
</svg>