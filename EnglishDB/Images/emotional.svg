<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">emotional</text>
  <text x="50" y="120" class="subtitle">[ɪˈmoʊʃənl] adj. 情感的，情绪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + mot (移动) + -ion (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在舞台上，"情绪(emotion)"
    <tspan x="50" dy="25">激动得眼泪"流出(e-)"，</tspan>
    <tspan x="50" dy="25">整个身体都在"移动(mot)"，</tspan>
    <tspan x="50" dy="25">这就是"情感的(emotional)"表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> She became emotional when she heard the news.
  </text>
  <text x="50" y="330" class="content">
    她听到这个消息时情绪激动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="130" y2="140" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Tears -->
    <circle cx="160" cy="90" r="5" class="image" fill="#1ABC9C" />
    <circle cx="190" cy="90" r="5" class="image" fill="#1ABC9C" />
    <line x1="160" y1="90" x2="140" y2="70" class="image" stroke="#1ABC9C" />
    <line x1="190" y1="90" x2="210" y2="70" class="image" stroke="#1ABC9C" />
  </g>
</svg>