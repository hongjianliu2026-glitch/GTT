<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tree { fill: #27AE60; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mangrove</text>
  <text x="50" y="120" class="subtitle">[ˈmæŋɡroʊv] n. 红树林</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mang (树) + rov (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片"树(mang)"在水中"生长(rov)"，
    <tspan x="50" dy="25">形成了独特的红树林(mangrove)生态系统。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mangrove forest is a vital habitat for many species.
  </text>
  <text x="50" y="310" class="content">
    红树林是许多物种的重要栖息地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- Trees -->
    <rect x="50" y="50" width="20" height="100" class="tree" />
    <rect x="100" y="70" width="20" height="80" class="tree" />
    <rect x="150" y="60" width="20" height="90" class="tree" />
    <rect x="200" y="50" width="20" height="100" class="tree" />
    <rect x="250" y="70" width="20" height="80" class="tree" />
    <!-- Roots -->
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="100" y1="150" x2="120" y2="200" class="image" />
    <line x1="150" y1="150" x2="170" y2="200" class="image" />
    <line x1="200" y1="150" x2="220" y2="200" class="image" />
    <line x1="250" y1="150" x2="270" y2="200" class="image" />
  </g>
</svg>