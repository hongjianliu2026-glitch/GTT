<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">planetary</text>
  <text x="50" y="120" class="subtitle">[ˈplænɪtəri] adj. 行星的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> planet (行星) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的行星(planet)，它的表面布满了各种奇异的景观，
    <tspan x="50" dy="25">这些景观构成了一个"行星的(planetary)"世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spacecraft will explore the planetary surface.
  </text>
  <text x="50" y="310" class="content">
    航天器将探索行星表面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Planet -->
    <circle cx="175" cy="100" r="80" class="image" fill="#3498DB" />
    <!-- Crater -->
    <circle cx="120" cy="120" r="20" class="image" fill="#7F8C8D" />
    <circle cx="200" cy="80" r="15" class="image" fill="#7F8C8D" />
    <circle cx="230" cy="140" r="25" class="image" fill="#7F8C8D" />
    <!-- Ring -->
    <ellipse cx="175" cy="20" rx="100" ry="20" class="image" stroke="#BDC3C7" />
  </g>
</svg>