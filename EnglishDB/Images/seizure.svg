<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seizure</text>
  <text x="50" y="120" class="subtitle">[ˈsiːʒər] n. 抓住，夺取；癫痫发作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + iz (抓住) + ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然"分开(se-)"并"抓住(iz)"自己的头部，
    <tspan x="50" dy="25">这是癫痫发作(seizure)的夸张画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The patient experienced a seizure during the night.
  </text>
  <text x="50" y="310" class="content">
    病人在夜间经历了一次癫痫发作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Hands -->
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="80" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <!-- Mouth -->
    <line x1="90" y1="120" x2="110" y2="120" class="image" />
  </g>
</svg>