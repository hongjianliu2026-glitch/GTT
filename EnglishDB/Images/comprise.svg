<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comprise</text>
  <text x="50" y="120" class="subtitle">[kəmˈpraɪz] v. 包含，由...组成</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + pris (抓住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手，"一起抓住(com-pris)"
    <tspan x="50" dy="25">所有的元素，将它们包含在一起，形成一个整体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team comprises members from various departments.
  </text>
  <text x="50" y="310" class="content">
    这个团队由来自不同部门的成员组成。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant hand -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="200" x2="180" y2="180" class="image" />
    <!-- Elements -->
    <circle cx="200" cy="100" r="20" class="image" />
    <rect x="250" y="80" width="40" height="40" class="image" />
    <line x1="320" y1="80" x2="320" y2="120" class="image" />
    <line x1="300" y1="100" x2="340" y2="100" class="image" />
    <!-- Hand holding elements -->
    <line x1="100" y1="150" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="250" y2="100" class="image" />
    <line x1="100" y1="150" x2="320" y2="100" class="image" />
  </g>
</svg>