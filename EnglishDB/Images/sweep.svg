<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sweep</text>
  <text x="50" y="120" class="subtitle">[swiːp] v. 扫，打扫；n. 扫除，范围</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (表示动作) + wep (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个清洁工用扫帚"弯曲(wep)"地面，
    <tspan x="50" dy="25">将灰尘"扫(sweep)"到一边，整个地面瞬间干净了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sweeps the floor every morning.
  </text>
  <text x="50" y="310" class="content">
    她每天早上都扫地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broom -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="75" y2="150" class="image" />
    <line x1="100" y1="180" x2="125" y2="150" class="image" />
    <line x1="100" y1="180" x2="150" y2="180" class="image" />
    <!-- Dust -->
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="140" cy="110" r="10" class="image" />
    <circle cx="160" cy="120" r="10" class="image" />
    <circle cx="180" cy="130" r="10" class="image" />
  </g>
</svg>