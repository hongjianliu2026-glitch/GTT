<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">horribly</text>
  <text x="50" y="120" class="subtitle">[ˈhɒrəbli] adv. 可怕地，非常</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> horr (恐怖) + -ibly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恐怖电影场景，"恐怖地(horribly)"
    <tspan x="50" dy="25">尖叫声回荡在空旷的房间里，让人毛骨悚然。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was horribly scary.
  </text>
  <text x="50" y="310" class="content">
    这部电影非常恐怖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ghost -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="140" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
    <line x1="100" y1="180" x2="70" y2="210" class="image" />
    <line x1="100" y1="180" x2="130" y2="210" class="image" />
    <!-- Scream -->
    <path d="M150,80 Q180,70 200,100 Q170,130 150,120" class="image" />
    <path d="M150,120 Q180,110 200,140 Q170,170 150,160" class="image" />
    <path d="M150,160 Q180,150 200,180 Q170,210 150,200" class="image" />
  </g>
</svg>