<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swap</text>
  <text x="50" y="120" class="subtitle">[swɒp] v. 交换，互换</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sw- (表示“移动”) + ap (表示“拿”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在交换(swap)礼物，他们互相"移动(sw-)"并"拿(ap)"对方的礼物。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to swap seats during the meeting.
  </text>
  <text x="50" y="310" class="content">
    他们在会议期间决定交换座位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person 1 -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Gift 1 -->
    <rect x="30" y="130" width="20" height="20" class="image" />

    <!-- Person 2 -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Gift 2 -->
    <rect x="220" y="130" width="20" height="20" class="image" />

    <!-- Arrows -->
    <line x1="70" y1="140" x2="180" y2="140" class="image" />
    <polygon points="180,140 170,135 170,145" class="image" />
    <line x1="180" y1="140" x2="70" y2="140" class="image" />
    <polygon points="70,140 80,135 80,145" class="image" />
  </g>
</svg>