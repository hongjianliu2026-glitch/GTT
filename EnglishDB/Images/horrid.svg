<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">horrid</text>
  <text x="50" y="120" class="subtitle">[ˈhɒrɪd] adj. 可怕的，令人讨厌的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> horr- (恐怖) + -id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"恐怖(horr-)"的场景，比如一个
    <tspan x="50" dy="25">满脸皱纹的老巫婆，她的存在让人感到"可怕(horrid)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie had a horrid ending that left everyone shocked.
  </text>
  <text x="50" y="310" class="content">
    这部电影有一个可怕的结局，让所有人都震惊了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Witch -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="120" x2="100" y2="110" class="image" />
    <line x1="50" y1="120" x2="0" y2="110" class="image" />
    <!-- Wrinkles -->
    <line x1="30" y1="40" x2="70" y2="40" class="image" />
    <line x1="30" y1="60" x2="70" y2="60" class="image" />
    <line x1="30" y1="30" x2="70" y2="30" class="image" />
  </g>
</svg>