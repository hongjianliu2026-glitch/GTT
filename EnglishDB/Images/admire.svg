<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">admire</text>
  <text x="50" y="120" class="subtitle">[ədˈmaɪər] v. 钦佩，羡慕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + mir (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高山上，"朝向(ad-)"
    <tspan x="50" dy="25">远处的美景，"看(mir)"得目瞪口呆，</tspan>
    <tspan x="50" dy="25">心中充满了钦佩(admire)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She admires her teacher's dedication.
  </text>
  <text x="50" y="310" class="content">
    她钦佩她老师的奉献精神。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 150 L100 0 L200 150 Z" class="image" />
    <!-- Person -->
    <circle cx="100" cy="180" r="15" class="image" />
    <line x1="100" y1="195" x2="100" y2="230" class="image" />
    <line x1="100" y1="230" x2="80" y2="260" class="image" />
    <line x1="100" y1="230" x2="120" y2="260" class="image" />
    <line x1="100" y1="210" x2="130" y2="200" class="image" />
    <!-- Eyes -->
    <circle cx="90" cy="175" r="3" class="image" />
    <circle cx="110" cy="175" r="3" class="image" />
  </g>
</svg>