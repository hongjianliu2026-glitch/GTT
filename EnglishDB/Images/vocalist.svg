<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vocalist</text>
  <text x="50" y="120" class="subtitle">[ˈvoʊklɪst] n. 歌手，声乐家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> voc (声音) + -al (形容词后缀) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个歌手站在舞台上，用她的声音(voc)
    <tspan x="50" dy="25">震撼全场，她就是一个声乐家(vocalist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vocalist mesmerized the audience with her powerful voice.
  </text>
  <text x="50" y="310" class="content">
    这位歌手用她强大的声音迷住了观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Singer -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="140" class="image" />
    <line x1="175" y1="150" x2="205" y2="140" class="image" />
    <line x1="175" y1="180" x2="145" y2="200" class="image" />
    <line x1="175" y1="180" x2="205" y2="200" class="image" />
    <!-- Microphone -->
    <line x1="175" y1="130" x2="175" y2="80" class="image" />
    <circle cx="175" cy="70" r="10" class="image" />
    <!-- Sound waves -->
    <path d="M175 60 Q195 50, 215 60" class="image" />
    <path d="M175 60 Q155 50, 135 60" class="image" />
    <path d="M175 60 Q185 40, 205 60" class="image" />
    <path d="M175 60 Q165 40, 145 60" class="image" />
  </g>
</svg>