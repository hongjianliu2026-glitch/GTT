<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enrage</text>
  <text x="50" y="120" class="subtitle">[ɪnˈreɪdʒ] v. 激怒，使暴怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + rage (愤怒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"使(en-)"得"愤怒(rage)"，
    <tspan x="50" dy="25">他的脸变得通红，眼睛瞪得大大的，</tspan>
    <tspan x="50" dy="25">这就是被激怒(enrage)的样子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His rude behavior enraged the crowd.
  </text>
  <text x="50" y="310" class="content">
    他的粗鲁行为激怒了人群。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
    <line x1="70" y1="120" x2="60" y2="110" class="image" />
    <line x1="130" y1="120" x2="140" y2="110" class="image" />
    <line x1="70" y1="120" x2="60" y2="130" class="image" />
    <line x1="130" y1="120" x2="140" y2="130" class="image" />
  </g>
</svg>