<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scab</text>
  <text x="50" y="120" class="subtitle">[skæb] n. 痂，疤；v. 结痂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scab (源自拉丁语 "scabere"，意为“刮，擦”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人不小心刮伤了皮肤，伤口上结了一层"痂(scab)"，
    <tspan x="50" dy="25">这层痂就像是一层保护膜，防止伤口进一步感染。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wound healed and a scab formed over it.
  </text>
  <text x="50" y="310" class="content">
    伤口愈合了，上面结了一层痂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skin -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wound -->
    <rect x="100" y="50" width="150" height="50" class="image" />
    <!-- Scab -->
    <rect x="120" y="60" width="110" height="30" class="image" />
    <!-- Blood -->
    <circle cx="150" cy="75" r="10" class="image" />
    <circle cx="180" cy="75" r="10" class="image" />
    <circle cx="210" cy="75" r="10" class="image" />
  </g>
</svg>