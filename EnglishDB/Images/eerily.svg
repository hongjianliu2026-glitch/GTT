<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8B0000; }
      .subtitle { font: italic 24px serif; fill: #4B0082; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eerily</text>
  <text x="50" y="120" class="subtitle">[ˈɪərɪli] adv. 怪异地，阴森地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eeri (怪异的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阴森的夜晚，月光透过乌云，"怪异地(eerily)"
    <tspan x="50" dy="25">照亮了一座废弃的古堡，空气中弥漫着诡异的气氛。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house looked eerily silent in the moonlight.
  </text>
  <text x="50" y="310" class="content">
    那座老房子在月光下显得异常寂静。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F5DEB3" />
    <!-- Clouds -->
    <ellipse cx="150" cy="80" rx="100" ry="40" class="image" fill="#D3D3D3" />
    <ellipse cx="50" cy="120" rx="120" ry="50" class="image" fill="#D3D3D3" />
    <!-- Castle -->
    <rect x="200" y="100" width="150" height="100" class="image" fill="#8B4513" />
    <rect x="220" y="120" width="30" height="30" class="image" fill="#FFD700" />
    <rect x="270" y="120" width="30" height="30" class="image" fill="#FFD700" />
    <rect x="320" y="120" width="30" height="30" class="image" fill="#FFD700" />
    <!-- Ghost -->
    <circle cx="275" cy="180" r="20" class="image" fill="#FFFFFF" />
    <line x1="275" y1="200" x2="275" y2="250" class="image" />
    <line x1="275" y1="250" x2="250" y2="280" class="image" />
    <line x1="275" y1="250" x2="300" y2="280" class="image" />
    <line x1="275" y1="220" x2="240" y2="210" class="image" />
    <line x1="275" y1="220" x2="310" y2="210" class="image" />
  </g>
</svg>