<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spleen</text>
  <text x="50" y="120" class="subtitle">[spliːn] n. 脾脏；脾气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> splen- (脾脏)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的脾脏漂浮在空中，"脾脏(splen)"
    <tspan x="50" dy="25">突然爆炸，释放出无尽的"脾气(spleen)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His spleen was removed due to an injury.
  </text>
  <text x="50" y="310" class="content">
    他的脾脏因受伤而被切除。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spleen -->
    <ellipse cx="175" cy="100" rx="100" ry="60" class="image" />
    <!-- Explosion -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="155" y1="140" x2="95" y2="140" class="image" />
    <line x1="195" y1="140" x2="255" y2="140" class="image" />
    <line x1="165" y1="160" x2="115" y2="210" class="image" />
    <line x1="185" y1="160" x2="235" y2="210" class="image" />
  </g>
</svg>