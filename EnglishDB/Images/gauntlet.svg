<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gauntlet</text>
  <text x="50" y="120" class="subtitle">[ˈɡɔːntlɪt] n. 防护手套，挑战</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gaunt (瘦削的) + let (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个瘦削的骑士，"瘦削的手(gaunt-let)"
    <tspan x="50" dy="25">上戴着防护手套，准备迎接挑战。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He threw down the gauntlet to his opponent.
  </text>
  <text x="50" y="310" class="content">
    他向对手发起了挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gauntlet -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="10" y="10" width="130" height="80" class="image" />
    <line x1="20" y1="30" x2="130" y2="30" class="image" />
    <line x1="20" y1="50" x2="120" y2="50" class="image" />
    <line x1="20" y1="70" x2="110" y2="70" class="image" />
    <!-- Knight -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="90" x2="230" y2="80" class="image" />
    <line x1="200" y1="90" x2="170" y2="80" class="image" />
  </g>
</svg>