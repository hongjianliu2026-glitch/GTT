<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">still</text>
  <text x="50" y="120" class="subtitle">[stɪl] adj. 静止的，平静的；adv. 仍然，还</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + ill (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个湖面，"站立不动(st-ill)"，
    <tspan x="50" dy="25">湖水完全静止，没有一丝波纹，这就是still的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lake was still as a mirror.
  </text>
  <text x="50" y="310" class="content">
    湖面平静如镜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" fill="#16A085" />
    <!-- Reflection -->
    <line x1="100" y1="180" x2="250" y2="180" class="image" />
    <line x1="120" y1="190" x2="230" y2="190" class="image" />
    <line x1="140" y1="200" x2="210" y2="200" class="image" />
    <line x1="160" y1="210" x2="190" y2="210" class="image" />
  </g>
</svg>