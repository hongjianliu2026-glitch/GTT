<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">life-size</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪf saɪz] adj. 与实物一样大小的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> life (生命) + size (大小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的雕塑，"与生命(life)一样大小(size)"，
    <tspan x="50" dy="25">仿佛它随时会动起来，这种夸张的尺寸让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist created a life-size statue of the president.
  </text>
  <text x="50" y="310" class="content">
    艺术家创作了一座与总统真人一样大小的雕像。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant sculpture -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="40" class="image" />
    <line x1="50" y1="140" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="0" y2="180" class="image" />
    <line x1="50" y1="160" x2="100" y2="180" class="image" />
    <line x1="50" y1="200" x2="0" y2="240" class="image" />
    <line x1="50" y1="200" x2="100" y2="240" class="image" />
    <!-- Human figure for scale -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>