<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nothing</text>
  <text x="50" y="120" class="subtitle">[ˈnʌθɪŋ] n. 没有什么，无</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> no- (无) + thing (事物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个空荡荡的房间，"无(no)"
    <tspan x="50" dy="25">任何"事物(thing)"，这就是"nothing"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There was nothing left in the fridge.
  </text>
  <text x="50" y="310" class="content">
    冰箱里什么也没有了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Empty room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Windows -->
    <rect x="150" y="20" width="50" height="50" class="image" />
    <rect x="250" y="20" width="50" height="50" class="image" />
    <!-- Empty space -->
    <text x="150" y="120" class="content" text-anchor="middle" font-size="48">?</text>
  </g>
</svg>