<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nightclub</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪtklʌb] n. 夜总会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> night (夜晚) + club (俱乐部)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚，一群人在一个闪烁着霓虹灯的俱乐部里，
    <tspan x="50" dy="25">随着音乐跳舞，享受着夜生活。这就是nightclub的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They went to a nightclub after the concert.
  </text>
  <text x="50" y="310" class="content">
    他们在音乐会结束后去了夜总会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nightclub building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Neon lights -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <!-- People dancing -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="120" cy="110" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
    <circle cx="160" cy="110" r="10" class="image" />
    <circle cx="180" cy="100" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="240" cy="110" r="10" class="image" />
    <circle cx="260" cy="100" r="10" class="image" />
    <circle cx="280" cy="110" r="10" class="image" />
    <!-- Music notes -->
    <path d="M50 50 Q70 30 90 50 T130 50" class="image" />
    <path d="M60 60 Q80 40 100 60 T140 60" class="image" />
  </g>
</svg>