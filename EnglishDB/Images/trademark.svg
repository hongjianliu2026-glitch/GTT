<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trademark</text>
  <text x="50" y="120" class="subtitle">[ˈtreɪdmɑːrk] n. 商标</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trade (贸易) + mark (标记)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"贸易标记(trade-mark)"，
    <tspan x="50" dy="25">它像一个闪闪发光的盾牌，保护着商品的独特性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's logo is a registered trademark.
  </text>
  <text x="50" y="310" class="content">
    公司的标志是一个注册商标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <path d="M50 50 L150 50 L200 100 L150 150 L50 150 Z" class="image" />
    <!-- Sparkles -->
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <circle cx="80" cy="120" r="5" class="image" />
    <!-- Trade mark -->
    <text x="70" y="110" class="content" style="font-size: 24px; fill: #E74C3C;">TM</text>
  </g>
</svg>