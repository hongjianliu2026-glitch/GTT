<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bookcase</text>
  <text x="50" y="120" class="subtitle">[ˈbʊkkeɪs] n. 书架</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> book (书) + case (箱子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的书架，上面堆满了各种书籍，
    <tspan x="50" dy="25">就像一个装满知识的"书箱子(book-case)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She organized her books on the bookcase.
  </text>
  <text x="50" y="310" class="content">
    她把书整理在书架上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bookcase -->
    <rect x="0" y="0" width="300" height="400" class="image" />
    <!-- Books -->
    <rect x="20" y="20" width="50" height="150" class="image" />
    <rect x="90" y="20" width="50" height="150" class="image" />
    <rect x="160" y="20" width="50" height="150" class="image" />
    <rect x="230" y="20" width="50" height="150" class="image" />
    <!-- Book titles -->
    <text x="30" y="100" class="content" transform="rotate(90 30 100)">Book 1</text>
    <text x="100" y="100" class="content" transform="rotate(90 100 100)">Book 2</text>
    <text x="170" y="100" class="content" transform="rotate(90 170 100)">Book 3</text>
    <text x="240" y="100" class="content" transform="rotate(90 240 100)">Book 4</text>
  </g>
</svg>