<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parlor</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːrlər] n. 客厅，会客室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> par (准备) + -or (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个精心准备的(par)地方(-or)，
    <tspan x="50" dy="25">用来接待客人，这就是客厅(parlor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They welcomed us into their cozy parlor.
  </text>
  <text x="50" y="310" class="content">
    他们把我们迎进了他们舒适的客厅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parlor room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sofa -->
    <rect x="50" y="20" width="250" height="80" class="image" />
    <!-- Coffee table -->
    <rect x="120" y="110" width="110" height="30" class="image" />
    <!-- Chairs -->
    <rect x="20" y="150" width="50" height="50" class="image" />
    <rect x="280" y="150" width="50" height="50" class="image" />
    <!-- Lamp -->
    <line x1="175" y1="20" x2="175" y2="100" class="image" />
    <circle cx="175" cy="100" r="10" class="image" />
  </g>
</svg>