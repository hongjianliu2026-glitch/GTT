<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">secluded</text>
  <text x="50" y="120" class="subtitle">[sɪˈkluːdɪd] adj. 僻静的，隐居的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + clud (关闭) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"分开并关闭(se-clud-ed)"在一个远离喧嚣的小屋里，
    <tspan x="50" dy="25">享受着宁静的隐居生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a secluded cabin in the woods for her retreat.
  </text>
  <text x="50" y="310" class="content">
    她在树林里找到了一个僻静的小屋，用于她的静修。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cabin -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="80" class="image" />
    <!-- Window -->
    <rect x="80" y="50" width="40" height="40" class="image" />
    <rect x="230" y="50" width="40" height="40" class="image" />
    <!-- Trees -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="50" y1="200" x2="50" y2="150" class="image" />
    <line x1="100" y1="200" x2="100" y2="120" class="image" />
    <line x1="150" y1="200" x2="150" y2="180" class="image" />
    <line x1="200" y1="200" x2="200" y2="130" class="image" />
    <line x1="250" y1="200" x2="250" y2="160" class="image" />
    <line x1="300" y1="200" x2="300" y2="140" class="image" />
  </g>
</svg>