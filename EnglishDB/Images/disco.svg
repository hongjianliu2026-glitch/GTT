<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disco</text>
  <text x="50" y="120" class="subtitle">[ˈdɪskoʊ] n. 迪斯科舞厅，迪斯科音乐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> disc (圆盘) + -o (表示音乐或场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆盘(disc)在舞厅中央旋转，
    <tspan x="50" dy="25">伴随着动感的音乐，人们随之起舞，这就是迪斯科(disco)的狂欢场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They went to the disco to dance all night.
  </text>
  <text x="50" y="310" class="content">
    他们去迪斯科舞厅跳舞到天亮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dance floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Discoball -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Dancers -->
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <!-- Music notes -->
    <path d="M50 50 Q75 25 100 50 T150 50" class="image" />
    <path d="M50 70 Q75 45 100 70 T150 70" class="image" />
    <path d="M50 90 Q75 65 100 90 T150 90" class="image" />
  </g>
</svg>