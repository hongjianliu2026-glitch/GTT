<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hub</text>
  <text x="50" y="120" class="subtitle">[hʌb] n. 中心，枢纽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "hubbe"，意为“轮子的中心”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的轮子，所有的辐条都连接到
    <tspan x="50" dy="25">一个中心点，这个点就是"hub"，所有的交通和信息都汇聚于此。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city is a major transportation hub.
  </text>
  <text x="50" y="310" class="content">
    这座城市是一个主要的交通枢纽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wheel -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Spokes -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <line x1="175" y1="100" x2="175" y2="180" class="image" />
    <line x1="175" y1="100" x2="95" y2="100" class="image" />
    <!-- Hub -->
    <circle cx="175" cy="100" r="10" class="image" fill="#E74C3C" />
    <text x="165" y="115" class="highlight" font-size="14">hub</text>
  </g>
</svg>