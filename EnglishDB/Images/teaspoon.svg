<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">teaspoon</text>
  <text x="50" y="120" class="subtitle">[ˈtiːspuːn] n. 茶匙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tea (茶) + spoon (匙)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个茶壶在倒茶，茶水流进一个"茶匙(tea-spoon)"，
    <tspan x="50" dy="25">这个茶匙就是用来量取茶水的小工具。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Add two teaspoons of sugar to the tea.
  </text>
  <text x="50" y="310" class="content">
    在茶里加两茶匙糖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teapot -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="150" r="20" class="image" />
    <!-- Spout -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <!-- Handle -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <!-- Teaspoon -->
    <rect x="200" y="50" width="50" height="20" class="image" />
    <line x1="200" y1="50" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="250" y2="70" class="image" />
    <!-- Tea pouring -->
    <line x1="50" y1="150" x2="225" y2="60" class="image" />
  </g>
</svg>