<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cessation</text>
  <text x="50" y="120" class="subtitle">[sɛˈseɪʃən] n. 停止，中止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cess (走) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆飞驰的汽车突然"走(cess)"不动了，
    <tspan x="50" dy="25">停在路边，这就是"停止(cessation)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cessation of the rain allowed us to go outside.
  </text>
  <text x="50" y="310" class="content">
    雨停了，我们才能出去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="150" y="50" width="100" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="170" cy="100" r="10" class="image" />
    <circle cx="230" cy="100" r="10" class="image" />
    <!-- Stop sign -->
    <rect x="270" y="50" width="30" height="30" class="image" />
    <text x="275" y="75" class="content" fill="#000">STOP</text>
  </g>
</svg>