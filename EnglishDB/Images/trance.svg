<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trance</text>
  <text x="50" y="120" class="subtitle">[træns] n. 恍惚，出神</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (穿过) + -ance (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在听音乐时，"穿过(trans-)"
    <tspan x="50" dy="25">现实与梦境的边界，进入了一种恍惚(trance)状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hypnotist put the patient into a trance.
  </text>
  <text x="50" y="310" class="content">
    催眠师让病人进入了恍惚状态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in trance -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Music notes -->
    <path d="M100,80 Q120,60 140,80 T180,80" class="image" />
    <path d="M100,100 Q120,80 140,100 T180,100" class="image" />
    <path d="M100,120 Q120,100 140,120 T180,120" class="image" />
    <!-- Boundary -->
    <line x1="200" y1="50" x2="200" y2="250" class="image" />
    <text x="210" y="150" class="content" transform="rotate(90 210 150)">现实与梦境的边界</text>
  </g>
</svg>