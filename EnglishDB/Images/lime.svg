<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF3E7; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lime { fill: #9B59B6; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lime</text>
  <text x="50" y="120" class="subtitle">[laɪm] n. 酸橙，石灰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lime (源自中古英语，意为“石灰”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的酸橙(lime)，它不仅酸甜可口，还能用来制作石灰(lime)，
    <tspan x="50" dy="25">这种石灰可以用来粉刷墙壁，让墙壁变得洁白如新。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added a slice of lime to her drink to make it more refreshing.
  </text>
  <text x="50" y="310" class="content">
    她在饮料中加了一片酸橙，使其更加清爽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lime -->
    <circle cx="100" cy="100" r="50" class="lime" />
    <!-- Lime slice -->
    <path d="M 100 100 L 150 50 L 200 100 Z" class="lime" />
    <!-- Lime juice -->
    <circle cx="150" cy="120" r="10" class="lime" />
    <circle cx="170" cy="130" r="10" class="lime" />
    <circle cx="190" cy="140" r="10" class="lime" />
    <!-- Lime tree -->
    <line x1="50" y1="200" x2="50" y2="100" class="image" />
    <line x1="50" y1="200" x2="30" y2="180" class="image" />
    <line x1="50" y1="200" x2="70" y2="180" class="image" />
    <line x1="50" y1="200" x2="40" y2="160" class="image" />
    <line x1="50" y1="200" x2="60" y2="160" class="image" />
  </g>
</svg>