<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gobble</text>
  <text x="50" y="120" class="subtitle">[ˈɡɒbl] v. 狼吞虎咽，贪婪地吃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gob (嘴) + -ble (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只饥饿的鸟，"张开大嘴(gob)"
    <tspan x="50" dy="25">贪婪地吞食(ble)食物，这就是gobble的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The turkey gobbled up all the food on the table.
  </text>
  <text x="50" y="310" class="content">
    火鸡把桌上的食物都狼吞虎咽地吃光了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird's head -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Bird's beak -->
    <polygon points="50,100 80,80 80,120" class="image" />
    <!-- Food -->
    <rect x="100" y="90" width="50" height="20" class="image" />
    <rect x="120" y="70" width="30" height="20" class="image" />
    <rect x="110" y="110" width="40" height="20" class="image" />
    <!-- Bird's body -->
    <ellipse cx="50" cy="150" rx="40" ry="20" class="image" />
    <!-- Bird's wings -->
    <line x1="10" y1="130" x2="90" y2="130" class="image" />
    <line x1="10" y1="140" x2="90" y2="140" class="image" />
  </g>
</svg>