<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exploration</text>
  <text x="50" y="120" class="subtitle">[ˌɛkspləˈreɪʃən] n. 探索，勘探</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + plor (喊叫) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的探险家，"向外喊叫(ex-plor)"
    <tspan x="50" dy="25">以探索未知领域，这种行为就是探索(exploration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The exploration of the Amazon rainforest is challenging.
  </text>
  <text x="50" y="310" class="content">
    探索亚马逊雨林是具有挑战性的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Explorer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Map -->
    <rect x="50" y="20" width="250" height="200" class="image" />
    <!-- Compass -->
    <circle cx="175" cy="120" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="100" class="image" />
    <line x1="175" y1="120" x2="155" y2="120" class="image" />
    <line x1="175" y1="120" x2="195" y2="120" class="image" />
    <line x1="175" y1="120" x2="165" y2="130" class="image" />
  </g>
</svg>