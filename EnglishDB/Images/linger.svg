<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">linger</text>
  <text x="50" y="120" class="subtitle">[ˈlɪŋɡər] v. 逗留，徘徊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ling (停留) + -er (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在门口"停留(ling)"，不愿离开，
    <tspan x="50" dy="25">就像一只蝴蝶在花丛中"徘徊(linger)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She lingered at the door, not wanting to leave.
  </text>
  <text x="50" y="310" class="content">
    她在门口逗留，不想离开。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="300" class="image" />
    <!-- Person -->
    <circle cx="75" cy="350" r="20" class="image" />
    <line x1="75" y1="370" x2="75" y2="420" class="image" />
    <line x1="75" y1="420" x2="55" y2="450" class="image" />
    <line x1="75" y1="420" x2="95" y2="450" class="image" />
    <line x1="75" y1="390" x2="100" y2="380" class="image" />
    <!-- Butterfly -->
    <path d="M200,100 C210,80 230,80 240,100 S270,120 260,140" class="image" />
    <path d="M200,100 C190,80 170,80 160,100 S130,120 140,140" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
  </g>
</svg>