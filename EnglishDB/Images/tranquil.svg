<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tranquil</text>
  <text x="50" y="120" class="subtitle">[ˈtræŋkwɪl] adj. 平静的，安宁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (超越) + quill (安静)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在湖边，湖面如镜，"超越(trans-)"
    <tspan x="50" dy="25">了所有的喧嚣，只有"安静(quill)"的湖水，</tspan>
    <tspan x="50" dy="25">这种状态就是"tranquil"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tranquil lake was perfect for a peaceful afternoon.
  </text>
  <text x="50" y="310" class="content">
    平静的湖面非常适合度过一个宁静的下午。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Reflection -->
    <line x1="70" y1="80" x2="280" y2="80" class="image" />
    <line x1="70" y1="110" x2="250" y2="110" class="image" />
    <!-- Person -->
    <circle cx="200" cy="150" r="15" class="image" />
    <line x1="200" y1="165" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="180" x2="230" y2="170" class="image" />
  </g>
</svg>