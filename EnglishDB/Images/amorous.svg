<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">amorous</text>
  <text x="50" y="120" class="subtitle">[ˈæmərəs] adj. 多情的，恋爱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> amor (爱) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满爱意(amor)的场景，一对恋人在月光下深情对视，
    <tspan x="50" dy="25">他们的眼中充满了多情(amorous)的光芒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The amorous couple walked hand in hand along the beach.
  </text>
  <text x="50" y="310" class="content">
    这对多情的情侣手牵手沿着海滩散步。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Couple -->
    <circle cx="50" cy="150" r="15" class="image" fill="#FF6F61" />
    <circle cx="150" cy="150" r="15" class="image" fill="#FF6F61" />
    <line x1="50" y1="165" x2="150" y2="165" class="image" />
    <!-- Hearts -->
    <path d="M20,200 C20,250 180,250 180,200" class="image" fill="#E91E63" />
    <path d="M30,210 C30,260 170,260 170,210" class="image" fill="#E91E63" />
  </g>
</svg>