<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irritant</text>
  <text x="50" y="120" class="subtitle">[ˈɪrɪtənt] n. 刺激物，刺激剂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (进入) + rit (擦) + -ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学家不小心将一种"刺激物(irritant)"
    <tspan x="50" dy="25">洒在了手上，皮肤立刻感到刺痛，仿佛被擦伤(rit)了一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The strong smell of the cleaning agent was an irritant to her sensitive nose.
  </text>
  <text x="50" y="310" class="content">
    清洁剂的强烈气味刺激了她敏感的鼻子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Irritant bottle -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="160" r="10" class="image" />
    <!-- Hand -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="200" class="image" />
    <line x1="200" y1="150" x2="170" y2="180" class="image" />
    <line x1="200" y1="150" x2="230" y2="180" class="image" />
    <!-- Irritation effect -->
    <line x1="200" y1="100" x2="180" y2="80" class="image" />
    <line x1="200" y1="100" x2="220" y2="80" class="image" />
    <line x1="200" y1="100" x2="190" y2="120" class="image" />
    <line x1="200" y1="100" x2="210" y2="120" class="image" />
  </g>
</svg>