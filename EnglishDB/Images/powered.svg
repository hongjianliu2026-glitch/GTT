<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">powered</text>
  <text x="50" y="120" class="subtitle">[ˈpaʊəd] adj. 有动力的，供电的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> power (力量) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车，"充满力量(power)"
    <tspan x="50" dy="25">地行驶在公路上，它就是有动力的(powered)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new electric car is powered by a battery.
  </text>
  <text x="50" y="310" class="content">
    这辆新电动车是由电池供电的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="130" r="20" class="image" />
    <circle cx="280" cy="130" r="20" class="image" />
    <!-- Lightning bolt -->
    <polyline points="20,20 50,50 20,80 50,110" class="image" />
    <!-- Road -->
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
  </g>
</svg>