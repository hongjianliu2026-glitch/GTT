<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cicada</text>
  <text x="50" y="120" class="subtitle">[sɪˈkɑːdə] n. 蝉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cicada源自拉丁语cicada，意为“蝉”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝉在树上，"高声鸣叫(cicada)"，
    <tspan x="50" dy="25">它的声音响彻整个夏天，让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cicada's song filled the summer air.
  </text>
  <text x="50" y="310" class="content">
    蝉的歌声充满了夏日的空气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="70" y1="20" x2="70" y2="180" class="image" />
    <line x1="90" y1="20" x2="90" y2="180" class="image" />
    <!-- Cicada -->
    <circle cx="60" cy="50" r="15" class="image" />
    <line x1="60" y1="65" x2="60" y2="100" class="image" />
    <line x1="60" y1="80" x2="40" y2="90" class="image" />
    <line x1="60" y1="80" x2="80" y2="90" class="image" />
    <line x1="60" y1="100" x2="40" y2="120" class="image" />
    <line x1="60" y1="100" x2="80" y2="120" class="image" />
  </g>
</svg>