<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .raindrop { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">raindrop</text>
  <text x="50" y="120" class="subtitle">[ˈreɪndrɒp] n. 雨滴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rain (雨) + drop (滴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一滴雨从天而降，"雨(rain)"
    <tspan x="50" dy="25">滴(drop)在地上，溅起小小的水花。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The raindrop fell on the window, creating a small ripple.
  </text>
  <text x="50" y="310" class="content">
    雨滴落在窗户上，形成了一个小小的涟漪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Raindrop -->
    <ellipse cx="175" cy="200" rx="10" ry="20" class="raindrop" />
    <!-- Ground -->
    <rect x="0" y="250" width="350" height="50" class="image" />
  </g>
</svg>