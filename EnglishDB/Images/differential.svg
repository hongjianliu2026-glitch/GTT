<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">differential</text>
  <text x="50" y="120" class="subtitle">[ˌdɪfəˈrɛnʃəl] adj. 差别的，微分的；n. 差速器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> differ (不同) + -ential (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车在两条不同的道路上行驶，"不同(differ)"
    <tspan x="50" dy="25">的速度需要通过差速器(differential)来调整，</tspan>
    <tspan x="50" dy="25">以确保车轮能够平稳转动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car's differential helps the wheels turn at different speeds.
  </text>
  <text x="50" y="310" class="content">
    汽车的差速器帮助车轮以不同的速度转动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road 1 -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Road 2 -->
    <line x1="0" y1="50" x2="350" y2="50" class="image" />
    <!-- Car on Road 1 -->
    <rect x="50" y="10" width="100" height="30" class="image" />
    <circle cx="70" cy="40" r="10" class="image" />
    <circle cx="130" cy="40" r="10" class="image" />
    <!-- Car on Road 2 -->
    <rect x="200" y="60" width="100" height="30" class="image" />
    <circle cx="220" cy="90" r="10" class="image" />
    <circle cx="280" cy="90" r="10" class="image" />
    <!-- Differential -->
    <rect x="150" y="20" width="50" height="50" class="image" />
    <line x1="175" y1="20" x2="175" y2="70" class="image" />
    <line x1="150" y1="45" x2="200" y2="45" class="image" />
  </g>
</svg>