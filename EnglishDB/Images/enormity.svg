<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enormity</text>
  <text x="50" y="120" class="subtitle">[ɪˈnɔːrməti] n. 巨大，严重性，暴行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + norm (规则) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的怪物，"超出(e-)"
    <tspan x="50" dy="25">所有规则(norm)，它的存在本身就是一种"巨大(enormity)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enormity of the disaster shocked the nation.
  </text>
  <text x="50" y="310" class="content">
    灾难的严重性震惊了全国。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- Broken rules -->
    <line x1="200" y1="50" x2="250" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="50" class="image" />
    <line x1="200" y1="150" x2="250" y2="200" class="image" />
    <line x1="200" y1="200" x2="250" y2="150" class="image" />
  </g>
</svg>