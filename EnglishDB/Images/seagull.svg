<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seagull</text>
  <text x="50" y="120" class="subtitle">[ˈsiːɡʌl] n. 海鸥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sea (海) + gull (鸥)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只海鸥在海面上翱翔，"海(sea)"与"鸥(gull)"
    <tspan x="50" dy="25">的结合，构成了海鸥(seagull)的形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The seagull soared gracefully over the ocean.
  </text>
  <text x="50" y="310" class="content">
    那只海鸥优雅地在海面上翱翔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sea -->
    <rect x="50" y="100" width="250" height="100" class="image" />
    <!-- Seagull -->
    <circle cx="100" cy="80" r="15" class="image" />
    <line x1="100" y1="95" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="80" y2="160" class="image" />
    <line x1="100" y1="130" x2="120" y2="160" class="image" />
    <line x1="100" y1="110" x2="130" y2="100" class="image" />
  </g>
</svg>