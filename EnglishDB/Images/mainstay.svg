<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mainstay</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪnsteɪ] n. 支柱，中流砥柱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> main (主要的) + stay (支撑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在大海上航行，"主要的支撑(main-stay)"
    <tspan x="50" dy="25">是船上的主桅杆，它稳稳地支撑着船帆，</tspan>
    <tspan x="50" dy="25">是船只航行的关键。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His support is the mainstay of our team.
  </text>
  <text x="50" y="310" class="content">
    他的支持是我们团队的中流砥柱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ship -->
    <rect x="0" y="100" width="300" height="50" class="image" />
    <!-- Mast -->
    <line x1="150" y1="100" x2="150" y2="0" class="image" />
    <!-- Sail -->
    <polygon points="150,0 100,50 200,50" class="image" />
    <!-- Sea -->
    <rect x="0" y="150" width="300" height="50" class="image" />
  </g>
</svg>