<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">testicle</text>
  <text x="50" y="120" class="subtitle">[ˈtɛstɪkəl] n. 睾丸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> testi- (测试) + -cle (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生拿着一个"小测试器(testi-cle)"，
    <tspan x="50" dy="25">这个测试器形状像睾丸，用来检查男性健康。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor examined his testicles for any abnormalities.
  </text>
  <text x="50" y="310" class="content">
    医生检查了他的睾丸是否有异常。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Testicle shape -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <ellipse cx="200" cy="100" rx="50" ry="30" class="image" />
    <!-- Doctor -->
    <circle cx="150" cy="200" r="20" class="image" />
    <line x1="150" y1="220" x2="150" y2="260" class="image" />
    <line x1="150" y1="260" x2="130" y2="300" class="image" />
    <line x1="150" y1="260" x2="170" y2="300" class="image" />
    <line x1="150" y1="240" x2="120" y2="230" class="image" />
    <line x1="150" y1="240" x2="180" y2="230" class="image" />
    <!-- Test instrument -->
    <rect x="130" y="180" width="40" height="20" class="image" />
  </g>
</svg>