<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vicious</text>
  <text x="50" y="120" class="subtitle">[ˈvɪʃəs] adj. 恶毒的，凶残的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vic (生命) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只凶猛的野兽，"生命(vic)"的力量让它变得
    <tspan x="50" dy="25">极其凶残(vicious)，它的眼神中充满了恶毒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vicious dog attacked the mailman.
  </text>
  <text x="50" y="310" class="content">
    那只凶猛的狗袭击了邮递员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beast -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Eye -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="120" class="image" /> <!-- Leg 1 -->
    <line x1="50" y1="150" x2="80" y2="120" class="image" /> <!-- Leg 2 -->
    <line x1="50" y1="180" x2="20" y2="210" class="image" /> <!-- Leg 3 -->
    <line x1="50" y1="180" x2="80" y2="210" class="image" /> <!-- Leg 4 -->
    <line x1="50" y1="130" x2="20" y2="160" class="image" /> <!-- Tail -->
    <line x1="50" y1="130" x2="80" y2="160" class="image" /> <!-- Tail -->
    <circle cx="50" cy="100" r="5" class="image" /> <!-- Pupil -->
  </g>
</svg>