<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">notorious</text>
  <text x="50" y="120" class="subtitle">[noʊˈtɔːriəs] adj. 臭名昭著的，声名狼藉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> not (知道) + -orious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"众所周知(not)"的坏蛋，他的恶行"臭名昭著(notorious)"，
    <tspan x="50" dy="25">每个人都知道他的名字，就像一个黑暗中的影子，无处不在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The notorious criminal was finally captured by the police.
  </text>
  <text x="50" y="310" class="content">
    那个臭名昭著的罪犯最终被警察抓获。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark shadow -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" opacity="0.5" />
    <!-- Criminal figure -->
    <circle cx="175" cy="100" r="30" class="image" fill="#000" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Spotlight -->
    <circle cx="175" cy="50" r="40" class="image" fill="none" stroke="#F1C40F" stroke-width="5" />
    <!-- Speech bubble -->
    <path d="M250,50 Q300,20 350,50 Q300,80 250,50" class="image" fill="#FFF" />
    <text x="260" y="60" class="content" fill="#000">Notorious!</text>
  </g>
</svg>