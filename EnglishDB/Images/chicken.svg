<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F44336; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chicken</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɪkɪn] n. 鸡，鸡肉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "chiken"，可能来自古英语 "cycen"。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸡在农场里，"咯咯(chicken)"
    <tspan x="50" dy="25">叫着，它的叫声和形象让人联想到鸡肉的美味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cooked a delicious chicken dinner for her family.
  </text>
  <text x="50" y="310" class="content">
    她为家人做了一顿美味的鸡肉晚餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chicken -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="200" class="image" /> <!-- Leg 1 -->
    <line x1="50" y1="150" x2="80" y2="200" class="image" /> <!-- Leg 2 -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Wing 1 -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Wing 2 -->
  </g>
</svg>