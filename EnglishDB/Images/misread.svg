<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misread</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsˈriːd] v. 误读，误解</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + read (读)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在看书，"错误地读(mis-read)"
    <tspan x="50" dy="25">了一行字，结果完全理解错了内容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He misread the instructions and ended up doing it wrong.
  </text>
  <text x="50" y="310" class="content">
    他误读了说明，结果做错了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Misread line -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Crossed-out text -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" transform="rotate(45, 175, 50)" />
  </g>
</svg>