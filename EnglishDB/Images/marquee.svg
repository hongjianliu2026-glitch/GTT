<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marquee</text>
  <text x="50" y="120" class="subtitle">[mɑrˈkiː] n. 横幅，字幕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> marque (标记) + -ee (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的横幅(marquee)，上面滚动着"标记(marque)"
    <tspan x="50" dy="25">着各种信息，就像电影院门口的滚动字幕一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The theater had a colorful marquee outside.
  </text>
  <text x="50" y="310" class="content">
    剧院外面有一个色彩缤纷的横幅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Marquee -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Rolling text -->
    <text x="20" y="50" class="content" text-anchor="start" dominant-baseline="middle">
      <tspan dx="-100">Welcome to the Theater!</tspan>
      <tspan dx="100">Now Playing: The Great Movie</tspan>
    </text>
  </g>
</svg>