<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leek</text>
  <text x="50" y="120" class="subtitle">[liːk] n. 韭葱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 leek，与古英语 leac 相关，意为“植物”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的韭葱(leek)，它高耸入云，
    <tspan x="50" dy="25">像一座绿色的塔，人们在它的阴影下乘凉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added leeks to the soup to give it a unique flavor.
  </text>
  <text x="50" y="310" class="content">
    她在汤里加了韭葱，使其味道独特。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Leek -->
    <rect x="0" y="0" width="100" height="300" class="image" />
    <rect x="20" y="0" width="60" height="300" class="image" />
    <rect x="40" y="0" width="20" height="300" class="image" />
    <!-- Leaves -->
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <line x1="30" y1="0" x2="70" y2="50" class="image" />
    <line x1="70" y1="0" x2="30" y2="50" class="image" />
  </g>
</svg>