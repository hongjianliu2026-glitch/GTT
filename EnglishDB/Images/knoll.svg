<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knoll</text>
  <text x="50" y="120" class="subtitle">[nəʊl] n. 小山，小丘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> knoll (源自中古英语 knolle，意为“小山”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小山丘(knoll)上，有一只小兔子在上面跳跃，
    <tspan x="50" dy="25">仿佛在说：“看，我站在一个小山(knoll)上！”</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We found a cozy spot on the knoll to have a picnic.
  </text>
  <text x="50" y="310" class="content">
    我们在小山丘上找到了一个舒适的地方野餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Knoll -->
    <ellipse cx="200" cy="200" rx="150" ry="100" class="image" />
    <!-- Rabbit -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="190" x2="230" y2="180" class="image" />
    <line x1="200" y1="190" x2="170" y2="180" class="image" />
  </g>
</svg>