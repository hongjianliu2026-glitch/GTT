<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">capitol</text>
  <text x="50" y="120" class="subtitle">[ˈkæpɪtl] n. 国会大厦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cap (头) + -itol (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的建筑，它的顶部(cap)像一个巨大的头，
    <tspan x="50" dy="25">而这个头就是国会大厦(capitol)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The capitol building is a symbol of democracy.
  </text>
  <text x="50" y="310" class="content">
    国会大厦是民主的象征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Building -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Roof -->
    <polygon points="150,0 0,100 300,100" class="image" />
    <!-- Windows -->
    <rect x="50" y="50" width="50" height="50" class="image" />
    <rect x="150" y="50" width="50" height="50" class="image" />
    <rect x="250" y="50" width="50" height="50" class="image" />
    <rect x="50" y="120" width="50" height="50" class="image" />
    <rect x="150" y="120" width="50" height="50" class="image" />
    <rect x="250" y="120" width="50" height="50" class="image" />
  </g>
</svg>