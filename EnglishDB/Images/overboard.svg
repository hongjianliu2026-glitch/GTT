<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overboard</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈbɔrd] adv. 从船上落水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (超过) + board (甲板)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在船的甲板上，"超过(over)"
    <tspan x="50" dy="25">甲板边缘，不小心掉进了水里，这就是"从船上落水(overboard)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He went overboard while trying to catch the fish.
  </text>
  <text x="50" y="310" class="content">
    他在试图抓鱼时从船上落水了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boat -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Water -->
    <rect x="0" y="100" width="350" height="100" class="image" />
    <!-- Person falling -->
    <circle cx="175" cy="50" r="15" class="image" />
    <line x1="175" y1="65" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>