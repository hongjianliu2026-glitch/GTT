<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retort</text>
  <text x="50" y="120" class="subtitle">[rɪˈtɔːrt] v. 反驳，回嘴；n. 反驳，回嘴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + tort (扭曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在辩论中，"回击(re-)"
    <tspan x="50" dy="25">对方的话语，扭曲(tort)对方的观点，</tspan>
    <tspan x="50" dy="25">这就是反驳(retort)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She quickly retorted with a witty remark.
  </text>
  <text x="50" y="310" class="content">
    她迅速用一句机智的话反驳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Speech bubble -->
    <path d="M 80 40 Q 150 30 150 80 Q 150 130 80 120 Z" class="image" />
    <!-- Words in speech bubble -->
    <text x="90" y="70" class="content">You said...</text>
    <text x="90" y="100" class="content">I retort!</text>
  </g>
</svg>