<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Albanian</text>
  <text x="50" y="120" class="subtitle">[ælˈbeɪniən] adj. 阿尔巴尼亚的；n. 阿尔巴尼亚人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Alban (阿尔巴尼亚) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着传统服饰的阿尔巴尼亚人，站在阿尔巴尼亚的国旗前，
    <tspan x="50" dy="25">自豪地展示着他的文化。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Albanian language is rich in history.
  </text>
  <text x="50" y="310" class="content">
    阿尔巴尼亚语历史悠久。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional clothing -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Flag -->
    <rect x="170" y="20" width="100" height="160" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
  </g>
</svg>