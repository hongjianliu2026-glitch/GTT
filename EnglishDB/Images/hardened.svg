<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hardened</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrdənd] adj. 变硬的，坚硬的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hard (硬) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块柔软的泥土，经过"硬化(hard-en)"
    <tspan x="50" dy="25">处理后，变成了坚硬的砖块(hardened)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concrete was hardened after a few days.
  </text>
  <text x="50" y="310" class="content">
    几天后，混凝土变硬了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soft clay -->
    <circle cx="50" cy="100" r="30" class="image" />
    <text x="40" y="110" class="content" fill="#A93226">软</text>
    <!-- Hardened brick -->
    <rect x="150" y="70" width="80" height="60" class="image" />
    <text x="160" y="110" class="content" fill="#A93226">硬</text>
    <!-- Arrow -->
    <line x1="90" y1="100" x2="140" y2="100" class="image" />
    <polygon points="140,90 150,100 140,110" class="image" />
  </g>
</svg>