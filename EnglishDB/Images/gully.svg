<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gully</text>
  <text x="50" y="120" class="subtitle">[ˈɡʌli] n. 沟壑，峡谷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gul (咽喉) + -ly (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条深深的沟壑，就像大地张开的"咽喉(gul)"，
    <tspan x="50" dy="25">吞噬着周围的一切，形成了壮观的峡谷(gully)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heavy rain carved a deep gully in the hillside.
  </text>
  <text x="50" y="310" class="content">
    大雨在山坡上冲刷出了一条深深的沟壑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Gully -->
    <path d="M 0 100 Q 50 200 100 100 Q 150 0 200 100" class="image" />
    <path d="M 200 100 Q 250 200 300 100 Q 350 0 400 100" class="image" />
    <!-- Water flow -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="250" y1="100" x2="350" y2="100" class="image" />
    <!-- Rocks -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
  </g>
</svg>