<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nostalgia</text>
  <text x="50" y="120" class="subtitle">[nɒˈstældʒə] n. 怀旧，乡愁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nostos (回家) + algos (痛苦)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在老家的门口，"渴望回家(nostos)"，
    <tspan x="50" dy="25">但心中充满了"痛苦(algos)"，这就是怀旧(nostalgia)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old song evoked a deep sense of nostalgia.
  </text>
  <text x="50" y="310" class="content">
    那首老歌唤起了深深的怀旧之情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <line x1="100" y1="20" x2="100" y2="0" class="image" />
    <line x1="50" y1="0" x2="150" y2="0" class="image" />
    <!-- Person -->
    <circle cx="100" cy="180" r="15" class="image" />
    <line x1="100" y1="195" x2="100" y2="230" class="image" />
    <line x1="100" y1="230" x2="80" y2="260" class="image" />
    <line x1="100" y1="230" x2="120" y2="260" class="image" />
    <line x1="100" y1="210" x2="150" y2="200" class="image" />
    <!-- Heart -->
    <path d="M150,200 C150,210 140,220 130,220 C120,220 110,210 110,200" class="image" />
  </g>
</svg>