<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enticing</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtaɪsɪŋ] adj. 诱人的，吸引人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + tice (引诱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的糖果，"使(en-)"
    <tspan x="50" dy="25">人们无法抗拒地被"引诱(tice)"，这就是诱人的(enticing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enticing aroma of freshly baked cookies filled the kitchen.
  </text>
  <text x="50" y="310" class="content">
    新鲜出炉的饼干诱人的香气充满了厨房。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Candy -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Arrow -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <polygon points="90,240 100,250 110,240" class="image" fill="#7F8C8D" />
    <!-- Person -->
    <circle cx="250" cy="100" r="20" class="image" fill="#2C3E50" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Mouth -->
    <path d="M240,110 Q250,120 260,110" class="image" fill="none" stroke="#E74C3C" stroke-width="3" />
  </g>
</svg>