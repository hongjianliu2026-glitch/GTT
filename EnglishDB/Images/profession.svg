<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">profession</text>
  <text x="50" y="120" class="subtitle">[prəˈfeʃn] n. 职业，专业</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (在前面) + fess (说) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在讲台上，"公开宣称(pro-fess)"
    <tspan x="50" dy="25">自己的职业，这就是他的专业(profession)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She chose teaching as her profession.
  </text>
  <text x="50" y="310" class="content">
    她选择了教书作为她的职业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lectern -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lectern top -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Lectern legs -->
    <line x1="70" y1="180" x2="70" y2="200" class="image" />
    <line x1="280" y1="180" x2="280" y2="200" class="image" />
    <!-- Lecturer -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M175,50 Q200,50 200,70 Q175,70 175,50 Z" class="image" />
    <text x="180" y="65" class="content" text-anchor="middle">职业</text>
  </g>
</svg>