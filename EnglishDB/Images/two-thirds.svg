<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">two-thirds</text>
  <text x="50" y="120" class="subtitle">[tuː ˈθɜːrdz] n. 三分之二</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> two (二) + third (三分之一)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个蛋糕被切成三份，其中两份被拿走，
    <tspan x="50" dy="25">这就是"三分之二(two-thirds)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Two-thirds of the students passed the exam.
  </text>
  <text x="50" y="310" class="content">
    三分之二的学生通过了考试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cake -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Slices -->
    <path d="M150,50 A100,100 0 0,1 250,150 L150,150 Z" class="image" />
    <path d="M150,50 A100,100 0 0,0 50,150 L150,150 Z" class="image" />
    <!-- Taken slices -->
    <path d="M150,50 A100,100 0 0,1 250,150 L150,150 Z" fill="#E74C3C" />
    <path d="M150,50 A100,100 0 0,0 50,150 L150,150 Z" fill="#E74C3C" />
  </g>
</svg>