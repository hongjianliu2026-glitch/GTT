<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">injury</text>
  <text x="50" y="120" class="subtitle">[ˈɪndʒəri] n. 伤害，损伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + jure (法律)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在法庭上，"进入(in-)"
    <tspan x="50" dy="25">法律(jure)的领域，因为受伤(injury)而寻求赔偿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffered a serious injury in the accident.
  </text>
  <text x="50" y="310" class="content">
    他在事故中受了重伤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Person with injury -->
    <circle cx="100" cy="120" r="15" class="image" />
    <line x1="100" y1="135" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="200" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
    <!-- Bandage -->
    <line x1="90" y1="120" x2="110" y2="120" class="image" />
    <line x1="90" y1="125" x2="110" y2="125" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
  </g>
</svg>