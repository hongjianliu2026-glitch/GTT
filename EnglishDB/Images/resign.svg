<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resign</text>
  <text x="50" y="120" class="subtitle">[rɪˈzaɪn] v. 辞职，放弃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + sign (标记)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在办公室里，"向后标记(re-sign)"
    <tspan x="50" dy="25">自己的离职，表示他放弃了这份工作(resign)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He decided to resign from his position.
  </text>
  <text x="50" y="310" class="content">
    他决定辞去他的职位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Office desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Resignation letter -->
    <rect x="100" y="50" width="200" height="100" class="image" />
    <line x1="120" y1="70" x2="280" y2="70" class="image" />
    <line x1="120" y1="90" x2="250" y2="90" class="image" />
    <line x1="120" y1="110" x2="270" y2="110" class="image" />
    <line x1="120" y1="130" x2="240" y2="130" class="image" />
    <!-- Back arrow -->
    <polyline points="300,100 250,100 250,50 200,100 250,150 250,100" class="image" />
  </g>
</svg>