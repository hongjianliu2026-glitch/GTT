<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blink</text>
  <text x="50" y="120" class="subtitle">[blɪŋk] v. 眨眼，闪烁；n. 眨眼，瞬间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blink (源自中古英语，意为“快速闭眼”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在阳光下，眼睛被刺得"快速闭眼(blink)"，
    <tspan x="50" dy="25">就像星星在夜空中闪烁一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She blinked in the bright sunlight.
  </text>
  <text x="50" y="310" class="content">
    她在明亮的阳光下眨了眨眼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" fill="#2C3E50" />
    <!-- Eyes -->
    <line x1="190" y1="90" x2="210" y2="90" class="image" />
    <line x1="190" y1="110" x2="210" y2="110" class="image" />
    <!-- Blinking effect -->
    <line x1="190" y1="90" x2="210" y2="110" class="image" />
    <line x1="190" y1="110" x2="210" y2="90" class="image" />
  </g>
</svg>