<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">constant</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnstənt] adj. 恒定的，持续的；n. 常数</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + sta (站立) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，"始终站立(con-sta)"
    <tspan x="50" dy="25">在同一个位置，永不改变，这就是恒定(constant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The temperature remained constant throughout the night.
  </text>
  <text x="50" y="310" class="content">
    整个晚上温度保持恒定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="250" y2="100" class="image" />
    <!-- Clock numbers -->
    <text x="175" y="30" text-anchor="middle" class="content">12</text>
    <text x="250" y="100" text-anchor="middle" class="content">3</text>
    <text x="175" y="170" text-anchor="middle" class="content">6</text>
    <text x="100" y="100" text-anchor="middle" class="content">9</text>
  </g>
</svg>