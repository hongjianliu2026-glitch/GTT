<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">institutionalize</text>
  <text x="50" y="120" class="subtitle">[ˌɪnstɪˈtjuːʃənəlaɪz] v. 使制度化，使成为惯例</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> institution (机构) + -al (形容词后缀) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机构大楼，里面的人们都在遵循着一套固定的规则和程序，这些规则和程序被"制度化(institutionalize)"，成为了日常生活中的惯例。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to institutionalize the new policy.
  </text>
  <text x="50" y="310" class="content">
    公司决定将新政策制度化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Institutional building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Windows -->
    <rect x="70" y="40" width="30" height="30" class="image" />
    <rect x="120" y="40" width="30" height="30" class="image" />
    <rect x="170" y="40" width="30" height="30" class="image" />
    <rect x="220" y="40" width="30" height="30" class="image" />
    <rect x="70" y="90" width="30" height="30" class="image" />
    <rect x="120" y="90" width="30" height="30" class="image" />
    <rect x="170" y="90" width="30" height="30" class="image" />
    <rect x="220" y="90" width="30" height="30" class="image" />
    <!-- People -->
    <circle cx="90" cy="120" r="10" class="image" />
    <circle cx="140" cy="120" r="10" class="image" />
    <circle cx="190" cy="120" r="10" class="image" />
    <circle cx="240" cy="120" r="10" class="image" />
  </g>
</svg>