<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leopard</text>
  <text x="50" y="120" class="subtitle">[ˈlɛpərd] n. 豹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leo- (狮子) + pard (豹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只"狮子(leo)"和一只"豹(pard)"在森林中相遇，
    <tspan x="50" dy="25">它们身上的斑点让它们看起来像是"豹(leopard)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leopard's spots are unique to each individual.
  </text>
  <text x="50" y="310" class="content">
    每只豹的斑点都是独一无二的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Leopard body -->
    <ellipse cx="150" cy="100" rx="100" ry="60" class="image" />
    <!-- Head -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Ears -->
    <polygon points="80,30 100,10 120,30" class="image" />
    <polygon points="80,30 100,10 120,30" transform="translate(40,0)" class="image" />
    <!-- Eyes -->
    <circle cx="90" cy="50" r="5" class="image" />
    <circle cx="110" cy="50" r="5" class="image" />
    <!-- Spots -->
    <circle cx="130" cy="80" r="10" class="image" />
    <circle cx="170" cy="90" r="10" class="image" />
    <circle cx="140" cy="110" r="10" class="image" />
    <circle cx="160" cy="120" r="10" class="image" />
  </g>
</svg>