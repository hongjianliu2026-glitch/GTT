<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pharmaceutical</text>
  <text x="50" y="120" class="subtitle">[ˌfɑːrməˈsuːtɪkl] adj. 制药的，药物的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pharmaco- (药物) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的药瓶，里面装满了各种药物，这些药物都是由制药公司生产的，这就是"制药的(pharmaceutical)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pharmaceutical industry is a major contributor to the economy.
  </text>
  <text x="50" y="310" class="content">
    制药业是经济的主要贡献者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large pill bottle -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Pills -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <!-- Label -->
    <text x="20" y="250" class="content">Pharmaceuticals</text>
  </g>
</svg>