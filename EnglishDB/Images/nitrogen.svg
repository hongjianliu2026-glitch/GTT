<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nitrogen</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪtrədʒən] n. 氮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nitr- (硝石) + -o- + -gen (产生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"硝石(nitr-)"工厂，不断"产生(gen)"
    <tspan x="50" dy="25">出氮气(nitrogen)，这些氮气像云朵一样飘浮在空中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Nitrogen is essential for plant growth.
  </text>
  <text x="50" y="310" class="content">
    氮对植物生长至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Nitrogen clouds -->
    <ellipse cx="100" cy="100" rx="80" ry="40" class="image" />
    <ellipse cx="200" cy="120" rx="70" ry="35" class="image" />
    <ellipse cx="300" cy="80" rx="60" ry="30" class="image" />
    <!-- Factory chimney -->
    <rect x="150" y="20" width="50" height="100" class="image" />
    <!-- Smoke from chimney -->
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <line x1="175" y1="0" x2="150" y2="-20" class="image" />
    <line x1="175" y1="0" x2="200" y2="-20" class="image" />
  </g>
</svg>