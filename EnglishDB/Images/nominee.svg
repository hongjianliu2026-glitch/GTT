<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nominee</text>
  <text x="50" y="120" class="subtitle">[ˌnɒmɪˈniː] n. 被提名者，候选人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nom (名字) + inee (被...的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被提名者(nominee)站在舞台上，
    <tspan x="50" dy="25">手里拿着一张写有自己名字(nom)的提名证书。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nominee for best actor gave a heartfelt speech.
  </text>
  <text x="50" y="310" class="content">
    最佳男演员提名者发表了感人的演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Nominee -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Certificate -->
    <rect x="125" y="50" width="100" height="70" class="image" />
    <text x="130" y="85" class="content" fill="#34495E">Nominee</text>
  </g>
</svg>