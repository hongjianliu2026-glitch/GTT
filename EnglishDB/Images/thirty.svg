<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thirty</text>
  <text x="50" y="120" class="subtitle">[ˈθɜːrti] n. 三十</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thir- (三) + ty (十)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，上面有"三十(thirty)"个刻度，
    <tspan x="50" dy="25">每个刻度都代表一个数字，从1到30，形成了一个完整的循环。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She turned thirty last month.
  </text>
  <text x="50" y="310" class="content">
    她上个月满三十岁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Hour marks -->
    <line x1="175" y1="20" x2="175" y2="30" class="image" />
    <line x1="240" y1="65" x2="230" y2="75" class="image" />
    <line x1="260" y1="130" x2="250" y2="140" class="image" />
    <line x1="225" y1="195" x2="215" y2="205" class="image" />
    <line x1="175" y1="220" x2="175" y2="210" class="image" />
    <line x1="125" y1="195" x2="135" y2="205" class="image" />
    <line x1="90" y1="130" x2="100" y2="140" class="image" />
    <line x1="110" y1="65" x2="120" y2="75" class="image" />
    <!-- Hour hand -->
    <line x1="175" y1="100" x2="175" y2="40" class="image" />
    <!-- Minute hand -->
    <line x1="175" y1="100" x2="250" y2="100" class="image" />
  </g>
</svg>