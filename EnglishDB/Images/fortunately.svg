<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fortunately</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrtʃənətli] adv. 幸运地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fort (力量) + un (幸运) + ate (形容词后缀) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强大的(fort)幸运女神(un)降临，
    <tspan x="50" dy="25">她带来好运(fortunate)，让一切变得幸运地(fortunately)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Fortunately, the rain stopped before the picnic started.
  </text>
  <text x="50" y="310" class="content">
    幸运的是，野餐开始前雨停了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lucky charm -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="125" x2="75" y2="100" class="image" />
    <line x1="100" y1="125" x2="125" y2="100" class="image" />
    <line x1="100" y1="125" x2="75" y2="150" class="image" />
    <line x1="100" y1="125" x2="125" y2="150" class="image" />
    <!-- Goddess -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="155" x2="220" y2="130" class="image" />
    <line x1="250" y1="155" x2="280" y2="130" class="image" />
    <line x1="250" y1="180" x2="220" y2="210" class="image" />
    <line x1="250" y1="180" x2="280" y2="210" class="image" />
    <!-- Lightning bolt -->
    <polyline points="300,50 350,100 300,150" class="image" />
  </g>
</svg>