<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spotlight</text>
  <text x="50" y="120" class="subtitle">[ˈspɒtlaɪt] n. 聚光灯，公众注意的中心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spot (点) + light (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个舞台上的演员，被"点状的光(spot-light)"
    <tspan x="50" dy="25">聚焦，成为全场焦点，这就是聚光灯(spotlight)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new movie star was in the spotlight at the premiere.
  </text>
  <text x="50" y="310" class="content">
    这位新晋电影明星在首映式上成为了焦点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spotlight -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="100" x2="200" y2="200" class="image" />
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="100" x2="200" y2="0" class="image" />
    <!-- Actor -->
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="250" y1="170" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="230" y2="230" class="image" />
    <line x1="250" y1="200" x2="270" y2="230" class="image" />
    <line x1="250" y1="180" x2="280" y2="170" class="image" />
  </g>
</svg>