<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stereo</text>
  <text x="50" y="120" class="subtitle">[ˈstɛrioʊ] n. 立体声，立体声系统</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stereo- (立体) + -o (表示“声音”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的立体声系统，"立体(stereo)"
    <tspan x="50" dy="25">的声音从两个巨大的喇叭中传出，震撼整个房间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concert was broadcast in stereo.
  </text>
  <text x="50" y="310" class="content">
    这场音乐会是以立体声广播的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stereo system -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Left speaker -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Right speaker -->
    <rect x="200" y="20" width="100" height="160" class="image" />
    <!-- Sound waves -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="80" x2="150" y2="80" class="image" />
    <line x1="100" y1="110" x2="150" y2="110" class="image" />
    <line x1="100" y1="140" x2="150" y2="140" class="image" />
    <line x1="250" y1="50" x2="300" y2="50" class="image" />
    <line x1="250" y1="80" x2="300" y2="80" class="image" />
    <line x1="250" y1="110" x2="300" y2="110" class="image" />
    <line x1="250" y1="140" x2="300" y2="140" class="image" />
  </g>
</svg>