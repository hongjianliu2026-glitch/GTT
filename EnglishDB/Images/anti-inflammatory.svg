<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anti-inflammatory</text>
  <text x="50" y="120" class="subtitle">[ˌænti ɪnˈflæmətɔːri] adj. 抗炎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (反对) + inflammatory (炎症的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个超级英雄，他手持"抗炎药(anti-inflammatory)"，
    <tspan x="50" dy="25">对抗着身体里的"炎症怪兽(inflammatory monster)"，</tspan>
    <tspan x="50" dy="25">保护着身体的健康。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This cream has an anti-inflammatory effect.
  </text>
  <text x="50" y="310" class="content">
    这种药膏具有抗炎作用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Superhero -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Anti-inflammatory pill -->
    <rect x="150" y="100" width="50" height="30" class="image" />
    <text x="160" y="125" class="content">抗炎药</text>
    <!-- Inflammatory monster -->
    <circle cx="300" cy="150" r="50" class="image" />
    <line x1="300" y1="200" x2="300" y2="300" class="image" />
    <line x1="300" y1="220" x2="250" y2="250" class="image" />
    <line x1="300" y1="220" x2="350" y2="250" class="image" />
    <line x1="300" y1="300" x2="250" y2="350" class="image" />
    <line x1="300" y1="300" x2="350" y2="350" class="image" />
    <text x="280" y="180" class="content">炎症怪兽</text>
  </g>
</svg>