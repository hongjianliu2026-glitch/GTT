<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cathedral</text>
  <text x="50" y="120" class="subtitle">[kəˈθiːdrəl] n. 大教堂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cathedra (座位) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座宏伟的教堂，"座位(cathedra)"
    <tspan x="50" dy="25">象征着主教的权威，这座建筑就是大教堂(cathedral)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cathedral was filled with worshippers on Sunday.
  </text>
  <text x="50" y="310" class="content">
    周日大教堂里挤满了信徒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cathedral outline -->
    <rect x="0" y="0" width="350" height="300" class="image" />
    <!-- Tower -->
    <rect x="150" y="0" width="50" height="150" class="image" />
    <!-- Roof -->
    <polygon points="25,150 175,50 325,150" class="image" />
    <!-- Door -->
    <rect x="150" y="250" width="100" height="50" class="image" />
    <!-- Window -->
    <rect x="75" y="100" width="50" height="50" class="image" />
    <rect x="225" y="100" width="50" height="50" class="image" />
  </g>
</svg>