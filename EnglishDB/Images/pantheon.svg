<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pantheon</text>
  <text x="50" y="120" class="subtitle">[pænˈθiːən] n. 万神殿，众神庙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pan- (全部) + theo (神) + -n (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座宏伟的庙宇，里面供奉着"全部的神(pan-theo-n)"，
    <tspan x="50" dy="25">这就是万神殿(pantheon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Pantheon in Rome is a famous ancient temple.
  </text>
  <text x="50" y="310" class="content">
    罗马的万神殿是一座著名的古代庙宇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Temple -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Roof -->
    <polygon points="175,20 50,100 300,100" class="image" />
    <!-- Columns -->
    <rect x="50" y="100" width="50" height="100" class="image" />
    <rect x="125" y="100" width="50" height="100" class="image" />
    <rect x="200" y="100" width="50" height="100" class="image" />
    <rect x="275" y="100" width="50" height="100" class="image" />
    <!-- Door -->
    <rect x="150" y="150" width="100" height="50" class="image" />
    <!-- Gods -->
    <circle cx="75" cy="150" r="10" class="image" />
    <circle cx="225" cy="150" r="10" class="image" />
    <circle cx="150" cy="125" r="10" class="image" />
  </g>
</svg>