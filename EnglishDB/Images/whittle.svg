<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whittle</text>
  <text x="50" y="120" class="subtitle">[ˈwɪtl] v. 削减，雕刻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> whittle (来自古英语hwitel，意为“小刀”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠用小刀(whittle)
    <tspan x="50" dy="25">慢慢地削减木头，雕刻出精美的形状。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He whittled the wood into a small animal figure.
  </text>
  <text x="50" y="310" class="content">
    他把木头削成了一个小动物的形状。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wood block -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Carving knife -->
    <line x1="220" y1="50" x2="300" y2="50" class="image" />
    <line x1="220" y1="50" x2="220" y2="10" class="image" />
    <line x1="220" y1="10" x2="240" y2="10" class="image" />
    <line x1="240" y1="10" x2="240" y2="30" class="image" />
    <!-- Shavings -->
    <line x1="50" y1="110" x2="70" y2="130" class="image" />
    <line x1="60" y1="110" x2="80" y2="130" class="image" />
    <line x1="70" y1="110" x2="90" y2="130" class="image" />
  </g>
</svg>