<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">apocalypse</text>
  <text x="50" y="120" class="subtitle">[əˈpɒkəlɪps] n. 世界末日，大灾难</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> apo- (离开) + calyp- (掩盖) + -sis (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天幕"离开(apo-)"，露出被"掩盖(calyp-)"的真相，
    <tspan x="50" dy="25">世界陷入混乱，这就是"世界末日(apocalypse)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie depicts an apocalypse caused by a meteor strike.
  </text>
  <text x="50" y="310" class="content">
    这部电影描绘了一场由陨石撞击引发的世界末日。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="175" cy="100" r="50" fill="#F1C40F" />
    <!-- Meteor -->
    <line x1="250" y1="0" x2="150" y2="200" class="image" />
    <!-- Crater -->
    <circle cx="150" cy="200" r="30" fill="#7F8C8D" />
    <!-- Smoke -->
    <ellipse cx="150" cy="150" rx="50" ry="20" fill="#BDC3C7" />
  </g>
</svg>