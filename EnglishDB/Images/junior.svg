<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">junior</text>
  <text x="50" y="120" class="subtitle">[ˈdʒuːniər] adj. 年少的，资历较浅的；n. 年少者，晚辈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jun (年轻) + -ior (比较级后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个年轻的"junior"站在一个高大的"senior"旁边，
    <tspan x="50" dy="25">显得更加稚嫩和矮小，这就是"junior"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a junior member of the team.
  </text>
  <text x="50" y="310" class="content">
    他是团队中的年轻成员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Junior -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <!-- Senior -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="190" class="image" />
    <line x1="200" y1="190" x2="170" y2="240" class="image" />
    <line x1="200" y1="190" x2="230" y2="240" class="image" />
    <line x1="200" y1="160" x2="260" y2="150" class="image" />

    <!-- Comparison -->
    <line x1="50" y1="200" x2="200" y2="240" class="image" />
  </g>
</svg>