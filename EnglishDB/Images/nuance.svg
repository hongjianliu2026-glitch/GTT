<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nuance</text>
  <text x="50" y="120" class="subtitle">[ˈnjuːɑːns] n. 细微差别</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nu- (新) + ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家在调色板上，"创造出(nu-)"
    <tspan x="50" dy="25">新的颜色细微差别(nuance)，让画面更加生动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She noticed the nuance in his tone.
  </text>
  <text x="50" y="310" class="content">
    她注意到了他语调中的细微差别。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Palette -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Colors -->
    <circle cx="50" cy="100" r="20" class="image" fill="#FF5733" />
    <circle cx="120" cy="100" r="20" class="image" fill="#33FF57" />
    <circle cx="190" cy="100" r="20" class="image" fill="#3357FF" />
    <circle cx="260" cy="100" r="20" class="image" fill="#FF33A6" />
    <!-- Brush -->
    <line x1="300" y1="80" x2="350" y2="120" class="image" />
    <line x1="300" y1="120" x2="350" y2="80" class="image" />
    <!-- Artist -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>