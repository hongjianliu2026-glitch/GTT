<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seventy-five</text>
  <text x="50" y="120" class="subtitle">[ˈsevənti faɪv] n. 七十五</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seven (七) + ty (十) + five (五)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“75”漂浮在空中，
    <tspan x="50" dy="25">数字“7”像一条长长的蛇，数字“5”像一只灵活的狐狸。</tspan>
    <tspan x="50" dy="25">蛇和狐狸一起跳舞，形成了“75”这个数字。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He scored seventy-five points in the game.
  </text>
  <text x="50" y="310" class="content">
    他在比赛中得了七十五分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Number 7 -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="0" y1="0" x2="0" y2="150" class="image" />
    <line x1="0" y1="150" x2="100" y2="150" class="image" />
    <line x1="100" y1="0" x2="100" y2="150" class="image" />
    <!-- Number 5 -->
    <line x1="150" y1="0" x2="250" y2="0" class="image" />
    <line x1="150" y1="0" x2="150" y2="75" class="image" />
    <line x1="150" y1="75" x2="250" y2="75" class="image" />
    <line x1="250" y1="0" x2="250" y2="75" class="image" />
    <line x1="150" y1="75" x2="250" y2="150" class="image" />
    <line x1="250" y1="75" x2="250" y2="150" class="image" />
  </g>
</svg>