<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sour</text>
  <text x="50" y="120" class="subtitle">[saʊər] adj. 酸的，酸味的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (酸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个柠檬被挤出汁，"酸(sur-)"
    <tspan x="50" dy="25">得让人皱眉，这就是酸味(sour)的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lemon juice tasted sour.
  </text>
  <text x="50" y="310" class="content">
    柠檬汁尝起来很酸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lemon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Squeezed lemon -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="75" y1="200" x2="125" y2="200" class="image" />
    <!-- Drop of lemon juice -->
    <circle cx="100" cy="260" r="10" class="image" fill="#FFFF00" />
    <!-- Face with a sour expression -->
    <circle cx="250" cy="100" r="50" class="image" fill="#F1C40F" />
    <circle cx="230" cy="85" r="10" class="image" fill="#000000" />
    <circle cx="270" cy="85" r="10" class="image" fill="#000000" />
    <line x1="230" y1="120" x2="270" y2="120" class="image" />
    <line x1="240" y1="130" x2="260" y2="130" class="image" />
    <line x1="250" y1="140" x2="250" y2="150" class="image" />
  </g>
</svg>