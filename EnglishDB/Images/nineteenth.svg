<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nineteenth</text>
  <text x="50" y="120" class="subtitle">[ˌnaɪnˈtiːnθ] n. 第十九；adj. 第十九的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nine (九) + teen (十) + th (序数词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“19”，它像一座高耸的山峰，
    <tspan x="50" dy="25">站在“18”和“20”之间，象征着第十九的位置。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This is the nineteenth edition of the book.
  </text>
  <text x="50" y="310" class="content">
    这是这本书的第十九版。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Number 19 -->
    <text x="0" y="0" font-size="200" fill="#34495E">19</text>
    <!-- Mountains -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="50" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
    <line x1="200" y1="150" x2="200" y2="100" class="image" />
    <line x1="250" y1="150" x2="350" y2="150" class="image" />
    <line x1="300" y1="150" x2="300" y2="120" class="image" />
  </g>
</svg>