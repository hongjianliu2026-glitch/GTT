<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">burner</text>
  <text x="50" y="120" class="subtitle">[ˈbɜːrnər] n. 燃烧器，炉子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> burn (燃烧) + -er (表示工具或设备)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨房里，一个"燃烧器(burner)"
    <tspan x="50" dy="25">正在熊熊燃烧，准备烹饪美味的食物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She turned on the burner to heat the pan.
  </text>
  <text x="50" y="310" class="content">
    她打开了燃烧器来加热锅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Burner -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flame -->
    <polygon points="50,100 100,50 150,100" style="fill:orange;stroke:red;stroke-width:2" />
    <polygon points="100,100 150,50 200,100" style="fill:orange;stroke:red;stroke-width:2" />
    <polygon points="150,100 200,50 250,100" style="fill:orange;stroke:red;stroke-width:2" />
    <!-- Pan -->
    <rect x="100" y="120" width="150" height="50" style="fill:silver;stroke:black;stroke-width:2" />
  </g>
</svg>