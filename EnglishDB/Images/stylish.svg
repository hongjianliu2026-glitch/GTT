<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stylish</text>
  <text x="50" y="120" class="subtitle">[ˈstaɪlɪʃ] adj. 时髦的，有风度的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> style (风格) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着时尚的人，"风格(style)"
    <tspan x="50" dy="25">引领潮流，展现出独特的"时髦(stylish)"风度。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always dresses in a stylish manner.
  </text>
  <text x="50" y="310" class="content">
    她总是穿着时髦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fashionable person -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Right leg -->
    <!-- Fashionable clothes -->
    <rect x="20" y="130" width="60" height="70" class="image" /> <!-- Shirt -->
    <rect x="30" y="200" width="40" height="50" class="image" /> <!-- Pants -->
    <!-- Accessories -->
    <circle cx="50" cy="80" r="10" class="image" /> <!-- Sunglasses -->
    <line x1="50" y1="250" x2="50" y2="280" class="image" /> <!-- Shoes -->
  </g>
</svg>