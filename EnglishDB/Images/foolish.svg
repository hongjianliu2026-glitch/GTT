<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foolish</text>
  <text x="50" y="120" class="subtitle">[ˈfuːlɪʃ] adj. 愚蠢的，傻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fool (傻瓜) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个傻瓜(fool)在街上跳舞，
    <tspan x="50" dy="25">他的动作滑稽可笑，让人忍不住笑出声来。</tspan>
    <tspan x="50" dy="25">这就是"foolish"，形容那些行为愚蠢的人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was foolish of him to believe that story.
  </text>
  <text x="50" y="310" class="content">
    他相信那个故事真是愚蠢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fool dancing -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Dancing motion -->
    <line x1="30" y1="180" x2="20" y2="200" class="image" />
    <line x1="70" y1="180" x2="80" y2="200" class="image" />
    <!-- Laughing face -->
    <circle cx="50" cy="100" r="5" class="image" /> <!-- Left eye -->
    <circle cx="70" cy="100" r="5" class="image" /> <!-- Right eye -->
    <path d="M40 110 Q50 120 60 110" class="image" /> <!-- Smile -->
  </g>
</svg>