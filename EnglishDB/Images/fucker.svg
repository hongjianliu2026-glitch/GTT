<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fucker</text>
  <text x="50" y="120" class="subtitle">[ˈfʌkər] n. 混蛋，讨厌的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fuck (性行为) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个满脸坏笑的"混蛋(fucker)"，
    <tspan x="50" dy="25">他总是惹人生气，让人忍不住想揍他一顿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> That guy is such a fucker, always causing trouble.
  </text>
  <text x="50" y="310" class="content">
    那个家伙真是个混蛋，总是惹麻烦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Eyes -->
    <circle cx="35" cy="40" r="5" class="image" />
    <circle cx="65" cy="40" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 30 70 Q 50 80 70 70" class="image" />
    <!-- Badge -->
    <rect x="10" y="80" width="80" height="20" class="image" />
    <text x="15" y="95" class="content" fill="#000">Fucker</text>
  </g>
</svg>