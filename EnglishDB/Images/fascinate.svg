<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fascinate</text>
  <text x="50" y="120" class="subtitle">[ˈfæsɪneɪt] v. 使着迷，使神魂颠倒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fascin (魔法) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔法师用"魔法(fascin)"
    <tspan x="50" dy="25">让观众完全着迷(fascinate)，</tspan>
    <tspan x="50" dy="25">他们目不转睛，完全被吸引住了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's tricks fascinated the audience.
  </text>
  <text x="50" y="310" class="content">
    魔术师的把戏让观众着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Wand -->
    <line x1="50" y1="120" x2="100" y2="50" class="image" />
    <!-- Star -->
    <polygon points="100,50 105,60 115,60 107,67 110,77 100,70 90,77 93,67 85,60 95,60" class="image" />
    <!-- Audience -->
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Eyes -->
    <circle cx="155" cy="95" r="3" class="image" />
    <circle cx="205" cy="95" r="3" class="image" />
    <circle cx="255" cy="95" r="3" class="image" />
  </g>
</svg>