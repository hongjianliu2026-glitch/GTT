<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">keyboard</text>
  <text x="50" y="120" class="subtitle">[ˈkiːbɔːrd] n. 键盘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> key (钥匙) + board (板)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钥匙板，上面排列着各种形状的“钥匙”，
    <tspan x="50" dy="25">每个“钥匙”都能打开电脑中的不同功能，这就是键盘(keyboard)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She typed her essay on the keyboard.
  </text>
  <text x="50" y="310" class="content">
    她在键盘上打出了她的论文。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Keyboard outline -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Keys -->
    <rect x="20" y="20" width="30" height="30" class="image" />
    <rect x="60" y="20" width="30" height="30" class="image" />
    <rect x="100" y="20" width="30" height="30" class="image" />
    <rect x="140" y="20" width="30" height="30" class="image" />
    <rect x="180" y="20" width="30" height="30" class="image" />
    <rect x="220" y="20" width="30" height="30" class="image" />
    <rect x="260" y="20" width="30" height="30" class="image" />
    <rect x="300" y="20" width="30" height="30" class="image" />
    <rect x="20" y="60" width="30" height="30" class="image" />
    <rect x="60" y="60" width="30" height="30" class="image" />
    <rect x="100" y="60" width="30" height="30" class="image" />
    <rect x="140" y="60" width="30" height="30" class="image" />
    <rect x="180" y="60" width="30" height="30" class="image" />
    <rect x="220" y="60" width="30" height="30" class="image" />
    <rect x="260" y="60" width="30" height="30" class="image" />
    <rect x="300" y="60" width="30" height="30" class="image" />
  </g>
</svg>