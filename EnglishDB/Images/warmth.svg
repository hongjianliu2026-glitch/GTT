<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #FFC107; stroke-width: 2; fill: none; }
      .sun { fill: #FFEB3B; }
      .fire { fill: #FF5722; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">warmth</text>
  <text x="50" y="120" class="subtitle">[wɔːrmθ] n. 温暖，热情</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> warm (温暖的) + -th (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温暖的太阳(warm)，它散发出热量(th)，
    <tspan x="50" dy="25">给大地带来温暖(warmth)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The warmth of the sun made the beach enjoyable.
  </text>
  <text x="50" y="310" class="content">
    阳光的温暖使海滩变得宜人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="sun" />
    <!-- Fire -->
    <rect x="200" y="50" width="100" height="100" class="fire" />
    <!-- Warmth rays -->
    <line x1="100" y1="150" x2="100" y2="300" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <line x1="200" y1="150" x2="200" y2="300" class="image" />
    <line x1="150" y1="200" x2="250" y2="200" class="image" />
  </g>
</svg>