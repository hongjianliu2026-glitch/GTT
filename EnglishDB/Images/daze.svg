<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">daze</text>
  <text x="50" y="120" class="subtitle">[deɪz] v. 使茫然，使眼花缭乱；n. 茫然，眼花缭乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> daz (使眼花)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被强烈的阳光照射，"眼花(daz)"
    <tspan x="50" dy="25">得无法看清前方，陷入茫然(daze)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bright lights of the city daze me every time I visit.
  </text>
  <text x="50" y="310" class="content">
    每次我访问这座城市，它的霓虹灯都会让我眼花缭乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" fill="#2C3E50" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Dazed expression -->
    <circle cx="200" cy="90" r="5" class="image" fill="#FFFFFF" />
    <circle cx="210" cy="90" r="5" class="image" fill="#FFFFFF" />
    <line x1="195" y1="105" x2="215" y2="105" class="image" />
  </g>
</svg>