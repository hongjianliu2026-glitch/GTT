<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vagina</text>
  <text x="50" y="120" class="subtitle">[vəˈdʒaɪnə] n. 阴道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vag (走) + -ina (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小通道(vag-ina)，它像一条小路一样，
    <tspan x="50" dy="25">引导着生命的旅程，这就是阴道(vagina)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor explained the anatomy of the vagina.
  </text>
  <text x="50" y="310" class="content">
    医生解释了阴道的解剖结构。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Vagina shape -->
    <path d="M 0 100 Q 50 50 100 100 L 100 200 Q 50 250 0 200 Z" class="image" />
    <!-- Pathway -->
    <line x1="50" y1="100" x2="50" y2="200" class="image" />
    <!-- Small road -->
    <line x1="25" y1="150" x2="75" y2="150" class="image" />
    <line x1="25" y1="170" x2="75" y2="170" class="image" />
    <line x1="25" y1="190" x2="75" y2="190" class="image" />
  </g>
</svg>