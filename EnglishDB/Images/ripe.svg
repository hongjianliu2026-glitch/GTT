<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ripe</text>
  <text x="50" y="120" class="subtitle">[raɪp] adj. 成熟的，熟的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rip (成熟)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个水果在阳光下慢慢变黄，"成熟(rip)"
    <tspan x="50" dy="25">到可以采摘的程度，这就是ripe(成熟的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The peaches are ripe and ready to eat.
  </text>
  <text x="50" y="310" class="content">
    桃子成熟了，可以吃了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="40" fill="#F1C40F" />
    <!-- Fruit -->
    <circle cx="200" cy="100" r="30" fill="#F39C12" />
    <circle cx="220" cy="100" r="30" fill="#F39C12" />
    <circle cx="240" cy="100" r="30" fill="#F39C12" />
    <!-- Stem -->
    <line x1="220" y1="70" x2="220" y2="50" class="image" />
    <!-- Leaves -->
    <path d="M200,70 Q210,40 220,70" class="image" />
    <path d="M240,70 Q230,40 220,70" class="image" />
  </g>
</svg>