<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .poison { fill: #8E44AD; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">poisoned</text>
  <text x="50" y="120" class="subtitle">[ˈpɔɪzənd] adj. 中毒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poison (毒) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人误食了毒蘑菇，"中毒(poisoned)"
    <tspan x="50" dy="25">后脸色发青，痛苦不堪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef accidentally poisoned the soup.
  </text>
  <text x="50" y="310" class="content">
    厨师不小心把汤弄中毒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Poisoned person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Poison symbol -->
    <circle cx="200" cy="100" r="20" class="poison" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="140" x2="180" y2="120" class="image" />
    <line x1="200" y1="140" x2="220" y2="120" class="image" />
    <line x1="200" y1="140" x2="180" y2="160" class="image" />
    <line x1="200" y1="140" x2="220" y2="160" class="image" />
  </g>
</svg>