<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enmity</text>
  <text x="50" y="120" class="subtitle">[ˈɛnmɪti] n. 敌意，仇恨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + mity (恨)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，眼中充满"恨意(mity)"，
    <tspan x="50" dy="25">他们的关系被"使(en-)"成了敌对状态，这就是敌意(enmity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enmity between the two families lasted for generations.
  </text>
  <text x="50" y="310" class="content">
    这两个家族之间的仇恨持续了好几代。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Eyes with angry expressions -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="240" y1="90" x2="260" y2="90" class="image" />
    <!-- Mouth with angry expression -->
    <path d="M35 110 Q50 120 65 110" class="image" />
    <path d="M235 110 Q250 120 265 110" class="image" />
    <!-- Arrows representing enmity -->
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <polygon points="70,100 90,90 90,110" class="image" />
    <polygon points="230,100 210,90 210,110" class="image" />
  </g>
</svg>