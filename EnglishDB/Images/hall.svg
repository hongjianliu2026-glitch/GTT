<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hall</text>
  <text x="50" y="120" class="subtitle">[hɔːl] n. 大厅，礼堂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hal- (完整，全部)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"完整(hal-)"空间，
    <tspan x="50" dy="25">人们聚集在这里，这就是大厅(hall)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The graduation ceremony was held in the school hall.
  </text>
  <text x="50" y="310" class="content">
    毕业典礼在学校礼堂举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hall outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Doors -->
    <rect x="50" y="150" width="50" height="50" class="image" />
    <rect x="250" y="150" width="50" height="50" class="image" />
    <!-- Windows -->
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="180" y="20" width="50" height="50" class="image" />
    <!-- People -->
    <circle cx="80" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
  </g>
</svg>