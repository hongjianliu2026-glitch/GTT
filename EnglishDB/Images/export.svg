<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">export</text>
  <text x="50" y="120" class="subtitle">[ɪkˈspɔːrt] v. 出口；n. 出口商品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + port (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人将货物"携带(port)"到"外面(ex-)"，
    <tspan x="50" dy="25">这些货物就被"出口(export)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company exports its products to over 50 countries.
  </text>
  <text x="50" y="310" class="content">
    这家公司将其产品出口到50多个国家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Container -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Goods -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <rect x="170" y="20" width="100" height="100" class="image" />
    <!-- Arrow -->
    <line x1="290" y1="70" x2="340" y2="70" class="image" />
    <polygon points="340,70 330,65 330,75" class="image" />
    <!-- Ship -->
    <rect x="300" y="120" width="50" height="30" class="image" />
    <line x1="300" y1="150" x2="350" y2="150" class="image" />
    <line x1="300" y1="150" x2="310" y2="160" class="image" />
    <line x1="350" y1="150" x2="340" y2="160" class="image" />
  </g>
</svg>