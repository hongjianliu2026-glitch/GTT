<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">condemned</text>
  <text x="50" y="120" class="subtitle">[kənˈdemd] adj. 被谴责的，被判罪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (加强) + demn (伤害)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被"加强伤害(con-demn)"的人，
    <tspan x="50" dy="25">他站在法庭上，被众人谴责(condemned)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The criminal was condemned to life imprisonment.
  </text>
  <text x="50" y="310" class="content">
    罪犯被判终身监禁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge -->
    <rect x="50" y="20" width="50" height="80" class="image" />
    <line x1="75" y1="20" x2="75" y2="100" class="image" />
    <!-- Criminal -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Gavel -->
    <line x1="75" y1="100" x2="100" y2="80" class="image" />
    <line x1="100" y1="80" x2="120" y2="100" class="image" />
  </g>
</svg>