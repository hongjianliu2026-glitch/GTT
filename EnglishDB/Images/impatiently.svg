<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impatiently</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpeɪʃəntli] adv. 不耐烦地，急躁地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + patient (耐心的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在等待时，"不(im-)"能"耐心(patient)"地站着，
    <tspan x="50" dy="25">而是"急躁地(impatiently)"走来走去，不停地看表。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tapped her foot impatiently while waiting for the bus.
  </text>
  <text x="50" y="310" class="content">
    她在等公交车时，不耐烦地用脚敲打着地面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Watch -->
    <rect x="40" y="80" width="20" height="10" class="image" />
    <line x1="50" y1="80" x2="50" y2="70" class="image" />
    <!-- Foot tapping -->
    <line x1="50" y1="220" x2="50" y2="240" class="image" />
    <line x1="50" y1="240" x2="30" y2="260" class="image" />
    <line x1="50" y1="240" x2="70" y2="260" class="image" />
  </g>
</svg>