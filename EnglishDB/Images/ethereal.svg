<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #6A5ACD; }
      .subtitle { font: italic 24px serif; fill: #483D8B; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #8B008B; }
      .story { font: 16px serif; fill: #4B0082; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ethereal</text>
  <text x="50" y="120" class="subtitle">[ɪˈθɪəriəl] adj. 飘渺的，天上的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ether (以太) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个仙女在云端，"以太(ether)"
    <tspan x="50" dy="25">般轻盈地飘浮，她的存在如此飘渺(ethereal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ethereal beauty of the sunset took everyone's breath away.
  </text>
  <text x="50" y="310" class="content">
    日落的飘渺之美让所有人都屏住了呼吸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Fairy -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="140" x2="150" y2="130" class="image" />
    <line x1="175" y1="140" x2="200" y2="130" class="image" />
    <line x1="175" y1="160" x2="150" y2="180" class="image" />
    <line x1="175" y1="160" x2="200" y2="180" class="image" />
    <!-- Wings -->
    <path d="M150,80 Q120,100 150,120" class="image" />
    <path d="M200,80 Q230,100 200,120" class="image" />
  </g>
</svg>