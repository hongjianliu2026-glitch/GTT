<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">German</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɜːrmən] adj. 德国的；n. 德国人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> germ (种子) + an (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个德国人(German)，他像一颗种子(germ)，
    <tspan x="50" dy="25">在德国的土地上生根发芽，代表着德国的文化和精神。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He speaks fluent German.
  </text>
  <text x="50" y="310" class="content">
    他说一口流利的德语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seed -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Sprout -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <!-- German flag -->
    <rect x="80" y="80" width="100" height="60" class="image" />
    <rect x="80" y="80" width="100" height="20" fill="#000" />
    <rect x="80" y="100" width="100" height="20" fill="#FF0000" />
    <rect x="80" y="120" width="100" height="20" fill="#FFCC00" />
  </g>
</svg>