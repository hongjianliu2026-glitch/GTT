<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">everything</text>
  <text x="50" y="120" class="subtitle">[ˈɛvriθɪŋ] pron. 每件事，一切</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> every (每一个) + thing (事物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拼图，"每一个(every)"
    <tspan x="50" dy="25">小块(thing)都拼在一起，构成了整个世界(everything)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She knows everything about the project.
  </text>
  <text x="50" y="310" class="content">
    她对项目的一切都了如指掌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="110" y="0" width="100" height="100" class="image" />
    <rect x="220" y="0" width="100" height="100" class="image" />
    <rect x="0" y="110" width="100" height="100" class="image" />
    <rect x="110" y="110" width="100" height="100" class="image" />
    <rect x="220" y="110" width="100" height="100" class="image" />
    <!-- World -->
    <circle cx="160" cy="270" r="100" class="image" />
    <circle cx="160" cy="270" r="90" class="image" />
    <circle cx="160" cy="270" r="80" class="image" />
    <circle cx="160" cy="270" r="70" class="image" />
    <circle cx="160" cy="270" r="60" class="image" />
    <circle cx="160" cy="270" r="50" class="image" />
    <circle cx="160" cy="270" r="40" class="image" />
    <circle cx="160" cy="270" r="30" class="image" />
    <circle cx="160" cy="270" r="20" class="image" />
    <circle cx="160" cy="270" r="10" class="image" />
  </g>
</svg>