<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">privileged</text>
  <text x="50" y="120" class="subtitle">[ˈprɪvəlɪdʒd] adj. 有特权的，享有特殊待遇的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> privi- (个人) + leg (法律) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着皇冠的人，"个人(privi-)"
    <tspan x="50" dy="25">拥有特殊的法律(leg)保护，</tspan>
    <tspan x="50" dy="25">这就是有特权(privileged)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> As a member of the royal family, she led a privileged life.
  </text>
  <text x="50" y="310" class="content">
    作为皇室成员，她过着有特权的生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <path d="M10 20 L20 0 L30 20 Z" class="image" />
    <path d="M15 20 L20 10 L25 20 Z" class="image" />
    <path d="M10 20 L20 30 L30 20 Z" class="image" />
    <!-- Person -->
    <circle cx="20" cy="40" r="15" class="image" />
    <line x1="20" y1="55" x2="20" y2="80" class="image" />
    <line x1="20" y1="80" x2="10" y2="110" class="image" />
    <line x1="20" y1="80" x2="30" y2="110" class="image" />
    <line x1="20" y1="65" x2="0" y2="55" class="image" />
    <line x1="20" y1="65" x2="40" y2="55" class="image" />
  </g>
</svg>