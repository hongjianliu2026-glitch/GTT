<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forum</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrəm] n. 论坛，讨论会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (外面) + um (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆形露天剧场，人们围坐在"外面(for-)"
    <tspan x="50" dy="25">的一个地方(um)，热烈讨论各种话题，这就是论坛(forum)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forum attracted many experts in the field.
  </text>
  <text x="50" y="310" class="content">
    这个论坛吸引了许多领域的专家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle representing the forum -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- People sitting around -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <!-- Discussion bubbles -->
    <path d="M100,70 Q120,60 140,70" class="image" />
    <path d="M250,70 Q230,60 210,70" class="image" />
    <path d="M50,120 Q70,110 90,120" class="image" />
    <path d="M300,120 Q280,110 260,120" class="image" />
    <path d="M100,170 Q120,160 140,170" class="image" />
    <path d="M250,170 Q230,160 210,170" class="image" />
  </g>
</svg>