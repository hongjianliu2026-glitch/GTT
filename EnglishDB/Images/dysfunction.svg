<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dysfunction</text>
  <text x="50" y="120" class="subtitle">[dɪsˈfʌŋkʃən] n. 功能障碍，机能失调</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dys- (不良) + function (功能)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机器人的手臂"功能失调(dys-function)"，
    <tspan x="50" dy="25">它无法正常工作，手臂扭曲成奇怪的形状。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The malfunction of the engine caused the plane to crash.
  </text>
  <text x="50" y="310" class="content">
    引擎的功能障碍导致飞机坠毁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Robot head -->
    <circle cx="175" cy="50" r="30" class="image" />
    <!-- Robot arms -->
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="250" y1="100" x2="300" y2="150" class="image" />
    <!-- Dysfunctional arm -->
    <line x1="175" y1="100" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
  </g>
</svg>