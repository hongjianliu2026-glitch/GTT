<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accordingly</text>
  <text x="50" y="120" class="subtitle">[əˈkɔːrdɪŋli] adv. 因此，相应地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (朝向) + cord (心) + -ing (正在) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考，"朝向(ac-)"
    <tspan x="50" dy="25">内心(cord)的方向，正在(ing)做出相应的(ly)决定。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was tired, so he acted accordingly and went to bed early.
  </text>
  <text x="50" y="310" class="content">
    他很累，因此他相应地早早就寝了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person thinking -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <!-- Heart symbol -->
    <path d="M100,100 C100,50 150,50 150,100 C150,150 100,150 100,100 Z" class="image" />
    <!-- Arrow pointing to heart -->
    <line x1="50" y1="100" x2="90" y2="100" class="image" />
    <polygon points="90,90 100,100 90,110" class="image" />
  </g>
</svg>