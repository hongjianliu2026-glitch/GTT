<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deadly</text>
  <text x="50" y="120" class="subtitle">[ˈdɛdli] adj. 致命的，极其危险的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dead (死) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只毒蛇，它的毒液"致命(deadly)"，
    <tspan x="50" dy="25">一旦被咬，后果不堪设想。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snake's bite is deadly.
  </text>
  <text x="50" y="310" class="content">
    这条蛇的咬伤是致命的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snake -->
    <path d="M50 50 C 100 0, 150 0, 200 50 S 300 100, 350 50" class="image" />
    <circle cx="350" cy="50" r="10" class="image" />
    <line x1="350" y1="60" x2="350" y2="80" class="image" />
    <line x1="360" y1="70" x2="340" y2="70" class="image" />
    <!-- Poison symbol -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="90" y1="100" x2="110" y2="100" class="image" />
  </g>
</svg>