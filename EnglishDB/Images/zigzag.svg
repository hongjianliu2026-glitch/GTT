<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">zigzag</text>
  <text x="50" y="120" class="subtitle">[ˈzɪɡzæɡ] n. 之字形；adj. 曲折的；v. 曲折行进</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> zig (之字形) + zag (转向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条蛇在草地上"之字形(zig)"前进，
    <tspan x="50" dy="25">每一步都"转向(zag)"，形成了一个曲折的路径。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The path through the forest was a zigzag.
  </text>
  <text x="50" y="310" class="content">
    穿过森林的小路是曲折的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Zigzag path -->
    <line x1="0" y1="0" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="0" class="image" />
    <line x1="100" y1="0" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="0" class="image" />
    <line x1="200" y1="0" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="300" y2="0" class="image" />
    <!-- Snake -->
    <circle cx="0" cy="0" r="10" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="0" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="0" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="300" cy="0" r="10" class="image" />
  </g>
</svg>