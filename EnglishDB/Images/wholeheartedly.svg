<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wholeheartedly</text>
  <text x="50" y="120" class="subtitle">[ˌhoʊlˈhɑːrtɪdli] adv. 全心全意地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> whole (整个) + heart (心) + -ed (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把整个心(whole heart)都投入到某件事中，
    <tspan x="50" dy="25">就像一颗巨大的心(heart)完全被填满，这就是全心全意(wholeheartedly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She accepted the job wholeheartedly.
  </text>
  <text x="50" y="310" class="content">
    她全心全意地接受了这份工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10,30 Q20,10 40,30 Q60,10 80,30" class="image" />
    <path d="M10,30 Q40,50 80,30" class="image" />
    <!-- Filling the heart -->
    <rect x="10" y="30" width="70" height="20" class="image" />
    <rect x="15" y="50" width="60" height="20" class="image" />
    <rect x="20" y="70" width="50" height="20" class="image" />
    <rect x="25" y="90" width="40" height="20" class="image" />
    <rect x="30" y="110" width="30" height="20" class="image" />
    <rect x="35" y="130" width="20" height="20" class="image" />
    <rect x="40" y="150" width="10" height="20" class="image" />
  </g>
</svg>