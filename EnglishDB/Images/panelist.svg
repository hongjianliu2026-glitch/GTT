<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">panelist</text>
  <text x="50" y="120" class="subtitle">[ˈpænəlɪst] n. 小组成员，讨论小组成员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> panel (面板) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个讨论会，"面板(panel)"上坐着一群人，
    <tspan x="50" dy="25">他们就是讨论小组的成员(panelist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The panelist shared their insights on the topic.
  </text>
  <text x="50" y="310" class="content">
    小组成员分享了他们对话题的见解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Panel -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="35" y2="130" class="image" />
    <line x1="50" y1="100" x2="65" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />

    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="135" y2="130" class="image" />
    <line x1="150" y1="100" x2="165" y2="130" class="image" />
    <line x1="150" y1="80" x2="180" y2="70" class="image" />

    <circle cx="250" cy="50" r="15" class="image" />
    <line x1="250" y1="65" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="235" y2="130" class="image" />
    <line x1="250" y1="100" x2="265" y2="130" class="image" />
    <line x1="250" y1="80" x2="280" y2="70" class="image" />
  </g>
</svg>