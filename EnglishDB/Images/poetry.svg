<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">poetry</text>
  <text x="50" y="120" class="subtitle">[ˈpoʊətri] n. 诗歌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poet (诗人) + -ry (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个诗人站在山巅，"吟诵(poet)"
    <tspan x="50" dy="25">出美丽的诗句，这些诗句就构成了诗歌(poetry)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She writes poetry in her free time.
  </text>
  <text x="50" y="310" class="content">
    她在闲暇时间写诗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 0 L200 200 Z" class="image" />
    <!-- Poet -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Poem lines -->
    <line x1="50" y1="220" x2="150" y2="220" class="image" />
    <line x1="50" y1="240" x2="150" y2="240" class="image" />
    <line x1="50" y1="260" x2="150" y2="260" class="image" />
  </g>
</svg>