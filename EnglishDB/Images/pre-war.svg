<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pre-war</text>
  <text x="50" y="120" class="subtitle">[priːˈwɔːr] adj. 战前的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在...之前) + war (战争)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宁静的小镇，"在战争之前(pre-war)"，
    <tspan x="50" dy="25">人们过着平静的生活，街道上没有硝烟，只有和平的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pre-war era was a time of prosperity and peace.
  </text>
  <text x="50" y="310" class="content">
    战前时代是一个繁荣与和平的时期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Peaceful town -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- Sun -->
    <circle cx="280" cy="50" r="30" class="image" />
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Trees -->
    <line x1="30" y1="80" x2="30" y2="120" class="image" />
    <line x1="30" y1="80" x2="10" y2="100" class="image" />
    <line x1="30" y1="80" x2="50" y2="100" class="image" />
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="100" y1="80" x2="80" y2="100" class="image" />
    <line x1="100" y1="80" x2="120" y2="100" class="image" />
  </g>
</svg>