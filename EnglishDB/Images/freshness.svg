<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fruit { fill: #FFD700; }
      .water { fill: #1E90FF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">freshness</text>
  <text x="50" y="120" class="subtitle">[ˈfrɛʃnəs] n. 新鲜，清新</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fresh (新鲜的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个清晨，你走进果园，"新鲜的(fresh)"
    <tspan x="50" dy="25">苹果和露水在阳光下闪闪发光，这就是新鲜感(freshness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The freshness of the morning air was invigorating.
  </text>
  <text x="50" y="310" class="content">
    清晨的新鲜空气令人精神振奋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apple -->
    <circle cx="50" cy="100" r="30" class="fruit" />
    <!-- Dew drops -->
    <circle cx="40" cy="90" r="5" class="water" />
    <circle cx="60" cy="85" r="5" class="water" />
    <circle cx="55" cy="110" r="5" class="water" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="20" class="water" />
    <!-- Rays of sun -->
    <line x1="150" y1="30" x2="150" y2="10" class="image" />
    <line x1="165" y1="40" x2="180" y2="25" class="image" />
    <line x1="165" y1="60" x2="180" y2="75" class="image" />
    <line x1="135" y1="40" x2="120" y2="25" class="image" />
    <line x1="135" y1="60" x2="120" y2="75" class="image" />
  </g>
</svg>