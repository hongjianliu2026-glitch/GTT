<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">praise</text>
  <text x="50" y="120" class="subtitle">[preɪz] v. 赞扬，表扬；n. 赞扬，赞美</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prais (价值)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人高高举起双手，"赞扬(praise)"
    <tspan x="50" dy="25">某人的价值(prais)，就像在颁奖典礼上一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher praised her for her hard work.
  </text>
  <text x="50" y="310" class="content">
    老师表扬了她的努力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person raising hands -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Stars of praise -->
    <polygon points="120,30 130,50 150,55 130,60 140,80" class="image" />
    <polygon points="160,30 170,50 190,55 170,60 180,80" class="image" />
    <polygon points="200,30 210,50 230,55 210,60 220,80" class="image" />
  </g>
</svg>