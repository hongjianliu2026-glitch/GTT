<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unacceptable</text>
  <text x="50" y="120" class="subtitle">[ˌʌnəkˈseptəbl] adj. 不可接受的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + accept (接受) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色"X"符号，表示"不接受(un-accept)"
    <tspan x="50" dy="25">某事物，这个符号就象征着不可接受(unacceptable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His behavior was completely unacceptable.
  </text>
  <text x="50" y="310" class="content">
    他的行为是完全不可接受的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red "X" symbol -->
    <line x1="50" y1="50" x2="300" y2="300" class="image" stroke="#E74C3C" stroke-width="10" />
    <line x1="50" y1="300" x2="300" y2="50" class="image" stroke="#E74C3C" stroke-width="10" />
    <!-- Speech bubble -->
    <path d="M 50 350 Q 100 300 150 350 Q 200 400 250 350 Q 300 300 350 350" class="image" stroke="#7F8C8D" fill="#ECF0F1" />
    <text x="150" y="360" class="content" text-anchor="middle">Unacceptable!</text>
  </g>
</svg>