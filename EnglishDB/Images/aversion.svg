<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aversion</text>
  <text x="50" y="120" class="subtitle">[əˈvɜːrʒən] n. 厌恶，反感</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (离开) + vers (转) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到恶心的东西，"转身离开(a-vers)"，
    <tspan x="50" dy="25">表现出强烈的厌恶(aversion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has an aversion to spiders.
  </text>
  <text x="50" y="310" class="content">
    她对蜘蛛有强烈的厌恶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person turning away -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <line x1="50" y1="140" x2="10" y2="130" class="image" />
    <!-- Spider -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="240" y2="120" class="image" />
    <line x1="200" y1="130" x2="160" y2="120" class="image" />
    <!-- Arrow pointing away -->
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <polygon points="180,100 170,95 170,105" class="image" />
  </g>
</svg>