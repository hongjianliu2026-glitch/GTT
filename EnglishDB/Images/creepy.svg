<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">creepy</text>
  <text x="50" y="120" class="subtitle">[ˈkriːpi] adj. 令人毛骨悚然的，阴森恐怖的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> creep (爬行) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阴森的夜晚，一只巨大的蜘蛛"爬行(creep)"
    <tspan x="50" dy="25">在墙上，它的每一步都让人感到毛骨悚然(creepy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house had a creepy atmosphere.
  </text>
  <text x="50" y="310" class="content">
    那栋老房子有一种令人毛骨悚然的氛围。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spider -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="60" y2="130" class="image" />
    <line x1="100" y1="150" x2="140" y2="130" class="image" />
    <line x1="100" y1="150" x2="60" y2="170" class="image" />
    <line x1="100" y1="150" x2="140" y2="170" class="image" />
    <!-- Wall -->
    <rect x="0" y="200" width="200" height="100" class="image" />
    <!-- Creepy effect -->
    <line x1="50" y1="250" x2="150" y2="250" class="image" />
    <line x1="50" y1="270" x2="150" y2="270" class="image" />
    <line x1="50" y1="290" x2="150" y2="290" class="image" />
  </g>
</svg>