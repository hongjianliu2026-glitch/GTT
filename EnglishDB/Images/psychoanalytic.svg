<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">psychoanalytic</text>
  <text x="50" y="120" class="subtitle">[ˌsaɪkoʊˌænəˈlɪtɪk] adj. 精神分析的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> psycho- (心灵) + analytic (分析的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心理学家在用"心灵(psycho-)"的放大镜，
    <tspan x="50" dy="25">"分析(analytic)"病人的内心世界，这就是精神分析(psychoanalytic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The therapist used psychoanalytic techniques to help the patient.
  </text>
  <text x="50" y="310" class="content">
    治疗师使用精神分析技术来帮助病人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head with brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <rect x="75" y="50" width="50" height="50" class="image" />
    <!-- Magnifying glass -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="230" y1="100" x2="300" y2="100" class="image" />
    <!-- Brain waves -->
    <path d="M75 150 Q100 120 125 150 T175 150" class="image" />
    <path d="M75 160 Q100 130 125 160 T175 160" class="image" />
    <path d="M75 170 Q100 140 125 170 T175 170" class="image" />
  </g>
</svg>