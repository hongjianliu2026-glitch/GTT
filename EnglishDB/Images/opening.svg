<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">opening</text>
  <text x="50" y="120" class="subtitle">[ˈoʊpənɪŋ] n. 开始，开幕；v. 打开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> open (打开) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门缓缓"打开(open)"，
    <tspan x="50" dy="25">露出一个充满惊喜的"开始(opening)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The opening of the new store was a grand event.
  </text>
  <text x="50" y="310" class="content">
    新店的开业是一个盛大的活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Door handle -->
    <circle cx="180" cy="150" r="10" class="image" />
    <!-- Opening -->
    <line x1="100" y1="0" x2="100" y2="300" class="image" />
    <!-- Surprise -->
    <circle cx="300" cy="150" r="50" class="image" />
    <text x="280" y="160" class="content" fill="#E74C3C">Surprise!</text>
  </g>
</svg>