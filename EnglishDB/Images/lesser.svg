<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lesser</text>
  <text x="50" y="120" class="subtitle">[ˈlɛsər] adj. 较小的，次要的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> less (少) + -er (比较级后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕，上面有一个小蛋糕，"较小的(lesser)"
    <tspan x="50" dy="25">蛋糕被放在旁边，表示它是次要的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lesser-known artist gained recognition over time.
  </text>
  <text x="50" y="310" class="content">
    这位不太知名的艺术家逐渐获得了认可。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large cake -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Smaller cake -->
    <rect x="220" y="20" width="100" height="60" class="image" />
    <!-- Text annotations -->
    <text x="100" y="120" class="content">Large Cake</text>
    <text x="270" y="100" class="content">Lesser Cake</text>
  </g>
</svg>