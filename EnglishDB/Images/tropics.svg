<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tropics</text>
  <text x="50" y="120" class="subtitle">[ˈtrɒpɪks] n. 热带地区</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trop (转) + -ics (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热带地区，太阳不停地"转动(trop)"，
    <tspan x="50" dy="25">带来无尽的热量和生机，这就是热带(tropics)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tropics are known for their lush vegetation.
  </text>
  <text x="50" y="310" class="content">
    热带地区以其茂盛的植被而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F39C12" />
    <!-- Sun rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Palm tree -->
    <rect x="200" y="50" width="20" height="150" fill="#27AE60" />
    <polyline points="190,50 210,50 200,0 190,50" fill="#27AE60" />
    <polyline points="180,20 220,20 200,0 180,20" fill="#27AE60" />
    <polyline points="170,40 230,40 200,0 170,40" fill="#27AE60" />
  </g>
</svg>