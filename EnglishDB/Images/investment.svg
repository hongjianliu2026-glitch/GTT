<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">investment</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvestmənt] n. 投资</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vest (衣服) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你把金钱“穿进(in-vest)”一件“衣服(vest)”里，这件衣服就是你的投资(investment)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made a wise investment in the stock market.
  </text>
  <text x="50" y="310" class="content">
    他在股市中做出了明智的投资。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Money -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <text x="10" y="30" class="content">$</text>
    <!-- Vest -->
    <rect x="120" y="0" width="150" height="200" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="25" x2="120" y2="100" class="image" />
    <polygon points="120,100 110,90 110,110" class="image" />
  </g>
</svg>