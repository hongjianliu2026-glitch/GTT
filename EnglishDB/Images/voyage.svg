<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">voyage</text>
  <text x="50" y="120" class="subtitle">[ˈvɔɪɪdʒ] n. 航行，旅行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> voy (路) + age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在大海上"航行(voy)"，
    <tspan x="50" dy="25">穿越无尽的"路(voy)"，这就是一次"航行(voyage)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They embarked on a long voyage across the Pacific.
  </text>
  <text x="50" y="310" class="content">
    他们开始了横渡太平洋的长途航行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 175,150 75,150" class="image" />
    <line x1="100" y1="150" x2="100" y2="100" class="image" />
    <line x1="150" y1="150" x2="150" y2="100" class="image" />
    <line x1="125" y1="100" x2="125" y2="80" class="image" />
    <circle cx="125" cy="70" r="10" class="image" />
    <!-- Waves -->
    <path d="M0,200 Q50,150 100,200 T200,200" class="image" />
    <path d="M100,200 Q150,150 200,200 T300,200" class="image" />
  </g>
</svg>