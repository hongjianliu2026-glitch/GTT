<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">star</text>
  <text x="50" y="120" class="subtitle">[stɑːr] n. 星星，明星；v. 主演</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sta- (站立) + -r (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的星星"站立(sta-)"在夜空中，
    <tspan x="50" dy="25">它的光芒照亮了整个世界，就像一个明星(star)一样闪耀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She dreamed of becoming a movie star.
  </text>
  <text x="50" y="310" class="content">
    她梦想成为一名电影明星。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <polygon points="100,10 120,60 170,60 130,90 150,140 100,110 50,140 70,90 30,60 80,60" class="image" fill="#FFD700" />
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#1E3F66" />
    <!-- Moon -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F1C40F" />
  </g>
</svg>