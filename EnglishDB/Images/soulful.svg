<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soulful</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊlfl] adj. 充满灵魂的，深情的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soul (灵魂) + -ful (充满...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个歌手在舞台上，"充满灵魂(soul-ful)"
    <tspan x="50" dy="25">地演唱，她的歌声深深触动了每一个听众的心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her soulful performance brought tears to everyone's eyes.
  </text>
  <text x="50" y="310" class="content">
    她充满灵魂的表演让每个人都流下了眼泪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Singer -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="140" class="image" />
    <line x1="175" y1="150" x2="205" y2="140" class="image" />
    <line x1="175" y1="180" x2="145" y2="200" class="image" />
    <line x1="175" y1="180" x2="205" y2="200" class="image" />
    <!-- Heart -->
    <path d="M250,100 C250,50 300,50 300,100 S350,150 350,100" class="image" />
    <path d="M250,100 C250,150 200,150 200,100 S150,50 150,100" class="image" />
  </g>
</svg>