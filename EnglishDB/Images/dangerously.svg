<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dangerously</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪndʒərəsli] adv. 危险地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> danger (危险) + -ous (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在悬崖边上行走，"危险地(dangerously)"
    <tspan x="50" dy="25">每一步都可能掉下去，这种情景让人心跳加速。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He drove dangerously fast on the highway.
  </text>
  <text x="50" y="310" class="content">
    他在高速公路上危险地超速驾驶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on cliff -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="35" y2="220" class="image" />
    <line x1="50" y1="190" x2="65" y2="220" class="image" />
    <line x1="50" y1="175" x2="80" y2="165" class="image" />
    <!-- Danger sign -->
    <polygon points="200,10 250,10 225,50" class="image" />
    <text x="210" y="35" class="content" fill="#B03A2E">!</text>
  </g>
</svg>