<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hemisphere</text>
  <text x="50" y="120" class="subtitle">[ˈhemɪsfɪər] n. 半球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hemi- (半) + sphere (球)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球，被一把巨大的刀从中间切开，
    <tspan x="50" dy="25">一半飞向天空，变成了一个"半球(hemisphere)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Northern Hemisphere experiences summer when the Southern Hemisphere experiences winter.
  </text>
  <text x="50" y="310" class="content">
    当北半球经历夏天时，南半球则经历冬天。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="100" class="image" />
    <!-- Cut line -->
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <!-- Hemisphere -->
    <path d="M 175 100 A 100 100 0 0 0 75 100" class="image" />
    <path d="M 175 100 A 100 100 0 0 1 275 100" class="image" />
  </g>
</svg>