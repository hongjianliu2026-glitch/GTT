<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rotting</text>
  <text x="50" y="120" class="subtitle">[ˈrɒtɪŋ] v. 腐烂，腐朽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rot (腐烂) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苹果在桌子上，"腐烂(rot)"
    <tspan x="50" dy="25">的过程正在进行(ing)，苹果表面开始出现斑点，</tspan>
    <tspan x="50" dy="25">最终整个苹果都腐烂了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fruit basket had a few rotting apples.
  </text>
  <text x="50" y="310" class="content">
    水果篮里有几个腐烂的苹果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Apple -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF6347" />
    <!-- Rot spots -->
    <circle cx="70" cy="80" r="10" class="image" fill="#8B4513" />
    <circle cx="120" cy="120" r="10" class="image" fill="#8B4513" />
    <circle cx="90" cy="140" r="10" class="image" fill="#8B4513" />
  </g>
</svg>