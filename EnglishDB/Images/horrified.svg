<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">horrified</text>
  <text x="50" y="120" class="subtitle">[ˈhɔrəˌfaɪd] adj. 惊骇的，恐惧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> horr- (恐怖) + -ified (使...化)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到恐怖电影，"恐怖(horr-)"
    <tspan x="50" dy="25">的画面让他"惊骇(ified)"，表情扭曲。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was horrified by the gruesome scene in the movie.
  </text>
  <text x="50" y="310" class="content">
    她被电影中恐怖的场景吓坏了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horror movie screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Scream face -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="175" y1="120" x2="175" y2="150" class="image" />
    <line x1="160" y1="135" x2="190" y2="135" class="image" />
    <line x1="150" y1="150" x2="160" y2="160" class="image" />
    <line x1="190" y1="150" x2="200" y2="160" class="image" />
    <!-- Eyes -->
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="200" cy="80" r="10" class="image" />
  </g>
</svg>