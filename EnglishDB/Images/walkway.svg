<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">walkway</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːkweɪ] n. 人行道，走道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> walk (走) + way (道路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条宽敞的"走道(walkway)"，人们悠闲地走在上面，
    <tspan x="50" dy="25">享受着散步的乐趣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The park has a beautiful walkway along the river.
  </text>
  <text x="50" y="310" class="content">
    公园里有一条沿着河边的美丽人行道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Walkway -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- People walking -->
    <circle cx="50" cy="25" r="10" class="image" />
    <line x1="50" y1="35" x2="50" y2="60" class="image" />
    <line x1="50" y1="60" x2="40" y2="80" class="image" />
    <line x1="50" y1="60" x2="60" y2="80" class="image" />
    <line x1="50" y1="45" x2="70" y2="40" class="image" />

    <circle cx="150" cy="25" r="10" class="image" />
    <line x1="150" y1="35" x2="150" y2="60" class="image" />
    <line x1="150" y1="60" x2="140" y2="80" class="image" />
    <line x1="150" y1="60" x2="160" y2="80" class="image" />
    <line x1="150" y1="45" x2="170" y2="40" class="image" />

    <circle cx="250" cy="25" r="10" class="image" />
    <line x1="250" y1="35" x2="250" y2="60" class="image" />
    <line x1="250" y1="60" x2="240" y2="80" class="image" />
    <line x1="250" y1="60" x2="260" y2="80" class="image" />
    <line x1="250" y1="45" x2="270" y2="40" class="image" />
  </g>
</svg>