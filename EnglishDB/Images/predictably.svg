<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">predictably</text>
  <text x="50" y="120" class="subtitle">[prɪˈdɪktəbli] adv. 可预言地，可预测地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + dict (说) + -ably (可...地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天气预报员站在屏幕前，"提前说出(pre-dict)"
    <tspan x="50" dy="25">明天的天气，这种行为是可预测的(predictably)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The weather forecast predicted rain, and predictably, it rained.
  </text>
  <text x="50" y="310" class="content">
    天气预报预测会下雨，果然，天就下雨了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Weather forecast screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <text x="50" y="50" class="content">Weather Forecast</text>
    <text x="50" y="80" class="content">Tomorrow: Rain</text>
    <!-- Weather forecaster -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Rain drops -->
    <line x1="100" y1="30" x2="100" y2="50" class="image" />
    <line x1="120" y1="30" x2="120" y2="50" class="image" />
    <line x1="140" y1="30" x2="140" y2="50" class="image" />
  </g>
</svg>