<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">role</text>
  <text x="50" y="120" class="subtitle">[roʊl] n. 角色，任务</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rota (轮子) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演员在一个巨大的轮子(rota)上，轮子转动时，
    <tspan x="50" dy="25">每个演员都扮演着不同的角色(role)，轮子转一圈，</tspan>
    <tspan x="50" dy="25">角色就换一次，就像生活中的不同任务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She played the leading role in the play.
  </text>
  <text x="50" y="310" class="content">
    她在剧中扮演主角。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wheel -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Actor -->
    <circle cx="175" cy="20" r="15" class="image" />
    <line x1="175" y1="35" x2="175" y2="80" class="image" />
    <line x1="175" y1="80" x2="155" y2="100" class="image" />
    <line x1="175" y1="80" x2="195" y2="100" class="image" />
    <line x1="175" y1="60" x2="200" y2="50" class="image" />
    <!-- Role tag -->
    <rect x="150" y="120" width="50" height="20" class="image" />
    <text x="155" y="135" class="content">Role</text>
  </g>
</svg>