<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tango</text>
  <text x="50" y="120" class="subtitle">[ˈtæŋɡoʊ] n. 探戈舞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自阿根廷的一种舞蹈，原意为“触摸”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一对舞者在舞池中，"触摸(tango)"着彼此，
    <tspan x="50" dy="25">随着音乐的节奏，跳起了热情的探戈舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They performed a passionate tango at the dance competition.
  </text>
  <text x="50" y="310" class="content">
    他们在舞蹈比赛中表演了一段热情的探戈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dance floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dancers -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Arms -->
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <!-- Legs -->
    <line x1="100" y1="140" x2="90" y2="180" class="image" />
    <line x1="150" y1="140" x2="160" y2="180" class="image" />
    <!-- Music notes -->
    <path d="M200,50 Q220,30 240,50 T280,50" class="image" />
    <path d="M210,70 Q230,50 250,70 T290,70" class="image" />
  </g>
</svg>