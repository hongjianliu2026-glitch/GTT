<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cataclysmic</text>
  <text x="50" y="120" class="subtitle">[ˌkætəˈklɪzmɪk] adj. 灾难性的，剧变的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cata- (向下) + clysm (冲刷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场巨大的洪水从天而降，"向下冲刷(cata-clysm)"
    <tspan x="50" dy="25">整个城市，这种灾难性的场景就是cataclysmic。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The earthquake had a cataclysmic effect on the region.
  </text>
  <text x="50" y="310" class="content">
    地震对该地区产生了灾难性的影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flood -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- City -->
    <rect x="100" y="150" width="50" height="30" class="image" />
    <rect x="170" y="150" width="50" height="30" class="image" />
    <rect x="240" y="150" width="50" height="30" class="image" />
    <!-- Water drops -->
    <circle cx="70" cy="40" r="10" class="image" />
    <circle cx="140" cy="60" r="10" class="image" />
    <circle cx="210" cy="80" r="10" class="image" />
    <circle cx="280" cy="100" r="10" class="image" />
  </g>
</svg>