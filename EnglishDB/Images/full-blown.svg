<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">full-blown</text>
  <text x="50" y="120" class="subtitle">[ˌfʊlˈbloʊn] adj. 完全发展的，成熟的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> full (完全) + blown (吹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵花在风中完全绽放，"完全吹开(full-blown)"
    <tspan x="50" dy="25">，展现出它最美丽的姿态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project reached its full-blown stage after months of development.
  </text>
  <text x="50" y="310" class="content">
    经过几个月的开发，项目达到了完全成熟的阶段。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF6F61" />
    <circle cx="70" cy="70" r="10" class="image" fill="#FFD166" />
    <circle cx="130" cy="70" r="10" class="image" fill="#FFD166" />
    <circle cx="70" cy="130" r="10" class="image" fill="#FFD166" />
    <circle cx="130" cy="130" r="10" class="image" fill="#FFD166" />
    <circle cx="100" cy="100" r="10" class="image" fill="#FFD166" />
    <!-- Wind -->
    <line x1="20" y1="100" x2="50" y2="90" class="image" />
    <line x1="20" y1="110" x2="50" y2="120" class="image" />
    <line x1="20" y1="120" x2="50" y2="130" class="image" />
  </g>
</svg>