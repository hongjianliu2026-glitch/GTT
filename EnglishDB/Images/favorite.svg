<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">favorite</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪvərɪt] adj. 特别喜爱的；n. 特别喜爱的人或物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> favor (喜爱) + -ite (表示“具有...性质的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子抱着他最喜爱的玩具，脸上洋溢着幸福的笑容。
    <tspan x="50" dy="25">这个玩具就是他的"特别喜爱(favorite)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Ice cream is my favorite dessert.
  </text>
  <text x="50" y="310" class="content">
    冰淇淋是我最喜爱的甜点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Toy -->
    <rect x="80" y="80" width="40" height="40" class="image" />
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <!-- Smile -->
    <path d="M40 90 Q50 80 60 90" class="image" />
  </g>
</svg>