<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anything</text>
  <text x="50" y="120" class="subtitle">[ˈɛnɪθɪŋ] pron. 任何事物，任何东西</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> any (任何) + thing (事物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师从帽子里变出"任何事物(anything)"，
    <tspan x="50" dy="25">无论是兔子、花朵还是星星，都能瞬间出现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You can ask me for anything, and I'll try to help.
  </text>
  <text x="50" y="310" class="content">
    你可以向我要求任何东西，我会尽力帮忙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician's hat -->
    <path d="M 0 0 L 50 0 Q 100 50 50 100 L 0 100 Z" class="image" />
    <!-- Rabbit -->
    <circle cx="50" cy="70" r="15" class="image" />
    <line x1="50" y1="85" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="35" y2="150" class="image" />
    <line x1="50" y1="120" x2="65" y2="150" class="image" />
    <line x1="50" y1="100" x2="30" y2="90" class="image" />
    <line x1="50" y1="100" x2="70" y2="90" class="image" />
    <!-- Star -->
    <polygon points="100,50 105,65 120,65 108,75 112,90 100,80 88,90 92,75 80,65 95,65" class="image" />
    <!-- Flower -->
    <circle cx="150" cy="70" r="10" class="image" />
    <circle cx="140" cy="60" r="10" class="image" />
    <circle cx="160" cy="60" r="10" class="image" />
    <circle cx="135" cy="80" r="10" class="image" />
    <circle cx="165" cy="80" r="10" class="image" />
    <line x1="150" y1="90" x2="150" y2="120" class="image" />
  </g>
</svg>