<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">policeman</text>
  <text x="50" y="120" class="subtitle">[pəˈliːsmən] n. 警察</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poli- (城市) + -man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个警察站在城市(poli-)的中心，守护着城市的安全，
    <tspan x="50" dy="25">他就是那个"城市的人(man)"，即警察(policeman)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The policeman helped the lost child find his parents.
  </text>
  <text x="50" y="310" class="content">
    警察帮助迷路的孩子找到了他的父母。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="10" width="50" height="120" class="image" />
    <rect x="190" y="30" width="50" height="90" class="image" />
    <rect x="260" y="50" width="50" height="70" class="image" />
    <!-- Policeman -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
    <!-- Police hat -->
    <rect x="10" y="130" width="20" height="10" class="image" />
  </g>
</svg>