<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bridesmaid</text>
  <text x="50" y="120" class="subtitle">[ˈbraɪdzmeɪd] n. 伴娘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bride (新娘) + maid (女仆)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个婚礼上，"新娘(bride)"身边站着一位"女仆(maid)"，
    <tspan x="50" dy="25">这位女仆就是伴娘(bridesmaid)，她帮助新娘处理婚礼事宜。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was the bridesmaid at her best friend's wedding.
  </text>
  <text x="50" y="310" class="content">
    她在她最好朋友的婚礼上担任伴娘。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bride -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Bridesmaid -->
    <circle cx="200" cy="100" r="25" class="image" />
    <line x1="200" y1="125" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="180" y2="210" class="image" />
    <line x1="200" y1="170" x2="220" y2="210" class="image" />
    <line x1="200" y1="145" x2="170" y2="135" class="image" />
    <line x1="200" y1="145" x2="230" y2="135" class="image" />
    <!-- Connection -->
    <line x1="80" y1="130" x2="170" y2="130" class="image" />
  </g>
</svg>