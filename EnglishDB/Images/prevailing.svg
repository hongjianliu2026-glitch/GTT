<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prevailing</text>
  <text x="50" y="120" class="subtitle">[prɪˈveɪlɪŋ] adj. 流行的，占优势的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + vail (力量) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强大的风"在前面(pre-)"吹过，"力量(vail)"
    <tspan x="50" dy="25">压倒一切，这就是"流行的(prevailing)"风。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The prevailing opinion is that the economy will improve.
  </text>
  <text x="50" y="310" class="content">
    流行的观点是经济将会改善。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wind blowing -->
    <line x1="0" y1="0" x2="100" y2="50" class="image" />
    <line x1="0" y1="20" x2="100" y2="70" class="image" />
    <line x1="0" y1="40" x2="100" y2="90" class="image" />
    <line x1="0" y1="60" x2="100" y2="110" class="image" />
    <line x1="0" y1="80" x2="100" y2="130" class="image" />
    <!-- Wind symbol -->
    <path d="M100,50 Q150,25 200,50" class="image" />
    <path d="M100,70 Q150,45 200,70" class="image" />
    <path d="M100,90 Q150,65 200,90" class="image" />
    <path d="M100,110 Q150,85 200,110" class="image" />
    <path d="M100,130 Q150,105 200,130" class="image" />
  </g>
</svg>