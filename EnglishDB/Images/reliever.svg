<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reliever</text>
  <text x="50" y="120" class="subtitle">[rɪˈliːvər] n. 缓解者，减轻者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + levi (轻) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的人，"再次变轻(re-levi)"
    <tspan x="50" dy="25">的人，这个人就是缓解者(reliever)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The medicine acted as a reliever for his headache.
  </text>
  <text x="50" y="310" class="content">
    这种药物缓解了他的头痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tired person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />

    <!-- Reliever -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
    <line x1="250" y1="150" x2="220" y2="140" class="image" />
    <line x1="250" y1="150" x2="280" y2="140" class="image" />

    <!-- Arrow -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />

    <!-- Relief symbol -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="240" class="image" />
    <line x1="150" y1="200" x2="170" y2="240" class="image" />
    <line x1="150" y1="180" x2="120" y2="170" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
  </g>
</svg>