<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">graphite</text>
  <text x="50" y="120" class="subtitle">[ˈɡræfaɪt] n. 石墨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> graph (写) + -ite (物质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家用"石墨(graphite)"在纸上"写下(graph)"
    <tspan x="50" dy="25">美丽的画作，石墨是铅笔芯的主要成分。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pencil is made of graphite and clay.
  </text>
  <text x="50" y="310" class="content">
    铅笔是由石墨和粘土制成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pencil -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Graphite core -->
    <rect x="20" y="20" width="60" height="160" class="image" fill="#34495E" />
    <!-- Eraser -->
    <rect x="0" y="200" width="100" height="30" class="image" fill="#E74C3C" />
    <!-- Paper -->
    <rect x="150" y="0" width="200" height="200" class="image" />
    <!-- Drawing -->
    <line x1="160" y1="20" x2="340" y2="20" class="image" />
    <line x1="160" y1="50" x2="340" y2="50" class="image" />
    <line x1="160" y1="80" x2="340" y2="80" class="image" />
    <line x1="160" y1="110" x2="340" y2="110" class="image" />
    <line x1="160" y1="140" x2="340" y2="140" class="image" />
    <line x1="160" y1="170" x2="340" y2="170" class="image" />
  </g>
</svg>