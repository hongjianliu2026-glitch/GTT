<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smoldering</text>
  <text x="50" y="120" class="subtitle">[ˈsmoʊldərɪŋ] adj. 闷烧的，阴燃的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smol- (燃烧) + -er (表示进行) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆木柴在火堆中"闷烧(smoldering)"，
    <tspan x="50" dy="25">没有明火，但烟雾缭绕，温度逐渐升高。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The campfire was smoldering after the rain.
  </text>
  <text x="50" y="310" class="content">
    雨后，营火仍在闷烧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="50" cy="50" r="30" class="fire" />
    <circle cx="70" cy="70" r="25" class="fire" />
    <circle cx="90" cy="50" r="20" class="fire" />
    <circle cx="110" cy="70" r="15" class="fire" />
    <circle cx="130" cy="50" r="10" class="fire" />
    <!-- Smoke -->
    <line x1="50" y1="20" x2="50" y2="0" class="image" />
    <line x1="70" y1="20" x2="70" y2="0" class="image" />
    <line x1="90" y1="20" x2="90" y2="0" class="image" />
    <line x1="110" y1="20" x2="110" y2="0" class="image" />
    <line x1="130" y1="20" x2="130" y2="0" class="image" />
  </g>
</svg>