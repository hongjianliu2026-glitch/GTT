<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lukewarm</text>
  <text x="50" y="120" class="subtitle">[ˌluːkˈwɔːrm] adj. 微温的，不热情的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> luke (微温) + warm (温暖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯水，既不冷也不热，"微温(luke)"
    <tspan x="50" dy="25">的状态让人感觉不冷不热，就像不热情的态度。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave a lukewarm response to the proposal.
  </text>
  <text x="50" y="310" class="content">
    她对提议的回应不冷不热。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water glass -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Water level -->
    <rect x="10" y="20" width="130" height="160" class="image" fill="#A9CCE3" />
    <!-- Thermometer -->
    <rect x="170" y="0" width="20" height="200" class="image" />
    <line x1="180" y1="20" x2="180" y2="180" class="image" />
    <line x1="175" y1="100" x2="185" y2="100" class="image" />
    <!-- Lukewarm temperature -->
    <text x="160" y="220" class="content">微温</text>
  </g>
</svg>