<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">naturalist</text>
  <text x="50" y="120" class="subtitle">[ˈnætʃrəlɪst] n. 自然主义者，博物学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> natura (自然) + -al (形容词后缀) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个博物学家在森林中，"自然(natura)"
    <tspan x="50" dy="25">中探索，观察各种生物，他就是自然主义者(naturalist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The naturalist spent years studying the wildlife in the Amazon rainforest.
  </text>
  <text x="50" y="310" class="content">
    这位博物学家花了数年时间研究亚马逊雨林中的野生动物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Naturalist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Binoculars -->
    <line x1="20" y1="115" x2="50" y2="115" class="image" />
    <line x1="35" y1="115" x2="35" y2="85" class="image" />
    <line x1="20" y1="85" x2="50" y2="85" class="image" />
  </g>
</svg>