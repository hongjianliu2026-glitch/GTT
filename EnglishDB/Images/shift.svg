<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shift</text>
  <text x="50" y="120" class="subtitle">[ʃɪft] v. 移动，改变；n. 轮班</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shif (移动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人正在"移动(shift)"
    <tspan x="50" dy="25">一个巨大的箱子，从一边到另一边，这就是轮班(shift)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The workers had to shift the heavy box to the other side of the room.
  </text>
  <text x="50" y="310" class="content">
    工人们不得不把沉重的箱子移到房间的另一边。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="50" y="20" width="150" height="100" class="image" />
    <!-- Worker -->
    <circle cx="20" cy="70" r="15" class="image" />
    <line x1="20" y1="85" x2="20" y2="120" class="image" />
    <line x1="20" y1="120" x2="0" y2="150" class="image" />
    <line x1="20" y1="120" x2="40" y2="150" class="image" />
    <line x1="20" y1="100" x2="50" y2="90" class="image" />
    <!-- Arrow -->
    <line x1="200" y1="70" x2="300" y2="70" class="image" />
    <polygon points="300,70 290,65 290,75" class="image" />
  </g>
</svg>