<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infidel</text>
  <text x="50" y="120" class="subtitle">[ˈɪnfɪdəl] n. 不信教者，异教徒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + fid (信任) + -el (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"不信任(in-fid)"宗教教义的人，
    <tspan x="50" dy="25">被视为"异教徒(infidel)"，站在十字架和月亮之间，</tspan>
    <tspan x="50" dy="25">象征着对宗教信仰的背离。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The medieval church considered non-believers as infidels.
  </text>
  <text x="50" y="310" class="content">
    中世纪的教会认为不信教者是异教徒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cross -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Moon -->
    <circle cx="250" cy="100" r="60" class="image" />
    <circle cx="270" cy="80" r="60" class="image" fill="#FDEBD0" />
    <!-- Infidel -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="200" y2="130" class="image" />
  </g>
</svg>