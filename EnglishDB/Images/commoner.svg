<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commoner</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmənə(r)] n. 平民，普通人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + mon (普通) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通人(commoner)，他穿着普通的衣服，
    <tspan x="50" dy="25">走在普通的街道上，与大家共同(com-)过着普通(mon)的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The prince married a commoner.
  </text>
  <text x="50" y="310" class="content">
    王子娶了一位平民。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Commoner -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left arm -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Common clothes -->
    <rect x="30" y="120" width="40" height="40" class="image" /> <!-- Shirt -->
    <line x1="50" y1="160" x2="50" y2="180" class="image" /> <!-- Belt -->
    <!-- Street -->
    <line x1="0" y1="220" x2="100" y2="220" class="image" /> <!-- Road -->
    <line x1="20" y1="220" x2="20" y2="210" class="image" /> <!-- Sidewalk -->
    <line x1="80" y1="220" x2="80" y2="210" class="image" /> <!-- Sidewalk -->
  </g>
</svg>