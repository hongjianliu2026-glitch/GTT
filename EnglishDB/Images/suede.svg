<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
      .suede { fill: #D2B48C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suede</text>
  <text x="50" y="120" class="subtitle">[sweɪd] n. 绒面革</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自法语 "gants de Suède" (瑞典手套)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个瑞典工匠在制作手套，"瑞典(Suède)"
    <tspan x="50" dy="25">的手套使用了特殊的皮革，这种皮革就是绒面革(suede)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a pair of suede shoes for the party.
  </text>
  <text x="50" y="310" class="content">
    她为派对买了一双绒面革鞋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Suede texture -->
    <rect x="0" y="0" width="350" height="200" class="suede" />
    <!-- Glove -->
    <path d="M50 50 Q75 25 100 50 T150 50 L150 150 Q125 175 100 150 T50 150 Z" class="image" />
    <!-- Craftsman -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>