<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">funnel</text>
  <text x="50" y="120" class="subtitle">[ˈfʌnəl] n. 漏斗；v. 通过漏斗引导</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> funn (烟囱) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的烟囱(funn)，"小(el)"
    <tspan x="50" dy="25">的漏斗(funnel)在引导烟雾，</tspan>
    <tspan x="50" dy="25">让它们有序地流动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a funnel to pour the liquid into the bottle.
  </text>
  <text x="50" y="310" class="content">
    她用漏斗把液体倒进瓶子里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Funnel shape -->
    <path d="M 0 0 L 100 0 L 150 100 L 50 100 Z" class="image" />
    <!-- Liquid pouring -->
    <line x1="100" y1="0" x2="100" y2="100" class="image" />
    <line x1="100" y1="0" x2="120" y2="20" class="image" />
    <line x1="100" y1="0" x2="80" y2="20" class="image" />
    <line x1="100" y1="0" x2="130" y2="40" class="image" />
    <line x1="100" y1="0" x2="70" y2="40" class="image" />
    <!-- Bottle -->
    <rect x="160" y="80" width="60" height="40" class="image" />
    <line x1="160" y1="80" x2="220" y2="80" class="image" />
    <line x1="160" y1="120" x2="220" y2="120" class="image" />
  </g>
</svg>