<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dissolution</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈluːʃn] n. 解散，溶解，瓦解</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + solut (松开) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的冰块在阳光下，"分开松开(dis-solut)"
    <tspan x="50" dy="25">成水滴，最终完全溶解(dissolution)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dissolution of the company left many employees jobless.
  </text>
  <text x="50" y="310" class="content">
    公司的解散让许多员工失业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="200" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Ice block -->
    <rect x="150" y="160" width="100" height="100" class="image" fill="#BDC3C7" />
    <!-- Water drops -->
    <circle cx="170" cy="280" r="10" class="image" fill="#1ABC9C" />
    <circle cx="190" cy="290" r="10" class="image" fill="#1ABC9C" />
    <circle cx="210" cy="300" r="10" class="image" fill="#1ABC9C" />
    <circle cx="230" cy="310" r="10" class="image" fill="#1ABC9C" />
  </g>
</svg>