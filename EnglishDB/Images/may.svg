<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">may</text>
  <text x="50" y="120" class="subtitle">[meɪ] v. 可能，可以</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "mai"，意为"可能"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满可能性的世界，"可能(may)"
    <tspan x="50" dy="25">的门敞开着，等待你去探索。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She may come to the party tonight.
  </text>
  <text x="50" y="310" class="content">
    她今晚可能会来参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="250" class="image" />
    <!-- Handle -->
    <circle cx="140" cy="125" r="10" class="image" />
    <!-- Open door -->
    <line x1="150" y1="0" x2="300" y2="125" class="image" />
    <line x1="150" y1="250" x2="300" y2="125" class="image" />
    <!-- Light from the door -->
    <line x1="300" y1="125" x2="450" y2="0" class="image" />
    <line x1="300" y1="125" x2="450" y2="250" class="image" />
  </g>
</svg>