<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disobedience</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈbiːdiəns] n. 不服从，违抗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + obey (服从) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子站在一旁，"不服从(dis-obey)"
    <tspan x="50" dy="25">父母的指令，这种行为就是不服从(disobedience)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His disobedience led to serious consequences.
  </text>
  <text x="50" y="310" class="content">
    他的不服从导致了严重的后果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Parent -->
    <circle cx="200" cy="100" r="25" class="image" />
    <line x1="200" y1="125" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="180" y2="210" class="image" />
    <line x1="200" y1="170" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="110" x2="70" y2="110" class="image" />
    <polygon points="150,110 140,105 140,115" class="image" />
  </g>
</svg>