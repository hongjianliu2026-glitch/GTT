<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">puzzled</text>
  <text x="50" y="120" class="subtitle">[ˈpʌzld] adj. 困惑的，迷惑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> puzzl (迷惑) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面对一堆拼图碎片，"迷惑不解(puzzled)"，
    <tspan x="50" dy="25">不知道如何将它们拼凑成完整的图案。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked puzzled when I explained the concept.
  </text>
  <text x="50" y="310" class="content">
    当我解释这个概念时，她看起来很困惑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Puzzle pieces -->
    <rect x="120" y="80" width="40" height="40" class="image" />
    <rect x="170" y="80" width="40" height="40" class="image" />
    <rect x="220" y="80" width="40" height="40" class="image" />
    <rect x="120" y="130" width="40" height="40" class="image" />
    <rect x="170" y="130" width="40" height="40" class="image" />
    <rect x="220" y="130" width="40" height="40" class="image" />
    <!-- Question marks -->
    <text x="140" y="180" class="content" font-size="48">?</text>
    <text x="190" y="180" class="content" font-size="48">?</text>
    <text x="240" y="180" class="content" font-size="48">?</text>
  </g>
</svg>