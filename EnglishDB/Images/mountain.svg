<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mountain</text>
  <text x="50" y="120" class="subtitle">[ˈmaʊntən] n. 山，山脉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mount (上升) + -ain (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的山峰，"上升(mount)"
    <tspan x="50" dy="25">到天空，形成壮丽的山脉(mountain)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The climbers reached the summit of the mountain.
  </text>
  <text x="50" y="310" class="content">
    登山者们到达了山顶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" style="fill: #7F8C8D; stroke: #2C3E50; stroke-width: 2;" />
    <!-- Sun -->
    <circle cx="225" cy="50" r="30" style="fill: #F1C40F; stroke: #2C3E50; stroke-width: 2;" />
    <!-- Clouds -->
    <ellipse cx="75" cy="75" rx="50" ry="25" style="fill: #ECF0F1; stroke: #2C3E50; stroke-width: 2;" />
    <ellipse cx="225" cy="100" rx="60" ry="30" style="fill: #ECF0F1; stroke: #2C3E50; stroke-width: 2;" />
  </g>
</svg>