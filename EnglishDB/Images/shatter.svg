<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shatter</text>
  <text x="50" y="120" class="subtitle">[ˈʃætər] v. 粉碎，破碎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shatter (源自中古英语，意为“粉碎”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的玻璃球从高处落下，"砰"的一声，
    <tspan x="50" dy="25">瞬间粉碎成无数碎片，这就是shatter的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vase shattered into pieces when it hit the floor.
  </text>
  <text x="50" y="310" class="content">
    花瓶掉到地上时摔成了碎片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass ball -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Cracks -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Shattered pieces -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
  </g>
</svg>