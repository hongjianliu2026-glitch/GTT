<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incendiary</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsendiˌɛri] adj. 纵火的，煽动的；n. 燃烧弹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + cend (燃烧) + -iary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个纵火犯，"进入(in-)"一个房间，点燃"燃烧(cend)"的火焰，
    <tspan x="50" dy="25">整个房间瞬间变成了"煽动(incendiary)"的火海。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The incendiary device caused extensive damage to the building.
  </text>
  <text x="50" y="310" class="content">
    燃烧弹对建筑物造成了严重破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Flames -->
    <polygon points="150,50 200,20 250,50 200,80" class="flame" />
    <polygon points="170,80 220,50 270,80 220,110" class="flame" />
    <polygon points="190,110 240,80 290,110 240,140" class="flame" />
    <!-- Arsonist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>