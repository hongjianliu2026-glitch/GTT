<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feel-good</text>
  <text x="50" y="120" class="subtitle">[ˈfiːlɡʊd] adj. 令人愉快的，使人感觉良好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> feel (感觉) + good (好的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在阳光下微笑，"感觉良好(feel-good)"，
    <tspan x="50" dy="25">仿佛所有的烦恼都消失了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Watching a feel-good movie can lift your spirits.
  </text>
  <text x="50" y="310" class="content">
    看一部令人愉快的电影可以提升你的情绪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Smile -->
    <path d="M 50 120 Q 100 150 150 120" stroke="#2C3E50" stroke-width="5" fill="none" />
    <!-- Eyes -->
    <circle cx="70" cy="90" r="10" fill="#2C3E50" />
    <circle cx="130" cy="90" r="10" fill="#2C3E50" />
  </g>
</svg>