<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lithium</text>
  <text x="50" y="120" class="subtitle">[ˈlɪθiəm] n. 锂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> litho- (石头) + -ium (元素)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"从石头(litho-)"
    <tspan x="50" dy="25">中提取出一种闪亮的元素(ium)，这就是锂(lithium)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Lithium is commonly used in batteries.
  </text>
  <text x="50" y="310" class="content">
    锂常用于电池中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Element extraction -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="250" y2="50" class="image" />
    <!-- Scientist -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
  </g>
</svg>