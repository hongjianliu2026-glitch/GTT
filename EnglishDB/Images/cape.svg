<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cape</text>
  <text x="50" y="120" class="subtitle">[keɪp] n. 海角，披肩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cap (头) + -e (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"头(cap)"伸入海中，形成了一个海角(cape)。
    <tspan x="50" dy="25">或者，一个披肩(cape)像头巾一样覆盖在肩膀上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship sailed around the Cape of Good Hope.
  </text>
  <text x="50" y="310" class="content">
    船绕过了好望角。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cape as a head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="180" x2="100" y2="300" class="image" />
    <line x1="100" y1="300" x2="20" y2="400" class="image" />
    <line x1="100" y1="300" x2="180" y2="400" class="image" />
    <!-- Cape as a shawl -->
    <rect x="250" y="20" width="150" height="200" class="image" />
    <line x1="250" y1="20" x2="325" y2="0" class="image" />
    <line x1="400" y1="20" x2="325" y2="0" class="image" />
  </g>
</svg>