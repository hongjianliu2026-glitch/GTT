<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conscious</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnʃəs] adj. 有意识的，意识到的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + sci (知道) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考，"共同知道(con-sci)"
    <tspan x="50" dy="25">周围的一切，这个人就是有意识的(conscious)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was conscious of her surroundings.
  </text>
  <text x="50" y="310" class="content">
    她意识到了周围的环境。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Brain -->
    <rect x="50" y="50" width="100" height="100" class="image" />
    <!-- Thought bubbles -->
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="180" cy="70" r="20" class="image" />
    <circle cx="210" cy="50" r="20" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="80" r="10" class="image" />
    <circle cx="125" cy="80" r="10" class="image" />
  </g>
</svg>