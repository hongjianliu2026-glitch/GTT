<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">darkroom</text>
  <text x="50" y="120" class="subtitle">[ˈdɑːrkruːm] n. 暗房</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dark (黑暗) + room (房间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摄影师在"黑暗的房间(dark-room)"里，
    <tspan x="50" dy="25">小心翼翼地冲洗照片，这个房间就是暗房(darkroom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He developed his first roll of film in the darkroom.
  </text>
  <text x="50" y="310" class="content">
    他在暗房里冲洗了他的第一卷胶卷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Photographer -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Dark room interior -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <!-- Film reel -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <!-- Dark room light -->
    <circle cx="250" cy="50" r="10" class="image" />
    <line x1="250" y1="60" x2="250" y2="80" class="image" />
  </g>
</svg>