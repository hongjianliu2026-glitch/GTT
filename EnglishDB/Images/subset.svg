<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subset</text>
  <text x="50" y="120" class="subtitle">[ˈsʌbset] n. 子集</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + set (集合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大的集合(set)，里面包含了许多元素，而"在下面(sub-)"
    <tspan x="50" dy="25">有一个小的集合，这个小的集合就是大集合的子集(subset)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The set of even numbers is a subset of the set of integers.
  </text>
  <text x="50" y="310" class="content">
    偶数集合是整数集合的一个子集。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large set -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Small subset -->
    <rect x="50" y="50" width="200" height="100" class="image" />
    <!-- Elements in large set -->
    <circle cx="30" cy="30" r="10" class="image" />
    <circle cx="80" cy="30" r="10" class="image" />
    <circle cx="130" cy="30" r="10" class="image" />
    <circle cx="180" cy="30" r="10" class="image" />
    <circle cx="230" cy="30" r="10" class="image" />
    <!-- Elements in subset -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <circle cx="170" cy="80" r="10" class="image" />
  </g>
</svg>