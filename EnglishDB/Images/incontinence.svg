<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incontinence</text>
  <text x="50" y="120" class="subtitle">[ˌɪnkənˈtɪnəns] n. 失禁，不能自制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + contin (保持) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人无法"保持(contin)"住自己的身体控制，
    <tspan x="50" dy="25">结果"不(in-)"能自制，导致失禁(incontinence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The elderly patient suffered from incontinence.
  </text>
  <text x="50" y="310" class="content">
    这位老年患者患有失禁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Water drop -->
    <circle cx="70" cy="130" r="10" class="image" />
    <line x1="70" y1="140" x2="70" y2="160" class="image" />
    <line x1="70" y1="160" x2="60" y2="180" class="image" />
    <line x1="70" y1="160" x2="80" y2="180" class="image" />
    <!-- Exclamation mark -->
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="120" x2="90" y2="140" class="image" />
    <line x1="100" y1="120" x2="110" y2="140" class="image" />
  </g>
</svg>