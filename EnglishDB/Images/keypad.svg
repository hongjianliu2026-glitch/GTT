<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">keypad</text>
  <text x="50" y="120" class="subtitle">[ˈkiːpæd] n. 小键盘，按键面板</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> key (键) + pad (垫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的键盘垫(pad)上，密密麻麻地排列着无数的按键(key)，
    <tspan x="50" dy="25">每个按键都像是一个小小的按钮，等待着被按下。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He entered the code using the numeric keypad.
  </text>
  <text x="50" y="310" class="content">
    他用数字小键盘输入了代码。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Keypad outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Keys -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <rect x="50" y="90" width="50" height="50" class="image" />
    <rect x="120" y="90" width="50" height="50" class="image" />
    <rect x="190" y="90" width="50" height="50" class="image" />
    <rect x="260" y="90" width="50" height="50" class="image" />
    <rect x="50" y="160" width="50" height="50" class="image" />
    <rect x="120" y="160" width="50" height="50" class="image" />
    <rect x="190" y="160" width="50" height="50" class="image" />
    <rect x="260" y="160" width="50" height="50" class="image" />
  </g>
</svg>