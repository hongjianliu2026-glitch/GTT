<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flattery</text>
  <text x="50" y="120" class="subtitle">[ˈflætəri] n. 奉承，谄媚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flat (平坦) + -ter (表示反复) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人不停地"平坦地(flat)"说好话，
    <tspan x="50" dy="25">就像在反复地(ter)抹平对方的自尊，这就是奉承(flattery)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was annoyed by his constant flattery.
  </text>
  <text x="50" y="310" class="content">
    她对他的不断奉承感到厌烦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Mouth -->
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
    <!-- Speech bubble -->
    <path d="M 100 80 Q 150 80 150 120 Q 150 160 100 160 Q 50 160 50 120 Z" class="image" />
    <text x="110" y="110" class="content" text-anchor="middle">好话</text>
  </g>
</svg>