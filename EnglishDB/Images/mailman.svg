<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mailman</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪlmən] n. 邮递员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mail (邮件) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个邮递员骑着自行车，"传递邮件(mail)"
    <tspan x="50" dy="25">给每家每户，他就是那个"邮件人(mailman)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mailman delivered the package to my door.
  </text>
  <text x="50" y="310" class="content">
    邮递员把包裹送到了我家门口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="100" y1="0" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="80" y2="20" class="image" />
    <line x1="80" y1="20" x2="80" y2="40" class="image" />
    <line x1="80" y1="40" x2="60" y2="40" class="image" />
    <line x1="60" y1="40" x2="60" y2="60" class="image" />
    <line x1="60" y1="60" x2="40" y2="60" class="image" />
    <line x1="40" y1="60" x2="40" y2="80" class="image" />
    <line x1="40" y1="80" x2="20" y2="80" class="image" />
    <line x1="20" y1="80" x2="20" y2="100" class="image" />
    <line x1="20" y1="100" x2="0" y2="100" class="image" />
    <line x1="0" y1="100" x2="0" y2="0" class="image" />
    <!-- Mailman -->
    <circle cx="50" cy="120" r="15" class="image" />
    <line x1="50" y1="135" x2="50" y2="170" class="image" />
    <line x1="50" y1="170" x2="30" y2="200" class="image" />
    <line x1="50" y1="170" x2="70" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Mailbag -->
    <rect x="10" y="180" width="80" height="40" class="image" />
    <!-- Mail -->
    <line x1="20" y1="190" x2="30" y2="190" class="image" />
    <line x1="20" y1="200" x2="30" y2="200" class="image" />
    <line x1="20" y1="210" x2="30" y2="210" class="image" />
  </g>
</svg>