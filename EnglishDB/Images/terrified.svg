<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">terrified</text>
  <text x="50" y="120" class="subtitle">[ˈterɪfaɪd] adj. 恐惧的，惊恐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> terr (土地) + -ify (使) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在"土地(terr)"上，突然被"使(ify)"得"惊恐(ed)"，
    <tspan x="50" dy="25">他的表情变得极度恐惧，仿佛看到了什么可怕的东西。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child was terrified by the loud thunder.
  </text>
  <text x="50" y="310" class="content">
    孩子被响亮的雷声吓坏了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Person -->
    <circle cx="100" cy="120" r="20" class="image" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="160" x2="70" y2="150" class="image" />
    <line x1="100" y1="160" x2="130" y2="150" class="image" />
    <!-- Scary face -->
    <circle cx="90" cy="110" r="5" class="image" />
    <circle cx="110" cy="110" r="5" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <!-- Scary thing -->
    <polygon points="200,100 250,50 300,100" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
  </g>
</svg>