<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">courtyard</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːrtjɑːrd] n. 庭院，院子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> court (庭院) + yard (场地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的城堡，四周被高墙环绕，中间是一个宽敞的"庭院(court)"，
    <tspan x="50" dy="25">人们在这里"场地(yard)"上活动，这就是一个courtyard。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They gathered in the courtyard for the festival.
  </text>
  <text x="50" y="310" class="content">
    他们在庭院里聚集，庆祝节日。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Castle walls -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Courtyard -->
    <rect x="75" y="75" width="200" height="50" class="image" />
    <!-- People -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
  </g>
</svg>