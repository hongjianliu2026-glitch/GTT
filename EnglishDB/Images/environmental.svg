<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">environmental</text>
  <text x="50" y="120" class="subtitle">[ɪnˌvaɪrənˈmɛntl] adj. 环境的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + viron (周围) + mental (与...有关的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球，"进入(en-)"
    <tspan x="50" dy="25">它的"周围(viron)"，我们感受到的是"与环境有关的(mental)"一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is committed to environmental protection.
  </text>
  <text x="50" y="310" class="content">
    该公司致力于环境保护。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Surrounding elements -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="100" x2="175" y2="20" class="image" />
    <line x1="250" y1="100" x2="175" y2="20" class="image" />
    <line x1="100" y1="100" x2="175" y2="180" class="image" />
    <line x1="250" y1="100" x2="175" y2="180" class="image" />
  </g>
</svg>