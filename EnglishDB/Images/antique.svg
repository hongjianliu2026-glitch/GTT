<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7D3C98; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antique</text>
  <text x="50" y="120" class="subtitle">[ænˈtiːk] n. 古董，古物；adj. 古老的，古董的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (古) + que (的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的(anti-)物品，它静静地躺在博物馆里，
    <tspan x="50" dy="25">散发着岁月的痕迹，它就是一件古董(antique)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She inherited an antique vase from her grandmother.
  </text>
  <text x="50" y="310" class="content">
    她从祖母那里继承了一个古董花瓶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old vase -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <!-- Cracks -->
    <line x1="100" y1="70" x2="120" y2="90" class="image" />
    <line x1="200" y1="70" x2="220" y2="90" class="image" />
    <line x1="150" y1="130" x2="170" y2="150" class="image" />
    <!-- Museum -->
    <rect x="50" y="160" width="250" height="100" class="image" />
    <line x1="100" y1="160" x2="100" y2="260" class="image" />
    <line x1="200" y1="160" x2="200" y2="260" class="image" />
  </g>
</svg>