<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forefinger</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrˌfɪŋɡər] n. 食指</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (前面) + finger (手指)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人伸出他的"前面(fore)"手指，这个手指就是食指(forefinger)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He pointed at the map with his forefinger.
  </text>
  <text x="50" y="310" class="content">
    他用食指指着地图。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hand -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Forefinger -->
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="120" y2="0" class="image" />
    <line x1="100" y1="20" x2="80" y2="0" class="image" />
    <!-- Thumb -->
    <line x1="100" y1="100" x2="150" y2="80" class="image" />
    <!-- Other fingers -->
    <line x1="100" y1="100" x2="130" y2="150" class="image" />
    <line x1="100" y1="100" x2="70" y2="150" class="image" />
    <line x1="100" y1="100" x2="40" y2="120" class="image" />
  </g>
</svg>