<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glint</text>
  <text x="50" y="120" class="subtitle">[ɡlɪnt] n. 闪光，闪烁；v. 闪烁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gl- (光) + int (进入)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一束光"进入(int)"你的眼睛，
    <tspan x="50" dy="25">瞬间"闪烁(glint)"出耀眼的光芒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The diamond glinted in the sunlight.
  </text>
  <text x="50" y="310" class="content">
    钻石在阳光下闪闪发光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Glint -->
    <line x1="100" y1="50" x2="150" y2="0" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="50" y2="0" class="image" />
    <line x1="100" y1="50" x2="50" y2="100" class="image" />
    <!-- Eye -->
    <circle cx="300" cy="100" r="30" fill="#34495E" />
    <circle cx="300" cy="100" r="15" fill="#ECF0F1" />
    <!-- Light entering eye -->
    <line x1="250" y1="100" x2="285" y2="100" class="image" />
  </g>
</svg>