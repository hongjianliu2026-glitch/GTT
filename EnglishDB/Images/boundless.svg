<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boundless</text>
  <text x="50" y="120" class="subtitle">[ˈbaʊndləs] adj. 无限的，无边无际的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bound (边界) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，"没有边界(bound-less)"，
    <tspan x="50" dy="25">它膨胀到无限大，覆盖了整个天空。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ocean's boundless expanse is awe-inspiring.
  </text>
  <text x="50" y="310" class="content">
    海洋的无边无际令人敬畏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Horizon -->
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <!-- Clouds -->
    <ellipse cx="50" cy="50" rx="40" ry="20" class="image" />
    <ellipse cx="150" cy="70" rx="50" ry="25" class="image" />
    <ellipse cx="250" cy="60" rx="30" ry="15" class="image" />
  </g>
</svg>