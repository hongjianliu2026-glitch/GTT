<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dilapidated</text>
  <text x="50" y="120" class="subtitle">[dɪˈlæpɪdeɪtɪd] adj. 破旧的，倒塌的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (离开) + lapid (石头) + -ate (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座房子，"石头(lapid)"
    <tspan x="50" dy="25">一个接一个地"离开(di-)"，</tspan>
    <tspan x="50" dy="25">最终房子变得"破旧(dilapidated)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house was dilapidated and needed repair.
  </text>
  <text x="50" y="310" class="content">
    那座老房子破旧不堪，需要修理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Roof -->
    <polygon points="175,0 0,100 350,100" class="image" />
    <!-- Broken walls -->
    <line x1="50" y1="100" x2="50" y2="200" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="150" y1="100" x2="150" y2="180" class="image" />
    <line x1="200" y1="100" x2="200" y2="160" class="image" />
    <line x1="250" y1="100" x2="250" y2="170" class="image" />
    <line x1="300" y1="100" x2="300" y2="190" class="image" />
    <!-- Falling stones -->
    <circle cx="75" cy="120" r="10" class="image" />
    <circle cx="125" cy="130" r="10" class="image" />
    <circle cx="175" cy="140" r="10" class="image" />
    <circle cx="225" cy="150" r="10" class="image" />
    <circle cx="275" cy="160" r="10" class="image" />
  </g>
</svg>