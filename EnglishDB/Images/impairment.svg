<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impairment</text>
  <text x="50" y="120" class="subtitle">[ɪmˈper.mənt] n. 损害，损伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + pair (一对) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人原本有一对健康的腿，但因为意外，"进入(im-)"
    <tspan x="50" dy="25">了不平衡的状态，导致"一对(pair)"腿中的一条腿"受损(impairment)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident caused significant impairment to his mobility.
  </text>
  <text x="50" y="310" class="content">
    事故对他的行动能力造成了重大损害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Healthy legs -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <!-- Impaired leg -->
    <line x1="150" y1="20" x2="150" y2="80" class="image" />
    <line x1="150" y1="80" x2="130" y2="100" class="image" />
    <line x1="150" y1="80" x2="170" y2="100" class="image" />
    <!-- Crutch -->
    <line x1="150" y1="20" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="170" class="image" />
    <line x1="150" y1="150" x2="170" y2="170" class="image" />
  </g>
</svg>