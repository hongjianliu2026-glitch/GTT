<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #7E5109; }
      .content { font: 18px sans-serif; fill: #1A5276; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #154360; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">weep</text>
  <text x="50" y="120" class="subtitle">[wiːp] v. 哭泣，流泪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wep (哭泣)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在悲伤中，眼泪像"小溪(wep)"一样流淌，
    <tspan x="50" dy="25">这就是哭泣(weep)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wept silently after hearing the news.
  </text>
  <text x="50" y="310" class="content">
    听到消息后，她默默地哭泣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Person -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Tears -->
    <line x1="40" y1="50" x2="20" y2="30" class="image" />
    <line x1="60" y1="50" x2="80" y2="30" class="image" />
    <line x1="40" y1="50" x2="20" y2="70" class="image" />
    <line x1="60" y1="50" x2="80" y2="70" class="image" />
  </g>
</svg>