<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">modernity</text>
  <text x="50" y="120" class="subtitle">[mɒdəˈnæsəti] n. 现代性，现代风格</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mod (方式) + -ern (形容词后缀) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满现代风格的都市，高楼大厦林立，霓虹灯闪烁，
    <tspan x="50" dy="25">人们穿着时尚，科技产品随处可见，这就是现代性(modernity)的体现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city's modernity is reflected in its advanced infrastructure.
  </text>
  <text x="50" y="310" class="content">
    这座城市的现代性体现在其先进的基础设施上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skyscraper -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <rect x="40" y="40" width="20" height="120" class="image" />
    <!-- Neon lights -->
    <line x1="120" y1="20" x2="180" y2="20" class="image" />
    <line x1="120" y1="40" x2="180" y2="40" class="image" />
    <line x1="120" y1="60" x2="180" y2="60" class="image" />
    <line x1="120" y1="80" x2="180" y2="80" class="image" />
    <!-- Fashionable person -->
    <circle cx="220" cy="100" r="15" class="image" />
    <line x1="220" y1="115" x2="220" y2="150" class="image" />
    <line x1="220" y1="150" x2="200" y2="180" class="image" />
    <line x1="220" y1="150" x2="240" y2="180" class="image" />
    <line x1="220" y1="130" x2="250" y2="120" class="image" />
    <!-- Tech product -->
    <rect x="280" y="20" width="80" height="60" class="image" />
    <line x1="290" y1="30" x2="350" y2="30" class="image" />
    <line x1="290" y1="50" x2="350" y2="50" class="image" />
  </g>
</svg>