<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">congenial</text>
  <text x="50" y="120" class="subtitle">[kənˈdʒiːniəl] adj. 意气相投的，性格相似的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + gen (出生) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人，他们"共同出生(con-gen)"，
    <tspan x="50" dy="25">性格和兴趣都非常相似，就像双胞胎一样，</tspan>
    <tspan x="50" dy="25">他们在一起总是非常愉快，这就是congenial。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They found each other to be congenial and decided to become friends.
  </text>
  <text x="50" y="310" class="content">
    他们发现彼此意气相投，决定成为朋友。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Arms and legs -->
    <line x1="50" y1="70" x2="30" y2="100" class="image" />
    <line x1="50" y1="70" x2="70" y2="100" class="image" />
    <line x1="150" y1="70" x2="130" y2="100" class="image" />
    <line x1="150" y1="70" x2="170" y2="100" class="image" />
    <!-- Connection -->
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <!-- Hearts -->
    <path d="M80 80 C85 70, 95 70, 100 80" class="image" />
    <path d="M120 80 C125 70, 135 70, 140 80" class="image" />
  </g>
</svg>