<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deacon</text>
  <text x="50" y="120" class="subtitle">[ˈdiːkən] n. 执事，副主教</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dea- (神) + con (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"神的人(dea-con)"，他穿着庄严的服装，
    <tspan x="50" dy="25">在教堂中协助主教，这就是执事(deacon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The deacon helped distribute the communion.
  </text>
  <text x="50" y="310" class="content">
    执事协助分发圣餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Deacon -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Robe -->
    <rect x="40" y="120" width="20" height="40" class="image" />
    <rect x="60" y="120" width="20" height="40" class="image" />
    <!-- Cross -->
    <line x1="150" y1="50" x2="170" y2="70" class="image" />
    <line x1="150" y1="70" x2="170" y2="50" class="image" />
  </g>
</svg>