<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eighteenth</text>
  <text x="50" y="120" class="subtitle">[ˌeɪˈtiːnθ] adj. 第十八的；n. 第十八</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eight (八) + -teen (十) + -th (序数词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“8”，上面叠加了一个“10”，
    <tspan x="50" dy="25">形成了一个“18”，然后加上“th”，变成了“第十八”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was the eighteenth person to arrive.
  </text>
  <text x="50" y="310" class="content">
    她是第十八个到达的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Number 8 -->
    <circle cx="50" cy="100" r="40" class="image" />
    <circle cx="150" cy="100" r="40" class="image" />
    <!-- Number 10 -->
    <line x1="200" y1="60" x2="200" y2="140" class="image" />
    <line x1="200" y1="60" x2="240" y2="60" class="image" />
    <line x1="240" y1="60" x2="240" y2="140" class="image" />
    <!-- Combined 18 -->
    <line x1="280" y1="60" x2="280" y2="140" class="image" />
    <line x1="280" y1="60" x2="320" y2="60" class="image" />
    <line x1="320" y1="60" x2="320" y2="140" class="image" />
    <circle cx="370" cy="100" r="40" class="image" />
    <circle cx="470" cy="100" r="40" class="image" />
    <!-- "th" -->
    <text x="520" y="100" class="image" font-size="40">th</text>
  </g>
</svg>