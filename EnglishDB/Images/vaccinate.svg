<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vaccinate</text>
  <text x="50" y="120" class="subtitle">[ˈvæksɪneɪt] v. 给...接种疫苗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vacca (牛) + in (在...里面) + ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生拿着一个装有"牛痘(vacca)"的注射器，
    <tspan x="50" dy="25">"在(in)"人体内"接种(ate)"疫苗，保护人们免受疾病侵害。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nurse will vaccinate the children against the flu.
  </text>
  <text x="50" y="310" class="content">
    护士将为孩子们接种流感疫苗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Syringe -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <line x1="50" y1="20" x2="50" y2="0" class="image" />
    <circle cx="50" cy="20" r="10" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="200" class="image" />
    <line x1="150" y1="160" x2="120" y2="140" class="image" />
    <line x1="150" y1="160" x2="180" y2="140" class="image" />
    <line x1="150" y1="200" x2="120" y2="230" class="image" />
    <line x1="150" y1="200" x2="180" y2="230" class="image" />
    <!-- Vaccine -->
    <rect x="220" y="50" width="50" height="100" class="image" />
    <text x="230" y="110" class="content">vacca</text>
  </g>
</svg>