<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">salary</text>
  <text x="50" y="120" class="subtitle">[ˈsæləri] n. 薪水，工资</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sal (盐) + -ary (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象古代罗马士兵用盐(sal)作为工资，
    <tspan x="50" dy="25">后来这种支付方式演变成了现代的薪水(salary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He received a substantial salary increase this year.
  </text>
  <text x="50" y="310" class="content">
    他今年获得了大幅度的加薪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Salt shaker -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <line x1="20" y1="20" x2="80" y2="20" class="image" />
    <line x1="20" y1="40" x2="80" y2="40" class="image" />
    <line x1="20" y1="60" x2="80" y2="60" class="image" />
    <line x1="20" y1="80" x2="80" y2="80" class="image" />
    <line x1="20" y1="100" x2="80" y2="100" class="image" />
    <line x1="20" y1="120" x2="80" y2="120" class="image" />
    <line x1="20" y1="140" x2="80" y2="140" class="image" />
    <!-- Money bag -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <line x1="170" y1="70" x2="230" y2="70" class="image" />
    <line x1="170" y1="90" x2="230" y2="90" class="image" />
    <line x1="170" y1="110" x2="230" y2="110" class="image" />
    <line x1="170" y1="130" x2="230" y2="130" class="image" />
  </g>
</svg>