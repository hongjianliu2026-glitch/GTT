<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sanitation</text>
  <text x="50" y="120" class="subtitle">[ˌsænɪˈteɪʃn] n. 卫生，卫生设施</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> san- (健康) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的消毒喷雾器在城市中喷洒，"保持(san-)"
    <tspan x="50" dy="25">整个城市的健康(sanitation)，确保每个人都能呼吸到清新的空气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city's sanitation system is highly efficient.
  </text>
  <text x="50" y="310" class="content">
    这座城市的卫生系统非常高效。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sanitation sprayer -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="250" class="image" />
    <line x1="175" y1="200" x2="200" y2="250" class="image" />
    <line x1="175" y1="200" x2="125" y2="250" class="image" />
    <line x1="175" y1="200" x2="225" y2="250" class="image" />
    <!-- City skyline -->
    <rect x="50" y="250" width="50" height="50" class="image" />
    <rect x="125" y="220" width="50" height="80" class="image" />
    <rect x="200" y="200" width="50" height="100" class="image" />
    <rect x="275" y="230" width="50" height="70" class="image" />
  </g>
</svg>