<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pickled</text>
  <text x="50" y="120" class="subtitle">[ˈpɪkəld] adj. 腌制的，泡制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pick (挑选) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在挑选(pick)最好的蔬菜，
    <tspan x="50" dy="25">然后将它们浸泡在醋中，制成美味的腌制(pickled)食品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat pickled cucumbers.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃腌黄瓜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jar -->
    <rect x="0" y="0" width="200" height="250" class="image" />
    <!-- Vinegar -->
    <rect x="20" y="20" width="160" height="210" class="image" />
    <!-- Vegetables -->
    <circle cx="100" cy="120" r="20" class="image" /> <!-- Cucumber -->
    <rect x="80" y="160" width="40" height="60" class="image" /> <!-- Carrot -->
    <circle cx="120" cy="200" r="15" class="image" /> <!-- Onion -->
  </g>
</svg>