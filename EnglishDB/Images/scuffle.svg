<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scuffle</text>
  <text x="50" y="120" class="subtitle">[ˈskʌfəl] n. 混战，扭打；v. 扭打，混战</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scuff (摩擦) + -le (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在地面上"摩擦(scuff)"，
    <tspan x="50" dy="25">反复扭打(scuffle)，场面混乱不堪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two boys started to scuffle in the playground.
  </text>
  <text x="50" y="310" class="content">
    两个男孩在操场上开始扭打。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two people scuffling -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="100" y1="140" x2="150" y2="140" class="image" />
    <line x1="100" y1="160" x2="150" y2="160" class="image" />
    <!-- Arms and legs -->
    <line x1="80" y1="120" x2="100" y2="140" class="image" />
    <line x1="120" y1="120" x2="100" y2="140" class="image" />
    <line x1="130" y1="120" x2="150" y2="140" class="image" />
    <line x1="170" y1="120" x2="150" y2="140" class="image" />
  </g>
</svg>