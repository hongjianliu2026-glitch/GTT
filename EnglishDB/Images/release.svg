<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">release</text>
  <text x="50" y="120" class="subtitle">[rɪˈliːs] v. 释放，发布；n. 释放，发布</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + leas (松开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个囚犯被"再次松开(re-leas)"，
    <tspan x="50" dy="25">他终于获得了自由，这就是释放(release)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company plans to release a new product next month.
  </text>
  <text x="50" y="310" class="content">
    公司计划下个月发布新产品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Prison bars -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Released prisoner -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Open door -->
    <rect x="30" y="100" width="40" height="80" class="image" />
    <line x1="30" y1="100" x2="70" y2="100" class="image" />
    <line x1="30" y1="180" x2="70" y2="180" class="image" />
  </g>
</svg>