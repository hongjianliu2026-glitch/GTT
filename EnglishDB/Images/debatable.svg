<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">debatable</text>
  <text x="50" y="120" class="subtitle">[dɪˈbeɪtəbl] adj. 有争议的，可辩论的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + bat (打) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场激烈的辩论赛，双方"强调(de-)"
    <tspan x="50" dy="25">"打(bat)"得不可开交，这样的话题就是"有争议的(debatable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Whether to implement the new policy is debatable.
  </text>
  <text x="50" y="310" class="content">
    是否实施新政策是有争议的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Debate stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two debaters -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />

    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="330" y2="120" class="image" />

    <!-- Speech bubbles -->
    <path d="M 30 50 Q 50 30 70 50 T 110 50" class="image" />
    <text x="40" y="55" class="content">I say...</text>
    <path d="M 280 50 Q 300 30 320 50 T 360 50" class="image" />
    <text x="290" y="55" class="content">I argue...</text>
  </g>
</svg>