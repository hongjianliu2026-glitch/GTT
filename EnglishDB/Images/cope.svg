<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cope</text>
  <text x="50" y="120" class="subtitle">[koʊp] v. 应对，处理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (一起) + -pe (抓住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对困难时，"一起抓住(co-pe)"
    <tspan x="50" dy="25">问题，努力应对(cope)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She managed to cope with the stress of her new job.
  </text>
  <text x="50" y="310" class="content">
    她成功应对了新工作的压力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person facing a problem -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Problem symbol -->
    <rect x="100" y="80" width="50" height="50" class="image" />
    <line x1="100" y1="80" x2="150" y2="130" class="image" />
    <line x1="150" y1="80" x2="100" y2="130" class="image" />
    <!-- Hands coping with the problem -->
    <line x1="50" y1="120" x2="100" y2="100" class="image" />
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
  </g>
</svg>