<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">of</text>
  <text x="50" y="120" class="subtitle">[əv] prep. 属于；关于；来自</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *af, *ab (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体从某个地方"离开(of)"，
    <tspan x="50" dy="25">表示它属于或来自那个地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The book of the author is on the shelf.
  </text>
  <text x="50" y="310" class="content">
    作者的书在书架上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Object leaving -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Object -->
    <rect x="50" y="50" width="100" height="100" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <polygon points="250,85 270,100 250,115" class="image" />
    <!-- Origin -->
    <rect x="280" y="50" width="50" height="100" class="image" />
    <text x="290" y="120" class="content">Origin</text>
  </g>
</svg>