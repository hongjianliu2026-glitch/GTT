<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sparse</text>
  <text x="50" y="120" class="subtitle">[spɑrs] adj. 稀疏的，稀少的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spars (散开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的草原上，只有几棵树"散开(spars)"
    <tspan x="50" dy="25">分布，这种稀疏的景象就是sparse。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forest was sparse, with only a few trees scattered here and there.
  </text>
  <text x="50" y="310" class="content">
    森林很稀疏，只有几棵树零星分布。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grassland -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <circle cx="250" cy="80" r="15" class="image" />
    <circle cx="300" cy="150" r="15" class="image" />
    <!-- Grass -->
    <line x1="20" y1="180" x2="20" y2="190" class="image" />
    <line x1="40" y1="180" x2="40" y2="190" class="image" />
    <line x1="60" y1="180" x2="60" y2="190" class="image" />
    <line x1="80" y1="180" x2="80" y2="190" class="image" />
    <line x1="100" y1="180" x2="100" y2="190" class="image" />
    <line x1="120" y1="180" x2="120" y2="190" class="image" />
    <line x1="140" y1="180" x2="140" y2="190" class="image" />
    <line x1="160" y1="180" x2="160" y2="190" class="image" />
    <line x1="180" y1="180" x2="180" y2="190" class="image" />
    <line x1="200" y1="180" x2="200" y2="190" class="image" />
    <line x1="220" y1="180" x2="220" y2="190" class="image" />
    <line x1="240" y1="180" x2="240" y2="190" class="image" />
    <line x1="260" y1="180" x2="260" y2="190" class="image" />
    <line x1="280" y1="180" x2="280" y2="190" class="image" />
    <line x1="300" y1="180" x2="300" y2="190" class="image" />
    <line x1="320" y1="180" x2="320" y2="190" class="image" />
    <line x1="340" y1="180" x2="340" y2="190" class="image" />
  </g>
</svg>