<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contradict</text>
  <text x="50" y="120" class="subtitle">[ˌkɒntrəˈdɪkt] v. 反驳，否认；与...矛盾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> contra- (相反) + dict (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，一个人说"我喜欢吃苹果"，
    <tspan x="50" dy="25">另一个人立刻反驳"我讨厌苹果"，这就是"相反地说(contra-dict)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His actions contradict his words.
  </text>
  <text x="50" y="310" class="content">
    他的行为与他的言辞相矛盾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <!-- Speech bubbles -->
    <path d="M50 80 Q30 60 50 40 Q70 60 50 80" class="image" />
    <path d="M250 80 Q270 60 250 40 Q230 60 250 80" class="image" />
    <!-- Text in speech bubbles -->
    <text x="55" y="65" class="content">I like apples.</text>
    <text x="235" y="65" class="content">I hate apples.</text>
  </g>
</svg>