<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intolerance</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɒlərəns] n. 不容忍，偏执</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + toler (容忍) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的"不"字前，拒绝接受任何不同的观点或事物，
    <tspan x="50" dy="25">这种"不容忍(intolerance)"的态度让人感到压抑和排斥。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The community showed great intolerance towards newcomers.
  </text>
  <text x="50" y="310" class="content">
    这个社区对新来者表现出极大的不容忍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large "NO" sign -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <text x="175" y="100" font-size="150" text-anchor="middle" fill="#C0392B">NO</text>
    <!-- Person standing in front -->
    <circle cx="175" cy="250" r="20" class="image" />
    <line x1="175" y1="270" x2="175" y2="320" class="image" />
    <line x1="175" y1="320" x2="150" y2="350" class="image" />
    <line x1="175" y1="320" x2="200" y2="350" class="image" />
    <line x1="175" y1="290" x2="130" y2="280" class="image" />
    <line x1="175" y1="290" x2="220" y2="280" class="image" />
  </g>
</svg>