<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indeterminate</text>
  <text x="50" y="120" class="subtitle">[ˌɪndɪˈtɜːrmɪnət] adj. 不确定的，模糊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + determinate (确定的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个迷雾中，"不确定(in-)"
    <tspan x="50" dy="25">方向，无法"确定(determinate)"前进的道路。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outcome of the election remains indeterminate.
  </text>
  <text x="50" y="310" class="content">
    选举结果仍然不确定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fog -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#D6DBDF" />
    <!-- Person -->
    <circle cx="175" cy="100" r="20" class="image" fill="#2C3E50" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="145" y2="130" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Question marks -->
    <text x="100" y="50" class="image" font-size="48" fill="#E74C3C">?</text>
    <text x="250" y="50" class="image" font-size="48" fill="#E74C3C">?</text>
  </g>
</svg>