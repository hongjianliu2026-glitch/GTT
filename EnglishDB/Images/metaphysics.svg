<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">metaphysics</text>
  <text x="50" y="120" class="subtitle">[ˌmetəˈfɪzɪks] n. 形而上学，玄学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meta- (超越) + physics (物理学)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个哲学家站在物理学书籍前，"超越(meta-)"
    <tspan x="50" dy="25">物理学的范畴，探索更深层次的哲学问题，</tspan>
    <tspan x="50" dy="25">这就是形而上学(metaphysics)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spent years studying metaphysics and its implications.
  </text>
  <text x="50" y="310" class="content">
    他花了多年时间研究形而上学及其影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Philosopher -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="160" y="20" width="100" height="160" class="image" />
    <rect x="270" y="20" width="100" height="160" class="image" />
    <!-- Thought bubble -->
    <path d="M 300 100 Q 350 50 400 100 Q 350 150 300 100" class="image" />
    <circle cx="350" cy="100" r="10" class="image" />
  </g>
</svg>