<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gratifying</text>
  <text x="50" y="120" class="subtitle">[ˈɡrætɪfaɪɪŋ] adj. 令人满足的，令人愉快的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grat (高兴) + -ify (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子因为得到了心爱的玩具而"高兴(grat)"得跳起来，
    <tspan x="50" dy="25">这种"使(ify)"人"高兴(grat)"的感觉就是"令人满足的(gratifying)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The success of the project was gratifying to the team.
  </text>
  <text x="50" y="310" class="content">
    项目的成功让团队感到非常满足。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Happy face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <circle cx="35" cy="40" r="5" class="image" />
    <circle cx="65" cy="40" r="5" class="image" />
    <path d="M35 60 Q50 80 65 60" class="image" />

    <!-- Toy -->
    <rect x="100" y="20" width="50" height="50" class="image" />
    <line x1="125" y1="70" x2="125" y2="100" class="image" />
    <line x1="125" y1="100" x2="110" y2="120" class="image" />
    <line x1="125" y1="100" x2="140" y2="120" class="image" />

    <!-- Jump -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
  </g>
</svg>