<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">excursion</text>
  <text x="50" y="120" class="subtitle">[ɪkˈskɜːrʒən] n. 远足，短途旅行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + cur (跑) + -sion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"向外跑(ex-cur)"去探索新的地方，
    <tspan x="50" dy="25">这就是一次远足(excursion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We went on an excursion to the mountains last weekend.
  </text>
  <text x="50" y="310" class="content">
    我们上周末去山里远足了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path for the excursion -->
    <path d="M50 100 Q150 50 250 100 T450 100" class="image" />
    <!-- People -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
    <circle cx="400" cy="100" r="10" class="image" />
    <!-- Mountains -->
    <polygon points="500,100 550,50 600,100" class="image" />
    <polygon points="525,75 575,25 625,75" class="image" />
  </g>
</svg>