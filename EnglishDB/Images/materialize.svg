<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">materialize</text>
  <text x="50" y="120" class="subtitle">[məˈtɪəriəlaɪz] v. 实现，具体化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> materi (物质) + -al (形容词后缀) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个梦想家，他的想法从虚无中"物质化(materialize)"，
    <tspan x="50" dy="25">变成现实中的物体，就像魔法一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His dream of becoming a writer finally materialized.
  </text>
  <text x="50" y="310" class="content">
    他成为作家的梦想终于实现了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud with idea -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <text x="100" y="110" class="content" fill="#2980B9">Idea</text>
    <!-- Lightning bolt -->
    <polyline points="175,100 200,150 150,150 175,100" class="image" />
    <!-- Materialized object -->
    <rect x="125" y="160" width="100" height="50" class="image" />
    <text x="140" y="190" class="content" fill="#2980B9">Object</text>
  </g>
</svg>