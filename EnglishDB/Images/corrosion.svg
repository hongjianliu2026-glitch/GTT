<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">corrosion</text>
  <text x="50" y="120" class="subtitle">[kəˈroʊʒn] n. 腐蚀，侵蚀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cor- (共同) + ros (咬)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块金属被一群小虫子"共同咬(cor-ros)"，
    <tspan x="50" dy="25">这些小虫子慢慢地侵蚀着金属，最终导致金属腐蚀(corrosion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The corrosion of the metal pipe caused a leak.
  </text>
  <text x="50" y="310" class="content">
    金属管的腐蚀导致了泄漏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Metal surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Corroded area -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#8B4513" />
    <!-- Small "bugs" -->
    <circle cx="80" cy="50" r="10" class="image" fill="#000" />
    <circle cx="120" cy="80" r="10" class="image" fill="#000" />
    <circle cx="160" cy="110" r="10" class="image" fill="#000" />
    <circle cx="200" cy="140" r="10" class="image" fill="#000" />
    <!-- Bite marks -->
    <line x1="70" y1="40" x2="90" y2="60" class="image" />
    <line x1="110" y1="70" x2="130" y2="90" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />
    <line x1="190" y1="130" x2="210" y2="150" class="image" />
  </g>
</svg>