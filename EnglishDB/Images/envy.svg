<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">envy</text>
  <text x="50" y="120" class="subtitle">[ˈɛnvi] n. 嫉妒，羡慕；v. 嫉妒，羡慕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (在...里面) + vy (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"在心里看着(en-vy)"别人拥有的东西，
    <tspan x="50" dy="25">心里充满了嫉妒(envy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt a pang of envy when she saw her friend's new car.
  </text>
  <text x="50" y="310" class="content">
    当她看到朋友的新车时，她感到一阵嫉妒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 Q100,25 150,50 Q100,75 50,50" class="image" />
    <!-- Eye inside the heart -->
    <circle cx="100" cy="50" r="10" class="image" />
    <!-- Car -->
    <rect x="180" y="30" width="100" height="50" class="image" />
    <rect x="200" y="40" width="60" height="30" class="image" />
    <circle cx="210" cy="80" r="10" class="image" />
    <circle cx="270" cy="80" r="10" class="image" />
  </g>
</svg>