<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rain</text>
  <text x="50" y="120" class="subtitle">[reɪn] n. 雨；v. 下雨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再) + in (进入)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象天空中的云朵"再次进入(re-in)"
    <tspan x="50" dy="25">地球，化作无数雨滴，这就是雨(rain)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It started to rain as soon as we stepped outside.
  </text>
  <text x="50" y="310" class="content">
    我们一出门，天就开始下雨了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="100" cy="50" rx="80" ry="40" class="image" />
    <!-- Rain drops -->
    <line x1="70" y1="70" x2="70" y2="120" class="image" />
    <line x1="100" y1="70" x2="100" y2="120" class="image" />
    <line x1="130" y1="70" x2="130" y2="120" class="image" />
    <line x1="160" y1="70" x2="160" y2="120" class="image" />
    <line x1="190" y1="70" x2="190" y2="120" class="image" />
  </g>
</svg>