<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">angling</text>
  <text x="50" y="120" class="subtitle">[ˈæŋɡlɪŋ] n. 钓鱼，垂钓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> angul (角) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个渔夫在湖边，"用鱼钩(angul)"
    <tspan x="50" dy="25">钓鱼，这个动作就是垂钓(angling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spent the whole afternoon angling by the river.
  </text>
  <text x="50" y="310" class="content">
    他整个下午都在河边钓鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fisherman -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Fishing rod -->
    <line x1="50" y1="115" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="170" y2="70" class="image" />
    <!-- Fish -->
    <path d="M170,70 C180,50 200,50 210,70" class="image" />
    <line x1="210" y1="70" x2="200" y2="90" class="image" />
    <line x1="210" y1="70" x2="220" y2="90" class="image" />
  </g>
</svg>