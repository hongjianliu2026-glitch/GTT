<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #795548; }
      .image { stroke: #FF5722; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frying</text>
  <text x="50" y="120" class="subtitle">[ˈfraɪɪŋ] v. 油炸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fry (炸) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"炸(fry)"
    <tspan x="50" dy="25">食物时，油锅里的油在"滋滋作响"，</tspan>
    <tspan x="50" dy="25">这就是"油炸(frying)"的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves frying potatoes in olive oil.
  </text>
  <text x="50" y="310" class="content">
    她喜欢用橄榄油炸土豆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pan -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Oil -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>