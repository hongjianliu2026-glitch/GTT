<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">metropolis</text>
  <text x="50" y="120" class="subtitle">[məˈtrɑːpəlɪs] n. 大都市，主要城市</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meta- (在...之后) + polis (城市)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的城市，"在其他城市之后(meta-polis)"
    <tspan x="50" dy="25">成为最主要的中心，这就是大都市(metropolis)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> New York is a bustling metropolis.
  </text>
  <text x="50" y="310" class="content">
    纽约是一个繁忙的大都市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skyscrapers -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="120" y="0" width="100" height="250" class="image" />
    <rect x="240" y="0" width="100" height="180" class="image" />
    <!-- Sun -->
    <circle cx="350" cy="50" r="30" class="image" />
    <!-- Roads -->
    <line x1="0" y1="220" x2="350" y2="220" class="image" />
    <line x1="0" y1="250" x2="350" y2="250" class="image" />
    <!-- Cars -->
    <rect x="20" y="230" width="30" height="10" class="image" />
    <rect x="80" y="230" width="30" height="10" class="image" />
    <rect x="140" y="230" width="30" height="10" class="image" />
    <rect x="200" y="230" width="30" height="10" class="image" />
    <rect x="260" y="230" width="30" height="10" class="image" />
  </g>
</svg>