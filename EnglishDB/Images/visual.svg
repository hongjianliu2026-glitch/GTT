<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">visual</text>
  <text x="50" y="120" class="subtitle">[ˈvɪʒuəl] adj. 视觉的，看得见的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vis (看) + -ual (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的眼睛，"看(vis)"
    <tspan x="50" dy="25">到的所有东西都变得"视觉化(visual)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie had a strong visual impact.
  </text>
  <text x="50" y="310" class="content">
    这部电影有很强的视觉冲击力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Pupil -->
    <circle cx="100" cy="100" r="15" fill="#000" />
    <!-- Eyelids -->
    <path d="M 20 50 Q 100 20 180 50" class="image" />
    <path d="M 20 150 Q 100 180 180 150" class="image" />
  </g>
</svg>