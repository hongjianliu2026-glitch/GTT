<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trolley</text>
  <text x="50" y="120" class="subtitle">[ˈtrɒli] n. 手推车，电车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> troll (滚动) + -ey (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手推车在超市里"滚动(troll)"，
    <tspan x="50" dy="25">载满了各种商品，这就是trolley的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She pushed a trolley full of groceries through the store.
  </text>
  <text x="50" y="310" class="content">
    她推着一辆装满杂货的手推车穿过商店。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trolley -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Wheels -->
    <circle cx="80" cy="180" r="15" class="image" />
    <circle cx="270" cy="180" r="15" class="image" />
    <!-- Handle -->
    <line x1="160" y1="20" x2="160" y2="0" class="image" />
    <!-- Items in trolley -->
    <rect x="70" y="40" width="30" height="30" class="image" />
    <rect x="120" y="40" width="30" height="30" class="image" />
    <rect x="170" y="40" width="30" height="30" class="image" />
    <rect x="220" y="40" width="30" height="30" class="image" />
  </g>
</svg>