<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">idiot</text>
  <text x="50" y="120" class="subtitle">[ˈɪdiət] n. 白痴，傻瓜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> idio- (个人的，独特的) + -ot (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"独特(idio-)"的人，他的行为与众不同，
    <tspan x="50" dy="25">以至于大家都认为他是"傻瓜(idiot)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't be an idiot; wear a helmet when riding a bike.
  </text>
  <text x="50" y="310" class="content">
    别当傻瓜，骑自行车时要戴头盔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="80" r="10" class="image" />
    <circle cx="125" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <line x1="75" y1="130" x2="125" y2="130" class="image" />
    <!-- Unique behavior -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="70" y2="230" class="image" />
    <line x1="100" y1="200" x2="130" y2="230" class="image" />
  </g>
</svg>