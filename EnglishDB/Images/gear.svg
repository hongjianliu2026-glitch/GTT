<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gear</text>
  <text x="50" y="120" class="subtitle">[ɡɪr] n. 齿轮，装备；v. 使适应，装备</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gea (地球) + -r (表示工具或设备)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的齿轮(gear)，它像地球(gea)一样转动，
    <tspan x="50" dy="25">带动着整个机器运转。这个齿轮就是机器的装备(gear)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car's engine is powered by a series of gears.
  </text>
  <text x="50" y="310" class="content">
    汽车的发动机由一系列齿轮驱动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gear -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Earth -->
    <circle cx="300" cy="100" r="50" class="image" />
    <line x1="300" y1="50" x2="300" y2="150" class="image" />
    <line x1="250" y1="100" x2="350" y2="100" class="image" />
    <line x1="275" y1="75" x2="325" y2="125" class="image" />
    <line x1="275" y1="125" x2="325" y2="75" class="image" />
  </g>
</svg>