<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ilk</text>
  <text x="50" y="120" class="subtitle">[ɪlk] n. 种类，类型</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ilk (种类)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的分类器，将各种"种类(ilk)"的物品
    <tspan x="50" dy="25">分门别类地摆放，每个种类都有其独特的标记。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This ilk of problem is common in software development.
  </text>
  <text x="50" y="310" class="content">
    这种类型的问题在软件开发中很常见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classification bins -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="160" y="0" width="150" height="200" class="image" />
    <rect x="320" y="0" width="150" height="200" class="image" />
    <!-- Labels -->
    <text x="20" y="20" class="content">Type A</text>
    <text x="180" y="20" class="content">Type B</text>
    <text x="340" y="20" class="content">Type C</text>
    <!-- Items -->
    <circle cx="75" cy="100" r="20" class="image" />
    <rect x="200" y="80" width="50" height="50" class="image" />
    <line x1="350" y1="80" x2="390" y2="120" class="image" />
    <line x1="350" y1="120" x2="390" y2="80" class="image" />
  </g>
</svg>