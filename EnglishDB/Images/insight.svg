<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insight</text>
  <text x="50" y="120" class="subtitle">[ˈɪnsaɪt] n. 洞察力，见识</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + sight (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人闭上眼睛，突然"进入(in)"
    <tspan x="50" dy="25">内心深处，"看到(sight)"了事物的本质，</tspan>
    <tspan x="50" dy="25">这就是洞察力(insight)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her insight into human nature is remarkable.
  </text>
  <text x="50" y="310" class="content">
    她对人性的洞察力非常出色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Pupil -->
    <circle cx="100" cy="100" r="20" fill="#2C3E50" />
    <!-- Light reflection -->
    <circle cx="115" cy="90" r="5" fill="#FFFFFF" />
    <!-- Light beam -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Thought bubble -->
    <ellipse cx="250" cy="150" rx="80" ry="50" class="image" />
    <!-- Idea -->
    <circle cx="250" cy="150" r="10" fill="#E74C3C" />
  </g>
</svg>