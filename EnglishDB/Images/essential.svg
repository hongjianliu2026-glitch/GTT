<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">essential</text>
  <text x="50" y="120" class="subtitle">[ɪˈsenʃl] adj. 基本的，必要的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ess (存在) + ent (形容词后缀) + ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钥匙，象征着"存在(ess)"
    <tspan x="50" dy="25">和"本质(ent)"，它是打开一切的"基本(ial)"要素。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Water is essential for life.
  </text>
  <text x="50" y="310" class="content">
    水对生命是必不可少的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Key -->
    <rect x="0" y="0" width="200" height="50" class="image" />
    <line x1="20" y1="50" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="180" y2="50" class="image" />
    <line x1="180" y1="50" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="0" class="image" />
    <line x1="200" y1="0" x2="0" y2="0" class="image" />
    <!-- Keyhole -->
    <circle cx="100" cy="100" r="20" class="image" />
  </g>
</svg>