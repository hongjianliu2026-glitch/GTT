<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stretch</text>
  <text x="50" y="120" class="subtitle">[stretʃ] v. 伸展，拉长；n. 伸展，一段路程</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + rect (直)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在清晨醒来，"站立并拉直(st-rect)"
    <tspan x="50" dy="25">身体，进行伸展运动(stretch)，迎接新的一天。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a long run, she took a moment to stretch her legs.
  </text>
  <text x="50" y="310" class="content">
    长跑后，她花了一点时间伸展双腿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person stretching -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="50" x2="20" y2="80" class="image" /> <!-- Left arm -->
    <line x1="50" y1="50" x2="80" y2="80" class="image" /> <!-- Right arm -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right leg -->
    <!-- Stretch lines -->
    <line x1="20" y1="80" x2="0" y2="100" class="image" />
    <line x1="80" y1="80" x2="100" y2="100" class="image" />
    <line x1="20" y1="180" x2="0" y2="200" class="image" />
    <line x1="80" y1="180" x2="100" y2="200" class="image" />
  </g>
</svg>