<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">austerity</text>
  <text x="50" y="120" class="subtitle">[ɔːˈstɛrɪti] n. 节俭，朴素，严峻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auster (严厉) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个严厉的管家，手持一根鞭子，"严厉地(auster)"
    <tspan x="50" dy="25">监督着家里的每一分钱，确保一切节俭(austerity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government imposed austerity measures to reduce the deficit.
  </text>
  <text x="50" y="310" class="content">
    政府实施了紧缩措施以减少赤字。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Whip -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="120" y2="80" class="image" />
    <line x1="120" y1="80" x2="140" y2="100" class="image" />
    <line x1="140" y1="100" x2="160" y2="80" class="image" />
    <line x1="160" y1="80" x2="180" y2="100" class="image" />
    <!-- Money -->
    <rect x="200" y="0" width="100" height="50" class="image" />
    <text x="220" y="30" class="content">$</text>
    <!-- Strict face -->
    <circle cx="350" cy="50" r="30" class="image" />
    <line x1="335" y1="60" x2="365" y2="60" class="image" />
    <line x1="345" y1="80" x2="355" y2="80" class="image" />
    <line x1="340" y1="90" x2="360" y2="90" class="image" />
  </g>
</svg>