<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">satisfy</text>
  <text x="50" y="120" class="subtitle">[ˈsætɪsfaɪ] v. 使满意，满足</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> satis- (足够) + -fy (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人得到了"足够(satis)"的食物，脸上露出满意的笑容，
    <tspan x="50" dy="25">这就是"使满意(satisfy)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The delicious meal satisfied his hunger.
  </text>
  <text x="50" y="310" class="content">
    美味的餐食满足了他的饥饿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="30" class="image" />
    <rect x="150" y="70" width="100" height="60" class="image" />
    <rect x="270" y="80" width="50" height="40" class="image" />
    <!-- Smiling face -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="190" y1="145" x2="200" y2="140" class="image" />
    <line x1="200" y1="140" x2="210" y2="145" class="image" />
    <path d="M190 160 Q200 170 210 160" class="image" />
  </g>
</svg>