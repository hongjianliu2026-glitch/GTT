<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consequent</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnsɪkwənt] adj. 随之发生的，作为结果的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + sequ (跟随) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个事件发生后，"共同跟随(con-sequ-ent)"
    <tspan x="50" dy="25">着一系列结果，这些结果就是consequent。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flood was a consequent of heavy rain.
  </text>
  <text x="50" y="310" class="content">
    洪水是暴雨的后果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Event -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Result 1 -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Result 2 -->
    <line x1="100" y1="100" x2="200" y2="150" class="image" />
    <circle cx="200" cy="150" r="20" class="image" />
    <!-- Result 3 -->
    <line x1="100" y1="100" x2="200" y2="50" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
  </g>
</svg>