<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cowardice</text>
  <text x="50" y="120" class="subtitle">[ˈkaʊərdɪs] n. 懦弱，胆怯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cow (恐吓) + ard (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被一只巨大的怪兽"恐吓(cow)"，
    <tspan x="50" dy="25">吓得不敢动弹，这就是懦弱(cowardice)的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His cowardice prevented him from speaking up.
  </text>
  <text x="50" y="310" class="content">
    他的懦弱使他不敢开口说话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="150" class="image" />
    <line x1="100" y1="180" x2="150" y2="150" class="image" />
    <!-- Person -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="280" y2="220" class="image" />
    <line x1="300" y1="180" x2="320" y2="220" class="image" />
    <line x1="300" y1="140" x2="280" y2="130" class="image" />
    <line x1="300" y1="140" x2="320" y2="130" class="image" />
    <!-- Fear symbol -->
    <text x="280" y="260" class="content" style="font-size: 48px;">😨</text>
  </g>
</svg>