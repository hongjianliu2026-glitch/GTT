<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maim</text>
  <text x="50" y="120" class="subtitle">[meɪm] v. 使残废，使受重伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> maim (来自古法语 maimer，意为“伤害”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被“伤害(maim)”得无法正常行走，
    <tspan x="50" dy="25">他的腿被严重“伤害(maim)”，只能依靠拐杖前行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident left him permanently maimed.
  </text>
  <text x="50" y="310" class="content">
    事故使他永久残疾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with injured leg -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="20" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="80" y2="160" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg (injured) -->
    <line x1="70" y1="220" x2="70" y2="240" class="image" /> <!-- Crutch -->
    <line x1="70" y1="240" x2="50" y2="240" class="image" /> <!-- Crutch handle -->
  </g>
</svg>