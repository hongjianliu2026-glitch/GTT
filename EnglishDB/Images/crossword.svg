<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crossword</text>
  <text x="50" y="120" class="subtitle">[ˈkrɔːswɜːrd] n. 纵横字谜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cross (交叉) + word (词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的字谜网格，"交叉的词(cross-word)"
    <tspan x="50" dy="25">填满了整个画面，每个词都与其他词相交，形成了一个复杂的纵横字谜(crossword)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spent the whole afternoon solving the crossword puzzle.
  </text>
  <text x="50" y="310" class="content">
    他整个下午都在解纵横字谜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crossword grid -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="125" y1="20" x2="125" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="275" y1="20" x2="275" y2="180" class="image" />
    <line x1="350" y1="20" x2="350" y2="180" class="image" />
    <!-- Crossed words -->
    <text x="60" y="50" class="content">C</text>
    <text x="90" y="50" class="content">A</text>
    <text x="120" y="50" class="content">T</text>
    <text x="60" y="90" class="content">D</text>
    <text x="90" y="90" class="content">O</text>
    <text x="120" y="90" class="content">G</text>
    <text x="150" y="90" class="content">S</text>
    <text x="60" y="130" class="content">B</text>
    <text x="90" y="130" class="content">I</text>
    <text x="120" y="130" class="content">R</text>
    <text x="150" y="130" class="content">D</text>
  </g>
</svg>