<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">papal</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪpl] adj. 教皇的，罗马教廷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> papa (父亲) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象教皇(papa)坐在他的宝座上，
    <tspan x="50" dy="25">头戴三重冠，象征着他的权威和神圣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The papal visit to the country was a historic event.
  </text>
  <text x="50" y="310" class="content">
    教皇对该国的访问是一个历史性的事件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Papal throne -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Papal crown -->
    <circle cx="200" cy="50" r="30" class="image" />
    <line x1="170" y1="50" x2="230" y2="50" class="image" />
    <line x1="185" y1="30" x2="215" y2="30" class="image" />
    <line x1="185" y1="70" x2="215" y2="70" class="image" />
    <!-- Papal figure -->
    <circle cx="200" cy="120" r="20" class="image" />
    <line x1="200" y1="140" x2="200" y2="180" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
  </g>
</svg>