<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Canadian</text>
  <text x="50" y="120" class="subtitle">[kəˈneɪdiən] n. 加拿大人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Canada (加拿大) + -ian (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个加拿大人站在枫叶国旗前，"加拿大(Canada)"
    <tspan x="50" dy="25">的枫叶象征着他们的身份，这就是加拿大人(Canadian)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a proud Canadian who loves hockey.
  </text>
  <text x="50" y="310" class="content">
    她是一个热爱冰球的自豪的加拿大人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Maple leaf -->
    <path d="M50,50 L100,50 L125,100 L150,50 L200,50 L150,100 L200,150 L150,150 L125,200 L100,150 L50,150 L100,100 Z" class="image" fill="#D22F27" />
    <!-- Person -->
    <circle cx="125" cy="250" r="20" class="image" fill="#7F8C8D" />
    <line x1="125" y1="270" x2="125" y2="320" class="image" />
    <line x1="125" y1="320" x2="105" y2="350" class="image" />
    <line x1="125" y1="320" x2="145" y2="350" class="image" />
    <line x1="125" y1="290" x2="100" y2="280" class="image" />
    <line x1="125" y1="290" x2="150" y2="280" class="image" />
  </g>
</svg>