<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">apocalyptic</text>
  <text x="50" y="120" class="subtitle">[əˌpɒkəˈlɪptɪk] adj. 启示录的，世界末日的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> apo- (离开) + calypto (掩盖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个世界末日的场景，天空裂开，"掩盖(calypto)"的真相被"揭开(apo-)"，
    <tspan x="50" dy="25">展现出毁灭性的景象，这就是"启示录的(apocalyptic)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie portrayed an apocalyptic scenario where the world was destroyed by a massive earthquake.
  </text>
  <text x="50" y="310" class="content">
    这部电影描绘了一个世界末日的场景，世界被一场大地震摧毁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="175" cy="50" r="30" class="image" />
    <!-- Cracks in the sky -->
    <line x1="50" y1="20" x2="300" y2="180" class="image" />
    <line x1="50" y1="180" x2="300" y2="20" class="image" />
    <!-- Earth -->
    <rect x="0" y="200" width="350" height="100" class="image" />
    <!-- Earthquake cracks -->
    <line x1="50" y1="220" x2="300" y2="280" class="image" />
    <line x1="50" y1="280" x2="300" y2="220" class="image" />
    <!-- City ruins -->
    <rect x="100" y="240" width="50" height="50" class="image" />
    <rect x="200" y="240" width="50" height="50" class="image" />
  </g>
</svg>