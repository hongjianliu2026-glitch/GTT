<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">downstream</text>
  <text x="50" y="120" class="subtitle">[ˈdaʊnˈstriːm] adv. 顺流而下；adj. 下游的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> down- (向下) + stream (河流)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，水流从上游流向下游，
    <tspan x="50" dy="25">就像时间从过去流向未来，"顺流而下(downstream)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boat moved downstream with the current.
  </text>
  <text x="50" y="310" class="content">
    小船顺着水流向下游漂去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 100 Q 100 50 200 100 T 400 100" class="image" />
    <!-- Boat -->
    <polygon points="250,100 270,120 230,120" class="image" fill="#7F8C8D" />
    <!-- Arrow -->
    <line x1="100" y1="100" x2="300" y2="100" class="image" />
    <polygon points="300,100 290,90 290,110" class="image" fill="#7F8C8D" />
  </g>
</svg>