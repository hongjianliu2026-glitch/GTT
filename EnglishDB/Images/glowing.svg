<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glowing</text>
  <text x="50" y="120" class="subtitle">[ˈɡloʊɪŋ] adj. 发光的，热情的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glow (发光) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚，一个发光的灯泡(glow)在黑暗中闪耀，
    <tspan x="50" dy="25">它的光芒如此明亮，以至于整个房间都被照亮了(glowing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The glowing embers of the fire warmed the room.
  </text>
  <text x="50" y="310" class="content">
    火堆中发光的余烬温暖了房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Glowing light bulb -->
    <circle cx="175" cy="100" r="50" fill="#F39C12" stroke="#D35400" stroke-width="5" />
    <!-- Light rays -->
    <line x1="175" y1="150" x2="175" y2="250" stroke="#F39C12" stroke-width="3" />
    <line x1="175" y1="150" x2="275" y2="150" stroke="#F39C12" stroke-width="3" />
    <line x1="175" y1="150" x2="75" y2="150" stroke="#F39C12" stroke-width="3" />
    <line x1="175" y1="150" x2="225" y2="200" stroke="#F39C12" stroke-width="3" />
    <line x1="175" y1="150" x2="125" y2="200" stroke="#F39C12" stroke-width="3" />
  </g>
</svg>