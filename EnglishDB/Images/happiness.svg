<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">happiness</text>
  <text x="50" y="120" class="subtitle">[ˈhæpɪnəs] n. 幸福，快乐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hap (运气，机会) + iness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幸运的人，"抓住了机会(hap)"，
    <tspan x="50" dy="25">脸上洋溢着幸福的笑容(happiness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her happiness was evident in her smile.
  </text>
  <text x="50" y="310" class="content">
    她的幸福在她的笑容中显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lucky person -->
    <circle cx="50" cy="50" r="30" class="image" fill="#F1C40F" />
    <circle cx="50" cy="50" r="25" class="image" fill="#F39C12" />
    <circle cx="40" cy="40" r="5" class="image" fill="#000" />
    <circle cx="60" cy="40" r="5" class="image" fill="#000" />
    <path d="M40 60 Q50 70 60 60" class="image" fill="#000" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="40" class="image" fill="#F1C40F" />
    <line x1="150" y1="10" x2="150" y2="20" class="image" />
    <line x1="150" y1="90" x2="150" y2="100" class="image" />
    <line x1="110" y1="50" x2="120" y2="50" class="image" />
    <line x1="190" y1="50" x2="200" y2="50" class="image" />
    <line x1="130" y1="30" x2="140" y2="20" class="image" />
    <line x1="170" y1="30" x2="180" y2="20" class="image" />
    <line x1="130" y1="70" x2="140" y2="80" class="image" />
    <line x1="170" y1="70" x2="180" y2="80" class="image" />
  </g>
</svg>