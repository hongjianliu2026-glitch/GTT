<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">urban</text>
  <text x="50" y="120" class="subtitle">[ˈɜːrbən] adj. 城市的，都市的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> urbs (城市)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的城市(urbs)，高楼大厦林立，
    <tspan x="50" dy="25">街道上人来人往，这就是"urban"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The urban lifestyle is fast-paced.
  </text>
  <text x="50" y="310" class="content">
    城市生活节奏很快。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="50" height="150" class="image" />
    <rect x="120" y="30" width="50" height="170" class="image" />
    <rect x="190" y="70" width="50" height="130" class="image" />
    <rect x="260" y="40" width="50" height="160" class="image" />
    <!-- Street -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="210" x2="350" y2="210" class="image" />
    <line x1="0" y1="220" x2="350" y2="220" class="image" />
    <!-- People -->
    <circle cx="70" cy="230" r="10" class="image" />
    <circle cx="140" cy="230" r="10" class="image" />
    <circle cx="210" cy="230" r="10" class="image" />
    <circle cx="280" cy="230" r="10" class="image" />
  </g>
</svg>