<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flooding</text>
  <text x="50" y="120" class="subtitle">[ˈflʌdɪŋ] n. 洪水，泛滥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flood (洪水) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场突如其来的洪水，"洪水(flood)"
    <tspan x="50" dy="25">正在"进行(ing)"，街道被淹没，房屋被冲毁。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The town was hit by severe flooding last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚这个小镇遭受了严重的洪水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flooded street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water -->
    <rect x="50" y="20" width="250" height="160" class="water" />
    <!-- House -->
    <rect x="100" y="100" width="50" height="80" class="image" />
    <rect x="120" y="120" width="10" height="20" class="image" />
    <rect x="110" y="140" width="30" height="40" class="image" />
    <!-- Tree -->
    <line x1="250" y1="20" x2="250" y2="100" class="image" />
    <circle cx="250" cy="10" r="10" class="image" />
    <circle cx="240" cy="20" r="10" class="image" />
    <circle cx="260" cy="20" r="10" class="image" />
  </g>
</svg>