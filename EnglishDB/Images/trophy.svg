<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trophy</text>
  <text x="50" y="120" class="subtitle">[ˈtroʊfi] n. 奖杯，战利品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> troph (喂养) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的奖杯，"喂养(troph)"
    <tspan x="50" dy="25">着胜利者的荣耀和回忆，这就是奖杯(trophy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He proudly displayed his trophy on the shelf.
  </text>
  <text x="50" y="310" class="content">
    他自豪地将奖杯展示在架子上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trophy base -->
    <rect x="50" y="100" width="100" height="100" class="image" />
    <!-- Trophy cup -->
    <polygon points="100,100 150,50 200,100" class="image" />
    <!-- Trophy handle -->
    <line x1="125" y1="50" x2="125" y2="0" class="image" />
    <!-- Victory wreath -->
    <circle cx="150" cy="30" r="20" class="image" />
    <line x1="130" y1="30" x2="170" y2="30" class="image" />
    <line x1="140" y1="20" x2="160" y2="40" class="image" />
    <line x1="140" y1="40" x2="160" y2="20" class="image" />
  </g>
</svg>