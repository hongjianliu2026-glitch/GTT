<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">galactic</text>
  <text x="50" y="120" class="subtitle">[ɡəˈlæktɪk] adj. 银河的，星系的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gala (牛奶) + -ctic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的牛奶瓶漂浮在宇宙中，瓶子里装满了闪烁的星星，
    <tspan x="50" dy="25">这些星星组成了一个巨大的银河(galactic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The galactic center is a region of intense activity.
  </text>
  <text x="50" y="310" class="content">
    银河中心是一个活动非常剧烈的区域。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Milky bottle -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="100" cy="200" r="10" class="image" />
    <circle cx="180" cy="250" r="10" class="image" />
    <circle cx="70" cy="150" r="10" class="image" />
    <circle cx="120" cy="250" r="10" class="image" />
    <circle cx="160" cy="50" r="10" class="image" />
    <circle cx="20" cy="200" r="10" class="image" />
    <circle cx="190" cy="150" r="10" class="image" />
    <circle cx="30" cy="100" r="10" class="image" />
  </g>
</svg>