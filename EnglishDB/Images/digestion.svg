<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #641E16; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #922B21; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">digestion</text>
  <text x="50" y="120" class="subtitle">[daɪˈdʒɛstʃən] n. 消化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + gest (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的胃，"分开(di-)并携带(gest)"
    <tspan x="50" dy="25">食物，将其转化为能量，这就是消化(digestion)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A balanced diet aids in digestion.
  </text>
  <text x="50" y="310" class="content">
    均衡的饮食有助于消化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stomach -->
    <ellipse cx="175" cy="100" rx="150" ry="100" class="image" />
    <!-- Food -->
    <circle cx="75" cy="100" r="20" class="image" />
    <circle cx="125" cy="100" r="20" class="image" />
    <circle cx="175" cy="100" r="20" class="image" />
    <circle cx="225" cy="100" r="20" class="image" />
    <circle cx="275" cy="100" r="20" class="image" />
    <!-- Energy -->
    <line x1="175" y1="200" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="150" y2="300" class="image" />
    <line x1="175" y1="250" x2="200" y2="300" class="image" />
  </g>
</svg>