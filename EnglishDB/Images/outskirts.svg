<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outskirts</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtskɜːrts] n. 郊区，外围地区</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (外面) + skirts (边缘)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市，"外面(out-)"的"边缘(skirts)"
    <tspan x="50" dy="25">就是郊区(outskirts)，那里有广阔的田野和宁静的街道。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They moved to the outskirts of the city for a quieter life.
  </text>
  <text x="50" y="310" class="content">
    他们为了更安静的生活搬到了城市的郊区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Buildings -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="20" width="50" height="120" class="image" />
    <rect x="190" y="20" width="50" height="80" class="image" />
    <!-- Outskirts -->
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
    <line x1="0" y1="155" x2="350" y2="155" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
    <!-- Fields -->
    <rect x="50" y="170" width="250" height="30" class="image" />
    <rect x="50" y="210" width="250" height="30" class="image" />
  </g>
</svg>