<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">categorization</text>
  <text x="50" y="120" class="subtitle">[ˌkætəɡəraɪˈzeɪʃən] n. 分类，归类</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cate- (向下) + gory (种类) + -ize (使) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的图书馆，管理员正在"向下分类(cate-gory)"
    <tspan x="50" dy="25">书籍，将它们归类到不同的书架上，这就是分类(categorization)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The categorization of books in the library was done meticulously.
  </text>
  <text x="50" y="310" class="content">
    图书馆的书籍分类做得非常细致。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Library shelves -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <rect x="70" y="40" width="210" height="120" class="image" />
    <rect x="90" y="60" width="170" height="80" class="image" />
    <!-- Books -->
    <rect x="100" y="70" width="20" height="10" class="image" />
    <rect x="130" y="70" width="20" height="10" class="image" />
    <rect x="160" y="70" width="20" height="10" class="image" />
    <rect x="190" y="70" width="20" height="10" class="image" />
    <!-- Librarian -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>