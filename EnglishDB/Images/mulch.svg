<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mulch</text>
  <text x="50" y="120" class="subtitle">[mʌltʃ] n. 覆盖料，护根</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mulch (源自中古英语 mulch, 意为覆盖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个园丁在花园里，"覆盖(mulch)"
    <tspan x="50" dy="25">一层厚厚的护根料，保护植物根部不受伤害。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gardener spread mulch around the plants to retain moisture.
  </text>
  <text x="50" y="310" class="content">
    园丁在植物周围铺上护根料以保持水分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mulch layer -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#8B4513" />
    <!-- Plants -->
    <line x1="70" y1="50" x2="70" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="120" class="image" />
    <line x1="130" y1="50" x2="130" y2="110" class="image" />
    <line x1="160" y1="50" x2="160" y2="130" class="image" />
    <!-- Gardener -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>