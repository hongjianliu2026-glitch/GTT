<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">closet</text>
  <text x="50" y="120" class="subtitle">[ˈkloʊzɪt] n. 壁橱，小房间；adj. 秘密的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clos (关闭) + et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小房间(closet)，门紧紧关闭(clos)，里面藏着许多秘密。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She kept her old letters in the closet.
  </text>
  <text x="50" y="310" class="content">
    她把旧信件藏在壁橱里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Closet -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Door -->
    <rect x="50" y="20" width="100" height="260" class="image" />
    <!-- Handle -->
    <circle cx="100" cy="150" r="10" class="image" />
    <!-- Secret items -->
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="70" y1="110" x2="130" y2="110" class="image" />
    <line x1="70" y1="140" x2="130" y2="140" class="image" />
  </g>
</svg>