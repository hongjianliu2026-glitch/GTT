<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">zone</text>
  <text x="50" y="120" class="subtitle">[zoʊn] n. 区域，地带</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> zon- (来自拉丁语 zona，意为“带子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的带子(zon-)环绕着地球，
    <tspan x="50" dy="25">将地球分成了不同的区域(zone)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city is divided into several zones for easier management.
  </text>
  <text x="50" y="310" class="content">
    这座城市被划分为几个区域以便于管理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Belt around the Earth -->
    <rect x="50" y="90" width="250" height="20" class="image" />
    <!-- Zone labels -->
    <text x="70" y="85" class="content">Zone A</text>
    <text x="170" y="85" class="content">Zone B</text>
    <text x="270" y="85" class="content">Zone C</text>
  </g>
</svg>