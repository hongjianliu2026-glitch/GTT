<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hull</text>
  <text x="50" y="120" class="subtitle">[hʌl] n. 船体，外壳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "hulle"，意为“外壳”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘巨大的船，它的“外壳(hull)”
    <tspan x="50" dy="25">保护着船内的所有东西，就像一个坚固的盾牌。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship's hull was damaged in the storm.
  </text>
  <text x="50" y="310" class="content">
    船的船体在风暴中受损。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship hull -->
    <path d="M50 50 L300 50 L350 150 L50 150 Z" class="image" />
    <!-- Waves -->
    <path d="M50 160 Q100 200 150 160 T250 160" class="image" />
    <path d="M100 170 Q150 210 200 170 T300 170" class="image" />
    <!-- Ship deck -->
    <line x1="70" y1="70" x2="280" y2="70" class="image" />
    <line x1="70" y1="90" x2="280" y2="90" class="image" />
    <line x1="70" y1="110" x2="280" y2="110" class="image" />
  </g>
</svg>