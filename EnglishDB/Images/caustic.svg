<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">caustic</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːstɪk] adj. 腐蚀性的，刻薄的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> caust (烧) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学家在实验室里，"烧(caust)"
    <tspan x="50" dy="25">一瓶腐蚀性液体，它的腐蚀性(caustic)足以</tspan>
    <tspan x="50" dy="25">融化金属，就像刻薄的话语一样伤人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The caustic acid burned a hole in the metal container.
  </text>
  <text x="50" y="310" class="content">
    腐蚀性酸在金属容器上烧出了一个洞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flask -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <!-- Acid -->
    <rect x="20" y="20" width="60" height="110" class="image" fill="#FF6347" />
    <!-- Metal container -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <!-- Hole in container -->
    <circle cx="200" cy="100" r="20" class="image" fill="#34495E" />
    <!-- Scientist -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="350" y2="120" class="image" />
  </g>
</svg>