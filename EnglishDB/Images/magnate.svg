<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">magnate</text>
  <text x="50" y="120" class="subtitle">[ˈmæɡneɪt] n. 大亨，巨头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> magn- (大) + -ate (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的(magn-)人物，他掌控着整个商业帝国，
    <tspan x="50" dy="25">他就是那个商业大亨(magnate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a magnate in the tech industry.
  </text>
  <text x="50" y="310" class="content">
    他是科技行业的大亨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnate -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- Business empire -->
    <rect x="0" y="320" width="200" height="50" class="image" />
    <rect x="20" y="340" width="160" height="30" class="image" />
    <rect x="40" y="360" width="120" height="20" class="image" />
    <rect x="60" y="380" width="80" height="10" class="image" />
  </g>
</svg>