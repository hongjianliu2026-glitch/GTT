<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relentless</text>
  <text x="50" y="120" class="subtitle">[rɪˈlentləs] adj. 无情的，不间断的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + lent (放松) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士在战场上，"再次放松(re-lent)"
    <tspan x="50" dy="25">的机会被剥夺，他必须无休止地战斗，这就是无情的(relentless)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The relentless rain made the journey difficult.
  </text>
  <text x="50" y="310" class="content">
    无情的雨使得旅程变得困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warrior -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Sword -->
    <line x1="20" y1="115" x2="70" y2="70" class="image" />
    <line x1="70" y1="70" x2="80" y2="60" class="image" />
    <!-- Shield -->
    <rect x="0" y="180" width="40" height="20" class="image" />
    <!-- Battleground -->
    <line x1="0" y1="200" x2="100" y2="200" class="image" />
    <line x1="0" y1="210" x2="100" y2="210" class="image" />
    <line x1="0" y1="220" x2="100" y2="220" class="image" />
  </g>
</svg>