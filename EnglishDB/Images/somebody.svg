<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">somebody</text>
  <text x="50" y="120" class="subtitle">[ˈsʌmbədi] pron. 某人，有人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> some (一些) + body (身体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在一个拥挤的房间里，"一些(some)"
    <tspan x="50" dy="25">身体(body)在移动，你无法确定具体是谁，</tspan>
    <tspan x="50" dy="25">但你知道"某人(somebody)"在那里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Somebody left their umbrella behind.
  </text>
  <text x="50" y="310" class="content">
    有人把他们的伞落下了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowded room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="150" cy="80" r="15" class="image" />
    <circle cx="200" cy="110" r="15" class="image" />
    <circle cx="250" cy="90" r="15" class="image" />
    <circle cx="300" cy="130" r="15" class="image" />
    <!-- Question mark -->
    <text x="175" y="180" class="highlight" font-size="48">?</text>
  </g>
</svg>