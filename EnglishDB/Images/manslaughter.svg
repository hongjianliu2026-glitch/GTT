<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">manslaughter</text>
  <text x="50" y="120" class="subtitle">[ˈmænˌslɔːtər] n. 过失杀人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man- (人) + slaughter (屠杀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在愤怒中"误杀了(man-slaughter)"
    <tspan x="50" dy="25">另一个人，这种行为就是过失杀人(manslaughter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was charged with manslaughter after the accident.
  </text>
  <text x="50" y="310" class="content">
    事故发生后，他被指控过失杀人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />

    <!-- Another person -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="200" class="image" />
    <line x1="200" y1="150" x2="170" y2="180" class="image" />
    <line x1="200" y1="150" x2="230" y2="180" class="image" />
    <line x1="200" y1="200" x2="170" y2="250" class="image" />
    <line x1="200" y1="200" x2="230" y2="250" class="image" />

    <!-- Blood splatter -->
    <circle cx="125" cy="150" r="10" class="image" />
    <circle cx="135" cy="160" r="8" class="image" />
    <circle cx="145" cy="170" r="6" class="image" />
    <circle cx="155" cy="180" r="4" class="image" />

    <!-- Anger symbol -->
    <polygon points="50,50 70,70 50,90 30,70" class="image" />
    <polygon points="50,55 65,70 50,85 35,70" class="image" />
  </g>
</svg>