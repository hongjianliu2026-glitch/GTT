<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stack</text>
  <text x="50" y="120" class="subtitle">[stæk] n. 堆叠，堆栈；v. 堆积</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + -ack (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆书"站立(st-)"在一起，形成了一个"堆叠(stack)"。
    <tspan x="50" dy="25">每一本书都稳稳地站在另一本书的上面，就像一个堆栈。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stacked the books neatly on the shelf.
  </text>
  <text x="50" y="310" class="content">
    她把书整齐地堆放在书架上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stack of books -->
    <rect x="50" y="20" width="100" height="20" class="image" />
    <rect x="60" y="50" width="80" height="20" class="image" />
    <rect x="70" y="80" width="60" height="20" class="image" />
    <rect x="80" y="110" width="40" height="20" class="image" />
    <rect x="90" y="140" width="20" height="20" class="image" />
  </g>
</svg>