<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uptight</text>
  <text x="50" y="120" class="subtitle">[ʌpˈtaɪt] adj. 紧张的，拘谨的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up (向上) + tight (紧的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为紧张，身体"向上紧绷(up-tight)"，
    <tspan x="50" dy="25">整个人都变得僵硬和拘谨。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was so uptight before the presentation that she couldn't speak.
  </text>
  <text x="50" y="310" class="content">
    她在演讲前非常紧张，以至于说不出话来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with uptight posture -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="90" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="90" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Tight muscles -->
    <line x1="40" y1="75" x2="60" y2="75" class="image" />
    <line x1="45" y1="80" x2="55" y2="80" class="image" />
    <line x1="40" y1="85" x2="60" y2="85" class="image" />
  </g>
</svg>