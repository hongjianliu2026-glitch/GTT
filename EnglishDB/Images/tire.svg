<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tire</text>
  <text x="50" y="120" class="subtitle">[taɪər] n. 轮胎；v. 使疲劳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tir (拉丁语，疲劳)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在无尽的公路上行驶，"疲劳(tir)"
    <tspan x="50" dy="25">的轮胎(tire)最终磨损，需要更换。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The long journey really tired the tires.
  </text>
  <text x="50" y="310" class="content">
    长途旅行真的让轮胎很疲劳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Tires -->
    <circle cx="80" cy="180" r="20" class="image" />
    <circle cx="270" cy="180" r="20" class="image" />
    <!-- Exhausted face -->
    <circle cx="80" cy="180" r="10" class="image" fill="#F1C40F" />
    <circle cx="270" cy="180" r="10" class="image" fill="#F1C40F" />
    <line x1="75" y1="175" x2="85" y2="175" class="image" />
    <line x1="265" y1="175" x2="275" y2="175" class="image" />
    <line x1="80" y1="185" x2="80" y2="195" class="image" />
    <line x1="270" y1="185" x2="270" y2="195" class="image" />
  </g>
</svg>