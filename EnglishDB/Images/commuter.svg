<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commuter</text>
  <text x="50" y="120" class="subtitle">[kəˈmjuːtər] n. 通勤者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + mut (移动) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个通勤者每天"共同移动(com-mut)"
    <tspan x="50" dy="25">在城市和家之间，这就是通勤者(commuter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The train is always crowded with commuters during rush hour.
  </text>
  <text x="50" y="310" class="content">
    高峰时段，火车总是挤满了通勤者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Train -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Windows -->
    <rect x="50" y="20" width="50" height="60" class="image" />
    <rect x="120" y="20" width="50" height="60" class="image" />
    <rect x="190" y="20" width="50" height="60" class="image" />
    <rect x="260" y="20" width="50" height="60" class="image" />
    <!-- Commuter -->
    <circle cx="75" cy="50" r="15" class="image" />
    <line x1="75" y1="65" x2="75" y2="90" class="image" />
    <line x1="75" y1="90" x2="60" y2="110" class="image" />
    <line x1="75" y1="90" x2="90" y2="110" class="image" />
    <line x1="75" y1="75" x2="100" y2="65" class="image" />
  </g>
</svg>