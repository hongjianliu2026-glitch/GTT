<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slope</text>
  <text x="50" y="120" class="subtitle">[sloʊp] n. 斜坡，斜面；v. 倾斜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sl- (倾斜) + -ope (表面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的斜坡(slope)，上面有一个滑雪者，
    <tspan x="50" dy="25">他正从高处滑下，享受着速度与激情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The skier carefully navigated the steep slope.
  </text>
  <text x="50" y="310" class="content">
    滑雪者小心地滑过陡峭的斜坡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Slope -->
    <polygon points="0,200 350,200 250,0" class="image" />
    <!-- Skier -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="200" class="image" />
    <line x1="100" y1="190" x2="120" y2="200" class="image" />
    <line x1="100" y1="175" x2="130" y2="160" class="image" />
  </g>
</svg>