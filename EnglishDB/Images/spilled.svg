<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spilled</text>
  <text x="50" y="120" class="subtitle">[spɪld] v. 溢出，洒出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spill (溢出)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯水被"溢出(spill)"，水滴四处飞溅，
    <tspan x="50" dy="25">形成一片水渍，这就是"spilled"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She accidentally spilled her coffee on the table.
  </text>
  <text x="50" y="310" class="content">
    她不小心把咖啡洒在了桌子上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <!-- Spilled liquid -->
    <path d="M 10 150 Q 20 130 30 150 T 50 150 T 70 150 T 90 150" class="image" />
    <path d="M 10 160 Q 20 140 30 160 T 50 160 T 70 160 T 90 160" class="image" />
    <path d="M 10 170 Q 20 150 30 170 T 50 170 T 70 170 T 90 170" class="image" />
    <!-- Drops -->
    <circle cx="20" cy="180" r="5" class="image" />
    <circle cx="40" cy="185" r="5" class="image" />
    <circle cx="60" cy="190" r="5" class="image" />
    <circle cx="80" cy="195" r="5" class="image" />
  </g>
</svg>