<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">authorization</text>
  <text x="50" y="120" class="subtitle">[ˌɔːθəraɪˈzeɪʃn] n. 授权，批准</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auth (权威) + or (人) + iz (使) + ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个权威人士(auth)拿着一把钥匙，"使(iz)"
    <tspan x="50" dy="25">某人(or)获得进入某个地方的权限，这就是授权(authorization)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager gave her authorization to access the confidential files.
  </text>
  <text x="50" y="310" class="content">
    经理授权她访问机密文件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Authority figure -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />

    <!-- Key -->
    <rect x="100" y="90" width="30" height="60" class="image" />
    <line x1="115" y1="80" x2="115" y2="90" class="image" />
    <line x1="115" y1="80" x2="105" y2="70" class="image" />
    <line x1="115" y1="80" x2="125" y2="70" class="image" />

    <!-- Door -->
    <rect x="150" y="80" width="100" height="120" class="image" />
    <line x1="200" y1="80" x2="200" y2="200" class="image" />
    <circle cx="170" cy="140" r="10" class="image" />
    <circle cx="230" cy="140" r="10" class="image" />
  </g>
</svg>