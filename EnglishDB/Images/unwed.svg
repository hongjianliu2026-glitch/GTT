<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unwed</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˈwɛd] adj. 未婚的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + wed (结婚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个没有戴戒指的手指，"不结婚(un-wed)"
    <tspan x="50" dy="25">的状态，这就是未婚(unwed)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She remained unwed until the age of 40.
  </text>
  <text x="50" y="310" class="content">
    她直到40岁仍然未婚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="220" class="image" />
    <line x1="100" y1="200" x2="150" y2="220" class="image" />
    <!-- No ring -->
    <circle cx="100" cy="150" r="10" class="image" />
  </g>
</svg>