<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #795548; }
      .content { font: 18px sans-serif; fill: #5D4037; }
      .highlight { font-weight: bold; fill: #FF5722; }
      .story { font: 16px serif; fill: #FF8A65; }
      .image { stroke: #FF8F00; stroke-width: 2; fill: none; }
      .caramel { fill: #D2691E; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">caramel</text>
  <text x="50" y="120" class="subtitle">[ˈkærəmɛl] n. 焦糖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> caram(e)l (来自拉丁语caramelus，意为“糖浆”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，将糖浆(caramelus)加热到变成金黄色的焦糖(caramel)，
    <tspan x="50" dy="25">那甜美的香气弥漫整个房间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She drizzled caramel over the ice cream.
  </text>
  <text x="50" y="310" class="content">
    她在冰淇淋上淋上了焦糖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Caramel pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Caramel -->
    <rect x="70" y="50" width="210" height="100" class="caramel" />
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>