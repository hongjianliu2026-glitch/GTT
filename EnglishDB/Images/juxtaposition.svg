<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">juxtaposition</text>
  <text x="50" y="120" class="subtitle">[ˌdʒʌkstəpəˈzɪʃən] n. 并置，并列</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> juxta- (靠近) + position (位置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个完全不同的物体被"靠近放置(juxta-position)"，
    <tspan x="50" dy="25">形成强烈的对比，这就是并置(juxtaposition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The juxtaposition of the old and new buildings created an interesting contrast.
  </text>
  <text x="50" y="310" class="content">
    旧建筑与新建筑的并置形成了有趣的对比。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old building -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="50" x2="130" y2="50" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <line x1="20" y1="110" x2="130" y2="110" class="image" />
    <line x1="20" y1="140" x2="130" y2="140" class="image" />
    <line x1="20" y1="170" x2="130" y2="170" class="image" />

    <!-- New building -->
    <rect x="200" y="0" width="150" height="200" class="image" />
    <line x1="220" y1="20" x2="330" y2="20" class="image" />
    <line x1="220" y1="50" x2="330" y2="50" class="image" />
    <line x1="220" y1="80" x2="330" y2="80" class="image" />
    <line x1="220" y1="110" x2="330" y2="110" class="image" />
    <line x1="220" y1="140" x2="330" y2="140" class="image" />
    <line x1="220" y1="170" x2="330" y2="170" class="image" />

    <!-- Arrow -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <polygon points="190,90 200,100 190,110" class="image" />
  </g>
</svg>