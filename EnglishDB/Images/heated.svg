<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heated</text>
  <text x="50" y="120" class="subtitle">[ˈhiːtɪd] adj. 加热的，激烈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heat (热) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被火焰包围的物体，"加热(heat)"
    <tspan x="50" dy="25">到发红，变得非常"激烈(heated)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The debate became heated after the controversial statement.
  </text>
  <text x="50" y="310" class="content">
    在发表了有争议的声明后，辩论变得激烈起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flame -->
    <polygon points="50,50 70,20 90,50 80,40 60,40" class="flame" />
    <polygon points="50,50 70,20 90,50 80,40 60,40" transform="translate(20,20)" class="flame" />
    <polygon points="50,50 70,20 90,50 80,40 60,40" transform="translate(40,40)" class="flame" />
    <!-- Heated object -->
    <rect x="50" y="100" width="100" height="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="100" x2="50" y2="150" class="image" />
  </g>
</svg>