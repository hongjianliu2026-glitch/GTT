<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indigent</text>
  <text x="50" y="120" class="subtitle">[ˈɪndɪdʒənt] adj. 贫穷的，贫困的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + dig (足够) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个衣衫褴褛的人，"不够(dig)"
    <tspan x="50" dy="25">满足基本需求，因此"不(in-)"富裕，</tspan>
    <tspan x="50" dy="25">这就是"贫穷的(indigent)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The charity helps indigent families.
  </text>
  <text x="50" y="310" class="content">
    这家慈善机构帮助贫困家庭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Poor person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Ragged clothes -->
    <rect x="30" y="120" width="40" height="50" class="image" />
    <line x1="30" y1="120" x2="70" y2="120" class="image" />
    <line x1="30" y1="140" x2="70" y2="140" class="image" />
    <line x1="30" y1="160" x2="70" y2="160" class="image" />
    <line x1="30" y1="180" x2="70" y2="180" class="image" />
    <line x1="30" y1="200" x2="70" y2="200" class="image" />
    <!-- Broken heart -->
    <path d="M100,100 C100,50 150,50 150,100" class="image" />
    <path d="M100,100 C100,150 150,150 150,100" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="125" y1="80" x2="125" y2="120" class="image" />
  </g>
</svg>