<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">airfare</text>
  <text x="50" y="120" class="subtitle">[ˈɛrˌfɛr] n. 机票价格</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> air (空气，航空) + fare (费用)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你站在机场，抬头看着飞机在空中翱翔，
    <tspan x="50" dy="25">心里想着"航空费用(air-fare)"，那就是机票价格(airfare)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The airfare to New York is quite expensive.
  </text>
  <text x="50" y="310" class="content">
    去纽约的机票价格相当昂贵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airplane -->
    <line x1="0" y1="0" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="150" y2="150" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
    <!-- Airport -->
    <rect x="0" y="150" width="300" height="50" class="image" />
    <!-- Money -->
    <rect x="250" y="50" width="50" height="50" class="image" />
    <line x1="260" y1="60" x2="290" y2="90" class="image" />
    <line x1="260" y1="90" x2="290" y2="60" class="image" />
  </g>
</svg>