<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">approvingly</text>
  <text x="50" y="120" class="subtitle">[əˈpruːvɪŋli] adv. 赞许地，满意地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (加强) + prov (证明) + ing (进行时) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在会议上，"加强证明(ap-prov-ing)"
    <tspan x="50" dy="25">自己的观点，并且满意地点头(approvingly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher looked at the student's work approvingly.
  </text>
  <text x="50" y="310" class="content">
    老师满意地看着学生的作业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Thumbs up -->
    <line x1="50" y1="120" x2="80" y2="90" class="image" />
    <line x1="80" y1="90" x2="100" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M120,80 Q160,60 200,80 Q160,100 120,80" class="image" />
    <text x="130" y="90" class="content">Great!</text>
  </g>
</svg>