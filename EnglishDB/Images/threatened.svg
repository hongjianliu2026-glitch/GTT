<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">threatened</text>
  <text x="50" y="120" class="subtitle">[ˈθretnd] v. 威胁，恐吓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> threat (威胁) + -en (使) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的怪兽站在城市前，"威胁(threat)"
    <tspan x="50" dy="25">着要摧毁一切，人们感到"被威胁(threatened)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The villagers felt threatened by the wild animals.
  </text>
  <text x="50" y="310" class="content">
    村民们感到被野生动物威胁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- City -->
    <rect x="200" y="200" width="150" height="100" class="image" />
    <line x1="220" y1="220" x2="330" y2="220" class="image" />
    <line x1="220" y1="240" x2="330" y2="240" class="image" />
    <line x1="220" y1="260" x2="330" y2="260" class="image" />
    <line x1="220" y1="280" x2="330" y2="280" class="image" />
  </g>
</svg>