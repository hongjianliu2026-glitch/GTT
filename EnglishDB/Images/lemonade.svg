<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9C4; }
      .title { font: bold 48px sans-serif; fill: #F44336; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lemon { fill: #FFEB3B; }
      .glass { fill: #E0F7FA; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lemonade</text>
  <text x="50" y="120" class="subtitle">[ˌleməˈneɪd] n. 柠檬水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lemon (柠檬) + ade (表示饮料)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个炎热的夏天，你拿起一杯"柠檬(lemon)"
    <tspan x="50" dy="25">水(ade)，清凉解渴，这就是柠檬水(lemonade)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a pitcher of lemonade for the party.
  </text>
  <text x="50" y="310" class="content">
    她为聚会做了一大壶柠檬水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lemon -->
    <circle cx="50" cy="100" r="30" class="lemon" />
    <line x1="50" y1="70" x2="50" y2="40" class="image" />
    <line x1="50" y1="40" x2="30" y2="20" class="image" />
    <line x1="50" y1="40" x2="70" y2="20" class="image" />

    <!-- Glass -->
    <rect x="100" y="70" width="100" height="100" class="glass" />
    <line x1="100" y1="70" x2="200" y2="70" class="image" />
    <line x1="100" y1="170" x2="200" y2="170" class="image" />
    <line x1="100" y1="70" x2="100" y2="170" class="image" />
    <line x1="200" y1="70" x2="200" y2="170" class="image" />

    <!-- Straw -->
    <line x1="150" y1="70" x2="150" y2="30" class="image" />
    <line x1="150" y1="30" x2="140" y2="20" class="image" />
    <line x1="150" y1="30" x2="160" y2="20" class="image" />
  </g>
</svg>