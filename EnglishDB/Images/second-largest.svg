<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">second-largest</text>
  <text x="50" y="120" class="subtitle">[ˈsɛkənd ˈlɑːrʤɪst] adj. 第二大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> second (第二) + largest (最大的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在一个巨大的竞技场上，"第二大(second-largest)"
    <tspan x="50" dy="25">的巨人站在那里，虽然不是最大的，但依然引人注目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The second-largest city in the country is known for its vibrant culture.
  </text>
  <text x="50" y="310" class="content">
    这个国家第二大城市以其充满活力的文化而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arena -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Giant 1 -->
    <circle cx="100" cy="100" r="40" class="image" />
    <line x1="100" y1="140" x2="100" y2="200" class="image" />
    <line x1="100" y1="160" x2="60" y2="180" class="image" />
    <line x1="100" y1="160" x2="140" y2="180" class="image" />
    <line x1="100" y1="200" x2="80" y2="240" class="image" />
    <line x1="100" y1="200" x2="120" y2="240" class="image" />
    <!-- Giant 2 -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="190" class="image" />
    <line x1="250" y1="150" x2="210" y2="170" class="image" />
    <line x1="250" y1="150" x2="290" y2="170" class="image" />
    <line x1="250" y1="190" x2="230" y2="230" class="image" />
    <line x1="250" y1="190" x2="270" y2="230" class="image" />
    <!-- Annotation -->
    <text x="100" y="260" class="content" text-anchor="middle">Largest</text>
    <text x="250" y="260" class="content" text-anchor="middle">Second-Largest</text>
  </g>
</svg>