<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Briton</text>
  <text x="50" y="120" class="subtitle">[ˈbrɪtən] n. 不列颠人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Brit- (不列颠) + -on (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个身穿传统苏格兰裙的"不列颠人(Brit-on)"，
    <tspan x="50" dy="25">手持风笛，站在壮丽的苏格兰高地，吹奏着悠扬的乐曲。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Briton was proud of his heritage.
  </text>
  <text x="50" y="310" class="content">
    这位不列颠人对自己的传统感到自豪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kilt (Scottish skirt) -->
    <rect x="50" y="20" width="100" height="150" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Bagpipe -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <line x1="175" y1="50" x2="175" y2="20" class="image" />
    <line x1="175" y1="20" x2="160" y2="10" class="image" />
    <line x1="175" y1="20" x2="190" y2="10" class="image" />
  </g>
</svg>