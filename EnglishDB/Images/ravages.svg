<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ravages</text>
  <text x="50" y="120" class="subtitle">[ˈrævɪdʒɪz] n. 破坏，蹂躏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rav (撕裂) + age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片被"撕裂(rav)"的土地，到处都是残垣断壁，
    <tspan x="50" dy="25">这就是"蹂躏(ravages)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm left the town in ravages.
  </text>
  <text x="50" y="310" class="content">
    风暴过后，小镇满目疮痍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Torn land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="180" class="image" />
    <line x1="50" y1="180" x2="300" y2="20" class="image" />
    <line x1="100" y1="20" x2="250" y2="180" class="image" />
    <line x1="100" y1="180" x2="250" y2="20" class="image" />
    <!-- Ruins -->
    <rect x="100" y="50" width="50" height="50" class="image" />
    <rect x="200" y="50" width="50" height="50" class="image" />
    <rect x="150" y="100" width="50" height="50" class="image" />
  </g>
</svg>