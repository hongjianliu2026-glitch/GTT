<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yam</text>
  <text x="50" y="120" class="subtitle">[jæm] n. 山药，甘薯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自西非语言，原意为“根”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的山药(yam)从地里冒出来，
    <tspan x="50" dy="25">它的根(root)深深扎入土壤，象征着生命的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cooked a delicious yam soup for dinner.
  </text>
  <text x="50" y="310" class="content">
    她为晚餐煮了一锅美味的山药汤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Yam -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <!-- Roots -->
    <line x1="100" y1="150" x2="50" y2="250" class="image" />
    <line x1="100" y1="150" x2="150" y2="250" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
  </g>
</svg>