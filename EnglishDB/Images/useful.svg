<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">useful</text>
  <text x="50" y="120" class="subtitle">[ˈjuːsfəl] adj. 有用的，有益的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> use (使用) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工具箱里装满了各种"充满使用价值(use-ful)"的工具，
    <tspan x="50" dy="25">每一件工具都能帮助你完成任务，这就是有用的(useful)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This book is very useful for learning English.
  </text>
  <text x="50" y="310" class="content">
    这本书对学习英语非常有用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toolbox -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tools -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="80" x2="150" y2="80" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <!-- Hammer -->
    <rect x="200" y="30" width="100" height="50" class="image" />
    <line x1="250" y1="80" x2="250" y2="150" class="image" />
    <!-- Screwdriver -->
    <rect x="300" y="30" width="50" height="10" class="image" />
    <line x1="325" y1="40" x2="325" y2="150" class="image" />
  </g>
</svg>