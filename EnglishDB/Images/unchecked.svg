<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unchecked</text>
  <text x="50" y="120" class="subtitle">[ʌnˈtʃekt] adj. 未经检查的，未受控制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + check (检查)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，"未经检查(un-checked)"
    <tspan x="50" dy="25">地膨胀，最终失控地飞向天空。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unchecked growth of the company led to its collapse.
  </text>
  <text x="50" y="310" class="content">
    公司未经检查的增长导致了它的崩溃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clouds -->
    <ellipse cx="50" cy="50" rx="40" ry="20" class="image" />
    <ellipse cx="150" cy="70" rx="30" ry="15" class="image" />
    <ellipse cx="250" cy="60" rx="35" ry="18" class="image" />
  </g>
</svg>