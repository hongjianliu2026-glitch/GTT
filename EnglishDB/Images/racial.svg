<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">racial</text>
  <text x="50" y="120" class="subtitle">[ˈreɪʃl] adj. 种族的，人种的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rac(e) (种族) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个多彩的地球，"种族(race)"
    <tspan x="50" dy="25">的多样性构成了这个世界的美丽，</tspan>
    <tspan x="50" dy="25">这就是种族的(racial)意义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Racial discrimination is a serious issue.
  </text>
  <text x="50" y="310" class="content">
    种族歧视是一个严重的问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Different races -->
    <circle cx="60" cy="60" r="10" fill="#FFD700" />
    <circle cx="140" cy="60" r="10" fill="#8B4513" />
    <circle cx="100" cy="140" r="10" fill="#000080" />
    <circle cx="60" cy="140" r="10" fill="#FF6347" />
    <circle cx="140" cy="140" r="10" fill="#32CD32" />
  </g>
</svg>