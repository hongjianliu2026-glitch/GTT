<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Tibetan</text>
  <text x="50" y="120" class="subtitle">[tɪˈbetn] n. 藏族人，藏语；adj. 西藏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Tibeto- (西藏)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个藏族人站在壮丽的喜马拉雅山脉前，
    <tspan x="50" dy="25">他身穿传统藏袍，手持转经筒，这就是"西藏的(Tibetan)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Tibetan culture is rich in history and tradition.
  </text>
  <text x="50" y="310" class="content">
    藏族文化历史悠久，传统丰富。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Person -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="120" y2="170" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
    <!-- Prayer wheel -->
    <rect x="140" y="120" width="20" height="30" class="image" />
    <line x1="150" y1="120" x2="150" y2="90" class="image" />
  </g>
</svg>