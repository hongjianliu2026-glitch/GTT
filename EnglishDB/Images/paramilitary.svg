<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paramilitary</text>
  <text x="50" y="120" class="subtitle">[ˌpærəˈmɪlɪtəri] adj. 准军事的；n. 准军事部队</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (旁边) + military (军事)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一支部队，他们不是正规军，但"在军事旁边(para-military)"，
    <tspan x="50" dy="25">他们穿着类似军装，执行类似军事任务，这就是准军事部队(paramilitary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The paramilitary forces were deployed to maintain order.
  </text>
  <text x="50" y="310" class="content">
    准军事部队被部署来维持秩序。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier silhouette -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="0" y2="200" class="image" />
    <line x1="50" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="100" y2="90" class="image" />
    <!-- Paramilitary symbol -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="70" x2="150" y2="130" class="image" />
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <line x1="150" y1="70" x2="120" y2="100" class="image" />
    <line x1="150" y1="70" x2="180" y2="100" class="image" />
  </g>
</svg>