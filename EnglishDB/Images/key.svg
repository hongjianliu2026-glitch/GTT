  <!-- Title -->
  <text x="50" y="80" class="title">key</text>
  <text x="50" y="120" class="subtitle">[kiː] n. 钥匙，关键；adj. 关键的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> key (源自拉丁语 "clavis"，意为“钥匙”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把钥匙(key)，它是打开知识宝库的"关键(key)"，
    <tspan x="50" dy="25">没有它，你将无法进入知识的殿堂。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The key to solving this problem is to think creatively.
  </text>
  <text x="50" y="310" class="content">
    解决这个问题的关键在于创造性思考。
  </text>

