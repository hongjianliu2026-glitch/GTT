<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forehead</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrhed] n. 前额</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (前面) + head (头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"前面(fore)"
    <tspan x="50" dy="25">的头(head)部区域就是前额(forehead)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wiped the sweat from her forehead.
  </text>
  <text x="50" y="310" class="content">
    她擦去了额头上的汗水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Forehead -->
    <rect x="20" y="20" width="160" height="60" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Nose -->
    <line x1="100" y1="100" x2="100" y2="140" class="image" />
    <!-- Mouth -->
    <line x1="60" y1="160" x2="140" y2="160" class="image" />
  </g>
</svg>