<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">politeness</text>
  <text x="50" y="120" class="subtitle">[pəˈlaɪtnəs] n. 礼貌，客气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poli- (城市) + -t + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市(poli-)里的人们，每个人都像绅士一样，
    <tspan x="50" dy="25">互相鞠躬(t)，展现出礼貌(-ness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her politeness impressed everyone at the party.
  </text>
  <text x="50" y="310" class="content">
    她的礼貌给派对上的每个人都留下了深刻印象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="20" height="100" class="image" />
    <rect x="100" y="40" width="20" height="80" class="image" />
    <rect x="150" y="30" width="20" height="90" class="image" />
    <rect x="200" y="50" width="20" height="70" class="image" />
    <rect x="250" y="25" width="20" height="95" class="image" />
    <rect x="300" y="35" width="20" height="85" class="image" />

    <!-- People bowing -->
    <circle cx="70" cy="150" r="15" class="image" />
    <line x1="70" y1="165" x2="70" y2="190" class="image" />
    <line x1="70" y1="190" x2="50" y2="220" class="image" />
    <line x1="70" y1="190" x2="90" y2="220" class="image" />

    <circle cx="120" cy="150" r="15" class="image" />
    <line x1="120" y1="165" x2="120" y2="190" class="image" />
    <line x1="120" y1="190" x2="100" y2="220" class="image" />
    <line x1="120" y1="190" x2="140" y2="220" class="image" />

    <circle cx="170" cy="150" r="15" class="image" />
    <line x1="170" y1="165" x2="170" y2="190" class="image" />
    <line x1="170" y1="190" x2="150" y2="220" class="image" />
    <line x1="170" y1="190" x2="190" y2="220" class="image" />
  </g>
</svg>