<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">woman</text>
  <text x="50" y="120" class="subtitle">[ˈwʊmən] n. 女人，妇女</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wom (女人) + an (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的"女人(wom)"，她穿着长裙，
    <tspan x="50" dy="25">手里拿着一束花，象征着她的温柔和美丽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a strong and independent woman.
  </text>
  <text x="50" y="310" class="content">
    她是一个坚强独立的妇女。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Woman -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="150" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Dress -->
    <path d="M20,150 Q50,120 80,150" class="image" />
    <!-- Flowers -->
    <circle cx="20" cy="120" r="5" class="image" />
    <circle cx="80" cy="120" r="5" class="image" />
  </g>
</svg>