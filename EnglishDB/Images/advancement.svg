<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">advancement</text>
  <text x="50" y="120" class="subtitle">[ədˈvænsmənt] n. 前进，进步，提升</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + vance (前进) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在楼梯上不断"朝向(ad-)"上"前进(vance)"，
    <tspan x="50" dy="25">每一步都代表着他的进步和提升(advancement)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His advancement in the company was remarkable.
  </text>
  <text x="50" y="310" class="content">
    他在公司里的进步是显著的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Staircase -->
    <line x1="50" y1="20" x2="50" y2="200" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="60" x2="150" y2="60" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <!-- Person on staircase -->
    <circle cx="100" cy="160" r="15" class="image" />
    <line x1="100" y1="175" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
  </g>
</svg>