<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brothel</text>
  <text x="50" y="120" class="subtitle">[ˈbrɒθl] n. 妓院</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brot- (兄弟) + hel (房子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的"兄弟之家(brot-hel)"，
    <tspan x="50" dy="25">实际上是一个隐藏的妓院(brothel)，</tspan>
    <tspan x="50" dy="25">里面充满了神秘和诱惑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police raided the brothel last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚警察突袭了那家妓院。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Windows -->
    <rect x="50" y="50" width="50" height="50" class="image" />
    <rect x="250" y="50" width="50" height="50" class="image" />
    <!-- Roof -->
    <polygon points="0,0 350,0 175,100" class="image" />
    <!-- Sign -->
    <line x1="100" y1="20" x2="250" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <line x1="250" y1="20" x2="250" y2="40" class="image" />
    <text x="120" y="35" class="content" fill="#7F8C8D">BROT-HEL</text>
  </g>
</svg>