<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .blue { fill: #4A90E2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bluish</text>
  <text x="50" y="120" class="subtitle">[ˈbluːɪʃ] adj. 带蓝色的，略带蓝色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blue (蓝色) + -ish (表示“略带...的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片天空，"略带蓝色(bluish)"
    <tspan x="50" dy="25">的云朵轻轻飘过，给人一种宁静的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sky turned bluish as the sun set.
  </text>
  <text x="50" y="310" class="content">
    太阳落山时，天空变成了略带蓝色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="blue" />
    <!-- Cloud -->
    <ellipse cx="100" cy="100" rx="80" ry="40" class="image" />
    <ellipse cx="180" cy="100" rx="80" ry="40" class="image" />
    <ellipse cx="260" cy="100" rx="80" ry="40" class="image" />
  </g>
</svg>