<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">implicate</text>
  <text x="50" y="120" class="subtitle">[ˈɪmplɪkeɪt] v. 牵连，暗示</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + plic (折叠) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"卷入(im-plic)"一个复杂的案件中，
    <tspan x="50" dy="25">就像一张纸被折叠(plic)进另一个纸团里，难以脱身。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The evidence implicates him in the crime.
  </text>
  <text x="50" y="310" class="content">
    证据表明他与这起犯罪有关。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Folded paper -->
    <rect x="100" y="80" width="150" height="100" class="image" />
    <line x1="100" y1="80" x2="250" y2="80" class="image" />
    <line x1="100" y1="130" x2="250" y2="130" class="image" />
    <line x1="100" y1="80" x2="100" y2="180" class="image" />
    <line x1="250" y1="80" x2="250" y2="180" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <polygon points="100,100 90,90 90,110" class="image" />
  </g>
</svg>