<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">model</text>
  <text x="50" y="120" class="subtitle">[ˈmɒdl] n. 模型，模特；v. 做模特</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mod (模式) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个设计师在制作一个"小模式(mod-el)"，
    <tspan x="50" dy="25">这个模式可以是一个建筑模型，也可以是一个时尚模特。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She worked as a model for a famous fashion designer.
  </text>
  <text x="50" y="310" class="content">
    她为一位著名的时装设计师做模特。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Model -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fashion model -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Head -->
    <circle cx="175" cy="60" r="20" class="image" />
    <!-- Body -->
    <line x1="175" y1="80" x2="175" y2="140" class="image" />
    <!-- Arms -->
    <line x1="175" y1="100" x2="130" y2="120" class="image" />
    <line x1="175" y1="100" x2="220" y2="120" class="image" />
    <!-- Legs -->
    <line x1="175" y1="140" x2="130" y2="180" class="image" />
    <line x1="175" y1="140" x2="220" y2="180" class="image" />
    <!-- Clothes -->
    <rect x="150" y="80" width="50" height="60" class="image" />
    <line x1="150" y1="140" x2="200" y2="140" class="image" />
  </g>
</svg>