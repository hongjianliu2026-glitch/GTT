<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .virus { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infected</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfektɪd] adj. 被感染的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + fect (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个病毒"进入(in-)"人体，"做(fect)"
    <tspan x="50" dy="25">坏事，导致人体被感染(infected)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The patient was infected with a deadly virus.
  </text>
  <text x="50" y="310" class="content">
    病人被一种致命的病毒感染了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Human body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Virus -->
    <circle cx="120" cy="80" r="10" class="virus" />
    <circle cx="140" cy="90" r="10" class="virus" />
    <circle cx="130" cy="110" r="10" class="virus" />
    <circle cx="110" cy="120" r="10" class="virus" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="110" y2="100" class="image" />
    <polygon points="150,100 145,95 145,105" class="image" />
  </g>
</svg>