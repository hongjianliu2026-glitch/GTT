<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">putt</text>
  <text x="50" y="120" class="subtitle">[pʌt] v. 轻推，轻击（高尔夫球）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "putten"，意为“推”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个高尔夫球手在果岭上，轻轻地“推(putt)”球，
    <tspan x="50" dy="25">球缓缓滚向洞口，这就是高尔夫中的“推杆”动作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made a perfect putt to win the game.
  </text>
  <text x="50" y="310" class="content">
    他完美地推杆赢得了比赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Golf ball -->
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Golf hole -->
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Golf club -->
    <line x1="50" y1="100" x2="90" y2="100" class="image" />
    <line x1="90" y1="100" x2="100" y2="80" class="image" />
    <!-- Golf player -->
    <circle cx="30" cy="100" r="15" class="image" />
    <line x1="30" y1="115" x2="30" y2="150" class="image" />
    <line x1="30" y1="150" x2="10" y2="180" class="image" />
    <line x1="30" y1="150" x2="50" y2="180" class="image" />
    <line x1="30" y1="130" x2="60" y2="120" class="image" />
  </g>
</svg>