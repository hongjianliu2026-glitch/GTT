<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bracket</text>
  <text x="50" y="120" class="subtitle">[ˈbrækɪt] n. 括号，支架；v. 括起来，支撑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brac- (手臂) + -et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小支架(bracket)，就像两只小手臂(brac-)
    <tspan x="50" dy="25">支撑着一块木板，或者像括号一样括住文字。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please enclose the additional information in brackets.
  </text>
  <text x="50" y="310" class="content">
    请将附加信息用括号括起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bracket -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="70" y2="40" class="image" />
    <line x1="50" y1="180" x2="70" y2="160" class="image" />
    <line x1="70" y1="40" x2="70" y2="160" class="image" />
    <!-- Text inside bracket -->
    <text x="80" y="100" class="content">Additional Info</text>
  </g>
</svg>