<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">critical</text>
  <text x="50" y="120" class="subtitle">[ˈkrɪtɪkl] adj. 关键的，批评的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crit (判断) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官在法庭上，"判断(crit)"
    <tspan x="50" dy="25">一个案件的关键点，这些判断是至关重要的(critical)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor said the patient's condition was critical.
  </text>
  <text x="50" y="310" class="content">
    医生说病人的情况很危急。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge's bench -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Gavel -->
    <rect x="100" y="120" width="30" height="50" class="image" />
    <line x1="115" y1="120" x2="115" y2="80" class="image" />
    <!-- Scales of justice -->
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <circle cx="190" cy="125" r="10" class="image" />
    <circle cx="210" cy="125" r="10" class="image" />
  </g>
</svg>