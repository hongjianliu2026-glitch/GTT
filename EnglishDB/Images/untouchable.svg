<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">untouchable</text>
  <text x="50" y="120" class="subtitle">[ʌnˈtʌtʃəbl] adj. 不可接触的，不可触及的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + touch (接触) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的宝箱，周围环绕着"不可接触的(un-touch-able)"
    <tspan x="50" dy="25">能量场，任何试图触碰它的人都会被弹开。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The treasure was kept in an untouchable vault.
  </text>
  <text x="50" y="310" class="content">
    宝藏被存放在一个不可触及的保险库中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Treasure chest -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="40" x2="180" y2="40" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="120" x2="180" y2="120" class="image" />
    <!-- Energy field -->
    <circle cx="100" cy="75" r="50" class="image" />
    <line x1="50" y1="75" x2="150" y2="75" class="image" />
    <line x1="100" y1="25" x2="100" y2="125" class="image" />
    <line x1="75" y1="50" x2="125" y2="100" class="image" />
    <line x1="75" y1="100" x2="125" y2="50" class="image" />
  </g>
</svg>