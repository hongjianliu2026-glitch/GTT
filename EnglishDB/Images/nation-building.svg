<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nation-building</text>
  <text x="50" y="120" class="subtitle">[ˈneɪʃən ˈbɪldɪŋ] n. 国家建设</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nation (国家) + build (建造)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群建筑师和工程师，他们正在"建造(build)"一个
    <tspan x="50" dy="25">"国家(nation)"，从基础设施到文化认同，</tspan>
    <tspan x="50" dy="25">每一步都在塑造这个国家的未来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government is focusing on nation-building through education and infrastructure.
  </text>
  <text x="50" y="310" class="content">
    政府正通过教育和基础设施建设来推动国家建设。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nation -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Buildings -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="20" width="50" height="120" class="image" />
    <rect x="190" y="20" width="50" height="80" class="image" />
    <rect x="260" y="20" width="50" height="150" class="image" />
    <!-- Road -->
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <!-- People -->
    <circle cx="75" cy="170" r="10" class="image" />
    <circle cx="145" cy="170" r="10" class="image" />
    <circle cx="215" cy="170" r="10" class="image" />
    <circle cx="285" cy="170" r="10" class="image" />
  </g>
</svg>