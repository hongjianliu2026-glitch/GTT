<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">electronically</text>
  <text x="50" y="120" class="subtitle">[ɪˌlekˈtrɑːnɪkli] adv. 电子地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> electron (电子) + -ic (形容词后缀) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个电子世界，"电子(electron)"在空中飞舞，
    <tspan x="50" dy="25">它们以光速穿梭，完成各种任务，这就是电子地(electronically)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The transaction was completed electronically.
  </text>
  <text x="50" y="310" class="content">
    交易是通过电子方式完成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circuit board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Electronic components -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <!-- Wires -->
    <line x1="50" y1="60" x2="250" y2="60" class="image" />
    <line x1="50" y1="70" x2="250" y2="70" class="image" />
    <line x1="50" y1="80" x2="250" y2="80" class="image" />
    <!-- Lightning bolt -->
    <polyline points="300,50 320,70 300,90" class="image" />
    <polyline points="300,50 320,30 300,10" class="image" />
  </g>
</svg>