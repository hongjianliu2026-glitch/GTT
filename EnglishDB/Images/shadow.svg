<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shadow</text>
  <text x="50" y="120" class="subtitle">[ˈʃædoʊ] n. 影子，阴影；v. 遮蔽，跟踪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shad (影子) + -ow (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的影子(shadow)，它像一个神秘的跟踪者，
    <tspan x="50" dy="25">总是跟在你身后，无论你走到哪里，它都如影随形。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tree cast a long shadow on the ground.
  </text>
  <text x="50" y="310" class="content">
    树在地上投下长长的影子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Tree -->
    <line x1="100" y1="150" x2="100" y2="50" class="image" />
    <circle cx="100" cy="40" r="10" class="image" />
    <!-- Shadow -->
    <line x1="110" y1="150" x2="250" y2="150" class="image" />
    <line x1="110" y1="145" x2="250" y2="145" class="image" />
    <line x1="110" y1="140" x2="250" y2="140" class="image" />
    <line x1="110" y1="135" x2="250" y2="135" class="image" />
    <line x1="110" y1="130" x2="250" y2="130" class="image" />
    <line x1="110" y1="125" x2="250" y2="125" class="image" />
    <line x1="110" y1="120" x2="250" y2="120" class="image" />
    <line x1="110" y1="115" x2="250" y2="115" class="image" />
    <line x1="110" y1="110" x2="250" y2="110" class="image" />
    <line x1="110" y1="105" x2="250" y2="105" class="image" />
    <line x1="110" y1="100" x2="250" y2="100" class="image" />
    <line x1="110" y1="95" x2="250" y2="95" class="image" />
    <line x1="110" y1="90" x2="250" y2="90" class="image" />
    <line x1="110" y1="85" x2="250" y2="85" class="image" />
    <line x1="110" y1="80" x2="250" y2="80" class="image" />
    <line x1="110" y1="75" x2="250" y2="75" class="image" />
    <line x1="110" y1="70" x2="250" y2="70" class="image" />
    <line x1="110" y1="65" x2="250" y2="65" class="image" />
    <line x1="110" y1="60" x2="250" y2="60" class="image" />
    <line x1="110" y1="55" x2="250" y2="55" class="image" />
    <line x1="110" y1="50" x2="250" y2="50" class="image" />
    <line x1="110" y1="45" x2="250" y2="45" class="image" />
    <line x1="110" y1="40" x2="250" y2="40" class="image" />
    <line x1="110" y1="35" x2="250" y2="35" class="image" />
    <line x1="110" y1="30" x2="250" y2="30" class="image" />
    <line x1="110" y1="25" x2="250" y2="25" class="image" />
    <line x1="110" y1="20" x2="250" y2="20" class="image" />
    <line x1="110" y1="15" x2="250" y2="15" class="image" />
    <line x1="110" y1="10" x2="250" y2="10" class="image" />
    <line x1="110" y1="5" x2="250" y2="5" class="image" />
    <line x1="110" y1="0" x2="250" y2="0" class="image" />
  </g>
</svg>