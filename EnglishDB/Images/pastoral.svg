<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pastoral</text>
  <text x="50" y="120" class="subtitle">[ˈpæstərəl] adj. 田园的，牧师的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pasto- (牧人) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个牧羊人在绿色的山坡上，"牧人(pasto-)"
    <tspan x="50" dy="25">和他的羊群在宁静的田园风光中，这就是田园的(pastoral)景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The painting depicted a pastoral scene with sheep and a shepherd.
  </text>
  <text x="50" y="310" class="content">
    这幅画描绘了一个有羊群和牧羊人的田园场景。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Green hill -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#27AE60" />
    <!-- Shepherd -->
    <circle cx="50" cy="100" r="15" class="image" fill="#F1C40F" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Sheep -->
    <circle cx="150" cy="120" r="10" class="image" fill="#FFFFFF" />
    <circle cx="170" cy="120" r="10" class="image" fill="#FFFFFF" />
    <circle cx="190" cy="120" r="10" class="image" fill="#FFFFFF" />
    <circle cx="210" cy="120" r="10" class="image" fill="#FFFFFF" />
    <circle cx="230" cy="120" r="10" class="image" fill="#FFFFFF" />
  </g>
</svg>