<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">halt</text>
  <text x="50" y="120" class="subtitle">[hɔlt] v. 停止，暂停；n. 停止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hal- (停止)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆飞速行驶的火车突然"停止(hal-t)"，
    <tspan x="50" dy="25">车轮摩擦地面发出刺耳的声音，整个场景瞬间静止。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The train came to a halt at the station.
  </text>
  <text x="50" y="310" class="content">
    火车在车站停了下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Train -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Wheels -->
    <circle cx="80" cy="180" r="20" class="image" />
    <circle cx="180" cy="180" r="20" class="image" />
    <circle cx="280" cy="180" r="20" class="image" />
    <!-- Brake marks -->
    <line x1="50" y1="180" x2="100" y2="180" class="image" />
    <line x1="150" y1="180" x2="200" y2="180" class="image" />
    <line x1="250" y1="180" x2="300" y2="180" class="image" />
  </g>
</svg>