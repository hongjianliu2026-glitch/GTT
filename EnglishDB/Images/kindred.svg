<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kindred</text>
  <text x="50" y="120" class="subtitle">[ˈkɪndrəd] n. 亲属，血缘关系；adj. 同类的，相似的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kind (种类) + red (关系)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大家庭，"同种类(kind)"的人们
    <tspan x="50" dy="25">聚集在一起，形成了一种紧密的"关系(red)"，</tspan>
    <tspan x="50" dy="25">这就是亲属(kindred)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt a strong sense of kindred with her cousins.
  </text>
  <text x="50" y="310" class="content">
    她与她的表兄弟姐妹们有着强烈的亲属感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family tree -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="170" x2="150" y2="170" class="image" />
    <!-- Family members -->
    <circle cx="100" cy="20" r="15" class="image" />
    <circle cx="50" cy="70" r="15" class="image" />
    <circle cx="150" cy="70" r="15" class="image" />
    <circle cx="50" cy="120" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <circle cx="50" cy="170" r="15" class="image" />
    <circle cx="150" cy="170" r="15" class="image" />
  </g>
</svg>