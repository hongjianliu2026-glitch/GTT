<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crumbling</text>
  <text x="50" y="120" class="subtitle">[ˈkrʌmbəlɪŋ] v. 崩溃，破碎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crumbl (碎裂) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的城堡，"碎裂(crumbl)"
    <tspan x="50" dy="25">成无数小块，正在"进行(ing)"中，</tspan>
    <tspan x="50" dy="25">整个场景就像一场灾难性的崩溃。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old building was crumbling before our eyes.
  </text>
  <text x="50" y="310" class="content">
    那座旧建筑在我们眼前崩塌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cracks -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Falling debris -->
    <circle cx="20" cy="100" r="15" class="image" />
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="180" cy="140" r="15" class="image" />
    <circle cx="260" cy="160" r="15" class="image" />
  </g>
</svg>