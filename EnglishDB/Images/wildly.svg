<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wildly</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪldli] adv. 狂野地，疯狂地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wild (野生的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只野生的狮子在草原上"狂野地(wildly)"奔跑，
    <tspan x="50" dy="25">它的鬃毛随风飘扬，展现出无比的自由与力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd cheered wildly as the winner crossed the finish line.
  </text>
  <text x="50" y="310" class="content">
    当获胜者冲过终点线时，人群疯狂地欢呼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Tail -->
    <line x1="50" y1="180" x2="80" y2="200" class="image" /> <!-- Tail -->
    <!-- Grass -->
    <line x1="0" y1="220" x2="100" y2="220" class="image" />
    <line x1="0" y1="230" x2="100" y2="230" class="image" />
    <line x1="0" y1="240" x2="100" y2="240" class="image" />
  </g>
</svg>