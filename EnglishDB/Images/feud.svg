<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feud</text>
  <text x="50" y="120" class="subtitle">[fjuːd] n. 世仇，宿怨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> feud- (土地) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个家族为了争夺"土地(feud)"而展开了
    <tspan x="50" dy="25">一场激烈的世仇(feud)，他们的剑在空中交错，</tspan>
    <tspan x="50" dy="25">象征着他们之间无法化解的宿怨。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The feud between the two families lasted for generations.
  </text>
  <text x="50" y="310" class="content">
    这两个家族之间的世仇持续了好几代。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two families -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Swords crossing -->
    <line x1="70" y1="80" x2="280" y2="120" class="image" />
    <line x1="70" y1="120" x2="280" y2="80" class="image" />
    <!-- Family names -->
    <text x="30" y="150" class="content">Family A</text>
    <text x="270" y="150" class="content">Family B</text>
  </g>
</svg>