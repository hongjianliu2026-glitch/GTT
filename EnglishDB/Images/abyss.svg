<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abyss</text>
  <text x="50" y="120" class="subtitle">[əˈbɪs] n. 深渊，无底洞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + yss (深)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"离开(ab-)"地面，
    <tspan x="50" dy="25">眼前是一个深不见底的"深渊(yss)"，令人心生恐惧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The diver ventured into the abyss of the ocean.
  </text>
  <text x="50" y="310" class="content">
    潜水员冒险进入了海洋的深渊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Abyss -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cliff -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Person -->
    <circle cx="175" cy="10" r="10" class="image" />
    <line x1="175" y1="20" x2="175" y2="50" class="image" />
    <line x1="175" y1="50" x2="160" y2="80" class="image" />
    <line x1="175" y1="50" x2="190" y2="80" class="image" />
    <line x1="175" y1="35" x2="150" y2="25" class="image" />
    <line x1="175" y1="35" x2="200" y2="25" class="image" />
    <!-- Deep hole -->
    <circle cx="175" cy="150" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
  </g>
</svg>