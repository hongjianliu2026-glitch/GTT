<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alternate</text>
  <text x="50" y="120" class="subtitle">[ˈɔːltərnət] v. 交替，轮流；adj. 交替的，间隔的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alter (改变) + -nate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在玩跷跷板，他们"改变(alter)"位置，
    <tspan x="50" dy="25">轮流(alternate)上下，这就是交替的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They alternate shifts to cover the night.
  </text>
  <text x="50" y="310" class="content">
    他们轮流值班来覆盖夜间工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seesaw -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person 1 -->
    <circle cx="100" cy="-50" r="20" class="image" />
    <line x1="100" y1="-30" x2="100" y2="0" class="image" />
    <line x1="100" y1="0" x2="80" y2="20" class="image" />
    <line x1="100" y1="0" x2="120" y2="20" class="image" />
    <!-- Person 2 -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="120" class="image" />
    <line x1="250" y1="100" x2="270" y2="120" class="image" />
  </g>
</svg>