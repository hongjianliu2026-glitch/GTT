<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cider</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪdər] n. 苹果酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cid (切) + er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苹果被"切开(cid)"，果汁流出，
    <tspan x="50" dy="25">这些果汁经过发酵就成了苹果酒(cider)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He enjoys a glass of cider after work.
  </text>
  <text x="50" y="310" class="content">
    他喜欢下班后喝一杯苹果酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apple -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF4500" />
    <!-- Knife -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="200" y2="50" class="image" />
    <line x1="250" y1="100" x2="200" y2="150" class="image" />
    <!-- Juice -->
    <ellipse cx="300" cy="100" rx="20" ry="40" class="image" fill="#FFD700" />
  </g>
</svg>