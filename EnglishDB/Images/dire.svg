<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dire</text>
  <text x="50" y="120" class="subtitle">[ˈdaɪər] adj. 可怕的，极端的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + re (再次)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个可怕的场景，"再次被分开(di-re)"
    <tspan x="50" dy="25">的灾难，让人感到极端的恐惧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The situation was dire, with no hope in sight.
  </text>
  <text x="50" y="310" class="content">
    情况非常糟糕，看不到任何希望。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tornado -->
    <path d="M0 0 C50 100, 150 100, 200 0" class="image" />
    <path d="M200 0 C250 100, 350 100, 400 0" class="image" />
    <!-- House -->
    <rect x="150" y="150" width="100" height="50" class="image" />
    <!-- Roof -->
    <polygon points="150,150 200,100 250,150" class="image" />
    <!-- People -->
    <circle cx="170" cy="180" r="10" class="image" />
    <circle cx="230" cy="180" r="10" class="image" />
    <!-- Fearful expressions -->
    <line x1="165" y1="185" x2="175" y2="195" class="image" />
    <line x1="175" y1="185" x2="165" y2="195" class="image" />
    <line x1="225" y1="185" x2="235" y2="195" class="image" />
    <line x1="235" y1="185" x2="225" y2="195" class="image" />
  </g>
</svg>