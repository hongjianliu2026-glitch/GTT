<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wallpaper</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːlˌpeɪpər] n. 壁纸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wall (墙) + paper (纸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一卷壁纸从天而降，"贴在墙上(wall)"，
    <tspan x="50" dy="25">瞬间变成了一幅美丽的画卷，这就是壁纸(wallpaper)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She chose a floral wallpaper for her bedroom.
  </text>
  <text x="50" y="310" class="content">
    她为卧室选择了一款花卉图案的壁纸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wallpaper -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#F4D03F" />
    <!-- Floral pattern -->
    <circle cx="100" cy="60" r="10" class="image" fill="#8E44AD" />
    <circle cx="150" cy="80" r="10" class="image" fill="#8E44AD" />
    <circle cx="200" cy="60" r="10" class="image" fill="#8E44AD" />
    <circle cx="250" cy="80" r="10" class="image" fill="#8E44AD" />
    <!-- Wallpaper roll -->
    <rect x="300" y="100" width="40" height="80" class="image" fill="#D35400" />
    <line x1="300" y1="100" x2="340" y2="100" class="image" />
    <line x1="300" y1="180" x2="340" y2="180" class="image" />
  </g>
</svg>