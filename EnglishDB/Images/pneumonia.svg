<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pneumonia</text>
  <text x="50" y="120" class="subtitle">[njuːˈmoʊniə] n. 肺炎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pneumo- (肺) + -ia (疾病)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的肺部，"肺(pneumo-)"
    <tspan x="50" dy="25">被病毒入侵，导致"疾病(-ia)"，这就是肺炎(pneumonia)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was hospitalized due to pneumonia.
  </text>
  <text x="50" y="310" class="content">
    他因肺炎住院了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lungs -->
    <path d="M50 50 C100 0, 150 0, 200 50 S300 100, 350 50" class="image" />
    <path d="M50 150 C100 200, 150 200, 200 150 S300 100, 350 150" class="image" />
    <!-- Virus -->
    <circle cx="120" cy="100" r="20" class="image" />
    <circle cx="280" cy="100" r="20" class="image" />
    <circle cx="200" cy="150" r="20" class="image" />
  </g>
</svg>