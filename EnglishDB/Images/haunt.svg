<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">haunt</text>
  <text x="50" y="120" class="subtitle">[hɔːnt] v. 萦绕，常去；n. 常去的地方</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> haun- (家) + -t (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幽灵(ghost)经常"回家(haun-t)"，
    <tspan x="50" dy="25">它总是在某个地方徘徊，这个地方就成了它的常去之地(haunt)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house was haunted by a ghost.
  </text>
  <text x="50" y="310" class="content">
    那座老房子被一个幽灵萦绕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Ghost -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
  </g>
</svg>