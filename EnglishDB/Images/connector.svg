<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">connector</text>
  <text x="50" y="120" class="subtitle">[kəˈnektər] n. 连接器，接头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + nect (连接) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神奇的"连接器(connector)"，它能把两个原本分离的物体"连接(con-nect)"在一起，
    <tspan x="50" dy="25">就像魔术师一样，瞬间让它们紧密相连。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The USB connector allows you to connect your phone to the computer.
  </text>
  <text x="50" y="310" class="content">
    USB连接器可以让你将手机连接到电脑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two separate objects -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="200" y="0" width="100" height="100" class="image" />
    <!-- Connector -->
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <!-- Label -->
    <text x="140" y="180" class="content">Connector</text>
  </g>
</svg>