<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reasonably</text>
  <text x="50" y="120" class="subtitle">[ˈriːznəbli] adv. 合理地，适度地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> reason (理由) + -able (能够) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考，"有理由地(reason-able)"
    <tspan x="50" dy="25">做出合理的决定，这就是合理地(reasonably)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She handled the situation reasonably well.
  </text>
  <text x="50" y="310" class="content">
    她合理地处理了这种情况。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thinking bubble -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <!-- Reasoning person -->
    <circle cx="100" cy="250" r="20" class="image" />
    <line x1="100" y1="270" x2="100" y2="300" class="image" />
    <line x1="100" y1="300" x2="80" y2="330" class="image" />
    <line x1="100" y1="300" x2="120" y2="330" class="image" />
    <line x1="100" y1="280" x2="130" y2="270" class="image" />
  </g>
</svg>