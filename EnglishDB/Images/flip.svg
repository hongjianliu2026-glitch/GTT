<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flip</text>
  <text x="50" y="120" class="subtitle">[flɪp] v. 翻转，轻弹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fl- (飞) + ip (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个硬币在空中"飞(fl-)"起来，然后"翻转(ip)"落地，这就是flip的画面。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He flipped the coin to decide who goes first.
  </text>
  <text x="50" y="310" class="content">
    他抛硬币决定谁先开始。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Coin -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Coin flipping -->
    <line x1="100" y1="100" x2="200" y2="0" class="image" />
    <line x1="200" y1="0" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="100" y2="100" class="image" />
  </g>
</svg>