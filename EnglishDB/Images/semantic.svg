<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">semantic</text>
  <text x="50" y="120" class="subtitle">[sɪˈmæntɪk] adj. 语义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sema (信号) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个语言学家在研究"信号(sema)"的含义，
    <tspan x="50" dy="25">这些信号构成了语言的语义(semantic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The semantic analysis of the text revealed hidden meanings.
  </text>
  <text x="50" y="310" class="content">
    对文本的语义分析揭示了隐藏的含义。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Signal lines -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <!-- Signal dots -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="100" cy="80" r="5" class="image" />
    <circle cx="150" cy="110" r="5" class="image" />
    <circle cx="200" cy="140" r="5" class="image" />
    <!-- Language researcher -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>