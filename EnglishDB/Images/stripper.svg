<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stripper</text>
  <text x="50" y="120" class="subtitle">[ˈstrɪpər] n. 脱衣舞者，剥离器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> strip (剥去) + -er (人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个脱衣舞者在舞台上，"剥去(strip)"
    <tspan x="50" dy="25">她的衣服，每剥去一层，观众就更加兴奋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stripper performed an impressive routine.
  </text>
  <text x="50" y="310" class="content">
    脱衣舞者表演了一段令人印象深刻的舞蹈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stripper -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="125" y2="140" class="image" />
    <line x1="175" y1="150" x2="225" y2="140" class="image" />
    <!-- Clothes -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="130" class="image" />
    <line x1="200" y1="100" x2="200" y2="130" class="image" />
    <line x1="150" y1="130" x2="200" y2="130" class="image" />
  </g>
</svg>