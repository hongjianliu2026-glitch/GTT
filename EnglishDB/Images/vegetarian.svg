<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vegetarian</text>
  <text x="50" y="120" class="subtitle">[ˌvedʒəˈteriən] n. 素食者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> veget (植物) + -arian (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个素食者站在一片绿油油的菜园里，"只吃植物(veget)"，
    <tspan x="50" dy="25">不吃肉类，这就是素食者(vegetarian)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She became a vegetarian after watching a documentary about animal welfare.
  </text>
  <text x="50" y="310" class="content">
    她看完一部关于动物福利的纪录片后成为了素食者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vegetables -->
    <circle cx="50" cy="100" r="30" class="image" fill="#82E0AA" /> <!-- Green pepper -->
    <rect x="100" y="70" width="40" height="60" class="image" fill="#F4D03F" /> <!-- Carrot -->
    <circle cx="170" cy="100" r="25" class="image" fill="#85C1E9" /> <!-- Tomato -->
    <!-- Vegetarian -->
    <circle cx="250" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="250" y1="120" x2="250" y2="160" class="image" /> <!-- Body -->
    <line x1="250" y1="160" x2="230" y2="200" class="image" /> <!-- Left arm -->
    <line x1="250" y1="160" x2="270" y2="200" class="image" /> <!-- Right arm -->
    <line x1="250" y1="160" x2="230" y2="180" class="image" /> <!-- Left leg -->
    <line x1="250" y1="160" x2="270" y2="180" class="image" /> <!-- Right leg -->
  </g>
</svg>