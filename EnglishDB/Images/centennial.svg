<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">centennial</text>
  <text x="50" y="120" class="subtitle">[sɛnˈtɛnɪəl] n. 百年纪念</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cent (百) + ann (年) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕上插满了100根蜡烛，每根蜡烛代表一年，
    <tspan x="50" dy="25">这个蛋糕就是"百年纪念(centennial)"的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city celebrated its centennial with a grand parade.
  </text>
  <text x="50" y="310" class="content">
    这座城市以盛大的游行庆祝了它的百年纪念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Candles -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="80" y1="20" x2="80" y2="100" class="image" />
    <line x1="110" y1="20" x2="110" y2="100" class="image" />
    <line x1="140" y1="20" x2="140" y2="100" class="image" />
    <line x1="170" y1="20" x2="170" y2="100" class="image" />
    <line x1="200" y1="20" x2="200" y2="100" class="image" />
    <line x1="230" y1="20" x2="230" y2="100" class="image" />
    <line x1="260" y1="20" x2="260" y2="100" class="image" />
    <line x1="290" y1="20" x2="290" y2="100" class="image" />
    <line x1="320" y1="20" x2="320" y2="100" class="image" />
    <!-- Cake top -->
    <rect x="30" y="100" width="300" height="50" class="image" />
  </g>
</svg>