<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sensation</text>
  <text x="50" y="120" class="subtitle">[sɛnˈseɪʃən] n. 感觉，轰动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sens (感觉) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"感觉(sens)"球，
    <tspan x="50" dy="25">它爆炸后产生的冲击波引起了巨大的轰动(sensation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new product created a sensation in the market.
  </text>
  <text x="50" y="310" class="content">
    这款新产品在市场上引起了轰动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sensation ball -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Explosion lines -->
    <line x1="100" y1="50" x2="150" y2="0" class="image" />
    <line x1="150" y1="50" x2="200" y2="0" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <line x1="150" y1="150" x2="200" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="50" class="image" />
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
  </g>
</svg>