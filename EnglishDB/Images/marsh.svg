<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .grass { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marsh</text>
  <text x="50" y="120" class="subtitle">[mɑːrʃ] n. 沼泽，湿地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> marsh (沼泽)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片"沼泽(marsh)"，水草交织，
    <tspan x="50" dy="25">一只小鸟在湿地上空盘旋，寻找落脚之地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The explorers got lost in the marsh.
  </text>
  <text x="50" y="310" class="content">
    探险家们在沼泽中迷路了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Marsh -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <rect x="0" y="100" width="350" height="100" class="grass" />
    <!-- Bird -->
    <circle cx="50" cy="50" r="10" class="image" />
    <line x1="50" y1="60" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="40" y2="100" class="image" />
    <line x1="50" y1="80" x2="60" y2="100" class="image" />
    <line x1="50" y1="70" x2="30" y2="60" class="image" />
    <line x1="50" y1="70" x2="70" y2="60" class="image" />
  </g>
</svg>