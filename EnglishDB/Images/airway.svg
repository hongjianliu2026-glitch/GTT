<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">airway</text>
  <text x="50" y="120" class="subtitle">[ˈɛrˌweɪ] n. 航道，气道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> air (空气) + way (道路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机在空中飞行，"空气中的道路(air-way)"
    <tspan x="50" dy="25">就是它的航道(airway)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pilot followed the airway to avoid turbulence.
  </text>
  <text x="50" y="310" class="content">
    飞行员沿着航道飞行以避免湍流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airplane -->
    <line x1="0" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="120" y2="80" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
    <line x1="120" y1="80" x2="140" y2="100" class="image" />
    <line x1="120" y1="120" x2="140" y2="100" class="image" />
    <line x1="140" y1="100" x2="200" y2="100" class="image" />
    <!-- Airway -->
    <line x1="0" y1="150" x2="200" y2="150" class="image" />
    <line x1="0" y1="160" x2="200" y2="160" class="image" />
    <line x1="0" y1="170" x2="200" y2="170" class="image" />
    <line x1="0" y1="180" x2="200" y2="180" class="image" />
  </g>
</svg>