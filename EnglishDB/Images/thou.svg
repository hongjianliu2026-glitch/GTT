<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thou</text>
  <text x="50" y="120" class="subtitle">[ðaʊ] pron. 你（古英语中的第二人称单数主格）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thou (古英语中的“你”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的骑士对“你(thou)”说：
    <tspan x="50" dy="25">“Thou art brave!”（你很勇敢！）</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Thou shalt not steal.
  </text>
  <text x="50" y="310" class="content">
    你不应该偷窃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Knight -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Sword -->
    <line x1="50" y1="120" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="30" y2="60" class="image" />
    <line x1="50" y1="80" x2="70" y2="60" class="image" />
    <!-- Speech bubble -->
    <path d="M100,80 Q150,80 150,120 Q150,160 100,160 Q50,160 50,120 Q50,80 100,80" class="image" />
    <text x="110" y="130" class="content">Thou art brave!</text>
  </g>
</svg>