<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tangible</text>
  <text x="50" y="120" class="subtitle">[ˈtændʒəbl] adj. 可触摸的，有形的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tang (接触) + -ible (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手，"接触(tang)"
    <tspan x="50" dy="25">并抓住了一个有形的物体，这个物体是</tspan>
    <tspan x="50" dy="25">可以被触摸的(tangible)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The benefits of the new system are tangible.
  </text>
  <text x="50" y="310" class="content">
    新系统的益处是显而易见的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant hand -->
    <path d="M 0 100 C 50 50, 150 50, 200 100 L 200 200 L 0 200 Z" class="image" />
    <!-- Tangible object -->
    <rect x="100" y="120" width="50" height="50" class="image" />
    <!-- Touching line -->
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
  </g>
</svg>