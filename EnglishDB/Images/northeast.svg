<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">northeast</text>
  <text x="50" y="120" class="subtitle">[ˌnɔːrθˈiːst] n. 东北；adj. 东北的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> north (北) + east (东)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指南针，指针指向"北(north)"和"东(east)"的交界处，
    <tspan x="50" dy="25">这就是东北(northeast)的方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wind is blowing from the northeast.
  </text>
  <text x="50" y="310" class="content">
    风从东北方向吹来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compass -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- North arrow -->
    <line x1="175" y1="20" x2="175" y2="100" class="image" />
    <polygon points="175,20 165,50 185,50" class="image" />
    <!-- East arrow -->
    <line x1="260" y1="100" x2="175" y2="100" class="image" />
    <polygon points="260,100 230,90 230,110" class="image" />
    <!-- Northeast arrow -->
    <line x1="225" y1="55" x2="175" y2="100" class="image" />
    <polygon points="225,55 210,70 240,70" class="image" />
  </g>
</svg>