<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grandma</text>
  <text x="50" y="120" class="subtitle">[ˈɡrændmə] n. 奶奶，外婆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grand (大) + ma (妈妈)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"妈妈(ma)"，她就是你的"奶奶(grandma)"，
    <tspan x="50" dy="25">她总是给你大大的拥抱和无尽的爱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My grandma bakes the best cookies in the world.
  </text>
  <text x="50" y="310" class="content">
    我奶奶烤的饼干是世界上最好吃的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Grandma -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- Hugging -->
    <line x1="100" y1="250" x2="0" y2="200" class="image" />
    <line x1="100" y1="250" x2="200" y2="200" class="image" />
  </g>
</svg>