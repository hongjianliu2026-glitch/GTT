<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .chlorine { fill: #FFFF00; }
      .element { fill: #00FF00; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chloride</text>
  <text x="50" y="120" class="subtitle">[ˈklɔːraɪd] n. 氯化物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chlor- (氯) + -ide (表示化合物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个实验室里，科学家正在处理"氯(chlor-)"
    <tspan x="50" dy="25">和另一种元素结合形成的化合物，这就是氯化物(chloride)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Sodium chloride is commonly known as table salt.
  </text>
  <text x="50" y="310" class="content">
    氯化钠就是我们常说的食盐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chlorine atom -->
    <circle cx="50" cy="100" r="30" class="chlorine" />
    <text x="40" y="110" class="element">Cl</text>
    <!-- Plus sign -->
    <text x="100" y="100" class="content">+</text>
    <!-- Another element -->
    <circle cx="150" cy="100" r="30" class="element" />
    <text x="140" y="110" class="element">Na</text>
    <!-- Equals sign -->
    <text x="200" y="100" class="content">=</text>
    <!-- Chloride molecule -->
    <circle cx="250" cy="100" r="30" class="chlorine" />
    <text x="240" y="110" class="element">NaCl</text>
  </g>
</svg>