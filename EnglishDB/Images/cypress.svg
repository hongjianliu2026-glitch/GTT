<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cypress</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪprɛs] n. 柏树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cypr- (来自Cyprus, 塞浦路斯) + -ess (表示“树”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵高大的柏树(cypress)，它生长在塞浦路斯(Cyprus)，
    <tspan x="50" dy="25">象征着永恒和不朽，就像它的名字一样，让人联想到古老的文明和历史。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cypress trees lined the ancient path, whispering secrets of the past.
  </text>
  <text x="50" y="310" class="content">
    柏树排列在古老的小径旁，低语着过去的秘密。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree trunk -->
    <rect x="150" y="100" width="20" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="160" y1="100" x2="100" y2="50" class="image" />
    <line x1="160" y1="100" x2="220" y2="50" class="image" />
    <line x1="160" y1="150" x2="100" y2="100" class="image" />
    <line x1="160" y1="150" x2="220" y2="100" class="image" />
    <line x1="160" y1="200" x2="100" y2="150" class="image" />
    <line x1="160" y1="200" x2="220" y2="150" class="image" />
    <!-- Leaves -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="220" cy="50" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="220" cy="150" r="10" class="image" />
  </g>
</svg>