<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pain</text>
  <text x="50" y="120" class="subtitle">[peɪn] n. 疼痛，痛苦；v. 使痛苦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "poena" (惩罚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为犯错而受到"惩罚(poena)"，
    <tspan x="50" dy="25">这种惩罚带来的"疼痛(pain)"让他铭记于心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The injury caused him a great deal of pain.
  </text>
  <text x="50" y="310" class="content">
    这个伤让他非常痛苦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Pain expression -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="40" y1="90" x2="35" y2="85" class="image" />
    <line x1="60" y1="90" x2="65" y2="85" class="image" />
    <line x1="45" y1="110" x2="55" y2="110" class="image" />
    <line x1="45" y1="110" x2="40" y2="105" class="image" />
    <line x1="55" y1="110" x2="60" y2="105" class="image" />
  </g>
</svg>