<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wayside</text>
  <text x="50" y="120" class="subtitle">[ˈweɪsaɪd] n. 路边</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> way (路) + side (边)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在一条宽阔的公路上行驶，突然停在了"路边(wayside)"，
    <tspan x="50" dy="25">司机下车欣赏路边的风景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They found a beautiful flower by the wayside.
  </text>
  <text x="50" y="310" class="content">
    他们在路边发现了一朵美丽的花。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Road -->
    <rect x="0" y="100" width="350" height="20" class="image" />
    <!-- Car -->
    <rect x="50" y="70" width="50" height="30" class="image" />
    <rect x="60" y="60" width="30" height="10" class="image" />
    <!-- Wheels -->
    <circle cx="65" cy="100" r="10" class="image" />
    <circle cx="115" cy="100" r="10" class="image" />
    <!-- Wayside -->
    <rect x="0" y="120" width="350" height="100" class="image" />
    <!-- Flower -->
    <circle cx="200" cy="160" r="10" class="image" />
    <line x1="200" y1="170" x2="200" y2="190" class="image" />
    <line x1="200" y1="180" x2="190" y2="170" class="image" />
    <line x1="200" y1="180" x2="210" y2="170" class="image" />
  </g>
</svg>