<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3F51B5; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">introspective</text>
  <text x="50" y="120" class="subtitle">[ˌɪntrəˈspɛktɪv] adj. 内省的，反省的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> intro- (向内) + spect (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人闭上眼睛，"向内看(intro-spect)"
    <tspan x="50" dy="25">自己的内心世界，进行深刻的自我反省(introspective)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent the evening in introspective silence.
  </text>
  <text x="50" y="310" class="content">
    她整个晚上都在静静地反省。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with closed eyes -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="40" y1="40" x2="60" y2="40" class="image" />
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <!-- Heart symbol -->
    <path d="M100,50 C100,20 150,20 150,50 C150,80 100,80 100,50 Z" class="image" />
    <!-- Arrow pointing inward -->
    <line x1="75" y1="50" x2="125" y2="50" class="image" />
    <polygon points="125,50 120,45 120,55" class="image" />
  </g>
</svg>