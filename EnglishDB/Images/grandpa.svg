<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grandpa</text>
  <text x="50" y="120" class="subtitle">[ˈɡrændpɑː] n. 爷爷，外公</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grand- (大的) + pa (爸爸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的(grand)爸爸(pa)，
    <tspan x="50" dy="25">他坐在摇椅上，给你讲故事，这就是你的爷爷(grandpa)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My grandpa always tells me stories before bedtime.
  </text>
  <text x="50" y="310" class="content">
    我爷爷总是在睡前给我讲故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grandpa -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <!-- Chair -->
    <rect x="20" y="180" width="60" height="20" class="image" />
    <line x1="20" y1="180" x2="80" y2="180" class="image" />
    <line x1="20" y1="200" x2="80" y2="200" class="image" />
  </g>
</svg>