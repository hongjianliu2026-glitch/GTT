<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tearful</text>
  <text x="50" y="120" class="subtitle">[ˈtɪərfl̩] adj. 含泪的，泪汪汪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tear (眼泪) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人眼中充满了泪水，"充满(ful)眼泪(tear)"，
    <tspan x="50" dy="25">整个画面都被泪水浸湿，这就是tearful的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked tearful as she said goodbye.
  </text>
  <text x="50" y="310" class="content">
    她含泪告别。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="80" r="10" class="image" />
    <circle cx="125" cy="80" r="10" class="image" />
    <!-- Tears -->
    <line x1="75" y1="90" x2="75" y2="150" class="image" />
    <line x1="125" y1="90" x2="125" y2="150" class="image" />
    <!-- Drops -->
    <circle cx="75" cy="160" r="5" class="image" />
    <circle cx="125" cy="160" r="5" class="image" />
  </g>
</svg>