<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">someday</text>
  <text x="50" y="120" class="subtitle">[ˈsʌmdeɪ] adv. 有朝一日，总有一天</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> some (一些) + day (天)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满希望的未来，"有一天(some day)"
    <tspan x="50" dy="25">你会实现你的梦想，这一天终将到来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Someday, I will travel around the world.
  </text>
  <text x="50" y="310" class="content">
    总有一天，我会环游世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F39C12" />
    <!-- Clouds -->
    <ellipse cx="150" cy="50" rx="60" ry="30" fill="#ECF0F1" />
    <ellipse cx="220" cy="70" rx="50" ry="25" fill="#ECF0F1" />
    <!-- Horizon -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <!-- Path -->
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="280" y2="180" class="image" />
    <line x1="280" y1="180" x2="260" y2="200" class="image" />
    <!-- Person -->
    <circle cx="70" cy="180" r="15" fill="#2C3E50" />
    <line x1="70" y1="195" x2="70" y2="220" class="image" />
    <line x1="70" y1="220" x2="50" y2="250" class="image" />
    <line x1="70" y1="220" x2="90" y2="250" class="image" />
    <line x1="70" y1="210" x2="100" y2="200" class="image" />
  </g>
</svg>