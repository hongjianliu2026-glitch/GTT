<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">instant</text>
  <text x="50" y="120" class="subtitle">[ˈɪnstənt] adj. 立即的，瞬间的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + st (站立) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师挥动魔杖，"瞬间(instant)"
    <tspan x="50" dy="25">变出一只兔子，一切都发生在眨眼之间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coffee was instant, so it was ready in a moment.
  </text>
  <text x="50" y="310" class="content">
    这咖啡是速溶的，所以很快就准备好了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magic wand -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Rabbit -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="190" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
  </g>
</svg>