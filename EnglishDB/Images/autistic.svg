<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">autistic</text>
  <text x="50" y="120" class="subtitle">[ɔːˈtɪstɪk] adj. 自闭症的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auto- (自己) + istic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子独自坐在角落，沉浸在自己的世界里，"自己(auto-)"
    <tspan x="50" dy="25">与外界隔绝，表现出自闭症(autistic)的特征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher used special methods to help autistic students.
  </text>
  <text x="50" y="310" class="content">
    老师使用特殊方法帮助自闭症学生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child sitting in a corner -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Isolated world -->
    <circle cx="150" cy="100" r="50" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="240" class="image" />
    <line x1="150" y1="200" x2="170" y2="240" class="image" />
    <line x1="150" y1="170" x2="180" y2="160" class="image" />
    <!-- Connecting line -->
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
  </g>
</svg>