<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subscription</text>
  <text x="50" y="120" class="subtitle">[səbˈskrɪpʃn] n. 订阅，订购</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + script (写) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在一张纸上"写下(script)"自己的名字，
    <tspan x="50" dy="25">表示他"在下面(sub-)"订阅了某个服务或产品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a subscription to the magazine.
  </text>
  <text x="50" y="310" class="content">
    她订阅了那本杂志。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Signature -->
    <text x="50" y="100" class="image" style="font: bold 36px serif; fill: #2C3E50;">John Doe</text>
    <!-- Subscription text -->
    <text x="50" y="150" class="image" style="font: 24px serif; fill: #34495E;">Subscription to Magazine</text>
  </g>
</svg>