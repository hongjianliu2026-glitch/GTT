<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antiseptic</text>
  <text x="50" y="120" class="subtitle">[ˌæntɪˈseptɪk] n. 防腐剂，抗菌剂；adj. 防腐的，抗菌的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (反对) + sept (腐烂) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生拿着一瓶"抗腐烂(anti-septic)"的药水，
    <tspan x="50" dy="25">喷洒在伤口上，防止细菌滋生，保持伤口清洁。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nurse applied an antiseptic to the wound before bandaging it.
  </text>
  <text x="50" y="310" class="content">
    护士在包扎伤口前使用了抗菌剂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Liquid -->
    <rect x="10" y="10" width="80" height="180" class="image" fill="#85C1E9" />
    <!-- Spray -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="40" y1="220" x2="60" y2="220" class="image" />
    <line x1="30" y1="230" x2="70" y2="230" class="image" />
    <line x1="20" y1="240" x2="80" y2="240" class="image" />
    <!-- Doctor -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Wound -->
    <rect x="200" y="100" width="50" height="50" class="image" fill="#E74C3C" />
  </g>
</svg>