<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">protein</text>
  <text x="50" y="120" class="subtitle">[ˈproʊtiːn] n. 蛋白质</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prot (第一) + -ein (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象蛋白质是身体的"第一(prot)"建筑材料，
    <tspan x="50" dy="25">它们构建了我们的肌肉、皮肤和器官，就像</tspan>
    <tspan x="50" dy="25">建筑师用砖块建造房屋一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Eating protein-rich foods helps build muscle.
  </text>
  <text x="50" y="310" class="content">
    吃富含蛋白质的食物有助于增肌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Muscle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <!-- Protein molecule -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="110" y1="100" x2="140" y2="100" class="image" />
    <line x1="160" y1="100" x2="190" y2="100" class="image" />
    <line x1="100" y1="90" x2="150" y2="90" class="image" />
    <line x1="150" y1="90" x2="200" y2="90" class="image" />
  </g>
</svg>