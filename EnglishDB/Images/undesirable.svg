<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undesirable</text>
  <text x="50" y="120" class="subtitle">[ˌʌndɪˈzaɪərəbl] adj. 不受欢迎的，令人不快的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + desire (渴望) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"不渴望(un-desire)"的东西，
    <tspan x="50" dy="25">它自然就是"令人不快的(undesirable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smell of rotten eggs is undesirable.
  </text>
  <text x="50" y="310" class="content">
    腐烂的鸡蛋的气味令人不快。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rotten egg -->
    <circle cx="100" cy="100" r="50" class="image" fill="#D35400" />
    <circle cx="120" cy="80" r="10" class="image" fill="#8B4513" />
    <circle cx="80" cy="120" r="10" class="image" fill="#8B4513" />
    <circle cx="140" cy="120" r="10" class="image" fill="#8B4513" />
    <circle cx="100" cy="140" r="10" class="image" fill="#8B4513" />
    <!-- Cross -->
    <line x1="70" y1="70" x2="130" y2="130" class="image" stroke-width="5" stroke="#E74C3C" />
    <line x1="70" y1="130" x2="130" y2="70" class="image" stroke-width="5" stroke="#E74C3C" />
  </g>
</svg>