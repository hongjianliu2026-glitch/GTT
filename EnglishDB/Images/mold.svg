<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mold</text>
  <text x="50" y="120" class="subtitle">[məʊld] n. 模具，霉菌；v. 塑造，形成</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mold (形状，形式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个陶艺家在工作室里，用手中的泥土"塑造(mold)"
    <tspan x="50" dy="25">出一个精美的花瓶，这个过程就是mold的生动体现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sculptor molded the clay into a beautiful statue.
  </text>
  <text x="50" y="310" class="content">
    雕塑家将泥土塑造成了一尊美丽的雕像。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pottery wheel -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Clay -->
    <ellipse cx="100" cy="150" rx="40" ry="20" class="image" />
    <!-- Hands -->
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <!-- Vase -->
    <rect x="80" y="160" width="40" height="80" class="image" />
    <line x1="80" y1="160" x2="120" y2="160" class="image" />
    <line x1="80" y1="240" x2="120" y2="240" class="image" />
  </g>
</svg>