<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">silicone</text>
  <text x="50" y="120" class="subtitle">[ˈsɪlɪkoʊn] n. 硅树脂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sili- (硅) + cone (树脂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的硅(sili-)树脂(cone)球，
    <tspan x="50" dy="25">它像一个柔软的弹力球，可以随意变形。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kitchen utensils are made of silicone.
  </text>
  <text x="50" y="310" class="content">
    这些厨房用具是用硅树脂制成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Silicone ball -->
    <circle cx="100" cy="100" r="80" class="image" fill="#E0E0E0" />
    <!-- Deformation lines -->
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="60" y1="60" x2="140" y2="140" class="image" />
    <line x1="60" y1="140" x2="140" y2="60" class="image" />
  </g>
</svg>