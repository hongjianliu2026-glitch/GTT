<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ball { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">globular</text>
  <text x="50" y="120" class="subtitle">[ˈɡlɒbjələr] adj. 球形的，球状的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glob (球) + -ular (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"球(glob)"，它像太阳一样"球状(ular)"，
    <tspan x="50" dy="25">照亮了整个宇宙，这就是globular的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The globular cluster is a beautiful sight in the night sky.
  </text>
  <text x="50" y="310" class="content">
    球状星团在夜空中是一道美丽的风景。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="80" class="ball" />
    <!-- Rays -->
    <line x1="100" y1="20" x2="100" y2="0" class="image" />
    <line x1="180" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="20" y1="100" x2="0" y2="100" class="image" />
    <!-- Globe -->
    <circle cx="300" cy="100" r="50" class="ball" />
    <!-- Globe lines -->
    <line x1="300" y1="50" x2="300" y2="150" class="image" />
    <line x1="250" y1="100" x2="350" y2="100" class="image" />
  </g>
</svg>