<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .butter { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">butter</text>
  <text x="50" y="120" class="subtitle">[ˈbʌtər] n. 黄油</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> butyrum (拉丁语，意为黄油)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在清晨，从奶牛身上挤出牛奶，然后经过搅拌，牛奶变成了金黄色的黄油(butter)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spread butter on her toast.
  </text>
  <text x="50" y="310" class="content">
    她在吐司上涂了黄油。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cow -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="180" class="image" />
    <line x1="100" y1="200" x2="150" y2="180" class="image" />

    <!-- Butter -->
    <rect x="200" y="100" width="100" height="50" class="butter" />
    <text x="220" y="130" class="content">Butter</text>
  </g>
</svg>