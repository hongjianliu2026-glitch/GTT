<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">timeless</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪmlɪs] adj. 永恒的，不受时间影响的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> time (时间) + -less (无，没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的时钟，"没有时间(time-less)"
    <tspan x="50" dy="25">的限制，它永远在转动，象征着永恒(timeless)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Pyramids of Giza are a timeless wonder.
  </text>
  <text x="50" y="310" class="content">
    吉萨金字塔是一个永恒的奇迹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Eternal symbol -->
    <circle cx="175" cy="100" r="5" class="image" />
    <text x="160" y="220" class="content">永恒</text>
  </g>
</svg>