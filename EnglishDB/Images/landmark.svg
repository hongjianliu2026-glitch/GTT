<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">landmark</text>
  <text x="50" y="120" class="subtitle">[ˈlændmɑːrk] n. 地标，里程碑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> land (土地) + mark (标记)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"标记(mark)"矗立在"土地(land)"上，
    <tspan x="50" dy="25">这个标记就是地标(landmark)，指引着人们的方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Eiffel Tower is a famous landmark in Paris.
  </text>
  <text x="50" y="310" class="content">
    埃菲尔铁塔是巴黎的一个著名地标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Land -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Mark -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <!-- Arrow -->
    <line x1="175" y1="50" x2="175" y2="20" class="image" />
    <line x1="175" y1="20" x2="165" y2="30" class="image" />
    <line x1="175" y1="20" x2="185" y2="30" class="image" />
  </g>
</svg>