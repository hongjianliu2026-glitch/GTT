<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">one-way</text>
  <text x="50" y="120" class="subtitle">[ˈwʌn ˈweɪ] adj. 单向的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> one (一) + way (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条只有"一条路(one-way)"的街道，
    <tspan x="50" dy="25">车辆只能朝一个方向行驶，这就是单向的(one-way)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The street is marked as one-way.
  </text>
  <text x="50" y="310" class="content">
    这条街道被标记为单向道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <polygon points="300,50 280,30 280,70" class="image" />
    <!-- Car -->
    <rect x="100" y="20" width="50" height="30" class="image" />
    <circle cx="120" cy="60" r="10" class="image" />
    <circle cx="180" cy="60" r="10" class="image" />
  </g>
</svg>