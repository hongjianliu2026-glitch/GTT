<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nationalist</text>
  <text x="50" y="120" class="subtitle">[ˈnæʃnəlɪst] n. 民族主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nation (国家) + -al (形容词后缀) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"民族主义者(nationalist)"站在高台上，
    <tspan x="50" dy="25">挥舞着国旗，高呼爱国口号，表达对国家的深厚感情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nationalist movement gained momentum in the 20th century.
  </text>
  <text x="50" y="310" class="content">
    民族主义运动在20世纪获得了动力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Flag -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <line x1="175" y1="50" x2="175" y2="0" class="image" />
    <!-- Stars on the flag -->
    <circle cx="160" cy="60" r="5" class="image" fill="#FFFFFF" />
    <circle cx="190" cy="60" r="5" class="image" fill="#FFFFFF" />
    <circle cx="160" cy="80" r="5" class="image" fill="#FFFFFF" />
    <circle cx="190" cy="80" r="5" class="image" fill="#FFFFFF" />
  </g>
</svg>