<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">opiate</text>
  <text x="50" y="120" class="subtitle">[ˈoʊpiət] n. 鸦片制剂，镇静剂；v. 使麻木，使镇静</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> opi (鸦片) + -ate (表示“具有...性质的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的人躺在床上，"服用(opi-ate)"
    <tspan x="50" dy="25">鸦片制剂，瞬间感到麻木和镇静，进入了梦乡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor prescribed an opiate to help her sleep.
  </text>
  <text x="50" y="310" class="content">
    医生开了镇静剂帮助她入睡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pill -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="170" y2="140" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
    <!-- Zzz -->
    <text x="250" y="80" class="content">Zzz</text>
  </g>
</svg>