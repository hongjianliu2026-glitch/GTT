<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orchestral</text>
  <text x="50" y="120" class="subtitle">[ɔːˈkɛstrəl] adj. 管弦乐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> orche- (舞蹈) + -stral (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的管弦乐队，"舞蹈(orche-)"
    <tspan x="50" dy="25">般的旋律在空中飘扬，这就是管弦乐(orchestral)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The symphony orchestra played an orchestral piece.
  </text>
  <text x="50" y="310" class="content">
    交响乐团演奏了一首管弦乐曲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Music stand -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Violin -->
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="20" x2="150" y2="120" class="image" />
    <!-- Cello -->
    <line x1="200" y1="20" x2="300" y2="20" class="image" />
    <line x1="200" y1="20" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="300" y2="120" class="image" />
    <line x1="300" y1="20" x2="300" y2="120" class="image" />
    <!-- Music notes -->
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="250" cy="70" r="10" class="image" />
    <circle cx="100" cy="90" r="10" class="image" />
    <circle cx="250" cy="90" r="10" class="image" />
  </g>
</svg>