<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gripping</text>
  <text x="50" y="120" class="subtitle">[ˈɡrɪpɪŋ] adj. 引人入胜的，扣人心弦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grip (抓住) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一部电影，"抓住(grip)"
    <tspan x="50" dy="25">观众的心，让他们无法移开视线，这就是引人入胜的(gripping)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was so gripping that I couldn't stop watching.
  </text>
  <text x="50" y="310" class="content">
    这部电影如此扣人心弦，我无法停止观看。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Movie screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Audience -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Gripping hands -->
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="300" y2="120" class="image" />
    <!-- Gripping text -->
    <text x="150" y="160" class="content" text-anchor="middle">Gripping</text>
  </g>
</svg>