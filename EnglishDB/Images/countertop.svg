<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">countertop</text>
  <text x="50" y="120" class="subtitle">[ˈkaʊntərtɑp] n. 台面，柜台面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> counter- (对面) + top (顶部)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨房里，"对面(counter-)"的"顶部(top)"
    <tspan x="50" dy="25">是一个平坦的工作面，这就是台面(countertop)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She placed the cutting board on the countertop.
  </text>
  <text x="50" y="310" class="content">
    她把切菜板放在了台面上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Countertop -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Sink -->
    <rect x="50" y="10" width="50" height="80" class="image" />
    <!-- Stove -->
    <rect x="150" y="10" width="50" height="80" class="image" />
    <!-- Kitchen items -->
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="270" cy="50" r="10" class="image" />
    <circle cx="290" cy="50" r="10" class="image" />
  </g>
</svg>