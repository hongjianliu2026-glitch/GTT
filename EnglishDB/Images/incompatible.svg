<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incompatible</text>
  <text x="50" y="120" class="subtitle">[ˌɪnkəmˈpætəbl] adj. 不兼容的，不相容的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + compat (适合) + -ible (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个形状完全不同的拼图块，"不适合(in-compat)"
    <tspan x="50" dy="25">在一起，它们就是不兼容的(incompatible)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new software is incompatible with the old operating system.
  </text>
  <text x="50" y="310" class="content">
    新软件与旧操作系统不兼容。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <path d="M50 50 L100 50 L100 100 L50 100 Z" class="image" />
    <path d="M150 50 L200 50 L200 100 L150 100 Z" class="image" />
    <!-- Crossed out -->
    <line x1="50" y1="50" x2="200" y2="100" class="image" />
    <line x1="50" y1="100" x2="200" y2="50" class="image" />
  </g>
</svg>