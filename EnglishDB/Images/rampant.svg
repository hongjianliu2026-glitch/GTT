<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rampant</text>
  <text x="50" y="120" class="subtitle">[ˈræmpənt] adj. 猖獗的，蔓延的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ramp (蔓延) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片野草"蔓延(ramp)"得无法控制，
    <tspan x="50" dy="25">就像病毒一样"猖獗(rampant)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The disease became rampant in the village.
  </text>
  <text x="50" y="310" class="content">
    这种疾病在村庄里猖獗蔓延。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rampant grass -->
    <line x1="50" y1="20" x2="70" y2="50" class="image" />
    <line x1="70" y1="50" x2="90" y2="20" class="image" />
    <line x1="100" y1="20" x2="120" y2="50" class="image" />
    <line x1="120" y1="50" x2="140" y2="20" class="image" />
    <line x1="150" y1="20" x2="170" y2="50" class="image" />
    <line x1="170" y1="50" x2="190" y2="20" class="image" />
    <line x1="200" y1="20" x2="220" y2="50" class="image" />
    <line x1="220" y1="50" x2="240" y2="20" class="image" />
    <line x1="250" y1="20" x2="270" y2="50" class="image" />
    <line x1="270" y1="50" x2="290" y2="20" class="image" />
    <!-- Virus symbol -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="80" x2="175" y2="120" class="image" />
    <line x1="155" y1="100" x2="195" y2="100" class="image" />
    <line x1="165" y1="90" x2="185" y2="110" class="image" />
    <line x1="165" y1="110" x2="185" y2="90" class="image" />
  </g>
</svg>