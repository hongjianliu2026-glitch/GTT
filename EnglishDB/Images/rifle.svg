<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rifle</text>
  <text x="50" y="120" class="subtitle">[ˈraɪfəl] n. 步枪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rif (撕裂) + le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把步枪，它的子弹能够"撕裂(rif)"空气，
    <tspan x="50" dy="25">快速穿过目标，就像一个小型的撕裂者(rifle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldier aimed his rifle at the target.
  </text>
  <text x="50" y="310" class="content">
    士兵用步枪瞄准了目标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rifle -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <rect x="50" y="10" width="250" height="30" class="image" />
    <rect x="300" y="10" width="40" height="30" class="image" />
    <!-- Trigger -->
    <rect x="320" y="20" width="10" height="10" class="image" />
    <!-- Bullet -->
    <line x1="350" y1="25" x2="400" y2="25" class="image" />
    <!-- Target -->
    <circle cx="450" cy="25" r="20" class="image" />
  </g>
</svg>