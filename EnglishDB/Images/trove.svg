<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trove</text>
  <text x="50" y="120" class="subtitle">[troʊv] n. 宝库，珍藏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trov (发现) + -e (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在古老的洞穴中，"发现(trov)"
    <tspan x="50" dy="25">一个装满宝藏的箱子，这个箱子就是他的宝库(trove)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The museum's trove of ancient artifacts is fascinating.
  </text>
  <text x="50" y="310" class="content">
    博物馆的古代文物珍藏令人着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cave entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Treasure chest -->
    <rect x="150" y="50" width="100" height="80" class="image" />
    <!-- Treasure -->
    <circle cx="170" cy="90" r="10" class="image" />
    <circle cx="190" cy="90" r="10" class="image" />
    <circle cx="210" cy="90" r="10" class="image" />
    <!-- Explorer -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>