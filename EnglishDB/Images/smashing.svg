<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smashing</text>
  <text x="50" y="120" class="subtitle">[ˈsmæʃɪŋ] adj. 极好的，非常成功的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smash (打碎) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"打碎(smash)"了一堵墙，
    <tspan x="50" dy="25">墙后露出了一片金光闪闪的宝藏，这就是"极好的(smashing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The party was smashing, everyone had a great time.
  </text>
  <text x="50" y="310" class="content">
    派对非常成功，每个人都玩得很开心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <line x1="0" y1="0" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="70" y2="30" class="image" />
    <line x1="70" y1="30" x2="90" y2="50" class="image" />
    <line x1="90" y1="50" x2="140" y2="0" class="image" />
    <!-- Wall -->
    <rect x="150" y="0" width="200" height="150" class="image" />
    <!-- Broken wall -->
    <line x1="160" y1="10" x2="200" y2="140" class="image" />
    <line x1="180" y1="10" x2="220" y2="140" class="image" />
    <line x1="200" y1="10" x2="240" y2="140" class="image" />
    <!-- Treasure -->
    <circle cx="300" cy="75" r="20" class="image" fill="#FFD700" />
    <circle cx="320" cy="75" r="20" class="image" fill="#FFD700" />
    <circle cx="340" cy="75" r="20" class="image" fill="#FFD700" />
  </g>
</svg>