<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feel</text>
  <text x="50" y="120" class="subtitle">[fiːl] v. 感觉，触摸；n. 感觉，触觉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fe- (来自拉丁语 "feel"，意为触摸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手轻轻地"触摸(fe-)"
    <tspan x="50" dy="25">一片柔软的羽毛，这种触感就是"感觉(feel)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt the warmth of the sun on her face.
  </text>
  <text x="50" y="310" class="content">
    她感受到了阳光照在脸上的温暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <path d="M50,100 C50,50 150,50 150,100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="120" x2="70" y2="110" class="image" />
    <line x1="100" y1="120" x2="130" y2="110" class="image" />
    <line x1="100" y1="150" x2="70" y2="180" class="image" />
    <line x1="100" y1="150" x2="130" y2="180" class="image" />
    <!-- Feather -->
    <path d="M200,100 C220,50 280,50 300,100" class="image" />
    <path d="M200,120 C220,70 280,70 300,120" class="image" />
    <path d="M200,140 C220,90 280,90 300,140" class="image" />
  </g>
</svg>