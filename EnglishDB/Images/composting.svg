<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">composting</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmpəstɪŋ] n. 堆肥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + post (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆有机废物被"一起放置(com-post)"
    <tspan x="50" dy="25">在一个大坑里，经过一段时间的分解，</tspan>
    <tspan x="50" dy="25">变成了肥沃的堆肥(composting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They started composting kitchen waste to enrich their garden soil.
  </text>
  <text x="50" y="310" class="content">
    他们开始用厨房垃圾堆肥来丰富花园土壤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compost pile -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Organic waste -->
    <circle cx="80" cy="50" r="15" class="image" />
    <circle cx="120" cy="80" r="15" class="image" />
    <circle cx="160" cy="110" r="15" class="image" />
    <circle cx="200" cy="140" r="15" class="image" />
    <!-- Decomposition -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Fertile soil -->
    <rect x="50" y="180" width="250" height="20" class="image" />
  </g>
</svg>