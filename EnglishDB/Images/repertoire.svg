<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">repertoire</text>
  <text x="50" y="120" class="subtitle">[ˈrepərtwɑːr] n. 全部节目，全部技能</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再) + per (尝试) + t + oire (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演员在舞台上，"再次尝试(re-per)"
    <tspan x="50" dy="25">各种表演，这些表演就构成了他的全部节目(repertoire)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pianist has an extensive repertoire of classical music.
  </text>
  <text x="50" y="310" class="content">
    这位钢琴家有大量的古典音乐曲目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actor -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Microphone -->
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <!-- Music notes -->
    <line x1="150" y1="100" x2="170" y2="80" class="image" />
    <line x1="170" y1="80" x2="190" y2="100" class="image" />
    <line x1="190" y1="100" x2="210" y2="80" class="image" />
    <line x1="210" y1="80" x2="230" y2="100" class="image" />
  </g>
</svg>