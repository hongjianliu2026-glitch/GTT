<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rape</text>
  <text x="50" y="120" class="subtitle">[reɪp] n. 强奸；v. 强奸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rap (抓住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶徒"抓住(rap)"一个无辜的人，
    <tspan x="50" dy="25">强行施暴，这就是强奸(rape)的可怕画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crime of rape is severely punished by law.
  </text>
  <text x="50" y="310" class="content">
    强奸罪在法律上受到严厉惩罚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Criminal -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Victim -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Action -->
    <line x1="70" y1="140" x2="180" y2="140" class="image" />
    <line x1="180" y1="140" x2="180" y2="120" class="image" />
  </g>
</svg>