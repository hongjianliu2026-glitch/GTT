<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resultant</text>
  <text x="50" y="120" class="subtitle">[rɪˈzʌltənt] adj. 结果的，合成的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + sult (跳跃) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个跳跃的球，"再次跳跃(re-sult)"
    <tspan x="50" dy="25">后产生的轨迹，这个轨迹就是结果(resultant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The resultant force of the two forces is zero.
  </text>
  <text x="50" y="310" class="content">
    这两个力的合力为零。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ball -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Trajectory -->
    <path d="M50 50 Q 100 100 150 50" class="image" />
    <path d="M150 50 Q 200 0 250 50" class="image" />
    <!-- Resultant line -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <!-- Arrowhead -->
    <polygon points="250,50 240,45 240,55" class="image" />
  </g>
</svg>