<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deregulate</text>
  <text x="50" y="120" class="subtitle">[diːˈrɛɡjəˌleɪt] v. 解除管制，放松管制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (去除) + regulat(e) (管制)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被"去除(de-)"了"管制(regulate)"的市场，
    <tspan x="50" dy="25">自由的鸟儿在空中飞翔，象征着自由和无拘无束。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government decided to deregulate the energy market.
  </text>
  <text x="50" y="310" class="content">
    政府决定解除能源市场的管制。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cage -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="50" x2="180" y2="50" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="110" x2="180" y2="110" class="image" />
    <!-- Broken cage -->
    <line x1="100" y1="0" x2="100" y2="150" class="image" stroke-dasharray="5,5" />
    <!-- Bird flying out -->
    <circle cx="120" cy="75" r="15" class="image" />
    <line x1="120" y1="90" x2="120" y2="120" class="image" />
    <line x1="120" y1="120" x2="100" y2="150" class="image" />
    <line x1="120" y1="120" x2="140" y2="150" class="image" />
    <line x1="120" y1="100" x2="150" y2="90" class="image" />
  </g>
</svg>