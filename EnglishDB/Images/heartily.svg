<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heartily</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrtɪli] adv. 衷心地，热情地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heart (心) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用"心(heart)"去拥抱，
    <tspan x="50" dy="25">这种拥抱是"衷心地(heartily)"，充满了热情和真诚。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She welcomed us heartily to her home.
  </text>
  <text x="50" y="310" class="content">
    她热情地欢迎我们到她家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 40 C10 10, 40 10, 40 40 S70 70, 40 100 S10 70, 10 40" class="image" fill="#E74C3C" />
    <!-- Arms -->
    <line x1="40" y1="100" x2="20" y2="150" class="image" />
    <line x1="40" y1="100" x2="60" y2="150" class="image" />
    <!-- Person -->
    <circle cx="40" cy="30" r="15" class="image" />
    <line x1="40" y1="45" x2="40" y2="80" class="image" />
  </g>
</svg>