<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #D35400; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">granite</text>
  <text x="50" y="120" class="subtitle">[ˈɡrænɪt] n. 花岗岩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gran (谷物) + -ite (石头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块巨大的花岗岩，表面布满了像谷物一样的颗粒，
    <tspan x="50" dy="25">这些颗粒让石头看起来坚硬无比，就像是大自然的坚固堡垒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The building was constructed with granite blocks.
  </text>
  <text x="50" y="310" class="content">
    这座建筑是用花岗岩块建造的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Granite block -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Grainy texture -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="100" cy="70" r="5" class="image" />
    <circle cx="150" cy="90" r="5" class="image" />
    <circle cx="200" cy="110" r="5" class="image" />
    <circle cx="250" cy="130" r="5" class="image" />
    <circle cx="70" cy="150" r="5" class="image" />
    <circle cx="120" cy="170" r="5" class="image" />
    <circle cx="170" cy="190" r="5" class="image" />
    <circle cx="220" cy="210" r="5" class="image" />
    <circle cx="270" cy="230" r="5" class="image" />
  </g>
</svg>