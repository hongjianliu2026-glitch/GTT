<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">problem-solving</text>
  <text x="50" y="120" class="subtitle">[ˈprɒbləm ˈsɒlvɪŋ] n. 解决问题</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> problem (问题) + solve (解决) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个侦探在"解决(solve)"一个复杂的"问题(problem)"，
    <tspan x="50" dy="25">他拿着放大镜，仔细分析每一个线索，最终找到了答案。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Effective problem-solving skills are crucial in engineering.
  </text>
  <text x="50" y="310" class="content">
    有效的解决问题能力在工程学中至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Detective -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Magnifying glass -->
    <circle cx="80" cy="100" r="10" class="image" />
    <line x1="80" y1="110" x2="120" y2="110" class="image" />
    <line x1="120" y1="110" x2="120" y2="130" class="image" />
    <line x1="120" y1="130" x2="80" y2="130" class="image" />
    <!-- Problem -->
    <rect x="150" y="90" width="50" height="50" class="image" />
    <line x1="160" y1="100" x2="200" y2="140" class="image" />
    <line x1="160" y1="140" x2="200" y2="100" class="image" />
    <!-- Solution -->
    <rect x="220" y="90" width="50" height="50" class="image" />
    <line x1="230" y1="100" x2="270" y2="140" class="image" />
    <line x1="230" y1="140" x2="270" y2="100" class="image" />
    <line x1="230" y1="120" x2="270" y2="120" class="image" />
  </g>
</svg>