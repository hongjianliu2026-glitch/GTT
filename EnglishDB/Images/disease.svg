<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disease</text>
  <text x="50" y="120" class="subtitle">[dɪˈziːz] n. 疾病</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + ease (舒适)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人原本很"舒适(ease)"，但突然"不(dis-)"
    <tspan x="50" dy="25">再舒适了，因为他生病了(disease)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The disease spread rapidly through the village.
  </text>
  <text x="50" y="310" class="content">
    这种疾病迅速在村庄里蔓延开来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="130" class="image" />
    <line x1="50" y1="150" x2="80" y2="130" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />

    <!-- Discomfort -->
    <line x1="50" y1="100" x2="50" y2="80" class="image" />
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="45" y1="85" x2="55" y2="85" class="image" />

    <!-- Cross -->
    <line x1="30" y1="70" x2="70" y2="130" class="image" />
    <line x1="30" y1="130" x2="70" y2="70" class="image" />
  </g>
</svg>