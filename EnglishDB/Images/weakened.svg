<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">weakened</text>
  <text x="50" y="120" class="subtitle">[ˈwikənd] v. 削弱，变弱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> weak (弱的) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原本强壮的人，"被削弱(weakened)"
    <tspan x="50" dy="25">成了一个虚弱的状态，就像一根原本坚固的</tspan>
    <tspan x="50" dy="25">柱子变得摇摇欲坠。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm weakened the old tree.
  </text>
  <text x="50" y="310" class="content">
    风暴削弱了那棵老树。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Strong person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />

    <!-- Weak person -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="150" x2="220" y2="130" class="image" />
    <line x1="250" y1="150" x2="280" y2="130" class="image" />
    <line x1="250" y1="180" x2="220" y2="220" class="image" />
    <line x1="250" y1="180" x2="280" y2="220" class="image" />

    <!-- Arrow -->
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <polygon points="200,150 190,145 190,155" class="image" />

    <!-- Text -->
    <text x="120" y="140" class="content">weakened</text>
  </g>
</svg>