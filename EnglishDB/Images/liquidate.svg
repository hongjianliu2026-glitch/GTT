<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liquidate</text>
  <text x="50" y="120" class="subtitle">[ˈlɪkwɪdeɪt] v. 清算，清偿；消灭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liquid (液体) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水龙头，"液体(liquid)"从天而降，
    <tspan x="50" dy="25">冲刷掉所有的债务和障碍，"清算(liquidate)"一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to liquidate its assets to pay off debts.
  </text>
  <text x="50" y="310" class="content">
    公司决定清算资产以偿还债务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water faucet -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="20" r="20" class="image" />
    <line x1="50" y1="40" x2="50" y2="200" class="image" />
    <!-- Water stream -->
    <polyline points="50,200 50,250 150,250 150,300" class="image" />
    <!-- Debt papers -->
    <rect x="150" y="300" width="100" height="50" class="image" />
    <line x1="160" y1="310" x2="240" y2="310" class="image" />
    <line x1="160" y1="330" x2="240" y2="330" class="image" />
    <line x1="160" y1="350" x2="240" y2="350" class="image" />
  </g>
</svg>