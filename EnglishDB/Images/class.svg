<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">class</text>
  <text x="50" y="120" class="subtitle">[klæs] n. 班级，阶级；v. 分类</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> class (源自拉丁语 "classis"，意为“阶级”或“类别”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的分类机器，它将各种物品"分类(class)"
    <tspan x="50" dy="25">成不同的组别，就像学校里的班级一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is in the top class of her school.
  </text>
  <text x="50" y="310" class="content">
    她在学校里属于顶尖班级。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classification machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Conveyor belt -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <!-- Items -->
    <circle cx="70" cy="30" r="10" class="image" />
    <rect x="100" y="20" width="20" height="20" class="image" />
    <circle cx="140" cy="30" r="10" class="image" />
    <rect x="170" y="20" width="20" height="20" class="image" />
    <circle cx="210" cy="30" r="10" class="image" />
    <rect x="240" y="20" width="20" height="20" class="image" />
    <!-- Classified bins -->
    <rect x="50" y="80" width="50" height="50" class="image" />
    <rect x="120" y="80" width="50" height="50" class="image" />
    <rect x="190" y="80" width="50" height="50" class="image" />
    <rect x="260" y="80" width="50" height="50" class="image" />
  </g>
</svg>