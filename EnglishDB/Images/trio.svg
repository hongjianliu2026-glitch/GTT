<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trio</text>
  <text x="50" y="120" class="subtitle">[ˈtriːoʊ] n. 三人一组，三重奏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tri- (三) + -o (表示名词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐会上，三位音乐家组成一个"三重奏(trio)"，
    <tspan x="50" dy="25">他们各自演奏不同的乐器，和谐地合奏出美妙的音乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The trio performed a beautiful piece of classical music.
  </text>
  <text x="50" y="310" class="content">
    这个三重奏演奏了一首优美的古典音乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Three musicians -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Instruments -->
    <rect x="30" y="120" width="40" height="80" class="image" />
    <rect x="130" y="120" width="40" height="80" class="image" />
    <rect x="230" y="120" width="40" height="80" class="image" />
    <!-- Music notes -->
    <line x1="50" y1="220" x2="50" y2="250" class="image" />
    <line x1="150" y1="220" x2="150" y2="250" class="image" />
    <line x1="250" y1="220" x2="250" y2="250" class="image" />
    <circle cx="50" cy="250" r="10" class="image" />
    <circle cx="150" cy="250" r="10" class="image" />
    <circle cx="250" cy="250" r="10" class="image" />
  </g>
</svg>