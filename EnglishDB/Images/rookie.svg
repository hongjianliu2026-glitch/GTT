<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rookie</text>
  <text x="50" y="120" class="subtitle">[ˈruːki] n. 新手，菜鸟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rook (新手) + -ie (表示“小”或“年轻”的后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个刚入行的新手(rookie)，紧张地站在一群经验丰富的老手中间，
    <tspan x="50" dy="25">手里拿着一本厚厚的操作手册，满脸都是困惑和不安。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rookie player made a few mistakes in the first game.
  </text>
  <text x="50" y="310" class="content">
    这位新手球员在第一场比赛中犯了一些错误。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rookie -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Manual -->
    <rect x="100" y="80" width="150" height="140" class="image" />
    <line x1="110" y1="100" x2="240" y2="100" class="image" />
    <line x1="110" y1="130" x2="240" y2="130" class="image" />
    <line x1="110" y1="160" x2="240" y2="160" class="image" />
    <line x1="110" y1="190" x2="240" y2="190" class="image" />
    <!-- Experienced people -->
    <circle cx="350" cy="100" r="30" class="image" />
    <line x1="350" y1="130" x2="350" y2="200" class="image" />
    <line x1="350" y1="160" x2="320" y2="140" class="image" />
    <line x1="350" y1="160" x2="380" y2="140" class="image" />
    <line x1="350" y1="200" x2="320" y2="240" class="image" />
    <line x1="350" y1="200" x2="380" y2="240" class="image" />
  </g>
</svg>