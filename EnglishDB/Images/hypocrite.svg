<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hypocrite</text>
  <text x="50" y="120" class="subtitle">[ˈhɪpəkrɪt] n. 伪君子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hypo- (在下面) + crit (判断)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人表面上装作正直，"在下面(hypo-)"
    <tspan x="50" dy="25">却暗地里做出不道德的行为，这样的人就是伪君子(hypocrite)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was exposed as a hypocrite when his true actions were revealed.
  </text>
  <text x="50" y="310" class="content">
    当他的真实行为被揭露时，他被曝光为伪君子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mask -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Face -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Smile -->
    <path d="M140,120 Q175,140 210,120" class="image" />
    <!-- Eyes -->
    <circle cx="150" cy="90" r="5" class="image" />
    <circle cx="200" cy="90" r="5" class="image" />
    <!-- Underneath -->
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="230" class="image" />
    <line x1="175" y1="200" x2="200" y2="230" class="image" />
    <line x1="175" y1="170" x2="125" y2="160" class="image" />
    <line x1="175" y1="170" x2="225" y2="160" class="image" />
  </g>
</svg>