<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">errand</text>
  <text x="50" y="120" class="subtitle">[ˈɛrənd] n. 差事，跑腿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> err (走) + and (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在街上"走来走去(err)"，
    <tspan x="50" dy="25">为了完成各种任务，这就是跑腿(errand)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She went on an errand to buy groceries.
  </text>
  <text x="50" y="310" class="content">
    她去跑腿买杂货了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <!-- Person walking -->
    <circle cx="50" cy="110" r="15" class="image" />
    <line x1="50" y1="125" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Store -->
    <rect x="250" y="50" width="80" height="80" class="image" />
    <line x1="260" y1="60" x2="320" y2="60" class="image" />
    <line x1="260" y1="80" x2="320" y2="80" class="image" />
    <line x1="260" y1="100" x2="320" y2="100" class="image" />
  </g>
</svg>