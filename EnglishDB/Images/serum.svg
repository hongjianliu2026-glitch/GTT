<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .serum { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">serum</text>
  <text x="50" y="120" class="subtitle">[ˈsɪrəm] n. 血清，浆液</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ser- (浆液) + -um (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生从病人身上提取"浆液(ser-)"，
    <tspan x="50" dy="25">这些浆液被装在一个小瓶子里，这就是血清(serum)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor injected the serum to treat the infection.
  </text>
  <text x="50" y="310" class="content">
    医生注射了血清来治疗感染。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Syringe -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <rect x="30" y="30" width="40" height="140" class="serum" />
    <!-- Blood drop -->
    <circle cx="50" cy="190" r="15" class="serum" />
    <!-- Doctor -->
    <circle cx="50" cy="250" r="20" class="image" />
    <line x1="50" y1="270" x2="50" y2="320" class="image" />
    <line x1="50" y1="320" x2="30" y2="350" class="image" />
    <line x1="50" y1="320" x2="70" y2="350" class="image" />
    <line x1="50" y1="290" x2="80" y2="280" class="image" />
  </g>
</svg>