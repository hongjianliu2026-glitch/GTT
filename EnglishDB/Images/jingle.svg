<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jingle</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɪŋɡl] n. 叮当声，广告短歌；v. 发出叮当声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jing (发出声音) + le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小铃铛在风中"叮当(jing-le)"作响，
    <tspan x="50" dy="25">声音清脆悦耳，就像广告中的短歌一样吸引人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jingle of the bell echoed through the hall.
  </text>
  <text x="50" y="310" class="content">
    铃铛的叮当声在走廊里回响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bell -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="10" class="image" />
    <line x1="100" y1="10" x2="70" y2="30" class="image" />
    <line x1="100" y1="10" x2="130" y2="30" class="image" />
    <!-- Sound waves -->
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="100" cy="170" r="15" class="image" />
    <circle cx="100" cy="190" r="20" class="image" />
  </g>
</svg>