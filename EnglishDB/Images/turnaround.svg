<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turnaround</text>
  <text x="50" y="120" class="subtitle">[ˈtɜːrnəraʊnd] n. 转变，转机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> turn (转) + around (周围)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个陷入困境的人，突然"转身(turn)"
    <tspan x="50" dy="25">并"环顾四周(around)"，找到了解决问题的办法，</tspan>
    <tspan x="50" dy="25">这就是一个"转变(turnaround)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's turnaround was remarkable after the new CEO took over.
  </text>
  <text x="50" y="310" class="content">
    新CEO上任后，公司的转变令人瞩目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person turning around -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Arrow indicating turn -->
    <polyline points="50,100 80,130 50,160" class="image" />
    <!-- Lightbulb -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="180" class="image" />
    <line x1="150" y1="160" x2="170" y2="180" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
  </g>
</svg>