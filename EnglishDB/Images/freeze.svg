<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ice { fill: #AED6F1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">freeze</text>
  <text x="50" y="120" class="subtitle">[friːz] v. 冻结，结冰；n. 冻结，冰冻期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fr- (冷) + -eeze (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的冬天，"冷(fr-)"
    <tspan x="50" dy="25">空气使水"使(eeze)"结冰，形成冰冻(freeze)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lake froze over during the night.
  </text>
  <text x="50" y="310" class="content">
    湖在夜里结冰了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice block -->
    <rect x="0" y="0" width="350" height="200" class="image ice" />
    <!-- Water surface -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- Ice cracks -->
    <line x1="100" y1="50" x2="150" y2="150" class="image" />
    <line x1="200" y1="50" x2="250" y2="150" class="image" />
    <!-- Cold air -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="30" x2="300" y2="30" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
  </g>
</svg>