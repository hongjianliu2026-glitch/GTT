<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sentimental</text>
  <text x="50" y="120" class="subtitle">[ˌsɛntɪˈmɛntl] adj. 感伤的，多愁善感的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> senti- (感觉) + mental (心智)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在看老照片时，"感觉(senti-)"
    <tspan x="50" dy="25">到心智(mental)上的触动，变得多愁善感(sentimental)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She became sentimental when she saw the old family photos.
  </text>
  <text x="50" y="310" class="content">
    她看到老照片时变得多愁善感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old photo -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Heart -->
    <path d="M175,100 C160,75 130,75 115,100 C100,125 130,150 175,100 Z" class="image" />
    <!-- Tear drop -->
    <circle cx="250" cy="150" r="15" class="image" />
    <line x1="250" y1="165" x2="250" y2="200" class="image" />
  </g>
</svg>