<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">landlord</text>
  <text x="50" y="120" class="subtitle">[ˈlændlɔːrd] n. 房东，地主</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> land (土地) + lord (主人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个地主(landlord)站在他的土地上，
    <tspan x="50" dy="25">手里拿着一把钥匙，象征着他拥有这片土地和房屋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The landlord increased the rent this year.
  </text>
  <text x="50" y="310" class="content">
    今年房东提高了租金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- House -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <rect x="70" y="40" width="20" height="20" class="image" /> <!-- Window -->
    <rect x="110" y="40" width="20" height="20" class="image" /> <!-- Window -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" /> <!-- Roof -->
    <!-- Landlord -->
    <circle cx="20" cy="100" r="15" class="image" /> <!-- Head -->
    <line x1="20" y1="115" x2="20" y2="150" class="image" /> <!-- Body -->
    <line x1="20" y1="150" x2="0" y2="180" class="image" /> <!-- Left arm -->
    <line x1="20" y1="150" x2="40" y2="180" class="image" /> <!-- Right arm -->
    <line x1="20" y1="130" x2="50" y2="120" class="image" /> <!-- Leg -->
    <!-- Key -->
    <line x1="20" y1="120" x2="0" y2="100" class="image" />
    <line x1="0" y1="100" x2="-10" y2="110" class="image" />
    <line x1="0" y1="100" x2="-10" y2="90" class="image" />
  </g>
</svg>