<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">burning</text>
  <text x="50" y="120" class="subtitle">[ˈbɜːrnɪŋ] adj. 燃烧的，强烈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> burn (燃烧) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林中，火焰"燃烧(burn)"得如此猛烈，
    <tspan x="50" dy="25">以至于整个天空都被映得通红，这就是"燃烧的(burning)"景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The burning house was a scene of chaos.
  </text>
  <text x="50" y="310" class="content">
    燃烧的房子是一片混乱的景象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flame -->
    <polygon points="0,0 50,0 25,50" class="flame" />
    <polygon points="25,0 75,0 50,50" class="flame" />
    <polygon points="50,0 100,0 75,50" class="flame" />
    <!-- Tree -->
    <rect x="20" y="50" width="10" height="100" class="image" />
    <polygon points="15,50 70,50 42.5,0" class="image" />
    <polygon points="15,30 70,30 42.5,0" class="image" />
    <polygon points="15,10 70,10 42.5,0" class="image" />
  </g>
</svg>