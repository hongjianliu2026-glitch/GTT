<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">burnout</text>
  <text x="50" y="120" class="subtitle">[ˈbɜːrnaʊt] n. 燃尽，精疲力竭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> burn (燃烧) + out (出去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人像蜡烛一样燃烧殆尽，"燃尽(burn)"
    <tspan x="50" dy="25">所有的能量，最终"出去(out)"，精疲力竭(burnout)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After years of intense work, he suffered from burnout.
  </text>
  <text x="50" y="310" class="content">
    经过多年的紧张工作，他精疲力竭了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Candle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="0" x2="50" y2="20" class="image" />
    <!-- Flame -->
    <polygon points="45,20 55,20 50,10" class="image" />
    <!-- Burned out -->
    <line x1="50" y1="200" x2="50" y2="220" class="image" />
    <line x1="40" y1="220" x2="60" y2="220" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Exhausted -->
    <line x1="200" y1="180" x2="200" y2="200" class="image" />
    <line x1="190" y1="200" x2="210" y2="200" class="image" />
  </g>
</svg>