<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">early-morning</text>
  <text x="50" y="120" class="subtitle">[ˈɜːrli ˈmɔːrnɪŋ] n. 清晨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> early (早的) + morning (早晨)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个清晨，太阳刚刚升起，"早(early)"
    <tspan x="50" dy="25">的"早晨(morning)"，空气中弥漫着清新的气息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She likes to jog in the early-morning.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在清晨跑步。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#FDB813" />
    <!-- Rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Ground -->
    <rect x="0" y="200" width="350" height="100" fill="#2ECC71" />
    <!-- Tree -->
    <rect x="250" y="150" width="20" height="50" fill="#27AE60" />
    <circle cx="260" cy="140" r="15" fill="#27AE60" />
  </g>
</svg>