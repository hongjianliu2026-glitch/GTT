<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sing</text>
  <text x="50" y="120" class="subtitle">[sɪŋ] v. 唱歌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sing (源自原始印欧语 *seng-, 意为“唱”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个歌手站在舞台上，"唱出(sing)"
    <tspan x="50" dy="25">美妙的旋律，观众们都被深深吸引。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to sing in the shower.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在淋浴时唱歌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Singer -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="145" y2="130" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Microphone -->
    <line x1="175" y1="120" x2="175" y2="80" class="image" />
    <circle cx="175" cy="70" r="10" class="image" />
    <!-- Audience -->
    <circle cx="50" cy="180" r="10" class="image" />
    <circle cx="100" cy="180" r="10" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
    <circle cx="200" cy="180" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
    <circle cx="300" cy="180" r="10" class="image" />
  </g>
</svg>