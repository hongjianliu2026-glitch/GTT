<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pita</text>
  <text x="50" y="120" class="subtitle">[ˈpiːtə] n. 皮塔饼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自希腊语 "πίτα" (pita)，意为“馅饼”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的皮塔饼，里面塞满了各种美味的食材，
    <tspan x="50" dy="25">就像一个微型的美食世界，让人垂涎欲滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a delicious falafel pita for lunch.
  </text>
  <text x="50" y="310" class="content">
    她为午餐做了一个美味的法拉费尔皮塔饼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pita bread -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Filling -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Pita bread outline -->
    <rect x="50" y="20" width="250" height="160" class="image" />
  </g>
</svg>