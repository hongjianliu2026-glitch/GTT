<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pussy</text>
  <text x="50" y="120" class="subtitle">[ˈpʊsi] n. 小猫，软弱的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pus (乳汁) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫(pussy)，它柔软、可爱，
    <tspan x="50" dy="25">就像乳汁(pus)一样温暖和滋养。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She adopted a cute little pussy from the shelter.
  </text>
  <text x="50" y="310" class="content">
    她从收容所领养了一只可爱的小猫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Nose -->
    <circle cx="100" cy="120" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 60 140 Q 100 160 140 140" class="image" />
    <!-- Whiskers -->
    <line x1="20" y1="100" x2="60" y2="90" class="image" />
    <line x1="20" y1="110" x2="60" y2="120" class="image" />
    <line x1="140" y1="90" x2="180" y2="100" class="image" />
    <line x1="140" y1="120" x2="180" y2="110" class="image" />
  </g>
</svg>