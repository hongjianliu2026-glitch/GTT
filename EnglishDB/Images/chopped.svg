<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chopped</text>
  <text x="50" y="120" class="subtitle">[tʃɒpt] adj. 切碎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chop (砍，切) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"砍(chop)"
    <tspan x="50" dy="25">蔬菜，把它们切成小块，这些小块就是切碎的(chopped)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added chopped onions to the soup.
  </text>
  <text x="50" y="310" class="content">
    她往汤里加了切碎的洋葱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cutting board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Vegetables -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Knife -->
    <line x1="200" y1="80" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="200" y2="160" class="image" />
    <!-- Chopped pieces -->
    <line x1="50" y1="150" x2="70" y2="150" class="image" />
    <line x1="100" y1="150" x2="120" y2="150" class="image" />
    <line x1="150" y1="150" x2="170" y2="150" class="image" />
  </g>
</svg>