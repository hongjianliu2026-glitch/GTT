<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">robust</text>
  <text x="50" y="120" class="subtitle">[roʊˈbʌst] adj. 强壮的，坚固的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> robus (力量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的"力量(robus)"巨人，
    <tspan x="50" dy="25">他站在那里，肌肉发达，坚不可摧，</tspan>
    <tspan x="50" dy="25">这就是"robust"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The software is known for its robust performance.
  </text>
  <text x="50" y="310" class="content">
    这款软件以其强大的性能而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="250" class="image" /> <!-- Right leg -->
    <!-- Muscles -->
    <line x1="50" y1="150" x2="40" y2="160" class="image" />
    <line x1="50" y1="150" x2="60" y2="160" class="image" />
    <line x1="50" y1="170" x2="40" y2="180" class="image" />
    <line x1="50" y1="170" x2="60" y2="180" class="image" />
  </g>
</svg>