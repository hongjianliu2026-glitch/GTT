<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">club</text>
  <text x="50" y="120" class="subtitle">[klʌb] n. 俱乐部，棍棒；v. 用棍棒打</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clu- (关闭) + b (棒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的"关闭(clu-)"房间里，一群人围着一根"棒(b)"，
    <tspan x="50" dy="25">他们正在讨论如何用这根棒子打坏人，这就是一个俱乐部(club)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He joined a book club last month.
  </text>
  <text x="50" y="310" class="content">
    他上个月加入了一个读书俱乐部。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Closed door -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="50" x2="130" y2="50" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <line x1="20" y1="110" x2="130" y2="110" class="image" />
    <line x1="20" y1="140" x2="130" y2="140" class="image" />
    <line x1="20" y1="170" x2="130" y2="170" class="image" />
    <!-- Club -->
    <rect x="200" y="50" width="50" height="150" class="image" />
    <circle cx="225" cy="20" r="20" class="image" />
  </g>
</svg>