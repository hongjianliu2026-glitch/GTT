<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fashionable</text>
  <text x="50" y="120" class="subtitle">[ˈfæʃənəbl] adj. 流行的，时髦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fashion (时尚) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时尚达人穿着最流行的衣服，"时尚(fashion)"
    <tspan x="50" dy="25">引领潮流，成为众人模仿的对象，这就是"时髦的(fashionable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always wears fashionable clothes to parties.
  </text>
  <text x="50" y="310" class="content">
    她总是穿着时髦的衣服去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fashionable person -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="130" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="130" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Fashionable clothes -->
    <rect x="20" y="130" width="60" height="50" class="image" /> <!-- Dress -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Dress line -->
    <line x1="20" y1="155" x2="80" y2="155" class="image" /> <!-- Dress line -->
    <line x1="20" y1="180" x2="80" y2="180" class="image" /> <!-- Dress line -->
    <!-- Fashionable accessories -->
    <circle cx="50" cy="80" r="10" class="image" /> <!-- Necklace -->
    <line x1="40" y1="80" x2="60" y2="80" class="image" /> <!-- Necklace line -->
    <line x1="45" y1="80" x2="45" y2="90" class="image" /> <!-- Necklace line -->
    <line x1="55" y1="80" x2="55" y2="90" class="image" /> <!-- Necklace line -->
  </g>
</svg>