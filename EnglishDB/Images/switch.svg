<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">switch</text>
  <text x="50" y="120" class="subtitle">[swɪtʃ] n. 开关，转换；v. 转换，改变</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swi- (旋转) + tch (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个开关(switch)，它像一个旋转的门把手，
    <tspan x="50" dy="25">当你转动它时，整个房间的灯就亮了，这就是开关的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She switched the light on when she entered the room.
  </text>
  <text x="50" y="310" class="content">
    她进房间时打开了灯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Light switch -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <!-- Light bulb -->
    <circle cx="200" cy="20" r="20" class="image" />
    <line x1="200" y1="40" x2="200" y2="100" class="image" />
    <!-- Light rays -->
    <line x1="200" y1="20" x2="150" y2="0" class="image" />
    <line x1="200" y1="20" x2="250" y2="0" class="image" />
    <line x1="200" y1="20" x2="100" y2="0" class="image" />
    <line x1="200" y1="20" x2="300" y2="0" class="image" />
  </g>
</svg>