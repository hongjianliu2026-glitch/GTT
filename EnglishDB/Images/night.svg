<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .night { fill: #1C1C1C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">night</text>
  <text x="50" y="120" class="subtitle">[naɪt] n. 夜晚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ni- (来自拉丁语 nox, noctis, 意为夜晚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个漆黑的夜晚，"ni-" 代表黑暗，
    <tspan x="50" dy="25">整个世界都被笼罩在夜幕之下，这就是夜晚(night)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stars shone brightly in the night sky.
  </text>
  <text x="50" y="310" class="content">
    星星在夜空中闪烁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="night" />
    <!-- Moon -->
    <circle cx="50" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Stars -->
    <circle cx="120" cy="40" r="5" class="image" fill="#FFFFFF" />
    <circle cx="150" cy="60" r="5" class="image" fill="#FFFFFF" />
    <circle cx="180" cy="30" r="5" class="image" fill="#FFFFFF" />
    <circle cx="210" cy="50" r="5" class="image" fill="#FFFFFF" />
    <circle cx="240" cy="40" r="5" class="image" fill="#FFFFFF" />
  </g>
</svg>