<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #5D4037; }
      .content { font: 18px sans-serif; fill: #795548; }
      .highlight { font-weight: bold; fill: #FF5722; }
      .story { font: 16px serif; fill: #607D8B; }
      .image { stroke: #BDBDBD; stroke-width: 2; fill: none; }
      .cheese { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheese</text>
  <text x="50" y="120" class="subtitle">[tʃiːz] n. 奶酪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> From Latin "caseus" (cheese)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的奶酪块，"切(chees)"
    <tspan x="50" dy="25">成一片片，每一块都散发着浓郁的奶香。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat cheese with her wine.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在喝酒时吃奶酪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cheese block -->
    <rect x="0" y="0" width="350" height="200" class="cheese" />
    <!-- Slices of cheese -->
    <rect x="50" y="20" width="50" height="160" class="cheese" />
    <rect x="120" y="20" width="50" height="160" class="cheese" />
    <rect x="190" y="20" width="50" height="160" class="cheese" />
    <rect x="260" y="20" width="50" height="160" class="cheese" />
    <!-- Knife -->
    <line x1="320" y1="20" x2="320" y2="180" class="image" />
    <line x1="320" y1="20" x2="300" y2="40" class="image" />
    <line x1="320" y1="20" x2="340" y2="40" class="image" />
  </g>
</svg>