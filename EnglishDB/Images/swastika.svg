<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swastika</text>
  <text x="50" y="120" class="subtitle">[ˈswɑːstɪkə] n. 卐字</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sva- (自己) + sti- (站立) + ka (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的符号，"自己站立(sva-sti)"
    <tspan x="50" dy="25">在历史的长河中，这个符号就是卐字(swastika)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The swastika is an ancient symbol with various meanings.
  </text>
  <text x="50" y="310" class="content">
    卐字是一个具有多种含义的古老符号。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Swastika symbol -->
    <line x1="100" y1="100" x2="200" y2="200" class="image" />
    <line x1="100" y1="200" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="150" y2="100" class="image" />
    <line x1="150" y1="200" x2="200" y2="150" class="image" />
    <line x1="150" y1="100" x2="100" y2="150" class="image" />
    <line x1="200" y1="150" x2="150" y2="200" class="image" />
  </g>
</svg>