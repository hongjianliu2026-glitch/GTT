<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pure</text>
  <text x="50" y="120" class="subtitle">[pjʊr] adj. 纯净的，纯粹的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pur- (纯净)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个透明的玻璃杯，里面装满了"纯净(pur-)"的水，
    <tspan x="50" dy="25">没有任何杂质，这就是pure的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She only drinks pure water.
  </text>
  <text x="50" y="310" class="content">
    她只喝纯净水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="10" y="10" width="130" height="180" class="image" />
    <!-- Water -->
    <rect x="15" y="15" width="120" height="170" fill="#A9CCE3" />
    <!-- Reflection -->
    <line x1="20" y1="180" x2="135" y2="180" class="image" />
    <line x1="20" y1="175" x2="135" y2="175" class="image" />
    <line x1="20" y1="170" x2="135" y2="170" class="image" />
  </g>
</svg>