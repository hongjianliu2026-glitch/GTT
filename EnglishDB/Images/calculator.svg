<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">calculator</text>
  <text x="50" y="120" class="subtitle">[ˈkælkjəleɪtər] n. 计算器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> calcul (计算) + -ator (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的计算器，"计算(calcul)"
    <tspan x="50" dy="25">工具(ator)，帮助人们快速完成复杂的数学运算。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a calculator to check her math homework.
  </text>
  <text x="50" y="310" class="content">
    她用计算器检查她的数学作业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calculator body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Screen -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Buttons -->
    <circle cx="70" cy="100" r="15" class="image" />
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="170" cy="100" r="15" class="image" />
    <circle cx="220" cy="100" r="15" class="image" />
    <circle cx="70" cy="150" r="15" class="image" />
    <circle cx="120" cy="150" r="15" class="image" />
    <circle cx="170" cy="150" r="15" class="image" />
    <circle cx="220" cy="150" r="15" class="image" />
    <!-- Equals sign -->
    <line x1="270" y1="100" x2="270" y2="150" class="image" />
    <line x1="290" y1="100" x2="290" y2="150" class="image" />
  </g>
</svg>