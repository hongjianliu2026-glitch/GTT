<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feeble</text>
  <text x="50" y="120" class="subtitle">[ˈfiːbl] adj. 虚弱的，无力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fe- (做) + -ble (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个虚弱的人，"做(fe-)"
    <tspan x="50" dy="25">事情时显得"无能为力(-ble)"，这就是feeble。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man's voice was feeble and barely audible.
  </text>
  <text x="50" y="310" class="content">
    老人的声音虚弱得几乎听不见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Weak person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="30" y2="250" class="image" />
    <line x1="50" y1="200" x2="70" y2="250" class="image" />
    <!-- Weakness symbol -->
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="100" class="image" />
    <line x1="125" y1="125" x2="125" y2="175" class="image" />
  </g>
</svg>