<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bristle</text>
  <text x="50" y="120" class="subtitle">[ˈbrɪsl] n. 刚毛，鬃毛；v. 发怒，竖起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brist (鬃毛) + -le (表示小或动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只愤怒的刺猬，全身的"鬃毛(brist)"都"竖起(le)"，
    <tspan x="50" dy="25">就像一根根小刺，这就是bristle的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat's fur bristled when it saw the dog.
  </text>
  <text x="50" y="310" class="content">
    猫看到狗时，毛发都竖起来了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hedgehog -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Bristles -->
    <line x1="50" y1="50" x2="50" y2="0" class="image" />
    <line x1="70" y1="50" x2="70" y2="0" class="image" />
    <line x1="90" y1="50" x2="90" y2="0" class="image" />
    <line x1="110" y1="50" x2="110" y2="0" class="image" />
    <line x1="130" y1="50" x2="130" y2="0" class="image" />
    <line x1="150" y1="50" x2="150" y2="0" class="image" />
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="100" y1="70" x2="100" y2="20" class="image" />
    <line x1="100" y1="90" x2="100" y2="40" class="image" />
    <line x1="100" y1="110" x2="100" y2="60" class="image" />
    <line x1="100" y1="130" x2="100" y2="80" class="image" />
    <line x1="100" y1="150" x2="100" y2="100" class="image" />
  </g>
</svg>