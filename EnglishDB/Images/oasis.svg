<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tree { fill: #27AE60; }
      .water { fill: #3498DB; }
      .sand { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oasis</text>
  <text x="50" y="120" class="subtitle">[oʊˈeɪsɪs] n. 绿洲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (不) + oasis (荒漠)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在一片荒漠中，"不(a-)"再是荒芜，
    <tspan x="50" dy="25">突然出现了一片绿洲(oasis)，</tspan>
    <tspan x="50" dy="25">那里有水、有树，是生命的希望。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oasis provided a welcome relief from the desert heat.
  </text>
  <text x="50" y="310" class="content">
    绿洲为沙漠的酷热提供了令人欣慰的缓解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sand -->
    <rect x="0" y="0" width="350" height="200" class="sand" />
    <!-- Water -->
    <rect x="50" y="50" width="250" height="100" class="water" />
    <!-- Trees -->
    <rect x="70" y="60" width="20" height="80" class="tree" />
    <rect x="120" y="60" width="20" height="80" class="tree" />
    <rect x="170" y="60" width="20" height="80" class="tree" />
    <rect x="220" y="60" width="20" height="80" class="tree" />
    <rect x="270" y="60" width="20" height="80" class="tree" />
  </g>
</svg>