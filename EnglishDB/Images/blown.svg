<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blown</text>
  <text x="50" y="120" class="subtitle">[bloʊn] adj. 吹动的，吹散的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blow (吹) + -en (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一阵狂风把树叶"吹散(blow-en)"，
    <tspan x="50" dy="25">树叶四处飘散，形成了一幅"吹动的(blown)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leaves were blown away by the strong wind.
  </text>
  <text x="50" y="310" class="content">
    树叶被强风吹散了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wind -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="20" x2="350" y2="220" class="image" />
    <line x1="0" y1="40" x2="350" y2="240" class="image" />
    <!-- Leaves -->
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="100" cy="120" r="10" class="image" />
    <circle cx="150" cy="140" r="10" class="image" />
    <circle cx="200" cy="160" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
    <circle cx="300" cy="200" r="10" class="image" />
  </g>
</svg>