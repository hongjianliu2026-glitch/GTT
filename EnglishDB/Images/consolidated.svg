<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consolidated</text>
  <text x="50" y="120" class="subtitle">[kənˈsɑːlɪˌdeɪtɪd] adj. 合并的，巩固的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + solid (坚固) + -ate (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆松散的砖块被"一起(con-)"堆砌成"坚固(solid)"的墙，
    <tspan x="50" dy="25">这个过程就是"巩固(consolidate)"，结果就是"合并的(consolidated)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's various departments were consolidated into one.
  </text>
  <text x="50" y="310" class="content">
    公司的各个部门被合并成了一个。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bricks -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="110" y="20" width="50" height="30" class="image" />
    <rect x="170" y="20" width="50" height="30" class="image" />
    <rect x="230" y="20" width="50" height="30" class="image" />
    <rect x="50" y="60" width="50" height="30" class="image" />
    <rect x="110" y="60" width="50" height="30" class="image" />
    <rect x="170" y="60" width="50" height="30" class="image" />
    <rect x="230" y="60" width="50" height="30" class="image" />
    <rect x="50" y="100" width="50" height="30" class="image" />
    <rect x="110" y="100" width="50" height="30" class="image" />
    <rect x="170" y="100" width="50" height="30" class="image" />
    <rect x="230" y="100" width="50" height="30" class="image" />
    <!-- Solid wall -->
    <rect x="50" y="140" width="230" height="30" class="image" />
  </g>
</svg>