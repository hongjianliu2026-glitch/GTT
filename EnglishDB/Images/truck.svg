<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">truck</text>
  <text x="50" y="120" class="subtitle">[trʌk] n. 卡车，货车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tr- (拉) + -uck (车)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆巨大的卡车，"拉着(tr-)"
    <tspan x="50" dy="25">货物在路上行驶，这就是卡车(truck)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The truck delivered the goods to the warehouse.
  </text>
  <text x="50" y="310" class="content">
    卡车将货物运送到了仓库。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Truck body -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Truck cabin -->
    <rect x="20" y="20" width="100" height="60" class="image" />
    <!-- Wheels -->
    <circle cx="120" cy="110" r="20" class="image" />
    <circle cx="280" cy="110" r="20" class="image" />
    <!-- Cargo -->
    <rect x="150" y="20" width="180" height="60" class="image" />
  </g>
</svg>