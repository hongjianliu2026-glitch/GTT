<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">steamer</text>
  <text x="50" y="120" class="subtitle">[ˈstimər] n. 蒸汽机，蒸锅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> steam (蒸汽) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蒸锅(steamer)，里面冒出滚滚的蒸汽(steam)，
    <tspan x="50" dy="25">蒸汽像巨龙一样冲天而起，场面壮观至极。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a steamer to cook the vegetables.
  </text>
  <text x="50" y="310" class="content">
    她用蒸锅来煮蔬菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Steamer -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Steam -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="75" y1="40" x2="125" y2="40" class="image" />
    <line x1="100" y1="60" x2="150" y2="60" class="image" />
    <line x1="125" y1="80" x2="175" y2="80" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <!-- Steamer pot -->
    <rect x="150" y="120" width="100" height="60" class="image" />
    <!-- Steam coming out -->
    <line x1="190" y1="120" x2="190" y2="80" class="image" />
    <line x1="200" y1="120" x2="200" y2="70" class="image" />
    <line x1="210" y1="120" x2="210" y2="60" class="image" />
  </g>
</svg>