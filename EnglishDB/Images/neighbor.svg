<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neighbor</text>
  <text x="50" y="120" class="subtitle">[ˈneɪbər] n. 邻居</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neig (nigh, 接近) + -bor (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房子旁边站着一个人，"接近(nigh)"
    <tspan x="50" dy="25">的人就是你的邻居(neighbor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My neighbor is very friendly and often helps me.
  </text>
  <text x="50" y="310" class="content">
    我的邻居非常友好，经常帮助我。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="20" y="20" width="110" height="60" class="image" />
    <!-- Door -->
    <rect x="60" y="60" width="30" height="40" class="image" />
    <!-- Neighbor -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="110" class="image" />
    <line x1="200" y1="90" x2="180" y2="100" class="image" />
    <line x1="200" y1="90" x2="220" y2="100" class="image" />
    <line x1="200" y1="110" x2="180" y2="130" class="image" />
    <line x1="200" y1="110" x2="220" y2="130" class="image" />
  </g>
</svg>