<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">punishing</text>
  <text x="50" y="120" class="subtitle">[ˈpʌnɪʃɪŋ] adj. 严厉的，惩罚性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> puni (惩罚) + -sh (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个严厉的老师，手持鞭子，"惩罚(puni)"
    <tspan x="50" dy="25">学生，这种惩罚是如此严厉，以至于让人感到"punishing"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The punishing workout left her muscles sore.
  </text>
  <text x="50" y="310" class="content">
    严厉的锻炼让她的肌肉酸痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teacher with whip -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <line x1="20" y1="115" x2="50" y2="115" class="image" />
    <line x1="50" y1="115" x2="50" y2="130" class="image" />
    <line x1="50" y1="130" x2="60" y2="120" class="image" />
    <!-- Student -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
  </g>
</svg>