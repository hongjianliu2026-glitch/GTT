<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tribunal</text>
  <text x="50" y="120" class="subtitle">[traɪˈbjuːnl] n. 法庭，特别法庭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trib (审判) + -unal (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个庄严的法庭，法官坐在高高的椅子上，"审判(trib)"
    <tspan x="50" dy="25">着案件，这个场景就是法庭(tribunal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The case was heard by a special tribunal.
  </text>
  <text x="50" y="310" class="content">
    这个案件由一个特别法庭审理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's chair -->
    <rect x="150" y="20" width="50" height="100" class="image" />
    <!-- Judge -->
    <circle cx="175" cy="70" r="15" class="image" />
    <line x1="175" y1="85" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="155" y2="150" class="image" />
    <line x1="175" y1="120" x2="195" y2="150" class="image" />
    <!-- Gavel -->
    <line x1="175" y1="85" x2="200" y2="60" class="image" />
    <line x1="200" y1="60" x2="210" y2="60" class="image" />
    <!-- Bench -->
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Defendant -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="200" class="image" />
    <line x1="100" y1="180" x2="120" y2="200" class="image" />
    <!-- Lawyer -->
    <circle cx="250" cy="150" r="15" class="image" />
    <line x1="250" y1="165" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="200" class="image" />
    <line x1="250" y1="180" x2="270" y2="200" class="image" />
  </g>
</svg>