<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">segregation</text>
  <text x="50" y="120" class="subtitle">[ˌsɛɡrɪˈɡeɪʃən] n. 隔离，分开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + greg (群) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人被"强行分开(se-greg)"，形成两个完全隔离的群体，
    <tspan x="50" dy="25">这就是隔离(segregation)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The segregation of students based on race was abolished in the 1960s.
  </text>
  <text x="50" y="310" class="content">
    基于种族的学生隔离在20世纪60年代被废除。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group 1 -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="80" cy="100" r="20" class="image" />
    <circle cx="110" cy="100" r="20" class="image" />
    <!-- Group 2 -->
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="280" cy="100" r="20" class="image" />
    <circle cx="310" cy="100" r="20" class="image" />
    <!-- Barrier -->
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="155" y1="80" x2="155" y2="120" class="image" />
    <line x1="160" y1="80" x2="160" y2="120" class="image" />
  </g>
</svg>