<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">guru</text>
  <text x="50" y="120" class="subtitle">[ˈɡʊruː] n. 古鲁，大师，领袖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gu (黑暗) + ru (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"黑暗(gu)"中的"光(ru)"，
    <tspan x="50" dy="25">这个光就是一位"古鲁(guru)"，</tspan>
    <tspan x="50" dy="25">他指引着人们走向光明。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The yoga guru taught us many breathing techniques.
  </text>
  <text x="50" y="310" class="content">
    瑜伽大师教了我们许多呼吸技巧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Light beam -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" stroke="#F1C40F" stroke-width="10" />
    <!-- Guru -->
    <circle cx="175" cy="100" r="30" class="image" fill="#F1C40F" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
  </g>
</svg>