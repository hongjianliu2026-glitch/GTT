<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prominently</text>
  <text x="50" y="120" class="subtitle">[ˈprɒmɪnəntli] adv. 显著地，突出地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + min (突出) + -ent (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头"向前突出(pro-min-ent)"，
    <tspan x="50" dy="25">它就像一个路标，引导人们注意到某个显著的位置。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The advertisement was prominently displayed on the billboard.
  </text>
  <text x="50" y="310" class="content">
    广告在广告牌上显著地展示。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow -->
    <polygon points="0,0 100,50 0,100" class="image" />
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <!-- Billboard -->
    <rect x="200" y="0" width="200" height="150" class="image" />
    <!-- Advertisement -->
    <rect x="220" y="20" width="160" height="110" class="image" />
    <text x="230" y="80" class="content" style="fill: #FFFFFF;">Advertisement</text>
  </g>
</svg>