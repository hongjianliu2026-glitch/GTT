<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interpret</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɜːrprɪt] v. 解释，口译</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在中间) + pret (价格，价值)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个翻译员站在两个人中间，"在中间(inter-)"
    <tspan x="50" dy="25">传递信息，就像在评估(pret)信息的价值一样，</tspan>
    <tspan x="50" dy="25">这就是解释(interpret)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She interpreted the foreign language for the audience.
  </text>
  <text x="50" y="310" class="content">
    她为观众翻译了外语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Interpreter -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
    <!-- Speech bubbles -->
    <path d="M100,50 Q150,20 200,50 Q250,80 300,50" class="image" />
    <path d="M300,50 Q350,20 400,50 Q450,80 500,50" class="image" />
    <!-- Arrows -->
    <line x1="200" y1="100" x2="150" y2="70" class="image" />
    <line x1="200" y1="100" x2="250" y2="70" class="image" />
    <line x1="200" y1="100" x2="200" y2="50" class="image" />
  </g>
</svg>