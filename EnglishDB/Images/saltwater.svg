<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .salt { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">saltwater</text>
  <text x="50" y="120" class="subtitle">[ˈsɔːltˌwɔːtər] n. 盐水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> salt (盐) + water (水)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片海洋，"盐(salt)"
    <tspan x="50" dy="25">溶解在"水(water)"中，形成了盐水(saltwater)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fish thrived in the saltwater aquarium.
  </text>
  <text x="50" y="310" class="content">
    这些鱼在盐水水族箱中茁壮成长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- Salt crystals -->
    <circle cx="50" cy="50" r="10" class="salt" />
    <circle cx="100" cy="70" r="10" class="salt" />
    <circle cx="150" cy="90" r="10" class="salt" />
    <circle cx="200" cy="110" r="10" class="salt" />
    <circle cx="250" cy="130" r="10" class="salt" />
    <circle cx="300" cy="150" r="10" class="salt" />
  </g>
</svg>