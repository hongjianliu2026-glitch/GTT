<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">filling</text>
  <text x="50" y="120" class="subtitle">[ˈfɪlɪŋ] n. 填充物，馅料</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fill (填充) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的馅饼，"填充(fill)"
    <tspan x="50" dy="25">了各种美味的馅料，这些馅料就是filling。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pie had a delicious apple filling.
  </text>
  <text x="50" y="310" class="content">
    这个派有美味的苹果馅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pie -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Filling -->
    <circle cx="175" cy="100" r="60" class="image" fill="#FFD700" />
    <!-- Pie crust -->
    <circle cx="175" cy="100" r="80" class="image" fill="none" stroke="#D35400" stroke-width="10" />
    <!-- Apple slices -->
    <circle cx="120" cy="70" r="10" class="image" fill="#FF4500" />
    <circle cx="230" cy="70" r="10" class="image" fill="#FF4500" />
    <circle cx="175" cy="130" r="10" class="image" fill="#FF4500" />
  </g>
</svg>