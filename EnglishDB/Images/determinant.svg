<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">determinant</text>
  <text x="50" y="120" class="subtitle">[dɪˈtɜːrmɪnənt] n. 决定因素，行列式</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + termin (界限) + -ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头"向下(de-)"指向一个界限(termin)，
    <tspan x="50" dy="25">这个界限决定了事物的走向，这就是决定因素(determinant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Price is a major determinant of demand.
  </text>
  <text x="50" y="310" class="content">
    价格是需求的主要决定因素。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow pointing down -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <polygon points="90,180 110,180 100,200" class="image" />
    <!-- Boundary line -->
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <!-- Text label -->
    <text x="70" y="230" class="content">界限</text>
  </g>
</svg>