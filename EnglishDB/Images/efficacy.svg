<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">efficacy</text>
  <text x="50" y="120" class="subtitle">[ˈɛfɪkəsi] n. 功效，效力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ef- (出) + fic (做) + -acy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神奇的药瓶，"做出(fic)"
    <tspan x="50" dy="25">的效果"出来(ef)"，这就是它的"功效(efficacy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The efficacy of the new drug has been proven in clinical trials.
  </text>
  <text x="50" y="310" class="content">
    新药的功效已在临床试验中得到证实。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="210" r="10" class="image" />
    <!-- Lightning bolt -->
    <polyline points="120,100 150,150 120,200 150,250" class="image" />
    <!-- Text -->
    <text x="170" y="180" class="content">
      <tspan class="highlight">神奇药瓶</tspan>
    </text>
  </g>
</svg>