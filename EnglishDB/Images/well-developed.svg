<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">well-developed</text>
  <text x="50" y="120" class="subtitle">[ˌwɛl dɪˈvɛləpt] adj. 发育良好的，成熟的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> well (好) + develop (发展) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的植物，"好(well)"地"发展(develop)"
    <tspan x="50" dy="25">成了一个茂盛的森林，这就是"发育良好的(well-developed)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The well-developed infrastructure made the city very attractive.
  </text>
  <text x="50" y="310" class="content">
    发达的基础设施使这座城市非常有吸引力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <circle cx="175" cy="20" r="15" class="image" />
    <line x1="175" y1="20" x2="150" y2="50" class="image" />
    <line x1="175" y1="20" x2="200" y2="50" class="image" />
    <line x1="175" y1="20" x2="160" y2="70" class="image" />
    <line x1="175" y1="20" x2="190" y2="70" class="image" />
    <line x1="175" y1="20" x2="140" y2="90" class="image" />
    <line x1="175" y1="20" x2="210" y2="90" class="image" />
    <line x1="175" y1="20" x2="130" y2="110" class="image" />
    <line x1="175" y1="20" x2="220" y2="110" class="image" />
    <line x1="175" y1="20" x2="120" y2="130" class="image" />
    <line x1="175" y1="20" x2="230" y2="130" class="image" />
    <line x1="175" y1="20" x2="110" y2="150" class="image" />
    <line x1="175" y1="20" x2="240" y2="150" class="image" />
    <line x1="175" y1="20" x2="100" y2="170" class="image" />
    <line x1="175" y1="20" x2="250" y2="170" class="image" />
  </g>
</svg>