<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">generate</text>
  <text x="50" y="120" class="subtitle">[ˈdʒenəreɪt] v. 生成，产生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gen- (产生) + -er (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的发电机，"产生(gen-erate)"
    <tspan x="50" dy="25">出源源不断的电力，照亮整个城市。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new software can generate reports automatically.
  </text>
  <text x="50" y="310" class="content">
    这款新软件可以自动生成报告。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Generator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Power lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- City lights -->
    <circle cx="100" cy="170" r="10" class="image" />
    <circle cx="150" cy="170" r="10" class="image" />
    <circle cx="200" cy="170" r="10" class="image" />
    <circle cx="250" cy="170" r="10" class="image" />
    <circle cx="300" cy="170" r="10" class="image" />
  </g>
</svg>