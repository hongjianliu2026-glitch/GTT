<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">additive</text>
  <text x="50" y="120" class="subtitle">[ˈædɪtɪv] adj. 添加的，附加的；n. 添加剂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> add- (增加) + -itive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在烹饪时，"不断增加(add-)"
    <tspan x="50" dy="25">各种调料，这些调料就是添加剂(additive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The food industry uses many additives to enhance flavor.
  </text>
  <text x="50" y="310" class="content">
    食品行业使用许多添加剂来增强风味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Pot -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Ingredients -->
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="120" cy="50" r="10" class="image" />
    <circle cx="160" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="240" cy="50" r="10" class="image" />
    <!-- Adding -->
    <line x1="20" y1="130" x2="80" y2="50" class="image" />
    <line x1="20" y1="130" x2="120" y2="50" class="image" />
    <line x1="20" y1="130" x2="160" y2="50" class="image" />
    <line x1="20" y1="130" x2="200" y2="50" class="image" />
    <line x1="20" y1="130" x2="240" y2="50" class="image" />
  </g>
</svg>