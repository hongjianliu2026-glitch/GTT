<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">per</text>
  <text x="50" y="120" class="subtitle">[pɜːr] prep. 每，通过，完全</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (通过，完全)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一把巨大的钥匙，"通过(per)"
    <tspan x="50" dy="25">一扇门，完全打开了它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She earns $50 per hour.
  </text>
  <text x="50" y="310" class="content">
    她每小时赚50美元。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Key -->
    <line x1="220" y1="150" x2="350" y2="150" class="image" />
    <line x1="350" y1="150" x2="350" y2="50" class="image" />
    <line x1="350" y1="50" x2="320" y2="50" class="image" />
    <line x1="320" y1="50" x2="320" y2="20" class="image" />
    <line x1="320" y1="20" x2="290" y2="20" class="image" />
    <line x1="290" y1="20" x2="290" y2="50" class="image" />
    <line x1="290" y1="50" x2="260" y2="50" class="image" />
    <line x1="260" y1="50" x2="260" y2="150" class="image" />
    <line x1="260" y1="150" x2="220" y2="150" class="image" />
  </g>
</svg>