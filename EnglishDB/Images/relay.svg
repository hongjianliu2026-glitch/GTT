<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relay</text>
  <text x="50" y="120" class="subtitle">[ˈriːleɪ] n. 接力赛，中继器；v. 传递，转播</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + lay (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群运动员在接力赛中，"再次放置(re-lay)"
    <tspan x="50" dy="25">接力棒，确保比赛顺利进行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The runners relayed the baton to the next teammate.
  </text>
  <text x="50" y="310" class="content">
    跑步者将接力棒传递给下一个队友。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Runners -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Baton -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
    <!-- Handoff -->
    <line x1="130" y1="90" x2="170" y2="90" class="image" />
    <line x1="130" y1="110" x2="170" y2="110" class="image" />
  </g>
</svg>