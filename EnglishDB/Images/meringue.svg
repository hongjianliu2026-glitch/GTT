<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .meringue { fill: #FFF3E0; stroke: #FF6F00; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meringue</text>
  <text x="50" y="120" class="subtitle">[məˈræŋ] n. 蛋白酥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自法语 "meringue"，最初指一种甜点。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋白酥(meringue)，像一座雪山一样高耸入云，
    <tspan x="50" dy="25">人们在下面欢呼雀跃，因为它既轻盈又甜美。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She topped the pie with a delicate meringue.
  </text>
  <text x="50" y="310" class="content">
    她在派上放了一层精致的蛋白酥。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meringue -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="meringue" />
    <ellipse cx="150" cy="150" rx="80" ry="40" class="meringue" />
    <ellipse cx="150" cy="200" rx="60" ry="30" class="meringue" />
    <!-- People -->
    <circle cx="50" cy="250" r="15" class="image" />
    <line x1="50" y1="265" x2="50" y2="300" class="image" />
    <line x1="50" y1="300" x2="35" y2="330" class="image" />
    <line x1="50" y1="300" x2="65" y2="330" class="image" />
    <line x1="50" y1="280" x2="80" y2="270" class="image" />
    <circle cx="250" cy="250" r="15" class="image" />
    <line x1="250" y1="265" x2="250" y2="300" class="image" />
    <line x1="250" y1="300" x2="235" y2="330" class="image" />
    <line x1="250" y1="300" x2="265" y2="330" class="image" />
    <line x1="250" y1="280" x2="280" y2="270" class="image" />
  </g>
</svg>