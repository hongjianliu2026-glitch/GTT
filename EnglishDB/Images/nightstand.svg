<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nightstand</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪtstænd] n. 床头柜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> night (夜晚) + stand (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个床头柜在夜晚"站立(stand)"在床边，
    <tspan x="50" dy="25">为你在睡前提供便利，这就是nightstand。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She placed her book on the nightstand before going to bed.
  </text>
  <text x="50" y="310" class="content">
    她在睡觉前把书放在了床头柜上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bed -->
    <rect x="0" y="100" width="300" height="150" class="image" />
    <!-- Nightstand -->
    <rect x="50" y="50" width="100" height="80" class="image" />
    <!-- Lamp on nightstand -->
    <circle cx="100" cy="70" r="10" class="image" />
    <line x1="100" y1="80" x2="100" y2="100" class="image" />
    <!-- Clock on nightstand -->
    <circle cx="70" cy="70" r="10" class="image" />
    <line x1="70" y1="80" x2="70" y2="100" class="image" />
  </g>
</svg>