<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fish { fill: #3498DB; }
      .question { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fishy</text>
  <text x="50" y="120" class="subtitle">[ˈfɪʃi] adj. 可疑的，有鱼腥味的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fish (鱼) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条鱼在水中游动，突然它变得"可疑(fishy)"，
    <tspan x="50" dy="25">因为它开始散发出奇怪的气味，让人不禁怀疑它是否新鲜。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There was something fishy about the deal.
  </text>
  <text x="50" y="310" class="content">
    这笔交易有些可疑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish -->
    <path d="M50 100 C50 50 150 50 150 100 C150 150 50 150 50 100 Z" class="fish" />
    <!-- Question mark -->
    <text x="200" y="120" class="question" font-size="100">?</text>
  </g>
</svg>