<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glaze</text>
  <text x="50" y="120" class="subtitle">[ɡleɪz] v. 上釉，使光滑；n. 釉料，光滑面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glo- (光) + -aze (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个陶艺家在给陶器"上光(glo-aze)"，
    <tspan x="50" dy="25">使表面变得光滑如镜，这就是glaze的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The potter glazed the vase before firing it.
  </text>
  <text x="50" y="310" class="content">
    陶艺家在烧制前给花瓶上了釉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pottery -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Glaze effect -->
    <circle cx="100" cy="100" r="45" class="image" stroke-dasharray="5,5" />
    <!-- Potter's hand -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <!-- Glaze brush -->
    <line x1="200" y1="150" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="240" y2="110" class="image" />
  </g>
</svg>