<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aspen</text>
  <text x="50" y="120" class="subtitle">[ˈæspən] n. 白杨树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "aspen"，意为“颤抖的”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵白杨树在微风中轻轻颤抖，仿佛在说“颤抖的(aspen)”
    <tspan x="50" dy="25">树叶在风中摇曳，就像在跳舞一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The aspen trees swayed gently in the breeze.
  </text>
  <text x="50" y="310" class="content">
    白杨树在微风中轻轻摇曳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree trunk -->
    <rect x="150" y="100" width="20" height="200" class="image" />
    <!-- Branches -->
    <line x1="160" y1="120" x2="100" y2="180" class="image" />
    <line x1="160" y1="120" x2="220" y2="180" class="image" />
    <line x1="160" y1="150" x2="100" y2="210" class="image" />
    <line x1="160" y1="150" x2="220" y2="210" class="image" />
    <!-- Leaves -->
    <circle cx="100" cy="180" r="10" class="image" />
    <circle cx="220" cy="180" r="10" class="image" />
    <circle cx="100" cy="210" r="10" class="image" />
    <circle cx="220" cy="210" r="10" class="image" />
    <!-- Wind effect -->
    <line x1="50" y1="150" x2="100" y2="180" class="image" />
    <line x1="270" y1="150" x2="220" y2="180" class="image" />
    <line x1="50" y1="240" x2="100" y2="210" class="image" />
    <line x1="270" y1="240" x2="220" y2="210" class="image" />
  </g>
</svg>