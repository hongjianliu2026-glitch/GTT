<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">secrecy</text>
  <text x="50" y="120" class="subtitle">[ˈsiːkrəsi] n. 秘密，保密</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> secr- (隐藏) + -ecy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的房间，"隐藏(secr-)"
    <tspan x="50" dy="25">着无数秘密，这些秘密构成了保密(secrecy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was shrouded in secrecy.
  </text>
  <text x="50" y="310" class="content">
    这个项目笼罩在秘密之中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Secret room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="20" width="50" height="160" class="image" />
    <!-- Lock -->
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Hidden secrets -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Shadows -->
    <rect x="70" y="160" width="20" height="20" class="image" />
    <rect x="120" y="160" width="20" height="20" class="image" />
    <rect x="170" y="160" width="20" height="20" class="image" />
    <rect x="220" y="160" width="20" height="20" class="image" />
    <rect x="270" y="160" width="20" height="20" class="image" />
  </g>
</svg>