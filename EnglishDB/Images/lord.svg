<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lord</text>
  <text x="50" y="120" class="subtitle">[lɔːrd] n. 领主，贵族</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lord (源自古英语 hlaford，意为“领主”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着华丽长袍的领主，坐在高高的宝座上，
    <tspan x="50" dy="25">手持权杖，统治着他的领地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lord of the manor held a grand feast.
  </text>
  <text x="50" y="310" class="content">
    庄园的领主举办了一场盛大的宴会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Throne -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Lord -->
    <circle cx="100" cy="80" r="20" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="120" x2="140" y2="110" class="image" />
    <!-- Scepter -->
    <line x1="100" y1="80" x2="100" y2="30" class="image" />
    <circle cx="100" cy="25" r="5" class="image" />
  </g>
</svg>