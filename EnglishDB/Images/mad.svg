<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mad</text>
  <text x="50" y="120" class="subtitle">[mæd] adj. 疯狂的，生气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mad (源自中古英语 "mad"，意为疯狂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为极度愤怒而"疯狂(mad)"，
    <tspan x="50" dy="25">头发竖起，眼睛瞪大，仿佛要爆炸一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was mad at himself for forgetting the keys.
  </text>
  <text x="50" y="310" class="content">
    他因为忘记带钥匙而生自己的气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="80" r="10" class="image" />
    <circle cx="125" cy="80" r="10" class="image" />
    <!-- Hair -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="60" y1="30" x2="140" y2="30" class="image" />
    <line x1="70" y1="10" x2="130" y2="10" class="image" />
    <!-- Mouth -->
    <line x1="75" y1="120" x2="125" y2="120" class="image" />
    <!-- Explosion -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="150" x2="100" y2="180" class="image" />
    <line x1="80" y1="165" x2="120" y2="165" class="image" />
    <line x1="90" y1="180" x2="110" y2="180" class="image" />
  </g>
</svg>