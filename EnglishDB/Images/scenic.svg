<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scenic</text>
  <text x="50" y="120" class="subtitle">[ˈsiːnɪk] adj. 风景优美的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scen (场景) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家在画布上描绘出"场景(scen)"，
    <tspan x="50" dy="25">画面如此美丽，以至于人们称之为"风景优美的(scenic)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The train ride offers a scenic view of the mountains.
  </text>
  <text x="50" y="310" class="content">
    火车之旅提供了山脉的风景优美的景色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,150 100,0 200,150" class="image" fill="#3498DB" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- River -->
    <line x1="0" y1="150" x2="200" y2="150" class="image" stroke-width="10" stroke="#2ECC71" />
    <!-- Trees -->
    <line x1="50" y1="150" x2="50" y2="100" class="image" stroke-width="10" stroke="#27AE60" />
    <line x1="150" y1="150" x2="150" y2="100" class="image" stroke-width="10" stroke="#27AE60" />
  </g>
</svg>