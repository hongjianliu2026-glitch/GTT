<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cameraman</text>
  <text x="50" y="120" class="subtitle">[ˈkæmərəmæn] n. 摄影师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> camera (相机) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拿着相机的人，"相机人(camera-man)"
    <tspan x="50" dy="25">正在捕捉美丽的瞬间，这个人就是摄影师(cameraman)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cameraman captured the breathtaking sunset.
  </text>
  <text x="50" y="310" class="content">
    摄影师捕捉到了令人惊叹的日落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camera -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <circle cx="75" cy="50" r="20" class="image" />
    <line x1="75" y1="70" x2="75" y2="100" class="image" />
    <!-- Cameraman -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="120" x2="250" y2="110" class="image" />
    <!-- Camera in hand -->
    <line x1="200" y1="100" x2="150" y2="50" class="image" />
  </g>
</svg>