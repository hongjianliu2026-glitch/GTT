<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">roll</text>
  <text x="50" y="120" class="subtitle">[roʊl] v. 滚动，卷起；n. 卷，卷轴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rolle (滚动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的面团，被一个巨人"滚动(roll)"
    <tspan x="50" dy="25">成一个长长的面包卷，这个动作就是roll。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She rolled the dough into a ball.
  </text>
  <text x="50" y="310" class="content">
    她把面团滚成了一个球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dough -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Giant's hand -->
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <!-- Rolling action -->
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
  </g>
</svg>