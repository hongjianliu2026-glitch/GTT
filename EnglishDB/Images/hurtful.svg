<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hurtful</text>
  <text x="50" y="120" class="subtitle">[ˈhɜːrtfəl] adj. 有害的，伤人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hurt (伤害) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满刺的玫瑰，"充满伤害(hurt-ful)"
    <tspan x="50" dy="25">的刺让人不敢靠近，这就是hurtful的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His hurtful words deeply affected her.
  </text>
  <text x="50" y="310" class="content">
    他伤人的话语深深影响了她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rose with thorns -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="70" y1="70" x2="130" y2="130" class="image" />
    <line x1="70" y1="130" x2="130" y2="70" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Thorns -->
    <line x1="80" y1="50" x2="80" y2="30" class="image" />
    <line x1="120" y1="50" x2="120" y2="30" class="image" />
    <line x1="80" y1="150" x2="80" y2="170" class="image" />
    <line x1="120" y1="150" x2="120" y2="170" class="image" />
  </g>
</svg>