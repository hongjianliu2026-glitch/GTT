<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">complete</text>
  <text x="50" y="120" class="subtitle">[kəmˈpliːt] adj. 完整的，完全的；v. 完成</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (完全) + ple (填充)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拼图，"完全填充(com-ple)"
    <tspan x="50" dy="25">每一个空缺，最终形成一个完整的画面(complete)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She completed the project on time.
  </text>
  <text x="50" y="310" class="content">
    她按时完成了项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="150" height="150" class="image" />
    <rect x="20" y="20" width="110" height="110" class="image" />
    <rect x="40" y="40" width="70" height="70" class="image" />
    <rect x="60" y="60" width="30" height="30" class="image" />
    <!-- Completed puzzle -->
    <rect x="200" y="0" width="150" height="150" class="image" />
    <rect x="220" y="20" width="110" height="110" class="image" />
    <rect x="240" y="40" width="70" height="70" class="image" />
    <rect x="260" y="60" width="30" height="30" class="image" />
    <rect x="280" y="80" width="10" height="10" class="image" />
  </g>
</svg>