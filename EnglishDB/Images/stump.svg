<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stump</text>
  <text x="50" y="120" class="subtitle">[stʌmp] n. 树桩，残余部分；v. 难住，使困惑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + ump (剩余)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树被砍伐后，"站立的剩余部分(st-ump)"
    <tspan x="50" dy="25">变成了一个树桩(stump)，它静静地立在那里，仿佛在思考什么难题。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The math problem stumped me for hours.
  </text>
  <text x="50" y="310" class="content">
    这道数学题让我困惑了好几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree stump -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Tree rings -->
    <circle cx="100" cy="50" r="40" class="image" />
    <circle cx="100" cy="50" r="30" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <!-- Question mark -->
    <text x="120" y="70" class="image" font-size="40">?</text>
  </g>
</svg>