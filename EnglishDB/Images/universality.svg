<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">universality</text>
  <text x="50" y="120" class="subtitle">[ˌjuːnɪvəˈsælɪti] n. 普遍性，广泛性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (一个) + vers (转) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，"一个(uni-)"
    <tspan x="50" dy="25">旋转(vers)的球体，象征着普遍性(universality)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The universality of human rights is widely recognized.
  </text>
  <text x="50" y="310" class="content">
    人权的普遍性被广泛认可。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Continents -->
    <path d="M175,20 A80,80 0 0,1 255,100 L175,100 Z" class="image" />
    <path d="M175,20 A80,80 0 0,0 95,100 L175,100 Z" class="image" />
    <path d="M175,180 A80,80 0 0,1 255,100 L175,100 Z" class="image" />
    <path d="M175,180 A80,80 0 0,0 95,100 L175,100 Z" class="image" />
    <!-- Axis -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="95" y1="100" x2="255" y2="100" class="image" />
  </g>
</svg>