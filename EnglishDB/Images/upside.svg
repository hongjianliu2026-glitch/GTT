<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">upside</text>
  <text x="50" y="120" class="subtitle">[ˈʌpsaɪd] n. 上边，上面；优势</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up (向上) + side (边)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头指向天空，"向上的一边(up-side)"
    <tspan x="50" dy="25">象征着积极和优势，这就是upside的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The upside of this situation is that we learned a lot.
  </text>
  <text x="50" y="310" class="content">
    这种情况的好处是我们学到了很多。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow pointing up -->
    <line x1="175" y1="100" x2="175" y2="200" class="image" />
    <line x1="175" y1="100" x2="150" y2="150" class="image" />
    <line x1="175" y1="100" x2="200" y2="150" class="image" />
    <!-- Text label -->
    <text x="160" y="250" class="content">upside</text>
  </g>
</svg>