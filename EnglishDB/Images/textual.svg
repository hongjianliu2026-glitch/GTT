<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">textual</text>
  <text x="50" y="120" class="subtitle">[ˈtɛkstʃuəl] adj. 文本的，文字的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> text (编织) + -ual (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的织布机，"编织(text)"
    <tspan x="50" dy="25">出文字的图案，这些文字就构成了文本(textual)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The textual analysis revealed hidden meanings in the poem.
  </text>
  <text x="50" y="310" class="content">
    文本分析揭示了诗中隐藏的含义。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Loom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Text pattern -->
    <text x="70" y="40" class="content" font-size="24">T</text>
    <text x="100" y="70" class="content" font-size="24">E</text>
    <text x="130" y="100" class="content" font-size="24">X</text>
    <text x="160" y="130" class="content" font-size="24">T</text>
    <text x="190" y="160" class="content" font-size="24">U</text>
    <text x="220" y="190" class="content" font-size="24">A</text>
    <text x="250" y="220" class="content" font-size="24">L</text>
  </g>
</svg>