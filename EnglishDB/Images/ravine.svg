<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ravine</text>
  <text x="50" y="120" class="subtitle">[rəˈviːn] n. 峡谷，深谷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ravi- (撕裂) + -ine (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象大地被"撕裂(ravi-)"开，形成了一条深深的"峡谷(ravine)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hiker got lost in the deep ravine.
  </text>
  <text x="50" y="310" class="content">
    徒步旅行者在深谷中迷路了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ravine -->
    <path d="M0 200 Q100 50 200 200 T400 200" class="image" />
    <path d="M0 200 Q100 350 200 200 T400 200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="180" x2="50" y2="150" class="image" />
    <line x1="55" y1="180" x2="55" y2="140" class="image" />
    <line x1="60" y1="180" x2="60" y2="160" class="image" />
    <line x1="350" y1="180" x2="350" y2="150" class="image" />
    <line x1="355" y1="180" x2="355" y2="140" class="image" />
    <line x1="360" y1="180" x2="360" y2="160" class="image" />
  </g>
</svg>