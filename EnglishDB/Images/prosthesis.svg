<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prosthesis</text>
  <text x="50" y="120" class="subtitle">[ˈprɒsθɪsɪs] n. 假肢，义肢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (在前面) + sthēsis (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人失去了手臂，医生为他"提前放置(pro-sthēsis)"
    <tspan x="50" dy="25">一个假肢，这个假肢就成为了他的新手臂(prosthesis)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The athlete uses a prosthesis to compete in marathons.
  </text>
  <text x="50" y="310" class="content">
    这位运动员使用假肢参加马拉松比赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Prosthesis -->
    <rect x="100" y="140" width="50" height="110" class="image" />
    <line x1="125" y1="140" x2="125" y2="250" class="image" />
    <line x1="125" y1="250" x2="100" y2="280" class="image" />
    <line x1="125" y1="250" x2="150" y2="280" class="image" />
  </g>
</svg>