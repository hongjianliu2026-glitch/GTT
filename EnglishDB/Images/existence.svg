<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">existence</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzɪstəns] n. 存在，生存</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + sist (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个生物从虚无中"站立出来(ex-sist)"，
    <tspan x="50" dy="25">这个过程就是它的存在(existence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The existence of the species is threatened by climate change.
  </text>
  <text x="50" y="310" class="content">
    这个物种的存在受到气候变化的威胁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle representing nothingness -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Line representing emergence -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <!-- Dot representing existence -->
    <circle cx="175" cy="180" r="10" class="image" fill="#E74C3C" />
    <!-- Text annotation -->
    <text x="150" y="200" class="content" text-anchor="middle">存在</text>
  </g>
</svg>