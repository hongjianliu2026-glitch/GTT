<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compassionate</text>
  <text x="50" y="120" class="subtitle">[kəmˈpæʃənət] adj. 有同情心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + passion (激情) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人伸出双手，"共同感受(com-passion)"
    <tspan x="50" dy="25">他人的痛苦，这种情感就是同情心(compassionate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a compassionate nurse who always cares for her patients.
  </text>
  <text x="50" y="310" class="content">
    她是一位有同情心的护士，总是关心她的病人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Hands -->
    <line x1="30" y1="40" x2="10" y2="70" class="image" />
    <line x1="50" y1="40" x2="70" y2="70" class="image" />
    <!-- Person -->
    <circle cx="40" cy="100" r="15" class="image" />
    <line x1="40" y1="115" x2="40" y2="150" class="image" />
    <line x1="40" y1="150" x2="20" y2="180" class="image" />
    <line x1="40" y1="150" x2="60" y2="180" class="image" />
    <line x1="40" y1="130" x2="70" y2="120" class="image" />
  </g>
</svg>