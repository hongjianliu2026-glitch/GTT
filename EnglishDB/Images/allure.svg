<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">allure</text>
  <text x="50" y="120" class="subtitle">[əˈlʊə(r)] n. 诱惑，魅力；v. 引诱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (朝向) + lure (引诱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的宝箱，"朝向(al-)"
    <tspan x="50" dy="25">你发出光芒，引诱(lure)你靠近，</tspan>
    <tspan x="50" dy="25">这就是诱惑(allure)的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The allure of the treasure chest was too strong to resist.
  </text>
  <text x="50" y="310" class="content">
    宝箱的诱惑力太强，无法抗拒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Treasure chest -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <!-- Sparkles -->
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="120" cy="90" r="8" class="image" />
    <circle cx="80" cy="100" r="6" class="image" />
    <!-- Person -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="230" y2="160" class="image" />
    <line x1="250" y1="130" x2="270" y2="160" class="image" />
    <line x1="250" y1="110" x2="280" y2="100" class="image" />
    <!-- Arrow -->
    <line x1="250" y1="75" x2="100" y2="75" class="image" />
    <polygon points="100,75 90,65 90,85" class="image" />
  </g>
</svg>