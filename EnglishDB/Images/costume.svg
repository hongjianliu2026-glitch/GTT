<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">costume</text>
  <text x="50" y="120" class="subtitle">[ˈkɒstjuːm] n. 服装，戏服</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cost (花费) + -ume (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演员在后台，"花费(cost)"
    <tspan x="50" dy="25">大量时间挑选和试穿各种戏服(costume)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a traditional costume for the festival.
  </text>
  <text x="50" y="310" class="content">
    她为节日穿上了传统服装。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dress form -->
    <rect x="0" y="0" width="150" height="300" class="image" />
    <!-- Dress -->
    <rect x="20" y="20" width="110" height="260" class="image" />
    <!-- Belt -->
    <line x1="20" y1="150" x2="130" y2="150" class="image" />
    <!-- Actor -->
    <circle cx="200" cy="150" r="30" class="image" />
    <line x1="200" y1="180" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="170" y2="300" class="image" />
    <line x1="200" y1="250" x2="230" y2="300" class="image" />
    <line x1="200" y1="200" x2="150" y2="190" class="image" />
    <line x1="200" y1="200" x2="250" y2="190" class="image" />
  </g>
</svg>