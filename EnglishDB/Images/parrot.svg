<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parrot</text>
  <text x="50" y="120" class="subtitle">[ˈpærət] n. 鹦鹉；v. 机械地模仿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> par (准备) + rot (旋转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鹦鹉在笼子里，"准备旋转(par-rot)"
    <tspan x="50" dy="25">它的头，模仿主人的每一句话，就像一个机械的复读机。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The parrot can parrot back everything you say.
  </text>
  <text x="50" y="310" class="content">
    这只鹦鹉能模仿你说的一切。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Parrot -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="140" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
    <line x1="100" y1="180" x2="70" y2="200" class="image" />
    <line x1="100" y1="180" x2="130" y2="200" class="image" />
    <!-- Speech bubble -->
    <path d="M 150 80 Q 200 80 200 120 Q 200 160 150 160 Q 100 160 100 120 Q 100 80 150 80 Z" class="image" />
    <text x="160" y="110" class="content">Hello!</text>
  </g>
</svg>