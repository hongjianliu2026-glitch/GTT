<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">guaranteed</text>
  <text x="50" y="120" class="subtitle">[ˌɡærənˈtiːd] adj. 保证的，有保证的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> guar (看守) + ante (在...之前) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个守卫(guar)站在你面前，"提前(ante)"
    <tspan x="50" dy="25">保护你，确保一切都在掌控之中，这就是"有保证的(guaranteed)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This product comes with a guaranteed satisfaction.
  </text>
  <text x="50" y="310" class="content">
    这个产品附带满意保证。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Guard -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="30" y2="240" class="image" />
    <line x1="50" y1="200" x2="70" y2="240" class="image" />
    <!-- Shield -->
    <polygon points="100,100 150,150 100,200 50,150" class="image" />
    <line x1="100" y1="100" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="50" y2="150" class="image" />
  </g>
</svg>