<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fatality</text>
  <text x="50" y="120" class="subtitle">[fəˈtælɪti] n. 死亡，致命性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fatal (致命的) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的骷髅头，象征着"致命的(fatal)"
    <tspan x="50" dy="25">力量，它带来的就是"死亡(fatality)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident resulted in three fatalities.
  </text>
  <text x="50" y="310" class="content">
    这次事故导致了三人死亡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skull -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="80" y1="160" x2="120" y2="160" class="image" />
    <line x1="60" y1="140" x2="80" y2="160" class="image" />
    <line x1="140" y1="140" x2="120" y2="160" class="image" />
  </g>
</svg>