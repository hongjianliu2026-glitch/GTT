<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suburbia</text>
  <text x="50" y="120" class="subtitle">[səˈbɜːrbiə] n. 郊区生活，郊区居民</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在...下面) + urb (城市)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的城市(urb)，下面(sub-)是一片宁静的郊区(suburbia)，
    <tspan x="50" dy="25">那里有整齐的房屋、绿树成荫的街道和悠闲的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She moved to suburbia to raise her family.
  </text>
  <text x="50" y="310" class="content">
    她搬到郊区抚养她的家庭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <rect x="20" y="20" width="50" height="80" class="image" />
    <rect x="90" y="10" width="50" height="90" class="image" />
    <rect x="160" y="30" width="50" height="70" class="image" />
    <rect x="230" y="10" width="50" height="90" class="image" />
    <rect x="300" y="20" width="50" height="80" class="image" />

    <!-- Suburb houses -->
    <rect x="50" y="120" width="30" height="30" class="image" />
    <rect x="100" y="120" width="30" height="30" class="image" />
    <rect x="150" y="120" width="30" height="30" class="image" />
    <rect x="200" y="120" width="30" height="30" class="image" />
    <rect x="250" y="120" width="30" height="30" class="image" />

    <!-- Trees -->
    <line x1="70" y1="150" x2="70" y2="180" class="image" />
    <line x1="70" y1="165" x2="50" y2="165" class="image" />
    <line x1="70" y1="165" x2="90" y2="165" class="image" />

    <line x1="120" y1="150" x2="120" y2="180" class="image" />
    <line x1="120" y1="165" x2="100" y2="165" class="image" />
    <line x1="120" y1="165" x2="140" y2="165" class="image" />

    <line x1="170" y1="150" x2="170" y2="180" class="image" />
    <line x1="170" y1="165" x2="150" y2="165" class="image" />
    <line x1="170" y1="165" x2="190" y2="165" class="image" />

    <line x1="220" y1="150" x2="220" y2="180" class="image" />
    <line x1="220" y1="165" x2="200" y2="165" class="image" />
    <line x1="220" y1="165" x2="240" y2="165" class="image" />

    <line x1="270" y1="150" x2="270" y2="180" class="image" />
    <line x1="270" y1="165" x2="250" y2="165" class="image" />
    <line x1="270" y1="165" x2="290" y2="165" class="image" />
  </g>
</svg>