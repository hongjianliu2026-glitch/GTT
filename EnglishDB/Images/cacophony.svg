<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cacophony</text>
  <text x="50" y="120" class="subtitle">[kəˈkɒfəni] n. 刺耳的声音，不和谐的声音</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> caco- (坏的) + phon (声音) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在一个拥挤的街道上，各种刺耳的声音交织在一起，
    <tspan x="50" dy="25">形成了一种"坏的声音(caco-phon-y)"，这就是cacophony。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cacophony of car horns and sirens made it impossible to think.
  </text>
  <text x="50" y="310" class="content">
    汽车喇叭和警笛的刺耳声音让人无法思考。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <line x1="70" y1="70" x2="70" y2="100" class="image" />
    <line x1="130" y1="70" x2="130" y2="100" class="image" />
    <!-- Horn -->
    <circle cx="90" cy="15" r="10" class="image" />
    <line x1="85" y1="15" x2="100" y2="15" class="image" />
    <!-- Siren -->
    <rect x="200" y="20" width="100" height="50" class="image" />
    <line x1="220" y1="70" x2="220" y2="100" class="image" />
    <line x1="280" y1="70" x2="280" y2="100" class="image" />
    <circle cx="240" cy="15" r="10" class="image" />
    <line x1="235" y1="15" x2="250" y2="15" class="image" />
  </g>
</svg>