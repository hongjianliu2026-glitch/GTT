<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">test-retest</text>
  <text x="50" y="120" class="subtitle">[test rɪˈtest] n. 重复测试</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> test (测试) + re- (再次) + test (测试)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在考试后，"再次(re-)"
    <tspan x="50" dy="25">进行同样的测试(test)，这就是重复测试(test-retest)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher decided to do a test-retest to ensure accuracy.
  </text>
  <text x="50" y="310" class="content">
    老师决定进行重复测试以确保准确性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First test -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <text x="20" y="40" class="content">Test 1</text>
    <!-- Arrow -->
    <line x1="170" y1="50" x2="230" y2="50" class="image" />
    <polygon points="230,50 220,45 220,55" class="image" />
    <!-- Second test -->
    <rect x="250" y="0" width="150" height="100" class="image" />
    <text x="270" y="40" class="content">Test 2</text>
  </g>
</svg>