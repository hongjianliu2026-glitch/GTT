<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plead</text>
  <text x="50" y="120" class="subtitle">[pliːd] v. 恳求，辩护</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ple (full) + ad (to)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"充满(ple)"了情感，"向(ad)"
    <tspan x="50" dy="25">法官恳求，这就是plead(恳求)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The defendant pleaded not guilty.
  </text>
  <text x="50" y="310" class="content">
    被告辩称自己无罪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <line x1="20" y1="100" x2="80" y2="100" class="image" />
    <line x1="20" y1="150" x2="80" y2="150" class="image" />

    <!-- Defendant -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />

    <!-- Plea -->
    <text x="150" y="80" class="content" style="font-size: 36px; fill: #E74C3C;">"Please!"</text>
  </g>
</svg>