<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">measurable</text>
  <text x="50" y="120" class="subtitle">[ˈmɛʒərəbəl] adj. 可测量的，可衡量的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> measur(e) (测量) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的尺子，"能够测量(measur-able)"
    <tspan x="50" dy="25">一切事物，从微小的粒子到广阔的天空。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The progress of the project is measurable by the number of tasks completed.
  </text>
  <text x="50" y="310" class="content">
    项目的进展可以通过完成的任务数量来衡量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ruler -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <line x1="20" y1="0" x2="20" y2="50" class="image" />
    <line x1="40" y1="0" x2="40" y2="50" class="image" />
    <line x1="60" y1="0" x2="60" y2="50" class="image" />
    <line x1="80" y1="0" x2="80" y2="50" class="image" />
    <line x1="100" y1="0" x2="100" y2="50" class="image" />
    <line x1="120" y1="0" x2="120" y2="50" class="image" />
    <line x1="140" y1="0" x2="140" y2="50" class="image" />
    <line x1="160" y1="0" x2="160" y2="50" class="image" />
    <line x1="180" y1="0" x2="180" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <line x1="220" y1="0" x2="220" y2="50" class="image" />
    <line x1="240" y1="0" x2="240" y2="50" class="image" />
    <line x1="260" y1="0" x2="260" y2="50" class="image" />
    <line x1="280" y1="0" x2="280" y2="50" class="image" />
    <line x1="300" y1="0" x2="300" y2="50" class="image" />
    <line x1="320" y1="0" x2="320" y2="50" class="image" />
    <line x1="340" y1="0" x2="340" y2="50" class="image" />
  </g>
</svg>