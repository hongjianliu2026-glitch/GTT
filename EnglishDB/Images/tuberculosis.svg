<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tuberculosis</text>
  <text x="50" y="120" class="subtitle">[ˌtjuːbərˈkjuːləʊsɪs] n. 肺结核</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tubercle (小瘤) + -osis (病症)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个肺部布满了"小瘤(tubercle)"，这些小瘤
    <tspan x="50" dy="25">引发了肺结核(tuberculosis)，让人呼吸困难。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was diagnosed with tuberculosis last year.
  </text>
  <text x="50" y="310" class="content">
    他去年被诊断出患有肺结核。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lung shape -->
    <path d="M50,50 C100,20 150,20 200,50 C250,80 250,120 200,150 C150,180 100,180 50,150 C0,120 0,80 50,50 Z" class="image" />
    <!-- Tubercles -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="120" cy="150" r="10" class="image" />
    <circle cx="80" cy="130" r="10" class="image" />
    <circle cx="180" cy="100" r="10" class="image" />
    <circle cx="160" cy="140" r="10" class="image" />
  </g>
</svg>