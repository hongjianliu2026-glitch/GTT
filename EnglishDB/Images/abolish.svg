<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abolish</text>
  <text x="50" y="120" class="subtitle">[əˈbɒlɪʃ] v. 废除，废止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + ol (生长) + -ish (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"离开(ab-)"并"生长(ol)"，
    <tspan x="50" dy="25">砸碎了一个旧的法律，象征着废除(abolish)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government decided to abolish the old tax system.
  </text>
  <text x="50" y="310" class="content">
    政府决定废除旧的税收制度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <rect x="0" y="0" width="150" height="50" class="image" />
    <line x1="75" y1="50" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="50" y2="200" class="image" />
    <line x1="75" y1="150" x2="100" y2="200" class="image" />
    <!-- Broken law -->
    <rect x="200" y="50" width="150" height="100" class="image" />
    <line x1="200" y1="100" x2="350" y2="100" class="image" />
    <line x1="275" y1="50" x2="275" y2="150" class="image" />
  </g>
</svg>