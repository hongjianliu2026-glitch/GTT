<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oh</text>
  <text x="50" y="120" class="subtitle">[oʊ] int. 哦，啊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，为感叹词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然看到一只巨大的蜘蛛，惊讶地发出"哦(oh)"的声音。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Oh, I didn't expect to see you here!
  </text>
  <text x="50" y="310" class="content">
    哦，我没想到会在这里见到你！
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="100" class="image" />
    <line x1="50" y1="90" x2="80" y2="100" class="image" />

    <!-- Spider -->
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="180" y2="90" class="image" />
    <line x1="200" y1="65" x2="220" y2="90" class="image" />
    <line x1="200" y1="65" x2="170" y2="40" class="image" />
    <line x1="200" y1="65" x2="230" y2="40" class="image" />
    <line x1="200" y1="65" x2="190" y2="90" class="image" />
    <line x1="200" y1="65" x2="210" y2="90" class="image" />

    <!-- Speech bubble -->
    <path d="M 50 30 Q 100 10 150 30 Q 150 50 100 70 Q 50 50 50 30" class="image" />
    <text x="70" y="50" class="content">oh!</text>
  </g>
</svg>