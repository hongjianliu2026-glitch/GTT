<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">primate</text>
  <text x="50" y="120" class="subtitle">[ˈpraɪmɪt] n. 灵长类动物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prim (第一，首要) + ate (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猴子坐在树顶，"第一(prim)"
    <tspan x="50" dy="25">的位置上，它是灵长类动物(primate)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Gorillas are one of the largest primates.
  </text>
  <text x="50" y="310" class="content">
    大猩猩是最大的灵长类动物之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Monkey -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="150" y2="150" class="image" />
    <line x1="175" y1="120" x2="200" y2="150" class="image" />
    <line x1="175" y1="90" x2="130" y2="80" class="image" />
    <line x1="175" y1="90" x2="220" y2="80" class="image" />
  </g>
</svg>