<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undiscovered</text>
  <text x="50" y="120" class="subtitle">[ˌʌndɪˈskʌvərd] adj. 未被发现的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + discover (发现)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在茂密的丛林中，"未被发现(un-discovered)"
    <tspan x="50" dy="25">的宝藏隐藏在深处，等待着被揭示。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The undiscovered species was found deep in the Amazon rainforest.
  </text>
  <text x="50" y="310" class="content">
    这种未被发现的物种在亚马逊雨林深处被发现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jungle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Explorer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Treasure -->
    <rect x="300" y="100" width="30" height="30" class="image" />
    <line x1="300" y1="100" x2="330" y2="130" class="image" />
    <line x1="330" y1="100" x2="300" y2="130" class="image" />
  </g>
</svg>