<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #FFCC5C; }
      .content { font: 18px sans-serif; fill: #6B5B95; }
      .highlight { font-weight: bold; fill: #FF6F61; }
      .story { font: 16px serif; fill: #88B04B; }
      .image { stroke: #FF6F61; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sugary</text>
  <text x="50" y="120" class="subtitle">[ˈʃʊɡəri] adj. 含糖的，甜的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sugar (糖) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的糖果山，"糖(sugar)"
    <tspan x="50" dy="25">覆盖了整个山峰，甜得让人陶醉(sugary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake was too sugary for my taste.
  </text>
  <text x="50" y="310" class="content">
    这蛋糕对我来说太甜了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Candy mountain -->
    <polygon points="0,200 150,0 300,200" class="image" fill="#FFCC5C" />
    <!-- Sugar crystals -->
    <circle cx="75" cy="100" r="10" class="image" fill="#FFFFFF" />
    <circle cx="125" cy="120" r="10" class="image" fill="#FFFFFF" />
    <circle cx="175" cy="80" r="10" class="image" fill="#FFFFFF" />
    <circle cx="225" cy="140" r="10" class="image" fill="#FFFFFF" />
    <!-- Person tasting -->
    <circle cx="250" cy="180" r="20" class="image" fill="#FF6F61" />
    <line x1="250" y1="200" x2="250" y2="240" class="image" />
    <line x1="250" y1="240" x2="230" y2="260" class="image" />
    <line x1="250" y1="240" x2="270" y2="260" class="image" />
    <line x1="250" y1="220" x2="280" y2="210" class="image" />
  </g>
</svg>