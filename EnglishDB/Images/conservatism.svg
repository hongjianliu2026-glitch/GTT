<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conservatism</text>
  <text x="50" y="120" class="subtitle">[kənˈsɜːrvətɪzəm] n. 保守主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + serv (保持) + -atism (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一个古老的图书馆里，"共同保持(con-serv)"
    <tspan x="50" dy="25">传统和价值观，这就是保守主义(conservatism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His conservatism prevented him from embracing new ideas.
  </text>
  <text x="50" y="310" class="content">
    他的保守主义使他无法接受新思想。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Library -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bookshelves -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Books -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- People -->
    <circle cx="20" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="180" cy="100" r="15" class="image" />
    <!-- Table -->
    <rect x="50" y="150" width="250" height="30" class="image" />
  </g>
</svg>