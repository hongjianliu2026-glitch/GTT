<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .pollution { fill: #808B96; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pollutant</text>
  <text x="50" y="120" class="subtitle">[pəˈluːtənt] n. 污染物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pollu- (污染) + -ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂排放出黑色的烟雾，"污染(pollu-)"
    <tspan x="50" dy="25">了周围的空气，这些烟雾就是污染物(pollutant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory's emissions are a major pollutant in the area.
  </text>
  <text x="50" y="310" class="content">
    工厂的排放物是该地区的主要污染物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Smoke -->
    <ellipse cx="200" cy="50" rx="100" ry="30" class="pollution" />
    <ellipse cx="220" cy="80" rx="90" ry="25" class="pollution" />
    <ellipse cx="240" cy="110" rx="80" ry="20" class="pollution" />
    <!-- Factory chimney -->
    <rect x="180" y="10" width="40" height="40" class="image" />
  </g>
</svg>