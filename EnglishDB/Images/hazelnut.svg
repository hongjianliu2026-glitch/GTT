<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .nut { fill: #8B4513; }
      .leaf { fill: #228B22; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hazelnut</text>
  <text x="50" y="120" class="subtitle">[ˈheɪzlnʌt] n. 榛子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hazel (榛树) + nut (坚果)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵榛树(hazel)上，挂满了"坚果(nut)"，
    <tspan x="50" dy="25">每一颗榛子都像是小小的宝藏，等待人们去发现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to snack on hazelnuts while reading.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在阅读时吃榛子当零食。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hazel tree -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <!-- Leaves -->
    <circle cx="50" cy="20" r="30" class="leaf" />
    <circle cx="20" cy="50" r="25" class="leaf" />
    <circle cx="80" cy="50" r="25" class="leaf" />
    <!-- Nuts -->
    <circle cx="50" cy="100" r="15" class="nut" />
    <circle cx="20" cy="120" r="15" class="nut" />
    <circle cx="80" cy="120" r="15" class="nut" />
  </g>
</svg>