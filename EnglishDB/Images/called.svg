<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">called</text>
  <text x="50" y="120" class="subtitle">[kɔːld] v. 称呼，呼叫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> call (呼叫) + -ed (过去式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在电话亭前，"呼叫(call)"
    <tspan x="50" dy="25">另一个人，然后那个人被称呼(called)为朋友。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was called by his nickname "Buddy".
  </text>
  <text x="50" y="310" class="content">
    他被称呼为昵称“Buddy”。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Telephone booth -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Telephone -->
    <circle cx="75" cy="100" r="20" class="image" />
    <line x1="75" y1="120" x2="75" y2="180" class="image" />
    <line x1="75" y1="180" x2="50" y2="200" class="image" />
    <line x1="75" y1="180" x2="100" y2="200" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 200 80 Q 250 80 250 120 L 200 120 Z" class="image" />
    <text x="210" y="100" class="content">"Buddy"</text>
  </g>
</svg>