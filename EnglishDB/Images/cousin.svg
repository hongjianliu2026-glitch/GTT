<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cousin</text>
  <text x="50" y="120" class="subtitle">[ˈkʌzən] n. 堂兄弟姐妹，表兄弟姐妹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cus- (来自拉丁语 "consobrinus"，意为"堂兄弟姐妹")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个孩子，一个是你的"堂兄弟(cus-)"，
    <tspan x="50" dy="25">另一个是你的"表兄弟(son)"，他们一起玩耍，就像亲兄弟一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My cousin and I went to the park together.
  </text>
  <text x="50" y="310" class="content">
    我和我的堂兄弟一起去公园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two children -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Arms and legs -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <!-- Connecting line -->
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
  </g>
</svg>