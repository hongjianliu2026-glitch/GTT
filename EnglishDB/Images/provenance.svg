<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">provenance</text>
  <text x="50" y="120" class="subtitle">[ˈpruːvənəns] n. 起源，出处</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + venire (来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件古老的文物，它的"起源(pro-venance)"
    <tspan x="50" dy="25">可以追溯到很久以前，就像一条时间线，</tspan>
    <tspan x="50" dy="25">从过去"走来(venire)"到现在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The provenance of the painting is still unknown.
  </text>
  <text x="50" y="310" class="content">
    这幅画的出处仍然未知。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ancient artifact -->
    <rect x="0" y="0" width="150" height="150" class="image" />
    <!-- Timeline -->
    <line x1="170" y1="75" x2="350" y2="75" class="image" />
    <line x1="170" y1="75" x2="170" y2="150" class="image" />
    <line x1="350" y1="75" x2="350" y2="150" class="image" />
    <!-- Arrows -->
    <polygon points="170,150 160,140 180,140" class="image" />
    <polygon points="350,150 340,140 360,140" class="image" />
    <!-- Labels -->
    <text x="170" y="170" class="content">过去</text>
    <text x="350" y="170" class="content">现在</text>
  </g>
</svg>