<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .crystal { fill: #AED6F1; stroke: #3498DB; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crystalline</text>
  <text x="50" y="120" class="subtitle">[ˈkrɪstəlaɪn] adj. 水晶般的，透明的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crystal (水晶) + -ine (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水晶球，"水晶(crystal)"
    <tspan x="50" dy="25">般的透明(crystalline)，反射出五彩斑斓的光芒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lake was so clear it looked almost crystalline.
  </text>
  <text x="50" y="310" class="content">
    湖水清澈得几乎像水晶一样。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crystal ball -->
    <circle cx="175" cy="100" r="75" class="crystal" />
    <!-- Reflections -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="125" y1="50" x2="225" y2="150" class="image" />
    <line x1="125" y1="150" x2="225" y2="50" class="image" />
  </g>
</svg>