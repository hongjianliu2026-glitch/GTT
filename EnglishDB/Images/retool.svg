<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retool</text>
  <text x="50" y="120" class="subtitle">[riːˈtuːl] v. 重新装备，重新配备</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + tool (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂工人正在"再次(re-)"
    <tspan x="50" dy="25">使用"工具(tool)"来改造生产线，</tspan>
    <tspan x="50" dy="25">这就是重新装备(retool)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to retool its production line to meet new market demands.
  </text>
  <text x="50" y="310" class="content">
    公司决定重新装备生产线以满足新的市场需求。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory worker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Tools -->
    <rect x="70" y="80" width="30" height="50" class="image" />
    <rect x="120" y="80" width="30" height="50" class="image" />
    <rect x="170" y="80" width="30" height="50" class="image" />
    <!-- Production line -->
    <line x1="50" y1="200" x2="250" y2="200" class="image" />
    <line x1="50" y1="220" x2="250" y2="220" class="image" />
    <line x1="50" y1="240" x2="250" y2="240" class="image" />
  </g>
</svg>