<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">English-language</text>
  <text x="50" y="120" class="subtitle">[ˈɪŋɡlɪʃ ˈlæŋɡwɪdʒ] n. 英语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> English (英语) + language (语言)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的字母"E"，它像一座桥，连接着世界各地的人们，
    <tspan x="50" dy="25">这座桥就是英语(English-language)，让不同文化的人能够交流。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks fluent English-language.
  </text>
  <text x="50" y="310" class="content">
    她能说流利的英语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Big letter "E" -->
    <path d="M50 50 L50 150 L150 150 L150 100 L100 100 L100 50 Z" class="image" />
    <!-- Bridge -->
    <line x1="200" y1="100" x2="400" y2="100" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="400" y1="100" x2="400" y2="150" class="image" />
    <!-- People -->
    <circle cx="220" cy="150" r="10" class="image" />
    <circle cx="260" cy="150" r="10" class="image" />
    <circle cx="300" cy="150" r="10" class="image" />
    <circle cx="340" cy="150" r="10" class="image" />
    <circle cx="380" cy="150" r="10" class="image" />
  </g>
</svg>