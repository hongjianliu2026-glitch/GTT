<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">greatest</text>
  <text x="50" y="120" class="subtitle">[ˈɡreɪtɪst] adj. 最大的，最伟大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> great (大) + -est (最高级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的山峰，"最大的(great)"
    <tspan x="50" dy="25">山峰在群山中脱颖而出，成为最伟大的(greatest)存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is considered the greatest athlete of all time.
  </text>
  <text x="50" y="310" class="content">
    他被认为是史上最伟大的运动员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain peak -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="30" class="image" />
    <!-- Clouds -->
    <ellipse cx="50" cy="100" rx="40" ry="20" class="image" />
    <ellipse cx="250" cy="120" rx="50" ry="25" class="image" />
  </g>
</svg>