<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adversely</text>
  <text x="50" y="120" class="subtitle">[ˈædvɜːrsli] adv. 不利地，相反地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + verse (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图向前走，但被一股强大的风"转向(ad-verse)"，
    <tspan x="50" dy="25">结果他不得不逆风而行，这就是"不利地(adversely)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was adversely affected by the budget cuts.
  </text>
  <text x="50" y="310" class="content">
    这个项目因预算削减而受到了不利影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person trying to walk forward -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <line x1="50" y1="60" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="40" y2="120" class="image" />
    <line x1="50" y1="100" x2="60" y2="120" class="image" />
    <line x1="50" y1="80" x2="70" y2="70" class="image" />

    <!-- Wind blowing against the person -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <polyline points="200,50 180,40 180,60" class="image" />
    <polyline points="200,50 190,40 190,60" class="image" />
    <polyline points="200,50 200,40 200,60" class="image" />
  </g>
</svg>