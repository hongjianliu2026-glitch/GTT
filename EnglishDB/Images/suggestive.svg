<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suggestive</text>
  <text x="50" y="120" class="subtitle">[səɡˈdʒestɪv] adj. 暗示的，引起联想的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sug- (下面) + gest (带来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在桌子下面偷偷传递(sug-gest)
    <tspan x="50" dy="25">一张纸条，这张纸条的内容让人产生联想(suggestive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie had suggestive scenes that made the audience blush.
  </text>
  <text x="50" y="310" class="content">
    这部电影中有一些暗示性的场景，让观众脸红。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person passing note -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Note -->
    <rect x="170" y="80" width="30" height="40" class="image" />
    <line x1="170" y1="80" x2="200" y2="80" class="image" />
    <line x1="170" y1="120" x2="200" y2="120" class="image" />
    <line x1="170" y1="80" x2="170" y2="120" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
  </g>
</svg>