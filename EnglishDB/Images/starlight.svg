<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .star { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">starlight</text>
  <text x="50" y="120" class="subtitle">[ˈstɑːrlaɪt] n. 星光</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> star (星星) + light (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象夜晚的天空中，无数星星闪烁，"星星的光芒(star-light)"
    <tspan x="50" dy="25">洒满大地，照亮了黑暗的夜空。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The starlight guided the lost travelers.
  </text>
  <text x="50" y="310" class="content">
    星光指引了迷路的旅行者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#1E90FF" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="10" class="star" />
    <circle cx="100" cy="80" r="8" class="star" />
    <circle cx="150" cy="120" r="12" class="star" />
    <circle cx="200" cy="60" r="9" class="star" />
    <circle cx="250" cy="100" r="11" class="star" />
    <circle cx="300" cy="140" r="10" class="star" />
    <!-- Moon -->
    <circle cx="320" cy="30" r="20" class="star" fill="#FFD700" />
  </g>
</svg>