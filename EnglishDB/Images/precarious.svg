<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">precarious</text>
  <text x="50" y="120" class="subtitle">[prɪˈkɛəriəs] adj. 不稳定的，危险的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + car (车) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在悬崖边上，"在前面(pre-)"
    <tspan x="50" dy="25">的车轮已经悬空，随时可能掉下去，</tspan>
    <tspan x="50" dy="25">这种状态就是"危险的(precarious)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The climber was in a precarious position on the cliff.
  </text>
  <text x="50" y="310" class="content">
    登山者在悬崖上处于一个危险的位置。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="150" y="10" width="100" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="170" cy="60" r="10" class="image" />
    <circle cx="230" cy="60" r="10" class="image" />
    <!-- Cliff edge -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <!-- Car hanging -->
    <line x1="150" y1="10" x2="150" y2="60" class="image" />
    <line x1="250" y1="10" x2="250" y2="60" class="image" />
  </g>
</svg>