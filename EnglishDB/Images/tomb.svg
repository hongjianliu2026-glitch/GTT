<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #6D4C41; }
      .content { font: 18px sans-serif; fill: #3E2723; }
      .highlight { font-weight: bold; fill: #B71C1C; }
      .story { font: 16px serif; fill: #4E342E; }
      .image { stroke: #795548; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tomb</text>
  <text x="50" y="120" class="subtitle">[tuːm] n. 坟墓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tom (切，割)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的石匠，用他的工具"切割(tom)"
    <tspan x="50" dy="25">石头，建造了一个庄严的坟墓(tomb)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The archaeologists discovered an ancient tomb.
  </text>
  <text x="50" y="310" class="content">
    考古学家发现了一座古老的坟墓。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tomb -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Stone carving -->
    <line x1="50" y1="20" x2="250" y2="20" class="image" />
    <line x1="50" y1="40" x2="250" y2="40" class="image" />
    <line x1="50" y1="60" x2="250" y2="60" class="image" />
    <line x1="50" y1="80" x2="250" y2="80" class="image" />
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="50" y1="120" x2="250" y2="120" class="image" />
    <line x1="50" y1="140" x2="250" y2="140" class="image" />
    <line x1="50" y1="160" x2="250" y2="160" class="image" />
    <line x1="50" y1="180" x2="250" y2="180" class="image" />
    <!-- Stonecutter -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>