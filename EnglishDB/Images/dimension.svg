<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dimension</text>
  <text x="50" y="120" class="subtitle">[daɪˈmenʃn] n. 尺寸，维度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + mens (测量) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个建筑师用尺子"分开测量(di-mens)"
    <tspan x="50" dy="25">一个立方体的长、宽、高，这些测量结果就构成了立方体的维度(dimension)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dimensions of the room are 4 meters by 5 meters.
  </text>
  <text x="50" y="310" class="content">
    这个房间的尺寸是4米乘5米。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cube -->
    <polygon points="0,0 100,0 100,100 0,100" class="image" />
    <polygon points="0,0 50,50 150,50 100,0" class="image" />
    <polygon points="0,100 50,150 150,150 100,100" class="image" />
    <polygon points="100,0 150,50 150,150 100,100" class="image" />
    <!-- Ruler -->
    <line x1="160" y1="0" x2="160" y2="200" class="image" />
    <line x1="160" y1="0" x2="180" y2="0" class="image" />
    <line x1="160" y1="50" x2="180" y2="50" class="image" />
    <line x1="160" y1="100" x2="180" y2="100" class="image" />
    <line x1="160" y1="150" x2="180" y2="150" class="image" />
    <line x1="160" y1="200" x2="180" y2="200" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="0" x2="150" y2="0" class="image" />
    <line x1="100" y1="0" x2="100" y2="50" class="image" />
    <line x1="100" y1="0" x2="150" y2="50" class="image" />
  </g>
</svg>