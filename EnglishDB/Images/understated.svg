<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">understated</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈsteɪtɪd] adj. 低调的，不张扬的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在下面) + state (陈述)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在演讲时，"在下面陈述(under-state)"
    <tspan x="50" dy="25">自己的观点，不张扬，保持低调(understated)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her elegance was understated but unmistakable.
  </text>
  <text x="50" y="310" class="content">
    她的优雅低调但不言而喻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person speaking -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 70 80 Q 150 50 230 80 Q 250 90 250 110 Q 230 140 70 110 Z" class="image" />
    <!-- Understated text -->
    <text x="90" y="100" class="content" style="font-size: 14px;">低调陈述</text>
  </g>
</svg>