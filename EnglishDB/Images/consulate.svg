<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consulate</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːnsələt] n. 领事馆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + sult (咨询)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个领事馆，"共同咨询(con-sult)"
    <tspan x="50" dy="25">的地方，代表着一个国家在国外的官方机构。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He went to the consulate to renew his passport.
  </text>
  <text x="50" y="310" class="content">
    他去领事馆续签护照。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Consulate building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flag -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <rect x1="50" y1="20" width="20" height="80" class="image" />
    <!-- Entrance -->
    <rect x="100" y="100" width="150" height="100" class="image" />
    <!-- Door -->
    <rect x="150" y="120" width="50" height="60" class="image" />
    <!-- Windows -->
    <rect x="120" y="50" width="40" height="40" class="image" />
    <rect x="200" y="50" width="40" height="40" class="image" />
    <rect x="280" y="50" width="40" height="40" class="image" />
  </g>
</svg>