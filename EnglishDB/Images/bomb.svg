<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bomb</text>
  <text x="50" y="120" class="subtitle">[bɒm] n. 炸弹；v. 轰炸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bom- (炸弹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗巨大的炸弹("bom-")从天而降，
    <tspan x="50" dy="25">瞬间爆炸，释放出巨大的能量和冲击波。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city was bombed during the war.
  </text>
  <text x="50" y="310" class="content">
    这座城市在战争期间遭到了轰炸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bomb -->
    <circle cx="100" cy="100" r="50" class="image" fill="#D35400" />
    <!-- Fuse -->
    <line x1="100" y1="50" x2="100" y2="20" class="image" />
    <!-- Explosion -->
    <circle cx="100" cy="100" r="80" class="image" fill="none" stroke="#E74C3C" stroke-width="5" />
    <circle cx="100" cy="100" r="100" class="image" fill="none" stroke="#E74C3C" stroke-width="5" />
    <circle cx="100" cy="100" r="120" class="image" fill="none" stroke="#E74C3C" stroke-width="5" />
  </g>
</svg>