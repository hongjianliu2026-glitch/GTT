<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wistfully</text>
  <text x="50" y="120" class="subtitle">[ˈwɪstfəli] adv. 渴望地，怀念地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wist (渴望) + -ful (充满) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在窗前，"充满渴望地(wist-ful-ly)"
    <tspan x="50" dy="25">望着远方，怀念着过去的美好时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked out the window wistfully, remembering her childhood.
  </text>
  <text x="50" y="310" class="content">
    她渴望地望着窗外，怀念着她的童年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Window -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="300" y1="0" x2="300" y2="200" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Person -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="230" class="image" />
    <line x1="175" y1="200" x2="200" y2="230" class="image" />
    <line x1="175" y1="180" x2="220" y2="170" class="image" />
    <!-- Horizon -->
    <line x1="0" y1="250" x2="350" y2="250" class="image" />
    <circle cx="100" cy="240" r="10" class="image" />
    <circle cx="250" cy="240" r="10" class="image" />
  </g>
</svg>