<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dream</text>
  <text x="50" y="120" class="subtitle">[driːm] n. 梦，梦想；v. 做梦，想象</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drem (睡眠)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在床上，闭着眼睛，"进入睡眠(drem)"
    <tspan x="50" dy="25">状态，脑海中浮现出各种奇幻的景象，这就是梦(dream)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a dream about flying last night.
  </text>
  <text x="50" y="310" class="content">
    她昨晚梦见自己在飞翔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person sleeping -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Dream bubble -->
    <circle cx="275" cy="80" r="40" class="image" />
    <line x1="275" y1="120" x2="320" y2="120" class="image" />
    <line x1="320" y1="120" x2="300" y2="100" class="image" />
    <line x1="320" y1="120" x2="300" y2="140" class="image" />
  </g>
</svg>