<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bully</text>
  <text x="50" y="120" class="subtitle">[ˈbʊli] n. 欺凌者，恶霸；v. 欺负，威吓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bull (公牛) + -y (表示人或行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的"公牛(bull)"在欺负(bully)
    <tspan x="50" dy="25">一个弱小的孩子，这个公牛般的恶霸(bully)让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The school has a zero-tolerance policy on bullying.
  </text>
  <text x="50" y="310" class="content">
    学校对欺凌行为采取零容忍政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bully -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Victim -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="140" x2="180" y2="180" class="image" />
    <line x1="200" y1="140" x2="220" y2="180" class="image" />
    <!-- Bully pointing -->
    <line x1="80" y1="130" x2="180" y2="130" class="image" />
  </g>
</svg>