<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #7E5109; }
      .content { font: 18px sans-serif; fill: #1A5276; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #154360; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">depress</text>
  <text x="50" y="120" class="subtitle">[dɪˈpres] v. 使沮丧，使消沉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + press (压)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"向下压(de-press)"，
    <tspan x="50" dy="25">他的心情也随之沉入谷底，变得沮丧(depress)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bad news depressed him greatly.
  </text>
  <text x="50" y="310" class="content">
    坏消息让他非常沮丧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="130" class="image" />
    <line x1="50" y1="150" x2="80" y2="130" class="image" />
    <!-- Arrow pressing down -->
    <polygon points="150,50 180,80 120,80" class="image" />
    <line x1="150" y1="80" x2="150" y2="200" class="image" />
  </g>
</svg>