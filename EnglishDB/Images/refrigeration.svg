<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">refrigeration</text>
  <text x="50" y="120" class="subtitle">[rɪˌfrɪdʒəˈreɪʃn] n. 冷藏，冷冻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + frig (冷) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的冰箱，"再次冷却(re-frig)"
    <tspan x="50" dy="25">里面的食物，保持它们的新鲜度，这就是冷藏(refrigeration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store uses refrigeration to keep the food fresh.
  </text>
  <text x="50" y="310" class="content">
    商店使用冷藏技术来保持食物的新鲜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Refrigerator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Ice cubes -->
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="100" cy="60" r="10" class="image" />
    <circle cx="120" cy="60" r="10" class="image" />
    <!-- Food items -->
    <rect x="150" y="40" width="30" height="30" class="image" />
    <rect x="190" y="40" width="30" height="30" class="image" />
    <rect x="230" y="40" width="30" height="30" class="image" />
  </g>
</svg>