<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">legislator</text>
  <text x="50" y="120" class="subtitle">[ˈlɛdʒɪsleɪtər] n. 立法者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> legis (法律) + -lat (带来) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个立法者站在议会大厅，"带来(lat)"
    <tspan x="50" dy="25">新的法律(legis)，他就是立法者(legislator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The legislator proposed a new bill to protect the environment.
  </text>
  <text x="50" y="310" class="content">
    这位立法者提出了一项保护环境的新法案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parliament building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Legislator -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Law book -->
    <rect x="100" y="80" width="100" height="100" class="image" />
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <line x1="120" y1="120" x2="180" y2="120" class="image" />
    <line x1="120" y1="140" x2="180" y2="140" class="image" />
    <line x1="120" y1="160" x2="180" y2="160" class="image" />
  </g>
</svg>