<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">treacherous</text>
  <text x="50" y="120" class="subtitle">[ˈtrɛtʃərəs] adj. 背叛的，危险的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> treach (陷阱) + -erous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满陷阱(treach)的森林，每一步都可能
    <tspan x="50" dy="25">导致背叛(treacherous)，让人心生恐惧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mountain path was treacherous after the storm.
  </text>
  <text x="50" y="310" class="content">
    暴风雨后，山路变得非常危险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="100" y1="20" x2="100" y2="150" class="image" />
    <line x1="150" y1="20" x2="150" y2="150" class="image" />
    <line x1="200" y1="20" x2="200" y2="150" class="image" />
    <line x1="250" y1="20" x2="250" y2="150" class="image" />
    <!-- Traps -->
    <circle cx="75" cy="100" r="10" class="image" />
    <circle cx="125" cy="100" r="10" class="image" />
    <circle cx="175" cy="100" r="10" class="image" />
    <circle cx="225" cy="100" r="10" class="image" />
    <circle cx="275" cy="100" r="10" class="image" />
    <!-- Person -->
    <circle cx="20" cy="180" r="15" class="image" />
    <line x1="20" y1="195" x2="20" y2="230" class="image" />
    <line x1="20" y1="230" x2="0" y2="260" class="image" />
    <line x1="20" y1="230" x2="40" y2="260" class="image" />
    <line x1="20" y1="210" x2="50" y2="200" class="image" />
  </g>
</svg>