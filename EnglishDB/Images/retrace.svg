<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retrace</text>
  <text x="50" y="120" class="subtitle">[rɪˈtreɪs] v. 追溯，回顾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + trace (追踪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在地图上，"回头追踪(re-trace)"
    <tspan x="50" dy="25">自己的足迹，试图找回过去的记忆。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to retrace her steps to find her lost keys.
  </text>
  <text x="50" y="310" class="content">
    她决定回头找找，试图找到丢失的钥匙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Path -->
    <path d="M50,150 Q100,50 150,150 T300,150" class="image" />
    <!-- Person -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="35" y2="210" class="image" />
    <line x1="50" y1="190" x2="65" y2="210" class="image" />
    <line x1="50" y1="175" x2="70" y2="165" class="image" />
  </g>
</svg>