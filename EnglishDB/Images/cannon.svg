<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cannon</text>
  <text x="50" y="120" class="subtitle">[ˈkænən] n. 大炮，加农炮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> can (容器) + non (强调)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"容器(can)"，里面装满了火药，
    <tspan x="50" dy="25">当它被点燃时，"强调(non)"出巨大的爆炸力，</tspan>
    <tspan x="50" dy="25">这就是大炮(cannon)的威力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers fired the cannon to signal the start of the battle.
  </text>
  <text x="50" y="310" class="content">
    士兵们开炮以示战斗开始。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cannon barrel -->
    <rect x="0" y="0" width="300" height="50" class="image" />
    <!-- Cannon base -->
    <rect x="100" y="50" width="100" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="125" cy="110" r="20" class="image" />
    <circle cx="175" cy="110" r="20" class="image" />
    <!-- Fire -->
    <polygon points="300,25 350,0 350,50" class="image" />
  </g>
</svg>