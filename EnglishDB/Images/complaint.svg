<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">complaint</text>
  <text x="50" y="120" class="subtitle">[kəmˈpleɪnt] n. 抱怨，投诉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + plaint (哀叹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在"一起哀叹(com-plaint)"，
    <tspan x="50" dy="25">表达他们的不满，这就是投诉(complaint)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She filed a complaint about the poor service.
  </text>
  <text x="50" y="310" class="content">
    她对糟糕的服务提出了投诉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Speech bubbles -->
    <path d="M 50 30 Q 30 10 50 0 Q 70 10 50 30" class="image" />
    <path d="M 100 30 Q 80 10 100 0 Q 120 10 100 30" class="image" />
    <path d="M 150 30 Q 130 10 150 0 Q 170 10 150 30" class="image" />
    <!-- Complaint text -->
    <text x="40" y="25" class="content">"This is bad!"</text>
    <text x="90" y="25" class="content">"So unfair!"</text>
    <text x="140" y="25" class="content">"I'm unhappy!"</text>
  </g>
</svg>