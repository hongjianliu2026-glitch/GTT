<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conflicting</text>
  <text x="50" y="120" class="subtitle">[kənˈfliktɪŋ] adj. 冲突的，矛盾的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + flict (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在激烈地"互相打击(con-flict)"，
    <tspan x="50" dy="25">他们的意见和行动完全相反，这就是冲突(conflicting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The conflicting reports made it difficult to determine the truth.
  </text>
  <text x="50" y="310" class="content">
    相互矛盾的报告使得难以确定真相。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="210" y2="130" class="image" />

    <!-- Arrows representing conflict -->
    <line x1="70" y1="110" x2="230" y2="110" class="image" />
    <line x1="230" y1="110" x2="230" y2="90" class="image" />
    <line x1="230" y1="90" x2="210" y2="110" class="image" />

    <line x1="230" y1="110" x2="70" y2="110" class="image" />
    <line x1="70" y1="110" x2="70" y2="90" class="image" />
    <line x1="70" y1="90" x2="90" y2="110" class="image" />
  </g>
</svg>