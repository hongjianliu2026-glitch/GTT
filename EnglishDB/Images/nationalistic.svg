<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nationalistic</text>
  <text x="50" y="120" class="subtitle">[ˌnæʃənəˈlɪstɪk] adj. 民族主义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nation (国家) + -al (形容词后缀) + -istic (表示“倾向”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满爱国热情的人，"国家(nation)"
    <tspan x="50" dy="25">在他的心中占据了至高无上的地位，</tspan>
    <tspan x="50" dy="25">他的一切行为都带有强烈的民族主义色彩(nationalistic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His nationalistic views often led to conflicts with others.
  </text>
  <text x="50" y="310" class="content">
    他的民族主义观点常常导致与其他人的冲突。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 Q100,20 150,50 Q100,80 50,50" class="image" />
    <!-- Flag waving -->
    <rect x="70" y="60" width="60" height="40" class="image" />
    <line x1="70" y1="60" x2="130" y2="60" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <!-- Person with patriotic gesture -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="140" y2="180" class="image" />
  </g>
</svg>