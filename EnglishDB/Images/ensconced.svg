<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ensconced</text>
  <text x="50" y="120" class="subtitle">[ɪnˈskoʊnst] v. 安置，安顿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + sconce (隐蔽处)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"安置(en-)"在一个"隐蔽处(sconce)"，
    <tspan x="50" dy="25">就像被包裹在一个安全的茧中，舒适而安全。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt ensconced in her cozy armchair, reading a book.
  </text>
  <text x="50" y="310" class="content">
    她坐在舒适的扶手椅上，感觉很安顿，正在读一本书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hidden place -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="120" y2="220" class="image" />
    <line x1="150" y1="180" x2="180" y2="220" class="image" />
    <line x1="150" y1="150" x2="100" y2="140" class="image" />
    <line x1="150" y1="150" x2="200" y2="140" class="image" />
    <!-- Cozy environment -->
    <rect x="50" y="50" width="200" height="100" class="image" />
    <line x1="70" y1="70" x2="230" y2="70" class="image" />
    <line x1="70" y1="90" x2="230" y2="90" class="image" />
    <line x1="70" y1="110" x2="230" y2="110" class="image" />
  </g>
</svg>