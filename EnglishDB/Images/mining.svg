<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mining</text>
  <text x="50" y="120" class="subtitle">[ˈmaɪnɪŋ] n. 采矿，挖掘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mine (矿) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群矿工在地下，"挖掘(mine-ing)"
    <tspan x="50" dy="25">宝贵的矿石，这就是采矿(mining)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company specializes in gold mining.
  </text>
  <text x="50" y="310" class="content">
    这家公司专门从事黄金开采。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mine entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="250" height="150" class="image" />
    <!-- Miner -->
    <circle cx="100" cy="120" r="15" class="image" />
    <line x1="100" y1="135" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="200" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
    <!-- Pickaxe -->
    <line x1="100" y1="135" x2="150" y2="80" class="image" />
    <line x1="150" y1="80" x2="140" y2="90" class="image" />
    <line x1="150" y1="80" x2="160" y2="90" class="image" />
  </g>
</svg>