<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misunderstand</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsʌndərˈstænd] v. 误解，误会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + understand (理解)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在对话，其中一个人"错误地理解(mis-understand)"
    <tspan x="50" dy="25">对方的意思，导致了一场误会。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She misunderstood his intentions and got upset.
  </text>
  <text x="50" y="310" class="content">
    她误解了他的意图，感到很沮丧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person 1 -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <!-- Person 2 -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />

    <!-- Speech bubbles -->
    <path d="M50,80 Q30,80 30,60 Q50,60 50,80 Z" class="image" />
    <path d="M200,80 Q220,80 220,60 Q200,60 200,80 Z" class="image" />

    <!-- Crossed out understanding -->
    <line x1="100" y1="150" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
  </g>
</svg>