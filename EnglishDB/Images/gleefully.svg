<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gleefully</text>
  <text x="50" y="120" class="subtitle">[ˈɡliːfəli] adv. 高兴地，快乐地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glee (快乐) + -ful (充满) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在阳光下跳跃，脸上洋溢着"快乐(glee)"的笑容，
    <tspan x="50" dy="25">周围充满了快乐的气氛，这就是"高兴地(gleefully)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children gleefully ran towards the playground.
  </text>
  <text x="50" y="310" class="content">
    孩子们高兴地跑向游乐场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Person jumping -->
    <circle cx="200" cy="150" r="20" class="image" fill="#2ECC71" />
    <line x1="200" y1="170" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="180" y2="280" class="image" />
    <line x1="200" y1="250" x2="220" y2="280" class="image" />
    <line x1="200" y1="200" x2="170" y2="190" class="image" />
    <line x1="200" y1="200" x2="230" y2="190" class="image" />
    <!-- Smile -->
    <path d="M190,160 Q200,155 210,160" class="image" fill="none" stroke="#2C3E50" stroke-width="2" />
  </g>
</svg>