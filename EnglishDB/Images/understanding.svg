<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">understanding</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈstændɪŋ] n. 理解，领悟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在...下面) + stand (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在知识的"下面(under)"，
    <tspan x="50" dy="25">试图"站立(stand)"起来，理解(understanding)复杂的概念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His understanding of the subject was profound.
  </text>
  <text x="50" y="310" class="content">
    他对这个主题的理解非常深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing under a cloud -->
    <circle cx="200" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="200" y1="150" x2="200" y2="250" class="image" /> <!-- Body -->
    <line x1="200" y1="250" x2="150" y2="300" class="image" /> <!-- Left leg -->
    <line x1="200" y1="250" x2="250" y2="300" class="image" /> <!-- Right leg -->
    <line x1="200" y1="180" x2="150" y2="220" class="image" /> <!-- Left arm -->
    <line x1="200" y1="180" x2="250" y2="220" class="image" /> <!-- Right arm -->
    <ellipse cx="200" cy="50" rx="100" ry="30" class="image" /> <!-- Cloud -->
    <text x="150" y="60" class="content" fill="#2980B9">知识</text>
  </g>
</svg>