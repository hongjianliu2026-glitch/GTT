<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sheepishly</text>
  <text x="50" y="120" class="subtitle">[ˈʃiːpɪʃli] adv. 羞怯地，胆怯地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sheep (羊) + -ish (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小羊在人群中，"羞怯地(sheepishly)"
    <tspan x="50" dy="25">低着头，不敢直视别人，就像小羊一样胆怯。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She answered the question sheepishly, avoiding eye contact.
  </text>
  <text x="50" y="310" class="content">
    她羞怯地回答了问题，避免眼神接触。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sheep -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="140" x2="180" y2="180" class="image" />
    <line x1="200" y1="140" x2="220" y2="180" class="image" />
    <line x1="200" y1="160" x2="170" y2="200" class="image" />
    <line x1="200" y1="160" x2="230" y2="200" class="image" />
    <!-- Sheepish expression -->
    <circle cx="190" cy="90" r="5" class="image" />
    <circle cx="210" cy="90" r="5" class="image" />
    <path d="M190 110 Q200 120 210 110" class="image" />
  </g>
</svg>