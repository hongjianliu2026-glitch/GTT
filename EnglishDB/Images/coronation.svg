<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coronation</text>
  <text x="50" y="120" class="subtitle">[ˌkɔːrəˈneɪʃn] n. 加冕礼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> coro- (王冠) + nation (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位国王坐在宝座上，头上戴着闪闪发光的王冠，
    <tspan x="50" dy="25">周围是欢呼的人群，这就是加冕礼(coronation)的盛大场面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coronation of the new king was a grand event.
  </text>
  <text x="50" y="310" class="content">
    新国王的加冕礼是一个盛大的事件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- King -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Crown -->
    <path d="M145,70 L175,30 L205,70 Z" class="image" />
    <line x1="155" y1="70" x2="195" y2="70" class="image" />
    <line x1="165" y1="70" x2="165" y2="50" class="image" />
    <line x1="185" y1="70" x2="185" y2="50" class="image" />
    <!-- Crowd -->
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <circle cx="300" cy="150" r="10" class="image" />
  </g>
</svg>