<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pup</text>
  <text x="50" y="120" class="subtitle">[pʌp] n. 小狗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pup (源自拉丁语 "pupa"，意为"小女孩"，后引申为"小狗")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只可爱的小狗(pup)，它像个小女孩(pupa)一样活泼可爱，
    <tspan x="50" dy="25">蹦蹦跳跳地在草地上玩耍。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The puppy is playing with a ball in the yard.
  </text>
  <text x="50" y="310" class="content">
    小狗在院子里玩球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puppy -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="40" cy="80" r="10" class="image" />
    <circle cx="60" cy="80" r="10" class="image" />
    <line x1="50" y1="110" x2="50" y2="140" class="image" />
    <line x1="50" y1="140" x2="30" y2="170" class="image" />
    <line x1="50" y1="140" x2="70" y2="170" class="image" />
    <line x1="50" y1="120" x2="80" y2="110" class="image" />
    <!-- Ball -->
    <circle cx="150" cy="100" r="20" class="image" />
  </g>
</svg>