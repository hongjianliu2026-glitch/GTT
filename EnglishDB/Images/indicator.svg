<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indicator</text>
  <text x="50" y="120" class="subtitle">[ˈɪndɪkeɪtər] n. 指示器，指标</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (向内) + dic (说) + -ator (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头"向内指向(in-dic)"某个方向，
    <tspan x="50" dy="25">这个箭头就是一个指示器(indicator)，告诉你该往哪里走。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The traffic light is an indicator of when to stop or go.
  </text>
  <text x="50" y="310" class="content">
    红绿灯是一个指示器，告诉你何时停下或前进。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow -->
    <polygon points="0,100 100,100 100,50 150,100 100,150 100,100" class="image" />
    <!-- Circle around arrow -->
    <circle cx="75" cy="100" r="75" class="image" />
    <!-- Text inside circle -->
    <text x="75" y="110" text-anchor="middle" class="content">指示器</text>
  </g>
</svg>