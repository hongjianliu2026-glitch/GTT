<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">runaway</text>
  <text x="50" y="120" class="subtitle">[ˈrʌnəweɪ] n. 逃跑者，失控的事物；adj. 逃跑的，失控的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> run (跑) + away (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拼命地跑(run)，远离(away)危险，
    <tspan x="50" dy="25">这个人就成了逃跑者(runaway)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The runaway horse was finally caught by the farmer.
  </text>
  <text x="50" y="310" class="content">
    逃跑的马最终被农夫抓住了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Running person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />

    <!-- Path -->
    <line x1="100" y1="100" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="350" y2="150" class="image" />
    <line x1="350" y1="150" x2="400" y2="100" class="image" />
    <line x1="400" y1="100" x2="600" y2="100" class="image" />

    <!-- Danger sign -->
    <polygon points="650,100 630,130 670,130" class="image" />
    <text x="640" y="140" class="content" text-anchor="middle">!</text>
  </g>
</svg>