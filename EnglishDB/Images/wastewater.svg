<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wastewater</text>
  <text x="50" y="120" class="subtitle">[ˈweɪstˌwɔːtər] n. 废水，污水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> waste (浪费) + water (水)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂排放的废水(wastewater)，
    <tspan x="50" dy="25">这些水被浪费(waste)了，变成了污水(water)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The treatment plant cleans the wastewater before it is released into the river.
  </text>
  <text x="50" y="310" class="content">
    污水处理厂在废水排入河流之前对其进行净化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pipe -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="300" y1="50" x2="300" y2="150" class="image" />
    <!-- Wastewater -->
    <path d="M300,150 Q350,150 350,200" class="image" />
    <path d="M350,200 Q400,200 400,250" class="image" />
    <path d="M400,250 Q450,250 450,300" class="image" />
    <!-- Water droplets -->
    <circle cx="320" cy="160" r="10" class="image" />
    <circle cx="340" cy="170" r="10" class="image" />
    <circle cx="360" cy="180" r="10" class="image" />
    <circle cx="380" cy="190" r="10" class="image" />
    <circle cx="400" cy="200" r="10" class="image" />
  </g>
</svg>