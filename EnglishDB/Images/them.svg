<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">them</text>
  <text x="50" y="120" class="subtitle">[ðɛm] pron. 他们，她们，它们</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> the (定冠词) + -em (代词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人站在你面前，你指着他们说："就是<tspan x="50" dy="25">他们(them)！"</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I saw them at the park yesterday.
  </text>
  <text x="50" y="310" class="content">
    我昨天在公园里看到了他们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Arms and legs -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <line x1="35" y1="85" x2="65" y2="85" class="image" />
    <line x1="135" y1="85" x2="165" y2="85" class="image" />
    <line x1="235" y1="85" x2="265" y2="85" class="image" />
    <!-- Pointer -->
    <line x1="300" y1="50" x2="260" y2="50" class="image" />
    <polygon points="300,50 290,45 290,55" class="image" />
  </g>
</svg>