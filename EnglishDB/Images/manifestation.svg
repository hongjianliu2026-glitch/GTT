<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">manifestation</text>
  <text x="50" y="120" class="subtitle">[ˌmænɪfesˈteɪʃn] n. 表现，显示</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mani- (手) + fest (打击) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用手("mani-")猛击("fest")桌子，
    <tspan x="50" dy="25">这个动作就是他内心情绪的"表现(manifestation)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her smile was the manifestation of her joy.
  </text>
  <text x="50" y="310" class="content">
    她的微笑是她喜悦的表现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Hand hitting the table -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="10" class="image" />
    <line x1="150" y1="10" x2="130" y2="30" class="image" />
    <line x1="150" y1="10" x2="170" y2="30" class="image" />
    <!-- Emotion bubble -->
    <circle cx="250" cy="50" r="30" class="image" />
    <text x="240" y="55" class="content" fill="#E74C3C">!</text>
  </g>
</svg>