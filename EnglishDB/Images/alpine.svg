<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alpine</text>
  <text x="50" y="120" class="subtitle">[ˈælpaɪn] adj. 高山的，阿尔卑斯山的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (高) + pine (山)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个登山者在高耸入云的"高山(al-pine)"上，
    <tspan x="50" dy="25">周围是白雪皑皑的山峰，这就是阿尔卑斯山(alpine)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The climber reached the alpine summit at dawn.
  </text>
  <text x="50" y="310" class="content">
    登山者在黎明时分到达了高山之巅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" fill="#7F8C8D" />
    <!-- Snow cap -->
    <polygon points="50,100 150,50 250,100" class="image" fill="white" />
    <!-- Climber -->
    <circle cx="150" cy="150" r="10" class="image" fill="#E74C3C" />
    <line x1="150" y1="160" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="140" y2="200" class="image" />
    <line x1="150" y1="180" x2="160" y2="200" class="image" />
    <line x1="150" y1="170" x2="130" y2="160" class="image" />
    <line x1="150" y1="170" x2="170" y2="160" class="image" />
  </g>
</svg>