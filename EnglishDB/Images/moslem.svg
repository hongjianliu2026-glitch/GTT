<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Moslem</text>
  <text x="50" y="120" class="subtitle">[ˈmɒzləm] n. 穆斯林，伊斯兰教徒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Mos- (源自阿拉伯语 "Muslim"，意为"顺从者")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个虔诚的穆斯林，"顺从(Mos-)"
    <tspan x="50" dy="25">于真主的教诲，每天祈祷，这就是一个穆斯林(Moslem)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Moslem community in the city is very active.
  </text>
  <text x="50" y="310" class="content">
    这个城市的穆斯林社区非常活跃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Prayer mat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person praying -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="130" class="image" />
    <line x1="175" y1="150" x2="205" y2="130" class="image" />
    <line x1="175" y1="180" x2="145" y2="200" class="image" />
    <line x1="175" y1="180" x2="205" y2="200" class="image" />
    <!-- Crescent moon and star -->
    <path d="M250,50 A50,50 0 0,0 300,50 L275,75 Z" class="image" />
    <line x1="275" y1="75" x2="275" y2="100" class="image" />
  </g>
</svg>