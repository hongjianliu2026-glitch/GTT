<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scramble</text>
  <text x="50" y="120" class="subtitle">[ˈskræmbl] v. 争夺，搅乱；n. 攀爬，混乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scrambl (混乱，攀爬)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在混乱中"争夺(scramble)"
    <tspan x="50" dy="25">一个宝藏，场面混乱不堪，每个人都想攀爬(scramble)到顶端。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children scrambled to grab the candy.
  </text>
  <text x="50" y="310" class="content">
    孩子们争先恐后地去抢糖果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- People -->
    <circle cx="50" cy="160" r="15" class="image" />
    <line x1="50" y1="175" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="35" y2="230" class="image" />
    <line x1="50" y1="200" x2="65" y2="230" class="image" />
    <line x1="50" y1="190" x2="80" y2="180" class="image" />

    <circle cx="100" cy="140" r="15" class="image" />
    <line x1="100" y1="155" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="85" y2="210" class="image" />
    <line x1="100" y1="180" x2="115" y2="210" class="image" />
    <line x1="100" y1="170" x2="130" y2="160" class="image" />

    <circle cx="150" cy="120" r="15" class="image" />
    <line x1="150" y1="135" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="135" y2="190" class="image" />
    <line x1="150" y1="160" x2="165" y2="190" class="image" />
    <line x1="150" y1="150" x2="180" y2="140" class="image" />

    <!-- Treasure -->
    <rect x="250" y="100" width="50" height="50" class="image" />
    <line x1="250" y1="100" x2="300" y2="100" class="image" />
    <line x1="250" y1="150" x2="300" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="300" y1="100" x2="300" y2="150" class="image" />
  </g>
</svg>