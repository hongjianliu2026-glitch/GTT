<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fame</text>
  <text x="50" y="120" class="subtitle">[feɪm] n. 名声，名望</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fam (说) + e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在舞台上，"被众人说(fam-e)"
    <tspan x="50" dy="25">着他的名字，他的名声(fame)传遍四方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She achieved fame as a talented musician.
  </text>
  <text x="50" y="310" class="content">
    她作为一名有才华的音乐家而声名鹊起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on stage -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="140" class="image" />
    <line x1="175" y1="150" x2="205" y2="140" class="image" />
    <line x1="175" y1="180" x2="145" y2="200" class="image" />
    <line x1="175" y1="180" x2="205" y2="200" class="image" />
    <!-- Crowd -->
    <circle cx="50" cy="250" r="10" class="image" />
    <circle cx="100" cy="250" r="10" class="image" />
    <circle cx="150" cy="250" r="10" class="image" />
    <circle cx="200" cy="250" r="10" class="image" />
    <circle cx="250" cy="250" r="10" class="image" />
    <circle cx="300" cy="250" r="10" class="image" />
    <!-- Speech bubbles -->
    <path d="M50,230 Q70,220 90,230" class="image" />
    <path d="M100,230 Q120,220 140,230" class="image" />
    <path d="M150,230 Q170,220 190,230" class="image" />
    <path d="M200,230 Q220,220 240,230" class="image" />
    <path d="M250,230 Q270,220 290,230" class="image" />
    <path d="M300,230 Q320,220 340,230" class="image" />
  </g>
</svg>