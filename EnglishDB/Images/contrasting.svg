<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contrasting</text>
  <text x="50" y="120" class="subtitle">[kənˈtræstɪŋ] adj. 对比的，形成鲜明对比的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> contra- (相反) + st (站立) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个完全相反的物体"对立站立(contra-st)"，
    <tspan x="50" dy="25">一个黑得像夜，一个白得像昼，形成鲜明对比(contrasting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The contrasting colors of the sunset were breathtaking.
  </text>
  <text x="50" y="310" class="content">
    日落时对比鲜明的色彩令人叹为观止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Black circle -->
    <circle cx="100" cy="100" r="50" class="image" fill="#000" />
    <!-- White circle -->
    <circle cx="300" cy="100" r="50" class="image" fill="#FFF" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <polygon points="250,80 270,100 250,120" class="image" fill="#7F8C8D" />
  </g>
</svg>