<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eagle</text>
  <text x="50" y="120" class="subtitle">[ˈiːɡl] n. 鹰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "aquila"，意为鹰
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只雄鹰(eagle)在天空中翱翔，
    <tspan x="50" dy="25">它的翅膀展开，俯瞰大地，象征着力量与自由。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The eagle soared high above the mountains.
  </text>
  <text x="50" y="310" class="content">
    那只鹰在山巅之上翱翔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Eagle body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eagle wings -->
    <line x1="50" y1="100" x2="0" y2="50" class="image" />
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <!-- Eagle head -->
    <circle cx="100" cy="70" r="15" class="image" />
    <!-- Eagle beak -->
    <polygon points="90,70 110,70 100,50" class="image" />
    <!-- Eagle talons -->
    <line x1="80" y1="150" x2="70" y2="170" class="image" />
    <line x1="120" y1="150" x2="130" y2="170" class="image" />
  </g>
</svg>