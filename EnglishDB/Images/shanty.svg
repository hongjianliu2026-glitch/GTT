<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shanty</text>
  <text x="50" y="120" class="subtitle">[ˈʃænti] n. 简陋的小屋，棚屋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shan (简陋) + ty (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个破旧的"简陋小屋(shanty)"，
    <tspan x="50" dy="25">屋顶漏水，墙壁倾斜，仿佛随时会倒塌。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The homeless man lived in a shanty by the river.
  </text>
  <text x="50" y="310" class="content">
    那个无家可归的人住在河边的一个简陋小屋里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shanty -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Roof -->
    <polygon points="50,20 300,20 275,0 75,0" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="80" class="image" />
    <!-- Window -->
    <rect x="220" y="100" width="50" height="50" class="image" />
    <!-- Cracks -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>