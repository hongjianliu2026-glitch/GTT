<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fuselage</text>
  <text x="50" y="120" class="subtitle">[ˈfjuːzəlɑːʒ] n. 机身</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fuse (流) + lage (容器)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机的"流体容器(fuse-lage)"，
    <tspan x="50" dy="25">它承载着乘客和货物，就像一个流动的容器。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fuselage of the plane was damaged in the crash.
  </text>
  <text x="50" y="310" class="content">
    飞机的机身在坠毁中受损。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Fuselage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wings -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="300" y1="0" x2="300" y2="200" class="image" />
    <!-- Windows -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <!-- Tail -->
    <line x1="175" y1="200" x2="175" y2="250" class="image" />
    <line x1="150" y1="250" x2="200" y2="250" class="image" />
  </g>
</svg>