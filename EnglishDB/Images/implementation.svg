<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">implementation</text>
  <text x="50" y="120" class="subtitle">[ˌɪmplɪmenˈteɪʃn] n. 实施，执行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + ple (充满) + ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的计划书被"注入(im-)"到一个充满"执行力(ple-ment)"的团队中，
    <tspan x="50" dy="25">他们迅速将计划变为现实，这就是实施(implementation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The implementation of the new policy was smooth.
  </text>
  <text x="50" y="310" class="content">
    新政策的实施很顺利。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plan book -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Team -->
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="180" y2="100" class="image" />
    <polygon points="180,90 190,100 180,110" class="image" />
    <!-- Result -->
    <rect x="350" y="0" width="150" height="200" class="image" />
    <text x="370" y="120" class="content">Result</text>
  </g>
</svg>