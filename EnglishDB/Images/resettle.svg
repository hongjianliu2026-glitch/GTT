<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resettle</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈsɛtəl] v. 重新安置，重新定居</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + settle (安置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人搬家后，"再次安置(re-settle)"
    <tspan x="50" dy="25">他的家具，重新定居在一个新的地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the flood, many families had to resettle in new homes.
  </text>
  <text x="50" y="310" class="content">
    洪水过后，许多家庭不得不重新安置在新家中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old house -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- New house -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <line x1="220" y1="20" x2="330" y2="20" class="image" />
    <line x1="220" y1="40" x2="330" y2="40" class="image" />
    <line x1="220" y1="60" x2="330" y2="60" class="image" />
    <line x1="220" y1="80" x2="330" y2="80" class="image" />
    <!-- Moving truck -->
    <rect x="100" y="120" width="200" height="50" class="image" />
    <line x1="120" y1="140" x2="280" y2="140" class="image" />
    <line x1="120" y1="160" x2="280" y2="160" class="image" />
    <!-- Person -->
    <circle cx="150" cy="145" r="15" class="image" />
    <line x1="150" y1="160" x2="150" y2="190" class="image" />
    <line x1="150" y1="190" x2="130" y2="220" class="image" />
    <line x1="150" y1="190" x2="170" y2="220" class="image" />
    <line x1="150" y1="170" x2="180" y2="160" class="image" />
  </g>
</svg>