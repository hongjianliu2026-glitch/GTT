<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spying</text>
  <text x="50" y="120" class="subtitle">[ˈspaɪɪŋ] v. 间谍活动，窥探</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spy (间谍) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个间谍(spy)在黑暗中，"偷偷窥探(spying)"
    <tspan x="50" dy="25">周围的环境，试图获取秘密信息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective was caught spying on the suspect.
  </text>
  <text x="50" y="310" class="content">
    侦探被抓到在窥探嫌疑人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spy -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Binoculars -->
    <rect x="100" y="80" width="100" height="20" class="image" />
    <rect x="120" y="60" width="60" height="40" class="image" />
    <line x1="150" y1="60" x2="150" y2="80" class="image" />
    <line x1="130" y1="60" x2="130" y2="80" class="image" />
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" opacity="0.5" />
  </g>
</svg>