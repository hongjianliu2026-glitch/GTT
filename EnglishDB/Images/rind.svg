<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rind</text>
  <text x="50" y="120" class="subtitle">[raɪnd] n. 外皮，果皮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rind (来自古英语hring, 意为“环”或“圈”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的橙子，它的外皮(rind)像一个厚厚的环(hring)，
    <tspan x="50" dy="25">保护着里面的果肉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carefully removed the rind from the orange.
  </text>
  <text x="50" y="310" class="content">
    她小心地剥去了橙子的外皮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Orange -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Rind -->
    <circle cx="100" cy="100" r="70" class="image" />
    <!-- Slice -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <!-- Peel -->
    <path d="M 100 180 A 80 80 0 0 1 20 100 L 100 100" class="image" />
  </g>
</svg>