<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">locomotive</text>
  <text x="50" y="120" class="subtitle">[ˌloʊkəˈmoʊtɪv] n. 机车，火车头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loco- (地方) + mot (移动) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的火车头，"从一个地方移动(loco-mot)"
    <tspan x="50" dy="25">到另一个地方，这就是机车(locomotive)的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The locomotive pulled the train across the country.
  </text>
  <text x="50" y="310" class="content">
    机车拉着火车穿越了整个国家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Train tracks -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Locomotive -->
    <rect x="50" y="50" width="200" height="100" class="image" />
    <rect x="70" y="70" width="160" height="60" class="image" />
    <!-- Wheels -->
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="150" cy="150" r="20" class="image" />
    <circle cx="200" cy="150" r="20" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
  </g>
</svg>