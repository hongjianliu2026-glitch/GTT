<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">permanence</text>
  <text x="50" y="120" class="subtitle">[ˈpɜːrmənəns] n. 永久，持久</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + man (保持) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块石头，"完全保持(per-man)"
    <tspan x="50" dy="25">不变，象征着永久(permanence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The permanence of the mountains is a source of inspiration.
  </text>
  <text x="50" y="310" class="content">
    山脉的永恒是灵感的源泉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Symbol of eternity -->
    <circle cx="100" cy="75" r="50" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="125" x2="100" y2="175" class="image" />
    <polygon points="90,175 100,190 110,175" class="image" />
  </g>
</svg>