<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">market</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrkɪt] n. 市场，集市；v. 销售</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mark (标记) + et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小集市上，每个摊位都用"标记(mark)"
    <tspan x="50" dy="25">来区分商品，这些标记构成了一个市场(market)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She went to the market to buy fresh vegetables.
  </text>
  <text x="50" y="310" class="content">
    她去市场买新鲜的蔬菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stalls -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="100" class="image" />
    <rect x="200" y="20" width="100" height="100" class="image" />
    <!-- Markers -->
    <line x1="70" y1="40" x2="130" y2="40" class="image" />
    <line x1="220" y1="40" x2="280" y2="40" class="image" />
    <!-- Vegetables -->
    <circle cx="80" cy="70" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="230" cy="70" r="10" class="image" />
    <circle cx="250" cy="70" r="10" class="image" />
  </g>
</svg>