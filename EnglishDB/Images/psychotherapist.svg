<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">psychotherapist</text>
  <text x="50" y="120" class="subtitle">[ˌsaɪkoʊˈθerəpɪst] n. 心理治疗师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> psycho- (心理) + therap (治疗) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心理治疗师，用"心理(psycho)"的力量
    <tspan x="50" dy="25">来"治疗(therap)"人们的内心，帮助他们恢复健康。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The psychotherapist helped her overcome her anxiety.
  </text>
  <text x="50" y="310" class="content">
    心理治疗师帮助她克服了焦虑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head with brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <rect x="75" y="50" width="50" height="50" class="image" />
    <!-- Heart -->
    <path d="M150,100 C150,50 200,50 200,100 C200,150 150,150 150,100" class="image" />
    <!-- Hands -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <!-- Chair -->
    <rect x="75" y="200" width="100" height="50" class="image" />
  </g>
</svg>