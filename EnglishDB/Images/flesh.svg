<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flesh { fill: #FFCC99; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flesh</text>
  <text x="50" y="120" class="subtitle">[fleʃ] n. 肉，肉体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fles (肉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的肉块，"肉(flesh)"
    <tspan x="50" dy="25">在餐桌上，散发着诱人的香气，让人垂涎欲滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The butcher cut the flesh into thin slices.
  </text>
  <text x="50" y="310" class="content">
    屠夫把肉切成薄片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meat block -->
    <rect x="0" y="0" width="350" height="200" class="flesh" />
    <!-- Knife -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="70" y2="40" class="image" />
    <line x1="50" y1="20" x2="30" y2="40" class="image" />
    <!-- Slices -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
  </g>
</svg>