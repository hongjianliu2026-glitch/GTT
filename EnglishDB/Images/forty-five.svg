<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forty-five</text>
  <text x="50" y="120" class="subtitle">[ˈfɔrti faɪv] n. 四十五</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> forty (四十) + five (五)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“45”漂浮在空中，
    <tspan x="50" dy="25">它的每个部分都在发光，仿佛在说：“我是四十五！”</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He turned forty-five last month.
  </text>
  <text x="50" y="310" class="content">
    他上个月满四十五岁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number "45" -->
    <text x="0" y="100" font-size="200" fill="#E74C3C">45</text>
    <!-- Glowing effect -->
    <circle cx="100" cy="100" r="50" fill="none" stroke="#F1C40F" stroke-width="10" opacity="0.5" />
    <circle cx="300" cy="100" r="50" fill="none" stroke="#F1C40F" stroke-width="10" opacity="0.5" />
  </g>
</svg>