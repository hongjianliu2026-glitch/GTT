<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nostalgic</text>
  <text x="50" y="120" class="subtitle">[nɒˈstældʒɪk] adj. 怀旧的，乡愁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nostos (回家) + algos (痛苦)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在海边，望着远方，心中充满了对家乡的思念和痛苦，
    <tspan x="50" dy="25">这种情感就是怀旧(nostalgic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt nostalgic for her childhood home.
  </text>
  <text x="50" y="310" class="content">
    她对童年的家感到怀旧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <!-- Person -->
    <circle cx="175" cy="80" r="20" class="image" />
    <line x1="175" y1="100" x2="175" y2="140" class="image" />
    <line x1="175" y1="140" x2="150" y2="180" class="image" />
    <line x1="175" y1="140" x2="200" y2="180" class="image" />
    <line x1="175" y1="120" x2="220" y2="110" class="image" />
    <!-- Home -->
    <rect x="250" y="50" width="50" height="50" class="image" />
    <line x1="250" y1="50" x2="275" y2="25" class="image" />
    <line x1="300" y1="50" x2="275" y2="25" class="image" />
  </g>
</svg>