<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .gamma { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gamma-ray</text>
  <text x="50" y="120" class="subtitle">[ˈɡæmə reɪ] n. 伽马射线</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gamma (希腊字母γ) + ray (射线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"γ(gamma)"字母发射出强烈的"射线(ray)"，
    <tspan x="50" dy="25">这些射线穿透一切，就像伽马射线一样强大。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Gamma-rays are used in medical imaging.
  </text>
  <text x="50" y="310" class="content">
    伽马射线用于医学成像。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gamma symbol -->
    <text x="0" y="0" class="gamma" font-size="150">γ</text>
    <!-- Rays -->
    <line x1="75" y1="150" x2="200" y2="0" class="image" />
    <line x1="75" y1="150" x2="200" y2="300" class="image" />
    <line x1="75" y1="150" x2="0" y2="300" class="image" />
    <line x1="75" y1="150" x2="0" y2="0" class="image" />
  </g>
</svg>