<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wholeness</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊlnəs] n. 完整，整体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> whole (完整的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拼图游戏，所有的碎片都完美地拼在一起，
    <tspan x="50" dy="25">形成一个完整的画面，这就是"完整性(wholeness)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wholeness of the painting was breathtaking.
  </text>
  <text x="50" y="310" class="content">
    这幅画的完整性令人叹为观止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="150" height="150" class="image" />
    <rect x="160" y="0" width="150" height="150" class="image" />
    <rect x="0" y="160" width="150" height="150" class="image" />
    <rect x="160" y="160" width="150" height="150" class="image" />
    <!-- Completed puzzle -->
    <rect x="320" y="0" width="300" height="300" class="image" />
    <!-- Puzzle image -->
    <image x="320" y="0" width="300" height="300" xlink:href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj4KICAgIDxyZWN0IHg9IjAiIHk9IjAiIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiBmaWxsPSIjRkZGIiAvPgogICAgPGNpcmNsZSBjeD0iNTAiIGN5PSI1MCIgcj0iMzUiIGZpbGw9IiNGRkYiIC8+Cjwvc3ZnPg==" />
  </g>
</svg>