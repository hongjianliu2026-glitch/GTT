<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unmatched</text>
  <text x="50" y="120" class="subtitle">[ʌnˈmætʃt] adj. 无与伦比的，无敌的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + match (匹配)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个超级英雄站在一群普通人中间，"无法匹配(un-matched)"
    <tspan x="50" dy="25">他的力量和能力，他就是无与伦比的(unmatched)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her performance was unmatched by any other competitor.
  </text>
  <text x="50" y="310" class="content">
    她的表现是其他任何竞争者都无法匹敌的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Superhero -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Crowd -->
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <circle cx="350" cy="100" r="15" class="image" />
    <circle cx="400" cy="100" r="15" class="image" />
    <circle cx="450" cy="100" r="15" class="image" />
    <circle cx="500" cy="100" r="15" class="image" />
    <circle cx="550" cy="100" r="15" class="image" />
    <circle cx="600" cy="100" r="15" class="image" />
  </g>
</svg>