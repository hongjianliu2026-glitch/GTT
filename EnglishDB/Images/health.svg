<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">health</text>
  <text x="50" y="120" class="subtitle">[hɛlθ] n. 健康</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hale (强壮的) + th (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的人(hale)，他保持着良好的状态(th)，
    <tspan x="50" dy="25">这就是健康(health)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Regular exercise is good for your health.
  </text>
  <text x="50" y="310" class="content">
    定期锻炼对你的健康有好处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Healthy person -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Right leg -->
    <!-- Heart symbol -->
    <path d="M150,100 C150,50 200,50 200,100 C200,150 150,150 150,100 Z" class="image" />
    <!-- Text label -->
    <text x="150" y="110" class="content" text-anchor="middle">健康</text>
  </g>
</svg>