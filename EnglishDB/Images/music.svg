<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">music</text>
  <text x="50" y="120" class="subtitle">[ˈmjuːzɪk] n. 音乐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mus (音乐) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在舞台上，"用音乐(mus)"
    <tspan x="50" dy="25">创造出美妙的旋律，这些旋律就构成了音乐(music)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She plays the piano beautifully, creating a soothing music.
  </text>
  <text x="50" y="310" class="content">
    她弹钢琴弹得很好，创造出舒缓的音乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Music notes -->
    <path d="M50 50 Q70 30 90 50 T130 50" class="image" />
    <path d="M50 80 Q70 60 90 80 T130 80" class="image" />
    <path d="M50 110 Q70 90 90 110 T130 110" class="image" />
    <!-- Musician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Piano -->
    <rect x="150" y="50" width="200" height="100" class="image" />
    <line x1="170" y1="50" x2="170" y2="150" class="image" />
    <line x1="190" y1="50" x2="190" y2="150" class="image" />
    <line x1="210" y1="50" x2="210" y2="150" class="image" />
    <line x1="230" y1="50" x2="230" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
  </g>
</svg>