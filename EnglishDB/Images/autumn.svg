<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #D2691E; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #FF6347; }
      .ground { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">autumn</text>
  <text x="50" y="120" class="subtitle">[ˈɔːtəm] n. 秋天，秋季</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aut- (自己) + -umn (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片树叶"自己(aut-)"从树上飘落，
    <tspan x="50" dy="25">象征着秋天的到来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leaves turn golden in autumn.
  </text>
  <text x="50" y="310" class="content">
    树叶在秋天变成金黄色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="ground" />
    <!-- Tree -->
    <line x1="175" y1="150" x2="175" y2="50" class="image" />
    <!-- Leaves -->
    <circle cx="175" cy="50" r="30" class="leaf" />
    <circle cx="150" cy="70" r="20" class="leaf" />
    <circle cx="200" cy="70" r="20" class="leaf" />
    <circle cx="165" cy="90" r="15" class="leaf" />
    <circle cx="185" cy="90" r="15" class="leaf" />
    <!-- Falling leaf -->
    <circle cx="220" cy="130" r="10" class="leaf" />
  </g>
</svg>