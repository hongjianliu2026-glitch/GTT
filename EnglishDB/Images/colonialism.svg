<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">colonialism</text>
  <text x="50" y="120" class="subtitle">[kəˈloʊniəlɪzəm] n. 殖民主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> colo (耕种) + nial (属于) + ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群殖民者带着锄头和种子，"耕种(colo)"
    <tspan x="50" dy="25">新土地，建立自己的"属于(nial)"，这就是殖民主义(colonialism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The history of colonialism in Africa is marked by exploitation.
  </text>
  <text x="50" y="310" class="content">
    非洲的殖民主义历史充满了剥削。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Colonist with hoe -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="140" x2="30" y2="130" class="image" />
    <line x1="50" y1="140" x2="70" y2="130" class="image" />
    <line x1="50" y1="160" x2="30" y2="180" class="image" />
    <line x1="50" y1="160" x2="70" y2="180" class="image" />
    <!-- Land -->
    <rect x="0" y="180" width="100" height="20" class="image" />
    <!-- Seeds -->
    <circle cx="20" cy="190" r="5" class="image" />
    <circle cx="30" cy="190" r="5" class="image" />
    <circle cx="40" cy="190" r="5" class="image" />
  </g>
</svg>