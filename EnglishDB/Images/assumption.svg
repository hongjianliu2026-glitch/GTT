<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">assumption</text>
  <text x="50" y="120" class="subtitle">[əˈsʌmpʃən] n. 假设，假定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> as- (朝向) + sumpt (拿) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"朝向(as-)"
    <tspan x="50" dy="25">并"拿(sumpt)"起一块石头，</tspan>
    <tspan x="50" dy="25">然后"假设(assumption)"石头会掉下去。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His assumption that the project would fail was incorrect.
  </text>
  <text x="50" y="310" class="content">
    他假设项目会失败，这是不正确的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <!-- Stone -->
    <circle cx="150" cy="150" r="10" class="image" />
    <line x1="150" y1="160" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="210" class="image" />
    <line x1="150" y1="180" x2="170" y2="210" class="image" />
    <line x1="150" y1="170" x2="180" y2="160" class="image" />
  </g>
</svg>