<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accredited</text>
  <text x="50" y="120" class="subtitle">[əˈkrɛdɪtɪd] adj. 被认可的，合格的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + credit (信任)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生拿着一张"信任(credit)"证书，
    <tspan x="50" dy="25">这张证书是由权威机构"朝向(ad-)"他颁发的，</tspan>
    <tspan x="50" dy="25">证明他是"被认可的(accredited)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is an accredited teacher with over 10 years of experience.
  </text>
  <text x="50" y="310" class="content">
    她是一位拥有超过10年经验的合格教师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Certificate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <text x="150" y="100" class="content" text-anchor="middle">Certificate</text>

    <!-- Student -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>