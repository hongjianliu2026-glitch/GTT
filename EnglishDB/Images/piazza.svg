<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">piazza</text>
  <text x="50" y="120" class="subtitle">[piˈætsə] n. 广场，集市</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> piazza (源自意大利语，原意为“广场”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热闹的意大利广场，人们聚集在
    <tspan x="50" dy="25">"piazza"</tspan>
    <tspan x="50" dy="25">上，享受阳光和社交。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The piazza was filled with street performers and vendors.
  </text>
  <text x="50" y="310" class="content">
    广场上挤满了街头艺人和小贩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Piazza outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="30" r="20" class="image" />
    <!-- Vendor stand -->
    <rect x="50" y="100" width="100" height="50" class="image" />
    <line x1="70" y1="110" x2="130" y2="110" class="image" />
    <line x1="70" y1="130" x2="130" y2="130" class="image" />
    <line x1="70" y1="150" x2="130" y2="150" class="image" />
  </g>
</svg>