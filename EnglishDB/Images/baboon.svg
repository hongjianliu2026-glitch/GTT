<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">baboon</text>
  <text x="50" y="120" class="subtitle">[bəˈbuːn] n. 狒狒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自阿拉伯语 "babun"，意为“猴子”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狒狒(baboon)在非洲草原上，
    <tspan x="50" dy="25">它那夸张的大鼻子和强壮的身体让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baboon was playing with a stick in the savannah.
  </text>
  <text x="50" y="310" class="content">
    那只狒狒在草原上用棍子玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baboon face -->
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Nose -->
    <ellipse cx="100" cy="120" rx="30" ry="15" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <line x1="70" y1="140" x2="130" y2="140" class="image" />
    <!-- Ears -->
    <circle cx="40" cy="80" r="15" class="image" />
    <circle cx="160" cy="80" r="15" class="image" />
    <!-- Body -->
    <rect x="50" y="160" width="100" height="100" class="image" />
    <!-- Arms and legs -->
    <line x1="50" y1="180" x2="0" y2="220" class="image" />
    <line x1="150" y1="180" x2="200" y2="220" class="image" />
    <line x1="100" y1="260" x2="100" y2="320" class="image" />
  </g>
</svg>