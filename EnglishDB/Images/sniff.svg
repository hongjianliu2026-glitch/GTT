<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sniff</text>
  <text x="50" y="120" class="subtitle">[snɪf] v. 嗅，闻；n. 嗅，闻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sn- (鼻子) + iff (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小狗用鼻子"嗅(sniff)"着地面，
    <tspan x="50" dy="25">寻找它丢失的玩具，这个动作就是"sniff"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog sniffed around the garden for its ball.
  </text>
  <text x="50" y="310" class="content">
    狗在花园里四处嗅着寻找它的球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog's head -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Nose -->
    <circle cx="50" cy="110" r="10" class="image" />
    <!-- Ears -->
    <line x1="30" y1="80" x2="20" y2="60" class="image" />
    <line x1="70" y1="80" x2="80" y2="60" class="image" />
    <!-- Sniffing action -->
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="170" class="image" />
    <line x1="50" y1="150" x2="70" y2="170" class="image" />
  </g>
</svg>