<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scanning</text>
  <text x="50" y="120" class="subtitle">[ˈskænɪŋ] n. 扫描，浏览</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scan (扫描) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台巨大的扫描仪，"扫描(scan)"
    <tspan x="50" dy="25">整个城市，寻找隐藏的宝藏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The security system includes scanning for suspicious activities.
  </text>
  <text x="50" y="310" class="content">
    安全系统包括扫描可疑活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scanner -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Scanning beam -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- City skyline -->
    <rect x="50" y="160" width="20" height="40" class="image" />
    <rect x="80" y="140" width="20" height="60" class="image" />
    <rect x="110" y="150" width="20" height="50" class="image" />
    <rect x="140" y="130" width="20" height="70" class="image" />
    <rect x="170" y="160" width="20" height="40" class="image" />
    <rect x="200" y="140" width="20" height="60" class="image" />
    <rect x="230" y="150" width="20" height="50" class="image" />
    <rect x="260" y="130" width="20" height="70" class="image" />
  </g>
</svg>