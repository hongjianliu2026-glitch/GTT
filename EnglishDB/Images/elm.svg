<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elm</text>
  <text x="50" y="120" class="subtitle">[elm] n. 榆树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> elm (榆树)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵高大的榆树(elm)，它的树冠像一把巨大的伞，
    <tspan x="50" dy="25">为下面的小动物们遮风挡雨。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old elm tree in the park is a landmark.
  </text>
  <text x="50" y="310" class="content">
    公园里的那棵老榆树是一个地标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree trunk -->
    <rect x="150" y="100" width="50" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="175" y1="100" x2="100" y2="50" class="image" />
    <line x1="175" y1="100" x2="250" y2="50" class="image" />
    <line x1="175" y1="150" x2="100" y2="100" class="image" />
    <line x1="175" y1="150" x2="250" y2="100" class="image" />
    <!-- Leaves -->
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="175" cy="20" r="20" class="image" />
    <circle cx="175" cy="70" r="20" class="image" />
    <circle cx="175" cy="120" r="20" class="image" />
  </g>
</svg>