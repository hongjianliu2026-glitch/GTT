<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">donor</text>
  <text x="50" y="120" class="subtitle">[ˈdoʊnər] n. 捐赠者，捐献者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> don (给予) + -or (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个慷慨的人，"给予(don)"
    <tspan x="50" dy="25">他的财富或血液，这个人就是捐赠者(donor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The donor gave a generous gift to the charity.
  </text>
  <text x="50" y="310" class="content">
    捐赠者慷慨地向慈善机构捐赠了礼物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />

    <!-- Gift -->
    <rect x="120" y="80" width="60" height="40" class="image" />
    <line x1="120" y1="80" x2="180" y2="80" class="image" />
    <line x1="120" y1="120" x2="180" y2="120" class="image" />
    <line x1="120" y1="80" x2="120" y2="120" class="image" />
    <line x1="180" y1="80" x2="180" y2="120" class="image" />

    <!-- Arrow -->
    <line x1="80" y1="150" x2="120" y2="100" class="image" />
    <polygon points="120,100 115,95 115,105" class="image" />
  </g>
</svg>