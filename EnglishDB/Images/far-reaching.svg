<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">far-reaching</text>
  <text x="50" y="120" class="subtitle">[ˌfɑːrˈriːtʃɪŋ] adj. 深远的，广泛的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> far (远) + reach (到达)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手伸得"非常远(far-reaching)"，
    <tspan x="50" dy="25">试图触及遥远的星星，这种力量和影响是深远的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy has far-reaching implications.
  </text>
  <text x="50" y="310" class="content">
    这项新政策具有深远的意义。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand reaching out -->
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <line x1="350" y1="100" x2="300" y2="50" class="image" />
    <line x1="350" y1="100" x2="300" y2="150" class="image" />
    <line x1="350" y1="100" x2="320" y2="120" class="image" />
    <line x1="350" y1="100" x2="320" y2="80" class="image" />
    <!-- Star -->
    <circle cx="400" cy="50" r="10" class="image" />
  </g>
</svg>