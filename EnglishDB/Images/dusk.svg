<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dusk</text>
  <text x="50" y="120" class="subtitle">[dʌsk] n. 黄昏，傍晚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dus- (黑暗) + k (表示时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳逐渐下沉，天空变得"黑暗(dus-)"，
    <tspan x="50" dy="25">标志着一天的结束，这就是"黄昏(dusk)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We arrived at the campsite at dusk.
  </text>
  <text x="50" y="310" class="content">
    我们在黄昏时分到达了露营地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun setting -->
    <circle cx="100" cy="100" r="50" fill="#FFD700" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" fill="#87CEEB" />
    <!-- Ground -->
    <rect x="0" y="200" width="350" height="100" fill="#8B4513" />
  </g>
</svg>