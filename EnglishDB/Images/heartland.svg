<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heartland</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrtlænd] n. 心脏地带，中心区域</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heart (心脏) + land (土地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广袤的土地，它的中心有一个巨大的心脏，
    <tspan x="50" dy="25">这个心脏象征着这片土地的核心和灵魂，这就是心脏地带(heartland)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Midwest is often referred to as the heartland of America.
  </text>
  <text x="50" y="310" class="content">
    中西部常被称为美国的心脏地带。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Heart -->
    <path d="M100,100 C100,50 150,50 150,100 C150,150 100,150 100,100 Z" class="image" fill="#E74C3C" />
    <!-- Landmarks -->
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="100" cy="120" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
  </g>
</svg>