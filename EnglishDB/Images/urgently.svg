<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">urgently</text>
  <text x="50" y="120" class="subtitle">[ˈɜːrdʒəntli] adv. 紧急地，迫切地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ur- (原始) + gent (产生) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始人突然发现火种即将熄灭，他"迫切地(urgently)"
    <tspan x="50" dy="25">四处寻找新的火种，这种紧迫感让他行动迅速。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She needed to leave urgently for the airport.
  </text>
  <text x="50" y="310" class="content">
    她需要紧急赶往机场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="50" cy="100" r="30" class="image" fill="#F39C12" />
    <circle cx="70" cy="80" r="20" class="image" fill="#E67E22" />
    <circle cx="90" cy="60" r="10" class="image" fill="#D35400" />
    <!-- Primitive man -->
    <circle cx="150" cy="100" r="20" class="image" fill="#8E44AD" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="190" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Running -->
    <line x1="150" y1="160" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="220" y2="140" class="image" />
    <line x1="220" y1="140" x2="240" y2="160" class="image" />
  </g>
</svg>