<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grower</text>
  <text x="50" y="120" class="subtitle">[ˈɡroʊər] n. 种植者，栽培者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grow (生长) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在田地里，"让植物生长(grow)"
    <tspan x="50" dy="25">并精心照料，他就是种植者(grower)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The grower carefully tended to his crops.
  </text>
  <text x="50" y="310" class="content">
    种植者精心照料他的庄稼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Farmer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Crops -->
    <line x1="100" y1="180" x2="100" y2="150" class="image" />
    <line x1="120" y1="180" x2="120" y2="140" class="image" />
    <line x1="140" y1="180" x2="140" y2="160" class="image" />
    <line x1="160" y1="180" x2="160" y2="150" class="image" />
    <line x1="180" y1="180" x2="180" y2="140" class="image" />
    <line x1="200" y1="180" x2="200" y2="160" class="image" />
  </g>
</svg>