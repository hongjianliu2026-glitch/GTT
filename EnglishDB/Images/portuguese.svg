<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Portuguese</text>
  <text x="50" y="120" class="subtitle">[ˌpɔrtʃuˈɡiz] n. 葡萄牙语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Portu- (来自Portus, 港口) + -guese (语言)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的港口城市，"港口(Portu)"
    <tspan x="50" dy="25">的居民们用一种独特的语言交流，这种语言就是葡萄牙语(Portuguese)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks fluent Portuguese.
  </text>
  <text x="50" y="310" class="content">
    她能说流利的葡萄牙语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Port -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boat -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="50" y1="20" x2="50" y2="70" class="image" />
    <line x1="150" y1="20" x2="150" y2="70" class="image" />
    <!-- People -->
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="200" y1="80" x2="230" y2="70" class="image" />
    <!-- Speech bubble -->
    <rect x="250" y="30" width="80" height="50" class="image" />
    <line x1="330" y1="55" x2="350" y2="55" class="image" />
  </g>
</svg>