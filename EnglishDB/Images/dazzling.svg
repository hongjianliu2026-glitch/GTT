<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dazzling</text>
  <text x="50" y="120" class="subtitle">[ˈdæzlɪŋ] adj. 耀眼的，令人眼花缭乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> daz (使眼花) + -ling (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钻石在阳光下闪耀，"使眼花(daz-ling)"
    <tspan x="50" dy="25">到让人无法直视，这就是耀眼的(dazzling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fireworks display was dazzling.
  </text>
  <text x="50" y="310" class="content">
    烟火表演令人眼花缭乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Diamond -->
    <polygon points="50,150 100,50 150,150" class="image" fill="#E74C3C" />
    <!-- Eyes -->
    <circle cx="200" cy="100" r="10" class="image" fill="#34495E" />
    <circle cx="220" cy="100" r="10" class="image" fill="#34495E" />
    <!-- Hands covering eyes -->
    <line x1="180" y1="90" x2="240" y2="90" class="image" />
    <line x1="180" y1="110" x2="240" y2="110" class="image" />
  </g>
</svg>