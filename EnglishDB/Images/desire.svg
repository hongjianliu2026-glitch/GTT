<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">desire</text>
  <text x="50" y="120" class="subtitle">[dɪˈzaɪər] n. 渴望，欲望；v. 渴望，希望</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + sire (星，引申为引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人仰望星空，"强烈地被引导(de-sire)"
    <tspan x="50" dy="25">向着某个目标，这种强烈的愿望就是渴望(desire)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a strong desire to travel the world.
  </text>
  <text x="50" y="310" class="content">
    她强烈渴望环游世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person looking at the sky -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="120" cy="60" r="5" class="image" />
    <circle cx="140" cy="40" r="5" class="image" />
    <circle cx="160" cy="55" r="5" class="image" />
    <circle cx="180" cy="70" r="5" class="image" />
    <!-- Arrow pointing to the stars -->
    <line x1="20" y1="100" x2="150" y2="60" class="image" />
    <polygon points="150,60 145,55 145,65" class="image" />
  </g>
</svg>