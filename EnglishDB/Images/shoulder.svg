<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shoulder</text>
  <text x="50" y="120" class="subtitle">[ˈʃoʊldər] n. 肩膀；v. 肩负，承担</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shoul- (肩膀) + -der (表示位置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在你面前，他的肩膀(shoulder)上
    <tspan x="50" dy="25">扛着一个巨大的背包，象征着他肩负(shoulder)重任。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He shouldered the responsibility of taking care of his younger siblings.
  </text>
  <text x="50" y="310" class="content">
    他肩负起了照顾弟弟妹妹的责任。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shoulder -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <!-- Arm -->
    <line x1="50" y1="150" x2="0" y2="200" class="image" />
    <line x1="150" y1="150" x2="200" y2="200" class="image" />
    <!-- Backpack -->
    <rect x="75" y="70" width="50" height="80" class="image" />
    <line x1="75" y1="70" x2="100" y2="50" class="image" />
    <line x1="125" y1="70" x2="100" y2="50" class="image" />
  </g>
</svg>