<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .thermometer { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fever</text>
  <text x="50" y="120" class="subtitle">[ˈfiːvər] n. 发烧，狂热</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> febr- (发烧) + -is (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为发烧(febr-)而满脸通红，体温计(thermometer)
    <tspan x="50" dy="25">显示温度飙升，这就是"发烧(fever)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a high fever and couldn't go to school.
  </text>
  <text x="50" y="310" class="content">
    她发高烧了，不能去上学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thermometer -->
    <rect x="0" y="0" width="50" height="200" class="image" />
    <rect x="10" y="10" width="30" height="190" class="image" />
    <rect x="15" y="15" width="20" height="185" class="image" />
    <rect x="20" y="20" width="10" height="180" class="thermometer" />
    <!-- Red face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="45" class="thermometer" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
  </g>
</svg>