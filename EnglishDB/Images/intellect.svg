<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intellect</text>
  <text x="50" y="120" class="subtitle">[ˈɪntəlekt] n. 智力，理解力，才智</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> intel- (在中间) + lect (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个智者在思考，"在众多选择中(intel-lect)"
    <tspan x="50" dy="25">挑选出最优的方案，这就是智力的体现(intellect)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His intellect was evident in every decision he made.
  </text>
  <text x="50" y="310" class="content">
    他的智力在他做的每一个决定中都显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Thought bubbles -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <!-- Lightning bolt -->
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="100" class="image" />
  </g>
</svg>