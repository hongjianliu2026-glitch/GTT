<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nicotine</text>
  <text x="50" y="120" class="subtitle">[ˈnɪkətiːn] n. 尼古丁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nicot(o)- (源自烟草) + -ine (化学物质后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个烟雾缭绕的房间，"尼古丁(nicotine)"
    <tspan x="50" dy="25">从烟草中提取，让人上瘾，就像一个无形的幽灵。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Nicotine is a highly addictive substance found in tobacco.
  </text>
  <text x="50" y="310" class="content">
    尼古丁是烟草中一种高度成瘾的物质。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Smoke -->
    <path d="M0 0 Q50 50 100 0 T200 0" class="image" />
    <path d="M0 20 Q50 70 100 20 T200 20" class="image" />
    <path d="M0 40 Q50 90 100 40 T200 40" class="image" />
    <!-- Tobacco leaf -->
    <path d="M150 100 C150 50, 200 50, 200 100 S250 150, 250 100" class="image" />
    <!-- Cigarette -->
    <rect x="300" y="80" width="50" height="100" class="image" />
    <line x1="300" y1="80" x2="350" y2="80" class="image" />
    <line x1="300" y1="100" x2="350" y2="100" class="image" />
    <line x1="300" y1="120" x2="350" y2="120" class="image" />
    <line x1="300" y1="140" x2="350" y2="140" class="image" />
    <line x1="300" y1="160" x2="350" y2="160" class="image" />
  </g>
</svg>