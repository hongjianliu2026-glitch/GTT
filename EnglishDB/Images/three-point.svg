<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-point</text>
  <text x="50" y="120" class="subtitle">[θriː pɔɪnt] adj. 三点式的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + point (点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个篮球运动员在比赛中，"三个点(three-point)"
    <tspan x="50" dy="25">投出一个完美的三分球，全场欢呼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made a three-point shot at the buzzer.
  </text>
  <text x="50" y="310" class="content">
    他在蜂鸣器响起时投进了一个三分球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basketball court -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Basketball hoop -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="200" class="image" />
    <!-- Basketball -->
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Player -->
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="200" class="image" />
    <line x1="150" y1="180" x2="130" y2="170" class="image" />
    <line x1="150" y1="180" x2="170" y2="170" class="image" />
    <line x1="150" y1="200" x2="130" y2="220" class="image" />
    <line x1="150" y1="200" x2="170" y2="220" class="image" />
  </g>
</svg>