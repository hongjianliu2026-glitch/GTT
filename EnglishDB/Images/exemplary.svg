<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exemplary</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzempləri] adj. 模范的，典型的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + empl (拿) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个模范人物，"拿出(ex-empl)"
    <tspan x="50" dy="25">来作为榜样，他就是典型的(exemplary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was an exemplary student, always on time and prepared.
  </text>
  <text x="50" y="310" class="content">
    她是一个模范学生，总是准时并准备充分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <polygon points="50,5 61,35 95,35 68,55 79,85 50,65 21,85 32,55 5,35 39,35" class="image" />
    <!-- Person -->
    <circle cx="50" cy="120" r="15" class="image" />
    <line x1="50" y1="135" x2="50" y2="170" class="image" />
    <line x1="50" y1="170" x2="35" y2="200" class="image" />
    <line x1="50" y1="170" x2="65" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
  </g>
</svg>