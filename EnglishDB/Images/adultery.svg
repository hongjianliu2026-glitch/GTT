<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adultery</text>
  <text x="50" y="120" class="subtitle">[əˈdʌltəri] n. 通奸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (向) + ule (成长) + -tery (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个成年人(ad-ule)在婚姻中"向外成长(ad-ule)"，
    <tspan x="50" dy="25">这种行为就是通奸(adultery)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scandal involved allegations of adultery.
  </text>
  <text x="50" y="310" class="content">
    这起丑闻涉及通奸的指控。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart with a crack -->
    <path d="M50,50 C100,0 150,50 100,100 Z" class="image" />
    <line x1="50" y1="75" x2="150" y2="75" class="image" />
    <!-- Couple -->
    <circle cx="70" cy="120" r="15" class="image" />
    <line x1="70" y1="135" x2="70" y2="170" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <circle cx="130" cy="120" r="15" class="image" />
    <line x1="130" y1="135" x2="130" y2="170" class="image" />
    <line x1="130" y1="150" x2="110" y2="180" class="image" />
    <line x1="130" y1="150" x2="150" y2="180" class="image" />
    <!-- Third person -->
    <circle cx="100" cy="200" r="15" class="image" />
    <line x1="100" y1="215" x2="100" y2="250" class="image" />
    <line x1="100" y1="230" x2="80" y2="260" class="image" />
    <line x1="100" y1="230" x2="120" y2="260" class="image" />
  </g>
</svg>