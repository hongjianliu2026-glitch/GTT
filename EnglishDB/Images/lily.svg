<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lily</text>
  <text x="50" y="120" class="subtitle">[ˈlɪli] n. 百合花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "lilium"，意为百合花
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片宁静的湖边，一朵洁白的百合花(lily)
    <tspan x="50" dy="25">静静地绽放，它的花瓣如同天使的翅膀，</tspan>
    <tspan x="50" dy="25">在微风中轻轻摇曳，散发出淡淡的清香。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bride carried a bouquet of lilies.
  </text>
  <text x="50" y="310" class="content">
    新娘捧着一束百合花。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lily flower -->
    <circle cx="100" cy="100" r="50" fill="#FFFFFF" stroke="#7F8C8D" stroke-width="2" />
    <circle cx="80" cy="80" r="10" fill="#FFD700" />
    <circle cx="120" cy="80" r="10" fill="#FFD700" />
    <circle cx="100" cy="120" r="10" fill="#FFD700" />
    <circle cx="80" cy="120" r="10" fill="#FFD700" />
    <circle cx="120" cy="120" r="10" fill="#FFD700" />
    <!-- Stem -->
    <line x1="100" y1="150" x2="100" y2="250" stroke="#27AE60" stroke-width="10" />
    <!-- Leaves -->
    <path d="M80 200 Q50 180 80 160" stroke="#27AE60" stroke-width="5" fill="none" />
    <path d="M120 200 Q150 180 120 160" stroke="#27AE60" stroke-width="5" fill="none" />
  </g>
</svg>