<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sector</text>
  <text x="50" y="120" class="subtitle">[ˈsɛktər] n. 部门，扇区</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sec (切) + -tor (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆形蛋糕被"切(sec)"成了多个扇形部分，
    <tspan x="50" dy="25">每个部分代表一个不同的"部门(sector)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The finance sector is booming this year.
  </text>
  <text x="50" y="310" class="content">
    今年的金融部门蓬勃发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle -->
    <circle cx="175" cy="100" r="100" class="image" />
    <!-- Sector lines -->
    <line x1="175" y1="100" x2="275" y2="100" class="image" />
    <line x1="175" y1="100" x2="225" y2="200" class="image" />
    <line x1="175" y1="100" x2="125" y2="200" class="image" />
    <line x1="175" y1="100" x2="75" y2="100" class="image" />
    <line x1="175" y1="100" x2="125" y2="0" class="image" />
    <line x1="175" y1="100" x2="225" y2="0" class="image" />
    <!-- Labels -->
    <text x="280" y="100" class="content">Sector 1</text>
    <text x="230" y="210" class="content">Sector 2</text>
    <text x="110" y="210" class="content">Sector 3</text>
    <text x="60" y="100" class="content">Sector 4</text>
    <text x="110" y="0" class="content">Sector 5</text>
    <text x="230" y="0" class="content">Sector 6</text>
  </g>
</svg>