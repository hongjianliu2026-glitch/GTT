<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">panic</text>
  <text x="50" y="120" class="subtitle">[ˈpænɪk] n. 恐慌，惊慌；v. 使恐慌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pan- (全部) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在人群中突然"全部(pan-)"感到惊慌，
    <tspan x="50" dy="25">就像一群人突然陷入恐慌(panic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd panicked when the fire alarm went off.
  </text>
  <text x="50" y="310" class="content">
    火警响起时，人群陷入了恐慌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowd -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Panic lines -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="100" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="200" y1="70" x2="200" y2="100" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <!-- Alarm -->
    <rect x="125" y="120" width="50" height="50" class="image" />
    <line x1="150" y1="120" x2="150" y2="170" class="image" />
  </g>
</svg>