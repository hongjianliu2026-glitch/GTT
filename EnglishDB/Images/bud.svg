<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bud</text>
  <text x="50" y="120" class="subtitle">[bʌd] n. 芽，蓓蕾；v. 发芽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bud (源自中古英语，意为“芽”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象春天里，一棵树上的"芽(bud)"
    <tspan x="50" dy="25">慢慢长大，最终绽放成美丽的花朵。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rose bushes are beginning to bud.
  </text>
  <text x="50" y="310" class="content">
    玫瑰丛开始发芽了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="100" y="0" width="50" height="200" class="image" />
    <!-- Bud -->
    <circle cx="125" cy="50" r="20" class="image" />
    <!-- Small leaves -->
    <line x1="115" y1="70" x2="135" y2="70" class="image" />
    <line x1="115" y1="80" x2="135" y2="80" class="image" />
    <line x1="115" y1="90" x2="135" y2="90" class="image" />
  </g>
</svg>