<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adrift</text>
  <text x="50" y="120" class="subtitle">[əˈdrɪft] adv. 漂流，漂泊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (在) + drift (漂流)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘小船在海上"漂流(drift)"，
    <tspan x="50" dy="25">没有方向，随波逐流，这就是"adrift"的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boat was adrift in the middle of the ocean.
  </text>
  <text x="50" y="310" class="content">
    那艘船在海洋中央漂流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Boat -->
    <polygon points="150,100 100,150 200,150" class="image" fill="#F39C12" />
    <!-- Waves -->
    <path d="M0,100 Q50,150 100,100 T200,100" class="image" fill="none" stroke="#2980B9" stroke-width="3" />
    <path d="M0,120 Q50,170 100,120 T200,120" class="image" fill="none" stroke="#2980B9" stroke-width="3" />
    <path d="M0,140 Q50,190 100,140 T200,140" class="image" fill="none" stroke="#2980B9" stroke-width="3" />
  </g>
</svg>