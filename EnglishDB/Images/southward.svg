<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">southward</text>
  <text x="50" y="120" class="subtitle">[ˈsaʊθwərd] adv. 向南；adj. 向南的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> south (南) + -ward (向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在地图前，手指指向南方，"向南(south-ward)"
    <tspan x="50" dy="25">的方向，这就是southward的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship sailed southward along the coast.
  </text>
  <text x="50" y="310" class="content">
    船沿着海岸向南航行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- South arrow -->
    <line x1="175" y1="100" x2="175" y2="180" class="image" />
    <polygon points="175,180 160,160 190,160" class="image" />
    <!-- Person -->
    <circle cx="175" cy="50" r="15" class="image" />
    <line x1="175" y1="65" x2="175" y2="100" class="image" />
    <line x1="175" y1="75" x2="150" y2="60" class="image" />
    <line x1="175" y1="75" x2="200" y2="60" class="image" />
  </g>
</svg>