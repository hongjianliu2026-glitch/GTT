<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sketchy</text>
  <text x="50" y="120" class="subtitle">[ˈsketʃi] adj. 粗略的，可疑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sketch (草图) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在匆忙中画出的"草图(sketch)"，
    <tspan x="50" dy="25">线条粗糙，细节模糊，给人一种"可疑(sketchy)"的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sketchy details of the story made it hard to believe.
  </text>
  <text x="50" y="310" class="content">
    故事中粗略的细节让人难以相信。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sketch -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rough lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="250" y2="80" class="image" />
    <line x1="50" y1="110" x2="270" y2="110" class="image" />
    <line x1="50" y1="140" x2="240" y2="140" class="image" />
    <!-- Question mark -->
    <text x="150" y="180" font-size="80" fill="#E74C3C">?</text>
  </g>
</svg>