<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rousing</text>
  <text x="50" y="120" class="subtitle">[ˈraʊzɪŋ] adj. 令人振奋的，激励的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rouse (唤醒) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者站在讲台上，用激昂的言辞"唤醒(rouse)"
    <tspan x="50" dy="25">听众的热情，这种演讲就是令人振奋的(rousing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rousing speech inspired the crowd to take action.
  </text>
  <text x="50" y="310" class="content">
    那场令人振奋的演讲激励了人群采取行动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Audience -->
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
    <circle cx="250" cy="120" r="10" class="image" />
    <circle cx="300" cy="120" r="10" class="image" />
    <!-- Speech bubble -->
    <path d="M50 80 Q70 60 90 80 T130 80" class="image" />
    <text x="60" y="75" class="content" fill="#A93226">Wake up!</text>
  </g>
</svg>