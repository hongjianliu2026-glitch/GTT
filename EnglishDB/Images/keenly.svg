<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">keenly</text>
  <text x="50" y="120" class="subtitle">[ˈkiːnli] adv. 敏锐地，强烈地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> keen (敏锐的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鹰在空中翱翔，"敏锐地(keenly)"
    <tspan x="50" dy="25">捕捉到地面上的一只小鼠，它的眼神如同雷达般精准。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She observed the situation keenly.
  </text>
  <text x="50" y="310" class="content">
    她敏锐地观察着局势。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eagle -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <!-- Mouse -->
    <rect x="200" y="120" width="30" height="20" class="image" />
    <line x1="215" y1="140" x2="215" y2="160" class="image" />
    <line x1="215" y1="160" x2="200" y2="180" class="image" />
    <line x1="215" y1="160" x2="230" y2="180" class="image" />
    <!-- Eye -->
    <circle cx="60" cy="40" r="5" class="image" fill="#000" />
  </g>
</svg>