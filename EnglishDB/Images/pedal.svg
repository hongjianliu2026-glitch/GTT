<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pedal</text>
  <text x="50" y="120" class="subtitle">[ˈpedl] n. 踏板；v. 踩踏板</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ped- (脚) + -al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骑自行车的人，"用脚(ped-)"
    <tspan x="50" dy="25">踩在踏板(pedal)上，飞速前进。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He pedaled the bike up the hill.
  </text>
  <text x="50" y="310" class="content">
    他骑着自行车上山。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wheel -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="250" cy="100" r="50" class="image" />
    <!-- Frame -->
    <line x1="150" y1="100" x2="200" y2="20" class="image" />
    <line x1="200" y1="20" x2="250" y2="100" class="image" />
    <!-- Pedal -->
    <rect x="175" y="100" width="50" height="20" class="image" />
    <!-- Foot -->
    <circle cx="200" cy="120" r="10" class="image" />
    <line x1="200" y1="130" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="190" y2="170" class="image" />
    <line x1="200" y1="150" x2="210" y2="170" class="image" />
  </g>
</svg>