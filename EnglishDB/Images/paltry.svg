<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paltry</text>
  <text x="50" y="120" class="subtitle">[ˈpɔːltri] adj. 微不足道的，少量的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pal (少) + try (尝试)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图用"极少(pal)"的资源去完成一项任务，
    <tspan x="50" dy="25">结果发现这些资源"微不足道(paltry)"，根本不够用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The paltry amount of money he gave was not enough to cover the expenses.
  </text>
  <text x="50" y="310" class="content">
    他给的那点微不足道的钱根本不够支付费用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small pile of coins -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="90" cy="50" r="10" class="image" />
    <circle cx="110" cy="50" r="10" class="image" />
    <circle cx="130" cy="50" r="10" class="image" />
    <!-- Person shrugging -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="90" x2="160" y2="80" class="image" />
    <line x1="200" y1="90" x2="240" y2="80" class="image" />
  </g>
</svg>