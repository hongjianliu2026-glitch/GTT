<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brochure</text>
  <text x="50" y="120" class="subtitle">[broʊˈʃʊər] n. 小册子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> broc (折叠) + hure (纸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旅行者，"折叠(broc)"
    <tspan x="50" dy="25">一张纸(hure)，制作成一个小册子(brochure)，</tspan>
    <tspan x="50" dy="25">里面充满了旅行的信息和地图。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She picked up a brochure about the local attractions.
  </text>
  <text x="50" y="310" class="content">
    她拿起了一本关于当地景点的小册子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Folded paper -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <line x1="100" y1="0" x2="100" y2="150" class="image" />
    <line x1="150" y1="0" x2="150" y2="150" class="image" />
    <!-- Traveler -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="230" y2="160" class="image" />
    <line x1="250" y1="130" x2="270" y2="160" class="image" />
    <line x1="250" y1="110" x2="280" y2="100" class="image" />
  </g>
</svg>