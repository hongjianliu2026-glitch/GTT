<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deceptively</text>
  <text x="50" y="120" class="subtitle">[dɪˈsɛptɪvli] adv. 欺骗地，迷惑地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + cept (拿) + ive (形容词后缀) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师用"欺骗(de-cept)"的方式，
    <tspan x="50" dy="25">让观众以为他"拿走(cept)"了东西，实际上却"离开(de-)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake looked deceptively simple to make.
  </text>
  <text x="50" y="310" class="content">
    这个蛋糕看起来做起来很简单，实际上却很复杂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Hat -->
    <rect x="-10" y="80" width="60" height="20" class="image" />
    <!-- Rabbit -->
    <circle cx="80" cy="100" r="10" class="image" />
    <line x1="80" y1="110" x2="80" y2="130" class="image" />
    <line x1="80" y1="130" x2="70" y2="150" class="image" />
    <line x1="80" y1="130" x2="90" y2="150" class="image" />
    <!-- Disappearing effect -->
    <line x1="60" y1="100" x2="100" y2="100" class="image" />
    <line x1="60" y1="110" x2="100" y2="110" class="image" />
    <line x1="60" y1="120" x2="100" y2="120" class="image" />
  </g>
</svg>