<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">two-story</text>
  <text x="50" y="120" class="subtitle">[ˈtuː ˈstɔːri] adj. 两层的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> two- (二) + story (层)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座房子，"两层(two-story)"
    <tspan x="50" dy="25">高耸入云，每一层都有不同的故事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two-story house has a beautiful view from the top floor.
  </text>
  <text x="50" y="310" class="content">
    这座两层楼的房子从顶楼可以看到美丽的景色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ground floor -->
    <rect x="0" y="0" width="300" height="150" class="image" />
    <!-- First floor -->
    <rect x="50" y="50" width="200" height="100" class="image" />
    <!-- Roof -->
    <polygon points="50,50 250,50 200,0 100,0" class="image" />
    <!-- Windows -->
    <rect x="70" y="20" width="50" height="30" class="image" />
    <rect x="180" y="20" width="50" height="30" class="image" />
    <rect x="100" y="80" width="50" height="30" class="image" />
    <rect x="210" y="80" width="50" height="30" class="image" />
  </g>
</svg>