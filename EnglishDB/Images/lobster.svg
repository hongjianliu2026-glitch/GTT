<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lobster</text>
  <text x="50" y="120" class="subtitle">[ˈlɒbstə] n. 龙虾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lob (尾巴) + ster (生物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的龙虾，它的尾巴(lob)
    <tspan x="50" dy="25">在海浪中摇摆，就像一个巨大的生物(ster)在跳舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had lobster for dinner last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚我们吃了龙虾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lobster body -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <!-- Lobster tail -->
    <ellipse cx="100" cy="150" rx="60" ry="30" class="image" />
    <!-- Lobster claws -->
    <line x1="20" y1="100" x2="0" y2="80" class="image" />
    <line x1="20" y1="100" x2="0" y2="120" class="image" />
    <line x1="180" y1="100" x2="200" y2="80" class="image" />
    <line x1="180" y1="100" x2="200" y2="120" class="image" />
    <!-- Lobster legs -->
    <line x1="40" y1="100" x2="40" y2="130" class="image" />
    <line x1="60" y1="100" x2="60" y2="130" class="image" />
    <line x1="80" y1="100" x2="80" y2="130" class="image" />
    <line x1="120" y1="100" x2="120" y2="130" class="image" />
    <line x1="140" y1="100" x2="140" y2="130" class="image" />
    <line x1="160" y1="100" x2="160" y2="130" class="image" />
  </g>
</svg>