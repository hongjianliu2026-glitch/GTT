<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">judiciary</text>
  <text x="50" y="120" class="subtitle">[dʒuːˈdɪʃəri] n. 司法系统，法官</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> judic (判断) + -iary (与...有关的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群法官坐在法庭上，"判断(judic)"
    <tspan x="50" dy="25">案件，他们构成了司法系统(judiciary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judiciary plays a crucial role in maintaining justice.
  </text>
  <text x="50" y="310" class="content">
    司法系统在维护正义中起着至关重要的作用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Judges -->
    <circle cx="80" cy="45" r="15" class="image" />
    <circle cx="130" cy="45" r="15" class="image" />
    <circle cx="180" cy="45" r="15" class="image" />
    <!-- Gavel -->
    <line x1="220" y1="30" x2="240" y2="30" class="image" />
    <line x1="230" y1="30" x2="230" y2="50" class="image" />
    <!-- Courtroom seats -->
    <rect x="50" y="80" width="250" height="100" class="image" />
    <!-- People in the courtroom -->
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="170" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
  </g>
</svg>