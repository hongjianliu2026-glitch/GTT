<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ember</text>
  <text x="50" y="120" class="subtitle">[ˈɛmbər] n. 余烬，余火</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ember (源自拉丁语 "embers"，意为“燃烧的余烬”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场篝火晚会后，"余烬(ember)"
    <tspan x="50" dy="25">在夜晚中微微发光，温暖而持久。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The embers of the campfire glowed softly in the night.
  </text>
  <text x="50" y="310" class="content">
    篝火的余烬在夜晚中微微发光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Campfire -->
    <circle cx="100" cy="100" r="50" class="fire" />
    <circle cx="120" cy="80" r="30" class="fire" />
    <circle cx="80" cy="80" r="20" class="fire" />
    <circle cx="110" cy="60" r="15" class="fire" />
    <circle cx="90" cy="60" r="10" class="fire" />
    <!-- Embers -->
    <circle cx="100" cy="150" r="10" class="fire" />
    <circle cx="130" cy="140" r="8" class="fire" />
    <circle cx="70" cy="140" r="6" class="fire" />
  </g>
</svg>