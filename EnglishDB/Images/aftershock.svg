<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aftershock</text>
  <text x="50" y="120" class="subtitle">[ˈɑːftərˌʃɒk] n. 余震</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> after- (之后) + shock (震动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场大地震后，地面仍在"之后(after)"
    <tspan x="50" dy="25">持续"震动(shock)"，这就是余震(aftershock)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The aftershock lasted for several minutes.
  </text>
  <text x="50" y="310" class="content">
    余震持续了几分钟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earthquake -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="0" class="image" />
    <!-- Aftershock -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
  </g>
</svg>