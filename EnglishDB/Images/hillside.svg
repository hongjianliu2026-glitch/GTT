<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hillside</text>
  <text x="50" y="120" class="subtitle">[ˈhɪlsaɪd] n. 山坡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hill (山) + side (边)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座山，山的"一边(side)"是陡峭的"山坡(hillside)"，
    <tspan x="50" dy="25">上面长满了绿草和树木，仿佛是大自然的画布。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had a picnic on the hillside.
  </text>
  <text x="50" y="310" class="content">
    我们在山坡上野餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hillside -->
    <polygon points="0,200 350,200 250,50 100,50" class="image" fill="#82CA9D" />
    <!-- Trees -->
    <circle cx="150" cy="100" r="20" class="image" fill="#27AE60" />
    <circle cx="200" cy="120" r="20" class="image" fill="#27AE60" />
    <circle cx="250" cy="100" r="20" class="image" fill="#27AE60" />
    <!-- Grass -->
    <line x1="50" y1="180" x2="300" y2="180" class="image" stroke-dasharray="5,5" />
    <line x1="50" y1="190" x2="300" y2="190" class="image" stroke-dasharray="5,5" />
    <line x1="50" y1="200" x2="300" y2="200" class="image" stroke-dasharray="5,5" />
  </g>
</svg>