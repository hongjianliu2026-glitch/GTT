<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jock</text>
  <text x="50" y="120" class="subtitle">[dʒɑk] n. 运动员，运动迷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自苏格兰语“jock”，意为“人”，后指运动员。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的运动员，身穿运动服，
    <tspan x="50" dy="25">在赛场上奋力拼搏，他就是“jock”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a jock who loves playing basketball.
  </text>
  <text x="50" y="310" class="content">
    他是一个热爱打篮球的运动员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Athlete -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="160" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="250" class="image" /> <!-- Right leg -->
    <!-- Sports uniform -->
    <rect x="20" y="130" width="60" height="70" class="image" />
    <!-- Basketball -->
    <circle cx="100" cy="150" r="20" class="image" />
  </g>
</svg>