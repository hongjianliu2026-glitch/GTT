<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mayhem</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪhɛm] n. 混乱，骚乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> may (可能) + hem (限制)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，"可能的限制(may-hem)"被打破，
    <tspan x="50" dy="25">导致一片混乱(mayhem)，人们四处奔逃，物品散落一地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The protest turned into mayhem when the police arrived.
  </text>
  <text x="50" y="310" class="content">
    警察到来时，抗议活动变成了骚乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chaos scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People running -->
    <line x1="50" y1="20" x2="100" y2="100" class="image" />
    <line x1="70" y1="20" x2="120" y2="100" class="image" />
    <line x1="90" y1="20" x2="140" y2="100" class="image" />
    <!-- Broken items -->
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <line x1="160" y1="20" x2="160" y2="100" class="image" />
    <line x1="170" y1="20" x2="170" y2="100" class="image" />
    <!-- Scattered items -->
    <circle cx="200" cy="60" r="10" class="image" />
    <circle cx="220" cy="80" r="10" class="image" />
    <circle cx="240" cy="40" r="10" class="image" />
  </g>
</svg>