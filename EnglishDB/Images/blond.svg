<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blond</text>
  <text x="50" y="120" class="subtitle">[blɒnd] adj. 金发的；n. 金发的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blond (源自法语，意为“浅色的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个金发的人站在阳光下，"浅色的(blond)"
    <tspan x="50" dy="25">头发在阳光下闪闪发光，就像金色的麦田一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has long blond hair that shines in the sun.
  </text>
  <text x="50" y="310" class="content">
    她有一头在阳光下闪闪发光的金发。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="200" cy="100" r="50" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="200" cy="200" r="30" fill="#F39C12" />
    <line x1="200" y1="230" x2="200" y2="300" class="image" />
    <line x1="200" y1="250" x2="150" y2="220" class="image" />
    <line x1="200" y1="250" x2="250" y2="220" class="image" />
    <line x1="200" y1="300" x2="150" y2="350" class="image" />
    <line x1="200" y1="300" x2="250" y2="350" class="image" />
    <!-- Hair -->
    <path d="M170,170 Q200,120 230,170" fill="#F1C40F" />
    <path d="M160,180 Q200,130 240,180" fill="#F1C40F" />
    <path d="M150,190 Q200,140 250,190" fill="#F1C40F" />
  </g>
</svg>