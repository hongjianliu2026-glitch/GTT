<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shaky</text>
  <text x="50" y="120" class="subtitle">[ˈʃeɪki] adj. 摇晃的，不稳定的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shake (摇动) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个摇晃的桥上，桥在风中"摇动(shake)"，
    <tspan x="50" dy="25">他感到非常不稳，这就是"shaky"的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old bridge looked shaky and dangerous.
  </text>
  <text x="50" y="310" class="content">
    那座旧桥看起来摇摇欲坠，很危险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bridge -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="50" y1="0" x2="70" y2="20" class="image" />
    <line x1="100" y1="0" x2="120" y2="20" class="image" />
    <line x1="150" y1="0" x2="170" y2="20" class="image" />
    <line x1="200" y1="0" x2="220" y2="20" class="image" />
    <line x1="250" y1="0" x2="270" y2="20" class="image" />
    <line x1="300" y1="0" x2="320" y2="20" class="image" />
    <!-- Person -->
    <circle cx="175" cy="30" r="15" class="image" />
    <line x1="175" y1="45" x2="175" y2="70" class="image" />
    <line x1="175" y1="70" x2="155" y2="100" class="image" />
    <line x1="175" y1="70" x2="195" y2="100" class="image" />
    <line x1="175" y1="55" x2="205" y2="45" class="image" />
  </g>
</svg>