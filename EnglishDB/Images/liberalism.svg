<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liberalism</text>
  <text x="50" y="120" class="subtitle">[ˈlɪbərəlɪzəm] n. 自由主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liber (自由) + -al (形容词后缀) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个自由女神像，手持火炬，象征着"自由(liber)"
    <tspan x="50" dy="25">和"开放(liberal)"的思想，这就是自由主义(liberalism)的核心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He advocates for liberalism in education.
  </text>
  <text x="50" y="310" class="content">
    他主张在教育中实行自由主义。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Statue of Liberty -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="250" x2="50" y2="350" class="image" /> <!-- Left arm -->
    <line x1="100" y1="250" x2="150" y2="350" class="image" /> <!-- Right arm -->
    <line x1="100" y1="250" x2="100" y2="350" class="image" /> <!-- Torch -->
    <line x1="90" y1="350" x2="110" y2="350" class="image" /> <!-- Torch flame -->
  </g>
</svg>