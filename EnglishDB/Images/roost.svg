<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">roost</text>
  <text x="50" y="120" class="subtitle">[ruːst] n. 栖木，鸟巢；v. 栖息</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roo- (休息) + st (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只疲惫的鸟儿，"站立(st)"在"休息(roo)"的栖木上，
    <tspan x="50" dy="25">这就是鸟儿栖息的地方(roost)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The birds returned to their roost at sunset.
  </text>
  <text x="50" y="310" class="content">
    鸟儿们在日落时回到了它们的栖息地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Branch -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Roost -->
    <line x1="150" y1="0" x2="150" y2="100" class="image" />
    <!-- Bird -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="90" x2="180" y2="80" class="image" />
  </g>
</svg>