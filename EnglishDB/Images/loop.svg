<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loop</text>
  <text x="50" y="120" class="subtitle">[luːp] n. 循环，环；v. 使成环，使成圈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loop (源自中古英语 "loup"，意为跳跃或环)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小兔子在草地上跳跃，每次跳跃都形成一个"环(loop)"，
    <tspan x="50" dy="25">这个环不断重复，就像程序中的循环一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The program entered an infinite loop and crashed.
  </text>
  <text x="50" y="310" class="content">
    程序进入了一个无限循环并崩溃了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="180" width="350" height="20" class="image" fill="#27AE60" />
    <!-- Loop path -->
    <path d="M50,100 Q100,50 150,100 T250,100" class="image" />
    <!-- Rabbit -->
    <circle cx="50" cy="100" r="15" class="image" fill="#8E44AD" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="35" y2="180" class="image" />
    <line x1="50" y1="150" x2="65" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>