<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dominant</text>
  <text x="50" y="120" class="subtitle">[ˈdɒmɪnənt] adj. 占优势的，支配的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> domin (统治) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的国王坐在宝座上，"统治(domin)"
    <tspan x="50" dy="25">着整个王国，他的存在是如此强大，以至于</tspan>
    <tspan x="50" dy="25">他成为了"占优势的(dominant)"存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dominant player in the market is Amazon.
  </text>
  <text x="50" y="310" class="content">
    市场上占主导地位的玩家是亚马逊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- King -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="140" y2="130" class="image" />
    <line x1="175" y1="150" x2="210" y2="130" class="image" />
    <line x1="175" y1="180" x2="140" y2="200" class="image" />
    <line x1="175" y1="180" x2="210" y2="200" class="image" />
    <!-- Crown -->
    <polygon points="155,70 175,40 195,70 175,60" class="image" />
  </g>
</svg>