<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wok</text>
  <text x="50" y="120" class="subtitle">[wɒk] n. 炒锅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自中文“镬”（huò），指一种烹饪用的大型锅具。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的炒锅(wok)，里面翻滚着各种食材，
    <tspan x="50" dy="25">热气腾腾，香气四溢，仿佛整个厨房都在为它沸腾。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cooked a delicious stir-fry in her wok.
  </text>
  <text x="50" y="310" class="content">
    她在她的炒锅里炒了一道美味的炒菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wok -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <!-- Food -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <circle cx="100" cy="60" r="10" class="image" />
    <circle cx="80" cy="120" r="10" class="image" />
    <circle cx="120" cy="120" r="10" class="image" />
  </g>
</svg>