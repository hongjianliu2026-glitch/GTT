<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">volatility</text>
  <text x="50" y="120" class="subtitle">[ˌvɒləˈtɪləti] n. 易变性，波动性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> volat (飞) + -ility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶在花丛中飞舞，"飞来飞去(volat)"，
    <tspan x="50" dy="25">它的行为难以预测，就像市场的波动性(volatility)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stock market's volatility made investors nervous.
  </text>
  <text x="50" y="310" class="content">
    股市的波动性让投资者感到紧张。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butterfly -->
    <path d="M50 100 C50 50 150 50 150 100 C150 150 50 150 50 100 Z" class="image" />
    <path d="M100 100 C100 50 200 50 200 100 C200 150 100 150 100 100 Z" class="image" />
    <!-- Flower -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="125" cy="75" r="20" class="image" />
    <circle cx="125" cy="125" r="20" class="image" />
    <!-- Wings -->
    <path d="M75 100 Q50 75 75 50 Q100 75 75 100 Z" class="image" />
    <path d="M125 100 Q150 75 125 50 Q100 75 125 100 Z" class="image" />
  </g>
</svg>