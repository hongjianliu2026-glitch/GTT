<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crease</text>
  <text x="50" y="120" class="subtitle">[kriːs] n. 折痕，皱纹；v. 使起折痕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> creas (折痕)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张纸被"折痕(creas)"，形成了明显的折痕(crease)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carefully ironed out the creases in her dress.
  </text>
  <text x="50" y="310" class="content">
    她小心地熨平了裙子上的折痕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Paper -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Crease -->
    <line x1="50" y1="100" x2="250" y2="100" class="image" stroke-width="4" stroke="#E74C3C" />
    <!-- Folded paper -->
    <rect x="50" y="100" width="200" height="100" class="image" transform="rotate(45,150,100)" />
  </g>
</svg>