<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discount</text>
  <text x="50" y="120" class="subtitle">[ˈdɪskaʊnt] n. 折扣；v. 打折，低估</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + count (计算)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个购物者在商店里，"分开计算(dis-count)"
    <tspan x="50" dy="25">商品的价格，发现可以享受折扣(discount)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store offers a 20% discount on all items.
  </text>
  <text x="50" y="310" class="content">
    这家商店对所有商品提供20%的折扣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shopping cart -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Items in the cart -->
    <circle cx="80" cy="60" r="15" class="image" />
    <circle cx="120" cy="60" r="15" class="image" />
    <circle cx="160" cy="60" r="15" class="image" />
    <circle cx="200" cy="60" r="15" class="image" />
    <!-- Discount tag -->
    <rect x="280" y="20" width="50" height="30" class="image" />
    <text x="285" y="40" class="content" fill="#C0392B">20%</text>
    <!-- Shopper -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>