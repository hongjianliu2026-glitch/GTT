<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">square</text>
  <text x="50" y="120" class="subtitle">[skwer] n. 正方形，广场；adj. 正方形的；v. 使成方形</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quadri- (四) + angulus (角)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的正方形广场(square)，
    <tspan x="50" dy="25">四个角(quadri-angulus)都站满了人，</tspan>
    <tspan x="50" dy="25">每个人都面向中心，形成了一个完美的正方形。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city square was filled with people celebrating the festival.
  </text>
  <text x="50" y="310" class="content">
    城市广场挤满了庆祝节日的人群。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Square -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <!-- People at the corners -->
    <circle cx="20" cy="20" r="10" class="image" />
    <circle cx="180" cy="20" r="10" class="image" />
    <circle cx="20" cy="180" r="10" class="image" />
    <circle cx="180" cy="180" r="10" class="image" />
    <!-- Center -->
    <circle cx="100" cy="100" r="10" class="image" />
  </g>
</svg>