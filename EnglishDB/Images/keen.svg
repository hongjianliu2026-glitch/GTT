<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">keen</text>
  <text x="50" y="120" class="subtitle">[kiːn] adj. 敏锐的，热切的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cēn- (尖锐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鹰的眼睛，"尖锐(cēn-)"
    <tspan x="50" dy="25">地盯着猎物，表现出敏锐(keen)的观察力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a keen interest in astronomy.
  </text>
  <text x="50" y="310" class="content">
    她对天文学有浓厚的兴趣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eagle eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Pupil -->
    <circle cx="100" cy="100" r="20" fill="#2C3E50" />
    <!-- Beak -->
    <polygon points="100,150 50,200 150,200" class="image" />
    <!-- Wings -->
    <line x1="50" y1="100" x2="0" y2="50" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
  </g>
</svg>