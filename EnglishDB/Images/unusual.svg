<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unusual</text>
  <text x="50" y="120" class="subtitle">[ʌnˈjuːʒuəl] adj. 不寻常的，罕见的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + usual (通常的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"不(un-)"在"通常(usual)"的街道上，
    <tspan x="50" dy="25">出现了一只巨大的蓝色大象，这就是"不寻常(unusual)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was unusual to see a blue elephant in the city.
  </text>
  <text x="50" y="310" class="content">
    在城市里看到一只蓝色的大象是很不寻常的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Road -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Sidewalk -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Blue Elephant -->
    <circle cx="175" cy="100" r="50" class="image" fill="#3498DB" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="170" x2="125" y2="150" class="image" />
    <line x1="175" y1="170" x2="225" y2="150" class="image" />
    <line x1="175" y1="200" x2="125" y2="220" class="image" />
    <line x1="175" y1="200" x2="225" y2="220" class="image" />
  </g>
</svg>