<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">northeastern</text>
  <text x="50" y="120" class="subtitle">[ˌnɔːrθˈiːstərn] adj. 东北的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> north (北) + east (东) + -ern (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指南针，指针指向"北(north)"和"东(east)"的方向，
    <tspan x="50" dy="25">这个方向就是东北(northeastern)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The northeastern part of the city is the most developed.
  </text>
  <text x="50" y="310" class="content">
    城市的东北部分是最发达的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compass -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="20" y1="100" x2="330" y2="100" class="image" />
    <!-- North arrow -->
    <polygon points="175,20 165,40 185,40" class="image" />
    <text x="165" y="30" class="content" text-anchor="middle">N</text>
    <!-- East arrow -->
    <polygon points="330,100 310,90 310,110" class="image" />
    <text x="320" y="110" class="content" text-anchor="middle">E</text>
  </g>
</svg>