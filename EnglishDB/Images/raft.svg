<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">raft</text>
  <text x="50" y="120" class="subtitle">[ræft] n. 木筏，救生艇；v. 用筏子运送</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> raft (源自中古英语 "rapt"，意为"木筏")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在海上漂流，他们紧紧抓住一个"木筏(raft)"，
    <tspan x="50" dy="25">这个木筏就像他们的救生艇，帮助他们渡过难关。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They built a raft to cross the river.
  </text>
  <text x="50" y="310" class="content">
    他们建造了一个木筏来过河。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Raft -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="250" height="50" class="image" />
    <!-- People -->
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <circle cx="160" cy="80" r="10" class="image" />
    <circle cx="200" cy="80" r="10" class="image" />
    <circle cx="240" cy="80" r="10" class="image" />
    <!-- Water -->
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="130" x2="300" y2="130" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
  </g>
</svg>