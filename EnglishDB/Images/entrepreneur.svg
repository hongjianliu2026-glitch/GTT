<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entrepreneur</text>
  <text x="50" y="120" class="subtitle">[ˌɒntrəprəˈnəː] n. 企业家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> entre- (在...之间) + preneur (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个企业家在人群中"拿(preneur)"
    <tspan x="50" dy="25">起一个商业机会，就像在人群中脱颖而出，</tspan>
    <tspan x="50" dy="25">成为引领潮流的人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a successful entrepreneur who started her own tech company.
  </text>
  <text x="50" y="310" class="content">
    她是一位成功的企业家，创办了自己的科技公司。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowd -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <!-- Entrepreneur -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="200" class="image" />
    <line x1="175" y1="160" x2="195" y2="200" class="image" />
    <line x1="175" y1="140" x2="215" y2="130" class="image" />
    <!-- Business opportunity -->
    <rect x="250" y="80" width="50" height="40" class="image" />
    <text x="260" y="105" class="content" fill="#2980B9">机会</text>
  </g>
</svg>