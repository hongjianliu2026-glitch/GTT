<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kiln</text>
  <text x="50" y="120" class="subtitle">[kɪln] n. 窑，炉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kiln (源自中古英语，意为“窑”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的窑炉(kiln)，里面燃烧着熊熊烈火，
    <tspan x="50" dy="25">陶艺家正在里面烧制精美的陶器。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The potter fired his creations in the kiln.
  </text>
  <text x="50" y="310" class="content">
    陶艺家在窑里烧制他的作品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kiln -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fire -->
    <circle cx="50" cy="100" r="20" fill="#F39C12" />
    <circle cx="80" cy="120" r="25" fill="#E67E22" />
    <circle cx="110" cy="90" r="30" fill="#D35400" />
    <!-- Pottery -->
    <circle cx="200" cy="100" r="20" fill="#8E44AD" />
    <circle cx="250" cy="120" r="25" fill="#9B59B6" />
    <circle cx="300" cy="90" r="30" fill="#6C3483" />
  </g>
</svg>