<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">headstone</text>
  <text x="50" y="120" class="subtitle">[ˈhɛdstəʊn] n. 墓碑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> head (头) + stone (石头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块巨大的石头，上面刻着一个人的名字，
    <tspan x="50" dy="25">这块石头就像是一个人的"头"，永远地立在那里，</tspan>
    <tspan x="50" dy="25">这就是墓碑(headstone)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The headstone was engraved with the deceased's name and dates.
  </text>
  <text x="50" y="310" class="content">
    墓碑上刻着逝者的名字和日期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grave -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Headstone -->
    <rect x="125" y="20" width="100" height="160" class="image" />
    <!-- Name on headstone -->
    <text x="135" y="100" class="content" style="font-size: 24px; fill: #000;">John Doe</text>
    <!-- Dates on headstone -->
    <text x="135" y="130" class="content" style="font-size: 18px; fill: #000;">1945 - 2023</text>
  </g>
</svg>