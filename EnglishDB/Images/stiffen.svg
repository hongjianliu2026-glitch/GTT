<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stiffen</text>
  <text x="50" y="120" class="subtitle">[ˈstɪfən] v. 使变硬，使僵硬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stiff (僵硬的) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然被"僵硬(stiff)"的力量"使(en)"得无法动弹，
    <tspan x="50" dy="25">就像被冰冻了一样，全身僵硬(stiffen)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cold weather stiffened the metal.
  </text>
  <text x="50" y="310" class="content">
    寒冷的天气使金属变硬了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Frozen person -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="125" y2="250" class="image" />
    <line x1="175" y1="200" x2="225" y2="250" class="image" />
    <line x1="175" y1="170" x2="125" y2="170" class="image" />
    <line x1="175" y1="170" x2="225" y2="170" class="image" />
    <!-- Ice effect -->
    <line x1="100" y1="50" x2="250" y2="50" class="image" />
    <line x1="100" y1="70" x2="250" y2="70" class="image" />
    <line x1="100" y1="90" x2="250" y2="90" class="image" />
  </g>
</svg>