<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heave</text>
  <text x="50" y="120" class="subtitle">[hiːv] v. 用力举起，拖动；n. 举起，拖动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hev (举起)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大力士在健身房里，"用力举起(heave)"
    <tspan x="50" dy="25">一个巨大的杠铃，汗水从他的额头上滴落。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He heaved the heavy box onto the table.
  </text>
  <text x="50" y="310" class="content">
    他把沉重的箱子拖到了桌子上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gym background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Weightlifting bar -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="280" cy="50" r="10" class="image" />
    <!-- Weight plates -->
    <rect x="80" y="30" width="30" height="40" class="image" />
    <rect x="120" y="30" width="30" height="40" class="image" />
    <rect x="160" y="30" width="30" height="40" class="image" />
    <rect x="200" y="30" width="30" height="40" class="image" />
    <rect x="240" y="30" width="30" height="40" class="image" />
    <!-- Lifter -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="150" y2="190" class="image" />
    <line x1="175" y1="160" x2="200" y2="190" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
  </g>
</svg>