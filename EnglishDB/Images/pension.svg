<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pension</text>
  <text x="50" y="120" class="subtitle">[ˈpɛnʃən] n. 养老金，退休金</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pens (支付) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老人坐在摇椅上，手里拿着一张支票，上面写着"支付(pens)"
    <tspan x="50" dy="25">给他的养老金(pension)，他微笑着享受着退休生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He receives a monthly pension from the government.
  </text>
  <text x="50" y="310" class="content">
    他每月从政府那里领取养老金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old man in a rocking chair -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <rect x="30" y="220" width="40" height="10" class="image" /> <!-- Rocking chair base -->
    <line x1="30" y1="220" x2="10" y2="240" class="image" /> <!-- Rocking chair left leg -->
    <line x1="70" y1="220" x2="90" y2="240" class="image" /> <!-- Rocking chair right leg -->

    <!-- Check -->
    <rect x="120" y="80" width="150" height="100" class="image" />
    <text x="130" y="130" class="content" fill="#000">Check</text>
    <text x="130" y="160" class="content" fill="#000">Pension</text>
  </g>
</svg>