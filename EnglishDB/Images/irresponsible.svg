<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irresponsible</text>
  <text x="50" y="120" class="subtitle">[ˌɪrɪˈspɒnsəbl] adj. 不负责任的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (不) + respons (回应) + -ible (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对责任时，"不回应(ir-respons-ible)"，
    <tspan x="50" dy="25">就像一个气球飘走，完全不负责任(irresponsible)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was irresponsible of him to leave the project unfinished.
  </text>
  <text x="50" y="310" class="content">
    他不负责任地留下了未完成的项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="300" class="image" />
    <!-- Person -->
    <circle cx="200" cy="250" r="30" class="image" />
    <line x1="200" y1="280" x2="200" y2="350" class="image" />
    <line x1="200" y1="350" x2="170" y2="400" class="image" />
    <line x1="200" y1="350" x2="230" y2="400" class="image" />
    <line x1="200" y1="300" x2="150" y2="320" class="image" />
    <line x1="200" y1="300" x2="250" y2="320" class="image" />
    <!-- Speech bubble -->
    <path d="M250,200 Q300,200 300,150 Q300,100 250,100 Q200,100 200,150 Q200,200 250,200 Z" class="image" />
    <text x="220" y="150" class="content" text-anchor="middle">?</text>
  </g>
</svg>