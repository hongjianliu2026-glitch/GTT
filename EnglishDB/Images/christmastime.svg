<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Christmastime</text>
  <text x="50" y="120" class="subtitle">[ˈkrɪsməstaɪm] n. 圣诞节期间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Christ (基督) + mas (节日) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满欢乐和礼物的场景，"基督的节日时间(Christ-mas-time)"
    <tspan x="50" dy="25">，人们在这个特殊的日子里互赠礼物，享受团聚的时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We always decorate our house during Christmastime.
  </text>
  <text x="50" y="310" class="content">
    我们总是在圣诞节期间装饰我们的房子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Christmas tree -->
    <polygon points="100,50 50,150 150,150" class="image" fill="#27AE60" />
    <polygon points="100,80 70,130 130,130" class="image" fill="#27AE60" />
    <polygon points="100,110 80,130 120,130" class="image" fill="#27AE60" />
    <!-- Star on top -->
    <polygon points="100,30 90,45 110,45" class="image" fill="#F1C40F" />
    <!-- Presents -->
    <rect x="50" y="160" width="40" height="30" class="image" fill="#E67E22" />
    <rect x="110" y="160" width="40" height="30" class="image" fill="#E74C3C" />
    <!-- Snowman -->
    <circle cx="200" cy="120" r="30" class="image" fill="#FFFFFF" />
    <circle cx="200" cy="170" r="40" class="image" fill="#FFFFFF" />
    <circle cx="200" cy="230" r="50" class="image" fill="#FFFFFF" />
    <circle cx="180" cy="110" r="5" class="image" fill="#000000" />
    <circle cx="220" cy="110" r="5" class="image" fill="#000000" />
    <line x1="190" y1="140" x2="210" y2="140" class="image" />
    <line x1="200" y1="150" x2="200" y2="170" class="image" />
  </g>
</svg>