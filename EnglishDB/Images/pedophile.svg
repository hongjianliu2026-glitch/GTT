<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pedophile</text>
  <text x="50" y="120" class="subtitle">[ˈpiːdəˌfaɪl] n. 恋童癖者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pedo- (儿童) + -phile (爱好者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恋童癖者，他的心中充满了对儿童的"热爱(pedo-phile)"，
    <tspan x="50" dy="25">这种"热爱"是扭曲的，令人不安的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police arrested a pedophile who had been stalking children.
  </text>
  <text x="50" y="310" class="content">
    警察逮捕了一名一直在跟踪儿童的恋童癖者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />

    <!-- Pedophile -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="170" y2="140" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
    <line x1="200" y1="180" x2="170" y2="210" class="image" />
    <line x1="200" y1="180" x2="230" y2="210" class="image" />
    <line x1="200" y1="100" x2="50" y2="100" class="image" />
  </g>
</svg>