<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pagan</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪɡən] n. 异教徒，无宗教信仰者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pag (乡村) + an (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"乡村(pag)"里的"人(an)"，
    <tspan x="50" dy="25">他们远离城市，信仰原始的自然崇拜，</tspan>
    <tspan x="50" dy="25">这些人就是"异教徒(pagan)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient pagans worshipped the sun and moon.
  </text>
  <text x="50" y="310" class="content">
    古代异教徒崇拜太阳和月亮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- House -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Tree -->
    <line x1="200" y1="100" x2="200" y2="20" class="image" />
    <polygon points="180,20 220,20 200,0" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="20" class="image" />
    <line x1="300" y1="30" x2="300" y2="10" class="image" />
    <line x1="320" y1="50" x2="340" y2="50" class="image" />
    <line x1="300" y1="70" x2="300" y2="90" class="image" />
    <line x1="280" y1="50" x2="260" y2="50" class="image" />
    <!-- Pagan -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
  </g>
</svg>