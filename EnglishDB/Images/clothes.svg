<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clothes</text>
  <text x="50" y="120" class="subtitle">[kloʊðz] n. 衣服，服装</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clothe (覆盖) + -s (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的衣柜，里面挂满了各种"覆盖(clothe)"身体的衣物，
    <tspan x="50" dy="25">这些衣物就像是一个个保护层，让我们在不同的场合中保持得体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She packed her clothes for the trip.
  </text>
  <text x="50" y="310" class="content">
    她为旅行打包了衣服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wardrobe -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clothes -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Hanger -->
    <line x1="50" y1="20" x2="50" y2="140" class="image" />
    <line x1="300" y1="20" x2="300" y2="140" class="image" />
    <!-- Person -->
    <circle cx="200" cy="180" r="15" class="image" />
    <line x1="200" y1="195" x2="200" y2="230" class="image" />
    <line x1="200" y1="230" x2="180" y2="260" class="image" />
    <line x1="200" y1="230" x2="220" y2="260" class="image" />
    <line x1="200" y1="210" x2="240" y2="200" class="image" />
  </g>
</svg>