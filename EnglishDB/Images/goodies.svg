<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">goodies</text>
  <text x="50" y="120" class="subtitle">[ˈɡʊdiːz] n. 好吃的东西，小玩意儿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> good (好的) + -ies (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满各种美味食物和小玩意儿的房间，"好的东西(good-ies)"
    <tspan x="50" dy="25">堆满了桌子，让人眼花缭乱，忍不住想尝一口。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The party was full of goodies to eat and play with.
  </text>
  <text x="50" y="310" class="content">
    派对上满是好吃的东西和小玩意儿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Goodies -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Cake -->
    <rect x="100" y="30" width="40" height="40" class="image" /> <!-- Cookie -->
    <circle cx="170" cy="50" r="15" class="image" /> <!-- Candy -->
    <rect x="220" y="30" width="40" height="40" class="image" /> <!-- Toy -->
    <circle cx="290" cy="50" r="20" class="image" /> <!-- Another Goodie -->
    <!-- Person -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>