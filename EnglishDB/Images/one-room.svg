<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">one-room</text>
  <text x="50" y="120" class="subtitle">[ˈwʌn ruːm] adj. 单间的，一室的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> one (一) + room (房间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个只有"一(one)"个"房间(room)"的小屋，
    <tspan x="50" dy="25">里面所有的活动都在这个房间里进行，这就是一个单间(one-room)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They lived in a one-room apartment in the city.
  </text>
  <text x="50" y="310" class="content">
    他们在城里住在一个单间公寓里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Single room -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Bed -->
    <rect x="70" y="40" width="100" height="60" class="image" />
    <!-- Table -->
    <rect x="180" y="40" width="80" height="40" class="image" />
    <!-- Chair -->
    <rect x="190" y="80" width="60" height="40" class="image" />
    <!-- Kitchen area -->
    <rect x="70" y="120" width="100" height="40" class="image" />
    <!-- Door -->
    <rect x="280" y="80" width="20" height="80" class="image" />
  </g>
</svg>