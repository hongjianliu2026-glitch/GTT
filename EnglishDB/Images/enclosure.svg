<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enclosure</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkloʊʒər] n. 围场，围栏；附件</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + clos (关闭) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的围栏，"进入(en-)"后被"关闭(clos)"，
    <tspan x="50" dy="25">形成了一个封闭的空间，这就是围场(enclosure)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enclosure kept the animals safe from predators.
  </text>
  <text x="50" y="310" class="content">
    围栏保护动物免受捕食者的侵害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fence -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <!-- Animal -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="140" x2="80" y2="120" class="image" />
    <line x1="100" y1="140" x2="120" y2="120" class="image" />
    <line x1="100" y1="160" x2="80" y2="180" class="image" />
    <line x1="100" y1="160" x2="120" y2="180" class="image" />
  </g>
</svg>