<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nobody</text>
  <text x="50" y="120" class="subtitle">[ˈnoʊbədi] n. 没有人，无名小卒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> no- (没有) + body (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个空旷的房间里，"没有(no)"
    <tspan x="50" dy="25">任何人(body)，只有空气和寂静。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Nobody came to the party last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚没有人来参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Empty room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Window -->
    <rect x="250" y="20" width="50" height="160" class="image" />
    <!-- Empty space -->
    <line x1="120" y1="50" x2="230" y2="50" class="image" />
    <line x1="120" y1="80" x2="230" y2="80" class="image" />
    <line x1="120" y1="110" x2="230" y2="110" class="image" />
    <line x1="120" y1="140" x2="230" y2="140" class="image" />
  </g>
</svg>