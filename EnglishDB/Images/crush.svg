<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crush</text>
  <text x="50" y="120" class="subtitle">[krʌʃ] v. 压碎，压坏；n. 迷恋，热恋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crus (压) + h (加强)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头压在一只小蚂蚁上，"压碎(crush)"
    <tspan x="50" dy="25">了它。或者想象一个人对另一个人产生了强烈的迷恋，</tspan>
    <tspan x="50" dy="25">"压倒性(crush)"的爱意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a crush on the new teacher.
  </text>
  <text x="50" y="310" class="content">
    她对新来的老师产生了迷恋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone crushing ant -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="100" cy="100" r="30" class="image" /> <!-- Stone -->
    <line x1="80" y1="100" x2="120" y2="100" class="image" /> <!-- Stone lines -->
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <circle cx="200" cy="100" r="5" class="image" /> <!-- Ant -->
    <line x1="200" y1="105" x2="200" y2="120" class="image" /> <!-- Ant body -->
    <line x1="200" y1="110" x2="190" y2="120" class="image" /> <!-- Ant leg -->
    <line x1="200" y1="110" x2="210" y2="120" class="image" /> <!-- Ant leg -->
  </g>
</svg>