<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pregnancy</text>
  <text x="50" y="120" class="subtitle">[ˈprɛɡnənsi] n. 怀孕，妊娠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + gn (产生) + -ancy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女性，"在前面(pre-)"
    <tspan x="50" dy="25">已经"产生(gn)"了一个新生命，</tspan>
    <tspan x="50" dy="25">这就是怀孕(pregnancy)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She announced her pregnancy to the family.
  </text>
  <text x="50" y="310" class="content">
    她向家人宣布了怀孕的消息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pregnant woman -->
    <circle cx="100" cy="100" r="50" class="image" />
    <ellipse cx="100" cy="150" rx="60" ry="40" class="image" />
    <!-- Baby bump -->
    <ellipse cx="100" cy="120" rx="30" ry="20" class="image" fill="#F1C40F" />
    <!-- Heart symbol -->
    <path d="M 80 90 Q 100 80 120 90 Q 100 110 80 90" class="image" fill="#E74C3C" />
  </g>
</svg>