<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pluck</text>
  <text x="50" y="120" class="subtitle">[plʌk] v. 拔，摘，弹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plic (折叠) + -k (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手在"折叠(plic)"花瓣，"动作(k)"
    <tspan x="50" dy="25">迅速地摘下(pluck)一朵花。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She plucked a rose from the garden.
  </text>
  <text x="50" y="310" class="content">
    她从花园里摘了一朵玫瑰。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <path d="M10,100 C10,50 50,10 100,10" class="image" />
    <line x1="100" y1="10" x2="120" y2="30" class="image" />
    <line x1="120" y1="30" x2="140" y2="10" class="image" />
    <line x1="100" y1="10" x2="120" y2="10" class="image" />
    <line x1="120" y1="10" x2="140" y2="30" class="image" />
    <!-- Flower -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="70" x2="200" y2="10" class="image" />
    <line x1="200" y1="130" x2="200" y2="190" class="image" />
    <line x1="170" y1="100" x2="10" y2="100" class="image" />
    <line x1="230" y1="100" x2="300" y2="100" class="image" />
  </g>
</svg>