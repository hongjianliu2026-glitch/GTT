<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hoe</text>
  <text x="50" y="120" class="subtitle">[hoʊ] n. 锄头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hoe (源自中古英语 houe, 意为锄头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在田地里，手持一把锄头(hoe)，
    <tspan x="50" dy="25">用力地翻土，准备播种。锄头是农夫的好帮手，</tspan>
    <tspan x="50" dy="25">帮助他轻松地完成农活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer used a hoe to till the soil.
  </text>
  <text x="50" y="310" class="content">
    农夫用锄头翻土。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hoe handle -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <!-- Hoe blade -->
    <rect x="20" y="150" width="60" height="20" class="image" />
    <!-- Farmer -->
    <circle cx="50" cy="180" r="15" class="image" />
    <line x1="50" y1="195" x2="50" y2="230" class="image" />
    <line x1="50" y1="230" x2="30" y2="260" class="image" />
    <line x1="50" y1="230" x2="70" y2="260" class="image" />
    <line x1="50" y1="210" x2="80" y2="200" class="image" />
  </g>
</svg>