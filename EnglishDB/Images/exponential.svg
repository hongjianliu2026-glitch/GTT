<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exponential</text>
  <text x="50" y="120" class="subtitle">[ˌɛkspoʊˈnɛnʃəl] adj. 指数的，迅速增长的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + pon (放置) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"放置(pon)"
    <tspan x="50" dy="25">一个微小的种子，结果它迅速"长出(ex-)"</tspan>
    <tspan x="50" dy="25">成一个巨大的植物，这就是指数增长(exponential)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's growth has been exponential over the past year.
  </text>
  <text x="50" y="310" class="content">
    过去一年，公司的增长是指数级的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seed -->
    <circle cx="50" cy="100" r="10" class="image" />
    <!-- Growing plant -->
    <line x1="50" y1="110" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="200" x2="30" y2="220" class="image" />
    <line x1="50" y1="200" x2="70" y2="220" class="image" />
    <!-- Exponential curve -->
    <path d="M 100 200 Q 150 100 200 200 Q 250 300 300 200" class="image" />
  </g>
</svg>