<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alcoholism</text>
  <text x="50" y="120" class="subtitle">[ˈælkəˌhɔlɪzəm] n. 酗酒，酒精中毒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alcohol (酒精) + -ism (表行为或状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"酒精(alcohol)"控制，
    <tspan x="50" dy="25">无法自拔，陷入"酗酒(alcoholism)"的深渊。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His alcoholism led to the breakdown of his marriage.
  </text>
  <text x="50" y="310" class="content">
    他的酗酒导致了婚姻的破裂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="20" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="170" y2="220" class="image" />
    <line x1="200" y1="180" x2="230" y2="220" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
    <!-- Drowning effect -->
    <line x1="200" y1="180" x2="200" y2="250" class="image" />
    <line x1="180" y1="250" x2="220" y2="250" class="image" />
    <line x1="190" y1="270" x2="210" y2="270" class="image" />
  </g>
</svg>