<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">school-age</text>
  <text x="50" y="120" class="subtitle">[ˈskuːlˌeɪdʒ] n. 学龄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> school (学校) + age (年龄)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群孩子在学校里，"学校(school)"
    <tspan x="50" dy="25">的年龄(age)段，就是学龄(school-age)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The program is designed for school-age children.
  </text>
  <text x="50" y="310" class="content">
    这个项目是为学龄儿童设计的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- School building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Windows -->
    <rect x="70" y="40" width="40" height="40" class="image" />
    <rect x="130" y="40" width="40" height="40" class="image" />
    <rect x="190" y="40" width="40" height="40" class="image" />
    <rect x="250" y="40" width="40" height="40" class="image" />
    <!-- Door -->
    <rect x="150" y="120" width="60" height="60" class="image" />
    <!-- Children -->
    <circle cx="100" cy="180" r="15" class="image" />
    <circle cx="150" cy="180" r="15" class="image" />
    <circle cx="200" cy="180" r="15" class="image" />
    <circle cx="250" cy="180" r="15" class="image" />
  </g>
</svg>