<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ministerial</text>
  <text x="50" y="120" class="subtitle">[ˌmɪnɪˈstɪəriəl] adj. 部长的，内阁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mini (小) + ster (人) + ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"小人物(mini-ster)"穿着正式的西装，坐在一张大桌子前，
    <tspan x="50" dy="25">桌上堆满了文件，他正在处理国家大事，这就是"部长的(ministerial)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ministerial meeting discussed the new policy.
  </text>
  <text x="50" y="310" class="content">
    部长级会议讨论了新政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Minister -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Suit -->
    <rect x="40" y="120" width="20" height="60" class="image" />
    <rect x="60" y="120" width="20" height="60" class="image" />
    <!-- Files -->
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="180" y="20" width="50" height="160" class="image" />
    <rect x="240" y="20" width="50" height="160" class="image" />
  </g>
</svg>