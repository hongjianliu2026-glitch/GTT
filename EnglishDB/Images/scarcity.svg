<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scarcity</text>
  <text x="50" y="120" class="subtitle">[ˈskeərsəti] n. 缺乏，稀少</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scarc (稀少的) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个荒芜的沙漠，"稀少的(scarc)"
    <tspan x="50" dy="25">水源和资源，这就是稀缺(scarcity)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scarcity of water in the desert is a major challenge.
  </text>
  <text x="50" y="310" class="content">
    沙漠中水的稀缺是一个重大挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Sand dunes -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <!-- Water droplet -->
    <circle cx="200" cy="180" r="10" class="image" />
    <!-- Exclamation marks -->
    <text x="220" y="190" class="highlight">!</text>
    <text x="240" y="190" class="highlight">!</text>
    <text x="260" y="190" class="highlight">!</text>
  </g>
</svg>