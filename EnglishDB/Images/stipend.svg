<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stipend</text>
  <text x="50" y="120" class="subtitle">[ˈstaɪpɛnd] n. 定期生活津贴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sti- (站立) + pend (支付)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生站在银行前，"定期支付(sti-pend)"
    <tspan x="50" dy="25">的生活津贴，这些津贴帮助他维持生活(stipend)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He receives a stipend from the university for his research.
  </text>
  <text x="50" y="310" class="content">
    他从大学获得研究津贴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bank -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Student -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Money -->
    <rect x="100" y="50" width="50" height="30" class="image" />
    <rect x="160" y="50" width="50" height="30" class="image" />
    <rect x="220" y="50" width="50" height="30" class="image" />
    <!-- Bank sign -->
    <text x="150" y="180" class="content" style="font-size: 24px; fill: #2C3E50;">Bank</text>
  </g>
</svg>