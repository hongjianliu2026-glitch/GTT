<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">canning</text>
  <text x="50" y="120" class="subtitle">[ˈkænɪŋ] n. 罐头制作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> can (罐子) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师正在"罐子(can)"里装满食物，
    <tspan x="50" dy="25">然后密封起来，这就是罐头制作(canning)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She learned the art of canning fruits and vegetables.
  </text>
  <text x="50" y="310" class="content">
    她学会了制作水果和蔬菜罐头的技艺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Can -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Food inside the can -->
    <circle cx="75" cy="100" r="50" class="image" />
    <!-- Chef -->
    <circle cx="20" cy="250" r="15" class="image" />
    <line x1="20" y1="265" x2="20" y2="300" class="image" />
    <line x1="20" y1="300" x2="0" y2="330" class="image" />
    <line x1="20" y1="300" x2="40" y2="330" class="image" />
    <line x1="20" y1="280" x2="50" y2="270" class="image" />
  </g>
</svg>