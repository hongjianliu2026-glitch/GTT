<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cynic</text>
  <text x="50" y="120" class="subtitle">[ˈsɪnɪk] n. 愤世嫉俗者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cyn- (狗) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个愤世嫉俗的人，他像一只"狗(cyn-)"一样，
    <tspan x="50" dy="25">对世界充满怀疑和不信任，总是露出尖牙(cynic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was such a cynic that he doubted the sincerity of everyone he met.
  </text>
  <text x="50" y="310" class="content">
    他是个如此愤世嫉俗的人，以至于他怀疑每个他遇到的人的真诚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog face -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="30" y1="50" x2="70" y2="50" class="image" />
    <line x1="50" y1="30" x2="50" y2="70" class="image" />
    <!-- Fangs -->
    <line x1="40" y1="60" x2="40" y2="70" class="image" />
    <line x1="60" y1="60" x2="60" y2="70" class="image" />
    <!-- Suspicious eyes -->
    <circle cx="40" cy="40" r="5" class="image" />
    <circle cx="60" cy="40" r="5" class="image" />
  </g>
</svg>