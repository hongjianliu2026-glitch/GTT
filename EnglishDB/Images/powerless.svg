<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">powerless</text>
  <text x="50" y="120" class="subtitle">[ˈpaʊərləs] adj. 无力的，无能的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> power (力量) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被巨大的锁链束缚，"失去力量(power-less)"，
    <tspan x="50" dy="25">无法挣脱，显得无助和无力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm left the town powerless, with no electricity.
  </text>
  <text x="50" y="310" class="content">
    暴风雨使小镇失去了电力，变得无能为力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chains -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="30" x2="350" y2="30" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="90" x2="350" y2="90" class="image" />
    <!-- Person -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="150" y2="150" class="image" />
    <line x1="175" y1="120" x2="200" y2="150" class="image" />
    <line x1="175" y1="90" x2="220" y2="80" class="image" />
    <!-- Chains around person -->
    <line x1="155" y1="70" x2="155" y2="120" class="image" />
    <line x1="195" y1="70" x2="195" y2="120" class="image" />
  </g>
</svg>