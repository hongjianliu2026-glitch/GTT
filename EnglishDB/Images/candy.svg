<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .candy { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">candy</text>
  <text x="50" y="120" class="subtitle">[ˈkændi] n. 糖果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cand (白，发光) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的炼金术士，他"发光(cand)"的炼金术
    <tspan x="50" dy="25">变成了甜美的糖果(candy)，每一颗都闪闪发光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat candy after dinner.
  </text>
  <text x="50" y="310" class="content">
    她喜欢晚饭后吃糖果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Candy jar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Candies -->
    <circle cx="50" cy="100" r="20" class="candy" />
    <circle cx="100" cy="100" r="20" class="candy" />
    <circle cx="150" cy="100" r="20" class="candy" />
    <circle cx="200" cy="100" r="20" class="candy" />
    <circle cx="250" cy="100" r="20" class="candy" />
    <circle cx="300" cy="100" r="20" class="candy" />
    <!-- Alchemist -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
  </g>
</svg>