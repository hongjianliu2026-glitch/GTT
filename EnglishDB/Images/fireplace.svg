<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #FF6347; }
      .brick { fill: #B22222; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fireplace</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪərpleɪs] n. 壁炉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fire (火) + place (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的冬夜，"火(fire)"在"地方(place)"里燃烧，
    <tspan x="50" dy="25">温暖了整个房间，这就是壁炉(fireplace)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They gathered around the fireplace to keep warm.
  </text>
  <text x="50" y="310" class="content">
    他们围坐在壁炉旁取暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fireplace -->
    <rect x="0" y="0" width="350" height="200" class="brick" />
    <!-- Fire -->
    <polygon points="50,180 175,180 112.5,50" class="fire" />
    <polygon points="112.5,50 75,120 150,120" class="fire" />
    <polygon points="112.5,50 90,90 135,90" class="fire" />
    <!-- Logs -->
    <rect x="75" y="180" width="50" height="10" class="image" />
    <rect x="125" y="180" width="50" height="10" class="image" />
    <rect x="175" y="180" width="50" height="10" class="image" />
  </g>
</svg>