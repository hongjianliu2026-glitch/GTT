<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tiptoe</text>
  <text x="50" y="120" class="subtitle">[ˈtɪptəʊ] v. 踮着脚走，蹑手蹑脚地走</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tipt (脚尖) + toe (脚趾)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人踮起脚尖(tiptoe)，小心翼翼地走在地板上，
    <tspan x="50" dy="25">生怕发出一点声音，就像在偷偷摸摸地做某件事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tiptoed into the room to avoid waking the baby.
  </text>
  <text x="50" y="310" class="content">
    她踮着脚走进房间，以免吵醒宝宝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person tiptoeing -->
    <circle cx="100" cy="100" r="15" class="image" /> <!-- Head -->
    <line x1="100" y1="115" x2="100" y2="150" class="image" /> <!-- Body -->
    <line x1="100" y1="150" x2="80" y2="180" class="image" /> <!-- Left leg -->
    <line x1="100" y1="150" x2="120" y2="180" class="image" /> <!-- Right leg -->
    <line x1="100" y1="130" x2="130" y2="120" class="image" /> <!-- Left arm -->
    <line x1="100" y1="130" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <!-- Tiptoe -->
    <line x1="80" y1="180" x2="80" y2="190" class="image" /> <!-- Left tiptoe -->
    <line x1="120" y1="180" x2="120" y2="190" class="image" /> <!-- Right tiptoe -->
  </g>
</svg>