<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tree { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thicket</text>
  <text x="50" y="120" class="subtitle">[ˈθɪkɪt] n. 灌木丛，树丛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thick (厚的) + -et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片"厚厚的(thick)"小树丛(et)，
    <tspan x="50" dy="25">密密麻麻的树枝交织在一起，形成了一个难以穿越的灌木丛(thicket)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The deer disappeared into the thicket.
  </text>
  <text x="50" y="310" class="content">
    那只鹿消失在灌木丛中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trees -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="30" height="160" class="tree" />
    <rect x="100" y="20" width="30" height="160" class="tree" />
    <rect x="150" y="20" width="30" height="160" class="tree" />
    <rect x="200" y="20" width="30" height="160" class="tree" />
    <rect x="250" y="20" width="30" height="160" class="tree" />
    <rect x="300" y="20" width="30" height="160" class="tree" />
  </g>
</svg>