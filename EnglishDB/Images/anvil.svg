<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anvil</text>
  <text x="50" y="120" class="subtitle">[ˈænvɪl] n. 铁砧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anv- (来自拉丁语 "anvilis"，意为"铁砧")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个铁匠在铁砧(anvil)上敲打铁块，
    <tspan x="50" dy="25">每一锤都让铁块变得更坚固，就像铁砧一样稳固。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The blacksmith placed the hot iron on the anvil.
  </text>
  <text x="50" y="310" class="content">
    铁匠把烧红的铁块放在铁砧上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Anvil -->
    <rect x="0" y="0" width="200" height="50" class="image" />
    <rect x="50" y="50" width="100" height="100" class="image" />
    <!-- Hammer -->
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="250" y2="100" class="image" />
    <!-- Iron block -->
    <rect x="75" y="75" width="50" height="50" class="image" />
  </g>
</svg>