<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">awry</text>
  <text x="50" y="120" class="subtitle">[əˈraɪ] adv. 歪斜地，错误地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (表强调) + wry (扭曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走路时，"强调扭曲(a-wry)"
    <tspan x="50" dy="25">地歪着身子，结果走错了方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plan went awry due to unexpected circumstances.
  </text>
  <text x="50" y="310" class="content">
    由于意外情况，计划出了差错。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking awry -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <!-- Path going awry -->
    <line x1="50" y1="220" x2="150" y2="280" class="image" />
    <line x1="150" y1="280" x2="250" y2="220" class="image" />
    <line x1="250" y1="220" x2="350" y2="280" class="image" />
    <!-- Arrow indicating direction -->
    <polygon points="350,280 340,270 340,290" class="image" />
  </g>
</svg>