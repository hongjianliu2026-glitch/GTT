<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">circumcision</text>
  <text x="50" y="120" class="subtitle">[ˌsɜːrkəmˈsɪʒən] n. 割礼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> circum- (周围) + cis (切) + ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在手术台上，"围绕(circum-)"
    <tspan x="50" dy="25">某个部位进行"切割(cis)"，这就是割礼(circumcision)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The religious ceremony included the circumcision of the newborn.
  </text>
  <text x="50" y="310" class="content">
    宗教仪式包括了新生儿的割礼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Surgical table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Doctor -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Patient -->
    <rect x="150" y="50" width="150" height="100" class="image" />
    <!-- Cutting area -->
    <line x1="200" y1="70" x2="200" y2="130" class="image" />
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
    <line x1="190" y1="80" x2="210" y2="120" class="image" />
    <line x1="210" y1="80" x2="190" y2="120" class="image" />
  </g>
</svg>