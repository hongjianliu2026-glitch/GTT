<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F57F17; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crispy</text>
  <text x="50" y="120" class="subtitle">[ˈkrɪspi] adj. 脆的，酥脆的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crisp (脆)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片刚出炉的薯片，"咔嚓(crisp)"一声，
    <tspan x="50" dy="25">咬下去的声音清脆悦耳，这就是crispy的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The potato chips were crispy and delicious.
  </text>
  <text x="50" y="310" class="content">
    这些薯片又脆又好吃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Potato chip -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,20 150,20 170,50 30,50" class="image" fill="#F5DEB3" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="170" y1="50" x2="30" y2="50" class="image" />
    <line x1="50" y1="20" x2="30" y2="50" class="image" />
    <line x1="150" y1="20" x2="170" y2="50" class="image" />
    <!-- Crunch effect -->
    <line x1="80" y1="30" x2="120" y2="30" class="image" stroke-dasharray="5,5" />
    <line x1="90" y1="40" x2="110" y2="40" class="image" stroke-dasharray="5,5" />
    <line x1="100" y1="50" x2="100" y2="50" class="image" stroke-dasharray="5,5" />
  </g>
</svg>