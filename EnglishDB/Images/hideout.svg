<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hideout</text>
  <text x="50" y="120" class="subtitle">[ˈhaɪdaʊt] n. 藏身处，躲藏处</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hide (隐藏) + out (外面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个罪犯在森林中找到一个"隐藏在外面(hide-out)"
    <tspan x="50" dy="25">的地方，这就是他的藏身处(hideout)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police found the criminal's hideout in the woods.
  </text>
  <text x="50" y="310" class="content">
    警察在树林里找到了罪犯的藏身处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="100" y2="100" class="image" />
    <line x1="100" y1="20" x2="150" y2="100" class="image" />
    <line x1="150" y1="20" x2="200" y2="100" class="image" />
    <line x1="200" y1="20" x2="250" y2="100" class="image" />
    <line x1="250" y1="20" x2="300" y2="100" class="image" />
    <!-- Hideout -->
    <rect x="120" y="120" width="60" height="60" class="image" />
    <!-- Criminal -->
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="190" class="image" />
    <line x1="150" y1="190" x2="130" y2="220" class="image" />
    <line x1="150" y1="190" x2="170" y2="220" class="image" />
    <line x1="150" y1="175" x2="180" y2="165" class="image" />
  </g>
</svg>