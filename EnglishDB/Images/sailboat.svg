<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sailboat</text>
  <text x="50" y="120" class="subtitle">[ˈseɪlboʊt] n. 帆船</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sail (帆) + boat (船)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘帆船在海上航行，"帆(sail)"
    <tspan x="50" dy="25">和"船(boat)"结合在一起，就成了一艘帆船(sailboat)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They enjoyed a peaceful afternoon on the sailboat.
  </text>
  <text x="50" y="310" class="content">
    他们在帆船上度过了一个宁静的下午。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boat body -->
    <rect x="50" y="50" width="200" height="50" class="image" />
    <!-- Mast -->
    <line x1="150" y1="50" x2="150" y2="0" class="image" />
    <!-- Sail -->
    <polygon points="150,0 100,50 200,50" class="image" />
    <!-- Water -->
    <line x1="0" y1="100" x2="300" y2="100" class="image" />
    <line x1="0" y1="110" x2="300" y2="110" class="image" />
    <line x1="0" y1="120" x2="300" y2="120" class="image" />
  </g>
</svg>