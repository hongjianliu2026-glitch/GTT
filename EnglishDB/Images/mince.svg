<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mince</text>
  <text x="50" y="120" class="subtitle">[mɪns] v. 切碎，剁碎；n. 肉末</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> min- (小) + ce (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"把大块的肉切成小块(min-ce)"，
    <tspan x="50" dy="25">这些小块肉就变成了肉末(mince)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She minced the onions for the soup.
  </text>
  <text x="50" y="310" class="content">
    她为汤切碎了洋葱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kitchen counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Knife -->
    <line x1="70" y1="100" x2="120" y2="100" class="image" />
    <line x1="120" y1="100" x2="100" y2="80" class="image" />
    <line x1="120" y1="100" x2="100" y2="120" class="image" />
    <!-- Meat -->
    <rect x="150" y="80" width="100" height="40" class="image" />
    <rect x="160" y="90" width="20" height="20" class="image" />
    <rect x="190" y="90" width="20" height="20" class="image" />
    <rect x="220" y="90" width="20" height="20" class="image" />
  </g>
</svg>