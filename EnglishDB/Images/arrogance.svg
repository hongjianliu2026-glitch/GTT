<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arrogance</text>
  <text x="50" y="120" class="subtitle">[ˈærəɡəns] n. 傲慢，自大</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ar- (强调) + rog (要求) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高台上，"强调要求(ar-rog)"
    <tspan x="50" dy="25">别人服从他，这种态度就是傲慢(arrogance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His arrogance made him unpopular among his colleagues.
  </text>
  <text x="50" y="310" class="content">
    他的傲慢使他在同事中不受欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- High platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on the platform -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Arrogant expression -->
    <line x1="165" y1="90" x2="185" y2="90" class="image" />
    <line x1="165" y1="90" x2="165" y2="95" class="image" />
    <line x1="185" y1="90" x2="185" y2="95" class="image" />
    <line x1="170" y1="110" x2="180" y2="110" class="image" />
  </g>
</svg>