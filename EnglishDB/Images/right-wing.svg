<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">right-wing</text>
  <text x="50" y="120" class="subtitle">[ˈraɪt wɪŋ] n. 右翼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> right (右) + wing (翼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的鸟，它的右翼(right-wing)
    <tspan x="50" dy="25">特别强壮，象征着政治上的右翼势力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The right-wing party won the election.
  </text>
  <text x="50" y="310" class="content">
    右翼党赢得了选举。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird body -->
    <ellipse cx="200" cy="100" rx="150" ry="70" class="image" />
    <!-- Right wing -->
    <path d="M 200 100 L 350 50 L 350 150 Z" class="image" />
    <!-- Left wing -->
    <path d="M 200 100 L 50 50 L 50 150 Z" class="image" />
    <!-- Arrow pointing to right wing -->
    <path d="M 400 100 L 350 100 L 350 120 Z" class="image" />
    <text x="410" y="110" class="highlight">right-wing</text>
  </g>
</svg>