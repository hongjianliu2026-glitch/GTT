<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">onslaught</text>
  <text x="50" y="120" class="subtitle">[ˈɒnslɔːt] n. 猛攻，猛袭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> on- (在...上) + sl- (滑，冲) + -aught (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群战士从山上"滑下(sl-)"，"在...上(on-)"
    <tspan x="50" dy="25">发起猛烈的攻击，这就是"猛攻(onslaught)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The army launched an onslaught against the enemy.
  </text>
  <text x="50" y="310" class="content">
    军队对敌人发起了猛攻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Soldiers -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="80" y2="170" class="image" />
    <line x1="100" y1="150" x2="120" y2="170" class="image" />
    <line x1="100" y1="200" x2="80" y2="220" class="image" />
    <line x1="100" y1="200" x2="120" y2="220" class="image" />
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <line x1="200" y1="150" x2="180" y2="170" class="image" />
    <line x1="200" y1="150" x2="220" y2="170" class="image" />
    <line x1="200" y1="200" x2="180" y2="220" class="image" />
    <line x1="200" y1="200" x2="220" y2="220" class="image" />
  </g>
</svg>