<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">renter</text>
  <text x="50" y="120" class="subtitle">[ˈrɛntər] n. 租客，承租人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rent (租) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个租客(renter)在签租约，"租(rent)"
    <tspan x="50" dy="25">下房子，成为承租人(renter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The renter agreed to pay the rent on time.
  </text>
  <text x="50" y="310" class="content">
    租客同意按时支付租金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <line x1="40" y1="40" x2="40" y2="130" class="image" />
    <line x1="160" y1="40" x2="160" y2="130" class="image" />
    <!-- Renter -->
    <circle cx="100" cy="180" r="15" class="image" />
    <line x1="100" y1="195" x2="100" y2="230" class="image" />
    <line x1="100" y1="230" x2="80" y2="260" class="image" />
    <line x1="100" y1="230" x2="120" y2="260" class="image" />
    <line x1="100" y1="210" x2="130" y2="200" class="image" />
  </g>
</svg>