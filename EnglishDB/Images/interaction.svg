<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interaction</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈækʃn] n. 互动，相互作用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + act (行动) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在互相"行动(act)"，他们之间的"互动(inter-action)"
    <tspan x="50" dy="25">就像是在玩一个巨大的弹球游戏，球在他们之间来回弹跳。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The interaction between the teacher and students was very positive.
  </text>
  <text x="50" y="310" class="content">
    老师和学生之间的互动非常积极。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="300" cy="100" r="30" class="image" />
    <!-- Arms -->
    <line x1="50" y1="130" x2="300" y2="130" class="image" />
    <!-- Ball -->
    <circle cx="175" cy="130" r="20" class="image" fill="#F39C12" />
    <!-- Ball movement -->
    <line x1="50" y1="130" x2="175" y2="130" class="image" stroke-dasharray="5,5" />
    <line x1="300" y1="130" x2="175" y2="130" class="image" stroke-dasharray="5,5" />
  </g>
</svg>