<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swirl</text>
  <text x="50" y="120" class="subtitle">[swɜːrl] v. 旋转，打旋；n. 漩涡，螺旋形</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (表示加强) + whirl (旋转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯咖啡里，"加强旋转(s-whirl)"
    <tspan x="50" dy="25">的奶泡形成了美丽的漩涡(swirl)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leaves swirled in the wind.
  </text>
  <text x="50" y="310" class="content">
    树叶在风中旋转。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee cup -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Swirling milk foam -->
    <path d="M70,50 C80,30 120,30 130,50 S180,70 190,50" class="image" />
    <path d="M70,80 C80,60 120,60 130,80 S180,100 190,80" class="image" />
    <path d="M70,110 C80,90 120,90 130,110 S180,130 190,110" class="image" />
    <path d="M70,140 C80,120 120,120 130,140 S180,160 190,140" class="image" />
  </g>
</svg>