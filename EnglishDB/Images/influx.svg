<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">influx</text>
  <text x="50" y="120" class="subtitle">[ˈɪnflʌks] n. 流入，涌入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + flux (流动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，水流不断"流入(in-)"，形成一个巨大的"流动(flux)"，
    <tspan x="50" dy="25">这就是influx的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The influx of tourists has caused traffic congestion.
  </text>
  <text x="50" y="310" class="content">
    游客的涌入导致了交通拥堵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- River -->
    <path d="M0 100 Q100 50, 200 100 T400 100" class="image" />
    <!-- Water flow -->
    <path d="M0 100 Q50 80, 100 100 T200 100" class="image" />
    <path d="M100 100 Q150 80, 200 100 T300 100" class="image" />
    <path d="M200 100 Q250 80, 300 100 T400 100" class="image" />
    <!-- Inflow -->
    <path d="M0 100 Q50 50, 100 100" class="image" />
    <path d="M50 100 Q100 50, 150 100" class="image" />
    <path d="M100 100 Q150 50, 200 100" class="image" />
  </g>
</svg>