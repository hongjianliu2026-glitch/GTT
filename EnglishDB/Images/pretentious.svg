<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pretentious</text>
  <text x="50" y="120" class="subtitle">[prɪˈtɛnʃəs] adj. 自命不凡的，做作的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + tent (伸展) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在舞台上，"伸展(tent)"
    <tspan x="50" dy="25">自己，试图显得比实际更伟大，这就是自命不凡(pretentious)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His pretentious speech made everyone uncomfortable.
  </text>
  <text x="50" y="310" class="content">
    他自命不凡的演讲让每个人都感到不舒服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on stage -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Arms stretched out -->
    <line x1="150" y1="130" x2="100" y2="100" class="image" />
    <line x1="200" y1="130" x2="250" y2="100" class="image" />
  </g>
</svg>