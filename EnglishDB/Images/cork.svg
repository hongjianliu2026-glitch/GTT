<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cork</text>
  <text x="50" y="120" class="subtitle">[kɔːrk] n. 软木塞；v. 用软木塞塞住</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "cortex" (树皮)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵巨大的橡树，树皮被剥下后，
    <tspan x="50" dy="25">变成了一个巨大的软木塞(cork)，塞住了一个巨大的酒瓶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a cork to seal the bottle.
  </text>
  <text x="50" y="310" class="content">
    他用软木塞封住了瓶子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Cork -->
    <rect x="120" y="50" width="50" height="100" class="image" />
    <!-- Bottle -->
    <rect x="200" y="20" width="100" height="180" class="image" />
    <!-- Cork in Bottle -->
    <rect x="220" y="40" width="60" height="10" class="image" />
  </g>
</svg>