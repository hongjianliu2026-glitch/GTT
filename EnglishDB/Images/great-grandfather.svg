<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">great-grandfather</text>
  <text x="50" y="120" class="subtitle">[ˌɡreɪtˈɡrænfɑːðər] n. 曾祖父</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> great (大的) + grandfather (祖父)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的祖父(great-grandfather)，他比普通的祖父还要大，
    <tspan x="50" dy="25">象征着他在家族中的重要地位和历史。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My great-grandfather lived to be 100 years old.
  </text>
  <text x="50" y="310" class="content">
    我的曾祖父活到了100岁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large grandfather -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- Smaller grandfather -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="270" y2="230" class="image" />
    <line x1="300" y1="200" x2="330" y2="230" class="image" />
    <line x1="300" y1="150" x2="270" y2="140" class="image" />
    <line x1="300" y1="150" x2="330" y2="140" class="image" />
  </g>
</svg>