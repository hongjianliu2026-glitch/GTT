<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gratefully</text>
  <text x="50" y="120" class="subtitle">[ˈɡreɪtflɪ] adv. 感激地，感谢地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grat (感激) + -ful (充满...的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人双手合十，脸上洋溢着感激的笑容，"充满感激地(gratefully)"
    <tspan x="50" dy="25">表达对某人的感谢。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She accepted the gift gratefully.
  </text>
  <text x="50" y="310" class="content">
    她感激地接受了礼物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with hands together -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="90" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="90" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <line x1="30" y1="100" x2="70" y2="100" class="image" /> <!-- Hands together -->
    <!-- Smiling face -->
    <circle cx="45" cy="45" r="2" class="image" /> <!-- Left eye -->
    <circle cx="55" cy="45" r="2" class="image" /> <!-- Right eye -->
    <path d="M45 55 Q50 60 55 55" class="image" /> <!-- Smile -->
  </g>
</svg>