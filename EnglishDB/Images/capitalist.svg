<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">capitalist</text>
  <text x="50" y="120" class="subtitle">[ˈkæpɪtəlɪst] n. 资本家，资本主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> capital (资本) + -ist (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着西装的资本家，站在一堆金币上，"掌控着(capital)"
    <tspan x="50" dy="25">大量的财富，他就是资本家(capitalist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The capitalist invested heavily in the tech industry.
  </text>
  <text x="50" y="310" class="content">
    这位资本家在科技行业投入了大量资金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Capitalist -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <line x1="50" y1="150" x2="10" y2="140" class="image" />
    <!-- Suit -->
    <rect x="30" y="120" width="40" height="60" class="image" />
    <!-- Coins -->
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="180" cy="100" r="15" class="image" />
    <circle cx="210" cy="100" r="15" class="image" />
    <circle cx="150" cy="130" r="15" class="image" />
    <circle cx="180" cy="130" r="15" class="image" />
    <circle cx="210" cy="130" r="15" class="image" />
  </g>
</svg>