<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twenty-one</text>
  <text x="50" y="120" class="subtitle">[ˈtwenti wʌn] n. 二十一</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twenty (二十) + one (一)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个赌场里，庄家喊出"二十一(twenty-one)"，
    <tspan x="50" dy="25">所有玩家都紧张地看着自己的牌，希望能凑成这个幸运的数字。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He won the game with a perfect twenty-one.
  </text>
  <text x="50" y="310" class="content">
    他用完美的二十一点赢得了比赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cards -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="110" y="0" width="100" height="150" class="image" />
    <rect x="220" y="0" width="100" height="150" class="image" />
    <!-- Numbers on cards -->
    <text x="50" y="80" class="content" text-anchor="middle">20</text>
    <text x="160" y="80" class="content" text-anchor="middle">1</text>
    <!-- Dealer -->
    <circle cx="350" cy="75" r="20" class="image" />
    <line x1="350" y1="95" x2="350" y2="130" class="image" />
    <line x1="350" y1="130" x2="330" y2="160" class="image" />
    <line x1="350" y1="130" x2="370" y2="160" class="image" />
    <line x1="350" y1="110" x2="380" y2="100" class="image" />
    <text x="350" y="180" class="content" text-anchor="middle">Dealer</text>
  </g>
</svg>