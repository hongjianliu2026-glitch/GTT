<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">roller-coaster</text>
  <text x="50" y="120" class="subtitle">[ˈroʊlər koʊstər] n. 过山车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roller (滚动的) + coaster (滑行者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆巨大的"滚动滑行者(roller-coaster)"
    <tspan x="50" dy="25">在空中飞驰，乘客们尖叫连连，体验极速与刺激。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roller-coaster ride was thrilling and unforgettable.
  </text>
  <text x="50" y="310" class="content">
    过山车之旅既刺激又难忘。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <path d="M0 100 Q100 0 200 100 T400 100" class="image" />
    <path d="M0 100 Q100 200 200 100 T400 100" class="image" />
    <!-- Car -->
    <rect x="150" y="80" width="50" height="20" class="image" />
    <circle cx="160" cy="90" r="5" class="image" />
    <circle cx="190" cy="90" r="5" class="image" />
    <!-- Passengers -->
    <circle cx="165" cy="85" r="5" class="image" />
    <circle cx="185" cy="85" r="5" class="image" />
  </g>
</svg>