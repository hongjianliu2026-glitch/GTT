<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrapper</text>
  <text x="50" y="120" class="subtitle">[ˈræpər] n. 包装纸，包装材料</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wrap (包裹) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的礼物，被"包裹(wrap)"在一张巨大的包装纸(wrapper)中，
    <tspan x="50" dy="25">包装纸紧紧地贴合着礼物，仿佛在说：“我保护着你！”</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carefully wrapped the gift in a beautiful wrapper.
  </text>
  <text x="50" y="310" class="content">
    她小心地将礼物用漂亮的包装纸包好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gift box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Wrapper -->
    <rect x="20" y="20" width="160" height="110" class="image" />
    <!-- Ribbon -->
    <line x1="100" y1="20" x2="100" y2="130" class="image" />
    <line x1="20" y1="75" x2="180" y2="75" class="image" />
    <!-- Gift tag -->
    <rect x="150" y="10" width="30" height="15" class="image" />
    <text x="155" y="22" class="content">To: You</text>
  </g>
</svg>