<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shed</text>
  <text x="50" y="120" class="subtitle">[ʃɛd] n. 棚屋，小屋；v. 脱落，流出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shed (源自中古英语，意为“小屋”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农民在田地里，"脱落(shed)"
    <tspan x="50" dy="25">多余的叶子，然后走进他的小屋(shed)休息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tree shed its leaves in autumn.
  </text>
  <text x="50" y="310" class="content">
    树在秋天落叶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shed -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="20" x2="100" y2="0" class="image" />
    <line x1="180" y1="20" x2="100" y2="0" class="image" />
    <line x1="20" y1="20" x2="20" y2="150" class="image" />
    <line x1="180" y1="20" x2="180" y2="150" class="image" />
    <line x1="20" y1="150" x2="180" y2="150" class="image" />

    <!-- Farmer -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />

    <!-- Leaves -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
  </g>
</svg>