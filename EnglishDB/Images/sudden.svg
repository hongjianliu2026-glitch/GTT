<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sudden</text>
  <text x="50" y="120" class="subtitle">[ˈsʌdən] adj. 突然的，意外的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sud- (突然) + -en (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个平静的湖面，突然(sud-)
    <tspan x="50" dy="25">从天而降一块巨石，激起巨大的水花，这就是"突然(sudden)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sudden storm caught everyone off guard.
  </text>
  <text x="50" y="310" class="content">
    突如其来的暴风雨让大家措手不及。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Stone -->
    <rect x="150" y="50" width="50" height="50" class="image" />
    <!-- Splash -->
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <line x1="175" y1="100" x2="125" y2="125" class="image" />
    <line x1="175" y1="100" x2="225" y2="125" class="image" />
  </g>
</svg>