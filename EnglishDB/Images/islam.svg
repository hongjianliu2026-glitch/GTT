<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Islam</text>
  <text x="50" y="120" class="subtitle">[ˈɪslɑːm] n. 伊斯兰教</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> islām (阿拉伯语，意为“顺从”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个虔诚的信徒，双手合十，面向麦加的方向，
    <tspan x="50" dy="25">顺从(islām)真主的旨意，这就是伊斯兰教(Islam)的核心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Islam is one of the world's major religions.
  </text>
  <text x="50" y="310" class="content">
    伊斯兰教是世界主要宗教之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Prayer mat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Worshipper -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Mecca direction -->
    <line x1="175" y1="0" x2="175" y2="20" class="image" />
    <line x1="175" y1="20" x2="160" y2="30" class="image" />
    <line x1="175" y1="20" x2="190" y2="30" class="image" />
  </g>
</svg>