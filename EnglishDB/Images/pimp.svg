<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pimp</text>
  <text x="50" y="120" class="subtitle">[pɪmp] n. 皮条客，拉皮条者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "pimper"，意为"拉皮条"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着闪亮西装的皮条客，手里拿着一叠钞票，
    <tspan x="50" dy="25">身后跟着一群打扮妖艳的女子，这就是"pimp"的形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pimp controlled several prostitutes in the area.
  </text>
  <text x="50" y="310" class="content">
    那个皮条客控制了该地区的几名妓女。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pimp -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <rect x="80" y="80" width="100" height="40" class="image" /> <!-- Suit -->
    <rect x="180" y="80" width="20" height="40" class="image" /> <!-- Money -->
    <rect x="200" y="80" width="20" height="40" class="image" /> <!-- Money -->
    <rect x="220" y="80" width="20" height="40" class="image" /> <!-- Money -->
    <circle cx="250" cy="100" r="15" class="image" /> <!-- Prostitute -->
    <circle cx="280" cy="100" r="15" class="image" /> <!-- Prostitute -->
    <circle cx="310" cy="100" r="15" class="image" /> <!-- Prostitute -->
  </g>
</svg>