<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hearth</text>
  <text x="50" y="120" class="subtitle">[hɑːrθ] n. 炉床，家庭中心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hearth (来自古英语 heorþ, 意为“炉床”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的炉床(hearth)，它是家庭的中心，
    <tspan x="50" dy="25">温暖的火焰象征着家的温暖和团结。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hearth was the heart of the home, where family gathered.
  </text>
  <text x="50" y="310" class="content">
    炉床是家的中心，家人聚集的地方。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hearth -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Fire -->
    <circle cx="150" cy="100" r="50" fill="#FF6F61" />
    <circle cx="120" cy="80" r="30" fill="#FF8E72" />
    <circle cx="180" cy="80" r="30" fill="#FF8E72" />
    <circle cx="150" cy="60" r="20" fill="#FFB199" />
    <!-- Family -->
    <circle cx="70" cy="150" r="15" fill="#34495E" />
    <circle cx="230" cy="150" r="15" fill="#34495E" />
    <line x1="70" y1="165" x2="230" y2="165" class="image" />
    <line x1="70" y1="165" x2="70" y2="180" class="image" />
    <line x1="230" y1="165" x2="230" y2="180" class="image" />
  </g>
</svg>