<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uninvited</text>
  <text x="50" y="120" class="subtitle">[ˌʌnɪnˈvaɪtɪd] adj. 未被邀请的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + invite (邀请)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个未被邀请的人，"不(un-)"
    <tspan x="50" dy="25">被邀请(invite)"，偷偷溜进派对，</tspan>
    <tspan x="50" dy="25">手里还拿着一个"未被邀请(uninvited)"的标志。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The uninvited guest caused a commotion at the party.
  </text>
  <text x="50" y="310" class="content">
    未被邀请的客人引起了派对上的骚动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Party scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Party banner -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="25" x2="300" y2="25" class="image" />
    <line x1="50" y1="30" x2="300" y2="30" class="image" />
    <!-- Uninvited guest -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Uninvited sign -->
    <line x1="250" y1="120" x2="250" y2="140" class="image" />
    <line x1="250" y1="140" x2="230" y2="160" class="image" />
    <line x1="250" y1="140" x2="270" y2="160" class="image" />
  </g>
</svg>