<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">low-lying</text>
  <text x="50" y="120" class="subtitle">[ˈloʊˌlaɪɪŋ] adj. 低洼的，低地的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> low (低) + lying (躺着的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片低洼的田野，"躺着(lying)"在地面，
    <tspan x="50" dy="25">仿佛被大地轻轻拥抱着，这就是低洼的(low-lying)景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The low-lying fields are often flooded during the rainy season.
  </text>
  <text x="50" y="310" class="content">
    低洼的田野在雨季常常被淹没。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Low-lying field -->
    <rect x="0" y="100" width="350" height="100" class="image" />
    <!-- Water -->
    <rect x="50" y="120" width="250" height="60" class="image" fill="#1ABC9C" />
    <!-- Trees -->
    <line x1="70" y1="100" x2="70" y2="50" class="image" />
    <line x1="100" y1="100" x2="100" y2="60" class="image" />
    <line x1="130" y1="100" x2="130" y2="70" class="image" />
    <line x1="160" y1="100" x2="160" y2="80" class="image" />
    <line x1="190" y1="100" x2="190" y2="90" class="image" />
    <line x1="220" y1="100" x2="220" y2="100" class="image" />
    <line x1="250" y1="100" x2="250" y2="110" class="image" />
    <line x1="280" y1="100" x2="280" y2="120" class="image" />
  </g>
</svg>