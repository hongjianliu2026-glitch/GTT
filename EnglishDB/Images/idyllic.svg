<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">idyllic</text>
  <text x="50" y="120" class="subtitle">[aɪˈdɪlɪk] adj. 田园诗般的，宁静的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> idyl (田园诗) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宁静的乡村，阳光洒在绿油油的草地上，
    <tspan x="50" dy="25">小溪潺潺流过，牛羊在悠闲地吃草，这就是田园诗般的(idyllic)景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The countryside was so idyllic that it seemed like a dream.
  </text>
  <text x="50" y="310" class="content">
    乡村如此宁静，仿佛置身梦境。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" fill="#F1C40F" />
    <!-- Grass -->
    <rect x="0" y="100" width="350" height="150" fill="#2ECC71" />
    <!-- Stream -->
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <!-- Sheep -->
    <circle cx="100" cy="120" r="15" fill="#FFFFFF" stroke="#000000" />
    <circle cx="120" cy="120" r="15" fill="#FFFFFF" stroke="#000000" />
    <circle cx="140" cy="120" r="15" fill="#FFFFFF" stroke="#000000" />
    <!-- Cow -->
    <circle cx="200" cy="120" r="20" fill="#FFFFFF" stroke="#000000" />
    <rect x="190" y="140" width="20" height="10" fill="#FFFFFF" stroke="#000000" />
    <rect x="210" y="140" width="20" height="10" fill="#FFFFFF" stroke="#000000" />
  </g>
</svg>