<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disdain</text>
  <text x="50" y="120" class="subtitle">[dɪsˈdeɪn] n. 轻蔑，鄙视；v. 轻视，鄙视</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + deign (屈尊)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人高高在上，"不屈尊(dis-deign)"
    <tspan x="50" dy="25">去看待某事物，表现出极度的轻蔑(disdain)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked at him with disdain after he made that rude comment.
  </text>
  <text x="50" y="310" class="content">
    在他发表了那番粗鲁的评论后，她轻蔑地看着他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person looking down -->
    <circle cx="20" cy="20" r="15" class="image" />
    <line x1="20" y1="35" x2="20" y2="80" class="image" />
    <line x1="20" y1="80" x2="0" y2="110" class="image" />
    <line x1="20" y1="80" x2="40" y2="110" class="image" />
    <line x1="20" y1="60" x2="50" y2="50" class="image" />
    <!-- Eyes looking down -->
    <line x1="15" y1="25" x2="10" y2="30" class="image" />
    <line x1="25" y1="25" x2="30" y2="30" class="image" />
    <!-- Nose -->
    <line x1="20" y1="30" x2="20" y2="35" class="image" />
    <!-- Mouth -->
    <line x1="15" y1="40" x2="25" y2="40" class="image" />
    <!-- Object being disdained -->
    <rect x="100" y="50" width="50" height="50" class="image" />
    <text x="110" y="80" class="content" fill="#7F8C8D">Object</text>
  </g>
</svg>