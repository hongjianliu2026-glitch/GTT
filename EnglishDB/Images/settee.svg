<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">settee</text>
  <text x="50" y="120" class="subtitle">[səˈtiː] n. 长靠椅，长沙发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> set (坐) + -ee (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"坐(set)"具，上面可以"坐(set)"很多人，
    <tspan x="50" dy="25">这个"坐(set)"具就是长靠椅(settee)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They sat on the settee and watched TV.
  </text>
  <text x="50" y="310" class="content">
    他们坐在长沙发上看电视。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Settee -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Backrest -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Cushions -->
    <rect x="70" y="40" width="210" height="60" class="image" />
    <!-- Legs -->
    <line x1="80" y1="140" x2="80" y2="150" class="image" />
    <line x1="280" y1="140" x2="280" y2="150" class="image" />
    <!-- People sitting -->
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
  </g>
</svg>