<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">airstrike</text>
  <text x="50" y="120" class="subtitle">[ˈɛrˌstraɪk] n. 空袭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> air (空气，空中) + strike (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机在空中，"从空中打击(air-strike)"
    <tspan x="50" dy="25">地面目标，这就是空袭(airstrike)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The airstrike targeted the enemy's military base.
  </text>
  <text x="50" y="310" class="content">
    空袭击中了敌人的军事基地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airplane -->
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <line x1="200" y1="0" x2="180" y2="20" class="image" />
    <line x1="200" y1="0" x2="180" y2="-20" class="image" />
    <line x1="100" y1="0" x2="100" y2="-30" class="image" />
    <line x1="100" y1="0" x2="100" y2="30" class="image" />
    <!-- Bomb -->
    <circle cx="250" cy="50" r="10" class="image" />
    <line x1="250" y1="60" x2="250" y2="100" class="image" />
    <!-- Explosion -->
    <circle cx="250" cy="120" r="20" class="image" />
    <circle cx="250" cy="120" r="15" class="image" />
    <circle cx="250" cy="120" r="10" class="image" />
  </g>
</svg>