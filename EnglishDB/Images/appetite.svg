<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">appetite</text>
  <text x="50" y="120" class="subtitle">[ˈæpɪtaɪt] n. 食欲，欲望</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (朝向) + pet (追求) + -ite (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"朝向(ap-)"美食，"追求(pet)"美味，
    <tspan x="50" dy="25">这种强烈的欲望就是食欲(appetite)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a long hike, his appetite was enormous.
  </text>
  <text x="50" y="310" class="content">
    长途徒步后，他的食欲大增。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate with food -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="40" class="image" /> <!-- Food item 1 -->
    <rect x="100" y="60" width="80" height="80" class="image" /> <!-- Food item 2 -->
    <polygon points="200,100 240,60 280,100 240,140" class="image" /> <!-- Food item 3 -->
    <!-- Person -->
    <circle cx="20" cy="180" r="15" class="image" />
    <line x1="20" y1="195" x2="20" y2="230" class="image" />
    <line x1="20" y1="230" x2="0" y2="260" class="image" />
    <line x1="20" y1="230" x2="40" y2="260" class="image" />
    <line x1="20" y1="210" x2="50" y2="200" class="image" />
    <!-- Arrow -->
    <line x1="20" y1="180" x2="100" y2="100" class="image" />
    <polygon points="100,100 90,90 90,110" class="image" />
  </g>
</svg>