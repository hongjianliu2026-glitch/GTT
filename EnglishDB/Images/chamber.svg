<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chamber</text>
  <text x="50" y="120" class="subtitle">[ˈtʃeɪmbər] n. 房间，会议厅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chamb (房间) + -er (表示场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的城堡里，"房间(chamb)"里
    <tspan x="50" dy="25">藏着无数秘密，这个房间就是会议厅(chamber)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting was held in the chamber.
  </text>
  <text x="50" y="310" class="content">
    会议在会议厅举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chamber -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Window -->
    <rect x="50" y="50" width="100" height="50" class="image" />
    <!-- Table -->
    <rect x="220" y="120" width="100" height="50" class="image" />
    <!-- Chairs -->
    <rect x="230" y="180" width="30" height="20" class="image" />
    <rect x="280" y="180" width="30" height="20" class="image" />
  </g>
</svg>