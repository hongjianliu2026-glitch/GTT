<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reptile</text>
  <text x="50" y="120" class="subtitle">[ˈrɛp.taɪl] n. 爬行动物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + pet (爬)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蜥蜴在沙漠中，"向后爬行(re-pet)"，
    <tspan x="50" dy="25">它的动作缓慢而稳健，这就是爬行动物(reptile)的特征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The desert is home to many reptiles, such as snakes and lizards.
  </text>
  <text x="50" y="310" class="content">
    沙漠是许多爬行动物的家园，如蛇和蜥蜴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <!-- Lizard -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Sand dunes -->
    <line x1="100" y1="200" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="300" y2="200" class="image" />
  </g>
</svg>