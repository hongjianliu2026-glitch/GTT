<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">secretary-general</text>
  <text x="50" y="120" class="subtitle">[ˌsɛkrəˌtɛri ˈdʒɛnərəl] n. 秘书长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> secret (秘密) + ary (人) + general (总的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"秘密的人(secret-ary)"，他是所有事务的"总负责人(general)"，
    <tspan x="50" dy="25">就像一个组织的秘书长(secretary-general)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The secretary-general of the UN is a key figure in global diplomacy.
  </text>
  <text x="50" y="310" class="content">
    联合国秘书长是全球外交的关键人物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chair -->
    <rect x="50" y="150" width="50" height="50" class="image" />
    <!-- Person -->
    <circle cx="75" cy="130" r="15" class="image" />
    <line x1="75" y1="145" x2="75" y2="180" class="image" />
    <line x1="75" y1="180" x2="60" y2="200" class="image" />
    <line x1="75" y1="180" x2="90" y2="200" class="image" />
    <line x1="75" y1="160" x2="100" y2="150" class="image" />
    <!-- Documents -->
    <rect x="150" y="20" width="150" height="160" class="image" />
    <line x1="160" y1="50" x2="290" y2="50" class="image" />
    <line x1="160" y1="80" x2="280" y2="80" class="image" />
    <line x1="160" y1="110" x2="270" y2="110" class="image" />
    <line x1="160" y1="140" x2="260" y2="140" class="image" />
  </g>
</svg>