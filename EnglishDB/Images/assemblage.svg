<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">assemblage</text>
  <text x="50" y="120" class="subtitle">[əˈsembliːʒ] n. 集合，装配</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> as- (朝向) + sembl (相似) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群相似的零件"朝向(as-sembl)"一起，
    <tspan x="50" dy="25">形成一个完整的集合(assemblage)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The assemblage of parts took several hours.
  </text>
  <text x="50" y="310" class="content">
    零件的装配花了好几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parts -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <line x1="180" y1="50" x2="220" y2="50" class="image" />
    <line x1="200" y1="30" x2="200" y2="70" class="image" />
    <!-- Assembled object -->
    <rect x="50" y="100" width="170" height="50" class="image" />
    <line x1="50" y1="100" x2="220" y2="100" class="image" />
    <line x1="50" y1="150" x2="220" y2="150" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="220" y1="100" x2="220" y2="150" class="image" />
  </g>
</svg>