<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interested</text>
  <text x="50" y="120" class="subtitle">[ˈɪntrəstɪd] adj. 感兴趣的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + est (存在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在人群中，"在...之间存在(inter-est)"
    <tspan x="50" dy="25">着对某事的兴趣，这种兴趣让他变得感兴趣(interested)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She became interested in astronomy after watching a documentary.
  </text>
  <text x="50" y="310" class="content">
    她在看了一部纪录片后对天文学产生了兴趣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in the crowd -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Crowd -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="350" cy="100" r="20" class="image" />
    <!-- Interest symbol -->
    <polygon points="50,220 30,260 70,260" class="image" />
    <line x1="50" y1="220" x2="50" y2="260" class="image" />
  </g>
</svg>