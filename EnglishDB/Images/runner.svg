<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">runner</text>
  <text x="50" y="120" class="subtitle">[ˈrʌnər] n. 跑步者，赛跑者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> run (跑) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"跑(run)"得飞快的人，他就是"跑步者(runner)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The marathon runner crossed the finish line first.
  </text>
  <text x="50" y="310" class="content">
    这位马拉松选手第一个冲过了终点线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Runner -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="80" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="80" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Ground -->
    <line x1="0" y1="180" x2="100" y2="180" class="image" />
  </g>
</svg>