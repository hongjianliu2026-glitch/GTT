<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jeopardy</text>
  <text x="50" y="120" class="subtitle">[ˈdʒepərdi] n. 危险，风险</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jeo- (游戏) + pardy (部分)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在一个游戏节目中，"游戏(jeo-)"的"部分(pardy)"
    <tspan x="50" dy="25">突然变得危险，选手们面临巨大的风险(jeopardy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project is in jeopardy due to lack of funding.
  </text>
  <text x="50" y="310" class="content">
    由于资金不足，该项目面临风险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Game show board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Question mark -->
    <text x="50" y="100" font-size="100" fill="#E74C3C">?</text>
    <!-- Lightning bolt -->
    <polyline points="250,50 300,100 250,150" class="image" />
    <!-- Danger sign -->
    <text x="200" y="180" font-size="50" fill="#C0392B">!</text>
  </g>
</svg>