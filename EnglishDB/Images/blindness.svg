<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blindness</text>
  <text x="50" y="120" class="subtitle">[ˈblaɪndnəs] n. 失明，盲目</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blind (盲的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人戴着墨镜，"看不见(blind)"
    <tspan x="50" dy="25">周围的一切，这种状态就是失明(blindness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His blindness was caused by a severe accident.
  </text>
  <text x="50" y="310" class="content">
    他的失明是由一次严重的事故引起的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with sunglasses -->
    <circle cx="50" cy="50" r="30" class="image" />
    <rect x="35" y="35" width="30" height="10" class="image" />
    <rect x="65" y="35" width="30" height="10" class="image" />
    <line x1="50" y1="60" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="90" y2="70" class="image" />
  </g>
</svg>