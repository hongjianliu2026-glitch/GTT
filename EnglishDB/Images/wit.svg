<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wit</text>
  <text x="50" y="120" class="subtitle">[wɪt] n. 智慧，才智；机智</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wit (知道)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个智者，他的大脑里装满了"知道(wit)"
    <tspan x="50" dy="25">的知识，随时能用机智的回答解决问题。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her quick wit saved the day.
  </text>
  <text x="50" y="310" class="content">
    她的机智救了这一天。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Light bulb -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="80" y1="140" x2="60" y2="160" class="image" />
    <line x1="120" y1="140" x2="140" y2="160" class="image" />
    <!-- Thought bubbles -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="100" cy="20" r="10" class="image" />
  </g>
</svg>