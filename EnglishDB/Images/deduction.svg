<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deduction</text>
  <text x="50" y="120" class="subtitle">[dɪˈdʌkʃən] n. 扣除，演绎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + duct (引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个侦探在推理，"向下引导(de-duct)"
    <tspan x="50" dy="25">线索，最终得出结论，这就是演绎(deduction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The deduction of taxes from his salary left him with less money.
  </text>
  <text x="50" y="310" class="content">
    税款的扣除使他的工资减少了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Detective -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Magnifying glass -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="120" y1="100" x2="150" y2="100" class="image" />
    <!-- Clue lines -->
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="300" y2="50" class="image" />
    <line x1="300" y1="50" x2="350" y2="100" class="image" />
    <!-- Conclusion -->
    <rect x="350" y="80" width="50" height="40" class="image" />
    <text x="360" y="105" class="content">结论</text>
  </g>
</svg>