<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disrespect</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsrɪˈspɛkt] n. 不尊重，无礼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + respect (尊重)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人对另一个人竖起中指，"不(dis-)"
    <tspan x="50" dy="25">尊重(respect)对方，这就是不尊重(disrespect)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His disrespectful behavior angered the teacher.
  </text>
  <text x="50" y="310" class="content">
    他不尊重的行为激怒了老师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person 1 -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <!-- Person 2 -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="290" y2="130" class="image" />

    <!-- Disrespect gesture -->
    <line x1="50" y1="160" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="230" y2="220" class="image" />
    <line x1="250" y1="200" x2="270" y2="220" class="image" />
  </g>
</svg>