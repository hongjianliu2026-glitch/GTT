<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">geography</text>
  <text x="50" y="120" class="subtitle">[dʒiˈɒɡrəfi] n. 地理学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> geo- (地球) + graphy (写)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在地球上，"写下(graphy)"
    <tspan x="50" dy="25">关于地球(geo)的各种信息，这些信息就构成了地理学(geography)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She studied geography in college.
  </text>
  <text x="50" y="310" class="content">
    她在大学里学习地理学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Landmasses -->
    <path d="M100,100 L150,50 L200,100 L150,150 Z" class="image" />
    <path d="M175,20 L250,100 L225,150 Z" class="image" />
    <!-- Explorer -->
    <circle cx="100" cy="200" r="15" class="image" />
    <line x1="100" y1="215" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="280" class="image" />
    <line x1="100" y1="250" x2="120" y2="280" class="image" />
    <line x1="100" y1="230" x2="130" y2="220" class="image" />
    <!-- Notebook -->
    <rect x="50" y="250" width="100" height="50" class="image" />
    <!-- Pen -->
    <line x1="150" y1="270" x2="180" y2="270" class="image" />
    <line x1="180" y1="270" x2="180" y2="250" class="image" />
  </g>
</svg>