<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mobster</text>
  <text x="50" y="120" class="subtitle">[ˈmɒbstər] n. 暴徒，黑帮成员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mob (暴民) + -ster (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着黑色西装的"暴民(mob)"，
    <tspan x="50" dy="25">戴着墨镜，手持枪支，这就是一个"暴徒(mobster)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mobster was arrested for his involvement in illegal activities.
  </text>
  <text x="50" y="310" class="content">
    这名黑帮成员因参与非法活动被捕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Suit -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Sunglasses -->
    <rect x="50" y="20" width="50" height="20" class="image" />
    <!-- Gun -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="150" class="image" />
    <line x1="130" y1="150" x2="130" y2="130" class="image" />
    <line x1="130" y1="130" x2="150" y2="130" class="image" />
  </g>
</svg>