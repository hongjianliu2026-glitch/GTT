<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">denomination</text>
  <text x="50" y="120" class="subtitle">[dɪˌnɒmɪˈneɪʃn] n. 命名，分类；面额</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + nomin (名字) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的分类器，"向下命名(de-nomin-ation)"
    <tspan x="50" dy="25">各种物品，比如不同面额的硬币和纸币。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bank offers various denominations of currency.
  </text>
  <text x="50" y="310" class="content">
    银行提供各种面额的货币。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classification machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Coins -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="25" class="image" />
    <circle cx="150" cy="50" r="30" class="image" />
    <!-- Paper money -->
    <rect x="200" y="30" width="100" height="40" class="image" />
    <rect x="200" y="80" width="120" height="40" class="image" />
    <rect x="200" y="130" width="140" height="40" class="image" />
    <!-- Labels -->
    <text x="50" y="100" class="content">1¢</text>
    <text x="100" y="100" class="content">5¢</text>
    <text x="150" y="100" class="content">10¢</text>
    <text x="200" y="70" class="content">$1</text>
    <text x="200" y="120" class="content">$5</text>
    <text x="200" y="170" class="content">$10</text>
  </g>
</svg>