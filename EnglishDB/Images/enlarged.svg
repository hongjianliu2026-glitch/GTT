<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enlarged</text>
  <text x="50" y="120" class="subtitle">[ɪnˈlɑːrdʒd] adj. 扩大的，放大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + large (大)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通的苹果被"使变大(en-large)"，
    <tspan x="50" dy="25">变成了一个巨大的苹果，占据了整个桌子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enlarged image showed more details.
  </text>
  <text x="50" y="310" class="content">
    放大的图像显示了更多细节。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Normal apple -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Enlarged apple -->
    <circle cx="250" cy="100" r="80" class="image" />
    <!-- Table -->
    <rect x="0" y="150" width="500" height="50" class="image" />
    <!-- Arrows -->
    <line x1="80" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
    <text x="120" y="90" class="content">en-large</text>
  </g>
</svg>