<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tripod</text>
  <text x="50" y="120" class="subtitle">[ˈtraɪpɒd] n. 三脚架</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tri- (三) + pod (脚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的三脚架，"三只脚(tri-pod)"
    <tspan x="50" dy="25">稳稳地支撑着一个巨大的相机，捕捉每一个精彩瞬间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He set up his camera on a tripod to take a steady shot.
  </text>
  <text x="50" y="310" class="content">
    他把相机架在三脚架上，以拍摄稳定的画面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tripod legs -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="150" y1="0" x2="150" y2="200" class="image" />
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <!-- Tripod top -->
    <line x1="80" y1="0" x2="220" y2="0" class="image" />
    <line x1="80" y1="0" x2="150" y2="-30" class="image" />
    <line x1="220" y1="0" x2="150" y2="-30" class="image" />
    <!-- Camera -->
    <rect x="130" y="-50" width="40" height="30" class="image" />
    <rect x="140" y="-40" width="20" height="20" class="image" />
  </g>
</svg>