<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Hopi</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊpi] n. 霍皮族（美国亚利桑那州的一个印第安部落）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自霍皮语，意为“和平的人”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群霍皮族人围坐在篝火旁，"和平地(Hopi)"
    <tspan x="50" dy="25">分享故事，传递智慧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Hopi tribe has a rich cultural heritage.
  </text>
  <text x="50" y="310" class="content">
    霍皮族拥有丰富的文化遗产。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="100" cy="100" r="30" class="image" fill="#FFA500" />
    <circle cx="100" cy="100" r="25" class="image" fill="#FF4500" />
    <circle cx="100" cy="100" r="20" class="image" fill="#FF6347" />
    <!-- People -->
    <circle cx="50" cy="150" r="15" class="image" fill="#8B4513" />
    <circle cx="150" cy="150" r="15" class="image" fill="#8B4513" />
    <circle cx="100" cy="180" r="15" class="image" fill="#8B4513" />
    <!-- Ground -->
    <rect x="0" y="200" width="200" height="50" class="image" fill="#DEB887" />
  </g>
</svg>