<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stripped</text>
  <text x="50" y="120" class="subtitle">[strɪpt] adj. 剥去的，裸露的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> strip (剥去) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵树被"剥去(strip)"了所有的叶子，
    <tspan x="50" dy="25">只剩下光秃秃的树干，这就是"stripped"的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tree was stripped of its leaves by the storm.
  </text>
  <text x="50" y="310" class="content">
    那棵树被暴风雨剥去了所有的叶子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Branches -->
    <line x1="75" y1="20" x2="100" y2="50" class="image" />
    <line x1="75" y1="20" x2="50" y2="50" class="image" />
    <line x1="75" y1="60" x2="100" y2="90" class="image" />
    <line x1="75" y1="60" x2="50" y2="90" class="image" />
    <line x1="75" y1="100" x2="100" y2="130" class="image" />
    <line x1="75" y1="100" x2="50" y2="130" class="image" />
    <!-- Storm cloud -->
    <ellipse cx="150" cy="50" rx="60" ry="30" class="image" />
    <line x1="120" y1="50" x2="180" y2="50" class="image" />
    <line x1="150" y1="20" x2="150" y2="80" class="image" />
    <line x1="120" y1="35" x2="180" y2="65" class="image" />
    <line x1="120" y1="65" x2="180" y2="35" class="image" />
  </g>
</svg>