<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sale</text>
  <text x="50" y="120" class="subtitle">[seɪl] n. 销售，出售</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sal (盐) + e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象古代人们用盐(sal)作为货币，进行交易，
    <tspan x="50" dy="25">这种交易就是一种销售(sale)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store is having a big sale this weekend.
  </text>
  <text x="50" y="310" class="content">
    这家商店本周末有大促销。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Salt shaker -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="20" y="20" width="60" height="110" class="image" />
    <line x1="50" y1="20" x2="50" y2="130" class="image" />
    <!-- Coins -->
    <circle cx="150" cy="75" r="20" class="image" />
    <circle cx="180" cy="75" r="20" class="image" />
    <circle cx="210" cy="75" r="20" class="image" />
    <!-- Handshake -->
    <line x1="250" y1="50" x2="300" y2="100" class="image" />
    <line x1="250" y1="100" x2="300" y2="50" class="image" />
  </g>
</svg>