<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">convict</text>
  <text x="50" y="120" class="subtitle">[kənˈvɪkt] v. 宣判有罪；n. 罪犯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (加强) + vict (征服)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官在法庭上，"加强征服(con-vict)"
    <tspan x="50" dy="25">被告的罪行，最终宣判他有罪(convict)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jury convicted him of murder.
  </text>
  <text x="50" y="310" class="content">
    陪审团判定他犯有谋杀罪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Gavel -->
    <rect x="10" y="80" width="20" height="30" class="image" />
    <line x1="20" y1="80" x2="20" y2="50" class="image" />
    <!-- Prison bars -->
    <rect x="50" y="20" width="250" height="200" class="image" />
    <line x1="100" y1="20" x2="100" y2="220" class="image" />
    <line x1="150" y1="20" x2="150" y2="220" class="image" />
    <line x1="200" y1="20" x2="200" y2="220" class="image" />
    <line x1="250" y1="20" x2="250" y2="220" class="image" />
    <!-- Convict -->
    <circle cx="175" cy="120" r="15" class="image" />
    <line x1="175" y1="135" x2="175" y2="170" class="image" />
    <line x1="175" y1="170" x2="155" y2="200" class="image" />
    <line x1="175" y1="170" x2="195" y2="200" class="image" />
    <line x1="175" y1="150" x2="205" y2="140" class="image" />
  </g>
</svg>