<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .wing { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">butterfly</text>
  <text x="50" y="120" class="subtitle">[ˈbʌtərflaɪ] n. 蝴蝶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> butter (黄油) + fly (飞)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶在花丛中飞舞，它的翅膀闪烁着金黄色的光芒，就像一片片黄油在阳光下融化。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The butterfly fluttered its wings and flew away.
  </text>
  <text x="50" y="310" class="content">
    蝴蝶扇动翅膀飞走了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butterfly body -->
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Butterfly wings -->
    <ellipse cx="50" cy="100" rx="40" ry="80" class="wing" />
    <ellipse cx="150" cy="100" rx="40" ry="80" class="wing" />
    <!-- Butterfly antennae -->
    <line x1="80" y1="80" x2="60" y2="60" class="image" />
    <line x1="120" y1="80" x2="140" y2="60" class="image" />
  </g>
</svg>