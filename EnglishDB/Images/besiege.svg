<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">besiege</text>
  <text x="50" y="120" class="subtitle">[bɪˈsiːdʒ] v. 围攻，包围</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + siege (包围)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座城堡被"使(be-)"无数士兵"包围(siege)"，
    <tspan x="50" dy="25">士兵们从四面八方涌来，形成了一个严密的包围圈。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city was besieged by enemy forces for months.
  </text>
  <text x="50" y="310" class="content">
    这座城市被敌军围攻了数月。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="50" y="20" width="200" height="160" class="image" />
    <rect x="70" y="40" width="160" height="120" class="image" />
    <rect x="90" y="60" width="120" height="80" class="image" />
    <!-- Soldiers -->
    <circle cx="20" cy="100" r="15" class="image" />
    <circle cx="380" cy="100" r="15" class="image" />
    <circle cx="200" cy="20" r="15" class="image" />
    <circle cx="200" cy="180" r="15" class="image" />
    <circle cx="380" cy="180" r="15" class="image" />
    <circle cx="20" cy="180" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="380" cy="20" r="15" class="image" />
  </g>
</svg>