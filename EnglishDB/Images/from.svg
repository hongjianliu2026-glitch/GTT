<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">from</text>
  <text x="50" y="120" class="subtitle">[frəm] prep. 从，来自</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "frō" (产生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个种子从土壤中"产生(frō)"，
    <tspan x="50" dy="25">然后长成一棵大树，这就是"从(from)"的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She comes from a small village.
  </text>
  <text x="50" y="310" class="content">
    她来自一个小村庄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soil -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Seed -->
    <circle cx="50" cy="140" r="10" class="image" />
    <!-- Tree -->
    <line x1="150" y1="150" x2="150" y2="50" class="image" />
    <line x1="140" y1="70" x2="160" y2="70" class="image" />
    <line x1="130" y1="90" x2="170" y2="90" class="image" />
    <line x1="120" y1="110" x2="180" y2="110" class="image" />
    <line x1="110" y1="130" x2="190" y2="130" class="image" />
  </g>
</svg>