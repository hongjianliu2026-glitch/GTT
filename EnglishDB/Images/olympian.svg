<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Olympian</text>
  <text x="50" y="120" class="subtitle">[əˈlɪmpiən] n. 奥林匹亚人，奥林匹克运动员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Olymp (奥林匹斯山) + -ian (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员站在奥林匹斯山(Olymp)之巅，
    <tspan x="50" dy="25">他/她就是奥林匹亚人(Olympian)，象征着力量与荣耀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Olympian won the gold medal with ease.
  </text>
  <text x="50" y="310" class="content">
    这位奥林匹克运动员轻松赢得了金牌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 175,0 350,200" class="image" />
    <!-- Athlete -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="180" x2="150" y2="160" class="image" />
    <line x1="175" y1="180" x2="200" y2="160" class="image" />
    <line x1="175" y1="200" x2="150" y2="220" class="image" />
    <line x1="175" y1="200" x2="200" y2="220" class="image" />
  </g>
</svg>