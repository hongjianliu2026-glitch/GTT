<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paving</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪvɪŋ] n. 铺路，铺砌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pave (铺) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群工人在忙碌地"铺(pave)"路，
    <tspan x="50" dy="25">他们正在进行的动作就是铺路(paving)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new road is under paving.
  </text>
  <text x="50" y="310" class="content">
    新路正在铺设中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Paving stones -->
    <rect x="20" y="20" width="50" height="60" class="image" />
    <rect x="90" y="20" width="50" height="60" class="image" />
    <rect x="160" y="20" width="50" height="60" class="image" />
    <rect x="230" y="20" width="50" height="60" class="image" />
    <rect x="300" y="20" width="50" height="60" class="image" />
    <!-- Workers -->
    <circle cx="50" cy="120" r="15" class="image" />
    <line x1="50" y1="135" x2="50" y2="170" class="image" />
    <line x1="50" y1="170" x2="30" y2="200" class="image" />
    <line x1="50" y1="170" x2="70" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <circle cx="120" cy="120" r="15" class="image" />
    <line x1="120" y1="135" x2="120" y2="170" class="image" />
    <line x1="120" y1="170" x2="100" y2="200" class="image" />
    <line x1="120" y1="170" x2="140" y2="200" class="image" />
    <line x1="120" y1="150" x2="150" y2="140" class="image" />
  </g>
</svg>