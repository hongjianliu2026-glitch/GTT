<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bunny</text>
  <text x="50" y="120" class="subtitle">[ˈbʌni] n. 兔子，兔宝宝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "bunne"，意为兔子
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只可爱的兔宝宝(bunny)在草地上跳跃，
    <tspan x="50" dy="25">它的耳朵长长的，尾巴短短的，非常惹人喜爱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The little girl loves to play with her pet bunny.
  </text>
  <text x="50" y="310" class="content">
    小女孩喜欢和她的宠物兔宝宝玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bunny -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFFFFF" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="170" x2="50" y2="150" class="image" />
    <line x1="100" y1="170" x2="150" y2="150" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="250" class="image" />
    <circle cx="70" cy="80" r="10" class="image" fill="#000000" />
    <circle cx="130" cy="80" r="10" class="image" fill="#000000" />
    <path d="M 90 120 Q 100 140 110 120" class="image" fill="#FF69B4" />
  </g>
</svg>