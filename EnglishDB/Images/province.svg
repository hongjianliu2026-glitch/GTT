<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">province</text>
  <text x="50" y="120" class="subtitle">[ˈprɒvɪns] n. 省，领域</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + vince (征服)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的将军"向前征服(pro-vince)"
    <tspan x="50" dy="25">一片土地，这片土地就成为了一个省(province)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He traveled to the province of Sichuan.
  </text>
  <text x="50" y="310" class="content">
    他去了四川省。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Province boundary -->
    <path d="M50,20 L300,20 L300,180 L50,180 Z" class="image" />
    <!-- Flag -->
    <rect x="250" y="10" width="80" height="50" class="image" />
    <line x1="290" y1="60" x2="290" y2="150" class="image" />
    <!-- General -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
  </g>
</svg>