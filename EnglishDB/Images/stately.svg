<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stately</text>
  <text x="50" y="120" class="subtitle">[ˈsteɪtli] adj. 庄严的，宏伟的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> state (状态，国家) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座宏伟的宫殿，"国家(state)"的象征，
    <tspan x="50" dy="25">它的庄严(stately)让人心生敬畏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stately mansion was a sight to behold.
  </text>
  <text x="50" y="310" class="content">
    那座宏伟的宅邸令人叹为观止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Palace -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Crown -->
    <circle cx="200" cy="10" r="20" class="image" />
    <line x1="180" y1="10" x2="220" y2="10" class="image" />
    <line x1="190" y1="0" x2="210" y2="0" class="image" />
    <line x1="200" y1="20" x2="200" y2="40" class="image" />
  </g>
</svg>