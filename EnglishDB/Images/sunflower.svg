<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #5D4037; }
      .content { font: 18px sans-serif; fill: #3E2723; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #1976D2; }
      .image { stroke: #795548; stroke-width: 2; fill: none; }
      .sunflower { fill: #FFC107; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sunflower</text>
  <text x="50" y="120" class="subtitle">[ˈsʌnˌflaʊər] n. 向日葵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + flower (花)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵巨大的向日葵，它的花盘像太阳一样明亮，
    <tspan x="50" dy="25">总是面向太阳，象征着光明和希望。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sunflower follows the sun throughout the day.
  </text>
  <text x="50" y="310" class="content">
    向日葵一整天都跟着太阳转。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFEB3B" />
    <!-- Sun rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Sunflower -->
    <circle cx="300" cy="100" r="40" class="sunflower" />
    <line x1="300" y1="140" x2="300" y2="200" class="image" />
    <line x1="300" y1="160" x2="280" y2="180" class="image" />
    <line x1="300" y1="160" x2="320" y2="180" class="image" />
    <line x1="300" y1="200" x2="280" y2="220" class="image" />
    <line x1="300" y1="200" x2="320" y2="220" class="image" />
  </g>
</svg>