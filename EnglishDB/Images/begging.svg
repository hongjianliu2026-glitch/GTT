<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">begging</text>
  <text x="50" y="120" class="subtitle">[ˈbɛɡɪŋ] v. 乞讨，恳求</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> beg (乞求) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个衣衫褴褛的人，双手合十，"乞求(beg)"
    <tspan x="50" dy="25">施舍，他的眼神充满了恳求(begging)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The homeless man was begging for food.
  </text>
  <text x="50" y="310" class="content">
    那个流浪汉在乞讨食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beggar -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Hands -->
    <line x1="50" y1="130" x2="20" y2="100" class="image" />
    <line x1="50" y1="130" x2="80" y2="100" class="image" />
    <!-- Bowl -->
    <rect x="30" y="250" width="40" height="20" class="image" />
  </g>
</svg>