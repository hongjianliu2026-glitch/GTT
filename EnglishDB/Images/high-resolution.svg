<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">high-resolution</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪ rɪˈzɒljuːʃn] adj. 高分辨率的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> high (高) + resolution (分辨率)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摄影师在拍摄一张"高分辨率(high-resolution)"的照片，
    <tspan x="50" dy="25">照片中的细节清晰可见，就像放大镜下的世界一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The camera takes high-resolution photos.
  </text>
  <text x="50" y="310" class="content">
    这台相机拍摄高分辨率的照片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camera -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <circle cx="75" cy="50" r="20" class="image" />
    <!-- High-resolution photo -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <line x1="210" y1="10" x2="340" y2="10" class="image" />
    <line x1="210" y1="30" x2="340" y2="30" class="image" />
    <line x1="210" y1="50" x2="340" y2="50" class="image" />
    <line x1="210" y1="70" x2="340" y2="70" class="image" />
    <line x1="210" y1="90" x2="340" y2="90" class="image" />
    <line x1="210" y1="10" x2="210" y2="90" class="image" />
    <line x1="340" y1="10" x2="340" y2="90" class="image" />
  </g>
</svg>