<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">invert</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvɜːrt] v. 使倒转，使颠倒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vert (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师将一个杯子里的水"倒转(invert)"，
    <tspan x="50" dy="25">水神奇地从杯底流出，仿佛时间倒流。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She inverted the glass to show it was empty.
  </text>
  <text x="50" y="310" class="content">
    她把杯子倒过来，以示它是空的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup -->
    <rect x="50" y="20" width="100" height="150" class="image" />
    <!-- Water -->
    <path d="M 100 170 Q 150 170 150 220 L 50 220 Q 50 170 100 170" class="image" />
    <!-- Inverted water -->
    <path d="M 100 170 Q 150 170 150 120 L 50 120 Q 50 170 100 170" class="image" />
    <!-- Magician -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>