<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parlay</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːrleɪ] v. 通过谈判或协商达成协议；n. 谈判，协商</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> par- (平等) + lay (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面坐着，"平等放置(par-lay)"
    <tspan x="50" dy="25">他们的意见，通过谈判达成共识。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They managed to parlay their differences into a mutually beneficial agreement.
  </text>
  <text x="50" y="310" class="content">
    他们设法通过谈判将分歧转化为互利的协议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two people -->
    <circle cx="70" cy="100" r="20" class="image" />
    <circle cx="280" cy="100" r="20" class="image" />
    <!-- Hands shaking -->
    <line x1="90" y1="120" x2="260" y2="120" class="image" />
    <line x1="90" y1="120" x2="175" y2="140" class="image" />
    <line x1="260" y1="120" x2="175" y2="140" class="image" />
  </g>
</svg>