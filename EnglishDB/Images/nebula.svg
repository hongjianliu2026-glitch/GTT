<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .star { fill: #F1C40F; }
      .nebula { fill: #9B59B6; opacity: 0.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nebula</text>
  <text x="50" y="120" class="subtitle">[ˈnɛbjələ] n. 星云</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nebu- (云) + -la (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片浩瀚的宇宙中，"小云(nebu-la)"
    <tspan x="50" dy="25">聚集成一片星云(nebula)，闪烁着神秘的光芒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Hubble telescope captured stunning images of the nebula.
  </text>
  <text x="50" y="310" class="content">
    哈勃望远镜捕捉到了星云的惊人图像。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nebula -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="nebula" />
    <!-- Stars -->
    <circle cx="100" cy="50" r="5" class="star" />
    <circle cx="250" cy="70" r="4" class="star" />
    <circle cx="150" cy="120" r="3" class="star" />
    <circle cx="200" cy="30" r="6" class="star" />
    <circle cx="300" cy="90" r="5" class="star" />
  </g>
</svg>