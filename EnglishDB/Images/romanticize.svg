<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">romanticize</text>
  <text x="50" y="120" class="subtitle">[rəˈmæntɪsaɪz] v. 浪漫化，理想化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roman (浪漫) + -tic (形容词后缀) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在月光下，"浪漫地(roman-tic)"
    <tspan x="50" dy="25">将平凡的事物理想化(ize)，这就是浪漫化(romanticize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tends to romanticize her past relationships.
  </text>
  <text x="50" y="310" class="content">
    她倾向于将过去的恋情理想化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Heart -->
    <path d="M250,120 C250,110 260,100 270,110 C280,120 270,130 260,120 Z" class="image" fill="#E74C3C" />
  </g>
</svg>