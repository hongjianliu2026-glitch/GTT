<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">earphone</text>
  <text x="50" y="120" class="subtitle">[ˈɪrfoʊn] n. 耳机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ear (耳朵) + phone (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人戴着耳机，耳朵(ear)里传来美妙的声音(phone)，
    <tspan x="50" dy="25">仿佛整个世界都在耳边回响。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He always listens to music with his earphones.
  </text>
  <text x="50" y="310" class="content">
    他总是戴着耳机听音乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Earphones -->
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <circle cx="0" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- Sound waves -->
    <path d="M200,80 C220,80 220,120 200,120" class="image" />
    <path d="M200,70 C230,70 230,130 200,130" class="image" />
    <path d="M200,60 C240,60 240,140 200,140" class="image" />
  </g>
</svg>