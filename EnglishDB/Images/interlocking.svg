<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interlocking</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈlɑːkɪŋ] adj. 连锁的，互锁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + lock (锁)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两把锁相互"锁在(inter-lock)"一起，
    <tspan x="50" dy="25">形成一个无法分离的整体，这就是"互锁(interlocking)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gears are interlocking to ensure smooth operation.
  </text>
  <text x="50" y="310" class="content">
    齿轮相互啮合以确保平稳运行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First lock -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <line x1="20" y1="20" x2="80" y2="80" class="image" />
    <line x1="20" y1="80" x2="80" y2="20" class="image" />
    <!-- Second lock -->
    <rect x="120" y="0" width="100" height="100" class="image" />
    <line x1="140" y1="20" x2="200" y2="80" class="image" />
    <line x1="140" y1="80" x2="200" y2="20" class="image" />
    <!-- Interlocking lines -->
    <line x1="100" y1="50" x2="120" y2="50" class="image" />
    <line x1="100" y1="70" x2="120" y2="70" class="image" />
  </g>
</svg>