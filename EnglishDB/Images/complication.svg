<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">complication</text>
  <text x="50" y="120" class="subtitle">[ˌkɑːmplɪˈkeɪʃn] n. 复杂化，并发症</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + plic (折叠) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个复杂的机械装置，"一起折叠(com-plic)"
    <tspan x="50" dy="25">在一起，导致事情变得复杂(complication)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was delayed due to unexpected complications.
  </text>
  <text x="50" y="310" class="content">
    由于意外的复杂情况，项目被推迟了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Complex machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="100" class="image" />
    <rect x="170" y="20" width="100" height="100" class="image" />
    <rect x="50" y="140" width="100" height="40" class="image" />
    <rect x="170" y="140" width="100" height="40" class="image" />
    <line x1="100" y1="20" x2="100" y2="140" class="image" />
    <line x1="220" y1="20" x2="220" y2="140" class="image" />
    <line x1="50" y1="70" x2="270" y2="70" class="image" />
    <line x1="50" y1="160" x2="270" y2="160" class="image" />
    <!-- Wires -->
    <line x1="70" y1="40" x2="150" y2="120" class="image" />
    <line x1="190" y1="40" x2="110" y2="120" class="image" />
    <line x1="70" y1="100" x2="250" y2="100" class="image" />
  </g>
</svg>