<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">metabolism</text>
  <text x="50" y="120" class="subtitle">[məˈtæbəˌlɪzəm] n. 新陈代谢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meta- (变化) + bol (投掷) + -ism (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个细胞内部，"变化(meta-)"着"投掷(bol)"
    <tspan x="50" dy="25">能量和物质，这就是新陈代谢(metabolism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Exercise can boost your metabolism.
  </text>
  <text x="50" y="310" class="content">
    锻炼可以提高你的新陈代谢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cell -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Energy particles -->
    <circle cx="120" cy="50" r="10" class="image" />
    <circle cx="230" cy="50" r="10" class="image" />
    <circle cx="175" cy="150" r="10" class="image" />
    <!-- Arrows -->
    <line x1="120" y1="50" x2="175" y2="100" class="image" />
    <line x1="230" y1="50" x2="175" y2="100" class="image" />
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <!-- Labels -->
    <text x="100" y="30" class="content">能量</text>
    <text x="250" y="30" class="content">物质</text>
    <text x="160" y="170" class="content">变化</text>
  </g>
</svg>