<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pine</text>
  <text x="50" y="120" class="subtitle">[paɪn] n. 松树；v. 渴望，憔悴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pine (松树)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵高大的松树(pine)，它的枝叶茂密，
    <tspan x="50" dy="25">象征着坚韧和长寿。而当人们"憔悴(pine)"时，</tspan>
    <tspan x="50" dy="25">就像松树失去了生机，变得枯萎。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She pined for her lost love.
  </text>
  <text x="50" y="310" class="content">
    她为失去的爱而憔悴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pine tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <polygon points="80,200 120,200 110,150 90,150" class="image" />
    <polygon points="70,150 130,150 120,100 80,100" class="image" />
    <polygon points="60,100 140,100 130,50 70,50" class="image" />
    <!-- Person pining -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
  </g>
</svg>