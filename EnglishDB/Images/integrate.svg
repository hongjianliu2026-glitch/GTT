<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">integrate</text>
  <text x="50" y="120" class="subtitle">[ˈɪntɪɡreɪt] v. 整合，使成整体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + tegr (触摸) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工程师将不同的零件"触摸(tegr)"在一起，
    <tspan x="50" dy="25">使它们"进入(in)"一个整体，这就是整合(integrate)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company plans to integrate its various departments.
  </text>
  <text x="50" y="310" class="content">
    公司计划整合其各个部门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parts -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <!-- Engineer -->
    <circle cx="180" cy="150" r="15" class="image" />
    <line x1="180" y1="165" x2="180" y2="200" class="image" />
    <line x1="180" y1="200" x2="160" y2="230" class="image" />
    <line x1="180" y1="200" x2="200" y2="230" class="image" />
    <line x1="180" y1="180" x2="210" y2="170" class="image" />
    <!-- Integration -->
    <line x1="50" y1="100" x2="270" y2="100" class="image" />
    <line x1="50" y1="100" x2="180" y2="150" class="image" />
    <line x1="270" y1="100" x2="180" y2="150" class="image" />
  </g>
</svg>