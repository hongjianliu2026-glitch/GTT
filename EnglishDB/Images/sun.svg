<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FF5733; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C70039; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #FFC300; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sun</text>
  <text x="50" y="120" class="subtitle">[sʌn] n. 太阳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太阳在天空中，"太阳(sun)"
    <tspan x="50" dy="25">照耀着大地，给世界带来光明和温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sun rises in the east.
  </text>
  <text x="50" y="310" class="content">
    太阳从东方升起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="80" class="image" fill="#FFC300" />
    <!-- Rays -->
    <line x1="100" y1="20" x2="100" y2="0" class="image" />
    <line x1="180" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="20" y1="100" x2="0" y2="100" class="image" />
    <line x1="150" y1="50" x2="170" y2="30" class="image" />
    <line x1="150" y1="150" x2="170" y2="170" class="image" />
    <line x1="50" y1="50" x2="30" y2="30" class="image" />
    <line x1="50" y1="150" x2="30" y2="170" class="image" />
  </g>
</svg>