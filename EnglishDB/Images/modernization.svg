<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">modernization</text>
  <text x="50" y="120" class="subtitle">[ˌmɒdənaɪˈzeɪʃn] n. 现代化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> modern (现代的) + -ize (使...) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的村庄，突然被"现代化的力量(modern-ize-ation)"
    <tspan x="50" dy="25">改造，变成了一个充满高科技和现代设施的城市。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government is pushing for the modernization of the transportation system.
  </text>
  <text x="50" y="310" class="content">
    政府正在推动交通系统的现代化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old village -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Modern city -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <line x1="220" y1="20" x2="330" y2="20" class="image" />
    <line x1="220" y1="40" x2="330" y2="40" class="image" />
    <line x1="220" y1="60" x2="330" y2="60" class="image" />
    <line x1="220" y1="80" x2="330" y2="80" class="image" />
    <rect x="240" y="20" width="30" height="30" class="image" />
    <rect x="280" y="20" width="30" height="30" class="image" />
    <rect x="240" y="60" width="30" height="30" class="image" />
    <rect x="280" y="60" width="30" height="30" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <polygon points="195,45 200,50 195,55" class="image" />
  </g>
</svg>