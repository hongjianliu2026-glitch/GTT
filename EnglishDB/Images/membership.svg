<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">membership</text>
  <text x="50" y="120" class="subtitle">[ˈmembərʃɪp] n. 会员身份，成员资格</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> member (成员) + -ship (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个俱乐部，成员们(member)聚集在一起，
    <tspan x="50" dy="25">他们的身份(ship)就是会员身份(membership)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She applied for a membership at the local gym.
  </text>
  <text x="50" y="310" class="content">
    她申请了当地健身房的会员资格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clubhouse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Members -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Membership card -->
    <rect x="300" y="80" width="40" height="40" class="image" />
    <text x="305" y="105" class="content" fill="#7F8C8D">ID</text>
  </g>
</svg>