<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intrude</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtruːd] v. 侵入，打扰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + trud (推)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人强行"推入(trud)"别人的私人空间，
    <tspan x="50" dy="25">这种行为就是"侵入(intrude)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt intruded when he entered her room without permission.
  </text>
  <text x="50" y="310" class="content">
    当他未经允许进入她的房间时，她感到被侵入了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Person intruding -->
    <circle cx="80" cy="100" r="15" class="image" />
    <line x1="80" y1="115" x2="80" y2="150" class="image" />
    <line x1="80" y1="150" x2="60" y2="180" class="image" />
    <line x1="80" y1="150" x2="100" y2="180" class="image" />
    <line x1="80" y1="130" x2="110" y2="120" class="image" />
    <!-- Arrow indicating intrusion -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,100 140,95 140,105" class="image" />
  </g>
</svg>