<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marginalize</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrdʒənəlaɪz] v. 边缘化，排斥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> margin (边缘) + -al (形容词后缀) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围成一个圈，其中一个人被"推到边缘(margin)"，
    <tspan x="50" dy="25">远离中心，这就是被边缘化(marginalize)的情景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The minority group was marginalized by the majority.
  </text>
  <text x="50" y="310" class="content">
    少数群体被多数群体边缘化了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle of people -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- Central person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Marginalized person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <!-- Arrows pointing to marginalized person -->
    <line x1="180" y1="100" x2="120" y2="100" class="image" />
    <line x1="170" y1="90" x2="110" y2="90" class="image" />
    <line x1="160" y1="80" x2="100" y2="80" class="image" />
    <line x1="150" y1="70" x2="90" y2="70" class="image" />
  </g>
</svg>