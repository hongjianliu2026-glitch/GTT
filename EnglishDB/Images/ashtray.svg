<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ashtray</text>
  <text x="50" y="120" class="subtitle">[ˈæʃtreɪ] n. 烟灰缸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ash (灰) + tray (托盘)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个烟灰缸(ashtray)，里面装满了烟灰(ash)，
    <tspan x="50" dy="25">就像一个托盘(tray)一样，专门用来收集烟灰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He emptied the ashtray after the party.
  </text>
  <text x="50" y="310" class="content">
    他在派对后清空了烟灰缸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ashtray -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Ash -->
    <rect x="20" y="20" width="160" height="60" class="image" fill="#8B8B8B" />
    <!-- Cigarette butt -->
    <line x1="100" y1="80" x2="100" y2="100" class="image" />
    <circle cx="100" cy="75" r="5" class="image" fill="#8B8B8B" />
  </g>
</svg>