<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">harsh</text>
  <text x="50" y="120" class="subtitle">[hɑːrʃ] adj. 严厉的，严酷的，刺耳的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hars (硬) + -h (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个严厉的老师，"硬(hars)"
    <tspan x="50" dy="25">地批评学生，声音刺耳，让人难以忍受。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The harsh winter wind made it difficult to walk.
  </text>
  <text x="50" y="310" class="content">
    严酷的冬风让人难以行走。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teacher -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Mouth -->
    <line x1="20" y1="110" x2="20" y2="90" class="image" />
    <line x1="20" y1="90" x2="10" y2="80" class="image" />
    <line x1="20" y1="90" x2="30" y2="80" class="image" />
    <!-- Student -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="90" y2="180" class="image" />
    <line x1="100" y1="150" x2="110" y2="180" class="image" />
    <line x1="100" y1="130" x2="120" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 20 80 Q 50 50 80 80" class="image" />
    <path d="M 80 80 Q 110 50 140 80" class="image" />
    <path d="M 140 80 Q 170 50 200 80" class="image" />
  </g>
</svg>