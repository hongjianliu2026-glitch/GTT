<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rescue</text>
  <text x="50" y="120" class="subtitle">[ˈrɛskjuː] v. 营救，救援；n. 营救，救援</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + scue (来自拉丁语 "secūrus"，安全)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的救援者，"再次(re-)"
    <tspan x="50" dy="25">确保(scue)某人安全，这就是救援(rescue)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The firefighters rescued the cat from the tree.
  </text>
  <text x="50" y="310" class="content">
    消防员从树上救下了那只猫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Rescue scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tree -->
    <line x1="50" y1="180" x2="50" y2="20" class="image" />
    <line x1="50" y1="20" x2="70" y2="60" class="image" />
    <line x1="50" y1="20" x2="30" y2="60" class="image" />
    <!-- Cat -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="35" y2="180" class="image" />
    <line x1="50" y1="150" x2="65" y2="180" class="image" />
    <!-- Firefighter -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <line x1="200" y1="140" x2="160" y2="130" class="image" />
    <!-- Ladder -->
    <line x1="180" y1="100" x2="180" y2="180" class="image" />
    <line x1="190" y1="100" x2="190" y2="180" class="image" />
    <line x1="200" y1="100" x2="200" y2="180" class="image" />
    <line x1="210" y1="100" x2="210" y2="180" class="image" />
    <line x1="220" y1="100" x2="220" y2="180" class="image" />
  </g>
</svg>