<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ethicist</text>
  <text x="50" y="120" class="subtitle">[ˈɛθɪsɪst] n. 伦理学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eth (伦理) + -ist (从事...的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着西装的伦理学家，手持一本厚重的伦理书，
    <tspan x="50" dy="25">站在道德的天平上，思考着复杂的伦理问题。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ethicist debated the moral implications of the new technology.
  </text>
  <text x="50" y="310" class="content">
    伦理学家就新技术的道德影响进行了辩论。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ethicist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Book -->
    <rect x="50" y="80" width="100" height="120" class="image" />
    <line x1="70" y1="90" x2="130" y2="90" class="image" />
    <line x1="70" y1="110" x2="130" y2="110" class="image" />
    <line x1="70" y1="130" x2="130" y2="130" class="image" />
    <line x1="70" y1="150" x2="130" y2="150" class="image" />
    <!-- Balance -->
    <line x1="100" y1="220" x2="200" y2="220" class="image" />
    <line x1="150" y1="220" x2="150" y2="250" class="image" />
    <line x1="130" y1="250" x2="170" y2="250" class="image" />
  </g>
</svg>