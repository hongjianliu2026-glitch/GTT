<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disappointed</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈpɔɪntɪd] adj. 失望的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (否定) + appoint (任命) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人期待被"任命(appoint)"，但结果却"没有被任命(dis-appoint)"，
    <tspan x="50" dy="25">脸上露出失望的表情，这就是"失望的(disappointed)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was disappointed when she didn't get the job.
  </text>
  <text x="50" y="310" class="content">
    她没有得到那份工作时感到失望。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" />
    <!-- Broken heart -->
    <path d="M 150 80 Q 180 50 210 80 L 180 110 Q 150 80 180 50" class="image" />
  </g>
</svg>