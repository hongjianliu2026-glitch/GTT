<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">racetrack</text>
  <text x="50" y="120" class="subtitle">[ˈreɪsˌtræk] n. 赛马场，跑道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> race (比赛) + track (轨道)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群赛车在"轨道(track)"上"比赛(race)"，
    <tspan x="50" dy="25">速度飞快，尘土飞扬，这就是赛马场(racetrack)的壮观景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The racetrack was filled with excited spectators.
  </text>
  <text x="50" y="310" class="content">
    赛马场上挤满了兴奋的观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Racetrack -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cars -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="120" y="20" width="50" height="30" class="image" />
    <rect x="190" y="20" width="50" height="30" class="image" />
    <rect x="260" y="20" width="50" height="30" class="image" />
    <!-- Track lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Spectators -->
    <circle cx="20" cy="100" r="15" class="image" />
    <circle cx="40" cy="100" r="15" class="image" />
    <circle cx="60" cy="100" r="15" class="image" />
    <circle cx="80" cy="100" r="15" class="image" />
  </g>
</svg>