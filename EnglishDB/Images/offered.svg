<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">offered</text>
  <text x="50" y="120" class="subtitle">[ˈɒfəd] v. 提供，提出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> of- (离开) + fer (带来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一个礼物盒，"离开(of-)"
    <tspan x="50" dy="25">并"带来(fer)"给另一个人，这就是"提供(offered)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He offered her a job at his company.
  </text>
  <text x="50" y="310" class="content">
    他向她提供了一份在他公司的工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with gift box -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left arm -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="50" y2="200" class="image" /> <!-- Legs -->
    <rect x="70" y="120" width="40" height="30" class="image" /> <!-- Gift box -->
    <line x1="90" y1="120" x2="90" y2="150" class="image" /> <!-- Ribbon -->
  </g>
</svg>