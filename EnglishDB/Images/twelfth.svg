<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twelfth</text>
  <text x="50" y="120" class="subtitle">[twelfθ] adj. 第十二的，十二分之一的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twelf (十二) + th (表示顺序)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕被切成十二份，每一份都是"第十二(twelfth)"，
    <tspan x="50" dy="25">象征着顺序和比例。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This is the twelfth slice of the cake.
  </text>
  <text x="50" y="310" class="content">
    这是蛋糕的第十二块。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <circle cx="150" cy="100" r="80" class="image" />
    <!-- Slices -->
    <line x1="150" y1="100" x2="230" y2="20" class="image" />
    <line x1="150" y1="100" x2="230" y2="180" class="image" />
    <line x1="150" y1="100" x2="70" y2="20" class="image" />
    <line x1="150" y1="100" x2="70" y2="180" class="image" />
    <line x1="150" y1="100" x2="230" y2="100" class="image" />
    <line x1="150" y1="100" x2="70" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="20" class="image" />
    <line x1="150" y1="100" x2="150" y2="180" class="image" />
    <line x1="150" y1="100" x2="200" y2="60" class="image" />
    <line x1="150" y1="100" x2="100" y2="60" class="image" />
    <line x1="150" y1="100" x2="200" y2="140" class="image" />
    <line x1="150" y1="100" x2="100" y2="140" class="image" />
    <!-- Twelfth slice -->
    <rect x="150" y="20" width="80" height="80" class="image" />
  </g>
</svg>