<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blouse</text>
  <text x="50" y="120" class="subtitle">[blaʊz] n. 女式宽松短衫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自法语“blouse”，意为宽松的上衣
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位女士穿着一件宽松的“blouse”，
    <tspan x="50" dy="25">衣服随风飘动，仿佛在跳舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a floral blouse to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件花卉图案的宽松短衫去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Blouse -->
    <rect x="0" y="0" width="200" height="250" class="image" />
    <!-- Sleeves -->
    <rect x="20" y="50" width="160" height="100" class="image" />
    <rect x="20" y="150" width="160" height="100" class="image" />
    <!-- Neckline -->
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <!-- Hem -->
    <line x1="20" y1="250" x2="180" y2="250" class="image" />
    <!-- Wind effect -->
    <line x1="20" y1="250" x2="0" y2="270" class="image" />
    <line x1="180" y1="250" x2="200" y2="270" class="image" />
  </g>
</svg>