<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">attorney</text>
  <text x="50" y="120" class="subtitle">[əˈtɜːrni] n. 律师，代理人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> at- (朝向) + torn (转) + -ey (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个律师在法庭上，"朝向(at-)"
    <tspan x="50" dy="25">法官转(torn)身，代表(ey)客户辩护。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The attorney presented a strong case in court.
  </text>
  <text x="50" y="310" class="content">
    律师在法庭上提出了一个强有力的案件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Attorney -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Judge -->
    <circle cx="100" cy="45" r="15" class="image" />
    <line x1="100" y1="60" x2="100" y2="90" class="image" />
    <line x1="100" y1="90" x2="80" y2="120" class="image" />
    <line x1="100" y1="90" x2="120" y2="120" class="image" />
    <line x1="100" y1="70" x2="150" y2="60" class="image" />
  </g>
</svg>