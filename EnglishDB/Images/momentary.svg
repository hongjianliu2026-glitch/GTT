<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">momentary</text>
  <text x="50" y="120" class="subtitle">[ˈmoʊməntəri] adj. 瞬间的，短暂的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> moment (瞬间) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟的指针突然"瞬间(moment)"停住，
    <tspan x="50" dy="25">然后又迅速恢复，这个瞬间的停顿就是momentary。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The momentary pause in the conversation was awkward.
  </text>
  <text x="50" y="310" class="content">
    对话中的短暂停顿让人感到尴尬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Pause symbol -->
    <rect x="150" y="80" width="10" height="40" class="image" />
    <rect x="190" y="80" width="10" height="40" class="image" />
  </g>
</svg>