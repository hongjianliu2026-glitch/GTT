<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surround</text>
  <text x="50" y="120" class="subtitle">[səˈraʊnd] v. 包围，环绕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (在上面) + round (圆)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆圈"在上面环绕(sur-round)"
    <tspan x="50" dy="25">着一个小小的物体，仿佛在保护它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The castle was surrounded by a moat.
  </text>
  <text x="50" y="310" class="content">
    城堡被护城河包围着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large circle -->
    <circle cx="200" cy="100" r="150" class="image" />
    <!-- Small object -->
    <circle cx="200" cy="100" r="20" class="image" fill="#E74C3C" />
    <!-- Arrows -->
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <line x1="350" y1="100" x2="330" y2="80" class="image" />
    <line x1="350" y1="100" x2="330" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="80" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
  </g>
</svg>