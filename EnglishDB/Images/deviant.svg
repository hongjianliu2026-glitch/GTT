<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deviant</text>
  <text x="50" y="120" class="subtitle">[ˈdiːviənt] adj. 偏离的，异常的；n. 偏离正道的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + vi (道路) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走在一条笔直的道路上，突然他"离开(de-)"了道路，
    <tspan x="50" dy="25">走到了旁边的草地上，这个人就成了偏离正道的人(deviant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The deviant behavior of the student was noted by the teacher.
  </text>
  <text x="50" y="310" class="content">
    老师注意到了那个学生的异常行为。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Straight path -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Deviant path -->
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <!-- Person on straight path -->
    <circle cx="50" cy="100" r="10" class="image" />
    <!-- Person on deviant path -->
    <circle cx="150" cy="150" r="10" class="image" />
    <!-- Arrow pointing to deviant path -->
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <polygon points="150,150 145,145 155,145" class="image" />
  </g>
</svg>