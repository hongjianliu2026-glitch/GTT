<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">predominant</text>
  <text x="50" y="120" class="subtitle">[prɪˈdɒmɪnənt] adj. 主要的，占优势的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + domin (统治) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的国王站在前面，"统治(domin)"
    <tspan x="50" dy="25">着整个王国，他是"主要的(pre-dominant)"存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The predominant color in the painting is blue.
  </text>
  <text x="50" y="310" class="content">
    这幅画中主要的颜色是蓝色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- King -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="30" y2="250" class="image" />
    <line x1="50" y1="200" x2="70" y2="250" class="image" />
    <!-- Crown -->
    <polygon points="30,80 70,80 80,60 50,50 20,60" class="image" />
    <!-- Kingdom -->
    <rect x="0" y="250" width="100" height="50" class="image" />
    <line x1="10" y1="260" x2="90" y2="260" class="image" />
    <line x1="10" y1="270" x2="90" y2="270" class="image" />
    <line x1="10" y1="280" x2="90" y2="280" class="image" />
    <line x1="10" y1="290" x2="90" y2="290" class="image" />
  </g>
</svg>