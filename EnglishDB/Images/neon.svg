<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #FF6347; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .neon { fill: #FFD700; stroke: #FF6347; stroke-width: 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neon</text>
  <text x="50" y="120" class="subtitle">[ˈniːɒn] n. 氖；霓虹灯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neo- (新) + -on (表示元素)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个全新的(neo-)元素，它发出的光如此明亮，
    <tspan x="50" dy="25">以至于整个城市都被它的光芒照亮，这就是氖(neon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sign was made with neon lights.
  </text>
  <text x="50" y="310" class="content">
    这个标志是用霓虹灯制作的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Neon light -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="neon" />
    <line x1="50" y1="80" x2="300" y2="80" class="neon" />
    <line x1="50" y1="110" x2="300" y2="110" class="neon" />
    <line x1="50" y1="140" x2="300" y2="140" class="neon" />
    <!-- City skyline -->
    <rect x="100" y="160" width="50" height="40" class="image" />
    <rect x="170" y="140" width="50" height="60" class="image" />
    <rect x="240" y="150" width="50" height="50" class="image" />
  </g>
</svg>