<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mower</text>
  <text x="50" y="120" class="subtitle">[ˈmaʊər] n. 割草机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mow (割草) + -er (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的割草机(mower)在草地上"割草(mow)"，
    <tspan x="50" dy="25">草屑飞溅，场面壮观，让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a mower to cut the lawn.
  </text>
  <text x="50" y="310" class="content">
    他用割草机修剪草坪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lawn -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#7BC86C" />
    <!-- Mower -->
    <rect x="150" y="50" width="100" height="50" class="image" fill="#D35400" />
    <rect x="170" y="30" width="60" height="20" class="image" fill="#F39C12" />
    <!-- Grass clippings -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" stroke-dasharray="5,5" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" stroke-dasharray="5,5" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" stroke-dasharray="5,5" />
  </g>
</svg>