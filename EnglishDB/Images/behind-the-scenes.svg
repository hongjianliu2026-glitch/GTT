<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">behind-the-scenes</text>
  <text x="50" y="120" class="subtitle">[bɪˈhaɪnd ðə ˈsiːnz] adj. 幕后的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> behind (在...后面) + scenes (场景)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个电影拍摄现场，观众只能看到前台的演员，
    <tspan x="50" dy="25">而"在场景后面(behind-the-scenes)"，</tspan>
    <tspan x="50" dy="25">有一群工作人员在默默工作，这就是幕后的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The documentary revealed the behind-the-scenes work of the film crew.
  </text>
  <text x="50" y="310" class="content">
    这部纪录片揭示了电影摄制组幕后的工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Curtain -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Actor -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Behind the scenes -->
    <line x1="20" y1="20" x2="20" y2="180" class="image" />
    <line x1="20" y1="20" x2="40" y2="20" class="image" />
    <line x1="20" y1="180" x2="40" y2="180" class="image" />
    <line x1="40" y1="20" x2="40" y2="180" class="image" />
    <circle cx="30" cy="100" r="10" class="image" />
    <line x1="30" y1="110" x2="30" y2="130" class="image" />
    <line x1="30" y1="130" x2="20" y2="150" class="image" />
    <line x1="30" y1="130" x2="40" y2="150" class="image" />
  </g>
</svg>