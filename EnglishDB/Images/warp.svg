<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">warp</text>
  <text x="50" y="120" class="subtitle">[wɔrp] v. 弯曲，变形；n. 弯曲，变形</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> war- (弯曲) + p (加强)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块木板被"弯曲(war-)"得非常厉害，以至于它"变形(p)"了，这就是warp的画面。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wood warped due to excessive moisture.
  </text>
  <text x="50" y="310" class="content">
    木材因过度潮湿而变形。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Warped wood -->
    <path d="M0 100 Q100 50 200 100 T400 100" class="image" />
    <path d="M0 150 Q100 200 200 150 T400 150" class="image" />
    <path d="M0 200 Q100 250 200 200 T400 200" class="image" />
    <!-- Warped wood ends -->
    <line x1="0" y1="100" x2="0" y2="200" class="image" />
    <line x1="400" y1="100" x2="400" y2="200" class="image" />
  </g>
</svg>