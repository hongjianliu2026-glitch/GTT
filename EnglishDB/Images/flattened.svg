<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flattened</text>
  <text x="50" y="120" class="subtitle">[ˈflætənd] adj. 被压平的，扁平的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flat (平的) + -en (使) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球被"压平(flat-en-ed)"，
    <tspan x="50" dy="25">变成了一个扁平的形状，这就是flattened的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The balloon was flattened by the heavy book.
  </text>
  <text x="50" y="310" class="content">
    气球被厚重的书压扁了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flattened balloon -->
    <ellipse cx="175" cy="100" rx="150" ry="30" class="image" />
    <!-- Heavy book -->
    <rect x="50" y="130" width="250" height="50" class="image" />
    <!-- Text annotations -->
    <text x="175" y="90" class="content" text-anchor="middle">Flattened Balloon</text>
    <text x="175" y="190" class="content" text-anchor="middle">Heavy Book</text>
  </g>
</svg>