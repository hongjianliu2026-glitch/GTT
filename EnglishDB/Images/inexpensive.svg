<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inexpensive</text>
  <text x="50" y="120" class="subtitle">[ˌɪnɪkˈspɛnsɪv] adj. 便宜的，不贵的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + ex- (出) + pens (花费) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商店里，"不花费(in-ex-pens-ive)"
    <tspan x="50" dy="25">很多钱就能买到的东西，这些就是便宜的(inexpensive)商品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought an inexpensive dress for the party.
  </text>
  <text x="50" y="310" class="content">
    她为派对买了一件便宜的裙子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Storefront -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dress on a hanger -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <rect x="40" y="20" width="20" height="160" class="image" />
    <rect x="60" y="20" width="200" height="160" class="image" />
    <!-- Price tag -->
    <rect x="270" y="20" width="60" height="30" class="image" />
    <text x="280" y="40" class="content">$10</text>
  </g>
</svg>