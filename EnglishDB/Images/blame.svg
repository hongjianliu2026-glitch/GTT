<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blame</text>
  <text x="50" y="120" class="subtitle">[bleɪm] v. 责备，归咎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blam (伤害)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为犯错而被"伤害(blam)"，
    <tspan x="50" dy="25">其他人纷纷指责他，这就是"责备(blame)"的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager blamed the employee for the mistake.
  </text>
  <text x="50" y="310" class="content">
    经理为这个错误责备了员工。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person being blamed -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />

    <!-- Speech bubbles -->
    <path d="M 120 80 Q 180 80 200 100 Q 180 120 120 120 Z" class="image" />
    <text x="130" y="105" class="content">Why?</text>
    <path d="M 250 60 Q 310 60 330 80 Q 310 100 250 100 Z" class="image" />
    <text x="260" y="85" class="content">It's your fault!</text>
  </g>
</svg>