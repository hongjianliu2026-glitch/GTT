<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #E67E22; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">taco</text>
  <text x="50" y="120" class="subtitle">[ˈtɑːkoʊ] n. 墨西哥玉米卷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自墨西哥西班牙语，原意为“包裹”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的玉米饼，里面包裹着各种美味的食材，
    <tspan x="50" dy="25">就像一个“包裹(taco)”，让人垂涎欲滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat tacos for lunch.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃墨西哥玉米卷当午餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Taco shell -->
    <path d="M50 50 Q100 20 150 50 L150 150 Q100 180 50 150 Z" class="image" fill="#FFD700" />
    <!-- Filling -->
    <circle cx="100" cy="100" r="20" fill="#8B4513" />
    <circle cx="80" cy="120" r="15" fill="#8B4513" />
    <circle cx="120" cy="120" r="15" fill="#8B4513" />
    <circle cx="100" cy="140" r="15" fill="#8B4513" />
  </g>
</svg>