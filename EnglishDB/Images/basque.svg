<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Basque</text>
  <text x="50" y="120" class="subtitle">[bæsk] n. 巴斯克人，巴斯克语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Basque (源自巴斯克地区)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巴斯克人站在山丘上，"巴斯克(Basque)"
    <tspan x="50" dy="25">地区独特的文化和语言，就像山丘一样屹立不倒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Basque language is unique and not related to any other language.
  </text>
  <text x="50" y="310" class="content">
    巴斯克语是独一无二的，与其他任何语言都不相关。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hill -->
    <path d="M0,200 L350,200 Q375,100 400,200 Z" class="image" />
    <!-- Person -->
    <circle cx="200" cy="150" r="15" class="image" />
    <line x1="200" y1="165" x2="200" y2="190" class="image" />
    <line x1="200" y1="190" x2="180" y2="220" class="image" />
    <line x1="200" y1="190" x2="220" y2="220" class="image" />
    <line x1="200" y1="175" x2="230" y2="165" class="image" />
  </g>
</svg>