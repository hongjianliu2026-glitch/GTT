<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recall</text>
  <text x="50" y="120" class="subtitle">[rɪˈkɔːl] v. 回忆，召回</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + call (叫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人闭上眼睛，"回叫(re-call)"
    <tspan x="50" dy="25">过去的记忆，这些记忆就像被召回一样(recall)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She could recall the details of the event vividly.
  </text>
  <text x="50" y="310" class="content">
    她能生动地回忆起那次事件的细节。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head with closed eyes -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
    <!-- Memory bubbles -->
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="70" r="20" class="image" />
    <circle cx="300" cy="90" r="20" class="image" />
    <!-- Arrows pointing to head -->
    <line x1="200" y1="70" x2="120" y2="100" class="image" />
    <line x1="250" y1="90" x2="120" y2="100" class="image" />
    <line x1="300" y1="110" x2="120" y2="100" class="image" />
    <polygon points="200,70 220,60 220,80" class="image" />
    <polygon points="250,90 270,80 270,100" class="image" />
    <polygon points="300,110 320,100 320,120" class="image" />
  </g>
</svg>