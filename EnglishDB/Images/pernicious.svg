<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pernicious</text>
  <text x="50" y="120" class="subtitle">[pərˈnɪʃəs] adj. 有害的，恶性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + nic (毒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完全有毒(per-nic)的蘑菇，它不仅有毒，
    <tspan x="50" dy="25">而且毒性极强，足以致命。这就是"pernicious"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pernicious effects of smoking are well-known.
  </text>
  <text x="50" y="310" class="content">
    吸烟的有害影响是众所周知的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Poisonous mushroom -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="170" x2="70" y2="160" class="image" />
    <line x1="100" y1="170" x2="130" y2="160" class="image" />
    <line x1="100" y1="170" x2="80" y2="190" class="image" />
    <line x1="100" y1="170" x2="120" y2="190" class="image" />
    <!-- Poison symbol -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
  </g>
</svg>