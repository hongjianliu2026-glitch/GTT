<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">long</text>
  <text x="50" y="120" class="subtitle">[lɔŋ] adj. 长的，长时间的；adv. 长期地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> long (长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条"长(long)"蛇，它蜿蜒曲折，
    <tspan x="50" dy="25">一直延伸到看不见的远方，这就是"长(long)"的直观感受。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The river is very long.
  </text>
  <text x="50" y="310" class="content">
    这条河非常长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Long snake -->
    <path d="M0,0 C50,50 100,0 150,50 S200,0 250,50 S300,0 350,50 S400,0 450,50 S500,0 550,50 S600,0 650,50 S700,0 750,50" class="image" />
    <!-- Snake head -->
    <circle cx="750" cy="50" r="20" class="image" />
    <!-- Snake eyes -->
    <circle cx="740" cy="40" r="5" class="image" />
    <circle cx="760" cy="40" r="5" class="image" />
  </g>
</svg>