<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seduction</text>
  <text x="50" y="120" class="subtitle">[sɪˈdʌkʃən] n. 诱惑，引诱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (离开) + duct (引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的诱惑者，用甜言蜜语"引导(duct)"
    <tspan x="50" dy="25">你离开(se-)正轨，陷入诱惑(seduction)的陷阱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The seduction of wealth led him astray.
  </text>
  <text x="50" y="310" class="content">
    财富的诱惑使他误入歧途。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seductive figure -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <!-- Arrow pointing away -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
    <!-- Trap -->
    <rect x="220" y="80" width="60" height="40" class="image" />
    <line x1="220" y1="80" x2="280" y2="80" class="image" />
    <line x1="220" y1="120" x2="280" y2="120" class="image" />
    <line x1="220" y1="80" x2="220" y2="120" class="image" />
    <line x1="280" y1="80" x2="280" y2="120" class="image" />
  </g>
</svg>