<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">upriver</text>
  <text x="50" y="120" class="subtitle">[ˈʌpˈrɪvər] adv. 向上游</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + river (河流)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，水流从下游流向上游，
    <tspan x="50" dy="25">一个人逆流而上，这就是"向上游(upriver)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to travel upriver to explore the untouched wilderness.
  </text>
  <text x="50" y="310" class="content">
    他们决定向上游旅行，探索未被触及的荒野。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <!-- Upstream arrow -->
    <polygon points="175,50 150,100 200,100" class="image" />
    <!-- Person -->
    <circle cx="175" cy="120" r="15" class="image" />
    <line x1="175" y1="135" x2="175" y2="170" class="image" />
    <line x1="175" y1="170" x2="160" y2="200" class="image" />
    <line x1="175" y1="170" x2="190" y2="200" class="image" />
    <line x1="175" y1="150" x2="200" y2="140" class="image" />
  </g>
</svg>