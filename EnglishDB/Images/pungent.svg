<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pungent</text>
  <text x="50" y="120" class="subtitle">[ˈpʌndʒənt] adj. 辛辣的，刺激性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pung (刺) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的辣椒，"刺(pung)"得你眼泪直流，
    <tspan x="50" dy="25">这种强烈的刺激感就是pungent。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pungent smell of garlic filled the kitchen.
  </text>
  <text x="50" y="310" class="content">
    厨房里充满了大蒜的辛辣气味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large chili pepper -->
    <path d="M 0 0 L 100 0 L 150 100 L 100 200 L 0 200 Z" class="image" fill="#FF6347" />
    <!-- Tears -->
    <circle cx="50" cy="220" r="15" class="image" fill="#3498DB" />
    <circle cx="120" cy="220" r="15" class="image" fill="#3498DB" />
    <!-- Face -->
    <circle cx="75" cy="150" r="30" class="image" fill="#F1C40F" />
    <circle cx="60" cy="140" r="5" class="image" fill="#000" />
    <circle cx="90" cy="140" r="5" class="image" fill="#000" />
    <path d="M 60 170 Q 75 180 90 170" class="image" fill="none" stroke="#000" stroke-width="2" />
  </g>
</svg>