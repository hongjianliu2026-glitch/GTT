<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">branch</text>
  <text x="50" y="120" class="subtitle">[bræntʃ] n. 分支，树枝；v. 分叉，分支</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> branchi- (分支)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树，树干上长出许多"分支(branch)"，
    <tspan x="50" dy="25">每个分支都像一条小路，通向不同的方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The river branches into several smaller streams.
  </text>
  <text x="50" y="310" class="content">
    这条河分成了几条小溪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree trunk -->
    <rect x="150" y="0" width="20" height="200" class="image" />
    <!-- Branches -->
    <line x1="160" y1="50" x2="250" y2="100" class="image" />
    <line x1="160" y1="100" x2="250" y2="150" class="image" />
    <line x1="160" y1="150" x2="250" y2="200" class="image" />
    <line x1="160" y1="50" x2="70" y2="100" class="image" />
    <line x1="160" y1="100" x2="70" y2="150" class="image" />
    <line x1="160" y1="150" x2="70" y2="200" class="image" />
  </g>
</svg>