<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">robotic</text>
  <text x="50" y="120" class="subtitle">[roʊˈbɒtɪk] adj. 机器人的，像机器人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> robot (机器人) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机器人(robot)在工厂里，"机械地(robotic)"
    <tspan x="50" dy="25">执行任务，动作僵硬而精确，就像一个机器人一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The assembly line workers moved in a robotic manner.
  </text>
  <text x="50" y="310" class="content">
    装配线上的工人以机械的方式移动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot body -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Robot head -->
    <circle cx="75" cy="50" r="30" class="image" />
    <!-- Robot arms -->
    <line x1="20" y1="100" x2="0" y2="150" class="image" />
    <line x1="130" y1="100" x2="150" y2="150" class="image" />
    <!-- Robot legs -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" />
    <line x1="100" y1="200" x2="120" y2="250" class="image" />
    <!-- Robot eyes -->
    <circle cx="60" cy="50" r="5" class="image" fill="#2C3E50" />
    <circle cx="90" cy="50" r="5" class="image" fill="#2C3E50" />
  </g>
</svg>