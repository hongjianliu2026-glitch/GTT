<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sport</text>
  <text x="50" y="120" class="subtitle">[spɔrt] n. 运动，娱乐；v. 炫耀，嬉戏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sporo- (种子) + -t (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗种子(sporo-)在阳光下"发芽(t)"，
    <tspan x="50" dy="25">成长为一棵大树，人们在树下进行各种运动(sport)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He loves to play different sports in his free time.
  </text>
  <text x="50" y="310" class="content">
    他喜欢在闲暇时玩各种运动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seed -->
    <circle cx="50" cy="100" r="15" class="image" />
    <!-- Tree -->
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="130" x2="30" y2="120" class="image" />
    <line x1="50" y1="130" x2="70" y2="120" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <!-- People playing sports -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
  </g>
</svg>