<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coast</text>
  <text x="50" y="120" class="subtitle">[koʊst] n. 海岸，海滨；v. 滑行，沿岸航行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + ast (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群海鸥在"共同行走(co-ast)"
    <tspan x="50" dy="25">在海岸线上，它们滑翔着，享受着海风的吹拂。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We spent the day walking along the coast.
  </text>
  <text x="50" y="310" class="content">
    我们一整天都在沿着海岸散步。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coastline -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Sea -->
    <rect x="0" y="100" width="350" height="100" fill="#3498DB" />
    <!-- Sea waves -->
    <line x1="50" y1="100" x2="70" y2="90" class="image" />
    <line x1="100" y1="100" x2="120" y2="95" class="image" />
    <line x1="150" y1="100" x2="170" y2="85" class="image" />
    <line x1="200" y1="100" x2="220" y2="90" class="image" />
    <line x1="250" y1="100" x2="270" y2="95" class="image" />
    <line x1="300" y1="100" x2="320" y2="85" class="image" />
    <!-- Seagulls -->
    <circle cx="100" cy="50" r="10" fill="#7F8C8D" />
    <circle cx="150" cy="40" r="10" fill="#7F8C8D" />
    <circle cx="200" cy="60" r="10" fill="#7F8C8D" />
    <circle cx="250" cy="50" r="10" fill="#7F8C8D" />
    <circle cx="300" cy="40" r="10" fill="#7F8C8D" />
  </g>
</svg>