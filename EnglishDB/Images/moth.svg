<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">moth</text>
  <text x="50" y="120" class="subtitle">[mɒθ] n. 蛾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> moth (源自古英语，意为“蛾”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蛾子在夜晚飞舞，"moth"
    <tspan x="50" dy="25">这个词直接来源于古英语，形象地描述了这种夜间活动的昆虫。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The moth was attracted to the light.
  </text>
  <text x="50" y="310" class="content">
    这只蛾子被灯光吸引了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moth body -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Moth wings -->
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
    <!-- Moth antennae -->
    <line x1="90" y1="70" x2="70" y2="50" class="image" />
    <line x1="110" y1="70" x2="130" y2="50" class="image" />
    <!-- Moth legs -->
    <line x1="90" y1="130" x2="70" y2="150" class="image" />
    <line x1="110" y1="130" x2="130" y2="150" class="image" />
  </g>
</svg>