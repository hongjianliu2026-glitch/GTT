<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">changed</text>
  <text x="50" y="120" class="subtitle">[tʃeɪndʒd] adj. 改变的，变化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> change (改变) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"改变(change)"了自己的发型，
    <tspan x="50" dy="25">镜子里的他变成了一个全新的自己，这就是"改变的(changed)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the makeover, she looked completely changed.
  </text>
  <text x="50" y="310" class="content">
    经过改造后，她看起来完全变了样。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person before change -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Person after change -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="300" y2="120" class="image" />
    <!-- Hair change -->
    <line x1="100" y1="90" x2="120" y2="90" class="image" />
    <line x1="250" y1="90" x2="270" y2="90" class="image" />
  </g>
</svg>