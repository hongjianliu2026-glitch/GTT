<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spite</text>
  <text x="50" y="120" class="subtitle">[spaɪt] n. 恶意，怨恨；v. 刁难，使恼怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sp- (分开) + ite (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为怨恨而"分开走(sp-ite)"，
    <tspan x="50" dy="25">故意做出伤害他人的行为，这就是spite。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She did it out of spite, not because she wanted to help.
  </text>
  <text x="50" y="310" class="content">
    她这么做是出于恶意，而不是想帮忙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking away -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="140" y2="40" class="image" />
    <line x1="150" y1="50" x2="140" y2="60" class="image" />
    <line x1="50" y1="50" x2="40" y2="40" class="image" />
    <line x1="50" y1="50" x2="40" y2="60" class="image" />
    <!-- Angry face -->
    <circle cx="100" cy="30" r="20" class="image" />
    <line x1="90" y1="25" x2="110" y2="25" class="image" />
    <line x1="95" y1="35" x2="105" y2="35" class="image" />
    <line x1="100" y1="40" x2="100" y2="45" class="image" />
    <!-- Arrow pointing to spiteful action -->
    <line x1="200" y1="50" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="240" y2="40" class="image" />
    <line x1="250" y1="50" x2="240" y2="60" class="image" />
    <!-- Spiteful action -->
    <rect x="260" y="30" width="30" height="40" class="image" />
    <line x1="275" y1="30" x2="275" y2="70" class="image" />
    <line x1="260" y1="50" x2="300" y2="50" class="image" />
  </g>
</svg>