<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consumer</text>
  <text x="50" y="120" class="subtitle">[kənˈsuːmər] n. 消费者，用户</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + sum (拿) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"一起拿(con-sum)"商品，
    <tspan x="50" dy="25">他们就是消费者(consumer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The consumer market is growing rapidly.
  </text>
  <text x="50" y="310" class="content">
    消费市场正在迅速增长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shopping cart -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Items in the cart -->
    <circle cx="70" cy="50" r="15" class="image" />
    <rect x="100" y="40" width="30" height="30" class="image" />
    <rect x="150" y="40" width="30" height="30" class="image" />
    <rect x="200" y="40" width="30" height="30" class="image" />
    <rect x="250" y="40" width="30" height="30" class="image" />
    <!-- People -->
    <circle cx="70" cy="120" r="15" class="image" />
    <line x1="70" y1="135" x2="70" y2="170" class="image" />
    <line x1="70" y1="170" x2="50" y2="200" class="image" />
    <line x1="70" y1="170" x2="90" y2="200" class="image" />
    <line x1="70" y1="150" x2="100" y2="140" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <line x1="150" y1="135" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <line x1="150" y1="150" x2="180" y2="140" class="image" />
  </g>
</svg>