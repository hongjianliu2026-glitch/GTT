<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scathing</text>
  <text x="50" y="120" class="subtitle">[ˈskeɪðɪŋ] adj. 尖刻的，严厉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scath (伤害) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用尖锐的言辞"伤害(scath)"别人，
    <tspan x="50" dy="25">这些言辞就像锋利的刀刃，深深刺入对方的心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The critic's scathing remarks left the artist in tears.
  </text>
  <text x="50" y="310" class="content">
    评论家的尖刻评论让艺术家泪流满面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sharp words -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Person being hurt -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="200" class="image" />
    <line x1="200" y1="150" x2="150" y2="180" class="image" />
    <line x1="200" y1="150" x2="250" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Tears -->
    <circle cx="180" cy="220" r="10" class="image" />
    <circle cx="220" cy="220" r="10" class="image" />
  </g>
</svg>