<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contradiction</text>
  <text x="50" y="120" class="subtitle">[ˌkɒntrəˈdɪkʃn] n. 矛盾，不一致</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> contra- (相反) + dict (说) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，一个人说"是"，另一个人说"不"，
    <tspan x="50" dy="25">这种"相反的说(contra-dict)"就构成了矛盾(contradiction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His actions are in direct contradiction to his words.
  </text>
  <text x="50" y="310" class="content">
    他的行为与他的言辞直接矛盾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="50" y1="160" x2="0" y2="200" class="image" />
    <line x1="50" y1="160" x2="100" y2="200" class="image" />
    <line x1="250" y1="160" x2="200" y2="200" class="image" />
    <line x1="250" y1="160" x2="300" y2="200" class="image" />
    <line x1="50" y1="140" x2="100" y2="130" class="image" />
    <line x1="250" y1="140" x2="200" y2="130" class="image" />
    <!-- Speech bubbles -->
    <path d="M50 80 Q0 80 0 50 Q0 20 50 20 Q100 20 100 50 Q100 80 50 80" class="image" />
    <path d="M250 80 Q300 80 300 50 Q300 20 250 20 Q200 20 200 50 Q200 80 250 80" class="image" />
    <!-- Text in speech bubbles -->
    <text x="70" y="60" class="content">Yes</text>
    <text x="270" y="60" class="content">No</text>
  </g>
</svg>