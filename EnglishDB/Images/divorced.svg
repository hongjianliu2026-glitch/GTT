<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">divorced</text>
  <text x="50" y="120" class="subtitle">[dɪˈvɔːrst] adj. 离婚的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + vorce (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一对夫妻被"分开(di-)"，各自"离开(vorce)"，
    <tspan x="50" dy="25">最终走向离婚(divorced)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a divorced woman with two children.
  </text>
  <text x="50" y="310" class="content">
    她是一个有两个孩子的离婚女人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people walking away -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="0" y1="0" x2="-100" y2="100" class="image" />
    <!-- Person 1 -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <!-- Person 2 -->
    <circle cx="-100" cy="100" r="15" class="image" />
    <line x1="-100" y1="115" x2="-100" y2="150" class="image" />
    <line x1="-100" y1="150" x2="-120" y2="180" class="image" />
    <line x1="-100" y1="150" x2="-80" y2="180" class="image" />
    <!-- Dividing line -->
    <line x1="-50" y1="200" x2="50" y2="200" class="image" />
  </g>
</svg>