<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">priestess</text>
  <text x="50" y="120" class="subtitle">[ˈpriːstɪs] n. 女祭司</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> priest (祭司) + -ess (女性)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位庄严的女祭司(priestess)，她手持神圣的权杖，
    <tspan x="50" dy="25">站在神庙前，向天空祈祷，她的身影在阳光下显得格外神圣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The priestess led the ritual in the ancient temple.
  </text>
  <text x="50" y="310" class="content">
    女祭司在古老的寺庙中主持了仪式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Priestess -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="30" y2="250" class="image" />
    <line x1="50" y1="200" x2="70" y2="250" class="image" />
    <!-- Staff -->
    <line x1="50" y1="130" x2="50" y2="50" class="image" />
    <circle cx="50" cy="40" r="10" class="image" />
    <!-- Temple -->
    <rect x="0" y="250" width="100" height="50" class="image" />
    <line x1="20" y1="250" x2="20" y2="200" class="image" />
    <line x1="80" y1="250" x2="80" y2="200" class="image" />
  </g>
</svg>