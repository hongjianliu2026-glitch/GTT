<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">residue</text>
  <text x="50" y="120" class="subtitle">[ˈrɛzɪˌdjuː] n. 残余物，剩余物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + sid (坐) + -ue (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"坐回(re-sid)"
    <tspan x="50" dy="25">去观察实验后留下的残余物(residue)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The residue from the chemical reaction was carefully analyzed.
  </text>
  <text x="50" y="310" class="content">
    化学反应后的残余物被仔细分析。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Lab table -->
    <rect x="50" y="20" width="300" height="160" class="image" />
    <!-- Beaker with residue -->
    <rect x="100" y="50" width="50" height="100" class="image" />
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <rect x="110" y="130" width="30" height="20" class="image" fill="#D35400" />
  </g>
</svg>