<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">head-to-head</text>
  <text x="50" y="120" class="subtitle">[ˌhed tə ˈhed] adv. 面对面地，直接对抗地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> head (头) + to (到) + head (头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面站着，他们的头几乎碰在一起，
    <tspan x="50" dy="25">这种直接对抗的场景就是"head-to-head"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two teams competed head-to-head in the final match.
  </text>
  <text x="50" y="310" class="content">
    两支队伍在决赛中直接对抗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- First head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Second head -->
    <circle cx="300" cy="100" r="50" class="image" />
    <!-- Connecting line -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <!-- Arrows -->
    <line x1="150" y1="100" x2="140" y2="90" class="image" />
    <line x1="150" y1="100" x2="140" y2="110" class="image" />
    <line x1="250" y1="100" x2="260" y2="90" class="image" />
    <line x1="250" y1="100" x2="260" y2="110" class="image" />
  </g>
</svg>