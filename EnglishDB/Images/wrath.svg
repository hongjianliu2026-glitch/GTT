<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrath</text>
  <text x="50" y="120" class="subtitle">[rɔːθ] n. 愤怒，狂怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wr- (扭曲) + ath (情感)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为极度愤怒而"扭曲(wr-)"了脸，
    <tspan x="50" dy="25">这种强烈的情感就是"狂怒(wrath)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His wrath was evident in his clenched fists.
  </text>
  <text x="50" y="310" class="content">
    他紧握的拳头显露出他的愤怒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
    <path d="M70 140 Q100 180 130 140" class="image" />
  </g>
</svg>