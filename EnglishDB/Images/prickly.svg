<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .spike { fill: #A52A2A; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prickly</text>
  <text x="50" y="120" class="subtitle">[ˈprɪkli] adj. 多刺的，易怒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prick (刺) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个仙人掌，浑身都是刺(prick)，
    <tspan x="50" dy="25">就像一个易怒的人，随时可能刺伤你。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cactus was prickly and difficult to touch.
  </text>
  <text x="50" y="310" class="content">
    仙人掌多刺，难以触摸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cactus body -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Spikes -->
    <polygon points="50,20 100,20 75,50" class="spike" />
    <polygon points="50,50 100,50 75,80" class="spike" />
    <polygon points="50,80 100,80 75,110" class="spike" />
    <polygon points="50,110 100,110 75,140" class="spike" />
    <polygon points="50,140 100,140 75,170" class="spike" />
  </g>
</svg>