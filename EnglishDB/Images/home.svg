<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">home</text>
  <text x="50" y="120" class="subtitle">[hoʊm] n. 家，住宅；ad. 在家，回家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> homo- (人) + -e (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的旅人，"回到(homo-e)"
    <tspan x="50" dy="25">温暖的家中，那里是他心灵的归宿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt a sense of peace when she arrived home.
  </text>
  <text x="50" y="310" class="content">
    她到家时感到一种平静。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,100 200,0 350,100" class="image" />
    <rect x="100" y="100" width="150" height="100" class="image" />
    <!-- Door -->
    <rect x="160" y="150" width="30" height="50" class="image" />
    <!-- Window -->
    <rect x="120" y="120" width="40" height="40" class="image" />
    <rect x="240" y="120" width="40" height="40" class="image" />
    <!-- Path -->
    <line x1="175" y1="200" x2="175" y2="250" class="image" />
    <!-- Person -->
    <circle cx="175" cy="270" r="15" class="image" />
    <line x1="175" y1="285" x2="175" y2="320" class="image" />
    <line x1="175" y1="320" x2="155" y2="350" class="image" />
    <line x1="175" y1="320" x2="195" y2="350" class="image" />
    <line x1="175" y1="300" x2="205" y2="290" class="image" />
  </g>
</svg>