<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dripping</text>
  <text x="50" y="120" class="subtitle">[ˈdrɪpɪŋ] adj. 滴水的，湿淋淋的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drip (滴) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冰淇淋球在炎热的夏天，"滴(drip)"
    <tspan x="50" dy="25">下的水珠，整个冰淇淋都变得湿淋淋的(dripping)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ice cream was dripping from the cone.
  </text>
  <text x="50" y="310" class="content">
    冰淇淋从蛋筒上滴下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice cream cone -->
    <polygon points="50,20 90,20 70,180" class="image" />
    <!-- Ice cream ball -->
    <circle cx="70" cy="10" r="20" class="image" />
    <!-- Dripping water -->
    <line x1="70" y1="30" x2="70" y2="60" class="image" />
    <line x1="70" y1="60" x2="60" y2="90" class="image" />
    <line x1="70" y1="60" x2="80" y2="90" class="image" />
    <line x1="70" y1="90" x2="70" y2="120" class="image" />
    <line x1="70" y1="120" x2="60" y2="150" class="image" />
    <line x1="70" y1="120" x2="80" y2="150" class="image" />
  </g>
</svg>