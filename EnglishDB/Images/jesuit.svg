<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Jesuit</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɛzəˌwɪt] n. 耶稣会士</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Jesu- (耶稣) + -it (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着黑色长袍的耶稣会士，手持十字架，
    <tspan x="50" dy="25">象征着他对耶稣的忠诚和奉献。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Jesuit priest was known for his charitable work.
  </text>
  <text x="50" y="310" class="content">
    这位耶稣会神父以其慈善工作而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Priest's robe -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Cross -->
    <line x1="75" y1="50" x2="75" y2="150" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <!-- Priest's head -->
    <circle cx="75" cy="30" r="20" class="image" />
    <!-- Priest's hands -->
    <line x1="75" y1="50" x2="50" y2="70" class="image" />
    <line x1="75" y1="50" x2="100" y2="70" class="image" />
  </g>
</svg>