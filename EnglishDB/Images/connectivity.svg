<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">connectivity</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnɛkˈtɪvɪti] n. 连通性，连接性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + nect (连接) + -ivity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个网络世界，"共同连接(con-nect)"
    <tspan x="50" dy="25">在一起的节点，形成了一个无缝的连通性(connectivity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new router improved the connectivity of our home network.
  </text>
  <text x="50" y="310" class="content">
    新路由器改善了我们家庭网络的连通性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Network nodes -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <!-- Connections -->
    <line x1="70" y1="70" x2="130" y2="70" class="image" />
    <line x1="100" y1="70" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="70" y2="70" class="image" />
    <line x1="100" y1="130" x2="130" y2="70" class="image" />
  </g>
</svg>