<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">memoir</text>
  <text x="50" y="120" class="subtitle">[ˈmemwɑːr] n. 回忆录，自传</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mem- (记忆) + -oir (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位老人坐在摇椅上，"回忆(mem-)"
    <tspan x="50" dy="25">过去的点点滴滴，并将这些记忆写成了一本回忆录(memoir)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wrote a memoir about her childhood in the countryside.
  </text>
  <text x="50" y="310" class="content">
    她写了一本关于她在乡村童年的回忆录。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old man in a rocking chair -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <line x1="90" y1="140" x2="90" y2="180" class="image" />
    <line x1="90" y1="180" x2="70" y2="210" class="image" />
    <line x1="90" y1="180" x2="110" y2="210" class="image" />
    <!-- Book -->
    <rect x="150" y="50" width="150" height="100" class="image" />
    <line x1="150" y1="50" x2="300" y2="50" class="image" />
    <line x1="150" y1="100" x2="300" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="300" y1="50" x2="300" y2="100" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <line x1="250" y1="50" x2="250" y2="100" class="image" />
  </g>
</svg>