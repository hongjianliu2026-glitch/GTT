<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alcoholic</text>
  <text x="50" y="120" class="subtitle">[ˌælkəˈhɒlɪk] n. 酗酒者；adj. 酒精的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alcohol (酒精) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"酒精(alcohol)"瓶子旁边，
    <tspan x="50" dy="25">一个"酗酒者(alcoholic)"正在痛苦地挣扎，</tspan>
    <tspan x="50" dy="25">这个画面让人印象深刻，提醒我们远离酒精的危害。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He became an alcoholic after his wife left him.
  </text>
  <text x="50" y="310" class="content">
    妻子离开他后，他变成了一个酗酒者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="20" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="120" y2="250" class="image" />
    <line x1="150" y1="200" x2="180" y2="250" class="image" />
    <line x1="150" y1="150" x2="100" y2="140" class="image" />
    <line x1="150" y1="150" x2="200" y2="140" class="image" />
    <!-- Struggle -->
    <line x1="150" y1="200" x2="100" y2="180" class="image" />
    <line x1="150" y1="200" x2="200" y2="180" class="image" />
  </g>
</svg>