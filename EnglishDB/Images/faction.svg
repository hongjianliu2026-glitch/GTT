<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">faction</text>
  <text x="50" y="120" class="subtitle">[ˈfækʃən] n. 派系，小集团</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fact (做) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人分成几个小团体，每个团体都在"做(fact)"
    <tspan x="50" dy="25">不同的事情，这些小团体就是派系(faction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The party split into several factions after the election.
  </text>
  <text x="50" y="310" class="content">
    选举后，该党分裂成了几个派系。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group 1 -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="80" cy="50" r="20" class="image" />
    <circle cx="110" cy="50" r="20" class="image" />
    <!-- Group 2 -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="80" cy="100" r="20" class="image" />
    <circle cx="110" cy="100" r="20" class="image" />
    <!-- Group 3 -->
    <circle cx="50" cy="150" r="20" class="image" />
    <circle cx="80" cy="150" r="20" class="image" />
    <circle cx="110" cy="150" r="20" class="image" />
    <!-- Lines to show separation -->
    <line x1="150" y1="30" x2="150" y2="170" class="image" />
    <line x1="180" y1="30" x2="180" y2="170" class="image" />
    <line x1="210" y1="30" x2="210" y2="170" class="image" />
  </g>
</svg>