<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insecticide</text>
  <text x="50" y="120" class="subtitle">[ˌɪnˈsɛktɪˌsaɪd] n. 杀虫剂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> insect (昆虫) + -cide (杀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农民在田里，手持一瓶"杀虫剂(insecticide)"，
    <tspan x="50" dy="25">喷洒在庄稼上，消灭(cide)那些破坏作物的昆虫(insect)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer used insecticide to protect his crops.
  </text>
  <text x="50" y="310" class="content">
    农民使用杀虫剂来保护他的庄稼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Farmer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Insecticide bottle -->
    <rect x="50" y="80" width="30" height="100" class="image" />
    <line x1="65" y1="80" x2="65" y2="60" class="image" />
    <!-- Crops -->
    <rect x="100" y="150" width="200" height="50" class="image" />
    <line x1="120" y1="150" x2="120" y2="100" class="image" />
    <line x1="140" y1="150" x2="140" y2="100" class="image" />
    <line x1="160" y1="150" x2="160" y2="100" class="image" />
    <line x1="180" y1="150" x2="180" y2="100" class="image" />
    <line x1="200" y1="150" x2="200" y2="100" class="image" />
    <line x1="220" y1="150" x2="220" y2="100" class="image" />
    <line x1="240" y1="150" x2="240" y2="100" class="image" />
    <!-- Insects -->
    <circle cx="130" cy="120" r="5" class="image" />
    <circle cx="150" cy="120" r="5" class="image" />
    <circle cx="170" cy="120" r="5" class="image" />
    <circle cx="190" cy="120" r="5" class="image" />
  </g>
</svg>