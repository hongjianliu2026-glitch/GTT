<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humanist</text>
  <text x="50" y="120" class="subtitle">[ˈhjuːmənɪst] n. 人道主义者，人文主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> human (人) + -ist (表示人或从事某种活动的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"人(human)"站在书堆上，手里拿着一本书，
    <tspan x="50" dy="25">象征着他对人类文化和知识的追求，这就是一个"人文主义者(humanist)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a humanist who believes in the value of every individual.
  </text>
  <text x="50" y="310" class="content">
    她是一个相信每个人价值的人文主义者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Human figure -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Book stack -->
    <rect x="30" y="220" width="40" height="20" class="image" />
    <rect x="25" y="240" width="50" height="20" class="image" />
    <rect x="20" y="260" width="60" height="20" class="image" />
    <!-- Book in hand -->
    <rect x="70" y="120" width="30" height="40" class="image" />
  </g>
</svg>