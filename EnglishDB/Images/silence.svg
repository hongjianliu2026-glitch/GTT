<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">silence</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪləns] n. 沉默，寂静</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sil- (安静) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的图书馆，"安静(sil-)"
    <tspan x="50" dy="25">得连一根针掉在地上都能听到，这就是寂静(silence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The silence in the room was deafening.
  </text>
  <text x="50" y="310" class="content">
    房间里的寂静令人震耳欲聋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Library -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bookshelves -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Books -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Silence symbol -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="190" y1="90" x2="210" y2="110" class="image" />
    <line x1="190" y1="110" x2="210" y2="90" class="image" />
  </g>
</svg>