<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oops</text>
  <text x="50" y="120" class="subtitle">[uːps] int. 哎哟（表示惊讶、失望等）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拟声词，模拟惊讶或失望的声音
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人不小心打翻了杯子，发出"哎哟(oops)"的声音，
    <tspan x="50" dy="25">脸上露出惊讶的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Oops, I spilled my coffee on the table.
  </text>
  <text x="50" y="310" class="content">
    哎哟，我把咖啡洒在桌子上了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Cup -->
    <rect x="120" y="30" width="40" height="60" class="image" />
    <line x1="120" y1="30" x2="160" y2="30" class="image" />
    <!-- Spilled liquid -->
    <polyline points="120,90 140,120 160,90" class="image" />
    <polyline points="120,100 140,130 160,100" class="image" />
    <polyline points="120,110 140,140 160,110" class="image" />
  </g>
</svg>