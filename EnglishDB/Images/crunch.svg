<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crunch</text>
  <text x="50" y="120" class="subtitle">[krʌntʃ] v. 嘎吱作响，紧缩；n. 嘎吱声，紧缩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crun- (嘎吱声) + -ch (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的饼干被咬碎，发出"嘎吱(crun-ch)"的声音，
    <tspan x="50" dy="25">这个声音就是crunch，也可以指经济紧缩时的"嘎吱"声。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crunch of the snow under my boots was loud.
  </text>
  <text x="50" y="310" class="content">
    我的靴子踩在雪地上发出嘎吱声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crunching sound -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="250" y2="130" class="image" />
    <!-- Broken cookie -->
    <rect x="100" y="150" width="100" height="50" class="image" />
    <line x1="120" y1="150" x2="120" y2="200" class="image" />
    <line x1="180" y1="150" x2="180" y2="200" class="image" />
  </g>
</svg>