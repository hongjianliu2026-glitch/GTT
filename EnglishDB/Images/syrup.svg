<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .syrup { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">syrup</text>
  <text x="50" y="120" class="subtitle">[ˈsɪrəp] n. 糖浆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syr- (液体) + -up (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的糖浆瓶，"液体(syr-)"
    <tspan x="50" dy="25">从瓶口倾泻而出，形成了一片甜蜜的海洋(syrup)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She drizzled some maple syrup over her pancakes.
  </text>
  <text x="50" y="310" class="content">
    她在她的煎饼上淋了一些枫糖浆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Syrup bottle -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Syrup pouring out -->
    <path d="M 75 200 Q 75 300 150 300 L 150 350 Q 75 350 75 400" class="syrup" />
    <!-- Syrup pool -->
    <ellipse cx="200" cy="450" rx="100" ry="50" class="syrup" />
    <!-- Syrup label -->
    <text x="30" y="180" class="content">Syrup</text>
  </g>
</svg>