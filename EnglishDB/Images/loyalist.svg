<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loyalist</text>
  <text x="50" y="120" class="subtitle">[ˈlɔɪəlɪst] n. 忠诚的人，保皇党人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loy (忠诚) + -al (形容词后缀) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个忠诚的骑士，手持盾牌，上面刻着"忠诚(loy)"
    <tspan x="50" dy="25">的标志，他始终站在国王(loyalist)的身边，永不背叛。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The loyalist stood by the king through thick and thin.
  </text>
  <text x="50" y="310" class="content">
    这位忠诚的人无论顺境逆境都站在国王身边。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <!-- Loyalty symbol -->
    <text x="100" y="110" text-anchor="middle" font-size="48" fill="#E74C3C">L</text>
    <!-- Knight -->
    <circle cx="100" cy="250" r="20" class="image" />
    <line x1="100" y1="270" x2="100" y2="320" class="image" />
    <line x1="100" y1="320" x2="80" y2="360" class="image" />
    <line x1="100" y1="320" x2="120" y2="360" class="image" />
    <line x1="100" y1="290" x2="60" y2="280" class="image" />
    <line x1="100" y1="290" x2="140" y2="280" class="image" />
  </g>
</svg>