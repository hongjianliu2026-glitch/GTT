<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">superficial</text>
  <text x="50" y="120" class="subtitle">[ˌsuːpərˈfɪʃl] adj. 表面的，肤浅的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (在上面) + fic (做) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人只"在表面(super-)"做(fic)事情，
    <tspan x="50" dy="25">没有深入了解，这就是肤浅的(superficial)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her understanding of the issue was superficial.
  </text>
  <text x="50" y="310" class="content">
    她对这个问题的理解很肤浅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Surface line -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- Surface text -->
    <text x="150" y="90" class="content" text-anchor="middle">Surface</text>
  </g>
</svg>