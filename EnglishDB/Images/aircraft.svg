<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aircraft</text>
  <text x="50" y="120" class="subtitle">[ˈɛrˌkræft] n. 飞机，航空器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> air (空气) + craft (工艺，技巧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机在空中翱翔，"空气中的工艺(air-craft)"
    <tspan x="50" dy="25">展示了人类对飞行技巧的掌握，这就是航空器(aircraft)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The aircraft took off smoothly from the runway.
  </text>
  <text x="50" y="310" class="content">
    飞机平稳地从跑道上起飞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Aircraft -->
    <polygon points="0,100 100,50 200,100 100,150" class="image" />
    <!-- Wings -->
    <line x1="50" y1="75" x2="150" y2="75" class="image" />
    <line x1="50" y1="125" x2="150" y2="125" class="image" />
    <!-- Tail -->
    <line x1="180" y1="100" x2="200" y2="100" class="image" />
    <line x1="190" y1="90" x2="190" y2="110" class="image" />
  </g>
</svg>