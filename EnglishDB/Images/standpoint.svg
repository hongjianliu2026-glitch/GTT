<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">standpoint</text>
  <text x="50" y="120" class="subtitle">[ˈstændpɔɪnt] n. 立场，观点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stand (站立) + point (点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个点上，这个点就是他的"立场(standpoint)"。
    <tspan x="50" dy="25">无论周围环境如何变化，他都坚定地站在自己的立场上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> From my standpoint, the decision was correct.
  </text>
  <text x="50" y="310" class="content">
    从我的立场来看，这个决定是正确的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Person standing -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="230" class="image" />
    <line x1="175" y1="200" x2="200" y2="230" class="image" />
    <line x1="175" y1="180" x2="210" y2="170" class="image" />
    <!-- Point -->
    <circle cx="175" cy="180" r="5" class="image" fill="#E74C3C" />
    <text x="165" y="190" class="content" fill="#E74C3C">point</text>
  </g>
</svg>