<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">straightforward</text>
  <text x="50" y="120" class="subtitle">[ˌstreɪtˈfɔːrwərd] adj. 直截了当的，简单的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> straight (直的) + forward (向前)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条笔直的道路，"直向前(straight-forward)"
    <tspan x="50" dy="25">没有任何弯路，这就是直截了当(straightforward)的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The instructions were straightforward and easy to follow.
  </text>
  <text x="50" y="310" class="content">
    这些说明简单明了，容易遵循。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Straight road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Arrow -->
    <polygon points="350,90 350,110 370,100" class="image" />
    <!-- Straight line -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <!-- Simple path -->
    <rect x="100" y="20" width="150" height="60" class="image" />
    <!-- Text inside path -->
    <text x="175" y="55" class="content" text-anchor="middle">Simple</text>
  </g>
</svg>