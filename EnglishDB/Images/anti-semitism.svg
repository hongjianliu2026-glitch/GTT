<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anti-semitism</text>
  <text x="50" y="120" class="subtitle">[ˌæntiˈsɛmɪˌtɪzəm] n. 反犹太主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (反对) + semit (闪米特人) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色"反对(anti)"标志，
    <tspan x="50" dy="25">压在一个闪米特人(Semit)的头上，</tspan>
    <tspan x="50" dy="25">象征着反犹太主义(anti-semitism)的压迫。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rise of anti-semitism is a worrying trend.
  </text>
  <text x="50" y="310" class="content">
    反犹太主义的抬头是一个令人担忧的趋势。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red "anti" sign -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#E74C3C" />
    <text x="50" y="100" class="content" fill="#FFFFFF" font-size="60">anti</text>
    <!-- Semitic person -->
    <circle cx="200" cy="100" r="30" class="image" fill="#F1C40F" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="170" y2="130" class="image" />
    <line x1="200" y1="150" x2="230" y2="130" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
  </g>
</svg>