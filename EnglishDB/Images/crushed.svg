<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crushed</text>
  <text x="50" y="120" class="subtitle">[krʌʃt] adj. 压碎的，粉碎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crus (压碎) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头从天而降，"压碎(crus)"
    <tspan x="50" dy="25">了一堆小石子，这些小石子就变成了粉碎的(crushed)状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The box was crushed under the weight of the books.
  </text>
  <text x="50" y="310" class="content">
    箱子在书的重量下被压碎了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large stone -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Small crushed stones -->
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="80" cy="110" r="10" class="image" />
    <circle cx="110" cy="120" r="10" class="image" />
    <circle cx="140" cy="130" r="10" class="image" />
    <circle cx="170" cy="140" r="10" class="image" />
  </g>
</svg>