<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #FF6F00; }
      .highlight { font-weight: bold; fill: #D84315; }
      .story { font: 16px serif; fill: #FF5722; }
      .image { stroke: #FF8A65; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sweetly</text>
  <text x="50" y="120" class="subtitle">[ˈswiːtli] adv. 甜蜜地，亲切地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sweet (甜的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在品尝甜美的糖果，脸上洋溢着甜蜜的笑容，
    <tspan x="50" dy="25">这种甜蜜的感觉就是"sweetly"所表达的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She smiled sweetly at the children.
  </text>
  <text x="50" y="310" class="content">
    她亲切地对孩子们微笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Candy -->
    <circle cx="50" cy="50" r="30" class="image" fill="#FFEB3B" />
    <circle cx="120" cy="50" r="30" class="image" fill="#FFEB3B" />
    <circle cx="190" cy="50" r="30" class="image" fill="#FFEB3B" />
    <!-- Smiling face -->
    <circle cx="120" cy="150" r="40" class="image" fill="#FFC107" />
    <circle cx="105" cy="140" r="5" class="image" fill="#212121" />
    <circle cx="135" cy="140" r="5" class="image" fill="#212121" />
    <path d="M105 165 Q120 180 135 165" class="image" fill="none" stroke="#212121" stroke-width="3" />
  </g>
</svg>