<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wake-up</text>
  <text x="50" y="120" class="subtitle">[ˈweɪk ʌp] v. 醒来，唤醒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wake (醒来) + up (向上)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从床上"醒来(wake)"，身体"向上(up)"伸展，
    <tspan x="50" dy="25">迎接新的一天。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The alarm clock is set to wake me up at 7 AM.
  </text>
  <text x="50" y="310" class="content">
    闹钟设置在早上7点叫醒我。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Person waking up -->
    <circle cx="50" cy="60" r="15" class="image" />
    <line x1="50" y1="75" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="95" x2="80" y2="85" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Rays of the sun -->
    <line x1="250" y1="20" x2="250" y2="0" class="image" />
    <line x1="280" y1="50" x2="300" y2="50" class="image" />
    <line x1="250" y1="80" x2="250" y2="100" class="image" />
    <line x1="220" y1="50" x2="200" y2="50" class="image" />
  </g>
</svg>