<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incubate</text>
  <text x="50" y="120" class="subtitle">[ˈɪŋkjubeɪt] v. 孵化，培养</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + cub (躺下) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只母鸡"进入(in-)"一个温暖的巢穴，"躺下(cub)"
    <tspan x="50" dy="25">孵化她的蛋，这个过程就是孵化(incubate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scientists incubated the bacteria in a controlled environment.
  </text>
  <text x="50" y="310" class="content">
    科学家们在受控环境中培养细菌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Egg -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Hen -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="190" class="image" />
    <line x1="175" y1="190" x2="160" y2="210" class="image" />
    <line x1="175" y1="190" x2="190" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="170" class="image" />
  </g>
</svg>