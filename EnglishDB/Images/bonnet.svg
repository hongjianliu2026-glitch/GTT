<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bonnet</text>
  <text x="50" y="120" class="subtitle">[ˈbɒnɪt] n. 女帽，童帽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bon (好) + net (网)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着"好网(bon-net)"的女帽，
    <tspan x="50" dy="25">帽子上的网状装饰让人眼前一亮，这就是bonnet。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a vintage bonnet to the garden party.
  </text>
  <text x="50" y="310" class="content">
    她戴着一顶复古的女帽去参加花园派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bonnet -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="175" x2="50" y2="175" class="image" />
    <line x1="100" y1="175" x2="150" y2="175" class="image" />
    <line x1="100" y1="175" x2="75" y2="200" class="image" />
    <line x1="100" y1="175" x2="125" y2="200" class="image" />
    <!-- Net decoration -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="75" y1="75" x2="125" y2="75" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
  </g>
</svg>