<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">silo</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪloʊ] n. 筒仓，地窖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> silo (源自西班牙语 "silo"，意为"地窖")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"地窖(silo)"，里面装满了粮食，
    <tspan x="50" dy="25">农民们正在忙碌地进出，确保粮食安全储存。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer stored his corn in a silo for the winter.
  </text>
  <text x="50" y="310" class="content">
    农民将玉米储存在筒仓中过冬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Silo structure -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Silo top -->
    <rect x="50" y="0" width="100" height="50" class="image" />
    <!-- Silo door -->
    <rect x="80" y="250" width="40" height="50" class="image" />
    <!-- Farmer -->
    <circle cx="100" cy="350" r="15" class="image" />
    <line x1="100" y1="365" x2="100" y2="400" class="image" />
    <line x1="100" y1="400" x2="80" y2="430" class="image" />
    <line x1="100" y1="400" x2="120" y2="430" class="image" />
    <line x1="100" y1="380" x2="130" y2="370" class="image" />
  </g>
</svg>