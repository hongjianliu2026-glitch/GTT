<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">booty</text>
  <text x="50" y="120" class="subtitle">[ˈbuːti] n. 战利品，赃物；臀部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boot (源自中古英语 "boot"，意为“利益”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个海盗船长，他挥舞着剑，身后堆满了从沉船中打捞上来的金银财宝，
    <tspan x="50" dy="25">这些财宝就是他的"战利品(booty)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pirates divided the booty among themselves.
  </text>
  <text x="50" y="310" class="content">
    海盗们把战利品分了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pirate ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pirate captain -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Sword -->
    <line x1="50" y1="120" x2="100" y2="80" class="image" />
    <!-- Treasure chest -->
    <rect x="200" y="50" width="100" height="80" class="image" />
    <!-- Gold coins -->
    <circle cx="220" cy="90" r="10" class="image" />
    <circle cx="240" cy="90" r="10" class="image" />
    <circle cx="260" cy="90" r="10" class="image" />
  </g>
</svg>