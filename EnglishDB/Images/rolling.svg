<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rolling</text>
  <text x="50" y="120" class="subtitle">[ˈroʊlɪŋ] adj. 滚动的，旋转的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roll (滚动) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头在山坡上"滚动(roll)"，
    <tspan x="50" dy="25">它不停地旋转，形成了一幅壮观的"滚动(rolling)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rolling hills of Scotland are breathtaking.
  </text>
  <text x="50" y="310" class="content">
    苏格兰连绵起伏的丘陵令人叹为观止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rolling stone -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Hill -->
    <path d="M 0 200 Q 50 150 100 200 T 200 200" class="image" />
    <path d="M 100 200 Q 150 150 200 200" class="image" />
  </g>
</svg>