<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">convention</text>
  <text x="50" y="120" class="subtitle">[kənˈvɛnʃən] n. 大会，惯例，习俗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + ven (来) + -tion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"共同来到(con-ven)"一个地方，
    <tspan x="50" dy="25">讨论并达成共识，这就是大会(convention)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The annual convention of the company was held in Las Vegas.
  </text>
  <text x="50" y="310" class="content">
    公司的年度大会在拉斯维加斯举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Convention hall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="110" cy="50" r="10" class="image" />
    <circle cx="140" cy="50" r="10" class="image" />
    <circle cx="170" cy="50" r="10" class="image" />
    <!-- Table -->
    <rect x="50" y="70" width="250" height="50" class="image" />
    <!-- Chairs -->
    <line x1="60" y1="130" x2="60" y2="180" class="image" />
    <line x1="90" y1="130" x2="90" y2="180" class="image" />
    <line x1="120" y1="130" x2="120" y2="180" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <line x1="180" y1="130" x2="180" y2="180" class="image" />
  </g>
</svg>