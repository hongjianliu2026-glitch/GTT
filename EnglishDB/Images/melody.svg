<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">melody</text>
  <text x="50" y="120" class="subtitle">[ˈmelədi] n. 旋律，曲调</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> melo- (歌曲) + -dy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在谱写一首美妙的"歌曲(melo-)"，
    <tspan x="50" dy="25">这些音符组合成了一段动人的旋律(melody)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The melody of the song stayed in my mind for days.
  </text>
  <text x="50" y="310" class="content">
    这首歌的旋律在我脑海中停留了好几天。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Music staff -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <!-- Notes -->
    <circle cx="50" cy="10" r="10" class="image" />
    <line x1="50" y1="20" x2="50" y2="80" class="image" />
    <circle cx="100" cy="30" r="10" class="image" />
    <line x1="100" y1="40" x2="100" y2="80" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <line x1="150" y1="60" x2="150" y2="80" class="image" />
    <circle cx="200" cy="70" r="10" class="image" />
    <line x1="200" y1="80" x2="200" y2="80" class="image" />
    <!-- Musician -->
    <circle cx="250" cy="40" r="15" class="image" />
    <line x1="250" y1="55" x2="250" y2="80" class="image" />
    <line x1="250" y1="80" x2="230" y2="100" class="image" />
    <line x1="250" y1="80" x2="270" y2="100" class="image" />
    <line x1="250" y1="65" x2="280" y2="55" class="image" />
  </g>
</svg>