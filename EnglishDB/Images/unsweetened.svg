<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unsweetened</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˈswiːtənd] adj. 未加糖的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + sweet (甜) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯咖啡，上面写着"未加糖(un-sweetened)"，
    <tspan x="50" dy="25">旁边放着一袋糖，但咖啡里没有加糖，保持了原味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He prefers his coffee unsweetened.
  </text>
  <text x="50" y="310" class="content">
    他喜欢不加糖的咖啡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee cup -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="10" y="10" width="130" height="80" class="image" />
    <!-- Sugar packet -->
    <rect x="170" y="20" width="50" height="40" class="image" />
    <text x="180" y="45" class="content" fill="#7F8C8D">Sugar</text>
    <!-- Text on coffee -->
    <text x="20" y="60" class="content" fill="#7F8C8D">Unsweetened</text>
  </g>
</svg>