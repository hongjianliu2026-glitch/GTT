<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fruit { fill: #F39C12; }
      .leaf { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nutritious</text>
  <text x="50" y="120" class="subtitle">[njuːˈtrɪʃəs] adj. 有营养的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nutri (滋养) + -tious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水果，"滋养(nutri)"
    <tspan x="50" dy="25">着整个森林，这个水果就是营养(nutritious)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Eating nutritious food is essential for good health.
  </text>
  <text x="50" y="310" class="content">
    吃有营养的食物对健康至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fruit -->
    <circle cx="100" cy="100" r="80" class="fruit" />
    <!-- Leaf -->
    <polygon points="100,20 150,100 50,100" class="leaf" />
    <!-- Nutrient lines -->
    <line x1="100" y1="180" x2="100" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="250" class="image" />
    <line x1="100" y1="180" x2="150" y2="250" class="image" />
    <!-- Nutrient drops -->
    <circle cx="100" cy="200" r="10" class="image" />
    <circle cx="75" cy="275" r="10" class="image" />
    <circle cx="125" cy="275" r="10" class="image" />
  </g>
</svg>