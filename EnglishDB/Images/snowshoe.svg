<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snowshoe</text>
  <text x="50" y="120" class="subtitle">[ˈsnoʊʃuː] n. 雪鞋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snow (雪) + shoe (鞋)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着"雪鞋(snowshoe)"，
    <tspan x="50" dy="25">在厚厚的雪地上行走，就像在雪上"滑行"一样轻松。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used snowshoes to traverse the deep snow.
  </text>
  <text x="50" y="310" class="content">
    他用雪鞋穿越了深厚的积雪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowshoe -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="50" class="image" />
    <line x1="70" y1="45" x2="280" y2="45" class="image" />
    <line x1="70" y1="70" x2="250" y2="70" class="image" />
    <line x1="70" y1="95" x2="270" y2="95" class="image" />
    <line x1="70" y1="120" x2="240" y2="120" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Snow -->
    <circle cx="150" cy="180" r="10" class="image" />
    <circle cx="200" cy="170" r="10" class="image" />
    <circle cx="250" cy="190" r="10" class="image" />
  </g>
</svg>