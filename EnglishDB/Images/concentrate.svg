<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">concentrate</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnsəntreɪt] v. 集中，专注；n. 浓缩物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + centr (中心) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把所有的注意力"集中(con-)"到"中心(centr)"，
    <tspan x="50" dy="25">就像把所有的光线汇聚到一个点，这就是专注(concentrate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She needs to concentrate on her studies to pass the exam.
  </text>
  <text x="50" y="310" class="content">
    她需要专注于学习以通过考试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Light rays converging -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="0" y1="50" x2="100" y2="100" class="image" />
    <line x1="0" y1="100" x2="100" y2="100" class="image" />
    <line x1="0" y1="150" x2="100" y2="100" class="image" />
    <line x1="0" y1="200" x2="100" y2="100" class="image" />
    <!-- Central point -->
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Person focusing -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
  </g>
</svg>