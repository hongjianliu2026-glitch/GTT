<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tact</text>
  <text x="50" y="120" class="subtitle">[tækt] n. 机智，圆滑，得体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tact (接触)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在社交场合中，"轻轻接触(tact)"
    <tspan x="50" dy="25">每个人的心，用得体的方式交流，这就是机智(tact)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She handled the situation with great tact.
  </text>
  <text x="50" y="310" class="content">
    她非常得体地处理了这种情况。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Social circle -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- People -->
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="230" cy="100" r="15" class="image" />
    <circle cx="175" cy="50" r="15" class="image" />
    <circle cx="175" cy="150" r="15" class="image" />
    <!-- Touching hands -->
    <line x1="120" y1="115" x2="230" y2="115" class="image" />
    <!-- Tact symbol -->
    <text x="175" y="200" class="content" text-anchor="middle">🤝</text>
  </g>
</svg>