<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">propane</text>
  <text x="50" y="120" class="subtitle">[ˈproʊpeɪn] n. 丙烷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + pan (面包)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的面包(pan)被向前推(pro-)，
    <tspan x="50" dy="25">突然变成了一个丙烷罐，喷出火焰，烤熟了整个面包。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The barbecue grill uses propane for fuel.
  </text>
  <text x="50" y="310" class="content">
    烧烤架使用丙烷作为燃料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bread -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Propane tank -->
    <rect x="50" y="20" width="100" height="60" class="image" />
    <!-- Flame -->
    <polygon points="100,20 120,0 140,20" style="fill:orange;stroke:red;stroke-width:2" />
    <polygon points="100,30 120,10 140,30" style="fill:orange;stroke:red;stroke-width:2" />
    <polygon points="100,40 120,20 140,40" style="fill:orange;stroke:red;stroke-width:2" />
  </g>
</svg>