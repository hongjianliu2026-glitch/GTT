<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">healing</text>
  <text x="50" y="120" class="subtitle">[ˈhiːlɪŋ] n. 治愈，康复；adj. 有治疗功用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heal (治愈) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个受伤的人，"治愈(heal)"
    <tspan x="50" dy="25">后逐渐恢复健康，这个过程就是治愈(healing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The healing process took several months.
  </text>
  <text x="50" y="310" class="content">
    康复过程花了好几个月。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bandage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Wound -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Healing -->
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="150" y1="155" x2="200" y2="155" class="image" />
    <line x1="160" y1="145" x2="190" y2="165" class="image" />
    <line x1="160" y1="165" x2="190" y2="145" class="image" />
  </g>
</svg>