<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reviewer</text>
  <text x="50" y="120" class="subtitle">[rɪˈvjuːər] n. 评论者，评审员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + view (看) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个评论者拿着放大镜，"再次仔细查看(re-view)"
    <tspan x="50" dy="25">每一处细节，确保没有遗漏，这个人就是评审员(reviewer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The reviewer gave the movie a positive rating.
  </text>
  <text x="50" y="310" class="content">
    评论者给这部电影打了一个好评。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="80" y1="100" x2="150" y2="100" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
  </g>
</svg>