<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">worthless</text>
  <text x="50" y="120" class="subtitle">[ˈwɜːrθləs] adj. 无价值的，无用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> worth (价值) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个破旧的硬币，"没有价值(worth-less)"，
    <tspan x="50" dy="25">被丢弃在垃圾堆里，毫无用处。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old toy was considered worthless by the children.
  </text>
  <text x="50" y="310" class="content">
    孩子们认为那个旧玩具毫无价值。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken coin -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="30" y1="80" x2="70" y2="120" class="image" />
    <line x1="30" y1="120" x2="70" y2="80" class="image" />
    <!-- Trash can -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <!-- Coin in trash -->
    <circle cx="175" cy="125" r="10" class="image" />
  </g>
</svg>