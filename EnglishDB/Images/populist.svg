<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">populist</text>
  <text x="50" y="120" class="subtitle">[ˈpɒpjʊlɪst] n. 民粹主义者；adj. 民粹主义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> popul (人民) + -ist (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者站在高台上，面对着"人民(popul)"
    <tspan x="50" dy="25">的海洋，大声呼喊着他们的诉求，这就是民粹主义者(populist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The populist leader gained support by appealing to the common people.
  </text>
  <text x="50" y="310" class="content">
    这位民粹主义领导人通过迎合普通民众获得了支持。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="100" x2="125" y2="110" class="image" />
    <line x1="175" y1="100" x2="225" y2="110" class="image" />
    <!-- Crowd -->
    <circle cx="50" cy="180" r="10" class="image" />
    <circle cx="100" cy="180" r="10" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
    <circle cx="200" cy="180" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
    <circle cx="300" cy="180" r="10" class="image" />
  </g>
</svg>