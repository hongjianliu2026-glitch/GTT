<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">folic</text>
  <text x="50" y="120" class="subtitle">[ˈfoʊlɪk] adj. 叶酸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> foli (叶子) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片绿叶(foli)上，"长满了(foli-)"
    <tspan x="50" dy="25">叶酸(folic)，这种营养素对健康至关重要。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Folic acid is essential for pregnant women.
  </text>
  <text x="50" y="310" class="content">
    叶酸对孕妇来说是必不可少的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Leaf -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" />
    <path d="M50 100 Q100 130 150 100 T250 100" class="image" />
    <path d="M50 150 Q100 180 150 150 T250 150" class="image" />
    <!-- Nutrient symbol -->
    <circle cx="150" cy="100" r="20" class="image" />
    <text x="140" y="110" class="content">酸</text>
  </g>
</svg>