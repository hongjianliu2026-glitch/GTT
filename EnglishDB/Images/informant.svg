<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">informant</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfɔːrmənt] n. 告密者，线人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + form (形式) + -ant (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的人，悄悄地"进入(in-)"某个组织，
    <tspan x="50" dy="25">"形成(form)"了内部的信息网络，</tspan>
    <tspan x="50" dy="25">这个人就是告密者(informant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The informant provided crucial information to the police.
  </text>
  <text x="50" y="310" class="content">
    线人向警方提供了关键信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Informant -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <!-- Information -->
    <rect x="100" y="80" width="150" height="100" class="image" />
    <line x1="120" y1="100" x2="230" y2="100" class="image" />
    <line x1="120" y1="120" x2="230" y2="120" class="image" />
    <line x1="120" y1="140" x2="230" y2="140" class="image" />
    <line x1="120" y1="160" x2="230" y2="160" class="image" />
    <!-- Arrow -->
    <line x1="80" y1="140" x2="100" y2="140" class="image" />
    <polygon points="100,140 95,135 95,145" class="image" />
  </g>
</svg>