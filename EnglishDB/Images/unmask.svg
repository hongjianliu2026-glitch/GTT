<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unmask</text>
  <text x="50" y="120" class="subtitle">[ʌnˈmæsk] v. 揭露，揭开面具</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (去掉) + mask (面具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人戴着面具，突然有人"去掉(un-)"
    <tspan x="50" dy="25">他的面具，揭露了他的真实身份。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective finally unmasked the thief.
  </text>
  <text x="50" y="310" class="content">
    侦探最终揭露了小偷的身份。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mask -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <circle cx="75" cy="50" r="40" class="image" />
    <!-- Face -->
    <circle cx="75" cy="50" r="30" class="image" fill="#F1C40F" />
    <circle cx="55" cy="40" r="5" class="image" fill="#000" />
    <circle cx="95" cy="40" r="5" class="image" fill="#000" />
    <line x1="60" y1="60" x2="90" y2="60" class="image" />
    <!-- Hand removing mask -->
    <line x1="160" y1="50" x2="130" y2="50" class="image" />
    <line x1="160" y1="50" x2="160" y2="70" class="image" />
    <line x1="160" y1="70" x2="150" y2="80" class="image" />
    <line x1="160" y1="70" x2="170" y2="80" class="image" />
  </g>
</svg>