<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overrun</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈrʌn] v. 超越，泛滥；n. 泛滥，超越</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (超过) + run (跑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群疯狂的兔子在田野上"跑过(run)"，
    <tspan x="50" dy="25">结果"超过(over)"了田野的边界，泛滥成灾。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was overrun with unexpected issues.
  </text>
  <text x="50" y="310" class="content">
    这个项目被意外问题所超越。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field boundary -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rabbits -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="150" cy="140" r="15" class="image" />
    <circle cx="200" cy="160" r="15" class="image" />
    <circle cx="250" cy="180" r="15" class="image" />
    <!-- Overrun boundary -->
    <line x1="350" y1="0" x2="350" y2="200" class="image" />
    <line x1="350" y1="100" x2="400" y2="100" class="image" />
  </g>
</svg>