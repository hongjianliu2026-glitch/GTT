<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hurt</text>
  <text x="50" y="120" class="subtitle">[hɜːrt] v. 伤害，疼痛；n. 伤害</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hurt (源自中古英语 hurten，意为“打击”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被一个巨大的拳头“打击(hurt)”，
    <tspan x="50" dy="25">疼痛感瞬间袭来，这就是“hurt”的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He fell and hurt his knee.
  </text>
  <text x="50" y="310" class="content">
    他摔倒了，伤到了膝盖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant fist -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="50" y2="180" class="image" />
    <line x1="100" y1="150" x2="150" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="120" class="image" />
    <line x1="100" y1="150" x2="130" y2="120" class="image" />
    <!-- Person -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
  </g>
</svg>