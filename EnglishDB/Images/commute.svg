<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commute</text>
  <text x="50" y="120" class="subtitle">[kəˈmjuːt] v. 通勤，交换</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + mute (移动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人每天"共同移动(com-mute)"
    <tspan x="50" dy="25">在城市和家之间，这就是通勤(commute)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She commutes to work by train every day.
  </text>
  <text x="50" y="310" class="content">
    她每天乘火车通勤上班。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <!-- Person -->
    <circle cx="100" cy="50" r="15" class="image" />
    <line x1="100" y1="65" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="80" x2="130" y2="70" class="image" />
    <!-- Train -->
    <rect x="200" y="20" width="100" height="50" class="image" />
    <!-- Train windows -->
    <rect x="210" y="30" width="20" height="30" class="image" />
    <rect x="240" y="30" width="20" height="30" class="image" />
    <rect x="270" y="30" width="20" height="30" class="image" />
  </g>
</svg>