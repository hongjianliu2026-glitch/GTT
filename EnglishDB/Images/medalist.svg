<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .medal { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">medalist</text>
  <text x="50" y="120" class="subtitle">[ˈmɛdəlɪst] n. 奖牌获得者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> med (治疗) + al (形容词后缀) + ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在比赛中"治愈(med)"了所有对手，
    <tspan x="50" dy="25">最终获得了奖牌(medal)，成为了奖牌获得者(medalist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She became a medalist in the Olympic Games.
  </text>
  <text x="50" y="310" class="content">
    她在奥运会上成为了奖牌获得者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Medal -->
    <circle cx="100" cy="100" r="50" class="medal" />
    <text x="85" y="110" class="content" fill="#000">奖牌</text>
    <!-- Athlete -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="180" y2="130" class="image" />
    <line x1="200" y1="150" x2="220" y2="130" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <text x="185" y="220" class="content" fill="#000">运动员</text>
  </g>
</svg>