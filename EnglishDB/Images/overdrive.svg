<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overdrive</text>
  <text x="50" y="120" class="subtitle">[ˈoʊvərdaɪv] n. 超速传动，过度驱动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (超过) + drive (驱动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆赛车在赛道上，"超过(over)"
    <tspan x="50" dy="25">正常速度"驱动(drive)"，进入了超速传动(overdrive)状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car shifted into overdrive to pass the slow truck.
  </text>
  <text x="50" y="310" class="content">
    汽车切换到超速传动以超过那辆慢速的卡车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Race track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="80" r="15" class="image" />
    <circle cx="130" cy="80" r="15" class="image" />
    <!-- Speed lines -->
    <line x1="160" y1="50" x2="200" y2="50" class="image" />
    <line x1="160" y1="60" x2="200" y2="60" class="image" />
    <line x1="160" y1="70" x2="200" y2="70" class="image" />
    <line x1="160" y1="80" x2="200" y2="80" class="image" />
    <line x1="160" y1="90" x2="200" y2="90" class="image" />
    <line x1="160" y1="100" x2="200" y2="100" class="image" />
  </g>
</svg>