<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rump</text>
  <text x="50" y="120" class="subtitle">[rʌmp] n. 臀部，尾部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rum (来自古英语 rum, 意为"宽阔的")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只大象，它的"宽阔的(rum)"
    <tspan x="50" dy="25">臀部(rump)非常显眼，就像一座小山。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The elephant's rump is very wide.
  </text>
  <text x="50" y="310" class="content">
    这只大象的臀部非常宽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elephant body -->
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Elephant head -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Elephant trunk -->
    <path d="M50 100 Q20 150 50 200" class="image" />
    <!-- Elephant legs -->
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="250" y1="180" x2="250" y2="250" class="image" />
    <!-- Elephant rump -->
    <ellipse cx="175" cy="180" rx="70" ry="40" class="image" />
  </g>
</svg>