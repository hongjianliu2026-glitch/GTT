<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E3; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">taste</text>
  <text x="50" y="120" class="subtitle">[teɪst] n. 味道，品味；v. 品尝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tast (接触)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用舌头"接触(tast)"食物，
    <tspan x="50" dy="25">感受食物的味道(taste)，这就是品尝的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a refined taste in wine.
  </text>
  <text x="50" y="310" class="content">
    她对葡萄酒有很高的品味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tongue -->
    <path d="M50 100 Q100 50 150 100" class="image" />
    <!-- Food -->
    <circle cx="100" cy="120" r="20" class="image" />
    <!-- Person -->
    <circle cx="100" cy="50" r="30" class="image" />
    <line x1="100" y1="80" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="70" y2="180" class="image" />
    <line x1="100" y1="150" x2="130" y2="180" class="image" />
    <line x1="100" y1="100" x2="150" y2="90" class="image" />
  </g>
</svg>