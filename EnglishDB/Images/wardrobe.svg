<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wardrobe</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːrdroʊb] n. 衣柜，衣橱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ward (保护) + robe (衣服)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的衣柜，"保护(ward)"
    <tspan x="50" dy="25">着你的所有衣服(robe)，就像一个守护者。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She organized her wardrobe by color.
  </text>
  <text x="50" y="310" class="content">
    她按颜色整理了她的衣柜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Wardrobe -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Clothes -->
    <rect x="20" y="20" width="160" height="50" class="image" />
    <rect x="20" y="90" width="160" height="50" class="image" />
    <rect x="20" y="160" width="160" height="50" class="image" />
    <rect x="20" y="230" width="160" height="50" class="image" />
    <!-- Hanger -->
    <line x1="100" y1="20" x2="100" y2="0" class="image" />
    <line x1="100" y1="90" x2="100" y2="70" class="image" />
    <line x1="100" y1="160" x2="100" y2="140" class="image" />
    <line x1="100" y1="230" x2="100" y2="210" class="image" />
  </g>
</svg>