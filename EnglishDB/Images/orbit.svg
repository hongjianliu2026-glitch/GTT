<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orbit</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrbɪt] n. 轨道；v. 绕轨道运行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> orbi- (圆) + -t (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆形轨道，"圆(orbi-)"
    <tspan x="50" dy="25">形的路径上，卫星在不停地"绕行(t)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The satellite will orbit the Earth for five years.
  </text>
  <text x="50" y="310" class="content">
    这颗卫星将在地球轨道上运行五年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Orbit circle -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- Satellite -->
    <circle cx="200" cy="20" r="10" class="image" fill="#E74C3C" />
    <!-- Path line -->
    <path d="M200,100 A80,80 0 0,1 200,20" class="image" />
  </g>
</svg>