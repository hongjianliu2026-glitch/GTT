<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">computer-based</text>
  <text x="50" y="120" class="subtitle">[kəmˈpjuːtər beɪst] adj. 基于计算机的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> computer (计算机) + based (基于)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的计算机屏幕，上面显示着各种数据和图表，
    <tspan x="50" dy="25">所有的操作和决策都"基于(based)"这台计算机(computer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new system is completely computer-based.
  </text>
  <text x="50" y="310" class="content">
    这个新系统完全是基于计算机的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Computer screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Data lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="250" y2="80" class="image" />
    <line x1="50" y1="110" x2="270" y2="110" class="image" />
    <line x1="50" y1="140" x2="240" y2="140" class="image" />
    <!-- Computer -->
    <rect x="150" y="160" width="50" height="20" class="image" />
    <rect x="140" y="180" width="70" height="10" class="image" />
    <rect x="160" y="190" width="30" height="10" class="image" />
  </g>
</svg>