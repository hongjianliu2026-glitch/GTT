<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pep</text>
  <text x="50" y="120" class="subtitle">[pep] n. 活力，精神</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拟声词，模仿充满活力的声音
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小狗在草地上奔跑，发出充满活力的"pep"声，
    <tspan x="50" dy="25">这种声音让人感受到无尽的活力和精神。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pep rally boosted the team's morale.
  </text>
  <text x="50" y="310" class="content">
    动员大会提升了团队的士气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#27AE60" />
    <!-- Dog -->
    <circle cx="100" cy="120" r="30" class="image" fill="#F1C40F" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="70" y2="230" class="image" />
    <line x1="100" y1="200" x2="130" y2="230" class="image" />
    <line x1="100" y1="170" x2="70" y2="160" class="image" />
    <line x1="100" y1="170" x2="130" y2="160" class="image" />
    <!-- Sound waves -->
    <path d="M150,120 Q180,100 210,120 Q240,140 270,120" class="image" />
    <path d="M150,130 Q180,110 210,130 Q240,150 270,130" class="image" />
    <path d="M150,140 Q180,120 210,140 Q240,160 270,140" class="image" />
  </g>
</svg>