<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">around</text>
  <text x="50" y="120" class="subtitle">[əˈraʊnd] adv. 周围，环绕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (在) + round (圆的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个圆形的物体，"在圆的周围(a-round)"
    <tspan x="50" dy="25">环绕着它，这就是"around"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children played around the tree.
  </text>
  <text x="50" y="310" class="content">
    孩子们在树周围玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Arrows around the circle -->
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <line x1="120" y1="30" x2="100" y2="40" class="image" />
    <line x1="180" y1="100" x2="160" y2="100" class="image" />
    <line x1="170" y1="120" x2="160" y2="100" class="image" />
    <line x1="100" y1="180" x2="100" y2="160" class="image" />
    <line x1="80" y1="170" x2="100" y2="160" class="image" />
    <line x1="20" y1="100" x2="40" y2="100" class="image" />
    <line x1="30" y1="80" x2="40" y2="100" class="image" />
  </g>
</svg>