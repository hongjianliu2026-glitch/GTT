<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reckless</text>
  <text x="50" y="120" class="subtitle">[ˈrɛklɪs] adj. 鲁莽的，不顾后果的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + -ck- (击打) + -less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在悬崖边上，"回击(re-ck)"
    <tspan x="50" dy="25">却没有考虑到后果，这就是鲁莽(reckless)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His reckless driving caused the accident.
  </text>
  <text x="50" y="310" class="content">
    他鲁莽的驾驶导致了事故。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="30" y2="220" class="image" />
    <line x1="50" y1="190" x2="70" y2="220" class="image" />
    <line x1="50" y1="175" x2="80" y2="165" class="image" />
    <!-- Action -->
    <line x1="50" y1="150" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
    <!-- Danger sign -->
    <polygon points="250,100 230,140 270,140" class="image" />
    <text x="240" y="130" class="highlight">!</text>
  </g>
</svg>