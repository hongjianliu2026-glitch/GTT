<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">occupancy</text>
  <text x="50" y="120" class="subtitle">[ˈɒkjʊpənsi] n. 占有，居住</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oc- (加强) + cup (抓取) + -ancy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"紧紧抓住(oc-cup)"一栋房子，表示他正在"占有(occupancy)"这栋房子。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The occupancy rate of the hotel was very high during the holiday season.
  </text>
  <text x="50" y="310" class="content">
    酒店在假期期间的入住率非常高。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <polygon points="0,0 100,0 150,50 50,50" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Gripping hand -->
    <line x1="150" y1="120" x2="180" y2="120" class="image" />
    <line x1="180" y1="120" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="160" y2="150" class="image" />
  </g>
</svg>