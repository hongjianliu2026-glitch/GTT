<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reduce</text>
  <text x="50" y="120" class="subtitle">[rɪˈdjuːs] v. 减少，缩小</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + duce (引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师将一个大苹果"向后引导(re-duce)"，
    <tspan x="50" dy="25">苹果逐渐缩小，最终变成了一个小樱桃。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to reduce its workforce by 20%.
  </text>
  <text x="50" y="310" class="content">
    公司决定裁员20%。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large apple -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Small cherry -->
    <circle cx="300" cy="100" r="10" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="280" y2="100" class="image" />
    <polygon points="280,90 290,100 280,110" class="image" />
    <!-- Magic wand -->
    <line x1="50" y1="100" x2="80" y2="70" class="image" />
    <circle cx="45" cy="95" r="5" class="image" />
  </g>
</svg>