<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">south</text>
  <text x="50" y="120" class="subtitle">[saʊθ] n. 南方</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> suth (南方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指南针指向南方，"南方(suth)"
    <tspan x="50" dy="25">的方向总是温暖而阳光明媚。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They moved to the south for warmer weather.
  </text>
  <text x="50" y="310" class="content">
    他们为了更温暖的天气搬到了南方。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compass -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="180" class="image" />
    <line x1="100" y1="100" x2="20" y2="100" class="image" />
    <!-- South arrow -->
    <polygon points="100,180 80,140 120,140" class="image" />
    <text x="90" y="160" class="content">S</text>
  </g>
</svg>