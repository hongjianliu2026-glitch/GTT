<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nuclear</text>
  <text x="50" y="120" class="subtitle">[ˈnjuːklɪər] adj. 核的，原子核的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nucleo- (核) + -ar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的原子核，"核心(nucleo-)"
    <tspan x="50" dy="25">散发着强大的能量，这就是核能(nuclear)的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The country has a nuclear power plant.
  </text>
  <text x="50" y="310" class="content">
    这个国家有一座核电站。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nucleus -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Electrons -->
    <circle cx="50" cy="50" r="10" class="image" fill="#3498DB" />
    <circle cx="150" cy="50" r="10" class="image" fill="#3498DB" />
    <circle cx="100" cy="150" r="10" class="image" fill="#3498DB" />
    <!-- Energy rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
  </g>
</svg>