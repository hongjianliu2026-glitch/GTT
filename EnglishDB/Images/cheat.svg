<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheat</text>
  <text x="50" y="120" class="subtitle">[tʃiːt] v. 欺骗，作弊；n. 骗子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cheat (源自中古英语 "cheten"，意为欺骗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在考试时，偷偷地"欺骗(cheat)"
    <tspan x="50" dy="25">看旁边同学的答案，结果被老师抓个正着。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was caught cheating on the exam.
  </text>
  <text x="50" y="310" class="content">
    他在考试中作弊被抓了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Student -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Exam paper -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <!-- Teacher -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="190" class="image" />
    <line x1="300" y1="160" x2="320" y2="190" class="image" />
    <line x1="300" y1="140" x2="330" y2="130" class="image" />
    <!-- Eye -->
    <circle cx="300" cy="80" r="5" class="image" />
    <!-- Hand pointing -->
    <line x1="300" y1="120" x2="70" y2="120" class="image" />
  </g>
</svg>