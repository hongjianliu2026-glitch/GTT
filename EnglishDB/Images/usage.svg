<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">usage</text>
  <text x="50" y="120" class="subtitle">[ˈjuːsɪdʒ] n. 使用，用法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> use (使用) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在使用(use)一把锤子，"使用(use)"
    <tspan x="50" dy="25">的动作不断重复，就形成了"用法(usage)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The usage of this tool is quite simple.
  </text>
  <text x="50" y="310" class="content">
    这个工具的用法非常简单。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <rect x="0" y="0" width="100" height="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <rect x="30" y="100" width="40" height="60" class="image" />
    <!-- Person using the hammer -->
    <circle cx="150" cy="80" r="20" class="image" />
    <line x1="150" y1="100" x2="150" y2="160" class="image" />
    <line x1="150" y1="120" x2="120" y2="140" class="image" />
    <line x1="150" y1="120" x2="180" y2="140" class="image" />
    <line x1="150" y1="160" x2="120" y2="200" class="image" />
    <line x1="150" y1="160" x2="180" y2="200" class="image" />
    <!-- Action of using -->
    <line x1="150" y1="160" x2="50" y2="120" class="image" />
  </g>
</svg>