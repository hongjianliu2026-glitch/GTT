<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deem</text>
  <text x="50" y="120" class="subtitle">[diːm] v. 认为，视为</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + em (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考，"向下拿(de-em)"
    <tspan x="50" dy="25">取一个决定，这个决定就是他'认为(deem)'的事情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She deemed it necessary to take action.
  </text>
  <text x="50" y="310" class="content">
    她认为有必要采取行动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thought bubble -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Arrow pointing down -->
    <line x1="175" y1="175" x2="175" y2="250" class="image" />
    <polygon points="170,250 180,250 175,260" class="image" />
    <!-- Decision -->
    <rect x="150" y="270" width="50" height="30" class="image" />
    <text x="160" y="290" class="content">决定</text>
  </g>
</svg>