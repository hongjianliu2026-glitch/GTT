<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">traditionalist</text>
  <text x="50" y="120" class="subtitle">[trəˈdɪʃənəlɪst] n. 传统主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tradit (传递) + -ion (名词后缀) + -al (形容词后缀) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个传统主义者，他紧紧抱着一本古老的书籍，
    <tspan x="50" dy="25">这本书是他家族世代相传的宝物，象征着他对传统的坚守。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The traditionalist in the family always follows the old customs.
  </text>
  <text x="50" y="310" class="content">
    家族中的传统主义者总是遵循旧习俗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old book -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="50" x2="180" y2="50" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="110" x2="180" y2="110" class="image" />
    <!-- Traditionalist -->
    <circle cx="100" cy="200" r="30" class="image" />
    <line x1="100" y1="230" x2="100" y2="300" class="image" />
    <line x1="100" y1="250" x2="50" y2="280" class="image" />
    <line x1="100" y1="250" x2="150" y2="280" class="image" />
    <line x1="100" y1="300" x2="50" y2="350" class="image" />
    <line x1="100" y1="300" x2="150" y2="350" class="image" />
    <!-- Holding the book -->
    <line x1="100" y1="230" x2="100" y2="150" class="image" />
  </g>
</svg>