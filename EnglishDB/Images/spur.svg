<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spur</text>
  <text x="50" y="120" class="subtitle">[spɜːr] n. 马刺，刺激；v. 刺激，激励</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spur (马刺)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一匹马被马刺"刺激(spur)"，
    <tspan x="50" dy="25">它立刻加速奔跑，这就是spur的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coach's words acted as a spur to the team's performance.
  </text>
  <text x="50" y="310" class="content">
    教练的话对团队的表现起到了激励作用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Horse body -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Horse leg -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Horse leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Horse leg -->
    <line x1="50" y1="130" x2="100" y2="120" class="image" /> <!-- Horse neck -->
    <circle cx="120" cy="100" r="20" class="image" /> <!-- Horse head -->
    <line x1="120" y1="120" x2="140" y2="140" class="image" /> <!-- Horse ear -->
    <line x1="120" y1="120" x2="100" y2="140" class="image" /> <!-- Horse ear -->

    <!-- Spur -->
    <line x1="30" y1="150" x2="10" y2="170" class="image" />
    <line x1="30" y1="150" x2="50" y2="170" class="image" />
    <line x1="30" y1="150" x2="30" y2="170" class="image" />
  </g>
</svg>