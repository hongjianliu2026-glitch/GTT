<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inducement</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdjuːsmənt] n. 诱因，激励</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + duce (引导) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磁铁，"引导(duce)"
    <tspan x="50" dy="25">金属物体"进入(in)"它的磁场，</tspan>
    <tspan x="50" dy="25">这个磁铁就是一种"诱因(inducement)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bonus was a strong inducement for the employees to work harder.
  </text>
  <text x="50" y="310" class="content">
    奖金是激励员工更加努力工作的强大诱因。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnet -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Metal objects -->
    <circle cx="70" cy="100" r="15" class="image" />
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="170" cy="100" r="15" class="image" />
    <circle cx="220" cy="100" r="15" class="image" />
    <circle cx="270" cy="100" r="15" class="image" />
    <!-- Lines indicating attraction -->
    <line x1="70" y1="100" x2="50" y2="20" class="image" />
    <line x1="120" y1="100" x2="50" y2="20" class="image" />
    <line x1="170" y1="100" x2="50" y2="20" class="image" />
    <line x1="220" y1="100" x2="50" y2="20" class="image" />
    <line x1="270" y1="100" x2="50" y2="20" class="image" />
  </g>
</svg>