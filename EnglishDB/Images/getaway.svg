<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">getaway</text>
  <text x="50" y="120" class="subtitle">[ˈɡetəweɪ] n. 逃走，逃跑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> get (得到) + away (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个罪犯在警察的追捕下，"得到(get)"
    <tspan x="50" dy="25">机会"离开(away)"，成功逃脱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thief made a quick getaway in his car.
  </text>
  <text x="50" y="310" class="content">
    小偷迅速开车逃走了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Car -->
    <rect x="250" y="70" width="80" height="40" class="image" />
    <circle cx="270" cy="110" r="10" class="image" />
    <circle cx="310" cy="110" r="10" class="image" />
    <!-- Police -->
    <rect x="50" y="70" width="40" height="80" class="image" />
    <line x1="70" y1="70" x2="70" y2="50" class="image" />
    <circle cx="70" cy="40" r="10" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
  </g>
</svg>