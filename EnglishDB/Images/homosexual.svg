<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">homosexual</text>
  <text x="50" y="120" class="subtitle">[ˌhoʊməˈsekʃuəl] adj. 同性恋的；n. 同性恋者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> homo- (相同) + sex (性别) + -ual (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人，他们"性别相同(homo-sex)"，
    <tspan x="50" dy="25">彼此相爱，这就是同性恋(homosexual)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She came out as a homosexual in her late twenties.
  </text>
  <text x="50" y="310" class="content">
    她在二十多岁时公开了自己的同性恋身份。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Hearts -->
    <path d="M 50 130 Q 100 150 150 130" class="image" />
    <path d="M 50 130 Q 100 110 150 130" class="image" />
    <!-- Labels -->
    <text x="40" y="180" class="content">相同性别</text>
    <text x="140" y="180" class="content">相同性别</text>
  </g>
</svg>