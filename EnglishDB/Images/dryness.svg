<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dryness</text>
  <text x="50" y="120" class="subtitle">[ˈdraɪnəs] n. 干燥，干旱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dry (干燥的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片干旱的土地，"干燥(dry)"
    <tspan x="50" dy="25">到连一滴水都没有，这就是干旱(dryness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dryness of the desert made it difficult to find water.
  </text>
  <text x="50" y="310" class="content">
    沙漠的干燥使得寻找水源变得困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dry land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Cracks in the ground -->
    <line x1="50" y1="50" x2="300" y2="150" class="image" />
    <line x1="50" y1="150" x2="300" y2="50" class="image" />
    <line x1="100" y1="50" x2="250" y2="150" class="image" />
    <line x1="100" y1="150" x2="250" y2="50" class="image" />
    <!-- Cactus -->
    <rect x="150" y="100" width="20" height="80" class="image" />
    <line x1="160" y1="100" x2="160" y2="80" class="image" />
    <line x1="140" y1="100" x2="140" y2="80" class="image" />
  </g>
</svg>