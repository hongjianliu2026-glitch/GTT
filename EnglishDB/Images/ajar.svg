<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ajar</text>
  <text x="50" y="120" class="subtitle">[əˈdʒɑːr] adv. 半开，微开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (表示状态) + jar (门)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一扇门微微开着，"状态(a-)的门(jar)"
    <tspan x="50" dy="25">半开(ajar)，仿佛在邀请你进入。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The door was left ajar when they left.
  </text>
  <text x="50" y="310" class="content">
    他们离开时门是半开着的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Door handle -->
    <circle cx="180" cy="150" r="10" class="image" />
    <!-- Door ajar -->
    <line x1="200" y1="0" x2="300" y2="150" class="image" />
    <line x1="200" y1="300" x2="300" y2="150" class="image" />
  </g>
</svg>