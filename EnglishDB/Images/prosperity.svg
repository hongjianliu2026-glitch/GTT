<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prosperity</text>
  <text x="50" y="120" class="subtitle">[prɒˈsperɪti] n. 繁荣，昌盛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + sper (希望) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满希望(sper)的未来，"向前(pro)"
    <tspan x="50" dy="25">迈进，整个城市都充满了繁荣(prosperity)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The country enjoyed a period of prosperity after the war.
  </text>
  <text x="50" y="310" class="content">
    战后，这个国家经历了一段繁荣时期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="10" width="50" height="120" class="image" />
    <rect x="190" y="30" width="50" height="90" class="image" />
    <rect x="260" y="50" width="50" height="70" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Road -->
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <!-- Car -->
    <rect x="200" y="150" width="40" height="20" class="image" />
    <circle cx="210" cy="170" r="10" class="image" />
    <circle cx="240" cy="170" r="10" class="image" />
  </g>
</svg>