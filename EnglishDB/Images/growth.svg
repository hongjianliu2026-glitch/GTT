<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">growth</text>
  <text x="50" y="120" class="subtitle">[ɡroʊθ] n. 生长，增长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grow (生长) + -th (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗小种子在土壤中"生长(grow)"，
    <tspan x="50" dy="25">逐渐变成一棵大树，这就是"生长(growth)"的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's growth has been remarkable in recent years.
  </text>
  <text x="50" y="310" class="content">
    近年来，公司的增长非常显著。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soil -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Seed -->
    <circle cx="175" cy="140" r="10" class="image" />
    <!-- Small plant -->
    <line x1="175" y1="140" x2="175" y2="100" class="image" />
    <line x1="175" y1="100" x2="160" y2="70" class="image" />
    <line x1="175" y1="100" x2="190" y2="70" class="image" />
    <!-- Big tree -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="20" x2="150" y2="0" class="image" />
    <line x1="175" y1="20" x2="200" y2="0" class="image" />
    <line x1="175" y1="20" x2="130" y2="30" class="image" />
    <line x1="175" y1="20" x2="220" y2="30" class="image" />
  </g>
</svg>