<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">textile</text>
  <text x="50" y="120" class="subtitle">[ˈtɛkstaɪl] n. 纺织品，织物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> text (编织) + -ile (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的织布机，"编织(text)"
    <tspan x="50" dy="25">出美丽的布料，这些布料就是纺织品(textile)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She specializes in designing textiles for fashion.
  </text>
  <text x="50" y="310" class="content">
    她专门设计用于时尚的纺织品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Loom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Threads -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Weaving -->
    <line x1="100" y1="20" x2="100" y2="140" class="image" />
    <line x1="200" y1="20" x2="200" y2="140" class="image" />
    <line x1="300" y1="20" x2="300" y2="140" class="image" />
    <!-- Fabric -->
    <rect x="150" y="50" width="100" height="80" class="image" />
  </g>
</svg>