<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resourceful</text>
  <text x="50" y="120" class="subtitle">[rɪˈsɔːrsfəl] adj. 足智多谋的，资源丰富的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + source (资源) + -ful (充满的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个足智多谋的人，"再次(re-)"
    <tspan x="50" dy="25">利用各种"资源(source)"，总能找到解决问题的办法。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is very resourceful and always finds a way to solve problems.
  </text>
  <text x="50" y="310" class="content">
    她非常足智多谋，总能找到解决问题的方法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Lightbulb -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <!-- Resources -->
    <rect x="50" y="200" width="100" height="50" class="image" />
    <rect x="170" y="200" width="100" height="50" class="image" />
    <rect x="290" y="200" width="100" height="50" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="200" y2="200" class="image" />
    <line x1="250" y1="150" x2="300" y2="200" class="image" />
  </g>
</svg>