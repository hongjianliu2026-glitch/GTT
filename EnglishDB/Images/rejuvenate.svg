<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rejuvenate</text>
  <text x="50" y="120" class="subtitle">[rɪˈdʒuːvəneɪt] v. 使恢复活力，返老还童</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + juven (年轻) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老人喝下一瓶神奇的药水，"再次(re-)"
    <tspan x="50" dy="25">变得"年轻(juven)"，恢复了活力(rejuvenate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spa treatment rejuvenated her tired body.
  </text>
  <text x="50" y="310" class="content">
    水疗让她的疲惫身体恢复了活力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />

    <!-- Magic potion -->
    <rect x="150" y="80" width="50" height="100" class="image" />
    <circle cx="175" cy="70" r="10" class="image" />
    <line x1="175" y1="180" x2="175" y2="220" class="image" />

    <!-- Young person -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="200" class="image" />
    <line x1="300" y1="160" x2="320" y2="200" class="image" />
    <line x1="300" y1="140" x2="270" y2="130" class="image" />
    <line x1="300" y1="140" x2="330" y2="130" class="image" />
  </g>
</svg>