<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fumble</text>
  <text x="50" y="120" class="subtitle">[ˈfʌmbl] v. 笨拙地做，摸索</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fum (烟雾) + ble (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在烟雾缭绕的房间里，"笨拙地摸索(fum-ble)"
    <tspan x="50" dy="25">寻找钥匙，结果不小心把东西都打翻了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He fumbled in his pocket for his keys.
  </text>
  <text x="50" y="310" class="content">
    他在口袋里笨拙地摸索着钥匙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Smoke -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="80" cy="70" r="25" class="image" />
    <circle cx="110" cy="90" r="20" class="image" />
    <circle cx="140" cy="110" r="15" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Keys -->
    <rect x="250" y="120" width="20" height="40" class="image" />
    <line x1="260" y1="120" x2="260" y2="80" class="image" />
    <line x1="260" y1="80" x2="240" y2="60" class="image" />
    <line x1="260" y1="80" x2="280" y2="60" class="image" />
  </g>
</svg>