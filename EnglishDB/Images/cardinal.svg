<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cardinal</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːrdɪnl] adj. 主要的，基本的；n. 红衣主教</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> card (心) + inal (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个红衣主教，他的心(card)是如此重要，以至于他成为了教会中
    <tspan x="50" dy="25">最主要的(cardinal)人物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cardinal principles of the company are honesty and integrity.
  </text>
  <text x="50" y="310" class="content">
    公司的主要原则是诚实和正直。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cardinal hat -->
    <path d="M50 20 L100 20 L120 70 L80 70 Z" class="image" fill="#E74C3C" />
    <!-- Heart -->
    <path d="M150 50 C150 20, 200 20, 200 50 C200 80, 150 80, 150 50 Z" class="image" fill="#FF5733" />
    <!-- Cardinal -->
    <circle cx="100" cy="100" r="15" class="image" fill="#E74C3C" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
  </g>
</svg>