<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fox</text>
  <text x="50" y="120" class="subtitle">[fɒks] n. 狐狸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语“fox”，与古英语“fox”相关。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狡猾的狐狸(fox)在森林中穿梭，
    <tspan x="50" dy="25">它的尾巴像火焰一样在风中摇曳，</tspan>
    <tspan x="50" dy="25">它的眼睛闪烁着智慧的光芒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fox cleverly outwitted the hunters.
  </text>
  <text x="50" y="310" class="content">
    这只狐狸巧妙地骗过了猎人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Fox head -->
    <circle cx="100" cy="100" r="50" class="image" fill="#D35400" />
    <!-- Fox ears -->
    <polygon points="70,50 100,20 130,50" class="image" fill="#D35400" />
    <polygon points="70,55 100,25 130,55" class="image" fill="#D35400" />
    <!-- Fox eyes -->
    <circle cx="80" cy="90" r="5" class="image" fill="#000" />
    <circle cx="120" cy="90" r="5" class="image" fill="#000" />
    <!-- Fox nose -->
    <polygon points="95,110 105,110 100,120" class="image" fill="#000" />
    <!-- Fox tail -->
    <path d="M 100,150 C 150,150 150,200 100,200 C 50,200 50,150 100,150 Z" class="image" fill="#D35400" />
  </g>
</svg>