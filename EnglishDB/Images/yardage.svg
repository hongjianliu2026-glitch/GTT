<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yardage</text>
  <text x="50" y="120" class="subtitle">[ˈjɑːrdɪdʒ] n. 码数，码数总量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> yard (码) + -age (表示总量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的卷尺，上面标满了"码(yard)"的标记，
    <tspan x="50" dy="25">这些标记的总和就是码数总量(yardage)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The yardage of the fabric is enough for a dress.
  </text>
  <text x="50" y="310" class="content">
    这块布的码数足够做一件衣服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large measuring tape -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Yard marks -->
    <text x="60" y="35" class="content">1 yard</text>
    <text x="110" y="35" class="content">2 yards</text>
    <text x="160" y="35" class="content">3 yards</text>
    <text x="210" y="35" class="content">4 yards</text>
    <text x="260" y="35" class="content">5 yards</text>
  </g>
</svg>