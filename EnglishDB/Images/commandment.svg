<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commandment</text>
  <text x="50" y="120" class="subtitle">[kəˈmændmənt] n. 戒律，命令</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (强调) + mand (命令) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代国王站在高台上，"强调命令(com-mand)"
    <tspan x="50" dy="25">给臣民，这些命令就成为了不可违背的戒律(commandment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Ten Commandments are fundamental to many religious beliefs.
  </text>
  <text x="50" y="310" class="content">
    十诫是许多宗教信仰的基础。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- King on a throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="50" r="30" class="image" />
    <rect x="150" y="80" width="50" height="100" class="image" />
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="220" class="image" />
    <line x1="175" y1="200" x2="200" y2="220" class="image" />
    <line x1="175" y1="100" x2="125" y2="120" class="image" />
    <line x1="175" y1="100" x2="225" y2="120" class="image" />
    <!-- Command -->
    <text x="150" y="160" class="content" style="font-size: 24px; fill: #E74C3C;">命令</text>
  </g>
</svg>