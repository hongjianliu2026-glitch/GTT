<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">climax</text>
  <text x="50" y="120" class="subtitle">[ˈklaɪmæks] n. 高潮，顶点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cli- (倾斜) + max (最大)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座山峰，"倾斜到最大(cli-max)"
    <tspan x="50" dy="25">的高度，这就是高潮(climax)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The climax of the movie was breathtaking.
  </text>
  <text x="50" y="310" class="content">
    电影的高潮部分令人叹为观止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain peak -->
    <polygon points="0,150 150,0 300,150" class="image" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="30" class="image" />
    <!-- Climber -->
    <circle cx="150" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="140" y2="150" class="image" />
    <line x1="150" y1="130" x2="160" y2="150" class="image" />
    <line x1="150" y1="120" x2="130" y2="110" class="image" />
    <line x1="150" y1="120" x2="170" y2="110" class="image" />
  </g>
</svg>