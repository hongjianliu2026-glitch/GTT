<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conceive</text>
  <text x="50" y="120" class="subtitle">[kənˈsiːv] v. 构思，怀孕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + ceive (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在脑海中"一起拿(con-ceive)"
    <tspan x="50" dy="25">各种元素，构思出一个全新的艺术作品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She conceived the idea while walking in the park.
  </text>
  <text x="50" y="310" class="content">
    她在公园散步时构思了这个想法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Light bulb -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="80" y1="135" x2="120" y2="135" class="image" />
    <line x1="90" y1="145" x2="110" y2="145" class="image" />
    <!-- Artist -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Artwork -->
    <rect x="250" y="50" width="100" height="100" class="image" />
    <line x1="260" y1="60" x2="330" y2="60" class="image" />
    <line x1="260" y1="80" x2="330" y2="80" class="image" />
    <line x1="260" y1="100" x2="330" y2="100" class="image" />
    <line x1="260" y1="120" x2="330" y2="120" class="image" />
  </g>
</svg>