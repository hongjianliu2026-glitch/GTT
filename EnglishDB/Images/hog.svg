<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hog</text>
  <text x="50" y="120" class="subtitle">[hɒɡ] n. 猪，贪婪的人；v. 独占，霸占</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hog (猪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猪(hog)在泥潭里打滚，
    <tspan x="50" dy="25">它贪婪地霸占(hog)了整个泥潭，不让其他动物靠近。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The greedy man hogged all the food at the party.
  </text>
  <text x="50" y="310" class="content">
    那个贪婪的人在聚会上霸占了所有的食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Muddy pig -->
    <circle cx="100" cy="100" r="50" class="image" fill="#D35400" />
    <circle cx="100" cy="80" r="10" class="image" fill="#000" />
    <circle cx="120" cy="80" r="10" class="image" fill="#000" />
    <path d="M90 110 Q100 130 110 110" class="image" fill="#000" />
    <rect x="50" y="120" width="100" height="30" class="image" fill="#873600" />
    <line x1="70" y1="150" x2="70" y2="180" class="image" />
    <line x1="130" y1="150" x2="130" y2="180" class="image" />
    <line x1="70" y1="180" x2="130" y2="180" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="80" y1="190" x2="120" y2="190" class="image" />
  </g>
</svg>