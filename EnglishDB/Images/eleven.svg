<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eleven</text>
  <text x="50" y="120" class="subtitle">[ɪˈlevən] n. 十一</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> el (一) + even (双)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个数字"一(el)"和一个数字"二(even)"，
    <tspan x="50" dy="25">它们结合在一起，变成了"十一(eleven)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are eleven players in a soccer team.
  </text>
  <text x="50" y="310" class="content">
    一支足球队有十一名球员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Number 1 -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="50" y1="20" x2="30" y2="40" class="image" />
    <line x1="50" y1="20" x2="70" y2="40" class="image" />

    <!-- Number 2 -->
    <line x1="100" y1="20" x2="120" y2="20" class="image" />
    <line x1="120" y1="20" x2="120" y2="40" class="image" />
    <line x1="120" y1="40" x2="100" y2="40" class="image" />
    <line x1="100" y1="40" x2="100" y2="60" class="image" />
    <line x1="100" y1="60" x2="120" y2="60" class="image" />
    <line x1="120" y1="60" x2="120" y2="80" class="image" />
    <line x1="120" y1="80" x2="100" y2="80" class="image" />

    <!-- Combined number 11 -->
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <line x1="170" y1="20" x2="170" y2="100" class="image" />
  </g>
</svg>