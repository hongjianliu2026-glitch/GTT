<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thriller</text>
  <text x="50" y="120" class="subtitle">[ˈθrɪlər] n. 惊悚片，惊险小说</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thrill (兴奋，激动) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一部电影，主角在黑暗的森林中奔跑，
    <tspan x="50" dy="25">突然一只巨大的怪物从树后跳出，观众的心跳加速(thrill)，</tspan>
    <tspan x="50" dy="25">这就是一部惊悚片(thriller)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was a real thriller; it kept me on the edge of my seat.
  </text>
  <text x="50" y="310" class="content">
    这部电影真是惊悚片，让我一直坐在椅子边缘。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Monster -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="180" class="image" />
    <line x1="175" y1="150" x2="205" y2="180" class="image" />
    <line x1="175" y1="130" x2="225" y2="120" class="image" />
    <!-- Running person -->
    <circle cx="75" cy="150" r="15" class="image" />
    <line x1="75" y1="165" x2="75" y2="190" class="image" />
    <line x1="75" y1="190" x2="60" y2="210" class="image" />
    <line x1="75" y1="190" x2="90" y2="210" class="image" />
    <line x1="75" y1="175" x2="100" y2="165" class="image" />
  </g>
</svg>