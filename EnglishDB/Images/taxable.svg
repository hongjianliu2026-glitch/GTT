<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">taxable</text>
  <text x="50" y="120" class="subtitle">[ˈtæksəbl] adj. 应纳税的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tax (税) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钱袋，上面贴着"应纳税(taxable)"的标签，
    <tspan x="50" dy="25">象征着所有装在里面的钱都需要被征税。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The income from this property is taxable.
  </text>
  <text x="50" y="310" class="content">
    这笔财产的收入是应纳税的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Money bag -->
    <path d="M50 50 L300 50 Q350 50 350 100 L350 200 Q350 250 300 250 L50 250 Q0 250 0 200 L0 100 Q0 50 50 50 Z" class="image" />
    <!-- Tax label -->
    <rect x="150" y="120" width="100" height="50" class="image" />
    <text x="170" y="150" class="content" fill="#FFFFFF">taxable</text>
  </g>
</svg>