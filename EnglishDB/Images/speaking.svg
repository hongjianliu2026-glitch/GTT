<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">speaking</text>
  <text x="50" y="120" class="subtitle">[ˈspiːkɪŋ] n. 说话，演讲；adj. 说话的，有发言权的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> speak (说) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在舞台上，"正在说话(speaking)"，
    <tspan x="50" dy="25">他的声音传遍整个大厅，观众们都在聆听。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Public speaking can be nerve-wracking for some people.
  </text>
  <text x="50" y="310" class="content">
    公开演讲对一些人来说可能会很紧张。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Sound waves -->
    <path d="M175,120 C190,110 210,100 230,120" class="image" />
    <path d="M175,120 C160,110 140,100 120,120" class="image" />
    <path d="M175,120 C190,130 210,140 230,120" class="image" />
    <path d="M175,120 C160,130 140,140 120,120" class="image" />
  </g>
</svg>