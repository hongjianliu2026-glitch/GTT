<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .shine { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glisten</text>
  <text x="50" y="120" class="subtitle">[ˈɡlɪsn] v. 闪耀，闪烁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glis- (光滑) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一滴水珠在阳光下，"光滑地闪耀(glis-en)"，
    <tspan x="50" dy="25">仿佛整个世界都在闪烁(glisten)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dew on the grass glistened in the morning sun.
  </text>
  <text x="50" y="310" class="content">
    草地上的露珠在晨光中闪耀。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="shine" />
    <!-- Water drop -->
    <ellipse cx="250" cy="150" rx="30" ry="40" class="shine" />
    <!-- Reflection lines -->
    <line x1="230" y1="130" x2="270" y2="130" class="image" />
    <line x1="235" y1="140" x2="265" y2="140" class="image" />
    <line x1="240" y1="150" x2="260" y2="150" class="image" />
    <line x1="245" y1="160" x2="255" y2="160" class="image" />
  </g>
</svg>