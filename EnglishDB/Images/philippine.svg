<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Philippine</text>
  <text x="50" y="120" class="subtitle">[ˌfɪlɪˈpinɪn] adj. 菲律宾的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> phil- (爱) + -ine (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满爱的(phil-)岛屿，那里的人们热情友好，
    <tspan x="50" dy="25">这就是菲律宾(Philippine)的特色。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Philippine Islands are known for their beautiful beaches.
  </text>
  <text x="50" y="310" class="content">
    菲律宾群岛以其美丽的海滩而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Island -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" />
    <!-- Palm tree -->
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="90" y1="40" x2="110" y2="40" class="image" />
    <line x1="80" y1="60" x2="120" y2="60" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <!-- Heart -->
    <path d="M150,150 C140,130 160,130 150,150 C160,170 140,170 150,150 Z" class="image" />
  </g>
</svg>