<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antics</text>
  <text x="50" y="120" class="subtitle">[ˈæntɪks] n. 滑稽动作，古怪行为</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (反对) + -ics (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小丑在舞台上，"反对(anti-)"
    <tspan x="50" dy="25">常规，做出一系列滑稽的动作(antics)，</tspan>
    <tspan x="50" dy="25">逗得观众哈哈大笑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clown's antics made the children laugh.
  </text>
  <text x="50" y="310" class="content">
    小丑的滑稽动作逗得孩子们哈哈大笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clown -->
    <circle cx="100" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="100" y1="130" x2="100" y2="180" class="image" /> <!-- Body -->
    <line x1="100" y1="150" x2="70" y2="130" class="image" /> <!-- Left arm -->
    <line x1="100" y1="150" x2="130" y2="130" class="image" /> <!-- Right arm -->
    <line x1="100" y1="180" x2="70" y2="210" class="image" /> <!-- Left leg -->
    <line x1="100" y1="180" x2="130" y2="210" class="image" /> <!-- Right leg -->
    <!-- Hat -->
    <rect x="70" y="70" width="60" height="20" class="image" />
    <!-- Shoes -->
    <rect x="60" y="210" width="20" height="10" class="image" />
    <rect x="120" y="210" width="20" height="10" class="image" />
  </g>
</svg>