<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">furnishings</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrnɪʃɪŋz] n. 家具，装饰品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> furnish (提供) + -ings (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，"提供(furnish)"了各种家具和装饰品，
    <tspan x="50" dy="25">这些物品共同构成了房间的"furnishings"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new apartment was filled with beautiful furnishings.
  </text>
  <text x="50" y="310" class="content">
    新公寓里摆满了漂亮的家具和装饰品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sofa -->
    <rect x="50" y="20" width="250" height="60" class="image" />
    <!-- Table -->
    <rect x="120" y="100" width="100" height="40" class="image" />
    <!-- Lamp -->
    <line x1="250" y1="20" x2="250" y2="80" class="image" />
    <circle cx="250" cy="90" r="10" class="image" />
    <!-- Picture frame -->
    <rect x="20" y="100" width="80" height="60" class="image" />
    <!-- Carpet -->
    <rect x="50" y="160" width="250" height="20" class="image" />
  </g>
</svg>