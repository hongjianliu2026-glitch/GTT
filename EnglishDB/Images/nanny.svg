<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nanny</text>
  <text x="50" y="120" class="subtitle">[ˈnæni] n. 保姆，奶妈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nan (奶奶) + -y (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个慈祥的奶奶(nan)，她照顾着一群小宝宝，
    <tspan x="50" dy="25">就像一个保姆(nanny)一样细心呵护着他们。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hired a nanny to take care of her children.
  </text>
  <text x="50" y="310" class="content">
    她雇了一个保姆来照顾她的孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grandma -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />
    <!-- Baby -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="190" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Heart -->
    <path d="M200,100 C200,50 250,50 250,100 C250,150 200,150 200,100 Z" class="image" />
  </g>
</svg>