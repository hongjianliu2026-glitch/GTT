<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">third-quarter</text>
  <text x="50" y="120" class="subtitle">[θɜːrd ˈkwɔːrtər] n. 第三季度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> third (第三) + quarter (四分之一)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆形时钟，被分成四个部分，每个部分代表一个季度。
    <tspan x="50" dy="25">现在，指针指向第三个部分，这就是第三季度(third-quarter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's sales increased significantly in the third-quarter.
  </text>
  <text x="50" y="310" class="content">
    公司在第三季度的销售额显著增加。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Markings -->
    <line x1="175" y1="20" x2="175" y2="30" class="image" />
    <line x1="255" y1="100" x2="245" y2="100" class="image" />
    <line x1="175" y1="180" x2="175" y2="170" class="image" />
    <line x1="95" y1="100" x2="105" y2="100" class="image" />
    <!-- Highlight third quarter -->
    <path d="M175,100 L255,100 A80,80 0 0,1 175,180 Z" fill="#FFD700" opacity="0.5" />
  </g>
</svg>