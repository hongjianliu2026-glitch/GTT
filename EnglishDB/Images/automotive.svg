<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">automotive</text>
  <text x="50" y="120" class="subtitle">[ˌɔːtəˈmoʊtɪv] adj. 汽车的，自动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auto- (自己) + mot (移动) + ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车自己移动(auto-mot-ive)，不需要人驾驶，
    <tspan x="50" dy="25">就像未来的自动驾驶汽车一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The automotive industry is rapidly evolving.
  </text>
  <text x="50" y="310" class="content">
    汽车工业正在迅速发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="120" r="20" class="image" />
    <circle cx="300" cy="120" r="20" class="image" />
    <!-- Steering wheel -->
    <circle cx="175" cy="60" r="15" class="image" />
    <!-- Road -->
    <line x1="0" y1="150" x2="400" y2="150" class="image" />
    <line x1="0" y1="160" x2="400" y2="160" class="image" />
    <line x1="0" y1="170" x2="400" y2="170" class="image" />
  </g>
</svg>