<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">amputation</text>
  <text x="50" y="120" class="subtitle">[ˌæmpjuˈteɪʃn] n. 截肢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> amphi- (两边) + put (切)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生拿着一把巨大的剪刀，"从两边切下(amphi-put)"
    <tspan x="50" dy="25">病人的手臂，这就是截肢(amputation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor had to perform an amputation due to severe infection.
  </text>
  <text x="50" y="310" class="content">
    由于严重的感染，医生不得不进行截肢手术。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doctor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Scissors -->
    <line x1="70" y1="100" x2="120" y2="100" class="image" />
    <line x1="70" y1="100" x2="80" y2="90" class="image" />
    <line x1="70" y1="100" x2="80" y2="110" class="image" />
    <line x1="120" y1="100" x2="110" y2="90" class="image" />
    <line x1="120" y1="100" x2="110" y2="110" class="image" />
    <!-- Arm -->
    <rect x="150" y="80" width="100" height="40" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
  </g>
</svg>