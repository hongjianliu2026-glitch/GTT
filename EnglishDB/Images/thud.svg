<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thud</text>
  <text x="50" y="120" class="subtitle">[θʌd] n. 重击声，砰的一声；v. 发出重击声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thud (拟声词，模拟重击声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的西瓜从高处落下，"砰(thud)"的一声砸在地上，
    <tspan x="50" dy="25">声音响亮而震撼，这就是thud的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The book fell to the floor with a thud.
  </text>
  <text x="50" y="310" class="content">
    书砰的一声掉在了地板上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Watermelon -->
    <ellipse cx="175" cy="150" rx="50" ry="30" class="image" />
    <!-- Cracked watermelon -->
    <line x1="125" y1="150" x2="225" y2="150" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <!-- Impact sound -->
    <text x="175" y="100" text-anchor="middle" class="highlight">THUD!</text>
  </g>
</svg>