<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impregnate</text>
  <text x="50" y="120" class="subtitle">[ˈɪmprəɡneɪt] v. 使怀孕，使充满</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + preg (携带) + -nate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的种子"进入(im-)"一个花朵，"携带(preg)"着生命的力量，
    <tspan x="50" dy="25">使花朵"充满(impregnate)"了新的生命。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fertilized egg was impregnated with the father's DNA.
  </text>
  <text x="50" y="310" class="content">
    受精卵被注入了父亲的DNA。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Seed entering -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="100" x2="150" y2="100" class="image" />
    <!-- Life force -->
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
  </g>
</svg>