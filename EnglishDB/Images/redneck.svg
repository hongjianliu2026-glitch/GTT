<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">redneck</text>
  <text x="50" y="120" class="subtitle">[ˈrɛdˌnɛk] n. 红脖子（指美国南部农民或工人阶级白人）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> red (红色) + neck (脖子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农民在烈日下劳作，脖子晒得通红，
    <tspan x="50" dy="25">这个形象就是"红脖子(redneck)"的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The redneck in the movie was portrayed as a hardworking farmer.
  </text>
  <text x="50" y="310" class="content">
    电影中的红脖子被描绘成一个勤劳的农民。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="200" cy="100" r="50" fill="#F1C40F" />
    <!-- Farmer -->
    <circle cx="200" cy="200" r="30" fill="#D35400" />
    <line x1="200" y1="230" x2="200" y2="300" class="image" />
    <line x1="200" y1="250" x2="150" y2="280" class="image" />
    <line x1="200" y1="250" x2="250" y2="280" class="image" />
    <line x1="200" y1="300" x2="150" y2="350" class="image" />
    <line x1="200" y1="300" x2="250" y2="350" class="image" />
    <!-- Red neck -->
    <rect x="170" y="170" width="60" height="30" fill="#E74C3C" />
  </g>
</svg>