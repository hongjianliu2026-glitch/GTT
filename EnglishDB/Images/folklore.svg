<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">folklore</text>
  <text x="50" y="120" class="subtitle">[ˈfoʊklɔːr] n. 民间传说</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> folk (人们) + lore (知识)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群村民围坐在篝火旁，"人们(folk)"
    <tspan x="50" dy="25">讲述着古老的"知识(lore)"，这些故事就是民间传说(folklore)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The town's folklore includes many ghost stories.
  </text>
  <text x="50" y="310" class="content">
    这个小镇的民间传说包括许多鬼故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Campfire -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="85" y1="70" x2="115" y2="70" class="image" />
    <line x1="100" y1="40" x2="100" y2="100" class="image" />
    <!-- Villagers -->
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="100" cy="180" r="15" class="image" />
    <!-- Storytelling -->
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
  </g>
</svg>