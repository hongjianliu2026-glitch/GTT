<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .poison { fill: #8E44AD; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">poisoning</text>
  <text x="50" y="120" class="subtitle">[ˈpɔɪzənɪŋ] n. 中毒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poison (毒) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人正在喝下一杯"有毒的(poison)"饮料，
    <tspan x="50" dy="25">他的脸色逐渐变绿，这就是中毒(poisoning)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef accidentally caused food poisoning.
  </text>
  <text x="50" y="310" class="content">
    厨师不小心导致了食物中毒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Poison bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="20" class="image poison" />
    <!-- Person drinking -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="120" y2="220" class="image" />
    <line x1="150" y1="180" x2="180" y2="220" class="image" />
    <line x1="150" y1="150" x2="200" y2="140" class="image" />
    <!-- Green face -->
    <circle cx="150" cy="100" r="25" class="image poison" />
  </g>
</svg>