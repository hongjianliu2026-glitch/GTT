<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bikini</text>
  <text x="50" y="120" class="subtitle">[bɪˈkiːni] n. 比基尼泳衣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自太平洋马绍尔群岛的比基尼环礁(Bikini Atoll)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阳光明媚的海滩，一位穿着比基尼的女士在沙滩上晒太阳，
    <tspan x="50" dy="25">她的泳衣就像比基尼环礁一样引人注目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a red bikini to the beach party.
  </text>
  <text x="50" y="310" class="content">
    她穿着红色的比基尼去海滩派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Beach -->
    <rect x="0" y="150" width="350" height="150" fill="#D4AC0D" />
    <!-- Bikini -->
    <rect x="150" y="170" width="50" height="30" fill="#E74C3C" />
    <rect x="150" y="200" width="50" height="30" fill="#E74C3C" />
    <!-- Woman -->
    <circle cx="175" cy="130" r="20" fill="#F39C12" />
    <line x1="175" y1="150" x2="175" y2="200" stroke="#F39C12" stroke-width="10" />
    <line x1="175" y1="200" x2="150" y2="250" stroke="#F39C12" stroke-width="10" />
    <line x1="175" y1="200" x2="200" y2="250" stroke="#F39C12" stroke-width="10" />
    <line x1="175" y1="170" x2="120" y2="160" stroke="#F39C12" stroke-width="10" />
    <line x1="175" y1="170" x2="230" y2="160" stroke="#F39C12" stroke-width="10" />
  </g>
</svg>