<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">illicit</text>
  <text x="50" y="120" class="subtitle">[ɪˈlɪsɪt] adj. 非法的，不正当的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> il- (不) + licit (允许)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个警察在夜晚巡逻，发现一个"不被允许(il-licit)"
    <tspan x="50" dy="25">的行为，立即制止，这就是非法的(illicit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sale of illicit drugs is strictly prohibited.
  </text>
  <text x="50" y="310" class="content">
    非法毒品的销售是被严格禁止的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Police officer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Handcuffs -->
    <rect x="60" y="90" width="30" height="20" class="image" />
    <rect x="60" y="110" width="30" height="20" class="image" />
    <!-- Criminal -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="120" y1="130" x2="170" y2="120" class="image" />
    <!-- Night scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="300" cy="20" r="20" class="image" />
    <line x1="300" y1="40" x2="300" y2="200" class="image" />
  </g>
</svg>