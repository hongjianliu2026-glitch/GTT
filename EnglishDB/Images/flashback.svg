<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flashback</text>
  <text x="50" y="120" class="subtitle">[ˈflæʃbæk] n. 闪回，倒叙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flash (闪光) + back (回)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个电影场景，突然"闪光(flash)"
    <tspan x="50" dy="25">回到过去(back)，这就是闪回(flashback)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie used a flashback to reveal the protagonist's past.
  </text>
  <text x="50" y="310" class="content">
    电影使用闪回来揭示主角的过去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flash of light -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="70" x2="300" y2="70" class="image" />
    <line x1="50" y1="90" x2="300" y2="90" class="image" />
    <!-- Old film reel -->
    <rect x="100" y="120" width="150" height="100" class="image" />
    <circle cx="120" cy="170" r="10" class="image" />
    <circle cx="230" cy="170" r="10" class="image" />
    <!-- Arrow pointing back -->
    <line x1="200" y1="250" x2="200" y2="350" class="image" />
    <polygon points="190,350 210,350 200,370" class="image" />
  </g>
</svg>