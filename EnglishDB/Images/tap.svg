<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tap</text>
  <text x="50" y="120" class="subtitle">[tæp] v. 轻敲，轻拍；n. 水龙头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tap (轻敲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调皮的小孩在轻轻敲打(tap)水龙头，
    <tspan x="50" dy="25">水龙头突然喷出水来，小孩吓了一跳！</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tapped the keys lightly on the piano.
  </text>
  <text x="50" y="310" class="content">
    她轻轻地敲打着钢琴键。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water tap -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <circle cx="50" cy="150" r="20" class="image" />
    <!-- Hand tapping -->
    <line x1="120" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="140" y2="90" class="image" />
    <line x1="150" y1="100" x2="140" y2="110" class="image" />
    <!-- Water splash -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="220" cy="110" r="10" class="image" />
    <circle cx="210" cy="120" r="10" class="image" />
  </g>
</svg>