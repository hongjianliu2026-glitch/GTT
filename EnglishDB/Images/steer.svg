<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">steer</text>
  <text x="50" y="120" class="subtitle">[stɪər] v. 驾驶，掌舵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + -eer (从事...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个船长站在船头，"站立(st-)"
    <tspan x="50" dy="25">并掌控(eer)着船的方向，这就是掌舵(steer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The captain steered the ship through the storm.
  </text>
  <text x="50" y="310" class="content">
    船长在暴风雨中驾驶着船。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 175,120 75,120" class="image" />
    <!-- Captain -->
    <circle cx="125" cy="100" r="15" class="image" />
    <line x1="125" y1="115" x2="125" y2="150" class="image" />
    <line x1="125" y1="150" x2="105" y2="180" class="image" />
    <line x1="125" y1="150" x2="145" y2="180" class="image" />
    <line x1="125" y1="130" x2="150" y2="120" class="image" />
    <!-- Steering wheel -->
    <circle cx="125" cy="80" r="10" class="image" />
    <line x1="125" y1="70" x2="125" y2="90" class="image" />
    <line x1="115" y1="80" x2="135" y2="80" class="image" />
  </g>
</svg>