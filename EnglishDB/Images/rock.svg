<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rock</text>
  <text x="50" y="120" class="subtitle">[rɒk] n. 岩石，摇滚乐；v. 摇动，使震动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roc (源自拉丁语 "rota"，意为轮子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块巨大的岩石(rock)，它像轮子(rota)一样滚动，
    <tspan x="50" dy="25">引发了一场地震，震撼了整个山谷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The band's rock music was very popular.
  </text>
  <text x="50" y="310" class="content">
    这个乐队的摇滚音乐非常受欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rock -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Rolling rock -->
    <circle cx="100" cy="75" r="50" class="image" />
    <!-- Cracks -->
    <line x1="50" y1="20" x2="150" y2="130" class="image" />
    <line x1="50" y1="130" x2="150" y2="20" class="image" />
    <!-- Earthquake -->
    <line x1="220" y1="75" x2="350" y2="75" class="image" />
    <line x1="220" y1="75" x2="220" y2="150" class="image" />
    <line x1="350" y1="75" x2="350" y2="150" class="image" />
  </g>
</svg>