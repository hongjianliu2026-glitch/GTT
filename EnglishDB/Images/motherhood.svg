<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">motherhood</text>
  <text x="50" y="120" class="subtitle">[ˈmʌðərhʊd] n. 母性，母亲身份</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mother (母亲) + -hood (状态或性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位母亲怀抱着她的孩子，"母性(motherhood)"
    <tspan x="50" dy="25">的光辉在她脸上闪耀，象征着无尽的爱与关怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She embraced motherhood with joy and dedication.
  </text>
  <text x="50" y="310" class="content">
    她满怀喜悦和奉献地拥抱了母亲的身份。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />
    <!-- Child -->
    <circle cx="120" cy="120" r="20" class="image" />
    <line x1="120" y1="140" x2="120" y2="170" class="image" />
    <line x1="120" y1="155" x2="100" y2="150" class="image" />
    <line x1="120" y1="155" x2="140" y2="150" class="image" />
    <line x1="120" y1="170" x2="100" y2="190" class="image" />
    <line x1="120" y1="170" x2="140" y2="190" class="image" />
    <!-- Heart -->
    <path d="M150,100 C150,100 160,80 180,80 C200,80 210,100 210,100 C210,100 200,120 180,120 C160,120 150,100 150,100 Z" class="image" />
  </g>
</svg>