<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .milk { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">milk</text>
  <text x="50" y="120" class="subtitle">[mɪlk] n. 牛奶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 milc，与古英语 meoluc 相关，意为“牛奶”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在挤奶，"挤出(milk)"
    <tspan x="50" dy="25">新鲜的牛奶，这些牛奶就构成了我们日常的饮品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She drinks a glass of milk every morning.
  </text>
  <text x="50" y="310" class="content">
    她每天早上喝一杯牛奶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Milk container -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Milk inside -->
    <rect x="10" y="10" width="130" height="180" class="milk" />
    <!-- Farmer -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Cow -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="280" y2="220" class="image" />
    <line x1="300" y1="180" x2="320" y2="220" class="image" />
    <line x1="300" y1="150" x2="340" y2="140" class="image" />
    <!-- Milk stream -->
    <line x1="300" y1="130" x2="175" y2="100" class="image" />
  </g>
</svg>