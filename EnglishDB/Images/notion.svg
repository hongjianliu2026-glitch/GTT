<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">notion</text>
  <text x="50" y="120" class="subtitle">[ˈnoʊʃn] n. 概念，观念</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> not (知道) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考，"知道(not)"
    <tspan x="50" dy="25">并形成了一个概念(notion)，这个概念就像</tspan>
    <tspan x="50" dy="25">一个灯泡在脑海中亮起。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a clear notion of what she wanted to achieve.
  </text>
  <text x="50" y="310" class="content">
    她对自己想要实现的目标有一个清晰的概念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Light bulb -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="80" y1="150" x2="120" y2="150" class="image" />
    <line x1="90" y1="140" x2="110" y2="160" class="image" />
    <line x1="90" y1="160" x2="110" y2="140" class="image" />
  </g>
</svg>