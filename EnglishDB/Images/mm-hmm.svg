<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mm-hmm</text>
  <text x="50" y="120" class="subtitle">[m-hm] int. 嗯哼，表示同意或理解</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，拟声词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在听你说话时，轻轻点头并发出"嗯哼(mm-hmm)"的声音，
    <tspan x="50" dy="25">表示他完全理解并同意你的观点。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> "Are you following me?" "Mm-hmm, I get it."
  </text>
  <text x="50" y="310" class="content">
    "你听懂了吗？" "嗯哼，我明白了。"
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head with nodding -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <!-- Mouth -->
    <line x1="35" y1="65" x2="65" y2="65" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="40" r="5" class="image" />
    <circle cx="60" cy="40" r="5" class="image" />
  </g>
</svg>