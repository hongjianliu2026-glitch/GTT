<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">renewal</text>
  <text x="50" y="120" class="subtitle">[rɪˈnuːəl] n. 更新，恢复</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + new (新的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵枯萎的树，"再次(re-)"
    <tspan x="50" dy="25">长出新的(new)绿叶，这就是更新(renewal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The renewal of the contract was announced yesterday.
  </text>
  <text x="50" y="310" class="content">
    合同的续签昨天宣布了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="100" y1="0" x2="100" y2="150" class="image" />
    <!-- Old leaves -->
    <line x1="80" y1="20" x2="120" y2="20" class="image" />
    <line x1="80" y1="40" x2="120" y2="40" class="image" />
    <line x1="80" y1="60" x2="120" y2="60" class="image" />
    <!-- New leaves -->
    <line x1="90" y1="80" x2="110" y2="80" class="image" />
    <line x1="90" y1="100" x2="110" y2="100" class="image" />
    <line x1="90" y1="120" x2="110" y2="120" class="image" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="30" class="image" />
  </g>
</svg>