<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mightily</text>
  <text x="50" y="120" class="subtitle">[ˈmaɪtɪli] adv. 非常，极其</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> might (力量) + -ily (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大力士，"用尽全力(mightily)"
    <tspan x="50" dy="25">举起一座山，这种力量让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He lifted the heavy box mightily.
  </text>
  <text x="50" y="310" class="content">
    他非常用力地举起了那个沉重的箱子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,150 150,0 300,150" class="image" />
    <!-- Strongman -->
    <circle cx="150" cy="180" r="20" class="image" />
    <line x1="150" y1="200" x2="150" y2="280" class="image" />
    <line x1="150" y1="280" x2="120" y2="320" class="image" />
    <line x1="150" y1="280" x2="180" y2="320" class="image" />
    <line x1="150" y1="240" x2="100" y2="220" class="image" />
    <line x1="150" y1="240" x2="200" y2="220" class="image" />
    <!-- Arms lifting -->
    <line x1="150" y1="200" x2="75" y2="150" class="image" />
    <line x1="150" y1="200" x2="225" y2="150" class="image" />
  </g>
</svg>