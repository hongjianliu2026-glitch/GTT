<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turn</text>
  <text x="50" y="120" class="subtitle">[tɜːrn] v. 转动，转向；n. 轮流，转弯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> turn (转动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个车轮在不停地"转动(turn)"，
    <tspan x="50" dy="25">它不仅带动了车辆前进，还让每个人都轮流(turn)驾驶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She took a sharp turn at the intersection.
  </text>
  <text x="50" y="310" class="content">
    她在十字路口急转弯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wheel -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Spokes -->
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Car -->
    <rect x="150" y="70" width="100" height="60" class="image" />
    <rect x="160" y="50" width="80" height="20" class="image" />
    <!-- Road -->
    <line x1="0" y1="150" x2="300" y2="150" class="image" />
    <line x1="200" y1="150" x2="250" y2="200" class="image" />
  </g>
</svg>