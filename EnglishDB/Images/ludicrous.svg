<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ludicrous</text>
  <text x="50" y="120" class="subtitle">[ˈluːdɪkrəs] adj. 荒谬的，可笑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ludi- (游戏) + -crous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着小丑服装的人在玩一个"游戏(ludi-)"，
    <tspan x="50" dy="25">但他的行为却极其荒谬(ludicrous)，让人忍俊不禁。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His idea of wearing a banana suit to the formal event was ludicrous.
  </text>
  <text x="50" y="310" class="content">
    他穿着香蕉服去正式场合的想法非常荒谬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clown -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="130" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="130" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Banana suit -->
    <rect x="20" y="130" width="60" height="50" class="image" />
    <line x1="20" y1="130" x2="80" y2="130" class="image" />
    <line x1="20" y1="155" x2="80" y2="155" class="image" />
    <line x1="20" y1="180" x2="80" y2="180" class="image" />
  </g>
</svg>