<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shorten</text>
  <text x="50" y="120" class="subtitle">[ˈʃɔːrtn] v. 缩短，减少</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> short (短) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把剪刀"使(en)"一条长长的绳子"变短(short)"，
    <tspan x="50" dy="25">这就是缩短(shorten)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to shorten the dress to make it more fashionable.
  </text>
  <text x="50" y="310" class="content">
    她决定把裙子改短，使其更时尚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scissors -->
    <path d="M10 100 L30 100 L40 80 L50 100 L70 100 L80 80 L90 100 L110 100" class="image" />
    <path d="M10 120 L30 120 L40 140 L50 120 L70 120 L80 140 L90 120 L110 120" class="image" />
    <!-- Rope -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="60" y1="50" x2="60" y2="150" class="image" />
    <line x1="70" y1="50" x2="70" y2="150" class="image" />
    <line x1="80" y1="50" x2="80" y2="150" class="image" />
    <line x1="90" y1="50" x2="90" y2="150" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <!-- Shortened rope -->
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="60" y1="50" x2="60" y2="100" class="image" />
    <line x1="70" y1="50" x2="70" y2="100" class="image" />
    <line x1="80" y1="50" x2="80" y2="100" class="image" />
    <line x1="90" y1="50" x2="90" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
  </g>
</svg>