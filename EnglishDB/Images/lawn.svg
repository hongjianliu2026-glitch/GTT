<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .grass { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lawn</text>
  <text x="50" y="120" class="subtitle">[lɔːn] n. 草坪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "laune"，意为"草地"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片翠绿的草坪(lawn)，上面有几只小鸟在跳跃，
    <tspan x="50" dy="25">草坪的边缘修剪得整整齐齐，就像一块绿色的地毯。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children played on the lawn during the picnic.
  </text>
  <text x="50" y="310" class="content">
    孩子们在野餐时在草坪上玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lawn -->
    <rect x="0" y="0" width="350" height="200" class="grass" />
    <!-- Birds -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="60" r="10" class="image" />
    <!-- Edges -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="0" x2="0" y2="200" class="image" />
    <line x1="350" y1="0" x2="350" y2="200" class="image" />
  </g>
</svg>