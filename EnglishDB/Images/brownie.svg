<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #7B7D7D; }
      .content { font: 18px sans-serif; fill: #515A5A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #154360; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .brownie { fill: #8D4500; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brownie</text>
  <text x="50" y="120" class="subtitle">[ˈbraʊni] n. 布朗尼（一种巧克力蛋糕）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自苏格兰传说中的小精灵，因其棕色皮肤而得名。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小精灵(brownie)在厨房里，
    <tspan x="50" dy="25">用魔法制作出一块美味的巧克力蛋糕(brownie)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She baked a batch of brownies for the party.
  </text>
  <text x="50" y="310" class="content">
    她为派对烤了一盘布朗尼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brownie -->
    <rect x="0" y="0" width="200" height="100" class="brownie" />
    <!-- Chocolate chips -->
    <circle cx="30" cy="50" r="10" class="image" />
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="130" cy="50" r="10" class="image" />
    <circle cx="180" cy="50" r="10" class="image" />
    <!-- Brownie top -->
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <line x1="0" y1="10" x2="200" y2="10" class="image" />
    <line x1="0" y1="20" x2="200" y2="20" class="image" />
    <line x1="0" y1="30" x2="200" y2="30" class="image" />
    <line x1="0" y1="40" x2="200" y2="40" class="image" />
    <line x1="0" y1="50" x2="200" y2="50" class="image" />
    <line x1="0" y1="60" x2="200" y2="60" class="image" />
    <line x1="0" y1="70" x2="200" y2="70" class="image" />
    <line x1="0" y1="80" x2="200" y2="80" class="image" />
    <line x1="0" y1="90" x2="200" y2="90" class="image" />
    <line x1="0" y1="100" x2="200" y2="100" class="image" />
  </g>
</svg>