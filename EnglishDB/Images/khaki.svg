<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">khaki</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːki] n. 卡其布，卡其色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自印地语 "khākī"，意为“尘土色的”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个士兵穿着卡其布制服，在沙漠中行军，
    <tspan x="50" dy="25">尘土飞扬，衣服变成了尘土色(khaki)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldier wore a khaki uniform in the desert.
  </text>
  <text x="50" y="310" class="content">
    士兵在沙漠中穿着卡其布制服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <circle cx="75" cy="50" r="30" class="image" />
    <line x1="75" y1="80" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="25" y2="200" class="image" />
    <line x1="75" y1="150" x2="125" y2="200" class="image" />
    <line x1="75" y1="100" x2="100" y2="120" class="image" />
    <!-- Desert -->
    <rect x="0" y="200" width="350" height="100" class="image" />
    <line x1="0" y1="220" x2="350" y2="220" class="image" />
    <line x1="0" y1="240" x2="350" y2="240" class="image" />
    <line x1="0" y1="260" x2="350" y2="260" class="image" />
    <line x1="0" y1="280" x2="350" y2="280" class="image" />
  </g>
</svg>