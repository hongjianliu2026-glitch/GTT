<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nagging</text>
  <text x="50" y="120" class="subtitle">[ˈnæɡɪŋ] adj. 唠叨的，纠缠不休的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nag (马嚼子) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个唠叨的人像马嚼子一样，"不停地唠叨(nag-ing)"，
    <tspan x="50" dy="25">让人无法摆脱，就像马被嚼子控制一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her nagging voice kept me awake all night.
  </text>
  <text x="50" y="310" class="content">
    她唠叨的声音让我整晚都睡不着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Teeth -->
    <line x1="80" y1="90" x2="120" y2="90" class="image" />
    <line x1="80" y1="110" x2="120" y2="110" class="image" />
    <!-- Tongue -->
    <rect x="90" y="100" width="20" height="20" class="image" />
    <!-- Speech bubble -->
    <path d="M 150 80 Q 250 80 250 150 Q 250 220 150 220 Q 50 220 50 150 Q 50 80 150 80" class="image" />
    <!-- Text in speech bubble -->
    <text x="160" y="130" class="content">唠叨...</text>
  </g>
</svg>