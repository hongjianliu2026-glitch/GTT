<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">traditionally</text>
  <text x="50" y="120" class="subtitle">[trəˈdɪʃənəli] adv. 传统上，按惯例</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tradit- (传递) + -ion (名词后缀) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的村庄，村民们"传递(tradit-)"着
    <tspan x="50" dy="25">世代相传的传统(tradition)，这些传统在日常生活中被严格遵循(traditionally)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Traditionally, the festival is celebrated with a grand feast.
  </text>
  <text x="50" y="310" class="content">
    传统上，这个节日会以盛大的宴会来庆祝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- People -->
    <circle cx="75" cy="100" r="15" class="image" />
    <circle cx="145" cy="100" r="15" class="image" />
    <circle cx="215" cy="100" r="15" class="image" />
    <!-- Tradition -->
    <line x1="50" y1="150" x2="240" y2="150" class="image" />
    <line x1="50" y1="160" x2="240" y2="160" class="image" />
    <line x1="50" y1="170" x2="240" y2="170" class="image" />
    <text x="120" y="190" class="content" fill="#7F8C8D">Tradition</text>
  </g>
</svg>