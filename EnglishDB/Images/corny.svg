<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">corny</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːrni] adj. 陈腐的，老套的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> corn (玉米) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老套的笑话，就像"玉米(corn)"一样，
    <tspan x="50" dy="25">每个人都知道，毫无新意，这就是"陈腐的(corny)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His corny jokes always make her roll her eyes.
  </text>
  <text x="50" y="310" class="content">
    他那些老套的笑话总是让她翻白眼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Corn cob -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <circle cx="300" cy="50" r="20" class="image" />
    <!-- Eyes rolling -->
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
  </g>
</svg>