<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surprising</text>
  <text x="50" y="120" class="subtitle">[sərˈpraɪzɪŋ] adj. 令人惊讶的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (超过) + pris (抓住) + ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师突然从帽子里"抓住(pris)"
    <tspan x="50" dy="25">一只兔子，这"超过(sur)"了观众的预期，</tspan>
    <tspan x="50" dy="25">令人感到非常惊讶(surprising)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's trick was surprisingly amazing.
  </text>
  <text x="50" y="310" class="content">
    魔术师的把戏令人惊讶地精彩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hat -->
    <rect x="50" y="20" width="200" height="100" class="image" />
    <!-- Rabbit -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="120" y2="220" class="image" />
    <line x1="150" y1="180" x2="180" y2="220" class="image" />
    <line x1="150" y1="150" x2="120" y2="140" class="image" />
    <line x1="150" y1="150" x2="180" y2="140" class="image" />
    <!-- Audience -->
    <circle cx="50" cy="250" r="20" class="image" />
    <circle cx="150" cy="250" r="20" class="image" />
    <circle cx="250" cy="250" r="20" class="image" />
    <!-- Exclamation marks -->
    <text x="50" y="280" class="highlight">!</text>
    <text x="150" y="280" class="highlight">!</text>
    <text x="250" y="280" class="highlight">!</text>
  </g>
</svg>