<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">basal</text>
  <text x="50" y="120" class="subtitle">[ˈbeɪsəl] adj. 基础的，基底的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bas (基础) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的金字塔，它的"基底(bas)"
    <tspan x="50" dy="25">是最基础的部分，支撑着整个结构。</tspan>
    <tspan x="50" dy="25">这个基底就是"basal"，代表着最基础的、</tspan>
    <tspan x="50" dy="25">最根本的部分。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The basal layer of the skin is crucial for regeneration.
  </text>
  <text x="50" y="330" class="content">
    皮肤的基底层对于再生至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pyramid base -->
    <polygon points="100,200 200,200 150,100" class="image" />
    <!-- Pyramid body -->
    <polygon points="100,200 150,100 200,200" class="image" />
    <!-- Base label -->
    <text x="130" y="180" class="highlight">Basal</text>
  </g>
</svg>