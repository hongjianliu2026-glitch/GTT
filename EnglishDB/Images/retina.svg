<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retina</text>
  <text x="50" y="120" class="subtitle">[ˈretɪnə] n. 视网膜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再) + tina (网)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你的眼睛里有一张"网(tina)"，它负责接收光线并"再次(re-)"
    <tspan x="50" dy="25">处理成图像，这张网就是视网膜(retina)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The retina is crucial for vision.
  </text>
  <text x="50" y="310" class="content">
    视网膜对视觉至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Retina -->
    <path d="M 20 100 Q 50 50 100 100 T 180 100" class="image" />
    <path d="M 20 100 Q 50 150 100 100 T 180 100" class="image" />
    <!-- Light rays -->
    <line x1="200" y1="100" x2="180" y2="100" class="image" />
    <line x1="200" y1="80" x2="180" y2="90" class="image" />
    <line x1="200" y1="120" x2="180" y2="110" class="image" />
  </g>
</svg>