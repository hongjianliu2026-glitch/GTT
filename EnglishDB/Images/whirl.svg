<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whirl</text>
  <text x="50" y="120" class="subtitle">[wɜːrl] v. 旋转，急转；n. 旋转，急转</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> whirl (旋转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个舞者在舞台上，"急速旋转(whirl)"
    <tspan x="50" dy="25">，她的裙子像旋风一样飞舞，让人眼花缭乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dancer whirled around the stage gracefully.
  </text>
  <text x="50" y="310" class="content">
    舞者优雅地在舞台上旋转。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dancer -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <line x1="100" y1="140" x2="60" y2="130" class="image" />
    <!-- Whirl effect -->
    <path d="M100,100 A50,50 0 0,1 150,150" class="image" />
    <path d="M100,100 A50,50 0 0,0 50,150" class="image" />
    <path d="M100,100 A50,50 0 0,1 150,50" class="image" />
    <path d="M100,100 A50,50 0 0,0 50,50" class="image" />
  </g>
</svg>