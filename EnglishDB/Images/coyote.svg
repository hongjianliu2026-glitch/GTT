<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coyote</text>
  <text x="50" y="120" class="subtitle">[kaɪˈoʊti] n. 郊狼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> coy (害羞的) + ote (动物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只害羞的郊狼(coyote)，它总是躲在树丛中，
    <tspan x="50" dy="25">偷偷观察周围的环境，时刻保持警惕。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coyote is a common sight in the desert.
  </text>
  <text x="50" y="310" class="content">
    郊狼在沙漠中很常见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coyote -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Front leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Back leg -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front ear -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back ear -->
    <line x1="50" y1="130" x2="20" y2="120" class="image" /> <!-- Nose -->
    <line x1="50" y1="130" x2="80" y2="120" class="image" /> <!-- Mouth -->
    <!-- Bush -->
    <path d="M100,100 C120,80 150,80 170,100 C190,120 220,120 240,100" class="image" />
    <path d="M100,120 C120,100 150,100 170,120 C190,140 220,140 240,120" class="image" />
    <path d="M100,140 C120,120 150,120 170,140 C190,160 220,160 240,140" class="image" />
  </g>
</svg>