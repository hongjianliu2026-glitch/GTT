<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Federalist</text>
  <text x="50" y="120" class="subtitle">[fəˈdɛrəlɪst] n. 联邦主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> feder- (联盟) + -alist (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人手拉手，形成一个巨大的"联盟(feder-)"，
    <tspan x="50" dy="25">他们就是联邦主义者(Federalist)，致力于维护联邦的团结。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Federalist Papers were a series of essays advocating for the ratification of the U.S. Constitution.
  </text>
  <text x="50" y="310" class="content">
    《联邦党人文集》是一系列支持美国宪法批准的论文。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle representing the federation -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- People holding hands -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <!-- Faces -->
    <circle cx="125" cy="100" r="10" class="image" />
    <circle cx="225" cy="100" r="10" class="image" />
  </g>
</svg>