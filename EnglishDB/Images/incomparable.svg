<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incomparable</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkɒmpərəbl] adj. 无与伦比的，不可比拟的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + compar (比较) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钻石，"无法比较(in-compar-able)"
    <tspan x="50" dy="25">于其他任何宝石，因为它独一无二，无与伦比。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her beauty is incomparable.
  </text>
  <text x="50" y="310" class="content">
    她的美丽是无与伦比的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diamond -->
    <polygon points="175,10 225,10 250,75 200,125 150,75" class="image" />
    <!-- Star -->
    <polygon points="200,50 215,80 250,85 225,110 230,145 200,130 170,145 175,110 150,85 185,80" class="image" />
    <!-- Text -->
    <text x="150" y="180" class="content" text-anchor="middle">无与伦比</text>
  </g>
</svg>