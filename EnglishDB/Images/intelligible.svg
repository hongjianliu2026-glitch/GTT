<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intelligible</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtelɪdʒəbl] adj. 可理解的，明白易懂的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> intel- (在中间) + lig (选择) + -ible (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在一大堆信息中，"在中间选择(intel-lig)"
    <tspan x="50" dy="25">出那些能够被理解的部分，这些部分就是明白易懂的(intelligible)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher's explanation was so clear and intelligible that even the slowest student understood.
  </text>
  <text x="50" y="310" class="content">
    老师的解释非常清晰易懂，就连最慢的学生也理解了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Information cloud -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="150" cy="150" r="50" class="image" />
    <circle cx="200" cy="100" r="60" class="image" />
    <circle cx="250" cy="150" r="70" class="image" />
    <!-- Person selecting -->
    <circle cx="100" cy="250" r="20" class="image" />
    <line x1="100" y1="270" x2="100" y2="320" class="image" />
    <line x1="100" y1="320" x2="80" y2="350" class="image" />
    <line x1="100" y1="320" x2="120" y2="350" class="image" />
    <line x1="100" y1="290" x2="140" y2="280" class="image" />
    <!-- Arrow pointing to selected information -->
    <line x1="100" y1="250" x2="150" y2="150" class="image" />
    <polygon points="150,150 140,140 140,160" class="image" />
  </g>
</svg>