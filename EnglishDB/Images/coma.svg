<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coma</text>
  <text x="50" y="120" class="subtitle">[ˈkoʊmə] n. 昏迷，昏睡状态</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (完全) + a (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人完全陷入"昏迷(coma)"状态，
    <tspan x="50" dy="25">就像被包裹在一个巨大的茧中，无法动弹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the accident, he fell into a deep coma.
  </text>
  <text x="50" y="310" class="content">
    事故后，他陷入了深度昏迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in coma -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="200" class="image" />
    <line x1="100" y1="180" x2="150" y2="200" class="image" />
    <!-- Cocoon -->
    <path d="M50,100 Q50,50 100,50 T150,100 T100,150 T50,100" class="image" />
    <path d="M50,100 Q50,150 100,150 T150,100 T100,50 T50,100" class="image" />
  </g>
</svg>