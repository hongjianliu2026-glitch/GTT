<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shrill</text>
  <text x="50" y="120" class="subtitle">[ʃrɪl] adj. 尖锐的，刺耳的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shril (尖锐的声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟在清晨发出"尖锐(shril)"的叫声，
    <tspan x="50" dy="25">声音穿透了整个森林，让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The alarm clock's shrill sound woke me up.
  </text>
  <text x="50" y="310" class="content">
    闹钟的刺耳声音把我吵醒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="140" x2="30" y2="130" class="image" />
    <line x1="50" y1="140" x2="70" y2="130" class="image" />
    <line x1="50" y1="160" x2="30" y2="180" class="image" />
    <line x1="50" y1="160" x2="70" y2="180" class="image" />
    <!-- Sound waves -->
    <path d="M50,120 C60,110 80,110 90,120" class="image" />
    <path d="M50,130 C60,120 80,120 90,130" class="image" />
    <path d="M50,140 C60,130 80,130 90,140" class="image" />
    <path d="M50,150 C60,140 80,140 90,150" class="image" />
  </g>
</svg>