<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">old-growth</text>
  <text x="50" y="120" class="subtitle">[ˈoʊld ɡroʊθ] n. 原始森林，老树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> old (老的) + growth (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片古老的森林，"老的(old)"
    <tspan x="50" dy="25">树木"生长(growth)"了数百年，形成了原始森林(old-growth)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old-growth forest is home to many rare species.
  </text>
  <text x="50" y="310" class="content">
    这片原始森林是许多珍稀物种的家园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="50" y="0" width="50" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="75" y1="20" x2="20" y2="100" class="image" />
    <line x1="75" y1="20" x2="130" y2="100" class="image" />
    <line x1="75" y1="50" x2="20" y2="150" class="image" />
    <line x1="75" y1="50" x2="130" y2="150" class="image" />
    <!-- Tree leaves -->
    <circle cx="20" cy="100" r="15" class="image" />
    <circle cx="130" cy="100" r="15" class="image" />
    <circle cx="20" cy="150" r="15" class="image" />
    <circle cx="130" cy="150" r="15" class="image" />
  </g>
</svg>