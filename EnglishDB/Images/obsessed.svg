<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">obsessed</text>
  <text x="50" y="120" class="subtitle">[əbˈsɛst] adj. 着迷的，痴迷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (朝向) + sess (坐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被某种想法或事物"朝向(ob-)"并"坐(sess)"在心里，
    <tspan x="50" dy="25">无法摆脱，这就是"着迷(obsessed)"的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He became obsessed with the idea of winning the competition.
  </text>
  <text x="50" y="310" class="content">
    他对赢得比赛的念头着了迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person sitting -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Thought bubble -->
    <ellipse cx="100" cy="50" rx="80" ry="40" class="image" />
    <line x1="100" y1="90" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="50" y2="180" class="image" />
    <line x1="100" y1="150" x2="150" y2="180" class="image" />
    <!-- Idea symbol -->
    <circle cx="100" cy="50" r="10" class="image" />
    <line x1="100" y1="60" x2="100" y2="80" class="image" />
    <line x1="90" y1="70" x2="110" y2="70" class="image" />
  </g>
</svg>