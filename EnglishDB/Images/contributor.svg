<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contributor</text>
  <text x="50" y="120" class="subtitle">[kənˈtrɪbjətər] n. 贡献者，捐助者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + tribute (给予)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"共同给予(con-tribute)"
    <tspan x="50" dy="25">资源和想法，他们就是贡献者(contributor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a major contributor to the project.
  </text>
  <text x="50" y="310" class="content">
    她是这个项目的主要贡献者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Resources -->
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="250" y1="80" x2="250" y2="120" class="image" />
    <!-- Ideas -->
    <circle cx="50" cy="140" r="10" class="image" />
    <circle cx="150" cy="140" r="10" class="image" />
    <circle cx="250" cy="140" r="10" class="image" />
    <!-- Connecting lines -->
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="150" y1="70" x2="250" y2="70" class="image" />
    <line x1="50" y1="130" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="250" y2="130" class="image" />
  </g>
</svg>