<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sideways</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪdweɪz] adv. 向侧面地，斜向地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> side (侧面) + ways (方向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图穿过一个狭窄的门，他不得不"侧身(side)"
    <tspan x="50" dy="25">移动(ways)，这就是sideways的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had to walk sideways through the narrow alley.
  </text>
  <text x="50" y="310" class="content">
    她不得不侧身走过狭窄的小巷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Narrow door -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Person trying to pass -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="210" class="image" />
    <line x1="150" y1="180" x2="170" y2="210" class="image" />
    <line x1="150" y1="140" x2="190" y2="130" class="image" />
    <line x1="150" y1="140" x2="110" y2="130" class="image" />
    <!-- Sideways movement -->
    <line x1="150" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
  </g>
</svg>