<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enchantment</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtʃɑːntmənt] n. 魅力，着迷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + chant (唱) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔法师用歌声("唱(chant)")
    <tspan x="50" dy="25">施展魔法，使人们深深着迷("使...着迷(en-chant-ment)")。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beauty of the sunset cast an enchantment over the beach.
  </text>
  <text x="50" y="310" class="content">
    日落的美景使海滩笼罩在一种迷人的氛围中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Wand -->
    <line x1="50" y1="120" x2="100" y2="50" class="image" />
    <circle cx="100" cy="50" r="5" class="image" />
    <!-- Stars -->
    <circle cx="120" cy="70" r="3" class="image" />
    <circle cx="130" cy="60" r="3" class="image" />
    <circle cx="140" cy="80" r="3" class="image" />
    <!-- Enchanted people -->
    <circle cx="180" cy="100" r="15" class="image" />
    <line x1="180" y1="115" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="160" y2="180" class="image" />
    <line x1="180" y1="150" x2="200" y2="180" class="image" />
    <line x1="180" y1="130" x2="210" y2="120" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>