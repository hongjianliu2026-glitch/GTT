<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eradicate</text>
  <text x="50" y="120" class="subtitle">[ɪˈrædɪkeɪt] v. 根除，消灭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + radic (根) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个园丁拿着铲子，"拔出(e-radic)"
    <tspan x="50" dy="25">植物的根部，彻底消灭(eradicate)杂草。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government is determined to eradicate poverty.
  </text>
  <text x="50" y="310" class="content">
    政府决心根除贫困。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Plant -->
    <line x1="100" y1="100" x2="100" y2="180" class="image" />
    <line x1="100" y1="100" x2="80" y2="120" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
    <line x1="100" y1="100" x2="80" y2="80" class="image" />
    <line x1="100" y1="100" x2="120" y2="80" class="image" />
    <!-- Shovel -->
    <line x1="200" y1="100" x2="200" y2="180" class="image" />
    <line x1="200" y1="100" x2="180" y2="120" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
    <!-- Gardener -->
    <circle cx="200" cy="80" r="15" class="image" />
    <line x1="200" y1="95" x2="200" y2="130" class="image" />
    <line x1="200" y1="130" x2="180" y2="160" class="image" />
    <line x1="200" y1="130" x2="220" y2="160" class="image" />
    <line x1="200" y1="110" x2="230" y2="100" class="image" />
  </g>
</svg>