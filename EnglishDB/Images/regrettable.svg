<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">regrettable</text>
  <text x="50" y="120" class="subtitle">[rɪˈɡretəbl] adj. 令人遗憾的，可悲的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + gret (哭泣) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为一件"再次哭泣(re-gret)"的事情而感到悲伤，
    <tspan x="50" dy="25">这种事情就是"令人遗憾的(regrettable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was regrettable that the concert was canceled.
  </text>
  <text x="50" y="310" class="content">
    音乐会被取消是令人遗憾的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sad face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="35" y1="40" x2="45" y2="40" class="image" />
    <line x1="55" y1="40" x2="65" y2="40" class="image" />
    <path d="M35 60 Q50 80 65 60" class="image" />
    <!-- Tear drop -->
    <ellipse cx="50" cy="90" rx="10" ry="15" class="image" />
    <line x1="50" y1="105" x2="50" y2="120" class="image" />
  </g>
</svg>