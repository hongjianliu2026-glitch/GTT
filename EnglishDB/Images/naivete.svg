<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">naivete</text>
  <text x="50" y="120" class="subtitle">[ˌnaɪˈiːvteɪ] n. 天真，幼稚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> naïve (法语，天真的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在糖果店里，"天真地(naïve)"
    <tspan x="50" dy="25">相信所有的糖果都是免费的，这种天真(naivete)让人忍俊不禁。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her naivete about the world of finance was surprising.
  </text>
  <text x="50" y="310" class="content">
    她对金融世界的天真让人惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Candy store -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Candy jars -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Child -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Thought bubble -->
    <path d="M 20 80 Q 60 60 100 80 Q 140 100 180 80 Q 220 60 260 80" class="image" />
    <text x="120" y="70" class="content" text-anchor="middle">Free?</text>
  </g>
</svg>