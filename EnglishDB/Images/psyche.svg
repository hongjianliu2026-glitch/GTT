<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">psyche</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪki] n. 心灵，精神</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> psyche (灵魂，心灵)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蝴蝶，它的翅膀上绘有复杂的图案，
    <tspan x="50" dy="25">这些图案代表着人类的思想和情感，这就是"心灵(psyche)"的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The therapist helped her explore her psyche.
  </text>
  <text x="50" y="310" class="content">
    治疗师帮助她探索自己的心灵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Butterfly body -->
    <circle cx="200" cy="150" r="30" class="image" />
    <!-- Butterfly wings -->
    <path d="M170,120 Q100,50 170,180 Q240,250 310,180 Q380,110 310,120 Z" class="image" />
    <path d="M230,120 Q300,50 230,180 Q160,250 90,180 Q20,110 90,120 Z" class="image" />
    <!-- Thought bubbles -->
    <circle cx="150" cy="80" r="20" class="image" />
    <circle cx="250" cy="80" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
  </g>
</svg>