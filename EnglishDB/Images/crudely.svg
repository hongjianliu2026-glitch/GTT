<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crudely</text>
  <text x="50" y="120" class="subtitle">[ˈkruːdli] adv. 粗糙地，粗鲁地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crud (粗糙) + -ely (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠用"粗糙的(crud)"工具
    <tspan x="50" dy="25">快速地雕刻出一个粗糙的雕像，这就是"粗糙地(crudely)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The statue was crudely carved from a block of stone.
  </text>
  <text x="50" y="310" class="content">
    这座雕像是从一块石头上粗糙地雕刻出来的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rough stone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rough tools -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="40" x2="100" y2="40" class="image" />
    <line x1="50" y1="60" x2="100" y2="60" class="image" />
    <!-- Rough statue -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="175" y1="75" x2="225" y2="75" class="image" />
    <line x1="175" y1="125" x2="225" y2="125" class="image" />
  </g>
</svg>