<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spokesman</text>
  <text x="50" y="120" class="subtitle">[ˈspoʊksmən] n. 发言人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spoke (说话) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个站在讲台上的人，"说话的人(spoke-man)"
    <tspan x="50" dy="25">正在代表某个团体或组织发言，他就是发言人(spokesman)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's spokesman addressed the media.
  </text>
  <text x="50" y="310" class="content">
    公司的发言人向媒体发表了讲话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Podium -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Microphone -->
    <line x1="175" y1="130" x2="175" y2="80" class="image" />
    <line x1="175" y1="80" x2="150" y2="60" class="image" />
    <line x1="175" y1="80" x2="200" y2="60" class="image" />
  </g>
</svg>