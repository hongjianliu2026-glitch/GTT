<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fender</text>
  <text x="50" y="120" class="subtitle">[ˈfɛndər] n. 挡泥板</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fend (抵挡) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车在路上行驶，"抵挡(fend)"
    <tspan x="50" dy="25">飞溅的泥水，这个装置就是挡泥板(fender)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fender of the car was damaged in the accident.
  </text>
  <text x="50" y="310" class="content">
    汽车的挡泥板在事故中受损了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="120" r="30" class="image" />
    <circle cx="300" cy="120" r="30" class="image" />
    <!-- Fender -->
    <rect x="0" y="100" width="350" height="20" class="image" />
    <!-- Splash -->
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="300" y1="120" x2="280" y2="150" class="image" />
    <line x1="300" y1="120" x2="320" y2="150" class="image" />
  </g>
</svg>