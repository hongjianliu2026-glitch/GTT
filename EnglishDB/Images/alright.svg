<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alright</text>
  <text x="50" y="120" class="subtitle">[ɔːlˈraɪt] adv. 好吧，好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> all (全部) + right (正确)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在检查所有(all)的事情，发现每件事都正确(right)，
    <tspan x="50" dy="25">于是他满意地说："好吧(alright)！"</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> "Is it alright if I come over?" she asked.
  </text>
  <text x="50" y="310" class="content">
    她问：“我过来可以吗？”
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person checking -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Checkmarks -->
    <line x1="70" y1="50" x2="90" y2="70" class="image" />
    <line x1="90" y1="70" x2="110" y2="30" class="image" />
    <line x1="70" y1="100" x2="90" y2="120" class="image" />
    <line x1="90" y1="120" x2="110" y2="80" class="image" />
    <line x1="70" y1="150" x2="90" y2="170" class="image" />
    <line x1="90" y1="170" x2="110" y2="130" class="image" />
    <!-- Smiley face -->
    <circle cx="20" cy="200" r="20" class="image" />
    <circle cx="10" cy="190" r="5" class="image" />
    <circle cx="30" cy="190" r="5" class="image" />
    <path d="M10 210 Q20 220 30 210" class="image" />
  </g>
</svg>