<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Senate</text>
  <text x="50" y="120" class="subtitle">[ˈsɛnət] n. 参议院</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sen- (老) + -ate (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群"老者(sen-)"坐在一个庄严的房间里，
    <tspan x="50" dy="25">他们代表着国家的智慧和经验，这就是参议院(Senate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Senate passed the new bill yesterday.
  </text>
  <text x="50" y="310" class="content">
    参议院昨天通过了新法案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Chairs -->
    <circle cx="80" cy="150" r="15" class="image" />
    <circle cx="140" cy="150" r="15" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <circle cx="260" cy="150" r="15" class="image" />
    <!-- Old men -->
    <circle cx="80" cy="130" r="10" class="image" />
    <circle cx="140" cy="130" r="10" class="image" />
    <circle cx="200" cy="130" r="10" class="image" />
    <circle cx="260" cy="130" r="10" class="image" />
    <!-- Lines for old men -->
    <line x1="80" y1="140" x2="80" y2="150" class="image" />
    <line x1="140" y1="140" x2="140" y2="150" class="image" />
    <line x1="200" y1="140" x2="200" y2="150" class="image" />
    <line x1="260" y1="140" x2="260" y2="150" class="image" />
  </g>
</svg>