<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intentional</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɛnʃənl] adj. 故意的，有意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (向内) + tent (伸展) + -ion (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在内心深处"伸展(tent)"出一种意图，
    <tspan x="50" dy="25">这种意图是"向内(in)"的，因此是"故意的(intentional)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her smile was intentional, meant to comfort him.
  </text>
  <text x="50" y="310" class="content">
    她的微笑是故意的，目的是为了安慰他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 Q100,25 150,50 Q100,75 50,50" class="image" />
    <!-- Arrow pointing into the heart -->
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <polygon points="95,45 100,50 105,45" class="image" />
    <!-- Text inside the heart -->
    <text x="75" y="60" class="content" fill="#E74C3C">Intent</text>
  </g>
</svg>