<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">excitedly</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsaɪtɪdli] adv. 兴奋地，激动地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + cit (唤起) + -ed (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"唤起(cit)"了内心的激情，"兴奋地(excitedly)"跳跃着，
    <tspan x="50" dy="25">仿佛要从地面"跳出(ex-)"来一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke excitedly about her new job.
  </text>
  <text x="50" y="310" class="content">
    她兴奋地谈论着她的新工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person jumping -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="30" y2="130" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="70" y2="130" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Exclamation marks -->
    <text x="80" y="100" class="image" font-size="30">!</text>
    <text x="90" y="130" class="image" font-size="30">!</text>
    <text x="100" y="160" class="image" font-size="30">!</text>
  </g>
</svg>