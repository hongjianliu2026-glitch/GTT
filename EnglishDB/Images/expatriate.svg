<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">expatriate</text>
  <text x="50" y="120" class="subtitle">[ˈɛkspətriət] n. 移居国外者，侨民；v. 移居国外</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + patri (父亲，祖国) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人离开(ex-)自己的祖国(patri)，成为了一个移居国外者(expatriate)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many expatriates find it hard to adapt to a new culture.
  </text>
  <text x="50" y="310" class="content">
    许多移居国外者发现适应新文化很困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person leaving a house -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="100" class="image" /> <!-- House -->
    <line x1="100" y1="20" x2="100" y2="120" class="image" /> <!-- Door -->
    <circle cx="200" cy="70" r="15" class="image" /> <!-- Person -->
    <line x1="200" y1="85" x2="200" y2="120" class="image" /> <!-- Body -->
    <line x1="200" y1="120" x2="180" y2="150" class="image" /> <!-- Left leg -->
    <line x1="200" y1="120" x2="220" y2="150" class="image" /> <!-- Right leg -->
    <line x1="200" y1="95" x2="180" y2="110" class="image" /> <!-- Left arm -->
    <line x1="200" y1="95" x2="220" y2="110" class="image" /> <!-- Right arm -->
    <line x1="200" y1="120" x2="250" y2="120" class="image" /> <!-- Path -->
  </g>
</svg>