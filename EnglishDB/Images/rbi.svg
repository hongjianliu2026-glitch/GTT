<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">RBI</text>
  <text x="50" y="120" class="subtitle">[ˈɑːr bi ˈaɪ] n. 跑垒得分</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Run(跑) + B(Base) + I(In)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个棒球运动员在跑垒时，"跑(Run)"
    <tspan x="50" dy="25">到垒(Base)上并得分(In)，这就是跑垒得分(RBI)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He hit a home run and got an RBI.
  </text>
  <text x="50" y="310" class="content">
    他击出了一个本垒打并获得了一次跑垒得分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baseball field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Base paths -->
    <line x1="50" y1="180" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="350" y2="100" class="image" />
    <!-- Bases -->
    <circle cx="50" cy="180" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
    <circle cx="350" cy="100" r="10" class="image" />
    <!-- Runner -->
    <circle cx="100" cy="140" r="15" class="image" />
    <line x1="100" y1="155" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="200" class="image" />
    <line x1="100" y1="180" x2="120" y2="200" class="image" />
    <line x1="100" y1="165" x2="130" y2="155" class="image" />
  </g>
</svg>