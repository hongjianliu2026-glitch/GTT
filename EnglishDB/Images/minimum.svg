<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">minimum</text>
  <text x="50" y="120" class="subtitle">[ˈmɪnɪməm] n. 最小值，最低限度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mini- (小) + -mum (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天平，一边放着"最小(mini-)"的物品，
    <tspan x="50" dy="25">另一边放着一堆物品，天平倾斜向"最小"的一边，</tspan>
    <tspan x="50" dy="25">这就是"最小值(minimum)"的概念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The minimum wage has been increased to $15 per hour.
  </text>
  <text x="50" y="310" class="content">
    最低工资已提高到每小时15美元。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <line x1="50" y1="180" x2="350" y2="180" class="image" />
    <!-- Small item -->
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Large item -->
    <rect x="250" y="80" width="100" height="40" class="image" />
    <rect x="250" y="130" width="100" height="40" class="image" />
  </g>
</svg>