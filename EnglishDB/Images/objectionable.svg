<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">objectionable</text>
  <text x="50" y="120" class="subtitle">[əbˈdʒekʃənəbl] adj. 令人反感的，引起反对的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (反对) + ject (投掷) + -ion (名词后缀) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在会议上，"投掷(ject)"
    <tspan x="50" dy="25">反对意见，这些意见令人反感(objectionable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was filled with objectionable content.
  </text>
  <text x="50" y="310" class="content">
    这部电影充满了令人反感的内容。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person throwing a paper -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Paper flying -->
    <line x1="50" y1="150" x2="150" y2="100" class="image" />
    <rect x="150" y="90" width="30" height="20" class="image" />
    <!-- Objection sign -->
    <text x="200" y="120" class="highlight">Objection!</text>
  </g>
</svg>