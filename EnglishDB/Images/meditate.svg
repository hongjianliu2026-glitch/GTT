<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meditate</text>
  <text x="50" y="120" class="subtitle">[ˈmedɪteɪt] v. 冥想，沉思</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> medit- (思考) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在莲花上，闭着眼睛，"深入思考(medit-)"
    <tspan x="50" dy="25">内心的世界，这就是冥想(meditate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She likes to meditate in the morning to clear her mind.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在早晨冥想以清空思绪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lotus flower -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="100" cy="60" r="10" class="image" />
    <!-- Person meditating -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="70" y2="180" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
  </g>
</svg>