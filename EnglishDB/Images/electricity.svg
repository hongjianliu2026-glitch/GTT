<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lightning { stroke: #F39C12; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">electricity</text>
  <text x="50" y="120" class="subtitle">[ɪˌlɛkˈtrɪsɪti] n. 电，电能</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> electr (电) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的闪电(lightning)从天而降，"电(electr)"
    <tspan x="50" dy="25">流瞬间点亮了整个城市，这就是电能(electricity)的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm caused a power outage due to the excessive electricity.
  </text>
  <text x="50" y="310" class="content">
    暴风雨导致的电能过剩引发了停电。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lightning bolt -->
    <path d="M0 100 L50 50 L100 100 L150 50 L200 100" class="lightning" />
    <!-- City skyline -->
    <rect x="0" y="120" width="200" height="80" class="image" />
    <rect x="20" y="140" width="30" height="60" class="image" />
    <rect x="70" y="130" width="30" height="70" class="image" />
    <rect x="120" y="150" width="30" height="50" class="image" />
    <rect x="170" y="140" width="30" height="60" class="image" />
  </g>
</svg>