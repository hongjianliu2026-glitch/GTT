<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prince</text>
  <text x="50" y="120" class="subtitle">[prɪns] n. 王子，亲王</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prin- (第一) + -ce (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"第一人(prin-ce)"，他站在城堡的顶端，
    <tspan x="50" dy="25">头戴王冠，手持权杖，象征着他的高贵与权力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The prince ascended the throne after his father's death.
  </text>
  <text x="50" y="310" class="content">
    王子在父亲去世后登上了王位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Crown -->
    <polygon points="175,20 150,50 200,50" class="image" />
    <!-- Scepter -->
    <line x1="175" y1="70" x2="175" y2="150" class="image" />
    <circle cx="175" cy="160" r="10" class="image" />
    <!-- Prince -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="170" class="image" />
    <line x1="175" y1="150" x2="200" y2="170" class="image" />
    <line x1="175" y1="130" x2="220" y2="120" class="image" />
  </g>
</svg>