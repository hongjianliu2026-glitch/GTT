<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leave</text>
  <text x="50" y="120" class="subtitle">[liːv] v. 离开，留下；n. 许可，假期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leav (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人背着包，"离开(leav)"
    <tspan x="50" dy="25">家去旅行，留下(leave)了家人和熟悉的环境。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to leave her job and travel the world.
  </text>
  <text x="50" y="310" class="content">
    她决定辞去工作，环游世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person leaving -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="150" class="image" /> <!-- Right arm -->
    <!-- Backpack -->
    <rect x="40" y="120" width="20" height="40" class="image" />
    <!-- House -->
    <rect x="100" y="150" width="60" height="50" class="image" />
    <line x1="100" y1="150" x2="130" y2="120" class="image" />
    <line x1="130" y1="120" x2="160" y2="150" class="image" />
  </g>
</svg>