<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gamut</text>
  <text x="50" y="120" class="subtitle">[ˈɡæmət] n. 全音阶，全部范围</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gam (婚姻) + ut (范围)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在演奏时，"婚姻(gam)"
    <tspan x="50" dy="25">和"范围(ut)"结合，演奏出全音阶(gamut)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist's work covers the entire gamut of human emotions.
  </text>
  <text x="50" y="310" class="content">
    这位艺术家的作品涵盖了人类情感的全部范围。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Musical staff -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <!-- Notes -->
    <circle cx="50" cy="10" r="10" class="image" />
    <circle cx="100" cy="30" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="70" r="10" class="image" />
    <circle cx="250" cy="10" r="10" class="image" />
    <circle cx="300" cy="30" r="10" class="image" />
    <!-- Musician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>