<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bilingual</text>
  <text x="50" y="120" class="subtitle">[baɪˈlɪŋɡwəl] adj. 双语的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (两个) + lingua (语言)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人同时说两种语言，"两个(bi-)"
    <tspan x="50" dy="25">语言(lingua)在空中交织，形成了一个双语(bilingual)的奇妙场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is bilingual and can speak both English and French fluently.
  </text>
  <text x="50" y="310" class="content">
    她能流利地说英语和法语，是双语者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two speech bubbles -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <ellipse cx="300" cy="100" rx="80" ry="50" class="image" />
    <!-- Text in speech bubbles -->
    <text x="60" y="105" class="content">English</text>
    <text x="260" y="105" class="content">French</text>
    <!-- Person -->
    <circle cx="200" cy="200" r="30" class="image" />
    <line x1="200" y1="230" x2="200" y2="280" class="image" />
    <line x1="200" y1="280" x2="180" y2="310" class="image" />
    <line x1="200" y1="280" x2="220" y2="310" class="image" />
    <line x1="200" y1="250" x2="170" y2="240" class="image" />
    <line x1="200" y1="250" x2="230" y2="240" class="image" />
  </g>
</svg>