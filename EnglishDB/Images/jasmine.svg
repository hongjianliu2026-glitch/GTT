<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flower { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jasmine</text>
  <text x="50" y="120" class="subtitle">[ˈdʒæzmɪn] n. 茉莉花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自波斯语 "yasmin"，意为"茉莉花"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个花园里，"茉莉花(jasmine)"
    <tspan x="50" dy="25">在微风中轻轻摇曳，散发出迷人的香气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden was filled with the sweet scent of jasmine.
  </text>
  <text x="50" y="310" class="content">
    花园里充满了茉莉花的甜美香气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flower stem -->
    <line x1="175" y1="20" x2="175" y2="150" class="image" />
    <!-- Flower petals -->
    <circle cx="175" cy="100" r="30" class="flower" />
    <circle cx="145" cy="80" r="20" class="flower" />
    <circle cx="205" cy="80" r="20" class="flower" />
    <circle cx="135" cy="110" r="20" class="flower" />
    <circle cx="215" cy="110" r="20" class="flower" />
    <!-- Leaves -->
    <path d="M150,150 Q175,120 200,150" class="image" />
    <path d="M150,160 Q175,130 200,160" class="image" />
  </g>
</svg>