<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">railroad</text>
  <text x="50" y="120" class="subtitle">[ˈreɪlroʊd] n. 铁路；v. 用铁路运输，强迫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rail (铁轨) + road (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条铁轨(rail)铺在一条路上(road)，
    <tspan x="50" dy="25">火车沿着这条铁轨路(railroad)飞驰而过。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The train runs on the railroad every day.
  </text>
  <text x="50" y="310" class="content">
    火车每天都在铁路上运行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rail -->
    <line x1="0" y1="50" x2="350" y2="50" class="image" />
    <line x1="0" y1="70" x2="350" y2="70" class="image" />
    <!-- Train -->
    <rect x="50" y="20" width="100" height="30" class="image" />
    <rect x="160" y="20" width="100" height="30" class="image" />
    <rect x="270" y="20" width="100" height="30" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="180" cy="80" r="10" class="image" />
    <circle cx="290" cy="80" r="10" class="image" />
  </g>
</svg>