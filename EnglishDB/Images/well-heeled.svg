<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">well-heeled</text>
  <text x="50" y="120" class="subtitle">[ˌwɛlˈhid] adj. 富有的，有钱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> well (好) + heel (脚后跟)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着昂贵鞋子的人，"脚后跟(heel)"
    <tspan x="50" dy="25">被"好(well)"材料包裹，象征着富有(well-heeled)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The well-heeled man bought a luxury car.
  </text>
  <text x="50" y="310" class="content">
    那个富有的人买了一辆豪华车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Expensive shoes -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Heel of the shoe -->
    <rect x="150" y="100" width="50" height="80" class="image" />
    <!-- Dollar signs -->
    <text x="70" y="150" class="image" font-size="48" fill="#27AE60">$</text>
    <text x="100" y="150" class="image" font-size="48" fill="#27AE60">$</text>
    <text x="130" y="150" class="image" font-size="48" fill="#27AE60">$</text>
  </g>
</svg>