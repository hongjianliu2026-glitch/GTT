<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prejudice</text>
  <text x="50" y="120" class="subtitle">[ˈpredʒədɪs] n. 偏见，成见</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + judice (判断)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在事情发生之前，"提前判断(pre-judice)"
    <tspan x="50" dy="25">某人或某事，这种先入为主的判断就是偏见(prejudice)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His prejudice against foreigners was obvious.
  </text>
  <text x="50" y="310" class="content">
    他对国外人的偏见很明显。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scales -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <!-- Eyes -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <!-- Judgment arrows -->
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="50" y1="90" x2="150" y2="90" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="140" y2="180" class="image" />
  </g>
</svg>