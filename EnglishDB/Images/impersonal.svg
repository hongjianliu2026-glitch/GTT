<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impersonal</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpɜːrsənl] adj. 非个人的，客观的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + person (人) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机器人，"没有人的(in-person-al)"
    <tspan x="50" dy="25">情感，完全客观地执行任务，这就是非个人的(impersonal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bank's service is often impersonal and cold.
  </text>
  <text x="50" y="310" class="content">
    银行的服务通常是非个人的，冷冰冰的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="50" r="40" class="image" />
    <rect x="135" y="90" width="80" height="100" class="image" />
    <line x1="175" y1="190" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="135" y2="300" class="image" />
    <line x1="175" y1="250" x2="215" y2="300" class="image" />
    <line x1="175" y1="130" x2="100" y2="150" class="image" />
    <line x1="175" y1="130" x2="250" y2="150" class="image" />
  </g>
</svg>