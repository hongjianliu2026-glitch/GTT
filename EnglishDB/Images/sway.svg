<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sway</text>
  <text x="50" y="120" class="subtitle">[sweɪ] v. 摇摆，影响；n. 摇摆，影响力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (表示运动) + way (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树在风中"摇摆(sway)"，
    <tspan x="50" dy="25">它的枝叶随着风的路径(way)轻轻摇动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tree swayed gently in the breeze.
  </text>
  <text x="50" y="310" class="content">
    树在微风中轻轻摇摆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="75" y1="100" x2="125" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <!-- Wind -->
    <polyline points="100,0 120,20 80,40 120,60 80,80 120,100 80,120 120,140 80,160 120,180 100,200" class="image" />
  </g>
</svg>