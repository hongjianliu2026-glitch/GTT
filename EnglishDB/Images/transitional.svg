<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transitional</text>
  <text x="50" y="120" class="subtitle">[trænˈzɪʃənl] adj. 过渡的，转变的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + it (走) + -ion (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从一座桥上"跨越(trans-)"，
    <tspan x="50" dy="25">从一端走到另一端，这个过程就是"过渡(transitional)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The transitional period between winter and spring is often unpredictable.
  </text>
  <text x="50" y="310" class="content">
    冬春之间的过渡期往往难以预测。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bridge -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Person walking -->
    <circle cx="50" cy="90" r="10" class="image" />
    <line x1="50" y1="100" x2="50" y2="130" class="image" />
    <line x1="50" y1="130" x2="40" y2="150" class="image" />
    <line x1="50" y1="130" x2="60" y2="150" class="image" />
    <line x1="50" y1="110" x2="70" y2="120" class="image" />
    <!-- Transition arrows -->
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="300" y2="100" class="image" />
  </g>
</svg>