<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wasted</text>
  <text x="50" y="120" class="subtitle">[ˈweɪstɪd] adj. 浪费的，荒废的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wast (浪费) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的垃圾堆，"浪费(wast)"
    <tspan x="50" dy="25">的资源堆积如山，这就是"浪费的(wasted)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The food was wasted because no one ate it.
  </text>
  <text x="50" y="310" class="content">
    食物被浪费了，因为没有人吃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garbage pile -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <circle cx="300" cy="100" r="30" class="image" />
    <!-- Trash can -->
    <rect x="150" y="150" width="50" height="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="100" class="image" />
    <line x1="150" y1="125" x2="200" y2="125" class="image" />
  </g>
</svg>