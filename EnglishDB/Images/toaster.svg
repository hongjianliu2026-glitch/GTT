<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">toaster</text>
  <text x="50" y="120" class="subtitle">[ˈtoʊstər] n. 烤面包机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> toast (烤面包) + -er (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个烤面包机(toaster)，它是一个专门用来"烤(toast)"
    <tspan x="50" dy="25">面包的工具(-er)，每天早上都能为你烤出香脆的面包片。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She put two slices of bread into the toaster.
  </text>
  <text x="50" y="310" class="content">
    她把两片面包放进了烤面包机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toaster -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Slots -->
    <rect x="20" y="20" width="160" height="50" class="image" />
    <rect x="20" y="80" width="160" height="50" class="image" />
    <!-- Bread slices -->
    <rect x="30" y="30" width="70" height="30" class="image" />
    <rect x="100" y="30" width="70" height="30" class="image" />
    <rect x="30" y="90" width="70" height="30" class="image" />
    <rect x="100" y="90" width="70" height="30" class="image" />
  </g>
</svg>