<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheekbone</text>
  <text x="50" y="120" class="subtitle">[ˈtʃiːkbəʊn] n. 颧骨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cheek (脸颊) + bone (骨头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夸张的画面：一个巨大的脸颊(cheek)上，
    <tspan x="50" dy="25">有一块闪闪发光的骨头(bone)，那就是颧骨(cheekbone)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist emphasized the model's cheekbones with shading.
  </text>
  <text x="50" y="310" class="content">
    艺术家用阴影突出了模特的颧骨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Face outline -->
    <circle cx="200" cy="150" r="100" class="image" />
    <!-- Cheekbone -->
    <line x1="100" y1="100" x2="300" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="120" class="image" />
    <line x1="300" y1="100" x2="300" y2="120" class="image" />
    <line x1="100" y1="120" x2="300" y2="120" class="image" />
    <!-- Eye -->
    <circle cx="150" cy="130" r="10" class="image" />
    <circle cx="250" cy="130" r="10" class="image" />
    <!-- Mouth -->
    <line x1="150" y1="180" x2="250" y2="180" class="image" />
  </g>
</svg>