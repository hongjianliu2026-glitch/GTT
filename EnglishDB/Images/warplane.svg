<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">warplane</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːrpleɪn] n. 军用飞机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> war (战争) + plane (飞机)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机在战场上空翱翔，"战争中的飞机(war-plane)"
    <tspan x="50" dy="25">执行着各种军事任务，这就是军用飞机(warplane)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The warplane was deployed to the conflict zone.
  </text>
  <text x="50" y="310" class="content">
    这架军用飞机被部署到冲突地区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warplane -->
    <polygon points="0,0 100,0 120,20 100,40 0,40" class="image" />
    <line x1="10" y1="20" x2="110" y2="20" class="image" />
    <line x1="10" y1="20" x2="10" y2="40" class="image" />
    <line x1="110" y1="20" x2="110" y2="40" class="image" />
    <line x1="60" y1="0" x2="60" y2="20" class="image" />
    <!-- Clouds -->
    <ellipse cx="150" cy="10" rx="30" ry="15" class="image" />
    <ellipse cx="180" cy="20" rx="30" ry="15" class="image" />
    <ellipse cx="210" cy="10" rx="30" ry="15" class="image" />
  </g>
</svg>