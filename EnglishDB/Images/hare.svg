<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hare</text>
  <text x="50" y="120" class="subtitle">[her] n. 野兔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ha- (快速移动) + re (重复)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只野兔在田野中"快速移动(ha-)"，
    <tspan x="50" dy="25">它的动作如此之快，仿佛在重复(re)跳跃。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hare darted across the field.
  </text>
  <text x="50" y="310" class="content">
    野兔飞快地穿过田野。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hare -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Back leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Ear -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Ear -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" /> <!-- Tail -->
  </g>
</svg>