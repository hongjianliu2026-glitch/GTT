<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ouch</text>
  <text x="50" y="120" class="subtitle">[aʊtʃ] int. 哎哟（表示疼痛）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无明显词根，拟声词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人不小心踩到了尖锐的石头，"哎哟(ouch)"
    <tspan x="50" dy="25">一声，脸上露出痛苦的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Ouch! I just stepped on a Lego brick.
  </text>
  <text x="50" y="310" class="content">
    哎哟！我刚刚踩到了一个乐高积木。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Pain expression -->
    <line x1="35" y1="40" x2="45" y2="40" class="image" />
    <line x1="55" y1="40" x2="65" y2="40" class="image" />
    <path d="M35 60 Q50 70 65 60" class="image" />
    <!-- Stone -->
    <rect x="100" y="100" width="50" height="30" class="image" />
  </g>
</svg>