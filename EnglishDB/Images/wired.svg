<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wired</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪərd] adj. 有线的，连线的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wire (电线) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，电线(wire)像蜘蛛网一样密布，
    <tspan x="50" dy="25">所有的设备都被"连线(wired)"在一起，形成了一个复杂的网络。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old office was still using wired internet connections.
  </text>
  <text x="50" y="310" class="content">
    老办公室还在使用有线网络连接。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wires -->
    <line x1="50" y1="20" x2="300" y2="180" class="image" />
    <line x1="50" y1="180" x2="300" y2="20" class="image" />
    <line x1="100" y1="20" x2="250" y2="180" class="image" />
    <line x1="100" y1="180" x2="250" y2="20" class="image" />
    <!-- Devices -->
    <rect x="70" y="50" width="50" height="50" class="image" />
    <rect x="230" y="100" width="50" height="50" class="image" />
    <rect x="150" y="150" width="50" height="50" class="image" />
  </g>
</svg>