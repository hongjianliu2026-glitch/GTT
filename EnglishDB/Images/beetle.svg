<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beetle</text>
  <text x="50" y="120" class="subtitle">[ˈbiːtl] n. 甲虫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> beetl (源自中古英语 betle, 意为“甲虫”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的甲虫(beetle)在森林中飞舞，
    <tspan x="50" dy="25">它的翅膀闪烁着金属般的光泽，仿佛在炫耀它的存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beetle crawled across the leaf.
  </text>
  <text x="50" y="310" class="content">
    甲虫爬过了树叶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beetle body -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <!-- Beetle wings -->
    <line x1="50" y1="80" x2="150" y2="80" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <!-- Beetle legs -->
    <line x1="70" y1="100" x2="50" y2="130" class="image" />
    <line x1="130" y1="100" x2="150" y2="130" class="image" />
    <!-- Beetle head -->
    <circle cx="100" cy="70" r="10" class="image" />
    <!-- Beetle eyes -->
    <circle cx="90" cy="65" r="3" class="image" />
    <circle cx="110" cy="65" r="3" class="image" />
  </g>
</svg>