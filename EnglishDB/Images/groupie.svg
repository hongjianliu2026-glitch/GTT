<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">groupie</text>
  <text x="50" y="120" class="subtitle">[ˈɡruːpi] n. 狂热追随者，粉丝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> group (群体) + -ie (表示“小”或“爱好者”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群狂热的粉丝(groupie)，他们像小蜜蜂一样围绕着
    <tspan x="50" dy="25">偶像，挥舞着荧光棒，尖叫着表达他们的热爱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She became a groupie after attending the concert.
  </text>
  <text x="50" y="310" class="content">
    她参加完演唱会后成了一个狂热的粉丝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of fans -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <!-- Idol -->
    <circle cx="125" cy="100" r="30" class="image" />
    <!-- Glow sticks -->
    <line x1="40" y1="30" x2="60" y2="70" class="image" />
    <line x1="90" y1="30" x2="110" y2="70" class="image" />
    <line x1="140" y1="30" x2="160" y2="70" class="image" />
    <line x1="190" y1="30" x2="210" y2="70" class="image" />
  </g>
</svg>