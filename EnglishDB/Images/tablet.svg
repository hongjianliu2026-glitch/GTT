<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tablet</text>
  <text x="50" y="120" class="subtitle">[ˈtæblɪt] n. 平板电脑，药片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tabul (平板) + -et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小小的平板(tabul-et)，既可以是一片药片，
    <tspan x="50" dy="25">也可以是一台平板电脑，两者都是平坦的小物体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He took a tablet before going to bed.
  </text>
  <text x="50" y="310" class="content">
    他睡前吃了一片药。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tablet computer -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Screen -->
    <rect x="10" y="10" width="180" height="130" class="image" />
    <!-- Home button -->
    <circle cx="100" cy="140" r="10" class="image" />

    <!-- Tablet (medicine) -->
    <rect x="250" y="0" width="50" height="30" class="image" />
    <!-- Pill shape -->
    <rect x="260" y="10" width="30" height="10" class="image" />
  </g>
</svg>