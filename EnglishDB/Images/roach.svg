<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">roach</text>
  <text x="50" y="120" class="subtitle">[roʊtʃ] n. 蟑螂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roach (源自中古英语 roche，意为“蟑螂”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的蟑螂(roach)在厨房里爬行，
    <tspan x="50" dy="25">它的触角像天线一样长，身体闪闪发光，</tspan>
    <tspan x="50" dy="25">仿佛在炫耀它的存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roach scurried across the kitchen floor.
  </text>
  <text x="50" y="310" class="content">
    那只蟑螂飞快地爬过厨房地板。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Roach body -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <!-- Antennae -->
    <line x1="50" y1="70" x2="20" y2="40" class="image" />
    <line x1="150" y1="70" x2="180" y2="40" class="image" />
    <!-- Legs -->
    <line x1="50" y1="130" x2="20" y2="160" class="image" />
    <line x1="100" y1="130" x2="100" y2="160" class="image" />
    <line x1="150" y1="130" x2="180" y2="160" class="image" />
  </g>
</svg>