<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">biosolids</text>
  <text x="50" y="120" class="subtitle">[baɪoʊˈsɒlɪdz] n. 生物固体（处理后的污水污泥）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bio- (生命) + solid (固体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"生命固体(bio-solid)"工厂，
    <tspan x="50" dy="25">处理污水污泥，将其转化为有用的肥料。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The treatment plant produces biosolids for agricultural use.
  </text>
  <text x="50" y="310" class="content">
    该处理厂生产用于农业的生物固体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="-50" width="50" height="50" class="image" />
    <!-- Smoke -->
    <line x1="175" y1="-25" x2="175" y2="0" class="image" />
    <line x1="175" y1="-20" x2="175" y2="5" class="image" />
    <line x1="175" y1="-15" x2="175" y2="10" class="image" />
    <!-- Tank -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Sludge -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <!-- Fertilizer -->
    <rect x="50" y="170" width="250" height="20" class="image" />
  </g>
</svg>