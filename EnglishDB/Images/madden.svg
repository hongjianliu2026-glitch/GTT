<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">madden</text>
  <text x="50" y="120" class="subtitle">[ˈmædən] v. 使发狂，激怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mad (疯狂) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被激怒到"疯狂(mad)"，
    <tspan x="50" dy="25">他的头发都竖起来了，眼睛瞪得大大的，</tspan>
    <tspan x="50" dy="25">这就是"使发狂(madden)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His constant teasing maddened her.
  </text>
  <text x="50" y="310" class="content">
    他不断的戏弄激怒了她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="10" class="image" />
    <circle cx="120" cy="85" r="10" class="image" />
    <!-- Hair -->
    <line x1="50" y1="50" x2="100" y2="70" class="image" />
    <line x1="100" y1="70" x2="150" y2="50" class="image" />
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
  </g>
</svg>