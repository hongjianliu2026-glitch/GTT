<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">other</text>
  <text x="50" y="120" class="subtitle">[ˈʌðər] adj. 其他的，另外的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oth- (其他)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个分岔路口，"其他(oth-)"
    <tspan x="50" dy="25">的路径通向未知的方向，这就是"其他的(other)"含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are many other options to consider.
  </text>
  <text x="50" y="310" class="content">
    还有许多其他的选择需要考虑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Fork in the road -->
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <!-- Arrows -->
    <line x1="150" y1="50" x2="130" y2="70" class="image" />
    <line x1="150" y1="50" x2="170" y2="70" class="image" />
    <line x1="150" y1="150" x2="130" y2="130" class="image" />
    <line x1="150" y1="150" x2="170" y2="130" class="image" />
  </g>
</svg>