<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cove</text>
  <text x="50" y="120" class="subtitle">[koʊv] n. 小海湾，小湾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cov- (来自拉丁语 "cavus"，意为"洞")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的海浪冲向岸边，"洞(cov-)"
    <tspan x="50" dy="25">形成了一个小海湾(cove)，海浪退去后，</tspan>
    <tspan x="50" dy="25">留下了一个宁静的小湾。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We found a quiet cove to relax by the sea.
  </text>
  <text x="50" y="310" class="content">
    我们找到了一个安静的小海湾，在海边放松。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Cove -->
    <path d="M50 150 Q100 50 150 150 T300 150" class="image" fill="#E8F6F3" />
    <!-- Waves -->
    <path d="M50 150 Q75 125 100 150 T150 150" class="image" fill="none" stroke="#2980B9" />
    <path d="M150 150 Q175 125 200 150 T250 150" class="image" fill="none" stroke="#2980B9" />
    <path d="M250 150 Q275 125 300 150" class="image" fill="none" stroke="#2980B9" />
  </g>
</svg>