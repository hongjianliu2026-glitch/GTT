<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supporting</text>
  <text x="50" y="120" class="subtitle">[səˈpɔːrtɪŋ] adj. 支持的，支撑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sup- (在下面) + port (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的拱门下，"在下面携带(sup-port)"
    <tspan x="50" dy="25">着整个结构，这就是支撑(supporting)的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The supporting cast did an excellent job in the play.
  </text>
  <text x="50" y="310" class="content">
    配角们在剧中表现出色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arch -->
    <path d="M50 50 Q150 100 250 50 L250 150 Q150 200 50 150 Z" class="image" />
    <!-- Person under the arch -->
    <circle cx="150" cy="120" r="15" class="image" />
    <line x1="150" y1="135" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <line x1="150" y1="150" x2="180" y2="140" class="image" />
  </g>
</svg>