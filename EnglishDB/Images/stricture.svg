<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stricture</text>
  <text x="50" y="120" class="subtitle">[ˈstrɪktʃər] n. 限制，约束</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> strict (拉紧) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被"拉紧(strict)"的绳子，它紧紧地"约束(stricture)"着一切，不让任何东西通过。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new regulations imposed strictures on the use of plastic bags.
  </text>
  <text x="50" y="310" class="content">
    新规定对塑料袋的使用施加了严格的限制。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Rope -->
    <line x1="0" y1="0" x2="300" y2="0" class="image" />
    <line x1="0" y1="20" x2="300" y2="20" class="image" />
    <line x1="0" y1="40" x2="300" y2="40" class="image" />
    <!-- Tightened part -->
    <line x1="100" y1="0" x2="100" y2="40" class="image" />
    <line x1="200" y1="0" x2="200" y2="40" class="image" />
    <!-- Barrier -->
    <rect x="100" y="50" width="100" height="50" class="image" />
    <text x="130" y="85" class="content" fill="#7F8C8D">限制</text>
  </g>
</svg>