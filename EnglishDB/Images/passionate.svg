<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">passionate</text>
  <text x="50" y="120" class="subtitle">[ˈpæʃənət] adj. 充满激情的，热烈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> passio (痛苦) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为对某事的热爱而"痛苦(passio)"，
    <tspan x="50" dy="25">这种痛苦其实是他内心深处的热情(passionate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is passionate about her work.
  </text>
  <text x="50" y="310" class="content">
    她对自己的工作充满热情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Flame -->
    <polygon points="50,10 60,30 40,30" class="image" />
    <polygon points="50,15 65,30 35,30" class="image" />
    <polygon points="50,20 70,30 30,30" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="40" y2="180" class="image" />
    <line x1="50" y1="150" x2="60" y2="180" class="image" />
    <line x1="50" y1="130" x2="70" y2="120" class="image" />
  </g>
</svg>