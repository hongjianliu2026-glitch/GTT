<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">birthright</text>
  <text x="50" y="120" class="subtitle">[ˈbɜːrθraɪt] n. 与生俱来的权利</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> birth (出生) + right (权利)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个婴儿刚出生，就被授予了一顶象征权利的皇冠，
    <tspan x="50" dy="25">这顶皇冠就是他的"与生俱来的权利(birthright)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Education is considered a birthright in many countries.
  </text>
  <text x="50" y="310" class="content">
    在许多国家，教育被视为与生俱来的权利。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Baby -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Diaper -->
    <rect x="50" y="150" width="100" height="20" class="image" />
    <!-- Crown -->
    <polygon points="100,50 70,80 130,80" class="image" />
    <line x1="100" y1="50" x2="100" y2="30" class="image" />
    <line x1="100" y1="30" x2="80" y2="40" class="image" />
    <line x1="100" y1="30" x2="120" y2="40" class="image" />
  </g>
</svg>