<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cola { fill: #D35400; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cola</text>
  <text x="50" y="120" class="subtitle">[ˈkoʊlə] n. 可乐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自西非的可乐果，因其含有咖啡因和可可碱而得名。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个炎热的夏日，你打开一瓶可乐(cola)，
    <tspan x="50" dy="25">气泡从瓶中涌出，带来一丝清凉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He prefers cola over other soft drinks.
  </text>
  <text x="50" y="310" class="content">
    比起其他软饮料，他更喜欢可乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cola bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="30" class="image" />
    <!-- Bubbles -->
    <circle cx="30" cy="180" r="10" class="cola" />
    <circle cx="70" cy="160" r="10" class="cola" />
    <circle cx="50" cy="140" r="10" class="cola" />
    <circle cx="30" cy="120" r="10" class="cola" />
    <circle cx="70" cy="100" r="10" class="cola" />
  </g>
</svg>