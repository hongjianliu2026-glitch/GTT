<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eighteenth-century</text>
  <text x="50" y="120" class="subtitle">[ˌeɪˈtiːnθ ˈsentʃəri] adj. 18世纪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eight (八) + teen (十) + cent (百) + ury (年)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的钟表，指针指向"八(eight)"和"十(teen)"，
    <tspan x="50" dy="25">代表着18世纪(eighteenth-century)的时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The eighteenth-century architecture is still well-preserved.
  </text>
  <text x="50" y="310" class="content">
    18世纪的建筑至今仍保存完好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Numbers -->
    <text x="165" y="40" class="content">8</text>
    <text x="245" y="110" class="content">10</text>
  </g>
</svg>