<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peacekeeper</text>
  <text x="50" y="120" class="subtitle">[ˈpiːsˌkiːpər] n. 维和人员，和平维护者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peace (和平) + keeper (保持者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个身穿蓝色头盔的维和人员，手持盾牌，
    <tspan x="50" dy="25">站在战火纷飞的地区，努力"保持(keeper)"和平(peace)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The peacekeepers were deployed to the conflict zone.
  </text>
  <text x="50" y="310" class="content">
    维和人员被部署到冲突地区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Peacekeeper -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <rect x="40" y="80" width="20" height="10" class="image" /> <!-- Helmet -->
    <rect x="30" y="120" width="40" height="60" class="image" /> <!-- Shield -->
  </g>
</svg>