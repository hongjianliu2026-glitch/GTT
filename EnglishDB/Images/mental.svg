<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mental</text>
  <text x="50" y="120" class="subtitle">[ˈmɛntl] adj. 精神的，智力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ment (心智) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的大脑悬浮在空中，"心智(ment)"
    <tspan x="50" dy="25">的力量如同光芒四射，这就是"精神的(mental)"力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a strong mental focus during exams.
  </text>
  <text x="50" y="310" class="content">
    她在考试时精神非常集中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Brain -->
    <ellipse cx="150" cy="150" rx="100" ry="70" class="image" />
    <ellipse cx="100" cy="120" rx="20" ry="15" class="image" />
    <ellipse cx="200" cy="120" rx="20" ry="15" class="image" />
    <ellipse cx="150" cy="180" rx="30" ry="20" class="image" />
    <!-- Light rays -->
    <line x1="150" y1="220" x2="150" y2="300" class="image" />
    <line x1="100" y1="260" x2="50" y2="300" class="image" />
    <line x1="200" y1="260" x2="250" y2="300" class="image" />
  </g>
</svg>