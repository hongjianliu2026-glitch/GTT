<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">placid</text>
  <text x="50" y="120" class="subtitle">[ˈplæsɪd] adj. 平静的，宁静的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plac (平静) + -id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片宁静的湖面，"平静(plac)"得像一面镜子，
    <tspan x="50" dy="25">没有一丝波澜，这就是"平静的(placid)"景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The placid lake reflected the surrounding mountains.
  </text>
  <text x="50" y="310" class="content">
    平静的湖面映照着周围的山脉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#A9CCE3" />
    <!-- Mountains -->
    <polygon points="100,0 200,100 300,0" class="image" fill="#5D6D7E" />
    <!-- Reflection -->
    <polygon points="100,200 200,100 300,200" class="image" fill="#5D6D7E" opacity="0.5" />
    <!-- Sun -->
    <circle cx="50" cy="50" r="20" class="image" fill="#F4D03F" />
  </g>
</svg>