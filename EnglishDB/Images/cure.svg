<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cure</text>
  <text x="50" y="120" class="subtitle">[kjʊr] v. 治愈，治疗；n. 治愈，疗法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cur (关心，照顾)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在细心地"照顾(cur)"病人，
    <tspan x="50" dy="25">最终成功治愈(cure)了他们。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new medicine can cure the disease.
  </text>
  <text x="50" y="310" class="content">
    这种新药可以治愈这种疾病。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doctor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Patient -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Heart symbol -->
    <path d="M180,100 C180,80 220,80 220,100 C220,120 180,120 180,100 Z" class="image" />
    <!-- Syringe -->
    <line x1="250" y1="100" x2="280" y2="100" class="image" />
    <line x1="280" y1="100" x2="270" y2="90" class="image" />
    <line x1="280" y1="100" x2="270" y2="110" class="image" />
  </g>
</svg>