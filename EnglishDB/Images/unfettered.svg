<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unfettered</text>
  <text x="50" y="120" class="subtitle">[ʌnˈfetəd] adj. 不受约束的，自由的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + fetter (束缚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人挣脱了所有的束缚，"不受束缚(un-fettered)"，
    <tspan x="50" dy="25">自由自在地奔跑在广阔的草原上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt unfettered after quitting her job.
  </text>
  <text x="50" y="310" class="content">
    她辞职后感到无比自由。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person running -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />

    <!-- Grassland -->
    <rect x="0" y="220" width="350" height="100" class="image" />
    <line x1="20" y1="240" x2="330" y2="240" class="image" />
    <line x1="20" y1="260" x2="330" y2="260" class="image" />
    <line x1="20" y1="280" x2="330" y2="280" class="image" />
    <line x1="20" y1="300" x2="330" y2="300" class="image" />
  </g>
</svg>