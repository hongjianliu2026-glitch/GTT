<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">haven</text>
  <text x="50" y="120" class="subtitle">[ˈheɪvn] n. 避风港，安全的地方</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ha- (来自古英语，意为“隐藏”) + ven (来自拉丁语，意为“来”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的旅人，在暴风雨中找到了一个"隐藏(ha-)"的"来(ven)"处，
    <tspan x="50" dy="25">这个避风港(haven)让他感到安全和宁静。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The small cottage by the sea was a haven for the weary traveler.
  </text>
  <text x="50" y="310" class="content">
    海边的小屋是疲惫旅人的避风港。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boat -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <line x1="50" y1="45" x2="150" y2="45" class="image" />
    <line x1="100" y1="20" x2="100" y2="45" class="image" />
    <!-- Waves -->
    <path d="M50 70 Q75 60, 100 70 T150 70" class="image" />
    <path d="M50 80 Q75 70, 100 80 T150 80" class="image" />
    <path d="M50 90 Q75 80, 100 90 T150 90" class="image" />
    <!-- Safe place -->
    <rect x="200" y="20" width="150" height="100" class="image" />
    <line x1="200" y1="20" x2="275" y2="0" class="image" />
    <line x1="350" y1="20" x2="275" y2="0" class="image" />
    <!-- Traveler -->
    <circle cx="220" cy="70" r="15" class="image" />
    <line x1="220" y1="85" x2="220" y2="120" class="image" />
    <line x1="220" y1="120" x2="200" y2="150" class="image" />
    <line x1="220" y1="120" x2="240" y2="150" class="image" />
    <line x1="220" y1="100" x2="250" y2="90" class="image" />
  </g>
</svg>