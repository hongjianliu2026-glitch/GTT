<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tier</text>
  <text x="50" y="120" class="subtitle">[tɪər] n. 层，等级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tier (层，等级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕，每一层(tier)都代表不同的等级，
    <tspan x="50" dy="25">从底层到顶层，等级逐渐升高。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has three tiers of management.
  </text>
  <text x="50" y="310" class="content">
    公司有三层管理等级。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cake tiers -->
    <rect x="50" y="0" width="200" height="50" class="image" />
    <rect x="75" y="60" width="150" height="50" class="image" />
    <rect x="100" y="120" width="100" height="50" class="image" />
    <!-- Decoration -->
    <circle cx="150" cy="25" r="10" class="image" />
    <circle cx="150" cy="85" r="8" class="image" />
    <circle cx="150" cy="145" r="6" class="image" />
  </g>
</svg>