<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">usable</text>
  <text x="50" y="120" class="subtitle">[ˈjuːzəbl] adj. 可用的，能用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> use (使用) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工具箱里，"能够被使用(use-able)"
    <tspan x="50" dy="25">的工具闪闪发光，等待着被拿起。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old table was still usable after some repairs.
  </text>
  <text x="50" y="310" class="content">
    这张旧桌子经过一些修理后仍然可以使用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toolbox -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tools -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="110" x2="100" y2="110" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <!-- Sparkles -->
    <circle cx="75" cy="50" r="5" fill="#FFD700" />
    <circle cx="75" cy="80" r="5" fill="#FFD700" />
    <circle cx="75" cy="110" r="5" fill="#FFD700" />
    <circle cx="75" cy="140" r="5" fill="#FFD700" />
  </g>
</svg>