<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Amish</text>
  <text x="50" y="120" class="subtitle">[ˈɑːmɪʃ] n. 阿米什人（美国和加拿大安大略省的一群基督新教再洗礼派门诺会信徒）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自德语 "Amische"，指门诺会的一个分支。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群穿着传统服装的阿米什人，他们拒绝现代科技，
    <tspan x="50" dy="25">过着简朴的生活，与世隔绝，仿佛时光倒流。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Amish community lives a simple life without modern technology.
  </text>
  <text x="50" y="310" class="content">
    阿米什社区过着没有现代科技的简朴生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional clothing -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="10" y="10" width="80" height="130" class="image" />
