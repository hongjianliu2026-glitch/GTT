<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">philanthropic</text>
  <text x="50" y="120" class="subtitle">[ˌfɪlənˈθrɒpɪk] adj. 慈善的，博爱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> phil- (爱) + anthrop (人) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满爱心的人，"爱(phil-)"
    <tspan x="50" dy="25">所有的人(anthrop)"，他的行为充满了慈善(philanthropic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a philanthropic nature and often donates to charity.
  </text>
  <text x="50" y="310" class="content">
    她有慈善的天性，经常向慈善机构捐款。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Person -->
    <circle cx="40" cy="100" r="15" class="image" />
    <line x1="40" y1="115" x2="40" y2="150" class="image" />
    <line x1="40" y1="150" x2="25" y2="180" class="image" />
    <line x1="40" y1="150" x2="55" y2="180" class="image" />
    <line x1="40" y1="130" x2="70" y2="120" class="image" />
    <!-- Money bag -->
    <rect x="80" y="80" width="40" height="40" class="image" />
    <line x1="80" y1="80" x2="120" y2="80" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="80" y1="80" x2="80" y2="120" class="image" />
    <line x1="120" y1="80" x2="120" y2="120" class="image" />
  </g>
</svg>