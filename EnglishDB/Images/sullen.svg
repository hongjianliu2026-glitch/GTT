<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sullen</text>
  <text x="50" y="120" class="subtitle">[ˈsʌlən] adj. 阴沉的，闷闷不乐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sul- (来自拉丁语 sulcus，意为“沟壑”) + -en (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人脸上有一条深深的“沟壑(sulcus)”，
    <tspan x="50" dy="25">他的表情阴沉(sullen)，仿佛永远无法露出笑容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sullen teenager refused to speak to anyone.
  </text>
  <text x="50" y="310" class="content">
    那个闷闷不乐的少年拒绝和任何人说话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 60 140 Q 100 180 140 140" class="image" />
    <!-- Gloomy cloud -->
    <ellipse cx="100" cy="30" rx="60" ry="30" class="image" />
    <line x1="70" y1="30" x2="130" y2="30" class="image" />
    <line x1="80" y1="40" x2="120" y2="40" class="image" />
    <line x1="90" y1="50" x2="110" y2="50" class="image" />
  </g>
</svg>