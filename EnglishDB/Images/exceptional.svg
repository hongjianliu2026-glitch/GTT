<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exceptional</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsepʃənl] adj. 杰出的，异常的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + cept (拿) + -ion (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天才少年，"拿出(ex-cept)"
    <tspan x="50" dy="25">与众不同的才能，成为"异常(exceptional)"的杰出人物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is an exceptional pianist, winning numerous awards.
  </text>
  <text x="50" y="310" class="content">
    她是一位杰出的钢琴家，赢得了无数奖项。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <polygon points="100,10 40,198 190,78 10,78 160,198" class="image" fill="#FFD700" />
    <!-- Genius -->
    <circle cx="100" cy="100" r="30" class="image" fill="#FF69B4" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="60" y2="140" class="image" />
    <line x1="100" y1="150" x2="140" y2="140" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
  </g>
</svg>