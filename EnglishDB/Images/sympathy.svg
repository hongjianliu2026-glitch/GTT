<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sympathy</text>
  <text x="50" y="120" class="subtitle">[ˈsɪmpəθi] n. 同情，同感</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sym- (共同) + path (感情)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人，他们的"感情(path)"是"共同(sym-)"的，
    <tspan x="50" dy="25">他们彼此理解并感受到对方的痛苦，这就是同情(sympathy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She showed great sympathy for the victims of the disaster.
  </text>
  <text x="50" y="310" class="content">
    她对灾难的受害者表示了极大的同情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Hearts -->
    <path d="M 50 120 C 50 150, 150 150, 150 120" class="image" />
    <path d="M 50 120 C 50 90, 150 90, 150 120" class="image" />
    <!-- Connection -->
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
  </g>
</svg>