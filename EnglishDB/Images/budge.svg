<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">budge</text>
  <text x="50" y="120" class="subtitle">[bʌdʒ] v. 移动，稍微移动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> budge (源自中古英语，意为“移动”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在沙发上，轻轻地"移动(budge)"了一下，
    <tspan x="50" dy="25">沙发上的灰尘也随之微微扬起。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heavy box didn't budge an inch.
  </text>
  <text x="50" y="310" class="content">
    那个沉重的箱子一动不动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sofa -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Dust -->
    <circle cx="100" cy="80" r="5" class="image" />
    <circle cx="110" cy="85" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
  </g>
</svg>