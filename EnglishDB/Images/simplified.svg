<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">simplified</text>
  <text x="50" y="120" class="subtitle">[ˈsɪmplɪfaɪd] adj. 简化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> simpli- (简单) + -fy (使) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个复杂的机器被"简化(simpli-fy)"成一个简单的工具，
    <tspan x="50" dy="25">就像把一堆零件变成一个简单的杠杆。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The instructions were simplified to make them easier to understand.
  </text>
  <text x="50" y="310" class="content">
    这些说明被简化了，以便更容易理解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Complex machine -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="80" class="image" />
    <line x1="20" y1="80" x2="130" y2="20" class="image" />
    <circle cx="75" cy="50" r="10" class="image" />

    <!-- Simple lever -->
    <rect x="200" y="40" width="100" height="20" class="image" />
    <line x1="200" y1="50" x2="300" y2="50" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
    <circle cx="300" cy="50" r="5" class="image" />
  </g>
</svg>