<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elevator</text>
  <text x="50" y="120" class="subtitle">[ˈɛlɪveɪtər] n. 电梯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + lev (升) + -ator (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的电梯，"升起(lev)"
    <tspan x="50" dy="25">并"带出(e-)"人们到不同的楼层，这就是电梯(elevator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She took the elevator to the 10th floor.
  </text>
  <text x="50" y="310" class="content">
    她乘电梯到了10楼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elevator shaft -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Elevator car -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Doors -->
    <line x1="120" y1="50" x2="120" y2="150" class="image" />
    <line x1="230" y1="50" x2="230" y2="150" class="image" />
    <!-- Buttons -->
    <circle cx="175" cy="170" r="10" class="image" />
    <circle cx="195" cy="170" r="10" class="image" />
    <circle cx="215" cy="170" r="10" class="image" />
  </g>
</svg>