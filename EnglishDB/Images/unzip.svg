<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unzip</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˈzɪp] v. 解压缩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (反向) + zip (压缩)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个文件被"反向压缩(un-zip)"，
    <tspan x="50" dy="25">从一个压缩包里释放出来，变成一堆文件。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You need to unzip the file before you can open it.
  </text>
  <text x="50" y="310" class="content">
    你需要先解压缩文件才能打开它。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compressed file -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <text x="20" y="50" class="content" fill="#34495E">.zip</text>
    <!-- Unzipped files -->
    <rect x="200" y="0" width="100" height="50" class="image" />
    <rect x="200" y="60" width="100" height="50" class="image" />
    <rect x="200" y="120" width="100" height="50" class="image" />
    <text x="220" y="30" class="content" fill="#34495E">file1</text>
    <text x="220" y="90" class="content" fill="#34495E">file2</text>
    <text x="220" y="150" class="content" fill="#34495E">file3</text>
    <!-- Arrow -->
    <line x1="150" y1="50" x2="190" y2="50" class="image" />
    <polygon points="190,50 185,45 185,55" class="image" />
  </g>
</svg>