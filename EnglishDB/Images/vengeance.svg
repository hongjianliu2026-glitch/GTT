<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vengeance</text>
  <text x="50" y="120" class="subtitle">[ˈvɛndʒəns] n. 复仇，报仇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> veng (复仇) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个愤怒的战士，手持利剑，"复仇(veng)"
    <tspan x="50" dy="25">的火焰在他眼中燃烧，他誓要为正义而战，</tspan>
    <tspan x="50" dy="25">这就是"复仇(vengeance)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He swore to take vengeance on his enemy.
  </text>
  <text x="50" y="310" class="content">
    他发誓要向敌人复仇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warrior -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Sword -->
    <line x1="20" y1="115" x2="20" y2="20" class="image" />
    <line x1="20" y1="20" x2="0" y2="40" class="image" />
    <line x1="20" y1="20" x2="40" y2="40" class="image" />
    <!-- Fire -->
    <polygon points="60,100 80,80 100,100 80,120" class="image" />
    <polygon points="60,110 80,90 100,110 80,130" class="image" />
    <polygon points="60,120 80,100 100,120 80,140" class="image" />
  </g>
</svg>