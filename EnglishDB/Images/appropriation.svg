<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">appropriation</text>
  <text x="50" y="120" class="subtitle">[əˌproʊpriˈeɪʃn] n. 挪用，占用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (向) + propri (自己的) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图"向自己的方向(ap-propri)"
    <tspan x="50" dy="25">拉走(appropriation)别人的东西，这种行为就是挪用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company faced charges of appropriation of public funds.
  </text>
  <text x="50" y="310" class="content">
    该公司面临挪用公共资金的指控。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person pulling -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Box being pulled -->
    <rect x="100" y="120" width="60" height="60" class="image" />
    <line x1="130" y1="120" x2="130" y2="60" class="image" />
    <line x1="130" y1="60" x2="100" y2="80" class="image" />
    <line x1="130" y1="60" x2="160" y2="80" class="image" />
  </g>
</svg>