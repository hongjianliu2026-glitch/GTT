<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carcass</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːrkəs] n. 动物尸体，残骸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carc (肉) + -ass (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的动物，它的"肉体(carc)"
    <tspan x="50" dy="25">倒在地上，变成了一个"残骸(carcass)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vultures circled the carcass of the dead animal.
  </text>
  <text x="50" y="310" class="content">
    秃鹫围绕着那只死去的动物的尸体盘旋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Carcass outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Animal body -->
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Head -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Legs -->
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="250" y1="180" x2="250" y2="250" class="image" />
    <!-- Wings (optional for dramatic effect) -->
    <line x1="20" y1="80" x2="0" y2="50" class="image" />
    <line x1="330" y1="80" x2="350" y2="50" class="image" />
  </g>
</svg>