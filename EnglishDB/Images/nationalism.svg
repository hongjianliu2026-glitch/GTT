<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nationalism</text>
  <text x="50" y="120" class="subtitle">[ˈnæʃnəlɪzəm] n. 民族主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nation (国家) + -al (形容词后缀) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的国旗在风中飘扬，"国家(nation)"
    <tspan x="50" dy="25">的象征，代表着强烈的"主义(-ism)"，这就是民族主义(nationalism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Nationalism played a significant role in the unification of the country.
  </text>
  <text x="50" y="310" class="content">
    民族主义在国家的统一中发挥了重要作用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flag -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Stars -->
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="120" cy="50" r="10" class="image" />
    <circle cx="160" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="240" cy="50" r="10" class="image" />
    <!-- Stripes -->
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Wind -->
    <line x1="50" y1="20" x2="30" y2="40" class="image" />
    <line x1="100" y1="20" x2="80" y2="40" class="image" />
    <line x1="150" y1="20" x2="130" y2="40" class="image" />
    <line x1="200" y1="20" x2="180" y2="40" class="image" />
    <line x1="250" y1="20" x2="230" y2="40" class="image" />
  </g>
</svg>