<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inheritance</text>
  <text x="50" y="120" class="subtitle">[ɪnˈherɪtəns] n. 继承，遗产</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + her (继承) + -it (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个年轻人走进(in-)一间古老的房间，继承(her)
    <tspan x="50" dy="25">了家族的遗产(inheritance)，房间里堆满了金银财宝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received a large inheritance from her grandfather.
  </text>
  <text x="50" y="310" class="content">
    她从祖父那里继承了一大笔遗产。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Treasure chest -->
    <rect x="50" y="50" width="100" height="70" class="image" />
    <!-- Gold coins -->
    <circle cx="100" cy="90" r="10" class="image" />
    <circle cx="120" cy="90" r="10" class="image" />
    <circle cx="140" cy="90" r="10" class="image" />
    <!-- Young person -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>