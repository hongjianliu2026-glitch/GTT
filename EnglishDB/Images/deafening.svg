<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deafening</text>
  <text x="50" y="120" class="subtitle">[ˈdefənɪŋ] adj. 震耳欲聋的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + af (听) + -en (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的音响，声音大到"使(en)听(af)觉离开(de)"，
    <tspan x="50" dy="25">震耳欲聋(deafening)，让人无法忍受。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concert was so deafening that we had to cover our ears.
  </text>
  <text x="50" y="310" class="content">
    音乐会声音太大，我们不得不捂住耳朵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Loudspeaker -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="40" class="image" />
    <circle cx="150" cy="100" r="40" class="image" />
    <circle cx="250" cy="100" r="40" class="image" />
    <!-- Sound waves -->
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <line x1="50" y1="190" x2="300" y2="190" class="image" />
    <!-- Ears covered -->
    <circle cx="100" cy="250" r="20" class="image" />
    <circle cx="200" cy="250" r="20" class="image" />
    <line x1="80" y1="250" x2="120" y2="250" class="image" />
    <line x1="180" y1="250" x2="220" y2="250" class="image" />
  </g>
</svg>