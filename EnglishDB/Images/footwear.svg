<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">footwear</text>
  <text x="50" y="120" class="subtitle">[ˈfʊtˌwɛr] n. 鞋类</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> foot (脚) + wear (穿戴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在挑选鞋子，"脚(foot)"上"穿戴(wear)"的物品，
    <tspan x="50" dy="25">就是鞋类(footwear)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a new pair of footwear for the hiking trip.
  </text>
  <text x="50" y="310" class="content">
    她为徒步旅行买了一双新鞋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shoe -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <rect x="20" y="20" width="160" height="60" class="image" />
    <line x1="40" y1="40" x2="160" y2="40" class="image" />
    <line x1="40" y1="60" x2="160" y2="60" class="image" />
    <line x1="40" y1="80" x2="160" y2="80" class="image" />
    <!-- Foot -->
    <circle cx="100" cy="150" r="30" class="image" />
    <line x1="100" y1="180" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="70" y2="250" class="image" />
    <line x1="100" y1="220" x2="130" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="190" class="image" />
  </g>
</svg>