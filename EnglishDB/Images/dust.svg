<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dust</text>
  <text x="50" y="120" class="subtitle">[dʌst] n. 灰尘，尘埃；v. 掸去灰尘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dus- (灰)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的房间，"灰(dus)"
    <tspan x="50" dy="25">尘覆盖了每一个角落，仿佛时间在这里停滞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She dusted off the old books on the shelf.
  </text>
  <text x="50" y="310" class="content">
    她掸去了书架上旧书的灰尘。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dust particles -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="80" cy="70" r="5" class="image" />
    <circle cx="120" cy="60" r="5" class="image" />
    <circle cx="150" cy="90" r="5" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
    <circle cx="250" cy="70" r="5" class="image" />
    <circle cx="300" cy="60" r="5" class="image" />
    <circle cx="330" cy="90" r="5" class="image" />
    <!-- Old books -->
    <rect x="50" y="120" width="50" height="60" class="image" />
    <rect x="120" y="120" width="50" height="60" class="image" />
    <rect x="190" y="120" width="50" height="60" class="image" />
    <rect x="260" y="120" width="50" height="60" class="image" />
  </g>
</svg>