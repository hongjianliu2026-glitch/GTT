<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">visibility</text>
  <text x="50" y="120" class="subtitle">[ˌvɪzəˈbɪlɪti] n. 可见性，能见度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vis (看) + -ibility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的眼睛(vis)，它能够穿透浓雾，
    <tspan x="50" dy="25">看到远处的物体，这就是"可见性(visibility)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fog reduced visibility to only a few meters.
  </text>
  <text x="50" y="310" class="content">
    雾使得能见度降低到只有几米。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="20" class="image" fill="#2C3E50" />
    <!-- Fog -->
    <rect x="0" y="150" width="200" height="100" class="image" fill="#BDC3C7" />
    <!-- Object in the distance -->
    <rect x="150" y="100" width="50" height="50" class="image" fill="#3498DB" />
    <text x="160" y="130" class="content" fill="#FFFFFF">Obj</text>
  </g>
</svg>