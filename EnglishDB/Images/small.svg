<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">small</text>
  <text x="50" y="120" class="subtitle">[smɔːl] adj. 小的，少的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sma- (小) + -all (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小蚂蚁(sma-)在巨大的草丛中爬行，
    <tspan x="50" dy="25">它的身影显得格外微小(small)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a small collection of stamps.
  </text>
  <text x="50" y="310" class="content">
    她有一个小型的邮票收藏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Ant -->
    <circle cx="175" cy="100" r="10" class="image" />
    <line x1="175" y1="110" x2="175" y2="140" class="image" />
    <line x1="175" y1="140" x2="165" y2="160" class="image" />
    <line x1="175" y1="140" x2="185" y2="160" class="image" />
    <line x1="175" y1="120" x2="200" y2="110" class="image" />
  </g>
</svg>