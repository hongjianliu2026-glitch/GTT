<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consensual</text>
  <text x="50" y="120" class="subtitle">[kənˈsɛnʃuəl] adj. 一致同意的，合意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + sens (感觉) + -ual (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在会议室里，"共同感觉(con-sens)"
    <tspan x="50" dy="25">到某个决定是正确的，大家都点头同意(consensual)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The agreement was reached through consensual discussion.
  </text>
  <text x="50" y="310" class="content">
    协议是通过一致同意的讨论达成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <!-- Table -->
    <rect x="30" y="80" width="290" height="50" class="image" />
    <!-- Agreeing gestures -->
    <line x1="50" y1="70" x2="50" y2="90" class="image" />
    <line x1="100" y1="70" x2="100" y2="90" class="image" />
    <line x1="150" y1="70" x2="150" y2="90" class="image" />
    <line x1="200" y1="70" x2="200" y2="90" class="image" />
  </g>
</svg>