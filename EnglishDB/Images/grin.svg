<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grin</text>
  <text x="50" y="120" class="subtitle">[ɡrɪn] v. 露齿而笑；n. 露齿笑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grin (源自中古英语，意为“露齿笑”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为听到一个超级搞笑的笑话，
    <tspan x="50" dy="25">忍不住"露齿大笑(grin)"，笑得眼睛都眯成了一条缝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He couldn't help but grin when he heard the joke.
  </text>
  <text x="50" y="310" class="content">
    他听到那个笑话时忍不住露齿而笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 40 140 Q 100 180 160 140" class="image" />
  </g>
</svg>