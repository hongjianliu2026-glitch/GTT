<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pay</text>
  <text x="50" y="120" class="subtitle">[peɪ] v. 支付，付款；n. 工资，报酬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pay (来自古法语 "paier"，意为支付)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人从口袋里掏出硬币，"支付(pay)"
    <tspan x="50" dy="25">给店员，完成交易。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He paid for the meal with cash.
  </text>
  <text x="50" y="310" class="content">
    他用现金支付了餐费。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pocket -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hand reaching into pocket -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <!-- Coins -->
    <circle cx="70" cy="110" r="10" class="image" />
    <circle cx="90" cy="110" r="10" class="image" />
    <circle cx="110" cy="110" r="10" class="image" />
    <!-- Cash register -->
    <rect x="150" y="20" width="150" height="160" class="image" />
    <!-- Money coming out -->
    <line x1="225" y1="50" x2="225" y2="100" class="image" />
    <circle cx="225" cy="110" r="10" class="image" />
  </g>
</svg>