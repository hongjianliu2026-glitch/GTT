<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mid-afternoon</text>
  <text x="50" y="120" class="subtitle">[ˌmɪd ˌæftərˈnuːn] n. 下午中段</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mid- (中间) + afternoon (下午)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟，指针指向"下午的中间(mid-afternoon)"，
    <tspan x="50" dy="25">阳光斜照，人们开始感到一丝倦意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We usually have a coffee break around mid-afternoon.
  </text>
  <text x="50" y="310" class="content">
    我们通常在下午中段喝杯咖啡休息一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" fill="#F1C40F" />
    <line x1="250" y1="20" x2="250" y2="0" class="image" />
    <line x1="280" y1="50" x2="300" y2="50" class="image" />
    <line x1="250" y1="80" x2="250" y2="100" class="image" />
    <line x1="220" y1="50" x2="200" y2="50" class="image" />
  </g>
</svg>