<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">revenge</text>
  <text x="50" y="120" class="subtitle">[rɪˈvɛndʒ] n. 复仇，报复</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + venge (惩罚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被欺负后，"再次惩罚(re-venge)"
    <tspan x="50" dy="25">那个欺负他的人，这就是复仇(revenge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He sought revenge for his brother's death.
  </text>
  <text x="50" y="310" class="content">
    他为兄弟的死寻求复仇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person being bullied -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <!-- Bully -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />

    <!-- Revenge action -->
    <line x1="50" y1="160" x2="200" y2="160" class="image" stroke-dasharray="5,5" />
    <polygon points="200,160 180,180 220,180" class="image" />
  </g>
</svg>