<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contingent</text>
  <text x="50" y="120" class="subtitle">[kənˈtɪndʒənt] adj. 可能发生的；n. 代表团</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + ting (接触) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个代表团(contingent)在会议室里，"共同接触(con-ting)"
    <tspan x="50" dy="25">并讨论可能发生的事情，这些事情就是可能发生的(contingent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The success of the project is contingent on the weather.
  </text>
  <text x="50" y="310" class="content">
    项目的成功取决于天气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People -->
    <circle cx="80" cy="60" r="15" class="image" />
    <circle cx="150" cy="60" r="15" class="image" />
    <circle cx="220" cy="60" r="15" class="image" />
    <!-- Hands shaking -->
    <line x1="80" y1="80" x2="150" y2="80" class="image" />
    <line x1="150" y1="80" x2="220" y2="80" class="image" />
    <!-- Lightning bolt -->
    <polyline points="280,20 300,60 280,100" class="image" />
    <!-- Cloud -->
    <ellipse cx="300" cy="40" rx="30" ry="20" class="image" />
  </g>
</svg>