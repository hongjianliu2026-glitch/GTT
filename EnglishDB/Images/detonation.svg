<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">detonation</text>
  <text x="50" y="120" class="subtitle">[ˌdiːtəˈneɪʃn] n. 爆炸，引爆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + ton (声音) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的炸弹被引爆，"向下发出(de-ton)"
    <tspan x="50" dy="25">震耳欲聋的声音，这就是爆炸(detonation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detonation of the bomb caused widespread damage.
  </text>
  <text x="50" y="310" class="content">
    炸弹的爆炸造成了广泛的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bomb -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <!-- Explosion -->
    <circle cx="50" cy="50" r="40" class="image" />
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <!-- Sound waves -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="25" y1="125" x2="75" y2="125" class="image" />
    <line x1="0" y1="150" x2="100" y2="150" class="image" />
  </g>
</svg>