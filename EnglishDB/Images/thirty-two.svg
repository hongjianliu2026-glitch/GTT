<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thirty-two</text>
  <text x="50" y="120" class="subtitle">[ˈθɜːrti tuː] n. 三十二</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thirty (三十) + two (二)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“30”和一个小的数字“2”，
    <tspan x="50" dy="25">它们像一对好朋友一样紧紧靠在一起，组成了“32”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are thirty-two students in the class.
  </text>
  <text x="50" y="310" class="content">
    班里有三十二个学生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large number 30 -->
    <text x="0" y="100" font-size="150" class="image">30</text>
    <!-- Small number 2 -->
    <text x="180" y="100" font-size="100" class="image">2</text>
    <!-- Connecting line -->
    <line x1="150" y1="100" x2="180" y2="100" class="image" />
  </g>
</svg>