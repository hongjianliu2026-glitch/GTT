<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDE3E3; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">demonic</text>
  <text x="50" y="120" class="subtitle">[ˈdiːmənɪk] adj. 恶魔般的，邪恶的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> demo- (人民) + -nic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶魔(demon)在人群中(demo-)，
    <tspan x="50" dy="25">散播邪恶的力量，让人感到恐惧和不安。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The demonic laughter echoed through the dark forest.
  </text>
  <text x="50" y="310" class="content">
    恶魔般的笑声在黑暗的森林中回荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Demon face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <path d="M80 140 Q100 160 120 140" class="image" />

    <!-- Crowd -->
    <circle cx="20" cy="200" r="10" class="image" />
    <circle cx="50" cy="200" r="10" class="image" />
    <circle cx="80" cy="200" r="10" class="image" />
    <circle cx="110" cy="200" r="10" class="image" />
    <circle cx="140" cy="200" r="10" class="image" />
    <circle cx="170" cy="200" r="10" class="image" />
    <circle cx="200" cy="200" r="10" class="image" />
  </g>
</svg>