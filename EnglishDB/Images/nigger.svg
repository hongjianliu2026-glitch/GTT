<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nigger</text>
  <text x="50" y="120" class="subtitle">[ˈnɪɡər] n. 黑人（带有种族歧视色彩的贬义词）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自中古英语“negre”，源自西班牙语“negro”，意为“黑色的”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黑暗的夜晚，一个黑色的剪影站在月光下，
    <tspan x="50" dy="25">这个剪影象征着被压迫和歧视的黑人群体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The use of the word "nigger" is highly offensive and should be avoided.
  </text>
  <text x="50" y="310" class="content">
    使用“nigger”这个词是非常冒犯的，应该避免。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark silhouette -->
    <path d="M50 20 L250 20 L250 180 L50 180 Z" class="image" />
    <!-- Moon -->
    <circle cx="300" cy="100" r="30" class="image" />
    <!-- Stars -->
    <circle cx="200" cy="50" r="3" class="image" />
    <circle cx="220" cy="70" r="3" class="image" />
    <circle cx="240" cy="90" r="3" class="image" />
  </g>
</svg>