<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gasp</text>
  <text x="50" y="120" class="subtitle">[ɡæsp] v. 喘气，倒抽气；n. 喘气声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gas (气) + p (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在极度惊讶时，"气(gas)"突然被"抽(p)"走，
    <tspan x="50" dy="25">发出一声喘气(gasp)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gasped when she saw the unexpected gift.
  </text>
  <text x="50" y="310" class="content">
    她看到意外的礼物时倒抽了一口气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Gas -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="125" y1="100" x2="125" y2="50" class="image" />
    <line x1="125" y1="50" x2="100" y2="50" class="image" />
    <line x1="125" y1="50" x2="150" y2="50" class="image" />
    <!-- P -->
    <line x1="170" y1="100" x2="170" y2="150" class="image" />
    <line x1="170" y1="150" x2="150" y2="130" class="image" />
    <line x1="170" y1="150" x2="190" y2="130" class="image" />
  </g>
</svg>