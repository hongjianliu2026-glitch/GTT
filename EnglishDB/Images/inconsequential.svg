<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inconsequential</text>
  <text x="50" y="120" class="subtitle">[ˌɪnkənˈsɛkwəntʃuəl] adj. 不重要的，无关紧要的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + con- (一起) + sequent (跟随) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的事件发生，但所有"跟随(sequent)"而来的后果都"不重要(inconsequential)"，
    <tspan x="50" dy="25">就像一阵微风，轻轻吹过，不留痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His late arrival was inconsequential to the meeting's outcome.
  </text>
  <text x="50" y="310" class="content">
    他迟到对会议结果无关紧要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Big event -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Small consequences -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <circle cx="100" cy="250" r="5" class="image" />
    <line x1="100" y1="150" x2="50" y2="200" class="image" />
    <circle cx="50" cy="200" r="5" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <circle cx="150" cy="200" r="5" class="image" />
    <!-- Wind -->
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="140" class="image" />
    <line x1="200" y1="150" x2="180" y2="160" class="image" />
  </g>
</svg>