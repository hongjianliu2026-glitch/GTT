<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intersect</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈsekt] v. 相交，交叉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + sect (切割)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两条道路在中间"切割(sect)"，
    <tspan x="50" dy="25">它们"在...之间(inter-)"相交，形成了一个十字路口。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two lines intersect at the center.
  </text>
  <text x="50" y="310" class="content">
    这两条线在中心相交。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Road 1 -->
    <line x1="0" y1="100" x2="400" y2="100" class="image" />
    <!-- Road 2 -->
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <!-- Intersection point -->
    <circle cx="200" cy="100" r="10" fill="#E74C3C" />
    <!-- Annotation -->
    <text x="220" y="110" class="content" fill="#E74C3C">交叉点</text>
  </g>
</svg>