<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scorer</text>
  <text x="50" y="120" class="subtitle">[ˈskɔːrər] n. 得分者，记分员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> score (得分) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个篮球运动员在比赛中，"得分(score)"
    <tspan x="50" dy="25">后，他就是一个得分者(scorer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is the top scorer in the league.
  </text>
  <text x="50" y="310" class="content">
    他是联赛中的头号得分手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basketball hoop -->
    <circle cx="150" cy="100" r="50" class="image" />
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <line x1="100" y1="200" x2="200" y2="200" class="image" />
    <!-- Basketball -->
    <circle cx="200" cy="150" r="20" class="image" fill="#F39C12" />
    <!-- Scorer -->
    <circle cx="100" cy="250" r="15" class="image" />
    <line x1="100" y1="265" x2="100" y2="300" class="image" />
    <line x1="100" y1="300" x2="80" y2="330" class="image" />
    <line x1="100" y1="300" x2="120" y2="330" class="image" />
    <line x1="100" y1="280" x2="130" y2="270" class="image" />
  </g>
</svg>