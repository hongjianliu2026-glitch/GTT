<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dioxin</text>
  <text x="50" y="120" class="subtitle">[daɪˈɒksɪn] n. 二噁英</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (二) + ox (氧) + in (化合物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学实验室里，"两个氧(di-ox)"
    <tspan x="50" dy="25">结合成一种有毒的化合物(in)，这就是二噁英(dioxin)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory was fined for releasing dioxin into the river.
  </text>
  <text x="50" y="310" class="content">
    工厂因向河流排放二噁英而被罚款。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chemical structure -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <!-- Toxic symbol -->
    <polygon points="200,80 220,120 180,120" class="image" />
    <text x="190" y="110" class="image" style="font: bold 24px sans-serif; fill: #C0392B;">!</text>
  </g>
</svg>