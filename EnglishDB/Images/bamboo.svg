<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #1A5276; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bamboo</text>
  <text x="50" y="120" class="subtitle">[bæmˈbuː] n. 竹子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自马来语 "mambu"，意为“竹子”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片茂密的竹林，"竹子(bamboo)"
    <tspan x="50" dy="25">高耸入云，仿佛在诉说着古老的故事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The panda's favorite food is bamboo.
  </text>
  <text x="50" y="310" class="content">
    熊猫最喜欢的食物是竹子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bamboo stalks -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="150" y1="0" x2="150" y2="200" class="image" />
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <line x1="250" y1="0" x2="250" y2="200" class="image" />
    <!-- Bamboo leaves -->
    <polyline points="50,0 30,20 70,20" class="image" />
    <polyline points="100,0 80,20 120,20" class="image" />
    <polyline points="150,0 130,20 170,20" class="image" />
    <polyline points="200,0 180,20 220,20" class="image" />
    <polyline points="250,0 230,20 270,20" class="image" />
  </g>
</svg>