<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">larva</text>
  <text x="50" y="120" class="subtitle">[ˈlɑːrvə] n. 幼虫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> larv (面具) + -a (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只幼虫戴着"面具(larv)"，
    <tspan x="50" dy="25">它正在慢慢蜕变成美丽的蝴蝶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The butterfly starts its life as a larva.
  </text>
  <text x="50" y="310" class="content">
    蝴蝶的生命始于幼虫阶段。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Larva body -->
    <ellipse cx="150" cy="100" rx="70" ry="30" class="image" />
    <!-- Larva head -->
    <circle cx="150" cy="70" r="20" class="image" />
    <!-- Larva legs -->
    <line x1="80" y1="100" x2="60" y2="120" class="image" />
    <line x1="90" y1="100" x2="70" y2="120" class="image" />
    <line x1="100" y1="100" x2="80" y2="120" class="image" />
    <line x1="220" y1="100" x2="240" y2="120" class="image" />
    <line x1="210" y1="100" x2="230" y2="120" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
    <!-- Mask -->
    <rect x="130" y="50" width="40" height="20" class="image" />
    <line x1="140" y1="50" x2="140" y2="30" class="image" />
    <line x1="160" y1="50" x2="160" y2="30" class="image" />
  </g>
</svg>