<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trooper</text>
  <text x="50" y="120" class="subtitle">[ˈtruːpər] n. 骑兵，警察</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trop (军队) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的骑兵，"军队中的(trop-er)"
    <tspan x="50" dy="25">战士，他骑着马在战场上冲锋陷阵。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The trooper bravely charged into battle.
  </text>
  <text x="50" y="310" class="content">
    骑兵勇敢地冲入战场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Horse head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Horse neck -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Horse front leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Horse back leg -->
    <line x1="50" y1="150" x2="100" y2="150" class="image" /> <!-- Horse back -->
    <line x1="100" y1="150" x2="100" y2="180" class="image" /> <!-- Horse rider -->
    <circle cx="100" cy="140" r="10" class="image" /> <!-- Rider head -->
    <line x1="100" y1="150" x2="100" y2="180" class="image" /> <!-- Rider body -->
    <line x1="100" y1="180" x2="80" y2="200" class="image" /> <!-- Rider left leg -->
    <line x1="100" y1="180" x2="120" y2="200" class="image" /> <!-- Rider right leg -->
  </g>
</svg>