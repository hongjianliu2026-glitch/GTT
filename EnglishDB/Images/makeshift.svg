<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">makeshift</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪkʃɪft] adj. 临时的，权宜的；n. 临时替代品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> make (制作) + shift (移动，改变)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在紧急情况下，"制作(make)"
    <tspan x="50" dy="25">一个"移动(shift)"的临时解决方案，这就是makeshift。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a makeshift table for the meeting.
  </text>
  <text x="50" y="310" class="content">
    他用一个临时桌子来开会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Makeshift table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Books as legs -->
    <rect x="60" y="180" width="40" height="20" class="image" />
    <rect x="160" y="180" width="40" height="20" class="image" />
    <rect x="260" y="180" width="40" height="20" class="image" />
    <!-- Person -->
    <circle cx="200" cy="250" r="15" class="image" />
    <line x1="200" y1="265" x2="200" y2="300" class="image" />
    <line x1="200" y1="300" x2="180" y2="330" class="image" />
    <line x1="200" y1="300" x2="220" y2="330" class="image" />
    <line x1="200" y1="280" x2="230" y2="270" class="image" />
  </g>
</svg>