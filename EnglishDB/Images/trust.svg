      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trust</text>
  <text x="50" y="120" class="subtitle">[trʌst] n. 信任，信赖；v. 信任，信赖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trus- (拉丁语 "trust" 的词根)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人将他的心形钥匙交给另一个人，象征着"信任(trust)"
    <tspan x="50" dy="25">和信赖。这个动作表达了深厚的情感和依赖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She placed her trust in him to keep the secret.
  </text>
  <text x="50" y="310" class="content">
    她信任他保守秘密。
  </text>

