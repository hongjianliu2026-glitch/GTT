<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wide-ranging</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪdˈreɪndʒɪŋ] adj. 广泛的，范围广的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wide (宽的) + range (范围) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头，从一个小点开始，"范围(range)"
    <tspan x="50" dy="25">不断扩大，直到覆盖了整个"宽广(wide)"的区域。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The conference covered a wide-ranging set of topics.
  </text>
  <text x="50" y="310" class="content">
    会议涵盖了一系列广泛的主题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wide-ranging arrow -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="350" y1="0" x2="300" y2="50" class="image" />
    <line x1="350" y1="0" x2="300" y2="-50" class="image" />
    <!-- Wide area -->
    <rect x="0" y="-100" width="350" height="200" class="image" />
    <!-- Small point -->
    <circle cx="0" cy="0" r="10" class="image" />
  </g>
</svg>