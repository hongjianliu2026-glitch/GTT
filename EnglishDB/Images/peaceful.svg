<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9F9F9; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peaceful</text>
  <text x="50" y="120" class="subtitle">[ˈpiːsfl] adj. 和平的，平静的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peace (和平) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宁静的湖面，"充满和平(peace-ful)"
    <tspan x="50" dy="25">的氛围，周围没有任何喧嚣，只有微风轻拂。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The village was a peaceful place to live.
  </text>
  <text x="50" y="310" class="content">
    这个村庄是一个宁静的居住地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Lake -->
    <ellipse cx="200" cy="150" rx="150" ry="70" class="image" />
    <!-- Sun -->
    <circle cx="350" cy="50" r="30" class="image" />
    <!-- Trees -->
    <line x1="50" y1="150" x2="50" y2="250" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <!-- Birds -->
    <line x1="250" y1="100" x2="270" y2="80" class="image" />
    <line x1="270" y1="80" x2="290" y2="100" class="image" />
    <line x1="300" y1="100" x2="320" y2="80" class="image" />
    <line x1="320" y1="80" x2="340" y2="100" class="image" />
  </g>
</svg>