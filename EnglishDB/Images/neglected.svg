<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neglected</text>
  <text x="50" y="120" class="subtitle">[nɪˈɡlɛktɪd] adj. 被忽视的，疏忽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neg- (不) + lect (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被遗忘的花园，"不选择(neg-lect)"
    <tspan x="50" dy="25">去照顾，结果花园变得杂草丛生，这就是被忽视(neglected)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden was neglected for years and became overgrown.
  </text>
  <text x="50" y="310" class="content">
    这个花园被忽视了多年，变得杂草丛生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden fence -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Overgrown plants -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Neglected sign -->
    <text x="150" y="180" class="image" style="font: bold 24px sans-serif; fill: #C0392B;">Neglected</text>
  </g>
</svg>