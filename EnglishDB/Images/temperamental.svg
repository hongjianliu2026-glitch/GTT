<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">temperamental</text>
  <text x="50" y="120" class="subtitle">[ˌtɛmpərəˈmɛntl] adj. 情绪多变的，易怒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tempera (脾气) + mental (精神的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人，他的脾气(tempera)像天气一样多变，
    <tspan x="50" dy="25">一会儿阳光灿烂，一会儿乌云密布，这就是temperamental。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is known for her temperamental nature.
  </text>
  <text x="50" y="310" class="content">
    她以情绪多变而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Cloud -->
    <ellipse cx="150" cy="50" rx="40" ry="20" class="image" fill="#ECF0F1" />
    <ellipse cx="120" cy="40" rx="30" ry="15" class="image" fill="#ECF0F1" />
    <ellipse cx="180" cy="40" rx="30" ry="15" class="image" fill="#ECF0F1" />
    <!-- Rain -->
    <line x1="130" y1="70" x2="130" y2="90" class="image" />
    <line x1="150" y1="70" x2="150" y2="90" class="image" />
    <line x1="170" y1="70" x2="170" y2="90" class="image" />
    <!-- Person -->
    <circle cx="250" cy="50" r="20" class="image" fill="#2ECC71" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <line x1="250" y1="80" x2="230" y2="70" class="image" />
    <line x1="250" y1="80" x2="270" y2="70" class="image" />
    <line x1="250" y1="100" x2="230" y2="120" class="image" />
    <line x1="250" y1="100" x2="270" y2="120" class="image" />
  </g>
</svg>