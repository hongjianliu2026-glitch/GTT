<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intoxication</text>
  <text x="50" y="120" class="subtitle">[ˌɪntɒksɪˈkeɪʃn] n. 陶醉，中毒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + toxic (毒) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人喝了一杯酒，"进入(in-)"了"毒(toxic)"的状态，
    <tspan x="50" dy="25">整个人都陶醉(intoxication)了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The intoxication from the wine made him feel light-headed.
  </text>
  <text x="50" y="310" class="content">
    酒的陶醉让他感到头晕目眩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass of wine -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="160" r="40" class="image" />
    <!-- Person feeling light-headed -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
  </g>
</svg>