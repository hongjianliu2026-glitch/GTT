<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">advocacy</text>
  <text x="50" y="120" class="subtitle">[ˈædvəkəsi] n. 拥护，支持</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + voc (声音) + -acy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在讲台上，"朝向(ad-)"
    <tspan x="50" dy="25">观众大声"发声(voc)"，表达对某事的强烈支持，</tspan>
    <tspan x="50" dy="25">这就是"拥护(advocacy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is known for her advocacy of women's rights.
  </text>
  <text x="50" y="310" class="content">
    她以支持妇女权利而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Microphone -->
    <line x1="80" y1="130" x2="120" y2="130" class="image" />
    <line x1="120" y1="130" x2="120" y2="100" class="image" />
    <line x1="120" y1="100" x2="100" y2="80" class="image" />
    <line x1="100" y1="80" x2="140" y2="80" class="image" />
    <line x1="140" y1="80" x2="140" y2="100" class="image" />
    <line x1="140" y1="100" x2="120" y2="130" class="image" />
    <!-- Audience -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
  </g>
</svg>