<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sane</text>
  <text x="50" y="120" class="subtitle">[seɪn] adj. 神志正常的，理智的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> san- (健康，健全)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在阳光下微笑，"健康(san-)"
    <tspan x="50" dy="25">的心灵让他保持理智(sane)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's important to stay sane during stressful times.
  </text>
  <text x="50" y="310" class="content">
    在压力大的时候保持理智很重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="200" cy="150" r="30" fill="#2ECC71" />
    <line x1="200" y1="180" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="170" y2="300" class="image" />
    <line x1="200" y1="250" x2="230" y2="300" class="image" />
    <line x1="200" y1="200" x2="150" y2="220" class="image" />
    <line x1="200" y1="200" x2="250" y2="220" class="image" />
    <!-- Smile -->
    <path d="M185,140 Q195,130 205,140" stroke="#34495E" stroke-width="2" fill="none" />
  </g>
</svg>