<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">garbage</text>
  <text x="50" y="120" class="subtitle">[ˈɡɑːrbɪdʒ] n. 垃圾，废物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> garb (衣服) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的垃圾堆，里面堆满了破旧的"衣服(garb)"，
    <tspan x="50" dy="25">这些衣服已经无法再穿，变成了"垃圾(garbage)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The street was littered with garbage after the festival.
  </text>
  <text x="50" y="310" class="content">
    节日过后，街道上到处都是垃圾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garbage pile -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Old clothes -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Trash bags -->
    <rect x="50" y="90" width="50" height="50" class="image" />
    <rect x="120" y="90" width="50" height="50" class="image" />
    <rect x="190" y="90" width="50" height="50" class="image" />
    <rect x="260" y="90" width="50" height="50" class="image" />
    <!-- Broken items -->
    <line x1="50" y1="160" x2="100" y2="160" class="image" />
    <line x1="120" y1="160" x2="170" y2="160" class="image" />
    <line x1="190" y1="160" x2="240" y2="160" class="image" />
    <line x1="260" y1="160" x2="310" y2="160" class="image" />
  </g>
</svg>