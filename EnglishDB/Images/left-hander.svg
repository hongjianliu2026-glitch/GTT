<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">left-hander</text>
  <text x="50" y="120" class="subtitle">[ˈlɛftˌhændər] n. 左撇子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> left (左) + hand (手) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个左撇子(left-hander)在用左手写字，
    <tspan x="50" dy="25">他的左手(left hand)在纸上飞舞，字迹清晰可见。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a left-hander, so he uses his left hand to write.
  </text>
  <text x="50" y="310" class="content">
    他是个左撇子，所以用左手写字。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Left hand -->
    <path d="M50 100 C50 50, 100 50, 100 100 L100 150 C100 200, 50 200, 50 150 Z" class="image" />
    <!-- Pen -->
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="150" y2="80" class="image" />
    <line x1="150" y1="80" x2="140" y2="80" class="image" />
    <!-- Paper -->
    <rect x="160" y="100" width="100" height="50" class="image" />
    <!-- Writing -->
    <line x1="170" y1="120" x2="180" y2="120" class="image" />
    <line x1="180" y1="120" x2="180" y2="130" class="image" />
    <line x1="180" y1="130" x2="190" y2="130" class="image" />
    <line x1="190" y1="130" x2="190" y2="120" class="image" />
    <line x1="190" y1="120" x2="200" y2="120" class="image" />
  </g>
</svg>