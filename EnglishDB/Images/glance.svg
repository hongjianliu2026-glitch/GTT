<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glance</text>
  <text x="50" y="120" class="subtitle">[ɡlæns] v. 瞥一眼，扫视；n. 一瞥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gl- (光) + ance (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在阳光下，"光(gl-)"
    <tspan x="50" dy="25">速地"动作(ance)"，只用了一瞬间就瞥了一眼(glance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave him a quick glance before leaving.
  </text>
  <text x="50" y="310" class="content">
    她在离开前快速地看了他一眼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="image" fill="#F39C12" />
    <!-- Person -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Eye -->
    <circle cx="150" cy="90" r="5" class="image" fill="#000" />
    <!-- Glance line -->
    <line x1="150" y1="90" x2="80" y2="50" class="image" stroke-dasharray="5,5" />
  </g>
</svg>