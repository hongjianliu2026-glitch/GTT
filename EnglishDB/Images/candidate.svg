<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">candidate</text>
  <text x="50" y="120" class="subtitle">[ˈkændɪdeɪt] n. 候选人，应试者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cand (白，发光) + -id (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个候选人站在舞台上，"发光(cand)"
    <tspan x="50" dy="25">如同明星，吸引所有人的目光，他就是候选人(candidate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The candidate delivered a powerful speech.
  </text>
  <text x="50" y="310" class="content">
    这位候选人发表了一场有力的演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Candidate -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="120" y2="140" class="image" />
    <line x1="175" y1="150" x2="230" y2="140" class="image" />
    <!-- Spotlight -->
    <circle cx="175" cy="50" r="40" class="image" stroke-dasharray="5,5" />
  </g>
</svg>