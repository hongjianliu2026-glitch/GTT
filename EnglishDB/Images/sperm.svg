<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sperm</text>
  <text x="50" y="120" class="subtitle">[spɜːrm] n. 精子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sperma (种子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗种子(sperma)在水中游动，
    <tspan x="50" dy="25">就像精子(sperm)在寻找卵子一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor analyzed the sperm count.
  </text>
  <text x="50" y="310" class="content">
    医生分析了精子的数量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#A9CCE3" />
    <!-- Sperm -->
    <circle cx="50" cy="100" r="10" class="image" fill="#2ECC71" />
    <line x1="60" y1="100" x2="100" y2="100" class="image" />
    <line x1="60" y1="100" x2="80" y2="90" class="image" />
    <line x1="60" y1="100" x2="80" y2="110" class="image" />
    <circle cx="150" cy="120" r="10" class="image" fill="#2ECC71" />
    <line x1="160" y1="120" x2="200" y2="120" class="image" />
    <line x1="160" y1="120" x2="180" y2="110" class="image" />
    <line x1="160" y1="120" x2="180" y2="130" class="image" />
  </g>
</svg>