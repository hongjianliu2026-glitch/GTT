<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">luster</text>
  <text x="50" y="120" class="subtitle">[ˈlʌstər] n. 光泽，光彩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lust (光) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗宝石在阳光下闪耀，"光(lust)"
    <tspan x="50" dy="25">芒四射，散发出迷人的光泽(luster)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The luster of the diamond caught everyone's eye.
  </text>
  <text x="50" y="310" class="content">
    钻石的光泽吸引了所有人的目光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diamond -->
    <polygon points="175,10 230,150 120,150" class="image" />
    <!-- Sun rays -->
    <line x1="175" y1="10" x2="175" y2="0" class="image" />
    <line x1="230" y1="150" x2="280" y2="150" class="image" />
    <line x1="120" y1="150" x2="70" y2="150" class="image" />
    <line x1="175" y1="10" x2="175" y2="0" class="image" />
    <line x1="230" y1="150" x2="280" y2="150" class="image" />
    <line x1="120" y1="150" x2="70" y2="150" class="image" />
    <!-- Light reflection -->
    <circle cx="175" cy="80" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
    <circle cx="150" cy="120" r="10" class="image" />
  </g>
</svg>