<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reshape</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈʃeɪp] v. 重塑，改造</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + shape (形状)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个雕塑家正在"再次塑造(re-shape)"
    <tspan x="50" dy="25">一块泥土，将其变成一个全新的形状。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist reshaped the clay into a beautiful vase.
  </text>
  <text x="50" y="310" class="content">
    艺术家将泥土重塑成一个美丽的花瓶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Original shape -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- New shape -->
    <rect x="200" y="0" width="100" height="150" class="image" />
    <!-- Arrow -->
    <line x1="160" y1="50" x2="190" y2="50" class="image" />
    <polygon points="190,50 185,45 185,55" class="image" />
    <!-- Sculptor -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
  </g>
</svg>