<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #7D3C98; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">zombie</text>
  <text x="50" y="120" class="subtitle">[ˈzɒmbi] n. 僵尸，行尸走肉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自非洲刚果语中的"nzambi"，意为"神灵"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被"神灵(nzambi)"控制的行尸走肉，
    <tspan x="50" dy="25">它们毫无意识地游荡，这就是僵尸(zombie)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was filled with scary zombies.
  </text>
  <text x="50" y="310" class="content">
    这部电影里充满了可怕的僵尸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Zombie head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="10" class="image" />
    <circle cx="120" cy="90" r="10" class="image" />
    <!-- Mouth -->
    <rect x="85" y="110" width="30" height="10" class="image" />
    <!-- Body -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Arms -->
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <!-- Legs -->
    <line x1="80" y1="250" x2="80" y2="300" class="image" />
    <line x1="120" y1="250" x2="120" y2="300" class="image" />
  </g>
</svg>