<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bawl</text>
  <text x="50" y="120" class="subtitle">[bɔːl] v. 大声哭喊，嚎叫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bawl (源自中古英语“bawlen”，意为“大声喊叫”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子在电影院里，因为害怕电影中的怪物而"大声哭喊(bawl)"，
    <tspan x="50" dy="25">声音大到整个影院都能听到。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby bawled loudly when he was left alone.
  </text>
  <text x="50" y="310" class="content">
    宝宝独自一人时大声哭喊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Theater screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Child -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Mouth -->
    <ellipse cx="50" cy="110" rx="20" ry="10" class="image" />
    <!-- Monster on screen -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="170" class="image" />
    <line x1="250" y1="170" x2="220" y2="200" class="image" />
    <line x1="250" y1="170" x2="280" y2="200" class="image" />
    <line x1="250" y1="150" x2="300" y2="140" class="image" />
  </g>
</svg>