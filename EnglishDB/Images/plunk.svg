<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plunk</text>
  <text x="50" y="120" class="subtitle">[plʌŋk] v. 重击，砰地放下</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plumb (重) + -unk (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的铁球"砰地(plunk)"砸在地上，
    <tspan x="50" dy="25">发出沉重的声音，这就是plunk的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He plunked the heavy book on the table.
  </text>
  <text x="50" y="310" class="content">
    他把那本厚重的书砰地放在桌子上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Heavy ball -->
    <circle cx="100" cy="150" r="30" class="image" />
    <!-- Impact -->
    <line x1="100" y1="150" x2="100" y2="180" class="image" />
    <line x1="80" y1="170" x2="120" y2="170" class="image" />
    <line x1="90" y1="160" x2="110" y2="160" class="image" />
  </g>
</svg>