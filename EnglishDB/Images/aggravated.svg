<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aggravated</text>
  <text x="50" y="120" class="subtitle">[ˈæɡrəveɪtɪd] adj. 加重的，恶化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ag- (加强) + grav (重) + -ate (动词后缀) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原本就沉重的石头，"加强(ag-grav)"
    <tspan x="50" dy="25">了重量，变得更重了，这就是"加重的(aggravated)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The situation was aggravated by the lack of communication.
  </text>
  <text x="50" y="310" class="content">
    由于缺乏沟通，情况变得更加严重。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heavy stone -->
    <rect x="0" y="0" width="150" height="150" class="image" />
    <!-- Additional weight -->
    <rect x="50" y="50" width="50" height="50" class="image" />
    <!-- Person struggling -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Arrows -->
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <polygon points="150,150 140,145 140,155" class="image" />
  </g>
</svg>