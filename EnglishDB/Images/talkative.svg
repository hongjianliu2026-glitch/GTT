<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">talkative</text>
  <text x="50" y="120" class="subtitle">[ˈtɔːkətɪv] adj. 健谈的，多话的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> talk (说话) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个健谈的人，嘴巴像瀑布一样不停地"说话(talk)"，
    <tspan x="50" dy="25">水流从他的嘴里喷涌而出，形成了一个巨大的瀑布，这就是"talkative"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is very talkative and can chat for hours.
  </text>
  <text x="50" y="310" class="content">
    她非常健谈，可以聊上好几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Waterfall -->
    <path d="M 100 70 Q 100 150 150 150 L 150 200 Q 100 200 100 250 L 100 300 Q 50 300 50 250 L 50 200 Q 100 200 100 150 Z" class="image" />
    <!-- Water drops -->
    <circle cx="120" cy="160" r="5" class="image" />
    <circle cx="130" cy="180" r="5" class="image" />
    <circle cx="110" cy="200" r="5" class="image" />
    <circle cx="140" cy="220" r="5" class="image" />
  </g>
</svg>