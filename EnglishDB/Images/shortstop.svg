<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shortstop</text>
  <text x="50" y="120" class="subtitle">[ˈʃɔːrtstɒp] n. 棒球游击手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> short (短的) + stop (停止)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个棒球游击手在球场上，"短距离内迅速停止(short-stop)"
    <tspan x="50" dy="25">并接住飞来的球，这就是游击手(shortstop)的职责。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shortstop made an amazing catch to end the inning.
  </text>
  <text x="50" y="310" class="content">
    游击手完成了一次惊人的接球，结束了这一局。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baseball field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Shortstop position -->
    <circle cx="175" cy="100" r="15" class="image" />
    <!-- Ball -->
    <circle cx="250" cy="50" r="10" class="image" />
    <!-- Glove -->
    <rect x="160" y="85" width="30" height="30" class="image" />
    <!-- Movement line -->
    <line x1="175" y1="100" x2="240" y2="55" class="image" />
  </g>
</svg>