  <!-- Title -->
  <text x="50" y="80" class="title">unheard</text>
  <text x="50" y="120" class="subtitle">[ʌnˈhɜrd] adj. 未被听到的，未被注意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + heard (听到)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个声音在黑暗中呼喊，但没有人听到(un-heard)，
    <tspan x="50" dy="25">它就像被遗忘在角落的秘密。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her cries for help went unheard by the passersby.
  </text>
  <text x="50" y="310" class="content">
    她的呼救声被路人忽略了。
  </text>

