<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">being</text>
  <text x="50" y="120" class="subtitle">[ˈbiːɪŋ] n. 存在，生物；v. 是（be的现在分词）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (存在) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宇宙中，一个微小的生物"存在(be-ing)"
    <tspan x="50" dy="25">在星辰之间，这个生物的存在感被无限放大。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The existence of such beings is still a mystery.
  </text>
  <text x="50" y="310" class="content">
    这种生物的存在仍然是一个谜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Universe -->
    <circle cx="175" cy="100" r="150" class="image" />
    <!-- Stars -->
    <circle cx="75" cy="50" r="5" class="image" />
    <circle cx="275" cy="50" r="5" class="image" />
    <circle cx="175" cy="200" r="5" class="image" />
    <circle cx="100" cy="150" r="5" class="image" />
    <circle cx="250" cy="150" r="5" class="image" />
    <!-- Being -->
    <circle cx="175" cy="100" r="10" class="image" />
    <line x1="175" y1="110" x2="175" y2="140" class="image" />
    <line x1="175" y1="140" x2="165" y2="160" class="image" />
    <line x1="175" y1="140" x2="185" y2="160" class="image" />
    <line x1="175" y1="120" x2="190" y2="110" class="image" />
  </g>
</svg>