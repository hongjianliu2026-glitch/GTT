<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hindrance</text>
  <text x="50" y="120" class="subtitle">[ˈhɪndrəns] n. 障碍，妨碍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hind- (后面) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在跑步，突然被一个巨大的石头"挡在后面(hind-)"，
    <tspan x="50" dy="25">这个石头就成了他的障碍(hindrance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heavy rain was a hindrance to our outdoor plans.
  </text>
  <text x="50" y="310" class="content">
    大雨成了我们户外计划的障碍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Runner -->
    <line x1="0" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="80" class="image" />
    <line x1="100" y1="100" x2="80" y2="120" class="image" />
    <line x1="80" y1="80" x2="60" y2="80" class="image" />
    <line x1="80" y1="120" x2="60" y2="120" class="image" />
    <line x1="60" y1="80" x2="60" y2="120" class="image" />
    <!-- Hindrance (Rock) -->
    <rect x="120" y="80" width="80" height="40" class="image" />
    <text x="140" y="105" class="content" fill="#A93226">Rock</text>
  </g>
</svg>