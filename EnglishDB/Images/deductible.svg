<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deductible</text>
  <text x="50" y="120" class="subtitle">[dɪˈdʌktəbl] adj. 可扣除的；n. 扣除额</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + duct (引导) + -ible (可...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个会计师在计算账目时，"向下引导(de-duct)"
    <tspan x="50" dy="25">一部分费用，这部分费用就是可扣除的(deductible)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The insurance policy has a $500 deductible.
  </text>
  <text x="50" y="310" class="content">
    这份保险单有500美元的扣除额。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Money bag -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <circle cx="20" cy="20" r="10" class="image" />
    <circle cx="40" cy="20" r="10" class="image" />
    <circle cx="60" cy="20" r="10" class="image" />
    <circle cx="80" cy="20" r="10" class="image" />
    <circle cx="100" cy="20" r="10" class="image" />
    <circle cx="120" cy="20" r="10" class="image" />
    <circle cx="140" cy="20" r="10" class="image" />
    <!-- Arrow pointing down -->
    <line x1="75" y1="110" x2="75" y2="150" class="image" />
    <polygon points="70,150 80,150 75,160" class="image" />
    <!-- Deducted amount -->
    <rect x="50" y="170" width="50" height="30" class="image" />
    <text x="60" y="190" class="content">$500</text>
  </g>
</svg>