<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bountiful</text>
  <text x="50" y="120" class="subtitle">[ˈbaʊntɪfəl] adj. 丰富的，慷慨的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bount (给予) + -iful (充满的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的果篮，里面装满了各种水果，"充满(bount-iful)"
    <tspan x="50" dy="25">了慷慨的给予，象征着丰富的资源和慷慨的精神。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The harvest was bountiful this year.
  </text>
  <text x="50" y="310" class="content">
    今年的收成非常丰富。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basket -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fruits -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="70" r="25" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="70" r="25" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <circle cx="300" cy="70" r="25" class="image" />
    <!-- Overflowing fruits -->
    <circle cx="350" cy="50" r="20" class="image" />
    <circle cx="400" cy="70" r="25" class="image" />
    <circle cx="450" cy="50" r="20" class="image" />
    <circle cx="500" cy="70" r="25" class="image" />
  </g>
</svg>