<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">doorknob</text>
  <text x="50" y="120" class="subtitle">[ˈdɔːrˌnɑːb] n. 门把手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> door (门) + knob (球形把手)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门把手(knob)，它比门(door)还要大，
    <tspan x="50" dy="25">你得用两只手才能转动它，打开那扇神秘的门。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She turned the doorknob and entered the room.
  </text>
  <text x="50" y="310" class="content">
    她转动门把手，进入了房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Doorknob -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Hand turning the knob -->
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
  </g>
</svg>