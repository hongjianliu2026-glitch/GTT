<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bedspread</text>
  <text x="50" y="120" class="subtitle">[ˈbɛdˌsprɛd] n. 床罩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bed (床) + spread (展开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的床罩，"展开(spread)"在床上，
    <tspan x="50" dy="25">覆盖整个床面，就像一张巨大的毯子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a new bedspread for her bedroom.
  </text>
  <text x="50" y="310" class="content">
    她为她的卧室买了一个新的床罩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mattress -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Bedspread -->
    <rect x="40" y="10" width="270" height="180" class="image" fill="#FADBD8" />
    <!-- Bedspread pattern -->
    <line x1="60" y1="40" x2="300" y2="40" class="image" />
    <line x1="60" y1="70" x2="300" y2="70" class="image" />
    <line x1="60" y1="100" x2="300" y2="100" class="image" />
    <line x1="60" y1="130" x2="300" y2="130" class="image" />
  </g>
</svg>