<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">socialite</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊʃəlaɪt] n. 社交名流</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soci (社会) + -al (形容词后缀) + -ite (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着华丽的人在社交场合中，"社会(soci)"
    <tspan x="50" dy="25">中活跃的"人(ite)"，这就是社交名流(socialite)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a well-known socialite in the city.
  </text>
  <text x="50" y="310" class="content">
    她是城里著名的社交名流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Socialite -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Social event -->
    <rect x="100" y="50" width="200" height="150" class="image" />
    <line x1="120" y1="70" x2="280" y2="70" class="image" />
    <line x1="120" y1="100" x2="250" y2="100" class="image" />
    <line x1="120" y1="130" x2="270" y2="130" class="image" />
    <line x1="120" y1="160" x2="240" y2="160" class="image" />
    <!-- Socialite at event -->
    <line x1="150" y1="100" x2="50" y2="130" class="image" />
  </g>
</svg>