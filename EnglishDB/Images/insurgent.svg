<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insurgent</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsɜːrdʒənt] n. 叛乱者，起义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + sur- (上升) + -gent (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群起义者"进入(in-)"城市，"上升(sur-)"到屋顶，
    <tspan x="50" dy="25">高呼口号，准备发动起义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The insurgent group launched a surprise attack on the government.
  </text>
  <text x="50" y="310" class="content">
    叛乱组织对政府发动了突然袭击。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- City skyline -->
    <rect x="0" y="100" width="350" height="100" class="image" />
    <!-- Buildings -->
    <rect x="50" y="120" width="50" height="80" class="image" />
    <rect x="120" y="110" width="50" height="90" class="image" />
    <rect x="190" y="130" width="50" height="70" class="image" />
    <rect x="260" y="120" width="50" height="80" class="image" />
    <!-- Insurgents on roof -->
    <circle cx="75" cy="100" r="10" class="image" />
    <line x1="75" y1="110" x2="75" y2="140" class="image" />
    <line x1="75" y1="140" x2="65" y2="160" class="image" />
    <line x1="75" y1="140" x2="85" y2="160" class="image" />
    <circle cx="145" cy="90" r="10" class="image" />
    <line x1="145" y1="100" x2="145" y2="130" class="image" />
    <line x1="145" y1="130" x2="135" y2="150" class="image" />
    <line x1="145" y1="130" x2="155" y2="150" class="image" />
    <circle cx="215" cy="110" r="10" class="image" />
    <line x1="215" y1="120" x2="215" y2="150" class="image" />
    <line x1="215" y1="150" x2="205" y2="170" class="image" />
    <line x1="215" y1="150" x2="225" y2="170" class="image" />
    <circle cx="285" cy="100" r="10" class="image" />
    <line x1="285" y1="110" x2="285" y2="140" class="image" />
    <line x1="285" y1="140" x2="275" y2="160" class="image" />
    <line x1="285" y1="140" x2="295" y2="160" class="image" />
  </g>
</svg>