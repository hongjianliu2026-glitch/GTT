<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cleverly</text>
  <text x="50" y="120" class="subtitle">[ˈklɛvərli] adv. 聪明地，巧妙地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clever (聪明的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个聪明的侦探，"巧妙地(cleverly)"
    <tspan x="50" dy="25">解开了一个复杂的谜题，他的智慧让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She cleverly solved the problem in just a few minutes.
  </text>
  <text x="50" y="310" class="content">
    她巧妙地在几分钟内解决了问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Detective -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Magnifying glass -->
    <circle cx="80" cy="100" r="10" class="image" />
    <line x1="90" y1="100" x2="120" y2="100" class="image" />
    <!-- Puzzle pieces -->
    <rect x="150" y="80" width="20" height="20" class="image" />
    <rect x="170" y="80" width="20" height="20" class="image" />
    <rect x="190" y="80" width="20" height="20" class="image" />
    <rect x="150" y="100" width="20" height="20" class="image" />
    <rect x="170" y="100" width="20" height="20" class="image" />
    <rect x="190" y="100" width="20" height="20" class="image" />
  </g>
</svg>