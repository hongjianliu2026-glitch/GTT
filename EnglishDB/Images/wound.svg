<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wound</text>
  <text x="50" y="120" class="subtitle">[wuːnd] n. 伤口，创伤；v. 伤害，使受伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wund (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"弯曲(wund)"的刀刃划伤，
    <tspan x="50" dy="25">留下了一个深深的伤口(wound)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldier suffered a severe wound in battle.
  </text>
  <text x="50" y="310" class="content">
    这名士兵在战斗中受了重伤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Wounded person -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="100" y2="90" class="image" />
    <!-- Wound -->
    <line x1="50" y1="50" x2="50" y2="80" class="image" />
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <line x1="45" y1="70" x2="55" y2="70" class="image" />
    <!-- Knife -->
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
  </g>
</svg>