<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">raider</text>
  <text x="50" y="120" class="subtitle">[ˈreɪdər] n. 袭击者，侵入者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> raid (袭击) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个蒙面人手持火把，"突然袭击(raid)"
    <tspan x="50" dy="25">村庄，他就是那个袭击者(raider)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The raiders stole valuable artifacts from the museum.
  </text>
  <text x="50" y="310" class="content">
    袭击者从博物馆偷走了珍贵的文物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Masked raider -->
    <circle cx="50" cy="100" r="30" class="image" />
    <rect x="35" y="85" width="30" height="30" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Torch -->
    <line x1="80" y1="120" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
    <line x1="110" y1="110" x2="110" y2="130" class="image" />
    <line x1="110" y1="130" x2="100" y2="140" class="image" />
    <line x1="110" y1="130" x2="120" y2="140" class="image" />
  </g>
</svg>