<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">homicide</text>
  <text x="50" y="120" class="subtitle">[ˈhɒmɪsaɪd] n. 杀人，杀人罪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> homi- (人) + cide (杀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黑暗的夜晚，"一个人(homi)"
    <tspan x="50" dy="25">被"杀害(cide)"，这就是"杀人(homicide)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective was investigating a homicide case.
  </text>
  <text x="50" y="310" class="content">
    侦探正在调查一起杀人案件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark night -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#1B2631" />
    <!-- Silhouette of a person -->
    <path d="M50 150 L100 100 L150 150 L100 200 Z" class="image" fill="#7F8C8D" />
    <!-- Blood splatter -->
    <circle cx="100" cy="150" r="20" class="image" fill="#E74C3C" />
    <circle cx="120" cy="130" r="10" class="image" fill="#E74C3C" />
    <circle cx="80" cy="170" r="15" class="image" fill="#E74C3C" />
  </g>
</svg>