<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shipwreck</text>
  <text x="50" y="120" class="subtitle">[ˈʃɪpˌrɛk] n. 船只失事，沉船；v. 使船只失事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ship (船) + wreck (破坏)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在大海中航行，突然遭遇风暴，船体被"破坏(wreck)"，最终"沉没(shipwreck)"在海底。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shipwreck was caused by a sudden storm.
  </text>
  <text x="50" y="310" class="content">
    这艘船只失事是由突如其来的风暴引起的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 175,150 75,150" class="image" />
    <line x1="100" y1="150" x2="100" y2="120" class="image" />
    <line x1="150" y1="150" x2="150" y2="120" class="image" />
    <line x1="125" y1="120" x2="125" y2="100" class="image" />
    <!-- Waves -->
    <path d="M0,200 Q50,150 100,200 T200,200" class="image" />
    <path d="M100,200 Q150,150 200,200 T300,200" class="image" />
    <!-- Storm clouds -->
    <ellipse cx="100" cy="50" rx="50" ry="30" class="image" />
    <ellipse cx="200" cy="50" rx="50" ry="30" class="image" />
    <ellipse cx="150" cy="30" rx="50" ry="30" class="image" />
  </g>
</svg>