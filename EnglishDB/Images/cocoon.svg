<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cocoon</text>
  <text x="50" y="120" class="subtitle">[kəˈkun] n. 茧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cocco- (茧) + -oon (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只毛毛虫在树叶上，"编织(cocco-)"
    <tspan x="50" dy="25">出一个保护自己的茧(cocoon)，等待蜕变成蝴蝶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The caterpillar spun a cocoon around itself.
  </text>
  <text x="50" y="310" class="content">
    毛毛虫为自己织了一个茧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cocoon -->
    <ellipse cx="175" cy="100" rx="100" ry="60" class="image" />
    <!-- Caterpillar -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
  </g>
</svg>