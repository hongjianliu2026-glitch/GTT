<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scarecrow</text>
  <text x="50" y="120" class="subtitle">[ˈskeərkrəʊ] n. 稻草人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scare (惊吓) + crow (乌鸦)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个稻草人站在田野中，"惊吓(scare)"
    <tspan x="50" dy="25">乌鸦(crow)，保护庄稼不被它们吃掉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scarecrow in the field kept the birds away.
  </text>
  <text x="50" y="310" class="content">
    田里的稻草人把鸟儿赶走了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scarecrow body -->
    <rect x="50" y="20" width="100" height="150" class="image" />
    <!-- Scarecrow head -->
    <circle cx="100" cy="10" r="20" class="image" />
    <!-- Scarecrow arms -->
    <line x1="30" y1="80" x2="0" y2="120" class="image" />
    <line x1="170" y1="80" x2="200" y2="120" class="image" />
    <!-- Scarecrow legs -->
    <line x1="80" y1="170" x2="50" y2="200" class="image" />
    <line x1="120" y1="170" x2="150" y2="200" class="image" />
    <!-- Field -->
    <rect x="0" y="200" width="350" height="100" class="image" />
    <!-- Crow -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>