<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feedback</text>
  <text x="50" y="120" class="subtitle">[ˈfiːdbæk] n. 反馈，反应</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> feed (喂养) + back (回)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"喂养(feed)"
    <tspan x="50" dy="25">食物给顾客，顾客吃完后"回馈(back)"</tspan>
    <tspan x="50" dy="25">他们的感受，这就是反馈(feedback)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We need your feedback to improve our service.
  </text>
  <text x="50" y="310" class="content">
    我们需要你的反馈来改进我们的服务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Food -->
    <rect x="50" y="80" width="30" height="20" class="image" />
    <rect x="90" y="80" width="30" height="20" class="image" />
    <rect x="130" y="80" width="30" height="20" class="image" />
    <!-- Feedback arrow -->
    <line x1="160" y1="90" x2="200" y2="90" class="image" />
    <polygon points="200,90 190,85 190,95" class="image" />
    <!-- Customer -->
    <circle cx="230" cy="100" r="15" class="image" />
    <line x1="230" y1="115" x2="230" y2="150" class="image" />
    <line x1="230" y1="150" x2="210" y2="180" class="image" />
    <line x1="230" y1="150" x2="250" y2="180" class="image" />
    <line x1="230" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>