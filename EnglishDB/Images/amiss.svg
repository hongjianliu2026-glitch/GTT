<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">amiss</text>
  <text x="50" y="120" class="subtitle">[əˈmɪs] adv. 错误地，不恰当地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (强调) + miss (错过)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路时，"强调地错过(a-miss)"
    <tspan x="50" dy="25">了正确的方向，结果走错了路。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She realized something was amiss when she saw the broken window.
  </text>
  <text x="50" y="310" class="content">
    她看到破碎的窗户时，意识到有些不对劲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path with a wrong turn -->
    <path d="M0,0 L100,0 L100,100 L200,100 L200,200" class="image" />
    <!-- Arrow pointing to the wrong direction -->
    <polygon points="200,200 220,210 200,220" class="image" />
    <!-- Person walking -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />
  </g>
</svg>