<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intercut</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈkʌt] v. 插入，剪辑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + cut (剪切)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个电影剪辑师在两段视频之间"插入(inter-cut)"
    <tspan x="50" dy="25">新的片段，使得故事更加连贯和生动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The director decided to intercut the scenes to enhance the drama.
  </text>
  <text x="50" y="310" class="content">
    导演决定插入场景以增强戏剧效果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First video -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Second video -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <!-- Inserted video -->
    <rect x="100" y="50" width="100" height="50" class="image" />
    <!-- Arrows -->
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <line x1="250" y1="100" x2="250" y2="50" class="image" />
    <polygon points="145,50 155,50 150,40" class="image" />
    <polygon points="245,50 255,50 250,40" class="image" />
  </g>
</svg>