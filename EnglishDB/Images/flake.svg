<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flake</text>
  <text x="50" y="120" class="subtitle">[fleɪk] n. 薄片，小片；v. 剥落，脱落</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flak (薄片)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片雪花(flake)从天空中飘落，
    <tspan x="50" dy="25">它轻轻地落在你的手上，瞬间融化成水滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The paint started to flake off the wall.
  </text>
  <text x="50" y="310" class="content">
    油漆开始从墙上剥落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowflake -->
    <line x1="175" y1="100" x2="175" y2="200" class="image" />
    <line x1="125" y1="150" x2="225" y2="150" class="image" />
    <line x1="150" y1="125" x2="200" y2="175" class="image" />
    <line x1="150" y1="175" x2="200" y2="125" class="image" />
    <!-- Hand -->
    <circle cx="175" cy="250" r="50" class="image" />
    <line x1="175" y1="300" x2="175" y2="350" class="image" />
    <line x1="175" y1="350" x2="150" y2="400" class="image" />
    <line x1="175" y1="350" x2="200" y2="400" class="image" />
    <line x1="175" y1="325" x2="225" y2="315" class="image" />
  </g>
</svg>