<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">father</text>
  <text x="50" y="120" class="subtitle">[ˈfɑːðər] n. 父亲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fa- (父) + ther (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个高大威猛的"父亲(fa-ther)"，
    <tspan x="50" dy="25">他像一座山一样保护着他的家庭。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My father is my hero.
  </text>
  <text x="50" y="310" class="content">
    我的父亲是我的英雄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Father figure -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <!-- Family -->
    <circle cx="150" cy="50" r="20" class="image" /> <!-- Child's head -->
    <line x1="150" y1="70" x2="150" y2="120" class="image" /> <!-- Child's body -->
    <line x1="150" y1="120" x2="130" y2="150" class="image" /> <!-- Child's left leg -->
    <line x1="150" y1="120" x2="170" y2="150" class="image" /> <!-- Child's right leg -->
    <line x1="150" y1="90" x2="120" y2="100" class="image" /> <!-- Child's left arm -->
    <line x1="150" y1="90" x2="180" y2="100" class="image" /> <!-- Child's right arm -->
    <line x1="50" y1="100" x2="150" y2="90" class="image" /> <!-- Father's arm around child -->
  </g>
</svg>