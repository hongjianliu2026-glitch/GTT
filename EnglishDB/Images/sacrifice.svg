<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sacrifice</text>
  <text x="50" y="120" class="subtitle">[ˈsækrɪfaɪs] n. 牺牲；v. 献祭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sacr (神圣) + fic (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代祭司在祭坛前，"神圣地做(sacr-fic)"
    <tspan x="50" dy="25">出牺牲，将一只羊献祭给神灵，这就是牺牲(sacrifice)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made a great sacrifice for his family.
  </text>
  <text x="50" y="310" class="content">
    他为家庭做出了巨大的牺牲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Altar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Priest -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <!-- Sacrificial animal -->
    <rect x="200" y="50" width="100" height="100" class="image" />
    <line x1="220" y1="70" x2="280" y2="70" class="image" />
    <line x1="220" y1="100" x2="280" y2="100" class="image" />
    <line x1="220" y1="130" x2="280" y2="130" class="image" />
    <!-- Fire -->
    <polyline points="250,150 260,160 240,160 250,150" class="image" />
    <polyline points="250,155 260,165 240,165 250,155" class="image" />
    <polyline points="250,160 260,170 240,170 250,160" class="image" />
  </g>
</svg>