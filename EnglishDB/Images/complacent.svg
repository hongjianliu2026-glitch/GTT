<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">complacent</text>
  <text x="50" y="120" class="subtitle">[kəmˈpleɪsnt] adj. 自满的，自得的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + plac (平静) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在舒适的沙发上，脸上带着满足的微笑，
    <tspan x="50" dy="25">周围的一切都让他感到平静和满足，这就是"自满的(complacent)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He became complacent after winning the award.
  </text>
  <text x="50" y="310" class="content">
    他获奖后变得自满起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Comfortable sofa -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Smiling face -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="180" y1="90" x2="220" y2="90" class="image" />
    <line x1="190" y1="110" x2="210" y2="110" class="image" />
    <!-- Arms -->
    <line x1="170" y1="120" x2="150" y2="140" class="image" />
    <line x1="230" y1="120" x2="250" y2="140" class="image" />
    <!-- Legs -->
    <line x1="180" y1="160" x2="160" y2="180" class="image" />
    <line x1="220" y1="160" x2="240" y2="180" class="image" />
  </g>
</svg>