<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clerical</text>
  <text x="50" y="120" class="subtitle">[ˈklɛrɪkəl] adj. 文书的，牧师的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cler (牧师) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个牧师在教堂里，"牧师(cler)"
    <tspan x="50" dy="25">处理文书工作，这些工作就具有文书的性质(clerical)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clerical staff handles all the paperwork in the office.
  </text>
  <text x="50" y="310" class="content">
    文书人员处理办公室的所有文书工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Priest -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Desk -->
    <rect x="100" y="120" width="200" height="60" class="image" />
    <!-- Papers -->
    <line x1="120" y1="140" x2="300" y2="140" class="image" />
    <line x1="120" y1="160" x2="280" y2="160" class="image" />
    <line x1="120" y1="180" x2="260" y2="180" class="image" />
  </g>
</svg>