<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">charged</text>
  <text x="50" y="120" class="subtitle">[tʃɑːrdʒd] adj. 充满电的，充满感情的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> charge (充电，装载) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满电的电池，"装载(charge)"了满满的能量，
    <tspan x="50" dy="25">就像一个充满感情的人，内心充满了力量和激情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The battery is fully charged and ready to use.
  </text>
  <text x="50" y="310" class="content">
    电池已充满电，随时可以使用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battery -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Lightning bolt -->
    <polygon points="85,20 105,60 65,60 125,140 75,140 95,180" class="image" />
    <!-- Plus and minus signs -->
    <text x="30" y="190" class="content">+</text>
    <text x="120" y="190" class="content">-</text>
  </g>
</svg>