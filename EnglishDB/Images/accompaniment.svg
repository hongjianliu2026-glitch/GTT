<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accompaniment</text>
  <text x="50" y="120" class="subtitle">[əˈkʌmpənɪmənt] n. 伴奏，伴随物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + company (陪伴) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在舞台上，"加强陪伴(ac-company)"
    <tspan x="50" dy="25">着主唱，他们的合作构成了完美的伴奏(accompaniment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pianist provided a beautiful accompaniment to the singer's performance.
  </text>
  <text x="50" y="310" class="content">
    钢琴家为歌手的表演提供了美妙的伴奏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Singer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Pianist -->
    <rect x="150" y="50" width="150" height="100" class="image" />
    <line x1="160" y1="60" x2="300" y2="60" class="image" />
    <line x1="160" y1="80" x2="300" y2="80" class="image" />
    <line x1="160" y1="100" x2="300" y2="100" class="image" />
    <line x1="160" y1="120" x2="300" y2="120" class="image" />
    <circle cx="170" cy="150" r="15" class="image" />
    <line x1="170" y1="165" x2="170" y2="180" class="image" />
    <line x1="170" y1="180" x2="150" y2="200" class="image" />
    <line x1="170" y1="180" x2="190" y2="200" class="image" />
    <line x1="170" y1="170" x2="200" y2="160" class="image" />
  </g>
</svg>