<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">concurrently</text>
  <text x="50" y="120" class="subtitle">[kənˈkɜːrəntli] adv. 同时地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + current (流动) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两条河流"一起流动(con-current)"，它们在同一时间并行前进，这就是"同时地(concurrently)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They were able to work on the project concurrently.
  </text>
  <text x="50" y="310" class="content">
    他们能够同时进行这个项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River 1 -->
    <path d="M0 50 Q50 20, 100 50 T200 50" class="image" />
    <!-- River 2 -->
    <path d="M0 100 Q50 130, 100 100 T200 100" class="image" />
    <!-- Water flow -->
    <circle cx="20" cy="50" r="5" class="image" />
    <circle cx="40" cy="50" r="5" class="image" />
    <circle cx="60" cy="50" r="5" class="image" />
    <circle cx="80" cy="50" r="5" class="image" />
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="120" cy="50" r="5" class="image" />
    <circle cx="140" cy="50" r="5" class="image" />
    <circle cx="160" cy="50" r="5" class="image" />
    <circle cx="180" cy="50" r="5" class="image" />
    <circle cx="20" cy="100" r="5" class="image" />
    <circle cx="40" cy="100" r="5" class="image" />
    <circle cx="60" cy="100" r="5" class="image" />
    <circle cx="80" cy="100" r="5" class="image" />
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="120" cy="100" r="5" class="image" />
    <circle cx="140" cy="100" r="5" class="image" />
    <circle cx="160" cy="100" r="5" class="image" />
    <circle cx="180" cy="100" r="5" class="image" />
  </g>
</svg>