<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .peanut { fill: #D4AC0D; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peanut</text>
  <text x="50" y="120" class="subtitle">[ˈpiːnʌt] n. 花生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pea (豌豆) + nut (坚果)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小豌豆(pea)变成了一个巨大的坚果(nut)，
    <tspan x="50" dy="25">这个坚果就是花生(peanut)，它既像豌豆又像坚果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat peanuts while watching movies.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在看电影时吃花生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Peanut shape -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="peanut" />
    <ellipse cx="150" cy="100" rx="80" ry="50" class="peanut" />
    <!-- Pea pod -->
    <rect x="50" y="50" width="200" height="50" class="image" />
    <!-- Nut shell -->
    <rect x="75" y="75" width="150" height="25" class="image" />
  </g>
</svg>