<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">broadband</text>
  <text x="50" y="120" class="subtitle">[ˈbrɔːdbænd] n. 宽带</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> broad (宽) + band (带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条宽阔的带子(broad-band)，它能够传输大量的数据，就像一条宽阔的高速公路，这就是宽带(broadband)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We upgraded to broadband for faster internet access.
  </text>
  <text x="50" y="310" class="content">
    我们升级到了宽带以获得更快的互联网访问速度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Wide road -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Data lines -->
    <line x1="20" y1="25" x2="330" y2="25" class="image" />
    <line x1="20" y1="40" x2="330" y2="40" class="image" />
    <line x1="20" y1="55" x2="330" y2="55" class="image" />
    <line x1="20" y1="70" x2="330" y2="70" class="image" />
    <!-- Cars representing data -->
    <rect x="50" y="10" width="20" height="10" class="image" />
    <rect x="100" y="10" width="20" height="10" class="image" />
    <rect x="150" y="10" width="20" height="10" class="image" />
    <rect x="200" y="10" width="20" height="10" class="image" />
    <rect x="250" y="10" width="20" height="10" class="image" />
    <rect x="300" y="10" width="20" height="10" class="image" />
  </g>
</svg>