<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">facsimile</text>
  <text x="50" y="120" class="subtitle">[fækˈsɪməli] n. 传真，摹本</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fac (做) + simile (相似)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台传真机，"做出(fac)"
    <tspan x="50" dy="25">与原件相似(simile)的副本，这就是传真(facsimile)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sent the contract via facsimile.
  </text>
  <text x="50" y="310" class="content">
    她通过传真发送了合同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fax machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Paper tray -->
    <rect x="50" y="20" width="250" height="30" class="image" />
    <!-- Paper coming out -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Paper lines -->
    <line x1="70" y1="60" x2="280" y2="60" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="100" x2="270" y2="100" class="image" />
    <line x1="70" y1="120" x2="240" y2="120" class="image" />
    <!-- Fax machine screen -->
    <rect x="150" y="150" width="50" height="30" class="image" />
  </g>
</svg>