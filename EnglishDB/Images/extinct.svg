<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extinct</text>
  <text x="50" y="120" class="subtitle">[ɪkˈstɪŋkt] adj. 灭绝的，绝种的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + stinct (刺)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的森林，"刺(stinct)"
    <tspan x="50" dy="25">穿了所有生物的生命，最终"出(ex-)"了这个世界，</tspan>
    <tspan x="50" dy="25">整个物种都灭绝了(extinct)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dodo bird is now extinct.
  </text>
  <text x="50" y="310" class="content">
    渡渡鸟现在已经灭绝了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="180" x2="50" y2="20" class="image" />
    <line x1="100" y1="180" x2="100" y2="40" class="image" />
    <line x1="150" y1="180" x2="150" y2="60" class="image" />
    <line x1="200" y1="180" x2="200" y2="80" class="image" />
    <line x1="250" y1="180" x2="250" y2="100" class="image" />
    <line x1="300" y1="180" x2="300" y2="120" class="image" />
    <!-- Extinct sign -->
    <text x="150" y="100" class="highlight" style="font-size: 48px;">X</text>
  </g>
</svg>