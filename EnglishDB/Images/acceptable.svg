<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acceptable</text>
  <text x="50" y="120" class="subtitle">[əkˈseptəbl] adj. 可接受的，合意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> accept (接受) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的礼物盒，上面贴着"可接受的(acceptable)"标签，
    <tspan x="50" dy="25">表示这个礼物是大家都愿意接受的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The proposal was acceptable to all parties involved.
  </text>
  <text x="50" y="310" class="content">
    这个提议对所有相关方都是可接受的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gift box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="10" y="10" width="180" height="130" class="image" />
    <!-- Ribbon -->
    <line x1="100" y1="10" x2="100" y2="50" class="image" />
    <line x1="80" y1="30" x2="120" y2="30" class="image" />
    <!-- Label -->
    <rect x="70" y="60" width="60" height="30" class="image" />
    <text x="85" y="80" class="content" fill="#34495E">acceptable</text>
  </g>
</svg>