<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">machete</text>
  <text x="50" y="120" class="subtitle">[məˈʃeɪti] n. 大砍刀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自西班牙语 "maza" (锤子) + "chet" (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农民手持一把巨大的"锤子(maza)"，
    <tspan x="50" dy="25">这把锤子被缩小(chet)成了一个锋利的砍刀(machete)，</tspan>
    <tspan x="50" dy="25">用来砍伐丛林中的杂草和树枝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer used a machete to clear the path through the jungle.
  </text>
  <text x="50" y="310" class="content">
    农民用大砍刀清理丛林中的道路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Machete -->
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <line x1="200" y1="0" x2="180" y2="20" class="image" />
    <line x1="180" y1="20" x2="20" y2="20" class="image" />
    <line x1="20" y1="20" x2="0" y2="0" class="image" />
    <!-- Handle -->
    <rect x="0" y="0" width="20" height="100" class="image" />
    <!-- Farmer -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <line x1="250" y1="90" x2="280" y2="80" class="image" />
  </g>
</svg>