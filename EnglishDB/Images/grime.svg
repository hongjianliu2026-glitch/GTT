<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grime</text>
  <text x="50" y="120" class="subtitle">[ɡraɪm] n. 污垢，尘垢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gr- (尘土) + -ime (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个脏兮兮的小孩，脸上和手上都沾满了"尘土(gr-)"，
    <tspan x="50" dy="25">这些尘土就形成了污垢(grime)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The grime on his face was hard to remove.
  </text>
  <text x="50" y="310" class="content">
    他脸上的污垢很难去除。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dirty face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <circle cx="80" cy="80" r="10" class="image" />
    <line x1="100" y1="120" x2="100" y2="140" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <!-- Dirt spots -->
    <circle cx="130" cy="110" r="5" class="image" />
    <circle cx="70" cy="110" r="5" class="image" />
    <circle cx="100" cy="150" r="5" class="image" />
  </g>
</svg>