<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">asparagus</text>
  <text x="50" y="120" class="subtitle">[əˈspærəɡəs] n. 芦笋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (无) + spar (生长) + agus (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片田野中，"无(a-)生长(spar)"的植物突然冒出，
    <tspan x="50" dy="25">这些植物就是芦笋(asparagus)，它们像绿色的箭头一样直立。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to cook asparagus with garlic.
  </text>
  <text x="50" y="310" class="content">
    她喜欢用大蒜烹饪芦笋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Asparagus -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Green arrows -->
    <polygon points="50,20 30,50 70,50" class="image" />
    <polygon points="100,20 80,50 120,50" class="image" />
    <polygon points="150,20 130,50 170,50" class="image" />
    <polygon points="200,20 180,50 220,50" class="image" />
    <polygon points="250,20 230,50 270,50" class="image" />
  </g>
</svg>