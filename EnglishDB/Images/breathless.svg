<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">breathless</text>
  <text x="50" y="120" class="subtitle">[ˈbrɛθlɪs] adj. 气喘吁吁的，屏息的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> breath (呼吸) + less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在跑步后，"没有呼吸(breath-less)"，
    <tspan x="50" dy="25">气喘吁吁地站在那里，仿佛时间都停止了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the race, she was breathless and had to sit down.
  </text>
  <text x="50" y="310" class="content">
    比赛后，她气喘吁吁，不得不坐下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person panting -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Breath lines -->
    <line x1="50" y1="80" x2="30" y2="60" class="image" />
    <line x1="50" y1="80" x2="70" y2="60" class="image" />
    <line x1="50" y1="70" x2="30" y2="50" class="image" />
    <line x1="50" y1="70" x2="70" y2="50" class="image" />
  </g>
</svg>