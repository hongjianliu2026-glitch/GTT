<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prosaic</text>
  <text x="50" y="120" class="subtitle">[proʊˈzeɪɪk] adj. 平凡的，乏味的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + sai (说) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在向前走，嘴里不停地说着"平凡(pro-sai-ic)"
    <tspan x="50" dy="25">的日常琐事，这些琐事让人感到乏味(prosaic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was so prosaic that I fell asleep.
  </text>
  <text x="50" y="310" class="content">
    这部电影如此乏味，以至于我睡着了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <line x1="0" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="80" class="image" />
    <line x1="100" y1="100" x2="80" y2="120" class="image" />
    <line x1="80" y1="80" x2="60" y2="100" class="image" />
    <line x1="80" y1="120" x2="60" y2="100" class="image" />
    <!-- Mundane conversation -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="170" y1="100" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="190" y2="80" class="image" />
    <line x1="200" y1="100" x2="190" y2="120" class="image" />
    <line x1="190" y1="80" x2="170" y2="100" class="image" />
    <line x1="190" y1="120" x2="170" y2="100" class="image" />
    <!-- Mundane objects -->
    <rect x="250" y="80" width="50" height="40" class="image" />
    <rect x="320" y="80" width="50" height="40" class="image" />
    <rect x="390" y="80" width="50" height="40" class="image" />
  </g>
</svg>