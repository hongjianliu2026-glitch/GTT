<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">self-consciousness</text>
  <text x="50" y="120" class="subtitle">[ˌsɛlf ˈkɑnʃəsnəs] n. 自我意识，自觉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self- (自己) + conscious (意识到的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"自己意识到(self-conscious)"
    <tspan x="50" dy="25">自己的每一个动作和表情，这种强烈的自我意识(self-consciousness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt a wave of self-consciousness when she realized everyone was staring at her.
  </text>
  <text x="50" y="310" class="content">
    当她意识到每个人都在盯着她时，她感到一阵自我意识。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="130" class="image" />
    <line x1="175" y1="150" x2="205" y2="130" class="image" />
    <line x1="175" y1="180" x2="145" y2="210" class="image" />
    <line x1="175" y1="180" x2="205" y2="210" class="image" />
    <!-- Reflection -->
    <circle cx="175" cy="300" r="30" class="image" />
    <line x1="175" y1="330" x2="175" y2="380" class="image" />
    <line x1="175" y1="350" x2="145" y2="330" class="image" />
    <line x1="175" y1="350" x2="205" y2="330" class="image" />
    <line x1="175" y1="380" x2="145" y2="410" class="image" />
    <line x1="175" y1="380" x2="205" y2="410" class="image" />
  </g>
</svg>