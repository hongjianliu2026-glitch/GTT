<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gastric</text>
  <text x="50" y="120" class="subtitle">[ˈɡæstrɪk] adj. 胃的，胃部的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gastr (胃) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的胃，"胃(gastr)"
    <tspan x="50" dy="25">在吞噬一切，这就是胃部的(gastric)力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffered from gastric ulcers.
  </text>
  <text x="50" y="310" class="content">
    他患有胃溃疡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stomach -->
    <ellipse cx="175" cy="100" rx="150" ry="100" class="image" />
    <!-- Food -->
    <circle cx="75" cy="100" r="20" class="image" />
    <circle cx="125" cy="100" r="20" class="image" />
    <circle cx="175" cy="100" r="20" class="image" />
    <circle cx="225" cy="100" r="20" class="image" />
    <circle cx="275" cy="100" r="20" class="image" />
    <!-- Acid -->
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
  </g>
</svg>