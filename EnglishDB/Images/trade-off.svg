<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trade-off</text>
  <text x="50" y="120" class="subtitle">[ˈtreɪdˌɒf] n. 权衡，取舍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trade (交易) + off (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在天平的两端，"交易(trade)"
    <tspan x="50" dy="25">一边是金钱，另一边是时间，他必须做出取舍(trade-off)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There's always a trade-off between quality and cost.
  </text>
  <text x="50" y="310" class="content">
    质量和成本之间总是存在权衡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="20" y1="100" x2="80" y2="100" class="image" />
    <circle cx="30" cy="100" r="10" class="image" />
    <circle cx="70" cy="100" r="10" class="image" />
    <!-- Money -->
    <rect x="10" y="120" width="40" height="40" class="image" />
    <text x="20" y="150" class="content">$$</text>
    <!-- Time -->
    <rect x="50" y="120" width="40" height="40" class="image" />
    <text x="60" y="150" class="content">⌛</text>
  </g>
</svg>