<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">guarantee</text>
  <text x="50" y="120" class="subtitle">[ˌɡærənˈtiː] n. 保证，担保；v. 保证，担保</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> guar (看守) + ante (在前面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个守卫(guar)站在你前面(ante)，
    <tspan x="50" dy="25">保证(guarantee)你的安全，就像一个坚实的盾牌。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company offers a one-year guarantee on all products.
  </text>
  <text x="50" y="310" class="content">
    公司为所有产品提供一年的保修。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <polygon points="0,0 150,0 175,50 150,100 0,100" class="image" />
    <!-- Guard -->
    <circle cx="87.5" cy="50" r="20" class="image" />
    <line x1="87.5" y1="70" x2="87.5" y2="100" class="image" />
    <line x1="87.5" y1="100" x2="70" y2="130" class="image" />
    <line x1="87.5" y1="100" x2="105" y2="130" class="image" />
    <line x1="87.5" y1="85" x2="120" y2="75" class="image" />
  </g>
</svg>