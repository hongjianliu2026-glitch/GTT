<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resource</text>
  <text x="50" y="120" class="subtitle">[rɪˈsɔːrs] n. 资源，财力；办法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + source (来源)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在荒野中，"再次寻找(re-source)"
    <tspan x="50" dy="25">水源和食物，这些就是他的资源(resource)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has limited financial resources.
  </text>
  <text x="50" y="310" class="content">
    这家公司财务资源有限。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Explorer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Water source -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <line x1="70" y1="40" x2="130" y2="40" class="image" />
    <line x1="70" y1="60" x2="130" y2="60" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <!-- Food source -->
    <rect x="170" y="20" width="100" height="100" class="image" />
    <line x1="190" y1="40" x2="250" y2="40" class="image" />
    <line x1="190" y1="60" x2="250" y2="60" class="image" />
    <line x1="190" y1="80" x2="250" y2="80" class="image" />
  </g>
</svg>