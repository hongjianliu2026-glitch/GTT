<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pee</text>
  <text x="50" y="120" class="subtitle">[piː] v. 小便，撒尿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "pē"，意为小便
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在草地上，"撒尿(pee)"
    <tspan x="50" dy="25">形成一个小水坑，水坑里还有几条小鱼在游动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby needs to pee.
  </text>
  <text x="50" y="310" class="content">
    宝宝需要小便。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#27AE60" />
    <!-- Water puddle -->
    <ellipse cx="175" cy="100" rx="50" ry="30" class="image" fill="#3498DB" />
    <!-- Fish -->
    <path d="M150,80 C155,70 165,70 170,80 S180,100 175,110" class="image" fill="#F1C40F" />
    <path d="M180,90 C185,80 195,80 200,90 S210,110 205,120" class="image" fill="#F1C40F" />
    <!-- Child -->
    <circle cx="100" cy="150" r="20" class="image" fill="#E74C3C" />
    <line x1="100" y1="170" x2="100" y2="200" class="image" />
    <line x1="100" y1="185" x2="80" y2="175" class="image" />
    <line x1="100" y1="185" x2="120" y2="175" class="image" />
    <line x1="100" y1="200" x2="80" y2="220" class="image" />
    <line x1="100" y1="200" x2="120" y2="220" class="image" />
  </g>
</svg>