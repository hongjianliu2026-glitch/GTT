<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arouse</text>
  <text x="50" y="120" class="subtitle">[əˈraʊz] v. 唤醒，激起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + rouse (唤醒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个沉睡的巨人被"加强唤醒(a-rouse)"，
    <tspan x="50" dy="25">他的苏醒激起了周围的一切，仿佛整个世界都被唤醒了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The speaker's words aroused the audience's interest.
  </text>
  <text x="50" y="310" class="content">
    演讲者的话激起了听众的兴趣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sleeping giant -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="150" y2="170" class="image" />
    <line x1="100" y1="180" x2="50" y2="170" class="image" />
    <!-- Awakening -->
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="50" y2="20" class="image" />
    <line x1="100" y1="50" x2="150" y2="20" class="image" />
    <!-- Surrounding elements -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
    <circle cx="350" cy="150" r="10" class="image" />
  </g>
</svg>