<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">follower</text>
  <text x="50" y="120" class="subtitle">[ˈfɑloʊər] n. 追随者，跟从者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> foll (跟随) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人紧紧跟在另一个人后面，"跟随(foll)"
    <tspan x="50" dy="25">着前面的领导者，这个人就是追随者(follower)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has many followers on social media.
  </text>
  <text x="50" y="310" class="content">
    她在社交媒体上有很多追随者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Leader -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />

    <!-- Follower -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="190" y2="130" class="image" />

    <!-- Arrow -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <polygon points="130,100 125,95 125,105" class="image" />
  </g>
</svg>