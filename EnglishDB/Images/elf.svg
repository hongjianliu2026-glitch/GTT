<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elf</text>
  <text x="50" y="120" class="subtitle">[elf] n. 小精灵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> el (小) + f (精灵)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小精灵(elf)在森林中飞舞，
    <tspan x="50" dy="25">它身材娇小(el)，却拥有神奇的力量(f)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children believed in the existence of elves in the forest.
  </text>
  <text x="50" y="310" class="content">
    孩子们相信森林里存在小精灵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />

    <!-- Elf -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <line x1="100" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>