<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">garish</text>
  <text x="50" y="120" class="subtitle">[ˈɡɛrɪʃ] adj. 俗丽的，过于艳丽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gar- (装饰) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装饰(gar-)得过于艳丽(-ish)的房间，
    <tspan x="50" dy="25">墙上挂满了五彩斑斓的装饰品，让人眼花缭乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garish neon lights made it hard to see the stars.
  </text>
  <text x="50" y="310" class="content">
    过于艳丽的霓虹灯让人难以看到星星。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wall decorations -->
    <circle cx="50" cy="50" r="20" class="image" fill="#FF6F61" />
    <circle cx="100" cy="50" r="20" class="image" fill="#6B5B95" />
    <circle cx="150" cy="50" r="20" class="image" fill="#88B04B" />
    <circle cx="200" cy="50" r="20" class="image" fill="#F7CAC9" />
    <circle cx="250" cy="50" r="20" class="image" fill="#92A8D1" />
    <circle cx="300" cy="50" r="20" class="image" fill="#FF6F61" />
    <!-- Overly bright light -->
    <circle cx="175" cy="120" r="30" class="image" fill="#FFFF00" />
    <!-- Person with sunglasses -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <rect x="10" y="85" width="20" height="5" class="image" fill="#000000" />
    <rect x="30" y="85" width="20" height="5" class="image" fill="#000000" />
  </g>
</svg>