<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heating</text>
  <text x="50" y="120" class="subtitle">[ˈhiːtɪŋ] n. 加热，供暖；v. 加热</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heat (热) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的冬天，"热(heat)"
    <tspan x="50" dy="25">量不断增加，房间里变得温暖舒适，这就是加热(heating)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heating system in the office is very efficient.
  </text>
  <text x="50" y="310" class="content">
    办公室的供暖系统非常高效。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fireplace -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Flames -->
    <polygon points="100,100 150,50 200,100" class="flame" />
    <polygon points="120,120 150,80 180,120" class="flame" />
    <polygon points="140,140 150,110 160,140" class="flame" />
    <!-- Warmth -->
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="270" cy="120" r="20" class="image" />
    <circle cx="290" cy="140" r="20" class="image" />
  </g>
</svg>