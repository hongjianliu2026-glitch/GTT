<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eclectic</text>
  <text x="50" y="120" class="subtitle">[ɪˈklektɪk] adj. 折衷的，兼收并蓄的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ec- (出) + lect (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个收藏家从各种来源"选择(lect)"
    <tspan x="50" dy="25">并"收集(ec-)"不同的物品，形成一个折衷的收藏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her eclectic taste in music spans multiple genres.
  </text>
  <text x="50" y="310" class="content">
    她对音乐的折衷品味跨越了多个流派。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Collection of items -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <line x1="180" y1="30" x2="220" y2="70" class="image" />
    <line x1="180" y1="70" x2="220" y2="30" class="image" />
    <rect x="260" y="30" width="40" height="40" class="image" />
    <circle cx="340" cy="50" r="20" class="image" />
    <rect x="380" y="30" width="40" height="40" class="image" />
    <line x1="460" y1="30" x2="500" y2="70" class="image" />
    <line x1="460" y1="70" x2="500" y2="30" class="image" />
    <rect x="540" y="30" width="40" height="40" class="image" />
    <circle cx="620" cy="50" r="20" class="image" />
    <rect x="660" y="30" width="40" height="40" class="image" />
    <line x1="740" y1="30" x2="780" y2="70" class="image" />
    <line x1="740" y1="70" x2="780" y2="30" class="image" />
  </g>
</svg>