<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sacred</text>
  <text x="50" y="120" class="subtitle">[ˈseɪkrɪd] adj. 神圣的，宗教的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sacro- (神圣) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座古老的寺庙，"神圣的(sacro-)"
    <tspan x="50" dy="25">光芒从天而降，照亮了整个地方，</tspan>
    <tspan x="50" dy="25">这就是神圣的(sacred)力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The temple is considered sacred by the locals.
  </text>
  <text x="50" y="310" class="content">
    这座寺庙被当地人视为神圣的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Temple -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Holy light -->
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <line x1="150" y1="0" x2="150" y2="200" class="image" />
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <!-- Temple roof -->
    <polygon points="175,20 50,100 300,100" class="image" />
  </g>
</svg>