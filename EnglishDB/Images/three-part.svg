<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-part</text>
  <text x="50" y="120" class="subtitle">[θriː pɑːrt] adj. 三部分的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + part (部分)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕被切成"三部分(three-part)"，
    <tspan x="50" dy="25">每一部分都代表一个独立的单元，但它们共同构成了一个整体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was divided into three-part sections for easier management.
  </text>
  <text x="50" y="310" class="content">
    这个项目被分成三部分，以便于管理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cake -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Three parts of the cake -->
    <rect x="20" y="20" width="80" height="160" class="image" />
    <rect x="120" y="20" width="80" height="160" class="image" />
    <rect x="220" y="20" width="80" height="160" class="image" />
    <!-- Slices -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
  </g>
</svg>