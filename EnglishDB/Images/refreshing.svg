<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">refreshing</text>
  <text x="50" y="120" class="subtitle">[rɪˈfreʃɪŋ] adj. 提神的，令人耳目一新的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + fresh (新鲜的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你在炎热的夏天，喝下一杯冰凉的柠檬水，"再次(re-)"
    <tspan x="50" dy="25">感受到"新鲜(fresh)"的清爽，这种感觉就是"refreshing"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A cold shower is very refreshing after a long run.
  </text>
  <text x="50" y="310" class="content">
    长跑后洗个冷水澡非常提神。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lemonade glass -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <circle cx="75" cy="100" r="50" class="image" />
    <!-- Ice cubes -->
    <rect x="20" y="20" width="30" height="30" class="image" />
    <rect x="60" y="20" width="30" height="30" class="image" />
    <rect x="100" y="20" width="30" height="30" class="image" />
    <!-- Lemon slice -->
    <ellipse cx="75" cy="150" rx="30" ry="15" class="image" />
    <!-- Straw -->
    <line x1="75" y1="0" x2="75" y2="200" class="image" />
  </g>
</svg>