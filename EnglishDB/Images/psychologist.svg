<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">psychologist</text>
  <text x="50" y="120" class="subtitle">[saɪˈkɑːlədʒɪst] n. 心理学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> psyche (心灵) + logy (学科) + ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心理学家，他/她正在用放大镜仔细研究"心灵(psyche)"的奥秘，
    <tspan x="50" dy="25">就像科学家研究学科(logy)一样，这个人就是心理学家(psychologist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The psychologist helped me understand my emotions better.
  </text>
  <text x="50" y="310" class="content">
    心理学家帮助我更好地理解了自己的情绪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head with brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <rect x="75" y="50" width="50" height="50" class="image" />
    <!-- Magnifying glass -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="220" y1="100" x2="280" y2="100" class="image" />
    <!-- Psychologist -->
    <circle cx="100" cy="200" r="15" class="image" />
    <line x1="100" y1="215" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="280" class="image" />
    <line x1="100" y1="250" x2="120" y2="280" class="image" />
    <line x1="100" y1="230" x2="130" y2="220" class="image" />
  </g>
</svg>