<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enlarge</text>
  <text x="50" y="120" class="subtitle">[ɪnˈlɑːrdʒ] v. 扩大，放大</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + large (大)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师挥动魔杖，"使(en-)"
    <tspan x="50" dy="25">一个小物体瞬间"变大(large)"，这就是enlarge的魔力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company plans to enlarge its market share.
  </text>
  <text x="50" y="310" class="content">
    公司计划扩大其市场份额。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small object -->
    <circle cx="50" cy="100" r="15" class="image" />
    <!-- Large object -->
    <circle cx="200" cy="100" r="50" class="image" />
    <!-- Magic wand -->
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="100" y2="150" class="image" />
    <!-- Magic effect -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
  </g>
</svg>