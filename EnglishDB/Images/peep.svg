<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peep</text>
  <text x="50" y="120" class="subtitle">[piːp] v. 偷看，窥视；n. 窥视，小鸟的叫声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peep (源自中古英语，意为“偷看”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小偷躲在墙后，偷偷地"窥视(peep)"
    <tspan x="50" dy="25">外面的情况，生怕被发现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She couldn't resist peeping through the keyhole.
  </text>
  <text x="50" y="310" class="content">
    她忍不住透过钥匙孔偷看。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Keyhole -->
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Thief -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="190" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
  </g>
</svg>