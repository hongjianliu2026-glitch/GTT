<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pesticide</text>
  <text x="50" y="120" class="subtitle">[ˈpɛstɪsaɪd] n. 杀虫剂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pest (害虫) + -i- + cide (杀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农民在田里，"杀死(cide)"
    <tspan x="50" dy="25">害虫(pest)，保护庄稼，这就是杀虫剂(pesticide)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer used pesticide to protect his crops from pests.
  </text>
  <text x="50" y="310" class="content">
    农民使用杀虫剂来保护庄稼免受害虫侵害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Farmer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Field -->
    <rect x="50" y="20" width="300" height="160" class="image" />
    <!-- Crops -->
    <line x1="70" y1="50" x2="70" y2="80" class="image" />
    <line x1="100" y1="50" x2="100" y2="80" class="image" />
    <line x1="130" y1="50" x2="130" y2="80" class="image" />
    <line x1="160" y1="50" x2="160" y2="80" class="image" />
    <!-- Pesticide spray -->
    <line x1="20" y1="100" x2="200" y2="100" class="image" />
    <circle cx="200" cy="100" r="5" class="image" />
    <!-- Pest -->
    <circle cx="250" cy="100" r="10" class="image" />
    <line x1="250" y1="110" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="240" y2="150" class="image" />
    <line x1="250" y1="130" x2="260" y2="150" class="image" />
  </g>
</svg>