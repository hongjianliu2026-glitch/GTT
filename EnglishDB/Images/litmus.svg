<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">litmus</text>
  <text x="50" y="120" class="subtitle">[ˈlɪtməs] n. 石蕊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lit (光) + mus (苔藓)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，用"发光(lit)"的"苔藓(mus)"
    <tspan x="50" dy="25">制成的试纸来测试酸碱度，这就是石蕊试纸(litmus)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The litmus test turned red, indicating an acidic solution.
  </text>
  <text x="50" y="310" class="content">
    石蕊试纸变红，表明溶液是酸性的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Test tube -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Liquid in test tube -->
    <rect x="10" y="10" width="80" height="180" class="image" fill="#F1C40F" />
    <!-- Litmus paper -->
    <rect x="120" y="100" width="50" height="20" class="image" fill="#E74C3C" />
    <!-- Scientist -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>