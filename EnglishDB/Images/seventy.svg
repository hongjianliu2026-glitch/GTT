<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seventy</text>
  <text x="50" y="120" class="subtitle">[ˈsevənti] n. 七十</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seven (七) + ty (表示数量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“70”，它由两个部分组成：
    <tspan x="50" dy="25">“7”代表七，而“0”则表示数量上的倍数，</tspan>
    <tspan x="50" dy="25">结合起来就是七十(seventy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He turned seventy last month.
  </text>
  <text x="50" y="310" class="content">
    他上个月满七十岁了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number "70" -->
    <text x="0" y="100" font-size="200" fill="#E74C3C">70</text>
    <!-- Smaller number "7" -->
    <text x="50" y="250" font-size="50" fill="#34495E">7</text>
    <!-- Smaller number "0" -->
    <text x="150" y="250" font-size="50" fill="#34495E">0</text>
  </g>
</svg>