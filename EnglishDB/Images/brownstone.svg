<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #6C3483; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brownstone</text>
  <text x="50" y="120" class="subtitle">[ˈbraʊnstəʊn] n. 褐砂石</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brown (棕色) + stone (石头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座棕色的石头房子，"棕色(brown)的石头(stone)"
    <tspan x="50" dy="25">构成了这座褐砂石(brownstone)建筑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The brownstone houses in Brooklyn are famous for their architecture.
  </text>
  <text x="50" y="310" class="content">
    布鲁克林的褐砂石房子以其建筑风格而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brownstone house -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#8B4513" />
    <!-- Windows -->
    <rect x="50" y="50" width="50" height="50" class="image" fill="#FFFFFF" />
    <rect x="150" y="50" width="50" height="50" class="image" fill="#FFFFFF" />
    <rect x="250" y="50" width="50" height="50" class="image" fill="#FFFFFF" />
    <!-- Door -->
    <rect x="150" y="120" width="50" height="80" class="image" fill="#A52A2A" />
    <!-- Roof -->
    <polygon points="0,0 350,0 300,50 50,50" class="image" fill="#8B4513" />
  </g>
</svg>