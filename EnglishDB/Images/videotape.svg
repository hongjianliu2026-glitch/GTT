<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">videotape</text>
  <text x="50" y="120" class="subtitle">[ˈvɪdiəʊteɪp] n. 录像带；v. 录像</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> video- (视频) + tape (带子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的录像带(tape)，上面播放着
    <tspan x="50" dy="25">精彩的视频(video)，这就是录像带(videotape)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They used to record their family events on videotape.
  </text>
  <text x="50" y="310" class="content">
    他们过去常常用录像带记录家庭活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tape reel -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="300" cy="100" r="50" class="image" />
    <!-- Tape -->
    <rect x="150" y="50" width="150" height="100" class="image" />
    <!-- Video screen -->
    <rect x="200" y="170" width="100" height="70" class="image" />
    <!-- Video content -->
    <line x1="210" y1="180" x2="290" y2="180" class="image" />
    <line x1="210" y1="200" x2="290" y2="200" class="image" />
    <line x1="210" y1="220" x2="290" y2="220" class="image" />
  </g>
</svg>