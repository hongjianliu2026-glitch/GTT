<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dress</text>
  <text x="50" y="120" class="subtitle">[dres] n. 连衣裙；v. 给...穿衣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dres (来自古法语 dresser，意为“整理”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女孩在镜子前，"整理(dress)"
    <tspan x="50" dy="25">她的衣服，穿上一件漂亮的连衣裙(dress)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a beautiful dress to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件漂亮的连衣裙去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dress -->
    <rect x="50" y="20" width="150" height="200" class="image" />
    <line x1="125" y1="20" x2="125" y2="220" class="image" />
    <line x1="50" y1="20" x2="200" y2="20" class="image" />
    <line x1="50" y1="220" x2="200" y2="220" class="image" />
    <!-- Girl -->
    <circle cx="125" cy="250" r="20" class="image" />
    <line x1="125" y1="270" x2="125" y2="320" class="image" />
    <line x1="125" y1="320" x2="100" y2="360" class="image" />
    <line x1="125" y1="320" x2="150" y2="360" class="image" />
    <line x1="125" y1="290" x2="170" y2="280" class="image" />
    <line x1="125" y1="290" x2="80" y2="280" class="image" />
  </g>
</svg>