<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handbag</text>
  <text x="50" y="120" class="subtitle">[ˈhændbæɡ] n. 手提包</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hand (手) + bag (包)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时尚女士，"手(hand)"里拿着一个"包(bag)"，
    <tspan x="50" dy="25">这个包就是她的手提包(handbag)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carried a designer handbag to the party.
  </text>
  <text x="50" y="310" class="content">
    她带着一个设计师手提包去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Handbag -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <!-- Handle -->
    <line x1="80" y1="0" x2="120" y2="0" class="image" />
    <!-- Woman's hand -->
    <circle cx="100" cy="170" r="15" class="image" />
    <line x1="100" y1="185" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
  </g>
</svg>