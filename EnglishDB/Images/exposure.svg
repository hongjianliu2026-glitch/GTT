<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exposure</text>
  <text x="50" y="120" class="subtitle">[ɪkˈspoʊʒər] n. 暴露，曝光</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + pos (放置) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在阳光下，"向外放置(ex-pos)"
    <tspan x="50" dy="25">自己，让阳光直接照射到皮肤上，这就是暴露(exposure)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The exposure to the sun caused her skin to burn.
  </text>
  <text x="50" y="310" class="content">
    阳光的照射导致她的皮肤晒伤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" fill="#E74C3C" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="160" y2="130" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Rays of the sun -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
  </g>
</svg>