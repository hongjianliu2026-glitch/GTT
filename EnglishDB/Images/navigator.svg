<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">navigator</text>
  <text x="50" y="120" class="subtitle">[ˈnævɪɡeɪtər] n. 导航员，领航员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> navi- (船) + -gator (引导者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个导航员站在船头，手持望远镜，"引导(gator)"
    <tspan x="50" dy="25">船只(navi-)穿越汹涌的大海，确保航行安全。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The navigator guided the ship through the stormy sea.
  </text>
  <text x="50" y="310" class="content">
    导航员引导船只穿越暴风雨的大海。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,100 350,180" class="image" />
    <!-- Navigator -->
    <circle cx="200" cy="80" r="15" class="image" />
    <line x1="200" y1="95" x2="200" y2="130" class="image" />
    <line x1="200" y1="130" x2="180" y2="160" class="image" />
    <line x1="200" y1="130" x2="220" y2="160" class="image" />
    <line x1="200" y1="110" x2="230" y2="100" class="image" />
    <!-- Telescope -->
    <line x1="200" y1="80" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="270" y2="50" class="image" />
  </g>
</svg>