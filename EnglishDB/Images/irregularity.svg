<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irregularity</text>
  <text x="50" y="120" class="subtitle">[ˌɪrəˈɡjələrɪti] n. 不规则，不整齐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (不) + regular (规则) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市街道上，"不规则(ir-regular)"
    <tspan x="50" dy="25">的建筑物和道路，形成了一个不规则(irregularity)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The irregularity of the coastline made navigation difficult.
  </text>
  <text x="50" y="310" class="content">
    海岸线的不规则使得航行变得困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Irregular buildings -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="120" y="50" width="80" height="100" class="image" />
    <rect x="220" y="20" width="60" height="180" class="image" />
    <!-- Irregular roads -->
    <line x1="0" y1="200" x2="300" y2="200" class="image" />
    <line x1="0" y1="220" x2="280" y2="220" class="image" />
    <line x1="0" y1="240" x2="260" y2="240" class="image" />
    <line x1="0" y1="260" x2="240" y2="260" class="image" />
  </g>
</svg>