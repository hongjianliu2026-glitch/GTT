<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrench</text>
  <text x="50" y="120" class="subtitle">[rɛntʃ] n. 扳手，扭伤；v. 扭伤，猛扭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wr- (扭曲) + en (使) + ch (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人用扳手"扭曲(wr-)"螺丝，结果不小心"扭伤(en-ch)"了自己的手腕。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He accidentally wrenched his back while lifting the heavy box.
  </text>
  <text x="50" y="310" class="content">
    他在抬重箱子时不小心扭伤了背部。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wrench -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="300" y2="0" class="image" />
    <!-- Worker -->
    <circle cx="50" cy="200" r="20" class="image" />
    <line x1="50" y1="220" x2="50" y2="280" class="image" />
    <line x1="50" y1="280" x2="30" y2="320" class="image" />
    <line x1="50" y1="280" x2="70" y2="320" class="image" />
    <line x1="50" y1="250" x2="100" y2="240" class="image" />
    <!-- Wrist -->
    <circle cx="50" cy="280" r="10" class="image" />
    <line x1="50" y1="290" x2="50" y2="310" class="image" />
  </g>
</svg>