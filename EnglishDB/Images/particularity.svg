<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">particularity</text>
  <text x="50" y="120" class="subtitle">[pəˌtɪkjəlˈærɪti] n. 特殊性，独特性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> parti (部分) + -cular (形容词后缀) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拼图，每个部分(parti)都有其独特的形状和颜色，
    <tspan x="50" dy="25">这些独特的部分共同构成了整个拼图的特殊性(particularity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The particularity of each piece makes the puzzle challenging.
  </text>
  <text x="50" y="310" class="content">
    每块拼图的独特性使得拼图变得具有挑战性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <polygon points="0,0 100,0 100,100 0,100" class="image" />
    <polygon points="120,0 220,0 220,100 120,100" class="image" />
    <polygon points="240,0 340,0 340,100 240,100" class="image" />
    <polygon points="0,120 100,120 100,220 0,220" class="image" />
    <polygon points="120,120 220,120 220,220 120,220" class="image" />
    <polygon points="240,120 340,120 340,220 240,220" class="image" />
    <!-- Unique shapes -->
    <polygon points="50,50 70,30 90,50 70,70" class="image" />
    <polygon points="170,50 190,30 210,50 190,70" class="image" />
    <polygon points="290,50 310,30 330,50 310,70" class="image" />
    <polygon points="50,170 70,150 90,170 70,190" class="image" />
    <polygon points="170,170 190,150 210,170 190,190" class="image" />
    <polygon points="290,170 310,150 330,170 310,190" class="image" />
  </g>
</svg>