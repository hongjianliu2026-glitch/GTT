<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perseverance</text>
  <text x="50" y="120" class="subtitle">[ˌpɜːrsəˈvɪərəns] n. 毅力，坚持不懈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + sever (严格) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在陡峭的山路上，"完全严格地(per-sever)"
    <tspan x="50" dy="25">坚持不懈地攀登，最终到达山顶，这就是毅力(perseverance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her perseverance paid off when she finally achieved her goal.
  </text>
  <text x="50" y="310" class="content">
    她的毅力最终得到了回报，她终于实现了目标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 50 L200 200 Z" class="image" />
    <!-- Climber -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="150" class="image" />
    <line x1="100" y1="130" x2="80" y2="120" class="image" />
    <line x1="100" y1="130" x2="120" y2="120" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
  </g>
</svg>