<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humility</text>
  <text x="50" y="120" class="subtitle">[hjuːˈmɪlɪti] n. 谦逊，谦卑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hum (地) + -ility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人弯腰接近地面，"贴近地面(hum)"
    <tspan x="50" dy="25">表示谦逊和谦卑(humility)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His humility impressed everyone at the meeting.
  </text>
  <text x="50" y="310" class="content">
    他的谦逊给会议上的每个人都留下了深刻印象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Person bowing -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="200" class="image" />
    <line x1="175" y1="180" x2="195" y2="200" class="image" />
    <line x1="175" y1="170" x2="150" y2="160" class="image" />
    <line x1="175" y1="170" x2="200" y2="160" class="image" />
  </g>
</svg>