<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">itch</text>
  <text x="50" y="120" class="subtitle">[ɪtʃ] n. 痒；v. 发痒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "ich"，意为“痒”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在挠痒痒，"痒(itch)"得它不停地抓挠，
    <tspan x="50" dy="25">直到它终于舒服了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mosquito bite made my arm itch.
  </text>
  <text x="50" y="310" class="content">
    蚊子叮咬让我的手臂发痒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Tail -->
    <!-- Itching -->
    <line x1="50" y1="130" x2="50" y2="150" class="image" /> <!-- Scratching -->
    <line x1="50" y1="150" x2="30" y2="140" class="image" /> <!-- Scratching -->
    <line x1="50" y1="150" x2="70" y2="140" class="image" /> <!-- Scratching -->
  </g>
</svg>