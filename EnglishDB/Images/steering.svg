<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">steering</text>
  <text x="50" y="120" class="subtitle">[ˈstɪərɪŋ] n. 转向，操纵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> steer (驾驶) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个司机在驾驶一辆车，他通过"操纵(steer)"
    <tspan x="50" dy="25">方向盘来控制车辆的方向，这就是转向(steering)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car's steering was very responsive.
  </text>
  <text x="50" y="310" class="content">
    这辆车的转向非常灵敏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="130" r="20" class="image" />
    <circle cx="300" cy="130" r="20" class="image" />
    <!-- Steering wheel -->
    <circle cx="175" cy="75" r="30" class="image" />
    <line x1="175" y1="45" x2="175" y2="105" class="image" />
    <line x1="145" y1="75" x2="205" y2="75" class="image" />
    <!-- Driver -->
    <circle cx="175" cy="40" r="15" class="image" />
    <line x1="175" y1="55" x2="175" y2="80" class="image" />
    <line x1="175" y1="80" x2="155" y2="100" class="image" />
    <line x1="175" y1="80" x2="195" y2="100" class="image" />
  </g>
</svg>