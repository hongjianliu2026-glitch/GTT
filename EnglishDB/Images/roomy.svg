<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">roomy</text>
  <text x="50" y="120" class="subtitle">[ˈruːmi] adj. 宽敞的，宽大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> room (空间) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的房间，里面有足够的空间让一群大象跳舞，这就是"roomy"的画面。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The living room is very roomy, perfect for gatherings.
  </text>
  <text x="50" y="310" class="content">
    客厅非常宽敞，非常适合聚会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Elephants -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Dancing lines -->
    <line x1="50" y1="120" x2="100" y2="140" class="image" />
    <line x1="100" y1="120" x2="150" y2="140" class="image" />
    <line x1="150" y1="120" x2="200" y2="140" class="image" />
    <line x1="200" y1="120" x2="250" y2="140" class="image" />
  </g>
</svg>