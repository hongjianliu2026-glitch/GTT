<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">restructuring</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈstrʌktʃərɪŋ] n. 重组，重构</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + struct (建造) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个建筑工人正在"再次建造(re-struct)"
    <tspan x="50" dy="25">一座大楼，这座大楼的结构被完全重组(restructuring)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is undergoing a major restructuring.
  </text>
  <text x="50" y="310" class="content">
    公司正在进行重大重组。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Original structure -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- New structure -->
    <rect x="200" y="20" width="100" height="160" class="image" />
    <!-- Worker -->
    <circle cx="125" cy="180" r="15" class="image" />
    <line x1="125" y1="195" x2="125" y2="230" class="image" />
    <line x1="125" y1="230" x2="110" y2="260" class="image" />
    <line x1="125" y1="230" x2="140" y2="260" class="image" />
    <line x1="125" y1="210" x2="160" y2="200" class="image" />
    <!-- Tools -->
    <line x1="160" y1="200" x2="180" y2="200" class="image" />
    <line x1="180" y1="200" x2="180" y2="220" class="image" />
    <line x1="180" y1="220" x2="160" y2="220" class="image" />
  </g>
</svg>