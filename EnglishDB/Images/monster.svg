<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monster</text>
  <text x="50" y="120" class="subtitle">[ˈmɒnstə(r)] n. 怪物，巨兽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> monstr (显示) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的怪物，"显示(monstr)"
    <tspan x="50" dy="25">出它的恐怖力量，让人心生畏惧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie features a terrifying monster.
  </text>
  <text x="50" y="310" class="content">
    这部电影里有一个令人恐惧的怪物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Monster eyes -->
    <circle cx="80" cy="80" r="10" class="image" fill="#E74C3C" />
    <circle cx="120" cy="80" r="10" class="image" fill="#E74C3C" />
    <!-- Monster mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" fill="none" stroke="#E74C3C" stroke-width="5" />
    <!-- Monster claws -->
    <line x1="50" y1="150" x2="30" y2="170" class="image" />
    <line x1="150" y1="150" x2="170" y2="170" class="image" />
  </g>
</svg>