<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wither</text>
  <text x="50" y="120" class="subtitle">[ˈwɪðər] v. 枯萎，凋谢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> with- (against) + -er (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵花在阳光下"对抗(with-)"
    <tspan x="50" dy="25">时间的流逝，最终"凋谢(er)"，枯萎(wither)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flowers in the vase withered after a week.
  </text>
  <text x="50" y="310" class="content">
    花瓶里的花一周后就枯萎了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="200" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Flower -->
    <circle cx="200" cy="250" r="30" class="image" fill="#C0392B" />
    <line x1="200" y1="220" x2="200" y2="180" class="image" />
    <line x1="200" y1="220" x2="160" y2="200" class="image" />
    <line x1="200" y1="220" x2="240" y2="200" class="image" />
    <line x1="200" y1="220" x2="180" y2="240" class="image" />
    <line x1="200" y1="220" x2="220" y2="240" class="image" />
    <!-- Withering effect -->
    <line x1="200" y1="250" x2="200" y2="280" class="image" stroke-dasharray="5,5" />
    <line x1="200" y1="250" x2="160" y2="270" class="image" stroke-dasharray="5,5" />
    <line x1="200" y1="250" x2="240" y2="270" class="image" stroke-dasharray="5,5" />
  </g>
</svg>