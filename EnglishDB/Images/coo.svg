<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coo</text>
  <text x="50" y="120" class="subtitle">[kuː] v. 咕咕叫，低声细语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拟声词，模仿鸽子或婴儿的低声细语
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鸽子在树枝上，"咕咕(coo)"
    <tspan x="50" dy="25">地叫着，声音温柔而低沉，仿佛在低声细语。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dove cooed softly in the tree.
  </text>
  <text x="50" y="310" class="content">
    鸽子在树上轻轻地咕咕叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree branch -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Dove -->
    <circle cx="100" cy="50" r="20" class="image" />
    <line x1="100" y1="70" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="150" class="image" />
    <line x1="100" y1="90" x2="130" y2="80" class="image" />
    <!-- Cooing sound -->
    <text x="150" y="70" class="content" style="font-size: 36px;">"coo"</text>
  </g>
</svg>