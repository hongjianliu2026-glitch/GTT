<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ticket</text>
  <text x="50" y="120" class="subtitle">[ˈtɪkɪt] n. 票，入场券；v. 给…开罚单</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tick (记号) + -et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张小小的记号(tick-et)，上面写着你的名字和座位号，
    <tspan x="50" dy="25">这就是你进入电影院的凭证——票(ticket)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I bought a ticket for the concert.
  </text>
  <text x="50" y="310" class="content">
    我为音乐会买了一张票。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ticket -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ticket stub -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Lines on ticket -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Name and seat number -->
    <text x="80" y="70" class="content">Name: John Doe</text>
    <text x="80" y="100" class="content">Seat: A12</text>
  </g>
</svg>