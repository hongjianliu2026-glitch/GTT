<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">palette</text>
  <text x="50" y="120" class="subtitle">[ˈpælɪt] n. 调色板</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pal (pale, 苍白的) + ette (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家拿着一个小巧的调色板(palette)，
    <tspan x="50" dy="25">上面有各种颜色的颜料，就像一片苍白(pale)的画布上</tspan>
    <tspan x="50" dy="25">点缀着五彩斑斓的小点(ette)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist mixed colors on her palette before painting.
  </text>
  <text x="50" y="310" class="content">
    画家在画画前在调色板上混合颜色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Palette -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Colors -->
    <circle cx="30" cy="50" r="20" fill="#FF5733" />
    <circle cx="80" cy="50" r="20" fill="#33FF57" />
    <circle cx="130" cy="50" r="20" fill="#3357FF" />
    <circle cx="180" cy="50" r="20" fill="#FF33A6" />
    <!-- Artist -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="190" class="image" />
  </g>
</svg>