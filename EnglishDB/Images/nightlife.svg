<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nightlife</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪtlaɪf] n. 夜生活</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> night (夜晚) + life (生活)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市的夜晚，霓虹灯闪烁，人们
    <tspan x="50" dy="25">在酒吧和夜店中尽情享受，这就是夜生活(nightlife)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city is famous for its vibrant nightlife.
  </text>
  <text x="50" y="310" class="content">
    这座城市以其充满活力的夜生活而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Moon -->
    <circle cx="50" cy="50" r="20" class="image" fill="#F1C40F" />
    <!-- Stars -->
    <circle cx="100" cy="30" r="3" class="image" fill="#ECF0F1" />
    <circle cx="120" cy="60" r="3" class="image" fill="#ECF0F1" />
    <circle cx="140" cy="40" r="3" class="image" fill="#ECF0F1" />
    <!-- Buildings -->
    <rect x="0" y="100" width="350" height="100" class="image" fill="#34495E" />
    <!-- Neon lights -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" stroke="#E74C3C" stroke-width="5" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" stroke="#3498DB" stroke-width="5" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" stroke="#2ECC71" stroke-width="5" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" stroke="#F1C40F" stroke-width="5" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" stroke="#9B59B6" stroke-width="5" />
    <!-- People -->
    <circle cx="70" cy="160" r="10" class="image" fill="#ECF0F1" />
    <circle cx="120" cy="160" r="10" class="image" fill="#ECF0F1" />
    <circle cx="170" cy="160" r="10" class="image" fill="#ECF0F1" />
    <circle cx="220" cy="160" r="10" class="image" fill="#ECF0F1" />
    <circle cx="270" cy="160" r="10" class="image" fill="#ECF0F1" />
  </g>
</svg>