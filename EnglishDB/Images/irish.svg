<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Irish</text>
  <text x="50" y="120" class="subtitle">[ˈaɪrɪʃ] adj. 爱尔兰的；n. 爱尔兰人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Ir- (爱尔兰) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个爱尔兰人(Ir-ish)在绿色的田野上，
    <tspan x="50" dy="25">穿着传统的服装，吹着风笛，周围是绵延的绿色山丘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has an Irish accent when she speaks English.
  </text>
  <text x="50" y="310" class="content">
    她说英语时有爱尔兰口音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Green field -->
    <rect x="0" y="0" width="350" height="200" fill="#2ECC71" />
    <!-- Hills -->
    <path d="M0,150 Q50,100 100,150 T350,150" fill="#27AE60" />
    <!-- Person -->
    <circle cx="100" cy="120" r="15" fill="#F39C12" />
    <line x1="100" y1="135" x2="100" y2="170" stroke="#F39C12" stroke-width="2" />
    <line x1="100" y1="170" x2="80" y2="200" stroke="#F39C12" stroke-width="2" />
    <line x1="100" y1="170" x2="120" y2="200" stroke="#F39C12" stroke-width="2" />
    <line x1="100" y1="150" x2="130" y2="140" stroke="#F39C12" stroke-width="2" />
    <!-- Bagpipes -->
    <rect x="110" y="100" width="20" height="40" fill="#8E44AD" />
    <line x1="120" y1="100" x2="120" y2="60" stroke="#8E44AD" stroke-width="2" />
    <circle cx="120" cy="50" r="5" fill="#8E44AD" />
  </g>
</svg>