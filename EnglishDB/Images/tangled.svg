<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tangled</text>
  <text x="50" y="120" class="subtitle">[ˈtæŋɡəld] adj. 缠结的，混乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tang (接触) + -le (小) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一团线球，"接触(tang)"在一起，
    <tspan x="50" dy="25">形成了一个"小(le)"而"缠结(tangled)"的混乱状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fishing line got tangled in the rocks.
  </text>
  <text x="50" y="310" class="content">
    钓鱼线在岩石上缠结了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tangled lines -->
    <path d="M50,50 C60,30 100,30 110,50 S150,70 160,50" class="image" />
    <path d="M50,100 C60,80 100,80 110,100 S150,120 160,100" class="image" />
    <path d="M50,150 C60,130 100,130 110,150 S150,170 160,150" class="image" />
    <path d="M50,200 C60,180 100,180 110,200 S150,220 160,200" class="image" />
    <!-- Rocks -->
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="130" cy="70" r="10" class="image" />
    <circle cx="90" cy="110" r="10" class="image" />
    <circle cx="140" cy="120" r="10" class="image" />
    <circle cx="100" cy="160" r="10" class="image" />
    <circle cx="150" cy="170" r="10" class="image" />
    <circle cx="110" cy="210" r="10" class="image" />
    <circle cx="160" cy="220" r="10" class="image" />
  </g>
</svg>