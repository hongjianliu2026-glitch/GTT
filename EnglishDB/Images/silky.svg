<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">silky</text>
  <text x="50" y="120" class="subtitle">[ˈsɪlki] adj. 丝一般的，光滑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> silk (丝) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条丝巾在微风中轻轻飘动，"丝(silk)"
    <tspan x="50" dy="25">般的触感让人感到无比光滑(silky)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fabric feels silky smooth against my skin.
  </text>
  <text x="50" y="310" class="content">
    这种布料摸起来像丝绸一样光滑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Silk scarf -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" />
    <path d="M50 70 Q100 100 150 70 T250 70" class="image" />
    <path d="M50 90 Q100 120 150 90 T250 90" class="image" />
    <!-- Wind effect -->
    <line x1="50" y1="50" x2="40" y2="40" class="image" />
    <line x1="150" y1="50" x2="160" y2="40" class="image" />
    <line x1="250" y1="50" x2="260" y2="40" class="image" />
  </g>
</svg>