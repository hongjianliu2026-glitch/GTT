<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thrilling</text>
  <text x="50" y="120" class="subtitle">[ˈθrɪlɪŋ] adj. 令人激动的，令人兴奋的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thrill (激动) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在过山车上，"激动得心跳加速(thrill)"，
    <tspan x="50" dy="25">这种感觉就是令人兴奋的(thrilling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thrilling roller coaster ride made her scream with excitement.
  </text>
  <text x="50" y="310" class="content">
    令人兴奋的过山车之旅让她兴奋地尖叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Roller coaster track -->
    <path d="M50,150 C100,50 300,50 350,150" class="image" />
    <path d="M350,150 C400,250 600,250 650,150" class="image" />
    <!-- Roller coaster car -->
    <rect x="70" y="130" width="30" height="20" class="image" />
    <!-- Person in the car -->
    <circle cx="85" cy="140" r="10" class="image" />
    <line x1="85" y1="150" x2="85" y2="170" class="image" />
    <line x1="85" y1="170" x2="75" y2="190" class="image" />
    <line x1="85" y1="170" x2="95" y2="190" class="image" />
    <line x1="85" y1="160" x2="100" y2="150" class="image" />
  </g>
</svg>