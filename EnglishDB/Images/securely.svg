<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">securely</text>
  <text x="50" y="120" class="subtitle">[sɪˈkjʊərli] adv. 安全地，牢固地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (离开) + cur (关心) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个保险箱，"离开(se-)"了所有的危险，"关心(cur)"着里面的宝藏，
    <tspan x="50" dy="25">确保它们安全地(securely)被保护着。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stored her valuables securely in the safe.
  </text>
  <text x="50" y="310" class="content">
    她把贵重物品安全地存放在保险箱里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Safe -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <!-- Lock -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="80" y1="150" x2="120" y2="150" class="image" />
    <!-- Treasure -->
    <rect x="50" y="50" width="100" height="50" class="image" />
    <line x1="60" y1="60" x2="140" y2="60" class="image" />
    <line x1="60" y1="80" x2="140" y2="80" class="image" />
    <line x1="60" y1="100" x2="140" y2="100" class="image" />
  </g>
</svg>