<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stiffly</text>
  <text x="50" y="120" class="subtitle">[ˈstɪfli] adv. 僵硬地，生硬地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stiff (僵硬的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人像木头一样"僵硬地(stiffly)"走路，
    <tspan x="50" dy="25">每一步都像是被钉在地上，无法弯曲。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He walked stiffly after sitting for too long.
  </text>
  <text x="50" y="310" class="content">
    他坐得太久后走路僵硬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stiff person -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="20" x2="20" y2="50" class="image" /> <!-- Left arm -->
    <line x1="50" y1="20" x2="80" y2="50" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="20" y2="210" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="80" y2="210" class="image" /> <!-- Right leg -->
    <circle cx="50" cy="10" r="10" class="image" /> <!-- Head -->
  </g>
</svg>