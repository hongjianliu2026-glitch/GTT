<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .toxic { fill: #A93226; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">toxic</text>
  <text x="50" y="120" class="subtitle">[ˈtɑːksɪk] adj. 有毒的，中毒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tox (毒) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个实验室里，一瓶标有"毒(tox)"的液体，
    <tspan x="50" dy="25">旁边有一个警示标志，提醒人们这是有毒的(toxic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory was releasing toxic chemicals into the river.
  </text>
  <text x="50" y="310" class="content">
    工厂正在向河里排放有毒化学物质。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lab table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Toxic bottle -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <text x="90" y="110" class="toxic">TOX</text>
    <!-- Warning sign -->
    <polygon points="200,20 250,20 250,100 200,100" class="image" />
    <text x="210" y="60" class="toxic">!</text>
  </g>
</svg>