<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">limiting</text>
  <text x="50" y="120" class="subtitle">[ˈlɪmɪtɪŋ] adj. 限制的，有限的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> limit (限制) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，"限制(limit)"
    <tspan x="50" dy="25">在它的膨胀，气球变得"有限(limiting)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The limiting factor in this project is the budget.
  </text>
  <text x="50" y="310" class="content">
    这个项目的限制因素是预算。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Rope -->
    <line x1="100" y1="180" x2="100" y2="300" class="image" />
    <!-- Ground -->
    <line x1="0" y1="300" x2="200" y2="300" class="image" />
    <!-- Limit sign -->
    <rect x="150" y="50" width="50" height="50" class="image" />
    <text x="165" y="80" class="content" fill="#A93226">Limit</text>
  </g>
</svg>