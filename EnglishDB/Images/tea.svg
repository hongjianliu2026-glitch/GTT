<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tea</text>
  <text x="50" y="120" class="subtitle">[tiː] n. 茶，茶叶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中文“茶”（chá）
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的茶馆，一位老人在品茶，
    <tspan x="50" dy="25">茶香四溢，仿佛时间都慢了下来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers green tea over black tea.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢绿茶而不是红茶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teapot -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <circle cx="75" cy="50" r="40" class="image" />
    <!-- Steam -->
    <line x1="75" y1="0" x2="75" y2="20" class="image" />
    <line x1="75" y1="0" x2="60" y2="10" class="image" />
    <line x1="75" y1="0" x2="90" y2="10" class="image" />
    <!-- Cup -->
    <rect x="180" y="30" width="80" height="50" class="image" />
    <!-- Tea leaves -->
    <circle cx="220" cy="55" r="5" class="image" />
    <circle cx="200" cy="55" r="5" class="image" />
    <circle cx="240" cy="55" r="5" class="image" />
  </g>
</svg>