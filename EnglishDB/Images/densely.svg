<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">densely</text>
  <text x="50" y="120" class="subtitle">[ˈdɛnsli] adv. 密集地，稠密地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dens (密集) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市，建筑物"密集地(densely)"排列，
    <tspan x="50" dy="25">街道上挤满了人，就像一个巨大的蜂巢。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city is densely populated.
  </text>
  <text x="50" y="310" class="content">
    这个城市人口密集。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Buildings -->
    <rect x="0" y="0" width="50" height="100" class="image" />
    <rect x="60" y="20" width="50" height="80" class="image" />
    <rect x="120" y="40" width="50" height="60" class="image" />
    <rect x="180" y="60" width="50" height="40" class="image" />
    <!-- People -->
    <circle cx="20" cy="120" r="5" class="image" />
    <circle cx="80" cy="100" r="5" class="image" />
    <circle cx="140" cy="80" r="5" class="image" />
    <circle cx="200" cy="60" r="5" class="image" />
  </g>
</svg>