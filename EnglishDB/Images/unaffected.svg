<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unaffected</text>
  <text x="50" y="120" class="subtitle">[ˌʌnəˈfektɪd] adj. 不受影响的，自然的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + affect (影响)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在风暴中，"不被影响(un-affected)"，
    <tspan x="50" dy="25">依然保持平静和自然。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Despite the chaos around him, he remained unaffected.
  </text>
  <text x="50" y="310" class="content">
    尽管周围一片混乱，他依然保持镇定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Storm clouds -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <ellipse cx="100" cy="80" rx="100" ry="40" class="image" />
    <ellipse cx="250" cy="80" rx="100" ry="40" class="image" />
    <!-- Person unaffected -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="150" y2="250" class="image" />
    <line x1="175" y1="220" x2="200" y2="250" class="image" />
    <line x1="175" y1="190" x2="130" y2="180" class="image" />
    <line x1="175" y1="190" x2="220" y2="180" class="image" />
  </g>
</svg>