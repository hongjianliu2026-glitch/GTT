<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">self-worth</text>
  <text x="50" y="120" class="subtitle">[ˈsɛlf wɜːrθ] n. 自我价值</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self- (自己) + worth (价值)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"自我(self)"
    <tspan x="50" dy="25">感受到自己的"价值(worth)"，</tspan>
    <tspan x="50" dy="25">这种内在的力量让他自信满满。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found her self-worth after years of self-doubt.
  </text>
  <text x="50" y="310" class="content">
    经过多年的自我怀疑，她找到了自我价值。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mirror -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="120" y2="220" class="image" />
    <line x1="150" y1="180" x2="180" y2="220" class="image" />
    <line x1="150" y1="150" x2="100" y2="140" class="image" />
    <line x1="150" y1="150" x2="200" y2="140" class="image" />
    <!-- Heart -->
    <path d="M150,100 A20,20 0 0,1 170,80 A20,20 0 0,1 150,100" class="image" />
    <path d="M150,100 A20,20 0 0,0 130,80 A20,20 0 0,0 150,100" class="image" />
    <line x1="150" y1="100" x2="150" y2="120" class="image" />
  </g>
</svg>