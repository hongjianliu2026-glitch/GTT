<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7D3C98; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bittersweet</text>
  <text x="50" y="120" class="subtitle">[ˈbɪtərˌswiːt] adj. 苦乐参半的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bitter (苦) + sweet (甜)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人同时品尝到苦涩的咖啡和甜美的巧克力，
    <tspan x="50" dy="25">这种混合的滋味就是苦乐参半(bittersweet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie had a bittersweet ending.
  </text>
  <text x="50" y="310" class="content">
    这部电影有一个苦乐参半的结局。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee cup -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <circle cx="50" cy="50" r="40" class="image" />
    <text x="30" y="60" class="content" fill="#34495E">苦</text>

    <!-- Chocolate bar -->
    <rect x="150" y="0" width="100" height="100" class="image" />
    <rect x="170" y="20" width="60" height="60" class="image" />
    <text x="180" y="60" class="content" fill="#34495E">甜</text>

    <!-- Person tasting -->
    <circle cx="300" cy="50" r="20" class="image" />
    <line x1="300" y1="70" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="280" y2="130" class="image" />
    <line x1="300" y1="100" x2="320" y2="130" class="image" />
    <line x1="300" y1="80" x2="330" y2="70" class="image" />
  </g>
</svg>