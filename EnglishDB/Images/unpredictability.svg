<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unpredictability</text>
  <text x="50" y="120" class="subtitle">[ˌʌnprɪˌdɪktəˈbɪləti] n. 不可预测性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + predict (预测) + -ability (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天气预报员在屏幕前，"无法预测(un-predict)"
    <tspan x="50" dy="25">天气的变化，天空突然下起了彩虹雨，这就是不可预测性(unpredictability)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unpredictability of the stock market makes it risky.
  </text>
  <text x="50" y="310" class="content">
    股市的不可预测性使其充满风险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Weather forecaster -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Screen -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Sky -->
    <rect x="50" y="20" width="250" height="80" class="image" fill="#87CEEB" />
    <!-- Rainbow -->
    <polyline points="70,80 100,50 130,80 160,50 190,80 220,50 250,80" class="image" fill="none" stroke="#FFD700" stroke-width="5" />
    <!-- Rain -->
    <line x1="70" y1="100" x2="70" y2="120" class="image" stroke="#48C9B0" stroke-width="3" />
    <line x1="100" y1="100" x2="100" y2="120" class="image" stroke="#48C9B0" stroke-width="3" />
    <line x1="130" y1="100" x2="130" y2="120" class="image" stroke="#48C9B0" stroke-width="3" />
    <line x1="160" y1="100" x2="160" y2="120" class="image" stroke="#48C9B0" stroke-width="3" />
    <line x1="190" y1="100" x2="190" y2="120" class="image" stroke="#48C9B0" stroke-width="3" />
    <line x1="220" y1="100" x2="220" y2="120" class="image" stroke="#48C9B0" stroke-width="3" />
    <line x1="250" y1="100" x2="250" y2="120" class="image" stroke="#48C9B0" stroke-width="3" />
  </g>
</svg>