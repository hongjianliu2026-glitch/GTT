<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">souvenir</text>
  <text x="50" y="120" class="subtitle">[ˌsuːvəˈnɪr] n. 纪念品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sou- (来自) + venir (来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你旅行到一个美丽的地方，带回一个"来自(sou-venir)"
    <tspan x="50" dy="25">那里的纪念品，它承载着你的美好回忆。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a small statue as a souvenir from her trip to Italy.
  </text>
  <text x="50" y="310" class="content">
    她从意大利旅行回来，买了一个小雕像作为纪念品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Pin -->
    <line x1="100" y1="50" x2="100" y2="10" class="image" />
    <circle cx="100" cy="10" r="5" class="image" />
    <!-- Statue -->
    <rect x="180" y="50" width="40" height="100" class="image" />
    <circle cx="200" cy="40" r="10" class="image" />
    <!-- Bag -->
    <rect x="250" y="100" width="100" height="50" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="350" y1="100" x2="350" y2="150" class="image" />
    <line x1="250" y1="150" x2="350" y2="150" class="image" />
  </g>
</svg>