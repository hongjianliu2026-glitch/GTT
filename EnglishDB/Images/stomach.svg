<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stomach</text>
  <text x="50" y="120" class="subtitle">[ˈstʌmək] n. 胃；v. 忍受</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stoma (口) + ach (疼痛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的嘴巴(stoma)，里面充满了各种食物，
    <tspan x="50" dy="25">而嘴巴的底部有一个疼痛(ach)的区域，这就是胃(stomach)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She couldn't stomach the spicy food.
  </text>
  <text x="50" y="310" class="content">
    她无法忍受辣的食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Teeth -->
    <rect x="50" y="50" width="250" height="50" class="image" />
    <!-- Tongue -->
    <rect x="100" y="100" width="150" height="20" class="image" />
    <!-- Stomach pain -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="220" class="image" />
    <line x1="175" y1="200" x2="195" y2="220" class="image" />
  </g>
</svg>