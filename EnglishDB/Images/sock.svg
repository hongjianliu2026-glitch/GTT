<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sock</text>
  <text x="50" y="120" class="subtitle">[sɒk] n. 短袜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "socke"，可能与 "soccus"（古罗马的一种软鞋）有关。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只袜子在跳舞，"跳跃(sock)"
    <tspan x="50" dy="25">在地板上，仿佛在说：“我是你的脚的最佳伴侣！”</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a pair of colorful socks for her brother.
  </text>
  <text x="50" y="310" class="content">
    她为弟弟买了一双彩色的袜子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sock -->
    <path d="M50 100 Q100 50 150 100 T250 100" class="image" />
    <path d="M50 100 L50 150 Q100 200 150 150 T250 150" class="image" />
    <path d="M250 100 L250 150" class="image" />
    <!-- Dancing sock -->
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
  </g>
</svg>