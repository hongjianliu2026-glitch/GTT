<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carol</text>
  <text x="50" y="120" class="subtitle">[ˈkærəl] n. 颂歌，欢乐之歌；v. 唱颂歌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carol (源自拉丁语 "choraula"，意为 "颂歌")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在圣诞节期间，围着一棵闪亮的圣诞树，
    <tspan x="50" dy="25">欢快地唱着颂歌(carol)，歌声在空气中回荡，充满了欢乐和祝福。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They went caroling around the neighborhood last night.
  </text>
  <text x="50" y="310" class="content">
    他们昨晚在附近唱颂歌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Christmas tree -->
    <polygon points="175,50 100,200 250,200" class="image" />
    <circle cx="175" cy="30" r="20" class="image" />
    <circle cx="140" cy="100" r="20" class="image" />
    <circle cx="210" cy="100" r="20" class="image" />
    <circle cx="175" cy="150" r="20" class="image" />
    <!-- People singing -->
    <circle cx="100" cy="250" r="15" class="image" />
    <circle cx="150" cy="250" r="15" class="image" />
    <circle cx="200" cy="250" r="15" class="image" />
    <circle cx="250" cy="250" r="15" class="image" />
    <line x1="100" y1="265" x2="100" y2="300" class="image" />
    <line x1="150" y1="265" x2="150" y2="300" class="image" />
    <line x1="200" y1="265" x2="200" y2="300" class="image" />
    <line x1="250" y1="265" x2="250" y2="300" class="image" />
    <line x1="100" y1="300" x2="80" y2="330" class="image" />
    <line x1="100" y1="300" x2="120" y2="330" class="image" />
    <line x1="150" y1="300" x2="130" y2="330" class="image" />
    <line x1="150" y1="300" x2="170" y2="330" class="image" />
    <line x1="200" y1="300" x2="180" y2="330" class="image" />
    <line x1="200" y1="300" x2="220" y2="330" class="image" />
    <line x1="250" y1="300" x2="230" y2="330" class="image" />
    <line x1="250" y1="300" x2="270" y2="330" class="image" />
  </g>
</svg>