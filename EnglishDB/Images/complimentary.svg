<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">complimentary</text>
  <text x="50" y="120" class="subtitle">[ˌkɒmplɪˈment(ə)ri] adj. 赞美的，免费的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + pli (充满) + ment (名词后缀) + ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个服务员端着一盘"充满赞美(com-pli-ment)"的甜点，
    <tspan x="50" dy="25">免费送给客人，这就是"赞美的，免费的(complimentary)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hotel offered complimentary breakfast to all guests.
  </text>
  <text x="50" y="310" class="content">
    酒店为所有客人提供免费早餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dessert -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Fork -->
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="250" y2="100" class="image" />
    <!-- Server -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="280" y2="210" class="image" />
    <line x1="300" y1="180" x2="320" y2="210" class="image" />
    <line x1="300" y1="150" x2="330" y2="140" class="image" />
  </g>
</svg>