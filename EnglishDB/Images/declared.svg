<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">declared</text>
  <text x="50" y="120" class="subtitle">[dɪˈklerd] v. 宣布，声明</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + clar (清楚) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高台上，"强调地清楚地(de-clar-ed)"
    <tspan x="50" dy="25">宣布一个重要消息，声音响彻整个广场。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The president declared a state of emergency.
  </text>
  <text x="50" y="310" class="content">
    总统宣布进入紧急状态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on the platform -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="150" y2="150" class="image" />
    <line x1="175" y1="120" x2="200" y2="150" class="image" />
    <line x1="175" y1="90" x2="220" y2="80" class="image" />
    <!-- Megaphone -->
    <rect x="220" y="40" width="50" height="20" class="image" />
    <line x1="270" y1="50" x2="290" y2="30" class="image" />
    <line x1="270" y1="50" x2="290" y2="70" class="image" />
    <!-- Sound waves -->
    <line x1="290" y1="30" x2="320" y2="20" class="image" />
    <line x1="290" y1="50" x2="320" y2="50" class="image" />
    <line x1="290" y1="70" x2="320" y2="80" class="image" />
  </g>
</svg>