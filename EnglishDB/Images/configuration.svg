<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">configuration</text>
  <text x="50" y="120" class="subtitle">[kənˌfɪɡjəˈreɪʃn] n. 配置，布局</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + figur (形状) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工程师在调整机器的"形状(figur)"，
    <tspan x="50" dy="25">将各个部件"一起(con-)"组合成一个完美的布局(configuration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The configuration of the new office space was designed to maximize efficiency.
  </text>
  <text x="50" y="310" class="content">
    新办公室空间的布局设计是为了最大化效率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Engineer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Machine parts -->
    <rect x="70" y="20" width="50" height="50" class="image" />
    <rect x="140" y="20" width="50" height="50" class="image" />
    <rect x="210" y="20" width="50" height="50" class="image" />
    <!-- Connecting lines -->
    <line x1="95" y1="70" x2="165" y2="70" class="image" />
    <line x1="165" y1="70" x2="235" y2="70" class="image" />
    <!-- Final configuration -->
    <rect x="70" y="100" width="200" height="50" class="image" />
  </g>
</svg>