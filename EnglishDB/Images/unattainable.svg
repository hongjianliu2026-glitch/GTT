<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unattainable</text>
  <text x="50" y="120" class="subtitle">[ˌʌnəˈteɪnəbl] adj. 无法达到的，难以获得的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + attain (达到) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个登山者试图攀登一座"无法达到(un-attain-able)"
    <tspan x="50" dy="25">的雪山，尽管他努力攀爬，但山顶依然遥不可及。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The summit of the mountain was unattainable due to the extreme weather conditions.
  </text>
  <text x="50" y="310" class="content">
    由于极端天气条件，山顶无法到达。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Climber -->
    <circle cx="150" cy="150" r="10" class="image" />
    <line x1="150" y1="160" x2="150" y2="190" class="image" />
    <line x1="150" y1="190" x2="140" y2="210" class="image" />
    <line x1="150" y1="190" x2="160" y2="210" class="image" />
    <line x1="150" y1="170" x2="130" y2="160" class="image" />
    <line x1="150" y1="170" x2="170" y2="160" class="image" />
    <!-- Cloud -->
    <ellipse cx="200" cy="50" rx="100" ry="30" class="image" />
    <ellipse cx="250" cy="70" rx="80" ry="20" class="image" />
    <ellipse cx="150" cy="70" rx="80" ry="20" class="image" />
  </g>
</svg>