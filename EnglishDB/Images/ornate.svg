<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ornate</text>
  <text x="50" y="120" class="subtitle">[ɔːrˈneɪt] adj. 装饰华丽的，精致的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> orn (装饰) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，"装饰(orn)"
    <tspan x="50" dy="25">得极其华丽，到处都是精美的雕刻和图案，</tspan>
    <tspan x="50" dy="25">这就是一个"装饰华丽的(ornate)"房间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The palace had an ornate ceiling with intricate designs.
  </text>
  <text x="50" y="310" class="content">
    宫殿的天花板装饰华丽，图案复杂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Room -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Ornate designs -->
    <circle cx="100" cy="60" r="10" class="image" />
    <circle cx="150" cy="60" r="10" class="image" />
    <circle cx="200" cy="60" r="10" class="image" />
    <circle cx="250" cy="60" r="10" class="image" />
    <line x1="100" y1="80" x2="250" y2="80" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="120" x2="250" y2="120" class="image" />
    <line x1="100" y1="140" x2="250" y2="140" class="image" />
    <!-- Ornate patterns -->
    <rect x="70" y="100" width="20" height="20" class="image" />
    <rect x="100" y="100" width="20" height="20" class="image" />
    <rect x="130" y="100" width="20" height="20" class="image" />
    <rect x="160" y="100" width="20" height="20" class="image" />
    <rect x="190" y="100" width="20" height="20" class="image" />
    <rect x="220" y="100" width="20" height="20" class="image" />
  </g>
</svg>