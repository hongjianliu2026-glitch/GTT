<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">defamation</text>
  <text x="50" y="120" class="subtitle">[ˌdefəˈmeɪʃn] n. 诽谤，中伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + fama (名声) + -tion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公共场合，"向下(de-)"
    <tspan x="50" dy="25">诋毁(fama)他人的名声，这种行为就是诽谤(defamation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lawsuit was filed for defamation of character.
  </text>
  <text x="50" y="310" class="content">
    这起诉讼是因为对人格的诽谤而提起的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person speaking -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M 90 100 Q 150 110 150 150 Q 150 190 90 200 Z" class="image" />
    <!-- Arrow pointing down -->
    <line x1="120" y1="200" x2="120" y2="250" class="image" />
    <line x1="120" y1="250" x2="110" y2="240" class="image" />
    <line x1="120" y1="250" x2="130" y2="240" class="image" />
    <!-- Broken reputation -->
    <line x1="150" y1="250" x2="250" y2="250" class="image" />
    <line x1="150" y1="250" x2="150" y2="270" class="image" />
    <line x1="250" y1="250" x2="250" y2="270" class="image" />
    <line x1="150" y1="270" x2="250" y2="270" class="image" />
  </g>
</svg>