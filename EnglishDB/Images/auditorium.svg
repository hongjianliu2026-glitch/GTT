<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">auditorium</text>
  <text x="50" y="120" class="subtitle">[ˌɔːdɪˈtɔːriəm] n. 礼堂，观众席</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> audit- (听) + -orium (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的礼堂，"听众(audit)"
    <tspan x="50" dy="25">聚集在一个专门的场所(-orium)，</tspan>
    <tspan x="50" dy="25">共同聆听一场精彩的演讲或音乐会。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concert was held in the university auditorium.
  </text>
  <text x="50" y="310" class="content">
    音乐会在大学礼堂举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Auditorium outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stage -->
    <rect x="100" y="20" width="150" height="50" class="image" />
    <!-- Seats -->
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <!-- Audience -->
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="130" cy="100" r="10" class="image" />
    <circle cx="160" cy="100" r="10" class="image" />
    <circle cx="190" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="280" cy="100" r="10" class="image" />
  </g>
</svg>