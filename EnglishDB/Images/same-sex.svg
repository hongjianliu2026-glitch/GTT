<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">same-sex</text>
  <text x="50" y="120" class="subtitle">[seɪm seks] adj. 同性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> same (相同的) + sex (性别)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个相同性别的人手牵手，象征着"同性(same-sex)"的关系。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They are a same-sex couple.
  </text>
  <text x="50" y="310" class="content">
    他们是一对同性伴侣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person 1 -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />

    <!-- Person 2 -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="170" y2="220" class="image" />
    <line x1="200" y1="180" x2="230" y2="220" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />

    <!-- Hand holding -->
    <line x1="130" y1="140" x2="170" y2="140" class="image" />
  </g>
</svg>