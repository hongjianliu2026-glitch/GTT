<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .book { fill: #F39C12; }
      .shelf { fill: #8E44AD; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bookshelf</text>
  <text x="50" y="120" class="subtitle">[ˈbʊkʃelf] n. 书架</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> book (书) + shelf (架子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的书架，上面堆满了各种书籍，
    <tspan x="50" dy="25">每本书都整齐地排列在架子上，就像一座书的城堡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She organized her bookshelf by genre.
  </text>
  <text x="50" y="310" class="content">
    她按类别整理了她的书架。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bookshelf -->
    <rect x="0" y="0" width="350" height="200" class="shelf" />
    <!-- Books -->
    <rect x="20" y="20" width="50" height="160" class="book" />
    <rect x="90" y="20" width="50" height="160" class="book" />
    <rect x="160" y="20" width="50" height="160" class="book" />
    <rect x="230" y="20" width="50" height="160" class="book" />
    <rect x="300" y="20" width="50" height="160" class="book" />
  </g>
</svg>