<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tree { fill: #27AE60; }
      .star { fill: #F1C40F; }
      .gift { fill: #E67E22; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Christmas</text>
  <text x="50" y="120" class="subtitle">[ˈkrɪsməs] n. 圣诞节</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Christ (基督) + mas (节日)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满欢乐的节日，"基督的节日(Christ-mas)"
    <tspan x="50" dy="25">充满了圣诞树、礼物和星星，这就是圣诞节(Christmas)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We celebrate Christmas with a big family dinner.
  </text>
  <text x="50" y="310" class="content">
    我们用一顿丰盛的家庭晚餐来庆祝圣诞节。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Christmas tree -->
    <polygon points="100,20 20,180 180,180" class="tree" />
    <!-- Star on top of the tree -->
    <polygon points="100,5 85,35 115,35" class="star" />
    <!-- Gifts -->
    <rect x="20" y="190" width="50" height="30" class="gift" />
    <rect x="100" y="190" width="50" height="30" class="gift" />
    <rect x="180" y="190" width="50" height="30" class="gift" />
  </g>
</svg>