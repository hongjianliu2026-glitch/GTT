<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">futility</text>
  <text x="50" y="120" class="subtitle">[fjuːˈtɪlɪti] n. 无用，无效</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fut (做) + -ility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在努力"做(fut)"某事，但最终发现
    <tspan x="50" dy="25">一切都是徒劳的，这种"无效(futility)"让人感到沮丧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The futility of trying to move the mountain with bare hands was obvious.
  </text>
  <text x="50" y="310" class="content">
    试图用赤手空拳移动山脉的徒劳是显而易见的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person trying to move a mountain -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mountain -->
    <polygon points="50,180 200,20 350,180" class="image" />
    <!-- Person -->
    <circle cx="120" cy="150" r="15" class="image" />
    <line x1="120" y1="165" x2="120" y2="190" class="image" />
    <line x1="120" y1="190" x2="100" y2="220" class="image" />
    <line x1="120" y1="190" x2="140" y2="220" class="image" />
    <line x1="120" y1="175" x2="150" y2="165" class="image" />
    <!-- Exclamation mark -->
    <text x="180" y="170" class="highlight">!</text>
  </g>
</svg>