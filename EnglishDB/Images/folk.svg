<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">folk</text>
  <text x="50" y="120" class="subtitle">[foʊk] n. 人们，民间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> folk (人们)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群"人们(folk)"围坐在篝火旁，
    <tspan x="50" dy="25">分享故事和音乐，这就是民间(folk)文化的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The folk music festival attracted many people.
  </text>
  <text x="50" y="310" class="content">
    民间音乐节吸引了许多人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Campfire -->
    <circle cx="100" cy="100" r="30" class="image" fill="#FFA07A" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="85" y1="70" x2="115" y2="70" class="image" />
    <line x1="100" y1="40" x2="100" y2="60" class="image" />

    <!-- People -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="35" y2="210" class="image" />
    <line x1="50" y1="190" x2="65" y2="210" class="image" />
    <line x1="50" y1="175" x2="70" y2="165" class="image" />

    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="190" class="image" />
    <line x1="150" y1="190" x2="135" y2="210" class="image" />
    <line x1="150" y1="190" x2="165" y2="210" class="image" />
    <line x1="150" y1="175" x2="170" y2="165" class="image" />
  </g>
</svg>