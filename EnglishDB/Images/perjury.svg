<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perjury</text>
  <text x="50" y="120" class="subtitle">[ˈpɜːrdʒəri] n. 伪证，作伪证</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + jur (发誓) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在法庭上，"完全违背誓言(per-jur-y)"，
    <tspan x="50" dy="25">说出了虚假的证词，这就是伪证(perjury)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was charged with perjury for lying under oath.
  </text>
  <text x="50" y="310" class="content">
    他因在宣誓后撒谎而被指控作伪证。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Witness stand -->
    <rect x="100" y="100" width="150" height="80" class="image" />
    <!-- Person on witness stand -->
    <circle cx="175" cy="140" r="15" class="image" />
    <line x1="175" y1="155" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="160" y2="200" class="image" />
    <line x1="175" y1="180" x2="190" y2="200" class="image" />
    <line x1="175" y1="165" x2="200" y2="155" class="image" />
    <!-- Broken oath -->
    <line x1="175" y1="120" x2="175" y2="130" class="image" />
    <line x1="170" y1="125" x2="180" y2="125" class="image" />
  </g>
</svg>