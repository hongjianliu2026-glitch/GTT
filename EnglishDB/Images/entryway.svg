<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entryway</text>
  <text x="50" y="120" class="subtitle">[ˈɛntriˌweɪ] n. 入口，门厅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> entry (进入) + way (道路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门厅，"进入(entry)"
    <tspan x="50" dy="25">的道路(way)上铺满了金色的地毯，</tspan>
    <tspan x="50" dy="25">两边是高大的柱子，仿佛通向一个神秘的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The entryway of the palace was grand and impressive.
  </text>
  <text x="50" y="310" class="content">
    宫殿的入口宏伟壮观。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doorway -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Carpet -->
    <rect x="70" y="50" width="210" height="100" fill="#FFD700" />
    <!-- Columns -->
    <rect x="70" y="50" width="20" height="100" fill="#C0C0C0" />
    <rect x="260" y="50" width="20" height="100" fill="#C0C0C0" />
    <!-- Door -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <circle cx="175" cy="100" r="10" fill="#C0C0C0" />
  </g>
</svg>