<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hatchet</text>
  <text x="50" y="120" class="subtitle">[ˈhætʃɪt] n. 短柄小斧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hatc (砍) + -et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的伐木工，手持一把"小砍斧(hatchet)"，
    <tspan x="50" dy="25">轻松地砍倒了一棵大树，画面夸张而有力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The woodsman carried a hatchet for chopping wood.
  </text>
  <text x="50" y="310" class="content">
    伐木工人带着一把短柄小斧来砍柴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Hatchet -->
    <line x1="170" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="150" class="image" />
    <line x1="230" y1="150" x2="230" y2="170" class="image" />
    <line x1="230" y1="170" x2="210" y2="170" class="image" />
    <line x1="210" y1="170" x2="210" y2="190" class="image" />
    <!-- Woodsman -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="330" y2="120" class="image" />
  </g>
</svg>