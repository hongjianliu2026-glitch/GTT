<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cot</text>
  <text x="50" y="120" class="subtitle">[kɒt] n. 小床，吊床</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "cote"，意为小屋或小床
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小宝宝躺在"小床(cot)"上，
    <tspan x="50" dy="25">周围是柔软的毯子和可爱的玩具，</tspan>
    <tspan x="50" dy="25">这个小床就像一个小屋(cote)，</tspan>
    <tspan x="50" dy="25">给宝宝带来温暖和安全感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The baby slept soundly in her cot.
  </text>
  <text x="50" y="330" class="content">
    宝宝在她的婴儿床里睡得很香。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cot -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <line x1="20" y1="0" x2="20" y2="100" class="image" />
    <line x1="180" y1="0" x2="180" y2="100" class="image" />
    <line x1="20" y1="50" x2="180" y2="50" class="image" />
    <!-- Baby -->
    <circle cx="100" cy="50" r="20" class="image" />
    <line x1="100" y1="70" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="80" x2="70" y2="90" class="image" />
    <line x1="100" y1="80" x2="130" y2="90" class="image" />
  </g>
</svg>