<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bite</text>
  <text x="50" y="120" class="subtitle">[baɪt] v. 咬，叮；n. 咬，一口</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (二) + te (牙齿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小狗用它的两颗牙齿("bi-te")
    <tspan x="50" dy="25">轻轻地咬住你的手指，这就是"bite"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog gave me a playful bite.
  </text>
  <text x="50" y="310" class="content">
    那只狗轻轻地咬了我一下，很调皮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="155" x2="20" y2="140" class="image" />
    <line x1="50" y1="155" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />
    <!-- Teeth -->
    <line x1="40" y1="120" x2="60" y2="120" class="image" />
    <line x1="45" y1="115" x2="55" y2="115" class="image" />
    <!-- Finger -->
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <line x1="125" y1="150" x2="125" y2="100" class="image" />
    <line x1="125" y1="100" x2="115" y2="110" class="image" />
    <line x1="125" y1="100" x2="135" y2="110" class="image" />
  </g>
</svg>