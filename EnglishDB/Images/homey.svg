<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">homey</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊmi] adj. 舒适的，像家一样的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> home (家) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温馨的家，"家(home)"里充满了
    <tspan x="50" dy="25">"舒适(y)"的氛围，让人感到温暖和放松。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cottage felt very homey after we decorated it.
  </text>
  <text x="50" y="310" class="content">
    我们装饰后，小屋感觉非常舒适。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,20 300,20 350,70 0,70" class="image" />
    <rect x="70" y="40" width="210" height="140" class="image" />
    <!-- Windows -->
    <rect x="90" y="60" width="50" height="50" class="image" />
    <rect x="180" y="60" width="50" height="50" class="image" />
    <!-- Door -->
    <rect x="140" y="100" width="70" height="80" class="image" />
    <!-- Chimney -->
    <rect x="280" y="0" width="20" height="50" class="image" />
    <!-- Smoke -->
    <circle cx="290" cy="40" r="10" class="image" />
    <circle cx="300" cy="30" r="10" class="image" />
    <circle cx="310" cy="20" r="10" class="image" />
  </g>
</svg>