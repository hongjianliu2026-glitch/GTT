<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seller</text>
  <text x="50" y="120" class="subtitle">[ˈselər] n. 卖家，销售者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sell (卖) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热情的卖家站在摊位前，"卖(sell)"
    <tspan x="50" dy="25">各种商品，他就是那个销售者(seller)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The seller offered a discount to attract more customers.
  </text>
  <text x="50" y="310" class="content">
    卖家提供了折扣以吸引更多顾客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Seller -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Products -->
    <rect x="100" y="20" width="50" height="50" class="image" />
    <rect x="160" y="20" width="50" height="50" class="image" />
    <rect x="220" y="20" width="50" height="50" class="image" />
    <rect x="280" y="20" width="50" height="50" class="image" />
  </g>
</svg>