<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outage</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtɪdʒ] n. 停电，中断</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (外面) + age (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市突然陷入黑暗，所有的灯都"在外面(out-)"，
    <tspan x="50" dy="25">因为电力"状态(age)"中断了，这就是停电(outage)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outage lasted for three hours.
  </text>
  <text x="50" y="310" class="content">
    停电持续了三个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark city skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Darkened buildings -->
    <rect x="100" y="20" width="30" height="100" class="image" />
    <rect x="150" y="20" width="30" height="120" class="image" />
    <rect x="200" y="20" width="30" height="80" class="image" />
    <rect x="250" y="20" width="30" height="140" class="image" />
    <!-- Lightning bolt -->
    <line x1="50" y1="20" x2="300" y2="180" class="image" />
    <line x1="50" y1="180" x2="300" y2="20" class="image" />
  </g>
</svg>