<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">energize</text>
  <text x="50" y="120" class="subtitle">[ˈenərˌdʒaɪz] v. 使充满活力，激励</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + erg (工作) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"注入(en-)"了"能量(erg)"，
    <tspan x="50" dy="25">瞬间变得充满活力，仿佛能"工作(erg)"一整天。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The speaker's enthusiasm energized the audience.
  </text>
  <text x="50" y="310" class="content">
    演讲者的热情激励了观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />

    <!-- Energy lines -->
    <line x1="50" y1="70" x2="50" y2="30" class="image" />
    <line x1="30" y1="80" x2="10" y2="60" class="image" />
    <line x1="70" y1="80" x2="90" y2="60" class="image" />
    <line x1="40" y1="50" x2="20" y2="30" class="image" />
    <line x1="60" y1="50" x2="80" y2="30" class="image" />
  </g>
</svg>