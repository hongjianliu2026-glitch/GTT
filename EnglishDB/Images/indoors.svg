<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indoors</text>
  <text x="50" y="120" class="subtitle">[ˌɪnˈdɔrz] adv. 在室内</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (在...里面) + doors (门)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在门外，突然一阵大风把门"吹进(in-doors)"，
    <tspan x="50" dy="25">他不得不赶紧躲进室内。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Let's stay indoors today because it's raining heavily.
  </text>
  <text x="50" y="310" class="content">
    今天我们待在室内吧，因为雨下得很大。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Person outside -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Wind blowing -->
    <polyline points="150,100 170,80 190,100" class="image" />
    <polyline points="150,120 170,140 190,120" class="image" />
  </g>
</svg>