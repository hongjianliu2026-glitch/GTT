<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leery</text>
  <text x="50" y="120" class="subtitle">[ˈlɪəri] adj. 怀疑的，警惕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leer (斜眼看) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人斜着眼睛看你，"斜眼看(leer)"
    <tspan x="50" dy="25">表示他对你保持警惕，这种状态就是leery。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was leery of strangers after the incident.
  </text>
  <text x="50" y="310" class="content">
    那次事件后，她对陌生人保持警惕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a suspicious look -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="110" x2="80" y2="100" class="image" />
    <!-- Leery eyes -->
    <ellipse cx="40" cy="40" rx="10" ry="5" class="image" />
    <ellipse cx="60" cy="40" rx="10" ry="5" class="image" />
    <line x1="35" y1="40" x2="65" y2="40" class="image" />
  </g>
</svg>