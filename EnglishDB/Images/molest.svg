<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">molest</text>
  <text x="50" y="120" class="subtitle">[məˈlest] v. 骚扰，干扰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mol- (软) + est (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只柔软的(mol-)手不停地触碰(est)你，
    <tspan x="50" dy="25">这种持续的触碰让人感到不适，这就是骚扰(molest)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was molested by a stranger on the bus.
  </text>
  <text x="50" y="310" class="content">
    她在公交车上被一个陌生人骚扰了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />

    <!-- Person -->
    <circle cx="200" cy="100" r="40" class="image" />
    <line x1="200" y1="140" x2="200" y2="200" class="image" />
    <line x1="200" y1="160" x2="160" y2="180" class="image" />
    <line x1="200" y1="160" x2="240" y2="180" class="image" />
    <line x1="200" y1="200" x2="160" y2="240" class="image" />
    <line x1="200" y1="200" x2="240" y2="240" class="image" />

    <!-- Arrow -->
    <line x1="100" y1="150" x2="180" y2="150" class="image" />
    <polygon points="180,150 170,145 170,155" class="image" />
  </g>
</svg>