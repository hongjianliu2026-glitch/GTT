<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">age-related</text>
  <text x="50" y="120" class="subtitle">[eɪdʒ rɪˈleɪtɪd] adj. 与年龄相关的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> age (年龄) + related (相关的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老人和一个小孩，"年龄(age)"
    <tspan x="50" dy="25">相关的(related)问题在他们身上显现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Age-related diseases are becoming more common.
  </text>
  <text x="50" y="310" class="content">
    与年龄相关的疾病变得越来越常见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Young person -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Age-related symbol -->
    <line x1="150" y1="200" x2="150" y2="250" class="image" />
    <line x1="150" y1="225" x2="120" y2="225" class="image" />
    <line x1="150" y1="225" x2="180" y2="225" class="image" />
  </g>
</svg>