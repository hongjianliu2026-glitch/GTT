<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">western</text>
  <text x="50" y="120" class="subtitle">[ˈwɛstərn] adj. 西方的，西部的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> west (西方) + -ern (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个牛仔骑着马，在夕阳下，"向西(west)"
    <tspan x="50" dy="25">方奔驰，这就是典型的西部(western)场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He loves watching western movies.
  </text>
  <text x="50" y="310" class="content">
    他喜欢看西部电影。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="300" cy="50" r="40" fill="#F1C40F" />
    <!-- Horse and cowboy -->
    <rect x="150" y="100" width="200" height="100" class="image" />
    <circle cx="200" cy="150" r="20" fill="#D35400" />
    <line x1="200" y1="170" x2="200" y2="200" class="image" />
    <line x1="200" y1="180" x2="180" y2="190" class="image" />
    <line x1="200" y1="180" x2="220" y2="190" class="image" />
    <line x1="200" y1="200" x2="180" y2="220" class="image" />
    <line x1="200" y1="200" x2="220" y2="220" class="image" />
    <!-- Horse -->
    <circle cx="250" cy="150" r="20" fill="#8E44AD" />
    <line x1="250" y1="170" x2="250" y2="200" class="image" />
    <line x1="250" y1="180" x2="230" y2="190" class="image" />
    <line x1="250" y1="180" x2="270" y2="190" class="image" />
    <line x1="250" y1="200" x2="230" y2="220" class="image" />
    <line x1="250" y1="200" x2="270" y2="220" class="image" />
  </g>
</svg>