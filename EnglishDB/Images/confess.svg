<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confess</text>
  <text x="50" y="120" class="subtitle">[kənˈfes] v. 承认，坦白</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (完全) + fess (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在法庭上，"完全说出(con-fess)"
    <tspan x="50" dy="25">自己的罪行，这就是坦白(confess)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He finally confessed to stealing the money.
  </text>
  <text x="50" y="310" class="content">
    他最终承认偷了钱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Person confessing -->
    <circle cx="200" cy="120" r="15" class="image" />
    <line x1="200" y1="135" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="180" y2="200" class="image" />
    <line x1="200" y1="170" x2="220" y2="200" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M 230 100 Q 280 100 280 130 Q 280 160 230 160 Q 200 160 200 130 Z" class="image" />
    <text x="240" y="140" class="content" text-anchor="middle">I confess!</text>
  </g>
</svg>