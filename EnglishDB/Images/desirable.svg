<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">desirable</text>
  <text x="50" y="120" class="subtitle">[dɪˈzaɪərəbl] adj. 值得拥有的，理想的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + sir (渴望) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个闪闪发光的宝箱，里面装满了"渴望(sir)"
    <tspan x="50" dy="25">得到的珍宝，这些珍宝都是"值得拥有的(desirable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A peaceful environment is desirable for everyone.
  </text>
  <text x="50" y="310" class="content">
    一个和平的环境对每个人来说都是理想的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Treasure chest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Sparkles -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="200" cy="80" r="10" class="image" />
    <circle cx="250" cy="140" r="10" class="image" />
    <!-- Gems -->
    <circle cx="70" cy="50" r="15" class="image" />
    <circle cx="180" cy="110" r="15" class="image" />
    <circle cx="270" cy="70" r="15" class="image" />
  </g>
</svg>