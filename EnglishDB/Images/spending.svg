<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spending</text>
  <text x="50" y="120" class="subtitle">[ˈspendɪŋ] n. 花费，支出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spend (花费) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在疯狂地"花费(spend)"
    <tspan x="50" dy="25">金钱，他的钱包像瀑布一样流出钱币，</tspan>
    <tspan x="50" dy="25">这就是"spending"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government has increased its spending on education.
  </text>
  <text x="50" y="310" class="content">
    政府增加了在教育上的支出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wallet -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Money falling -->
    <line x1="75" y1="100" x2="75" y2="200" class="image" />
    <line x1="50" y1="120" x2="50" y2="220" class="image" />
    <line x1="100" y1="120" x2="100" y2="220" class="image" />
    <line x1="25" y1="140" x2="25" y2="240" class="image" />
    <line x1="125" y1="140" x2="125" y2="240" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>