<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ice { fill: #AED6F1; }
      .penguin { fill: #000; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Antarctic</text>
  <text x="50" y="120" class="subtitle">[ænˈtɑːrktɪk] adj. 南极的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (相反) + arctic (北极)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个与北极(arctic)相反的地方，那里是冰天雪地，
    <tspan x="50" dy="25">企鹅在冰面上滑行，这就是南极(Antarctic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Antarctic is known for its extreme cold and unique wildlife.
  </text>
  <text x="50" y="310" class="content">
    南极以其极端的寒冷和独特的野生动物而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Iceberg -->
    <rect x="0" y="0" width="350" height="200" class="ice" />
    <!-- Penguin -->
    <circle cx="100" cy="100" r="20" class="penguin" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="70" y2="130" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
  </g>
</svg>