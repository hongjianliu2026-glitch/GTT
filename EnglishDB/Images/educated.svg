<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">educated</text>
  <text x="50" y="120" class="subtitle">[ˈedʒəˌkeɪtɪd] adj. 受过教育的，有教养的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + duc (引导) + -ate (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从书本中"引导出(e-duc)"知识，
    <tspan x="50" dy="25">变得有教养(educated)，就像书本中的智慧被释放出来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is an educated woman with a deep understanding of history.
  </text>
  <text x="50" y="310" class="content">
    她是一位受过良好教育、对历史有深刻理解的女性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="140" x2="180" y2="140" class="image" />
    <line x1="20" y1="180" x2="180" y2="180" class="image" />
    <line x1="20" y1="220" x2="180" y2="220" class="image" />
    <line x1="20" y1="260" x2="180" y2="260" class="image" />
    <!-- Light bulb -->
    <circle cx="100" cy="350" r="30" class="image" />
    <line x1="100" y1="380" x2="100" y2="450" class="image" />
    <line x1="100" y1="450" x2="70" y2="500" class="image" />
    <line x1="100" y1="450" x2="130" y2="500" class="image" />
  </g>
</svg>