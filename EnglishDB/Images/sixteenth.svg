<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sixteenth</text>
  <text x="50" y="120" class="subtitle">[ˌsɪksˈtiːnθ] n. 第十六；adj. 第十六的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> six (六) + teen (十) + th (第...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕，上面插着16根蜡烛，每根蜡烛都代表一个"第十六(sixteenth)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was born on the sixteenth of June.
  </text>
  <text x="50" y="310" class="content">
    她出生于6月16日。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cake -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Candles -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <line x1="200" y1="20" x2="200" y2="100" class="image" />
    <line x1="250" y1="20" x2="250" y2="100" class="image" />
    <line x1="300" y1="20" x2="300" y2="100" class="image" />
    <line x1="350" y1="20" x2="350" y2="100" class="image" />
    <line x1="400" y1="20" x2="400" y2="100" class="image" />
    <line x1="450" y1="20" x2="450" y2="100" class="image" />
    <line x1="500" y1="20" x2="500" y2="100" class="image" />
    <line x1="550" y1="20" x2="550" y2="100" class="image" />
    <line x1="600" y1="20" x2="600" y2="100" class="image" />
    <line x1="650" y1="20" x2="650" y2="100" class="image" />
    <line x1="700" y1="20" x2="700" y2="100" class="image" />
    <line x1="750" y1="20" x2="750" y2="100" class="image" />
    <line x1="800" y1="20" x2="800" y2="100" class="image" />
  </g>
</svg>