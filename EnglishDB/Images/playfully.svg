<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">playfully</text>
  <text x="50" y="120" class="subtitle">[ˈpleɪfəli] adv. 开玩笑地，嬉戏地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> play (玩耍) + -ful (充满) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群孩子在公园里，"充满玩耍(play-ful)"
    <tspan x="50" dy="25">的氛围中嬉戏，他们的笑声充满了整个公园。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She greeted him playfully with a wink.
  </text>
  <text x="50" y="310" class="content">
    她调皮地向他眨眼打招呼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Park -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Children playing -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Playful actions -->
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <line x1="100" y1="140" x2="150" y2="140" class="image" />
    <!-- Playful expressions -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="100" cy="90" r="5" class="image" />
    <circle cx="150" cy="90" r="5" class="image" />
    <line x1="50" y1="110" x2="50" y2="115" class="image" />
    <line x1="100" y1="110" x2="100" y2="115" class="image" />
    <line x1="150" y1="110" x2="150" y2="115" class="image" />
  </g>
</svg>