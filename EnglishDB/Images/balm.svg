<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">balm</text>
  <text x="50" y="120" class="subtitle">[bɑːm] n. 香油，药膏；安慰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> balsam (香油，药膏)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个受伤的战士，伤口上涂抹着"香油(balm)"，
    <tspan x="50" dy="25">瞬间疼痛减轻，心灵也得到了安慰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The balm of Gilead helped heal his wounds.
  </text>
  <text x="50" y="310" class="content">
    基列的香膏帮助治愈了他的伤口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wounded warrior -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Wound -->
    <rect x="30" y="120" width="40" height="20" class="image" />
    <!-- Balm application -->
    <circle cx="50" cy="130" r="10" class="image" fill="#F1C40F" />
    <text x="40" y="140" class="content" fill="#F1C40F">balm</text>
  </g>
</svg>