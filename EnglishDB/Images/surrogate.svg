<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surrogate</text>
  <text x="50" y="120" class="subtitle">[ˈsʌrəɡət] n. 替代者，代理人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (在上面) + rog (要求) + -ate (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在另一个人上面，"要求(rog)"
    <tspan x="50" dy="25">替代他完成任务，这个人就是替代者(surrogate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She acted as a surrogate mother for her sister's child.
  </text>
  <text x="50" y="310" class="content">
    她为姐姐的孩子担任了代孕母亲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person on top -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="80" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />

    <!-- Person below -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />

    <!-- Arrow pointing down -->
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <polygon points="95,100 105,100 100,110" class="image" />
  </g>
</svg>