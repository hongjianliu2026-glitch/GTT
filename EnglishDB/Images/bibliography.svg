<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bibliography</text>
  <text x="50" y="120" class="subtitle">[ˌbɪbliˈɒɡrəfi] n. 书目，参考书目</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> biblio- (书) + graphy (写)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学者在书堆中，"写下(graphy)"
    <tspan x="50" dy="25">关于书籍(biblio)的列表，这就是书目(bibliography)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bibliography at the end of the paper lists all the sources used.
  </text>
  <text x="50" y="310" class="content">
    论文末尾的参考书目列出了所有使用的来源。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Books -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="110" y="0" width="100" height="150" class="image" />
    <rect x="220" y="0" width="100" height="150" class="image" />
    <!-- Scholar -->
    <circle cx="50" cy="200" r="20" class="image" />
    <line x1="50" y1="220" x2="50" y2="260" class="image" />
    <line x1="50" y1="260" x2="30" y2="300" class="image" />
    <line x1="50" y1="260" x2="70" y2="300" class="image" />
    <line x1="50" y1="240" x2="90" y2="230" class="image" />
    <!-- Writing -->
    <line x1="150" y1="200" x2="250" y2="200" class="image" />
    <line x1="150" y1="230" x2="250" y2="230" class="image" />
    <line x1="150" y1="260" x2="250" y2="260" class="image" />
  </g>
</svg>