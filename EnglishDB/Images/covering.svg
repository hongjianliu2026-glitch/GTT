<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">covering</text>
  <text x="50" y="120" class="subtitle">[ˈkʌvərɪŋ] n. 覆盖物，封面；v. 覆盖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cover (覆盖) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的毯子"覆盖(cover)"住了一座房子，
    <tspan x="50" dy="25">这个毯子就是房子的"覆盖物(covering)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The book had a beautiful leather covering.
  </text>
  <text x="50" y="310" class="content">
    这本书有一个漂亮的皮革封面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="50" y="100" width="100" height="50" class="image" />
    <!-- Covering blanket -->
    <rect x="0" y="0" width="200" height="150" class="image" fill="#D3D3D3" />
    <!-- Covering blanket folds -->
    <line x1="0" y1="0" x2="200" y2="150" class="image" />
    <line x1="0" y1="150" x2="200" y2="0" class="image" />
  </g>
</svg>