<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">idealistic</text>
  <text x="50" y="120" class="subtitle">[ˌaɪdiəˈlɪstɪk] adj. 理想主义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> idea (思想) + -al (形容词后缀) + -istic (表示“关于...的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个理想主义者，他头上顶着一个巨大的"思想(idea)"气球，
    <tspan x="50" dy="25">气球上写着“世界和平”，他坚信这个理想终将实现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is an idealistic person who believes in a perfect world.
  </text>
  <text x="50" y="310" class="content">
    她是一个理想主义者，相信世界会变得完美。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Idea balloon -->
    <path d="M 50 50 Q 150 20 250 50 Q 350 80 250 110 Q 150 140 50 110 Z" class="image" />
    <text x="120" y="80" class="content" fill="#2C3E50">世界和平</text>
  </g>
</svg>