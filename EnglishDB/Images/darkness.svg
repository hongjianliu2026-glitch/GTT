<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #2C3E50; }
      .subtitle { font: italic 24px serif; fill: #7F8C8D; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .dark { fill: #000000; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">darkness</text>
  <text x="50" y="120" class="subtitle">[ˈdɑːrknəs] n. 黑暗，阴暗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dark (黑暗) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚，"黑暗(dark)"笼罩着整个世界，
    <tspan x="50" dy="25">没有一丝光亮，这就是"黑暗(darkness)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was filled with darkness after the power went out.
  </text>
  <text x="50" y="310" class="content">
    停电后，房间里充满了黑暗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="dark" />
    <!-- Moon -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="30" r="3" class="image" />
    <circle cx="120" cy="60" r="3" class="image" />
    <circle cx="150" cy="40" r="3" class="image" />
    <circle cx="180" cy="70" r="3" class="image" />
    <circle cx="200" cy="50" r="3" class="image" />
    <!-- Trees -->
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="260" y1="100" x2="260" y2="150" class="image" />
    <line x1="270" y1="100" x2="270" y2="150" class="image" />
    <line x1="280" y1="100" x2="280" y2="150" class="image" />
    <line x1="290" y1="100" x2="290" y2="150" class="image" />
  </g>
</svg>