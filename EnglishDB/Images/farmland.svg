<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">farmland</text>
  <text x="50" y="120" class="subtitle">[ˈfɑːrmˌlænd] n. 农田</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> farm (农场) + land (土地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的农田(farmland)，
    <tspan x="50" dy="25">农民们在土地(land)上辛勤耕作，种植各种农作物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmland was covered with golden wheat.
  </text>
  <text x="50" y="310" class="content">
    农田上覆盖着金黄的小麦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Farmland -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fields -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="170" y="20" width="100" height="160" class="image" />
    <rect x="290" y="20" width="50" height="160" class="image" />
    <!-- Farmer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Crops -->
    <line x1="70" y1="50" x2="70" y2="150" class="image" />
    <line x1="90" y1="50" x2="90" y2="150" class="image" />
    <line x1="110" y1="50" x2="110" y2="150" class="image" />
    <line x1="190" y1="50" x2="190" y2="150" class="image" />
    <line x1="210" y1="50" x2="210" y2="150" class="image" />
    <line x1="230" y1="50" x2="230" y2="150" class="image" />
    <line x1="310" y1="50" x2="310" y2="150" class="image" />
    <line x1="330" y1="50" x2="330" y2="150" class="image" />
  </g>
</svg>