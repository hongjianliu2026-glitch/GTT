<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">import</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpɔːrt] v. 进口，输入；n. 进口商品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + port (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的集装箱船，"携带(port)"着各种商品，
    <tspan x="50" dy="25">从海外"进入(im-)"我们的国家，这就是进口(import)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company imports coffee beans from Brazil.
  </text>
  <text x="50" y="310" class="content">
    这家公司从巴西进口咖啡豆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Container ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Container -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <rect x="170" y="20" width="100" height="80" class="image" />
    <rect x="290" y="20" width="100" height="80" class="image" />
    <!-- Waves -->
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
    <!-- Ship -->
    <rect x="120" y="50" width="100" height="50" class="image" />
    <line x1="120" y1="100" x2="220" y2="100" class="image" />
    <line x1="140" y1="100" x2="140" y2="150" class="image" />
    <line x1="180" y1="100" x2="180" y2="150" class="image" />
    <line x1="220" y1="100" x2="220" y2="150" class="image" />
  </g>
</svg>