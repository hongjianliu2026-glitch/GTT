<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">receptive</text>
  <text x="50" y="120" class="subtitle">[rɪˈseptɪv] adj. 接受的，接纳的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + cept (拿) + ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人张开双臂，"再次接纳(re-cept-ive)"
    <tspan x="50" dy="25">所有的信息和情感，就像一个开放的容器。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is very receptive to new ideas.
  </text>
  <text x="50" y="310" class="content">
    她对新想法非常开放。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Open arms -->
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <!-- Head -->
    <circle cx="100" cy="80" r="20" class="image" />
    <!-- Body -->
    <line x1="100" y1="100" x2="100" y2="180" class="image" />
    <!-- Container -->
    <rect x="50" y="200" width="100" height="50" class="image" />
    <text x="75" y="230" class="content">信息</text>
  </g>
</svg>