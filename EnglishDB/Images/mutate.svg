<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mutate</text>
  <text x="50" y="120" class="subtitle">[mjuːˈteɪt] v. 变异，突变</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mut (改变) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个细胞在分裂时，"改变(mut)"
    <tspan x="50" dy="25">自身形态，突然变成了一个完全不同的生物(mutate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The virus mutated and became more dangerous.
  </text>
  <text x="50" y="310" class="content">
    病毒变异后变得更加危险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Original cell -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Mutated cell -->
    <circle cx="200" cy="100" r="40" class="image" />
    <line x1="200" y1="60" x2="200" y2="140" class="image" />
    <line x1="160" y1="100" x2="240" y2="100" class="image" />
    <!-- Arrow -->
    <line x1="80" y1="100" x2="170" y2="100" class="image" />
    <polygon points="170,90 180,100 170,110" class="image" />
  </g>
</svg>