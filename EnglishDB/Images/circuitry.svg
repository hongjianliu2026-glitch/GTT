<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">circuitry</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrkɪtri] n. 电路，线路</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> circu- (环) + -it (走) + -ry (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个电子迷宫，"环形路径(circu-it)"
    <tspan x="50" dy="25">上的电流在不停地"走(it)"，这就是电路(circuitry)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The circuitry in the device is very complex.
  </text>
  <text x="50" y="310" class="content">
    这个设备的电路非常复杂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circuit board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Circuit paths -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Circuit components -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="250" cy="140" r="10" class="image" />
    <!-- Current flow -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="150" y1="80" x2="200" y2="110" class="image" />
    <line x1="250" y1="140" x2="300" y2="140" class="image" />
  </g>
</svg>