<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resurgence</text>
  <text x="50" y="120" class="subtitle">[rɪˈsɜːrdʒəns] n. 复苏，复兴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + sur- (上升) + gence (出现)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个沉睡的火山突然"再次上升(re-sur-gence)"，
    <tspan x="50" dy="25">喷发出炽热的岩浆，象征着复苏和复兴(resurgence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The resurgence of interest in classical music was remarkable.
  </text>
  <text x="50" y="310" class="content">
    对古典音乐兴趣的复苏是显著的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Volcano -->
    <polygon points="0,200 100,0 200,200" class="image" />
    <!-- Lava -->
    <path d="M 100 200 Q 150 150 200 200" class="image" stroke-width="4" stroke="#E74C3C" />
    <path d="M 100 200 Q 125 175 150 200" class="image" stroke-width="4" stroke="#E74C3C" />
    <path d="M 100 200 Q 112.5 187.5 125 200" class="image" stroke-width="4" stroke="#E74C3C" />
    <!-- Smoke -->
    <circle cx="100" cy="50" r="20" class="image" fill="#7F8C8D" />
    <circle cx="120" cy="30" r="15" class="image" fill="#7F8C8D" />
    <circle cx="80" cy="30" r="15" class="image" fill="#7F8C8D" />
  </g>
</svg>