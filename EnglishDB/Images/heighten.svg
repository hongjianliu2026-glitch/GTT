<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heighten</text>
  <text x="50" y="120" class="subtitle">[ˈhaɪtn] v. 提高，增强</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> height (高度) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在梯子上，"使(en)"
    <tspan x="50" dy="25">自己的高度(height)增加，从而"提高(heighten)"了视野。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The music heightens the atmosphere of the party.
  </text>
  <text x="50" y="310" class="content">
    音乐增强了派对的气氛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ladder -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="100" y2="150" class="image" />
    <line x1="50" y1="150" x2="100" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="0" class="image" />
    <!-- Person on ladder -->
    <circle cx="75" cy="150" r="15" class="image" />
    <line x1="75" y1="165" x2="75" y2="200" class="image" />
    <line x1="75" y1="200" x2="50" y2="230" class="image" />
    <line x1="75" y1="200" x2="100" y2="230" class="image" />
    <line x1="75" y1="180" x2="125" y2="170" class="image" />
  </g>
</svg>