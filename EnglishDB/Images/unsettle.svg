<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unsettle</text>
  <text x="50" y="120" class="subtitle">[ʌnˈsɛtl] v. 使不安，使动摇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + settle (安定)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人原本平静地坐在椅子上，突然椅子"不安定(un-settle)"，
    <tspan x="50" dy="25">导致他失去平衡，感到不安(unsettle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news unsettled her, making her feel anxious.
  </text>
  <text x="50" y="310" class="content">
    这个消息让她感到不安，使她感到焦虑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="75" y1="100" x2="75" y2="150" class="image" />
    <line x1="0" y1="150" x2="150" y2="150" class="image" />
    <!-- Person -->
    <circle cx="75" cy="70" r="15" class="image" />
    <line x1="75" y1="85" x2="75" y2="120" class="image" />
    <line x1="75" y1="120" x2="60" y2="150" class="image" />
    <line x1="75" y1="120" x2="90" y2="150" class="image" />
    <!-- Unsettling effect -->
    <line x1="0" y1="150" x2="150" y2="150" class="image" stroke-dasharray="5,5" />
    <line x1="75" y1="150" x2="75" y2="170" class="image" stroke-dasharray="5,5" />
  </g>
</svg>