<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abusive</text>
  <text x="50" y="120" class="subtitle">[əˈbjuːsɪv] adj. 辱骂的，滥用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + us (使用) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一个工具，"离开正常使用(ab-us-ive)"
    <tspan x="50" dy="25">的方式，变成了辱骂或滥用的行为。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His abusive language shocked everyone.
  </text>
  <text x="50" y="310" class="content">
    他辱骂的语言震惊了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with tool -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Tool -->
    <rect x="60" y="90" width="30" height="60" class="image" />
    <!-- Speech bubble -->
    <path d="M 100 80 Q 150 80 150 120 Q 150 160 100 160 Q 50 160 50 120 Q 50 80 100 80 Z" class="image" />
    <text x="105" y="115" class="content" style="font-size: 14px;">"You idiot!"</text>
  </g>
</svg>