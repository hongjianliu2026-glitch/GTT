<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sensitive</text>
  <text x="50" y="120" class="subtitle">[ˈsɛnsɪtɪv] adj. 敏感的，灵敏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sens (感觉) + -itive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人对周围的一切都"感觉(sens)"
    <tspan x="50" dy="25">非常敏锐，甚至能感受到微风中的花香，</tspan>
    <tspan x="50" dy="25">这就是"敏感的(sensitive)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is very sensitive to the cold weather.
  </text>
  <text x="50" y="310" class="content">
    她对寒冷的天气非常敏感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="130" class="image" />
    <!-- Sensitivity -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <!-- Flower -->
    <circle cx="250" cy="100" r="10" class="image" />
    <line x1="250" y1="110" x2="250" y2="130" class="image" />
    <line x1="240" y1="120" x2="260" y2="120" class="image" />
    <line x1="245" y1="115" x2="255" y2="125" class="image" />
    <line x1="245" y1="125" x2="255" y2="115" class="image" />
  </g>
</svg>