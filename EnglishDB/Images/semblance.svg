<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">semblance</text>
  <text x="50" y="120" class="subtitle">[ˈsɛmləns] n. 外表，相似</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sem- (相似) + blance (平衡)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人站在镜子前，"相似(sem-)"
    <tspan x="50" dy="25">的外表(semblance)让他们看起来像双胞胎。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The twins had a striking semblance.
  </text>
  <text x="50" y="310" class="content">
    这对双胞胎有着惊人的相似之处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two people -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Arms and legs -->
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="80" y1="150" x2="120" y2="150" class="image" />
    <line x1="230" y1="150" x2="270" y2="150" class="image" />
    <line x1="100" y1="180" x2="80" y2="200" class="image" />
    <line x1="100" y1="180" x2="120" y2="200" class="image" />
    <line x1="250" y1="180" x2="230" y2="200" class="image" />
    <line x1="250" y1="180" x2="270" y2="200" class="image" />
  </g>
</svg>