<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accurate</text>
  <text x="50" y="120" class="subtitle">[ˈækjərət] adj. 准确的，精确的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (朝向) + cur (关心) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个射手，"朝向(ac-)"目标"关心(cur)"
    <tspan x="50" dy="25">每一个细节，确保每一箭都"准确(accurate)"命中靶心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The report was accurate and detailed.
  </text>
  <text x="50" y="310" class="content">
    这份报告准确且详细。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Target -->
    <circle cx="200" cy="150" r="100" class="image" />
    <circle cx="200" cy="150" r="70" class="image" />
    <circle cx="200" cy="150" r="40" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="150" x2="190" y2="150" class="image" />
    <polygon points="40,150 50,140 50,160" class="image" />
    <!-- Shooter -->
    <circle cx="30" cy="150" r="15" class="image" />
    <line x1="30" y1="165" x2="30" y2="200" class="image" />
    <line x1="30" y1="200" x2="10" y2="230" class="image" />
    <line x1="30" y1="200" x2="50" y2="230" class="image" />
    <line x1="30" y1="180" x2="60" y2="170" class="image" />
  </g>
</svg>