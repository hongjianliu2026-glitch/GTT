<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mesmerize</text>
  <text x="50" y="120" class="subtitle">[ˈmɛzməraɪz] v. 迷住，迷惑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mesm (迷住) + -erize (使...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师用他的魔力"迷住(mesm)"
    <tspan x="50" dy="25">观众，让他们完全沉浸在他的表演中，无法自拔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's performance mesmerized the entire audience.
  </text>
  <text x="50" y="310" class="content">
    魔术师的表演迷住了所有观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Audience -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Magic effect -->
    <line x1="50" y1="130" x2="150" y2="100" class="image" />
    <line x1="50" y1="130" x2="200" y2="100" class="image" />
    <line x1="50" y1="130" x2="250" y2="100" class="image" />
  </g>
</svg>