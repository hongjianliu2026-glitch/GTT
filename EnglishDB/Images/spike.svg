<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spike</text>
  <text x="50" y="120" class="subtitle">[spaɪk] n. 尖刺，长钉；v. 用尖刺刺穿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spik (尖锐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的尖刺(spike)从地面突然冒出，
    <tspan x="50" dy="25">刺穿了一只不幸的鞋子，这个画面让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gardener used a spike to secure the fence.
  </text>
  <text x="50" y="310" class="content">
    园丁用尖刺固定了篱笆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Spike -->
    <line x1="175" y1="150" x2="175" y2="20" class="image" />
    <!-- Shoe -->
    <rect x="150" y="150" width="50" height="20" class="image" />
    <line x1="150" y1="170" x2="200" y2="170" class="image" />
    <line x1="150" y1="150" x2="150" y2="170" class="image" />
    <line x1="200" y1="150" x2="200" y2="170" class="image" />
  </g>
</svg>