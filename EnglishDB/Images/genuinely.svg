<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">genuinely</text>
  <text x="50" y="120" class="subtitle">[ˈdʒenjuɪnli] adv. 真诚地，真正地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> genu- (出生，起源) + -ine (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从内心深处"出生(genu-)"，
    <tspan x="50" dy="25">表达出真诚的情感，这种情感是"真正地(genuinely)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke genuinely about her experiences.
  </text>
  <text x="50" y="310" class="content">
    她真诚地谈到了她的经历。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 40 C10 10, 40 10, 40 40 S70 70, 40 100 S10 70, 10 40" class="image" />
    <!-- Arrow -->
    <line x1="40" y1="100" x2="40" y2="150" class="image" />
    <polygon points="35,145 40,150 45,145 40,140" class="image" />
    <!-- Text -->
    <text x="20" y="180" class="content">真诚</text>
  </g>
</svg>