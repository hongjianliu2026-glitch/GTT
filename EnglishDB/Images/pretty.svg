<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pretty</text>
  <text x="50" y="120" class="subtitle">[ˈprɪti] adj. 漂亮的，可爱的；adv. 相当，颇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小女孩站在镜子前，"在前面(pre-)"
    <tspan x="50" dy="25">看到自己小小的(et)脸庞，觉得自己很漂亮(pretty)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked pretty in her new dress.
  </text>
  <text x="50" y="310" class="content">
    她穿着新裙子看起来很漂亮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Girl -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
    <line x1="100" y1="150" x2="50" y2="140" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <!-- Dress -->
    <rect x="80" y="130" width="40" height="50" class="image" />
    <!-- Mirror reflection -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="220" y2="220" class="image" />
    <line x1="250" y1="180" x2="280" y2="220" class="image" />
    <line x1="250" y1="150" x2="200" y2="140" class="image" />
    <line x1="250" y1="150" x2="300" y2="140" class="image" />
    <rect x="230" y="130" width="40" height="50" class="image" />
  </g>
</svg>