<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F57F17; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .waffle { fill: #FFEB3B; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">waffle</text>
  <text x="50" y="120" class="subtitle">[ˈwɒfl] n. 华夫饼；v. 胡扯，闲聊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> waffle (源自荷兰语 wafel，意为“华夫饼”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的华夫饼(waffle)，上面布满了格子，
    <tspan x="50" dy="25">每个格子里都装满了胡扯(waffle)的故事，让人眼花缭乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent the morning waffling about her vacation plans.
  </text>
  <text x="50" y="310" class="content">
    她整个上午都在闲聊她的度假计划。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Waffle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="waffle" />
    <line x1="70" y1="40" x2="300" y2="40" class="image" />
    <line x1="70" y1="80" x2="300" y2="80" class="image" />
    <line x1="70" y1="120" x2="300" y2="120" class="image" />
    <line x1="70" y1="160" x2="300" y2="160" class="image" />
    <line x1="90" y1="20" x2="90" y2="180" class="image" />
    <line x1="130" y1="20" x2="130" y2="180" class="image" />
    <line x1="170" y1="20" x2="170" y2="180" class="image" />
    <line x1="210" y1="20" x2="210" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
  </g>
</svg>