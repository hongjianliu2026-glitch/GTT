<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hydroelectric</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪdrəʊɪˈlektrɪk] adj. 水力发电的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hydro- (水) + electric (电)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的河流，"水(hydro)"流推动涡轮机，
    <tspan x="50" dy="25">产生"电(electric)"，点亮整个城市。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dam was built to generate hydroelectric power.
  </text>
  <text x="50" y="310" class="content">
    这座大坝是为了发电而建造的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Turbine -->
    <circle cx="150" cy="120" r="20" class="image" />
    <line x1="150" y1="100" x2="150" y2="140" class="image" />
    <line x1="130" y1="120" x2="170" y2="120" class="image" />
    <!-- City -->
    <rect x="250" y="50" width="50" height="100" class="image" />
    <rect x="270" y="70" width="10" height="80" class="image" />
    <rect x="290" y="60" width="10" height="90" class="image" />
    <!-- Lightning bolt -->
    <line x1="150" y1="120" x2="270" y2="100" class="image" />
    <line x1="270" y1="100" x2="150" y2="140" class="image" />
  </g>
</svg>