<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indecent</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdiːsnt] adj. 不合适的，下流的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + decent (合适的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着"不合适(in-decent)"的衣服，
    <tspan x="50" dy="25">衣服破烂不堪，露出太多，让人感到不适。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His indecent remarks made everyone uncomfortable.
  </text>
  <text x="50" y="310" class="content">
    他下流的言论让每个人都感到不舒服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with indecent clothes -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <!-- Torn clothes -->
    <line x1="30" y1="90" x2="70" y2="90" class="image" />
    <line x1="30" y1="110" x2="70" y2="110" class="image" />
    <line x1="30" y1="130" x2="70" y2="130" class="image" />
    <!-- Exposed parts -->
    <circle cx="50" cy="100" r="10" class="image" />
    <line x1="40" y1="120" x2="60" y2="120" class="image" />
  </g>
</svg>