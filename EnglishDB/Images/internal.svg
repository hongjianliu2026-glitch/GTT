<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">internal</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɜːrnl] adj. 内部的，内在的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + nal (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的心脏，"在(inter-)"
    <tspan x="50" dy="25">心脏的"内部(internal)"，血液在流动，</tspan>
    <tspan x="50" dy="25">这就是internal的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor recommended an internal examination.
  </text>
  <text x="50" y="310" class="content">
    医生建议进行内部检查。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 100 C10 10, 90 10, 90 100 S170 190, 90 190 S10 190, 10 100" class="image" />
    <!-- Blood flow -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="70" y2="100" class="image" />
    <line x1="70" y1="100" x2="90" y2="100" class="image" />
    <line x1="90" y1="100" x2="90" y2="150" class="image" />
    <line x1="90" y1="150" x2="110" y2="150" class="image" />
    <line x1="110" y1="150" x2="110" y2="100" class="image" />
    <line x1="110" y1="100" x2="130" y2="100" class="image" />
    <line x1="130" y1="100" x2="130" y2="150" class="image" />
    <line x1="130" y1="150" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="170" y2="100" class="image" />
  </g>
</svg>