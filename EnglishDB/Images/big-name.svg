<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">big-name</text>
  <text x="50" y="120" class="subtitle">[ˈbɪɡ neɪm] n. 知名人士，大牌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> big (大的) + name (名字)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的名字(big-name)悬挂在城市的天际线上，
    <tspan x="50" dy="25">这个名字的主人是一个家喻户晓的知名人士。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event attracted several big-name celebrities.
  </text>
  <text x="50" y="310" class="content">
    这个活动吸引了好几位大牌名人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Big name -->
    <text x="100" y="100" font-size="60" font-weight="bold" fill="#E74C3C">BIG</text>
    <text x="100" y="160" font-size="60" font-weight="bold" fill="#E74C3C">NAME</text>
    <!-- City buildings -->
    <rect x="50" y="180" width="30" height="20" class="image" />
    <rect x="100" y="160" width="30" height="40" class="image" />
    <rect x="150" y="170" width="30" height="30" class="image" />
    <rect x="200" y="150" width="30" height="50" class="image" />
    <rect x="250" y="190" width="30" height="10" class="image" />
  </g>
</svg>