<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">two-fold</text>
  <text x="50" y="120" class="subtitle">[tuː fəʊld] adj. 两倍的，双重的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> two (二) + fold (倍)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的剪刀，"剪开(fold)"
    <tspan x="50" dy="25">一个物体，使其变成两倍(two-fold)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The benefits of this new technology are two-fold.
  </text>
  <text x="50" y="310" class="content">
    这项新技术的优势是双重的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scissors -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <!-- Folded object -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <rect x="200" y="100" width="100" height="50" class="image" />
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
  </g>
</svg>