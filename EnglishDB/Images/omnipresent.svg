<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">omnipresent</text>
  <text x="50" y="120" class="subtitle">[ˌɑːmnɪˈpreznt] adj. 无所不在的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> omni- (全部) + present (存在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的眼睛，"无处不在(omni-present)"
    <tspan x="50" dy="25">地监视着整个世界，无论你走到哪里，它都能看到你。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sun is omnipresent, illuminating every corner of the earth.
  </text>
  <text x="50" y="310" class="content">
    太阳无所不在，照亮地球的每一个角落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="20" class="image" fill="#2C3E50" />
    <!-- World -->
    <circle cx="300" cy="100" r="80" class="image" />
    <!-- Lines connecting eye to world -->
    <line x1="150" y1="100" x2="220" y2="100" class="image" />
    <line x1="150" y1="100" x2="220" y2="150" class="image" />
    <line x1="150" y1="100" x2="220" y2="50" class="image" />
  </g>
</svg>