<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bank</text>
  <text x="50" y="120" class="subtitle">[bæŋk] n. 银行，河岸；v. 堆积，筑堤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> banc (长凳)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的银行，最初是"长凳(banc)"上
    <tspan x="50" dy="25">的商人进行交易，后来发展成了现代的银行(bank)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He deposited his money in the bank.
  </text>
  <text x="50" y="310" class="content">
    他把钱存进了银行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bank building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bank sign -->
    <text x="50" y="50" class="image" style="font: bold 36px sans-serif; fill: #2C3E50;">BANK</text>
    <!-- Money bag -->
    <rect x="250" y="100" width="50" height="50" class="image" />
    <line x1="250" y1="100" x2="300" y2="100" class="image" />
    <line x1="250" y1="150" x2="300" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="300" y1="100" x2="300" y2="150" class="image" />
    <!-- Coins -->
    <circle cx="275" cy="125" r="10" class="image" />
    <circle cx="265" cy="115" r="8" class="image" />
    <circle cx="285" cy="135" r="6" class="image" />
  </g>
</svg>