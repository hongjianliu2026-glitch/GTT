<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">epilepsy</text>
  <text x="50" y="120" class="subtitle">[ˈɛpɪˌlɛpsi] n. 癫痫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> epi- (在...之上) + leps (抓住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然被"抓住(leps)"，身体不受控制地抽搐，
    <tspan x="50" dy="25">这种"在...之上(epi-)"的异常状态就是癫痫(epilepsy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was diagnosed with epilepsy at the age of 10.
  </text>
  <text x="50" y="310" class="content">
    他在10岁时被诊断出患有癫痫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person being "grabbed" -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />
    <!-- Lightning bolt symbolizing seizure -->
    <polyline points="100,100 150,150 100,200" class="image" />
    <polyline points="100,100 50,150 100,200" class="image" />
  </g>
</svg>