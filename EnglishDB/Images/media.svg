<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">media</text>
  <text x="50" y="120" class="subtitle">[ˈmiːdiə] n. 媒体，媒介</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> medius (中间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的信息网络，"中间(medius)"
    <tspan x="50" dy="25">传递着各种声音和图像，这就是媒体(media)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The media played a crucial role in the election.
  </text>
  <text x="50" y="310" class="content">
    媒体在选举中扮演了关键角色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Network of media -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="150" y1="50" x2="100" y2="100" class="image" />
    <!-- Media symbols -->
    <rect x="200" y="30" width="40" height="40" class="image" />
    <rect x="250" y="30" width="40" height="40" class="image" />
    <rect x="225" y="80" width="40" height="40" class="image" />
    <line x1="220" y1="50" x2="270" y2="50" class="image" />
    <line x1="220" y1="50" x2="245" y2="100" class="image" />
    <line x1="270" y1="50" x2="245" y2="100" class="image" />
  </g>
</svg>