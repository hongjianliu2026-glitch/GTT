<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flask</text>
  <text x="50" y="120" class="subtitle">[flæsk] n. 烧瓶，小瓶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fl- (流动) + ask (容器)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"流动的(fl-)"
    <tspan x="50" dy="25">液体被装在一个小容器(ask)里，这个容器就是烧瓶(flask)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chemist carefully poured the liquid into the flask.
  </text>
  <text x="50" y="310" class="content">
    化学家小心地将液体倒入烧瓶中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flask -->
    <path d="M50 50 L100 50 L100 150 L50 150 Z" class="image" />
    <!-- Liquid -->
    <path d="M55 145 L95 145 L95 100 L55 100 Z" class="image" fill="#3498DB" />
    <!-- Scientist -->
    <circle cx="75" cy="170" r="15" class="image" />
    <line x1="75" y1="185" x2="75" y2="220" class="image" />
    <line x1="75" y1="220" x2="60" y2="250" class="image" />
    <line x1="75" y1="220" x2="90" y2="250" class="image" />
    <line x1="75" y1="200" x2="100" y2="190" class="image" />
  </g>
</svg>