<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trash</text>
  <text x="50" y="120" class="subtitle">[træʃ] n. 垃圾，废物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tr- (表示“三”) + ash (灰烬)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的垃圾堆，"三堆灰烬(tr-ash)"
    <tspan x="50" dy="25">堆在一起，形成了令人印象深刻的垃圾山(trash)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't forget to take out the trash.
  </text>
  <text x="50" y="310" class="content">
    别忘了把垃圾拿出去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trash pile -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trash bags -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <rect x="170" y="20" width="100" height="100" class="image" />
    <rect x="290" y="20" width="100" height="100" class="image" />
    <!-- Trash can -->
    <rect x="170" y="140" width="100" height="60" class="image" />
    <!-- Trash inside -->
    <line x1="180" y1="150" x2="260" y2="150" class="image" />
    <line x1="180" y1="160" x2="260" y2="160" class="image" />
    <line x1="180" y1="170" x2="260" y2="170" class="image" />
  </g>
</svg>