<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">earthly</text>
  <text x="50" y="120" class="subtitle">[ˈɜːrθli] adj. 地球的，世俗的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> earth (地球) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，上面标注着各种"地球(earth)"上的事物，
    <tspan x="50" dy="25">这些事物都是"世俗的(earthly)"，与地球紧密相关。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The astronauts missed the earthly comforts of home.
  </text>
  <text x="50" y="310" class="content">
    宇航员们想念地球上的家的舒适。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Landmarks -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <circle cx="130" cy="70" r="10" class="image" />
    <circle cx="220" cy="70" r="10" class="image" />
    <circle cx="175" cy="130" r="10" class="image" />
    <!-- Earthly objects -->
    <rect x="50" y="200" width="50" height="50" class="image" />
    <rect x="150" y="200" width="50" height="50" class="image" />
    <rect x="250" y="200" width="50" height="50" class="image" />
    <!-- Labels -->
    <text x="50" y="270" class="content">房子</text>
    <text x="150" y="270" class="content">汽车</text>
    <text x="250" y="270" class="content">树木</text>
  </g>
</svg>