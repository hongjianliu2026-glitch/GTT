<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inventive</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvɛntɪv] adj. 有创造力的，发明的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vent (来) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个发明家，"进入(in-)"
    <tspan x="50" dy="25">一个全新的世界，带来(vent)了</tspan>
    <tspan x="50" dy="25">许多新奇的想法和发明，</tspan>
    <tspan x="50" dy="25">这就是有创造力的(inventive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> His inventive mind led to many groundbreaking inventions.
  </text>
  <text x="50" y="330" class="content">
    他富有创造力的头脑带来了许多突破性的发明。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lightbulb -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="180" class="image" />
    <line x1="100" y1="180" x2="150" y2="180" class="image" />
    <!-- Brain -->
    <circle cx="250" cy="100" r="50" class="image" />
    <line x1="250" y1="150" x2="250" y2="250" class="image" />
    <line x1="250" y1="250" x2="220" y2="300" class="image" />
    <line x1="250" y1="250" x2="280" y2="300" class="image" />
    <line x1="250" y1="180" x2="200" y2="180" class="image" />
    <line x1="250" y1="180" x2="300" y2="180" class="image" />
    <!-- Connection -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
  </g>
</svg>