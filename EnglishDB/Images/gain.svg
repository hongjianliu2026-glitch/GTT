<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gain</text>
  <text x="50" y="120" class="subtitle">[ɡeɪn] v. 获得，赢得；n. 收益，利润</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> g(e)- (向外) + -ain (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从地上"向外拿(g(e)-ain)"起一块金子，
    <tspan x="50" dy="25">象征着获得财富和收益(gain)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gained a lot of experience from the project.
  </text>
  <text x="50" y="310" class="content">
    他从项目中获得了丰富的经验。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Gold -->
    <circle cx="100" cy="140" r="20" class="image" fill="#FFD700" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Hand reaching for gold -->
    <line x1="200" y1="115" x2="100" y2="140" class="image" />
  </g>
</svg>