<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">newlywed</text>
  <text x="50" y="120" class="subtitle">[ˈnuːlɪwɛd] n. 新婚夫妇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> new (新的) + -ly (副词后缀) + wed (结婚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一对新婚夫妇，脸上洋溢着幸福的笑容，
    <tspan x="50" dy="25">他们刚刚步入婚姻的殿堂，"新婚(newlywed)"的喜悦溢于言表。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The newlyweds are planning a romantic honeymoon.
  </text>
  <text x="50" y="310" class="content">
    这对新婚夫妇正在计划一个浪漫的蜜月。
  </text>

