<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hotshot</text>
  <text x="50" y="120" class="subtitle">[ˈhɒtʃɒt] n. 高手，能手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hot (热的) + shot (射击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个射击高手，他的每一枪都像"热射(hot-shot)"一样精准，
    <tspan x="50" dy="25">瞬间击中目标，他就是那个无人能敌的hotshot。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is considered a hotshot in the field of computer programming.
  </text>
  <text x="50" y="310" class="content">
    他被认为是计算机编程领域的高手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Target -->
    <circle cx="175" cy="100" r="50" class="image" />
    <circle cx="175" cy="100" r="30" class="image" />
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Bullet hole -->
    <circle cx="175" cy="100" r="5" class="image" fill="#C0392B" />
    <!-- Shooter -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Gun -->
    <rect x="100" y="130" width="50" height="10" class="image" />
    <line x1="150" y1="135" x2="175" y2="105" class="image" />
  </g>
</svg>