<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mutation</text>
  <text x="50" y="120" class="subtitle">[mjuːˈteɪʃn] n. 突变，变异</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mut (改变) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个细胞在分裂时，突然"改变(mut)"了它的DNA，
    <tspan x="50" dy="25">这个改变就是突变(mutation)，可能会导致新的特征出现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Genetic mutations can lead to various diseases.
  </text>
  <text x="50" y="310" class="content">
    基因突变可能导致各种疾病。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cell -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- DNA -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <!-- Mutation -->
    <circle cx="100" cy="100" r="10" class="image" fill="#E74C3C" />
    <!-- Arrow -->
    <line x1="100" y1="110" x2="100" y2="150" class="image" />
    <polygon points="95,145 100,150 105,145" class="image" />
  </g>
</svg>