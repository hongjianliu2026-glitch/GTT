<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .brush { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sagebrush</text>
  <text x="50" y="120" class="subtitle">[ˈseɪdʒbrʊʃ] n. 蒿属植物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sage (智慧) + brush (灌木)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片荒野中，"智慧的灌木(sage-brush)"
    <tspan x="50" dy="25">在风中摇曳，仿佛在诉说着古老的故事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The desert landscape was dominated by sagebrush.
  </text>
  <text x="50" y="310" class="content">
    沙漠景观主要由蒿属植物所主导。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sagebrush -->
    <path d="M0,0 C10,-20 30,-20 40,0 C50,-20 70,-20 80,0" class="brush" />
    <path d="M10,20 C20,0 40,0 50,20 C60,0 80,0 90,20" class="brush" />
    <path d="M20,40 C30,20 50,20 60,40 C70,20 90,20 100,40" class="brush" />
    <!-- Wind -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="60" x2="100" y2="60" class="image" />
    <line x1="50" y1="70" x2="100" y2="70" class="image" />
  </g>
</svg>