<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">astride</text>
  <text x="50" y="120" class="subtitle">[əˈstraɪd] adv. 跨着，骑着</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (在...上) + stride (大步)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"跨在(a-stride)"一匹马上，
    <tspan x="50" dy="25">双腿分开，稳稳地骑在马背上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He sat astride the horse, ready to ride.
  </text>
  <text x="50" y="310" class="content">
    他跨坐在马上，准备出发。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Rider -->
    <circle cx="100" cy="80" r="15" class="image" />
    <line x1="100" y1="95" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="50" y2="160" class="image" />
    <line x1="100" y1="130" x2="150" y2="160" class="image" />
    <line x1="100" y1="110" x2="150" y2="100" class="image" />
  </g>
</svg>