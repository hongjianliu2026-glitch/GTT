<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FF6F00; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flower { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carnation</text>
  <text x="50" y="120" class="subtitle">[kɑːrˈneɪʃn] n. 康乃馨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carna- (肉) + -tion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵康乃馨(carnation)，它的花瓣像"肉(carna)"一样柔软，
    <tspan x="50" dy="25">散发着温暖的香气，让人联想到母亲的爱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received a bouquet of carnations on Mother's Day.
  </text>
  <text x="50" y="310" class="content">
    母亲节那天，她收到了一束康乃馨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower petals -->
    <circle cx="100" cy="100" r="50" class="flower" />
    <circle cx="150" cy="100" r="50" class="flower" />
    <circle cx="125" cy="50" r="50" class="flower" />
    <circle cx="75" cy="50" r="50" class="flower" />
    <circle cx="100" cy="150" r="50" class="flower" />
    <circle cx="150" cy="150" r="50" class="flower" />
    <!-- Flower center -->
    <circle cx="125" cy="100" r="20" fill="#FF6F00" />
  </g>
</svg>