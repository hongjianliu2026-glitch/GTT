<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pessimist</text>
  <text x="50" y="120" class="subtitle">[ˈpɛsɪmɪst] n. 悲观主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pess (最坏) + -imist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个悲观主义者(pessimist)，总是看到事情的"最坏(pess)"一面，
    <tspan x="50" dy="25">无论发生什么，他总是预料到最糟糕的结果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pessimist always expects the worst outcome.
  </text>
  <text x="50" y="310" class="content">
    那个悲观主义者总是预料到最坏的结果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud with rain -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="100" y1="120" x2="250" y2="120" class="image" />
    <line x1="150" y1="140" x2="300" y2="140" class="image" />
    <!-- Person with umbrella -->
    <circle cx="200" cy="200" r="20" class="image" />
    <line x1="200" y1="220" x2="200" y2="260" class="image" />
    <line x1="200" y1="240" x2="180" y2="230" class="image" />
    <line x1="200" y1="240" x2="220" y2="230" class="image" />
    <line x1="200" y1="260" x2="180" y2="280" class="image" />
    <line x1="200" y1="260" x2="220" y2="280" class="image" />
    <path d="M150,200 Q200,150 250,200" class="image" />
  </g>
</svg>