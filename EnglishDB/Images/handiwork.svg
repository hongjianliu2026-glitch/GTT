<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handiwork</text>
  <text x="50" y="120" class="subtitle">[ˈhændiˌwɜrk] n. 手工制品，手工艺品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hand (手) + work (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠用"手(hand)"精心制作"工作(work)"，
    <tspan x="50" dy="25">最终完成了一件精美的手工艺品(handiwork)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vase is a beautiful piece of handiwork.
  </text>
  <text x="50" y="310" class="content">
    这个花瓶是一件精美的手工艺品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Craftsman -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Workbench -->
    <rect x="100" y="80" width="200" height="120" class="image" />
    <!-- Handiwork -->
    <rect x="120" y="100" width="160" height="80" class="image" />
    <line x1="130" y1="110" x2="270" y2="110" class="image" />
    <line x1="130" y1="130" x2="250" y2="130" class="image" />
    <line x1="130" y1="150" x2="270" y2="150" class="image" />
    <line x1="130" y1="170" x2="240" y2="170" class="image" />
  </g>
</svg>