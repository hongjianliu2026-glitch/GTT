<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fish { fill: #FFD700; }
      .shell { fill: #C0C0C0; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seafood</text>
  <text x="50" y="120" class="subtitle">[ˈsiːfuːd] n. 海鲜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sea (海洋) + food (食物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的海洋，里面充满了各种美味的海鲜，
    <tspan x="50" dy="25">有金色的鱼和银色的贝壳，它们都是海洋的食物(seafood)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had a delicious seafood dinner at the restaurant.
  </text>
  <text x="50" y="310" class="content">
    我们在餐厅享用了一顿美味的海鲜晚餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Fish -->
    <ellipse cx="100" cy="100" rx="50" ry="25" class="fish" />
    <line x1="100" y1="75" x2="150" y2="75" class="image" />
    <line x1="100" y1="125" x2="150" y2="125" class="image" />
    <!-- Shell -->
    <path d="M200,100 Q220,80 240,100 T280,100" class="shell" />
    <circle cx="220" cy="100" r="10" class="shell" />
  </g>
</svg>