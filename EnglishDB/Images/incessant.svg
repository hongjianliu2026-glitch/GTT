<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incessant</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsɛsnt] adj. 不停的，持续不断的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + cess (停止) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个永不停止的钟表，"不停止(in-cess-ant)"
    <tspan x="50" dy="25">地滴答作响，象征着持续不断的动作或声音。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The incessant noise from the construction site kept us awake all night.
  </text>
  <text x="50" y="310" class="content">
    建筑工地的持续噪音让我们整夜无法入睡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="75" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="25" class="image" />
    <line x1="175" y1="100" x2="225" y2="100" class="image" />
    <!-- Dots representing time -->
    <circle cx="175" cy="30" r="5" class="image" />
    <circle cx="225" cy="100" r="5" class="image" />
    <circle cx="125" cy="100" r="5" class="image" />
    <circle cx="175" cy="170" r="5" class="image" />
    <!-- Never-ending line -->
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="300" y2="220" class="image" />
    <line x1="300" y1="220" x2="50" y2="240" class="image" />
    <line x1="50" y1="240" x2="300" y2="240" class="image" />
  </g>
</svg>