<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reunion</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈjuːniən] n. 重聚，团聚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + uni (一个) + -on (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群久别的朋友再次"聚在一起(re-uni-on)"，
    <tspan x="50" dy="25">他们激动地拥抱，脸上洋溢着幸福的笑容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had a wonderful reunion after 10 years.
  </text>
  <text x="50" y="310" class="content">
    十年后我们重聚，非常愉快。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Arms -->
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <!-- Smiling faces -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="150" cy="90" r="5" class="image" />
    <circle cx="250" cy="90" r="5" class="image" />
    <path d="M50 110 Q50 115 55 115" class="image" />
    <path d="M150 110 Q150 115 155 115" class="image" />
    <path d="M250 110 Q250 115 255 115" class="image" />
  </g>
</svg>