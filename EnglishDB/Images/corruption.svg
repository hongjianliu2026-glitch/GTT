<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">corruption</text>
  <text x="50" y="120" class="subtitle">[kəˈrʌpʃən] n. 腐败，堕落</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cor- (共同) + rupt (断裂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原本坚固的结构，因为"共同断裂(cor-rupt)"
    <tspan x="50" dy="25">而变得腐败不堪，象征着道德和制度的堕落。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The investigation uncovered widespread corruption in the government.
  </text>
  <text x="50" y="310" class="content">
    调查揭露了政府中的广泛腐败。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken structure -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <!-- Broken lines -->
    <line x1="150" y1="20" x2="150" y2="200" class="image" stroke-dasharray="10,10" />
    <line x1="200" y1="20" x2="200" y2="200" class="image" stroke-dasharray="10,10" />
    <line x1="250" y1="20" x2="250" y2="200" class="image" stroke-dasharray="10,10" />
    <!-- Corruption symbol -->
    <circle cx="100" cy="100" r="20" class="image" fill="#B03A2E" />
    <circle cx="250" cy="100" r="20" class="image" fill="#B03A2E" />
  </g>
</svg>