<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">guilt</text>
  <text x="50" y="120" class="subtitle">[ɡɪlt] n. 内疚，罪恶感</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> guilt (源自古英语 gylt，意为“罪”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为做了坏事而感到"内疚(guilt)"，
    <tspan x="50" dy="25">他的心被一个沉重的锁链束缚，象征着他的罪恶感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt a pang of guilt for lying to her friend.
  </text>
  <text x="50" y="310" class="content">
    她因为对朋友撒谎而感到一阵内疚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 Q100,20 150,50 Q100,80 50,50" class="image" />
    <!-- Chain -->
    <line x1="70" y1="70" x2="70" y2="150" class="image" />
    <line x1="90" y1="70" x2="90" y2="150" class="image" />
    <line x1="110" y1="70" x2="110" y2="150" class="image" />
    <line x1="130" y1="70" x2="130" y2="150" class="image" />
    <!-- Lock -->
    <rect x="60" y="150" width="80" height="30" class="image" />
    <circle cx="100" cy="165" r="10" class="image" />
  </g>
</svg>