<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intellectually</text>
  <text x="50" y="120" class="subtitle">[ˌɪntəˈlektʃuəli] adv. 智力上，理智地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> intel- (在中间) + lect (选择) + -ual (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个智者在书堆中，"在中间选择(intel-lect)"
    <tspan x="50" dy="25">出最深奥的知识，这种选择是智力上的(intellectually)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She solved the problem intellectually, not emotionally.
  </text>
  <text x="50" y="310" class="content">
    她理智地解决了问题，而不是情绪化地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Books -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="170" y="20" width="100" height="160" class="image" />
    <rect x="290" y="20" width="100" height="160" class="image" />
    <!-- Brain -->
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Light bulb -->
    <circle cx="200" cy="100" r="20" class="image" fill="#F1C40F" />
    <!-- Thought lines -->
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="150" y2="220" class="image" />
    <line x1="200" y1="180" x2="250" y2="220" class="image" />
  </g>
</svg>