<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leaflet</text>
  <text x="50" y="120" class="subtitle">[ˈliːflɪt] n. 传单，小册子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leaf (叶子) + let (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片"小叶子(leaf-let)"被风吹起，
    <tspan x="50" dy="25">飘落在地上，变成了一张传单(leaflet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He handed out leaflets at the street corner.
  </text>
  <text x="50" y="310" class="content">
    他在街角分发传单。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Leaf -->
    <path d="M50,50 C60,20 100,20 110,50 S150,80 140,110" class="image" />
    <!-- Small leaflet -->
    <rect x="160" y="50" width="100" height="70" class="image" />
    <!-- Wind -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="55" x2="150" y2="55" class="image" />
    <line x1="50" y1="60" x2="150" y2="60" class="image" />
  </g>
</svg>