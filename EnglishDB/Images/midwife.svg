<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">midwife</text>
  <text x="50" y="120" class="subtitle">[ˈmɪdwaɪf] n. 助产士</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mid- (在中间) + wife (女人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女人在分娩过程中，"在中间(mid)"
    <tspan x="50" dy="25">帮助另一个女人(wife)，她就是助产士(midwife)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The midwife assisted in the delivery of the baby.
  </text>
  <text x="50" y="310" class="content">
    助产士帮助接生了婴儿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Woman giving birth -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />

    <!-- Midwife assisting -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="220" y2="210" class="image" />
    <line x1="250" y1="180" x2="280" y2="210" class="image" />
    <line x1="250" y1="150" x2="220" y2="140" class="image" />
    <line x1="250" y1="150" x2="280" y2="140" class="image" />

    <!-- Baby -->
    <circle cx="180" cy="220" r="20" class="image" />
    <line x1="180" y1="240" x2="180" y2="280" class="image" />
    <line x1="180" y1="280" x2="160" y2="310" class="image" />
    <line x1="180" y1="280" x2="200" y2="310" class="image" />
    <line x1="180" y1="260" x2="160" y2="250" class="image" />
    <line x1="180" y1="260" x2="200" y2="250" class="image" />
  </g>
</svg>