<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enclose</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkloʊz] v. 围住，封入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + close (关闭)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的信封，"进入并关闭(en-close)"
    <tspan x="50" dy="25">里面装着一封重要的信件，信封紧紧地封住了信件。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She enclosed a check in the letter.
  </text>
  <text x="50" y="310" class="content">
    她在信中附了一张支票。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Envelope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flap -->
    <polygon points="0,0 175,50 350,0" class="image" />
    <!-- Letter inside -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Stamp -->
    <circle cx="300" cy="30" r="20" class="image" />
    <!-- Stamp text -->
    <text x="290" y="35" class="content" text-anchor="middle">Stamp</text>
  </g>
</svg>