<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">estrangement</text>
  <text x="50" y="120" class="subtitle">[ɪˈstreɪndʒmənt] n. 疏远，隔阂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + strange (陌生的) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人原本亲密无间，但因为某种原因，
    <tspan x="50" dy="25">他们逐渐变得"陌生(strange)"，最终"走出(e-)"了彼此的生活，</tspan>
    <tspan x="50" dy="25">形成了"疏远(estrangement)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The estrangement between the siblings was painful to witness.
  </text>
  <text x="50" y="310" class="content">
    兄弟姐妹之间的疏远让人心痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Arms -->
    <line x1="50" y1="120" x2="0" y2="150" class="image" />
    <line x1="50" y1="120" x2="100" y2="150" class="image" />
    <line x1="250" y1="120" x2="200" y2="150" class="image" />
    <line x1="250" y1="120" x2="300" y2="150" class="image" />
    <!-- Distance -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <text x="150" y="90" class="content" text-anchor="middle">疏远</text>
  </g>
</svg>