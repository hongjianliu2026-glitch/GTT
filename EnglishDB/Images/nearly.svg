<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nearly</text>
  <text x="50" y="120" class="subtitle">[ˈnɪrli] adv. 几乎，差不多</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> near (接近) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在终点线前，"接近(near)"
    <tspan x="50" dy="25">终点，但还没完全到达，这就是"几乎(nearly)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was nearly at the finish line when she tripped.
  </text>
  <text x="50" y="310" class="content">
    她快要到终点线时绊倒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Finish line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="10" x2="350" y2="10" class="image" />
    <!-- Person -->
    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="180" y2="70" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="190" y2="40" class="image" />
    <line x1="200" y1="50" x2="190" y2="60" class="image" />
  </g>
</svg>