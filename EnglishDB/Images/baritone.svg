<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">baritone</text>
  <text x="50" y="120" class="subtitle">[ˈbærɪˌtoʊn] n. 男中音</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bary- (重的) + tone (音调)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个男中音歌手，他的声音"沉重(bary-)"而"有力(tone)"，
    <tspan x="50" dy="25">就像一块厚重的石头，深深地打动人心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baritone's voice resonated through the hall.
  </text>
  <text x="50" y="310" class="content">
    男中音的声音在大厅里回荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vocal cords -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Singer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Sound waves -->
    <path d="M50 200 Q100 150 150 200 T250 200" class="image" />
    <path d="M50 220 Q100 170 150 220 T250 220" class="image" />
    <path d="M50 240 Q100 190 150 240 T250 240" class="image" />
  </g>
</svg>