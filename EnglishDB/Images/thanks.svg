<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thanks</text>
  <text x="50" y="120" class="subtitle">[θæŋks] n. 感谢，谢意</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thank (感谢)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人双手合十，脸上洋溢着感激的笑容，
    <tspan x="50" dy="25">表达着深深的"感谢(thank)"之情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I give you my thanks for your help.
  </text>
  <text x="50" y="310" class="content">
    我感谢你的帮助。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person with hands together -->
    <circle cx="100" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="100" y1="130" x2="100" y2="200" class="image" /> <!-- Body -->
    <line x1="100" y1="150" x2="70" y2="180" class="image" /> <!-- Left arm -->
    <line x1="100" y1="150" x2="130" y2="180" class="image" /> <!-- Right arm -->
    <line x1="100" y1="200" x2="70" y2="250" class="image" /> <!-- Left leg -->
    <line x1="100" y1="200" x2="130" y2="250" class="image" /> <!-- Right leg -->
    <line x1="70" y1="180" x2="130" y2="180" class="image" /> <!-- Hands together -->
    <!-- Smiling face -->
    <circle cx="90" cy="90" r="5" class="image" /> <!-- Left eye -->
    <circle cx="110" cy="90" r="5" class="image" /> <!-- Right eye -->
    <path d="M80 110 Q100 120 120 110" class="image" /> <!-- Smile -->
  </g>
</svg>