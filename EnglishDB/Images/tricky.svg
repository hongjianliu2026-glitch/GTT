<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tricky</text>
  <text x="50" y="120" class="subtitle">[ˈtrɪki] adj. 狡猾的，棘手的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trick (诡计) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狡猾的狐狸(trick)，它总是用各种诡计(trick)
    <tspan x="50" dy="25">来迷惑猎人，这种行为就是"狡猾的(tricky)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> That was a tricky question; I didn't know how to answer it.
  </text>
  <text x="50" y="310" class="content">
    那是一个棘手的问题，我不知道如何回答。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fox -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Tail -->
    <line x1="50" y1="180" x2="80" y2="200" class="image" /> <!-- Tail -->
    <!-- Trick -->
    <circle cx="150" cy="100" r="10" class="image" /> <!-- Eye -->
    <line x1="150" y1="110" x2="150" y2="150" class="image" /> <!-- Nose -->
    <line x1="140" y1="120" x2="160" y2="120" class="image" /> <!-- Mouth -->
    <line x1="150" y1="150" x2="120" y2="180" class="image" /> <!-- Trick -->
    <line x1="150" y1="150" x2="180" y2="180" class="image" /> <!-- Trick -->
  </g>
</svg>