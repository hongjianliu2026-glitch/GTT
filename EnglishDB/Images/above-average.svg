<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">above-average</text>
  <text x="50" y="120" class="subtitle">[əˈbʌv ˈævərɪdʒ] adj. 高于平均水平的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> above (在...之上) + average (平均)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天平，一边是"平均水平(average)"，
    <tspan x="50" dy="25">另一边是一个人高高跃起，"在平均水平之上(above-average)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His performance was above-average in the competition.
  </text>
  <text x="50" y="310" class="content">
    他在比赛中表现高于平均水平。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="200" class="image" />
    <line x1="250" y1="50" x2="250" y2="200" class="image" />
    <!-- Average level -->
    <line x1="50" y1="150" x2="350" y2="150" class="image" />
    <!-- Above-average person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>