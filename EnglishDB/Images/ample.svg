<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ample</text>
  <text x="50" y="120" class="subtitle">[ˈæmpl] adj. 充足的，丰富的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> am (拿) + ple (满)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的篮子，"拿满(am-ple)"了各种水果，
    <tspan x="50" dy="25">这个篮子里的水果多到溢出来，象征着充足的(ample)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden provided ample vegetables for the winter.
  </text>
  <text x="50" y="310" class="content">
    花园为冬天提供了充足的蔬菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basket -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fruits -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="70" r="25" class="image" />
    <circle cx="150" cy="60" r="30" class="image" />
    <circle cx="200" cy="80" r="20" class="image" />
    <circle cx="250" cy="50" r="25" class="image" />
    <circle cx="300" cy="70" r="30" class="image" />
    <!-- Overflowing fruits -->
    <circle cx="350" cy="50" r="20" class="image" />
    <circle cx="400" cy="70" r="25" class="image" />
    <circle cx="450" cy="60" r="30" class="image" />
  </g>
</svg>