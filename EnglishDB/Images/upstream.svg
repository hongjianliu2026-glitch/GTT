<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">upstream</text>
  <text x="50" y="120" class="subtitle">[ˌʌpˈstriːm] adv. 向上游；adj. 上游的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + stream (河流)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，水流从下游流向上游，"向上游(up-stream)"
    <tspan x="50" dy="25">的方向就是逆流而上，象征着挑战和前进。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boat was moving upstream against the current.
  </text>
  <text x="50" y="310" class="content">
    船逆流而上，与水流对抗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 100 Q200 200 400 100" class="image" />
    <!-- Boat -->
    <polygon points="180,100 220,120 180,140" class="image" fill="#2980B9" />
    <!-- Up arrow -->
    <polygon points="300,80 320,120 280,120" class="image" fill="#E74C3C" />
    <text x="300" y="150" class="content" text-anchor="middle">up</text>
  </g>
</svg>