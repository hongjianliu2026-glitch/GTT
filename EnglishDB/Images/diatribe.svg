<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diatribe</text>
  <text x="50" y="120" class="subtitle">[ˈdaɪətraɪb] n. 抨击，谩骂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dia- (通过) + trib (摩擦)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在演讲台上，"通过摩擦(dia-trib)"
    <tspan x="50" dy="25">激起听众的情绪，进行激烈的抨击(diatribe)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The politician delivered a scathing diatribe against his opponent.
  </text>
  <text x="50" y="310" class="content">
    这位政治家对他的对手进行了尖锐的抨击。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Audience -->
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
    <circle cx="250" cy="120" r="10" class="image" />
    <!-- Speech bubbles -->
    <path d="M100,80 Q150,50 200,80" class="image" />
    <path d="M100,90 Q150,60 200,90" class="image" />
    <path d="M100,100 Q150,70 200,100" class="image" />
  </g>
</svg>