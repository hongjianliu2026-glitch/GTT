<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">climate</text>
  <text x="50" y="120" class="subtitle">[ˈklaɪmət] n. 气候</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cli (倾斜) + mate (伙伴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的倾斜(cli)的伙伴(mate)，
    <tspan x="50" dy="25">它掌控着地球的温度和天气，这就是气候(climate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The climate in the tropics is hot and humid.
  </text>
  <text x="50" y="310" class="content">
    热带地区的气候炎热潮湿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="40" fill="#F39C12" />
    <!-- Cloud -->
    <ellipse cx="200" cy="50" rx="60" ry="30" fill="#ECF0F1" />
    <ellipse cx="180" cy="30" rx="60" ry="30" fill="#ECF0F1" />
    <ellipse cx="220" cy="30" rx="60" ry="30" fill="#ECF0F1" />
    <!-- Rain -->
    <line x1="180" y1="80" x2="180" y2="100" class="image" />
    <line x1="200" y1="80" x2="200" y2="100" class="image" />
    <line x1="220" y1="80" x2="220" y2="100" class="image" />
    <!-- Earth -->
    <circle cx="300" cy="150" r="100" fill="#2ECC71" />
    <!-- Temperature gauge -->
    <rect x="350" y="50" width="20" height="100" fill="#E74C3C" />
    <line x1="350" y1="50" x2="370" y2="50" class="image" />
    <line x1="350" y1="100" x2="370" y2="100" class="image" />
    <line x1="350" y1="150" x2="370" y2="150" class="image" />
  </g>
</svg>