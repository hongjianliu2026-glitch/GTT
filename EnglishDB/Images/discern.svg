<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discern</text>
  <text x="50" y="120" class="subtitle">[dɪˈsɜːrn] v. 辨别，识别</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + cern (区分)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在黑暗中，"分开(dis-)"
    <tspan x="50" dy="25">并"区分(cern)"出两个模糊的影子，</tspan>
    <tspan x="50" dy="25">这就是辨别(discern)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was difficult to discern the shapes in the fog.
  </text>
  <text x="50" y="310" class="content">
    在雾中很难辨别出形状。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two blurry shapes -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <ellipse cx="250" cy="100" rx="50" ry="30" class="image" />
    <!-- Person trying to discern -->
    <circle cx="175" cy="150" r="15" class="image" />
    <line x1="175" y1="165" x2="175" y2="190" class="image" />
    <line x1="175" y1="190" x2="160" y2="210" class="image" />
    <line x1="175" y1="190" x2="190" y2="210" class="image" />
    <line x1="175" y1="175" x2="200" y2="165" class="image" />
  </g>
</svg>