<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">terrier</text>
  <text x="50" y="120" class="subtitle">[ˈteriər] n. 㹴犬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> terr (地) + -ier (名词后缀，表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只勇敢的㹴犬，"守护着(terr)"
    <tspan x="50" dy="25">它的领地，就像一个守护者(terrier)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The terrier barked fiercely at the intruder.
  </text>
  <text x="50" y="310" class="content">
    那只㹴犬对着入侵者凶猛地吠叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Terrier -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Front leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Back leg -->
    <line x1="50" y1="140" x2="20" y2="160" class="image" /> <!-- Front paw -->
    <line x1="50" y1="140" x2="80" y2="160" class="image" /> <!-- Back paw -->
    <line x1="30" y1="100" x2="70" y2="100" class="image" /> <!-- Mouth -->
    <circle cx="40" cy="90" r="5" class="image" /> <!-- Left eye -->
    <circle cx="60" cy="90" r="5" class="image" /> <!-- Right eye -->
    <line x1="50" y1="110" x2="50" y2="120" class="image" /> <!-- Nose -->
  </g>
</svg>