<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deference</text>
  <text x="50" y="120" class="subtitle">[ˈdɛfərəns] n. 顺从，尊重</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + fer (带来) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在领导面前，"低下头(de-)"
    <tspan x="50" dy="25">并"带来(fer)"尊重和顺从(deference)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She showed deference to her elders.
  </text>
  <text x="50" y="310" class="content">
    她对长辈表现出尊重。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person bowing -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="150" class="image" />
    <line x1="50" y1="100" x2="70" y2="150" class="image" />
    <line x1="50" y1="60" x2="30" y2="80" class="image" />
    <line x1="50" y1="60" x2="70" y2="80" class="image" />
    <!-- Leader -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="160" class="image" />
    <line x1="150" y1="120" x2="170" y2="160" class="image" />
    <line x1="150" y1="90" x2="180" y2="80" class="image" />
  </g>
</svg>