<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subscale</text>
  <text x="50" y="120" class="subtitle">[ˈsʌbˌskeɪl] n. 子刻度，次刻度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + scale (刻度)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的刻度尺，上面有一个"小刻度(sub-scale)"，
    <tspan x="50" dy="25">它位于主刻度的下方，用来更精细地测量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thermometer has a subscale for precise temperature readings.
  </text>
  <text x="50" y="310" class="content">
    温度计有一个子刻度，用于精确的温度读数。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main scale -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="50" y1="0" x2="350" y2="0" class="image" />
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <line x1="50" y1="150" x2="350" y2="150" class="image" />
    <line x1="50" y1="200" x2="350" y2="200" class="image" />

    <!-- Subscale -->
    <line x1="50" y1="25" x2="350" y2="25" class="image" />
    <line x1="50" y1="75" x2="350" y2="75" class="image" />
    <line x1="50" y1="125" x2="350" y2="125" class="image" />
    <line x1="50" y1="175" x2="350" y2="175" class="image" />

    <!-- Arrow pointing to subscale -->
    <line x1="400" y1="100" x2="360" y2="100" class="image" />
    <polygon points="360,100 355,95 355,105" class="image" />
    <text x="410" y="105" class="content">subscale</text>
  </g>
</svg>