<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tree { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">juniper</text>
  <text x="50" y="120" class="subtitle">[ˈdʒuːnɪpər] n. 杜松</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> juni- (年轻的) + per (表示植物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵年轻的(juni-)杜松树(per)，
    <tspan x="50" dy="25">它的枝叶茂盛，散发着清新的香气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The juniper berries are used to flavor gin.
  </text>
  <text x="50" y="310" class="content">
    杜松子被用来给杜松子酒调味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree trunk -->
    <rect x="150" y="100" width="20" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="160" y1="120" x2="100" y2="200" class="image" />
    <line x1="160" y1="120" x2="220" y2="200" class="image" />
    <line x1="160" y1="150" x2="80" y2="250" class="image" />
    <line x1="160" y1="150" x2="240" y2="250" class="image" />
    <!-- Tree leaves -->
    <circle cx="100" cy="200" r="30" class="tree" />
    <circle cx="220" cy="200" r="30" class="tree" />
    <circle cx="80" cy="250" r="30" class="tree" />
    <circle cx="240" cy="250" r="30" class="tree" />
  </g>
</svg>