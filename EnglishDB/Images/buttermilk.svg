<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #5D4037; }
      .content { font: 18px sans-serif; fill: #795548; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #388E3C; }
      .image { stroke: #6D4C41; stroke-width: 2; fill: none; }
      .milk { fill: #F5DEB3; }
      .butter { fill: #FFEB3B; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buttermilk</text>
  <text x="50" y="120" class="subtitle">[ˈbʌtərmɪlk] n. 酪乳，脱脂乳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> butter (黄油) + milk (牛奶)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在搅拌牛奶，"黄油(butter)"
    <tspan x="50" dy="25">从牛奶中分离出来，剩下的就是酪乳(buttermilk)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used buttermilk to make pancakes.
  </text>
  <text x="50" y="310" class="content">
    她用酪乳来做煎饼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Milk container -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Milk -->
    <rect x="50" y="20" width="250" height="160" class="milk" />
    <!-- Butter -->
    <circle cx="200" cy="100" r="30" class="butter" />
    <!-- Farmer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Stirring stick -->
    <line x1="20" y1="100" x2="200" y2="100" class="image" />
  </g>
</svg>