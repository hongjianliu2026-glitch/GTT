<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">long-ago</text>
  <text x="50" y="120" class="subtitle">[ˈlɒŋəˌɡoʊ] adv. 很久以前</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> long (长) + ago (以前)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的时钟，指针指向"很久以前(long-ago)"，
    <tspan x="50" dy="25">时间的长河中，故事在遥远的过去发生。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> In the long-ago days, people used to travel by horse.
  </text>
  <text x="50" y="310" class="content">
    很久以前，人们常常骑马旅行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ancient clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Time river -->
    <rect x="200" y="20" width="300" height="160" class="image" />
    <text x="210" y="100" class="content" style="writing-mode: tb;">Time River</text>
  </g>
</svg>