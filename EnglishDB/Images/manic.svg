<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">manic</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪnɪk] adj. 狂躁的，极度兴奋的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mania (狂热) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在狂热的"mania"中，
    <tspan x="50" dy="25">疯狂地跳跃和旋转，表现出极度的兴奋(manic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd became manic after the winning goal.
  </text>
  <text x="50" y="310" class="content">
    进球后，人群变得极度兴奋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person jumping -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <!-- Spinning lines -->
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="50" y1="100" x2="0" y2="50" class="image" />
    <line x1="50" y1="100" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
  </g>
</svg>