<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comedy</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmədi] n. 喜剧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + edy (娱乐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"共同娱乐(com-edy)"，
    <tspan x="50" dy="25">笑声不断，这就是喜剧(comedy)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers comedy to tragedy in movies.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢电影中的喜剧而不是悲剧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Audience -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Laughing faces -->
    <path d="M50 120 Q60 140 70 120" class="image" />
    <path d="M100 120 Q110 140 120 120" class="image" />
    <path d="M150 120 Q160 140 170 120" class="image" />
    <path d="M200 120 Q210 140 220 120" class="image" />
    <path d="M250 120 Q260 140 270 120" class="image" />
    <path d="M300 120 Q310 140 320 120" class="image" />
    <!-- Comedian -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="100" class="image" />
    <line x1="175" y1="100" x2="155" y2="130" class="image" />
    <line x1="175" y1="100" x2="195" y2="130" class="image" />
    <line x1="175" y1="80" x2="205" y2="70" class="image" />
    <!-- Smile -->
    <path d="M160 60 Q175 80 190 60" class="image" />
  </g>
</svg>