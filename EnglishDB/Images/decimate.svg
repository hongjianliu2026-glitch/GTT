<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decimate</text>
  <text x="50" y="120" class="subtitle">[ˈdesɪmeɪt] v. 大量毁灭，严重破坏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> deci- (十分之一) + mate (杀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一支军队，每十个人中就有一个被"杀(mate)"，
    <tspan x="50" dy="25">这种"十分之一(deci-)"的毁灭方式就是decimate。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plague decimated the population of the village.
  </text>
  <text x="50" y="310" class="content">
    瘟疫使村庄的人口大量减少。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldiers -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="350" y1="20" x2="350" y2="180" class="image" />
    <line x1="400" y1="20" x2="400" y2="180" class="image" />
    <line x1="450" y1="20" x2="450" y2="180" class="image" />
    <line x1="500" y1="20" x2="500" y2="180" class="image" />
    <!-- Decimation -->
    <line x1="50" y1="180" x2="500" y2="180" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="200" y1="180" x2="200" y2="200" class="image" />
    <line x1="300" y1="180" x2="300" y2="200" class="image" />
    <line x1="400" y1="180" x2="400" y2="200" class="image" />
    <line x1="500" y1="180" x2="500" y2="200" class="image" />
    <!-- Crossed out soldiers -->
    <line x1="100" y1="20" x2="100" y2="200" class="image" />
    <line x1="200" y1="20" x2="200" y2="200" class="image" />
    <line x1="300" y1="20" x2="300" y2="200" class="image" />
    <line x1="400" y1="20" x2="400" y2="200" class="image" />
    <line x1="500" y1="20" x2="500" y2="200" class="image" />
  </g>
</svg>