<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gypsy</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɪpsi] n. 吉普赛人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gyps- (源自希腊语 "gyps"，意为"陶工"，因吉普赛人常制作陶器)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个吉普赛人坐在一辆色彩斑斓的马车上，
    <tspan x="50" dy="25">周围是各种陶器，象征着他们的传统和艺术。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gypsy woman sold beautiful pottery at the market.
  </text>
  <text x="50" y="310" class="content">
    吉普赛女人在市场卖美丽的陶器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wagon -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="180" r="20" class="image" />
    <circle cx="300" cy="180" r="20" class="image" />
    <!-- Gypsy -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
    <!-- Pottery -->
    <rect x="70" y="20" width="50" height="50" class="image" />
    <rect x="150" y="20" width="50" height="50" class="image" />
    <rect x="230" y="20" width="50" height="50" class="image" />
  </g>
</svg>