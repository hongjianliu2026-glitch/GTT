<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oddball</text>
  <text x="50" y="120" class="subtitle">[ˈɒdbɔːl] n. 古怪的人，怪人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> odd (奇怪的) + ball (球)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"奇怪的球(odd-ball)"，它不仅形状怪异，
    <tspan x="50" dy="25">还喜欢在人群中滚动，吸引所有人的目光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was considered an oddball in the office.
  </text>
  <text x="50" y="310" class="content">
    他在办公室里被认为是怪人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Strange ball -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="130" class="image" />
    <line x1="75" y1="85" x2="125" y2="115" class="image" />
    <line x1="75" y1="115" x2="125" y2="85" class="image" />
    <!-- People -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
    <!-- Eye lines -->
    <line x1="180" y1="90" x2="220" y2="90" class="image" />
    <line x1="230" y1="90" x2="270" y2="90" class="image" />
  </g>
</svg>