<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">troubled</text>
  <text x="50" y="120" class="subtitle">[ˈtrʌbəld] adj. 烦恼的，不安的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> turb (搅动) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人心中"搅动(turb)"着各种烦恼，
    <tspan x="50" dy="25">脸上露出不安的表情，这就是"troubled"的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked troubled when she heard the news.
  </text>
  <text x="50" y="310" class="content">
    她听到消息时显得很烦恼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" />
    <!-- Turbulence -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
  </g>
</svg>