<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ought</text>
  <text x="50" y="120" class="subtitle">[ɔːt] v. 应该，应当</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ought (来自古英语，意为“欠”或“应得”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官对被告说：“你<tspan class="highlight">应该(ought)</tspan>
    <tspan x="50" dy="25">为自己的行为负责，因为你欠(ought)社会的正义。”</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You ought to apologize for your behavior.
  </text>
  <text x="50" y="310" class="content">
    你应该为你的行为道歉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Gavel -->
    <rect x="10" y="80" width="20" height="40" class="image" />
    <line x1="20" y1="80" x2="20" y2="60" class="image" />
    <!-- Defendant -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 20 60 Q 40 40 60 60 L 60 80 Q 40 100 20 80 Z" class="image" />
    <text x="30" y="75" class="content" text-anchor="middle">Ought!</text>
  </g>
</svg>