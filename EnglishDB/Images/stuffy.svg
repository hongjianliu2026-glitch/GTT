<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stuffy</text>
  <text x="50" y="120" class="subtitle">[ˈstʌfi] adj. 闷热的，不通气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stuff (填满) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间被"填满(stuff)"了空气，
    <tspan x="50" dy="25">空气无法流通，变得"闷热(stuffy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room became stuffy after the windows were closed.
  </text>
  <text x="50" y="310" class="content">
    窗户关上后，房间变得闷热。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Windows -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <rect x="200" y="20" width="100" height="80" class="image" />
    <!-- Air -->
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="150" cy="150" r="20" class="image" />
    <circle cx="200" cy="150" r="20" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
    <!-- Stuffed feeling -->
    <text x="150" y="180" class="content" fill="#E74C3C">闷热</text>
  </g>
</svg>