<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">barbershop</text>
  <text x="50" y="120" class="subtitle">[ˈbɑːrbərˌʃɒp] n. 理发店</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> barber (理发师) + shop (商店)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个理发师(barber)在商店(shop)里，
    <tspan x="50" dy="25">为顾客剪头发，这就是一个理发店(barbershop)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He went to the barbershop to get a haircut.
  </text>
  <text x="50" y="310" class="content">
    他去理发店剪头发。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Barber chair -->
    <rect x="50" y="20" width="100" height="150" class="image" />
    <line x1="100" y1="20" x2="100" y2="170" class="image" />
    <line x1="50" y1="95" x2="150" y2="95" class="image" />
    <!-- Barber pole -->
    <rect x="200" y="20" width="20" height="150" class="image" />
    <circle cx="210" cy="50" r="15" class="image" />
    <circle cx="210" cy="100" r="15" class="image" />
    <circle cx="210" cy="150" r="15" class="image" />
    <!-- Mirror -->
    <rect x="250" y="20" width="100" height="150" class="image" />
    <line x1="250" y1="20" x2="350" y2="20" class="image" />
    <line x1="250" y1="170" x2="350" y2="170" class="image" />
    <line x1="250" y1="20" x2="250" y2="170" class="image" />
    <line x1="350" y1="20" x2="350" y2="170" class="image" />
  </g>
</svg>