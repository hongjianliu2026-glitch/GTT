<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #6A1B9A; }
      .subtitle { font: italic 24px serif; fill: #4A148C; }
      .content { font: 18px sans-serif; fill: #311B92; }
      .highlight { font-weight: bold; fill: #D500F9; }
      .story { font: 16px serif; fill: #7C4DFF; }
      .image { stroke: #9E9E9E; stroke-width: 2; fill: none; }
      .wool { fill: #FFFFFF; stroke: #795548; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">woolen</text>
  <text x="50" y="120" class="subtitle">[ˈwʊlən] adj. 羊毛的，毛织的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wool (羊毛) + -en (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只羊在寒冷的冬天，身上覆盖着厚厚的"羊毛(wool)"，
    <tspan x="50" dy="25">这些羊毛被织成了温暖的毛衣(woolen sweater)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a warm woolen sweater on the cold day.
  </text>
  <text x="50" y="310" class="content">
    她在寒冷的日子里穿了一件温暖的羊毛衣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sheep -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <line x1="50" y1="120" x2="20" y2="140" class="image" />
    <line x1="50" y1="120" x2="80" y2="140" class="image" />

    <!-- Wool -->
    <rect x="100" y="20" width="150" height="100" class="wool" />
    <rect x="120" y="40" width="110" height="60" class="wool" />
    <rect x="140" y="60" width="70" height="20" class="wool" />

    <!-- Sweater -->
    <rect x="300" y="20" width="150" height="100" class="wool" />
    <rect x="320" y="40" width="110" height="60" class="wool" />
    <rect x="340" y="60" width="70" height="20" class="wool" />
  </g>
</svg>