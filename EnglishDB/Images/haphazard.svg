<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">haphazard</text>
  <text x="50" y="120" class="subtitle">[ˌhæpˈhæzərd] adj. 随意的，无计划的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hap (运气) + hazard (冒险)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冒险家在迷宫中，"运气(hap)"
    <tspan x="50" dy="25">和"冒险(hazard)"交织，每一步都是随意的(haphazard)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The haphazard arrangement of furniture made the room look chaotic.
  </text>
  <text x="50" y="310" class="content">
    家具的随意摆放使房间看起来很混乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Maze -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <line x1="50" y1="20" x2="50" y2="170" class="image" />
    <line x1="100" y1="20" x2="100" y2="170" class="image" />
    <line x1="150" y1="20" x2="150" y2="170" class="image" />
    <line x1="200" y1="20" x2="200" y2="170" class="image" />
    <line x1="250" y1="20" x2="250" y2="170" class="image" />
    <line x1="300" y1="20" x2="300" y2="170" class="image" />
    <!-- Adventurer -->
    <circle cx="75" cy="40" r="15" class="image" />
    <line x1="75" y1="55" x2="75" y2="80" class="image" />
    <line x1="75" y1="80" x2="60" y2="100" class="image" />
    <line x1="75" y1="80" x2="90" y2="100" class="image" />
    <line x1="75" y1="65" x2="100" y2="55" class="image" />
  </g>
</svg>