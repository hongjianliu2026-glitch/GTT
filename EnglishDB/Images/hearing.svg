<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hearing</text>
  <text x="50" y="120" class="subtitle">[ˈhɪrɪŋ] n. 听力，听证会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hear (听) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的耳朵在法庭上，"听(hear)"
    <tspan x="50" dy="25">证人的证词，这就是听证会(hearing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge called for a hearing to determine the facts.
  </text>
  <text x="50" y="310" class="content">
    法官要求召开听证会以确定事实。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large ear -->
    <path d="M50,50 C100,0 150,0 200,50 C250,100 250,150 200,200 C150,250 100,250 50,200 C0,150 0,100 50,50 Z" class="image" />
    <!-- Courtroom -->
    <rect x="0" y="200" width="350" height="100" class="image" />
    <!-- Judge -->
    <circle cx="175" cy="250" r="20" class="image" />
    <line x1="175" y1="270" x2="175" y2="300" class="image" />
    <line x1="175" y1="285" x2="150" y2="275" class="image" />
    <line x1="175" y1="285" x2="200" y2="275" class="image" />
    <line x1="175" y1="300" x2="150" y2="320" class="image" />
    <line x1="175" y1="300" x2="200" y2="320" class="image" />
  </g>
</svg>