<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rediscover</text>
  <text x="50" y="120" class="subtitle">[ˌriːdɪˈskʌvər] v. 重新发现</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + discover (发现)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在丛林中，"再次发现(re-discover)"
    <tspan x="50" dy="25">一个被遗忘的宝藏，这个宝藏就是他重新发现(rediscover)的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She rediscovered her love for painting during the lockdown.
  </text>
  <text x="50" y="310" class="content">
    她在封锁期间重新发现了对绘画的热爱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jungle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Explorer -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Treasure chest -->
    <rect x="250" y="80" width="50" height="40" class="image" />
    <line x1="250" y1="80" x2="300" y2="80" class="image" />
    <line x1="250" y1="120" x2="300" y2="120" class="image" />
    <line x1="250" y1="80" x2="250" y2="120" class="image" />
    <line x1="300" y1="80" x2="300" y2="120" class="image" />
    <!-- Light rays -->
    <line x1="275" y1="60" x2="275" y2="40" class="image" />
    <line x1="265" y1="60" x2="265" y2="40" class="image" />
    <line x1="285" y1="60" x2="285" y2="40" class="image" />
  </g>
</svg>