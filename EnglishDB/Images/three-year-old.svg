<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-year-old</text>
  <text x="50" y="120" class="subtitle">[θriː jɪər əʊld] n. 三岁小孩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + year (年) + old (老的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个三岁的小孩，"三岁(three-year)"
    <tspan x="50" dy="25">的小孩(old)，天真无邪，充满好奇心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The three-year-old was fascinated by the colorful toys.
  </text>
  <text x="50" y="310" class="content">
    那个三岁的小孩对五颜六色的玩具着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />
    <!-- Toy -->
    <rect x="120" y="80" width="60" height="60" class="image" />
    <circle cx="150" cy="110" r="10" class="image" />
    <line x1="120" y1="110" x2="180" y2="110" class="image" />
    <line x1="150" y1="80" x2="150" y2="140" class="image" />
  </g>
</svg>