<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oven</text>
  <text x="50" y="120" class="subtitle">[ˈʌvən] n. 烤箱，烤炉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ov (鸟) + en (器具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的鸟巢形状的器具，里面可以烤制各种美食，
    <tspan x="50" dy="25">这个器具就是烤箱(oven)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She baked a cake in the oven.
  </text>
  <text x="50" y="310" class="content">
    她在烤箱里烤了一个蛋糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Oven -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Door -->
    <rect x="50" y="50" width="200" height="100" class="image" />
    <!-- Handle -->
    <circle cx="150" cy="100" r="10" class="image" />
    <!-- Rack -->
    <line x1="70" y1="120" x2="230" y2="120" class="image" />
    <line x1="70" y1="140" x2="230" y2="140" class="image" />
    <line x1="70" y1="160" x2="230" y2="160" class="image" />
  </g>
</svg>