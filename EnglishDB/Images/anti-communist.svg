<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anti-communist</text>
  <text x="50" y="120" class="subtitle">[ˌæntiˈkɒmjʊnɪst] n. 反共主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (反对) + communist (共产主义者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个站在红色旗帜前的人，"反对(anti-)"
    <tspan x="50" dy="25">共产主义(communist)，他举着反对的标语。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was known as an anti-communist during the Cold War.
  </text>
  <text x="50" y="310" class="content">
    在冷战期间，他以反共主义者而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red flag -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#E74C3C" />
    <text x="50" y="100" class="content" fill="#FFFFFF">Communist</text>
    <!-- Person with anti-sign -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <text x="210" y="140" class="content" fill="#000000">Anti</text>
  </g>
</svg>