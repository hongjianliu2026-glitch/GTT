<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maneuvering</text>
  <text x="50" y="120" class="subtitle">[məˈnuːvərɪŋ] n. 操纵，策略；v. 操纵，移动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man (手) + euv (移动) + er (做) + ing (进行中)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在用双手"操纵(man-euver)"
    <tspan x="50" dy="25">一辆巨大的战车，战车在他的操控下灵活移动，</tspan>
    <tspan x="50" dy="25">这就是maneuvering的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The captain's skillful maneuvering of the ship saved us from the storm.
  </text>
  <text x="50" y="310" class="content">
    船长熟练的操纵使我们免于风暴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hands -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <!-- Chariot -->
    <rect x="120" y="20" width="200" height="100" class="image" />
    <line x1="120" y1="20" x2="120" y2="120" class="image" />
    <line x1="320" y1="20" x2="320" y2="120" class="image" />
    <line x1="120" y1="120" x2="320" y2="120" class="image" />
    <!-- Wheels -->
    <circle cx="150" cy="120" r="20" class="image" />
    <circle cx="290" cy="120" r="20" class="image" />
  </g>
</svg>