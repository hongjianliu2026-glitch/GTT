<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">team</text>
  <text x="50" y="120" class="subtitle">[tiːm] n. 团队，队伍；v. 使合作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> te- (一起) + am (爱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"一起(te-)"为了共同的目标"爱(am)"
    <tspan x="50" dy="25">而努力，他们就组成了一个团队(team)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Our team won the championship last year.
  </text>
  <text x="50" y="310" class="content">
    我们的团队去年赢得了冠军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Team members -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Connecting lines -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
    <!-- Heart symbol -->
    <path d="M100,150 C120,130 180,130 200,150" class="image" />
    <path d="M100,150 C120,170 180,170 200,150" class="image" />
  </g>
</svg>