<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sieve</text>
  <text x="50" y="120" class="subtitle">[sɪv] n. 筛子；v. 筛，过滤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> siev (筛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的筛子，"筛(siev)"
    <tspan x="50" dy="25">子在空中旋转，将杂质和细小的颗粒分离出来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a sieve to separate the flour from the lumps.
  </text>
  <text x="50" y="310" class="content">
    她用筛子把面粉和块状物分开。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sieve -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Holes in the sieve -->
    <circle cx="80" cy="50" r="5" class="image" />
    <circle cx="120" cy="50" r="5" class="image" />
    <circle cx="160" cy="50" r="5" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
    <circle cx="240" cy="50" r="5" class="image" />
    <circle cx="80" cy="80" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <circle cx="160" cy="80" r="5" class="image" />
    <circle cx="200" cy="80" r="5" class="image" />
    <circle cx="240" cy="80" r="5" class="image" />
    <circle cx="80" cy="110" r="5" class="image" />
    <circle cx="120" cy="110" r="5" class="image" />
    <circle cx="160" cy="110" r="5" class="image" />
    <circle cx="200" cy="110" r="5" class="image" />
    <circle cx="240" cy="110" r="5" class="image" />
    <circle cx="80" cy="140" r="5" class="image" />
    <circle cx="120" cy="140" r="5" class="image" />
    <circle cx="160" cy="140" r="5" class="image" />
    <circle cx="200" cy="140" r="5" class="image" />
    <circle cx="240" cy="140" r="5" class="image" />
  </g>
</svg>