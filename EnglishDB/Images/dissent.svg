<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dissent</text>
  <text x="50" y="120" class="subtitle">[dɪˈsent] n. 异议，不同意；v. 不同意，持异议</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + sent (感觉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在讨论，其中一个人"感觉不同(dis-sent)"，
    <tspan x="50" dy="25">于是他站起来表达异议(dissent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The majority agreed, but one member dissented.
  </text>
  <text x="50" y="310" class="content">
    大多数人同意，但有一名成员持异议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Dissenter -->
    <circle cx="350" cy="50" r="20" class="image" />
    <line x1="350" y1="70" x2="350" y2="120" class="image" />
    <line x1="350" y1="120" x2="330" y2="150" class="image" />
    <line x1="350" y1="120" x2="370" y2="150" class="image" />
    <line x1="350" y1="90" x2="380" y2="80" class="image" />
    <!-- Speech bubble -->
    <path d="M380,30 Q420,30 420,70 Q420,110 380,110 Q340,110 340,70 Q340,30 380,30" class="image" />
    <text x="385" y="80" class="content" text-anchor="middle">异议</text>
  </g>
</svg>