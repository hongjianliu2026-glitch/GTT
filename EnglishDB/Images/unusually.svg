<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unusually</text>
  <text x="50" y="120" class="subtitle">[ʌnˈjuːʒuəli] adv. 不寻常地，异乎寻常地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + usual (通常的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"不(un-)"寻常的"通常(usual)"场景，
    <tspan x="50" dy="25">比如一只猫在弹钢琴，这就是"异乎寻常地(unusually)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat played the piano unusually well.
  </text>
  <text x="50" y="310" class="content">
    这只猫弹钢琴弹得异乎寻常地好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Piano -->
    <rect x="100" y="80" width="200" height="100" class="image" />
    <line x1="120" y1="100" x2="120" y2="160" class="image" />
    <line x1="140" y1="100" x2="140" y2="160" class="image" />
    <line x1="160" y1="100" x2="160" y2="160" class="image" />
    <line x1="180" y1="100" x2="180" y2="160" class="image" />
    <line x1="200" y1="100" x2="200" y2="160" class="image" />
    <line x1="220" y1="100" x2="220" y2="160" class="image" />
    <!-- Cat playing piano -->
    <line x1="50" y1="140" x2="120" y2="130" class="image" />
  </g>
</svg>