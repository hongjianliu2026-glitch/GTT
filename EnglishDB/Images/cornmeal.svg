<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .corn { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cornmeal</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːrnmiːl] n. 玉米粉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> corn (玉米) + meal (粉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的玉米粒被磨成粉，"玉米(corn)"
    <tspan x="50" dy="25">变成了"粉(meal)"，这就是玉米粉(cornmeal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used cornmeal to make cornbread.
  </text>
  <text x="50" y="310" class="content">
    她用玉米粉做玉米面包。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Corn kernel -->
    <circle cx="50" cy="100" r="30" class="corn" />
    <!-- Grinder -->
    <rect x="100" y="80" width="100" height="40" class="image" />
    <!-- Cornmeal -->
    <rect x="220" y="90" width="50" height="20" class="corn" />
    <rect x="230" y="110" width="50" height="20" class="corn" />
    <rect x="240" y="130" width="50" height="20" class="corn" />
  </g>
</svg>