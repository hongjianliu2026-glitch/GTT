<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wavelength</text>
  <text x="50" y="120" class="subtitle">[ˈweɪvleŋθ] n. 波长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wave (波) + length (长度)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的波浪在海洋中翻滚，"波(wave)"
    <tspan x="50" dy="25">的长度(length)就是它的波长(wavelength)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wavelength of the radio signal is 2 meters.
  </text>
  <text x="50" y="310" class="content">
    这个无线电信号的波长是2米。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean wave -->
    <path d="M0 100 Q100 0 200 100 T400 100" class="image" />
    <path d="M0 100 Q100 200 200 100 T400 100" class="image" />
    <!-- Wave length measurement -->
    <line x1="0" y1="100" x2="400" y2="100" class="image" />
    <text x="200" y="120" class="content" text-anchor="middle">Wavelength</text>
  </g>
</svg>