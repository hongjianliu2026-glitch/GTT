<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">endow</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdaʊ] v. 捐赠，赋予</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + dow (给予)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个慷慨的捐赠者，"使(en-)"
    <tspan x="50" dy="25">给予(dow)财富或才能，这就是捐赠(endow)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The university was endowed with a large sum of money.
  </text>
  <text x="50" y="310" class="content">
    这所大学获得了一大笔捐赠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Donor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Money bag -->
    <rect x="50" y="80" width="30" height="40" class="image" />
    <line x1="65" y1="80" x2="65" y2="60" class="image" />
    <line x1="50" y1="80" x2="80" y2="80" class="image" />
    <line x1="50" y1="120" x2="80" y2="120" class="image" />
    <!-- University -->
    <rect x="100" y="80" width="100" height="80" class="image" />
    <line x1="100" y1="80" x2="200" y2="80" class="image" />
    <line x1="100" y1="160" x2="200" y2="160" class="image" />
    <line x1="100" y1="80" x2="100" y2="160" class="image" />
    <line x1="200" y1="80" x2="200" y2="160" class="image" />
  </g>
</svg>