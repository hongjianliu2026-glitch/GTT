<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relaxing</text>
  <text x="50" y="120" class="subtitle">[rɪˈlæksɪŋ] adj. 放松的，轻松的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + lax (放松)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在沙滩椅上，"再次放松(re-lax)"
    <tspan x="50" dy="25">自己，享受着海风和阳光，这就是放松的感觉(relaxing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beach is a perfect place for relaxing.
  </text>
  <text x="50" y="310" class="content">
    海滩是放松的完美场所。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beach chair -->
    <rect x="50" y="20" width="150" height="50" class="image" />
    <rect x="70" y="70" width="110" height="30" class="image" />
    <!-- Person -->
    <circle cx="125" cy="50" r="15" class="image" />
    <line x1="125" y1="65" x2="125" y2="90" class="image" />
    <line x1="125" y1="90" x2="110" y2="110" class="image" />
    <line x1="125" y1="90" x2="140" y2="110" class="image" />
    <line x1="125" y1="75" x2="150" y2="65" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Waves -->
    <path d="M50,150 Q100,100 150,150 Q200,200 250,150 Q300,100 350,150" class="image" />
  </g>
</svg>