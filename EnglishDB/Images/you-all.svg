<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">you-all</text>
  <text x="50" y="120" class="subtitle">[juː ɔːl] pron. 你们，大家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> you (你) + all (全部)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人站在一起，"你(you)"和"全部(all)"
    <tspan x="50" dy="25">的人都在这里，这就是"你们(you-all)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You-all should come to the party tonight.
  </text>
  <text x="50" y="310" class="content">
    你们今晚都应该来参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Arrows pointing to all -->
    <line x1="50" y1="70" x2="125" y2="120" class="image" />
    <line x1="100" y1="70" x2="125" y2="120" class="image" />
    <line x1="150" y1="70" x2="125" y2="120" class="image" />
    <line x1="200" y1="70" x2="125" y2="120" class="image" />
    <line x1="250" y1="70" x2="125" y2="120" class="image" />
    <!-- Text "all" -->
    <text x="110" y="140" class="highlight">all</text>
  </g>
</svg>