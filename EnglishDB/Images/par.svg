<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">par</text>
  <text x="50" y="120" class="subtitle">[pɑːr] n. 标准，同等；adj. 标准的，平价的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> par (平等，标准)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，两边的重量完全相等，这就是"平等(par)"的象征。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company aims to achieve par in gender representation.
  </text>
  <text x="50" y="310" class="content">
    公司旨在实现性别代表的平等。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Balance scale -->
    <line x1="100" y1="50" x2="300" y2="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="300" y1="50" x2="300" y2="150" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <!-- Weights -->
    <rect x="80" y="150" width="40" height="40" class="image" />
    <rect x="280" y="150" width="40" height="40" class="image" />
  </g>
</svg>