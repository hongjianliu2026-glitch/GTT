<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mister</text>
  <text x="50" y="120" class="subtitle">[ˈmɪstər] n. 先生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mister (源自拉丁语 "dominus"，意为"主人")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着西装的"主人(mister)"，
    <tspan x="50" dy="25">他站在门口，迎接客人，显得非常庄重和尊敬。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Mister Smith is our new teacher.
  </text>
  <text x="50" y="310" class="content">
    史密斯先生是我们的新老师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Suit -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Tie -->
    <line x1="75" y1="20" x2="75" y2="80" class="image" />
    <line x1="75" y1="50" x2="50" y2="35" class="image" />
    <line x1="75" y1="50" x2="100" y2="35" class="image" />
    <!-- Face -->
    <circle cx="75" cy="120" r="20" class="image" />
    <!-- Hair -->
    <line x1="60" y1="100" x2="90" y2="100" class="image" />
    <!-- Moustache -->
    <line x1="65" y1="125" x2="85" y2="125" class="image" />
  </g>
</svg>