<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hearty</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrti] adj. 热情的，衷心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heart (心) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用他的"心(heart)"去拥抱你，
    <tspan x="50" dy="25">这种热情和衷心的感觉就是hearty。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave him a hearty welcome.
  </text>
  <text x="50" y="310" class="content">
    她热情地欢迎他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 40 C10 10, 40 10, 40 40 S70 70, 40 100 S10 70, 10 40" class="image" fill="#E74C3C" />
    <!-- Arms -->
    <line x1="40" y1="100" x2="20" y2="130" class="image" />
    <line x1="40" y1="100" x2="60" y2="130" class="image" />
    <!-- Person -->
    <circle cx="40" cy="150" r="15" class="image" />
    <line x1="40" y1="165" x2="40" y2="200" class="image" />
    <line x1="40" y1="200" x2="20" y2="230" class="image" />
    <line x1="40" y1="200" x2="60" y2="230" class="image" />
    <line x1="40" y1="180" x2="70" y2="170" class="image" />
  </g>
</svg>