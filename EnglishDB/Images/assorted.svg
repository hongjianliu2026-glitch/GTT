<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">assorted</text>
  <text x="50" y="120" class="subtitle">[əˈsɔːrtɪd] adj. 各种各样的，混杂的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> as- (朝向) + sort (种类)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的盒子，里面装满了各种形状、颜色和大小的物品，
    <tspan x="50" dy="25">"朝向(as-)"不同的"种类(sort)"，这就是"混杂的(assorted)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gift shop had an assorted collection of souvenirs.
  </text>
  <text x="50" y="310" class="content">
    礼品店有各种各样的纪念品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Items -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <polygon points="170,50 200,30 230,50 200,70" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <rect x="300" y="30" width="40" height="40" class="image" />
    <polygon points="50,150 80,130 110,150 80,170" class="image" />
    <circle cx="150" cy="150" r="20" class="image" />
    <rect x="200" y="130" width="40" height="40" class="image" />
    <polygon points="270,150 300,130 330,150 300,170" class="image" />
  </g>
</svg>