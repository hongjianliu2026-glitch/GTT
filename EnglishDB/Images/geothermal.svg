<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .earth { fill: #8D4500; }
      .steam { fill: #F1C40F; opacity: 0.7; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">geothermal</text>
  <text x="50" y="120" class="subtitle">[ˌdʒiːoʊˈθɜːrməl] adj. 地热的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> geo- (地球) + therm (热)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象地球(geo)深处有一个巨大的热源(therm)，
    <tspan x="50" dy="25">它不断释放出热能，这就是地热(geothermal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The geothermal power plant harnesses energy from the Earth's core.
  </text>
  <text x="50" y="310" class="content">
    地热发电厂利用地球核心的能量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="80" class="earth" />
    <!-- Steam -->
    <ellipse cx="100" cy="50" rx="50" ry="20" class="steam" />
    <ellipse cx="120" cy="30" rx="40" ry="15" class="steam" />
    <ellipse cx="80" cy="30" rx="40" ry="15" class="steam" />
    <!-- Heat source -->
    <circle cx="100" cy="120" r="10" class="image" fill="#E74C3C" />
    <text x="90" y="140" class="content" fill="#E74C3C">热源</text>
  </g>
</svg>