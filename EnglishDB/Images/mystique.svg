<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mystique</text>
  <text x="50" y="120" class="subtitle">[mɪˈstiːk] n. 神秘，奥秘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> myst (神秘) + -ique (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的仪式，"神秘(myst)"
    <tspan x="50" dy="25">的面纱笼罩着一切，让人感到无比的奥秘(mystique)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient temple held a certain mystique that intrigued visitors.
  </text>
  <text x="50" y="310" class="content">
    这座古老的神庙有一种吸引游客的神秘感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mystical veil -->
    <path d="M0 0 Q200 100 400 0" class="image" />
    <path d="M0 50 Q200 150 400 50" class="image" />
    <path d="M0 100 Q200 200 400 100" class="image" />
    <!-- Eye -->
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="10" class="image" fill="#333" />
    <!-- Hand -->
    <line x1="150" y1="150" x2="100" y2="200" class="image" />
    <line x1="150" y1="150" x2="200" y2="200" class="image" />
    <line x1="150" y1="150" x2="250" y2="200" class="image" />
  </g>
</svg>