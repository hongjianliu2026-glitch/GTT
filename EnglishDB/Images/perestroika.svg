<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perestroika</text>
  <text x="50" y="120" class="subtitle">[ˌpɛrəˈstrɔɪkə] n. 改革，重建</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + e- (向外) + stroy (建造)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的建筑工地，工人们正在"完全向外建造(per-e-stroy)"
    <tspan x="50" dy="25">新的结构，象征着彻底的改革和重建(perestroika)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The perestroika in the Soviet Union led to significant changes.
  </text>
  <text x="50" y="310" class="content">
    苏联的改革导致了重大变化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Construction site -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Building outline -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Workers -->
    <circle cx="80" cy="100" r="15" class="image" />
    <line x1="80" y1="115" x2="80" y2="150" class="image" />
    <line x1="80" y1="150" x2="60" y2="180" class="image" />
    <line x1="80" y1="150" x2="100" y2="180" class="image" />
    <line x1="80" y1="130" x2="110" y2="120" class="image" />
    <!-- Tools -->
    <line x1="150" y1="100" x2="170" y2="120" class="image" />
    <line x1="170" y1="120" x2="150" y2="140" class="image" />
    <line x1="220" y1="100" x2="240" y2="120" class="image" />
    <line x1="240" y1="120" x2="220" y2="140" class="image" />
  </g>
</svg>