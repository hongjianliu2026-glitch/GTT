<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yoga</text>
  <text x="50" y="120" class="subtitle">[ˈjoʊɡə] n. 瑜伽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> yuj (结合) + -a (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在练习瑜伽，通过各种姿势"结合(yuj)"身体与心灵，
    <tspan x="50" dy="25">达到身心合一的境界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She practices yoga every morning to relax.
  </text>
  <text x="50" y="310" class="content">
    她每天早上练习瑜伽来放松。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Yoga mat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person in yoga pose -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="120" class="image" />
    <line x1="175" y1="150" x2="200" y2="120" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
  </g>
</svg>