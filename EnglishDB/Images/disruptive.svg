<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disruptive</text>
  <text x="50" y="120" class="subtitle">[dɪsˈrʌptɪv] adj. 破坏性的，扰乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + rupt (打破)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"分开并打破(dis-rupt)"
    <tspan x="50" dy="25">一切，这种力量是极具破坏性的(disruptive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The disruptive behavior of the students caused the class to be canceled.
  </text>
  <text x="50" y="310" class="content">
    学生们的破坏性行为导致课程被取消。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="0" y2="200" class="image" />
    <line x1="0" y1="200" x2="0" y2="150" class="image" />
    <line x1="0" y1="150" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <!-- Broken objects -->
    <line x1="200" y1="50" x2="250" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="50" class="image" />
    <line x1="200" y1="150" x2="250" y2="200" class="image" />
    <line x1="200" y1="200" x2="250" y2="150" class="image" />
  </g>
</svg>