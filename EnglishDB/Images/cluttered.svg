<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cluttered</text>
  <text x="50" y="120" class="subtitle">[ˈklʌtərd] adj. 杂乱的，凌乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clud (关闭) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间，"关闭(clud)"了太多东西，
    <tspan x="50" dy="25">导致空间被"杂乱(cluttered)"地填满。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The desk was cluttered with papers and books.
  </text>
  <text x="50" y="310" class="content">
    桌子上堆满了纸张和书籍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Desk -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Papers -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Books -->
    <rect x="80" y="60" width="30" height="40" class="image" />
    <rect x="120" y="60" width="30" height="40" class="image" />
    <rect x="160" y="60" width="30" height="40" class="image" />
    <rect x="200" y="60" width="30" height="40" class="image" />
    <rect x="240" y="60" width="30" height="40" class="image" />
  </g>
</svg>