<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3F51B5; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mysteriously</text>
  <text x="50" y="120" class="subtitle">[mɪˈstɪəriəsli] adv. 神秘地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> myster (神秘) + -iou (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着面具的人，"神秘地(mysteriously)"
    <tspan x="50" dy="25">出现在一个昏暗的房间里，周围充满了未知的气息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The door closed mysteriously behind him.
  </text>
  <text x="50" y="310" class="content">
    门在他身后神秘地关上了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Masked person -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="210" class="image" />
    <line x1="100" y1="180" x2="130" y2="210" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <!-- Mask -->
    <rect x="70" y="70" width="60" height="20" class="image" />
    <line x1="80" y1="70" x2="80" y2="90" class="image" />
    <line x1="120" y1="70" x2="120" y2="90" class="image" />
    <!-- Dark atmosphere -->
    <circle cx="200" cy="100" r="50" class="image" />
    <circle cx="250" cy="150" r="40" class="image" />
    <circle cx="300" cy="100" r="30" class="image" />
  </g>
</svg>