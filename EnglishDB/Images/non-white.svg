<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">non-white</text>
  <text x="50" y="120" class="subtitle">[nɒn waɪt] adj. 非白色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> non- (非) + white (白色)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调色板上，"非白色(non-white)"
    <tspan x="50" dy="25">的颜料占据了大部分空间，象征着多样性和丰富性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The art gallery featured non-white paintings from various cultures.
  </text>
  <text x="50" y="310" class="content">
    艺术馆展出了来自不同文化的非白色画作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Palette -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Colors -->
    <rect x="50" y="20" width="50" height="50" fill="#FF5733" />
    <rect x="120" y="20" width="50" height="50" fill="#33FF57" />
    <rect x="190" y="20" width="50" height="50" fill="#3357FF" />
    <rect x="260" y="20" width="50" height="50" fill="#FF33A6" />
    <rect x="50" y="90" width="50" height="50" fill="#A633FF" />
    <rect x="120" y="90" width="50" height="50" fill="#FFA633" />
    <rect x="190" y="90" width="50" height="50" fill="#33A6FF" />
    <rect x="260" y="90" width="50" height="50" fill="#A6FF33" />
  </g>
</svg>