<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">studio</text>
  <text x="50" y="120" class="subtitle">[ˈstjuːdioʊ] n. 工作室，画室，摄影室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stud (学习) + -io (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在一个"学习(stud)"的地方，
    <tspan x="50" dy="25">这个场所就是他的工作室(studio)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spends most of her time in her photography studio.
  </text>
  <text x="50" y="310" class="content">
    她大部分时间都在她的摄影工作室里度过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Studio room -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Artist -->
    <circle cx="80" cy="100" r="15" class="image" />
    <line x1="80" y1="115" x2="80" y2="150" class="image" />
    <line x1="80" y1="150" x2="60" y2="180" class="image" />
    <line x1="80" y1="150" x2="100" y2="180" class="image" />
    <line x1="80" y1="130" x2="110" y2="120" class="image" />
    <!-- Art tools -->
    <line x1="150" y1="50" x2="180" y2="50" class="image" />
    <line x1="150" y1="80" x2="180" y2="80" class="image" />
    <line x1="150" y1="110" x2="180" y2="110" class="image" />
    <line x1="150" y1="140" x2="180" y2="140" class="image" />
    <!-- Canvas -->
    <rect x="200" y="50" width="100" height="100" class="image" />
  </g>
</svg>