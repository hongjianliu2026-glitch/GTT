<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">armor</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrmər] n. 盔甲，装甲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arm (武器) + -or (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个中世纪的骑士，身穿厚重的"武器(arm)"
    <tspan x="50" dy="25">装备(armor)，准备迎接战斗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The knight wore a suit of armor to protect himself.
  </text>
  <text x="50" y="310" class="content">
    骑士穿上盔甲以保护自己。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Armor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Helmet -->
    <rect x="150" y="20" width="50" height="30" class="image" />
    <!-- Chest plate -->
    <rect x="120" y="60" width="110" height="80" class="image" />
    <!-- Shoulder plates -->
    <rect x="100" y="60" width="20" height="50" class="image" />
    <rect x="230" y="60" width="20" height="50" class="image" />
    <!-- Gloves -->
    <rect x="110" y="150" width="30" height="30" class="image" />
    <rect x="210" y="150" width="30" height="30" class="image" />
    <!-- Leg armor -->
    <rect x="130" y="190" width="40" height="60" class="image" />
    <rect x="180" y="190" width="40" height="60" class="image" />
  </g>
</svg>