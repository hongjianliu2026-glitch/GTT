<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exert</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzɜːrt] v. 施加，运用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + ert (产生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用力推开一扇门，"向外产生(ex-ert)"
    <tspan x="50" dy="25">力量，这就是施加(exert)力量的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She exerted all her strength to lift the heavy box.
  </text>
  <text x="50" y="310" class="content">
    她用尽全力抬起那个沉重的箱子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Person pushing the door -->
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="250" y1="170" x2="250" y2="250" class="image" />
    <line x1="250" y1="250" x2="220" y2="280" class="image" />
    <line x1="250" y1="250" x2="280" y2="280" class="image" />
    <line x1="250" y1="200" x2="200" y2="180" class="image" />
    <!-- Hand pushing the door -->
    <line x1="250" y1="180" x2="200" y2="160" class="image" />
  </g>
</svg>