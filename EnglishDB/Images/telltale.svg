<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">telltale</text>
  <text x="50" y="120" class="subtitle">[ˈtɛltel] n. 告密者，迹象；adj. 泄露内情的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tell (说) + tale (故事)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的房间里，一个"说故事(tell-tale)"的
    <tspan x="50" dy="25">告密者(telltale)，他的话语泄露了房间的秘密。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The telltale signs of stress were visible on her face.
  </text>
  <text x="50" y="310" class="content">
    她脸上的压力迹象显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Window -->
    <rect x="250" y="100" width="50" height="50" class="image" />
    <!-- Telltale -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M 80 80 Q 150 80 150 120 Q 150 160 80 160 Q 50 160 50 130 Z" class="image" />
    <text x="90" y="110" class="content">秘密</text>
  </g>
</svg>