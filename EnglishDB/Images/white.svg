<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F0F8FF; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">white</text>
  <text x="50" y="120" class="subtitle">[waɪt] adj. 白色的，纯洁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *hwitaz，意为“明亮”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片洁白的雪花飘落在纯净的雪地上，
    <tspan x="50" dy="25">整个世界都被“明亮(white)”的白色所覆盖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a white dress to the wedding.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件白色的礼服去参加婚礼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowflake -->
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <line x1="150" y1="125" x2="200" y2="125" class="image" />
    <line x1="160" y1="115" x2="190" y2="135" class="image" />
    <line x1="160" y1="135" x2="190" y2="115" class="image" />
    <!-- Snowfield -->
    <rect x="100" y="150" width="150" height="50" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="125" r="25" class="image" />
  </g>
</svg>