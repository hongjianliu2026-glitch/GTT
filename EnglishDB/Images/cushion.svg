<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cushion { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cushion</text>
  <text x="50" y="120" class="subtitle">[ˈkʊʃən] n. 垫子，坐垫；v. 缓冲，减轻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cush (软) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个柔软的垫子(cushion)，它像一个"软软的(cush)"
    <tspan x="50" dy="25">保护层，可以缓冲冲击，减轻压力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sat on a cushion to make herself more comfortable.
  </text>
  <text x="50" y="310" class="content">
    她坐在垫子上以使自己更舒适。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cushion -->
    <rect x="0" y="0" width="350" height="200" class="cushion" />
    <!-- Person sitting -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="230" class="image" />
    <line x1="175" y1="200" x2="195" y2="230" class="image" />
    <line x1="175" y1="180" x2="205" y2="170" class="image" />
  </g>
</svg>