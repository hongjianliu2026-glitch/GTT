<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nervous</text>
  <text x="50" y="120" class="subtitle">[ˈnɜːrvəs] adj. 紧张的，神经质的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nerv (神经) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为紧张，神经(nerv)绷得紧紧的，
    <tspan x="50" dy="25">就像一根拉紧的弦，随时可能断裂。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was nervous before the big presentation.
  </text>
  <text x="50" y="310" class="content">
    她在大型演讲前感到紧张。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nervous person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <line x1="50" y1="150" x2="0" y2="140" class="image" />
    <!-- Tight string -->
    <line x1="150" y1="100" x2="350" y2="100" class="image" />
    <circle cx="150" cy="100" r="5" class="image" />
    <circle cx="350" cy="100" r="5" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="350" y1="100" x2="350" y2="150" class="image" />
  </g>
</svg>