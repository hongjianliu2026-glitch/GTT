<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nightmarish</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪtmɛərɪʃ] adj. 噩梦般的，可怕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> night (夜晚) + mare (梦魇) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黑暗的夜晚，"梦魇(mare)"在夜空中盘旋，
    <tspan x="50" dy="25">整个场景如同噩梦(nightmare)般可怕(nightmarish)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The traffic jam was so nightmarish that we missed the flight.
  </text>
  <text x="50" y="310" class="content">
    交通堵塞如此可怕，以至于我们错过了航班。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#1B2631" />
    <!-- Moon -->
    <circle cx="50" cy="50" r="20" class="image" fill="#F4D03F" />
    <!-- Nightmare creature -->
    <circle cx="200" cy="100" r="30" class="image" fill="#85929E" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="170" y2="140" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
  </g>
</svg>