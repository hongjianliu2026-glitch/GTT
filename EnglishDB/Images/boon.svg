<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boon</text>
  <text x="50" y="120" class="subtitle">[buːn] n. 恩惠，福利</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boon (源自中古英语 bon, 意为“好”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的“好(boon)”字从天而降，
    <tspan x="50" dy="25">带来无尽的恩惠和福利，让人们欢呼雀跃。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new hospital was a boon to the community.
  </text>
  <text x="50" y="310" class="content">
    新医院对社区来说是一个福音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- "好" character falling from the sky -->
    <text x="150" y="100" font-size="100" fill="#FFD700" class="image">好</text>
    <!-- People cheering -->
    <circle cx="50" cy="250" r="15" class="image" fill="#F1C40F" />
    <circle cx="100" cy="250" r="15" class="image" fill="#F1C40F" />
    <circle cx="150" cy="250" r="15" class="image" fill="#F1C40F" />
    <line x1="50" y1="265" x2="50" y2="300" class="image" />
    <line x1="100" y1="265" x2="100" y2="300" class="image" />
    <line x1="150" y1="265" x2="150" y2="300" class="image" />
    <line x1="50" y1="300" x2="30" y2="330" class="image" />
    <line x1="50" y1="300" x2="70" y2="330" class="image" />
    <line x1="100" y1="300" x2="80" y2="330" class="image" />
    <line x1="100" y1="300" x2="120" y2="330" class="image" />
    <line x1="150" y1="300" x2="130" y2="330" class="image" />
    <line x1="150" y1="300" x2="170" y2="330" class="image" />
  </g>
</svg>