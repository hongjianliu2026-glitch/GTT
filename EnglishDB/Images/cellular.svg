<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cellular</text>
  <text x="50" y="120" class="subtitle">[ˈsɛljələr] adj. 细胞的，蜂窝状的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cell (细胞) + -ular (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蜂窝，每个小格子都是一个细胞(cell)，
    <tspan x="50" dy="25">整个蜂窝就像一个巨大的细胞网络(cellular)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The human body is made up of billions of cellular units.
  </text>
  <text x="50" y="310" class="content">
    人体由数十亿个细胞单位组成。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hexagonal cells -->
    <polygon points="50,0 100,25 100,75 50,100 0,75 0,25" class="image" />
    <polygon points="150,0 200,25 200,75 150,100 100,75 100,25" class="image" />
    <polygon points="250,0 300,25 300,75 250,100 200,75 200,25" class="image" />
    <polygon points="50,125 100,150 100,200 50,225 0,200 0,150" class="image" />
    <polygon points="150,125 200,150 200,200 150,225 100,200 100,150" class="image" />
    <polygon points="250,125 300,150 300,200 250,225 200,200 200,150" class="image" />
  </g>
</svg>