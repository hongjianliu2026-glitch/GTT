<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antagonize</text>
  <text x="50" y="120" class="subtitle">[ænˈtæɡənaɪz] v. 激怒，对抗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (对抗) + agon (斗争)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，"对抗(anti-)"着，
    <tspan x="50" dy="25">他们的眼神中充满了"斗争(agon)"的火花，</tspan>
    <tspan x="50" dy="25">这就是"激怒(antagonize)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His rude comments antagonized the entire team.
  </text>
  <text x="50" y="310" class="content">
    他粗鲁的评论激怒了整个团队。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Arms and legs -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="240" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <line x1="35" y1="110" x2="45" y2="110" class="image" />
    <line x1="235" y1="110" x2="245" y2="110" class="image" />
    <!-- Spark between them -->
    <line x1="100" y1="90" x2="200" y2="90" class="image" />
    <line x1="100" y1="90" x2="120" y2="80" class="image" />
    <line x1="100" y1="90" x2="120" y2="100" class="image" />
    <line x1="200" y1="90" x2="180" y2="80" class="image" />
    <line x1="200" y1="90" x2="180" y2="100" class="image" />
  </g>
</svg>