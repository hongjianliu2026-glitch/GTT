<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cosmic</text>
  <text x="50" y="120" class="subtitle">[ˈkɒzmɪk] adj. 宇宙的，广大无边的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cosmo- (宇宙) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宇宙飞船，"宇宙(cosmo-)"
    <tspan x="50" dy="25">在无边的星空中航行，这就是"宇宙的(cosmic)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cosmic event was observed by astronomers.
  </text>
  <text x="50" y="310" class="content">
    天文学家观测到了这次宇宙事件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Space background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#0C343D" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="3" fill="white" />
    <circle cx="100" cy="30" r="3" fill="white" />
    <circle cx="150" cy="70" r="3" fill="white" />
    <circle cx="200" cy="40" r="3" fill="white" />
    <circle cx="250" cy="60" r="3" fill="white" />
    <circle cx="300" cy="80" r="3" fill="white" />
    <!-- Spaceship -->
    <polygon points="150,100 200,100 225,150 175,150" fill="#A9CCE3" />
    <rect x="170" y="100" width="30" height="20" fill="#A9CCE3" />
    <circle cx="185" cy="110" r="5" fill="#F1C40F" />
  </g>
</svg>