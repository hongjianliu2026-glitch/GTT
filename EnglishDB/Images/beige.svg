<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5DC; }
      .title { font: bold 48px sans-serif; fill: #8B5A2B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: #F5F5DC; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beige</text>
  <text x="50" y="120" class="subtitle">[beɪʒ] n. 米色，浅褐色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自法语 "beige"，意为未染色的羊毛。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只未染色的羊毛，呈现出自然的浅褐色(beige)，
    <tspan x="50" dy="25">这种颜色温暖而柔和，就像羊毛本身一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She chose a beige sweater for the autumn day.
  </text>
  <text x="50" y="310" class="content">
    她为秋日选择了一件米色毛衣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wool ball -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Sheep -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
  </g>
</svg>