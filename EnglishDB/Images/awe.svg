<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">awe</text>
  <text x="50" y="120" class="subtitle">[ɔː] n. 敬畏，惊叹；v. 使敬畏，使惊叹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (强调) + we (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在壮丽的自然景观前，"强调地看着(a-we)"
    <tspan x="50" dy="25">眼前的景象，心中充满了敬畏(awe)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sight of the majestic mountains filled her with awe.
  </text>
  <text x="50" y="310" class="content">
    壮丽的山脉景象使她充满了敬畏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountains -->
    <polygon points="0,150 100,0 200,150" class="image" />
    <polygon points="50,150 150,50 250,150" class="image" />
    <!-- Person -->
    <circle cx="125" cy="170" r="15" class="image" />
    <line x1="125" y1="185" x2="125" y2="220" class="image" />
    <line x1="125" y1="220" x2="105" y2="250" class="image" />
    <line x1="125" y1="220" x2="145" y2="250" class="image" />
    <line x1="125" y1="200" x2="155" y2="190" class="image" />
    <!-- Eyes -->
    <circle cx="115" cy="165" r="3" class="image" />
    <circle cx="135" cy="165" r="3" class="image" />
  </g>
</svg>