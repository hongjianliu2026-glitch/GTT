<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">phone</text>
  <text x="50" y="120" class="subtitle">[foʊn] n. 电话，电话机；v. 打电话</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> phon (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的电话机，"发出声音(phon)"
    <tspan x="50" dy="25">通过电线传递信息，这就是电话(phone)的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She picked up the phone and dialed his number.
  </text>
  <text x="50" y="310" class="content">
    她拿起电话，拨了他的号码。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Phone -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <rect x="20" y="20" width="160" height="60" class="image" />
    <circle cx="100" cy="80" r="10" class="image" />
    <line x1="100" y1="90" x2="100" y2="100" class="image" />
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
  </g>
</svg>