<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">integration</text>
  <text x="50" y="120" class="subtitle">[ˌɪntɪˈɡreɪʃn] n. 整合，一体化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> integr (整体) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拼图，"将所有部分(integr)"
    <tspan x="50" dy="25">拼合在一起，形成一个完整的画面(integration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The integration of new technology has improved efficiency.
  </text>
  <text x="50" y="310" class="content">
    新技术的整合提高了效率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="110" y="0" width="100" height="100" class="image" />
    <rect x="220" y="0" width="100" height="100" class="image" />
    <rect x="0" y="110" width="100" height="100" class="image" />
    <rect x="110" y="110" width="100" height="100" class="image" />
    <rect x="220" y="110" width="100" height="100" class="image" />
    <!-- Completed puzzle -->
    <rect x="0" y="220" width="320" height="100" class="image" />
    <!-- Connecting lines -->
    <line x1="100" y1="0" x2="110" y2="0" class="image" />
    <line x1="210" y1="0" x2="220" y2="0" class="image" />
    <line x1="100" y1="100" x2="110" y2="100" class="image" />
    <line x1="210" y1="100" x2="220" y2="100" class="image" />
    <line x1="0" y1="100" x2="0" y2="110" class="image" />
    <line x1="100" y1="100" x2="100" y2="110" class="image" />
    <line x1="200" y1="100" x2="200" y2="110" class="image" />
    <line x1="300" y1="100" x2="300" y2="110" class="image" />
  </g>
</svg>