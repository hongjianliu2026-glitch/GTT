<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">massive</text>
  <text x="50" y="120" class="subtitle">[ˈmæsɪv] adj. 巨大的，大量的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mass (块，堆) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的山，"堆(mass)"
    <tspan x="50" dy="25">积成了一座山，这座山就是massive的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The earthquake caused a massive landslide.
  </text>
  <text x="50" y="310" class="content">
    地震引发了一场巨大的山体滑坡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Clouds -->
    <ellipse cx="150" cy="50" rx="100" ry="30" class="image" />
    <ellipse cx="250" cy="70" rx="80" ry="25" class="image" />
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="image" />
  </g>
</svg>