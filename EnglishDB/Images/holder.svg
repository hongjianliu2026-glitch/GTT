<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">holder</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊldər] n. 持有者，支架</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hold (持有) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手，"持有(hold)"
    <tspan x="50" dy="25">着一个闪闪发光的奖杯，这个手就是奖杯的持有者(holder)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is the holder of the world record in swimming.
  </text>
  <text x="50" y="310" class="content">
    他是游泳世界纪录的保持者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant hand -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="300" y2="100" class="image" />
    <!-- Trophy -->
    <rect x="150" y="120" width="100" height="150" class="image" />
    <line x1="200" y1="120" x2="200" y2="70" class="image" />
    <line x1="180" y1="70" x2="220" y2="70" class="image" />
    <line x1="200" y1="70" x2="200" y2="50" class="image" />
    <circle cx="200" cy="40" r="10" class="image" />
  </g>
</svg>