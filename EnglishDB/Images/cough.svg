<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cough</text>
  <text x="50" y="120" class="subtitle">[kɔːf] n. 咳嗽；v. 咳嗽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "cough"，与古英语 "cofian" 相关
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然"咳嗽(cough)"，
    <tspan x="50" dy="25">声音像是从喉咙深处爆发出来，</tspan>
    <tspan x="50" dy="25">整个身体都在震动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He couldn't stop coughing during the meeting.
  </text>
  <text x="50" y="310" class="content">
    他在会议上不停地咳嗽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Mouth -->
    <rect x="70" y="120" width="60" height="20" class="image" />
    <!-- Coughing effect -->
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
  </g>
</svg>