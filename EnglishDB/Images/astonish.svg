<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">astonish</text>
  <text x="50" y="120" class="subtitle">[əˈstɑːnɪʃ] v. 使惊讶，使震惊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + ston (石头) + -ish (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被一块巨大的石头"砸中(ston)"，
    <tspan x="50" dy="25">他的表情"加强(a-)"了惊讶的程度，</tspan>
    <tspan x="50" dy="25">这就是"使惊讶(astonish)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician's trick astonished the audience.
  </text>
  <text x="50" y="310" class="content">
    魔术师的把戏让观众大吃一惊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Stone -->
    <rect x="100" y="80" width="100" height="100" class="image" />
    <!-- Exclamation marks -->
    <text x="220" y="120" class="image" font-size="48">!</text>
    <text x="240" y="160" class="image" font-size="48">!</text>
    <text x="260" y="200" class="image" font-size="48">!</text>
  </g>
</svg>