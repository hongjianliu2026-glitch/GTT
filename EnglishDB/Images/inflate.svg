<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inflate</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfleɪt] v. 充气，膨胀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + flate (吹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球，"吹入(in-flate)"
    <tspan x="50" dy="25">空气后，气球迅速膨胀(inflate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He inflated the balloon for the party.
  </text>
  <text x="50" y="310" class="content">
    他为派对给气球充了气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF6F61" />
    <!-- Inflating air -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="200" class="image" />
    <line x1="100" y1="250" x2="150" y2="200" class="image" />
    <!-- Inflating action -->
    <rect x="150" y="50" width="100" height="100" class="image" fill="#FFD166" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="150" y2="100" class="image" />
    <line x1="200" y1="150" x2="250" y2="100" class="image" />
  </g>
</svg>