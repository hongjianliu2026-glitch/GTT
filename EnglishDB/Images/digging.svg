<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">digging</text>
  <text x="50" y="120" class="subtitle">[ˈdɪɡɪŋ] n. 挖掘，发掘；v. 挖掘，发掘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dig (挖) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着铲子，"正在挖(dig-ing)"
    <tspan x="50" dy="25">一个深深的洞，泥土四溅，这就是挖掘(digging)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The archaeologist spent hours digging in the field.
  </text>
  <text x="50" y="310" class="content">
    考古学家在田野里花了几个小时进行挖掘。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Shovel -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <!-- Dirt -->
    <circle cx="100" cy="160" r="10" class="image" />
    <circle cx="120" cy="165" r="10" class="image" />
    <circle cx="140" cy="170" r="10" class="image" />
    <!-- Person -->
    <circle cx="50" cy="80" r="15" class="image" />
    <line x1="50" y1="95" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="140" class="image" />
    <line x1="50" y1="120" x2="70" y2="140" class="image" />
    <line x1="50" y1="105" x2="80" y2="95" class="image" />
  </g>
</svg>