<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exceed</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsiːd] v. 超过，超越</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + ceed (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在跑道上，"向外走(ex-ceed)"
    <tspan x="50" dy="25">超过了其他人，成为了第一名。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His performance exceeded all expectations.
  </text>
  <text x="50" y="310" class="content">
    他的表现超出了所有人的预期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Runner -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Finish line -->
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <text x="310" y="100" class="content">Finish</text>
  </g>
</svg>