<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pre-emptive</text>
  <text x="50" y="120" class="subtitle">[prɪˈɛmptɪv] adj. 先发制人的，抢先的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + empt (拿) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在比赛开始前，"提前拿(pre-empt)"
    <tspan x="50" dy="25">到起跑线，抢先一步，这就是先发制人(pre-emptive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The general decided to take pre-emptive action to prevent the enemy's attack.
  </text>
  <text x="50" y="310" class="content">
    将军决定采取先发制人的行动，以防止敌人的攻击。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Starting line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Athlete -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Flag -->
    <line x1="300" y1="0" x2="300" y2="50" class="image" />
    <polygon points="290,50 310,50 300,70" class="image" />
  </g>
</svg>