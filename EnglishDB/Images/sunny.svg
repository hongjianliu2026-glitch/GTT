<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FFC107; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sunny</text>
  <text x="50" y="120" class="subtitle">[ˈsʌni] adj. 阳光充足的，晴朗的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阳光明媚的日子，太阳(sun)高高挂在天上，
    <tspan x="50" dy="25">整个世界都被温暖的阳光(sunny)照亮。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was a sunny day, perfect for a picnic.
  </text>
  <text x="50" y="310" class="content">
    那是一个阳光明媚的日子，非常适合野餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#FFD700" />
    <!-- Rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Landscape -->
    <rect x="0" y="200" width="200" height="100" fill="#7CFC00" />
    <!-- Tree -->
    <rect x="150" y="150" width="20" height="50" fill="#8B4513" />
    <circle cx="160" cy="140" r="30" fill="#228B22" />
  </g>
</svg>