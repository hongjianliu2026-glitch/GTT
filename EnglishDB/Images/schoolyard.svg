<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">schoolyard</text>
  <text x="50" y="120" class="subtitle">[ˈskuːlˌjɑːrd] n. 校园，操场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> school (学校) + yard (院子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满欢声笑语的校园，孩子们在"学校院子(school-yard)"里
    <tspan x="50" dy="25">奔跑玩耍，这里是他们快乐的天地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were playing in the schoolyard during recess.
  </text>
  <text x="50" y="310" class="content">
    孩子们在课间休息时在操场上玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- School building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Playground -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Children -->
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="120" cy="60" r="10" class="image" />
    <circle cx="160" cy="60" r="10" class="image" />
    <circle cx="200" cy="60" r="10" class="image" />
    <!-- Swing -->
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <!-- Slide -->
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
  </g>
</svg>