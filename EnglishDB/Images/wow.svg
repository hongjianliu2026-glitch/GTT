<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wow</text>
  <text x="50" y="120" class="subtitle">[waʊ] int. 哇，哇哦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无明显词根，拟声词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到惊人的景象，嘴巴张得大大的，发出"哇(wow)"的声音。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Wow, that's an amazing view!
  </text>
  <text x="50" y="310" class="content">
    哇，那景色真壮观！
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with open mouth -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="90" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="90" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <ellipse cx="50" cy="65" rx="15" ry="10" class="image" /> <!-- Open mouth -->
  </g>
</svg>