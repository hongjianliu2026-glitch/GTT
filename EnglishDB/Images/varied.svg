<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">varied</text>
  <text x="50" y="120" class="subtitle">[ˈvɛərid] adj. 多样的，不同的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vari (变化) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个五彩斑斓的调色板，"变化(vari)"
    <tspan x="50" dy="25">出各种颜色，这些颜色就构成了多样的(varied)世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The menu offers a varied selection of dishes.
  </text>
  <text x="50" y="310" class="content">
    菜单提供了多种多样的菜品选择。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Color palette -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" fill="#FF5733" />
    <circle cx="120" cy="100" r="30" fill="#33FF57" />
    <circle cx="190" cy="100" r="30" fill="#3357FF" />
    <circle cx="260" cy="100" r="30" fill="#FF33A6" />
    <circle cx="330" cy="100" r="30" fill="#A633FF" />
  </g>
</svg>