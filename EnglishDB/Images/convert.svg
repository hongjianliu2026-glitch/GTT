<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">convert</text>
  <text x="50" y="120" class="subtitle">[kənˈvɜːrt] v. 转换，改变</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (完全) + vert (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔法师挥动魔杖，"完全转动(con-vert)"
    <tspan x="50" dy="25">一个物体，使其变成另一种形态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He managed to convert the old barn into a cozy home.
  </text>
  <text x="50" y="310" class="content">
    他成功地将旧谷仓改造成了一个舒适的家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magic wand -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Object before conversion -->
    <rect x="120" y="80" width="50" height="50" class="image" />
    <!-- Object after conversion -->
    <rect x="180" y="80" width="50" height="50" class="image" />
    <line x1="180" y1="80" x2="230" y2="80" class="image" />
    <line x1="180" y1="130" x2="230" y2="130" class="image" />
    <line x1="180" y1="80" x2="180" y2="130" class="image" />
    <line x1="230" y1="80" x2="230" y2="130" class="image" />
  </g>
</svg>