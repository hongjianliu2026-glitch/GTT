<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">challenge</text>
  <text x="50" y="120" class="subtitle">[ˈtʃælɪndʒ] n. 挑战；v. 质疑，挑战</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chal (打击) + lenge (投掷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在擂台上，"投掷(lenge)"
    <tspan x="50" dy="25">拳头"打击(chal)"对手，这就是挑战(challenge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She accepted the challenge to climb the mountain.
  </text>
  <text x="50" y="310" class="content">
    她接受了攀登那座山的挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ring -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Fighter 1 -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="120" y1="130" x2="150" y2="120" class="image" />
    <!-- Fighter 2 -->
    <circle cx="230" cy="100" r="15" class="image" />
    <line x1="230" y1="115" x2="230" y2="150" class="image" />
    <line x1="230" y1="150" x2="210" y2="180" class="image" />
    <line x1="230" y1="150" x2="250" y2="180" class="image" />
    <line x1="230" y1="130" x2="200" y2="120" class="image" />
    <!-- Punch -->
    <line x1="120" y1="100" x2="230" y2="100" class="image" />
  </g>
</svg>