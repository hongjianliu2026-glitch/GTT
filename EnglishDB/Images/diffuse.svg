<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diffuse</text>
  <text x="50" y="120" class="subtitle">[dɪˈfjuːs] v. 扩散，传播；adj. 散开的，弥漫的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dif- (分开) + fus (流)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一团烟雾从烟囱中"分开流动(dif-fus)"，
    <tspan x="50" dy="25">逐渐扩散到整个房间，这就是扩散(diffuse)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scent of the perfume diffused throughout the room.
  </text>
  <text x="50" y="310" class="content">
    香水的香味弥漫了整个房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chimney -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <!-- Smoke -->
    <ellipse cx="50" cy="10" rx="30" ry="10" class="image" />
    <ellipse cx="70" cy="30" rx="40" ry="15" class="image" />
    <ellipse cx="90" cy="50" rx="50" ry="20" class="image" />
    <ellipse cx="110" cy="70" rx="60" ry="25" class="image" />
    <ellipse cx="130" cy="90" rx="70" ry="30" class="image" />
    <!-- Room -->
    <rect x="150" y="0" width="200" height="150" class="image" />
  </g>
</svg>