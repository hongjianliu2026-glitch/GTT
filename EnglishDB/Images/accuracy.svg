<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accuracy</text>
  <text x="50" y="120" class="subtitle">[ˈækjərəsi] n. 准确性，精确度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (朝向) + cur (关心) + -acy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个射手，"朝向(ac-)"目标，"关心(cur)"每一箭的"精确度(accuracy)"，
    <tspan x="50" dy="25">每一箭都正中靶心，这就是准确性(accuracy)的体现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accuracy of the missile system is impressive.
  </text>
  <text x="50" y="310" class="content">
    导弹系统的准确性令人印象深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Target -->
    <circle cx="175" cy="100" r="80" class="image" />
    <circle cx="175" cy="100" r="60" class="image" />
    <circle cx="175" cy="100" r="40" class="image" />
    <circle cx="175" cy="100" r="20" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="200" x2="175" y2="100" class="image" />
    <polygon points="45,200 55,200 50,190" class="image" />
  </g>
</svg>