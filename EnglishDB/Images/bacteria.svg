<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bacteria</text>
  <text x="50" y="120" class="subtitle">[bækˈtɪəriə] n. 细菌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bacter (棒) + -ia (表示状态或集合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微小的"棒状(bacter)"生物，它们聚集在一起，
    <tspan x="50" dy="25">形成了一个细菌的"集合(ia)"，这就是细菌(bacteria)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor found harmful bacteria in the water sample.
  </text>
  <text x="50" y="310" class="content">
    医生在水中样本中发现了有害细菌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bacteria shapes -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="80" x2="150" y2="80" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <line x1="200" y1="50" x2="300" y2="50" class="image" />
    <line x1="200" y1="80" x2="300" y2="80" class="image" />
    <line x1="200" y1="110" x2="300" y2="110" class="image" />
    <line x1="200" y1="140" x2="300" y2="140" class="image" />
    <!-- Bacteria cells -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
  </g>
</svg>