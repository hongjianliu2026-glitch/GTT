<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sleek</text>
  <text x="50" y="120" class="subtitle">[sliːk] adj. 光滑的，时髦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sli- (光滑) + ek (强调)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆光滑如丝的跑车，"光滑(sli-)"
    <tspan x="50" dy="25">的车身在阳光下闪闪发光，这就是"光滑(sleek)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car had a sleek, aerodynamic design.
  </text>
  <text x="50" y="310" class="content">
    这辆车有着光滑、流线型的设计。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Car windows -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Car wheels -->
    <circle cx="70" cy="130" r="20" class="image" />
    <circle cx="280" cy="130" r="20" class="image" />
    <!-- Sunlight reflection -->
    <line x1="10" y1="10" x2="340" y2="10" class="image" />
    <line x1="10" y1="30" x2="340" y2="30" class="image" />
    <line x1="10" y1="50" x2="340" y2="50" class="image" />
  </g>
</svg>