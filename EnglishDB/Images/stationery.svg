<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stationery</text>
  <text x="50" y="120" class="subtitle">[ˈsteɪʃənri] n. 文具</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> statio (站立) + -nary (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个文具店，各种文具"站立(statio)"在货架上，
    <tspan x="50" dy="25">等待被使用，这些文具就构成了文具(stationery)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a set of stationery for her new job.
  </text>
  <text x="50" y="310" class="content">
    她为新工作买了一套文具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shelf -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Pens -->
    <line x1="50" y1="20" x2="50" y2="80" class="image" />
    <line x1="70" y1="20" x2="70" y2="80" class="image" />
    <line x1="90" y1="20" x2="90" y2="80" class="image" />
    <!-- Notebooks -->
    <rect x="120" y="20" width="50" height="60" class="image" />
    <rect x="180" y="20" width="50" height="60" class="image" />
    <!-- Stapler -->
    <rect x="250" y="20" width="50" height="40" class="image" />
    <line x1="275" y1="60" x2="275" y2="80" class="image" />
  </g>
</svg>