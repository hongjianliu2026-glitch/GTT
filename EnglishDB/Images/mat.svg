<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mat</text>
  <text x="50" y="120" class="subtitle">[mæt] n. 垫子，席子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mat (来自古英语 mæt, 意为“垫子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的垫子(mat)，上面铺满了各种颜色的毛线，
    <tspan x="50" dy="25">就像一个五彩斑斓的毛线球，让人忍不住想坐上去。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She placed a mat at the entrance to wipe her shoes.
  </text>
  <text x="50" y="310" class="content">
    她在入口处放了一个垫子来擦鞋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mat -->
    <rect x="0" y="0" width="300" height="200" class="image" fill="#D2B48C" />
    <!-- Yarn balls -->
    <circle cx="50" cy="50" r="20" class="image" fill="#FF6347" />
    <circle cx="120" cy="80" r="25" class="image" fill="#32CD32" />
    <circle cx="200" cy="120" r="30" class="image" fill="#1E90FF" />
    <circle cx="280" cy="160" r="25" class="image" fill="#FFD700" />
  </g>
</svg>