<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">catch</text>
  <text x="50" y="120" class="subtitle">[kætʃ] v. 抓住，捕捉；n. 捕捉，陷阱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cat- (向下) + ch (抓住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫(cat)在空中"向下抓住(catch)"
    <tspan x="50" dy="25">一只飞翔的小鸟，这个动作就是捕捉(catch)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She managed to catch the ball before it hit the ground.
  </text>
  <text x="50" y="310" class="content">
    她在球落地前成功抓住了它。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Bird -->
    <circle cx="150" cy="80" r="15" class="image" />
    <line x1="150" y1="95" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <!-- Cat catching bird -->
    <line x1="50" y1="130" x2="150" y2="95" class="image" />
  </g>
</svg>