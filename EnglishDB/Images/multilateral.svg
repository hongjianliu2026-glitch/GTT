<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">multilateral</text>
  <text x="50" y="120" class="subtitle">[ˌmʌltiˈlætərəl] adj. 多边的，多国的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> multi- (多) + lateral (边的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的会议桌，周围坐满了来自不同国家的代表，
    <tspan x="50" dy="25">"多边(multi-lateral)"讨论着全球性问题。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The agreement was reached through multilateral negotiations.
  </text>
  <text x="50" y="310" class="content">
    该协议是通过多边谈判达成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chairs around the table -->
    <rect x="50" y="20" width="30" height="100" class="image" />
    <rect x="120" y="20" width="30" height="100" class="image" />
    <rect x="190" y="20" width="30" height="100" class="image" />
    <rect x="260" y="20" width="30" height="100" class="image" />
    <!-- Flags representing different countries -->
    <line x1="70" y1="130" x2="70" y2="180" class="image" />
    <line x1="140" y1="130" x2="140" y2="180" class="image" />
    <line x1="210" y1="130" x2="210" y2="180" class="image" />
    <line x1="280" y1="130" x2="280" y2="180" class="image" />
    <!-- Flags -->
    <rect x="65" y="130" width="10" height="50" class="image" />
    <rect x="135" y="130" width="10" height="50" class="image" />
    <rect x="205" y="130" width="10" height="50" class="image" />
    <rect x="275" y="130" width="10" height="50" class="image" />
  </g>
</svg>