<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humanize</text>
  <text x="50" y="120" class="subtitle">[ˈhjuːmənaɪz] v. 使人性化，使更有人情味</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> human (人) + -ize (使...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机器人被赋予了"人性(human)"，
    <tspan x="50" dy="25">它开始微笑、说话，变得更有"人情味(humanize)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new software is designed to humanize customer service interactions.
  </text>
  <text x="50" y="310" class="content">
    这款新软件旨在使客户服务互动更加人性化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="100" class="image" />
    <line x1="50" y1="90" x2="80" y2="100" class="image" />

    <!-- Humanized Robot -->
    <rect x="150" y="0" width="100" height="150" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="90" x2="170" y2="100" class="image" />
    <line x1="200" y1="90" x2="230" y2="100" class="image" />
    <circle cx="190" cy="40" r="5" class="image" />
    <circle cx="210" cy="40" r="5" class="image" />
    <path d="M190 60 Q200 70 210 60" class="image" />
  </g>
</svg>