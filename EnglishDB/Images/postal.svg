<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">postal</text>
  <text x="50" y="120" class="subtitle">[ˈpoʊstl] adj. 邮政的，邮局的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> post (邮政) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个邮递员骑着自行车，"邮政(post)"
    <tspan x="50" dy="25">穿梭在城市中，传递着信件和包裹，这就是"邮政的(postal)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The postal service is experiencing delays due to bad weather.
  </text>
  <text x="50" y="310" class="content">
    由于恶劣天气，邮政服务出现了延误。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mailbox -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="20" y="20" width="60" height="110" class="image" />
    <!-- Mail -->
    <rect x="30" y="30" width="40" height="20" class="image" />
    <rect x="30" y="60" width="40" height="20" class="image" />
    <rect x="30" y="90" width="40" height="20" class="image" />
    <!-- Postman -->
    <circle cx="150" cy="75" r="20" class="image" />
    <line x1="150" y1="95" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="130" y2="160" class="image" />
    <line x1="150" y1="130" x2="170" y2="160" class="image" />
    <line x1="150" y1="110" x2="180" y2="100" class="image" />
    <!-- Bicycle -->
    <rect x="180" y="120" width="100" height="20" class="image" />
    <line x1="180" y1="120" x2="230" y2="120" class="image" />
    <line x1="230" y1="120" x2="230" y2="140" class="image" />
    <line x1="230" y1="140" x2="210" y2="140" class="image" />
    <line x1="210" y1="140" x2="210" y2="160" class="image" />
    <line x1="210" y1="160" x2="190" y2="160" class="image" />
    <line x1="190" y1="160" x2="190" y2="140" class="image" />
    <line x1="190" y1="140" x2="170" y2="140" class="image" />
  </g>
</svg>