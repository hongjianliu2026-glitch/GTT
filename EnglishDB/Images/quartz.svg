<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .quartz { fill: #D4AF37; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quartz</text>
  <text x="50" y="120" class="subtitle">[kwɔːrtz] n. 石英</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自德语 "Quarz"，意为“石英”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块闪闪发光的石英(quartz)，它像一颗
    <tspan x="50" dy="25">金色的宝石，嵌在山脉中，反射着阳光，</tspan>
    <tspan x="50" dy="25">仿佛在诉说着大自然的奇迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The watch uses a quartz crystal to keep time accurately.
  </text>
  <text x="50" y="310" class="content">
    这块手表使用石英晶体来保持时间的准确性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Quartz crystal -->
    <polygon points="0,0 100,0 150,100 50,100" class="quartz" />
    <polygon points="0,0 -100,0 -150,100 -50,100" class="quartz" />
    <polygon points="0,0 0,100 100,150 100,50" class="quartz" />
    <polygon points="0,0 0,-100 -100,-150 -100,-50" class="quartz" />
    <!-- Sunlight reflection -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
  </g>
</svg>