<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fairway</text>
  <text x="50" y="120" class="subtitle">[ˈfɛrweɪ] n. 高尔夫球道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fair (公平的) + way (道路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个高尔夫球场，"公平的道路(fair-way)"
    <tspan x="50" dy="25">是每个球员都希望击球到达的地方，这就是高尔夫球道(fairway)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He aimed his shot directly at the fairway.
  </text>
  <text x="50" y="310" class="content">
    他瞄准了球道击球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Golf course -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fairway -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#8BC34A" />
    <!-- Golf ball -->
    <circle cx="150" cy="100" r="10" class="image" fill="#FFEB3B" />
    <!-- Golf club -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="130" class="image" />
    <line x1="200" y1="150" x2="220" y2="130" class="image" />
  </g>
</svg>