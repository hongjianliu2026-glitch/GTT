<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blush</text>
  <text x="50" y="120" class="subtitle">[blʌʃ] v. 脸红，羞愧；n. 脸红</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blu- (蓝色) + sh (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个害羞的女孩，她的脸颊因为羞愧而"变蓝(blu-sh)"，
    <tspan x="50" dy="25">但实际上是变成了红色，这就是脸红(blush)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She blushed when he complimented her.
  </text>
  <text x="50" y="310" class="content">
    当他夸奖她时，她脸红了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Blushing cheeks -->
    <circle cx="50" cy="130" r="20" class="image" fill="#FF6347" />
    <circle cx="150" cy="130" r="20" class="image" fill="#FF6347" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" />
  </g>
</svg>