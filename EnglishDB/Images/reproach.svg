<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reproach</text>
  <text x="50" y="120" class="subtitle">[rɪˈproʊtʃ] v. 责备，指责</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + proach (接近)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人再次"接近(proach)"你，但这次不是友好的问候，而是"责备(reproach)"的眼神。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His reproachful look made her feel guilty.
  </text>
  <text x="50" y="310" class="content">
    他责备的眼神让她感到内疚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person approaching -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="180" y2="70" class="image" />
    <!-- Reproachful look -->
    <line x1="140" y1="40" x2="160" y2="40" class="image" />
    <line x1="145" y1="45" x2="155" y2="45" class="image" />
    <line x1="150" y1="50" x2="150" y2="60" class="image" />
  </g>
</svg>