<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">causation</text>
  <text x="50" y="120" class="subtitle">[kɔːˈzeɪʃn] n. 因果关系</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> caus (原因) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的“原因(caus)”箭头，直接指向一个“结果(effect)”，
    <tspan x="50" dy="25">这就是因果关系(causation)的直观表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The study examined the causation between smoking and lung cancer.
  </text>
  <text x="50" y="310" class="content">
    这项研究调查了吸烟与肺癌之间的因果关系。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cause -->
    <circle cx="50" cy="100" r="30" class="image" />
    <text x="40" y="105" class="content" fill="#E74C3C">原因</text>
    <!-- Arrow -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
    <!-- Effect -->
    <circle cx="250" cy="100" r="30" class="image" />
    <text x="240" y="105" class="content" fill="#2980B9">结果</text>
  </g>
</svg>