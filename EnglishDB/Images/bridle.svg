<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bridle</text>
  <text x="50" y="120" class="subtitle">[ˈbraɪdl] n. 马笼头；v. 抑制，约束</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brid (马) + le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一匹马被"小马笼头(brid-le)"紧紧束缚，
    <tspan x="50" dy="25">无法自由奔跑，这画面让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tried to bridle her anger during the argument.
  </text>
  <text x="50" y="310" class="content">
    她在争论中试图抑制自己的愤怒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Bridle -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="70" y2="20" class="image" />
    <line x1="100" y1="50" x2="130" y2="20" class="image" />
    <!-- Mouthpiece -->
    <line x1="90" y1="120" x2="110" y2="120" class="image" />
  </g>
</svg>