<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abandonment</text>
  <text x="50" y="120" class="subtitle">[əˈbændənmənt] n. 放弃，遗弃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + -andon (投掷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"离开(ab-)"并"投掷(andon)"
    <tspan x="50" dy="25">所有的东西，这种行为就是放弃(abandonment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The abandonment of the project was a huge disappointment.
  </text>
  <text x="50" y="310" class="content">
    放弃这个项目是一个巨大的失望。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <!-- Abandoned items -->
    <rect x="100" y="130" width="30" height="30" class="image" />
    <rect x="150" y="130" width="30" height="30" class="image" />
    <rect x="200" y="130" width="30" height="30" class="image" />
    <!-- Falling items -->
    <line x1="100" y1="160" x2="100" y2="200" class="image" />
    <line x1="150" y1="160" x2="150" y2="200" class="image" />
    <line x1="200" y1="160" x2="200" y2="200" class="image" />
  </g>
</svg>