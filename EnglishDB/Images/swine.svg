<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swine</text>
  <text x="50" y="120" class="subtitle">[swaɪn] n. 猪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swin (猪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只肥硕的猪在泥潭中打滚，"swin"
    <tspan x="50" dy="25">这个声音仿佛是猪在哼哼，这就是猪(swine)的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer raised a herd of swine.
  </text>
  <text x="50" y="310" class="content">
    农夫养了一群猪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pig body -->
    <ellipse cx="150" cy="100" rx="100" ry="60" class="image" />
    <!-- Pig head -->
    <ellipse cx="250" cy="80" rx="40" ry="30" class="image" />
    <!-- Pig ears -->
    <ellipse cx="230" cy="50" rx="15" ry="10" class="image" />
    <ellipse cx="270" cy="50" rx="15" ry="10" class="image" />
    <!-- Pig eyes -->
    <circle cx="240" cy="70" r="5" class="image" />
    <circle cx="260" cy="70" r="5" class="image" />
    <!-- Pig nose -->
    <ellipse cx="250" cy="90" rx="20" ry="10" class="image" />
    <!-- Pig legs -->
    <line x1="100" y1="160" x2="100" y2="200" class="image" />
    <line x1="200" y1="160" x2="200" y2="200" class="image" />
    <line x1="120" y1="160" x2="120" y2="200" class="image" />
    <line x1="180" y1="160" x2="180" y2="200" class="image" />
    <!-- Pig tail -->
    <path d="M 250 100 Q 270 120 250 140" class="image" />
  </g>
</svg>