<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hard-boiled</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrd ˈbɔɪld] adj. 煮老的，坚强的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hard (硬的) + boil (煮) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个鸡蛋被煮得"硬邦邦(hard-boiled)"，
    <tspan x="50" dy="25">表面坚硬，内心却依然保持坚韧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a hard-boiled detective who never gives up.
  </text>
  <text x="50" y="310" class="content">
    他是一个坚强的侦探，从不放弃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Egg -->
    <ellipse cx="100" cy="100" rx="60" ry="80" class="image" />
    <!-- Crack lines -->
    <line x1="60" y1="80" x2="140" y2="80" class="image" />
    <line x1="80" y1="60" x2="120" y2="120" class="image" />
    <line x1="100" y1="40" x2="100" y2="140" class="image" />
    <!-- Hard surface -->
    <rect x="40" y="20" width="120" height="160" class="image" />
  </g>
</svg>