<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">randomly</text>
  <text x="50" y="120" class="subtitle">[ˈrændəmli] adv. 随机地，任意地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> random (随机的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师从帽子里随机抽出(randomly)
    <tspan x="50" dy="25">一张扑克牌，每次抽出的牌都是不可预测的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cards were dealt randomly to each player.
  </text>
  <text x="50" y="310" class="content">
    扑克牌被随机发给了每个玩家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hat -->
    <path d="M50 50 L300 50 Q350 100 300 150 L50 150 Q0 100 50 50 Z" class="image" />
    <!-- Cards -->
    <rect x="100" y="70" width="50" height="70" class="image" />
    <rect x="150" y="70" width="50" height="70" class="image" />
    <rect x="200" y="70" width="50" height="70" class="image" />
    <!-- Magician -->
    <circle cx="200" cy="200" r="30" class="image" />
    <line x1="200" y1="230" x2="200" y2="280" class="image" />
    <line x1="200" y1="280" x2="180" y2="310" class="image" />
    <line x1="200" y1="280" x2="220" y2="310" class="image" />
    <line x1="200" y1="250" x2="250" y2="240" class="image" />
  </g>
</svg>