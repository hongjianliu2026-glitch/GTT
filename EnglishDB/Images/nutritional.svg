<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nutritional</text>
  <text x="50" y="120" class="subtitle">[nuːˈtrɪʃənl] adj. 营养的，滋养的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nutri (滋养) + tion (名词后缀) + al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水果篮，里面装满了各种"滋养(nutri)"身体的水果，
    <tspan x="50" dy="25">这些水果提供了丰富的营养(nutritional)，让人健康强壮。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A balanced diet provides nutritional benefits.
  </text>
  <text x="50" y="310" class="content">
    均衡的饮食提供营养益处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fruit basket -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fruits -->
    <circle cx="50" cy="100" r="30" class="image" fill="#FFD700" /> <!-- Banana -->
    <circle cx="120" cy="100" r="30" class="image" fill="#FF6347" /> <!-- Tomato -->
    <circle cx="190" cy="100" r="30" class="image" fill="#8B4513" /> <!-- Apple -->
    <circle cx="260" cy="100" r="30" class="image" fill="#FFA500" /> <!-- Orange -->
    <!-- Nutritional symbol -->
    <text x="175" y="180" class="image" font-size="48" fill="#2ECC71">+</text>
  </g>
</svg>