<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dwell</text>
  <text x="50" y="120" class="subtitle">[dwel] v. 居住，停留</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dwell (居住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在一个小屋里，"居住(dwell)"
    <tspan x="50" dy="25">并长时间停留，享受宁静的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to dwell in the countryside for a while.
  </text>
  <text x="50" y="310" class="content">
    她决定在乡下住一段时间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="100" x2="80" y2="100" class="image" />
    <line x1="20" y1="100" x2="50" y2="130" class="image" />
    <line x1="80" y1="100" x2="50" y2="130" class="image" />
    <!-- Person -->
    <circle cx="75" cy="150" r="15" class="image" />
    <line x1="75" y1="165" x2="75" y2="190" class="image" />
    <line x1="75" y1="190" x2="60" y2="220" class="image" />
    <line x1="75" y1="190" x2="90" y2="220" class="image" />
    <line x1="75" y1="180" x2="100" y2="170" class="image" />
  </g>
</svg>