<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unfairly</text>
  <text x="50" y="120" class="subtitle">[ʌnˈfɛrli] adv. 不公平地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + fair (公平) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，一边是满满的金币，另一边是空空如也。
    <tspan x="50" dy="25">这就是"不公平地(unfairly)"，一边得到了所有，另一边一无所有。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was treated unfairly by her boss.
  </text>
  <text x="50" y="310" class="content">
    她被老板不公平地对待了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="100" y2="60" class="image" />
    <line x1="50" y1="20" x2="0" y2="60" class="image" />
    <!-- Gold coins on one side -->
    <circle cx="100" cy="80" r="15" class="image" />
    <circle cx="120" cy="80" r="15" class="image" />
    <circle cx="140" cy="80" r="15" class="image" />
    <!-- Empty side -->
    <line x1="0" y1="80" x2="30" y2="80" class="image" />
  </g>
</svg>