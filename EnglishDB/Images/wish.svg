<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wish</text>
  <text x="50" y="120" class="subtitle">[wɪʃ] v. 希望，祝愿；n. 愿望，心愿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wis (意为“智慧”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个智者(wis)在星空下，双手合十，
    <tspan x="50" dy="25">默默地许下心愿(wish)，希望世界和平。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wished for a better future.
  </text>
  <text x="50" y="310" class="content">
    她希望有一个更好的未来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Starry sky -->
    <circle cx="100" cy="100" r="150" class="image" />
    <circle cx="100" cy="100" r="10" fill="#F1C40F" />
    <circle cx="50" cy="50" r="5" fill="#F1C40F" />
    <circle cx="150" cy="50" r="5" fill="#F1C40F" />
    <circle cx="50" cy="150" r="5" fill="#F1C40F" />
    <circle cx="150" cy="150" r="5" fill="#F1C40F" />
    <!-- Wise person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <line x1="100" y1="140" x2="60" y2="130" class="image" />
    <!-- Hands together -->
    <line x1="80" y1="130" x2="120" y2="130" class="image" />
  </g>
</svg>