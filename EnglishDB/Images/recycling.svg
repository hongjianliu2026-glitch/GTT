<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recycling</text>
  <text x="50" y="120" class="subtitle">[rɪˈsaɪklɪŋ] n. 回收利用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + cycle (循环)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的回收工厂，"再次循环(re-cycle)"
    <tspan x="50" dy="25">废弃物被重新加工成有用的物品，这就是回收利用(recycling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city has a great recycling program.
  </text>
  <text x="50" y="310" class="content">
    这座城市有一个很棒的回收计划。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Recycling symbol -->
    <path d="M 0 0 L 50 0 L 75 50 L 50 100 L 0 100 L -25 50 Z" class="image" />
    <!-- Factory -->
    <rect x="100" y="0" width="200" height="150" class="image" />
    <!-- Conveyor belt -->
    <line x1="120" y1="50" x2="280" y2="50" class="image" />
    <line x1="120" y1="70" x2="280" y2="70" class="image" />
    <line x1="120" y1="90" x2="280" y2="90" class="image" />
    <!-- Waste materials -->
    <circle cx="140" cy="60" r="10" class="image" />
    <circle cx="180" cy="60" r="10" class="image" />
    <circle cx="220" cy="60" r="10" class="image" />
    <circle cx="260" cy="60" r="10" class="image" />
  </g>
</svg>