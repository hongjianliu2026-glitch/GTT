<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">devout</text>
  <text x="50" y="120" class="subtitle">[dɪˈvaʊt] adj. 虔诚的，忠诚的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + vout (誓言)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个虔诚的信徒，"强调誓言(de-vout)"，
    <tspan x="50" dy="25">他的忠诚和信仰如同火焰般燃烧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a devout follower of the church.
  </text>
  <text x="50" y="310" class="content">
    她是教堂的虔诚信徒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flame -->
    <path d="M50 50 C50 100, 150 100, 150 50" class="image" />
    <path d="M50 50 C50 0, 150 0, 150 50" class="image" />
    <path d="M100 50 L100 0" class="image" />
    <!-- Person praying -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="70" y2="180" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
  </g>
</svg>