<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brow</text>
  <text x="50" y="120" class="subtitle">[braʊ] n. 眉毛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brow (眉毛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人皱起眉毛(brow)，仿佛在思考一个难题，
    <tspan x="50" dy="25">眉毛的形状就像一座小山丘，象征着思考的深度。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She raised her brow in surprise.
  </text>
  <text x="50" y="310" class="content">
    她惊讶地扬起了眉毛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Face -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Eyes -->
    <circle cx="100" cy="130" r="15" class="image" />
    <circle cx="200" cy="130" r="15" class="image" />
    <!-- Brows -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
    <!-- Mouth -->
    <path d="M100,200 Q150,180 200,200" class="image" />
  </g>
</svg>