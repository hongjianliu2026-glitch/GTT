<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">screaming</text>
  <text x="50" y="120" class="subtitle">[skriːmɪŋ] adj. 尖叫的，刺耳的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scream (尖叫) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在恐怖电影中，"尖叫(scream)"
    <tspan x="50" dy="25">的声音持续不断，这就是"尖叫的(screaming)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The audience was screaming during the horror movie.
  </text>
  <text x="50" y="310" class="content">
    观众在看恐怖电影时尖叫连连。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Teeth -->
    <rect x="80" y="80" width="40" height="20" class="image" />
    <rect x="85" y="85" width="30" height="10" class="image" />
    <!-- Tongue -->
    <ellipse cx="100" cy="120" rx="20" ry="10" class="image" />
    <!-- Sound waves -->
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="80" y1="150" x2="120" y2="170" class="image" />
    <line x1="70" y1="160" x2="130" y2="160" class="image" />
    <line x1="60" y1="170" x2="140" y2="150" class="image" />
  </g>
</svg>