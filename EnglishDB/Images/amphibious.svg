<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">amphibious</text>
  <text x="50" y="120" class="subtitle">[æmˈfɪbiəs] adj. 两栖的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> amphi- (两边) + bios (生命)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只青蛙，它既能"在两边(amphi-)"
    <tspan x="50" dy="25">生活，一边是水(bios)，一边是陆地(bios)，</tspan>
    <tspan x="50" dy="25">这就是两栖(amphibious)的特性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The military has developed amphibious vehicles.
  </text>
  <text x="50" y="310" class="content">
    军队开发了两栖车辆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="100" class="image" fill="#1ABC9C" />
    <!-- Land -->
    <rect x="0" y="100" width="350" height="100" class="image" fill="#F1C40F" />
    <!-- Frog -->
    <circle cx="175" cy="100" r="20" class="image" fill="#2ECC71" />
    <line x1="175" y1="120" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="145" y2="120" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>