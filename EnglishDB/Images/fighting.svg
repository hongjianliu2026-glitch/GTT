<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fighting</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪtɪŋ] n. 战斗，斗争；adj. 战斗的，好斗的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fight (战斗) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在激烈地"战斗(fight)"，
    <tspan x="50" dy="25">他们的拳头和脚都在空中挥舞，这就是"战斗中(fighting)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers were praised for their fighting spirit.
  </text>
  <text x="50" y="310" class="content">
    士兵们因他们的战斗精神而受到表扬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two fighters -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Arms and legs -->
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="140" x2="30" y2="170" class="image" />
    <line x1="50" y1="140" x2="70" y2="170" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="140" x2="130" y2="170" class="image" />
    <line x1="150" y1="140" x2="170" y2="170" class="image" />
    <!-- Fists -->
    <circle cx="30" cy="150" r="10" class="image" />
    <circle cx="70" cy="150" r="10" class="image" />
    <circle cx="130" cy="150" r="10" class="image" />
    <circle cx="170" cy="150" r="10" class="image" />
  </g>
</svg>