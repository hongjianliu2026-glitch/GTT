<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">career</text>
  <text x="50" y="120" class="subtitle">[kəˈrɪr] n. 生涯，职业</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> car (跑) + eer (从事)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在职业道路上奔跑，"跑(car)"
    <tspan x="50" dy="25">向着目标前进，这就是他的生涯(career)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has had a successful career in marketing.
  </text>
  <text x="50" y="310" class="content">
    她在市场营销领域有着成功的职业生涯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <!-- Person running -->
    <circle cx="50" cy="110" r="15" class="image" />
    <line x1="50" y1="125" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Goal -->
    <rect x="300" y="80" width="50" height="50" class="image" />
    <text x="310" y="115" class="content">Goal</text>
  </g>
</svg>