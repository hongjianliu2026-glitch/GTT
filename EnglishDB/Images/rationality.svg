<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rationality</text>
  <text x="50" y="120" class="subtitle">[ˌræʃəˈnæləti] n. 理性，合理性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ratio (比率) + -ality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考问题时，"按照比率(ratio)"
    <tspan x="50" dy="25">和逻辑来分析，这种理性的思考方式就是理性(rationality)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rationality of his argument impressed everyone.
  </text>
  <text x="50" y="310" class="content">
    他的论点的合理性给每个人都留下了深刻的印象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Thought lines -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="200" x2="50" y2="200" class="image" />
    <line x1="100" y1="200" x2="150" y2="200" class="image" />
    <!-- Ratio symbol -->
    <text x="100" y="300" class="content" text-anchor="middle">1:1</text>
  </g>
</svg>