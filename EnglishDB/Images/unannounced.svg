<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unannounced</text>
  <text x="50" y="120" class="subtitle">[ˌʌnəˈnaʊnst] adj. 未宣布的，未预告的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + announce (宣布)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘人突然出现在门口，"未宣布(un-announced)"
    <tspan x="50" dy="25">地出现，让人措手不及。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The CEO made an unannounced visit to the office.
  </text>
  <text x="50" y="310" class="content">
    首席执行官突然造访了办公室。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="250" class="image" />
    <!-- Person -->
    <circle cx="75" cy="125" r="20" class="image" />
    <line x1="75" y1="145" x2="75" y2="200" class="image" />
    <line x1="75" y1="200" x2="50" y2="230" class="image" />
    <line x1="75" y1="200" x2="100" y2="230" class="image" />
    <line x1="75" y1="160" x2="110" y2="150" class="image" />
    <!-- Question mark -->
    <text x="170" y="150" class="content" style="font-size: 60px; fill: #E74C3C;">?</text>
  </g>
</svg>