<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bluntly</text>
  <text x="50" y="120" class="subtitle">[ˈblʌntli] adv. 直率地，直言不讳地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blunt (钝的，不锋利的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一把钝刀，"直率地(bluntly)"
    <tspan x="50" dy="25">说话，毫不拐弯抹角，就像刀刃一样直接。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She told him bluntly that his idea was not practical.
  </text>
  <text x="50" y="310" class="content">
    她直率地告诉他，他的想法不切实际。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blunt knife -->
    <line x1="0" y1="0" x2="150" y2="0" class="image" />
    <line x1="150" y1="0" x2="140" y2="10" class="image" />
    <line x1="140" y1="10" x2="130" y2="20" class="image" />
    <line x1="130" y1="20" x2="120" y2="30" class="image" />
    <line x1="120" y1="30" x2="110" y2="40" class="image" />
    <line x1="110" y1="40" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="90" y2="60" class="image" />
    <line x1="90" y1="60" x2="80" y2="70" class="image" />
    <line x1="80" y1="70" x2="70" y2="80" class="image" />
    <line x1="70" y1="80" x2="60" y2="90" class="image" />
    <line x1="60" y1="90" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="40" y2="110" class="image" />
    <line x1="40" y1="110" x2="30" y2="120" class="image" />
    <line x1="30" y1="120" x2="20" y2="130" class="image" />
    <line x1="20" y1="130" x2="10" y2="140" class="image" />
    <line x1="10" y1="140" x2="0" y2="150" class="image" />
    <!-- Handle -->
    <rect x="0" y="150" width="20" height="30" class="image" />
  </g>
</svg>