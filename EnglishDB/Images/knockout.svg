<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knockout</text>
  <text x="50" y="120" class="subtitle">[ˈnɒkəʊt] n. 击倒，淘汰赛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> knock (敲击) + out (出去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拳击手在擂台上，"一拳敲击(knock)"
    <tspan x="50" dy="25">对手，使其出局(out)，这就是击倒(knockout)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He scored a knockout in the third round.
  </text>
  <text x="50" y="310" class="content">
    他在第三回合击倒了对手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boxing ring -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boxer 1 -->
    <circle cx="80" cy="100" r="20" class="image" />
    <line x1="80" y1="120" x2="80" y2="160" class="image" />
    <line x1="80" y1="160" x2="60" y2="190" class="image" />
    <line x1="80" y1="160" x2="100" y2="190" class="image" />
    <line x1="80" y1="140" x2="110" y2="130" class="image" />
    <!-- Boxer 2 -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Knockout punch -->
    <line x1="100" y1="100" x2="230" y2="100" class="image" />
    <polygon points="230,100 220,90 220,110" class="image" />
  </g>
</svg>