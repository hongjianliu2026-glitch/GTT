<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uphold</text>
  <text x="50" y="120" class="subtitle">[ʌpˈhoʊld] v. 支持，维护</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + hold (持有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人双手高举，"向上持有(up-hold)"
    <tspan x="50" dy="25">一面旗帜，象征着支持与维护(uphold)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge upheld the decision of the lower court.
  </text>
  <text x="50" y="310" class="content">
    法官维持了下级法院的判决。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Person holding a flag -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="30" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="70" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="100" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <rect x="70" y="120" width="50" height="100" class="image" /> <!-- Flag pole -->
    <polygon points="120,120 120,220 170,170" class="image" /> <!-- Flag -->
  </g>
</svg>