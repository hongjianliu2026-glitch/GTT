<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">escalator</text>
  <text x="50" y="120" class="subtitle">[ˈɛskəˌleɪtər] n. 自动扶梯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + scal (梯子) + -ator (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的梯子"伸出(e-scal)"地面，
    <tspan x="50" dy="25">人们站在上面自动上升，这就是自动扶梯(escalator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mall has a long escalator that takes you to the second floor.
  </text>
  <text x="50" y="310" class="content">
    商场有一部很长的自动扶梯，可以带你到二楼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Escalator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Steps -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- People -->
    <circle cx="75" cy="40" r="10" class="image" />
    <circle cx="125" cy="80" r="10" class="image" />
    <circle cx="175" cy="120" r="10" class="image" />
    <circle cx="225" cy="160" r="10" class="image" />
  </g>
</svg>