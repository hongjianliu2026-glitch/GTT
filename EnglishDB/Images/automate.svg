<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">automate</text>
  <text x="50" y="120" class="subtitle">[ˈɔːtəmeɪt] v. 使自动化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auto- (自动) + -mate (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂里，"自动(auto-)"
    <tspan x="50" dy="25">的机器人在"使(mate)"生产线运转，</tspan>
    <tspan x="50" dy="25">整个过程都被"自动化(automate)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to automate the production line.
  </text>
  <text x="50" y="310" class="content">
    他们决定使生产线自动化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Robot -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Conveyor belt -->
    <line x1="100" y1="180" x2="300" y2="180" class="image" />
    <line x1="100" y1="190" x2="300" y2="190" class="image" />
    <line x1="100" y1="200" x2="300" y2="200" class="image" />
    <!-- Products -->
    <rect x="120" y="170" width="20" height="20" class="image" />
    <rect x="160" y="170" width="20" height="20" class="image" />
    <rect x="200" y="170" width="20" height="20" class="image" />
  </g>
</svg>