<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prior</text>
  <text x="50" y="120" class="subtitle">[ˈpraɪər] adj. 在前的，优先的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pri- (第一，首要) + or (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的国王，他总是"第一(pri-)"
    <tspan x="50" dy="25">做出决定，他的决定总是优先的(prior)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave priority to her family over her career.
  </text>
  <text x="50" y="310" class="content">
    她把家庭放在事业之前。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="10" y1="50" x2="90" y2="50" class="image" />
    <line x1="30" y1="30" x2="70" y2="30" class="image" />
    <line x1="30" y1="70" x2="70" y2="70" class="image" />
    <!-- King -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="250" class="image" />
    <line x1="50" y1="220" x2="70" y2="250" class="image" />
    <line x1="50" y1="190" x2="20" y2="180" class="image" />
    <line x1="50" y1="190" x2="80" y2="180" class="image" />
  </g>
</svg>