<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loafer</text>
  <text x="50" y="120" class="subtitle">[ˈloʊfər] n. 懒汉，游手好闲者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loaf (游荡) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个懒汉(loafer)整天无所事事，
    <tspan x="50" dy="25">只是"游荡(loaf)"在街头，不干正事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was known as a loafer in the neighborhood.
  </text>
  <text x="50" y="310" class="content">
    他在邻里间以懒汉著称。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lazy person -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="230" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="80" y2="230" class="image" /> <!-- Right leg -->
    <line x1="50" y1="140" x2="20" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="80" y2="150" class="image" /> <!-- Right arm -->
    <!-- Street -->
    <line x1="0" y1="250" x2="200" y2="250" class="image" />
    <line x1="0" y1="260" x2="200" y2="260" class="image" />
    <line x1="0" y1="270" x2="200" y2="270" class="image" />
  </g>
</svg>