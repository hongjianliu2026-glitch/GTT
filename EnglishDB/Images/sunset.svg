<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #F1C40F; }
      .sky { fill: #3498DB; }
      .ground { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sunset</text>
  <text x="50" y="120" class="subtitle">[ˈsʌnset] n. 日落</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + set (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳("sun")慢慢地"落下(set)"，天空被染成了橙红色，
    <tspan x="50" dy="25">这就是日落(sunset)的美丽景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We watched the sunset at the beach.
  </text>
  <text x="50" y="310" class="content">
    我们在海滩上观看了日落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="sky" />
    <!-- Sun -->
    <circle cx="200" cy="100" r="50" class="sun" />
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="ground" />
  </g>
</svg>