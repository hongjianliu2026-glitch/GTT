<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">train</text>
  <text x="50" y="120" class="subtitle">[treɪn] n. 火车；v. 训练</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trai- (拉丁语tractus，拉) + -n (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一列火车在铁轨上"拉(trai-)"着车厢前进，
    <tspan x="50" dy="25">就像运动员在训练中"拉(trai-)"动自己的身体一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She took the train to work every day.
  </text>
  <text x="50" y="310" class="content">
    她每天乘火车去上班。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Train -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <rect x="20" y="20" width="310" height="60" class="image" />
    <circle cx="50" cy="80" r="10" class="image" />
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="200" cy="80" r="10" class="image" />
    <circle cx="250" cy="80" r="10" class="image" />
    <circle cx="300" cy="80" r="10" class="image" />
    <!-- Tracks -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="110" x2="350" y2="110" class="image" />
  </g>
</svg>