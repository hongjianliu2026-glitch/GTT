<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mortify</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrtɪfaɪ] v. 使羞愧，使屈辱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mort (死亡) + -ify (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公共场合出丑，感觉"像死了一样(mort)"
    <tspan x="50" dy="25">的羞愧，这种感觉就是mortify。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was mortified when she tripped in front of everyone.
  </text>
  <text x="50" y="310" class="content">
    她在大家面前摔倒时感到非常羞愧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person feeling mortified -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Embarrassed face -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
    <!-- Public setting -->
    <rect x="0" y="250" width="100" height="50" class="image" />
    <rect x="120" y="250" width="100" height="50" class="image" />
    <rect x="240" y="250" width="100" height="50" class="image" />
  </g>
</svg>