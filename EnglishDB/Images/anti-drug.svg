<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cross { stroke: #E74C3C; stroke-width: 5; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anti-drug</text>
  <text x="50" y="120" class="subtitle">[ˈæntiˌdrʌɡ] adj. 反毒品的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (反对) + drug (毒品)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色叉号"反对(anti-)"
    <tspan x="50" dy="25">一个装满毒品的袋子，这就是反毒品(anti-drug)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The campaign is aimed at promoting anti-drug awareness.
  </text>
  <text x="50" y="310" class="content">
    这场运动旨在提高反毒品意识。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Drug bag -->
    <rect x="50" y="20" width="200" height="150" class="image" />
    <text x="100" y="100" class="content" fill="#34495E">Drug</text>
    <!-- Cross -->
    <line x1="50" y1="20" x2="250" y2="170" class="cross" />
    <line x1="50" y1="170" x2="250" y2="20" class="cross" />
  </g>
</svg>