<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">east</text>
  <text x="50" y="120" class="subtitle">[iːst] n. 东，东方；adj. 东方的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + ast (方向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家站在地球上，面向"出(e-)"的方向，
    <tspan x="50" dy="25">那就是东(east)方，太阳升起的地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sun rises in the east.
  </text>
  <text x="50" y="310" class="content">
    太阳从东方升起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Explorer -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="100" r="30" class="image" fill="#F1C40F" />
    <line x1="300" y1="70" x2="300" y2="40" class="image" />
    <line x1="300" y1="130" x2="300" y2="160" class="image" />
    <line x1="270" y1="100" x2="240" y2="100" class="image" />
    <line x1="330" y1="100" x2="360" y2="100" class="image" />
    <line x1="285" y1="75" x2="260" y2="50" class="image" />
    <line x1="315" y1="75" x2="340" y2="50" class="image" />
    <line x1="285" y1="125" x2="260" y2="150" class="image" />
    <line x1="315" y1="125" x2="340" y2="150" class="image" />
  </g>
</svg>