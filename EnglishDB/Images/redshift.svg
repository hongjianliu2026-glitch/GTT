<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">redshift</text>
  <text x="50" y="120" class="subtitle">[ˈriːdˌsɛft] n. 红移</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> red (红色) + shift (移动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宇宙中的星系，由于宇宙膨胀，星系的光线"移动(shift)"
    <tspan x="50" dy="25">到更长的波长，变成了"红色(red)"，这就是红移(redshift)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The redshift of the distant galaxy indicates its rapid movement away from us.
  </text>
  <text x="50" y="310" class="content">
    遥远星系的红移表明它正快速远离我们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Galaxy -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <circle cx="80" cy="120" r="15" class="image" />
    <circle cx="140" cy="110" r="8" class="image" />
    <circle cx="90" cy="70" r="12" class="image" />
    <!-- Red shift -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <!-- Red color -->
    <rect x="150" y="300" width="50" height="20" class="image" fill="#E74C3C" />
    <text x="160" y="315" class="content" fill="#FFFFFF">Red</text>
  </g>
</svg>