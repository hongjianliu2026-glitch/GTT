<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adjustable</text>
  <text x="50" y="120" class="subtitle">[əˈdʒʌstəbl] adj. 可调整的，可调节的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + just (正确) + -able (可...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神奇的椅子，"朝向(ad-)"
    <tspan x="50" dy="25">正确的(just)位置可以被调整(adjustable)，</tspan>
    <tspan x="50" dy="25">无论你多高或多矮，都能找到最舒适的位置。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The height of the chair is adjustable to fit different users.
  </text>
  <text x="50" y="310" class="content">
    椅子的高度可以调节以适应不同的使用者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Seat -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <!-- Backrest -->
    <rect x="75" y="20" width="50" height="100" class="image" />
    <!-- Adjustable lever -->
    <line x1="100" y1="150" x2="100" y2="180" class="image" />
    <circle cx="100" cy="180" r="10" class="image" />
    <!-- Person -->
    <circle cx="100" cy="220" r="20" class="image" />
    <line x1="100" y1="240" x2="100" y2="280" class="image" />
    <line x1="100" y1="280" x2="80" y2="310" class="image" />
    <line x1="100" y1="280" x2="120" y2="310" class="image" />
    <line x1="100" y1="260" x2="70" y2="250" class="image" />
    <line x1="100" y1="260" x2="130" y2="250" class="image" />
  </g>
</svg>