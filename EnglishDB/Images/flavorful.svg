<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flavorful</text>
  <text x="50" y="120" class="subtitle">[ˈfleɪvərfl] adj. 味道浓郁的，有风味的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flavor (味道) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"充满(ful)"
    <tspan x="50" dy="25">各种"味道(flavor)"的调料，</tspan>
    <tspan x="50" dy="25">烹饪出一道道美味佳肴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dish was flavorful and aromatic.
  </text>
  <text x="50" y="310" class="content">
    这道菜味道浓郁且香气扑鼻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Spices -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="130" cy="110" r="10" class="image" />
    <circle cx="160" cy="140" r="10" class="image" />
    <circle cx="190" cy="170" r="10" class="image" />
    <circle cx="220" cy="200" r="10" class="image" />
    <!-- Dish -->
    <rect x="280" y="20" width="100" height="100" class="image" />
    <line x1="300" y1="40" x2="380" y2="40" class="image" />
    <line x1="300" y1="70" x2="380" y2="70" class="image" />
    <line x1="300" y1="100" x2="380" y2="100" class="image" />
  </g>
</svg>