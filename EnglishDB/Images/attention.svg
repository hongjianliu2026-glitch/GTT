<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">attention</text>
  <text x="50" y="120" class="subtitle">[əˈtenʃən] n. 注意力，关注</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> at- (朝向) + tent (伸展)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把目光"朝向(at-)"某个物体，
    <tspan x="50" dy="25">他的注意力就像一只手"伸展(tent)"过去，</tspan>
    <tspan x="50" dy="25">紧紧抓住那个物体，这就是"注意力(attention)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Pay attention to the details in the presentation.
  </text>
  <text x="50" y="310" class="content">
    在演示中注意细节。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="50" cy="50" r="10" class="image" fill="#2C3E50" />
    <!-- Hand reaching out -->
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="180" y2="30" class="image" />
    <line x1="200" y1="50" x2="180" y2="70" class="image" />
    <line x1="200" y1="50" x2="220" y2="30" class="image" />
    <line x1="200" y1="50" x2="220" y2="70" class="image" />
    <!-- Object -->
    <rect x="250" y="30" width="40" height="40" class="image" />
  </g>
</svg>