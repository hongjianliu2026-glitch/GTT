<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">memorialize</text>
  <text x="50" y="120" class="subtitle">[məˈmɔːriəlaɪz] v. 纪念，铭记</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> memor (记忆) + -ial (形容词后缀) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在纪念碑前，"铭记(memor)"
    <tspan x="50" dy="25">历史，将重要事件永远刻在心中(memorialize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to memorialize the fallen soldiers with a statue.
  </text>
  <text x="50" y="310" class="content">
    他们决定用一座雕像来纪念阵亡的士兵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monument -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Heart -->
    <path d="M250,120 C260,100 280,100 290,120 S320,140 310,160" class="image" />
    <path d="M250,120 C240,100 220,100 210,120 S180,140 190,160" class="image" />
  </g>
</svg>