<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acute</text>
  <text x="50" y="120" class="subtitle">[əˈkjuːt] adj. 尖锐的，敏锐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> acu- (尖锐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个尖锐的箭头，"尖锐(acu-)"
    <tspan x="50" dy="25">刺入目标，这种尖锐的感觉让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective has an acute sense of observation.
  </text>
  <text x="50" y="310" class="content">
    这位侦探有着敏锐的观察力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow -->
    <line x1="0" y1="0" x2="200" y2="100" class="image" />
    <polygon points="200,100 180,80 180,120" class="image" />
    <!-- Target -->
    <circle cx="250" cy="100" r="50" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
  </g>
</svg>