<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .smoke { fill: #BDC3C7; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smolder</text>
  <text x="50" y="120" class="subtitle">[ˈsmoʊldər] v. 闷烧，阴燃；n. 闷烧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smol- (燃烧) + -der (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆木柴在壁炉里"闷烧(smolder)"，
    <tspan x="50" dy="25">没有明火，但烟雾缭绕，仿佛在默默地诉说着它的存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The campfire smoldered long after the embers had cooled.
  </text>
  <text x="50" y="310" class="content">
    篝火在灰烬冷却后很久还在闷烧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="70" cy="120" r="15" class="image" />
    <circle cx="90" cy="140" r="10" class="image" />
    <!-- Smoke -->
    <ellipse cx="100" cy="80" rx="30" ry="15" class="smoke" />
    <ellipse cx="120" cy="60" rx="25" ry="10" class="smoke" />
    <ellipse cx="140" cy="40" rx="20" ry="8" class="smoke" />
  </g>
</svg>