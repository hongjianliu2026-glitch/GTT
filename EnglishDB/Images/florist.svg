<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">florist</text>
  <text x="50" y="120" class="subtitle">[ˈflɔːrɪst] n. 花商，花店</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flor (花) + -ist (从事...的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个花店老板，"从事(ist)"
    <tspan x="50" dy="25">与"花(flor)"相关的工作，</tspan>
    <tspan x="50" dy="25">每天都在花丛中忙碌，</tspan>
    <tspan x="50" dy="25">这就是一个花商(florist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The florist arranged a beautiful bouquet for the wedding.
  </text>
  <text x="50" y="330" class="content">
    花商为婚礼准备了一束美丽的花束。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower shop -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flowers -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Florist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Bouquet -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="125" y1="100" x2="125" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
  </g>
</svg>