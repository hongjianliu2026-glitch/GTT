<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">repute</text>
  <text x="50" y="120" class="subtitle">[rɪˈpjuːt] n. 名声，声誉；v. 认为，称为</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + put (思考)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在反复思考(re-put)，最终形成了对某人或某事的评价，
    <tspan x="50" dy="25">这个评价就是他们的名声(repute)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is reputed to be the best chef in town.
  </text>
  <text x="50" y="310" class="content">
    他被认为是城里最好的厨师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thought bubble -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="120" cy="80" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="130" cy="120" r="20" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>