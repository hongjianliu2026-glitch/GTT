<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-pointer</text>
  <text x="50" y="120" class="subtitle">[θriːˈpaʊntər] n. 三分球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + pointer (指向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个篮球运动员站在三分线外，"指向(pointer)"
    <tspan x="50" dy="25">篮筐，投出一个"三(three)"分球，球在空中划出一道完美的弧线，</tspan>
    <tspan x="50" dy="25">准确无误地落入篮筐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made a three-pointer at the buzzer.
  </text>
  <text x="50" y="310" class="content">
    他在蜂鸣器响起时投进了一个三分球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basketball court -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Three-point line -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- Basketball hoop -->
    <circle cx="320" cy="100" r="20" class="image" />
    <!-- Basketball -->
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Player -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
  </g>
</svg>