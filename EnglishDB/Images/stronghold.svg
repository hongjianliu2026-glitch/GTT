<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stronghold</text>
  <text x="50" y="120" class="subtitle">[ˈstrɒŋhəʊld] n. 要塞，堡垒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> strong (强壮) + hold (持有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的城堡，"强壮地持有(strong-hold)"
    <tspan x="50" dy="25">着它的领土，抵御外敌的入侵，这就是一个要塞(stronghold)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The medieval castle was a stronghold during the war.
  </text>
  <text x="50" y="310" class="content">
    这座中世纪城堡在战争期间是一个要塞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <rect x="70" y="40" width="210" height="120" class="image" />
    <rect x="90" y="60" width="170" height="80" class="image" />
    <!-- Towers -->
    <rect x="50" y="20" width="30" height="160" class="image" />
    <rect x="270" y="20" width="30" height="160" class="image" />
    <!-- Flag -->
    <line x1="160" y1="20" x2="160" y2="0" class="image" />
    <rect x="160" y="0" width="20" height="20" class="image" />
  </g>
</svg>