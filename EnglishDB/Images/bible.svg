<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Bible</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪbl] n. 圣经</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> biblos (书)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本巨大的书，"书(biblos)"
    <tspan x="50" dy="25">被打开，里面充满了神圣的文字，这就是圣经(Bible)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He reads the Bible every morning.
  </text>
  <text x="50" y="310" class="content">
    他每天早上都读圣经。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Book -->
    <rect x="0" y="0" width="300" height="400" class="image" />
    <!-- Pages -->
    <line x1="50" y1="0" x2="50" y2="400" class="image" />
    <line x1="100" y1="0" x2="100" y2="400" class="image" />
    <line x1="150" y1="0" x2="150" y2="400" class="image" />
    <line x1="200" y1="0" x2="200" y2="400" class="image" />
    <line x1="250" y1="0" x2="250" y2="400" class="image" />
    <!-- Holy text -->
    <text x="70" y="50" class="content" style="font-size: 24px; fill: #2C3E50;">Holy</text>
    <text x="70" y="100" class="content" style="font-size: 24px; fill: #2C3E50;">Scriptures</text>
  </g>
</svg>