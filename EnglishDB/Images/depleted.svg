<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">depleted</text>
  <text x="50" y="120" class="subtitle">[dɪˈpliːtɪd] adj. 耗尽的，枯竭的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + ple (充满) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个曾经"充满(ple)"能量的电池，现在"向下(de-)"
    <tspan x="50" dy="25">耗尽了所有能量，变得"耗尽的(depleted)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oil reserves are depleted after years of extraction.
  </text>
  <text x="50" y="310" class="content">
    经过多年的开采，石油储量已经耗尽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battery -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Depleted energy -->
    <line x1="30" y1="40" x2="120" y2="40" class="image" />
    <line x1="30" y1="70" x2="100" y2="70" class="image" />
    <line x1="30" y1="100" x2="110" y2="100" class="image" />
    <line x1="30" y1="130" x2="90" y2="130" class="image" />
    <!-- Arrow pointing down -->
    <line x1="75" y1="220" x2="75" y2="250" class="image" />
    <polygon points="70,250 80,250 75,260" class="image" />
  </g>
</svg>