<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stillness</text>
  <text x="50" y="120" class="subtitle">[ˈstɪlnəs] n. 静止，寂静</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> still (静止) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完全静止的湖面，没有一丝波纹，
    <tspan x="50" dy="25">这种绝对的静止就是"stillness"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stillness of the night was broken by a sudden scream.
  </text>
  <text x="50" y="310" class="content">
    夜晚的寂静被一声突如其来的尖叫打破。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Still water -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Reflection -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Trees -->
    <line x1="20" y1="20" x2="20" y2="100" class="image" />
    <line x1="40" y1="20" x2="40" y2="100" class="image" />
    <line x1="60" y1="20" x2="60" y2="100" class="image" />
  </g>
</svg>