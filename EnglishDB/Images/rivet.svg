<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rivet</text>
  <text x="50" y="120" class="subtitle">[ˈrɪvɪt] n. 铆钉；v. 固定，吸引</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> riv (河流) + et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条小河(riv)边，有一个小钉子(et)，
    <tspan x="50" dy="25">它像铆钉(rivet)一样牢牢固定在河岸上，吸引着人们的目光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rivet held the metal plates together.
  </text>
  <text x="50" y="310" class="content">
    铆钉将金属板固定在一起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <!-- Rivet -->
    <circle cx="175" cy="30" r="10" class="image" />
    <line x1="175" y1="40" x2="175" y2="80" class="image" />
    <!-- Eye -->
    <circle cx="250" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="10" fill="#000" />
  </g>
</svg>