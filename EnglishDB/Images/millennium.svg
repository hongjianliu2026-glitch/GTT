<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">millennium</text>
  <text x="50" y="120" class="subtitle">[mɪˈleniəm] n. 一千年，千禧年</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> milli- (千) + ann (年)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，指针每走一圈就代表一千年(millennium)。
    <tspan x="50" dy="25">这个时钟的刻度上刻着"千"(milli)和"年"(ann)，象征着时间的漫长。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new millennium brought many changes.
  </text>
  <text x="50" y="310" class="content">
    新千年带来了许多变化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Numerals -->
    <text x="175" y="30" text-anchor="middle" class="content">12</text>
    <text x="255" y="100" text-anchor="middle" class="content">3</text>
    <text x="175" y="170" text-anchor="middle" class="content">6</text>
    <text x="95" y="100" text-anchor="middle" class="content">9</text>
    <!-- Millennium symbol -->
    <text x="175" y="220" text-anchor="middle" class="highlight">millennium</text>
  </g>
</svg>