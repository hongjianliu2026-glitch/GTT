<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lawyer</text>
  <text x="50" y="120" class="subtitle">[ˈlɔːjər] n. 律师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> law (法律) + -yer (从事...的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个律师在法庭上，"用法律(law)"
    <tspan x="50" dy="25">为人们辩护，他就是法律的代言人(lawyer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hired a lawyer to handle her divorce case.
  </text>
  <text x="50" y="310" class="content">
    她聘请了一位律师来处理她的离婚案件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lawyer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Gavel -->
    <rect x="100" y="80" width="30" height="50" class="image" />
    <line x1="115" y1="80" x2="115" y2="50" class="image" />
    <!-- Law book -->
    <rect x="150" y="90" width="60" height="40" class="image" />
    <line x1="160" y1="100" x2="200" y2="100" class="image" />
    <line x1="160" y1="120" x2="200" y2="120" class="image" />
  </g>
</svg>