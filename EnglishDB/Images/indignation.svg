<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indignation</text>
  <text x="50" y="120" class="subtitle">[ˌɪndɪɡˈneɪʃn] n. 愤怒，愤慨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + dign (值得) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为不公正的待遇而感到"不值得(in-dign)"，
    <tspan x="50" dy="25">他的脸上充满了愤怒(indignation)的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her indignation at the injustice was palpable.
  </text>
  <text x="50" y="310" class="content">
    她对不公正的愤怒是显而易见的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <line x1="70" y1="140" x2="130" y2="140" class="image" />
    <line x1="100" y1="120" x2="100" y2="140" class="image" />
    <line x1="100" y1="140" x2="80" y2="160" class="image" />
    <line x1="100" y1="140" x2="120" y2="160" class="image" />
  </g>
</svg>