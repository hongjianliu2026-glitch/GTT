<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blitz</text>
  <text x="50" y="120" class="subtitle">[blɪts] n. 闪电战，突袭；v. 突袭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blitz (源自德语，意为“闪电”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场突如其来的"闪电(blitz)"战，
    <tspan x="50" dy="25">敌人如闪电般迅速袭击，让人措手不及。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The army launched a blitz attack on the enemy base.
  </text>
  <text x="50" y="310" class="content">
    军队对敌军基地发动了闪电突袭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lightning bolt -->
    <path d="M50 50 L150 150 L50 150 Z" class="image" />
    <!-- Soldiers -->
    <rect x="200" y="100" width="30" height="60" class="image" />
    <rect x="240" y="100" width="30" height="60" class="image" />
    <rect x="280" y="100" width="30" height="60" class="image" />
    <!-- Explosion -->
    <circle cx="100" cy="200" r="50" class="image" />
    <circle cx="100" cy="200" r="40" class="image" />
    <circle cx="100" cy="200" r="30" class="image" />
  </g>
</svg>