<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Iranian</text>
  <text x="50" y="120" class="subtitle">[ɪˈreɪniən] n. 伊朗人，伊朗语；adj. 伊朗的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Iran (伊朗) + -ian (表示人或形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着传统头巾的伊朗人，站在伊朗的标志性建筑前，
    <tspan x="50" dy="25">这个画面让人立刻联想到"伊朗的(Iranian)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Iranian embassy is located in the heart of the city.
  </text>
  <text x="50" y="310" class="content">
    伊朗大使馆位于市中心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional headscarf -->
    <path d="M50,50 Q100,20 150,50 T250,50" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="150" x2="120" y2="130" class="image" />
    <line x1="150" y1="150" x2="180" y2="130" class="image" />
    <line x1="150" y1="180" x2="120" y2="210" class="image" />
    <line x1="150" y1="180" x2="180" y2="210" class="image" />
    <!-- Landmark -->
    <rect x="100" y="220" width="100" height="50" class="image" />
    <line x1="120" y1="220" x2="120" y2="270" class="image" />
    <line x1="140" y1="220" x2="140" y2="270" class="image" />
    <line x1="160" y1="220" x2="160" y2="270" class="image" />
    <line x1="180" y1="220" x2="180" y2="270" class="image" />
  </g>
</svg>