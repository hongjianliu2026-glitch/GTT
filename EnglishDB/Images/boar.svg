<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #6C3483; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boar</text>
  <text x="50" y="120" class="subtitle">[bɔːr] n. 公猪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *bharaz (野猪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只强壮的公猪(boar)在森林中狂奔，
    <tspan x="50" dy="25">它的獠牙锋利无比，仿佛能刺穿一切障碍。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hunter tracked the wild boar through the dense forest.
  </text>
  <text x="50" y="310" class="content">
    猎人追踪着野猪穿过茂密的森林。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boar body -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <!-- Head -->
    <circle cx="150" cy="80" r="30" class="image" />
    <!-- Tusks -->
    <line x1="130" y1="80" x2="110" y2="60" class="image" />
    <line x1="170" y1="80" x2="190" y2="60" class="image" />
    <!-- Legs -->
    <line x1="60" y1="130" x2="60" y2="180" class="image" />
    <line x1="140" y1="130" x2="140" y2="180" class="image" />
    <line x1="80" y1="130" x2="80" y2="180" class="image" />
    <line x1="160" y1="130" x2="160" y2="180" class="image" />
    <!-- Tail -->
    <line x1="20" y1="100" x2="0" y2="120" class="image" />
  </g>
</svg>