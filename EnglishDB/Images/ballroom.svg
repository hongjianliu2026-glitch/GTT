<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ballroom</text>
  <text x="50" y="120" class="subtitle">[ˈbɔːlruːm] n. 舞厅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ball (舞会) + room (房间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的房间里，人们穿着华丽的礼服，在灯光下翩翩起舞，这就是舞厅(ballroom)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They met at a grand ballroom in the city.
  </text>
  <text x="50" y="310" class="content">
    他们在城里一个豪华的舞厅相遇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ballroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dance floor -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Dancers -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <!-- Lights -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="55" x2="300" y2="55" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
  </g>
</svg>