<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">emulate</text>
  <text x="50" y="120" class="subtitle">[ˈɛmjəˌleɪt] v. 模仿，仿效</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (向外) + mulat (模仿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生站在镜子前，"向外模仿(e-mulat)"
    <tspan x="50" dy="25">老师的动作，试图完全复制老师的每一个细节。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tried to emulate her favorite artist's style.
  </text>
  <text x="50" y="310" class="content">
    她试图模仿她最喜欢的艺术家的风格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Student -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Teacher -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="290" y2="130" class="image" />
    <!-- Mirror reflection -->
    <line x1="100" y1="200" x2="250" y2="200" class="image" />
    <line x1="100" y1="210" x2="250" y2="210" class="image" />
    <line x1="100" y1="220" x2="250" y2="220" class="image" />
  </g>
</svg>