<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boost</text>
  <text x="50" y="120" class="subtitle">[buːst] v. 推动，提高；n. 推动，激励</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boos- (源自荷兰语 "boos"，意为“愤怒”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个愤怒的巨人，他用力一推，"推动(boost)"
    <tspan x="50" dy="25">整个世界向前冲，这种力量就是推动(boost)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new marketing campaign boosted sales by 20%.
  </text>
  <text x="50" y="310" class="content">
    新的营销活动使销售额提高了20%。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant pushing the world -->
    <circle cx="200" cy="100" r="50" class="image" /> <!-- Giant's head -->
    <line x1="200" y1="150" x2="200" y2="250" class="image" /> <!-- Giant's body -->
    <line x1="200" y1="250" x2="150" y2="300" class="image" /> <!-- Giant's left arm -->
    <line x1="200" y1="250" x2="250" y2="300" class="image" /> <!-- Giant's right arm -->
    <circle cx="350" cy="200" r="70" class="image" /> <!-- World -->
    <line x1="250" y1="300" x2="350" y2="200" class="image" /> <!-- Giant pushing the world -->
  </g>
</svg>