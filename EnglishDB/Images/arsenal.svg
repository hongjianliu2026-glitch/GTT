<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arsenal</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrsənl] n. 军火库，兵工厂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ars (技艺) + enal (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"技艺(ars)"场所(enal)，里面堆满了各种武器和装备，
    <tspan x="50" dy="25">这就是一个军火库(arsenal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government decided to upgrade the national arsenal.
  </text>
  <text x="50" y="310" class="content">
    政府决定升级国家军火库。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arsenal building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Weapons -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="110" x2="100" y2="110" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <!-- Arsenal sign -->
    <text x="150" y="100" class="image" font-size="30" fill="#2C3E50">ARSENAL</text>
  </g>
</svg>