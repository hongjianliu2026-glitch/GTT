<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deathbed</text>
  <text x="50" y="120" class="subtitle">[ˈdɛθˌbɛd] n. 临终床，临终</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> death (死亡) + bed (床)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在床上，床头挂着"死亡(death)"的阴影，
    <tspan x="50" dy="25">这张床就成了临终床(deathbed)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made his peace on his deathbed.
  </text>
  <text x="50" y="310" class="content">
    他在临终前和解了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on the bed -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
    <!-- Death shadow -->
    <path d="M100,20 Q150,10 200,20 T300,20" class="image" />
    <text x="150" y="30" class="highlight" style="font-size: 24px;">死亡</text>
  </g>
</svg>