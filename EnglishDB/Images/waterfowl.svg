<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">waterfowl</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːtərˌfaʊl] n. 水禽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> water (水) + fowl (禽)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群水禽在湖面上自由游弋，"水(water)"和"禽(fowl)"
    <tspan x="50" dy="25">的结合，形成了水禽(waterfowl)的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lake was filled with various waterfowl.
  </text>
  <text x="50" y="310" class="content">
    湖里满是各种各样的水禽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#A2D9CE" />
    <!-- Ducks -->
    <circle cx="50" cy="100" r="15" class="image" fill="#F1C40F" />
    <circle cx="80" cy="100" r="15" class="image" fill="#F1C40F" />
    <circle cx="110" cy="100" r="15" class="image" fill="#F1C40F" />
    <!-- Beak -->
    <line x1="50" y1="100" x2="30" y2="90" class="image" />
    <line x1="80" y1="100" x2="60" y2="90" class="image" />
    <line x1="110" y1="100" x2="90" y2="90" class="image" />
    <!-- Wings -->
    <line x1="50" y1="85" x2="30" y2="70" class="image" />
    <line x1="50" y1="85" x2="70" y2="70" class="image" />
    <line x1="80" y1="85" x2="60" y2="70" class="image" />
    <line x1="80" y1="85" x2="100" y2="70" class="image" />
    <line x1="110" y1="85" x2="90" y2="70" class="image" />
    <line x1="110" y1="85" x2="130" y2="70" class="image" />
  </g>
</svg>