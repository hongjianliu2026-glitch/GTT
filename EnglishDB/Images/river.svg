<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">river</text>
  <text x="50" y="120" class="subtitle">[ˈrɪvər] n. 河流</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> riv (流动) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的河流，"流动(riv)"
    <tspan x="50" dy="25">的水流形成了壮观的景象，这就是河流(river)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The river flows into the ocean.
  </text>
  <text x="50" y="310" class="content">
    这条河流汇入海洋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 100 Q100 50 200 100 T400 100 T600 100 T800 100" class="water" />
    <!-- Water flow -->
    <path d="M0 100 Q100 50 200 100 T400 100 T600 100 T800 100" class="image" />
    <!-- River banks -->
    <line x1="0" y1="100" x2="800" y2="100" class="image" />
    <line x1="0" y1="100" x2="0" y2="150" class="image" />
    <line x1="800" y1="100" x2="800" y2="150" class="image" />
  </g>
</svg>