<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">noted</text>
  <text x="50" y="120" class="subtitle">[ˈnoʊtɪd] adj. 著名的，知名的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> not (标记) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个名人，他的名字被"标记(not)"在各种媒体上，
    <tspan x="50" dy="25">因此他变得"著名的(noted)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a noted author in the literary world.
  </text>
  <text x="50" y="310" class="content">
    她是文学界著名的作家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <polygon points="50,5 61,35 95,35 68,55 79,85 50,65 21,85 32,55 5,35 39,35" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="35" y2="180" class="image" />
    <line x1="50" y1="150" x2="65" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Media -->
    <rect x="10" y="200" width="80" height="50" class="image" />
    <rect x="110" y="200" width="80" height="50" class="image" />
    <rect x="210" y="200" width="80" height="50" class="image" />
    <!-- Name tag -->
    <rect x="50" y="160" width="100" height="20" class="image" />
    <text x="55" y="175" class="content">Noted Person</text>
  </g>
</svg>