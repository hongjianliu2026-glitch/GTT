<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">timeline</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪmˌlaɪn] n. 时间线，时间表</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> time (时间) + line (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条无限延伸的"时间线(time-line)"，
    <tspan x="50" dy="25">上面标记着过去、现在和未来的每一个重要时刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project manager created a timeline for the upcoming tasks.
  </text>
  <text x="50" y="310" class="content">
    项目经理为即将到来的任务创建了一个时间线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Timeline -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Time markers -->
    <circle cx="50" cy="100" r="5" class="image" />
    <circle cx="150" cy="100" r="5" class="image" />
    <circle cx="250" cy="100" r="5" class="image" />
    <circle cx="350" cy="100" r="5" class="image" />
    <!-- Labels -->
    <text x="40" y="80" class="content">过去</text>
    <text x="140" y="80" class="content">现在</text>
    <text x="240" y="80" class="content">未来</text>
  </g>
</svg>