<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fielder</text>
  <text x="50" y="120" class="subtitle">[ˈfiːldər] n. 外野手，场地工作人员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> field (场地) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个棒球比赛，一个外野手(fielder)在场地(field)上奔跑，
    <tspan x="50" dy="25">接住飞来的球，确保比赛顺利进行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fielder made an amazing catch to save the game.
  </text>
  <text x="50" y="310" class="content">
    外野手做出了一个惊人的接球，挽救了比赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fielder -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Ball -->
    <circle cx="200" cy="50" r="10" class="image" />
    <!-- Glove -->
    <rect x="40" y="150" width="20" height="10" class="image" />
    <line x1="50" y1="160" x2="60" y2="170" class="image" />
  </g>
</svg>