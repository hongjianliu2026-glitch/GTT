<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">first-quarter</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrst ˈkwɔːrtər] n. 第一季度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> first (第一) + quarter (四分之一)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，指针指向"第一季度(first-quarter)"，
    <tspan x="50" dy="25">象征着一年的开始和新的起点。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's sales in the first-quarter were impressive.
  </text>
  <text x="50" y="310" class="content">
    公司在第一季度的销售额令人印象深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Clock face -->
    <circle cx="200" cy="200" r="150" class="image" />
    <!-- Clock hands -->
    <line x1="200" y1="200" x2="200" y2="50" class="image" />
    <line x1="200" y1="200" x2="350" y2="200" class="image" />
    <!-- First quarter marker -->
    <circle cx="350" cy="200" r="10" class="image" fill="#E74C3C" />
    <text x="360" y="210" class="content" fill="#E74C3C">1st Q</text>
  </g>
</svg>