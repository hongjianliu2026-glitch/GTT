<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chi</text>
  <text x="50" y="120" class="subtitle">[tʃaɪ] n. 气，生命力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chi (气)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满活力的武士，"气(chi)"
    <tspan x="50" dy="25">在他体内流动，赋予他力量和能量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The martial artist focused his chi to perform the difficult move.
  </text>
  <text x="50" y="310" class="content">
    武术家集中他的气来完成这个高难度的动作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warrior -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Chi energy -->
    <circle cx="20" cy="80" r="5" class="image" fill="#F39C12" />
    <circle cx="30" cy="90" r="5" class="image" fill="#F39C12" />
    <circle cx="10" cy="90" r="5" class="image" fill="#F39C12" />
    <circle cx="20" cy="100" r="5" class="image" fill="#F39C12" />
    <circle cx="25" cy="110" r="5" class="image" fill="#F39C12" />
    <circle cx="15" cy="110" r="5" class="image" fill="#F39C12" />
  </g>
</svg>