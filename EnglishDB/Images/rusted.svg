<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #A84343; }
      .subtitle { font: italic 24px serif; fill: #5C3D3D; }
      .content { font: 18px sans-serif; fill: #4A4A4A; }
      .highlight { font-weight: bold; fill: #D35400; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .rust { fill: #B7410E; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rusted</text>
  <text x="50" y="120" class="subtitle">[ˈrʌstɪd] adj. 生锈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rust (锈) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆老旧的自行车，"锈迹斑斑(rust-ed)"，
    <tspan x="50" dy="25">车轮和车架都被锈蚀覆盖，仿佛时间在它身上留下了痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old gate was completely rusted and needed replacement.
  </text>
  <text x="50" y="310" class="content">
    那扇旧门完全生锈了，需要更换。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle frame -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Rust spots -->
    <circle cx="80" cy="50" r="15" class="rust" />
    <circle cx="120" cy="80" r="15" class="rust" />
    <circle cx="160" cy="110" r="15" class="rust" />
    <circle cx="200" cy="140" r="15" class="rust" />
    <!-- Bicycle wheels -->
    <circle cx="100" cy="180" r="30" class="image" />
    <circle cx="250" cy="180" r="30" class="image" />
    <!-- Rust on wheels -->
    <circle cx="100" cy="180" r="20" class="rust" />
    <circle cx="250" cy="180" r="20" class="rust" />
  </g>
</svg>