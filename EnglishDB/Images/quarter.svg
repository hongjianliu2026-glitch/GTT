<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quarter</text>
  <text x="50" y="120" class="subtitle">[ˈkwɔːrtər] n. 四分之一；季度；一刻钟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quart (四) + -er (表示名词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆形披萨被切成四份，每一份就是一个"四分之一(quarter)"。
    <tspan x="50" dy="25">或者想象一个时钟，15分钟就是一刻钟(quarter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent a quarter of her salary on rent.
  </text>
  <text x="50" y="310" class="content">
    她把工资的四分之一花在了房租上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pizza -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <line x1="175" y1="100" x2="175" y2="180" class="image" />
    <line x1="175" y1="100" x2="95" y2="100" class="image" />
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <!-- Clock -->
    <circle cx="175" cy="300" r="80" class="image" />
    <line x1="175" y1="300" x2="175" y2="220" class="image" />
    <line x1="175" y1="300" x2="255" y2="300" class="image" />
  </g>
</svg>