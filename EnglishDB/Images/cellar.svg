<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cellar</text>
  <text x="50" y="120" class="subtitle">[ˈsɛlər] n. 地窖，地下室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cell (小房间) + -ar (表示地点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的城堡，"小房间(cell)"
    <tspan x="50" dy="25">在地下，变成了一个地窖(cellar)，</tspan>
    <tspan x="50" dy="25">里面堆满了陈年的酒桶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They found old wine in the cellar.
  </text>
  <text x="50" y="310" class="content">
    他们在地窖里发现了陈年老酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cellar entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <!-- Wine barrels -->
    <circle cx="70" cy="120" r="30" class="image" />
    <circle cx="130" cy="120" r="30" class="image" />
    <circle cx="190" cy="120" r="30" class="image" />
    <!-- Wine labels -->
    <text x="50" y="140" class="content">Wine</text>
    <text x="110" y="140" class="content">Wine</text>
    <text x="170" y="140" class="content">Wine</text>
  </g>
</svg>