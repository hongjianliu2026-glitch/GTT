<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">faded</text>
  <text x="50" y="120" class="subtitle">[feɪdɪd] adj. 褪色的，凋谢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fade (褪色) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵花在阳光下逐渐"褪色(fade)"，
    <tspan x="50" dy="25">最终变得"凋谢(faded)"，颜色不再鲜艳。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The once vibrant painting had faded over time.
  </text>
  <text x="50" y="310" class="content">
    曾经色彩鲜艳的画作随着时间的流逝已经褪色了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Fading flower -->
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="220" cy="100" r="15" class="image" />
    <circle cx="240" cy="100" r="10" class="image" />
    <circle cx="260" cy="100" r="5" class="image" />
    <!-- Stem -->
    <line x1="230" y1="120" x2="230" y2="180" class="image" />
    <!-- Leaves -->
    <line x1="230" y1="140" x2="210" y2="160" class="image" />
    <line x1="230" y1="140" x2="250" y2="160" class="image" />
  </g>
</svg>