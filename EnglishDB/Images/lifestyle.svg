<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lifestyle</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪfstaɪl] n. 生活方式</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> life (生活) + style (方式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在海边度假，享受着阳光和海风，
    <tspan x="50" dy="25">这就是他的"生活(life)方式(style)"，即生活方式(lifestyle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She adopted a healthier lifestyle after her doctor's advice.
  </text>
  <text x="50" y="310" class="content">
    在医生的建议下，她采纳了更健康的生活方式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" fill="#F1C40F" />
    <!-- Beach -->
    <rect x="0" y="100" width="350" height="150" fill="#D4AC0D" />
    <!-- Person -->
    <circle cx="100" cy="150" r="20" fill="#2C3E50" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="70" y2="180" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
    <!-- Umbrella -->
    <path d="M150,100 L180,100 L165,50 Z" fill="#E74C3C" />
    <!-- Chair -->
    <rect x="200" y="150" width="50" height="30" fill="#8E44AD" />
    <line x1="200" y1="180" x2="250" y2="180" class="image" />
  </g>
</svg>