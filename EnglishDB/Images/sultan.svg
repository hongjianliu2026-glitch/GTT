<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sultan</text>
  <text x="50" y="120" class="subtitle">[ˈsʌltən] n. 苏丹（某些伊斯兰国家的统治者）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sul- (统治) + tan (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个威严的统治者，头戴王冠，手持权杖，
    <tspan x="50" dy="25">统治着他的王国，他就是苏丹(sultan)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sultan ruled the kingdom with wisdom and justice.
  </text>
  <text x="50" y="310" class="content">
    苏丹以智慧和公正统治着王国。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <path d="M50 20 L70 0 L90 20 Z" class="image" />
    <path d="M60 20 L80 10 L100 20 Z" class="image" />
    <!-- Scepter -->
    <line x1="70" y1="40" x2="70" y2="150" class="image" />
    <circle cx="70" cy="160" r="10" class="image" />
    <!-- Ruler -->
    <circle cx="70" cy="100" r="20" class="image" />
    <line x1="70" y1="120" x2="70" y2="180" class="image" />
    <line x1="70" y1="180" x2="50" y2="210" class="image" />
    <line x1="70" y1="180" x2="90" y2="210" class="image" />
    <line x1="70" y1="140" x2="100" y2="130" class="image" />
  </g>
</svg>