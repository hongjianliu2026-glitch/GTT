<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tree { fill: #27AE60; }
      .leaf { fill: #1E8449; }
      .animal { fill: #C0392B; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jungle</text>
  <text x="50" y="120" class="subtitle">[ˈdʒʌŋɡl] n. 丛林，密林</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jung (丛林) + -le (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片茂密的丛林(jungle)，"小丛林(jung-le)"
    <tspan x="50" dy="25">里充满了各种奇特的动植物，仿佛进入了一个神秘的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The explorer ventured deep into the jungle.
  </text>
  <text x="50" y="310" class="content">
    探险家深入丛林探险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trees -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="30" height="160" class="tree" />
    <rect x="100" y="20" width="30" height="160" class="tree" />
    <rect x="150" y="20" width="30" height="160" class="tree" />
    <rect x="200" y="20" width="30" height="160" class="tree" />
    <rect x="250" y="20" width="30" height="160" class="tree" />
    <!-- Leaves -->
    <circle cx="65" cy="10" r="20" class="leaf" />
    <circle cx="115" cy="10" r="20" class="leaf" />
    <circle cx="165" cy="10" r="20" class="leaf" />
    <circle cx="215" cy="10" r="20" class="leaf" />
    <circle cx="265" cy="10" r="20" class="leaf" />
    <!-- Animal -->
    <circle cx="185" cy="120" r="15" class="animal" />
    <line x1="185" y1="135" x2="185" y2="160" class="image" />
    <line x1="185" y1="160" x2="170" y2="180" class="image" />
    <line x1="185" y1="160" x2="200" y2="180" class="image" />
    <line x1="185" y1="145" x2="210" y2="135" class="image" />
  </g>
</svg>