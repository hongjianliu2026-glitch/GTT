<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">camouflage</text>
  <text x="50" y="120" class="subtitle">[ˈkæməˌflɑːʒ] n. 伪装，掩饰；v. 伪装，掩饰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> camou- (伪装) + flage (旗帜)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只变色龙，它用"伪装(camou-)"
    <tspan x="50" dy="25">自己的颜色来"旗帜(flage)"，融入周围环境，</tspan>
    <tspan x="50" dy="25">这样就没人能发现它了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers used camouflage to hide from the enemy.
  </text>
  <text x="50" y="310" class="content">
    士兵们使用伪装来躲避敌人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Background for the image -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tree trunk -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Leaves -->
    <circle cx="75" cy="30" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="125" cy="30" r="20" class="image" />
    <!-- Camouflaged animal (Chameleon) -->
    <circle cx="75" cy="100" r="15" class="image" />
    <line x1="75" y1="115" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="60" y2="180" class="image" />
    <line x1="75" y1="150" x2="90" y2="180" class="image" />
    <line x1="75" y1="130" x2="100" y2="120" class="image" />
  </g>
</svg>