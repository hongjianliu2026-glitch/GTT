<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pensive</text>
  <text x="50" y="120" class="subtitle">[ˈpɛnsɪv] adj. 沉思的，忧郁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pens (悬挂) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在窗前，"悬挂(pens)"着思绪，
    <tspan x="50" dy="25">沉浸在深深的思考中，脸上带着忧郁的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sat pensive by the window, lost in thought.
  </text>
  <text x="50" y="310" class="content">
    她坐在窗前沉思，陷入了深深的思考。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Window -->
    <rect x="0" y="0" width="350" height="250" class="image" />
    <!-- Person -->
    <circle cx="175" cy="125" r="30" class="image" />
    <line x1="175" y1="155" x2="175" y2="220" class="image" />
    <line x1="175" y1="180" x2="140" y2="160" class="image" />
    <line x1="175" y1="180" x2="210" y2="160" class="image" />
    <line x1="175" y1="220" x2="140" y2="250" class="image" />
    <line x1="175" y1="220" x2="210" y2="250" class="image" />
    <!-- Thought bubble -->
    <ellipse cx="175" cy="70" rx="50" ry="30" class="image" />
    <line x1="175" y1="70" x2="175" y2="40" class="image" />
    <line x1="175" y1="40" x2="150" y2="20" class="image" />
    <line x1="175" y1="40" x2="200" y2="20" class="image" />
  </g>
</svg>