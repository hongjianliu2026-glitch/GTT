<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">casino</text>
  <text x="50" y="120" class="subtitle">[kəˈsiːnoʊ] n. 赌场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cas (房子) + -ino (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小房子(-ino)里，人们围着桌子玩各种赌博游戏，
    <tspan x="50" dy="25">这个小房子就是赌场(casino)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spent the night at the casino, trying his luck.
  </text>
  <text x="50" y="310" class="content">
    他在赌场度过了一夜，试图碰碰运气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Casino building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Small house -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Gambling table -->
    <rect x="80" y="50" width="200" height="100" class="image" />
    <!-- Cards -->
    <polygon points="100,60 120,80 100,100 80,80" class="image" />
    <polygon points="140,60 160,80 140,100 120,80" class="image" />
    <polygon points="180,60 200,80 180,100 160,80" class="image" />
    <!-- People -->
    <circle cx="120" cy="120" r="10" class="image" />
    <circle cx="160" cy="120" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
  </g>
</svg>