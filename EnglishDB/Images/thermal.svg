<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thermal</text>
  <text x="50" y="120" class="subtitle">[ˈθɜːrməl] adj. 热的，热量的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> therm (热) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太阳，"热(therm)"得让人无法靠近，
    <tspan x="50" dy="25">周围的一切都被热浪包围，这就是"热的(thermal)"感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thermal springs are popular among tourists.
  </text>
  <text x="50" y="310" class="content">
    温泉很受游客欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="80" class="image" fill="#F1C40F" />
    <!-- Heat waves -->
    <line x1="20" y1="20" x2="180" y2="180" class="image" stroke-dasharray="10,10" />
    <line x1="20" y1="40" x2="180" y2="200" class="image" stroke-dasharray="10,10" />
    <line x1="20" y1="60" x2="180" y2="220" class="image" stroke-dasharray="10,10" />
    <!-- Person feeling the heat -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
    <line x1="250" y1="130" x2="220" y2="120" class="image" />
  </g>
</svg>