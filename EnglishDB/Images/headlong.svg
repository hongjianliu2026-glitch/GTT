<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">headlong</text>
  <text x="50" y="120" class="subtitle">[ˈhɛdlɔŋ] adv. 头向前地，轻率地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> head (头) + long (长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"头向前(head)"，"长长地(long)"冲向目标，
    <tspan x="50" dy="25">这种急切和轻率的行为就是headlong。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He jumped headlong into the river to save the child.
  </text>
  <text x="50" y="310" class="content">
    他头向前地跳进河里去救孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person running head first -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="150" class="image" /> <!-- Right arm -->
    <!-- Arrow indicating direction -->
    <line x1="80" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,100 140,90 140,110" class="image" />
  </g>
</svg>