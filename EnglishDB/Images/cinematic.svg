<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cinematic</text>
  <text x="50" y="120" class="subtitle">[ˌsɪnɪˈmætɪk] adj. 电影的，电影般的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cine- (电影) + -matic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的电影屏幕，上面播放着一部"电影般的(cinematic)"
    <tspan x="50" dy="25">场景，观众们被深深吸引，仿佛置身于电影世界中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The director's cinematic vision brought the story to life.
  </text>
  <text x="50" y="310" class="content">
    导演的电影般的视角让故事栩栩如生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Movie screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Film strip -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Film frames -->
    <rect x="70" y="40" width="50" height="50" class="image" />
    <rect x="140" y="40" width="50" height="50" class="image" />
    <rect x="210" y="40" width="50" height="50" class="image" />
    <!-- Audience -->
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
  </g>
</svg>