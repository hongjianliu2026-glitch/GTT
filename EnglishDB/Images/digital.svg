<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">digital</text>
  <text x="50" y="120" class="subtitle">[ˈdɪdʒɪtl] adj. 数字的，数码的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> digit (手指) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的计算器，上面有十个按钮，每个按钮代表一个手指(digit)，
    <tspan x="50" dy="25">这些按钮构成了数字(digital)的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers digital books over traditional paper ones.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢电子书而不是传统的纸质书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calculator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Buttons -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Display -->
    <rect x="50" y="150" width="250" height="30" class="image" />
  </g>
</svg>