<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hamburger</text>
  <text x="50" y="120" class="subtitle">[ˈhæmbɜːrɡər] n. 汉堡包</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ham (火腿) + burger (汉堡)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的火腿(ham)被夹在两片面包之间，
    <tspan x="50" dy="25">形成了一个美味的汉堡包(hamburger)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He ordered a hamburger with extra cheese.
  </text>
  <text x="50" y="310" class="content">
    他点了一个加额外奶酪的汉堡包。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bread top -->
    <rect x="50" y="20" width="250" height="30" class="image" />
    <!-- Meat patty -->
    <rect x="70" y="60" width="210" height="40" class="image" />
    <!-- Cheese -->
    <rect x="80" y="110" width="190" height="10" class="image" />
    <!-- Lettuce -->
    <rect x="90" y="130" width="170" height="10" class="image" />
    <!-- Tomato -->
    <rect x="100" y="150" width="150" height="10" class="image" />
    <!-- Bread bottom -->
    <rect x="50" y="180" width="250" height="30" class="image" />
  </g>
</svg>