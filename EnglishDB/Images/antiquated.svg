<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antiquated</text>
  <text x="50" y="120" class="subtitle">[ˈæntɪˌkweɪtɪd] adj. 过时的，陈旧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (前) + qua (时代) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的钟表，"前时代(anti-qua)"
    <tspan x="50" dy="25">的遗物，它已经过时(antiquated)，不再被使用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The antiquated machinery was replaced by modern equipment.
  </text>
  <text x="50" y="310" class="content">
    那台过时的机器被现代设备取代了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Rusty effect -->
    <circle cx="100" cy="100" r="75" class="image" stroke-dasharray="5,5" />
    <!-- Broken chain -->
    <line x1="20" y1="100" x2="80" y2="100" class="image" />
    <line x1="20" y1="100" x2="50" y2="120" class="image" />
    <line x1="20" y1="100" x2="50" y2="80" class="image" />
  </g>
</svg>