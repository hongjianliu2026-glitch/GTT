<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relief</text>
  <text x="50" y="120" class="subtitle">[rɪˈliːf] n. 缓解，减轻；救济</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + lief (轻)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在经历痛苦后，"再次减轻(re-lief)"
    <tspan x="50" dy="25">了负担，脸上露出了轻松的表情，这就是缓解(relief)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The medicine brought immediate relief from the pain.
  </text>
  <text x="50" y="310" class="content">
    这种药物立即缓解了疼痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Relief expression -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="45" y1="85" x2="55" y2="85" class="image" />
    <line x1="45" y1="85" x2="40" y2="90" class="image" />
    <line x1="55" y1="85" x2="60" y2="90" class="image" />
    <line x1="45" y1="110" x2="55" y2="110" class="image" />
    <!-- Medicine -->
    <rect x="100" y="80" width="50" height="30" class="image" />
    <line x1="105" y1="90" x2="145" y2="90" class="image" />
    <line x1="105" y1="100" x2="145" y2="100" class="image" />
    <line x1="105" y1="110" x2="145" y2="110" class="image" />
  </g>
</svg>