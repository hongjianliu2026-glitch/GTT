<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Mexican-American</text>
  <text x="50" y="120" class="subtitle">[ˌmɛksɪˈkæn əˈmɛrɪkən] n. 美籍墨西哥人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Mexican (墨西哥的) + American (美国的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着墨西哥宽边帽的人，站在美国国旗前，
    <tspan x="50" dy="25">象征着墨西哥和美国文化的融合，这就是美籍墨西哥人(Mexican-American)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many Mexican-Americans celebrate both Mexican and American holidays.
  </text>
  <text x="50" y="310" class="content">
    许多美籍墨西哥人同时庆祝墨西哥和美国的节日。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mexican hat -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="130" x2="100" y2="120" class="image" />
