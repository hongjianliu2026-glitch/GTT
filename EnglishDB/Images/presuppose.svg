<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">presuppose</text>
  <text x="50" y="120" class="subtitle">[ˌpriːsəˈpoʊz] v. 预先假定，推测</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + suppose (假定)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考问题时，"提前假定(pre-suppose)"
    <tspan x="50" dy="25">某些条件已经成立，然后再进行推理。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His argument presupposes that everyone has the same knowledge.
  </text>
  <text x="50" y="310" class="content">
    他的论点预先假定每个人拥有相同的知识。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thought bubble -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="150" cy="50" r="30" class="image" />
    <circle cx="200" cy="100" r="40" class="image" />
    <!-- Person thinking -->
    <circle cx="100" cy="250" r="30" class="image" />
    <line x1="100" y1="280" x2="100" y2="350" class="image" />
    <line x1="100" y1="350" x2="70" y2="380" class="image" />
    <line x1="100" y1="350" x2="130" y2="380" class="image" />
    <line x1="100" y1="320" x2="150" y2="310" class="image" />
  </g>
</svg>