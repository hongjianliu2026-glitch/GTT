<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">planner</text>
  <text x="50" y="120" class="subtitle">[ˈplænər] n. 计划者，规划者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plan (计划) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个计划者(planner)在一张巨大的纸上，"规划(plan)"
    <tspan x="50" dy="25">未来的蓝图，他的笔在纸上飞舞，勾勒出一个个详细的计划。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a meticulous planner who always prepares for every eventuality.
  </text>
  <text x="50" y="310" class="content">
    她是一个细致的计划者，总是为每一种可能的情况做好准备。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Planner -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Pen -->
    <line x1="20" y1="115" x2="70" y2="80" class="image" />
    <line x1="70" y1="80" x2="80" y2="70" class="image" />
    <!-- Plans -->
    <line x1="100" y1="50" x2="300" y2="50" class="image" />
    <line x1="100" y1="80" x2="250" y2="80" class="image" />
    <line x1="100" y1="110" x2="270" y2="110" class="image" />
    <line x1="100" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>