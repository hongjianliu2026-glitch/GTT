<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enjoy</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdʒɔɪ] v. 享受，喜爱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + joy (快乐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在阳光下，"使自己快乐(en-joy)"
    <tspan x="50" dy="25">地享受着美好的时光，脸上洋溢着幸福的笑容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She enjoys reading books in the park.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在公园里读书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="200" cy="150" r="20" class="image" fill="#2ECC71" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="190" x2="240" y2="180" class="image" />
    <!-- Smile -->
    <path d="M190,160 Q200,150 210,160" class="image" fill="none" />
    <!-- Book -->
    <rect x="250" y="130" width="50" height="40" class="image" fill="#8E44AD" />
  </g>
</svg>