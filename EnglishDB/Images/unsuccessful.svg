<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unsuccessful</text>
  <text x="50" y="120" class="subtitle">[ˌʌnsəkˈsesfəl] adj. 不成功的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + success (成功) + -ful (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在努力尝试后，"没有成功(un-success-ful)"，
    <tspan x="50" dy="25">最终失望地坐在地上，周围散落着失败的痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His attempt to climb the mountain was unsuccessful.
  </text>
  <text x="50" y="310" class="content">
    他试图攀登那座山的尝试没有成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person sitting -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Broken items -->
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
    <line x1="100" y1="120" x2="120" y2="100" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />
    <line x1="150" y1="120" x2="170" y2="100" class="image" />
    <!-- Disappointment -->
    <text x="200" y="110" class="content" style="fill: #C0392B;">失望</text>
  </g>
</svg>