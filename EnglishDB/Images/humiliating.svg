<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humiliating</text>
  <text x="50" y="120" class="subtitle">[hjuːˈmɪlieɪtɪŋ] adj. 羞辱的，丢脸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> humil (低) + -ate (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"压低(humil)"到地面上，
    <tspan x="50" dy="25">周围的人都在嘲笑他，这种感觉就是"羞辱的(humiliating)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The public humiliation made him feel worthless.
  </text>
  <text x="50" y="310" class="content">
    公开的羞辱让他感到毫无价值。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Person being humiliated -->
    <circle cx="100" cy="160" r="20" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="220" class="image" />
    <line x1="100" y1="200" x2="120" y2="220" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
    <!-- People laughing -->
    <circle cx="200" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <circle cx="300" cy="150" r="15" class="image" />
    <line x1="200" y1="165" x2="200" y2="180" class="image" />
    <line x1="250" y1="165" x2="250" y2="180" class="image" />
    <line x1="300" y1="165" x2="300" y2="180" class="image" />
    <line x1="190" y1="180" x2="210" y2="180" class="image" />
    <line x1="240" y1="180" x2="260" y2="180" class="image" />
    <line x1="290" y1="180" x2="310" y2="180" class="image" />
  </g>
</svg>