<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">submarine</text>
  <text x="50" y="120" class="subtitle">[ˌsʌbməˈriːn] n. 潜水艇；adj. 水下的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + marine (海的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘潜水艇在海底，"在海下面(sub-marine)"
    <tspan x="50" dy="25">悄悄地航行，探索深海的奥秘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The submarine can dive to a depth of 300 meters.
  </text>
  <text x="50" y="310" class="content">
    这艘潜水艇可以下潜到300米深。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Submarine -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <rect x="50" y="20" width="250" height="60" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Waves -->
    <path d="M0,100 Q50,50 100,100 T200,100 T300,100 T400,100" class="image" />
    <path d="M0,120 Q50,70 100,120 T200,120 T300,120 T400,120" class="image" />
    <path d="M0,140 Q50,90 100,140 T200,140 T300,140 T400,140" class="image" />
  </g>
</svg>