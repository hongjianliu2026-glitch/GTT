<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unpredictable</text>
  <text x="50" y="120" class="subtitle">[ˌʌnprɪˈdɪktəbl] adj. 不可预测的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + predict (预测) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天气预报员站在屏幕前，屏幕上显示着"不可预测(unpredictable)"
    <tspan x="50" dy="25">的天气，突然天空裂开，一只巨大的手从天而降，</tspan>
    <tspan x="50" dy="25">试图抓住那不可预测的天气，但天气却像幽灵一样消失无踪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The stock market is notoriously unpredictable.
  </text>
  <text x="50" y="330" class="content">
    股市以不可预测著称。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Weather screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Clouds -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Lightning -->
    <line x1="100" y1="50" x2="250" y2="150" class="image" />
    <!-- Giant hand -->
    <line x1="300" y1="0" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="300" y2="200" class="image" />
    <line x1="250" y1="100" x2="200" y2="150" class="image" />
    <line x1="250" y1="100" x2="300" y2="150" class="image" />
  </g>
</svg>