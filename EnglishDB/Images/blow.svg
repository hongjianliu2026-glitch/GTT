<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blow</text>
  <text x="50" y="120" class="subtitle">[bloʊ] v. 吹，吹气；n. 打击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blow (源自古英语 blawan，意为“吹”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一阵狂风"吹(blow)"过，把树上的叶子都吹得飞舞起来，
    <tspan x="50" dy="25">场面壮观，令人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wind blew the leaves off the trees.
  </text>
  <text x="50" y="310" class="content">
    风把树叶从树上吹落了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wind -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="20" x2="350" y2="220" class="image" />
    <line x1="0" y1="40" x2="350" y2="240" class="image" />
    <line x1="0" y1="60" x2="350" y2="260" class="image" />
    <!-- Leaves -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="200" cy="140" r="10" class="image" />
    <circle cx="250" cy="160" r="10" class="image" />
    <!-- Tree -->
    <rect x="300" y="0" width="50" height="200" class="image" />
    <circle cx="325" cy="20" r="20" class="image" />
    <circle cx="300" cy="50" r="20" class="image" />
    <circle cx="350" cy="50" r="20" class="image" />
  </g>
</svg>