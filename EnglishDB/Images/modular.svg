<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">modular</text>
  <text x="50" y="120" class="subtitle">[ˈmɒdʒələ(r)] adj. 模块化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> modul (模块) + -ar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的乐高积木工厂，"模块(modul)"
    <tspan x="50" dy="25">可以随意组合和拆分，这就是模块化(modular)的精髓。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new system is designed to be modular, allowing easy upgrades.
  </text>
  <text x="50" y="310" class="content">
    新系统设计为模块化，便于升级。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lego blocks -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <rect x="110" y="0" width="100" height="50" class="image" />
    <rect x="220" y="0" width="100" height="50" class="image" />
    <rect x="0" y="60" width="100" height="50" class="image" />
    <rect x="110" y="60" width="100" height="50" class="image" />
    <rect x="220" y="60" width="100" height="50" class="image" />
    <!-- Connecting lines -->
    <line x1="100" y1="25" x2="110" y2="25" class="image" />
    <line x1="210" y1="25" x2="220" y2="25" class="image" />
    <line x1="100" y1="85" x2="110" y2="85" class="image" />
    <line x1="210" y1="85" x2="220" y2="85" class="image" />
  </g>
</svg>