<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ricochet</text>
  <text x="50" y="120" class="subtitle">[ˈrɪkəʃeɪ] v. 跳弹，反弹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ricochet (源自法语，意为“跳跃”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗子弹从墙壁上"跳跃(ricochet)"，
    <tspan x="50" dy="25">反弹回来，划出一道弧线，留下一道闪光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bullet ricocheted off the wall and hit the ceiling.
  </text>
  <text x="50" y="310" class="content">
    子弹从墙上反弹，击中了天花板。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bullet path -->
    <line x1="50" y1="180" x2="200" y2="20" class="image" />
    <line x1="200" y1="20" x2="300" y2="180" class="image" />
    <!-- Bullet -->
    <circle cx="50" cy="180" r="10" class="image" />
    <circle cx="200" cy="20" r="10" class="image" />
    <circle cx="300" cy="180" r="10" class="image" />
  </g>
</svg>