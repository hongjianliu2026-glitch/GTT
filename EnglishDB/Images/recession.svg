<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recession</text>
  <text x="50" y="120" class="subtitle">[rɪˈseʃən] n. 衰退，不景气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + cess (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象经济像一辆车，突然"向后走(re-cess)"，
    <tspan x="50" dy="25">结果就是经济衰退(recession)，大家都感到不景气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The recession caused many businesses to close.
  </text>
  <text x="50" y="310" class="content">
    经济衰退导致许多企业倒闭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car moving backwards -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <line x1="100" y1="20" x2="100" y2="70" class="image" />
    <line x1="100" y1="70" x2="50" y2="70" class="image" />
    <line x1="50" y1="70" x2="50" y2="20" class="image" />
    <!-- Arrow pointing backwards -->
    <line x1="200" y1="40" x2="250" y2="40" class="image" />
    <line x1="250" y1="40" x2="225" y2="20" class="image" />
    <line x1="250" y1="40" x2="225" y2="60" class="image" />
    <!-- Text on arrow -->
    <text x="210" y="35" class="content">re-</text>
  </g>
</svg>