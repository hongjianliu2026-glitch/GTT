<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gunshot</text>
  <text x="50" y="120" class="subtitle">[ˈɡʌnʃɒt] n. 枪声，枪击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gun (枪) + shot (射击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着枪，"砰"的一声，枪口冒出烟雾，
    <tspan x="50" dy="25">这就是枪声(gunshot)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gunshot echoed through the forest.
  </text>
  <text x="50" y="310" class="content">
    枪声在森林中回荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gun -->
    <rect x="0" y="0" width="150" height="50" class="image" />
    <rect x="150" y="20" width="50" height="10" class="image" />
    <!-- Smoke -->
    <circle cx="200" cy="25" r="10" class="image" />
    <circle cx="210" cy="20" r="12" class="image" />
    <circle cx="220" cy="15" r="14" class="image" />
  </g>
</svg>