<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grudging</text>
  <text x="50" y="120" class="subtitle">[ˈɡrʌdʒɪŋ] adj. 不情愿的，勉强的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grudge (怨恨) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为怨恨(grudge)而勉强(grudging)
    <tspan x="50" dy="25">地做某事，脸上露出不情愿的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gave a grudging apology after the argument.
  </text>
  <text x="50" y="310" class="content">
    他在争吵后勉强道了歉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with grudging expression -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <!-- Unhappy face -->
    <circle cx="40" cy="40" r="5" class="image" />
    <circle cx="60" cy="40" r="5" class="image" />
    <line x1="45" y1="60" x2="55" y2="60" class="image" />
    <line x1="45" y1="60" x2="40" y2="55" class="image" />
    <line x1="55" y1="60" x2="60" y2="55" class="image" />
  </g>
</svg>