<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vastly</text>
  <text x="50" y="120" class="subtitle">[ˈvæstli] adv. 巨大地，非常地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vast (巨大的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宇宙，"vast(巨大的)"
    <tspan x="50" dy="25">空间中充满了无数的星星，这就是vastly(巨大地)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The universe is vastly larger than we can imagine.
  </text>
  <text x="50" y="310" class="content">
    宇宙比我们能想象的要大得多。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large circle representing the universe -->
    <circle cx="175" cy="100" r="150" class="image" />
    <!-- Stars -->
    <circle cx="75" cy="50" r="5" class="image" />
    <circle cx="275" cy="50" r="5" class="image" />
    <circle cx="175" cy="200" r="5" class="image" />
    <circle cx="100" cy="150" r="5" class="image" />
    <circle cx="250" cy="150" r="5" class="image" />
  </g>
</svg>