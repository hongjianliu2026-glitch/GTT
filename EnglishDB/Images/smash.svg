<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smash</text>
  <text x="50" y="120" class="subtitle">[smæʃ] v. 粉碎，猛击；n. 猛击，破碎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smas (粉碎)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"猛击(smash)"
    <tspan x="50" dy="25">地面，地面瞬间粉碎成无数碎片，</tspan>
    <tspan x="50" dy="25">这个画面让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He accidentally smashed the vase with a hammer.
  </text>
  <text x="50" y="310" class="content">
    他不小心用锤子砸碎了花瓶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <rect x="0" y="0" width="100" height="20" class="image" />
    <rect x="40" y="20" width="20" height="100" class="image" />
    <!-- Cracked ground -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <line x1="150" y1="140" x2="250" y2="140" class="image" />
    <line x1="150" y1="160" x2="250" y2="160" class="image" />
    <line x1="150" y1="180" x2="250" y2="180" class="image" />
    <line x1="150" y1="200" x2="250" y2="200" class="image" />
    <!-- Cracks -->
    <line x1="150" y1="100" x2="250" y2="200" class="image" />
    <line x1="250" y1="100" x2="150" y2="200" class="image" />
  </g>
</svg>