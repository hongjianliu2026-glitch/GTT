<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">platoon</text>
  <text x="50" y="120" class="subtitle">[pləˈtuːn] n. 排，小队</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plat (平) + oon (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群士兵排成一个"平(plat)"面，形成一个小队(oon)，
    <tspan x="50" dy="25">这就是一个排(platoon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The platoon was ordered to advance.
  </text>
  <text x="50" y="310" class="content">
    排被命令前进。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldiers in a line -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="50" y1="80" x2="350" y2="80" class="image" />
    <line x1="50" y1="110" x2="350" y2="110" class="image" />
    <line x1="50" y1="140" x2="350" y2="140" class="image" />
    <!-- Soldiers -->
    <circle cx="100" cy="35" r="15" class="image" />
    <circle cx="150" cy="35" r="15" class="image" />
    <circle cx="200" cy="35" r="15" class="image" />
    <circle cx="250" cy="35" r="15" class="image" />
    <circle cx="300" cy="35" r="15" class="image" />
  </g>
</svg>