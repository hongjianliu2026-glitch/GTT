<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sweaty</text>
  <text x="50" y="120" class="subtitle">[ˈsweti] adj. 出汗的，汗湿的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sweat (汗) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在炎热的夏天跑步，汗水(sweat)
    <tspan x="50" dy="25">像瀑布一样流下来，全身湿透，这就是"汗湿的(sweaty)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the marathon, he was completely sweaty.
  </text>
  <text x="50" y="310" class="content">
    马拉松结束后，他全身都是汗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person running -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Sweat drops -->
    <circle cx="60" cy="90" r="5" class="image" />
    <circle cx="70" cy="85" r="5" class="image" />
    <circle cx="80" cy="80" r="5" class="image" />
    <circle cx="90" cy="75" r="5" class="image" />
  </g>
</svg>