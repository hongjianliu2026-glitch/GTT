<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accused</text>
  <text x="50" y="120" class="subtitle">[əˈkjuːzd] adj. 被控告的，被指责的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (朝向) + cuse (控告)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"朝向(ac-)"法庭，"控告(cuse)"
    <tspan x="50" dy="25">他的行为，这个人就成了被控告的(accused)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accused man stood before the judge.
  </text>
  <text x="50" y="310" class="content">
    被控告的男子站在法官面前。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Judge -->
    <circle cx="100" cy="45" r="15" class="image" />
    <line x1="100" y1="60" x2="100" y2="90" class="image" />
    <line x1="100" y1="90" x2="80" y2="120" class="image" />
    <line x1="100" y1="90" x2="120" y2="120" class="image" />
    <!-- Accused -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
    <!-- Arrows pointing to accused -->
    <line x1="100" y1="45" x2="250" y2="100" class="image" />
    <line x1="100" y1="45" x2="250" y2="100" class="image" />
    <line x1="100" y1="45" x2="250" y2="100" class="image" />
  </g>
</svg>