<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">probing</text>
  <text x="50" y="120" class="subtitle">[ˈproʊbɪŋ] adj. 探索的，深入调查的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + -bing (源自 "binge"，意为深入)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个侦探拿着放大镜，"向前深入(pro-bing)"
    <tspan x="50" dy="25">调查线索，试图揭开真相。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The journalist's probing questions uncovered a scandal.
  </text>
  <text x="50" y="310" class="content">
    记者深入调查的问题揭露了一桩丑闻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Detective -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Magnifying glass -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="120" class="image" />
    <!-- Clue -->
    <rect x="180" y="90" width="40" height="40" class="image" />
    <line x1="180" y1="90" x2="220" y2="130" class="image" />
    <line x1="220" y1="90" x2="180" y2="130" class="image" />
  </g>
</svg>