<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">striped</text>
  <text x="50" y="120" class="subtitle">[straɪpt] adj. 有条纹的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> strip (条纹) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只斑马，身上布满了"条纹(strip)"，
    <tspan x="50" dy="25">这些条纹让斑马看起来非常独特，就像一件有条纹的衣服。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The zebra has black and white striped fur.
  </text>
  <text x="50" y="310" class="content">
    斑马有黑白相间的条纹毛皮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Zebra body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Zebra stripes -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <!-- Zebra head -->
    <circle cx="20" cy="100" r="30" class="image" />
    <!-- Zebra ears -->
    <line x1="10" y1="70" x2="0" y2="50" class="image" />
    <line x1="30" y1="70" x2="40" y2="50" class="image" />
  </g>
</svg>