<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stipulation</text>
  <text x="50" y="120" class="subtitle">[ˌstɪpjuˈleɪʃn] n. 规定，条款</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stip- (压) + -ul (小) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个合同中，"压(stip-)"着许多"小(ul)"的"规定(stipulation)"，
    <tspan x="50" dy="25">这些规定就像合同中的小石头，确保双方遵守。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The contract included a stipulation about payment terms.
  </text>
  <text x="50" y="310" class="content">
    合同中包含了一项关于付款条款的规定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Contract -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stipulations -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="250" y2="80" class="image" />
    <line x1="50" y1="110" x2="270" y2="110" class="image" />
    <line x1="50" y1="140" x2="240" y2="140" class="image" />
    <!-- Stones -->
    <circle cx="70" cy="65" r="10" class="image" />
    <circle cx="120" cy="95" r="10" class="image" />
    <circle cx="170" cy="125" r="10" class="image" />
    <circle cx="220" cy="155" r="10" class="image" />
  </g>
</svg>