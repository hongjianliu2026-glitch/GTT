<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-dimensional</text>
  <text x="50" y="120" class="subtitle">[ˌθriː dɪˈmenʃənl] adj. 三维的，立体的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + dimension (维度)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个立方体，它有三个维度：长、宽、高。
    <tspan x="50" dy="25">这个立方体就是三维(three-dimensional)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was shot in three-dimensional format.
  </text>
  <text x="50" y="310" class="content">
    这部电影是以三维格式拍摄的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cube -->
    <polygon points="0,0 100,0 100,100 0,100" class="image" />
    <polygon points="0,0 50,50 150,50 100,0" class="image" />
    <polygon points="100,0 150,50 150,150 100,100" class="image" />
    <polygon points="0,100 50,150 150,150 100,100" class="image" />
    <polygon points="50,50 150,50 150,150 50,150" class="image" />
  </g>
</svg>