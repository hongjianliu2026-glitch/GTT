<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dismissal</text>
  <text x="50" y="120" class="subtitle">[dɪsˈmɪsəl] n. 解雇，解散</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (离开) + miss (送) + -al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老板对员工说："你被送走(dis-miss)"，
    <tspan x="50" dy="25">然后员工拿着箱子离开办公室，这就是解雇(dismissal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His dismissal came as a shock to everyone.
  </text>
  <text x="50" y="310" class="content">
    他的解雇让所有人都感到震惊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Office desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boss -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Employee -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <line x1="250" y1="90" x2="220" y2="80" class="image" />
    <!-- Box -->
    <rect x="230" y="100" width="40" height="30" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="50" x2="230" y2="50" class="image" />
    <polygon points="230,50 220,40 220,60" class="image" />
  </g>
</svg>