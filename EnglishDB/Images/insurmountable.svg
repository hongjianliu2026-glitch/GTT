<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insurmountable</text>
  <text x="50" y="120" class="subtitle">[ˌɪn.səˈmaʊntəbl] adj. 不可逾越的，难以克服的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + surmount (克服) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的山峰，"无法克服(in-surmount-able)"
    <tspan x="50" dy="25">的障碍，就像这座山一样，难以攀登。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team faced insurmountable challenges during the project.
  </text>
  <text x="50" y="310" class="content">
    团队在项目中遇到了难以克服的挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Climber -->
    <circle cx="150" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="140" y2="180" class="image" />
    <line x1="150" y1="150" x2="160" y2="180" class="image" />
    <line x1="150" y1="130" x2="170" y2="120" class="image" />
    <!-- Question mark -->
    <text x="150" y="250" class="image" font-size="50" text-anchor="middle">?</text>
  </g>
</svg>