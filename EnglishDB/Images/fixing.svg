<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fixing</text>
  <text x="50" y="120" class="subtitle">[ˈfɪksɪŋ] n. 固定，修理；v. 固定，修理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fix (固定) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个修理工正在"固定(fix)"
    <tspan x="50" dy="25">一把坏掉的椅子，他用力拧紧螺丝，椅子终于稳固了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is good at fixing broken appliances.
  </text>
  <text x="50" y="310" class="content">
    他擅长修理坏掉的电器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken chair -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
    <!-- Repairing -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Screwdriver -->
    <line x1="205" y1="120" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="100" class="image" />
  </g>
</svg>