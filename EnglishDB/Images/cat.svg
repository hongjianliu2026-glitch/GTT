<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cat</text>
  <text x="50" y="120" class="subtitle">[kæt] n. 猫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "catte"，古英语 "catt"，拉丁语 "cattus"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在月光下，"悄悄地(cat)"
    <tspan x="50" dy="25">跳上屋顶，它的影子在墙上形成了一个神秘的图案。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat chased its own tail in circles.
  </text>
  <text x="50" y="310" class="content">
    那只猫追着自己的尾巴转圈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cat silhouette -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="250" x2="50" y2="300" class="image" /> <!-- Back leg -->
    <line x1="100" y1="250" x2="150" y2="300" class="image" /> <!-- Front leg -->
    <line x1="100" y1="180" x2="50" y2="160" class="image" /> <!-- Ear -->
    <line x1="100" y1="180" x2="150" y2="160" class="image" /> <!-- Ear -->
    <line x1="100" y1="250" x2="70" y2="220" class="image" /> <!-- Tail -->
    <line x1="70" y1="220" x2="50" y2="200" class="image" /> <!-- Tail -->
  </g>
</svg>