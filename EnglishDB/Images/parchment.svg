<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parchment</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːrtʃmənt] n. 羊皮纸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> parche (皮肤) + ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的图书馆，里面堆满了用羊皮纸(parchment)
    <tspan x="50" dy="25">制成的书籍，这些书籍都是用动物的皮肤(parche)制成的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manuscript was written on parchment.
  </text>
  <text x="50" y="310" class="content">
    手稿是用羊皮纸写的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parchment -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Animal skin -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Ancient book -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Lines on parchment -->
    <line x1="120" y1="70" x2="230" y2="70" class="image" />
    <line x1="120" y1="90" x2="230" y2="90" class="image" />
    <line x1="120" y1="110" x2="230" y2="110" class="image" />
    <line x1="120" y1="130" x2="230" y2="130" class="image" />
  </g>
</svg>