<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lofty</text>
  <text x="50" y="120" class="subtitle">[ˈlɔːfti] adj. 高耸的，崇高的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loft (阁楼) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高耸入云的塔楼，"阁楼(loft)"
    <tspan x="50" dy="25">直插云霄，象征着崇高(lofty)的精神境界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lofty mountain peaks were covered in snow.
  </text>
  <text x="50" y="310" class="content">
    高耸的山峰被雪覆盖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tower -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Cloud -->
    <ellipse cx="50" cy="20" rx="60" ry="20" class="image" />
    <ellipse cx="100" cy="40" rx="60" ry="20" class="image" />
    <ellipse cx="0" cy="60" rx="60" ry="20" class="image" />
    <!-- Peak -->
    <polygon points="50,0 20,100 80,100" class="image" />
  </g>
</svg>