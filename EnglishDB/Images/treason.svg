<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">treason</text>
  <text x="50" y="120" class="subtitle">[ˈtriːzn] n. 叛国，背叛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tra- (背叛) + -son (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个叛徒(tra-)在背后捅刀子(-son)，
    <tspan x="50" dy="25">这种行为就是叛国(treason)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was accused of treason for leaking state secrets.
  </text>
  <text x="50" y="310" class="content">
    他因泄露国家机密而被指控叛国。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traitor -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Knife -->
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="140" y2="160" class="image" />
    <line x1="150" y1="150" x2="160" y2="160" class="image" />
    <!-- Backstabbing -->
    <line x1="50" y1="150" x2="125" y2="150" class="image" />
  </g>
</svg>