<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inoculate</text>
  <text x="50" y="120" class="subtitle">[ɪˈnɒkjʊleɪt] v. 接种，预防注射</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + ocul (眼睛) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生拿着注射器，"将疫苗注入(in-)"
    <tspan x="50" dy="25">病人的体内，就像给眼睛(ocul)注入光明一样，</tspan>
    <tspan x="50" dy="25">预防疾病(inoculate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nurse inoculated the children against the flu.
  </text>
  <text x="50" y="310" class="content">
    护士给孩子们接种了流感疫苗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Syringe -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <line x1="50" y1="20" x2="50" y2="0" class="image" />
    <line x1="50" y1="20" x2="50" y2="40" class="image" />
    <line x1="50" y1="40" x2="50" y2="60" class="image" />
    <line x1="50" y1="60" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="50" y2="140" class="image" />
    <line x1="50" y1="140" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="50" y2="200" class="image" />
    <!-- Doctor -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="190" y2="130" class="image" />
  </g>
</svg>