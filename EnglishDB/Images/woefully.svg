<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">woefully</text>
  <text x="50" y="120" class="subtitle">[ˈwoʊfəli] adv. 悲伤地，悲惨地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> woe (悲伤) + -ful (充满) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在雨中，"充满悲伤(woeful)"
    <tspan x="50" dy="25">地哭泣，雨水和泪水交织在一起，显得非常悲惨(woefully)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked woefully at the broken toy.
  </text>
  <text x="50" y="310" class="content">
    她悲伤地看着坏掉的玩具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Raindrops -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="100" y1="30" x2="100" y2="110" class="image" />
    <line x1="150" y1="40" x2="150" y2="120" class="image" />
    <line x1="200" y1="50" x2="200" y2="130" class="image" />
    <!-- Person -->
    <circle cx="125" cy="150" r="20" class="image" />
    <line x1="125" y1="170" x2="125" y2="220" class="image" />
    <line x1="125" y1="220" x2="100" y2="250" class="image" />
    <line x1="125" y1="220" x2="150" y2="250" class="image" />
    <line x1="125" y1="190" x2="170" y2="180" class="image" />
    <!-- Tears -->
    <circle cx="115" cy="140" r="5" class="image" />
    <circle cx="135" cy="140" r="5" class="image" />
  </g>
</svg>