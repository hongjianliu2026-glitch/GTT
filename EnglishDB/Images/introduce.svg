<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">introduce</text>
  <text x="50" y="120" class="subtitle">[ˌɪntrəˈdjuːs] v. 介绍，引进</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> intro- (向内) + duce (引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在门口，"向内引导(intro-duce)"
    <tspan x="50" dy="25">一位新朋友进入房间，这就是介绍(introduce)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She introduced her friend to the group.
  </text>
  <text x="50" y="310" class="content">
    她把她的朋友介绍给了大家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Friend -->
    <circle cx="280" cy="100" r="20" class="image" />
    <line x1="280" y1="120" x2="280" y2="180" class="image" />
    <line x1="280" y1="180" x2="260" y2="220" class="image" />
    <line x1="280" y1="180" x2="300" y2="220" class="image" />
    <line x1="280" y1="140" x2="320" y2="130" class="image" />
    <!-- Arrow -->
    <line x1="220" y1="100" x2="260" y2="100" class="image" />
    <polygon points="260,100 255,95 255,105" class="image" />
  </g>
</svg>