<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intonation</text>
  <text x="50" y="120" class="subtitle">[ˌɪntəˈneɪʃn] n. 语调，声调</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + ton (声音) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个歌手在舞台上，"进入(in-)"
    <tspan x="50" dy="25">声音(ton)的世界，用不同的声调(intonation)</tspan>
    <tspan x="50" dy="25">表达情感，就像音符在空中跳跃。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her intonation was perfect, capturing the audience's attention.
  </text>
  <text x="50" y="310" class="content">
    她的语调完美，吸引了观众的注意力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Singer -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="145" y2="130" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Sound waves -->
    <path d="M175,120 C190,110 210,110 225,120" class="image" />
    <path d="M175,120 C160,110 140,110 125,120" class="image" />
    <path d="M175,140 C190,130 210,130 225,140" class="image" />
    <path d="M175,140 C160,130 140,130 125,140" class="image" />
  </g>
</svg>