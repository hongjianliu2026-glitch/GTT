<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">win</text>
  <text x="50" y="120" class="subtitle">[wɪn] v. 赢得，获胜；n. 胜利</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> win (源自古英语 "wynn"，意为喜悦)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在比赛中"赢得(win)"了冠军，
    <tspan x="50" dy="25">脸上洋溢着喜悦(wynn)的笑容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She won the race with a smile on her face.
  </text>
  <text x="50" y="310" class="content">
    她带着微笑赢得了比赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trophy -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="30" y="150" width="40" height="50" class="image" />
    <!-- Smiling face -->
    <circle cx="150" cy="100" r="50" class="image" />
    <circle cx="130" cy="85" r="5" class="image" />
    <circle cx="170" cy="85" r="5" class="image" />
    <path d="M130 115 Q150 130 170 115" class="image" />
  </g>
</svg>