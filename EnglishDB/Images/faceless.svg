<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">faceless</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪsləs] adj. 无面孔的，无个性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> face (脸) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的城市中，无数"无脸(faceless)"的人在
    <tspan x="50" dy="25">匆忙行走，他们没有个性，只是城市的一部分。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The corporation was faceless, with no individual personality.
  </text>
  <text x="50" y="310" class="content">
    这家公司没有个性，缺乏个人特征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="25" height="100" class="image" />
    <rect x="100" y="10" width="25" height="120" class="image" />
    <rect x="150" y="30" width="25" height="90" class="image" />
    <rect x="200" y="5" width="25" height="130" class="image" />
    <rect x="250" y="25" width="25" height="110" class="image" />
    <rect x="300" y="15" width="25" height="120" class="image" />

    <!-- Faceless people -->
    <circle cx="75" cy="150" r="10" class="image" />
    <line x1="75" y1="160" x2="75" y2="180" class="image" />
    <line x1="75" y1="180" x2="65" y2="200" class="image" />
    <line x1="75" y1="180" x2="85" y2="200" class="image" />
    <line x1="75" y1="170" x2="95" y2="160" class="image" />

    <circle cx="125" cy="140" r="10" class="image" />
    <line x1="125" y1="150" x2="125" y2="170" class="image" />
    <line x1="125" y1="170" x2="115" y2="190" class="image" />
    <line x1="125" y1="170" x2="135" y2="190" class="image" />
    <line x1="125" y1="160" x2="145" y2="150" class="image" />

    <circle cx="175" cy="160" r="10" class="image" />
    <line x1="175" y1="170" x2="175" y2="190" class="image" />
    <line x1="175" y1="190" x2="165" y2="210" class="image" />
    <line x1="175" y1="190" x2="185" y2="210" class="image" />
    <line x1="175" y1="180" x2="195" y2="170" class="image" />

    <circle cx="225" cy="130" r="10" class="image" />
    <line x1="225" y1="140" x2="225" y2="160" class="image" />
    <line x1="225" y1="160" x2="215" y2="180" class="image" />
    <line x1="225" y1="160" x2="235" y2="180" class="image" />
    <line x1="225" y1="150" x2="245" y2="140" class="image" />

    <circle cx="275" cy="150" r="10" class="image" />
    <line x1="275" y1="160" x2="275" y2="180" class="image" />
    <line x1="275" y1="180" x2="265" y2="200" class="image" />
    <line x1="275" y1="180" x2="285" y2="200" class="image" />
    <line x1="275" y1="170" x2="295" y2="160" class="image" />
  </g>
</svg>