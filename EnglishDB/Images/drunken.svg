<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drunken</text>
  <text x="50" y="120" class="subtitle">[ˈdrʌŋkən] adj. 醉酒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drunk (醉) + -en (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人喝醉了，"醉醺醺(drunk-en)"
    <tspan x="50" dy="25">地摇摇晃晃，满脸通红，这就是醉酒的状态(drunken)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was too drunken to drive home.
  </text>
  <text x="50" y="310" class="content">
    他醉得太厉害，无法开车回家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Drunken person -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="130" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="130" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Right leg -->
    <!-- Wine bottle -->
    <rect x="100" y="80" width="20" height="100" class="image" />
    <circle cx="110" cy="70" r="10" class="image" />
    <!-- Droplets -->
    <circle cx="120" cy="60" r="5" class="image" />
    <circle cx="130" cy="50" r="5" class="image" />
    <circle cx="140" cy="40" r="5" class="image" />
  </g>
</svg>