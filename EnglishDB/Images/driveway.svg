<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">driveway</text>
  <text x="50" y="120" class="subtitle">[ˈdraɪveweɪ] n. 车道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drive (驾驶) + way (道路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在一条"驾驶的道路(drive-way)"上行驶，
    <tspan x="50" dy="25">这条路就是通往你家的车道(driveway)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car stopped at the end of the driveway.
  </text>
  <text x="50" y="310" class="content">
    汽车停在了车道的尽头。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Driveway -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <rect x="60" y="20" width="30" height="30" class="image" />
    <rect x="110" y="20" width="30" height="30" class="image" />
    <rect x="60" y="50" width="30" height="20" class="image" />
    <rect x="110" y="50" width="30" height="20" class="image" />
    <!-- Wheels -->
    <circle cx="75" cy="70" r="10" class="image" />
    <circle cx="125" cy="70" r="10" class="image" />
  </g>
</svg>