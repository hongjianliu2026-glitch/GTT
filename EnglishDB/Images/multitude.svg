<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">multitude</text>
  <text x="50" y="120" class="subtitle">[ˈmʌltɪtuːd] n. 众多，大量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> multi- (多) + -tude (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的广场上，"多(multi)"
    <tspan x="50" dy="25">的人群聚集在一起，形成了一个"状态(tude)"，</tspan>
    <tspan x="50" dy="25">这就是众多(multitude)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The multitude cheered as the hero appeared.
  </text>
  <text x="50" y="310" class="content">
    当英雄出现时，人群欢呼起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowd -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="110" cy="50" r="10" class="image" />
    <circle cx="140" cy="50" r="10" class="image" />
    <circle cx="170" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="230" cy="50" r="10" class="image" />
    <circle cx="260" cy="50" r="10" class="image" />
    <circle cx="290" cy="50" r="10" class="image" />
    <circle cx="320" cy="50" r="10" class="image" />
    <circle cx="350" cy="50" r="10" class="image" />
    <circle cx="380" cy="50" r="10" class="image" />
    <circle cx="410" cy="50" r="10" class="image" />
    <circle cx="440" cy="50" r="10" class="image" />
    <circle cx="470" cy="50" r="10" class="image" />
    <circle cx="500" cy="50" r="10" class="image" />
    <circle cx="530" cy="50" r="10" class="image" />
    <circle cx="560" cy="50" r="10" class="image" />
    <circle cx="590" cy="50" r="10" class="image" />
    <circle cx="620" cy="50" r="10" class="image" />
    <circle cx="650" cy="50" r="10" class="image" />
    <circle cx="680" cy="50" r="10" class="image" />
    <circle cx="710" cy="50" r="10" class="image" />
    <circle cx="740" cy="50" r="10" class="image" />
    <circle cx="770" cy="50" r="10" class="image" />
    <circle cx="800" cy="50" r="10" class="image" />
  </g>
</svg>