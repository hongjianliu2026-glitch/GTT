<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kidnapping</text>
  <text x="50" y="120" class="subtitle">[ˈkɪdnæpɪŋ] n. 绑架</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kid (小孩) + nap (小睡)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个坏人趁小孩"小睡(nap)"时，偷偷"带走(kid)"
    <tspan x="50" dy="25">他们，这就是绑架(kidnapping)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police are investigating the kidnapping case.
  </text>
  <text x="50" y="310" class="content">
    警方正在调查这起绑架案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kid -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Kidnapper -->
    <rect x="150" y="80" width="50" height="100" class="image" />
    <line x1="175" y1="80" x2="175" y2="60" class="image" />
    <line x1="175" y1="60" x2="155" y2="40" class="image" />
    <line x1="175" y1="60" x2="195" y2="40" class="image" />
    <!-- Kidnapper's hand -->
    <line x1="200" y1="130" x2="100" y2="130" class="image" />
    <!-- Blanket -->
    <rect x="30" y="180" width="140" height="20" class="image" />
  </g>
</svg>