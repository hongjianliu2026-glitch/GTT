<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spam</text>
  <text x="50" y="120" class="subtitle">[spæm] n. 垃圾邮件</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spamm (源自罐装猪肉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你的邮箱被"罐装猪肉(spamm)"填满，
    <tspan x="50" dy="25">这些"猪肉"其实是无用的垃圾邮件(spam)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My inbox is full of spam emails.
  </text>
  <text x="50" y="310" class="content">
    我的收件箱里全是垃圾邮件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mailbox -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Email icons -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Spam can -->
    <rect x="50" y="100" width="250" height="80" class="image" />
    <line x1="70" y1="100" x2="70" y2="180" class="image" />
    <line x1="120" y1="100" x2="120" y2="180" class="image" />
    <line x1="170" y1="100" x2="170" y2="180" class="image" />
    <line x1="220" y1="100" x2="220" y2="180" class="image" />
    <line x1="270" y1="100" x2="270" y2="180" class="image" />
  </g>
</svg>