<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">revival</text>
  <text x="50" y="120" class="subtitle">[rɪˈvaɪvəl] n. 复兴，复活</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + viv (生命) + -al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个枯萎的花朵，"再次获得生命(re-viv-al)"，
    <tspan x="50" dy="25">重新绽放，这就是复兴(revival)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The revival of the old theater brought new life to the community.
  </text>
  <text x="50" y="310" class="content">
    老剧院的复兴给社区带来了新的生机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dried flower -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="140" class="image" />
    <line x1="50" y1="100" x2="70" y2="140" class="image" />
    <line x1="50" y1="100" x2="40" y2="120" class="image" />
    <line x1="50" y1="100" x2="60" y2="120" class="image" />
    <!-- Revived flower -->
    <circle cx="200" cy="60" r="30" class="image" />
    <line x1="200" y1="90" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="180" y2="210" class="image" />
    <line x1="200" y1="170" x2="220" y2="210" class="image" />
    <line x1="200" y1="170" x2="190" y2="190" class="image" />
    <line x1="200" y1="170" x2="210" y2="190" class="image" />
  </g>
</svg>