<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #8B0000; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">austere</text>
  <text x="50" y="120" class="subtitle">[ɔˈstɪr] adj. 朴素的，严厉的，苦行的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auster (严厉) + -e (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个修道士，穿着朴素的<tspan x="50" dy="25">长袍，面容严厉，过着苦行的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The monastery had an austere atmosphere.
  </text>
  <text x="50" y="310" class="content">
    修道院有一种朴素而严厉的氛围。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Monk -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="100" class="image" />
    <line x1="50" y1="90" x2="80" y2="100" class="image" />
    <!-- Robe -->
    <rect x="30" y="120" width="40" height="60" class="image" />
    <!-- Simple background -->
    <rect x="0" y="0" width="100" height="200" class="image" />
  </g>
</svg>