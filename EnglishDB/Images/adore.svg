<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adore</text>
  <text x="50" y="120" class="subtitle">[əˈdɔːr] v. 崇拜，爱慕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + ora (嘴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"朝向(ad-)"他/她所爱的人，"张开嘴(ora)"
    <tspan x="50" dy="25">表达无尽的爱慕之情，这就是崇拜(adore)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She adores her pet dog.
  </text>
  <text x="50" y="310" class="content">
    她非常爱她的宠物狗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 31.7C10 15.1 22.7 2.4 39.3 2.4S68.7 15.1 68.7 31.7C68.7 48.3 39.3 61 39.3 61S10 48.3 10 31.7Z" class="image" fill="#E74C3C" />
    <!-- Person facing heart -->
    <circle cx="39.3" cy="31.7" r="15" class="image" fill="#7F8C8D" />
    <line x1="39.3" y1="46.7" x2="39.3" y2="70" class="image" />
    <line x1="39.3" y1="55" x2="25" y2="70" class="image" />
    <line x1="39.3" y1="55" x2="53" y2="70" class="image" />
    <line x1="39.3" y1="60" x2="30" y2="80" class="image" />
    <line x1="39.3" y1="60" x2="48" y2="80" class="image" />
    <!-- Mouth -->
    <path d="M37 35 Q39.3 40 41.6 35" class="image" fill="none" stroke="#2C3E50" stroke-width="2" />
  </g>
</svg>