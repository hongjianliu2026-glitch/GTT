<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">madam</text>
  <text x="50" y="120" class="subtitle">[ˈmædəm] n. 夫人，女士</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ma- (母亲) + dam (母系)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位高贵的女士，"母亲般的(ma-)"
    <tspan x="50" dy="25">威严和"母系(dam)"的尊贵，她就是夫人(madam)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The madam greeted her guests with grace.
  </text>
  <text x="50" y="310" class="content">
    这位夫人优雅地迎接了她的客人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elegant lady -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Dress -->
    <path d="M50,150 Q80,180 50,210 Q20,180 50,150" class="image" />
    <!-- Necklace -->
    <circle cx="50" cy="70" r="10" class="image" />
  </g>
</svg>