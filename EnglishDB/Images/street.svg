<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">street</text>
  <text x="50" y="120" class="subtitle">[strit] n. 街道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + reet (道路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条宽阔的街道(street)，两旁站立(st-)着高大的建筑，
    <tspan x="50" dy="25">人们在这条道路上(reet)行走，街道是城市的脉络。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She lives on a quiet street.
  </text>
  <text x="50" y="310" class="content">
    她住在一个安静的街道上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Street -->
    <rect x="0" y="100" width="350" height="50" class="image" />
    <!-- Buildings -->
    <rect x="20" y="20" width="50" height="80" class="image" />
    <rect x="100" y="20" width="50" height="100" class="image" />
    <rect x="180" y="20" width="50" height="90" class="image" />
    <rect x="260" y="20" width="50" height="70" class="image" />
    <!-- People -->
    <circle cx="60" cy="160" r="10" class="image" />
    <line x1="60" y1="170" x2="60" y2="190" class="image" />
    <line x1="60" y1="190" x2="50" y2="210" class="image" />
    <line x1="60" y1="190" x2="70" y2="210" class="image" />
    <line x1="60" y1="180" x2="80" y2="170" class="image" />
    <circle cx="140" cy="160" r="10" class="image" />
    <line x1="140" y1="170" x2="140" y2="190" class="image" />
    <line x1="140" y1="190" x2="130" y2="210" class="image" />
    <line x1="140" y1="190" x2="150" y2="210" class="image" />
    <line x1="140" y1="180" x2="160" y2="170" class="image" />
  </g>
</svg>