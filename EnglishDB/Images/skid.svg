<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skid</text>
  <text x="50" y="120" class="subtitle">[skɪd] v. 打滑，滑行；n. 滑行，刹车痕迹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skid (滑行)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在湿滑的路面上"滑行(skid)"，
    <tspan x="50" dy="25">轮胎在地面留下深深的刹车痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car skidded on the icy road.
  </text>
  <text x="50" y="310" class="content">
    汽车在结冰的路面上打滑了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="70" r="10" class="image" />
    <circle cx="130" cy="70" r="10" class="image" />
    <!-- Skid marks -->
    <line x1="50" y1="80" x2="200" y2="80" class="image" />
    <line x1="50" y1="90" x2="200" y2="90" class="image" />
    <line x1="50" y1="100" x2="200" y2="100" class="image" />
  </g>
</svg>