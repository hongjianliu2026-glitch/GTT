<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">universal</text>
  <text x="50" y="120" class="subtitle">[ˌjuːnɪˈvɜːrsl] adj. 普遍的，通用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (一个) + vers (转) + al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，"一个(uni-)"
    <tspan x="50" dy="25">旋转(vers)的球体，代表着普遍(universal)的适用性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concept of love is universal.
  </text>
  <text x="50" y="310" class="content">
    爱的概念是普遍的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Continents -->
    <path d="M175,20 A80,80 0 1,1 175,180 A80,80 0 1,1 175,20" class="image" />
    <path d="M175,20 L175,180" class="image" />
    <path d="M175,20 L255,100" class="image" />
    <path d="M175,20 L95,100" class="image" />
    <path d="M175,180 L255,100" class="image" />
    <path d="M175,180 L95,100" class="image" />
  </g>
</svg>