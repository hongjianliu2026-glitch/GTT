<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">co-founder</text>
  <text x="50" y="120" class="subtitle">[koʊˈfaʊndər] n. 共同创始人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + founder (创始人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人手拉手，共同"创立(co-founder)"
    <tspan x="50" dy="25">一家公司，他们就是共同创始人(co-founder)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They are the co-founders of the startup.
  </text>
  <text x="50" y="310" class="content">
    他们是这家初创公司的共同创始人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people holding hands -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <!-- Company building -->
    <rect x="200" y="80" width="100" height="40" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <line x1="300" y1="80" x2="300" y2="120" class="image" />
    <line x1="200" y1="120" x2="300" y2="120" class="image" />
  </g>
</svg>