<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">immersion</text>
  <text x="50" y="120" class="subtitle">[ɪˈmɜːrʒən] n. 沉浸，浸入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + mers (沉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人完全"沉入(im-mers)"水中，
    <tspan x="50" dy="25">仿佛与外界隔绝，这就是沉浸(immersion)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She experienced total immersion in the novel.
  </text>
  <text x="50" y="310" class="content">
    她完全沉浸在小说的世界中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person immersed in water -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Water waves -->
    <path d="M50,200 Q100,150 150,200 T250,200" class="image" />
    <path d="M50,220 Q100,170 150,220 T250,220" class="image" />
  </g>
</svg>