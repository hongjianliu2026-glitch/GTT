<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">righteous</text>
  <text x="50" y="120" class="subtitle">[ˈraɪtʃəs] adj. 正直的，正义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> right (正确的) + -eous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个正义的骑士，手持"正确的(right)"
    <tspan x="50" dy="25">剑，站在道德的高地上，他就是"正直的(righteous)"象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge's righteous decision was applauded by all.
  </text>
  <text x="50" y="310" class="content">
    法官的正义判决受到了所有人的掌声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Knight -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Sword -->
    <line x1="50" y1="120" x2="50" y2="60" class="image" />
    <line x1="50" y1="60" x2="30" y2="80" class="image" />
    <line x1="50" y1="60" x2="70" y2="80" class="image" />
    <!-- Moral high ground -->
    <rect x="0" y="220" width="100" height="50" class="image" />
    <line x1="0" y1="220" x2="100" y2="220" class="image" />
    <line x1="0" y1="220" x2="50" y2="200" class="image" />
    <line x1="100" y1="220" x2="50" y2="200" class="image" />
  </g>
</svg>