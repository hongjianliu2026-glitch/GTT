<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .carpet { fill: #D2B48C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carpet</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːrpɪt] n. 地毯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carp- (覆盖) + et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"覆盖物(carp-)"，它小到可以放在地上，
    <tspan x="50" dy="25">这就是地毯(carpet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She rolled out a new carpet in the living room.
  </text>
  <text x="50" y="310" class="content">
    她在客厅铺了一块新地毯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Carpet -->
    <rect x="0" y="0" width="350" height="200" class="carpet" />
    <!-- Carpet pattern -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
  </g>
</svg>