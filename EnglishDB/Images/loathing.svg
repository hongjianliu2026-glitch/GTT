<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loathing</text>
  <text x="50" y="120" class="subtitle">[ˈloʊðɪŋ] n. 憎恶，厌恶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loat (恨) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到一只恶心的虫子，"恨(loat)"
    <tspan x="50" dy="25">得咬牙切齿，这种强烈的厌恶感就是憎恶(loathing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt a deep loathing for the politician's lies.
  </text>
  <text x="50" y="310" class="content">
    她对那个政客的谎言感到深深的憎恶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Disgusted face -->
    <line x1="20" y1="115" x2="10" y2="105" class="image" />
    <line x1="20" y1="115" x2="30" y2="105" class="image" />
    <line x1="20" y1="130" x2="10" y2="140" class="image" />
    <line x1="20" y1="130" x2="30" y2="140" class="image" />
    <!-- Bug -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="90" y2="140" class="image" />
    <line x1="100" y1="130" x2="110" y2="140" class="image" />
    <line x1="100" y1="120" x2="80" y2="110" class="image" />
    <line x1="100" y1="120" x2="120" y2="110" class="image" />
  </g>
</svg>