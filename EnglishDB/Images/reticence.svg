<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reticence</text>
  <text x="50" y="120" class="subtitle">[ˈrɛtɪsəns] n. 沉默，缄默</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + tic (说话) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在社交场合中，"向后退缩(re-tic)"，
    <tspan x="50" dy="25">保持沉默，不愿说话，这就是缄默(reticence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His reticence made it hard to get to know him.
  </text>
  <text x="50" y="310" class="content">
    他的沉默寡言让人很难了解他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Speech bubble -->
    <path d="M100,80 Q150,80 150,120 Q100,120 100,80 Z" class="image" />
    <line x1="125" y1="120" x2="125" y2="140" class="image" />
    <!-- Silence symbol -->
    <line x1="110" y1="90" x2="140" y2="110" class="image" />
    <line x1="140" y1="90" x2="110" y2="110" class="image" />
  </g>
</svg>