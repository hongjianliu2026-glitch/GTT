<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">junk</text>
  <text x="50" y="120" class="subtitle">[dʒʌŋk] n. 垃圾，废品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jun (年轻) + k (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆废弃的物品，它们曾经是"年轻的(jun)"，但现在变成了"垃圾(junk)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The attic was filled with old junk.
  </text>
  <text x="50" y="310" class="content">
    阁楼里堆满了旧垃圾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Junk pile -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Old items -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Broken items -->
    <line x1="70" y1="40" x2="90" y2="60" class="image" />
    <line x1="140" y1="40" x2="160" y2="60" class="image" />
    <line x1="210" y1="40" x2="230" y2="60" class="image" />
    <line x1="280" y1="40" x2="300" y2="60" class="image" />
  </g>
</svg>