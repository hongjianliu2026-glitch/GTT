<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monitor</text>
  <text x="50" y="120" class="subtitle">[ˈmɒnɪtə(r)] n. 监视器，班长；v. 监视，监控</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mon- (警告) + it (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个班长在教室里"警告(mon-)"
    <tspan x="50" dy="25">并"走动(it)"监视着同学们的一举一动，</tspan>
    <tspan x="50" dy="25">就像监视器一样(monitor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The security camera monitors the entrance 24/7.
  </text>
  <text x="50" y="310" class="content">
    监控摄像头全天候监控入口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monitor screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Eye -->
    <circle cx="175" cy="100" r="30" class="image" />
    <circle cx="175" cy="100" r="10" fill="#7F8C8D" />
    <!-- Walking legs -->
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="200" class="image" />
    <line x1="175" y1="180" x2="195" y2="200" class="image" />
  </g>
</svg>