<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">awful</text>
  <text x="50" y="120" class="subtitle">[ˈɔːfəl] adj. 可怕的，极坏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (强调) + wful (full of)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满(full of)可怕(awful)的场景，
    <tspan x="50" dy="25">比如一个房间里充满了恐怖的幽灵和怪物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was awful; I couldn't watch it to the end.
  </text>
  <text x="50" y="310" class="content">
    这部电影太可怕了，我没能看完。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ghost -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Monster -->
    <rect x="150" y="80" width="50" height="100" class="image" />
    <circle cx="175" cy="60" r="20" class="image" />
    <line x1="175" y1="180" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="155" y2="250" class="image" />
    <line x1="175" y1="220" x2="195" y2="250" class="image" />
    <line x1="175" y1="200" x2="205" y2="190" class="image" />
  </g>
</svg>