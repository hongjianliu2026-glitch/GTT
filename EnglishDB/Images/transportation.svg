<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transportation</text>
  <text x="50" y="120" class="subtitle">[ˌtrænspɔːrˈteɪʃn] n. 运输，交通</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + port (携带) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆卡车"跨越(trans-)"城市，"携带(port)"着货物，
    <tspan x="50" dy="25">这就是运输(transportation)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The transportation of goods is crucial for the economy.
  </text>
  <text x="50" y="310" class="content">
    货物的运输对经济至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Truck -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <rect x="50" y="20" width="250" height="100" class="image" />
    <rect x="70" y="40" width="210" height="60" class="image" />
    <!-- Wheels -->
    <circle cx="80" cy="140" r="20" class="image" />
    <circle cx="270" cy="140" r="20" class="image" />
    <!-- Cargo -->
    <rect x="100" y="60" width="100" height="40" class="image" />
    <rect x="120" y="70" width="60" height="20" class="image" />
  </g>
</svg>