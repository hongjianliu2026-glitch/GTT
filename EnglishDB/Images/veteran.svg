<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">veteran</text>
  <text x="50" y="120" class="subtitle">[ˈvetərən] n. 老兵，经验丰富的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vet (老) + eran (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老兵(vet)，他经历了无数战斗，
    <tspan x="50" dy="25">积累了丰富的经验，成为了一个经验丰富的人(veteran)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The veteran soldier shared his war stories with the young recruits.
  </text>
  <text x="50" y="310" class="content">
    这位老兵向年轻的士兵们讲述了他的战争故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Medal -->
    <rect x="120" y="80" width="50" height="50" class="image" />
    <line x1="145" y1="80" x2="145" y2="130" class="image" />
    <line x1="120" y1="105" x2="170" y2="105" class="image" />
    <!-- Experience -->
    <text x="200" y="120" class="content">经验</text>
    <line x1="200" y1="130" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
  </g>
</svg>