<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #FFD700; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">joy</text>
  <text x="50" y="120" class="subtitle">[dʒɔɪ] n. 欢乐，喜悦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> joy (源自拉丁语 gaudium，意为“欢乐”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子在阳光下跳跃，脸上洋溢着"欢乐(joy)"，
    <tspan x="50" dy="25">仿佛整个世界都在为他欢笑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children's laughter brought joy to everyone.
  </text>
  <text x="50" y="310" class="content">
    孩子们的笑声给每个人带来了欢乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Child -->
    <circle cx="200" cy="150" r="20" class="image" fill="#FF6347" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="190" x2="230" y2="180" class="image" />
    <!-- Jumping motion -->
    <line x1="200" y1="220" x2="180" y2="190" class="image" />
    <line x1="200" y1="220" x2="220" y2="190" class="image" />
    <!-- Smile -->
    <path d="M190,140 Q195,135 200,140 Q205,135 210,140" class="image" fill="none" />
  </g>
</svg>