<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">isotope</text>
  <text x="50" y="120" class="subtitle">[ˈaɪsəˌtoʊp] n. 同位素</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> iso- (相同) + -tope (位置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个原子，它们"位置相同(iso-tope)"，
    <tspan x="50" dy="25">但质量不同，这就是同位素(isotope)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Carbon has several isotopes, including carbon-12 and carbon-14.
  </text>
  <text x="50" y="310" class="content">
    碳有几种同位素，包括碳-12和碳-14。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Atom nucleus -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Electrons -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <!-- Isotope nucleus -->
    <circle cx="300" cy="100" r="30" class="image" />
    <!-- Electrons -->
    <circle cx="300" cy="50" r="10" class="image" />
    <circle cx="350" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="300" cy="150" r="10" class="image" />
    <!-- Connection line -->
    <line x1="130" y1="100" x2="270" y2="100" class="image" />
    <!-- Text label -->
    <text x="200" y="120" class="content" text-anchor="middle">iso-</text>
  </g>
</svg>