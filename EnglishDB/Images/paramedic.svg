<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paramedic</text>
  <text x="50" y="120" class="subtitle">[ˌpærəˈmɛdɪk] n. 护理人员，急救人员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (在旁边) + medic (医疗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个急救人员(paramedic)在事故现场，"在旁边(para-)"
    <tspan x="50" dy="25">提供紧急医疗(medic)服务，拯救生命。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The paramedic arrived within minutes and stabilized the patient.
  </text>
  <text x="50" y="310" class="content">
    护理人员在几分钟内到达并稳定了病人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ambulance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Paramedic -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Medical kit -->
    <rect x="100" y="80" width="50" height="40" class="image" />
    <line x1="110" y1="90" x2="140" y2="90" class="image" />
    <line x1="110" y1="110" x2="140" y2="110" class="image" />
    <!-- Patient -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
  </g>
</svg>