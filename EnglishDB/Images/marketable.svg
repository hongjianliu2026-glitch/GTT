<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marketable</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrkɪtəbl] adj. 有销路的，适合市场的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> market (市场) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个产品被放在"市场(market)"上，
    <tspan x="50" dy="25">它能够(able)吸引顾客，迅速卖出，这就是"有销路的(marketable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new product is highly marketable due to its innovative design.
  </text>
  <text x="50" y="310" class="content">
    由于其创新设计，新产品非常畅销。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Product -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Money -->
    <rect x="100" y="80" width="50" height="40" class="image" />
    <line x1="100" y1="80" x2="150" y2="80" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <!-- Customer -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>