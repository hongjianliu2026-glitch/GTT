<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ecosystem</text>
  <text x="50" y="120" class="subtitle">[ˈiːkəʊsɪstəm] n. 生态系统</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eco- (家) + system (系统)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"家(eco-)"里充满了各种生物和环境因素，
    <tspan x="50" dy="25">它们相互作用，形成了一个复杂的"系统(system)"，</tspan>
    <tspan x="50" dy="25">这就是生态系统(ecosystem)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Amazon rainforest is a diverse ecosystem.
  </text>
  <text x="50" y="310" class="content">
    亚马逊雨林是一个多样化的生态系统。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tree -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="20" y2="100" class="image" />
    <line x1="50" y1="50" x2="80" y2="100" class="image" />
    <line x1="50" y1="50" x2="35" y2="75" class="image" />
    <line x1="50" y1="50" x2="65" y2="75" class="image" />
    <!-- Animals -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Water -->
    <line x1="250" y1="150" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="120" class="image" />
    <line x1="250" y1="100" x2="270" y2="120" class="image" />
  </g>
</svg>