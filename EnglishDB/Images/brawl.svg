<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brawl</text>
  <text x="50" y="120" class="subtitle">[brɔːl] n. 争吵，打架；v. 争吵，打斗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> br- (打) + -awl (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在街头，"用拳头(br-)"
    <tspan x="50" dy="25">和工具(awl)激烈地打斗，这就是一场争吵(brawl)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The brawl in the bar last night was out of control.
  </text>
  <text x="50" y="310" class="content">
    昨晚酒吧里的争吵完全失控了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People fighting -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Arms and fists -->
    <line x1="50" y1="115" x2="30" y2="135" class="image" />
    <line x1="50" y1="115" x2="70" y2="135" class="image" />
    <line x1="100" y1="115" x2="80" y2="135" class="image" />
    <line x1="100" y1="115" x2="120" y2="135" class="image" />
    <line x1="150" y1="115" x2="130" y2="135" class="image" />
    <line x1="150" y1="115" x2="170" y2="135" class="image" />
    <!-- Tools -->
    <rect x="200" y="90" width="20" height="20" class="image" />
    <rect x="230" y="90" width="20" height="20" class="image" />
  </g>
</svg>