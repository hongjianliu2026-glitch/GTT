<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thriving</text>
  <text x="50" y="120" class="subtitle">[θraɪvɪŋ] adj. 繁荣的，兴旺的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thrive (繁荣) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市里，"繁荣(thrive)"的景象，
    <tspan x="50" dy="25">高楼大厦林立，人们脸上洋溢着幸福的笑容，</tspan>
    <tspan x="50" dy="25">这就是一个"兴旺(thriving)"的城市。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tech industry is thriving in Silicon Valley.
  </text>
  <text x="50" y="310" class="content">
    科技行业在硅谷蓬勃发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="30" height="100" class="image" />
    <rect x="100" y="30" width="30" height="120" class="image" />
    <rect x="150" y="70" width="30" height="80" class="image" />
    <rect x="200" y="40" width="30" height="110" class="image" />
    <rect x="250" y="60" width="30" height="90" class="image" />
    <!-- Happy faces -->
    <circle cx="75" cy="170" r="15" class="image" />
    <circle cx="125" cy="150" r="15" class="image" />
    <circle cx="175" cy="190" r="15" class="image" />
    <circle cx="225" cy="160" r="15" class="image" />
    <circle cx="275" cy="180" r="15" class="image" />
  </g>
</svg>