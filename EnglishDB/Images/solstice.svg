<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">solstice</text>
  <text x="50" y="120" class="subtitle">[ˈsɒlstɪs] n. 至日，夏至或冬至</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sol (太阳) + stice (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳在一年中的某一天"站立不动(sol-stice)"，
    <tspan x="50" dy="25">这一天就是夏至或冬至，标志着季节的转折。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The summer solstice marks the longest day of the year.
  </text>
  <text x="50" y="310" class="content">
    夏至标志着一年中最长的一天。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Standing sun -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Ground -->
    <line x1="0" y1="250" x2="200" y2="250" class="image" />
    <!-- Season markers -->
    <text x="50" y="300" class="content">夏至</text>
    <text x="150" y="300" class="content">冬至</text>
  </g>
</svg>