<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suite</text>
  <text x="50" y="120" class="subtitle">[swiːt] n. 套房，组曲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sui- (跟随) + -te (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个豪华的酒店套房，"跟随(sui-)"
    <tspan x="50" dy="25">一系列房间，这些房间就构成了一个套房(suite)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They booked a suite at the five-star hotel.
  </text>
  <text x="50" y="310" class="content">
    他们在五星级酒店预订了一个套房。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hotel room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bed -->
    <rect x="50" y="20" width="250" height="80" class="image" />
    <!-- Nightstand -->
    <rect x="70" y="110" width="50" height="50" class="image" />
    <!-- TV -->
    <rect x="150" y="110" width="100" height="50" class="image" />
    <!-- Door -->
    <rect x="270" y="20" width="30" height="140" class="image" />
    <!-- Connecting door -->
    <rect x="310" y="20" width="30" height="140" class="image" />
  </g>
</svg>