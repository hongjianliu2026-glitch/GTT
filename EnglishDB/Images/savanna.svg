<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">savanna</text>
  <text x="50" y="120" class="subtitle">[səˈvænə] n. 热带草原</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sav (干燥) + ann (平原)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片干燥(sav)的平原(ann)，上面长满了稀疏的树木和茂盛的草地，这就是热带草原(savanna)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lion roamed the vast savanna.
  </text>
  <text x="50" y="310" class="content">
    狮子在广阔的热带草原上漫步。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Grassland -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="200" x2="300" y2="200" class="image" />

    <!-- Trees -->
    <rect x="100" y="50" width="20" height="100" class="image" />
    <rect x="200" y="50" width="20" height="100" class="image" />
    <rect x="250" y="50" width="20" height="100" class="image" />
  </g>
</svg>