<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">predatory</text>
  <text x="50" y="120" class="subtitle">[ˈprɛdətɔri] adj. 掠夺的，食肉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + dat (给予) + -ory (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猛兽在森林中潜伏，"提前给予(pre-dat)"
    <tspan x="50" dy="25">致命一击，这种掠夺行为就是掠夺性的(predatory)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The predatory behavior of the lion was evident in its stealthy approach.
  </text>
  <text x="50" y="310" class="content">
    狮子的掠夺行为在其悄无声息的接近中显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tree -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="40" y1="50" x2="60" y2="50" class="image" />
    <line x1="30" y1="80" x2="70" y2="80" class="image" />
    <line x1="20" y1="110" x2="80" y2="110" class="image" />
    <line x1="10" y1="140" x2="90" y2="140" class="image" />
    <!-- Predator -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Prey -->
    <circle cx="280" cy="150" r="10" class="image" />
    <line x1="280" y1="160" x2="280" y2="180" class="image" />
    <line x1="280" y1="180" x2="270" y2="200" class="image" />
    <line x1="280" y1="180" x2="290" y2="200" class="image" />
  </g>
</svg>