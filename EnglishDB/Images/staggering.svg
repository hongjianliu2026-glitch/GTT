<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">staggering</text>
  <text x="50" y="120" class="subtitle">[ˈstæɡərɪŋ] adj. 令人震惊的，摇晃的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stag (站立) + -er (表示反复) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图"站立(stag)"，但因为震惊而反复"摇晃(er-ing)"，
    <tspan x="50" dy="25">这种状态就是令人震惊的(staggering)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The staggering amount of debt was overwhelming.
  </text>
  <text x="50" y="310" class="content">
    巨额的债务令人震惊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person trying to stand -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Shocked expression -->
    <circle cx="40" cy="90" r="3" class="image" /> <!-- Left eye -->
    <circle cx="60" cy="90" r="3" class="image" /> <!-- Right eye -->
    <line x1="45" y1="110" x2="55" y2="110" class="image" /> <!-- Mouth -->
    <!-- Staggering effect -->
    <line x1="30" y1="220" x2="20" y2="240" class="image" /> <!-- Left leg stagger -->
    <line x1="70" y1="220" x2="80" y2="240" class="image" /> <!-- Right leg stagger -->
  </g>
</svg>