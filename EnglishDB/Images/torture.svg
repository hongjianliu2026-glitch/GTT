<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">torture</text>
  <text x="50" y="120" class="subtitle">[ˈtɔːrtʃər] n. 折磨，拷问；v. 折磨，拷问</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tor (扭曲) + ture (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"扭曲(tor)"得痛苦不堪，
    <tspan x="50" dy="25">这种痛苦就是折磨(torture)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thought of the exam was torture for him.
  </text>
  <text x="50" y="310" class="content">
    考试的想法对他来说是一种折磨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Twisted body -->
    <path d="M50 50 Q100 100 150 50 T250 50" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <line x1="100" y1="65" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="80" x2="130" y2="70" class="image" />
    <!-- Pain expression -->
    <circle cx="100" cy="40" r="5" class="image" />
    <circle cx="120" cy="40" r="5" class="image" />
    <path d="M95 60 Q110 65 125 60" class="image" />
  </g>
</svg>