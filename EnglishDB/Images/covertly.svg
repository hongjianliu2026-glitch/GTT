<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">covertly</text>
  <text x="50" y="120" class="subtitle">[ˈkʌvərtli] adv. 秘密地，偷偷地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> covert (隐藏的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在黑暗中，"隐藏(covert)"
    <tspan x="50" dy="25">自己的行动，偷偷地(covertly)进行某事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She covertly recorded the conversation without anyone noticing.
  </text>
  <text x="50" y="310" class="content">
    她偷偷地录下了对话，没有人注意到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Hidden figure -->
    <circle cx="100" cy="100" r="20" class="image" fill="#FFFFFF" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Hidden action -->
    <rect x="200" y="80" width="100" height="40" class="image" fill="#FFFFFF" />
    <line x1="210" y1="90" x2="290" y2="90" class="image" />
    <line x1="210" y1="110" x2="290" y2="110" class="image" />
  </g>
</svg>