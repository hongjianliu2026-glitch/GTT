<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">involvement</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvɒlvmənt] n. 参与，卷入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + volv (卷) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"卷入(in-volv)"一个巨大的漩涡中，
    <tspan x="50" dy="25">无法自拔，这就是"卷入(involvement)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His involvement in the project was crucial to its success.
  </text>
  <text x="50" y="310" class="content">
    他在这个项目中的参与对项目的成功至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Swirl -->
    <path d="M 0 0 C 50 -50 100 -100 150 -50 C 200 0 250 50 300 0 C 350 -50 400 -100 450 -50 C 500 0 550 50 600 0" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="80" y2="130" class="image" />
    <line x1="100" y1="150" x2="120" y2="130" class="image" />
    <line x1="100" y1="180" x2="80" y2="200" class="image" />
    <line x1="100" y1="180" x2="120" y2="200" class="image" />
  </g>
</svg>