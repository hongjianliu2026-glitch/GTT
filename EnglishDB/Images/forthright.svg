<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forthright</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrθraɪt] adj. 直率的，坦率的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> forth (向前) + right (直的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人直直地向前走，"直率地(forth-right)"
    <tspan x="50" dy="25">表达自己的想法，毫不拐弯抹角。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is known for her forthright manner.
  </text>
  <text x="50" y="310" class="content">
    她以直率的方式著称。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Straight path -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person walking straight -->
    <circle cx="50" cy="0" r="15" class="image" />
    <line x1="50" y1="15" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="30" y2="80" class="image" />
    <line x1="50" y1="50" x2="70" y2="80" class="image" />
    <line x1="50" y1="30" x2="80" y2="20" class="image" />
    <!-- Arrow indicating direction -->
    <line x1="100" y1="0" x2="150" y2="0" class="image" />
    <polygon points="150,0 140,-10 140,10" class="image" />
  </g>
</svg>