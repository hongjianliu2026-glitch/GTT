<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">altitude</text>
  <text x="50" y="120" class="subtitle">[ˈæltɪtjuːd] n. 高度，海拔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alt- (高) + -itude (状态或程度)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个飞行员驾驶飞机，"高高在上(alt-itude)"，
    <tspan x="50" dy="25">俯瞰大地，感受着高度的状态(altitude)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plane reached an altitude of 30,000 feet.
  </text>
  <text x="50" y="310" class="content">
    飞机达到了30,000英尺的高度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Plane -->
    <polygon points="50,50 150,50 170,30 200,30 220,50 320,50 320,70 220,70 200,90 170,90 150,70 50,70" class="image" fill="#D3D3D3" />
    <!-- Mountains -->
    <polygon points="0,180 50,150 100,180 150,150 200,180 250,150 300,180 350,150" class="image" fill="#A0522D" />
    <!-- Pilot -->
    <circle cx="100" cy="40" r="10" class="image" fill="#FFD700" />
    <line x1="100" y1="50" x2="100" y2="70" class="image" />
    <line x1="100" y1="70" x2="90" y2="90" class="image" />
    <line x1="100" y1="70" x2="110" y2="90" class="image" />
    <line x1="100" y1="60" x2="120" y2="50" class="image" />
  </g>
</svg>