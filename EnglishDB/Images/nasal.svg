<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nasal</text>
  <text x="50" y="120" class="subtitle">[ˈneɪzl] adj. 鼻的，鼻音的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nas (鼻子) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用鼻子(nas)发出声音，这种声音就是鼻音(nasal)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His voice had a nasal quality.
  </text>
  <text x="50" y="310" class="content">
    他的声音带有鼻音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nose -->
    <path d="M50,50 Q100,20 150,50" class="image" />
    <path d="M50,50 Q75,100 100,50" class="image" />
    <path d="M100,50 Q125,100 150,50" class="image" />
    <!-- Mouth -->
    <path d="M75,120 Q100,150 125,120" class="image" />
    <!-- Sound waves -->
    <path d="M50,160 Q75,140 100,160" class="image" />
    <path d="M100,160 Q125,180 150,160" class="image" />
  </g>
</svg>