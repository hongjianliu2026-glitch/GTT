<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disgusting</text>
  <text x="50" y="120" class="subtitle">[dɪsˈɡʌstɪŋ] adj. 令人作呕的，令人厌恶的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + gust (味道) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人闻到一股"不好的味道(dis-gust)"，
    <tspan x="50" dy="25">立刻皱起眉头，露出厌恶的表情，这就是disgusting的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smell of rotten food was disgusting.
  </text>
  <text x="50" y="310" class="content">
    腐烂食物的气味令人作呕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <line x1="70" y1="80" x2="90" y2="80" class="image" />
    <line x1="110" y1="80" x2="130" y2="80" class="image" />
    <!-- Nose -->
    <line x1="100" y1="90" x2="100" y2="110" class="image" />
    <!-- Mouth -->
    <path d="M70,130 Q100,150 130,130" class="image" />
    <!-- Smell -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="220" class="image" />
    <line x1="100" y1="200" x2="120" y2="220" class="image" />
    <!-- Rotten food -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <line x1="160" y1="60" x2="240" y2="60" class="image" />
    <line x1="160" y1="80" x2="240" y2="80" class="image" />
    <line x1="160" y1="100" x2="240" y2="100" class="image" />
    <line x1="160" y1="120" x2="240" y2="120" class="image" />
  </g>
</svg>