<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">miserably</text>
  <text x="50" y="120" class="subtitle">[ˈmɪzərəbli] adv. 悲惨地，可怜地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> miser (可怜) + -ably (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个可怜的人，"miser(可怜)"
    <tspan x="50" dy="25">被雨水淋湿，蜷缩在角落里，"ably(地)"</tspan>
    <tspan x="50" dy="25">表现出极度的悲惨(miserably)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He failed the exam miserably.
  </text>
  <text x="50" y="310" class="content">
    他考试考得很糟糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Raindrops -->
    <line x1="50" y1="20" x2="50" y2="40" class="image" />
    <line x1="70" y1="30" x2="70" y2="50" class="image" />
    <line x1="90" y1="40" x2="90" y2="60" class="image" />
    <line x1="110" y1="50" x2="110" y2="70" class="image" />
    <line x1="130" y1="60" x2="130" y2="80" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Corner -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <line x1="0" y1="200" x2="0" y2="0" class="image" />
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
  </g>
</svg>