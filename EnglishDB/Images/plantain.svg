<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plantain</text>
  <text x="50" y="120" class="subtitle">[ˈplæntɪn] n. 大蕉，芭蕉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plant (植物) + -ain (表示“属于”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵巨大的植物(plant)，上面挂满了香蕉形状的果实，
    <tspan x="50" dy="25">这些果实就是大蕉(plantain)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to cook plantains in various dishes.
  </text>
  <text x="50" y="310" class="content">
    她喜欢用大蕉做各种菜肴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plantain tree -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <!-- Plantain fruits -->
    <ellipse cx="100" cy="60" rx="30" ry="15" class="image" />
    <ellipse cx="250" cy="60" rx="30" ry="15" class="image" />
    <ellipse cx="175" cy="100" rx="30" ry="15" class="image" />
    <ellipse cx="100" cy="140" rx="30" ry="15" class="image" />
    <ellipse cx="250" cy="140" rx="30" ry="15" class="image" />
  </g>
</svg>