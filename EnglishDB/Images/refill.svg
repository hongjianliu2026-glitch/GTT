    <rect x="55" y="40" width="90" height="130" class="image" fill="#16A085" />
    <rect x="55" y="35" width="90" height="135" class="image" fill="#16A085" />
    <rect x="55" y="30" width="90" height="140" class="image" fill="#16A085" />
