    <rect x="55" y="95" width="90" height="75" class="image" fill="#16A085" />
    <rect x="55" y="90" width="90" height="80" class="image" fill="#16A085" />
    <rect x="55" y="85" width="90" height="85" class="image" fill="#16A085" />
