<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">refill</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈfɪl] v. 再装满，再填满；n. 再装满的量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + fill (填满)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个空杯子，"再次填满(re-fill)"
    <tspan x="50" dy="25">水，这个动作就是refill。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Could you refill my coffee cup, please?
  </text>
  <text x="50" y="310" class="content">
    你能帮我再续一杯咖啡吗？
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Empty cup -->
    <rect x="50" y="20" width="100" height="150" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="100" y2="0" class="image" />
    <line x1="150" y1="20" x2="100" y2="0" class="image" />
    <!-- Water filling -->
    <rect x="55" y="165" width="90" height="5" class="image" fill="#16A085" />
    <rect x="55" y="160" width="90" height="10" class="image" fill="#16A085" />
    <rect x="55" y="155" width="90" height="15" class="image" fill="#16A085" />
    <rect x="55" y="150" width="90" height="20" class="image" fill="#16A085" />
    <rect x="55" y="145" width="90" height="25" class="image" fill="#16A085" />
    <rect x="55" y="140" width="90" height="30" class="image" fill="#16A085" />
    <rect x="55" y="135" width="90" height="35" class="image" fill="#16A085" />
    <rect x="55" y="130" width="90" height="40" class="image" fill="#16A085" />
    <rect x="55" y="125" width="90" height="45" class="image" fill="#16A085" />
    <rect x="55" y="120" width="90" height="50" class="image" fill="#16A085" />
    <rect x="55" y="115" width="90" height="55" class="image" fill="#16A085" />
    <rect x="55" y="110" width="90" height="60" class="image" fill="#16A085" />
    <rect x="55" y="105" width="90" height="65" class="image" fill="#16A085" />
