<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disgusted</text>
  <text x="50" y="120" class="subtitle">[dɪsˈɡʌstɪd] adj. 厌恶的，反感的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + gust (味道) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人闻到一股难闻的气味，"味道(gust)"
    <tspan x="50" dy="25">让他感到"不(dis)"舒服，于是他表现出"厌恶的(disgusted)"表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was disgusted by the smell of rotten food.
  </text>
  <text x="50" y="310" class="content">
    她被腐烂食物的气味恶心到了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="80" r="10" class="image" />
    <circle cx="125" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 50 120 Q 100 150 150 120" class="image" />
    <!-- Smell -->
    <line x1="100" y1="50" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="80" y2="10" class="image" />
    <line x1="100" y1="20" x2="120" y2="10" class="image" />
    <!-- Rotten food -->
    <rect x="150" y="50" width="100" height="50" class="image" />
    <line x1="160" y1="60" x2="190" y2="90" class="image" />
    <line x1="170" y1="60" x2="200" y2="90" class="image" />
    <line x1="180" y1="60" x2="210" y2="90" class="image" />
  </g>
</svg>