<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abysmal</text>
  <text x="50" y="120" class="subtitle">[əˈbɪzməl] adj. 深不可测的，极坏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> abys- (深渊) + -mal (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在深渊(abys-)的边缘，感受到的恐惧和无助，
    <tspan x="50" dy="25">这种感觉就像面对极坏(abysmal)的情况一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team's performance was abysmal in the final match.
  </text>
  <text x="50" y="310" class="content">
    这支队伍在决赛中的表现极差。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Abyss -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="280" y2="40" class="image" />
    <line x1="50" y1="60" x2="260" y2="60" class="image" />
    <line x1="50" y1="80" x2="240" y2="80" class="image" />
    <line x1="50" y1="100" x2="220" y2="100" class="image" />
    <line x1="50" y1="120" x2="200" y2="120" class="image" />
    <line x1="50" y1="140" x2="180" y2="140" class="image" />
    <line x1="50" y1="160" x2="160" y2="160" class="image" />
    <line x1="50" y1="180" x2="140" y2="180" class="image" />
    <!-- Person at the edge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>