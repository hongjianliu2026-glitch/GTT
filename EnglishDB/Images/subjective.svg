<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subjective</text>
  <text x="50" y="120" class="subtitle">[səbˈdʒektɪv] adj. 主观的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + ject (投掷) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考时，"从内心深处投掷(sub-ject)"
    <tspan x="50" dy="25">出自己的观点，这些观点是主观的(subjective)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her opinion on the matter is highly subjective.
  </text>
  <text x="50" y="310" class="content">
    她对这个问题的看法非常主观。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Thought bubble -->
    <ellipse cx="250" cy="100" rx="70" ry="40" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="180" y2="100" class="image" />
    <polygon points="180,80 200,100 180,120" class="image" />
    <!-- Thought text -->
    <text x="220" y="105" class="content">观点</text>
  </g>
</svg>