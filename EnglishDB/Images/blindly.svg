<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blindly</text>
  <text x="50" y="120" class="subtitle">[ˈblaɪndli] adv. 盲目地，无意识地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blind (盲的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人戴着眼罩，"盲目地(blindly)"
    <tspan x="50" dy="25">在黑暗中摸索前行，完全不知道前方有什么。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She followed her friend blindly into the dark alley.
  </text>
  <text x="50" y="310" class="content">
    她盲目地跟着朋友走进了黑暗的小巷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with blindfold -->
    <circle cx="50" cy="50" r="30" class="image" />
    <rect x="35" y="35" width="30" height="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="120" x2="80" y2="110" class="image" />
    <line x1="50" y1="120" x2="20" y2="110" class="image" />
    <!-- Dark alley -->
    <rect x="100" y="0" width="200" height="200" class="image" />
    <line x1="100" y1="0" x2="300" y2="0" class="image" />
    <line x1="100" y1="50" x2="300" y2="50" class="image" />
    <line x1="100" y1="100" x2="300" y2="100" class="image" />
    <line x1="100" y1="150" x2="300" y2="150" class="image" />
    <line x1="100" y1="200" x2="300" y2="200" class="image" />
  </g>
</svg>