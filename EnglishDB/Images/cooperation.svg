<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cooperation</text>
  <text x="50" y="120" class="subtitle">[ˌkoʊˌɒpəˈreɪʃn] n. 合作，协作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + operate (操作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人手拉手，"共同操作(co-operate)"
    <tspan x="50" dy="25">完成一项任务，这就是合作(cooperation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was completed through the cooperation of all team members.
  </text>
  <text x="50" y="310" class="content">
    这个项目是通过所有团队成员的合作完成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hands -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Fingers -->
    <line x1="50" y1="100" x2="40" y2="120" class="image" />
    <line x1="50" y1="100" x2="60" y2="120" class="image" />
    <line x1="150" y1="100" x2="140" y2="120" class="image" />
    <line x1="150" y1="100" x2="160" y2="120" class="image" />
    <!-- Task -->
    <rect x="80" y="150" width="40" height="40" class="image" />
    <line x1="100" y1="150" x2="100" y2="190" class="image" />
    <line x1="80" y1="170" x2="120" y2="170" class="image" />
  </g>
</svg>