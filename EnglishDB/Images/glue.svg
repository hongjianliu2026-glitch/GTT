<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glue</text>
  <text x="50" y="120" class="subtitle">[ɡluː] n. 胶水；v. 粘合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glu- (粘)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在工作室里，用"粘(glu-)"
    <tspan x="50" dy="25">合剂将各种材料粘在一起，创造出一件艺术品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used glue to fix the broken vase.
  </text>
  <text x="50" y="310" class="content">
    她用胶水修好了破碎的花瓶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glue bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <!-- Glue coming out -->
    <line x1="50" y1="20" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="70" y2="70" class="image" />
    <line x1="70" y1="70" x2="90" y2="50" class="image" />
    <line x1="90" y1="50" x2="90" y2="20" class="image" />
    <!-- Broken vase -->
    <path d="M150,0 C160,20 160,180 150,200" class="image" />
    <path d="M150,0 C140,20 140,180 150,200" class="image" />
    <!-- Fixed vase -->
    <path d="M200,0 C210,20 210,180 200,200" class="image" />
    <path d="M200,0 C190,20 190,180 200,200" class="image" />
    <line x1="175" y1="100" x2="225" y2="100" class="image" />
  </g>
</svg>