<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rocket</text>
  <text x="50" y="120" class="subtitle">[ˈrɑːkɪt] n. 火箭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rock (摇摆) + et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小火箭(rocket)在太空中"摇摆(rock)"，
    <tspan x="50" dy="25">它快速地穿梭，留下一道闪亮的轨迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rocket launched into space with a roar.
  </text>
  <text x="50" y="310" class="content">
    火箭伴随着轰鸣声发射升空。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rocket body -->
    <rect x="50" y="20" width="100" height="200" class="image" />
    <!-- Rocket nose -->
    <polygon points="50,20 150,20 100,0" class="image" />
    <!-- Rocket fins -->
    <rect x="40" y="200" width="20" height="50" class="image" />
    <rect x="140" y="200" width="20" height="50" class="image" />
    <!-- Rocket flame -->
    <polygon points="75,250 125,250 100,300" class="image" fill="#F39C12" />
  </g>
</svg>