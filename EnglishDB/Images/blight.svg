<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blight</text>
  <text x="50" y="120" class="subtitle">[blaɪt] n. 枯萎病，破坏；v. 使枯萎，破坏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bli- (变坏) + ght (加强)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片原本茂盛的农田，突然被"变坏(bli-ght)"
    <tspan x="50" dy="25">的枯萎病侵袭，庄稼瞬间枯萎，这就是blight的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The potato crop was destroyed by blight.
  </text>
  <text x="50" y="310" class="content">
    马铃薯作物被枯萎病摧毁了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Healthy plant -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="50" y1="70" x2="30" y2="90" class="image" />
    <line x1="50" y1="70" x2="70" y2="90" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />

    <!-- Diseased plant -->
    <line x1="200" y1="150" x2="200" y2="100" class="image" />
    <line x1="200" y1="120" x2="180" y2="140" class="image" />
    <line x1="200" y1="120" x2="220" y2="140" class="image" />
    <line x1="200" y1="130" x2="180" y2="150" class="image" />
    <line x1="200" y1="130" x2="220" y2="150" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" stroke-dasharray="5,5" />
  </g>
</svg>