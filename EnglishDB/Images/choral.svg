<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">choral</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːrəl] adj. 合唱的，合唱队的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chor (合唱) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人站在一起，"合唱(chor)"
    <tspan x="50" dy="25">的声音如同海浪般起伏，这就是合唱(choral)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The choral performance was breathtaking.
  </text>
  <text x="50" y="310" class="content">
    合唱表演令人叹为观止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chorus line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <!-- Singers -->
    <circle cx="50" cy="40" r="15" class="image" />
    <circle cx="100" cy="40" r="15" class="image" />
    <circle cx="150" cy="40" r="15" class="image" />
    <circle cx="200" cy="40" r="15" class="image" />
    <circle cx="250" cy="40" r="15" class="image" />
    <circle cx="300" cy="40" r="15" class="image" />
    <!-- Music notes -->
    <path d="M50 100 Q70 50 100 100 T150 100" class="image" />
    <path d="M100 100 Q120 50 150 100 T200 100" class="image" />
    <path d="M150 100 Q170 50 200 100 T250 100" class="image" />
    <path d="M200 100 Q220 50 250 100 T300 100" class="image" />
  </g>
</svg>