<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monotonous</text>
  <text x="50" y="120" class="subtitle">[məˈnɒtənəs] adj. 单调的，无变化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mono- (单一) + ton (声音) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在不停地重复同一个音调，"单一的声音(mono-ton-ous)"
    <tspan x="50" dy="25">让人感到无比的单调乏味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lecture was so monotonous that I fell asleep.
  </text>
  <text x="50" y="310" class="content">
    讲座太单调了，我睡着了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Speaker -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Sound waves -->
    <line x1="80" y1="100" x2="150" y2="100" class="image" />
    <line x1="80" y1="90" x2="140" y2="90" class="image" />
    <line x1="80" y1="110" x2="160" y2="110" class="image" />
    <line x1="80" y1="80" x2="130" y2="80" class="image" />
    <line x1="80" y1="120" x2="170" y2="120" class="image" />
    <!-- Zzz -->
    <text x="200" y="110" class="image" font-size="48">Zzz</text>
  </g>
</svg>