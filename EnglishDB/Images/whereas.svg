<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whereas</text>
  <text x="50" y="120" class="subtitle">[ˌwerˈæz] conj. 然而，鉴于</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> where (哪里) + as (作为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在争论，一个人说"这里(where)"，
    <tspan x="50" dy="25">另一个人说"作为(as)"，他们在对比不同的情况。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She likes coffee, whereas he prefers tea.
  </text>
  <text x="50" y="310" class="content">
    她喜欢咖啡，而他更喜欢茶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Speech bubbles -->
    <path d="M 50 70 Q 50 120 100 120 Q 150 120 150 70 Z" class="image" />
    <path d="M 250 70 Q 250 120 300 120 Q 350 120 350 70 Z" class="image" />
    <!-- Text in speech bubbles -->
    <text x="70" y="100" class="content">Where</text>
    <text x="270" y="100" class="content">As</text>
  </g>
</svg>