<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">globalization</text>
  <text x="50" y="120" class="subtitle">[ˌɡloʊbələˈzeɪʃn] n. 全球化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> globe (地球) + -ize (使...化) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，上面布满了各种颜色的线条，
    <tspan x="50" dy="25">这些线条代表着全球各地的联系和交流，</tspan>
    <tspan x="50" dy="25">这就是全球化(globalization)的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rapid globalization of the economy has led to increased cultural exchange.
  </text>
  <text x="50" y="310" class="content">
    经济的快速全球化导致了文化交流的增加。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Lines representing connections -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="95" y1="100" x2="255" y2="100" class="image" />
    <line x1="125" y1="30" x2="225" y2="170" class="image" />
    <line x1="225" y1="30" x2="125" y2="170" class="image" />
    <!-- Arrows -->
    <polygon points="175,20 165,40 185,40" class="image" />
    <polygon points="175,180 165,160 185,160" class="image" />
    <polygon points="95,100 75,90 75,110" class="image" />
    <polygon points="255,100 275,90 275,110" class="image" />
    <polygon points="125,30 105,20 105,40" class="image" />
    <polygon points="225,170 245,160 245,180" class="image" />
    <polygon points="225,30 245,20 245,40" class="image" />
    <polygon points="125,170 105,160 105,180" class="image" />
  </g>
</svg>