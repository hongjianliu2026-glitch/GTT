<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bullying</text>
  <text x="50" y="120" class="subtitle">[ˈbʊlɪŋ] n. 欺凌，欺负</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bull (公牛) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头巨大的公牛(bull)在校园里横冲直撞，
    <tspan x="50" dy="25">欺负(bullying)弱小的学生，这种行为让人感到恐惧和无助。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The school has a zero-tolerance policy on bullying.
  </text>
  <text x="50" y="310" class="content">
    学校对欺凌行为采取零容忍政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bull -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Front leg -->
    <line x1="50" y1="180" x2="80" y2="200" class="image" /> <!-- Back leg -->
    <line x1="50" y1="130" x2="20" y2="120" class="image" /> <!-- Horn -->
    <line x1="50" y1="130" x2="80" y2="120" class="image" /> <!-- Horn -->

    <!-- Victim -->
    <circle cx="200" cy="100" r="15" class="image" /> <!-- Head -->
    <line x1="200" y1="115" x2="200" y2="150" class="image" /> <!-- Body -->
    <line x1="200" y1="150" x2="180" y2="180" class="image" /> <!-- Front leg -->
    <line x1="200" y1="150" x2="220" y2="180" class="image" /> <!-- Back leg -->
    <line x1="200" y1="130" x2="170" y2="120" class="image" /> <!-- Arm -->
    <line x1="200" y1="130" x2="230" y2="120" class="image" /> <!-- Arm -->

    <!-- Arrow -->
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <polygon points="180,100 170,90 170,110" class="image" />
  </g>
</svg>