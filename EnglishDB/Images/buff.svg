<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buff</text>
  <text x="50" y="120" class="subtitle">[bʌf] n. 浅黄色，软皮；v. 擦亮，增强</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> buff (源自法语“buff”，意为“浅黄色”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个健壮的运动员，全身涂满了浅黄色的油，
    <tspan x="50" dy="25">正在用软皮擦亮自己的肌肉，增强力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He buffed his shoes until they shone.
  </text>
  <text x="50" y="310" class="content">
    他把鞋子擦得锃亮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Athlete -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Buffing -->
    <rect x="100" y="80" width="100" height="50" class="image" />
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <line x1="120" y1="120" x2="180" y2="120" class="image" />
    <line x1="120" y1="140" x2="180" y2="140" class="image" />
    <!-- Oil -->
    <circle cx="150" cy="160" r="20" class="image" fill="#F1C40F" />
  </g>
</svg>