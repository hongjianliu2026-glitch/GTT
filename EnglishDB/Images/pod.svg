<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pod</text>
  <text x="50" y="120" class="subtitle">[pɒd] n. 豆荚，舱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pod- (豆荚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的豆荚(pod)，里面装满了各种神奇的豆子，
    <tspan x="50" dy="25">每个豆子都是一个微型宇宙，充满了无限可能。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The astronauts entered the pod before the launch.
  </text>
  <text x="50" y="310" class="content">
    宇航员们在发射前进入了舱内。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pod -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Beans -->
    <circle cx="75" cy="100" r="20" class="image" />
    <circle cx="125" cy="100" r="20" class="image" />
    <circle cx="175" cy="100" r="20" class="image" />
    <circle cx="225" cy="100" r="20" class="image" />
    <circle cx="275" cy="100" r="20" class="image" />
    <!-- Mini universes -->
    <circle cx="75" cy="100" r="10" fill="#2980B9" />
    <circle cx="125" cy="100" r="10" fill="#2980B9" />
    <circle cx="175" cy="100" r="10" fill="#2980B9" />
    <circle cx="225" cy="100" r="10" fill="#2980B9" />
    <circle cx="275" cy="100" r="10" fill="#2980B9" />
  </g>
</svg>