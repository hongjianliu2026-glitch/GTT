<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">CD-ROM</text>
  <text x="50" y="120" class="subtitle">[ˌsiːˌdiːˈrɒm] n. 光盘只读存储器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> CD (Compact Disc) + ROM (Read-Only Memory)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张光盘(CD)，它像一个神秘的宝盒，
    <tspan x="50" dy="25">里面装满了只读(ROM)的信息，无法被修改。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The software was installed from a CD-ROM.
  </text>
  <text x="50" y="310" class="content">
    软件是从一张CD-ROM安装的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- CD disc -->
    <circle cx="175" cy="100" r="80" class="image" />
    <circle cx="175" cy="100" r="70" class="image" />
    <circle cx="175" cy="100" r="60" class="image" />
    <circle cx="175" cy="100" r="50" class="image" />
    <circle cx="175" cy="100" r="40" class="image" />
    <circle cx="175" cy="100" r="30" class="image" />
    <circle cx="175" cy="100" r="20" class="image" />
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Hole in the center -->
    <circle cx="175" cy="100" r="5" class="image" fill="#7F8C8D" />
    <!-- Label -->
    <text x="120" y="220" class="content" text-anchor="middle">CD-ROM</text>
  </g>
</svg>