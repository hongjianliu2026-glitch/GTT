<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polish</text>
  <text x="50" y="120" class="subtitle">[ˈpoʊlɪʃ] v. 磨光，擦亮；n. 波兰人，波兰语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poli- (光滑) + -ish (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠在"光滑(poli-)"的表面上"擦亮(ish)"
    <tspan x="50" dy="25">，使其更加闪亮，这就是磨光(polish)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent hours polishing the silverware.
  </text>
  <text x="50" y="310" class="content">
    她花了几个小时擦亮银器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Polishing surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Silverware -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <!-- Polishing cloth -->
    <rect x="170" y="20" width="100" height="100" class="image" />
    <!-- Polishing motion -->
    <line x1="70" y1="120" x2="270" y2="120" class="image" />
    <line x1="70" y1="140" x2="270" y2="140" class="image" />
    <line x1="70" y1="160" x2="270" y2="160" class="image" />
    <!-- Polished result -->
    <circle cx="300" cy="70" r="20" class="image" />
  </g>
</svg>