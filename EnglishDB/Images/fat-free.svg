<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fat-free</text>
  <text x="50" y="120" class="subtitle">[fæt friː] adj. 无脂肪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fat (脂肪) + free (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的冰淇淋球，但它是"无脂肪(fat-free)"的，
    <tspan x="50" dy="25">所以你可以尽情享用而不担心变胖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This yogurt is labeled as fat-free.
  </text>
  <text x="50" y="310" class="content">
    这种酸奶被标为无脂肪的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice cream cone -->
    <polygon points="0,100 50,0 100,100" class="image" />
    <!-- Ice cream ball -->
    <circle cx="50" cy="80" r="30" class="image" />
    <!-- Cross out the fat -->
    <line x1="20" y1="60" x2="80" y2="100" class="image" />
    <line x1="20" y1="100" x2="80" y2="60" class="image" />
    <!-- Label -->
    <text x="30" y="140" class="content">Fat-Free</text>
  </g>
</svg>