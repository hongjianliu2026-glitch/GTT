<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">traumatize</text>
  <text x="50" y="120" class="subtitle">[ˈtrɔːmətaɪz] v. 使受创伤，使受精神创伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trauma (创伤) + -ize (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"创伤(trauma)"击中，
    <tspan x="50" dy="25">他的心灵被深深地"使动(ize)"，留下了不可磨灭的伤痕。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident traumatized her for life.
  </text>
  <text x="50" y="310" class="content">
    那次事故使她终生受创。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart with a crack -->
    <path d="M50,50 C50,150 150,150 150,50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Person with a shocked face -->
    <circle cx="100" cy="200" r="30" class="image" />
    <line x1="85" y1="210" x2="115" y2="210" class="image" />
    <line x1="90" y1="220" x2="110" y2="220" class="image" />
    <line x1="95" y1="230" x2="105" y2="230" class="image" />
    <line x1="100" y1="240" x2="100" y2="250" class="image" />
    <line x1="90" y1="245" x2="110" y2="245" class="image" />
  </g>
</svg>