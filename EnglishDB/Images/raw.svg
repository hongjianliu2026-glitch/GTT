<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">raw</text>
  <text x="50" y="120" class="subtitle">[rɔː] adj. 生的，未加工的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> raw (原始的，未加工的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块未经加工的"原始(raw)"木材，
    <tspan x="50" dy="25">表面粗糙，保留着自然的纹理和颜色。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef prefers to use raw ingredients.
  </text>
  <text x="50" y="310" class="content">
    这位厨师更喜欢使用未加工的食材。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Raw wood block -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Natural texture -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="40" x2="180" y2="40" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="120" x2="180" y2="120" class="image" />
    <!-- Rough surface -->
    <circle cx="50" cy="75" r="5" class="image" />
    <circle cx="100" cy="75" r="5" class="image" />
    <circle cx="150" cy="75" r="5" class="image" />
  </g>
</svg>