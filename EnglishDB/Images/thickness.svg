<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thickness</text>
  <text x="50" y="120" class="subtitle">[ˈθɪknəs] n. 厚度，浓稠度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thick (厚的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块巨大的"厚(thick)"木板，它的"厚度(thickness)"
    <tspan x="50" dy="25">足以让你在上面跳跃，甚至可以在上面建一座小房子！</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thickness of the book made it difficult to carry.
  </text>
  <text x="50" y="310" class="content">
    这本书的厚度使得它很难携带。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thick wooden board -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- House on the board -->
    <rect x="100" y="20" width="50" height="50" class="image" />
    <rect x="110" y="30" width="30" height="30" class="image" />
    <!-- Person jumping -->
    <circle cx="250" cy="60" r="15" class="image" />
    <line x1="250" y1="75" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
    <line x1="250" y1="90" x2="280" y2="80" class="image" />
  </g>
</svg>