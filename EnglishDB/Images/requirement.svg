<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">requirement</text>
  <text x="50" y="120" class="subtitle">[rɪˈkwaɪərmənt] n. 要求，必要条件</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + quire (寻求) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个项目经理在会议上，"再次寻求(re-quire)"
    <tspan x="50" dy="25">并强调某些条件是完成项目的必要条件(requirement)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Meeting the deadline is a requirement for this project.
  </text>
  <text x="50" y="310" class="content">
    按时完成是这个项目的必要条件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Project manager -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 80 80 Q 150 70 200 100 T 300 120" class="image" />
    <text x="100" y="100" class="content">再次强调</text>
    <!-- Requirements list -->
    <line x1="100" y1="140" x2="300" y2="140" class="image" />
    <line x1="100" y1="160" x2="280" y2="160" class="image" />
    <line x1="100" y1="180" x2="260" y2="180" class="image" />
    <text x="110" y="150" class="content">1. 按时完成</text>
    <text x="110" y="170" class="content">2. 质量达标</text>
    <text x="110" y="190" class="content">3. 预算控制</text>
  </g>
</svg>