<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">springtime</text>
  <text x="50" y="120" class="subtitle">[ˈsprɪŋtaɪm] n. 春天，春季</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spring (春天) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象春天(spring)到来时，万物复苏，花朵盛开，
    <tspan x="50" dy="25">整个世界都充满了生机和活力，这就是春天(springtime)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cherry blossoms bloom in springtime.
  </text>
  <text x="50" y="310" class="content">
    樱花在春天盛开。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Grass -->
    <rect x="0" y="200" width="350" height="100" fill="#27AE60" />
    <!-- Flowers -->
    <circle cx="50" cy="180" r="10" fill="#E74C3C" />
    <circle cx="80" cy="170" r="10" fill="#E74C3C" />
    <circle cx="110" cy="190" r="10" fill="#E74C3C" />
    <circle cx="140" cy="180" r="10" fill="#E74C3C" />
    <circle cx="170" cy="170" r="10" fill="#E74C3C" />
    <!-- Tree -->
    <rect x="250" y="150" width="20" height="100" fill="#7F8C8D" />
    <circle cx="260" cy="130" r="30" fill="#2ECC71" />
  </g>
</svg>