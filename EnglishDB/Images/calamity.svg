<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">calamity</text>
  <text x="50" y="120" class="subtitle">[kəˈlæmɪti] n. 灾难，不幸事件</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cala- (完全) + -mity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场"完全的(cala-)"灾难，就像一座城市被
    <tspan x="50" dy="25">巨大的海啸吞没，这就是"calamity"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The earthquake was a calamity that left many homeless.
  </text>
  <text x="50" y="310" class="content">
    地震是一场灾难，导致许多人无家可归。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="20" height="100" class="image" />
    <rect x="100" y="10" width="20" height="120" class="image" />
    <rect x="150" y="30" width="20" height="90" class="image" />
    <rect x="200" y="15" width="20" height="110" class="image" />
    <rect x="250" y="25" width="20" height="100" class="image" />
    <rect x="300" y="10" width="20" height="120" class="image" />

    <!-- Tsunami wave -->
    <path d="M 0 150 Q 100 50 200 150 T 400 150" class="image" />
    <path d="M 0 160 Q 100 60 200 160 T 400 160" class="image" />
    <path d="M 0 170 Q 100 70 200 170 T 400 170" class="image" />
  </g>
</svg>