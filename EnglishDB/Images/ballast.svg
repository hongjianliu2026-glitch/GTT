<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ballast</text>
  <text x="50" y="120" class="subtitle">[ˈbæləst] n. 压舱物，镇流器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ball (球) + -ast (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在海上航行，船底装满了巨大的"球(ball)"，
    <tspan x="50" dy="25">这些球就是压舱物(ballast)，用来保持船的稳定。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship's ballast was adjusted to maintain stability.
  </text>
  <text x="50" y="310" class="content">
    船的压舱物被调整以保持稳定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ballast -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Water -->
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
    <line x1="0" y1="170" x2="350" y2="170" class="image" />
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <line x1="0" y1="190" x2="350" y2="190" class="image" />
  </g>
</svg>