<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Scandinavian</text>
  <text x="50" y="120" class="subtitle">[ˌskændɪˈneɪviən] adj. 斯堪的纳维亚的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Scan (斯堪的纳维亚) + di (的) + an (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个北欧的维京人，手持一把巨大的斧头，站在一艘长船上，
    <tspan x="50" dy="25">船头雕刻着斯堪的纳维亚的标志，这就是"斯堪的纳维亚的(Scandinavian)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Scandinavian design is known for its simplicity and functionality.
  </text>
  <text x="50" y="310" class="content">
    斯堪的纳维亚设计以其简洁和功能性而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Viking -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Axe -->
    <line x1="20" y1="115" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="60" y2="90" class="image" />
    <line x1="50" y1="80" x2="60" y2="70" class="image" />
    <!-- Longship -->
    <rect x="70" y="100" width="200" height="50" class="image" />
    <line x1="70" y1="100" x2="170" y2="50" class="image" />
    <line x1="270" y1="100" x2="170" y2="50" class="image" />
    <!-- Scandinavian symbol -->
    <circle cx="170" cy="50" r="10" class="image" />
    <line x1="160" y1="50" x2="180" y2="50" class="image" />
    <line x1="170" y1="40" x2="170" y2="60" class="image" />
  </g>
</svg>