<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">regimen</text>
  <text x="50" y="120" class="subtitle">[ˈredʒɪmən] n. 养生法，政权，统治</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> reg (统治) + -imen (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个国王在宫殿中，"统治(reg)"
    <tspan x="50" dy="25">着他的王国，制定了一套严格的养生法(regimen)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She followed a strict regimen to improve her health.
  </text>
  <text x="50" y="310" class="content">
    她遵循严格的养生法以改善健康。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- King -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Crown -->
    <polygon points="40,80 60,80 50,60" class="image" />
    <!-- Palace -->
    <rect x="100" y="100" width="200" height="100" class="image" />
    <!-- Health symbols -->
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="170" cy="150" r="10" class="image" />
    <circle cx="190" cy="150" r="10" class="image" />
  </g>
</svg>