<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seawater</text>
  <text x="50" y="120" class="subtitle">[ˈsiːˌwɔːtər] n. 海水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sea (海) + water (水)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的海洋，"海(sea)"
    <tspan x="50" dy="25">中的"水(water)"就是海水(seawater)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship sailed through the seawater.
  </text>
  <text x="50" y="310" class="content">
    船在海水中航行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean waves -->
    <path d="M0 100 Q50 50 100 100 T200 100 T300 100 T400 100 T500 100 T600 100 T700 100 T800 100" class="water" />
    <path d="M0 120 Q50 70 100 120 T200 120 T300 120 T400 120 T500 120 T600 120 T700 120 T800 120" class="water" />
    <path d="M0 140 Q50 90 100 140 T200 140 T300 140 T400 140 T500 140 T600 140 T700 140 T800 140" class="water" />
    <!-- Ship -->
    <rect x="300" y="80" width="100" height="40" class="image" />
    <polygon points="300,80 350,40 400,80" class="image" />
    <line x1="350" y1="40" x2="350" y2="80" class="image" />
  </g>
</svg>