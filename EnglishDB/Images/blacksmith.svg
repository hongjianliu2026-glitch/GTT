<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blacksmith</text>
  <text x="50" y="120" class="subtitle">[ˈblæksmɪθ] n. 铁匠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> black (黑色的) + smith (工匠)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个铁匠在火炉前，"黑色的(black)"
    <tspan x="50" dy="25">火焰中锻造金属，他就是"工匠(smith)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The blacksmith crafted a beautiful horseshoe.
  </text>
  <text x="50" y="310" class="content">
    铁匠打造了一个漂亮的马蹄铁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Anvil -->
    <rect x="0" y="0" width="200" height="50" class="image" />
    <!-- Fire -->
    <rect x="50" y="60" width="100" height="50" class="image" />
    <!-- Hammer -->
    <line x1="150" y1="60" x2="150" y2="110" class="image" />
    <line x1="150" y1="110" x2="120" y2="110" class="image" />
    <!-- Blacksmith -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
  </g>
</svg>