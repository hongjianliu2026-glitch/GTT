<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deteriorate</text>
  <text x="50" y="120" class="subtitle">[dɪˈtɪriəreɪt] v. 恶化，变坏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + teri (土地) + -or (名词后缀) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块土地逐渐"向下(de-)"沉降，变得越来越"坏(teri-or-ate)"，
    <tspan x="50" dy="25">最终变成一片荒芜之地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The quality of the product began to deteriorate after a few months.
  </text>
  <text x="50" y="310" class="content">
    几个月后，产品的质量开始恶化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Deteriorating land -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cracks -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Sun rays -->
    <line x1="300" y1="80" x2="300" y2="150" class="image" />
    <line x1="270" y1="100" x2="330" y2="100" class="image" />
    <line x1="250" y1="120" x2="350" y2="120" class="image" />
  </g>
</svg>