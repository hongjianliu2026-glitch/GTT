<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extinguish</text>
  <text x="50" y="120" class="subtitle">[ɪkˈstɪŋɡwɪʃ] v. 熄灭，扑灭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + tingu (触) + -ish (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个消防员用巨大的水枪，"触碰(tingu)"
    <tspan x="50" dy="25">并"推出(ex-)"火焰，最终"扑灭(extinguish)"了大火。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The firefighters worked hard to extinguish the blaze.
  </text>
  <text x="50" y="310" class="content">
    消防员们努力扑灭了大火。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <path d="M50 50 C 70 20, 90 20, 110 50 S 150 80, 170 50" class="image" />
    <path d="M50 70 C 70 40, 90 40, 110 70 S 150 100, 170 70" class="image" />
    <path d="M50 90 C 70 60, 90 60, 110 90 S 150 120, 170 90" class="image" />
    <!-- Water gun -->
    <rect x="200" y="20" width="100" height="50" class="image" />
    <line x1="250" y1="70" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="200" y2="200" class="image" />
    <line x1="250" y1="150" x2="300" y2="200" class="image" />
    <!-- Firefighter -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>