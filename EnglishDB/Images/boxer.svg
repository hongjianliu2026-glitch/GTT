<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boxer</text>
  <text x="50" y="120" class="subtitle">[ˈbɒksə(r)] n. 拳击手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> box (打拳) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的拳击手，"打拳(box)"
    <tspan x="50" dy="25">的人(er)，他就是拳击手(boxer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boxer trained hard for the upcoming match.
  </text>
  <text x="50" y="310" class="content">
    这位拳击手为即将到来的比赛刻苦训练。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Boxing ring -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boxer -->
    <circle cx="100" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="100" y1="120" x2="100" y2="160" class="image" /> <!-- Body -->
    <line x1="100" y1="160" x2="80" y2="200" class="image" /> <!-- Left leg -->
    <line x1="100" y1="160" x2="120" y2="200" class="image" /> <!-- Right leg -->
    <line x1="100" y1="130" x2="60" y2="130" class="image" /> <!-- Left arm -->
    <line x1="100" y1="130" x2="140" y2="130" class="image" /> <!-- Right arm -->
    <!-- Gloves -->
    <circle cx="60" cy="130" r="10" class="image" />
    <circle cx="140" cy="130" r="10" class="image" />
  </g>
</svg>