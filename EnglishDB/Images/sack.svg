<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sack</text>
  <text x="50" y="120" class="subtitle">[sæk] n. 麻袋，开除；v. 解雇，洗劫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sac (袋子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的麻袋(sack)，里面装满了被开除(sack)的员工，
    <tspan x="50" dy="25">他们被无情地扔进袋子里，场面夸张又令人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager decided to sack the underperforming employee.
  </text>
  <text x="50" y="310" class="content">
    经理决定解雇表现不佳的员工。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sack -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bag -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People inside the sack -->
    <circle cx="100" cy="80" r="15" class="image" />
    <line x1="100" y1="95" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="80" y2="160" class="image" />
    <line x1="100" y1="130" x2="120" y2="160" class="image" />
    <line x1="100" y1="110" x2="130" y2="100" class="image" />

    <circle cx="200" cy="80" r="15" class="image" />
    <line x1="200" y1="95" x2="200" y2="130" class="image" />
    <line x1="200" y1="130" x2="180" y2="160" class="image" />
    <line x1="200" y1="130" x2="220" y2="160" class="image" />
    <line x1="200" y1="110" x2="230" y2="100" class="image" />
  </g>
</svg>