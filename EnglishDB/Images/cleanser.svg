<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cleanser</text>
  <text x="50" y="120" class="subtitle">[ˈklenzər] n. 清洁剂，洗面奶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clean (清洁) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的海绵，"清洁(clean)"
    <tspan x="50" dy="25">一切污垢，它就是清洁剂(cleanser)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She uses a gentle cleanser to wash her face every morning.
  </text>
  <text x="50" y="310" class="content">
    她每天早上用温和的洗面奶洗脸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sponge -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <rect x="40" y="40" width="120" height="70" class="image" />
    <rect x="60" y="60" width="80" height="30" class="image" />
    <!-- Dirt -->
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="120" cy="90" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
  </g>
</svg>