<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clout</text>
  <text x="50" y="120" class="subtitle">[klaʊt] n. 影响力，声望</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clout (来自古英语 "clut", 意为 "击打")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个有影响力的人，"击打(clout)"
    <tspan x="50" dy="25">周围的人，让他们听从他的意见，这就是他的影响力(clout)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gained clout in the industry after her successful project.
  </text>
  <text x="50" y="310" class="content">
    她在成功完成项目后在行业中获得了影响力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Influential person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />
    <!-- Impact -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="350" cy="100" r="20" class="image" />
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <line x1="50" y1="100" x2="200" y2="50" class="image" />
    <line x1="50" y1="100" x2="200" y2="150" class="image" />
  </g>
</svg>