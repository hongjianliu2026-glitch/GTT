<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .clay { fill: #D5DBDB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clay</text>
  <text x="50" y="120" class="subtitle">[kleɪ] n. 黏土，泥土</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 claie，意为“黏土”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个陶艺家在工作室里，双手沾满黏土(clay)，
    <tspan x="50" dy="25">正在塑造一个精美的陶器。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The potter shaped the clay into a vase.
  </text>
  <text x="50" y="310" class="content">
    陶艺家将黏土塑造成一个花瓶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Clay -->
    <rect x="0" y="0" width="300" height="200" class="clay" />
    <!-- Hands -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="250" y2="120" class="image" />
    <line x1="50" y1="140" x2="250" y2="140" class="image" />
    <line x1="50" y1="160" x2="250" y2="160" class="image" />
  </g>
</svg>