<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">photographer</text>
  <text x="50" y="120" class="subtitle">[fəˈtɒɡrəfə(r)] n. 摄影师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> photo- (光) + graph (写) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摄影师在阳光下，"用光写下(photo-graph)"
    <tspan x="50" dy="25">瞬间的美丽，他就是摄影师(photographer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The photographer captured the perfect sunset.
  </text>
  <text x="50" y="310" class="content">
    摄影师捕捉到了完美的日落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camera -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="20" y="20" width="110" height="60" class="image" />
    <circle cx="125" cy="50" r="10" class="image" />
    <!-- Photographer -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="30" x2="150" y2="10" class="image" />
    <line x1="150" y1="70" x2="150" y2="90" class="image" />
    <line x1="130" y1="50" x2="110" y2="50" class="image" />
    <line x1="170" y1="50" x2="190" y2="50" class="image" />
  </g>
</svg>