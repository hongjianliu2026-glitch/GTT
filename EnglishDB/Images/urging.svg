<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">urging</text>
  <text x="50" y="120" class="subtitle">[ˈɜːrdʒɪŋ] v. 催促，力劝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ur- (原始) + ge (驱动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始人用尽全力"驱动(ur-ge)"
    <tspan x="50" dy="25">一头野兽，催促它前进，这就是"催促(urging)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was urging his team to finish the project on time.
  </text>
  <text x="50" y="310" class="content">
    他正在催促他的团队按时完成项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Primitive man -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Beast -->
    <rect x="120" y="80" width="100" height="80" class="image" />
    <line x1="130" y1="100" x2="210" y2="100" class="image" />
    <line x1="130" y1="140" x2="210" y2="140" class="image" />
    <line x1="130" y1="180" x2="210" y2="180" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,100 140,90 140,110" class="image" />
  </g>
</svg>