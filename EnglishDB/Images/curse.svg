<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">curse</text>
  <text x="50" y="120" class="subtitle">[kɜːrs] n. 诅咒，咒骂；v. 诅咒，咒骂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cur (关心) + se (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巫师在施法，"关心(cur)"
    <tspan x="50" dy="25">某人，但用的是负面的方式，让他离开(se)幸福，</tspan>
    <tspan x="50" dy="25">这就是诅咒(curse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The witch placed a curse on the village.
  </text>
  <text x="50" y="310" class="content">
    女巫对村庄施了诅咒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Witch -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Spell -->
    <path d="M50,100 Q100,50 150,100" class="image" />
    <path d="M50,120 Q100,70 150,120" class="image" />
    <path d="M50,140 Q100,90 150,140" class="image" />
    <!-- Village -->
    <rect x="200" y="80" width="100" height="50" class="image" />
    <rect x="220" y="90" width="20" height="30" class="image" />
    <rect x="250" y="90" width="20" height="30" class="image" />
    <rect x="280" y="90" width="20" height="30" class="image" />
  </g>
</svg>