<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fountain</text>
  <text x="50" y="120" class="subtitle">[ˈfaʊntən] n. 喷泉，泉水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> font (泉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的喷泉，水柱从泉眼(font)中喷涌而出，
    <tspan x="50" dy="25">形成壮观的景象，这就是喷泉(fountain)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fountain in the park is a popular spot for tourists.
  </text>
  <text x="50" y="310" class="content">
    公园里的喷泉是游客的热门景点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fountain base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fountain structure -->
    <rect x="150" y="20" width="50" height="160" class="image" />
    <!-- Water jets -->
    <polygon points="175,20 150,50 200,50" class="water" />
    <polygon points="175,50 150,80 200,80" class="water" />
    <polygon points="175,80 150,110 200,110" class="water" />
    <polygon points="175,110 150,140 200,140" class="water" />
  </g>
</svg>