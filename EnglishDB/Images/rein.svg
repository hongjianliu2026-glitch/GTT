<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rein</text>
  <text x="50" y="120" class="subtitle">[reɪn] n. 缰绳；v. 控制，驾驭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + in (进入)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骑士拉紧缰绳，"回拉(re-in)"
    <tspan x="50" dy="25">马匹，控制它的方向，这就是驾驭(rein)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rider pulled the reins to stop the horse.
  </text>
  <text x="50" y="310" class="content">
    骑手拉紧缰绳让马停下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Horse head -->
    <line x1="80" y1="100" x2="150" y2="100" class="image" /> <!-- Horse neck -->
    <line x1="150" y1="100" x2="200" y2="50" class="image" /> <!-- Horse back -->
    <line x1="200" y1="50" x2="250" y2="100" class="image" /> <!-- Horse back -->
    <line x1="250" y1="100" x2="300" y2="100" class="image" /> <!-- Horse tail -->
    <!-- Rider -->
    <circle cx="100" cy="50" r="15" class="image" /> <!-- Rider head -->
    <line x1="100" y1="65" x2="100" y2="100" class="image" /> <!-- Rider body -->
    <line x1="100" y1="100" x2="80" y2="130" class="image" /> <!-- Rider left leg -->
    <line x1="100" y1="100" x2="120" y2="130" class="image" /> <!-- Rider right leg -->
    <!-- Reins -->
    <line x1="100" y1="65" x2="50" y2="90" class="image" /> <!-- Left rein -->
    <line x1="100" y1="65" x2="50" y2="110" class="image" /> <!-- Right rein -->
  </g>
</svg>