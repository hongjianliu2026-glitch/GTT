<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subculture</text>
  <text x="50" y="120" class="subtitle">[ˈsʌbˌkʌltʃər] n. 亚文化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + culture (文化)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的文化金字塔，"在下面(sub-)"
    <tspan x="50" dy="25">有一群人形成了独特的文化(culture)，这就是亚文化(subculture)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The punk scene is a well-known subculture.
  </text>
  <text x="50" y="310" class="content">
    朋克场景是一个众所周知的亚文化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pyramid -->
    <polygon points="175,0 0,200 350,200" class="image" />
    <!-- Subculture group -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="190" class="image" />
    <line x1="175" y1="190" x2="155" y2="210" class="image" />
    <line x1="175" y1="190" x2="195" y2="210" class="image" />
    <line x1="175" y1="180" x2="210" y2="170" class="image" />
    <line x1="175" y1="180" x2="140" y2="170" class="image" />
  </g>
</svg>