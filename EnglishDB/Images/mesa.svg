<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mesa</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪsə] n. 平顶山</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mes- (中间) + a (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的山，"中间(mes-)"被削平，
    <tspan x="50" dy="25">形成了一个平顶的"桌子(mesa)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mesa in Arizona is a popular tourist spot.
  </text>
  <text x="50" y="310" class="content">
    亚利桑那州的平顶山是一个受欢迎的旅游景点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Base of the mesa -->
    <rect x="0" y="100" width="300" height="100" class="image" />
    <!-- Flat top of the mesa -->
    <rect x="50" y="0" width="200" height="100" class="image" />
    <!-- Mountains around the mesa -->
    <line x1="0" y1="100" x2="50" y2="0" class="image" />
    <line x1="300" y1="100" x2="250" y2="0" class="image" />
    <!-- Clouds -->
    <ellipse cx="150" cy="50" rx="100" ry="30" class="image" />
  </g>
</svg>