<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buy</text>
  <text x="50" y="120" class="subtitle">[baɪ] v. 购买</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "biggen"，意为“交换”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着钱，"交换(biggen)"
    <tspan x="50" dy="25">物品，这个动作就是购买(buy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to buy a new car.
  </text>
  <text x="50" y="310" class="content">
    她决定买一辆新车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Money -->
    <rect x="50" y="90" width="30" height="20" class="image" />
    <line x1="65" y1="95" x2="65" y2="110" class="image" />
    <line x1="55" y1="100" x2="75" y2="100" class="image" />
    <!-- Item -->
    <rect x="100" y="90" width="40" height="30" class="image" />
    <line x1="120" y1="95" x2="120" y2="115" class="image" />
    <line x1="110" y1="100" x2="130" y2="100" class="image" />
  </g>
</svg>