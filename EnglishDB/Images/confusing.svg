<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">confusing</text>
  <text x="50" y="120" class="subtitle">[kənˈfjuːzɪŋ] adj. 令人困惑的，混乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + fus (流) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，所有的信息像水流一样"混在一起(con-fus)"，
    <tspan x="50" dy="25">让人无法分辨，这就是"令人困惑的(confusing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The instructions were so confusing that I couldn't follow them.
  </text>
  <text x="50" y="310" class="content">
    这些指示太令人困惑了，我无法理解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Confused face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <line x1="100" y1="140" x2="100" y2="150" class="image" />

    <!-- Mixed lines -->
    <line x1="0" y1="0" x2="200" y2="200" class="image" />
    <line x1="0" y1="50" x2="200" y2="150" class="image" />
    <line x1="0" y1="100" x2="200" y2="100" class="image" />
    <line x1="0" y1="150" x2="200" y2="50" class="image" />
    <line x1="0" y1="200" x2="200" y2="0" class="image" />
  </g>
</svg>