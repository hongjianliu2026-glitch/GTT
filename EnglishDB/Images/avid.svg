<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">avid</text>
  <text x="50" y="120" class="subtitle">[ˈævɪd] adj. 渴望的，热心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> av (渴望) + -id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人眼睛瞪得大大的，"渴望(av)"
    <tspan x="50" dy="25">地盯着目标，表现出极大的热情(avid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is an avid reader of science fiction.
  </text>
  <text x="50" y="310" class="content">
    他是一个热衷于科幻小说的读者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Eyes -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Pupils -->
    <circle cx="100" cy="100" r="15" fill="#000" />
    <circle cx="200" cy="100" r="15" fill="#000" />
    <!-- Target -->
    <circle cx="300" cy="100" r="50" class="image" />
    <line x1="300" y1="50" x2="300" y2="150" class="image" />
    <line x1="250" y1="100" x2="350" y2="100" class="image" />
  </g>
</svg>