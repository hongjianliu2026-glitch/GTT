<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plumber</text>
  <text x="50" y="120" class="subtitle">[ˈplʌmbər] n. 水管工</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plumb (铅锤) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个水管工拿着"铅锤(plumb)"，
    <tspan x="50" dy="25">检查水管是否垂直，确保水流畅通。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plumber fixed the leaky faucet in no time.
  </text>
  <text x="50" y="310" class="content">
    水管工很快修好了漏水的水龙头。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plumber -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Plumb -->
    <rect x="70" y="90" width="20" height="40" class="image" />
    <line x1="80" y1="90" x2="80" y2="50" class="image" />
    <line x1="80" y1="50" x2="60" y2="30" class="image" />
    <line x1="80" y1="50" x2="100" y2="30" class="image" />
    <!-- Pipe -->
    <rect x="120" y="100" width="100" height="20" class="image" />
    <line x1="120" y1="110" x2="220" y2="110" class="image" />
    <line x1="170" y1="110" x2="170" y2="150" class="image" />
    <line x1="170" y1="150" x2="150" y2="170" class="image" />
    <line x1="170" y1="150" x2="190" y2="170" class="image" />
  </g>
</svg>