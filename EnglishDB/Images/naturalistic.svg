<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">naturalistic</text>
  <text x="50" y="120" class="subtitle">[ˌnætʃərəˈlɪstɪk] adj. 自然主义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> natura (自然) + -istic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家在户外，"自然地(natura)"
    <tspan x="50" dy="25">描绘着风景，他的作品充满了自然主义(naturalistic)的色彩。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His paintings are very naturalistic, capturing the essence of nature.
  </text>
  <text x="50" y="310" class="content">
    他的画作非常自然主义，捕捉到了自然的本质。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Landscape -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="30" cy="30" r="20" fill="#F1C40F" />
    <!-- Trees -->
    <line x1="100" y1="150" x2="100" y2="100" class="image" />
    <line x1="120" y1="150" x2="120" y2="100" class="image" />
    <line x1="110" y1="100" x2="90" y2="100" class="image" />
    <line x1="110" y1="100" x2="130" y2="100" class="image" />
    <!-- Grass -->
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="190" x2="300" y2="190" class="image" />
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <!-- Painter -->
    <circle cx="200" cy="120" r="15" fill="#E74C3C" />
    <line x1="200" y1="135" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="180" y2="200" class="image" />
    <line x1="200" y1="170" x2="220" y2="200" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
    <!-- Canvas -->
    <rect x="250" y="80" width="80" height="100" class="image" />
    <!-- Painting -->
    <line x1="260" y1="90" x2="320" y2="90" class="image" />
    <line x1="260" y1="110" x2="320" y2="110" class="image" />
    <line x1="260" y1="130" x2="320" y2="130" class="image" />
    <line x1="260" y1="150" x2="320" y2="150" class="image" />
  </g>
</svg>