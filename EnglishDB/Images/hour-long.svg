<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hour-long</text>
  <text x="50" y="120" class="subtitle">[ˈaʊər lɔŋ] adj. 持续一小时的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hour (小时) + long (长的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，指针指向"一小时(hour)"，
    <tspan x="50" dy="25">而时钟的影子拉得"很长(long)"，象征着持续一小时的时长。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hour-long meeting felt like an eternity.
  </text>
  <text x="50" y="310" class="content">
    那场持续一小时的会议感觉像永恒一样漫长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Hour hand -->
    <line x1="100" y1="100" x2="100" y2="30" class="image" />
    <!-- Minute hand -->
    <line x1="100" y1="100" x2="170" y2="100" class="image" />
    <!-- Shadow -->
    <line x1="100" y1="180" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="100" y2="180" class="image" />
  </g>
</svg>