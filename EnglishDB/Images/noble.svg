<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">noble</text>
  <text x="50" y="120" class="subtitle">[ˈnoʊbl] adj. 高贵的，贵族的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nob (出生) + -le (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个出生在"贵族之家(nob-le)"的人，
    <tspan x="50" dy="25">他们从小就被教导要举止高雅，这就是"高贵的(noble)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was born into a noble family.
  </text>
  <text x="50" y="310" class="content">
    她出生在一个贵族家庭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <circle cx="100" cy="50" r="40" class="image" />
    <line x1="60" y1="50" x2="140" y2="50" class="image" />
    <line x1="80" y1="30" x2="120" y2="30" class="image" />
    <line x1="90" y1="10" x2="110" y2="10" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="30" class="image" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="200" class="image" />
    <line x1="100" y1="200" x2="150" y2="200" class="image" />
  </g>
</svg>