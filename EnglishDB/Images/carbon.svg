<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carbon</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːrbən] n. 碳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carb- (碳) + -on (表示物质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"碳(carb-)"球，
    <tspan x="50" dy="25">它是由无数微小的碳原子组成的，</tspan>
    <tspan x="50" dy="25">这些原子紧密结合，形成了坚硬的物质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Diamonds are made of pure carbon.
  </text>
  <text x="50" y="310" class="content">
    钻石是由纯碳构成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Carbon atom -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="40" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Carbon bonds -->
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="70" y1="70" x2="130" y2="130" class="image" />
    <line x1="70" y1="130" x2="130" y2="70" class="image" />
  </g>
</svg>