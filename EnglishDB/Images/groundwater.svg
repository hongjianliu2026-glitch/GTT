<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .ground { fill: #8D4E4B; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">groundwater</text>
  <text x="50" y="120" class="subtitle">[ˈɡraʊndˌwɔːtər] n. 地下水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ground (地面) + water (水)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片干旱的土地，突然间，"地面(ground)"
    <tspan x="50" dy="25">下涌出清澈的"水(water)"，这就是地下水(groundwater)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The village relies on groundwater for its daily water supply.
  </text>
  <text x="50" y="310" class="content">
    这个村庄依赖地下水作为日常用水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="ground" />
    <!-- Water -->
    <rect x="50" y="50" width="250" height="100" class="water" />
    <!-- Water surface -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <!-- Ground surface -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
  </g>
</svg>