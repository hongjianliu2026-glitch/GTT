<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unexplored</text>
  <text x="50" y="120" class="subtitle">[ˌʌnɪkˈsplɔːrd] adj. 未被探索的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + explore (探索)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片茂密的丛林，"未被探索(un-explored)"
    <tspan x="50" dy="25">的区域充满了神秘和未知，等待着勇敢的探险家。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unexplored region of the Amazon is full of surprises.
  </text>
  <text x="50" y="310" class="content">
    亚马逊未被探索的区域充满了惊喜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jungle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Path -->
    <line x1="20" y1="150" x2="330" y2="150" class="image" />
    <!-- Explorer -->
    <circle cx="30" cy="140" r="10" class="image" />
    <line x1="30" y1="150" x2="30" y2="170" class="image" />
    <line x1="30" y1="170" x2="20" y2="190" class="image" />
    <line x1="30" y1="170" x2="40" y2="190" class="image" />
    <line x1="30" y1="160" x2="50" y2="150" class="image" />
  </g>
</svg>