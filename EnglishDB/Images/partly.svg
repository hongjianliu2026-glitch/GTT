<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">partly</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːrtli] adv. 部分地，不完全地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> part (部分) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕，被切成了几块，其中一块被吃掉了，
    <tspan x="50" dy="25">这就是"部分地(partly)"被吃掉了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was completed partly by the team.
  </text>
  <text x="50" y="310" class="content">
    这个项目是由团队部分完成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Slices of cake -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="170" y="20" width="100" height="160" class="image" />
    <rect x="290" y="20" width="50" height="160" class="image" />
    <!-- Eaten part -->
    <rect x="290" y="20" width="50" height="80" class="image" fill="#E74C3C" />
    <!-- Fork -->
    <line x1="315" y1="100" x2="345" y2="100" class="image" />
    <line x1="330" y1="100" x2="330" y2="150" class="image" />
    <line x1="330" y1="150" x2="315" y2="140" class="image" />
    <line x1="330" y1="150" x2="345" y2="140" class="image" />
  </g>
</svg>