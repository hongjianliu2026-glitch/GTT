<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pre-Columbian</text>
  <text x="50" y="120" class="subtitle">[ˌpriːkəˈlʌmbiən] adj. 哥伦布发现美洲前的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在...之前) + Columbian (哥伦布的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在哥伦布发现美洲之前，"在哥伦布之前(pre-Columbian)"
    <tspan x="50" dy="25">的美洲大陆上，原住民们过着与世隔绝的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pre-Columbian civilizations of Mesoamerica were highly advanced.
  </text>
  <text x="50" y="310" class="content">
    中美洲的哥伦布发现美洲前的文明非常先进。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pre-Columbian symbol -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Columbus' ship -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <polygon points="200,50 250,25 300,50" class="image" />
    <line x1="250" y1="50" x2="250" y2="100" class="image" />
  </g>
</svg>