<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">medium</text>
  <text x="50" y="120" class="subtitle">[ˈmiːdiəm] n. 媒介，手段；adj. 中等的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> medius (中间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天平，"中间(medius)"的支点是
    <tspan x="50" dy="25">连接两端的媒介(medium)，平衡着两边的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The medium of communication was email.
  </text>
  <text x="50" y="310" class="content">
    沟通的媒介是电子邮件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="100" y1="50" x2="300" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <line x1="300" y1="50" x2="300" y2="100" class="image" />
    <!-- Weights -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Medium -->
    <rect x="180" y="50" width="40" height="100" class="image" />
  </g>
</svg>