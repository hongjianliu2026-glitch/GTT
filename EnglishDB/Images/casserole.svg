<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .food { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">casserole</text>
  <text x="50" y="120" class="subtitle">[ˈkæsəroʊl] n. 砂锅菜，炖锅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cass (盒子) + erole (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小盒子(cass-erole)里装满了美味的炖菜，
    <tspan x="50" dy="25">热气腾腾，香气四溢，这就是砂锅菜(casserole)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prepared a delicious chicken casserole for dinner.
  </text>
  <text x="50" y="310" class="content">
    她为晚餐准备了一道美味的鸡肉砂锅菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Casserole dish -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Food inside the casserole -->
    <circle cx="120" cy="100" r="20" class="food" />
    <circle cx="180" cy="100" r="20" class="food" />
    <circle cx="240" cy="100" r="20" class="food" />
    <!-- Steam -->
    <line x1="120" y1="20" x2="120" y2="40" class="image" />
    <line x1="180" y1="20" x2="180" y2="40" class="image" />
    <line x1="240" y1="20" x2="240" y2="40" class="image" />
  </g>
</svg>