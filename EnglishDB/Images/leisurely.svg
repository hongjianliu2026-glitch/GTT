<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leisurely</text>
  <text x="50" y="120" class="subtitle">[ˈlɛʒərli] adj. 悠闲的，从容的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leis (休闲) + -ure (名词后缀) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公园里，"悠闲地(leis-ure-ly)"
    <tspan x="50" dy="25">散步，享受着宁静的时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He walked through the park in a leisurely manner.
  </text>
  <text x="50" y="310" class="content">
    他悠闲地穿过公园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Park scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Path -->
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
    <!-- Trees -->
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="220" y1="100" x2="220" y2="150" class="image" />
    <line x1="210" y1="100" x2="210" y2="150" class="image" />
    <line x1="210" y1="100" x2="200" y2="80" class="image" />
    <line x1="210" y1="100" x2="220" y2="80" class="image" />
  </g>
</svg>