<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incredible</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkredəbl] adj. 难以置信的，不可思议的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + cred (相信) + -ible (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的问号悬浮在空中，"不(in-)"
    <tspan x="50" dy="25">让人相信(cred)"，这就是难以置信(incredible)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician performed an incredible trick.
  </text>
  <text x="50" y="310" class="content">
    魔术师表演了一个令人难以置信的魔术。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large question mark -->
    <path d="M50 50 Q100 100 150 50 T250 50" class="image" />
    <line x1="250" y1="50" x2="250" y2="100" class="image" />
    <!-- Floating effect -->
    <line x1="50" y1="50" x2="50" y2="40" class="image" />
    <line x1="150" y1="50" x2="150" y2="40" class="image" />
    <line x1="250" y1="50" x2="250" y2="40" class="image" />
  </g>
</svg>