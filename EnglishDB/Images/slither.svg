<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slither</text>
  <text x="50" y="120" class="subtitle">[ˈslɪðər] v. 滑行，蜿蜒移动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slithe (滑) + -er (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条蛇在草地上"滑行(slithe)"，
    <tspan x="50" dy="25">它的身体像波浪一样蜿蜒移动，这就是"slither"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snake slithered silently through the grass.
  </text>
  <text x="50" y="310" class="content">
    蛇悄无声息地滑过草地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Snake body -->
    <path d="M50,100 C60,80 100,80 110,100 C120,120 160,120 170,100 C180,80 220,80 230,100" class="image" />
    <!-- Snake head -->
    <circle cx="230" cy="100" r="15" class="image" />
    <!-- Eyes -->
    <circle cx="225" cy="95" r="2" class="image" />
    <circle cx="235" cy="95" r="2" class="image" />
  </g>
</svg>