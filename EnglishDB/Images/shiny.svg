<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #E67E22; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .shine { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shiny</text>
  <text x="50" y="120" class="subtitle">[ˈʃaɪni] adj. 闪亮的，有光泽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shin (光) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阳光明媚的日子，你看到一个"闪闪发光(shin-y)"
    <tspan x="50" dy="25">的金属球，它的表面反射出耀眼的光芒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shiny car caught everyone's attention.
  </text>
  <text x="50" y="310" class="content">
    那辆闪亮的汽车吸引了所有人的注意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="shine" />
    <!-- Metal ball -->
    <circle cx="300" cy="100" r="40" class="shine" />
    <!-- Reflected light -->
    <line x1="260" y1="100" x2="340" y2="100" class="image" />
    <line x1="280" y1="60" x2="320" y2="140" class="image" />
    <line x1="280" y1="140" x2="320" y2="60" class="image" />
  </g>
</svg>