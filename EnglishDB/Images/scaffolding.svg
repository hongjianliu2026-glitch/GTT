<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scaffolding</text>
  <text x="50" y="120" class="subtitle">[ˈskæfəldɪŋ] n. 脚手架，支架</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scaf (脚) + fold (折叠) + ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个建筑工地上，"脚(scaf)"和"折叠(fold)"的结构
    <tspan x="50" dy="25">支撑着整个建筑，这就是脚手架(scaffolding)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The workers used scaffolding to reach the top of the building.
  </text>
  <text x="50" y="310" class="content">
    工人们使用脚手架到达建筑物的顶部。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scaffolding structure -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="50" y1="20" x2="250" y2="20" class="image" />
    <line x1="50" y1="60" x2="250" y2="60" class="image" />
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="50" y1="140" x2="250" y2="140" class="image" />
    <line x1="50" y1="180" x2="250" y2="180" class="image" />
  </g>
</svg>