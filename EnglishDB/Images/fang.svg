<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fang</text>
  <text x="50" y="120" class="subtitle">[fæŋ] n. 尖牙，犬齿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fang (源自中古英语，意为“尖牙”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的狼，张开血盆大口，露出锋利的"尖牙(fang)"，
    <tspan x="50" dy="25">仿佛能撕裂一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wolf bared its fangs at the intruder.
  </text>
  <text x="50" y="310" class="content">
    狼对着入侵者露出了尖牙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wolf head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Nose -->
    <circle cx="100" cy="120" r="15" class="image" />
    <!-- Mouth -->
    <line x1="60" y1="140" x2="140" y2="140" class="image" />
    <!-- Fangs -->
    <line x1="80" y1="140" x2="80" y2="160" class="image" />
    <line x1="120" y1="140" x2="120" y2="160" class="image" />
  </g>
</svg>