<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uncomfortably</text>
  <text x="50" y="120" class="subtitle">[ʌnˈkʌmfərtəbli] adv. 不舒服地，不安地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + comfort (舒适) + -able (能够) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在一个"不舒服(un-comfort)"的椅子上，
    <tspan x="50" dy="25">身体扭曲，表情痛苦，这就是"不舒服地(uncomfortably)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sat uncomfortably on the hard wooden chair.
  </text>
  <text x="50" y="310" class="content">
    她坐在硬木椅上，感到很不舒服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Uncomfortable chair -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person sitting uncomfortably -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Uncomfortable expression -->
    <line x1="190" y1="90" x2="210" y2="90" class="image" />
    <line x1="190" y1="90" x2="185" y2="85" class="image" />
    <line x1="210" y1="90" x2="215" y2="85" class="image" />
    <line x1="190" y1="95" x2="210" y2="95" class="image" />
    <line x1="190" y1="95" x2="185" y2="100" class="image" />
    <line x1="210" y1="95" x2="215" y2="100" class="image" />
  </g>
</svg>