<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">side</text>
  <text x="50" y="120" class="subtitle">[saɪd] n. 侧面，边；adj. 旁边的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sid (坐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在一个巨大的立方体旁边，"坐(sid)"
    <tspan x="50" dy="25">在立方体的一侧(side)，这就是side的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stood on the side of the building.
  </text>
  <text x="50" y="310" class="content">
    她站在建筑物的旁边。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cube -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <rect x="50" y="50" width="200" height="200" class="image" />
    <rect x="100" y="100" width="200" height="200" class="image" />
    <!-- Person sitting -->
    <circle cx="300" cy="150" r="20" class="image" />
    <line x1="300" y1="170" x2="300" y2="220" class="image" />
    <line x1="300" y1="220" x2="280" y2="250" class="image" />
    <line x1="300" y1="220" x2="320" y2="250" class="image" />
    <line x1="300" y1="190" x2="340" y2="180" class="image" />
  </g>
</svg>