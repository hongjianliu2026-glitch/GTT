<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clearance</text>
  <text x="50" y="120" class="subtitle">[ˈklɪərəns] n. 清除，清理；许可</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clear (清除) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的扫帚在空中挥舞，"清除(clear)"
    <tspan x="50" dy="25">一切障碍，留下一片空旷的空间，这就是清理(clearance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clearance of the old furniture took the whole day.
  </text>
  <text x="50" y="310" class="content">
    清理旧家具花了一整天的时间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broom -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="30" y2="50" class="image" />
    <line x1="50" y1="20" x2="70" y2="50" class="image" />
    <rect x="30" y="180" width="40" height="20" class="image" />
    <!-- Cleared space -->
    <rect x="100" y="100" width="200" height="100" class="image" />
    <text x="150" y="150" class="content" fill="#7F8C8D">Cleared Space</text>
  </g>
</svg>