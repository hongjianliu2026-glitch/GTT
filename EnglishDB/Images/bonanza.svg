<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bonanza</text>
  <text x="50" y="120" class="subtitle">[boʊˈnænzə] n. 富矿带，发财</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bon (好) + anza (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个矿工在地下发现了一个"好(bon)"矿带，
    <tspan x="50" dy="25">这个矿带让他发了大财(bonanza)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The discovery of the gold bonanza made him rich overnight.
  </text>
  <text x="50" y="310" class="content">
    金矿带的发现让他一夜暴富。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mine entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gold nuggets -->
    <circle cx="50" cy="100" r="20" class="image" fill="#FFD700" />
    <circle cx="100" cy="120" r="20" class="image" fill="#FFD700" />
    <circle cx="150" cy="100" r="20" class="image" fill="#FFD700" />
    <!-- Miner -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
    <!-- Pickaxe -->
    <line x1="20" y1="165" x2="70" y2="115" class="image" />
    <line x1="70" y1="115" x2="80" y2="125" class="image" />
  </g>
</svg>