<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gulf</text>
  <text x="50" y="120" class="subtitle">[ɡʌlf] n. 海湾，鸿沟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gulf (源自拉丁语 "gulfa"，意为 "吞噬")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片巨大的海洋，"吞噬(gulfa)"
    <tspan x="50" dy="25">着周围的一切，形成了一个深邃的海湾(gulf)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Gulf of Mexico is a major body of water.
  </text>
  <text x="50" y="310" class="content">
    墨西哥湾是一个重要的水体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Gulf -->
    <path d="M50,100 Q100,50 150,100 T300,100" class="image" stroke-width="5" />
    <!-- Waves -->
    <path d="M50,150 Q100,120 150,150 T300,150" class="image" stroke-width="3" />
    <path d="M50,170 Q100,140 150,170 T300,170" class="image" stroke-width="3" />
  </g>
</svg>