<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">newfound</text>
  <text x="50" y="120" class="subtitle">[ˌnuːˈfaʊnd] adj. 新发现的，新获得的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> new (新的) + found (发现)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在丛林中，"新发现(new-found)"
    <tspan x="50" dy="25">了一块闪闪发光的宝石，这宝石象征着新获得的财富和知识。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt a newfound sense of confidence after the success.
  </text>
  <text x="50" y="310" class="content">
    成功后，她感到一种新获得的自信。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jungle background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Explorer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Gem -->
    <polygon points="250,50 270,90 310,100 270,110 250,150 230,110 190,100 230,90" class="image" />
    <!-- Light rays -->
    <line x1="250" y1="50" x2="250" y2="20" class="image" />
    <line x1="270" y1="90" x2="270" y2="60" class="image" />
    <line x1="310" y1="100" x2="310" y2="70" class="image" />
    <line x1="270" y1="110" x2="270" y2="80" class="image" />
    <line x1="250" y1="150" x2="250" y2="120" class="image" />
    <line x1="230" y1="110" x2="230" y2="80" class="image" />
    <line x1="190" y1="100" x2="190" y2="70" class="image" />
    <line x1="230" y1="90" x2="230" y2="60" class="image" />
  </g>
</svg>