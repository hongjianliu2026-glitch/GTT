<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foremost</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrmoʊst] adj. 最重要的，首要的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (前面) + most (最)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人排队，"最前面的(fore-most)"
    <tspan x="50" dy="25">那个人就是最重要的(foremost)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is the foremost expert in her field.
  </text>
  <text x="50" y="310" class="content">
    她是她领域中最顶尖的专家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People in a line -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="50" cy="90" r="15" class="image" />
    <circle cx="50" cy="130" r="15" class="image" />
    <circle cx="50" cy="170" r="15" class="image" />
    <!-- Foremost person -->
    <circle cx="50" cy="20" r="20" class="image" fill="#E74C3C" />
    <text x="50" y="30" text-anchor="middle" class="highlight">1st</text>
  </g>
</svg>