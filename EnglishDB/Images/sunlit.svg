<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sunlit</text>
  <text x="50" y="120" class="subtitle">[ˈsʌnlɪt] adj. 阳光照射的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + lit (light的过去分词，表示“被照亮”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阳光明媚的早晨，太阳的光线"照射(lit)"在一片草地上，
    <tspan x="50" dy="25">草地上的每一根草都被阳光"照亮(sunlit)"，闪闪发光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sunlit meadow was a perfect place for a picnic.
  </text>
  <text x="50" y="310" class="content">
    阳光照射的草地是野餐的完美地点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="40" fill="#F1C40F" />
    <!-- Rays -->
    <line x1="50" y1="10" x2="50" y2="0" class="image" />
    <line x1="85" y1="15" x2="100" y2="10" class="image" />
    <line x1="100" y1="50" x2="120" y2="50" class="image" />
    <line x1="85" y1="85" x2="100" y2="100" class="image" />
    <line x1="50" y1="90" x2="50" y2="100" class="image" />
    <line x1="15" y1="85" x2="0" y2="100" class="image" />
    <line x1="0" y1="50" x2="0" y2="50" class="image" />
    <line x1="15" y1="15" x2="0" y2="10" class="image" />
    <!-- Meadow -->
    <rect x="0" y="100" width="350" height="100" fill="#2ECC71" />
    <!-- Sunlit grass -->
    <line x1="20" y1="120" x2="20" y2="150" class="image" />
    <line x1="40" y1="120" x2="40" y2="150" class="image" />
    <line x1="60" y1="120" x2="60" y2="150" class="image" />
    <line x1="80" y1="120" x2="80" y2="150" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="120" y1="120" x2="120" y2="150" class="image" />
    <line x1="140" y1="120" x2="140" y2="150" class="image" />
    <line x1="160" y1="120" x2="160" y2="150" class="image" />
    <line x1="180" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="200" y2="150" class="image" />
    <line x1="220" y1="120" x2="220" y2="150" class="image" />
    <line x1="240" y1="120" x2="240" y2="150" class="image" />
    <line x1="260" y1="120" x2="260" y2="150" class="image" />
    <line x1="280" y1="120" x2="280" y2="150" class="image" />
    <line x1="300" y1="120" x2="300" y2="150" class="image" />
    <line x1="320" y1="120" x2="320" y2="150" class="image" />
    <line x1="340" y1="120" x2="340" y2="150" class="image" />
  </g>
</svg>