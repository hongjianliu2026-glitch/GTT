<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #7E5109; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #154360; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sadness</text>
  <text x="50" y="120" class="subtitle">[ˈsædnəs] n. 悲伤，忧愁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sad (悲伤) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在角落里，脸上挂着"悲伤(sad)"的表情，
    <tspan x="50" dy="25">周围弥漫着忧愁的氛围，这就是"悲伤(sadness)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sadness in her eyes was palpable.
  </text>
  <text x="50" y="310" class="content">
    她眼中的悲伤是显而易见的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person sitting -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Sad face -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="65" cy="90" r="5" class="image" />
    <path d="M 45 110 Q 50 120 55 110" class="image" />
    <!-- Cloud -->
    <ellipse cx="100" cy="50" rx="30" ry="20" class="image" />
    <ellipse cx="80" cy="40" rx="20" ry="15" class="image" />
    <ellipse cx="120" cy="40" rx="20" ry="15" class="image" />
  </g>
</svg>