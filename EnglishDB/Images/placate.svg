<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">placate</text>
  <text x="50" y="120" class="subtitle">[ˈplækeɪt] v. 安抚，抚慰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plac (平静) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个生气的孩子，你给他一块糖，他立刻"平静(plac)"下来，这就是安抚(placate)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tried to placate the angry customer with a refund.
  </text>
  <text x="50" y="310" class="content">
    她试图用退款来安抚生气的顾客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="80" y1="80" x2="120" y2="80" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <line x1="100" y1="140" x2="100" y2="150" class="image" />

    <!-- Candy -->
    <rect x="200" y="80" width="50" height="50" class="image" />
    <line x1="225" y1="105" x2="225" y2="130" class="image" />
    <line x1="210" y1="115" x2="240" y2="115" class="image" />

    <!-- Calm face -->
    <circle cx="300" cy="100" r="50" class="image" />
    <line x1="280" y1="80" x2="320" y2="80" class="image" />
    <line x1="280" y1="120" x2="320" y2="120" class="image" />
    <line x1="290" y1="130" x2="310" y2="130" class="image" />
    <line x1="300" y1="140" x2="300" y2="150" class="image" />
  </g>
</svg>