<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .heart { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kindness</text>
  <text x="50" y="120" class="subtitle">[ˈkaɪndnəs] n. 仁慈，好意</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kind (种类) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温暖的场景，"种类(kind)"
    <tspan x="50" dy="25">中的善意行为，汇聚成一片仁慈的海洋(kindness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her kindness towards the homeless was truly inspiring.
  </text>
  <text x="50" y="310" class="content">
    她对无家可归者的仁慈行为真是令人鼓舞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 C10 10, 50 10, 50 30 S90 50, 50 70 S10 50, 10 30" class="heart" />
    <!-- Sun rays -->
    <line x1="30" y1="10" x2="30" y2="0" class="image" />
    <line x1="40" y1="10" x2="40" y2="0" class="image" />
    <line x1="20" y1="20" x2="10" y2="10" class="image" />
    <line x1="50" y1="20" x2="60" y2="10" class="image" />
    <line x1="20" y1="40" x2="10" y2="50" class="image" />
    <line x1="50" y1="40" x2="60" y2="50" class="image" />
    <line x1="30" y1="60" x2="30" y2="70" class="image" />
    <line x1="40" y1="60" x2="40" y2="70" class="image" />
  </g>
</svg>