<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">versus</text>
  <text x="50" y="120" class="subtitle">[ˈvɜːrsəs] prep. 对抗，相对</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vers (转) + -us (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个战士在擂台上"转身(vers)"
    <tspan x="50" dy="25">面对面对抗，这就是versus(对抗)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The game is Brazil versus Argentina.
  </text>
  <text x="50" y="310" class="content">
    这场比赛是巴西对阿根廷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ring -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- Fighters -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Facing each other -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <!-- Arrows -->
    <line x1="150" y1="100" x2="170" y2="80" class="image" />
    <line x1="170" y1="80" x2="190" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="80" class="image" />
    <line x1="230" y1="80" x2="210" y2="100" class="image" />
  </g>
</svg>