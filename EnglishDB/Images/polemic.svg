<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polemic</text>
  <text x="50" y="120" class="subtitle">[pəˈlɛmɪk] n. 争论，辩论；adj. 争论的，好辩的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> polem- (战争) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在激烈地"争论(polemic)"，
    <tspan x="50" dy="25">他们的争论就像一场小型的"战争(polem-)"，</tspan>
    <tspan x="50" dy="25">每个人都试图用言语"击败(polem-)"对方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The debate turned into a heated polemic.
  </text>
  <text x="50" y="310" class="content">
    辩论变成了激烈的争论。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people arguing -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="200" y2="120" class="image" />
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
    <line x1="200" y1="120" x2="200" y2="150" class="image" />
    <line x1="50" y1="150" x2="200" y2="150" class="image" />
    <!-- Speech bubbles -->
    <path d="M50,160 Q70,180 100,160" class="image" />
    <path d="M200,160 Q180,180 150,160" class="image" />
  </g>
</svg>