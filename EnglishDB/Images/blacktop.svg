<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .blacktop { fill: #000000; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blacktop</text>
  <text x="50" y="120" class="subtitle">[ˈblæktɑːp] n. 柏油路面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> black (黑色) + top (顶部)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条黑色的柏油路，"黑色的顶部(black-top)"
    <tspan x="50" dy="25">覆盖在地面上，形成了一条平坦的道路。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were playing on the blacktop during recess.
  </text>
  <text x="50" y="310" class="content">
    孩子们在课间休息时在柏油路面上玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blacktop road -->
    <rect x="0" y="0" width="350" height="200" class="blacktop" />
    <!-- Road lines -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" stroke-dasharray="10,10" />
    <line x1="50" y1="150" x2="300" y2="150" class="image" stroke-dasharray="10,10" />
    <!-- Children -->
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <!-- Playground -->
    <rect x="50" y="20" width="250" height="60" class="image" />
  </g>
</svg>