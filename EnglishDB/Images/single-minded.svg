<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">single-minded</text>
  <text x="50" y="120" class="subtitle">[ˈsɪŋɡəlˈmaɪndɪd] adj. 一心一意的，专注的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> single (单一的) + mind (心) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人，他的心中只有<tspan x="50" dy="25">一个目标，就像一颗心被一根线牵引着，</tspan>
    <tspan x="50" dy="25">无论周围多么嘈杂，他都只专注于那一个目标。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was single-minded in her pursuit of the championship.
  </text>
  <text x="50" y="310" class="content">
    她一心一意地追求冠军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart -->
    <path d="M50,50 Q100,20 150,50 Q100,80 50,50" class="image" />
    <!-- Line -->
    <line x1="100" y1="50" x2="100" y2="200" class="image" />
    <!-- Target -->
    <circle cx="100" cy="200" r="20" class="image" />
    <!-- Person -->
    <circle cx="100" cy="250" r="15" class="image" />
    <line x1="100" y1="265" x2="100" y2="300" class="image" />
    <line x1="100" y1="300" x2="80" y2="330" class="image" />
    <line x1="100" y1="300" x2="120" y2="330" class="image" />
    <line x1="100" y1="280" x2="130" y2="270" class="image" />
  </g>
</svg>