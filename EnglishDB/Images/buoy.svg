<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buoy</text>
  <text x="50" y="120" class="subtitle">[bɔɪ] n. 浮标，救生圈；v. 使浮起，支持</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "bouie"，意为"浮标"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的救生圈(buoy)漂浮在海面上，
    <tspan x="50" dy="25">它像一个守护者，时刻准备着拯救落水的人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The buoy marked the location of the underwater reef.
  </text>
  <text x="50" y="310" class="content">
    浮标标记了水下暗礁的位置。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#4CAF50" />
    <!-- Buoy -->
    <circle cx="175" cy="100" r="30" class="image" fill="#FFEB3B" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Waves -->
    <path d="M0 100 Q50 150 100 100 T200 100 T300 100" class="image" stroke-width="5" />
    <path d="M0 120 Q50 170 100 120 T200 120 T300 120" class="image" stroke-width="5" />
  </g>
</svg>