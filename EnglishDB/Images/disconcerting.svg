<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disconcerting</text>
  <text x="50" y="120" class="subtitle">[ˌdɪskənˈsɜrtɪŋ] adj. 令人不安的，令人困惑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + concert (一致) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在音乐会上，突然音乐停止，"不一致(dis-concert)"
    <tspan x="50" dy="25">的气氛让人感到不安(disconcerting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The disconcerting silence made everyone uneasy.
  </text>
  <text x="50" y="310" class="content">
    令人不安的沉默让每个人都感到不安。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Concert stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Music notes -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="75" y1="20" x2="75" y2="60" class="image" />
    <line x1="100" y1="20" x2="125" y2="40" class="image" />
    <line x1="125" y1="40" x2="150" y2="20" class="image" />
    <!-- Silence -->
    <text x="175" y="100" class="content" style="font-size: 48px;">🤫</text>
    <!-- Audience -->
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
  </g>
</svg>