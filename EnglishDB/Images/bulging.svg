<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bulging</text>
  <text x="50" y="120" class="subtitle">[ˈbʌldʒɪŋ] adj. 膨胀的，鼓起的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bulg (膨胀) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装满气球的房间，气球"膨胀(bulg)"得
    <tspan x="50" dy="25">快要爆炸，整个房间都"鼓起(bulging)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bulging suitcase couldn't close properly.
  </text>
  <text x="50" y="310" class="content">
    鼓鼓的行李箱无法正常关闭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Balloons -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="120" cy="100" r="40" class="image" />
    <circle cx="190" cy="100" r="50" class="image" />
    <circle cx="260" cy="100" r="60" class="image" />
    <!-- Bulging effect -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="0" class="image" />
  </g>
</svg>