<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jump</text>
  <text x="50" y="120" class="subtitle">[dʒʌmp] v. 跳跃，跳动；n. 跳跃，跳动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jump (源自中古英语 jumpen，意为跳跃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小兔子在草地上，"突然跳起(jump)"，
    <tspan x="50" dy="25">它的耳朵在空中飘扬，仿佛在享受自由的飞翔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The frog jumped into the pond with a splash.
  </text>
  <text x="50" y="310" class="content">
    青蛙扑通一声跳进了池塘。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Rabbit -->
    <circle cx="100" cy="160" r="20" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="220" class="image" />
    <line x1="100" y1="200" x2="120" y2="220" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
    <!-- Jump arc -->
    <path d="M100 160 Q150 100 200 160" class="image" />
    <!-- Ears -->
    <line x1="80" y1="140" x2="100" y2="160" class="image" />
    <line x1="120" y1="140" x2="100" y2="160" class="image" />
  </g>
</svg>