<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">executive</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzekjətɪv] n. 执行者，经理；adj. 执行的，行政的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + -ecu- (跟随) + -tive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个执行者(executive)，他"跟随(ecu-)"着指令，
    <tspan x="50" dy="25">将计划"执行(ex-)"出来，就像一个经理在办公室里指挥一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The executive made a decision after careful consideration.
  </text>
  <text x="50" y="310" class="content">
    这位执行者在深思熟虑后做出了决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Office desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Executive -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Desk -->
    <rect x="100" y="150" width="200" height="50" class="image" />
    <!-- Computer -->
    <rect x="120" y="160" width="160" height="30" class="image" />
    <!-- Papers -->
    <line x1="130" y1="170" x2="150" y2="170" class="image" />
    <line x1="130" y1="180" x2="150" y2="180" class="image" />
    <line x1="130" y1="190" x2="150" y2="190" class="image" />
  </g>
</svg>