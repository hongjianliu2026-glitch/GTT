<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chromosome</text>
  <text x="50" y="120" class="subtitle">[ˈkroʊməsoʊm] n. 染色体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chromo- (颜色) + some (体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在显微镜下观察，"染色(chromo)"
    <tspan x="50" dy="25">的'体(some)'，这些'体'就是染色体(chromosome)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chromosomes determine the genetic traits of an organism.
  </text>
  <text x="50" y="310" class="content">
    染色体决定了生物体的遗传特征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microscope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="0" y2="250" class="image" />
    <line x1="50" y1="200" x2="100" y2="250" class="image" />
    <!-- Chromosome -->
    <path d="M150,100 C150,50 250,50 250,100 S350,150 350,100" class="image" />
    <path d="M150,120 C150,170 250,170 250,120 S350,70 350,120" class="image" />
  </g>
</svg>