<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">envious</text>
  <text x="50" y="120" class="subtitle">[ˈɛnvɪəs] adj. 嫉妒的，羡慕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + vious (渴望)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到别人拥有他渴望的东西，"使他渴望(en-vious)"
    <tspan x="50" dy="25">到眼睛都变绿了，这就是嫉妒(envious)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was envious of her friend's new car.
  </text>
  <text x="50" y="310" class="content">
    她羡慕她朋友的新车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with green eyes -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="40" cy="45" r="5" class="image" fill="#2ECC71" />
    <circle cx="60" cy="45" r="5" class="image" fill="#2ECC71" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <!-- Car -->
    <rect x="150" y="20" width="150" height="80" class="image" />
    <rect x="160" y="30" width="130" height="60" class="image" fill="#F1C40F" />
    <circle cx="170" cy="110" r="10" class="image" fill="#34495E" />
    <circle cx="230" cy="110" r="10" class="image" fill="#34495E" />
  </g>
</svg>