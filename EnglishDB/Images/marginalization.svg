<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marginalization</text>
  <text x="50" y="120" class="subtitle">[ˌmɑːrdʒɪnəlaɪˈzeɪʃən] n. 边缘化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> margin (边缘) + -al (形容词后缀) + -ize (动词后缀) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆桌，周围坐满了人，但有一个人被挤到了"边缘(margin)"，
    <tspan x="50" dy="25">远离中心，这就是边缘化(marginalization)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The policy aims to reduce the marginalization of minority groups.
  </text>
  <text x="50" y="310" class="content">
    这项政策旨在减少少数群体的边缘化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large table -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- People around the table -->
    <circle cx="120" cy="50" r="15" class="image" />
    <circle cx="280" cy="50" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <!-- Marginalized person -->
    <circle cx="350" cy="100" r="15" class="image" />
    <line x1="350" y1="115" x2="350" y2="150" class="image" />
    <line x1="350" y1="150" x2="330" y2="180" class="image" />
    <line x1="350" y1="150" x2="370" y2="180" class="image" />
    <line x1="350" y1="130" x2="380" y2="120" class="image" />
  </g>
</svg>