<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">juggernaut</text>
  <text x="50" y="120" class="subtitle">[ˈdʒʌɡərnɔːt] n. 不可阻挡的力量，庞然大物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jugger (印度教神像) + naut (船)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆巨大的战车，载着印度教神像，"不可阻挡地前进(juggernaut)"，
    <tspan x="50" dy="25">任何阻挡它的东西都会被碾压。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company became a juggernaut in the tech industry.
  </text>
  <text x="50" y="310" class="content">
    这家公司在科技行业成为了一个不可阻挡的力量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Juggernaut -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chariot -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Wheels -->
    <circle cx="80" cy="180" r="20" class="image" />
    <circle cx="270" cy="180" r="20" class="image" />
    <!-- Deity -->
    <rect x="120" y="40" width="110" height="120" class="image" />
    <!-- Eyes -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- Arms -->
    <line x1="120" y1="60" x2="80" y2="100" class="image" />
    <line x1="230" y1="60" x2="270" y2="100" class="image" />
  </g>
</svg>