<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">taxpayer</text>
  <text x="50" y="120" class="subtitle">[ˈtæksˌpeɪər] n. 纳税人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tax (税) + pay (支付) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通人，手里拿着钱，"支付(pay)"
    <tspan x="50" dy="25">税款(tax)，他就是纳税人(taxpayer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The taxpayer is responsible for filing their tax returns.
  </text>
  <text x="50" y="310" class="content">
    纳税人有责任提交纳税申报表。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Money -->
    <rect x="100" y="90" width="50" height="30" class="image" />
    <line x1="100" y1="90" x2="150" y2="90" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="100" y1="90" x2="100" y2="120" class="image" />
    <line x1="150" y1="90" x2="150" y2="120" class="image" />
    <!-- Tax symbol -->
    <text x="200" y="110" class="image" font-size="30" fill="#2C3E50">$</text>
  </g>
</svg>