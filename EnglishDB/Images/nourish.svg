<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nourish</text>
  <text x="50" y="120" class="subtitle">[ˈnʌrɪʃ] v. 滋养，养育</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nour (滋养) + -ish (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个母亲用温暖的怀抱"滋养(nour)"
    <tspan x="50" dy="25">她的孩子，给予他们生命和力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She nourishes her plants with organic fertilizer.
  </text>
  <text x="50" y="310" class="content">
    她用有机肥料滋养她的植物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother and child -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Mother's head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Mother's body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Mother's left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Mother's right arm -->
    <circle cx="150" cy="100" r="20" class="image" /> <!-- Child's head -->
    <line x1="150" y1="120" x2="150" y2="160" class="image" /> <!-- Child's body -->
    <line x1="150" y1="140" x2="130" y2="130" class="image" /> <!-- Child's left arm -->
    <line x1="150" y1="140" x2="170" y2="130" class="image" /> <!-- Child's right arm -->
    <!-- Heart connection -->
    <path d="M50,180 Q100,220 150,180" class="image" /> <!-- Heart shape -->
    <text x="90" y="200" class="content" fill="#E74C3C">❤</text> <!-- Heart symbol -->
  </g>
</svg>