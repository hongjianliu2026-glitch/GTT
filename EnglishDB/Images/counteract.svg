<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">counteract</text>
  <text x="50" y="120" class="subtitle">[ˌkaʊntərˈækt] v. 抵消，中和</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> counter- (相反) + act (行动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的力量正在推动一个物体，而另一个力量从相反方向"行动(act)"，
    <tspan x="50" dy="25">试图"抵消(counter-act)"这个力量，使物体保持平衡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The drug is designed to counteract the effects of the poison.
  </text>
  <text x="50" y="310" class="content">
    这种药物旨在抵消毒药的效果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Force pushing from the left -->
    <line x1="0" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,80 200,120 250,100" class="image" />
    <text x="10" y="90" class="content" fill="#2980B9">Force</text>

    <!-- Force pushing from the right -->
    <line x1="600" y1="100" x2="400" y2="100" class="image" />
    <polygon points="400,80 400,120 350,100" class="image" />
    <text x="590" y="90" class="content" fill="#2980B9">Counter-Force</text>

    <!-- Object in the middle -->
    <rect x="250" y="70" width="100" height="60" class="image" />
    <text x="290" y="100" class="content" fill="#2980B9">Object</text>
  </g>
</svg>