<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">locality</text>
  <text x="50" y="120" class="subtitle">[loʊˈkæləti] n. 地区，位置</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loc (地方) + -ality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地图上，"地方(loc)"被放大，
    <tspan x="50" dy="25">形成了一个特定的"地区(locality)"，人们在这里聚集。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The locality of the event was near the city center.
  </text>
  <text x="50" y="310" class="content">
    事件发生的地点在市中心附近。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Location marker -->
    <circle cx="175" cy="100" r="15" class="image" fill="#E74C3C" />
    <!-- People -->
    <circle cx="150" cy="80" r="5" class="image" fill="#2980B9" />
    <circle cx="200" cy="120" r="5" class="image" fill="#2980B9" />
    <circle cx="160" cy="130" r="5" class="image" fill="#2980B9" />
    <circle cx="190" cy="90" r="5" class="image" fill="#2980B9" />
  </g>
</svg>