<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">broken</text>
  <text x="50" y="120" class="subtitle">[ˈbroʊkən] adj. 破碎的，损坏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> break (打破) + -en (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个玻璃杯被"打破(break)"，
    <tspan x="50" dy="25">碎片散落一地，这就是"破碎的(broken)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vase fell and broke into pieces.
  </text>
  <text x="50" y="310" class="content">
    花瓶掉下来摔成了碎片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken glass -->
    <line x1="50" y1="20" x2="150" y2="120" class="image" />
    <line x1="50" y1="120" x2="150" y2="20" class="image" />
    <line x1="70" y1="40" x2="170" y2="140" class="image" />
    <line x1="70" y1="140" x2="170" y2="40" class="image" />
    <line x1="90" y1="60" x2="190" y2="160" class="image" />
    <line x1="90" y1="160" x2="190" y2="60" class="image" />
    <line x1="110" y1="80" x2="210" y2="180" class="image" />
    <line x1="110" y1="180" x2="210" y2="80" class="image" />
  </g>
</svg>