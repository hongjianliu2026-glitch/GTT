<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thrift</text>
  <text x="50" y="120" class="subtitle">[θrɪft] n. 节俭，节约</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thrift (繁荣，兴旺)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个节俭的人，"通过节约(thrift)"
    <tspan x="50" dy="25">积累财富，最终实现繁荣(thrift)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She practices thrift by saving money on groceries.
  </text>
  <text x="50" y="310" class="content">
    她通过在杂货上省钱来实践节俭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Piggy bank -->
    <circle cx="100" cy="100" r="50" class="image" />
    <rect x="75" y="100" width="50" height="50" class="image" />
    <!-- Coins -->
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="170" cy="50" r="10" class="image" />
    <circle cx="190" cy="50" r="10" class="image" />
    <!-- Person -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
  </g>
</svg>