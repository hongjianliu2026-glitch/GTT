<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Olympic</text>
  <text x="50" y="120" class="subtitle">[əˈlɪmpɪk] adj. 奥林匹克的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Olym- (奥林匹斯山) + pic (与...相关的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高耸入云的山峰，"奥林匹斯山(Olym-)"
    <tspan x="50" dy="25">上举办着盛大的运动会，这就是奥林匹克(Olympic)的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Olympic Games are held every four years.
  </text>
  <text x="50" y="310" class="content">
    奥运会每四年举办一次。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 175,0 350,200" class="image" />
    <!-- Rings -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="125" cy="130" r="30" class="image" />
    <circle cx="175" cy="130" r="30" class="image" />
  </g>
</svg>