<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">long-lost</text>
  <text x="50" y="120" class="subtitle">[ˌlɔŋˈlɔst] adj. 久已失去的，久已遗忘的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> long (长) + lost (失去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的宝藏地图，"长时间失去(long-lost)"
    <tspan x="50" dy="25">在沙漠中被发现，象征着久已遗忘的记忆或物品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The long-lost manuscript was finally found in the attic.
  </text>
  <text x="50" y="310" class="content">
    那本久已失去的手稿最终在阁楼里被找到了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sand dunes -->
    <line x1="50" y1="20" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="20" class="image" />
    <line x1="150" y1="20" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="20" class="image" />
    <line x1="250" y1="20" x2="300" y2="100" class="image" />
    <!-- Treasure map -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <line x1="120" y1="70" x2="230" y2="70" class="image" />
    <line x1="120" y1="90" x2="230" y2="90" class="image" />
    <line x1="120" y1="110" x2="230" y2="110" class="image" />
    <!-- X marks the spot -->
    <line x1="170" y1="60" x2="170" y2="140" class="image" />
    <line x1="150" y1="100" x2="190" y2="100" class="image" />
  </g>
</svg>