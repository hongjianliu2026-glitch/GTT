<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">willingness</text>
  <text x="50" y="120" class="subtitle">[ˈwɪlɪŋnəs] n. 愿意，乐意</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> will (意愿) + -ing (进行时) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人心中充满"意愿(will)"，
    <tspan x="50" dy="25">脸上洋溢着"乐意(willingness)"的笑容，</tspan>
    <tspan x="50" dy="25">仿佛随时准备帮助他人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her willingness to help made the project a success.
  </text>
  <text x="50" y="310" class="content">
    她愿意帮忙的态度使得项目取得了成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <!-- Smiling face -->
    <circle cx="40" cy="80" r="30" class="image" />
    <circle cx="30" cy="70" r="5" class="image" />
    <circle cx="50" cy="70" r="5" class="image" />
    <path d="M30 90 Q40 100 50 90" class="image" />
  </g>
</svg>