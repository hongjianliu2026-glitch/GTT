<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scattered</text>
  <text x="50" y="120" class="subtitle">[ˈskætərd] adj. 分散的，散乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scat- (分散) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场大风吹过，树叶被"分散(scat-)"得到处都是，
    <tspan x="50" dy="25">整个地面都被散乱的树叶覆盖，这就是scattered的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The papers on his desk were scattered everywhere.
  </text>
  <text x="50" y="310" class="content">
    他桌子上的文件散落得到处都是。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Leaves -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="30" r="10" class="image" />
    <circle cx="150" cy="70" r="10" class="image" />
    <circle cx="200" cy="40" r="10" class="image" />
    <circle cx="250" cy="60" r="10" class="image" />
    <circle cx="300" cy="20" r="10" class="image" />
    <!-- Wind -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
  </g>
</svg>