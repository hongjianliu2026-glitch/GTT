<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wares</text>
  <text x="50" y="120" class="subtitle">[wɛərz] n. 商品，货物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ware (物品) + s (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个市场里，"物品(ware)"
    <tspan x="50" dy="25">摆满了货架，这些物品就是商品(wares)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The market was filled with various wares.
  </text>
  <text x="50" y="310" class="content">
    市场里摆满了各种各样的商品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Shelves -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <rect x="0" y="120" width="350" height="100" class="image" />
    <!-- Items on shelves -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <rect x="160" y="30" width="40" height="40" class="image" />
    <circle cx="220" cy="50" r="20" class="image" />
    <rect x="270" y="30" width="40" height="40" class="image" />
    <circle cx="50" cy="170" r="20" class="image" />
    <rect x="100" y="150" width="40" height="40" class="image" />
    <rect x="160" y="150" width="40" height="40" class="image" />
    <circle cx="220" cy="170" r="20" class="image" />
    <rect x="270" y="150" width="40" height="40" class="image" />
  </g>
</svg>