<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">congressional</text>
  <text x="50" y="120" class="subtitle">[ˌkɒŋɡrɛʃənl] adj. 国会的，议会的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + gress (走) + -ional (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群议员在国会大厅里"共同走动(con-gress)"，
    <tspan x="50" dy="25">讨论国家大事，这就是国会的场景(congressional)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The congressional hearing was televised live.
  </text>
  <text x="50" y="310" class="content">
    国会听证会进行了电视直播。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Congress hall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Seats -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People -->
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="130" cy="50" r="10" class="image" />
    <circle cx="160" cy="50" r="10" class="image" />
    <circle cx="190" cy="50" r="10" class="image" />
    <circle cx="220" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <!-- Podium -->
    <rect x="150" y="100" width="50" height="50" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="125" r="15" class="image" />
    <line x1="175" y1="140" x2="175" y2="170" class="image" />
    <line x1="175" y1="170" x2="160" y2="200" class="image" />
    <line x1="175" y1="170" x2="190" y2="200" class="image" />
    <line x1="175" y1="150" x2="200" y2="140" class="image" />
  </g>
</svg>