<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trimester</text>
  <text x="50" y="120" class="subtitle">[traɪˈmɛstər] n. 三个月，学期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tri- (三) + mes (月) + -ter (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学期被分成三个部分，每个部分都是"三个月(tri-mes-ter)"，
    <tspan x="50" dy="25">就像一个巨大的日历，每个月都被标记出来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The course is divided into three trimesters.
  </text>
  <text x="50" y="310" class="content">
    这门课程被分成了三个学期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Three months -->
    <rect x="50" y="20" width="80" height="160" class="image" />
    <rect x="150" y="20" width="80" height="160" class="image" />
    <rect x="250" y="20" width="80" height="160" class="image" />
    <!-- Month labels -->
    <text x="60" y="50" class="content">1st</text>
    <text x="160" y="50" class="content">2nd</text>
    <text x="260" y="50" class="content">3rd</text>
  </g>
</svg>