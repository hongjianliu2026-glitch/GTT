<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sporting</text>
  <text x="50" y="120" class="subtitle">[ˈspɔːrtɪŋ] adj. 运动的，体育的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sport (运动) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在运动场上，"运动(sport)"
    <tspan x="50" dy="25">的场景，这就是体育的(sporting)画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sporting event attracted thousands of spectators.
  </text>
  <text x="50" y="310" class="content">
    这场体育赛事吸引了成千上万的观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sports field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Football -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Basketball -->
    <circle cx="150" cy="100" r="25" class="image" />
    <!-- Runner -->
    <line x1="250" y1="80" x2="280" y2="120" class="image" />
    <line x1="280" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="280" y2="200" class="image" />
    <!-- Spectators -->
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="120" cy="150" r="10" class="image" />
    <circle cx="140" cy="150" r="10" class="image" />
  </g>
</svg>