<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">destroyed</text>
  <text x="50" y="120" class="subtitle">[dɪˈstrɔɪd] v. 破坏，摧毁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + stroy (建造)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高耸的建筑，突然被"向下(de-)"
    <tspan x="50" dy="25">的力量"摧毁(stroy)"，轰然倒塌，化为废墟。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The earthquake destroyed the entire village.
  </text>
  <text x="50" y="310" class="content">
    地震摧毁了整个村庄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Cracks -->
    <line x1="10" y1="50" x2="90" y2="50" class="image" />
    <line x1="10" y1="100" x2="90" y2="100" class="image" />
    <line x1="10" y1="150" x2="90" y2="150" class="image" />
    <!-- Collapse -->
    <rect x="0" y="200" width="100" height="50" class="image" />
    <!-- Rubble -->
    <rect x="20" y="250" width="20" height="10" class="image" />
    <rect x="50" y="250" width="20" height="10" class="image" />
    <rect x="80" y="250" width="20" height="10" class="image" />
  </g>
</svg>