<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imagination</text>
  <text x="50" y="120" class="subtitle">[ɪˌmædʒɪˈneɪʃən] n. 想象力，想象</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> imag (形象) + in (在...里面) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在脑海中"形象化(imag-in-ation)"
    <tspan x="50" dy="25">出一个奇幻的世界，这个世界只存在于他的想象中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her imagination was sparked by the fairy tales she read.
  </text>
  <text x="50" y="310" class="content">
    她读的童话故事激发了她的想象力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artist's head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Thought bubble -->
    <path d="M 150 50 Q 250 20 350 50 Q 450 80 350 110 Q 250 140 150 110 Z" class="image" />
    <!-- Fantasy world -->
    <circle cx="250" cy="80" r="20" class="image" />
    <rect x="220" y="100" width="60" height="40" class="image" />
    <line x1="250" y1="140" x2="250" y2="180" class="image" />
    <line x1="250" y1="160" x2="220" y2="150" class="image" />
    <line x1="250" y1="160" x2="280" y2="150" class="image" />
  </g>
</svg>