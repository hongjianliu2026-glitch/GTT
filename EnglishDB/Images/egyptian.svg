<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Egyptian</text>
  <text x="50" y="120" class="subtitle">[ɪˈdʒɪpʃən] adj. 埃及的；n. 埃及人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Egypt (埃及) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着法老王冠的埃及人，站在金字塔前，
    <tspan x="50" dy="25">他的形象让人立刻联想到埃及的辉煌历史。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Egyptian pyramids are a marvel of ancient architecture.
  </text>
  <text x="50" y="310" class="content">
    埃及金字塔是古代建筑的奇迹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pyramid -->
    <polygon points="100,0 200,0 150,100" class="image" />
    <!-- Pharaoh's crown -->
    <path d="M50,50 L70,30 L90,50 L70,70 Z" class="image" />
    <!-- Egyptian figure -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="130" y2="250" class="image" />
    <line x1="150" y1="220" x2="170" y2="250" class="image" />
    <line x1="150" y1="190" x2="120" y2="180" class="image" />
    <line x1="150" y1="190" x2="180" y2="180" class="image" />
  </g>
</svg>