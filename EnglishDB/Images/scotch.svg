<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scotch</text>
  <text x="50" y="120" class="subtitle">[skɒtʃ] v. 阻止，固定；n. 苏格兰威士忌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scot (苏格兰) + ch (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苏格兰人用威士忌酒瓶"固定(scotch)"住了一个移动的物体，
    <tspan x="50" dy="25">这个动作就象征着阻止和固定(scotch)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He scotched the rumor by providing evidence.
  </text>
  <text x="50" y="310" class="content">
    他通过提供证据阻止了谣言的传播。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scotch bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="20" class="image" />
    <!-- Moving object -->
    <rect x="150" y="100" width="100" height="50" class="image" />
    <!-- Fixed object -->
    <rect x="150" y="100" width="100" height="50" class="image" />
    <line x1="200" y1="100" x2="50" y2="220" class="image" />
  </g>
</svg>