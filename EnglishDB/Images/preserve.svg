<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preserve</text>
  <text x="50" y="120" class="subtitle">[prɪˈzɜːrv] v. 保存，保护；n. 保护区</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + serv (保持)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的守护者站在"前面(pre-)"，
    <tspan x="50" dy="25">用盾牌"保持(serv)"着珍贵的宝藏，</tspan>
    <tspan x="50" dy="25">这就是"保存(preserve)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We must preserve our environment for future generations.
  </text>
  <text x="50" y="310" class="content">
    我们必须为后代保护我们的环境。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <polygon points="0,0 100,0 150,50 100,100 0,100" class="image" />
    <!-- Treasure chest -->
    <rect x="160" y="20" width="100" height="60" class="image" />
    <line x1="170" y1="30" x2="250" y2="30" class="image" />
    <line x1="170" y1="50" x2="250" y2="50" class="image" />
    <line x1="170" y1="70" x2="250" y2="70" class="image" />
    <!-- Guardian -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="80" x2="30" y2="70" class="image" />
    <line x1="50" y1="80" x2="70" y2="70" class="image" />
  </g>
</svg>