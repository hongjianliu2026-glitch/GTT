<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">science-fiction</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪəns ˈfɪkʃən] n. 科幻小说</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> science (科学) + fiction (虚构)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"科学(science)"
    <tspan x="50" dy="25">与"虚构(fiction)"结合，创造出</tspan>
    <tspan x="50" dy="25">一个充满未来科技的科幻世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves reading science-fiction novels.
  </text>
  <text x="50" y="310" class="content">
    她喜欢读科幻小说。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Lab equipment -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="70" y1="110" x2="130" y2="110" class="image" />
    <line x1="70" y1="140" x2="130" y2="140" class="image" />
    <!-- Space ship -->
    <rect x="200" y="20" width="150" height="100" class="image" />
    <line x1="220" y1="50" x2="330" y2="50" class="image" />
    <line x1="220" y1="80" x2="330" y2="80" class="image" />
    <line x1="220" y1="110" x2="330" y2="110" class="image" />
    <line x1="220" y1="140" x2="330" y2="140" class="image" />
    <circle cx="275" cy="120" r="10" class="image" />
  </g>
</svg>