<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liability</text>
  <text x="50" y="120" class="subtitle">[ˌlaɪəˈbɪləti] n. 责任，债务</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liabil (可能的) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人背着一个巨大的背包，里面装满了"可能的责任(liabil-ity)"，
    <tspan x="50" dy="25">每走一步都感到沉重，这些责任就像债务一样压在肩上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His poor health is a liability for the company.
  </text>
  <text x="50" y="310" class="content">
    他的健康状况对公司来说是个负担。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with backpack -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="150" class="image" /> <!-- Right arm -->
    <rect x="30" y="120" width="40" height="60" class="image" /> <!-- Backpack -->
    <!-- Heavy load -->
    <line x1="30" y1="120" x2="20" y2="110" class="image" />
    <line x1="70" y1="120" x2="80" y2="110" class="image" />
    <line x1="30" y1="180" x2="20" y2="190" class="image" />
    <line x1="70" y1="180" x2="80" y2="190" class="image" />
  </g>
</svg>