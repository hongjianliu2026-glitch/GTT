<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">world-famous</text>
  <text x="50" y="120" class="subtitle">[ˈwɜːrld ˈfeɪməs] adj. 世界闻名的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> world (世界) + famous (著名的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，上面贴满了闪闪发光的星星，
    <tspan x="50" dy="25">每个星星代表一个"世界闻名的(world-famous)"事物或人物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Eiffel Tower is a world-famous landmark.
  </text>
  <text x="50" y="310" class="content">
    埃菲尔铁塔是一个世界闻名的地标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="175" cy="150" r="10" class="image" />
    <circle cx="125" cy="120" r="10" class="image" />
    <circle cx="225" cy="120" r="10" class="image" />
  </g>
</svg>