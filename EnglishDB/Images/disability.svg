<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disability</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈbɪləti] n. 残疾，无能</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + ability (能力)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图"不(dis-)"能"能力(ability)"地
    <tspan x="50" dy="25">行走，结果摔倒了，这就是残疾(disability)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new law aims to improve accessibility for people with disabilities.
  </text>
  <text x="50" y="310" class="content">
    新法律旨在改善残疾人的无障碍环境。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person trying to walk -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Fallen person -->
    <circle cx="150" cy="180" r="20" class="image" />
    <line x1="150" y1="200" x2="150" y2="240" class="image" />
    <line x1="150" y1="240" x2="130" y2="280" class="image" />
    <line x1="150" y1="240" x2="170" y2="280" class="image" />
    <line x1="150" y1="220" x2="180" y2="210" class="image" />
    <!-- Ground -->
    <line x1="0" y1="280" x2="300" y2="280" class="image" />
  </g>
</svg>