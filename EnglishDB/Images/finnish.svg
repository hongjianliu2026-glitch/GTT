<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Finnish</text>
  <text x="50" y="120" class="subtitle">[ˈfɪnɪʃ] adj. 芬兰的；n. 芬兰语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Finn (芬兰人) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个芬兰人(Finn)站在北极光下，
    <tspan x="50" dy="25">周围是冰冷的湖泊和森林，这就是芬兰(Finnish)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks fluent Finnish and Swedish.
  </text>
  <text x="50" y="310" class="content">
    她能流利地说芬兰语和瑞典语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arctic light -->
    <path d="M0 0 L100 100 L200 0 Z" class="image" />
    <!-- Lake -->
    <rect x="50" y="150" width="200" height="50" class="image" />
    <!-- Forest -->
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <!-- Finn -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
  </g>
</svg>