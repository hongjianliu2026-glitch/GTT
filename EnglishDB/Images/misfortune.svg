<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misfortune</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsˈfɔːrtʃən] n. 不幸，灾祸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (坏) + fortune (运气)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走在路上，突然"坏运气(mis-fortune)"降临，
    <tspan x="50" dy="25">他踩到了香蕉皮，摔倒了。这就是不幸(misfortune)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His accident was a real misfortune.
  </text>
  <text x="50" y="310" class="content">
    他的事故真是不幸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Banana peel -->
    <path d="M 100 180 Q 150 160 200 180" class="image" />
    <!-- Fallen person -->
    <circle cx="150" cy="220" r="20" class="image" />
    <line x1="150" y1="240" x2="150" y2="280" class="image" />
    <line x1="150" y1="280" x2="130" y2="320" class="image" />
    <line x1="150" y1="280" x2="170" y2="320" class="image" />
    <line x1="150" y1="260" x2="130" y2="270" class="image" />
    <line x1="150" y1="260" x2="170" y2="270" class="image" />
  </g>
</svg>