<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">booming</text>
  <text x="50" y="120" class="subtitle">[ˈbuːmɪŋ] adj. 繁荣的，迅速发展的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boom (繁荣) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市的天际线，"繁荣(boom)"
    <tspan x="50" dy="25">的声音如同雷鸣，高楼大厦拔地而起，</tspan>
    <tspan x="50" dy="25">象征着经济的迅速发展(booming)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tech industry is booming in Silicon Valley.
  </text>
  <text x="50" y="310" class="content">
    科技行业在硅谷蓬勃发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Buildings -->
    <rect x="50" y="100" width="50" height="100" class="image" />
    <rect x="120" y="50" width="50" height="150" class="image" />
    <rect x="190" y="70" width="50" height="130" class="image" />
    <rect x="260" y="90" width="50" height="110" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="30" rx="40" ry="20" class="image" />
    <ellipse cx="200" cy="20" rx="50" ry="25" class="image" />
  </g>
</svg>