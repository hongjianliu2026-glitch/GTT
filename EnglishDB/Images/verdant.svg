<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .green { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">verdant</text>
  <text x="50" y="120" class="subtitle">[ˈvɜːrdnt] adj. 翠绿的，青翠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ver (绿) + -dant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片"翠绿(ver)"的草地，上面长满了茂盛的植物，
    <tspan x="50" dy="25">整个场景就像是被"翠绿(verdant)"的颜料涂抹过一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hills were covered in verdant foliage.
  </text>
  <text x="50" y="310" class="content">
    山丘上覆盖着翠绿的树叶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Green hills -->
    <path d="M0 100 Q100 50 200 100 T400 100" class="image green" />
    <path d="M0 120 Q100 70 200 120 T400 120" class="image green" />
    <path d="M0 140 Q100 90 200 140 T400 140" class="image green" />
    <!-- Trees -->
    <circle cx="100" cy="80" r="20" class="image green" />
    <circle cx="150" cy="80" r="20" class="image green" />
    <circle cx="200" cy="80" r="20" class="image green" />
    <circle cx="250" cy="80" r="20" class="image green" />
    <circle cx="300" cy="80" r="20" class="image green" />
    <circle cx="350" cy="80" r="20" class="image green" />
  </g>
</svg>