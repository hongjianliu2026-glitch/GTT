<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deliver</text>
  <text x="50" y="120" class="subtitle">[dɪˈlɪvər] v. 递送，交付</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + liv (释放) + -er (动作执行者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个快递员骑着自行车，"向下释放(de-liv)"
    <tspan x="50" dy="25">包裹到你的门口，完成了递送(deliver)的任务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The courier will deliver the package by 5 PM.
  </text>
  <text x="50" y="310" class="content">
    快递员将在下午5点前送达包裹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="100" y1="0" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="80" y2="20" class="image" />
    <line x1="80" y1="20" x2="80" y2="40" class="image" />
    <line x1="80" y1="40" x2="120" y2="40" class="image" />
    <line x1="120" y1="40" x2="120" y2="20" class="image" />
    <line x1="120" y1="20" x2="100" y2="20" class="image" />
    <circle cx="20" cy="20" r="10" class="image" />
    <circle cx="180" cy="20" r="10" class="image" />
    <!-- Courier -->
    <circle cx="140" cy="10" r="15" class="image" />
    <line x1="140" y1="25" x2="140" y2="50" class="image" />
    <line x1="140" y1="50" x2="120" y2="70" class="image" />
    <line x1="140" y1="50" x2="160" y2="70" class="image" />
    <line x1="140" y1="35" x2="170" y2="25" class="image" />
    <!-- Package -->
    <rect x="200" y="10" width="50" height="30" class="image" />
    <line x1="200" y1="10" x2="250" y2="10" class="image" />
    <line x1="200" y1="40" x2="250" y2="40" class="image" />
    <line x1="200" y1="10" x2="200" y2="40" class="image" />
    <line x1="250" y1="10" x2="250" y2="40" class="image" />
  </g>
</svg>