<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blackjack</text>
  <text x="50" y="120" class="subtitle">[ˈblækˌdʒæk] n. 二十一点（一种纸牌游戏）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> black (黑色) + jack (杰克)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个赌场里，一个玩家手握"黑色(black)"的扑克牌，
    <tspan x="50" dy="25">试图赢得"杰克(jack)"的胜利，这就是二十一点(blackjack)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He won a big pot at the blackjack table last night.
  </text>
  <text x="50" y="310" class="content">
    他昨晚在二十一点的赌桌上赢了一大笔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cards -->
    <rect x="50" y="20" width="50" height="70" class="image" />
    <rect x="110" y="20" width="50" height="70" class="image" />
    <rect x="170" y="20" width="50" height="70" class="image" />
    <!-- Dealer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Player -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="350" y2="120" class="image" />
  </g>
</svg>