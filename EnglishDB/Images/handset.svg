<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handset</text>
  <text x="50" y="120" class="subtitle">[ˈhændset] n. 电话听筒，手持设备</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hand (手) + set (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用手("hand")拿着一个设备，这个设备就是"set"在手中的电话听筒(handset)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She picked up the handset and dialed her friend's number.
  </text>
  <text x="50" y="310" class="content">
    她拿起电话听筒，拨打了她朋友的号码。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hand -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="150" x2="140" y2="140" class="image" />

    <!-- Handset -->
    <rect x="120" y="80" width="150" height="80" class="image" />
    <line x1="120" y1="120" x2="270" y2="120" class="image" />
    <line x1="120" y1="160" x2="270" y2="160" class="image" />
  </g>
</svg>