<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marker</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrkər] n. 标记，记号笔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mark (标记) + -er (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的记号笔(marker)，它不仅能标记(mark)
    <tspan x="50" dy="25">纸张，还能标记整个城市，甚至天空！</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a marker to highlight important points in the text.
  </text>
  <text x="50" y="310" class="content">
    她用记号笔在文本中突出显示了重要内容。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant marker -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Marker tip -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Marking lines -->
    <line x1="120" y1="50" x2="350" y2="50" class="image" />
    <line x1="120" y1="80" x2="350" y2="80" class="image" />
    <line x1="120" y1="110" x2="350" y2="110" class="image" />
    <line x1="120" y1="140" x2="350" y2="140" class="image" />
    <!-- City skyline -->
    <rect x="120" y="170" width="30" height="30" class="image" />
    <rect x="160" y="150" width="30" height="50" class="image" />
    <rect x="200" y="160" width="30" height="40" class="image" />
    <rect x="240" y="140" width="30" height="60" class="image" />
    <rect x="280" y="170" width="30" height="30" class="image" />
  </g>
</svg>