<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quagmire</text>
  <text x="50" y="120" class="subtitle">[ˈkwɒɡmaɪər] n. 沼泽，困境</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quag (沼泽) + mire (泥潭)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人深陷"沼泽(quag)"和"泥潭(mire)"中，
    <tspan x="50" dy="25">无法自拔，这就是一个困境(quagmire)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project turned into a quagmire of delays and budget overruns.
  </text>
  <text x="50" y="310" class="content">
    这个项目变成了一个充满延迟和预算超支的困境。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Quagmire -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Swamp -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person stuck -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Mud -->
    <line x1="70" y1="180" x2="280" y2="180" class="image" />
    <line x1="70" y1="190" x2="250" y2="190" class="image" />
    <line x1="70" y1="200" x2="270" y2="200" class="image" />
  </g>
</svg>