<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">apt</text>
  <text x="50" y="120" class="subtitle">[æpt] adj. 恰当的，合适的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> apt (适合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个箭头(arrow)精准地"适合(apt)"
    <tspan x="50" dy="25">射中靶心，这就是"恰当的(apt)"含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His response was apt and to the point.
  </text>
  <text x="50" y="310" class="content">
    他的回答恰到好处，直击要点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Target -->
    <circle cx="150" cy="150" r="100" class="image" />
    <circle cx="150" cy="150" r="70" class="image" />
    <circle cx="150" cy="150" r="40" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="250" x2="140" y2="160" class="image" />
    <polygon points="140,160 130,150 135,155 135,145" class="image" />
  </g>
</svg>