<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wince</text>
  <text x="50" y="120" class="subtitle">[wɪns] v. 畏缩，退缩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> win (弯曲) + ce (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被针扎到，"弯曲(win)"身体并"退缩(ce)"，
    <tspan x="50" dy="25">表现出明显的畏缩(wince)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She winced when the doctor pricked her finger.
  </text>
  <text x="50" y="310" class="content">
    当医生扎她的手指时，她畏缩了一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <!-- Needle -->
    <line x1="150" y1="100" x2="100" y2="150" class="image" />
    <circle cx="150" cy="100" r="5" class="image" />
    <!-- Wince -->
    <line x1="50" y1="130" x2="30" y2="160" class="image" />
    <line x1="50" y1="130" x2="70" y2="160" class="image" />
  </g>
</svg>