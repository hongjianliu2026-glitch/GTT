<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">selectively</text>
  <text x="50" y="120" class="subtitle">[sɪˈlektɪvli] adv. 有选择地，选择性地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> select (选择) + -ive (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个挑剔的美食家，"有选择地(selectively)"
    <tspan x="50" dy="25">品尝每一道菜，只挑选最合口味的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She selectively reads only the most relevant articles.
  </text>
  <text x="50" y="310" class="content">
    她有选择性地只读最相关的文章。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Food items -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <rect x="160" y="30" width="40" height="40" class="image" />
    <circle cx="230" cy="50" r="20" class="image" />
    <!-- Fork selecting one item -->
    <line x1="300" y1="50" x2="250" y2="50" class="image" />
    <line x1="300" y1="50" x2="300" y2="30" class="image" />
    <line x1="300" y1="30" x2="290" y2="10" class="image" />
    <line x1="300" y1="30" x2="310" y2="10" class="image" />
    <!-- Person -->
    <circle cx="350" cy="50" r="15" class="image" />
    <line x1="350" y1="65" x2="350" y2="100" class="image" />
    <line x1="350" y1="100" x2="330" y2="130" class="image" />
    <line x1="350" y1="100" x2="370" y2="130" class="image" />
    <line x1="350" y1="80" x2="380" y2="70" class="image" />
  </g>
</svg>