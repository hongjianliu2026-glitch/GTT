<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ramp</text>
  <text x="50" y="120" class="subtitle">[ræmp] n. 斜坡，坡道；v. 蔓延，增加</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ram (撞击) + p (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在斜坡(ramp)上，"撞击(ram)"着地面，
    <tspan x="50" dy="25">逐渐上升，就像斜坡(ramp)引导车辆向上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The truck drove up the ramp to load the cargo.
  </text>
  <text x="50" y="310" class="content">
    卡车开上斜坡装载货物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ramp -->
    <polygon points="0,200 350,200 300,0" class="image" />
    <!-- Car -->
    <rect x="150" y="180" width="100" height="20" class="image" />
    <rect x="160" y="160" width="80" height="20" class="image" />
    <circle cx="170" cy="200" r="10" class="image" />
    <circle cx="270" cy="200" r="10" class="image" />
  </g>
</svg>