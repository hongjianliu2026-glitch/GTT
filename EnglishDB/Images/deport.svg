<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deport</text>
  <text x="50" y="120" class="subtitle">[dɪˈpɔrt] v. 驱逐出境，放逐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + port (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被驱逐的人，"离开(de-)"
    <tspan x="50" dy="25">并被"携带(port)"到另一个国家，这就是驱逐出境(deport)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government decided to deport the illegal immigrants.
  </text>
  <text x="50" y="310" class="content">
    政府决定驱逐这些非法移民。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plane -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="0" x2="50" y2="20" class="image" />
    <line x1="350" y1="0" x2="300" y2="20" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <!-- Person -->
    <circle cx="175" cy="30" r="15" class="image" />
    <line x1="175" y1="45" x2="175" y2="70" class="image" />
    <line x1="175" y1="70" x2="155" y2="100" class="image" />
    <line x1="175" y1="70" x2="195" y2="100" class="image" />
    <line x1="175" y1="55" x2="205" y2="45" class="image" />
  </g>
</svg>