<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acumen</text>
  <text x="50" y="120" class="subtitle">[əˈkjuːmən] n. 敏锐，聪明</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> acu- (尖锐) + -men (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个智者，他的思维像一把"尖锐的刀(acu-)"，
    <tspan x="50" dy="25">能够迅速解决问题，这就是他的"敏锐(acumen)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her business acumen helped her company grow rapidly.
  </text>
  <text x="50" y="310" class="content">
    她的商业敏锐帮助她的公司迅速成长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sharp mind -->
    <polygon points="0,0 100,0 50,100" class="image" />
    <text x="55" y="60" class="content" fill="#E74C3C">尖锐</text>
    <!-- Brain -->
    <circle cx="200" cy="50" r="40" class="image" />
    <text x="180" y="110" class="content" fill="#2980B9">思维</text>
    <!-- Lightbulb -->
    <circle cx="300" cy="50" r="30" class="image" />
    <line x1="300" y1="80" x2="300" y2="120" class="image" />
    <line x1="300" y1="120" x2="280" y2="150" class="image" />
    <line x1="300" y1="120" x2="320" y2="150" class="image" />
    <text x="280" y="170" class="content" fill="#F39C12">灵感</text>
  </g>
</svg>