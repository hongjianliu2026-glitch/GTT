<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wonderful</text>
  <text x="50" y="120" class="subtitle">[ˈwʌndərfl] adj. 极好的，精彩的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wonder (奇迹) + -ful (充满...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满奇迹(wonder)的世界，
    <tspan x="50" dy="25">每一个角落都充满了令人惊叹的事物，</tspan>
    <tspan x="50" dy="25">这就是"wonderful"的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concert was wonderful, everyone enjoyed it.
  </text>
  <text x="50" y="310" class="content">
    音乐会非常精彩，每个人都喜欢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <polygon points="50,5 65,40 100,45 75,70 80,105 50,90 20,105 25,70 0,45 35,40" class="image" />
    <!-- Rainbow -->
    <path d="M10,150 A50,50 0 0,1 110,150" stroke="#FF4500" stroke-width="10" fill="none" />
    <path d="M10,160 A40,40 0 0,1 100,160" stroke="#FFD700" stroke-width="10" fill="none" />
    <path d="M10,170 A30,30 0 0,1 90,170" stroke="#32CD32" stroke-width="10" fill="none" />
    <path d="M10,180 A20,20 0 0,1 80,180" stroke="#1E90FF" stroke-width="10" fill="none" />
    <path d="M10,190 A10,10 0 0,1 70,190" stroke="#8A2BE2" stroke-width="10" fill="none" />
    <!-- Sun -->
    <circle cx="150" cy="100" r="30" stroke="#FFD700" stroke-width="2" fill="#FFD700" />
    <line x1="150" y1="70" x2="150" y2="40" stroke="#FFD700" stroke-width="2" />
    <line x1="150" y1="130" x2="150" y2="160" stroke="#FFD700" stroke-width="2" />
    <line x1="120" y1="100" x2="90" y2="100" stroke="#FFD700" stroke-width="2" />
    <line x1="180" y1="100" x2="210" y2="100" stroke="#FFD700" stroke-width="2" />
    <line x1="135" y1="75" x2="110" y2="50" stroke="#FFD700" stroke-width="2" />
    <line x1="165" y1="75" x2="190" y2="50" stroke="#FFD700" stroke-width="2" />
    <line x1="135" y1="125" x2="110" y2="150" stroke="#FFD700" stroke-width="2" />
    <line x1="165" y1="125" x2="190" y2="150" stroke="#FFD700" stroke-width="2" />
  </g>
</svg>