<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">macaroni</text>
  <text x="50" y="120" class="subtitle">[ˌmækəˈroʊni] n. 通心粉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> macaroni 源自意大利语 maccheroni，意为“通心粉”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的通心粉盘子，里面装满了各种形状的通心粉，
    <tspan x="50" dy="25">它们像小蛇一样蜿蜒盘旋，等待着被吃掉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat macaroni with cheese.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃芝士通心粉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Macaroni -->
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="350" y2="50" class="image" />
    <!-- Cheese -->
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="200" cy="150" r="20" class="image" />
    <circle cx="300" cy="150" r="20" class="image" />
  </g>
</svg>