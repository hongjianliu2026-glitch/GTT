<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">umm</text>
  <text x="50" y="120" class="subtitle">[ʌm] int. 嗯，呃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，拟声词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考时，发出"嗯(umm)"的声音，
    <tspan x="50" dy="25">表示犹豫或思考的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Umm, let me think about it for a moment.
  </text>
  <text x="50" y="310" class="content">
    嗯，让我想一想。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thought bubble -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Person -->
    <circle cx="175" cy="200" r="30" class="image" />
    <line x1="175" y1="230" x2="175" y2="280" class="image" />
    <line x1="175" y1="250" x2="145" y2="230" class="image" />
    <line x1="175" y1="250" x2="205" y2="230" class="image" />
    <line x1="175" y1="280" x2="145" y2="310" class="image" />
    <line x1="175" y1="280" x2="205" y2="310" class="image" />
    <!-- Speech bubble -->
    <path d="M175,100 Q250,50 325,100 Q250,150 175,100" class="image" />
    <text x="200" y="100" class="content" text-anchor="middle">umm</text>
  </g>
</svg>