<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">payer</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪər] n. 付款人，支付者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pay (支付) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"支付者(payer)"站在柜台前，手里拿着钱，准备付款。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The payer handed over the cash to the cashier.
  </text>
  <text x="50" y="310" class="content">
    付款人把现金交给了收银员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Counter -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Payer -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Money -->
    <rect x="100" y="30" width="50" height="40" class="image" />
    <rect x="160" y="30" width="50" height="40" class="image" />
    <rect x="220" y="30" width="50" height="40" class="image" />
  </g>
</svg>