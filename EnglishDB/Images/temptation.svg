<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">temptation</text>
  <text x="50" y="120" class="subtitle">[ˌtempˈteɪʃən] n. 诱惑，引诱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> temp- (尝试) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个诱人的蛋糕放在你面前，"尝试(temp-)"
    <tspan x="50" dy="25">一下的冲动让你无法抗拒，这就是诱惑(temptation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The temptation of the chocolate cake was too strong to resist.
  </text>
  <text x="50" y="310" class="content">
    巧克力蛋糕的诱惑太强了，无法抗拒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <circle cx="100" cy="100" r="50" class="image" />
    <rect x="50" y="150" width="100" height="20" class="image" />
    <!-- Fork -->
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <!-- Hand -->
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="250" y1="170" x2="250" y2="220" class="image" />
    <line x1="250" y1="220" x2="230" y2="250" class="image" />
    <line x1="250" y1="220" x2="270" y2="250" class="image" />
  </g>
</svg>