<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">salad</text>
  <text x="50" y="120" class="subtitle">[ˈsæləd] n. 沙拉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sal (盐) + -ad (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象古代罗马人用盐(sal)腌制蔬菜，
    <tspan x="50" dy="25">这些腌制后的蔬菜就成了最早的沙拉(salad)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prepared a delicious mixed salad for dinner.
  </text>
  <text x="50" y="310" class="content">
    她为晚餐准备了一份美味的混合沙拉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Vegetables -->
    <circle cx="100" cy="50" r="20" class="image" /> <!-- Tomato -->
    <rect x="200" y="30" width="30" height="40" class="image" /> <!-- Cucumber -->
    <line x1="150" y1="80" x2="150" y2="120" class="image" /> <!-- Lettuce -->
    <line x1="140" y1="90" x2="160" y2="90" class="image" />
    <line x1="145" y1="100" x2="155" y2="100" class="image" />
    <line x1="140" y1="110" x2="160" y2="110" class="image" />
    <line x1="145" y1="120" x2="155" y2="120" class="image" />
    <!-- Salt -->
    <line x1="50" y1="150" x2="200" y2="150" class="image" />
    <line x1="50" y1="160" x2="200" y2="160" class="image" />
    <line x1="50" y1="170" x2="200" y2="170" class="image" />
  </g>
</svg>