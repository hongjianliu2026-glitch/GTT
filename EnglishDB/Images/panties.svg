<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">panties</text>
  <text x="50" y="120" class="subtitle">[ˈpæntiz] n. 女式内裤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> panti- (小) + -es (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小女孩在衣柜前，"挑选(panti-)"
    <tspan x="50" dy="25">她的小内裤(panties)，每一条都可爱又舒适。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She folded her panties neatly before putting them away.
  </text>
  <text x="50" y="310" class="content">
    她把内裤整齐地叠好，然后收起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Panties -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <rect x="110" y="0" width="100" height="50" class="image" />
    <rect x="220" y="0" width="100" height="50" class="image" />
    <!-- Girl -->
    <circle cx="160" cy="100" r="20" class="image" />
    <line x1="160" y1="120" x2="160" y2="160" class="image" />
    <line x1="160" y1="160" x2="140" y2="200" class="image" />
    <line x1="160" y1="160" x2="180" y2="200" class="image" />
    <line x1="160" y1="140" x2="120" y2="130" class="image" />
    <line x1="160" y1="140" x2="200" y2="130" class="image" />
  </g>
</svg>