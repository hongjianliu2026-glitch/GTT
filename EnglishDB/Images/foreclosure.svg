<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foreclosure</text>
  <text x="50" y="120" class="subtitle">[ˌfɔːrkloʊʒər] n. 止赎，丧失抵押品赎回权</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (在前面) + closure (关闭)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭被"提前关闭(fore-closure)"了他们的家，
    <tspan x="50" dy="25">因为他们无法偿还抵押贷款，房子被银行收回。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bank initiated foreclosure proceedings on the property.
  </text>
  <text x="50" y="310" class="content">
    银行对房产启动了止赎程序。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <polygon points="0,150 100,250 200,150" class="image" />
    <!-- Door -->
    <rect x="80" y="100" width="40" height="50" class="image" />
    <!-- Lock -->
    <circle cx="100" cy="125" r="5" class="image" />
    <!-- Bank -->
    <rect x="250" y="50" width="150" height="100" class="image" />
    <text x="270" y="100" class="content">Bank</text>
    <!-- Arrow -->
    <line x1="200" y1="125" x2="250" y2="100" class="image" />
    <polygon points="240,90 250,100 240,110" class="image" />
  </g>
</svg>