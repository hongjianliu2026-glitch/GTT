<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">content</text>
  <text x="50" y="120" class="subtitle">[ˈkɒntent] n. 内容，目录；adj. 满足的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tent (保持)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装满书籍的房间，"所有东西(con-tent)"
    <tspan x="50" dy="25">都保持在一起，构成了丰富的内容(content)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The content of the book is very informative.
  </text>
  <text x="50" y="310" class="content">
    这本书的内容非常有信息量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bookshelf -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Books -->
    <rect x="60" y="30" width="40" height="140" class="image" />
    <rect x="110" y="30" width="40" height="140" class="image" />
    <rect x="160" y="30" width="40" height="140" class="image" />
    <rect x="210" y="30" width="40" height="140" class="image" />
    <rect x="260" y="30" width="40" height="140" class="image" />
    <!-- Content -->
    <text x="150" y="190" class="content" text-anchor="middle">Content</text>
  </g>
</svg>