<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">violin</text>
  <text x="50" y="120" class="subtitle">[ˌvaɪəˈlɪn] n. 小提琴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> viol (拉丁语，意为“弓”) + -in (表示小型的后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小提琴手用弓(viol)在拉奏一把小型的(in)乐器，
    <tspan x="50" dy="25">这就是小提琴(violin)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She plays the violin beautifully.
  </text>
  <text x="50" y="310" class="content">
    她小提琴拉得很好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Violin body -->
    <rect x="50" y="20" width="200" height="100" class="image" />
    <!-- Violin neck -->
    <rect x="250" y="40" width="50" height="60" class="image" />
    <!-- Violin strings -->
    <line x1="70" y1="50" x2="240" y2="50" class="image" />
    <line x1="70" y1="70" x2="240" y2="70" class="image" />
    <line x1="70" y1="90" x2="240" y2="90" class="image" />
    <line x1="70" y1="110" x2="240" y2="110" class="image" />
    <!-- Bow -->
    <line x1="270" y1="60" x2="320" y2="60" class="image" />
    <line x1="270" y1="60" x2="270" y2="80" class="image" />
    <line x1="320" y1="60" x2="320" y2="80" class="image" />
    <!-- Violinist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>