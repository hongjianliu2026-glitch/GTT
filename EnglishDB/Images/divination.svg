<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">divination</text>
  <text x="50" y="120" class="subtitle">[ˌdɪvɪˈneɪʃn] n. 占卜，预测</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> divin (神) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的占卜师，手持水晶球，"神(divin)"
    <tspan x="50" dy="25">秘地预测未来，这就是占卜(divination)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She practices divination using tarot cards.
  </text>
  <text x="50" y="310" class="content">
    她用塔罗牌进行占卜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crystal ball -->
    <circle cx="100" cy="100" r="50" class="image" fill="#D4E6F1" />
    <!-- Diviner -->
    <circle cx="100" cy="100" r="15" class="image" fill="#2C3E50" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Stars -->
    <circle cx="70" cy="70" r="5" class="image" fill="#F1C40F" />
    <circle cx="130" cy="70" r="5" class="image" fill="#F1C40F" />
    <circle cx="100" cy="130" r="5" class="image" fill="#F1C40F" />
  </g>
</svg>