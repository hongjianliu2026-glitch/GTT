<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">single-family</text>
  <text x="50" y="120" class="subtitle">[ˈsɪŋɡl ˈfæməli] adj. 单户家庭的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> single (单一的) + family (家庭)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房子里只有一户家庭，"单一的家庭(single-family)"
    <tspan x="50" dy="25">住在这个房子里，没有其他家庭共享。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They bought a single-family home in the suburbs.
  </text>
  <text x="50" y="310" class="content">
    他们在郊区买了一栋单户住宅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,100 200,0 350,100" class="image" />
    <rect x="100" y="100" width="150" height="100" class="image" />
    <!-- Family -->
    <circle cx="120" cy="150" r="15" class="image" />
    <circle cx="160" cy="150" r="15" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <!-- Single family -->
    <text x="100" y="250" class="content" fill="#2980B9">Single Family</text>
  </g>
</svg>