<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrought</text>
  <text x="50" y="120" class="subtitle">[rɔːt] adj. 锻造的，精炼的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wrot (write的过去式) + -ght (表示完成)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个铁匠在锻造一把剑，"写下(wrot)"
    <tspan x="50" dy="25">并完成(ght)了它的形状，这把剑就是精炼的(wrought)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wrought iron gate was beautifully crafted.
  </text>
  <text x="50" y="310" class="content">
    锻铁大门制作精美。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Anvil -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hammer -->
    <line x1="50" y1="20" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="120" y2="80" class="image" />
    <!-- Sword -->
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="200" y1="20" x2="180" y2="40" class="image" />
    <line x1="200" y1="20" x2="220" y2="40" class="image" />
    <!-- Blacksmith -->
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
  </g>
</svg>