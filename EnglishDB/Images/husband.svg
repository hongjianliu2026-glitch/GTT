<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">husband</text>
  <text x="50" y="120" class="subtitle">[ˈhʌzbənd] n. 丈夫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hus (房子) + band (捆绑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个丈夫(husband)，他像"房子(hus)"一样
    <tspan x="50" dy="25">稳固地"捆绑(band)"着家庭，保护着家人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her husband is very supportive.
  </text>
  <text x="50" y="310" class="content">
    她的丈夫非常支持她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <polygon points="0,0 200,0 180,20 20,20" class="image" />
    <rect x="80" y="50" width="40" height="100" class="image" />
    <!-- Man -->
    <circle cx="100" cy="180" r="20" class="image" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="280" class="image" />
    <line x1="100" y1="250" x2="120" y2="280" class="image" />
    <line x1="100" y1="220" x2="140" y2="210" class="image" />
  </g>
</svg>