<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">informally</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfɔːrməli] adv. 非正式地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + formal (正式的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着拖鞋和短裤，"不正式地(informally)"
    <tspan x="50" dy="25">走进办公室，与同事轻松交谈。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They discussed the project informally over lunch.
  </text>
  <text x="50" y="310" class="content">
    他们在午餐时非正式地讨论了项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="80" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="80" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Casual clothes -->
    <rect x="20" y="120" width="60" height="40" class="image" /> <!-- Shorts -->
    <rect x="40" y="160" width="20" height="10" class="image" /> <!-- Slippers -->
    <!-- Office -->
    <rect x="100" y="0" width="200" height="200" class="image" /> <!-- Office desk -->
    <line x1="120" y1="20" x2="280" y2="20" class="image" /> <!-- Desk top -->
    <line x1="120" y1="40" x2="280" y2="40" class="image" /> <!-- Desk top -->
    <line x1="120" y1="60" x2="280" y2="60" class="image" /> <!-- Desk top -->
    <line x1="120" y1="80" x2="280" y2="80" class="image" /> <!-- Desk top -->
    <line x1="120" y1="100" x2="280" y2="100" class="image" /> <!-- Desk top -->
    <line x1="120" y1="120" x2="280" y2="120" class="image" /> <!-- Desk top -->
    <line x1="120" y1="140" x2="280" y2="140" class="image" /> <!-- Desk top -->
    <line x1="120" y1="160" x2="280" y2="160" class="image" /> <!-- Desk top -->
    <line x1="120" y1="180" x2="280" y2="180" class="image" /> <!-- Desk top -->
    <line x1="120" y1="200" x2="280" y2="200" class="image" /> <!-- Desk top -->
  </g>
</svg>