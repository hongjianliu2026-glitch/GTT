<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sixth-grade</text>
  <text x="50" y="120" class="subtitle">[ˈsɪksθ ɡreɪd] n. 六年级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sixth (第六) + grade (年级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个六年级的教室，学生们正在认真学习，
    <tspan x="50" dy="25">老师站在讲台上，"第六(sixth)个年级(grade)"的学生们</tspan>
    <tspan x="50" dy="25">正在为即将到来的考试做准备。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is in the sixth-grade this year.
  </text>
  <text x="50" y="310" class="content">
    她今年上六年级。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Teacher -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Students -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
    <!-- Desk -->
    <rect x="80" y="120" width="200" height="50" class="image" />
    <!-- Books -->
    <rect x="90" y="130" width="30" height="30" class="image" />
    <rect x="130" y="130" width="30" height="30" class="image" />
    <rect x="170" y="130" width="30" height="30" class="image" />
    <rect x="210" y="130" width="30" height="30" class="image" />
    <rect x="250" y="130" width="30" height="30" class="image" />
  </g>
</svg>