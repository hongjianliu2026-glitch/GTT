<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">backer</text>
  <text x="50" y="120" class="subtitle">[ˈbækər] n. 支持者，赞助者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> back (后面) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在比赛中，"后面(back)"
    <tspan x="50" dy="25">有一个支持者(backer)在为他加油打气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project received funding from several backers.
  </text>
  <text x="50" y="310" class="content">
    这个项目得到了几位赞助者的资金支持。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Runner -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="30" y2="50" class="image" />
    <line x1="50" y1="20" x2="70" y2="50" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />

    <!-- Backer -->
    <rect x="120" y="50" width="100" height="100" class="image" />
    <line x1="170" y1="70" x2="170" y2="150" class="image" />
    <line x1="170" y1="70" x2="150" y2="100" class="image" />
    <line x1="170" y1="70" x2="190" y2="100" class="image" />
    <line x1="170" y1="150" x2="150" y2="180" class="image" />
    <line x1="170" y1="150" x2="190" y2="180" class="image" />

    <!-- Cheer -->
    <text x="150" y="40" class="content" text-anchor="middle">加油!</text>
  </g>
</svg>