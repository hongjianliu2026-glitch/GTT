<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sandpaper</text>
  <text x="50" y="120" class="subtitle">[ˈsændˌpeɪpər] n. 砂纸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sand (沙子) + paper (纸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张纸(paper)上撒满了沙子(sand)，
    <tspan x="50" dy="25">这些沙子就像无数的小颗粒，用来打磨表面，这就是砂纸(sandpaper)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used sandpaper to smooth the wooden surface.
  </text>
  <text x="50" y="310" class="content">
    他用砂纸来打磨木质表面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sandpaper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Paper -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Sand particles -->
    <circle cx="100" cy="60" r="5" class="image" />
    <circle cx="150" cy="80" r="5" class="image" />
    <circle cx="200" cy="100" r="5" class="image" />
    <circle cx="250" cy="120" r="5" class="image" />
    <circle cx="300" cy="140" r="5" class="image" />
    <circle cx="120" cy="100" r="5" class="image" />
    <circle cx="180" cy="120" r="5" class="image" />
    <circle cx="220" cy="140" r="5" class="image" />
    <circle cx="280" cy="160" r="5" class="image" />
  </g>
</svg>