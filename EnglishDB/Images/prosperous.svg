<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prosperous</text>
  <text x="50" y="120" class="subtitle">[ˈprɒspərəs] adj. 繁荣的，兴旺的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + sper (希望)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满希望(sper)的未来，"向前(pro-)"
    <tspan x="50" dy="25">发展，生活变得繁荣(prosperous)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city has become prosperous since the new industry arrived.
  </text>
  <text x="50" y="310" class="content">
    自从新产业到来后，这座城市变得繁荣起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F39C12" />
    <!-- Road -->
    <rect x="0" y="150" width="350" height="50" fill="#7F8C8D" />
    <!-- Houses -->
    <rect x="50" y="100" width="50" height="50" fill="#2ECC71" />
    <rect x="150" y="100" width="50" height="50" fill="#2ECC71" />
    <rect x="250" y="100" width="50" height="50" fill="#2ECC71" />
    <!-- Trees -->
    <rect x="30" y="50" width="20" height="50" fill="#27AE60" />
    <rect x="130" y="50" width="20" height="50" fill="#27AE60" />
    <rect x="230" y="50" width="20" height="50" fill="#27AE60" />
  </g>
</svg>