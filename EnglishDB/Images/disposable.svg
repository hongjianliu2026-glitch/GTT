<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disposable</text>
  <text x="50" y="120" class="subtitle">[dɪˈspoʊzəbl] adj. 一次性的，用完即可丢弃的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + pos (放置) + -able (可...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个一次性杯子，用完后就被"分开放置(dis-pos-able)"
    <tspan x="50" dy="25">在垃圾桶里，这就是disposable的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They use disposable plates for the picnic.
  </text>
  <text x="50" y="310" class="content">
    他们野餐时使用了一次性盘子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Disposable cup -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <line x1="20" y1="20" x2="80" y2="20" class="image" />
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <line x1="20" y1="80" x2="80" y2="80" class="image" />
    <line x1="20" y1="110" x2="80" y2="110" class="image" />
    <line x1="20" y1="140" x2="80" y2="140" class="image" />
    <!-- Trash can -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <line x1="170" y1="70" x2="230" y2="70" class="image" />
    <line x1="170" y1="90" x2="230" y2="90" class="image" />
    <line x1="170" y1="110" x2="230" y2="110" class="image" />
    <line x1="170" y1="130" x2="230" y2="130" class="image" />
  </g>
</svg>