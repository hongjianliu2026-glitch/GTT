<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aboriginal</text>
  <text x="50" y="120" class="subtitle">[ˌæbəˈrɪdʒənl] adj. 土著的，原始的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (从) + origo (开始) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始部落的人，"从开始(ab-origo)"
    <tspan x="50" dy="25">就生活在这片土地上，他们就是土著(aboriginal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The aboriginal people have lived in this region for thousands of years.
  </text>
  <text x="50" y="310" class="content">
    土著人民在这个地区已经生活了几千年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tribal hut -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 125,50" class="image" />
    <line x1="50" y1="180" x2="200" y2="180" class="image" />
    <line x1="125" y1="50" x2="125" y2="180" class="image" />
    <!-- Tribal person -->
    <circle cx="125" cy="150" r="15" class="image" />
    <line x1="125" y1="165" x2="125" y2="200" class="image" />
    <line x1="125" y1="200" x2="110" y2="230" class="image" />
    <line x1="125" y1="200" x2="140" y2="230" class="image" />
    <line x1="125" y1="180" x2="100" y2="170" class="image" />
    <line x1="125" y1="180" x2="150" y2="170" class="image" />
  </g>
</svg>