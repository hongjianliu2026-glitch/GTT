<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rigging</text>
  <text x="50" y="120" class="subtitle">[ˈrɪɡɪŋ] n. 索具，装备</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rig (拉紧) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘巨大的帆船，船上的"拉紧(rig)"的绳索和设备构成了它的索具(rigging)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sailors checked the rigging before setting sail.
  </text>
  <text x="50" y="310" class="content">
    水手们在起航前检查了索具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sailboat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mast -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <!-- Sails -->
    <polygon points="175,20 100,100 175,100" class="image" />
    <polygon points="175,20 250,100 175,100" class="image" />
    <!-- Rigging lines -->
    <line x1="175" y1="20" x2="100" y2="100" class="image" />
    <line x1="175" y1="20" x2="250" y2="100" class="image" />
    <line x1="175" y1="100" x2="100" y2="180" class="image" />
    <line x1="175" y1="100" x2="250" y2="180" class="image" />
  </g>
</svg>