<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .foam { fill: #F4D03F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frothy</text>
  <text x="50" y="120" class="subtitle">[ˈfrɒθi] adj. 起泡的，泡沫的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> froth (泡沫) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯咖啡，上面覆盖着厚厚的"泡沫(froth)"，
    <tspan x="50" dy="25">这些泡沫就像是一层"起泡的(frothy)"保护层，</tspan>
    <tspan x="50" dy="25">让人忍不住想用勺子轻轻搅拌。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cappuccino had a frothy top.
  </text>
  <text x="50" y="310" class="content">
    卡布奇诺的顶部有一层起泡的泡沫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee cup -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Foam -->
    <circle cx="120" cy="60" r="20" class="foam" />
    <circle cx="160" cy="70" r="25" class="foam" />
    <circle cx="200" cy="80" r="30" class="foam" />
    <circle cx="240" cy="90" r="25" class="foam" />
    <circle cx="280" cy="100" r="20" class="foam" />
    <!-- Coffee -->
    <rect x="50" y="100" width="250" height="80" class="image" />
  </g>
</svg>