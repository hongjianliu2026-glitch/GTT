<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">net</text>
  <text x="50" y="120" class="subtitle">[net] n. 网，净利；v. 净赚，用网捕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> net (网)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个渔夫在海边，用一张巨大的"网(net)"
    <tspan x="50" dy="25">捕捞鱼群，这些鱼就是他的净利(net profit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fisherman caught a large net of fish.
  </text>
  <text x="50" y="310" class="content">
    渔夫捕到了一大网鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Net -->
    <path d="M50,100 C50,50 300,50 300,100" class="image" />
    <path d="M50,100 C50,150 300,150 300,100" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- Fish -->
    <circle cx="100" cy="100" r="15" class="image" fill="#F39C12" />
    <circle cx="150" cy="100" r="15" class="image" fill="#F39C12" />
    <circle cx="200" cy="100" r="15" class="image" fill="#F39C12" />
    <circle cx="250" cy="100" r="15" class="image" fill="#F39C12" />
    <!-- Fisherman -->
    <circle cx="20" cy="150" r="15" class="image" fill="#2ECC71" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
  </g>
</svg>