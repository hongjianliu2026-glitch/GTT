<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reminisce</text>
  <text x="50" y="120" class="subtitle">[ˌrɛmɪˈnɪs] v. 回忆，缅怀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + min (回忆) + -isce (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在摇椅上，"再次回忆(re-min-isce)"
    <tspan x="50" dy="25">过去的时光，脸上露出温暖的笑容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They often reminisce about their childhood days.
  </text>
  <text x="50" y="310" class="content">
    他们经常回忆起童年的时光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old person in a rocking chair -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Rocking chair -->
    <rect x="30" y="160" width="40" height="20" class="image" />
    <line x1="30" y1="160" x2="10" y2="180" class="image" />
    <line x1="70" y1="160" x2="90" y2="180" class="image" />
    <!-- Thought bubble -->
    <ellipse cx="150" cy="80" rx="60" ry="40" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="190" y2="130" class="image" />
  </g>
</svg>