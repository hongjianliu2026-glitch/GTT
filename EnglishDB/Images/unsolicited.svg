<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unsolicited</text>
  <text x="50" y="120" class="subtitle">[ˌʌnsəˈlɪsɪtɪd] adj. 未经请求的，主动提供的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + solicit (请求) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个陌生人突然"不请自来(un-solicited)"，
    <tspan x="50" dy="25">手里拿着一束花，强行送给你，这种行为就是未经请求的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received an unsolicited gift from a stranger.
  </text>
  <text x="50" y="310" class="content">
    她收到了一个陌生人主动送的礼物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stranger -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Flower -->
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <line x1="130" y1="110" x2="130" y2="140" class="image" />
    <!-- Arrow -->
    <line x1="130" y1="140" x2="50" y2="140" class="image" />
    <polygon points="130,140 120,130 120,150" class="image" />
  </g>
</svg>