<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">works</text>
  <text x="50" y="120" class="subtitle">[wɜːrks] n. 工厂，作品；v. 工作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> work (工作) + s (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工厂，里面有无数的工人在"工作(work)"，
    <tspan x="50" dy="25">这些工人的努力就构成了工厂(works)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The steel works is located near the river.
  </text>
  <text x="50" y="310" class="content">
    钢铁厂位于河边。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimneys -->
    <line x1="50" y1="20" x2="50" y2="60" class="image" />
    <line x1="100" y1="20" x2="100" y2="60" class="image" />
    <line x1="150" y1="20" x2="150" y2="60" class="image" />
    <!-- Workers -->
    <circle cx="70" cy="100" r="15" class="image" />
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="170" cy="100" r="15" class="image" />
    <!-- Work tools -->
    <line x1="70" y1="120" x2="70" y2="140" class="image" />
    <line x1="120" y1="120" x2="120" y2="140" class="image" />
    <line x1="170" y1="120" x2="170" y2="140" class="image" />
  </g>
</svg>