<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pushy</text>
  <text x="50" y="120" class="subtitle">[ˈpʊʃi] adj. 固执己见的，爱出风头的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> push (推) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人不停地"推(push)"别人，
    <tspan x="50" dy="25">坚持自己的意见，这种行为让人感到"固执己见(pushy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is very pushy and always wants to be the center of attention.
  </text>
  <text x="50" y="310" class="content">
    她非常固执己见，总是想成为焦点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person pushing -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Arrow indicating push -->
    <line x1="100" y1="140" x2="150" y2="140" class="image" />
    <polygon points="150,140 140,135 140,145" class="image" />
  </g>
</svg>