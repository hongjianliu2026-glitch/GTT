<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">newness</text>
  <text x="50" y="120" class="subtitle">[ˈnjuːnəs] n. 新奇，新鲜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> new (新的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个闪闪发光的"新(new)"玩具，
    <tspan x="50" dy="25">它的新奇(newness)让人眼前一亮，充满了好奇和兴奋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The newness of the technology amazed everyone.
  </text>
  <text x="50" y="310" class="content">
    这项新技术的新奇之处让每个人都感到惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Shiny new toy -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <circle cx="100" cy="100" r="45" class="image" />
    <circle cx="100" cy="100" r="40" class="image" />
    <circle cx="100" cy="100" r="35" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="25" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="100" cy="100" r="5" class="image" />
    <!-- Sparkles -->
    <line x1="80" y1="80" x2="90" y2="90" class="image" />
    <line x1="110" y1="110" x2="120" y2="120" class="image" />
    <line x1="80" y1="120" x2="90" y2="110" class="image" />
    <line x1="110" y1="80" x2="120" y2="90" class="image" />
  </g>
</svg>