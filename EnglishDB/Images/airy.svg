<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">airy</text>
  <text x="50" y="120" class="subtitle">[ˈɛəri] adj. 空气的，通风的，轻快的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> air (空气) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里充满了轻盈的空气，仿佛空气(air)在跳舞，
    <tspan x="50" dy="25">整个房间都变得轻快(airy)起来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room felt airy and refreshing after opening the windows.
  </text>
  <text x="50" y="310" class="content">
    打开窗户后，房间感觉通风且清新。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Windows -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="150" y="20" width="50" height="100" class="image" />
    <rect x="250" y="20" width="50" height="100" class="image" />
    <!-- Air bubbles -->
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="180" cy="130" r="15" class="image" />
    <circle cx="260" cy="160" r="12" class="image" />
    <circle cx="300" cy="120" r="8" class="image" />
  </g>
</svg>