<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fixate</text>
  <text x="50" y="120" class="subtitle">[ˈfɪkseɪt] v. 使固定，使注视</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fix (固定) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"固定(fix)"在椅子上，眼睛"注视(ate)"着前方，
    <tspan x="50" dy="25">完全无法移动，这就是fixate的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She fixated on the painting, unable to look away.
  </text>
  <text x="50" y="310" class="content">
    她盯着那幅画，无法移开视线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Person -->
    <circle cx="75" cy="100" r="20" class="image" />
    <line x1="75" y1="120" x2="75" y2="180" class="image" />
    <line x1="75" y1="180" x2="50" y2="220" class="image" />
    <line x1="75" y1="180" x2="100" y2="220" class="image" />
    <line x1="75" y1="140" x2="120" y2="130" class="image" />
    <!-- Eye -->
    <circle cx="75" cy="90" r="5" class="image" />
    <!-- Arrow -->
    <line x1="75" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,95 190,105" class="image" />
  </g>
</svg>