<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ethnography</text>
  <text x="50" y="120" class="subtitle">[ˌɛθˈnɑːɡrəfi] n. 民族志</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ethno- (种族) + graphy (写)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学者在田野中，"写下(graphy)"
    <tspan x="50" dy="25">不同种族(ethno)的文化和习俗，</tspan>
    <tspan x="50" dy="25">这些记录就构成了民族志(ethnography)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The anthropologist wrote an ethnography of the tribe.
  </text>
  <text x="50" y="310" class="content">
    这位人类学家写了一部关于这个部落的民族志。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Scholar -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Notebook -->
    <rect x="70" y="20" width="100" height="160" class="image" />
    <!-- Writing -->
    <line x1="80" y1="50" x2="160" y2="50" class="image" />
    <line x1="80" y1="80" x2="150" y2="80" class="image" />
    <line x1="80" y1="110" x2="170" y2="110" class="image" />
    <line x1="80" y1="140" x2="140" y2="140" class="image" />
    <!-- Ethnic group -->
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="270" cy="70" r="10" class="image" />
    <circle cx="230" cy="90" r="10" class="image" />
    <circle cx="260" cy="110" r="10" class="image" />
  </g>
</svg>