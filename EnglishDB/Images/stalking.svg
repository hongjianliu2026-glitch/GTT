<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stalking</text>
  <text x="50" y="120" class="subtitle">[ˈstɔːkɪŋ] n. 跟踪，潜行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stalk (茎，跟踪) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的跟踪者，像植物的茎(stalk)一样
    <tspan x="50" dy="25">悄悄地接近目标，这种行为就是跟踪(stalking)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police arrested him for stalking his ex-girlfriend.
  </text>
  <text x="50" y="310" class="content">
    警察因他跟踪前女友而逮捕了他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shadow -->
    <ellipse cx="175" cy="150" rx="150" ry="50" fill="#D7DBDD" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" fill="#2C3E50" />
    <line x1="100" y1="120" x2="100" y2="180" stroke="#2C3E50" stroke-width="10" />
    <line x1="100" y1="180" x2="80" y2="220" stroke="#2C3E50" stroke-width="10" />
    <line x1="100" y1="180" x2="120" y2="220" stroke="#2C3E50" stroke-width="10" />
    <line x1="100" y1="140" x2="80" y2="160" stroke="#2C3E50" stroke-width="10" />
    <line x1="100" y1="140" x2="120" y2="160" stroke="#2C3E50" stroke-width="10" />
    <!-- Target -->
    <circle cx="250" cy="100" r="20" fill="#E74C3C" />
    <line x1="250" y1="120" x2="250" y2="180" stroke="#E74C3C" stroke-width="10" />
    <line x1="250" y1="180" x2="230" y2="220" stroke="#E74C3C" stroke-width="10" />
    <line x1="250" y1="180" x2="270" y2="220" stroke="#E74C3C" stroke-width="10" />
    <line x1="250" y1="140" x2="230" y2="160" stroke="#E74C3C" stroke-width="10" />
    <line x1="250" y1="140" x2="270" y2="160" stroke="#E74C3C" stroke-width="10" />
    <!-- Stalking line -->
    <line x1="120" y1="100" x2="230" y2="100" stroke="#8E44AD" stroke-width="5" />
  </g>
</svg>