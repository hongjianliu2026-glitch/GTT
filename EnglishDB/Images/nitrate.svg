<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nitrate</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪtreɪt] n. 硝酸盐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nitr- (硝石) + -ate (化学名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学家在实验室里，"硝石(nitr-)"
    <tspan x="50" dy="25">被处理成"酸盐(ate)"，形成了硝酸盐(nitrate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soil was enriched with nitrate to improve plant growth.
  </text>
  <text x="50" y="310" class="content">
    土壤中添加了硝酸盐以促进植物生长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beaker -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <!-- Nitrate particles -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="90" r="10" class="image" />
    <circle cx="70" cy="120" r="10" class="image" />
    <circle cx="120" cy="140" r="10" class="image" />
    <!-- Chemist -->
    <circle cx="20" cy="180" r="15" class="image" />
    <line x1="20" y1="195" x2="20" y2="230" class="image" />
    <line x1="20" y1="230" x2="0" y2="260" class="image" />
    <line x1="20" y1="230" x2="40" y2="260" class="image" />
    <line x1="20" y1="210" x2="50" y2="200" class="image" />
  </g>
</svg>