<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">satisfaction</text>
  <text x="50" y="120" class="subtitle">[ˌsætɪsˈfækʃn] n. 满意，满足</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> satis- (足够) + fact (做) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人完成了一项任务，"做得足够好(satis-fact)"，
    <tspan x="50" dy="25">脸上露出满意的笑容，这就是满足感(satisfaction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The customer expressed satisfaction with the service.
  </text>
  <text x="50" y="310" class="content">
    顾客对服务表示满意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Happy face -->
    <circle cx="100" cy="100" r="50" class="image" fill="#2ECC71" />
    <circle cx="80" cy="80" r="10" class="image" fill="#2C3E50" />
    <circle cx="120" cy="80" r="10" class="image" fill="#2C3E50" />
    <path d="M80 120 Q100 140 120 120" class="image" fill="none" stroke="#2C3E50" stroke-width="5" />

    <!-- Task completed -->
    <rect x="180" y="50" width="150" height="100" class="image" fill="#F1C40F" />
    <line x1="190" y1="60" x2="320" y2="60" class="image" />
    <line x1="190" y1="80" x2="320" y2="80" class="image" />
    <line x1="190" y1="100" x2="320" y2="100" class="image" />
    <line x1="190" y1="120" x2="320" y2="120" class="image" />
    <line x1="190" y1="140" x2="320" y2="140" class="image" />
  </g>
</svg>