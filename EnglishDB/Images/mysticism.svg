<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E6FF; }
      .title { font: bold 48px sans-serif; fill: #6A1B9A; }
      .subtitle { font: italic 24px serif; fill: #4A148C; }
      .content { font: 18px sans-serif; fill: #311B92; }
      .highlight { font-weight: bold; fill: #D500F9; }
      .story { font: 16px serif; fill: #7C4DFF; }
      .image { stroke: #9575CD; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mysticism</text>
  <text x="50" y="120" class="subtitle">[ˈmɪstɪˌsɪzəm] n. 神秘主义，神秘学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> myst (神秘) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的仪式，"神秘(myst)"的力量在空气中弥漫，
    <tspan x="50" dy="25">人们沉浸在"神秘主义(mysticism)"的氛围中，试图窥探未知的奥秘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His writings often explore themes of mysticism and spirituality.
  </text>
  <text x="50" y="310" class="content">
    他的作品经常探讨神秘主义和灵性的主题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mystical circle -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Stars -->
    <circle cx="120" cy="50" r="5" class="image" />
    <circle cx="230" cy="50" r="5" class="image" />
    <circle cx="175" cy="150" r="5" class="image" />
    <!-- Person meditating -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="160" y2="180" class="image" />
    <line x1="175" y1="150" x2="190" y2="180" class="image" />
    <line x1="175" y1="130" x2="200" y2="120" class="image" />
  </g>
</svg>