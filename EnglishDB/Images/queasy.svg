<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">queasy</text>
  <text x="50" y="120" class="subtitle">[ˈkwiːzi] adj. 恶心的，不舒服的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> queas (恶心) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在旋转木马上，"感到恶心(queasy)"，
    <tspan x="50" dy="25">脸色苍白，手捂着肚子，仿佛随时要吐出来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roller coaster made her feel queasy.
  </text>
  <text x="50" y="310" class="content">
    过山车让她感到恶心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Face -->
    <circle cx="45" cy="95" r="3" class="image" />
    <circle cx="55" cy="95" r="3" class="image" />
    <line x1="45" y1="105" x2="55" y2="105" class="image" />
    <!-- Hand on stomach -->
    <line x1="50" y1="130" x2="50" y2="150" class="image" />
    <!-- Merry-go-round -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="175" y1="75" x2="225" y2="125" class="image" />
    <line x1="175" y1="125" x2="225" y2="75" class="image" />
  </g>
</svg>