<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gull</text>
  <text x="50" y="120" class="subtitle">[ɡʌl] n. 海鸥；v. 欺骗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "gull"，意为"傻瓜"，后引申为"欺骗"。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只海鸥(gull)在天空中翱翔，突然它俯冲下来，"欺骗(gull)"
    <tspan x="50" dy="25">了一个毫无防备的渔夫，抢走了他的鱼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The con artist tried to gull the old man out of his money.
  </text>
  <text x="50" y="310" class="content">
    骗子试图骗走老人的钱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#AED6F1" />
    <!-- Fisherman -->
    <circle cx="50" cy="150" r="20" class="image" fill="#F39C12" />
    <line x1="50" y1="170" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="30" y2="210" class="image" />
    <line x1="50" y1="190" x2="70" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <!-- Fish -->
    <path d="M100,150 C110,130 130,130 140,150" class="image" fill="#1ABC9C" />
    <line x1="105" y1="145" x2="135" y2="145" class="image" />
    <!-- Gull -->
    <path d="M200,100 C210,80 230,80 240,100" class="image" fill="#3498DB" />
    <line x1="205" y1="95" x2="235" y2="95" class="image" />
    <circle cx="220" cy="100" r="5" class="image" fill="#000" />
    <line x1="220" y1="105" x2="220" y2="120" class="image" />
    <line x1="220" y1="120" x2="210" y2="130" class="image" />
    <line x1="220" y1="120" x2="230" y2="130" class="image" />
  </g>
</svg>