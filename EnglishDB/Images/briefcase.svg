<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">briefcase</text>
  <text x="50" y="120" class="subtitle">[ˈbriːfkeɪs] n. 公文包</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brief (简短的) + case (箱子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个忙碌的商务人士，"简短的(brief)"
    <tspan x="50" dy="25">文件都装在一个"箱子(case)"里，这个箱子就是公文包(briefcase)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He carried his briefcase to the meeting.
  </text>
  <text x="50" y="310" class="content">
    他带着公文包去开会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Briefcase -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Handle -->
    <rect x="70" y="0" width="60" height="20" class="image" />
    <!-- Papers -->
    <line x1="20" y1="30" x2="180" y2="30" class="image" />
    <line x1="20" y1="60" x2="150" y2="60" class="image" />
    <line x1="20" y1="90" x2="170" y2="90" class="image" />
    <line x1="20" y1="120" x2="140" y2="120" class="image" />
    <!-- Businessman -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="230" y2="160" class="image" />
    <line x1="250" y1="130" x2="270" y2="160" class="image" />
    <line x1="250" y1="110" x2="280" y2="100" class="image" />
  </g>
</svg>