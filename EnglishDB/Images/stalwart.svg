<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stalwart</text>
  <text x="50" y="120" class="subtitle">[ˈstɔːlwərt] adj. 坚定的，忠诚的；n. 坚定的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sta- (站立) + lwart (强壮)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"站立(sta-)"在风暴中依然"强壮(lwart)"的人，
    <tspan x="50" dy="25">他就是那个坚定的(stalwart)守护者。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was a stalwart supporter of the cause.
  </text>
  <text x="50" y="310" class="content">
    他是这个事业坚定的支持者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stormy background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="0" class="image" />
    <!-- Standing figure -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <line x1="175" y1="140" x2="150" y2="160" class="image" />
    <line x1="175" y1="140" x2="200" y2="160" class="image" />
  </g>
</svg>