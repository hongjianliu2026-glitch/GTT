<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underneath</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈniːθ] prep. 在...下面；adv. 在下面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在...下面) + -neath (在...下面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个大石头下面，"在...下面(under-neath)"
    <tspan x="50" dy="25">，感觉就像是被石头压住了一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat was hiding underneath the bed.
  </text>
  <text x="50" y="310" class="content">
    猫藏在床底下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large stone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person under the stone -->
    <circle cx="175" cy="150" r="15" class="image" />
    <line x1="175" y1="165" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="230" class="image" />
    <line x1="175" y1="200" x2="195" y2="230" class="image" />
    <line x1="175" y1="180" x2="205" y2="170" class="image" />
  </g>
</svg>