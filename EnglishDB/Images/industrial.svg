<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">industrial</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdʌstriəl] adj. 工业的，产业的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> industri (工业) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工厂，"工业(industri)"
    <tspan x="50" dy="25">机器轰鸣，烟囱冒着浓烟，这就是工业(industrial)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city has a highly industrial economy.
  </text>
  <text x="50" y="310" class="content">
    这座城市拥有高度工业化的经济。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="20" width="50" height="100" class="image" />
    <!-- Smoke -->
    <line x1="160" y1="20" x2="140" y2="0" class="image" />
    <line x1="170" y1="20" x2="190" y2="0" class="image" />
    <line x1="180" y1="20" x2="200" y2="0" class="image" />
    <!-- Machine -->
    <rect x="50" y="120" width="250" height="60" class="image" />
    <!-- Conveyor belt -->
    <line x1="70" y1="150" x2="280" y2="150" class="image" />
    <line x1="70" y1="160" x2="280" y2="160" class="image" />
    <line x1="70" y1="170" x2="280" y2="170" class="image" />
  </g>
</svg>