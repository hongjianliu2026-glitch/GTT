<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brand-new</text>
  <text x="50" y="120" class="subtitle">[ˈbrænd njuː] adj. 崭新的，全新的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brand (烙印) + new (新的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个崭新的物品，就像刚从包装盒里拿出来一样，
    <tspan x="50" dy="25">完全没有被使用过，就像从未被烙印(brand)过的新(new)物品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a brand-new car last week.
  </text>
  <text x="50" y="310" class="content">
    她上周买了一辆崭新的车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Wheels -->
    <circle cx="80" cy="170" r="20" class="image" />
    <circle cx="270" cy="170" r="20" class="image" />
    <!-- Ribbon -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="20" x2="175" y2="50" class="image" />
    <line x1="300" y1="20" x2="175" y2="50" class="image" />
  </g>
</svg>