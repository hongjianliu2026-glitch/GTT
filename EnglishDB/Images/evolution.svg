<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evolution</text>
  <text x="50" y="120" class="subtitle">[ˌɛvəˈluʃən] n. 进化，演变</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (向外) + volut (卷) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个生物从简单的形态"向外卷曲(e-volut)"
    <tspan x="50" dy="25">成复杂的形态，这就是进化(evolution)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The evolution of the species is a fascinating topic.
  </text>
  <text x="50" y="310" class="content">
    物种的进化是一个引人入胜的话题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Simple organism -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Complex organism -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="170" class="image" />
    <line x1="250" y1="170" x2="230" y2="200" class="image" />
    <line x1="250" y1="170" x2="270" y2="200" class="image" />
    <line x1="250" y1="150" x2="220" y2="140" class="image" />
    <line x1="250" y1="150" x2="280" y2="140" class="image" />
    <!-- Evolution arrow -->
    <line x1="80" y1="100" x2="220" y2="100" class="image" />
    <polygon points="220,90 240,100 220,110" class="image" />
  </g>
</svg>