<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #FF4136; }
      .soldier { fill: #34495E; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">firefight</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪərˌfaɪt] n. 交火，枪战</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fire (火) + fight (战斗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场激烈的战斗，"火与战斗(fire-fight)"
    <tspan x="50" dy="25">交织在一起，子弹如火光般穿梭，这就是交火(firefight)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers were engaged in a fierce firefight.
  </text>
  <text x="50" y="310" class="content">
    士兵们卷入了一场激烈的交火。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <polygon points="0,0 50,0 25,50" class="fire" />
    <polygon points="25,0 75,0 50,50" class="fire" />
    <polygon points="50,0 100,0 75,50" class="fire" />
    <!-- Soldier -->
    <circle cx="150" cy="50" r="20" class="soldier" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="90" x2="120" y2="100" class="image" />
    <line x1="150" y1="90" x2="180" y2="100" class="image" />
    <!-- Gun -->
    <rect x="140" y="70" width="20" height="50" class="image" />
    <line x1="150" y1="70" x2="150" y2="50" class="image" />
  </g>
</svg>