<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">website</text>
  <text x="50" y="120" class="subtitle">[ˈwebˌsaɪt] n. 网站</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> web (网) + site (地点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蜘蛛网(web)上，有一个特殊的地点(site)，
    <tspan x="50" dy="25">这个地点就是你的网站(website)，里面充满了各种信息和内容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She created a new website for her business.
  </text>
  <text x="50" y="310" class="content">
    她为她的生意创建了一个新网站。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spider web -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="130" y1="40" x2="220" y2="160" class="image" />
    <line x1="220" y1="40" x2="130" y2="160" class="image" />

    <!-- Website icon -->
    <rect x="150" y="70" width="50" height="50" class="image" />
    <line x1="150" y1="95" x2="200" y2="95" class="image" />
    <line x1="150" y1="120" x2="200" y2="120" class="image" />
    <line x1="150" y1="145" x2="200" y2="145" class="image" />
  </g>
</svg>