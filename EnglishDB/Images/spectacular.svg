<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spectacular</text>
  <text x="50" y="120" class="subtitle">[spɛkˈtækjələr] adj. 壮观的，惊人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spect (看) + -acular (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场"看(spect)"得让人目瞪口呆的"壮观(acular)"烟花表演，
    <tspan x="50" dy="25">每一朵烟花都像是在空中绽放的奇迹，令人惊叹不已。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fireworks display was spectacular.
  </text>
  <text x="50" y="310" class="content">
    烟花表演非常壮观。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fireworks -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="120" r="25" class="image" />
    <circle cx="200" cy="80" r="30" class="image" />
    <circle cx="250" cy="110" r="25" class="image" />
    <circle cx="300" cy="90" r="20" class="image" />
    <!-- Spectators -->
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="80" cy="160" r="10" class="image" />
    <circle cx="110" cy="150" r="10" class="image" />
    <circle cx="140" cy="160" r="10" class="image" />
    <circle cx="170" cy="150" r="10" class="image" />
  </g>
</svg>