<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dependent</text>
  <text x="50" y="120" class="subtitle">[dɪˈpendənt] adj. 依赖的，依靠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + pend (悬挂) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被一根绳子"悬挂(pend)"在空中，
    <tspan x="50" dy="25">完全"依赖(dependent)"于这根绳子来保持不掉下去。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is dependent on her parents for financial support.
  </text>
  <text x="50" y="310" class="content">
    她在经济上依赖父母的支持。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rope -->
    <line x1="50" y1="20" x2="50" y2="200" class="image" />
    <!-- Person hanging from the rope -->
    <circle cx="50" cy="220" r="20" class="image" />
    <line x1="50" y1="240" x2="50" y2="280" class="image" />
    <line x1="50" y1="280" x2="30" y2="320" class="image" />
    <line x1="50" y1="280" x2="70" y2="320" class="image" />
    <line x1="50" y1="260" x2="20" y2="250" class="image" />
    <line x1="50" y1="260" x2="80" y2="250" class="image" />
  </g>
</svg>