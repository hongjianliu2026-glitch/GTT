<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unruly</text>
  <text x="50" y="120" class="subtitle">[ʌnˈruːli] adj. 难控制的，不守规矩的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + ruly (有秩序的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群孩子在操场上，"不(un-)"
    <tspan x="50" dy="25">守秩序(ruly)，四处乱跑，难以控制。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unruly students were sent to the principal's office.
  </text>
  <text x="50" y="310" class="content">
    那些不守规矩的学生被送到了校长办公室。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Playground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Children -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="80" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="80" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Running lines -->
    <line x1="50" y1="65" x2="100" y2="95" class="image" />
    <line x1="100" y1="95" x2="150" y2="65" class="image" />
    <line x1="150" y1="65" x2="200" y2="95" class="image" />
    <line x1="200" y1="95" x2="250" y2="65" class="image" />
    <!-- Teacher trying to control -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="140" x2="280" y2="120" class="image" />
    <line x1="300" y1="140" x2="320" y2="120" class="image" />
    <line x1="300" y1="160" x2="280" y2="180" class="image" />
    <line x1="300" y1="160" x2="320" y2="180" class="image" />
  </g>
</svg>