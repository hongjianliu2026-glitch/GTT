<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">creek</text>
  <text x="50" y="120" class="subtitle">[kriːk] n. 小溪，小河</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crik (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条蜿蜒曲折的"小溪(creek)"，
    <tspan x="50" dy="25">它像一条弯曲的蛇(crik)在森林中穿行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We followed the creek to find the hidden waterfall.
  </text>
  <text x="50" y="310" class="content">
    我们沿着小溪寻找隐藏的瀑布。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Creek -->
    <path d="M0,100 Q50,50 100,100 T200,100 T300,100 T400,100" class="image" />
    <!-- Trees -->
    <rect x="0" y="80" width="20" height="40" class="image" />
    <rect x="50" y="70" width="20" height="50" class="image" />
    <rect x="100" y="60" width="20" height="60" class="image" />
    <rect x="150" y="70" width="20" height="50" class="image" />
    <rect x="200" y="80" width="20" height="40" class="image" />
    <rect x="250" y="70" width="20" height="50" class="image" />
    <rect x="300" y="60" width="20" height="60" class="image" />
    <rect x="350" y="70" width="20" height="50" class="image" />
  </g>
</svg>