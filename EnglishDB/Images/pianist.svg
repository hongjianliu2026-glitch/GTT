<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pianist</text>
  <text x="50" y="120" class="subtitle">[ˈpiːənɪst] n. 钢琴家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> piano (钢琴) + -ist (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个钢琴家坐在钢琴前，手指在琴键上飞舞，
    <tspan x="50" dy="25">奏出美妙的音乐，这就是一个钢琴家(pianist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pianist played a beautiful sonata.
  </text>
  <text x="50" y="310" class="content">
    钢琴家演奏了一首优美的奏鸣曲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Piano -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Keys -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <!-- Pianist -->
    <circle cx="20" cy="120" r="15" class="image" />
    <line x1="20" y1="135" x2="20" y2="170" class="image" />
    <line x1="20" y1="170" x2="0" y2="200" class="image" />
    <line x1="20" y1="170" x2="40" y2="200" class="image" />
    <line x1="20" y1="150" x2="50" y2="140" class="image" />
    <!-- Hands -->
    <line x1="20" y1="135" x2="70" y2="100" class="image" />
    <line x1="20" y1="135" x2="70" y2="120" class="image" />
  </g>
</svg>