<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grotto</text>
  <text x="50" y="120" class="subtitle">[ˈɡrɒtəʊ] n. 洞穴，岩洞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grot (洞穴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的"洞穴(grot)"，里面充满了奇异的石头和
    <tspan x="50" dy="25">闪烁的灯光，仿佛进入了一个奇幻的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They discovered a hidden grotto behind the waterfall.
  </text>
  <text x="50" y="310" class="content">
    他们在瀑布后面发现了一个隐藏的洞穴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cave entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rocks -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="100" cy="120" r="25" class="image" />
    <circle cx="150" cy="90" r="35" class="image" />
    <circle cx="200" cy="110" r="20" class="image" />
    <circle cx="250" cy="80" r="25" class="image" />
    <!-- Lights -->
    <line x1="70" y1="50" x2="70" y2="150" class="image" />
    <line x1="120" y1="50" x2="120" y2="150" class="image" />
    <line x1="170" y1="50" x2="170" y2="150" class="image" />
    <line x1="220" y1="50" x2="220" y2="150" class="image" />
    <line x1="270" y1="50" x2="270" y2="150" class="image" />
  </g>
</svg>