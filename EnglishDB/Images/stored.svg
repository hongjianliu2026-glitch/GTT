<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stored</text>
  <text x="50" y="120" class="subtitle">[stɔːrd] adj. 储存的，存放的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> store (储存) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的仓库，里面堆满了各种物品，
    <tspan x="50" dy="25">"储存(store)"着无数的宝藏，这些宝藏都被"存放(stored)"得井井有条。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stored data was retrieved for analysis.
  </text>
  <text x="50" y="310" class="content">
    储存的数据被提取出来进行分析。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warehouse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Shelves -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Items on shelves -->
    <rect x="70" y="40" width="30" height="30" class="image" />
    <rect x="120" y="40" width="30" height="30" class="image" />
    <rect x="170" y="40" width="30" height="30" class="image" />
    <rect x="220" y="40" width="30" height="30" class="image" />
    <rect x="70" y="90" width="30" height="30" class="image" />
    <rect x="120" y="90" width="30" height="30" class="image" />
    <rect x="170" y="90" width="30" height="30" class="image" />
    <rect x="220" y="90" width="30" height="30" class="image" />
    <rect x="70" y="140" width="30" height="30" class="image" />
    <rect x="120" y="140" width="30" height="30" class="image" />
    <rect x="170" y="140" width="30" height="30" class="image" />
    <rect x="220" y="140" width="30" height="30" class="image" />
  </g>
</svg>