<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">catastrophe</text>
  <text x="50" y="120" class="subtitle">[kəˈtæstrəfi] n. 灾难，大祸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cata- (向下) + strophe (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场巨大的灾难，"向下转动(cata-strophe)"
    <tspan x="50" dy="25">整个世界，一切都变得混乱不堪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The earthquake was a catastrophe for the city.
  </text>
  <text x="50" y="310" class="content">
    地震对这个城市来说是一场灾难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earthquake -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="0" class="image" />
    <!-- Broken buildings -->
    <rect x="50" y="50" width="100" height="100" class="image" />
    <rect x="200" y="50" width="100" height="100" class="image" />
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="200" y1="50" x2="300" y2="150" class="image" />
    <!-- People running -->
    <circle cx="100" cy="180" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
    <line x1="100" y1="190" x2="80" y2="210" class="image" />
    <line x1="250" y1="190" x2="230" y2="210" class="image" />
  </g>
</svg>