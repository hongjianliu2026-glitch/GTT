<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eccentric</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsentrɪk] adj. 古怪的，反常的；n. 怪人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ec- (出) + centr (中心) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"偏离中心(ec-centr)"的人，
    <tspan x="50" dy="25">他的行为和想法与众不同，是个古怪的(eccentric)怪人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His eccentric behavior made him the talk of the town.
  </text>
  <text x="50" y="310" class="content">
    他古怪的行为使他成为镇上的话题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Center point -->
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Normal person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <!-- Eccentric person -->
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="175" y1="100" x2="250" y2="150" class="image" />
    <!-- Arrow -->
    <polygon points="250,150 240,140 240,160" class="image" />
    <!-- Label -->
    <text x="260" y="160" class="content">eccentric</text>
  </g>
</svg>