<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">depletion</text>
  <text x="50" y="120" class="subtitle">[dɪˈpliːʃən] n. 耗尽，枯竭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + ple (充满) + -tion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装满水的杯子，"向下(de-)"
    <tspan x="50" dy="25">倒空(ple-tion)，水越来越少，最终耗尽(depletion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The depletion of natural resources is a major concern.
  </text>
  <text x="50" y="310" class="content">
    自然资源的枯竭是一个主要问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="25" y="150" width="50" height="20" class="image" />
    <!-- Water level -->
    <line x1="10" y1="10" x2="90" y2="10" class="image" />
    <line x1="10" y1="40" x2="90" y2="40" class="image" />
    <line x1="10" y1="70" x2="90" y2="70" class="image" />
    <line x1="10" y1="100" x2="90" y2="100" class="image" />
    <!-- Water droplet -->
    <circle cx="50" cy="160" r="10" class="image" />
  </g>
</svg>