<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #795548; }
      .content { font: 18px sans-serif; fill: #5D4037; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #3F51B5; }
      .image { stroke: #795548; stroke-width: 2; fill: none; }
      .pastel { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pastel</text>
  <text x="50" y="120" class="subtitle">[pæˈstel] n. 粉彩画，粉彩色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> past (面糊) + el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在画布上，用"小面糊(past-el)"
    <tspan x="50" dy="25">状的粉彩颜料，创造出柔和的粉彩色画作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used pastels to create a soft, dreamy landscape.
  </text>
  <text x="50" y="310" class="content">
    她用粉彩创作了一幅柔和梦幻的风景画。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canvas -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pastel colors -->
    <circle cx="50" cy="50" r="20" class="pastel" />
    <circle cx="100" cy="50" r="20" class="pastel" />
    <circle cx="150" cy="50" r="20" class="pastel" />
    <circle cx="200" cy="50" r="20" class="pastel" />
    <circle cx="250" cy="50" r="20" class="pastel" />
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Pastel stick -->
    <rect x="70" y="100" width="30" height="100" class="pastel" />
  </g>
</svg>