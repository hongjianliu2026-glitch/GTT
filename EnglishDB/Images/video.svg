<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">video</text>
  <text x="50" y="120" class="subtitle">[ˈvɪdiəʊ] n. 视频，录像</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vid (看) + -eo (表示“电子的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的眼睛(vid)，它通过电子设备(eo)
    <tspan x="50" dy="25">捕捉并播放动态的影像，这就是视频(video)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She recorded a video of her cat playing.
  </text>
  <text x="50" y="310" class="content">
    她录下了她的猫玩耍的视频。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="20" class="image" fill="#7F8C8D" />
    <!-- Video screen -->
    <rect x="170" y="50" width="200" height="100" class="image" />
    <!-- Play button -->
    <polygon points="300,100 280,90 280,110" class="image" fill="#7F8C8D" />
  </g>
</svg>