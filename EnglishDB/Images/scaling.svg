<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scaling</text>
  <text x="50" y="120" class="subtitle">[ˈskeɪlɪŋ] n. 缩放，规模化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scal (梯子) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的梯子(scal)，你不断地往上爬，
    <tspan x="50" dy="25">每爬一步，你的视野就扩大一点，这就是规模化(scaling)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is working on scaling its operations globally.
  </text>
  <text x="50" y="310" class="content">
    公司正在努力将其业务在全球范围内规模化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ladder -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="60" x2="100" y2="60" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <line x1="50" y1="180" x2="100" y2="180" class="image" />
    <!-- Person climbing -->
    <circle cx="75" cy="160" r="15" class="image" />
    <line x1="75" y1="175" x2="75" y2="200" class="image" />
    <line x1="75" y1="200" x2="60" y2="230" class="image" />
    <line x1="75" y1="200" x2="90" y2="230" class="image" />
    <line x1="75" y1="190" x2="100" y2="180" class="image" />
  </g>
</svg>