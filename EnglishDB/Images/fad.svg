<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fad</text>
  <text x="50" y="120" class="subtitle">[fæd] n. 时尚，一时的流行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fad (源自中古英语，意为“短暂的狂热”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人疯狂追逐一个"短暂的狂热(fad)"，
    <tspan x="50" dy="25">他们穿着同样的衣服，做着同样的手势，</tspan>
    <tspan x="50" dy="25">但很快，这个狂热就消失了，就像一阵风。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pet rock was a fad in the 1970s.
  </text>
  <text x="50" y="310" class="content">
    宠物石头是20世纪70年代的一种时尚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People chasing fad -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />

    <circle cx="100" cy="50" r="15" class="image" />
    <line x1="100" y1="65" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="80" x2="130" y2="70" class="image" />

    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="180" y2="70" class="image" />

    <!-- Fad symbol -->
    <rect x="200" y="30" width="50" height="50" class="image" />
    <line x1="225" y1="30" x2="225" y2="80" class="image" />
    <line x1="200" y1="55" x2="250" y2="55" class="image" />
  </g>
</svg>