<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stew</text>
  <text x="50" y="120" class="subtitle">[stjuː] v. 炖，煨；n. 炖菜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + ew (水)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一锅炖菜，"站立在水中(st-ew)"，
    <tspan x="50" dy="25">慢慢地炖煮，直到食材变得软烂美味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She likes to stew vegetables for a healthy meal.
  </text>
  <text x="50" y="310" class="content">
    她喜欢炖蔬菜来吃一顿健康的饭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Vegetables -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Steam -->
    <line x1="100" y1="20" x2="100" y2="50" class="image" />
    <line x1="150" y1="20" x2="150" y2="50" class="image" />
    <line x1="200" y1="20" x2="200" y2="50" class="image" />
    <line x1="250" y1="20" x2="250" y2="50" class="image" />
  </g>
</svg>