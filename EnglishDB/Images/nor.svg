<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nor</text>
  <text x="50" y="120" class="subtitle">[nɔr] conj. 也不</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "nor"，意为"也不"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在争论，一个人说"我不喜欢苹果"，
    <tspan x="50" dy="25">另一个人接着说"我也不喜欢(nor)橙子"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He doesn't like coffee, nor does he like tea.
  </text>
  <text x="50" y="310" class="content">
    他不喜欢咖啡，也不喜欢茶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Speech bubbles -->
    <path d="M 50 70 Q 50 100 80 100 Q 110 100 110 70 Z" class="image" />
    <path d="M 150 70 Q 150 100 180 100 Q 210 100 210 70 Z" class="image" />
    <!-- Text in speech bubbles -->
    <text x="60" y="90" class="content">I don't like apples.</text>
    <text x="160" y="90" class="content">Nor oranges.</text>
  </g>
</svg>