<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">posh</text>
  <text x="50" y="120" class="subtitle">[pɒʃ] adj. 时髦的，豪华的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自印度洋航运术语，指“船舱位置优越”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个豪华游轮上，乘客们争相预订“优越位置(posh)”的船舱，
    <tspan x="50" dy="25">享受着奢华的旅行体验。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a posh dress to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件时髦的裙子去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Luxury ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Windows -->
    <rect x="70" y="40" width="30" height="30" class="image" />
    <rect x="120" y="40" width="30" height="30" class="image" />
    <rect x="170" y="40" width="30" height="30" class="image" />
    <rect x="220" y="40" width="30" height="30" class="image" />
    <!-- Deck -->
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Flag -->
    <line x1="175" y1="20" x2="175" y2="100" class="image" />
    <rect x="165" y="100" width="20" height="20" class="image" />
  </g>
</svg>