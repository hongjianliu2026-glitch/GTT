<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knead</text>
  <text x="50" y="120" class="subtitle">[niːd] v. 揉，捏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kn- (手) + ead (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个面包师在揉面团，"用手(kn-)动作(ead)"
    <tspan x="50" dy="25">，这就是揉(knead)面团的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She kneaded the dough until it was smooth.
  </text>
  <text x="50" y="310" class="content">
    她把面团揉到光滑为止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dough -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Hand -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="50" y2="130" class="image" />
    <line x1="100" y1="150" x2="150" y2="130" class="image" />
    <line x1="100" y1="180" x2="50" y2="200" class="image" />
    <line x1="100" y1="180" x2="150" y2="200" class="image" />
  </g>
</svg>