<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">caress</text>
  <text x="50" y="120" class="subtitle">[kəˈres] n. 爱抚，抚摸；v. 抚爱，抚摸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> car- (爱) + ess (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人温柔地"爱抚(car-ess)"一只小猫，
    <tspan x="50" dy="25">这种温柔的动作就是caress。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave her cat a gentle caress.
  </text>
  <text x="50" y="310" class="content">
    她温柔地抚摸了她的猫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <path d="M50,100 C50,50 150,50 150,100" class="image" />
    <!-- Cat -->
    <circle cx="100" cy="150" r="30" class="image" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
  </g>
</svg>