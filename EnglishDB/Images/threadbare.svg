<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">threadbare</text>
  <text x="50" y="120" class="subtitle">[ˈθrɛdˌbɛr] adj. 磨破的，陈腐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thread (线) + bare (裸露)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件衣服，"线(thread)"已经磨得"裸露(bare)"，
    <tspan x="50" dy="25">到处都是破洞，这就是threadbare(磨破的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His threadbare jacket was a testament to his poverty.
  </text>
  <text x="50" y="310" class="content">
    他那件磨破的夹克是他贫困的证明。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jacket outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Threadbare holes -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="12" class="image" />
    <circle cx="150" cy="90" r="8" class="image" />
    <circle cx="200" cy="110" r="15" class="image" />
    <circle cx="250" cy="130" r="10" class="image" />
    <!-- Threads -->
    <line x1="30" y1="50" x2="320" y2="50" class="image" />
    <line x1="30" y1="70" x2="320" y2="70" class="image" />
    <line x1="30" y1="90" x2="320" y2="90" class="image" />
    <line x1="30" y1="110" x2="320" y2="110" class="image" />
    <line x1="30" y1="130" x2="320" y2="130" class="image" />
  </g>
</svg>