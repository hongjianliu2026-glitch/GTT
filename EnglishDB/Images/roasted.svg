<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #641E16; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #922B21; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">roasted</text>
  <text x="50" y="120" class="subtitle">[ˈroʊstɪd] adj. 烤过的，烘焙过的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rost (烤) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鸡在火上"烤(rost)"得金黄酥脆，
    <tspan x="50" dy="25">散发出诱人的香气，这就是"烤过的(roasted)"鸡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roasted chicken was the highlight of the dinner.
  </text>
  <text x="50" y="310" class="content">
    烤鸡是晚餐的亮点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="50" cy="100" r="30" class="image" fill="#F39C12" />
    <circle cx="70" cy="80" r="20" class="image" fill="#F39C12" />
    <circle cx="90" cy="100" r="25" class="image" fill="#F39C12" />
    <!-- Chicken -->
    <circle cx="150" cy="100" r="40" class="image" fill="#D68910" />
    <line x1="150" y1="140" x2="150" y2="200" class="image" />
    <line x1="150" y1="160" x2="120" y2="140" class="image" />
    <line x1="150" y1="160" x2="180" y2="140" class="image" />
    <line x1="150" y1="200" x2="120" y2="220" class="image" />
    <line x1="150" y1="200" x2="180" y2="220" class="image" />
  </g>
</svg>