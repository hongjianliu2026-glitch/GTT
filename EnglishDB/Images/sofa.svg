<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sofa</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊfə] n. 沙发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自阿拉伯语 "suffah" (平台)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阿拉伯商人坐在一个高高的平台上，"平台(suffah)"
    <tspan x="50" dy="25">逐渐演变成了我们现在舒适的沙发(sofa)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She relaxed on the sofa after a long day.
  </text>
  <text x="50" y="310" class="content">
    她在一整天后在沙发上放松。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sofa -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <rect x="50" y="20" width="250" height="110" class="image" />
    <!-- Cushions -->
    <rect x="60" y="30" width="80" height="90" class="image" />
    <rect x="150" y="30" width="80" height="90" class="image" />
    <rect x="240" y="30" width="80" height="90" class="image" />
    <!-- Person sitting -->
    <circle cx="195" cy="100" r="15" class="image" />
    <line x1="195" y1="115" x2="195" y2="150" class="image" />
    <line x1="195" y1="150" x2="180" y2="180" class="image" />
    <line x1="195" y1="150" x2="210" y2="180" class="image" />
    <line x1="195" y1="130" x2="220" y2="120" class="image" />
  </g>
</svg>