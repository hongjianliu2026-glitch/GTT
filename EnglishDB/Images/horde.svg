<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">horde</text>
  <text x="50" y="120" class="subtitle">[hɔːrd] n. 一大群，游牧部落</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> horde (源自蒙古语 "khurd"，意为 "营地")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的游牧营地，"一大群(horde)"
    <tspan x="50" dy="25">人聚集在一起，形成了一个庞大的部落。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A horde of tourists descended on the small town.
  </text>
  <text x="50" y="310" class="content">
    一大群游客涌入了这个小镇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Campfire -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Tents -->
    <rect x="100" y="80" width="50" height="40" class="image" />
    <rect x="160" y="80" width="50" height="40" class="image" />
    <rect x="220" y="80" width="50" height="40" class="image" />
    <!-- People -->
    <circle cx="125" cy="140" r="10" class="image" />
    <circle cx="185" cy="140" r="10" class="image" />
    <circle cx="245" cy="140" r="10" class="image" />
    <!-- Ground -->
    <line x1="0" y1="160" x2="300" y2="160" class="image" />
  </g>
</svg>