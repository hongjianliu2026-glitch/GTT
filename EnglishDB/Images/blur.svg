<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blur</text>
  <text x="50" y="120" class="subtitle">[blɜːr] v. 使模糊；n. 模糊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bl- (模糊) + ur (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摄影师在拍照时，镜头上突然出现了一层雾气，
    <tspan x="50" dy="25">导致照片变得模糊不清(blur)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fog blurred the city skyline.
  </text>
  <text x="50" y="310" class="content">
    雾气使城市的天际线变得模糊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camera -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Blurred image -->
    <ellipse cx="175" cy="100" rx="120" ry="80" class="image" />
    <ellipse cx="175" cy="100" rx="100" ry="60" class="image" />
    <ellipse cx="175" cy="100" rx="80" ry="40" class="image" />
    <!-- Fog -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>