<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rental</text>
  <text x="50" y="120" class="subtitle">[ˈrɛntl] n. 租金，租赁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rent (租金) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房东在收取租金，"租金(rent)"
    <tspan x="50" dy="25">是租赁(rental)关系的核心，确保双方权益。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rental price for the apartment is quite reasonable.
  </text>
  <text x="50" y="310" class="content">
    这套公寓的租金相当合理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="100" x2="130" y2="100" class="image" />
    <line x1="75" y1="0" x2="75" y2="50" class="image" />
    <!-- Money -->
    <rect x="180" y="20" width="100" height="60" class="image" />
    <line x1="190" y1="40" x2="270" y2="40" class="image" />
    <line x1="200" y1="60" x2="260" y2="60" class="image" />
    <!-- Hand -->
    <circle cx="320" cy="60" r="15" class="image" />
    <line x1="320" y1="75" x2="320" y2="100" class="image" />
    <line x1="320" y1="100" x2="300" y2="120" class="image" />
    <line x1="320" y1="100" x2="340" y2="120" class="image" />
  </g>
</svg>