<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anti-government</text>
  <text x="50" y="120" class="subtitle">[ˌæntiˈɡʌvərnmənt] adj. 反政府的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (反对) + government (政府)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人举着标语，上面写着"反对(anti-)"
    <tspan x="50" dy="25">政府的政策，他们站在政府大楼前抗议。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The protest was organized by an anti-government group.
  </text>
  <text x="50" y="310" class="content">
    抗议活动是由一个反政府组织组织的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Government building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Protesters -->
    <circle cx="70" cy="100" r="15" class="image" />
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="170" cy="100" r="15" class="image" />
    <!-- Protest signs -->
    <line x1="70" y1="120" x2="70" y2="150" class="image" />
    <line x1="120" y1="120" x2="120" y2="150" class="image" />
    <line x1="170" y1="120" x2="170" y2="150" class="image" />
    <text x="60" y="160" class="content" text-anchor="middle">反对</text>
    <text x="110" y="160" class="content" text-anchor="middle">反对</text>
    <text x="160" y="160" class="content" text-anchor="middle">反对</text>
  </g>
</svg>