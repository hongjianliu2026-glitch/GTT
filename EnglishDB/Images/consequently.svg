<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consequently</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnsɪkwəntli] adv. 因此，所以</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + sequ (跟随) + -ent (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个事件发生后，"跟随(sequ)"着另一个事件，
    <tspan x="50" dy="25">它们"一起(con)"发生，因此(consequently)产生了结果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He forgot his keys, consequently, he couldn't enter his house.
  </text>
  <text x="50" y="310" class="content">
    他忘了带钥匙，因此，他进不了家门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First event -->
    <circle cx="50" cy="100" r="30" class="image" />
    <text x="40" y="110" class="content">事件1</text>
    <!-- Arrow -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,90 160,100 150,110" class="image" />
    <!-- Second event -->
    <circle cx="200" cy="100" r="30" class="image" />
    <text x="190" y="110" class="content">事件2</text>
    <!-- Result -->
    <rect x="250" y="70" width="100" height="60" class="image" />
    <text x="260" y="100" class="content">结果</text>
  </g>
</svg>