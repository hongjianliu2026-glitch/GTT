<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bourgeois</text>
  <text x="50" y="120" class="subtitle">[ˈbʊərʒwɑː] n. 资产阶级，中产阶级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bourg (城镇) + eois (属于)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着西装的商人，站在一个繁华的城镇(bourg)中心，
    <tspan x="50" dy="25">象征着中产阶级(bourgeois)的繁荣与稳定。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The novel portrays the life of the bourgeois class.
  </text>
  <text x="50" y="310" class="content">
    这部小说描绘了中产阶级的生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Town -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Businessman -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Suit -->
    <rect x="40" y="120" width="20" height="40" class="image" />
    <rect x="30" y="160" width="40" height="30" class="image" />
    <!-- Town buildings -->
    <rect x="100" y="100" width="50" height="100" class="image" />
    <rect x="170" y="100" width="50" height="100" class="image" />
    <rect x="240" y="100" width="50" height="100" class="image" />
  </g>
</svg>