<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bash</text>
  <text x="50" y="120" class="subtitle">[bæʃ] v. 猛击，痛击；n. 猛击，痛击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bas (来自古法语 "bas"，意为"低"或"向下")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用力"向下(bas)"猛击(bash)一个物体，发出巨大的声响。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He banged his head against the wall in frustration.
  </text>
  <text x="50" y="310" class="content">
    他因沮丧而用头猛撞墙壁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Object -->
    <rect x="150" y="100" width="50" height="80" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="150" y2="150" class="image" />
    <!-- Impact -->
    <line x1="100" y1="150" x2="150" y2="100" class="image" />
  </g>
</svg>