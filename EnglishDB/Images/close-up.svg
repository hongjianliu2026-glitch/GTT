<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">close-up</text>
  <text x="50" y="120" class="subtitle">[ˈkloʊz ʌp] n. 特写镜头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> close (接近) + up (向上)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摄影师将镜头"拉近(close)"，
    <tspan x="50" dy="25">直到画面"向上(up)"放大，呈现出物体的特写(close-up)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The director asked for a close-up of the actor's face.
  </text>
  <text x="50" y="310" class="content">
    导演要求给演员的脸部一个特写镜头。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camera -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <rect x="80" y="80" width="200" height="40" class="image" />
    <!-- Zoomed-in image -->
    <rect x="150" y="20" width="150" height="150" class="image" />
    <circle cx="225" cy="95" r="20" class="image" />
    <line x1="225" y1="115" x2="225" y2="135" class="image" />
    <line x1="225" y1="135" x2="205" y2="155" class="image" />
    <line x1="225" y1="135" x2="245" y2="155" class="image" />
  </g>
</svg>