<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wealthy</text>
  <text x="50" y="120" class="subtitle">[ˈwɛlθi] adj. 富有的，富裕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wealth (财富) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个富有的人，"拥有大量财富(wealth)"，
    <tspan x="50" dy="25">他的生活充满了奢华和舒适，这就是"富裕的(wealthy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He became wealthy after inheriting his father's fortune.
  </text>
  <text x="50" y="310" class="content">
    他继承了父亲的财产后变得富有。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gold coins -->
    <circle cx="50" cy="50" r="20" class="image" fill="#FFD700" />
    <circle cx="100" cy="50" r="20" class="image" fill="#FFD700" />
    <circle cx="150" cy="50" r="20" class="image" fill="#FFD700" />
    <!-- Luxury items -->
    <rect x="200" y="30" width="50" height="40" class="image" fill="#8B4513" /> <!-- Watch -->
    <rect x="260" y="30" width="50" height="40" class="image" fill="#FF69B4" /> <!-- Diamond -->
    <!-- Wealthy person -->
    <circle cx="350" cy="50" r="25" class="image" fill="#F0E68C" /> <!-- Head -->
    <line x1="350" y1="75" x2="350" y2="120" class="image" /> <!-- Body -->
    <line x1="350" y1="120" x2="320" y2="150" class="image" /> <!-- Left arm -->
    <line x1="350" y1="120" x2="380" y2="150" class="image" /> <!-- Right arm -->
    <line x1="350" y1="120" x2="320" y2="180" class="image" /> <!-- Left leg -->
    <line x1="350" y1="120" x2="380" y2="180" class="image" /> <!-- Right leg -->
  </g>
</svg>