<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bulb { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bulb</text>
  <text x="50" y="120" class="subtitle">[bʌlb] n. 电灯泡，球茎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bul (球) + b (表示名词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的球形灯泡，"球(bul)"
    <tspan x="50" dy="25">状的物体，发出耀眼的光芒，照亮了整个房间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She replaced the burnt-out bulb with a new one.
  </text>
  <text x="50" y="310" class="content">
    她用一个新的灯泡替换了烧坏的灯泡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bulb -->
    <circle cx="100" cy="100" r="50" class="bulb" />
    <!-- Filament -->
    <line x1="100" y1="50" x2="100" y2="10" class="image" />
    <line x1="80" y1="20" x2="120" y2="20" class="image" />
    <line x1="90" y1="30" x2="110" y2="30" class="image" />
    <line x1="100" y1="40" x2="100" y2="30" class="image" />
    <!-- Base -->
    <rect x="75" y="150" width="50" height="20" class="image" />
  </g>
</svg>