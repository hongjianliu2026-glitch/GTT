<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fault</text>
  <text x="50" y="120" class="subtitle">[fɔːlt] n. 错误，缺点；v. 挑剔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fal (失败) + -t (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的岩石从山上滚落，"失败(fal)"
    <tspan x="50" dy="25">下来，砸坏了道路，这就是一个"错误(fault)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's not my fault that the project failed.
  </text>
  <text x="50" y="310" class="content">
    项目失败不是我的错。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Falling rock -->
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Broken road -->
    <line x1="0" y1="200" x2="300" y2="200" class="image" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="200" y1="200" x2="200" y2="250" class="image" />
  </g>
</svg>