<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flag { fill: #F39C12; stroke: #D35400; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pennant</text>
  <text x="50" y="120" class="subtitle">[ˈpɛnənt] n. 三角旗，信号旗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> penna (羽毛) + -ant (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的羽毛(penna)被制成了一面三角旗(pennant)，
    <tspan x="50" dy="25">它在风中飘扬，仿佛一只巨大的鸟在空中翱翔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship's pennant fluttered in the breeze.
  </text>
  <text x="50" y="310" class="content">
    船上的三角旗在微风中飘扬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pennant -->
    <polygon points="0,0 150,0 75,150" class="flag" />
    <!-- Feather -->
    <polyline points="75,150 75,200 50,250 75,300 100,250 75,200" class="image" />
  </g>
</svg>