<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jetty</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɛti] n. 码头，防波堤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jet (投掷) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"投掷物(jet)"被投掷到海中，
    <tspan x="50" dy="25">形成了一个坚固的码头(jetty)，供船只停靠。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The yacht docked at the jetty for the night.
  </text>
  <text x="50" y="310" class="content">
    游艇在码头停靠过夜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Jetty -->
    <rect x="150" y="100" width="50" height="100" class="image" fill="#7F8C8D" />
    <!-- Boat -->
    <rect x="160" y="90" width="30" height="10" class="image" fill="#F39C12" />
    <!-- Waves -->
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
    <line x1="0" y1="170" x2="350" y2="170" class="image" />
    <line x1="0" y1="190" x2="350" y2="190" class="image" />
  </g>
</svg>