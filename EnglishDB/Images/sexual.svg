<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sexual</text>
  <text x="50" y="120" class="subtitle">[ˈsɛkʃuəl] adj. 性的，性别的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sex (性别) + -ual (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的性别符号，"性别(sex)"
    <tspan x="50" dy="25">标志在空中旋转，象征着性别的多样性(sexual)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The study focused on sexual health issues.
  </text>
  <text x="50" y="310" class="content">
    这项研究专注于性健康问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gender symbol -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="50" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <circle cx="250" cy="100" r="50" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="200" y2="200" class="image" />
    <line x1="250" y1="150" x2="300" y2="200" class="image" />
  </g>
</svg>