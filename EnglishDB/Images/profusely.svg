<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">profusely</text>
  <text x="50" y="120" class="subtitle">[prəˈfjuːsli] adv. 大量地，丰富地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + fus (流) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个瀑布，水流"向前大量地流动(pro-fus-ly)"，
    <tspan x="50" dy="25">形成了一个壮观的景象，这就是"大量地(profusely)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flowers bloomed profusely in the garden.
  </text>
  <text x="50" y="310" class="content">
    花园里的花儿盛开得非常茂盛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Waterfall -->
    <path d="M0 0 L50 200 L100 0 Z" class="image" />
    <path d="M50 200 L100 400 L150 200 Z" class="image" />
    <path d="M100 400 L150 600 L200 400 Z" class="image" />
    <!-- Water drops -->
    <circle cx="25" cy="100" r="5" class="image" />
    <circle cx="75" cy="300" r="5" class="image" />
    <circle cx="125" cy="500" r="5" class="image" />
  </g>
</svg>