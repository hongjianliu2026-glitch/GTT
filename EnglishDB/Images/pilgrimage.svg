<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pilgrimage</text>
  <text x="50" y="120" class="subtitle">[ˈpɪlɡrɪmɪdʒ] n. 朝圣，长途旅行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pilgrim (朝圣者) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群朝圣者(pilgrim)背着行囊，
    <tspan x="50" dy="25">长途跋涉(pilgrimage)前往圣地的壮观场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They made a pilgrimage to Mecca last year.
  </text>
  <text x="50" y="310" class="content">
    他们去年去麦加朝圣了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path -->
    <path d="M0,0 L100,100 L200,50 L300,150 L400,100" class="image" />
    <!-- Pilgrim -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Backpack -->
    <rect x="30" y="110" width="40" height="20" class="image" />
    <!-- Destination -->
    <rect x="380" y="80" width="40" height="40" class="image" />
    <text x="390" y="105" class="content" fill="#A93226">圣地</text>
  </g>
</svg>