<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">airing</text>
  <text x="50" y="120" class="subtitle">[ˈerɪŋ] n. 通风，晾晒；v. 晾干，公开讨论</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> air (空气) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阳光明媚的日子，你把被子"晾晒(airing)"在户外，
    <tspan x="50" dy="25">让新鲜的空气(air)充满其中，被子变得蓬松舒适。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to give her room an airing.
  </text>
  <text x="50" y="310" class="content">
    她决定给房间通通风。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" fill="#F39C12" />
    <!-- Lines representing sunlight -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="20" y1="100" x2="80" y2="100" class="image" />
    <line x1="30" y1="120" x2="70" y2="120" class="image" />
    <!-- Clothesline -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <!-- Clothes -->
    <rect x="20" y="180" width="30" height="40" class="image" />
    <rect x="70" y="180" width="30" height="40" class="image" />
    <rect x="120" y="180" width="30" height="40" class="image" />
  </g>
</svg>