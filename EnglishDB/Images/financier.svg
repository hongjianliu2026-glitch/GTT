<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">financier</text>
  <text x="50" y="120" class="subtitle">[faɪˈnænsiər] n. 金融家，财政家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fin (结束) + -ance (名词后缀) + -ier (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个金融家在巨大的金库前，"结束(fin)"
    <tspan x="50" dy="25">所有的财务问题，掌控着财富的流动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The financier managed the company's investments wisely.
  </text>
  <text x="50" y="310" class="content">
    这位金融家明智地管理了公司的投资。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vault door -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gold bars -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <!-- Financier -->
    <circle cx="280" cy="100" r="15" class="image" />
    <line x1="280" y1="115" x2="280" y2="150" class="image" />
    <line x1="280" y1="150" x2="260" y2="180" class="image" />
    <line x1="280" y1="150" x2="300" y2="180" class="image" />
    <line x1="280" y1="130" x2="330" y2="120" class="image" />
  </g>
</svg>