<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bitch</text>
  <text x="50" y="120" class="subtitle">[bɪtʃ] n. 母狗；v. 抱怨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bitch (源自中古英语 biche, 意为母狗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只母狗(bitch)在不停地"抱怨(bitch)"，
    <tspan x="50" dy="25">它的叫声让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always bitches about her job.
  </text>
  <text x="50" y="310" class="content">
    她总是抱怨她的工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="200" class="image" /> <!-- Leg 1 -->
    <line x1="50" y1="150" x2="80" y2="200" class="image" /> <!-- Leg 2 -->
    <line x1="50" y1="100" x2="20" y2="90" class="image" /> <!-- Ear 1 -->
    <line x1="50" y1="100" x2="80" y2="90" class="image" /> <!-- Ear 2 -->
    <line x1="50" y1="120" x2="20" y2="130" class="image" /> <!-- Tail -->
    <line x1="50" y1="120" x2="80" y2="130" class="image" /> <!-- Tail -->
    <!-- Speech bubble -->
    <path d="M100,20 Q150,20 150,70 Q100,70 100,120 Q150,120 150,170 Q100,170 100,220" class="image" />
    <line x1="100" y1="120" x2="50" y2="100" class="image" />
  </g>
</svg>