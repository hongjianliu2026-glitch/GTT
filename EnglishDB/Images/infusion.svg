<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infusion</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfjuːʒn] n. 注入，灌输</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + fus (流) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯茶，热水"流入(in-)"茶叶中，
    <tspan x="50" dy="25">茶叶的精华"流动(fus)"出来，这就是"注入(infusion)"的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The infusion of new ideas has revitalized the project.
  </text>
  <text x="50" y="310" class="content">
    新思想的注入使项目焕发了生机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teapot pouring water -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="150" y2="170" class="image" />
    <!-- Teacup -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <line x1="300" y1="50" x2="300" y2="100" class="image" />
    <!-- Tea leaves -->
    <circle cx="220" cy="70" r="5" class="image" />
    <circle cx="240" cy="70" r="5" class="image" />
    <circle cx="260" cy="70" r="5" class="image" />
    <circle cx="280" cy="70" r="5" class="image" />
  </g>
</svg>