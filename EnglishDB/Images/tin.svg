<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tin</text>
  <text x="50" y="120" class="subtitle">[tɪn] n. 锡，罐头；v. 镀锡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 <tspan class="highlight">tinne</tspan>, 意为锡
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锡罐头，里面装满了各种食物，
    <tspan x="50" dy="25">这个罐头就像一个小型的宝藏箱，充满了美味和惊喜。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She packed her lunch in a tin box.
  </text>
  <text x="50" y="310" class="content">
    她把午餐装进了一个锡盒里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tin can -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Food inside -->
    <circle cx="100" cy="150" r="50" class="image" />
    <rect x="50" y="220" width="100" height="50" class="image" />
    <rect x="75" y="280" width="50" height="20" class="image" />
  </g>
</svg>