<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">susceptibility</text>
  <text x="50" y="120" class="subtitle">[səˌsɛptəˈbɪlɪti] n. 易感性，敏感性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sus- (在下面) + cept (拿) + -ibility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的磁铁下面，"容易被吸引(sus-cept)"
    <tspan x="50" dy="25">，表现出对事物的敏感性(susceptibility)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His susceptibility to colds made him stay indoors.
  </text>
  <text x="50" y="310" class="content">
    他对感冒的易感性使他待在室内。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnet -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Person -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="155" y2="250" class="image" />
    <line x1="175" y1="220" x2="195" y2="250" class="image" />
    <line x1="175" y1="190" x2="145" y2="180" class="image" />
    <line x1="175" y1="190" x2="205" y2="180" class="image" />
    <!-- Arrows -->
    <line x1="175" y1="100" x2="175" y2="130" class="image" />
    <line x1="175" y1="100" x2="165" y2="110" class="image" />
    <line x1="175" y1="100" x2="185" y2="110" class="image" />
  </g>
</svg>