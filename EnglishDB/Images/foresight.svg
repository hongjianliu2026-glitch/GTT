<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foresight</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrsaɪt] n. 先见之明，远见</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (前面) + sight (视力)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在山顶，"提前看到(fore-sight)"
    <tspan x="50" dy="25">远处的风景，这就是先见之明(foresight)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His foresight helped us avoid many pitfalls.
  </text>
  <text x="50" y="310" class="content">
    他的先见之明帮助我们避开了许多陷阱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mountain -->
    <path d="M0,200 L100,0 L200,200 Z" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Telescope -->
    <line x1="100" y1="150" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="120" class="image" />
    <line x1="150" y1="110" x2="170" y2="90" class="image" />
    <line x1="150" y1="110" x2="170" y2="130" class="image" />
  </g>
</svg>