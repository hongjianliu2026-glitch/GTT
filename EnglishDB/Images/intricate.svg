<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intricate</text>
  <text x="50" y="120" class="subtitle">[ˈɪntrɪkət] adj. 复杂的，错综的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + tric (复杂) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个迷宫，"进入(in-)"后发现它"复杂(tric)"到让人眼花缭乱，
    <tspan x="50" dy="25">这就是"错综复杂的(intricate)"感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The intricate design of the tapestry took months to complete.
  </text>
  <text x="50" y="310" class="content">
    这幅错综复杂的挂毯设计花了好几个月才完成。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Maze -->
    <path d="M50,50 L150,50 L150,150 L50,150 Z" class="image" />
    <path d="M70,70 L130,70 L130,130 L70,130 Z" class="image" />
    <path d="M90,90 L110,90 L110,110 L90,110 Z" class="image" />
    <path d="M100,100 L100,100 L100,100 L100,100 Z" class="image" />
    <!-- Person in the maze -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="90" y2="140" class="image" />
    <line x1="100" y1="130" x2="110" y2="140" class="image" />
    <line x1="100" y1="120" x2="120" y2="110" class="image" />
  </g>
</svg>