<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">downstairs</text>
  <text x="50" y="120" class="subtitle">[ˌdaʊnˈsterz] adv. 在楼下，向楼下</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> down (向下) + stairs (楼梯)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从楼上走下来，"向下(down)"
    <tspan x="50" dy="25">走到楼梯(stairs)的底部，这就是"在楼下(downstairs)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She went downstairs to get her coat.
  </text>
  <text x="50" y="310" class="content">
    她下楼去拿她的外套。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stairs -->
    <polyline points="0,100 50,50 100,100 150,50 200,100" class="image" />
    <!-- Person going down -->
    <circle cx="25" cy="90" r="10" class="image" />
    <line x1="25" y1="100" x2="25" y2="120" class="image" />
    <line x1="25" y1="120" x2="15" y2="140" class="image" />
    <line x1="25" y1="120" x2="35" y2="140" class="image" />
    <line x1="25" y1="110" x2="45" y2="100" class="image" />
  </g>
</svg>