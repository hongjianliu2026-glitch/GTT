<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knapsack</text>
  <text x="50" y="120" class="subtitle">[ˈnæpsæk] n. 背包</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> knap (敲击) + sack (袋子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冒险者在森林中，"敲击(knap)"
    <tspan x="50" dy="25">着他的"袋子(sack)"，检查里面的物品，</tspan>
    <tspan x="50" dy="25">这个袋子就是他的"背包(knapsack)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He packed his knapsack with essential supplies for the hike.
  </text>
  <text x="50" y="310" class="content">
    他为徒步旅行在背包里装了必需品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Backpack -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Straps -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <line x1="150" y1="0" x2="150" y2="150" class="image" />
    <!-- Buckle -->
    <rect x="90" y="70" width="20" height="10" class="image" />
    <!-- Adventure -->
    <circle cx="100" cy="200" r="15" class="image" />
    <line x1="100" y1="215" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="280" class="image" />
    <line x1="100" y1="250" x2="120" y2="280" class="image" />
    <line x1="100" y1="230" x2="130" y2="220" class="image" />
  </g>
</svg>