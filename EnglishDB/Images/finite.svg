<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">finite</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪnaɪt] adj. 有限的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fin (结束) + -ite (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时间沙漏，"结束(fin)"
    <tspan x="50" dy="25">的沙子在底部堆积，象征着有限(finite)的时间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The universe is finite in size.
  </text>
  <text x="50" y="310" class="content">
    宇宙的大小是有限的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hourglass -->
    <path d="M50 20 L100 20 L100 80 L50 80 Z" class="image" />
    <path d="M50 120 L100 120 L100 180 L50 180 Z" class="image" />
    <line x1="75" y1="80" x2="75" y2="120" class="image" />
    <!-- Sand -->
    <rect x="55" y="85" width="40" height="10" class="image" fill="#D35400" />
    <rect x="55" y="165" width="40" height="10" class="image" fill="#D35400" />
  </g>
</svg>