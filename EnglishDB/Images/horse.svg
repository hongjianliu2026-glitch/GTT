<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">horse</text>
  <text x="50" y="120" class="subtitle">[hɔːrs] n. 马</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hors (马)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一匹马在草原上奔跑，"马(hors)"
    <tspan x="50" dy="25">的自由与力量让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The horse galloped across the field.
  </text>
  <text x="50" y="310" class="content">
    那匹马在田野上疾驰。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse body -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <!-- Horse head -->
    <circle cx="180" cy="80" r="30" class="image" />
    <!-- Horse legs -->
    <line x1="60" y1="150" x2="60" y2="200" class="image" />
    <line x1="140" y1="150" x2="140" y2="200" class="image" />
    <line x1="80" y1="150" x2="80" y2="200" class="image" />
    <line x1="120" y1="150" x2="120" y2="200" class="image" />
    <!-- Horse tail -->
    <line x1="20" y1="100" x2="0" y2="120" class="image" />
    <line x1="20" y1="100" x2="0" y2="80" class="image" />
  </g>
</svg>