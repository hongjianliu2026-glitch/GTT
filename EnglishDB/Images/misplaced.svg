<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misplaced</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsˈpleɪst] adj. 放错地方的，不适当的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + place (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个书架上，一本书被"错误地放置(mis-place)"
    <tspan x="50" dy="25">在了一个不合适的位置，显得格格不入。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The misplaced book on the shelf caught my eye.
  </text>
  <text x="50" y="310" class="content">
    书架上那本放错地方的书引起了我的注意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bookshelf -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <!-- Misplaced book -->
    <rect x="330" y="20" width="50" height="160" class="image" fill="#E74C3C" />
  </g>
</svg>