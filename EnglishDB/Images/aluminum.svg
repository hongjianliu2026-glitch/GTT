<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aluminum</text>
  <text x="50" y="120" class="subtitle">[əˈluːmɪnəm] n. 铝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alu- (来自拉丁语 alumen, 意为“明矾”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的“明矾(alu-)”块，经过提炼和加工，变成了轻盈而坚固的铝(aluminum)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The airplane is made of aluminum for its lightweight and strength.
  </text>
  <text x="50" y="310" class="content">
    这架飞机由铝制成，因其轻便和强度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Aluminum block -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Refining process -->
    <line x1="220" y1="75" x2="300" y2="75" class="image" />
    <line x1="300" y1="75" x2="300" y2="150" class="image" />
    <!-- Final aluminum product -->
    <rect x="320" y="150" width="100" height="50" class="image" />
  </g>
</svg>