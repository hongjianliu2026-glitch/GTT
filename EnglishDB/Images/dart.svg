<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dart</text>
  <text x="50" y="120" class="subtitle">[dɑːrt] n. 飞镖，标枪；v. 投掷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dart (源自中古英语，意为“快速移动”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个飞镖(dart)在空中“快速移动(dart)”，
    <tspan x="50" dy="25">直奔目标，速度之快让人目不暇接。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He threw the dart with precision.
  </text>
  <text x="50" y="310" class="content">
    他精准地投掷了飞镖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dartboard -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Dart -->
    <line x1="175" y1="100" x2="175" y2="0" class="image" />
    <polygon points="175,0 165,20 185,20" class="image" />
    <!-- Target -->
    <circle cx="175" cy="100" r="10" class="image" />
  </g>
</svg>