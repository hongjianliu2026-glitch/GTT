<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">puny</text>
  <text x="50" y="120" class="subtitle">[ˈpjuːni] adj. 弱小的，微不足道的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pun (小) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫(pun)，它非常"小(puny)"，
    <tspan x="50" dy="25">几乎可以被风吹走，这就是"弱小的"意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The puny kitten was easily picked up by the child.
  </text>
  <text x="50" y="310" class="content">
    那只弱小的小猫很容易就被孩子抱起来了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small cat -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Front leg -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Back leg -->
    <line x1="50" y1="160" x2="30" y2="180" class="image" /> <!-- Tail -->
    <line x1="50" y1="160" x2="70" y2="180" class="image" /> <!-- Tail -->
    <!-- Wind -->
    <line x1="100" y1="80" x2="150" y2="80" class="image" />
    <line x1="100" y1="90" x2="150" y2="90" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
  </g>
</svg>