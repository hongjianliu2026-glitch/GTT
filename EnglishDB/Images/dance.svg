<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dance</text>
  <text x="50" y="120" class="subtitle">[dæns] v. 跳舞；n. 舞蹈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> danse (源自法语，意为“跳舞”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个舞者在舞台上，"翩翩起舞(danse)"，
    <tspan x="50" dy="25">每一个动作都充满了节奏和美感，这就是舞蹈(dance)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to dance at parties.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在派对上跳舞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dance floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dancer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <line x1="50" y1="130" x2="20" y2="120" class="image" />
  </g>
</svg>