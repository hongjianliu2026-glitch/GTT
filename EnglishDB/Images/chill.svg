<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chill</text>
  <text x="50" y="120" class="subtitle">[tʃɪl] n. 寒冷，寒意；v. 使变冷，使感到冷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chil- (寒冷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在寒冷的冬天，"感到寒冷(chill)"
    <tspan x="50" dy="25">，他的身体因为寒冷而颤抖，这就是chill的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The icy wind chilled us to the bone.
  </text>
  <text x="50" y="310" class="content">
    冰冷的风让我们感到彻骨的寒冷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowflake -->
    <line x1="50" y1="20" x2="150" y2="120" class="image" />
    <line x1="50" y1="120" x2="150" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="120" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <!-- Person shivering -->
    <circle cx="200" cy="70" r="15" class="image" />
    <line x1="200" y1="85" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="100" x2="230" y2="90" class="image" />
    <line x1="200" y1="100" x2="170" y2="90" class="image" />
  </g>
</svg>