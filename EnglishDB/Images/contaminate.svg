<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .contaminated { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contaminate</text>
  <text x="50" y="120" class="subtitle">[kənˈtæmɪneɪt] v. 污染，弄脏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tamin (接触) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个纯净的水源被"一起接触(con-tamin)"
    <tspan x="50" dy="25">到污染物，水变得浑浊，这就是污染(contaminate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory's waste contaminated the river.
  </text>
  <text x="50" y="310" class="content">
    工厂的废水污染了河流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clean water -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Contaminant -->
    <circle cx="200" cy="100" r="15" class="contaminated" />
    <line x1="200" y1="115" x2="200" y2="150" class="contaminated" />
    <line x1="200" y1="150" x2="180" y2="180" class="contaminated" />
    <line x1="200" y1="150" x2="220" y2="180" class="contaminated" />
    <line x1="200" y1="130" x2="250" y2="120" class="contaminated" />
  </g>
</svg>