<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conversely</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnvɜːsli] adv. 相反地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + verse (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面站着，突然他们"共同转身(con-verse)"，
    <tspan x="50" dy="25">变成了背对背，这就是"相反地(conversely)"的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Conversely, if you don't study, you won't pass the exam.
  </text>
  <text x="50" y="310" class="content">
    相反地，如果你不学习，你就不会通过考试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <!-- Arrows indicating turning -->
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="130" class="image" />
    <line x1="150" y1="150" x2="170" y2="130" class="image" />
    <!-- Two people now back to back -->
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>