<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">likelihood</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪklihʊd] n. 可能性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> like (相似) + li (连接词) + hood (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，一边是"相似(like)"的物体，另一边是"状态(hood)"，
    <tspan x="50" dy="25">天平倾斜的方向就代表了"可能性(likelihood)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There is a high likelihood of rain today.
  </text>
  <text x="50" y="310" class="content">
    今天下雨的可能性很大。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
    <!-- Objects on the scale -->
    <circle cx="100" cy="150" r="20" class="image" />
    <rect x="280" y="130" width="40" height="40" class="image" />
    <!-- Arrow indicating likelihood -->
    <polygon points="200,20 220,50 180,50" class="image" />
  </g>
</svg>