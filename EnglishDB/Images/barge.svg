<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">barge</text>
  <text x="50" y="120" class="subtitle">[bɑːrdʒ] n. 驳船，平底船</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bar- (木头) + -ge (船)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘用木头(bar-)制成的平底船(-ge)，
    <tspan x="50" dy="25">在河上缓缓移动，承载着货物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The barge carried heavy cargo across the river.
  </text>
  <text x="50" y="310" class="content">
    这艘驳船载着沉重的货物过河。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Barge -->
    <rect x="120" y="50" width="100" height="30" class="image" fill="#D35400" />
    <!-- Cargo -->
    <rect x="130" y="60" width="80" height="20" class="image" fill="#F39C12" />
    <!-- Water waves -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
  </g>
</svg>