<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quash</text>
  <text x="50" y="120" class="subtitle">[kwɒʃ] v. 镇压，平息，取消</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> qua- (压) + -sh (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手掌从天而降，"压(qua-)"
    <tspan x="50" dy="25">住了一只正在抗议的小鸟，瞬间平息(quash)了骚动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government quickly quashed the rebellion.
  </text>
  <text x="50" y="310" class="content">
    政府迅速镇压了叛乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant hand -->
    <path d="M0 0 L100 0 L100 100 L0 100 Z" class="image" />
    <line x1="50" y1="0" x2="50" y2="100" class="image" />
    <line x1="0" y1="50" x2="100" y2="50" class="image" />
    <!-- Bird -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="180" y2="70" class="image" />
  </g>
</svg>