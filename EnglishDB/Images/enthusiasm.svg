<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enthusiasm</text>
  <text x="50" y="120" class="subtitle">[ɪnˈθjuːziæzəm] n. 热情，热心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + theo- (神) + -iasm (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"神(theo)"的力量"充满(en)"，
    <tspan x="50" dy="25">整个人都充满了热情(enthusiasm)，仿佛被神附体一般。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His enthusiasm for the project was contagious.
  </text>
  <text x="50" y="310" class="content">
    他对这个项目的热情具有感染力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a glowing heart -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="180" x2="50" y2="220" class="image" /> <!-- Left arm -->
    <line x1="100" y1="180" x2="150" y2="220" class="image" /> <!-- Right arm -->
    <line x1="100" y1="250" x2="50" y2="300" class="image" /> <!-- Left leg -->
    <line x1="100" y1="250" x2="150" y2="300" class="image" /> <!-- Right leg -->
    <circle cx="100" cy="120" r="10" class="image" /> <!-- Left eye -->
    <circle cx="140" cy="120" r="10" class="image" /> <!-- Right eye -->
    <circle cx="100" cy="180" r="20" class="image" fill="#FF6347" /> <!-- Glowing heart -->
  </g>
</svg>