<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boyish</text>
  <text x="50" y="120" class="subtitle">[ˈbɔɪɪʃ] adj. 男孩般的，孩子气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boy (男孩) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小男孩在草地上奔跑，脸上洋溢着天真无邪的笑容，
    <tspan x="50" dy="25">这种纯真的样子就是"男孩般的(boyish)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a boyish charm that everyone loves.
  </text>
  <text x="50" y="310" class="content">
    她有一种大家都喜欢的男孩般的魅力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Boy -->
    <circle cx="100" cy="120" r="20" class="image" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="160" x2="70" y2="150" class="image" />
    <line x1="100" y1="160" x2="130" y2="150" class="image" />
    <!-- Smile -->
    <path d="M90,130 Q100,125 110,130" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" />
    <line x1="250" y1="20" x2="250" y2="10" class="image" />
    <line x1="250" y1="80" x2="250" y2="90" class="image" />
    <line x1="220" y1="50" x2="210" y2="50" class="image" />
    <line x1="280" y1="50" x2="290" y2="50" class="image" />
    <line x1="235" y1="30" x2="225" y2="20" class="image" />
    <line x1="265" y1="30" x2="275" y2="20" class="image" />
    <line x1="235" y1="70" x2="225" y2="80" class="image" />
    <line x1="265" y1="70" x2="275" y2="80" class="image" />
  </g>
</svg>