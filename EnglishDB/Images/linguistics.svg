<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">linguistics</text>
  <text x="50" y="120" class="subtitle">[lɪŋˈɡwɪstɪks] n. 语言学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lingu (语言) + -istics (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个语言学家在研究各种语言，"语言(lingu)"
    <tspan x="50" dy="25">的科学(-istics)，这就是语言学(linguistics)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She majored in linguistics at university.
  </text>
  <text x="50" y="310" class="content">
    她在大学主修语言学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="50" x2="180" y2="50" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="110" x2="180" y2="110" class="image" />
    <!-- Glasses -->
    <circle cx="50" cy="180" r="10" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
    <line x1="60" y1="180" x2="140" y2="180" class="image" />
    <!-- Person -->
    <circle cx="100" cy="220" r="20" class="image" />
    <line x1="100" y1="240" x2="100" y2="280" class="image" />
    <line x1="100" y1="280" x2="80" y2="310" class="image" />
    <line x1="100" y1="280" x2="120" y2="310" class="image" />
    <line x1="100" y1="260" x2="130" y2="250" class="image" />
  </g>
</svg>