<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">barren</text>
  <text x="50" y="120" class="subtitle">[ˈbærən] adj. 贫瘠的，不生育的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bar- (障碍) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片土地被"障碍(bar-)"所"使(en)"，
    <tspan x="50" dy="25">变得贫瘠，无法生长任何植物，这就是barren(贫瘠的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The land was barren and could not produce crops.
  </text>
  <text x="50" y="310" class="content">
    这片土地贫瘠，无法种植作物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Barren land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rocks and stones -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="15" class="image" />
    <circle cx="150" cy="60" r="12" class="image" />
    <circle cx="200" cy="80" r="14" class="image" />
    <circle cx="250" cy="50" r="11" class="image" />
    <!-- Barriers -->
    <line x1="20" y1="100" x2="330" y2="100" class="image" />
    <line x1="20" y1="120" x2="330" y2="120" class="image" />
    <line x1="20" y1="140" x2="330" y2="140" class="image" />
    <line x1="20" y1="160" x2="330" y2="160" class="image" />
  </g>
</svg>