<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nonlinear</text>
  <text x="50" y="120" class="subtitle">[ˌnɒnˈlɪnɪə(r)] adj. 非线性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> non- (不) + linear (线性的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条直线突然"不(non)"再"线性(linear)"，
    <tspan x="50" dy="25">而是像蛇一样蜿蜒曲折，这就是非线性(nonlinear)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The growth of the population is nonlinear.
  </text>
  <text x="50" y="310" class="content">
    人口增长是非线性的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Straight line -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <!-- Wavy line -->
    <path d="M50,100 C100,50 200,150 300,100" class="image" />
    <!-- Arrow -->
    <polygon points="320,90 340,100 320,110" class="image" />
    <!-- Text -->
    <text x="150" y="150" class="content">non-linear</text>
  </g>
</svg>