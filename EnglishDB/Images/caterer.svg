<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">caterer</text>
  <text x="50" y="120" class="subtitle">[ˈkeɪtərər] n. 餐饮承办人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cata- (向下) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个餐饮承办人，"向下(cata-)"
    <tspan x="50" dy="25">为客人提供美味的食物，确保每个人都能满意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The caterer prepared a delicious buffet for the wedding.
  </text>
  <text x="50" y="310" class="content">
    餐饮承办人为婚礼准备了一顿美味的自助餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food trays -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="170" y="20" width="100" height="160" class="image" />
    <rect x="290" y="20" width="50" height="160" class="image" />
    <!-- Caterer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Food items -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="220" cy="50" r="10" class="image" />
    <circle cx="310" cy="50" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="310" cy="100" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="220" cy="150" r="10" class="image" />
    <circle cx="310" cy="150" r="10" class="image" />
  </g>
</svg>