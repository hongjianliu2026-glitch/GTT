<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flourish</text>
  <text x="50" y="120" class="subtitle">[ˈflɜːrɪʃ] v. 繁荣，茂盛；n. 华丽装饰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flour (花) + -ish (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵花(flour)在阳光下"茂盛(ish)"地生长，
    <tspan x="50" dy="25">它的花瓣像是在跳舞，整个场景充满了生机和繁荣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has flourished since it moved to the new location.
  </text>
  <text x="50" y="310" class="content">
    自从搬到新地点后，公司就蓬勃发展了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
    <circle cx="60" cy="100" r="10" class="image" />
    <circle cx="120" cy="120" r="10" class="image" />
    <circle cx="80" cy="120" r="10" class="image" />
    <!-- Sun -->
    <circle cx="200" cy="50" r="30" class="image" />
    <!-- Ground -->
    <line x1="0" y1="150" x2="300" y2="150" class="image" />
  </g>
</svg>