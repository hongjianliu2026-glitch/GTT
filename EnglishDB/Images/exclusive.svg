<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exclusive</text>
  <text x="50" y="120" class="subtitle">[ɪkˈskluːsɪv] adj. 独有的，排外的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + clus (关闭) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个豪华俱乐部，"向外关闭(ex-clus-ive)"
    <tspan x="50" dy="25">大门，只有少数人能进入，这就是独有(exclusive)的特权。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This VIP lounge is exclusive to members only.
  </text>
  <text x="50" y="310" class="content">
    这个VIP休息室只对会员开放。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Club entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Door -->
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <!-- Lock -->
    <circle cx="150" cy="100" r="10" class="image" />
    <!-- Keyhole -->
    <circle cx="150" cy="100" r="5" class="image" fill="#7F8C8D" />
    <!-- VIP card -->
    <rect x="200" y="80" width="50" height="30" class="image" />
    <text x="205" y="100" class="content" fill="#7F8C8D">VIP</text>
  </g>
</svg>