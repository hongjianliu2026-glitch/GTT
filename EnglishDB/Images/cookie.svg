<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F39C12; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cookie { fill: #D35400; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cookie</text>
  <text x="50" y="120" class="subtitle">[ˈkʊki] n. 曲奇饼，小甜饼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cook (烹饪) + -ie (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"烹饪(cook)"
    <tspan x="50" dy="25">出一个个小甜饼(cookie)，它们香甜可口，让人忍不住一口接一口。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She baked a batch of chocolate chip cookies.
  </text>
  <text x="50" y="310" class="content">
    她烤了一盘巧克力曲奇饼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cookie -->
    <circle cx="50" cy="50" r="30" class="cookie" />
    <circle cx="120" cy="50" r="30" class="cookie" />
    <circle cx="190" cy="50" r="30" class="cookie" />
    <!-- Chef -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
    <!-- Oven -->
    <rect x="80" y="120" width="150" height="100" class="image" />
    <line x1="100" y1="140" x2="200" y2="140" class="image" />
    <line x1="100" y1="160" x2="200" y2="160" class="image" />
    <line x1="100" y1="180" x2="200" y2="180" class="image" />
  </g>
</svg>