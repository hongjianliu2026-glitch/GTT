<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">charge</text>
  <text x="50" y="120" class="subtitle">[tʃɑːrdʒ] n. 费用，电荷；v. 充电，指控</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> charg (装载)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充电器正在"装载(charg)"能量到手机里，
    <tspan x="50" dy="25">这个过程就是给手机充电(charge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please charge your phone before leaving.
  </text>
  <text x="50" y="310" class="content">
    请在离开前给你的手机充电。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Charger -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <!-- Plug -->
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <!-- Phone -->
    <rect x="120" y="20" width="80" height="120" class="image" />
    <!-- Lightning bolt -->
    <polyline points="160,20 180,40 160,60 180,80 160,100" class="image" />
  </g>
</svg>