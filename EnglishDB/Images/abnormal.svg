<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abnormal</text>
  <text x="50" y="120" class="subtitle">[æbˈnɔːrməl] adj. 反常的，异常的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + norm (规则) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫在树上，"离开(ab-)"了地面，"违反了(norm)"
    <tspan x="50" dy="25">正常的猫的行为，这就是异常(abnormal)的猫。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor was concerned about her abnormal heartbeat.
  </text>
  <text x="50" y="310" class="content">
    医生对她的异常心跳感到担忧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="50" y1="50" x2="30" y2="100" class="image" />
    <line x1="50" y1="50" x2="70" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="150" class="image" />
    <line x1="50" y1="100" x2="70" y2="150" class="image" />
    <!-- Cat on tree -->
    <circle cx="50" cy="30" r="15" class="image" />
    <line x1="50" y1="45" x2="50" y2="70" class="image" />
    <line x1="50" y1="70" x2="35" y2="90" class="image" />
    <line x1="50" y1="70" x2="65" y2="90" class="image" />
    <line x1="50" y1="55" x2="70" y2="50" class="image" />
    <line x1="50" y1="55" x2="30" y2="50" class="image" />
  </g>
</svg>