<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">predispose</text>
  <text x="50" y="120" class="subtitle">[ˌpriːdɪˈspəʊz] v. 使倾向于，使易受感染</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + dispose (安排)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的天平前，"提前安排(pre-dispose)"
    <tspan x="50" dy="25">自己的倾向，天平的一端已经倾斜，表示他更容易</tspan>
    <tspan x="50" dy="25">倾向于某种选择或行为。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His childhood experiences predisposed him to a career in medicine.
  </text>
  <text x="50" y="310" class="content">
    他的童年经历使他倾向于选择医学作为职业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <line x1="20" y1="50" x2="50" y2="20" class="image" />
    <line x1="80" y1="50" x2="50" y2="20" class="image" />
    <!-- Weights -->
    <rect x="10" y="60" width="40" height="40" class="image" />
    <rect x="70" y="60" width="40" height="40" class="image" />
    <!-- Person -->
    <circle cx="50" cy="220" r="15" class="image" />
    <line x1="50" y1="235" x2="50" y2="270" class="image" />
    <line x1="50" y1="270" x2="30" y2="300" class="image" />
    <line x1="50" y1="270" x2="70" y2="300" class="image" />
    <line x1="50" y1="250" x2="80" y2="240" class="image" />
  </g>
</svg>