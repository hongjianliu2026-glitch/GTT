<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carbohydrate</text>
  <text x="50" y="120" class="subtitle">[ˌkɑːrboʊˈhaɪdreɪt] n. 碳水化合物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carbo- (碳) + hydr- (水) + -ate (化合物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"碳(carbo)"球，上面覆盖着无数的"水滴(hydr)"，
    <tspan x="50" dy="25">这些水滴在阳光下闪闪发光，形成了一个"碳水化合物(carbohydrate)"的奇妙景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Carbohydrates are essential for providing energy to the body.
  </text>
  <text x="50" y="310" class="content">
    碳水化合物对为身体提供能量至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Carbon ball -->
    <circle cx="100" cy="100" r="50" class="image" fill="#34495E" />
    <!-- Water droplets -->
    <circle cx="70" cy="50" r="10" class="image" fill="#1ABC9C" />
    <circle cx="130" cy="60" r="10" class="image" fill="#1ABC9C" />
    <circle cx="80" cy="120" r="10" class="image" fill="#1ABC9C" />
    <circle cx="120" cy="130" r="10" class="image" fill="#1ABC9C" />
    <circle cx="100" cy="150" r="10" class="image" fill="#1ABC9C" />
  </g>
</svg>