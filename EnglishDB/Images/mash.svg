<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mash</text>
  <text x="50" y="120" class="subtitle">[mæʃ] v. 捣碎，压碎；n. 糊状物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mash (来自古英语 mæsce, 意为“捣碎”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子在捣碎(mash)
    <tspan x="50" dy="25">一堆土豆，土豆瞬间变成了糊状物(mash)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She mashed the potatoes for dinner.
  </text>
  <text x="50" y="310" class="content">
    她为晚餐捣碎了土豆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <rect x="0" y="0" width="100" height="20" class="image" />
    <rect x="40" y="20" width="20" height="100" class="image" />
    <!-- Potatoes -->
    <circle cx="180" cy="60" r="30" class="image" />
    <circle cx="230" cy="60" r="30" class="image" />
    <circle cx="280" cy="60" r="30" class="image" />
    <!-- Mashed potatoes -->
    <rect x="180" y="120" width="130" height="30" class="image" />
  </g>
</svg>