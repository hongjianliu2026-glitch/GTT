<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hotel</text>
  <text x="50" y="120" class="subtitle">[hoʊˈtɛl] n. 旅馆，酒店</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hot (休息) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的旅行者，"寻找一个休息的小地方(hot-el)"
    <tspan x="50" dy="25">来放松，这个地方就是酒店(hotel)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We stayed at a luxurious hotel during our vacation.
  </text>
  <text x="50" y="310" class="content">
    我们在度假期间住在一个豪华的酒店。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hotel building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Windows -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="70" height="80" class="image" />
    <!-- Traveler -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
  </g>
</svg>