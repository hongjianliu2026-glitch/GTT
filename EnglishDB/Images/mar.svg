<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mar</text>
  <text x="50" y="120" class="subtitle">[mɑːr] v. 损伤，毁坏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar (损坏)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完美的苹果，突然被"损坏(mar)"，
    <tspan x="50" dy="25">表面出现了一个大大的缺口，让人感到惋惜。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm marred the beauty of the beach.
  </text>
  <text x="50" y="310" class="content">
    风暴破坏了海滩的美丽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Perfect apple -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Damaged apple -->
    <circle cx="250" cy="100" r="50" class="image" />
    <line x1="220" y1="80" x2="280" y2="120" class="image" />
    <line x1="220" y1="120" x2="280" y2="80" class="image" />
    <!-- Arrow pointing to the damaged part -->
    <line x1="150" y1="100" x2="220" y2="100" class="image" />
    <polygon points="220,100 210,95 210,105" class="image" />
  </g>
</svg>