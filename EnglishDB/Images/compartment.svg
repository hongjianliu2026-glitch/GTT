<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compartment</text>
  <text x="50" y="120" class="subtitle">[kəmˈpɑːrtmənt] n. 隔间，分隔间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + part (部分) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一列火车，每个车厢都被"共同分隔(com-part)"成多个小隔间，
    <tspan x="50" dy="25">每个隔间都有自己的用途，这就是compartment。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stored her belongings in the overhead compartment.
  </text>
  <text x="50" y="310" class="content">
    她把她的物品存放在头顶的行李架上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Train car -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Compartments -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="170" y="20" width="100" height="160" class="image" />
    <rect x="290" y="20" width="50" height="160" class="image" />
    <!-- Doors -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="170" y1="20" x2="170" y2="180" class="image" />
    <line x1="290" y1="20" x2="290" y2="180" class="image" />
    <!-- Seats -->
    <line x1="70" y1="50" x2="150" y2="50" class="image" />
    <line x1="70" y1="80" x2="150" y2="80" class="image" />
    <line x1="70" y1="110" x2="150" y2="110" class="image" />
    <line x1="70" y1="140" x2="150" y2="140" class="image" />
    <line x1="190" y1="50" x2="270" y2="50" class="image" />
    <line x1="190" y1="80" x2="270" y2="80" class="image" />
    <line x1="190" y1="110" x2="270" y2="110" class="image" />
    <line x1="190" y1="140" x2="270" y2="140" class="image" />
  </g>
</svg>