<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">screwdriver</text>
  <text x="50" y="120" class="subtitle">[ˈskruːdraɪvər] n. 螺丝刀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> screw (螺丝) + driver (驱动者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的螺丝(screw)，需要一个强力的"驱动者(driver)"
    <tspan x="50" dy="25">来拧紧它，这个"驱动者"就是螺丝刀(screwdriver)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a screwdriver to fix the cabinet.
  </text>
  <text x="50" y="310" class="content">
    他用螺丝刀修理了橱柜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Screw -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <circle cx="50" cy="20" r="10" class="image" />
    <circle cx="50" cy="60" r="10" class="image" />
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="50" cy="140" r="10" class="image" />
    <circle cx="50" cy="180" r="10" class="image" />

    <!-- Screwdriver -->
    <rect x="150" y="100" width="200" height="20" class="image" />
    <rect x="150" y="80" width="20" height="40" class="image" />
    <rect x="330" y="80" width="20" height="40" class="image" />
    <rect x="170" y="80" width="160" height="20" class="image" />
  </g>
</svg>