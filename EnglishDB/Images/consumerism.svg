<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consumerism</text>
  <text x="50" y="120" class="subtitle">[kənˈsuːmərɪzəm] n. 消费主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + sum (拿) + er (人) + ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人(con-sum-er)疯狂购物，"共同拿(con-sum)"
    <tspan x="50" dy="25">走商品，这种行为形成了消费主义(consumerism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Consumerism has led to over-consumption in many countries.
  </text>
  <text x="50" y="310" class="content">
    消费主义导致了许多国家的过度消费。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shopping cart -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Products -->
    <circle cx="70" cy="50" r="15" class="image" />
    <circle cx="110" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="190" cy="50" r="15" class="image" />
    <circle cx="230" cy="50" r="15" class="image" />
    <!-- People -->
    <circle cx="70" cy="100" r="15" class="image" />
    <circle cx="110" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="190" cy="100" r="15" class="image" />
    <circle cx="230" cy="100" r="15" class="image" />
    <!-- Shopping bags -->
    <rect x="70" y="130" width="30" height="30" class="image" />
    <rect x="110" y="130" width="30" height="30" class="image" />
    <rect x="150" y="130" width="30" height="30" class="image" />
    <rect x="190" y="130" width="30" height="30" class="image" />
    <rect x="230" y="130" width="30" height="30" class="image" />
  </g>
</svg>