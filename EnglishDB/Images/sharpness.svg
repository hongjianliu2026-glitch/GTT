    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sharpness</text>
  <text x="50" y="120" class="subtitle">[ˈʃɑːrpnis] n. 锐利，清晰度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sharp (锐利的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的刀，"锐利(sharp)"到可以轻松切开任何东西，
    <tspan x="50" dy="25">这种"锐利(sharpness)"让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sharpness of the knife made cutting the vegetables easy.
  </text>
  <text x="50" y="310" class="content">
    刀的锐利使得切菜变得容易。
  </text>

