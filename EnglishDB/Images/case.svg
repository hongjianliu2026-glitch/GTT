<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">case</text>
  <text x="50" y="120" class="subtitle">[keɪs] n. 情况，案例；箱子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cas- (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个箱子(case)从高处"落下(cas-)"，
    <tspan x="50" dy="25">里面装满了各种"情况(case)"的物品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This is a special case that requires immediate attention.
  </text>
  <text x="50" y="310" class="content">
    这是一个需要立即关注的特殊情况。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Falling items -->
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="100" cy="120" r="10" class="image" />
    <circle cx="150" cy="80" r="10" class="image" />
    <!-- Falling path -->
    <line x1="50" y1="0" x2="50" y2="100" class="image" />
    <line x1="100" y1="0" x2="100" y2="120" class="image" />
    <line x1="150" y1="0" x2="150" y2="80" class="image" />
  </g>
</svg>