<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">remnant</text>
  <text x="50" y="120" class="subtitle">[ˈrɛmnənt] n. 剩余，残余</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + man (保持) + -ent (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场大火过后，"再次保持(re-man)"
    <tspan x="50" dy="25">下来的东西，就是残余(remnant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The remnant of the fire was still smoldering.
  </text>
  <text x="50" y="310" class="content">
    火的残余还在冒烟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="80" cy="70" r="25" class="image" />
    <circle cx="110" cy="50" r="30" class="image" />
    <!-- Remnant -->
    <rect x="150" y="20" width="100" height="60" class="image" />
    <line x1="160" y1="30" x2="230" y2="30" class="image" />
    <line x1="160" y1="50" x2="230" y2="50" class="image" />
    <line x1="160" y1="70" x2="230" y2="70" class="image" />
  </g>
</svg>