<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">one-fifth</text>
  <text x="50" y="120" class="subtitle">[wʌn fɪfθ] n. 五分之一</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> one (一) + fifth (第五)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕被切成五份，其中一份就是"五分之一(one-fifth)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She ate one-fifth of the cake.
  </text>
  <text x="50" y="310" class="content">
    她吃了蛋糕的五分之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cake -->
    <rect x="0" y="0" width="300" height="150" class="image" />
    <!-- Slices -->
    <line x1="0" y1="0" x2="300" y2="150" class="image" />
    <line x1="0" y1="150" x2="300" y2="0" class="image" />
    <line x1="150" y1="0" x2="150" y2="150" class="image" />
    <line x1="0" y1="75" x2="300" y2="75" class="image" />
    <!-- One-fifth slice -->
    <rect x="0" y="0" width="60" height="75" class="image" fill="#F39C12" />
  </g>
</svg>