<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humanism</text>
  <text x="50" y="120" class="subtitle">[ˈhjuːmənɪzəm] n. 人文主义，人本主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> human (人) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，讨论着如何更好地理解
    <tspan x="50" dy="25">和尊重人类的价值和尊严，这就是人文主义(humanism)的核心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Renaissance humanism emphasized the value of human potential.
  </text>
  <text x="50" y="310" class="content">
    文艺复兴时期的人文主义强调了人的潜能的价值。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People sitting in a circle -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="200" cy="100" r="50" class="image" />
    <circle cx="300" cy="100" r="50" class="image" />
    <circle cx="150" cy="150" r="50" class="image" />
    <circle cx="250" cy="150" r="50" class="image" />
    <!-- Discussion bubbles -->
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="300" cy="50" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Human figure -->
    <circle cx="200" cy="250" r="30" class="image" />
    <line x1="200" y1="280" x2="200" y2="350" class="image" />
    <line x1="200" y1="350" x2="170" y2="400" class="image" />
    <line x1="200" y1="350" x2="230" y2="400" class="image" />
    <line x1="200" y1="300" x2="150" y2="320" class="image" />
    <line x1="200" y1="300" x2="250" y2="320" class="image" />
  </g>
</svg>