<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whirlwind</text>
  <text x="50" y="120" class="subtitle">[ˈwɜːrlwɪnd] n. 旋风，旋流</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> whirl (旋转) + wind (风)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一阵狂风在空中"旋转(whirl)"，形成了一个巨大的"旋风(wind)"，
    <tspan x="50" dy="25">所到之处，一切都随之旋转，仿佛被卷入了一个无法逃脱的漩涡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The whirlwind of events left everyone in a state of confusion.
  </text>
  <text x="50" y="310" class="content">
    事件的旋风让每个人都陷入了混乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Whirlwind -->
    <path d="M 0 0 Q 50 50 100 0 T 200 0" class="image" />
    <path d="M 0 0 Q 50 -50 100 0 T 200 0" class="image" />
    <path d="M 100 0 Q 150 50 200 0 T 300 0" class="image" />
    <path d="M 100 0 Q 150 -50 200 0 T 300 0" class="image" />
    <!-- Wind -->
    <line x1="50" y1="0" x2="100" y2="50" class="image" />
    <line x1="50" y1="0" x2="100" y2="-50" class="image" />
    <line x1="150" y1="0" x2="200" y2="50" class="image" />
    <line x1="150" y1="0" x2="200" y2="-50" class="image" />
  </g>
</svg>