<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">concession</text>
  <text x="50" y="120" class="subtitle">[kənˈseʃn] n. 让步，特许权</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + cess (走) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在谈判，其中一人"共同走(con-cess)"
    <tspan x="50" dy="25">向对方，做出让步(concession)，达成协议。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company was granted a concession to operate the toll road.
  </text>
  <text x="50" y="310" class="content">
    该公司获得了经营收费公路的特许权。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Negotiation table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Handshake -->
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <!-- Concession symbol -->
    <text x="175" y="150" class="content" text-anchor="middle" font-size="36" fill="#E74C3C">↔</text>
  </g>
</svg>