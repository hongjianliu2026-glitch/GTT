<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buffer</text>
  <text x="50" y="120" class="subtitle">[ˈbʌfər] n. 缓冲器，缓冲区；v. 缓冲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> buff (软毛) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的软毛垫子，"缓冲(buffer)"
    <tspan x="50" dy="25">着冲击力，保护着后面的物体不受伤害。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The buffer zone between the two countries prevents conflicts.
  </text>
  <text x="50" y="310" class="content">
    两国之间的缓冲区防止了冲突。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Buffer -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soft cushion -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#F1C40F" />
    <!-- Protected object -->
    <circle cx="200" cy="100" r="30" class="image" fill="#3498DB" />
    <!-- Impact line -->
    <line x1="0" y1="100" x2="50" y2="100" class="image" stroke-width="5" />
  </g>
</svg>