<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arbor</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrbər] n. 树荫处，藤架</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arbor (树)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的树荫下，人们坐在藤架下乘凉，享受着"树荫(arbor)"带来的清凉。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They built an arbor in their backyard for summer gatherings.
  </text>
  <text x="50" y="310" class="content">
    他们在后院建了一个藤架，供夏季聚会使用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Leaves -->
    <circle cx="100" cy="50" r="50" class="image" />
    <circle cx="50" cy="100" r="40" class="image" />
    <circle cx="150" cy="100" r="40" class="image" />
    <circle cx="100" cy="150" r="30" class="image" />
    <!-- Arbor -->
    <rect x="50" y="200" width="100" height="50" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <line x1="50" y1="250" x2="150" y2="250" class="image" />
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="150" y1="200" x2="150" y2="250" class="image" />
    <!-- People -->
    <circle cx="75" cy="225" r="10" class="image" />
    <circle cx="125" cy="225" r="10" class="image" />
  </g>
</svg>