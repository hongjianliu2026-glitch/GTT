<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">camel</text>
  <text x="50" y="120" class="subtitle">[ˈkæml] n. 骆驼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cam- (骆驼) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小骆驼(cam-el)在沙漠中行走，
    <tspan x="50" dy="25">它的背上驮着沉重的货物，但依然稳健前行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The camel is known for its ability to carry heavy loads across the desert.
  </text>
  <text x="50" y="310" class="content">
    骆驼以其穿越沙漠运载重物的能力而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camel body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Camel head -->
    <ellipse cx="250" cy="80" rx="30" ry="20" class="image" />
    <!-- Camel legs -->
    <line x1="70" y1="150" x2="70" y2="200" class="image" />
    <line x1="130" y1="150" x2="130" y2="200" class="image" />
    <line x1="170" y1="150" x2="170" y2="200" class="image" />
    <line x1="230" y1="150" x2="230" y2="200" class="image" />
    <!-- Camel hump -->
    <rect x="100" y="50" width="100" height="50" class="image" />
  </g>
</svg>