<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">warfare</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːrfɛər] n. 战争，冲突</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> war (战争) + fare (进行)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场激烈的战争，士兵们"进行(fare)"着
    <tspan x="50" dy="25">"战争(war)"，这就是warfare的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The history of warfare is filled with tales of bravery.
  </text>
  <text x="50" y="310" class="content">
    战争史充满了英勇的故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soldiers -->
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <!-- Explosion -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="55" x2="250" y2="95" class="image" />
    <line x1="230" y1="75" x2="270" y2="75" class="image" />
    <line x1="240" y1="65" x2="260" y2="85" class="image" />
    <line x1="240" y1="85" x2="260" y2="65" class="image" />
  </g>
</svg>