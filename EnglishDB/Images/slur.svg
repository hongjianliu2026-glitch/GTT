<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slur</text>
  <text x="50" y="120" class="subtitle">[slɜːr] n. 诽谤，含糊不清的话；v. 含糊地说，诽谤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sl- (滑) + ur (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在说话时，"滑过(sl-ur)"
    <tspan x="50" dy="25">嘴里的词语变得含糊不清，甚至变成了诽谤(slur)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was accused of making a slur against his colleague.
  </text>
  <text x="50" y="310" class="content">
    他被指控对同事进行了诽谤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Slurred speech -->
    <line x1="80" y1="90" x2="150" y2="90" class="image" />
    <line x1="80" y1="110" x2="150" y2="110" class="image" />
    <line x1="80" y1="130" x2="150" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M150,90 Q200,50 250,90 Q200,130 150,90" class="image" />
    <!-- Slur text -->
    <text x="170" y="100" class="content" text-anchor="middle">Slur</text>
  </g>
</svg>