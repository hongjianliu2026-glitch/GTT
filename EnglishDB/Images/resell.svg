<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resell</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈsel] v. 转售，再卖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + sell (卖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人从别人那里买来商品，"再次卖出(re-sell)"
    <tspan x="50" dy="25">给另一个顾客，这就是转售(resell)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bought the phone at a discount and resold it for a profit.
  </text>
  <text x="50" y="310" class="content">
    他以折扣价买下手机，然后转售获利。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First transaction -->
    <line x1="0" y1="50" x2="100" y2="50" class="image" />
    <circle cx="20" cy="50" r="15" class="image" />
    <circle cx="80" cy="50" r="15" class="image" />
    <text x="40" y="40" class="content">Buy</text>

    <!-- Second transaction -->
    <line x1="120" y1="50" x2="220" y2="50" class="image" />
    <circle cx="140" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <text x="160" y="40" class="content">Sell</text>

    <!-- Product -->
    <rect x="50" y="70" width="100" height="50" class="image" />
    <text x="85" y="100" class="content">Product</text>
  </g>
</svg>