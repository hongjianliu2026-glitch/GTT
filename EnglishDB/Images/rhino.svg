<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rhino</text>
  <text x="50" y="120" class="subtitle">[ˈraɪnoʊ] n. 犀牛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rhin- (鼻子) + -o (表示“动物”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的犀牛，它的鼻子(rhin-)
    <tspan x="50" dy="25">上有一个巨大的角，这就是犀牛(rhino)的标志。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rhino charged at the safari vehicle.
  </text>
  <text x="50" y="310" class="content">
    犀牛向观光车冲了过来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rhino body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Rhino head -->
    <ellipse cx="150" cy="50" rx="50" ry="30" class="image" />
    <!-- Rhino horn -->
    <line x1="150" y1="30" x2="150" y2="10" class="image" />
    <!-- Rhino legs -->
    <line x1="70" y1="100" x2="70" y2="150" class="image" />
    <line x1="230" y1="100" x2="230" y2="150" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
  </g>
</svg>