<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undersecretary</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈsɛkrəˌtɛri] n. 副部长，次长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在...之下) + secretary (秘书)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个秘书站在一个大人物的下方，"在秘书之下(under-secretary)"
    <tspan x="50" dy="25">，但实际上他是一个副部长(undersecretary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The undersecretary of state met with the foreign minister.
  </text>
  <text x="50" y="310" class="content">
    副部长与外交部长会面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Big person -->
    <rect x="100" y="0" width="100" height="200" class="image" />
    <circle cx="150" cy="220" r="30" class="image" />
    <!-- Small person (undersecretary) -->
    <rect x="125" y="250" width="50" height="100" class="image" />
    <circle cx="150" cy="360" r="15" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="250" x2="150" y2="350" class="image" />
    <polygon points="145,250 155,250 150,240" class="image" />
  </g>
</svg>