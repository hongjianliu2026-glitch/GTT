<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">instability</text>
  <text x="50" y="120" class="subtitle">[ˌɪnstəˈbɪlɪti] n. 不稳定，动荡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + stability (稳定)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摇摇欲坠的建筑物，"不(in-)"
    <tspan x="50" dy="25">稳定(stability)"，随时可能倒塌，这就是instability。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The political instability led to economic crisis.
  </text>
  <text x="50" y="310" class="content">
    政治不稳定导致了经济危机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <rect x="40" y="40" width="70" height="120" class="image" />
    <!-- Cracks -->
    <line x1="10" y1="10" x2="140" y2="190" class="image" />
    <line x1="140" y1="10" x2="10" y2="190" class="image" />
    <!-- Leaning -->
    <line x1="75" y1="0" x2="75" y2="200" class="image" />
    <line x1="75" y1="0" x2="65" y2="10" class="image" />
    <line x1="75" y1="0" x2="85" y2="10" class="image" />
  </g>
</svg>