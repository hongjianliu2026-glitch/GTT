<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bourbon</text>
  <text x="50" y="120" class="subtitle">[ˈbɜːrbən] n. 波旁威士忌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bour- (来自法国波旁王朝) + -bon (好)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法国贵族在波旁王朝时期，"品尝(bour-bon)"
    <tspan x="50" dy="25">一杯美味的威士忌，这种酒因此得名波旁威士忌(bourbon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He prefers bourbon over any other whiskey.
  </text>
  <text x="50" y="310" class="content">
    他更喜欢波旁威士忌而不是其他威士忌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <!-- Liquid -->
    <rect x="25" y="25" width="50" height="150" fill="#8E44AD" />
    <!-- Label -->
    <rect x="10" y="180" width="80" height="10" fill="#D35400" />
    <!-- Glass -->
    <rect x="120" y="50" width="80" height="100" class="image" />
    <rect x="125" y="55" width="70" height="90" fill="#8E44AD" />
    <!-- Ice cubes -->
    <rect x="130" y="60" width="10" height="10" fill="#BDC3C7" />
    <rect x="150" y="60" width="10" height="10" fill="#BDC3C7" />
    <rect x="140" y="75" width="10" height="10" fill="#BDC3C7" />
  </g>
</svg>