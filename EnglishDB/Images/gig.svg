<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gig</text>
  <text x="50" y="120" class="subtitle">[ɡɪɡ] n. 演出，工作；v. 演奏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自意第绪语 "gigue"，意为舞蹈或音乐演奏
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在舞台上，"演奏(gig)"
    <tspan x="50" dy="25">着欢快的音乐，观众随着节奏起舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The band has a gig at the local pub tonight.
  </text>
  <text x="50" y="310" class="content">
    乐队今晚在当地酒吧有一场演出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Musician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Guitar -->
    <rect x="80" y="100" width="100" height="20" class="image" />
    <line x1="80" y1="100" x2="180" y2="100" class="image" />
    <line x1="80" y1="120" x2="180" y2="120" class="image" />
    <line x1="80" y1="140" x2="180" y2="140" class="image" />
    <!-- Audience -->
    <circle cx="250" cy="150" r="10" class="image" />
    <circle cx="280" cy="150" r="10" class="image" />
    <circle cx="310" cy="150" r="10" class="image" />
  </g>
</svg>