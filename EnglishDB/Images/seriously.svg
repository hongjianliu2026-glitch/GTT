<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seriously</text>
  <text x="50" y="120" class="subtitle">[ˈsɪəriəsli] adv. 认真地，严肃地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seri (系列) + -ous (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对一系列(seri)重要的事情时，
    <tspan x="50" dy="25">表情严肃(serious)，认真对待(seriously)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She took the matter seriously and made a detailed plan.
  </text>
  <text x="50" y="310" class="content">
    她认真对待这件事，并制定了一个详细的计划。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with serious expression -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Serious expression -->
    <line x1="35" y1="40" x2="45" y2="40" class="image" />
    <line x1="55" y1="40" x2="65" y2="40" class="image" />
    <line x1="45" y1="60" x2="55" y2="60" class="image" />
    <!-- Important matters -->
    <rect x="100" y="20" width="150" height="100" class="image" />
    <line x1="120" y1="40" x2="230" y2="40" class="image" />
    <line x1="120" y1="60" x2="230" y2="60" class="image" />
    <line x1="120" y1="80" x2="230" y2="80" class="image" />
  </g>
</svg>