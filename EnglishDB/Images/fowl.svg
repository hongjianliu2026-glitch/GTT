<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fowl</text>
  <text x="50" y="120" class="subtitle">[faʊl] n. 家禽，禽类</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "foul"，意为“鸟”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农场的早晨，一群家禽(fowl)在草地上
    <tspan x="50" dy="25">悠闲地觅食，它们的羽毛在阳光下闪闪发光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer raised a variety of fowl on his farm.
  </text>
  <text x="50" y="310" class="content">
    农夫在他的农场里养了各种各样的家禽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Farm background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" fill="#F1C40F" />
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" fill="#27AE60" />
    <!-- Fowl -->
    <circle cx="100" cy="120" r="20" fill="#FFFFFF" stroke="#000000" />
    <line x1="100" y1="140" x2="100" y2="180" stroke="#000000" />
    <line x1="100" y1="160" x2="80" y2="150" stroke="#000000" />
    <line x1="100" y1="160" x2="120" y2="150" stroke="#000000" />
    <line x1="100" y1="180" x2="80" y2="200" stroke="#000000" />
    <line x1="100" y1="180" x2="120" y2="200" stroke="#000000" />
  </g>
</svg>