<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smelly</text>
  <text x="50" y="120" class="subtitle">[ˈsmɛli] adj. 有臭味的，发出臭味的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smel (嗅觉) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的臭鸡蛋，"嗅觉(smel)"
    <tspan x="50" dy="25">被放大到极致，整个房间都充满了臭味(smelly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smelly garbage needed to be taken out immediately.
  </text>
  <text x="50" y="310" class="content">
    那堆发臭的垃圾需要立即清理出去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stinky egg -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Smell lines -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="250" x2="200" y2="300" class="image" />
    <line x1="100" y1="250" x2="250" y2="300" class="image" />
    <!-- Room outline -->
    <rect x="50" y="50" width="150" height="150" class="image" />
  </g>
</svg>