<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dreamer</text>
  <text x="50" y="120" class="subtitle">[ˈdriːmər] n. 梦想家，做梦的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dream (梦) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个梦想家，他坐在云端，"梦(dream)"
    <tspan x="50" dy="25">想着未来的美好，他就是那个做梦的人(dreamer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a dreamer who always believes in the impossible.
  </text>
  <text x="50" y="310" class="content">
    她是一个总是相信不可能的梦想家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Dreamer -->
    <circle cx="175" cy="80" r="20" class="image" />
    <line x1="175" y1="100" x2="175" y2="140" class="image" />
    <line x1="175" y1="120" x2="150" y2="110" class="image" />
    <line x1="175" y1="120" x2="200" y2="110" class="image" />
    <line x1="175" y1="140" x2="150" y2="160" class="image" />
    <line x1="175" y1="140" x2="200" y2="160" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="250" cy="50" r="5" class="image" />
    <circle cx="175" cy="30" r="5" class="image" />
  </g>
</svg>