<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">newborn</text>
  <text x="50" y="120" class="subtitle">[ˈnjuːbɔːrn] n. 新生儿，新生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> new (新的) + born (出生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个刚刚出生的婴儿，"新(new)"
    <tspan x="50" dy="25">生(born)的宝宝，象征着生命的开始。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The newborn baby was wrapped in a soft blanket.
  </text>
  <text x="50" y="310" class="content">
    新生儿被裹在柔软的毯子里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baby -->
    <circle cx="100" cy="100" r="30" class="image" fill="#F1C40F" />
    <circle cx="90" cy="90" r="5" class="image" fill="#000" />
    <circle cx="110" cy="90" r="5" class="image" fill="#000" />
    <path d="M80 110 Q100 130 120 110" class="image" fill="none" stroke="#000" stroke-width="2" />
    <!-- Blanket -->
    <rect x="50" y="130" width="100" height="50" class="image" fill="#8E44AD" />
  </g>
</svg>