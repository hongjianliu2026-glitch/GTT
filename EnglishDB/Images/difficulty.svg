<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">difficulty</text>
  <text x="50" y="120" class="subtitle">[ˈdɪfɪkəlti] n. 困难，难题</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dif- (分开) + fic (做) + -ult (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在尝试"分开(dif-)"做一件事情，
    <tspan x="50" dy="25">但总是遇到各种障碍，这就是"困难(difficulty)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She faced many difficulties while learning to drive.
  </text>
  <text x="50" y="310" class="content">
    她在学习驾驶时遇到了很多困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person struggling -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Obstacles -->
    <rect x="70" y="80" width="30" height="30" class="image" />
    <rect x="120" y="90" width="30" height="30" class="image" />
    <rect x="170" y="70" width="30" height="30" class="image" />
    <rect x="220" y="85" width="30" height="30" class="image" />
    <!-- Path -->
    <line x1="20" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>