<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #641E16; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #2C3E50; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wood</text>
  <text x="50" y="120" class="subtitle">[wʊd] n. 木材，木头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始日耳曼语 *wudu- (木头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林，树木高大挺拔，"木头(wood)"
    <tspan x="50" dy="25">是它们的主要组成部分，象征着自然的力量和生命的延续。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He built a house from wood.
  </text>
  <text x="50" y="310" class="content">
    他用木头建造了一座房子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="50" y1="0" x2="20" y2="50" class="image" />
    <line x1="50" y1="0" x2="80" y2="50" class="image" />
    <line x1="50" y1="0" x2="0" y2="100" class="image" />
    <line x1="50" y1="0" x2="100" y2="100" class="image" />
    <!-- Leaves -->
    <circle cx="20" cy="50" r="10" class="image" />
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="0" cy="100" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
  </g>
</svg>