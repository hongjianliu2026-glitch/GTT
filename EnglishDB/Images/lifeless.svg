<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lifeless</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪfləs] adj. 无生命的，无生气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> life (生命) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个没有生命的世界，"无生命(life-less)"
    <tspan x="50" dy="25">的景象，一切都静止不动，毫无生气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room felt lifeless after everyone left.
  </text>
  <text x="50" y="310" class="content">
    所有人都离开后，房间显得毫无生气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lifeless scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Dead tree -->
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="150" y1="100" x2="120" y2="130" class="image" />
    <line x1="150" y1="100" x2="180" y2="130" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>