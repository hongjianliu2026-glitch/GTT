<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">universe</text>
  <text x="50" y="120" class="subtitle">[ˈjuːnɪvɜːrs] n. 宇宙，世界</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (一个) + verse (旋转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的旋转球体，"一个(uni-)旋转(verse)"
    <tspan x="50" dy="25">的宇宙(universe)，包含了无数的星系和行星。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The universe is vast and mysterious.
  </text>
  <text x="50" y="310" class="content">
    宇宙是广阔而神秘的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Universe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="250" cy="70" r="5" class="image" />
    <circle cx="150" cy="150" r="5" class="image" />
    <circle cx="200" cy="30" r="5" class="image" />
    <circle cx="120" cy="120" r="5" class="image" />
    <!-- Planets -->
    <circle cx="175" cy="100" r="10" class="image" fill="#8E44AD" />
    <circle cx="220" cy="130" r="15" class="image" fill="#F39C12" />
    <circle cx="130" cy="70" r="12" class="image" fill="#3498DB" />
  </g>
</svg>