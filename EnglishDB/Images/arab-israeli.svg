<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Arab-Israeli</text>
  <text x="50" y="120" class="subtitle">[ˌærəb ɪzˈreɪli] adj. 阿拉伯-以色列的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Arab (阿拉伯) + Israeli (以色列的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个地图上，阿拉伯和以色列两个国家紧紧相邻，
    <tspan x="50" dy="25">两国人民在边界上友好交流，这就是阿拉伯-以色列的关系。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Arab-Israeli conflict has been ongoing for decades.
  </text>
  <text x="50" y="310" class="content">
    阿拉伯-以色列冲突已经持续了几十年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Arab country -->
    <rect x="50" y="20" width="120" height="160" class="image" />
    <!-- Israeli country -->
    <rect x="200" y="20" width="120" height="160" class="image" />
    <!-- Border -->
    <line x1="170" y1="20" x2="170" y2="180" class="image" />
    <!-- People -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Handshake -->
    <line x1="115" y1="100" x2="235" y2="100" class="image" />
  </g>
</svg>