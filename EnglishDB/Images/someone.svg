<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">someone</text>
  <text x="50" y="120" class="subtitle">[ˈsʌmwʌn] pron. 某人，有人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> some (一些) + one (一个)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在一个拥挤的房间里，"一些(some)"人中的"一个(one)"
    <tspan x="50" dy="25">引起了你的注意，这个人就是"某人(someone)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Someone left their umbrella behind.
  </text>
  <text x="50" y="310" class="content">
    有人把他们的伞落下了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Crowded room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Focused person -->
    <circle cx="100" cy="100" r="20" class="image" fill="#E74C3C" />
    <!-- Spotlight -->
    <line x1="100" y1="0" x2="100" y2="100" class="image" stroke-width="5" stroke="#F1C40F" />
  </g>
</svg>