<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elect</text>
  <text x="50" y="120" class="subtitle">[ɪˈlɛkt] v. 选举，选择</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + lect (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在投票箱前，"选出(e-lect)"
    <tspan x="50" dy="25">他们心目中的领导者，这就是选举(elect)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The citizens will elect a new mayor next month.
  </text>
  <text x="50" y="310" class="content">
    市民们将在下个月选举一位新市长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Voting box -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Ballot papers -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- People -->
    <circle cx="20" cy="100" r="15" class="image" />
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="140" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="260" cy="100" r="15" class="image" />
    <!-- Hands -->
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="80" y1="115" x2="80" y2="150" class="image" />
    <line x1="140" y1="115" x2="140" y2="150" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="260" y1="115" x2="260" y2="150" class="image" />
  </g>
</svg>