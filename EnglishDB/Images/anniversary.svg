<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anniversary</text>
  <text x="50" y="120" class="subtitle">[ˌænɪˈvɜːrsəri] n. 周年纪念日</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anni- (年) + vers (转) + -ary (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，"每年转动(anni-vers)"
    <tspan x="50" dy="25">一圈，标志着重要的纪念日(anniversary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They celebrated their 10th wedding anniversary.
  </text>
  <text x="50" y="310" class="content">
    他们庆祝了他们的十周年结婚纪念日。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="245" y2="100" class="image" />
    <!-- Year label -->
    <text x="150" y="220" class="content">1 Year</text>
  </g>
</svg>