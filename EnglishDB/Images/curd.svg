<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .curd { fill: #FFF9C4; stroke: #F57F17; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">curd</text>
  <text x="50" y="120" class="subtitle">[kɜːrd] n. 凝乳，凝结的乳制品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> curd (源自拉丁语 "coagulum"，意为凝结)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯牛奶突然"凝结(curd)"成了一块块的凝乳，
    <tspan x="50" dy="25">这些凝乳可以用来制作各种美味的乳制品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used curd to make cheese.
  </text>
  <text x="50" y="310" class="content">
    她用凝乳制作奶酪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Milk cup -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Milk -->
    <rect x="10" y="10" width="130" height="180" class="image" fill="#E0F7FA" />
    <!-- Curd -->
    <circle cx="75" cy="100" r="30" class="curd" />
    <circle cx="40" cy="140" r="20" class="curd" />
    <circle cx="110" cy="120" r="25" class="curd" />
  </g>
</svg>