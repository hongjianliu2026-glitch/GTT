<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orator</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrətər] n. 演说家，雄辩家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ora (嘴) + -tor (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演说家站在讲台上，"用嘴(ora)"
    <tspan x="50" dy="25">滔滔不绝地演讲，他就是一位雄辩家(orator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The orator delivered a powerful speech that moved the audience.
  </text>
  <text x="50" y="310" class="content">
    这位演说家发表了一场感人至深的演讲，打动了听众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Podium -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Mouth -->
    <rect x="150" y="110" width="50" height="20" class="image" />
    <!-- Arms -->
    <line x1="175" y1="130" x2="125" y2="180" class="image" />
    <line x1="175" y1="130" x2="225" y2="180" class="image" />
    <!-- Audience -->
    <circle cx="50" cy="250" r="10" class="image" />
    <circle cx="100" cy="250" r="10" class="image" />
    <circle cx="150" cy="250" r="10" class="image" />
    <circle cx="200" cy="250" r="10" class="image" />
    <circle cx="250" cy="250" r="10" class="image" />
    <circle cx="300" cy="250" r="10" class="image" />
  </g>
</svg>