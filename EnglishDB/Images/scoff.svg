<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scoff</text>
  <text x="50" y="120" class="subtitle">[skɒf] v. 嘲笑，嘲弄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (加强语气) + coff (嘲笑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在街上，"加强语气地嘲笑(s-coff)"
    <tspan x="50" dy="25">一个路过的行人，这种行为就是scoff。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He scoffed at her idea, saying it was ridiculous.
  </text>
  <text x="50" y="310" class="content">
    他嘲笑她的想法，说那是荒谬的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Mouth -->
    <path d="M10,105 Q20,115 30,105" class="image" />
    <!-- Target Person -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="200" y2="120" class="image" />
    <!-- Speech Bubble -->
    <path d="M50,80 Q100,70 150,80 Q100,90 50,80" class="image" />
    <text x="70" y="85" class="content" style="font-size: 14px;">"Haha!"</text>
  </g>
</svg>