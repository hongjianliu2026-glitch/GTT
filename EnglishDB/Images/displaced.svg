<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">displaced</text>
  <text x="50" y="120" class="subtitle">[dɪsˈpleɪst] adj. 被移位的，被取代的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (离开) + place (位置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体原本在某个位置，突然被"移开(dis-place)"，
    <tspan x="50" dy="25">结果它就"被移位(displaced)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The earthquake caused many buildings to be displaced.
  </text>
  <text x="50" y="310" class="content">
    地震导致许多建筑物被移位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Original position -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <text x="20" y="60" class="content">原位置</text>
    <!-- Displaced position -->
    <rect x="200" y="0" width="100" height="100" class="image" />
    <text x="220" y="60" class="content">新位置</text>
    <!-- Arrow -->
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
    <polygon points="200,50 190,45 190,55" class="image" />
  </g>
</svg>