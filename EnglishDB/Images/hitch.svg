<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hitch</text>
  <text x="50" y="120" class="subtitle">[hɪtʃ] v. 拴住，搭便车；n. 故障，障碍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hitc- (拉，拖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在路边，"拉(hitc-)"住一辆车，请求搭便车。
    <tspan x="50" dy="25">这个动作就是"hitch"，而如果车出了问题，那就是"hitch"的故障。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He hitched a ride to the city.
  </text>
  <text x="50" y="310" class="content">
    他搭便车去了城里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Road -->
    <rect x="0" y="150" width="350" height="20" class="image" />
    <!-- Car -->
    <rect x="50" y="100" width="100" height="50" class="image" />
    <!-- Person -->
    <circle cx="20" cy="140" r="15" class="image" />
    <line x1="20" y1="155" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="170" x2="50" y2="160" class="image" />
    <!-- Hand reaching out -->
    <line x1="20" y1="155" x2="70" y2="120" class="image" />
  </g>
</svg>