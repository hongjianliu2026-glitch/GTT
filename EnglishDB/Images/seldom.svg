<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seldom</text>
  <text x="50" y="120" class="subtitle">[ˈsɛldəm] adv. 很少，不常</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sel- (选择) + dom (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个选择器，"选择(sel-)"
    <tspan x="50" dy="25">的状态(dom)很少被触发，</tspan>
    <tspan x="50" dy="25">因此事情"很少(seldom)"发生。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She seldom goes out on weekdays.
  </text>
  <text x="50" y="310" class="content">
    她工作日很少出门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Selector -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <!-- Rare event -->
    <rect x="150" y="80" width="100" height="100" class="image" />
    <text x="175" y="130" class="content" fill="#7F8C8D">?</text>
  </g>
</svg>