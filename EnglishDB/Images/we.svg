<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">we</text>
  <text x="50" y="120" class="subtitle">[wiː] pron. 我们</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无明显词根，为代词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人手拉手，形成一个圆圈，象征着"我们(we)"
    <tspan x="50" dy="25">团结在一起，共同面对挑战。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We are going to the park together.
  </text>
  <text x="50" y="310" class="content">
    我们将一起去公园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle of people -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- People -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="175" cy="20" r="15" class="image" />
    <circle cx="175" cy="180" r="15" class="image" />
    <!-- Hands -->
    <line x1="115" y1="100" x2="235" y2="100" class="image" />
    <line x1="175" y1="35" x2="175" y2="165" class="image" />
  </g>
</svg>