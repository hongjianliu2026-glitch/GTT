<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">defensively</text>
  <text x="50" y="120" class="subtitle">[dɪˈfɛnsɪvli] adv. 防御地，自卫地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + fens (打击) + -ive (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对攻击时，"向下打击(de-fens)"
    <tspan x="50" dy="25">并采取防御姿态，这就是防御地(defensively)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He responded defensively when questioned about his actions.
  </text>
  <text x="50" y="310" class="content">
    当被问及他的行为时，他采取了防御性的回应。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <polygon points="50,50 150,50 100,150" class="image" />
    <!-- Person -->
    <circle cx="100" cy="200" r="20" class="image" />
    <line x1="100" y1="220" x2="100" y2="280" class="image" />
    <line x1="100" y1="280" x2="80" y2="320" class="image" />
    <line x1="100" y1="280" x2="120" y2="320" class="image" />
    <line x1="100" y1="240" x2="60" y2="260" class="image" />
    <line x1="100" y1="240" x2="140" y2="260" class="image" />
    <!-- Arrow -->
    <line x1="200" y1="50" x2="110" y2="140" class="image" />
    <polygon points="200,50 190,40 190,60" class="image" />
  </g>
</svg>