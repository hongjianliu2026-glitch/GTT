<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fearless</text>
  <text x="50" y="120" class="subtitle">[ˈfɪrlɪs] adj. 无畏的，不怕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fear (害怕) + -less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"没有害怕(fear-less)"，
    <tspan x="50" dy="25">勇敢地面对一切挑战。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is fearless in the face of danger.
  </text>
  <text x="50" y="310" class="content">
    她在危险面前毫不畏惧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Rays -->
    <line x1="300" y1="20" x2="300" y2="0" class="image" />
    <line x1="330" y1="50" x2="350" y2="50" class="image" />
    <line x1="270" y1="50" x2="250" y2="50" class="image" />
    <line x1="300" y1="80" x2="300" y2="100" class="image" />
  </g>
</svg>