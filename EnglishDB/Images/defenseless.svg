<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">defenseless</text>
  <text x="50" y="120" class="subtitle">[dɪˈfɛnslɪs] adj. 无防御的，无助的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (去掉) + fense (防御) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个无助的小动物，"去掉(de-)防御(fense)"，
    <tspan x="50" dy="25">变得无助(defenseless)，面对危险毫无保护。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The defenseless kitten was rescued by the kind stranger.
  </text>
  <text x="50" y="310" class="content">
    那只无助的小猫被好心的陌生人救了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Defenseless animal -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="250" class="image" />
    <line x1="100" y1="170" x2="50" y2="160" class="image" />
    <line x1="100" y1="170" x2="150" y2="160" class="image" />
    <!-- Danger symbol -->
    <polygon points="250,50 200,150 300,150" class="image" />
    <line x1="250" y1="70" x2="250" y2="130" class="image" />
  </g>
</svg>