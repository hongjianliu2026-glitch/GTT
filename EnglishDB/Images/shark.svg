<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shark</text>
  <text x="50" y="120" class="subtitle">[ʃɑːrk] n. 鲨鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "shark"，可能来自古英语 "scearc" (猎物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的鲨鱼在海洋中游弋，它的尖牙闪烁着寒光，
    <tspan x="50" dy="25">仿佛在寻找它的"猎物(scearc)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shark circled the boat, looking for its next meal.
  </text>
  <text x="50" y="310" class="content">
    鲨鱼绕着船游弋，寻找它的下一顿饭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shark body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Shark fin -->
    <polygon points="100,50 200,50 150,0" class="image" />
    <!-- Shark tail -->
    <polygon points="50,100 250,100 200,150 100,150" class="image" />
    <!-- Shark teeth -->
    <line x1="120" y1="80" x2="130" y2="70" class="image" />
    <line x1="130" y1="80" x2="140" y2="70" class="image" />
    <line x1="140" y1="80" x2="150" y2="70" class="image" />
    <line x1="150" y1="80" x2="160" y2="70" class="image" />
    <line x1="160" y1="80" x2="170" y2="70" class="image" />
    <line x1="170" y1="80" x2="180" y2="70" class="image" />
  </g>
</svg>