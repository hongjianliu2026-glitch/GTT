<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unifying</text>
  <text x="50" y="120" class="subtitle">[ˈjuːnɪfaɪɪŋ] adj. 统一的，联合的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (单一) + -fy (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磁铁，将无数的碎片"统一(uni-fy)"
    <tspan x="50" dy="25">成一个整体，这个过程就是"unifying"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy aims to unify the different departments.
  </text>
  <text x="50" y="310" class="content">
    新政策旨在统一不同的部门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnet -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Fragments -->
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="130" cy="110" r="10" class="image" />
    <circle cx="160" cy="140" r="10" class="image" />
    <circle cx="190" cy="170" r="10" class="image" />
    <!-- Unified -->
    <line x1="220" y1="50" x2="220" y2="170" class="image" />
    <line x1="250" y1="50" x2="250" y2="170" class="image" />
    <line x1="280" y1="50" x2="280" y2="170" class="image" />
  </g>
</svg>