<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prosciutto</text>
  <text x="50" y="120" class="subtitle">[proʊˈʃuːtoʊ] n. 意大利熏火腿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + scutum (盾牌) + -o (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士在战场上，"向前举起(pro-)"
    <tspan x="50" dy="25">他的"盾牌(scutum)"，结果发现那其实是一片美味的意大利熏火腿(prosciutto)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat prosciutto with melon.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃意大利熏火腿配蜜瓜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <polygon points="0,0 150,0 175,50 150,100 0,100" class="image" />
    <!-- Ham -->
    <rect x="20" y="20" width="110" height="60" class="image" />
    <!-- Soldier -->
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="200" y1="80" x2="230" y2="70" class="image" />
    <!-- Arrow pointing to ham -->
    <line x1="200" y1="50" x2="100" y2="50" class="image" />
    <polygon points="90,45 100,50 90,55" class="image" />
  </g>
</svg>