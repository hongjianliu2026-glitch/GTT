<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enzyme</text>
  <text x="50" y="120" class="subtitle">[ˈɛnzaɪm] n. 酶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (在...里面) + zyme (酵母)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"在酵母(zyme)里面发现了一种神奇的物质(en-zyme)"，
    <tspan x="50" dy="25">这种物质能够加速化学反应，它就是酶(enzyme)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enzyme catalyzed the reaction.
  </text>
  <text x="50" y="310" class="content">
    这种酶催化了这个反应。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lab coat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Beaker -->
    <rect x="100" y="20" width="100" height="160" class="image" />
    <line x1="100" y1="20" x2="200" y2="20" class="image" />
    <line x1="100" y1="180" x2="200" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <!-- Bubbles -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="170" cy="120" r="8" class="image" />
    <circle cx="130" cy="140" r="6" class="image" />
  </g>
</svg>