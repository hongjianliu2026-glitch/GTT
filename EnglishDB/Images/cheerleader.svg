<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheerleader</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɪrlidər] n. 啦啦队长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cheer (欢呼) + leader (领导者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个啦啦队长站在高台上，"带领(leader)"
    <tspan x="50" dy="25">大家一起"欢呼(cheer)"，为队伍加油打气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cheerleader led the crowd in a chant.
  </text>
  <text x="50" y="310" class="content">
    啦啦队长带领人群一起喊口号。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cheerleader -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="150" y2="190" class="image" />
    <line x1="175" y1="160" x2="200" y2="190" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
    <!-- Crowd -->
    <circle cx="100" cy="180" r="10" class="image" />
    <circle cx="130" cy="180" r="10" class="image" />
    <circle cx="160" cy="180" r="10" class="image" />
    <circle cx="200" cy="180" r="10" class="image" />
    <circle cx="230" cy="180" r="10" class="image" />
    <circle cx="260" cy="180" r="10" class="image" />
    <!-- Cheers -->
    <text x="100" y="220" class="content" fill="#E74C3C">Cheer!</text>
    <text x="200" y="220" class="content" fill="#E74C3C">Cheer!</text>
  </g>
</svg>