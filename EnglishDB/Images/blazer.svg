<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blazer</text>
  <text x="50" y="120" class="subtitle">[ˈbleɪzər] n. 运动夹克，亮色夹克</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blaz (火焰) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件夹克，它的颜色像火焰一样明亮，
    <tspan x="50" dy="25">穿上它，你就像一团燃烧的火焰，引人注目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a bright red blazer to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件鲜红色的运动夹克去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Blazer -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Flame -->
    <polygon points="100,10 120,50 150,50 125,70 135,100 100,80 65,100 75,70 50,50 80,50" class="image" fill="#FF6347" />
    <!-- Person wearing the blazer -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
  </g>
</svg>