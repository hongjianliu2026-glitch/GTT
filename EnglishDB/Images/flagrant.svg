<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flagrant</text>
  <text x="50" y="120" class="subtitle">[ˈfleɪɡrənt] adj. 恶名昭彰的，公然的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flagr- (燃烧) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶名昭彰的罪犯，他的罪行如同"燃烧(flagr-)"的火焰，
    <tspan x="50" dy="25">公然(flagrant)地照亮了整个城市，无人不知，无人不晓。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flagrant abuse of power by the mayor shocked the citizens.
  </text>
  <text x="50" y="310" class="content">
    市长公然的权力滥用震惊了市民。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Burning flame -->
    <path d="M 0 0 L 20 50 L 40 0 Z" class="image" />
    <path d="M 10 10 L 30 60 L 50 10 Z" class="image" />
    <path d="M 20 20 L 40 70 L 60 20 Z" class="image" />
    <!-- City skyline -->
    <rect x="70" y="50" width="50" height="100" class="image" />
    <rect x="130" y="30" width="50" height="120" class="image" />
    <rect x="190" y="70" width="50" height="80" class="image" />
    <!-- Criminal -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
  </g>
</svg>