<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shelter</text>
  <text x="50" y="120" class="subtitle">[ˈʃeltər] n. 庇护所，避难所；v. 庇护，保护</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shel- (来自古英语 scyltra，意为“覆盖物”) + -ter (表示地点或场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的屋顶"覆盖(shel-)"着一群人，
    <tspan x="50" dy="25">为他们提供"庇护(shelter)"，保护他们免受风雨侵袭。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old church was used as a shelter during the storm.
  </text>
  <text x="50" y="310" class="content">
    暴风雨期间，这座老教堂被用作避难所。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Roof -->
    <polygon points="0,0 350,0 300,100 50,100" class="image" />
    <!-- People -->
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>