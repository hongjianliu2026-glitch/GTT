<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scrawl</text>
  <text x="50" y="120" class="subtitle">[skrɔːl] v. 潦草地写，乱涂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scrawl (源自中古英语 scrallen，意为“潦草地写”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子在墙上"乱涂乱画(scrawl)"，
    <tspan x="50" dy="25">他的笔迹像蛇一样扭曲，这就是潦草的写法。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He scrawled his name on the wall in frustration.
  </text>
  <text x="50" y="310" class="content">
    他生气地在墙上潦草地写下了自己的名字。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Scrawled lines -->
    <line x1="50" y1="20" x2="300" y2="180" class="image" />
    <line x1="50" y1="40" x2="280" y2="160" class="image" />
    <line x1="50" y1="60" x2="260" y2="140" class="image" />
    <line x1="50" y1="80" x2="240" y2="120" class="image" />
    <line x1="50" y1="100" x2="220" y2="100" class="image" />
    <line x1="50" y1="120" x2="200" y2="80" class="image" />
    <line x1="50" y1="140" x2="180" y2="60" class="image" />
    <line x1="50" y1="160" x2="160" y2="40" class="image" />
    <line x1="50" y1="180" x2="140" y2="20" class="image" />
    <!-- Child -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>