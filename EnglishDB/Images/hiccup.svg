<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hiccup</text>
  <text x="50" y="120" class="subtitle">[ˈhɪkʌp] n. 打嗝；v. 打嗝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hic (打嗝声) + cup (容器)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在吃饭时，突然"打嗝(hic)"一声，
    <tspan x="50" dy="25">就像一个小容器(cup)被气体充满，发出声音。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He couldn't stop hiccupping after drinking soda.
  </text>
  <text x="50" y="310" class="content">
    他喝了汽水后不停地打嗝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Hiccup sound -->
    <text x="100" y="120" class="image" font-size="48" fill="#C0392B">HIC!</text>
    <!-- Cup -->
    <rect x="150" y="80" width="50" height="100" class="image" />
    <line x1="150" y1="80" x2="200" y2="80" class="image" />
    <line x1="150" y1="180" x2="200" y2="180" class="image" />
    <line x1="150" y1="80" x2="150" y2="180" class="image" />
    <line x1="200" y1="80" x2="200" y2="180" class="image" />
  </g>
</svg>