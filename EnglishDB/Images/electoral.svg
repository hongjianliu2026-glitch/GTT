<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">electoral</text>
  <text x="50" y="120" class="subtitle">[ɪˈlektərəl] adj. 选举的，选举人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> elect (选举) + -or (人) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群选举人(elect-or)在投票站，他们正在参与选举(electoral)，
    <tspan x="50" dy="25">每个人都在认真地填写选票，确保选举过程公正。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The electoral process was smooth and transparent.
  </text>
  <text x="50" y="310" class="content">
    选举过程顺利且透明。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Voting booth -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Voting booth door -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Voting booth window -->
    <rect x="170" y="20" width="100" height="160" class="image" />
    <!-- Voting booth handle -->
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Voting booth sign -->
    <text x="200" y="100" class="content" text-anchor="middle">Vote Here</text>
    <!-- Voting ballot -->
    <rect x="280" y="50" width="50" height="100" class="image" />
    <!-- Voting ballot lines -->
    <line x1="290" y1="60" x2="320" y2="60" class="image" />
    <line x1="290" y1="80" x2="320" y2="80" class="image" />
    <line x1="290" y1="100" x2="320" y2="100" class="image" />
    <line x1="290" y1="120" x2="320" y2="120" class="image" />
    <!-- Voter -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>