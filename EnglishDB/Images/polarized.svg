<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polarized</text>
  <text x="50" y="120" class="subtitle">[ˈpoʊləraɪzd] adj. 两极化的，极化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pol (极) + -ar (形容词后缀) + -ize (使动) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个世界被"极化(polar)"成两个极端，
    <tspan x="50" dy="25">一边是火焰，一边是冰山，人们被"使动(ize)"成</tspan>
    <tspan x="50" dy="25">两个对立的阵营，这就是"两极化的(polarized)"世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The debate on climate change has become highly polarized.
  </text>
  <text x="50" y="310" class="content">
    关于气候变化的辩论已经变得高度两极化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Polarized world -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fire -->
    <rect x="50" y="20" width="100" height="160" fill="#E74C3C" />
    <!-- Iceberg -->
    <rect x="200" y="20" width="100" height="160" fill="#3498DB" />
    <!-- Divider -->
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <!-- People -->
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="230" cy="100" r="15" class="image" />
    <line x1="80" y1="115" x2="80" y2="150" class="image" />
    <line x1="230" y1="115" x2="230" y2="150" class="image" />
    <line x1="80" y1="150" x2="60" y2="180" class="image" />
    <line x1="230" y1="150" x2="210" y2="180" class="image" />
    <line x1="80" y1="150" x2="100" y2="180" class="image" />
    <line x1="230" y1="150" x2="250" y2="180" class="image" />
  </g>
</svg>