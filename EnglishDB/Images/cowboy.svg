<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4E8F3; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cowboy</text>
  <text x="50" y="120" class="subtitle">[ˈkaʊbɔɪ] n. 牛仔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cow (牛) + boy (男孩)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的"男孩(boy)"，骑着马，
    <tspan x="50" dy="25">在广阔的草原上放牧"牛(cow)"，他就是牛仔(cowboy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cowboy rode his horse across the prairie.
  </text>
  <text x="50" y="310" class="content">
    牛仔骑着马穿越了草原。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cowboy -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Horse -->
    <rect x="50" y="100" width="100" height="50" class="image" />
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <!-- Cow -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="220" y2="210" class="image" />
    <line x1="250" y1="180" x2="280" y2="210" class="image" />
    <line x1="250" y1="150" x2="200" y2="140" class="image" />
    <line x1="250" y1="150" x2="300" y2="140" class="image" />
  </g>
</svg>