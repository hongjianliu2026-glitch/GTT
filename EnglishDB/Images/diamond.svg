<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diamond</text>
  <text x="50" y="120" class="subtitle">[ˈdaɪəmənd] n. 钻石，菱形</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dia- (穿过) + mond (世界)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗钻石，它"穿过(dia-)"了整个"世界(mond)"，
    <tspan x="50" dy="25">闪耀着无与伦比的光芒，象征着永恒与珍贵。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received a diamond ring as a gift.
  </text>
  <text x="50" y="310" class="content">
    她收到了一枚钻石戒指作为礼物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diamond shape -->
    <polygon points="175,10 250,150 175,290 100,150" style="fill:none;stroke:#C0392B;stroke-width:5" />
    <!-- Sparkle -->
    <circle cx="175" cy="150" r="10" style="fill:#C0392B" />
    <line x1="175" y1="140" x2="175" y2="160" style="stroke:#C0392B;stroke-width:2" />
    <line x1="165" y1="150" x2="185" y2="150" style="stroke:#C0392B;stroke-width:2" />
  </g>
</svg>