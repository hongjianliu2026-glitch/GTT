<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">store-bought</text>
  <text x="50" y="120" class="subtitle">[stɔːr bɔːt] adj. 商店买的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> store (商店) + bought (买)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个购物袋从商店(store)里"买(bought)"出来，
    <tspan x="50" dy="25">袋子里装满了各种商店买的商品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers homemade cookies over store-bought ones.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢自制的饼干而不是商店买的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shopping bag -->
    <path d="M50 50 L300 50 L280 150 L70 150 Z" class="image" />
    <!-- Store -->
    <rect x="100" y="200" width="200" height="100" class="image" />
    <line x1="120" y1="220" x2="280" y2="220" class="image" />
    <line x1="120" y1="250" x2="280" y2="250" class="image" />
    <line x1="120" y1="280" x2="280" y2="280" class="image" />
    <!-- Items in the bag -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
  </g>
</svg>