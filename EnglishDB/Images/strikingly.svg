<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">strikingly</text>
  <text x="50" y="120" class="subtitle">[ˈstraɪkɪŋli] adv. 显著地，引人注目地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> strike (打击) + -ing (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"打击(strike)"地面，
    <tspan x="50" dy="25">地面裂开，露出一个闪闪发光的宝石，</tspan>
    <tspan x="50" dy="25">这个宝石"显著地(strikingly)"吸引了所有人的目光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The difference was strikingly obvious.
  </text>
  <text x="50" y="310" class="content">
    差异非常明显。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <line x1="0" y1="0" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="0" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <!-- Cracked ground -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <!-- Shining gem -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="130" y1="100" x2="170" y2="100" class="image" />
  </g>
</svg>