<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fennel</text>
  <text x="50" y="120" class="subtitle">[ˈfɛnəl] n. 茴香</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fen (来自拉丁语 "foenum"，意为“干草”) + -el (小词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小茴香(fennel)，它散发着干草(fen)的香气，
    <tspan x="50" dy="25">就像一个小小的干草堆(fen-el)，让人忍不住想靠近闻一闻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added fennel to the soup to give it a unique flavor.
  </text>
  <text x="50" y="310" class="content">
    她在汤里加了茴香，使其味道独特。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fennel plant -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="180" x2="50" y2="20" class="image" />
    <line x1="100" y1="180" x2="100" y2="20" class="image" />
    <line x1="150" y1="180" x2="150" y2="20" class="image" />
    <line x1="200" y1="180" x2="200" y2="20" class="image" />
    <line x1="250" y1="180" x2="250" y2="20" class="image" />
    <!-- Leaves -->
    <polyline points="50,20 25,60 75,60 50,20" class="image" />
    <polyline points="100,20 75,60 125,60 100,20" class="image" />
    <polyline points="150,20 125,60 175,60 150,20" class="image" />
    <polyline points="200,20 175,60 225,60 200,20" class="image" />
    <polyline points="250,20 225,60 275,60 250,20" class="image" />
  </g>
</svg>