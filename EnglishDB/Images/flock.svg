<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flock</text>
  <text x="50" y="120" class="subtitle">[flɒk] n. 一群，兽群；v. 聚集</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flock (源自中古英语 flok, 意为“一群”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群羊在草原上"聚集(flock)"，
    <tspan x="50" dy="25">它们紧紧地靠在一起，形成了一个紧密的群体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A flock of birds flew over the lake.
  </text>
  <text x="50" y="310" class="content">
    一群鸟飞过湖面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#27AE60" />
    <!-- Sheep -->
    <circle cx="50" cy="120" r="20" class="image" fill="#F1C40F" />
    <circle cx="100" cy="120" r="20" class="image" fill="#F1C40F" />
    <circle cx="150" cy="120" r="20" class="image" fill="#F1C40F" />
    <circle cx="200" cy="120" r="20" class="image" fill="#F1C40F" />
    <circle cx="250" cy="120" r="20" class="image" fill="#F1C40F" />
    <!-- Sheep legs -->
    <line x1="40" y1="140" x2="40" y2="150" class="image" />
    <line x1="60" y1="140" x2="60" y2="150" class="image" />
    <line x1="90" y1="140" x2="90" y2="150" class="image" />
    <line x1="110" y1="140" x2="110" y2="150" class="image" />
    <line x1="140" y1="140" x2="140" y2="150" class="image" />
    <line x1="160" y1="140" x2="160" y2="150" class="image" />
    <line x1="190" y1="140" x2="190" y2="150" class="image" />
    <line x1="210" y1="140" x2="210" y2="150" class="image" />
    <line x1="240" y1="140" x2="240" y2="150" class="image" />
    <line x1="260" y1="140" x2="260" y2="150" class="image" />
  </g>
</svg>