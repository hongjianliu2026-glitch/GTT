<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vent</text>
  <text x="50" y="120" class="subtitle">[vɛnt] n. 通风口，出口；v. 发泄，排放</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vent (来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的火山口，"来(vent)"自地心的热气通过这个出口喷发出来，
    <tspan x="50" dy="25">这就是"通风口(vent)"的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a vent to release her frustration.
  </text>
  <text x="50" y="310" class="content">
    她找到了一个发泄她沮丧情绪的出口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Volcano -->
    <path d="M 0 150 Q 100 50 200 150 L 200 200 L 0 200 Z" class="image" />
    <!-- Smoke -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="120" cy="80" r="15" class="image" />
    <circle cx="140" cy="60" r="10" class="image" />
    <!-- Vent label -->
    <text x="100" y="180" class="highlight" text-anchor="middle">Vent</text>
  </g>
</svg>