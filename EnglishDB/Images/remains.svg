<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">remains</text>
  <text x="50" y="120" class="subtitle">[rɪˈmeɪnz] n. 剩余物，遗迹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + main (停留)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场大火过后，"再次停留(re-main)"
    <tspan x="50" dy="25">在地上的只有灰烬和遗迹(remains)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The archaeologists found ancient remains in the ruins.
  </text>
  <text x="50" y="310" class="content">
    考古学家在废墟中发现了古代遗迹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="50" cy="50" r="30" class="image" fill="#FF6347" />
    <circle cx="70" cy="70" r="25" class="image" fill="#FF6347" />
    <circle cx="90" cy="50" r="30" class="image" fill="#FF6347" />
    <!-- Ashes -->
    <rect x="10" y="100" width="120" height="30" class="image" fill="#8B4513" />
    <rect x="20" y="130" width="100" height="20" class="image" fill="#8B4513" />
    <rect x="30" y="150" width="80" height="10" class="image" fill="#8B4513" />
  </g>
</svg>