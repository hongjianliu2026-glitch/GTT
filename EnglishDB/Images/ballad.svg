<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ballad</text>
  <text x="50" y="120" class="subtitle">[ˈbæləd] n. 民谣，叙事诗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ball (舞) + -ad (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的村庄，村民们围着篝火跳舞，
    <tspan x="50" dy="25">同时唱着"舞动的(ball)"故事，这就是民谣(ballad)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ballad tells a story of love and loss.
  </text>
  <text x="50" y="310" class="content">
    这首民谣讲述了一个关于爱与失去的故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Campfire -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="80" y1="130" x2="120" y2="130" class="image" />
    <line x1="90" y1="140" x2="110" y2="140" class="image" />
    <line x1="100" y1="150" x2="100" y2="150" class="image" />
    <!-- Dancing villagers -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
  </g>
</svg>