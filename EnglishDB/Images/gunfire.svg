<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gunfire</text>
  <text x="50" y="120" class="subtitle">[ˈɡʌnfaɪər] n. 炮火，枪击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gun (枪) + fire (火)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战场，"枪(gun)" 和 "火(fire)" 交织在一起，
    <tspan x="50" dy="25">形成猛烈的炮火(gunfire)，震撼人心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers took cover from the intense gunfire.
  </text>
  <text x="50" y="310" class="content">
    士兵们在猛烈的炮火中寻找掩护。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gun -->
    <rect x="0" y="0" width="100" height="20" class="image" />
    <rect x="10" y="20" width="80" height="100" class="image" />
    <!-- Fire -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="160" x2="50" y2="200" class="image" />
    <!-- Explosion -->
    <circle cx="50" cy="200" r="20" class="image" />
    <circle cx="30" cy="220" r="10" class="image" />
    <circle cx="70" cy="220" r="10" class="image" />
  </g>
</svg>