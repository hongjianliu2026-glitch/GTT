<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">redesign</text>
  <text x="50" y="120" class="subtitle">[ˌriːdɪˈzaɪn] v. 重新设计</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + design (设计)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个设计师在画板上，"再次设计(re-design)"
    <tspan x="50" dy="25">一个产品，使其焕然一新。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to redesign its logo to appeal to a younger audience.
  </text>
  <text x="50" y="310" class="content">
    公司决定重新设计其标志，以吸引更年轻的受众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old design -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <text x="20" y="50" class="content" fill="#7F8C8D">Old</text>
    <!-- New design -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <text x="220" y="50" class="content" fill="#7F8C8D">New</text>
    <!-- Designer -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="150" y2="170" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="50" x2="190" y2="50" class="image" />
    <polygon points="190,50 185,45 185,55" class="image" />
  </g>
</svg>