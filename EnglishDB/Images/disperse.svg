<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disperse</text>
  <text x="50" y="120" class="subtitle">[dɪˈspɜːrs] v. 分散，散开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + pers (散开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群鸟儿原本聚集在一起，突然被一声巨响惊吓，"分开散开(dis-perse)"
    <tspan x="50" dy="25">飞向四面八方，场面壮观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police dispersed the crowd with tear gas.
  </text>
  <text x="50" y="310" class="content">
    警察用催泪瓦斯驱散了人群。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Birds -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <!-- Dispersed birds -->
    <line x1="50" y1="50" x2="20" y2="100" class="image" />
    <line x1="100" y1="50" x2="130" y2="100" class="image" />
    <line x1="150" y1="50" x2="180" y2="100" class="image" />
    <line x1="200" y1="50" x2="230" y2="100" class="image" />
    <line x1="250" y1="50" x2="280" y2="100" class="image" />
    <!-- Explosion -->
    <circle cx="150" cy="50" r="20" class="image" stroke-dasharray="5,5" />
  </g>
</svg>