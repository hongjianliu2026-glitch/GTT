<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tuna</text>
  <text x="50" y="120" class="subtitle">[ˈtuːnə] n. 金枪鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自西班牙语 "atún"，意为“金枪鱼”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的金枪鱼在海洋中游动，它的身体闪烁着银色的光芒，
    <tspan x="50" dy="25">仿佛在向你展示它的力量和速度。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had tuna sashimi for dinner last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚我们吃了金枪鱼刺身。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean background -->
    <rect x="0" y="0" width="350" height="200" fill="#4CAF50" />
    <!-- Tuna fish -->
    <path d="M50 100 C50 50 150 50 150 100 C150 150 50 150 50 100 Z" fill="#7F8C8D" />
    <!-- Fins -->
    <polygon points="150,100 200,80 200,120" fill="#7F8C8D" />
    <polygon points="50,100 0,80 0,120" fill="#7F8C8D" />
    <!-- Eye -->
    <circle cx="100" cy="90" r="5" fill="#000" />
  </g>
</svg>