<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nascent</text>
  <text x="50" y="120" class="subtitle">[ˈnæsnt] adj. 初生的，新生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nasci (出生) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新生的婴儿，刚刚从母体中"出生(nasci)"，
    <tspan x="50" dy="25">带着无限的潜力和希望，这就是"初生的(nascent)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nascent company is full of potential.
  </text>
  <text x="50" y="310" class="content">
    这家新成立的公司充满了潜力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baby -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="170" x2="50" y2="150" class="image" />
    <line x1="100" y1="170" x2="150" y2="150" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="250" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" />
    <line x1="250" y1="80" x2="250" y2="120" class="image" />
    <line x1="250" y1="80" x2="220" y2="110" class="image" />
    <line x1="250" y1="80" x2="280" y2="110" class="image" />
    <line x1="250" y1="120" x2="220" y2="150" class="image" />
    <line x1="250" y1="120" x2="280" y2="150" class="image" />
  </g>
</svg>