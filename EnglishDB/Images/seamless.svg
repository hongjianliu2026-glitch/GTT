<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seamless</text>
  <text x="50" y="120" class="subtitle">[ˈsiːmlɪs] adj. 无缝的，无接缝的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seam (缝) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件衣服，"没有缝(seam-less)"，
    <tspan x="50" dy="25">完全贴合身体，就像第二层皮肤一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The integration was seamless, making the transition smooth.
  </text>
  <text x="50" y="310" class="content">
    整合是无缝的，使得过渡非常顺畅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seamless cloth -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Body outline -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- Cloth fitting perfectly -->
    <line x1="120" y1="20" x2="280" y2="20" class="image" />
    <line x1="120" y1="180" x2="280" y2="180" class="image" />
    <line x1="120" y1="20" x2="120" y2="180" class="image" />
    <line x1="280" y1="20" x2="280" y2="180" class="image" />
    <!-- No seams -->
    <text x="150" y="100" class="content" fill="#E74C3C">No Seams</text>
  </g>
</svg>