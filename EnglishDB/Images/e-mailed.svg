<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">e-mailed</text>
  <text x="50" y="120" class="subtitle">[ˈiːmeɪld] v. 通过电子邮件发送</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (电子) + mail (邮件)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一封电子邮件(e-mail)从电脑屏幕上飞出，
    <tspan x="50" dy="25">就像一只信鸽(mail)，瞬间到达收件人的邮箱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She e-mailed the document to her boss.
  </text>
  <text x="50" y="310" class="content">
    她把文件通过电子邮件发给了她的老板。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Computer screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Email icon -->
    <rect x="50" y="50" width="100" height="70" class="image" />
    <line x1="60" y1="60" x2="140" y2="60" class="image" />
    <line x1="60" y1="80" x2="140" y2="80" class="image" />
    <line x1="60" y1="100" x2="140" y2="100" class="image" />
    <!-- Flying email -->
    <rect x="200" y="20" width="50" height="30" class="image" />
    <line x1="225" y1="35" x2="250" y2="50" class="image" />
    <line x1="225" y1="35" x2="200" y2="50" class="image" />
    <!-- Mailbox -->
    <rect x="250" y="100" width="50" height="70" class="image" />
    <line x1="275" y1="100" x2="275" y2="170" class="image" />
  </g>
</svg>