<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surprised</text>
  <text x="50" y="120" class="subtitle">[sərˈpraɪzd] adj. 惊讶的，惊奇的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (超过) + pris (抓住) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"超过(sur-)"预期的"抓住(pris)"了，
    <tspan x="50" dy="25">他的表情变得"惊讶(surprised)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was surprised by the sudden news.
  </text>
  <text x="50" y="310" class="content">
    她对突如其来的消息感到惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with surprised expression -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="150" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Surprised expression -->
    <circle cx="40" cy="40" r="5" class="image" /> <!-- Left eye -->
    <circle cx="60" cy="40" r="5" class="image" /> <!-- Right eye -->
    <path d="M40 60 Q50 80 60 60" class="image" /> <!-- Mouth -->
  </g>
</svg>