<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rarely</text>
  <text x="50" y="120" class="subtitle">[ˈrerli] adv. 很少，难得</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rar- (稀有的) + -ely (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个稀有的宝石，"稀有地(rar-ely)"
    <tspan x="50" dy="25">出现在市场上，人们很少(rarely)能见到它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She rarely goes to the movies.
  </text>
  <text x="50" y="310" class="content">
    她很少去看电影。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rare gem -->
    <circle cx="100" cy="100" r="30" class="image" fill="#FFD700" />
    <!-- Market -->
    <rect x="50" y="150" width="100" height="50" class="image" />
    <!-- People -->
    <circle cx="70" cy="180" r="10" class="image" />
    <circle cx="130" cy="180" r="10" class="image" />
    <!-- Rare occurrence -->
    <text x="50" y="220" class="content" fill="#E74C3C">Rare</text>
  </g>
</svg>