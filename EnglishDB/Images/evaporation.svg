<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .vapor { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evaporation</text>
  <text x="50" y="120" class="subtitle">[ɪˌvæpəˈreɪʃən] n. 蒸发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + vapor (蒸汽) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯水放在阳光下，"水(e-vapor)"
    <tspan x="50" dy="25">慢慢变成蒸汽(vapor)，最终完全消失(ation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The evaporation of the lake water caused the level to drop significantly.
  </text>
  <text x="50" y="310" class="content">
    湖水的蒸发导致水位显著下降。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="40" class="image" fill="#F39C12" />
    <!-- Vapor -->
    <line x1="50" y1="50" x2="100" y2="20" class="image" />
    <line x1="100" y1="50" x2="150" y2="20" class="image" />
    <line x1="150" y1="50" x2="200" y2="20" class="image" />
    <line x1="200" y1="50" x2="250" y2="20" class="image" />
    <line x1="250" y1="50" x2="300" y2="20" class="image" />
  </g>
</svg>