<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E9E2; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #6D4C3D; }
      .content { font: 18px sans-serif; fill: #5D4037; }
      .highlight { font-weight: bold; fill: #B22222; }
      .story { font: 16px serif; fill: #4E342E; }
      .image { stroke: #795548; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deceased</text>
  <text x="50" y="120" class="subtitle">[dɪˈsiːst] adj. 已故的，去世的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + cease (停止)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在棺材里，"向下停止(de-cease)"
    <tspan x="50" dy="25">了生命，这个人就是已故的(deceased)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The deceased was a well-known philanthropist.
  </text>
  <text x="50" y="310" class="content">
    这位已故者是一位著名的慈善家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffin -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person in coffin -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="145" y2="210" class="image" />
    <line x1="175" y1="180" x2="205" y2="210" class="image" />
    <line x1="175" y1="150" x2="125" y2="140" class="image" />
    <line x1="175" y1="150" x2="225" y2="140" class="image" />
  </g>
</svg>