<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rumble</text>
  <text x="50" y="120" class="subtitle">[ˈrʌmbl] v. 发出隆隆声，低沉地响</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rum (隆隆声) + ble (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆巨大的卡车在山谷中行驶，"隆隆(rum)"
    <tspan x="50" dy="25">作响，整个山谷都在震动，这就是rumble。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thunder rumbled in the distance.
  </text>
  <text x="50" y="310" class="content">
    雷声在远处隆隆作响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 50 L200 200 Z" class="image" />
    <path d="M100 200 L200 100 L300 200 Z" class="image" />
    <!-- Truck -->
    <rect x="120" y="150" width="100" height="50" class="image" />
    <rect x="130" y="160" width="80" height="30" class="image" />
    <!-- Wheels -->
    <circle cx="140" cy="200" r="15" class="image" />
    <circle cx="200" cy="200" r="15" class="image" />
    <!-- Rumble effect -->
    <path d="M0 220 Q150 250 300 220" class="image" />
    <path d="M0 230 Q150 260 300 230" class="image" />
  </g>
</svg>