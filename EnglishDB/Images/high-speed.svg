<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">high-speed</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪˈspiːd] adj. 高速的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> high (高) + speed (速度)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆赛车在赛道上飞驰，"高速(high-speed)"
    <tspan x="50" dy="25">的轮胎摩擦地面，留下一道道火花，速度快得让人目不暇接。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The high-speed train arrived at the station on time.
  </text>
  <text x="50" y="310" class="content">
    高速列车准时到达车站。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Race car -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="100" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Speed lines -->
    <line x1="100" y1="10" x2="120" y2="30" class="image" />
    <line x1="120" y1="10" x2="140" y2="30" class="image" />
    <line x1="140" y1="10" x2="160" y2="30" class="image" />
    <line x1="160" y1="10" x2="180" y2="30" class="image" />
    <line x1="180" y1="10" x2="200" y2="30" class="image" />
    <line x1="200" y1="10" x2="220" y2="30" class="image" />
    <line x1="220" y1="10" x2="240" y2="30" class="image" />
    <line x1="240" y1="10" x2="260" y2="30" class="image" />
    <line x1="260" y1="10" x2="280" y2="30" class="image" />
    <line x1="280" y1="10" x2="300" y2="30" class="image" />
  </g>
</svg>