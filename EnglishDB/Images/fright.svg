<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fright</text>
  <text x="50" y="120" class="subtitle">[fraɪt] n. 惊吓，恐怖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frigh (害怕)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在夜晚的森林中，突然看到一只巨大的幽灵，
    <tspan x="50" dy="25">"害怕(frigh)"得魂飞魄散，这就是"惊吓(fright)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sudden noise gave her a fright.
  </text>
  <text x="50" y="310" class="content">
    突如其来的噪音吓了她一跳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ghost -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="140" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
    <line x1="100" y1="180" x2="70" y2="200" class="image" />
    <line x1="100" y1="180" x2="130" y2="200" class="image" />
    <!-- Person -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Exclamation marks -->
    <text x="240" y="90" class="highlight">!</text>
    <text x="230" y="80" class="highlight">!</text>
    <text x="220" y="70" class="highlight">!</text>
  </g>
</svg>