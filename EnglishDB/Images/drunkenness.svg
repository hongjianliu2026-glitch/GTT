<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drunkenness</text>
  <text x="50" y="120" class="subtitle">[ˈdrʌŋkənnəs] n. 醉酒，酗酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drunk (醉的) + -en (使) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人喝得酩酊大醉，"使(en)"
    <tspan x="50" dy="25">自己变得"醉(drunk)"，这种状态就是"醉酒(drunkenness)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His drunkenness led to a series of embarrassing incidents.
  </text>
  <text x="50" y="310" class="content">
    他的醉酒导致了一系列尴尬的事件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <!-- Bottle -->
    <rect x="100" y="80" width="40" height="120" class="image" />
    <circle cx="120" cy="70" r="10" class="image" />
    <!-- Droplets -->
    <circle cx="140" cy="100" r="5" class="image" />
    <circle cx="150" cy="120" r="5" class="image" />
    <circle cx="160" cy="140" r="5" class="image" />
  </g>
</svg>