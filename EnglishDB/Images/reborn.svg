<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reborn</text>
  <text x="50" y="120" class="subtitle">[ˌriˈbɔːrn] adj. 重生的，再生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + born (出生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶从茧中"再次出生(re-born)"，
    <tspan x="50" dy="25">象征着重生和新的开始。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the accident, she felt reborn.
  </text>
  <text x="50" y="310" class="content">
    事故之后，她感觉自己重生了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cocoon -->
    <path d="M 0 100 Q 50 50 100 100 Q 150 150 200 100 Q 250 50 300 100" class="image" />
    <!-- Butterfly -->
    <path d="M 150 100 Q 100 50 150 0 Q 200 50 150 100" class="image" />
    <path d="M 150 100 Q 100 150 150 200 Q 200 150 150 100" class="image" />
    <!-- Wings -->
    <path d="M 150 100 Q 120 70 150 40 Q 180 70 150 100" class="image" />
    <path d="M 150 100 Q 120 130 150 160 Q 180 130 150 100" class="image" />
  </g>
</svg>