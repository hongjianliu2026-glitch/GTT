<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vignette</text>
  <text x="50" y="120" class="subtitle">[vɪˈnɛt] n. 小插图，装饰图案；v. 使边缘模糊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vig (生命) + nette (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一幅画，"生命(vig)"的边缘被"模糊(nette)"，
    <tspan x="50" dy="25">形成了一个柔和的小插图(vignette)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The book cover featured a beautiful vignette of a rose.
  </text>
  <text x="50" y="310" class="content">
    书的封面有一幅美丽的玫瑰小插图。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Frame -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Blurred edge -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Rose -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="170" x2="150" y2="180" class="image" />
    <line x1="175" y1="170" x2="200" y2="180" class="image" />
    <line x1="175" y1="190" x2="150" y2="200" class="image" />
    <line x1="175" y1="190" x2="200" y2="200" class="image" />
  </g>
</svg>