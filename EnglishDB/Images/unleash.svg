<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unleash</text>
  <text x="50" y="120" class="subtitle">[ʌnˈliːʃ] v. 释放，解开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + leash (束缚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只被束缚的猛兽，"解开(un-leash)"
    <tspan x="50" dy="25">它的锁链，它立刻冲向自由，释放出无尽的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coach's speech unleashed the team's potential.
  </text>
  <text x="50" y="310" class="content">
    教练的演讲激发了团队的潜力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chain -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Broken chain -->
    <line x1="150" y1="0" x2="150" y2="100" class="image" />
    <!-- Beast -->
    <circle cx="250" cy="50" r="30" class="image" />
    <line x1="250" y1="80" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="200" y2="200" class="image" />
    <line x1="250" y1="150" x2="300" y2="200" class="image" />
    <line x1="250" y1="120" x2="350" y2="100" class="image" />
  </g>
</svg>