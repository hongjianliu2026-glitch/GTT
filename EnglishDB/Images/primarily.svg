<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">primarily</text>
  <text x="50" y="120" class="subtitle">[praɪˈmerəli] adv. 主要地，首要地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prim (第一) + -ary (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“1”站在一群数字前面，它骄傲地说：“我是第一(prim)，主要地(primarily)！”
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event was primarily attended by students.
  </text>
  <text x="50" y="310" class="content">
    这个活动主要是由学生参加的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large number "1" -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <line x1="50" y1="50" x2="20" y2="80" class="image" />
    <line x1="50" y1="50" x2="80" y2="80" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />

    <!-- Smaller numbers "2" and "3" -->
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="100" x2="120" y2="130" class="image" />
    <line x1="150" y1="100" x2="180" y2="130" class="image" />
    <line x1="150" y1="150" x2="120" y2="180" class="image" />
    <line x1="150" y1="150" x2="180" y2="180" class="image" />

    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="100" x2="220" y2="130" class="image" />
    <line x1="250" y1="100" x2="280" y2="130" class="image" />
    <line x1="250" y1="150" x2="220" y2="180" class="image" />
    <line x1="250" y1="150" x2="280" y2="180" class="image" />
  </g>
</svg>