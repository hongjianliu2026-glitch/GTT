<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brook</text>
  <text x="50" y="120" class="subtitle">[brʊk] n. 小溪；v. 容忍，忍受</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brok (小溪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条小溪(brook)在山间流淌，
    <tspan x="50" dy="25">它静静地流过，仿佛在"容忍(brook)"一切阻碍。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hiker followed the brook through the forest.
  </text>
  <text x="50" y="310" class="content">
    徒步者沿着小溪穿越森林。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brook -->
    <path d="M0 100 Q50 50 100 100 T200 100 T300 100 T400 100" class="image" />
    <!-- Rocks -->
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="350" cy="100" r="10" class="image" />
    <!-- Trees -->
    <line x1="20" y1="80" x2="20" y2="20" class="image" />
    <line x1="20" y1="20" x2="10" y2="30" class="image" />
    <line x1="20" y1="20" x2="30" y2="30" class="image" />
    <line x1="380" y1="80" x2="380" y2="20" class="image" />
    <line x1="380" y1="20" x2="370" y2="30" class="image" />
    <line x1="380" y1="20" x2="390" y2="30" class="image" />
  </g>
</svg>