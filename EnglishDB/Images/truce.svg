<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">truce</text>
  <text x="50" y="120" class="subtitle">[truːs] n. 停战，休战</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> truce (来自拉丁语 "trux"，意为 "严厉的"，引申为 "停止" 或 "暂停")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两支军队在战场上，"严厉地(trux)"
    <tspan x="50" dy="25">决定暂时停止战斗，达成一个停战协议(truce)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two sides agreed to a truce to discuss peace terms.
  </text>
  <text x="50" y="310" class="content">
    双方同意停战以讨论和平条款。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soldiers -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Hands shaking -->
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <line x1="70" y1="100" x2="175" y2="120" class="image" />
    <line x1="280" y1="100" x2="175" y2="120" class="image" />
    <!-- Peace sign -->
    <line x1="175" y1="120" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
  </g>
</svg>