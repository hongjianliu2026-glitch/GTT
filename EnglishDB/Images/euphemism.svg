<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">euphemism</text>
  <text x="50" y="120" class="subtitle">[ˈjuːfəˌmɪzəm] n. 委婉语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eu- (好) + phemi (说) + -ism (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在说"好听的话(eu-phemi-sm)"，
    <tspan x="50" dy="25">用委婉的方式表达不那么愉快的事情，这就是委婉语(euphemism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a euphemism to describe her job loss.
  </text>
  <text x="50" y="310" class="content">
    她用委婉语描述了她的失业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Speech bubble -->
    <path d="M 80 30 Q 150 30 150 60 L 150 100 Q 150 130 120 130 L 90 130 Q 60 130 60 100 Z" class="image" />
    <!-- Text in speech bubble -->
    <text x="90" y="80" class="content" text-anchor="middle">好听的话</text>
    <!-- Person -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="90" x2="30" y2="80" class="image" />
    <line x1="50" y1="90" x2="70" y2="80" class="image" />
    <line x1="50" y1="120" x2="30" y2="140" class="image" />
    <line x1="50" y1="120" x2="70" y2="140" class="image" />
  </g>
</svg>