<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">geek</text>
  <text x="50" y="120" class="subtitle">[ɡiːk] n. 极客，怪才</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> geek (源自马戏团表演中的“怪人”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个极客(geek)，他戴着厚厚的眼镜，
    <tspan x="50" dy="25">手里拿着一本厚厚的编程书，周围堆满了电脑零件。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a computer geek who knows everything about coding.
  </text>
  <text x="50" y="310" class="content">
    他是一个对编程无所不知的电脑极客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Geek -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Glasses -->
    <line x1="10" y1="95" x2="30" y2="95" class="image" />
    <line x1="15" y1="90" x2="25" y2="90" class="image" />
    <line x1="15" y1="100" x2="25" y2="100" class="image" />
    <!-- Book -->
    <rect x="50" y="80" width="100" height="40" class="image" />
    <line x1="55" y1="85" x2="145" y2="85" class="image" />
    <line x1="55" y1="95" x2="145" y2="95" class="image" />
    <line x1="55" y1="105" x2="145" y2="105" class="image" />
    <!-- Computer parts -->
    <rect x="160" y="80" width="40" height="40" class="image" />
    <rect x="210" y="80" width="40" height="40" class="image" />
    <rect x="260" y="80" width="40" height="40" class="image" />
  </g>
</svg>