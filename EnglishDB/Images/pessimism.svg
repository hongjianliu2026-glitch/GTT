<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pessimism</text>
  <text x="50" y="120" class="subtitle">[ˈpɛsɪˌmɪzəm] n. 悲观主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pess (最坏) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人总是看到事情的"最坏(pess)"一面，
    <tspan x="50" dy="25">这种态度就是"悲观主义(pessimism)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His pessimism about the future was unfounded.
  </text>
  <text x="50" y="310" class="content">
    他对未来的悲观是没有根据的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Raindrops -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <line x1="200" y1="150" x2="200" y2="250" class="image" />
    <line x1="250" y1="150" x2="250" y2="250" class="image" />
    <!-- Person with umbrella -->
    <circle cx="175" cy="280" r="20" class="image" />
    <line x1="175" y1="300" x2="175" y2="350" class="image" />
    <line x1="175" y1="350" x2="150" y2="380" class="image" />
    <line x1="175" y1="350" x2="200" y2="380" class="image" />
    <line x1="175" y1="320" x2="125" y2="320" class="image" />
    <line x1="175" y1="320" x2="225" y2="320" class="image" />
  </g>
</svg>