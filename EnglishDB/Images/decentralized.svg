<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decentralized</text>
  <text x="50" y="120" class="subtitle">[diːˈsɛntrəˌlaɪzd] adj. 分散的，去中心化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + central (中心) + -ize (使) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的中心控制室，突然所有的控制器都"离开(de-)"了中心，
    <tspan x="50" dy="25">分散到各个角落，形成了一个去中心化的系统(decentralized)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new system is designed to be decentralized, reducing the risk of a single point of failure.
  </text>
  <text x="50" y="310" class="content">
    新系统设计为去中心化，以减少单点故障的风险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Central control room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Central control panel -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Decentralized control panels -->
    <rect x="10" y="20" width="50" height="50" class="image" />
    <rect x="300" y="20" width="50" height="50" class="image" />
    <rect x="10" y="150" width="50" height="50" class="image" />
    <rect x="300" y="150" width="50" height="50" class="image" />
    <!-- Arrows showing decentralization -->
    <line x1="150" y1="100" x2="35" y2="45" class="image" />
    <line x1="150" y1="100" x2="315" y2="45" class="image" />
    <line x1="150" y1="100" x2="35" y2="175" class="image" />
    <line x1="150" y1="100" x2="315" y2="175" class="image" />
    <polygon points="150,100 140,90 160,90" class="image" />
    <polygon points="35,45 25,35 45,35" class="image" />
    <polygon points="315,45 305,35 325,35" class="image" />
    <polygon points="35,175 25,165 45,165" class="image" />
    <polygon points="315,175 305,165 325,165" class="image" />
  </g>
</svg>