<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yo-yo</text>
  <text x="50" y="120" class="subtitle">[ˈjoʊjoʊ] n. 悠悠球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> yo-yo (源自菲律宾语，意为“来来去去”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩在公园里，手里拿着一个悠悠球，"来来去去(yo-yo)"
    <tspan x="50" dy="25">地玩耍，这个玩具就叫做悠悠球(yo-yo)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child was playing with a yo-yo in the park.
  </text>
  <text x="50" y="310" class="content">
    孩子在公园里玩悠悠球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Yo-yo string -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <!-- Yo-yo body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Hand holding the string -->
    <circle cx="100" cy="220" r="20" class="image" />
    <line x1="100" y1="220" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="280" class="image" />
    <line x1="100" y1="250" x2="120" y2="280" class="image" />
  </g>
</svg>