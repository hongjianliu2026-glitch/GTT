<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">windowsill</text>
  <text x="50" y="120" class="subtitle">[ˈwɪndoʊsɪl] n. 窗台</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> window (窗户) + sill (底座)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫懒洋洋地躺在"窗户底座(window-sill)"上，
    <tspan x="50" dy="25">享受着阳光的温暖，这就是窗台(windowsill)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat loves to sit on the windowsill and watch the birds.
  </text>
  <text x="50" y="310" class="content">
    这只猫喜欢坐在窗台上看着鸟儿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Window frame -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Window sill -->
    <rect x="50" y="180" width="200" height="20" class="image" />
    <!-- Cat -->
    <circle cx="150" cy="160" r="20" class="image" />
    <line x1="150" y1="180" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="220" class="image" />
    <line x1="150" y1="200" x2="170" y2="220" class="image" />
    <line x1="150" y1="190" x2="120" y2="180" class="image" />
    <line x1="150" y1="190" x2="180" y2="180" class="image" />
  </g>
</svg>