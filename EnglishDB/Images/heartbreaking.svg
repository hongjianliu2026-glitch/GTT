<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heartbreaking</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrtbreɪkɪŋ] adj. 令人心碎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heart (心) + break (打破) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗心被"打破(break)"，碎片散落一地，
    <tspan x="50" dy="25">这种场景让人感到无比心碎(heartbreaking)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie's ending was heartbreaking.
  </text>
  <text x="50" y="310" class="content">
    电影的结局令人心碎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Broken heart -->
    <path d="M50,50 Q100,20 150,50 T250,50" class="image" />
    <path d="M50,50 Q100,80 150,50 T250,50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <!-- Heart fragments -->
    <circle cx="70" cy="70" r="10" class="image" />
    <circle cx="130" cy="70" r="10" class="image" />
    <circle cx="190" cy="70" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
  </g>
</svg>