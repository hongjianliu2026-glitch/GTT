<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outrageous</text>
  <text x="50" y="120" class="subtitle">[aʊtˈreɪdʒəs] adj. 极不公正的，令人震惊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (超出) + rage (愤怒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人愤怒到"超出(out-)"了正常范围，
    <tspan x="50" dy="25">他的行为变得"令人震惊(outrageous)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The price of the ticket was outrageous.
  </text>
  <text x="50" y="310" class="content">
    票的价格高得离谱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="90" y1="140" x2="110" y2="140" class="image" />
    <line x1="100" y1="160" x2="100" y2="180" class="image" />
    <line x1="80" y1="170" x2="60" y2="150" class="image" />
    <line x1="120" y1="170" x2="140" y2="150" class="image" />

    <!-- Exclamation mark -->
    <line x1="160" y1="80" x2="160" y2="180" class="image" />
    <circle cx="160" cy="70" r="10" class="image" />
  </g>
</svg>