<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dislike</text>
  <text x="50" y="120" class="subtitle">[dɪsˈlaɪk] v. 不喜欢，厌恶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + like (喜欢)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到一个他不喜欢的食物，"不(dis-)"
    <tspan x="50" dy="25">喜欢(like)"，他皱起眉头，表示厌恶(dislike)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She dislikes spicy food.
  </text>
  <text x="50" y="310" class="content">
    她不喜欢辣的食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Food -->
    <rect x="120" y="50" width="100" height="50" class="image" />
    <!-- Dislike expression -->
    <line x1="40" y1="40" x2="60" y2="40" class="image" />
    <line x1="40" y1="40" x2="35" y2="35" class="image" />
    <line x1="60" y1="40" x2="65" y2="35" class="image" />
    <line x1="45" y1="60" x2="55" y2="60" class="image" />
    <line x1="45" y1="60" x2="40" y2="65" class="image" />
    <line x1="55" y1="60" x2="60" y2="65" class="image" />
  </g>
</svg>