<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">critic</text>
  <text x="50" y="120" class="subtitle">[ˈkrɪtɪk] n. 批评家，评论家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crit (判断) + -ic (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着眼镜的评论家，"判断(crit)"
    <tspan x="50" dy="25">着艺术作品，他的判断力让他成为了一个批评家(critic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The critic gave a negative review of the movie.
  </text>
  <text x="50" y="310" class="content">
    这位评论家对这部电影给出了负面评价。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glasses -->
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="40" class="image" />
    <line x1="150" y1="20" x2="150" y2="40" class="image" />
    <line x1="100" y1="40" x2="100" y2="60" class="image" />
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Mouth -->
    <line x1="70" y1="130" x2="130" y2="130" class="image" />
    <!-- Paper -->
    <rect x="200" y="20" width="150" height="160" class="image" />
    <!-- Pen -->
    <line x1="220" y1="100" x2="280" y2="100" class="image" />
    <line x1="220" y1="100" x2="220" y2="120" class="image" />
  </g>
</svg>