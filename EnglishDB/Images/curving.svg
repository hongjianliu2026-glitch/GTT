<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">curving</text>
  <text x="50" y="120" class="subtitle">[ˈkɜːrvɪŋ] adj. 弯曲的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> curv (弯曲) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条蛇在草地上"弯曲(curv)"前行，
    <tspan x="50" dy="25">它的身体呈现出优美的曲线，这就是"弯曲的(curving)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The road ahead was curving gently through the mountains.
  </text>
  <text x="50" y="310" class="content">
    前方的道路在群山中缓缓弯曲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snake -->
    <path d="M0,0 C50,100 150,100 200,0" class="image" />
    <!-- Grass -->
    <rect x="0" y="200" width="200" height="50" class="image" />
    <!-- Snake head -->
    <circle cx="200" cy="0" r="15" class="image" />
  </g>
</svg>