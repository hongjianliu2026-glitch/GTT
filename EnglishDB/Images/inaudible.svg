<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inaudible</text>
  <text x="50" y="120" class="subtitle">[ˌɪnˈɔːdəbl] adj. 听不见的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + aud (听) + -ible (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的喇叭前，但喇叭发出的声音却"听不见(inaudible)"，
    <tspan x="50" dy="25">因为声音太小或者被其他噪音掩盖了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher's voice was inaudible over the noise of the construction.
  </text>
  <text x="50" y="310" class="content">
    老师的声音被建筑噪音掩盖，听不见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large speaker -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Sound waves (inaudible) -->
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <line x1="100" y1="160" x2="250" y2="160" class="image" />
    <line x1="100" y1="170" x2="250" y2="170" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>