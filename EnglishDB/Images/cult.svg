<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cult</text>
  <text x="50" y="120" class="subtitle">[kʌlt] n. 崇拜，狂热崇拜；邪教</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cult (耕作，培养)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围着一棵"培养(cult)"出来的巨大植物，
    <tspan x="50" dy="25">他们疯狂地崇拜它，这就是"cult"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie has a cult following among sci-fi fans.
  </text>
  <text x="50" y="310" class="content">
    这部电影在科幻迷中有一群狂热追随者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant plant -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
    <line x1="175" y1="180" x2="135" y2="200" class="image" />
    <line x1="175" y1="180" x2="215" y2="200" class="image" />
    <line x1="175" y1="180" x2="155" y2="200" class="image" />
    <line x1="175" y1="180" x2="195" y2="200" class="image" />
    <!-- Worshippers -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="85" y2="200" class="image" />
    <line x1="100" y1="180" x2="115" y2="200" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <line x1="250" y1="165" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="235" y2="200" class="image" />
    <line x1="250" y1="180" x2="265" y2="200" class="image" />
  </g>
</svg>