<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ark</text>
  <text x="50" y="120" class="subtitle">[ɑːrk] n. 方舟，避难所</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ark (船，避难所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象诺亚方舟(ark)在大洪水中，
    <tspan x="50" dy="25">成为所有生物的避难所，保护它们免受灾难。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ark saved many species from extinction.
  </text>
  <text x="50" y="310" class="content">
    方舟拯救了许多物种免于灭绝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ark -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Roof -->
    <polygon points="50,20 300,20 275,0 75,0" class="image" />
    <!-- Windows -->
    <rect x="80" y="50" width="50" height="50" class="image" />
    <rect x="220" y="50" width="50" height="50" class="image" />
    <!-- Animals -->
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="180" class="image" />
    <line x1="250" y1="165" x2="250" y2="180" class="image" />
    <line x1="90" y1="180" x2="110" y2="180" class="image" />
    <line x1="240" y1="180" x2="260" y2="180" class="image" />
  </g>
</svg>