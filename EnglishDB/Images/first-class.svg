<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">first-class</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrst klæs] adj. 一流的，头等的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> first (第一) + class (等级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个乘客坐在飞机的"第一等级(first-class)"座位上，
    <tspan x="50" dy="25">享受着最顶级的服务和舒适，这就是一流的体验。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hotel offers first-class service to all its guests.
  </text>
  <text x="50" y="310" class="content">
    这家酒店为所有客人提供一流的服务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airplane seat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- First-class seat -->
    <rect x="70" y="40" width="80" height="120" class="image" />
    <rect x="170" y="40" width="80" height="120" class="image" />
    <!-- Passenger -->
    <circle cx="110" cy="100" r="15" class="image" />
    <line x1="110" y1="115" x2="110" y2="150" class="image" />
    <line x1="110" y1="150" x2="90" y2="180" class="image" />
    <line x1="110" y1="150" x2="130" y2="180" class="image" />
    <line x1="110" y1="130" x2="140" y2="120" class="image" />
    <!-- First-class sign -->
    <text x="100" y="20" class="highlight" font-size="24">First Class</text>
  </g>
</svg>