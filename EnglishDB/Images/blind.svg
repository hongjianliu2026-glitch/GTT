<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blind</text>
  <text x="50" y="120" class="subtitle">[blaɪnd] adj. 盲的，看不见的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blind (原意为“黑暗的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被蒙上了眼睛，"黑暗(blind)"
    <tspan x="50" dy="25">笼罩了他的视线，他看不见任何东西。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The blind man relied on his cane to navigate.
  </text>
  <text x="50" y="310" class="content">
    那位盲人依靠他的手杖来导航。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blindfold -->
    <rect x="50" y="20" width="250" height="30" class="image" />
    <!-- Eyes -->
    <circle cx="100" cy="80" r="20" class="image" />
    <circle cx="200" cy="80" r="20" class="image" />
    <!-- Person -->
    <circle cx="150" cy="150" r="30" class="image" />
    <line x1="150" y1="180" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="120" y2="300" class="image" />
    <line x1="150" y1="250" x2="180" y2="300" class="image" />
    <line x1="150" y1="200" x2="100" y2="180" class="image" />
    <line x1="150" y1="200" x2="200" y2="180" class="image" />
  </g>
</svg>