<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">specification</text>
  <text x="50" y="120" class="subtitle">[ˌspesɪfɪˈkeɪʃn] n. 规格，说明书</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> speci (看) + fic (做) + ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工程师在仔细"查看(speci)"并"制作(fic)"
    <tspan x="50" dy="25">一份详细的说明书，这份说明书就是规格(specification)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The product was designed according to the specification.
  </text>
  <text x="50" y="310" class="content">
    该产品是根据规格设计的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Engineer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Document -->
    <rect x="70" y="20" width="250" height="200" class="image" />
    <line x1="80" y1="50" x2="310" y2="50" class="image" />
    <line x1="80" y1="80" x2="310" y2="80" class="image" />
    <line x1="80" y1="110" x2="310" y2="110" class="image" />
    <line x1="80" y1="140" x2="310" y2="140" class="image" />
    <line x1="80" y1="170" x2="310" y2="170" class="image" />
    <line x1="80" y1="200" x2="310" y2="200" class="image" />
    <!-- Magnifying glass -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="350" y2="120" class="image" />
  </g>
</svg>