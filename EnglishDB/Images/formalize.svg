<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">formalize</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrməlaɪz] v. 使正式化，使形式化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> form (形式) + -al (形容词后缀) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着正式西装的人，手里拿着一份合同，
    <tspan x="50" dy="25">正在"形式化(formalize)"一个协议，使其具有法律效力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to formalize the partnership with a written agreement.
  </text>
  <text x="50" y="310" class="content">
    公司决定通过书面协议使合作伙伴关系正式化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Formal suit -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="10" y="10" width="80" height="180" class="image" />
    <!-- Tie -->
    <rect x="40" y="10" width="20" height="50" class="image" />
    <!-- Contract -->
    <rect x="120" y="50" width="150" height="100" class="image" />
    <line x1="130" y1="60" x2="260" y2="60" class="image" />
    <line x1="130" y1="80" x2="250" y2="80" class="image" />
    <line x1="130" y1="100" x2="270" y2="100" class="image" />
    <line x1="130" y1="120" x2="240" y2="120" class="image" />
  </g>
</svg>