<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resistance</text>
  <text x="50" y="120" class="subtitle">[rɪˈzɪstəns] n. 抵抗，阻力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (反) + sist (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面对巨大的力量，"反向站立(re-sist)"
    <tspan x="50" dy="25">以抵抗(resistance)，画面中他像一座山一样坚定。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The resistance of the crowd was strong.
  </text>
  <text x="50" y="310" class="content">
    人群的抵抗非常强烈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,150 100,0 200,150" class="image" />
    <!-- Person -->
    <circle cx="100" cy="130" r="15" class="image" />
    <line x1="100" y1="145" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <line x1="100" y1="160" x2="130" y2="150" class="image" />
    <!-- Force arrow -->
    <line x1="220" y1="150" x2="120" y2="150" class="image" />
    <polygon points="220,150 210,145 210,155" class="image" />
  </g>
</svg>