<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">effigy</text>
  <text x="50" y="120" class="subtitle">[ˈɛfɪdʒi] n. 肖像，模拟像</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ef- (出) + fig (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家"做出(fig)"一个逼真的"肖像(effigy)"，
    <tspan x="50" dy="25">这个肖像如此逼真，仿佛要从画布上"出来(ef-)"一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The protesters burned an effigy of the president.
  </text>
  <text x="50" y="310" class="content">
    抗议者焚烧了总统的模拟像。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Effigy -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Head -->
    <circle cx="100" cy="50" r="40" class="image" />
    <!-- Body -->
    <line x1="100" y1="90" x2="100" y2="250" class="image" />
    <!-- Arms -->
    <line x1="100" y1="120" x2="50" y2="180" class="image" />
    <line x1="100" y1="120" x2="150" y2="180" class="image" />
    <!-- Legs -->
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
  </g>
</svg>