<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lava { fill: #FF4500; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lava</text>
  <text x="50" y="120" class="subtitle">[ˈlɑːvə] n. 熔岩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "lavare" (洗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象火山喷发，熔岩(lava)像"洗礼(lavare)"一样
    <tspan x="50" dy="25">从地壳中涌出，覆盖大地，形成壮观的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The volcano erupted, spewing lava across the landscape.
  </text>
  <text x="50" y="310" class="content">
    火山爆发，熔岩喷涌而出，覆盖了整个地貌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Volcano -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Lava flow -->
    <rect x="50" y="180" width="200" height="50" class="lava" />
    <rect x="70" y="230" width="160" height="50" class="lava" />
    <rect x="90" y="280" width="120" height="50" class="lava" />
  </g>
</svg>