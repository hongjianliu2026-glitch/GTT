<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">profoundly</text>
  <text x="50" y="120" class="subtitle">[prəˈfaʊndli] adv. 深深地，深刻地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + found (基础)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在地面上，"向前深入(pro-found)"
    <tspan x="50" dy="25">到地心，这种深入的感觉就是profoundly。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was profoundly moved by the movie.
  </text>
  <text x="50" y="310" class="content">
    她被这部电影深深地打动了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Person -->
    <circle cx="175" cy="160" r="20" class="image" />
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="230" class="image" />
    <line x1="175" y1="200" x2="195" y2="230" class="image" />
    <line x1="175" y1="200" x2="175" y2="250" class="image" />
    <!-- Arrow -->
    <line x1="175" y1="160" x2="175" y2="100" class="image" />
    <polygon points="170,100 180,100 175,90" class="image" />
  </g>
</svg>