<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">agony</text>
  <text x="50" y="120" class="subtitle">[ˈæɡəni] n. 极度痛苦，苦恼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ag (做) + ony (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在"做(ag)"某事时，
    <tspan x="50" dy="25">突然遭遇了极大的痛苦，这种痛苦就是"agony"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The athlete was in agony after the injury.
  </text>
  <text x="50" y="310" class="content">
    运动员受伤后痛苦不堪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in agony -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <!-- Pain expression -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
    <line x1="40" y1="110" x2="35" y2="105" class="image" />
    <line x1="60" y1="110" x2="65" y2="105" class="image" />
  </g>
</svg>