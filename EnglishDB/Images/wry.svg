<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wry</text>
  <text x="50" y="120" class="subtitle">[raɪ] adj. 扭曲的，歪斜的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wr- (扭曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为笑得太厉害，脸都"扭曲(wr-)"了，
    <tspan x="50" dy="25">形成了一个歪斜的笑容，这就是wry的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave a wry smile when she heard the joke.
  </text>
  <text x="50" y="310" class="content">
    她听到笑话时露出了一个歪斜的笑容。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="80" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 60 120 Q 100 140 140 120" class="image" />
    <!-- Wry expression -->
    <line x1="80" y1="85" x2="70" y2="95" class="image" />
    <line x1="120" y1="85" x2="130" y2="95" class="image" />
  </g>
</svg>