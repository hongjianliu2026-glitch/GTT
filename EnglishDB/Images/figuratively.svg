<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">figuratively</text>
  <text x="50" y="120" class="subtitle">[ˈfɪɡjərətɪvli] adv. 比喻地，象征性地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> figure (形状，形象) + -ative (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在画板上用"形象(figure)"来表达抽象的概念，
    <tspan x="50" dy="25">比如用一只鸟代表自由，这就是"比喻地(figuratively)"表达。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He described the situation figuratively as a storm.
  </text>
  <text x="50" y="310" class="content">
    他比喻性地将情况描述为一场风暴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Drawing board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bird -->
    <path d="M50,50 Q100,20 150,50 T250,50" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="130" y1="70" x2="150" y2="60" class="image" />
    <line x1="170" y1="70" x2="150" y2="60" class="image" />
    <!-- Person -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>