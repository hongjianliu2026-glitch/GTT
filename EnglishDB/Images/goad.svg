<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">goad</text>
  <text x="50" y="120" class="subtitle">[ɡoʊd] v. 驱使，刺激；n. 刺棒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> go- (走) + ad (朝向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头牛被"刺棒(goad)"驱使着，"朝前走(go-ad)"，
    <tspan x="50" dy="25">它不得不前进，因为刺棒在背后不断刺激它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coach's criticism goaded the team into improving their performance.
  </text>
  <text x="50" y="310" class="content">
    教练的批评刺激了队伍，促使他们提高表现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cow -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Goad -->
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <line x1="180" y1="100" x2="160" y2="80" class="image" />
    <line x1="180" y1="100" x2="160" y2="120" class="image" />
    <!-- Direction arrow -->
    <polygon points="200,100 220,90 220,110" class="image" />
  </g>
</svg>