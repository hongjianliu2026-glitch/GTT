<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">countenance</text>
  <text x="50" y="120" class="subtitle">[ˈkaʊntənəns] n. 面容，表情；v. 支持，赞成</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> count (考虑) + ten (保持) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在深思熟虑后，"保持(ten)"
    <tspan x="50" dy="25">他的表情(countenance)，这个表情可能</tspan>
    <tspan x="50" dy="25">显示了他对某事的赞成或反对。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her countenance showed her disapproval.
  </text>
  <text x="50" y="310" class="content">
    她的表情显示了她的不赞成。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="85" r="5" class="image" />
    <circle cx="125" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" />
    <!-- Thought bubble -->
    <path d="M 150 50 Q 200 20 250 50 Q 200 80 150 50" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
  </g>
</svg>