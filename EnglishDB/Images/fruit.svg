<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fruit</text>
  <text x="50" y="120" class="subtitle">[fruːt] n. 水果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fru- (果实)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵树上结满了各种水果，"果实(fru-)"
    <tspan x="50" dy="25">在阳光下闪闪发光，这就是水果(fruit)的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat fresh fruit every day.
  </text>
  <text x="50" y="310" class="content">
    她每天都喜欢吃新鲜的水果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <!-- Fruits -->
    <circle cx="80" cy="50" r="20" fill="#FF6F61" />
    <circle cx="120" cy="70" r="20" fill="#FFCC29" />
    <circle cx="140" cy="100" r="20" fill="#88D8C0" />
    <circle cx="60" cy="120" r="20" fill="#FF6F61" />
    <circle cx="100" cy="150" r="20" fill="#FFCC29" />
    <!-- Leaves -->
    <path d="M50,20 Q75,10 100,20 T150,20" fill="none" stroke="#27AE60" stroke-width="5" />
    <path d="M50,40 Q75,30 100,40 T150,40" fill="none" stroke="#27AE60" stroke-width="5" />
    <path d="M50,60 Q75,50 100,60 T150,60" fill="none" stroke="#27AE60" stroke-width="5" />
  </g>
</svg>