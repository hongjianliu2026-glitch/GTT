<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Martian</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrʃən] n. 火星人，火星的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Marti- (火星) + -an (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个火星人(Martian)，头上长着两个触角，
    <tspan x="50" dy="25">眼睛大得像灯泡，站在红色的火星表面，</tspan>
    <tspan x="50" dy="25">手里拿着一个奇怪的仪器，正在探索地球。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie depicts Martians as intelligent beings.
  </text>
  <text x="50" y="310" class="content">
    这部电影将火星人描绘成智慧生物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mars surface -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#FF4500" />
    <!-- Martian -->
    <circle cx="100" cy="100" r="30" class="image" fill="#8B4513" />
    <line x1="80" y1="80" x2="120" y2="80" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <circle cx="90" cy="90" r="5" class="image" fill="#FFFFFF" />
    <circle cx="110" cy="90" r="5" class="image" fill="#FFFFFF" />
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="90" y2="150" class="image" />
    <line x1="100" y1="130" x2="110" y2="150" class="image" />
    <!-- Strange instrument -->
    <rect x="130" y="80" width="50" height="40" class="image" fill="#000000" />
    <line x1="155" y1="80" x2="155" y2="40" class="image" />
    <circle cx="155" cy="35" r="5" class="image" fill="#FFD700" />
  </g>
</svg>