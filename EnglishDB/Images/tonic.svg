<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tonic</text>
  <text x="50" y="120" class="subtitle">[ˈtɒnɪk] n. 补药，滋补品；adj. 滋补的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ton (音调，紧张) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的人喝下一瓶"音调(ton)"恢复剂，
    <tspan x="50" dy="25">立刻感到精力充沛，这就是滋补品(tonic)的效果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She drinks a tonic every morning to boost her energy.
  </text>
  <text x="50" y="310" class="content">
    她每天早上喝一种滋补品来提升精力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="30" class="image" />
    <!-- Liquid -->
    <rect x="10" y="20" width="80" height="180" fill="#1ABC9C" />
    <!-- Person -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="170" y2="250" class="image" />
    <line x1="200" y1="200" x2="230" y2="250" class="image" />
    <line x1="200" y1="150" x2="150" y2="140" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
    <!-- Energy lines -->
    <line x1="200" y1="100" x2="150" y2="50" class="image" />
    <line x1="200" y1="100" x2="250" y2="50" class="image" />
  </g>
</svg>