<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">institutionalized</text>
  <text x="50" y="120" class="subtitle">[ˌɪnstɪˈtjuːʃənəlaɪzd] adj. 制度化的，被收容的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> institution (机构) + -al (形容词后缀) + -ize (使动) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"机构化(institutionalized)"，
    <tspan x="50" dy="25">他被困在一个巨大的笼子里，周围是冰冷的墙壁，</tspan>
    <tspan x="50" dy="25">象征着他被制度所束缚，无法逃脱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The treatment was so harsh that it institutionalized him.
  </text>
  <text x="50" y="310" class="content">
    这种治疗如此严厉，以至于他被制度化了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Person in cage -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>