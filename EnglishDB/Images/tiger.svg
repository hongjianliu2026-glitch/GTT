<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tiger { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tiger</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪɡər] n. 老虎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tigris (希腊语，意为“虎”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只威猛的<tspan class="highlight">老虎(tiger)</tspan>
    <tspan x="50" dy="25">在丛林中咆哮，它的力量和威严让人敬畏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tiger roared loudly, scaring away all the animals.
  </text>
  <text x="50" y="310" class="content">
    老虎大声咆哮，吓跑了所有的动物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tiger head -->
    <circle cx="100" cy="100" r="60" class="tiger" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Nose -->
    <circle cx="100" cy="120" r="15" class="image" />
    <!-- Mouth -->
    <path d="M 60 140 Q 100 160 140 140" class="image" />
    <!-- Ears -->
    <path d="M 40 60 Q 60 40 80 60" class="image" />
    <path d="M 120 60 Q 140 40 160 60" class="image" />
    <!-- Whiskers -->
    <line x1="40" y1="100" x2="20" y2="90" class="image" />
    <line x1="40" y1="110" x2="20" y2="120" class="image" />
    <line x1="160" y1="100" x2="180" y2="90" class="image" />
    <line x1="160" y1="110" x2="180" y2="120" class="image" />
  </g>
</svg>