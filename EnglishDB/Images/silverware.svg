<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">silverware</text>
  <text x="50" y="120" class="subtitle">[ˈsɪlvərwer] n. 银器，银餐具</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> silver (银) + ware (器具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个豪华的餐桌上，摆满了闪闪发光的银器，
    <tspan x="50" dy="25">每一件都是由纯银制成，"银器(silverware)"在灯光下熠熠生辉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dinner party featured exquisite silverware.
  </text>
  <text x="50" y="310" class="content">
    晚宴上展示了精美的银餐具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Silverware -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <!-- Reflection -->
    <line x1="50" y1="180" x2="100" y2="180" class="image" />
    <line x1="120" y1="180" x2="170" y2="180" class="image" />
    <line x1="190" y1="180" x2="240" y2="180" class="image" />
    <line x1="260" y1="180" x2="310" y2="180" class="image" />
  </g>
</svg>