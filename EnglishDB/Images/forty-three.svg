<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forty-three</text>
  <text x="50" y="120" class="subtitle">[ˈfɔrti θriː] n. 四十三</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> forty (四十) + three (三)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“43”漂浮在空中，
    <tspan x="50" dy="25">像一个巨大的气球，上面写着“四十”和“三”，</tspan>
    <tspan x="50" dy="25">它们紧紧地连在一起，形成了一个“四十三”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are forty-three students in the class.
  </text>
  <text x="50" y="310" class="content">
    班里有四十三名学生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Number 4 -->
    <text x="0" y="100" font-size="200" fill="#E74C3C">4</text>
    <!-- Number 3 -->
    <text x="150" y="100" font-size="200" fill="#2980B9">3</text>
    <!-- Connecting line -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
  </g>
</svg>