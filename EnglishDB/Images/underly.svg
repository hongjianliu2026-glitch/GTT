<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underly</text>
  <text x="50" y="120" class="subtitle">[ˌʌndəˈlaɪ] v. 构成...的基础，位于...之下</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在...下面) + ly (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的山峰，"在下面支撑(under-ly)"
    <tspan x="50" dy="25">着整个山脉，这座山峰就是山脉的基础(underly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The principles that underly this theory are complex.
  </text>
  <text x="50" y="310" class="content">
    构成这一理论基础的原理很复杂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain peak -->
    <polygon points="0,150 100,0 200,150" class="image" />
    <!-- Base of the mountain -->
    <rect x="50" y="150" width="100" height="50" class="image" />
    <!-- Ground line -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <!-- Text annotation -->
    <text x="100" y="220" class="content" text-anchor="middle">underly</text>
  </g>
</svg>