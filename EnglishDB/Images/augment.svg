<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">augment</text>
  <text x="50" y="120" class="subtitle">[ɔːɡˈmɛnt] v. 增加，扩大</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aug (增加) + ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天平，一边是"增加(aug)"的重量，
    <tspan x="50" dy="25">另一边是"扩大(ment)"的空间，天平倾斜，</tspan>
    <tspan x="50" dy="25">象征着力量和空间的增强(augment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to augment its workforce by hiring more employees.
  </text>
  <text x="50" y="310" class="content">
    公司决定通过招聘更多员工来增加其劳动力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Weights -->
    <rect x="10" y="190" width="80" height="40" class="image" />
    <rect x="260" y="190" width="80" height="40" class="image" />
    <!-- Space -->
    <rect x="10" y="240" width="80" height="40" class="image" />
    <rect x="260" y="240" width="80" height="40" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="20" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="190" y2="90" class="image" />
    <line x1="200" y1="100" x2="210" y2="90" class="image" />
  </g>
</svg>