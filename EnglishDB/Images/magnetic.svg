<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">magnetic</text>
  <text x="50" y="120" class="subtitle">[mæɡˈnɛtɪk] adj. 磁性的，有吸引力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> magn (大) + -etic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磁铁，"大(magn)"
    <tspan x="50" dy="25">吸引着周围的一切，这种强大的吸引力就是磁性的(magnetic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The speaker had a magnetic personality that drew everyone in.
  </text>
  <text x="50" y="310" class="content">
    演讲者有一种吸引人的个性，吸引了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnet -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- North and South poles -->
    <circle cx="125" cy="100" r="20" class="image" fill="#E74C3C" />
    <circle cx="225" cy="100" r="20" class="image" fill="#3498DB" />
    <!-- Attraction lines -->
    <line x1="125" y1="120" x2="225" y2="120" class="image" />
    <line x1="125" y1="140" x2="225" y2="140" class="image" />
    <line x1="125" y1="160" x2="225" y2="160" class="image" />
    <line x1="125" y1="180" x2="225" y2="180" class="image" />
    <!-- Magnifying effect -->
    <circle cx="175" cy="100" r="50" class="image" stroke-dasharray="5,5" />
  </g>
</svg>