<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stepmother</text>
  <text x="50" y="120" class="subtitle">[ˈstɛpmʌðər] n. 继母</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> step- (继) + mother (母亲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子站在两个女人中间，一个是亲生母亲，另一个是"继(step)"母亲。
    <tspan x="50" dy="25">继母虽然不是亲生的，但她依然扮演着母亲的角色。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her stepmother was very kind to her.
  </text>
  <text x="50" y="310" class="content">
    她的继母对她非常和善。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="200" class="image" />
    <line x1="100" y1="160" x2="120" y2="200" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <line x1="100" y1="140" x2="60" y2="130" class="image" />

    <!-- Mother -->
    <circle cx="200" cy="100" r="25" class="image" />
    <line x1="200" y1="125" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="180" y2="210" class="image" />
    <line x1="200" y1="170" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
    <line x1="200" y1="150" x2="160" y2="140" class="image" />

    <!-- Stepmother -->
    <circle cx="300" cy="100" r="25" class="image" />
    <line x1="300" y1="125" x2="300" y2="170" class="image" />
    <line x1="300" y1="170" x2="280" y2="210" class="image" />
    <line x1="300" y1="170" x2="320" y2="210" class="image" />
    <line x1="300" y1="150" x2="340" y2="140" class="image" />
    <line x1="300" y1="150" x2="260" y2="140" class="image" />

    <!-- Connection lines -->
    <line x1="120" y1="120" x2="180" y2="120" class="image" />
    <line x1="120" y1="120" x2="280" y2="120" class="image" />
  </g>
</svg>