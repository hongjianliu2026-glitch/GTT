<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entertaining</text>
  <text x="50" y="120" class="subtitle">[ˌɛntərˈteɪnɪŋ] adj. 有趣的，愉快的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> enter- (在中间) + tain (保持)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师在舞台上，"在中间保持(enter-tain)"
    <tspan x="50" dy="25">观众的注意力，让观众感到愉快和有趣(entertaining)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The comedian's performance was very entertaining.
  </text>
  <text x="50" y="310" class="content">
    喜剧演员的表演非常有趣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Magician -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="130" x2="145" y2="120" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Audience -->
    <circle cx="75" cy="180" r="10" class="image" />
    <circle cx="125" cy="180" r="10" class="image" />
    <circle cx="225" cy="180" r="10" class="image" />
    <circle cx="275" cy="180" r="10" class="image" />
  </g>
</svg>