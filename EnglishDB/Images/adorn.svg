<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adorn</text>
  <text x="50" y="120" class="subtitle">[əˈdɔːrn] v. 装饰，打扮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (加强) + orn (装饰)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女孩在镜子前，"加强装饰(ad-orn)"
    <tspan x="50" dy="25">自己，戴上闪亮的珠宝和华丽的头饰，</tspan>
    <tspan x="50" dy="25">瞬间变得光彩夺目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She adorned herself with a beautiful necklace.
  </text>
  <text x="50" y="310" class="content">
    她用一条漂亮的项链装饰自己。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Girl -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
    <!-- Jewelry -->
    <circle cx="180" cy="80" r="10" class="image" />
    <circle cx="220" cy="80" r="10" class="image" />
    <line x1="190" y1="100" x2="210" y2="100" class="image" />
  </g>
</svg>