<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bay</text>
  <text x="50" y="120" class="subtitle">[beɪ] n. 海湾，湾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bay (源自拉丁语 "baia"，意为海湾)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片宽阔的海湾，海水在阳光下闪烁，
    <tspan x="50" dy="25">海鸟在空中盘旋，海风轻拂，这就是"bay"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship anchored in the bay for the night.
  </text>
  <text x="50" y="310" class="content">
    船在海湾停泊过夜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" fill="#4CAF50" />
    <!-- Bay -->
    <path d="M50 150 Q100 50 150 150 T300 150" stroke="#3498DB" stroke-width="3" fill="none" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="20" fill="#F1C40F" />
    <!-- Birds -->
    <line x1="70" y1="30" x2="90" y2="50" class="image" />
    <line x1="90" y1="50" x2="110" y2="30" class="image" />
    <line x1="110" y1="30" x2="130" y2="50" class="image" />
    <line x1="130" y1="50" x2="150" y2="30" class="image" />
  </g>
</svg>