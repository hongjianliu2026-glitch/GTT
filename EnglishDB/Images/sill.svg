<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sill</text>
  <text x="50" y="120" class="subtitle">[sɪl] n. 窗台，门槛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "sella" (座位)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫坐在窗台上，"坐在(sella)"
    <tspan x="50" dy="25">窗台上晒太阳，窗台(sill)就像一个舒适的座位。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat likes to sit on the window sill.
  </text>
  <text x="50" y="310" class="content">
    这只猫喜欢坐在窗台上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Window sill -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Cat -->
    <circle cx="50" cy="25" r="15" class="image" />
    <line x1="50" y1="40" x2="50" y2="70" class="image" />
    <line x1="50" y1="70" x2="35" y2="90" class="image" />
    <line x1="50" y1="70" x2="65" y2="90" class="image" />
    <line x1="50" y1="55" x2="70" y2="45" class="image" />
  </g>
</svg>