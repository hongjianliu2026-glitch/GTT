<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .green { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">green</text>
  <text x="50" y="120" class="subtitle">[ɡriːn] adj. 绿色的；n. 绿色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "grene"，与古英语 "grēne" 相关
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片茂密的森林，"绿色(green)"
    <tspan x="50" dy="25">覆盖了整个大地，生机勃勃，象征着自然与生命。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leaves turned green in spring.
  </text>
  <text x="50" y="310" class="content">
    春天树叶变绿了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="green" />
    <!-- Trees -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="50" class="image" />
    <line x1="150" y1="150" x2="150" y2="50" class="image" />
    <line x1="200" y1="150" x2="200" y2="50" class="image" />
    <line x1="250" y1="150" x2="250" y2="50" class="image" />
    <!-- Leaves -->
    <circle cx="50" cy="50" r="20" class="green" />
    <circle cx="100" cy="50" r="20" class="green" />
    <circle cx="150" cy="50" r="20" class="green" />
    <circle cx="200" cy="50" r="20" class="green" />
    <circle cx="250" cy="50" r="20" class="green" />
  </g>
</svg>