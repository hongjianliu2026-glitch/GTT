<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">futurist</text>
  <text x="50" y="120" class="subtitle">[ˈfjuːtʃərɪst] n. 未来主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> futur (未来) + -ist (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个未来主义者站在一个巨大的时钟前，
    <tspan x="50" dy="25">时钟的指针指向未来，他正在描绘未来的蓝图。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The futurist predicted that flying cars would be common by 2050.
  </text>
  <text x="50" y="310" class="content">
    这位未来主义者预测到2050年飞行汽车将会普及。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Futurist -->
    <circle cx="175" cy="200" r="15" class="image" />
    <line x1="175" y1="215" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="155" y2="280" class="image" />
    <line x1="175" y1="250" x2="195" y2="280" class="image" />
    <line x1="175" y1="230" x2="205" y2="220" class="image" />
    <!-- Blueprint -->
    <rect x="50" y="50" width="250" height="150" class="image" />
    <line x1="70" y1="70" x2="280" y2="70" class="image" />
    <line x1="70" y1="100" x2="250" y2="100" class="image" />
    <line x1="70" y1="130" x2="270" y2="130" class="image" />
    <line x1="70" y1="160" x2="240" y2="160" class="image" />
  </g>
</svg>