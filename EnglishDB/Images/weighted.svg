<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">weighted</text>
  <text x="50" y="120" class="subtitle">[ˈweɪtɪd] adj. 加权的，有重量的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> weigh (重量) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，"重量(weigh)"
    <tspan x="50" dy="25">被加在一边，使得天平倾斜，这就是加权的(weighted)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The results were weighted to reflect the population distribution.
  </text>
  <text x="50" y="310" class="content">
    结果被加权以反映人口分布。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <line x1="50" y1="180" x2="350" y2="180" class="image" />
    <!-- Weights -->
    <rect x="100" y="100" width="50" height="50" class="image" />
    <rect x="300" y="100" width="50" height="50" class="image" />
    <!-- Tilted scale -->
    <line x1="50" y1="20" x2="150" y2="20" transform="rotate(10, 50, 20)" class="image" />
    <line x1="50" y1="20" x2="350" y2="20" transform="rotate(-10, 50, 20)" class="image" />
  </g>
</svg>