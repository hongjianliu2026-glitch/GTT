<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">northern</text>
  <text x="50" y="120" class="subtitle">[ˈnɔːrðən] adj. 北方的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> north (北方) + -ern (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指南针指向北方，"北方的(northern)"
    <tspan x="50" dy="25">寒冷而神秘，吸引着探险者的目光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The northern lights are a spectacular sight.
  </text>
  <text x="50" y="310" class="content">
    北极光是一种壮观的景象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compass -->
    <circle cx="175" cy="100" r="75" class="image" />
    <line x1="175" y1="25" x2="175" y2="175" class="image" />
    <line x1="175" y1="25" x2="100" y2="100" class="image" />
    <line x1="175" y1="25" x2="250" y2="100" class="image" />
    <line x1="175" y1="175" x2="100" y2="100" class="image" />
    <line x1="175" y1="175" x2="250" y2="100" class="image" />
    <!-- North arrow -->
    <polygon points="175,25 160,60 175,55 190,60" class="image" />
    <text x="165" y="70" class="content">N</text>
  </g>
</svg>