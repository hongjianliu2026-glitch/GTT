<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">real-world</text>
  <text x="50" y="120" class="subtitle">[ˈriəl wɜːrld] adj. 现实世界的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> real (真实的) + world (世界)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，上面标注着各种真实存在的地点和事件，这就是"现实世界(real-world)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project focuses on real-world applications.
  </text>
  <text x="50" y="310" class="content">
    这个项目专注于现实世界的应用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Globe -->
    <circle cx="200" cy="200" r="150" class="image" />
    <!-- Landmasses -->
    <path d="M100,200 Q150,100 200,200 T300,200" class="image" />
    <path d="M100,200 Q150,300 200,200 T300,200" class="image" />
    <!-- Real-world markers -->
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="250" cy="250" r="10" class="image" />
    <circle cx="180" cy="280" r="10" class="image" />
  </g>
</svg>