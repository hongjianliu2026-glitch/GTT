<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crusty</text>
  <text x="50" y="120" class="subtitle">[ˈkrʌsti] adj. 硬皮的，顽固的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crust (外壳) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老顽固，他的脸像一块硬皮(crust)，
    <tspan x="50" dy="25">无论你怎么劝说，他都像一块顽固的硬皮(crusty)一样，</tspan>
    <tspan x="50" dy="25">纹丝不动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man was crusty and refused to change his mind.
  </text>
  <text x="50" y="310" class="content">
    那位老人很顽固，拒绝改变主意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old man's face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Crusty skin -->
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <line x1="70" y1="70" x2="130" y2="70" class="image" />
    <line x1="70" y1="90" x2="130" y2="90" class="image" />
    <line x1="70" y1="110" x2="130" y2="110" class="image" />
    <line x1="70" y1="130" x2="130" y2="130" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <line x1="90" y1="120" x2="110" y2="120" class="image" />
  </g>
</svg>