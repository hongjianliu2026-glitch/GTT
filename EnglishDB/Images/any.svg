<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">any</text>
  <text x="50" y="120" class="subtitle">[ˈeni] adj. 任何的，任一的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (一个) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师从帽子里变出"任何一个(an-y)"
    <tspan x="50" dy="25">小动物，无论是什么，都能让人惊喜。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Do you have any questions?
  </text>
  <text x="50" y="310" class="content">
    你有什么问题吗？
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician's hat -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Rabbit -->
    <circle cx="100" cy="150" r="30" class="image" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="100" y1="210" x2="70" y2="200" class="image" />
    <line x1="100" y1="210" x2="130" y2="200" class="image" />
    <line x1="100" y1="250" x2="70" y2="280" class="image" />
    <line x1="100" y1="250" x2="130" y2="280" class="image" />
  </g>
</svg>