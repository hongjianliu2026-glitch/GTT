<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">small-business</text>
  <text x="50" y="120" class="subtitle">[smɔːl ˈbɪznəs] n. 小企业</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> small (小的) + business (商业)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小店铺，"小小的(small)"
    <tspan x="50" dy="25">商业(business)活动，这就是一个小企业(small-business)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She runs a small-business selling handmade crafts.
  </text>
  <text x="50" y="310" class="content">
    她经营着一家销售手工制品的小企业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small shop -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="80" class="image" />
    <!-- Window -->
    <rect x="70" y="50" width="50" height="50" class="image" />
    <rect x="230" y="50" width="50" height="50" class="image" />
    <!-- Sign -->
    <line x1="100" y1="20" x2="200" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <line x1="200" y1="20" x2="200" y2="40" class="image" />
    <line x1="100" y1="40" x2="200" y2="40" class="image" />
    <text x="120" y="35" class="content" fill="#2C3E50">Shop</text>
  </g>
</svg>