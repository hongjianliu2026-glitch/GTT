<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unconditional</text>
  <text x="50" y="120" class="subtitle">[ˌʌnkənˈdɪʃənl] adj. 无条件的，绝对的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + condition (条件) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个无条件的爱，"没有任何条件(un-condition)"
    <tspan x="50" dy="25">的爱，就像一个无边界的拥抱，温暖而绝对。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her love for her children is unconditional.
  </text>
  <text x="50" y="310" class="content">
    她对孩子的爱是无条件的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 31.7C10 15.1 25.1 0 42.7 0c17.6 0 32.7 15.1 32.7 31.7 0 16.6-15.1 31.7-32.7 31.7C25.1 63.4 10 48.3 10 31.7z" class="image" fill="#E74C3C" />
    <!-- Infinity symbol -->
    <path d="M80 31.7c0 16.6 15.1 31.7 32.7 31.7 17.6 0 32.7-15.1 32.7-31.7 0-16.6-15.1-31.7-32.7-31.7C95.1 0 80 15.1 80 31.7z" class="image" fill="#2980B9" />
    <!-- Text annotation -->
    <text x="100" y="60" class="content" fill="#2C3E50">无条件的爱</text>
  </g>
</svg>