<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">injunction</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdʒʌŋkʃən] n. 禁令，命令</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + junct (连接) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官在法庭上，"连接(junct)"
    <tspan x="50" dy="25">法律与现实，发出一道"进入(in)"</tspan>
    <tspan x="50" dy="25">现实的禁令(injunction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The court issued an injunction to stop the construction.
  </text>
  <text x="50" y="310" class="content">
    法院发布了一道禁令，停止施工。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Gavel -->
    <rect x="10" y="180" width="20" height="40" class="image" />
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Law book -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <polygon points="250,100 240,90 240,110" class="image" />
    <!-- Construction sign -->
    <rect x="260" y="20" width="80" height="160" class="image" />
    <text x="270" y="100" class="content" style="fill: #E74C3C;">STOP</text>
  </g>
</svg>