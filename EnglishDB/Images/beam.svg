<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beam</text>
  <text x="50" y="120" class="subtitle">[biːm] n. 梁，光束；v. 微笑，发光</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (存在) + am (我)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的梁(beam)横跨在建筑物上，
    <tspan x="50" dy="25">它像是在说：“我(am)存在(be)，支撑着一切。”</tspan>
    <tspan x="50" dy="25">或者想象一个人微笑着，脸上发出光束(beam)，</tspan>
    <tspan x="50" dy="25">仿佛在说：“我(am)存在(be)，带来光明。”</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="320" class="content">
    <tspan class="highlight">例句:</tspan> The sun's beams warmed the earth.
  </text>
  <text x="50" y="350" class="content">
    阳光的光束温暖了大地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Beam as a structural element -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <text x="175" y="35" class="content" text-anchor="middle">梁</text>

    <!-- Beam as a light source -->
    <circle cx="175" cy="150" r="50" class="image" />
    <line x1="175" y1="100" x2="175" y2="200" class="image" />
    <line x1="150" y1="125" x2="200" y2="175" class="image" />
    <line x1="150" y1="175" x2="200" y2="125" class="image" />
    <text x="175" y="220" class="content" text-anchor="middle">光束</text>
  </g>
</svg>