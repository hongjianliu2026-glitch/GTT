<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skyward</text>
  <text x="50" y="120" class="subtitle">[ˈskaɪwərd] adv. 向天空，向上</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sky (天空) + -ward (向...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鸟儿，"向天空(sky-ward)"
    <tspan x="50" dy="25">飞翔，它的目标是那无垠的蓝天。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rocket launched skyward with a roar.
  </text>
  <text x="50" y="310" class="content">
    火箭伴随着轰鸣声向天空发射。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Bird -->
    <circle cx="50" cy="100" r="15" class="image" fill="#000" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <polygon points="150,50 140,60 160,60" class="image" fill="#000" />
  </g>
</svg>