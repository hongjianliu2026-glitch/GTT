<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frock</text>
  <text x="50" y="120" class="subtitle">[frɒk] n. 连衣裙，工作服</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fro- (来自古英语 "froc"，意为"衣服")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着连衣裙(frock)的女士，
    <tspan x="50" dy="25">她的衣服(froc)让她看起来优雅而自信。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a beautiful frock to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件漂亮的连衣裙去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Dress outline -->
    <rect x="50" y="50" width="200" height="300" class="image" />
    <!-- Neckline -->
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
    <!-- Sleeves -->
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <line x1="250" y1="100" x2="300" y2="150" class="image" />
    <!-- Waistline -->
    <line x1="50" y1="200" x2="250" y2="200" class="image" />
    <!-- Skirt -->
    <line x1="50" y1="200" x2="50" y2="350" class="image" />
    <line x1="250" y1="200" x2="250" y2="350" class="image" />
    <!-- Hemline -->
    <line x1="50" y1="350" x2="250" y2="350" class="image" />
  </g>
</svg>