<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .number { font: bold 60px sans-serif; fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">numeral</text>
  <text x="50" y="120" class="subtitle">[ˈnumərəl] n. 数字，数词</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> numer (数) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字"7"漂浮在空中，它是由无数个小数字组成的，
    <tspan x="50" dy="25">每个小数字都在闪烁，仿佛在说："我是数字(numer)的一部分！"</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The numeral "7" is often associated with luck.
  </text>
  <text x="50" y="310" class="content">
    数字"7"通常与幸运联系在一起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number "7" -->
    <text x="0" y="100" class="number">7</text>
    <!-- Small numbers around "7" -->
    <text x="50" y="50" class="number">1</text>
    <text x="100" y="50" class="number">2</text>
    <text x="150" y="50" class="number">3</text>
    <text x="50" y="150" class="number">4</text>
    <text x="100" y="150" class="number">5</text>
    <text x="150" y="150" class="number">6</text>
  </g>
</svg>