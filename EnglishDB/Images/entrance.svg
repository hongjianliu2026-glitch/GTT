<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entrance</text>
  <text x="50" y="120" class="subtitle">[ˈɛntrəns] n. 入口，进入；v. 使入迷，使狂喜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + trance (迷住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的门(entrance)前，
    <tspan x="50" dy="25">门后是一个充满魔力的世界，让人完全"迷住(trance)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The grand entrance of the palace was breathtaking.
  </text>
  <text x="50" y="310" class="content">
    宫殿的宏伟入口令人叹为观止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <line x1="100" y1="0" x2="100" y2="300" class="image" />
    <!-- Handle -->
    <circle cx="180" cy="150" r="10" class="image" />
    <!-- Person -->
    <circle cx="300" cy="150" r="20" class="image" />
    <line x1="300" y1="170" x2="300" y2="250" class="image" />
    <line x1="300" y1="250" x2="280" y2="280" class="image" />
    <line x1="300" y1="250" x2="320" y2="280" class="image" />
    <line x1="300" y1="200" x2="340" y2="190" class="image" />
  </g>
</svg>