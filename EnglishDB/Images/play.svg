<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">play</text>
  <text x="50" y="120" class="subtitle">[pleɪ] v. 玩，播放；n. 游戏，戏剧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "pleien"，意为“玩耍”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在草地上，"尽情玩耍(play)"，
    <tspan x="50" dy="25">脸上洋溢着快乐的笑容，这就是play的本质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children love to play in the park.
  </text>
  <text x="50" y="310" class="content">
    孩子们喜欢在公园里玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#27AE60" />
    <!-- Child -->
    <circle cx="100" cy="120" r="20" class="image" fill="#F1C40F" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <line x1="100" y1="160" x2="70" y2="150" class="image" />
    <line x1="100" y1="160" x2="130" y2="150" class="image" />
    <!-- Ball -->
    <circle cx="150" cy="130" r="10" class="image" fill="#E74C3C" />
    <!-- Smile -->
    <path d="M90 110 Q100 100 110 110" class="image" fill="none" stroke="#2C3E50" stroke-width="2" />
  </g>
</svg>