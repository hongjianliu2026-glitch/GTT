<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gutsy</text>
  <text x="50" y="120" class="subtitle">[ˈɡʌtsi] adj. 勇敢的，有胆量的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gut (内脏) + -sy (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对危险时，"内心(gut)"
    <tspan x="50" dy="25">依然坚定，这种勇气(gutsy)让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a gutsy decision to quit her job and start her own business.
  </text>
  <text x="50" y="310" class="content">
    她做出了一个勇敢的决定，辞去了工作并开始了自己的事业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Heart symbol -->
    <circle cx="100" cy="100" r="50" class="image" fill="#E74C3C" />
    <!-- Face -->
    <circle cx="100" cy="100" r="20" class="image" fill="#F1C40F" />
    <circle cx="85" cy="90" r="5" class="image" fill="#000" />
    <circle cx="115" cy="90" r="5" class="image" fill="#000" />
    <path d="M80 110 Q100 130 120 110" class="image" fill="none" stroke="#000" stroke-width="3" />
    <!-- Shield -->
    <rect x="50" y="150" width="100" height="50" class="image" fill="#3498DB" />
    <polygon points="50,150 100,125 150,150 100,200" class="image" fill="#3498DB" />
    <!-- Text on shield -->
    <text x="80" y="185" class="content" fill="#FFF">GUTSY</text>
  </g>
</svg>