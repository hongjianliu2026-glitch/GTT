<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
      .steam { fill: #B2DFDB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">steamy</text>
  <text x="50" y="120" class="subtitle">[ˈstiːmi] adj. 蒸汽的，多蒸汽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> steam (蒸汽) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满蒸汽的浴室，"蒸汽(steam)"
    <tspan x="50" dy="25">弥漫在空气中，整个房间都变得"多蒸汽的(steamy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bathroom was so steamy that I couldn't see clearly.
  </text>
  <text x="50" y="310" class="content">
    浴室里蒸汽太多，我都看不清了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bathroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Steam -->
    <ellipse cx="175" cy="100" rx="150" ry="80" class="steam" />
    <ellipse cx="125" cy="120" rx="100" ry="60" class="steam" />
    <ellipse cx="225" cy="130" rx="120" ry="70" class="steam" />
    <!-- Person -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="230" class="image" />
    <line x1="175" y1="200" x2="195" y2="230" class="image" />
    <line x1="175" y1="180" x2="145" y2="170" class="image" />
    <line x1="175" y1="180" x2="205" y2="170" class="image" />
  </g>
</svg>