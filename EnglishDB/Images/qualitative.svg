<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">qualitative</text>
  <text x="50" y="120" class="subtitle">[ˈkwɒlɪtətɪv] adj. 定性的，质的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quali- (质量) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"评估(qualitative)"
    <tspan x="50" dy="25">化学反应的质量(quali-)，而不是数量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The study focused on qualitative aspects of customer satisfaction.
  </text>
  <text x="50" y="310" class="content">
    这项研究侧重于客户满意度的定性方面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Laboratory setup -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Beaker -->
    <ellipse cx="175" cy="100" rx="50" ry="70" class="image" />
    <!-- Chemical reaction -->
    <circle cx="175" cy="100" r="20" fill="#FF5733" />
    <!-- Scientist -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>