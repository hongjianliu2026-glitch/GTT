<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insanity</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsænəti] n. 精神错乱，疯狂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + san (健康) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在精神错乱的状态下，"不健康(in-san)"
    <tspan x="50" dy="25">到极致，行为完全失控，这就是疯狂(insanity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The witness's testimony was so bizarre that it bordered on insanity.
  </text>
  <text x="50" y="310" class="content">
    证人的证词如此离奇，几乎到了疯狂的边缘。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head with crazy eyes -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="75" cy="85" r="10" class="image" fill="#E74C3C" />
    <circle cx="125" cy="85" r="10" class="image" fill="#E74C3C" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" stroke-width="3" />
    <!-- Torn clothes -->
    <rect x="50" y="150" width="100" height="50" class="image" />
    <line x1="50" y1="150" x2="150" y2="200" class="image" />
    <line x1="150" y1="150" x2="50" y2="200" class="image" />
  </g>
</svg>