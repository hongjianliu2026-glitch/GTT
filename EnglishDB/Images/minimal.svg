<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9F9F9; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">minimal</text>
  <text x="50" y="120" class="subtitle">[ˈmɪnɪməl] adj. 最小的，极简的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mini (小) + -mal (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个极简主义者，只拥有"最小的(mini-mal)"
    <tspan x="50" dy="25">物品，房间里只有一张床和一盏灯，这就是minimal。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The design of the app is minimal and easy to use.
  </text>
  <text x="50" y="310" class="content">
    这个应用的设计非常简洁，易于使用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Minimal room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bed -->
    <rect x="50" y="20" width="250" height="80" class="image" />
    <!-- Lamp -->
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <circle cx="150" cy="160" r="10" class="image" />
    <!-- Minimalist -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>