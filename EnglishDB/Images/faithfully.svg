<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">faithfully</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪθfəli] adv. 忠诚地，忠实地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> faith (信任) + -ful (充满) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只忠诚的狗，"充满信任地(faith-ful-ly)"
    <tspan x="50" dy="25">守护着它的主人，无论风雨，始终如一。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She served her company faithfully for 20 years.
  </text>
  <text x="50" y="310" class="content">
    她为公司忠诚服务了20年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="160" x2="80" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="200" x2="20" y2="230" class="image" /> <!-- Back leg -->
    <line x1="50" y1="200" x2="80" y2="230" class="image" /> <!-- Back leg -->
    <line x1="50" y1="110" x2="80" y2="110" class="image" /> <!-- Tail -->

    <!-- Heart -->
    <path d="M150,100 C150,80 180,80 180,100 C180,120 150,120 150,100 Z" class="image" />
    <line x1="150" y1="100" x2="180" y2="100" class="image" />
    <line x1="165" y1="80" x2="165" y2="120" class="image" />

    <!-- Owner -->
    <circle cx="250" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="250" y1="120" x2="250" y2="160" class="image" /> <!-- Body -->
    <line x1="250" y1="140" x2="230" y2="120" class="image" /> <!-- Arm -->
    <line x1="250" y1="140" x2="270" y2="120" class="image" /> <!-- Arm -->
    <line x1="250" y1="160" x2="230" y2="180" class="image" /> <!-- Leg -->
    <line x1="250" y1="160" x2="270" y2="180" class="image" /> <!-- Leg -->
  </g>
</svg>