<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imaginative</text>
  <text x="50" y="120" class="subtitle">[ɪˈmædʒɪnətɪv] adj. 富有想象力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> imagine (想象) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在画布上，"用丰富的想象力(imaginative)"
    <tspan x="50" dy="25">创造出奇幻的画面，这些画面充满了创意和幻想。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is an imaginative writer who creates vivid worlds.
  </text>
  <text x="50" y="310" class="content">
    她是一位富有想象力的作家，创造出栩栩如生的世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Canvas -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Imaginary scene -->
    <circle cx="120" cy="100" r="30" class="image" /> <!-- Sun -->
    <line x1="120" y1="130" x2="120" y2="180" class="image" /> <!-- Sun rays -->
    <line x1="120" y1="130" x2="80" y2="160" class="image" />
    <line x1="120" y1="130" x2="160" y2="160" class="image" />
    <line x1="120" y1="130" x2="100" y2="180" class="image" />
    <line x1="120" y1="130" x2="140" y2="180" class="image" />
    <rect x="180" y="80" width="50" height="50" class="image" /> <!-- House -->
    <line x1="180" y1="80" x2="230" y2="80" class="image" /> <!-- Roof -->
    <line x1="180" y1="80" x2="205" y2="50" class="image" />
    <line x1="230" y1="80" x2="205" y2="50" class="image" />
  </g>
</svg>