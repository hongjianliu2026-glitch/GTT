<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">harmonize</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrmənaɪz] v. 使和谐，协调</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> harmo- (和谐) + -nize (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群音乐家在舞台上，"使(nize)"
    <tspan x="50" dy="25">他们的声音"和谐(harmo)"，创造出美妙的和声。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The choir tried to harmonize their voices.
  </text>
  <text x="50" y="310" class="content">
    合唱团试图协调他们的声音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Musical notes -->
    <path d="M50 50 C70 20, 130 20, 150 50" class="image" />
    <path d="M50 100 C70 70, 130 70, 150 100" class="image" />
    <path d="M50 150 C70 120, 130 120, 150 150" class="image" />
    <!-- Musicians -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <!-- Harmony -->
    <text x="200" y="100" class="content" style="font-size: 36px;">🎶</text>
  </g>
</svg>