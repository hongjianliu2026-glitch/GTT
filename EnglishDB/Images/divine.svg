<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">divine</text>
  <text x="50" y="120" class="subtitle">[dɪˈvaɪn] adj. 神的，神圣的；v. 占卜，预言</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> divin (神)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的占卜师，手持水晶球，"预言(divine)"
    <tspan x="50" dy="25">未来，她的预言如同神谕般神圣(divine)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The priest spoke of divine wisdom.
  </text>
  <text x="50" y="310" class="content">
    牧师谈到了神圣的智慧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crystal ball -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Diviner -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Light rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="100" y1="50" x2="150" y2="0" class="image" />
    <line x1="100" y1="50" x2="50" y2="0" class="image" />
  </g>
</svg>