<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">IQ</text>
  <text x="50" y="120" class="subtitle">[aɪˈkjuː] n. 智商</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Intelligence Quotient (智力商数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天才在思考，"智力(Intelligence)"
    <tspan x="50" dy="25">和"商数(Quotient)"结合，形成了智商(IQ)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His IQ is above average.
  </text>
  <text x="50" y="310" class="content">
    他的智商高于平均水平。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Lightbulb -->
    <circle cx="250" cy="100" r="40" class="image" />
    <line x1="250" y1="140" x2="250" y2="200" class="image" />
    <line x1="250" y1="160" x2="220" y2="150" class="image" />
    <line x1="250" y1="160" x2="280" y2="150" class="image" />
    <line x1="250" y1="200" x2="220" y2="230" class="image" />
    <line x1="250" y1="200" x2="280" y2="230" class="image" />
  </g>
</svg>