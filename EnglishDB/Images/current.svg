<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">current</text>
  <text x="50" y="120" class="subtitle">[ˈkɜːrənt] adj. 当前的，流通的；n. 电流，水流</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cur (跑) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流在奔跑(cur)，这就是"当前的(current)"水流。
    <tspan x="50" dy="25">电流也是一样，它在电线中奔跑，形成"当前的(current)"电流。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The current economic situation is quite stable.
  </text>
  <text x="50" y="310" class="content">
    当前的经济形势相当稳定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 100 Q100 50 200 100 T400 100" class="image" />
    <path d="M0 120 Q100 70 200 120 T400 120" class="image" />
    <path d="M0 140 Q100 90 200 140 T400 140" class="image" />
    <!-- Water drops -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="150" cy="80" r="5" class="image" />
    <circle cx="250" cy="110" r="5" class="image" />
    <circle cx="350" cy="100" r="5" class="image" />
    <!-- Electric current -->
    <line x1="0" y1="180" x2="400" y2="180" class="image" />
    <line x1="0" y1="200" x2="400" y2="200" class="image" />
    <line x1="0" y1="220" x2="400" y2="220" class="image" />
    <!-- Electric sparks -->
    <circle cx="50" cy="190" r="5" class="image" />
    <circle cx="150" cy="210" r="5" class="image" />
    <circle cx="250" cy="190" r="5" class="image" />
    <circle cx="350" cy="210" r="5" class="image" />
  </g>
</svg>