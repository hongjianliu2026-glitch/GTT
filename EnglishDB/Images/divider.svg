<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">divider</text>
  <text x="50" y="120" class="subtitle">[dɪˈvaɪdər] n. 分割器，分隔物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + vid (看) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"分隔器(divider)"，它像一把巨大的剪刀，
    <tspan x="50" dy="25">将世界一分为二，让人们"分开看(di-vid)"不同的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The divider in the room separates the workspace from the living area.
  </text>
  <text x="50" y="310" class="content">
    房间里的分隔器将工作区与生活区分开。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Divider -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Left side -->
    <rect x="50" y="20" width="120" height="160" class="image" />
    <!-- Right side -->
    <rect x="180" y="20" width="120" height="160" class="image" />
    <!-- Divider text -->
    <text x="170" y="100" class="content" transform="rotate(-90 170 100)">Divider</text>
  </g>
</svg>