<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">listening</text>
  <text x="50" y="120" class="subtitle">[ˈlɪs.nɪŋ] n. 倾听，听</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> list (听) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人竖起耳朵，"使劲听(list-en)"
    <tspan x="50" dy="25">周围的声音，这就是倾听(listening)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is good at listening to others' opinions.
  </text>
  <text x="50" y="310" class="content">
    她善于倾听他人的意见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ears -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Mouth -->
    <rect x="85" y="120" width="30" height="10" class="image" />
    <!-- Sound waves -->
    <line x1="100" y1="50" x2="100" y2="20" class="image" />
    <line x1="90" y1="60" x2="90" y2="30" class="image" />
    <line x1="110" y1="60" x2="110" y2="30" class="image" />
    <line x1="80" y1="70" x2="80" y2="40" class="image" />
    <line x1="120" y1="70" x2="120" y2="40" class="image" />
  </g>
</svg>