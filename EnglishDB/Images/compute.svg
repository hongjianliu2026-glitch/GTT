<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compute</text>
  <text x="50" y="120" class="subtitle">[kəmˈpjuːt] v. 计算，估算</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + put (思考)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群数学家围坐在一起，"一起思考(com-put)"
    <tspan x="50" dy="25">复杂的数学问题，最终得出计算结果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The computer quickly computed the results.
  </text>
  <text x="50" y="310" class="content">
    计算机迅速计算出了结果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of mathematicians -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Thinking bubbles -->
    <ellipse cx="50" cy="50" rx="30" ry="20" class="image" />
    <ellipse cx="150" cy="50" rx="30" ry="20" class="image" />
    <ellipse cx="250" cy="50" rx="30" ry="20" class="image" />
    <!-- Result -->
    <rect x="100" y="150" width="100" height="50" class="image" />
    <text x="120" y="180" class="content">Result</text>
  </g>
</svg>