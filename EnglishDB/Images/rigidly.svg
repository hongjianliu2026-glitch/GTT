<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rigidly</text>
  <text x="50" y="120" class="subtitle">[ˈrɪdʒɪdli] adv. 严格地，僵硬地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rigid (僵硬的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"僵硬地(rigid)"固定在一个位置，
    <tspan x="50" dy="25">无法动弹，就像被钉在墙上一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He stood rigidly still, afraid to move.
  </text>
  <text x="50" y="310" class="content">
    他僵硬地站着，一动也不敢动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="200" class="image" />
    <line x1="100" y1="180" x2="120" y2="200" class="image" />
    <line x1="100" y1="140" x2="80" y2="160" class="image" />
    <line x1="100" y1="140" x2="120" y2="160" class="image" />
    <!-- Nails -->
    <line x1="90" y1="120" x2="90" y2="140" class="image" />
    <line x1="110" y1="120" x2="110" y2="140" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
  </g>
</svg>