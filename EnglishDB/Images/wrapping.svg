<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrapping</text>
  <text x="50" y="120" class="subtitle">[ˈræpɪŋ] n. 包装材料；v. 包裹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wrap (包裹) + -ing (动作进行)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的礼物盒，"包裹(wrap)"
    <tspan x="50" dy="25">着各种礼物，这些包装材料(wrapping)就是用来保护礼物的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used colorful wrapping paper to decorate the gift.
  </text>
  <text x="50" y="310" class="content">
    她用彩色的包装纸装饰礼物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gift box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Ribbon -->
    <line x1="50" y1="0" x2="150" y2="0" class="image" />
    <line x1="50" y1="10" x2="150" y2="10" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <!-- Wrapping paper -->
    <rect x="20" y="20" width="160" height="110" class="image" />
    <!-- Gift inside -->
    <rect x="40" y="40" width="120" height="70" class="image" />
  </g>
</svg>