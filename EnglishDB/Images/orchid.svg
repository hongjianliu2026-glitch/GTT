<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orchid</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrkɪd] n. 兰花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> orchi- (睾丸) + -d (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的传说，兰花(orchid)的形状
    <tspan x="50" dy="25">像极了古代男性崇拜的象征——睾丸(orchi-)，</tspan>
    <tspan x="50" dy="25">因此得名。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The orchid in the garden is blooming beautifully.
  </text>
  <text x="50" y="310" class="content">
    花园里的兰花正在美丽地绽放。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Orchid flower -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="120" cy="80" r="30" class="image" />
    <circle cx="80" cy="80" r="30" class="image" />
    <circle cx="100" cy="60" r="20" class="image" />
    <!-- Stem -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Leaves -->
    <path d="M 50 250 Q 100 200 150 250" class="image" />
    <path d="M 50 270 Q 100 220 150 270" class="image" />
  </g>
</svg>