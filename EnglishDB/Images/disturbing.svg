<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disturbing</text>
  <text x="50" y="120" class="subtitle">[dɪˈstɜːrbɪŋ] adj. 令人不安的，扰乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + turb (扰乱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个平静的湖面被"分开(dis-)"，"扰乱(turb)"了宁静，
    <tspan x="50" dy="25">湖水泛起涟漪，令人感到不安(disturbing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The disturbing news spread quickly through the town.
  </text>
  <text x="50" y="310" class="content">
    令人不安的消息很快传遍了整个小镇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" fill="#1ABC9C" />
    <!-- Disturbance -->
    <circle cx="120" cy="100" r="10" fill="#E74C3C" />
    <circle cx="230" cy="100" r="10" fill="#E74C3C" />
    <circle cx="175" cy="50" r="10" fill="#E74C3C" />
    <circle cx="175" cy="150" r="10" fill="#E74C3C" />
    <!-- Ripples -->
    <circle cx="120" cy="100" r="20" fill="none" stroke="#E74C3C" stroke-width="2" />
    <circle cx="230" cy="100" r="20" fill="none" stroke="#E74C3C" stroke-width="2" />
    <circle cx="175" cy="50" r="20" fill="none" stroke="#E74C3C" stroke-width="2" />
    <circle cx="175" cy="150" r="20" fill="none" stroke="#E74C3C" stroke-width="2" />
  </g>
</svg>