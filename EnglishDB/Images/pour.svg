<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pour</text>
  <text x="50" y="120" class="subtitle">[pɔːr] v. 倒，灌，倾泻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> por- (来自拉丁语 portare, 意为“携带”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水壶，"携带(por-)"着水，
    <tspan x="50" dy="25">然后猛烈地"倒(pour)"出来，水流如注，场面壮观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She poured the tea into the cup.
  </text>
  <text x="50" y="310" class="content">
    她把茶倒进了杯子里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Kettle -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="160" r="10" class="image" />
    <!-- Water pouring out -->
    <polyline points="50,160 50,250 150,250" class="image" />
    <!-- Cup -->
    <rect x="150" y="200" width="50" height="50" class="image" />
  </g>
</svg>