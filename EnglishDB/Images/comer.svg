<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comer</text>
  <text x="50" y="120" class="subtitle">[ˈkʌmər] n. 来者，来访者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (来) + -er (者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门，"来者(com-er)"
    <tspan x="50" dy="25">正从远处走来，准备进入这个门。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The comer was welcomed with open arms.
  </text>
  <text x="50" y="310" class="content">
    来访者受到了热情的欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Person approaching -->
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="250" y1="170" x2="250" y2="220" class="image" />
    <line x1="250" y1="220" x2="230" y2="250" class="image" />
    <line x1="250" y1="220" x2="270" y2="250" class="image" />
    <line x1="250" y1="190" x2="220" y2="180" class="image" />
    <line x1="250" y1="190" x2="280" y2="180" class="image" />
    <!-- Path -->
    <line x1="250" y1="260" x2="100" y2="300" class="image" />
  </g>
</svg>