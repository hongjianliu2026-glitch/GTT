<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commonplace</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmənpleɪs] adj. 平凡的，普通的；n. 老生常谈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> common (普通的) + place (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个平凡的街道，"普通的地方(common-place)"
    <tspan x="50" dy="25">上，每个人都在重复着同样的事情，这就是平凡(commonplace)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's a commonplace that technology changes rapidly.
  </text>
  <text x="50" y="310" class="content">
    科技变化迅速是老生常谈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="20" width="50" height="100" class="image" />
    <rect x="190" y="20" width="50" height="100" class="image" />
    <rect x="260" y="20" width="50" height="100" class="image" />
    <!-- People -->
    <circle cx="75" cy="140" r="10" class="image" />
    <circle cx="145" cy="140" r="10" class="image" />
    <circle cx="215" cy="140" r="10" class="image" />
    <circle cx="285" cy="140" r="10" class="image" />
    <!-- Actions -->
    <line x1="75" y1="150" x2="75" y2="180" class="image" />
    <line x1="145" y1="150" x2="145" y2="180" class="image" />
    <line x1="215" y1="150" x2="215" y2="180" class="image" />
    <line x1="285" y1="150" x2="285" y2="180" class="image" />
  </g>
</svg>