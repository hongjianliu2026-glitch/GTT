<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enriched</text>
  <text x="50" y="120" class="subtitle">[ɪnˈrɪtʃt] adj. 富集的，丰富的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + rich (富有的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农民在田地里，"使(en-)"
    <tspan x="50" dy="25">土壤变得"富有(rich)"，从而种植出更丰富的作物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soil was enriched with organic matter.
  </text>
  <text x="50" y="310" class="content">
    土壤中加入了有机物质，变得更加肥沃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Farmer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Soil -->
    <rect x="50" y="100" width="200" height="100" class="image" />
    <!-- Enriched soil -->
    <rect x="50" y="100" width="200" height="100" class="image" fill="#D4EFDF" />
    <!-- Plants -->
    <line x1="70" y1="100" x2="70" y2="50" class="image" />
    <line x1="90" y1="100" x2="90" y2="50" class="image" />
    <line x1="110" y1="100" x2="110" y2="50" class="image" />
    <line x1="130" y1="100" x2="130" y2="50" class="image" />
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <line x1="170" y1="100" x2="170" y2="50" class="image" />
    <line x1="190" y1="100" x2="190" y2="50" class="image" />
  </g>
</svg>