<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entangle</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtæŋɡl] v. 缠住，使卷入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + tangle (纠缠)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫被"卷入(en-tangle)"了一团毛线，
    <tspan x="50" dy="25">它的爪子被紧紧缠住，无法脱身。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fisherman's net got entangled in the rocks.
  </text>
  <text x="50" y="310" class="content">
    渔夫的网被岩石缠住了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Yarn -->
    <path d="M100,100 C120,80 160,80 180,100 S220,120 240,100" class="image" />
    <path d="M100,120 C120,100 160,100 180,120 S220,140 240,120" class="image" />
    <path d="M100,140 C120,120 160,120 180,140 S220,160 240,140" class="image" />
    <path d="M100,160 C120,140 160,140 180,160 S220,180 240,160" class="image" />
    <!-- Entangled -->
    <line x1="60" y1="130" x2="120" y2="110" class="image" />
    <line x1="60" y1="150" x2="140" y2="130" class="image" />
    <line x1="60" y1="170" x2="160" y2="150" class="image" />
  </g>
</svg>