<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hostility</text>
  <text x="50" y="120" class="subtitle">[hɒˈstɪlɪti] n. 敌意，敌对</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> host (敌人) + -ility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战场，"敌人(host)"之间充满了
    <tspan x="50" dy="25">"敌对(hostility)"的气氛，双方剑拔弩张。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting ended in hostility when both sides refused to compromise.
  </text>
  <text x="50" y="310" class="content">
    会议在双方拒绝妥协的情况下以敌意结束。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Swords -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <!-- Soldiers -->
    <circle cx="75" cy="100" r="15" class="image" />
    <circle cx="125" cy="100" r="15" class="image" />
    <circle cx="175" cy="100" r="15" class="image" />
    <circle cx="225" cy="100" r="15" class="image" />
    <!-- Arrows -->
    <line x1="50" y1="20" x2="200" y2="180" class="image" />
    <line x1="200" y1="20" x2="50" y2="180" class="image" />
  </g>
</svg>