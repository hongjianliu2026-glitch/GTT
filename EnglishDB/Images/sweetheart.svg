<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #4A4A4A; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #FF6F61; }
      .story { font: 16px serif; fill: #6A1B9A; }
      .image { stroke: #FF6F61; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sweetheart</text>
  <text x="50" y="120" class="subtitle">[ˈswiːthɑːrt] n. 心爱的人，甜心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sweet (甜的) + heart (心)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个甜蜜的场景，"甜心(sweetheart)"
    <tspan x="50" dy="25">是一个充满爱意和温暖的称呼，象征着</tspan>
    <tspan x="50" dy="25">两个人之间深厚的感情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She called him her sweetheart.
  </text>
  <text x="50" y="310" class="content">
    她称他为她的甜心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 31.7C10 15.1 25.1 0 41.7 0c16.6 0 31.7 15.1 31.7 31.7 0 16.6-15.1 31.7-31.7 31.7C25.1 63.4 10 48.3 10 31.7z" class="image" />
    <!-- Candy -->
    <rect x="50" y="20" width="30" height="60" class="image" />
    <circle cx="65" cy="50" r="10" class="image" />
    <!-- Couple -->
    <circle cx="120" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="120" y1="65" x2="150" y2="65" class="image" />
  </g>
</svg>