<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inexorably</text>
  <text x="50" y="120" class="subtitle">[ɪnˈɛksərəbli] adv. 无情地，不可阻挡地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + exor (请求) + -able (能...的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头滚下山坡，"不可请求(in-exor-able)"
    <tspan x="50" dy="25">停止，无情地(inexorably)滚落，无法阻挡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Time moves inexorably forward.
  </text>
  <text x="50" y="310" class="content">
    时间无情地向前推进。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 0 L200 200 Z" class="image" />
    <!-- Rolling stone -->
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="120" x2="100" y2="200" class="image" />
    <polygon points="90,190 100,200 110,190" class="image" />
  </g>
</svg>