<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outdoors</text>
  <text x="50" y="120" class="subtitle">[ˌaʊtˈdɔrz] adv. 在户外，在野外</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (外面) + doors (门)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走出家门，"外面(out)"
    <tspan x="50" dy="25">就是户外(outdoors)，享受大自然的美好。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We love to spend time outdoors during the summer.
  </text>
  <text x="50" y="310" class="content">
    我们喜欢在夏天花时间在户外。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Person -->
    <circle cx="200" cy="80" r="15" class="image" />
    <line x1="200" y1="95" x2="200" y2="130" class="image" />
    <line x1="200" y1="130" x2="180" y2="160" class="image" />
    <line x1="200" y1="130" x2="220" y2="160" class="image" />
    <line x1="200" y1="110" x2="230" y2="100" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Grass -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="50" y1="190" x2="50" y2="200" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="150" y1="190" x2="150" y2="200" class="image" />
    <line x1="200" y1="180" x2="200" y2="200" class="image" />
    <line x1="250" y1="190" x2="250" y2="200" class="image" />
    <line x1="300" y1="180" x2="300" y2="200" class="image" />
  </g>
</svg>