<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insulation</text>
  <text x="50" y="120" class="subtitle">[ˌɪnsəˈleɪʃn] n. 绝缘，隔离</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> insul (岛) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的岛屿(insul)，周围被海水包围，
    <tspan x="50" dy="25">这个岛屿就像一个绝缘体(insulation)，</tspan>
    <tspan x="50" dy="25">将内部与外部完全隔离开来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The house was well insulated against the cold.
  </text>
  <text x="50" y="310" class="content">
    这房子很好地隔绝了寒冷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Island -->
    <circle cx="150" cy="100" r="80" class="image" />
    <!-- Water -->
    <rect x="0" y="180" width="300" height="100" class="image" />
    <!-- Insulation symbol -->
    <line x1="50" y1="200" x2="250" y2="200" class="image" />
    <line x1="50" y1="220" x2="250" y2="220" class="image" />
    <line x1="50" y1="240" x2="250" y2="240" class="image" />
  </g>
</svg>