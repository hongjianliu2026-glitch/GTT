<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inject</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdʒekt] v. 注射，注入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + ject (投掷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生拿着注射器，"投掷(ject)"
    <tspan x="50" dy="25">药物进入(in)病人的体内，这就是注射(inject)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nurse injected the medicine into his arm.
  </text>
  <text x="50" y="310" class="content">
    护士把药注射进了他的手臂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Syringe -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="40" y="0" width="20" height="150" class="image" />
    <rect x="40" y="150" width="20" height="50" class="image" />
    <!-- Liquid -->
    <line x1="50" y1="150" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="50" y2="200" class="image" />
    <!-- Needle -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <!-- Patient -->
    <circle cx="200" cy="150" r="50" class="image" />
    <line x1="200" y1="200" x2="200" y2="300" class="image" />
    <line x1="200" y1="250" x2="150" y2="280" class="image" />
    <line x1="200" y1="250" x2="250" y2="280" class="image" />
    <!-- Injection -->
    <line x1="50" y1="250" x2="200" y2="250" class="image" />
  </g>
</svg>