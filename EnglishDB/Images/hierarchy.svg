<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hierarchy</text>
  <text x="50" y="120" class="subtitle">[ˈhaɪərɑːrki] n. 等级制度，层级结构</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hier- (神圣) + archy (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神圣的统治结构，"神圣的统治(hier-archy)"
    <tspan x="50" dy="25">形成了层层叠叠的等级制度(hierarchy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a strict hierarchy of authority.
  </text>
  <text x="50" y="310" class="content">
    公司有一个严格的权威等级制度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Top level -->
    <rect x="100" y="0" width="100" height="50" class="image" />
    <text x="140" y="30" class="content">Top</text>
    <!-- Middle level -->
    <rect x="75" y="70" width="150" height="50" class="image" />
    <text x="140" y="100" class="content">Middle</text>
    <!-- Bottom level -->
    <rect x="50" y="140" width="200" height="50" class="image" />
    <text x="140" y="170" class="content">Bottom</text>
    <!-- Lines connecting levels -->
    <line x1="150" y1="50" x2="150" y2="70" class="image" />
    <line x1="150" y1="120" x2="150" y2="140" class="image" />
  </g>
</svg>