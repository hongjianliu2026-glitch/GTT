<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">informal</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfɔːrml] adj. 非正式的，不拘礼节的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + formal (正式的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着拖鞋和短裤的人，"不(in-)"
    <tspan x="50" dy="25">穿正式的(formal)衣服，这就是非正式的(informal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had an informal meeting at the café.
  </text>
  <text x="50" y="310" class="content">
    我们在咖啡馆开了一个非正式的会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in casual clothes -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="80" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="80" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Casual clothes -->
    <rect x="30" y="120" width="40" height="20" class="image" /> <!-- Shorts -->
    <line x1="40" y1="140" x2="60" y2="140" class="image" /> <!-- Belt -->
    <line x1="45" y1="140" x2="45" y2="160" class="image" /> <!-- Left shoe -->
    <line x1="55" y1="140" x2="55" y2="160" class="image" /> <!-- Right shoe -->
  </g>
</svg>