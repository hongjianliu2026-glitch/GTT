<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">normalization</text>
  <text x="50" y="120" class="subtitle">[ˌnɔrmələˈzeɪʃn] n. 标准化，规范化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> norm (标准) + -al (形容词后缀) + -ize (动词后缀) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工厂里，工人们正在将一堆杂乱的零件"标准化(norm-al-ize-ation)"，
    <tspan x="50" dy="25">使它们都符合统一的标准，这样就能轻松组装成产品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company implemented a normalization process to improve efficiency.
  </text>
  <text x="50" y="310" class="content">
    公司实施了标准化流程以提高效率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Parts -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <!-- Standardized parts -->
    <rect x="50" y="100" width="30" height="30" class="image" />
    <rect x="100" y="100" width="30" height="30" class="image" />
    <rect x="150" y="100" width="30" height="30" class="image" />
    <rect x="200" y="100" width="30" height="30" class="image" />
    <!-- Worker -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>