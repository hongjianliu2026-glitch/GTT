<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F57F17; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Japanese</text>
  <text x="50" y="120" class="subtitle">[ˌdʒæpəˈniːz] n. 日本人，日语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Japan (日本) + -ese (表示“属于...的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着和服的日本人，站在富士山前，
    <tspan x="50" dy="25">说着流利的日语，这就是"Japanese"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is studying Japanese language and culture.
  </text>
  <text x="50" y="310" class="content">
    她正在学习日语和文化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mount Fuji -->
    <polygon points="0,150 100,0 200,150" class="image" />
    <!-- Kimono -->
    <rect x="70" y="160" width="60" height="100" class="image" />
    <line x1="100" y1="160" x2="100" y2="260" class="image" />
    <line x1="70" y1="210" x2="130" y2="210" class="image" />
    <!-- Face -->
    <circle cx="100" cy="140" r="15" class="image" />
    <line x1="90" y1="145" x2="110" y2="145" class="image" />
    <line x1="100" y1="150" x2="100" y2="160" class="image" />
  </g>
</svg>