<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coveralls</text>
  <text x="50" y="120" class="subtitle">[kʌvərɔːlz] n. 连体工作服</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cover (覆盖) + all (全部) + s (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人穿着"覆盖全身(cover-all-s)"的连体工作服，
    <tspan x="50" dy="25">这件衣服从头到脚保护着他，防止任何污渍和伤害。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mechanic wore coveralls to protect his clothes.
  </text>
  <text x="50" y="310" class="content">
    机械师穿着连体工作服以保护他的衣服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coveralls -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person wearing coveralls -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <!-- Coveralls design -->
    <rect x="30" y="70" width="40" height="80" class="image" />
    <rect x="70" y="70" width="40" height="80" class="image" />
    <rect x="30" y="150" width="40" height="50" class="image" />
    <rect x="70" y="150" width="40" height="50" class="image" />
  </g>
</svg>