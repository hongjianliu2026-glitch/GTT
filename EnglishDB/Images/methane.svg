<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .molecule { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">methane</text>
  <text x="50" y="120" class="subtitle">[ˈmɛθeɪn] n. 甲烷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meth- (甲基) + -ane (烷烃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的甲烷分子，"甲基(meth-)"
    <tspan x="50" dy="25">和"烷烃(-ane)"结合，形成了一个强大的气体分子(methane)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Methane is a major component of natural gas.
  </text>
  <text x="50" y="310" class="content">
    甲烷是天然气的主要成分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Methane molecule -->
    <circle cx="50" cy="100" r="20" class="molecule" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="120" x2="100" y2="150" class="image" />
    <line x1="50" y1="120" x2="0" y2="150" class="image" />
    <line x1="50" y1="180" x2="100" y2="210" class="image" />
    <line x1="50" y1="180" x2="0" y2="210" class="image" />
    <!-- Hydrogen atoms -->
    <circle cx="100" cy="150" r="10" class="molecule" />
    <circle cx="0" cy="150" r="10" class="molecule" />
    <circle cx="100" cy="210" r="10" class="molecule" />
    <circle cx="0" cy="210" r="10" class="molecule" />
  </g>
</svg>