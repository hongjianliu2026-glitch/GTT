<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">momentum</text>
  <text x="50" y="120" class="subtitle">[moʊˈmɛntəm] n. 动量，势头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 momentum (运动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的球体在斜坡上滚动，"运动(momentum)"
    <tspan x="50" dy="25">的力量让它越来越快，无法停止。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project gained momentum as more people joined.
  </text>
  <text x="50" y="310" class="content">
    随着越来越多的人加入，这个项目获得了势头。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Slope -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <!-- Ball -->
    <circle cx="50" cy="150" r="30" class="image" />
    <!-- Path of the ball -->
    <path d="M50 150 Q100 100 150 150 Q200 200 250 150 Q300 100 350 150" class="image" />
  </g>
</svg>