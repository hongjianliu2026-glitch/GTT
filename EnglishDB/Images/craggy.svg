<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">craggy</text>
  <text x="50" y="120" class="subtitle">[ˈkræɡi] adj. 多峭壁的，崎岖的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crag (峭壁) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座山，峭壁(crag)林立，崎岖不平，
    <tspan x="50" dy="25">仿佛被大自然雕刻成了一个巨大的雕塑，这就是craggy的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The craggy mountains were difficult to climb.
  </text>
  <text x="50" y="310" class="content">
    多峭壁的山脉很难攀登。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 100,0 200,200" class="image" />
    <!-- Crags -->
    <line x1="50" y1="100" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="90" y2="100" class="image" />
    <line x1="100" y1="120" x2="120" y2="170" class="image" />
    <line x1="120" y1="170" x2="140" y2="120" class="image" />
    <!-- Text annotation -->
    <text x="100" y="250" class="content">峭壁</text>
  </g>
</svg>