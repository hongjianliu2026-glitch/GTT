<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crumble</text>
  <text x="50" y="120" class="subtitle">[ˈkrʌmbl] v. 弄碎，崩溃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crum (碎) + ble (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块巨大的饼干，"碎成(crum-ble)"
    <tspan x="50" dy="25">无数小块，散落一地，这就是crumble的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old wall began to crumble under the heavy rain.
  </text>
  <text x="50" y="310" class="content">
    那堵旧墙在暴雨中开始崩塌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken cookie -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="120" cy="100" r="20" class="image" />
    <circle cx="180" cy="100" r="25" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="320" cy="100" r="20" class="image" />
    <!-- Crumb lines -->
    <line x1="50" y1="130" x2="320" y2="130" class="image" />
    <line x1="50" y1="160" x2="320" y2="160" class="image" />
    <line x1="50" y1="190" x2="320" y2="190" class="image" />
  </g>
</svg>