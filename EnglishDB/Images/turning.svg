<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turning</text>
  <text x="50" y="120" class="subtitle">[ˈtɜːrnɪŋ] n. 旋转，转弯；v. 转动（turn的现在分词）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> turn (转动) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在道路上"转动(turn)"方向盘，
    <tspan x="50" dy="25">进行着转弯(turning)的动作，画面中车轮在旋转。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car made a sharp turning at the intersection.
  </text>
  <text x="50" y="310" class="content">
    汽车在十字路口急转弯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="100" y="50" width="150" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="230" cy="100" r="15" class="image" />
    <!-- Steering wheel -->
    <circle cx="175" cy="75" r="10" class="image" />
    <line x1="175" y1="75" x2="175" y2="55" class="image" />
  </g>
</svg>