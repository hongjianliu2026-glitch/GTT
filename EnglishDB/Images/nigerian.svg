<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Nigerian</text>
  <text x="50" y="120" class="subtitle">[naɪˈdʒɪəriən] adj. 尼日利亚的；n. 尼日利亚人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Niger (拉丁语，意为“黑色”) + -ian (表示“属于...的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个身穿传统服饰的尼日利亚人，站在一片广袤的非洲草原上，
    <tspan x="50" dy="25">阳光照耀下，他的皮肤闪耀着“黑色(Niger)”的光芒，象征着他的身份(ian)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Nigerian market is known for its vibrant colors and rich culture.
  </text>
  <text x="50" y="310" class="content">
    尼日利亚市场以其充满活力的色彩和丰富的文化而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- African landscape -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Nigerian person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="170" class="image" />
    <line x1="175" y1="150" x2="200" y2="170" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
  </g>
</svg>