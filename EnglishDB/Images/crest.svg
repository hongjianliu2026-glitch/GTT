<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crest</text>
  <text x="50" y="120" class="subtitle">[krɛst] n. 山顶，顶峰；v. 到达顶点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cres- (生长) + -t (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座山，"生长(cres-)"到最高点，
    <tspan x="50" dy="25">形成了山的顶峰(crest)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The climbers reached the crest of the mountain at dawn.
  </text>
  <text x="50" y="310" class="content">
    登山者在黎明时分到达了山顶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Crest -->
    <line x1="150" y1="0" x2="150" y2="20" class="image" />
    <line x1="140" y1="10" x2="160" y2="10" class="image" />
    <line x1="130" y1="20" x2="170" y2="20" class="image" />
    <!-- Climber -->
    <circle cx="150" cy="25" r="5" class="image" />
    <line x1="150" y1="30" x2="150" y2="40" class="image" />
    <line x1="150" y1="40" x2="140" y2="50" class="image" />
    <line x1="150" y1="40" x2="160" y2="50" class="image" />
    <line x1="150" y1="35" x2="170" y2="30" class="image" />
  </g>
</svg>