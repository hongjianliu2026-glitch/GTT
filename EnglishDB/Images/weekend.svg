<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">weekend</text>
  <text x="50" y="120" class="subtitle">[ˈwiːkend] n. 周末</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> week (周) + end (结束)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的上班族，"一周(week)"
    <tspan x="50" dy="25">的工作终于"结束(end)"，迎来了放松的"周末(weekend)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We usually go hiking on the weekend.
  </text>
  <text x="50" y="310" class="content">
    我们通常在周末去远足。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Weekday calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <rect x="330" y="20" width="50" height="160" class="image" />
    <!-- Weekend calendar -->
    <rect x="50" y="20" width="50" height="160" class="image" fill="#2ECC71" />
    <rect x="120" y="20" width="50" height="160" class="image" fill="#2ECC71" />
    <!-- Person relaxing -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F1C40F" />
    <line x1="270" y1="50" x2="330" y2="50" class="image" />
    <line x1="300" y1="20" x2="300" y2="80" class="image" />
    <line x1="285" y1="35" x2="315" y2="65" class="image" />
    <line x1="315" y1="35" x2="285" y2="65" class="image" />
  </g>
</svg>