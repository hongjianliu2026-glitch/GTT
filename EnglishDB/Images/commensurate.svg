<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commensurate</text>
  <text x="50" y="120" class="subtitle">[kəˈmɛnʃərɪt] adj. 相称的，相当的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + mensur (测量) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在测量一条绳子，"共同测量(com-mensur)"
    <tspan x="50" dy="25">的结果是相等的，这就是相称的(commensurate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her salary is commensurate with her experience.
  </text>
  <text x="50" y="310" class="content">
    她的薪水与她的经验相称。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ruler -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="50" y1="40" x2="350" y2="40" class="image" />
    <line x1="50" y1="60" x2="350" y2="60" class="image" />
    <line x1="50" y1="80" x2="350" y2="80" class="image" />
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <!-- People measuring -->
    <circle cx="100" cy="60" r="15" class="image" />
    <line x1="100" y1="75" x2="100" y2="110" class="image" />
    <line x1="100" y1="110" x2="80" y2="140" class="image" />
    <line x1="100" y1="110" x2="120" y2="140" class="image" />
    <line x1="100" y1="90" x2="150" y2="80" class="image" />
    <circle cx="300" cy="60" r="15" class="image" />
    <line x1="300" y1="75" x2="300" y2="110" class="image" />
    <line x1="300" y1="110" x2="280" y2="140" class="image" />
    <line x1="300" y1="110" x2="320" y2="140" class="image" />
    <line x1="300" y1="90" x2="350" y2="80" class="image" />
    <!-- Measuring marks -->
    <line x1="100" y1="20" x2="100" y2="120" class="image" />
    <line x1="300" y1="20" x2="300" y2="120" class="image" />
  </g>
</svg>