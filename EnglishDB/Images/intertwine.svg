<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intertwine</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈtwaɪn] v. 缠绕，交织</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + twine (缠绕)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两根绳子在空中"相互缠绕(inter-twine)"，
    <tspan x="50" dy="25">形成了一个复杂的结，这就是intertwine的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vines intertwined around the tree trunk.
  </text>
  <text x="50" y="310" class="content">
    藤蔓缠绕在树干上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- First rope -->
    <path d="M0,0 Q50,100 100,0" class="image" />
    <!-- Second rope -->
    <path d="M100,0 Q50,-100 0,0" class="image" />
    <!-- Intertwined ropes -->
    <path d="M50,50 Q25,75 75,75 Q25,25 75,25" class="image" />
  </g>
</svg>