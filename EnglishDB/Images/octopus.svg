<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">octopus</text>
  <text x="50" y="120" class="subtitle">[ˈɒktəpəs] n. 章鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> octo- (八) + pus (脚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只章鱼，它有八只脚(octo-pus)，
    <tspan x="50" dy="25">每只脚都在水中灵活地舞动，就像一个八脚的舞者。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The octopus used its tentacles to catch the fish.
  </text>
  <text x="50" y="310" class="content">
    章鱼用它的触须捕捉鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Octopus body -->
    <circle cx="100" cy="100" r="50" class="image" fill="#8E44AD" />
    <!-- Tentacles -->
    <line x1="100" y1="150" x2="50" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <line x1="100" y1="150" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="150" y2="50" class="image" />
    <line x1="100" y1="150" x2="50" y2="100" class="image" />
    <line x1="100" y1="150" x2="0" y2="150" class="image" />
    <line x1="100" y1="150" x2="50" y2="250" class="image" />
  </g>
</svg>