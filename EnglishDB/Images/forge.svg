<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forge</text>
  <text x="50" y="120" class="subtitle">[fɔːrdʒ] v. 锻造，伪造；n. 铁匠铺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (力量) + ge (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个铁匠在铁匠铺里，"用力工作(for-ge)"
    <tspan x="50" dy="25">，将铁块锻造成各种工具和武器。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The blacksmith forged a new sword for the knight.
  </text>
  <text x="50" y="310" class="content">
    铁匠为骑士锻造了一把新剑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Anvil -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Hammer -->
    <line x1="100" y1="10" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="80" y2="70" class="image" />
    <line x1="100" y1="50" x2="120" y2="70" class="image" />
    <!-- Iron -->
    <rect x="80" y="60" width="40" height="20" class="image" />
    <!-- Blacksmith -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
  </g>
</svg>