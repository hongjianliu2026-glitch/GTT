<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">firestorm</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪərstɔrm] n. 火风暴，大火灾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fire (火) + storm (风暴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场巨大的风暴，"火(fire)"
    <tspan x="50" dy="25">与"风暴(storm)"结合，形成了一场</tspan>
    <tspan x="50" dy="25">毁灭性的"火风暴(firestorm)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The firestorm caused extensive damage to the city.
  </text>
  <text x="50" y="310" class="content">
    火风暴给城市造成了巨大的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Storm cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Flames -->
    <polygon points="50,200 100,150 150,200 100,180" class="flame" />
    <polygon points="100,200 150,150 200,200 150,180" class="flame" />
    <polygon points="150,200 200,150 250,200 200,180" class="flame" />
    <polygon points="200,200 250,150 300,200 250,180" class="flame" />
    <!-- Lightning -->
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
  </g>
</svg>