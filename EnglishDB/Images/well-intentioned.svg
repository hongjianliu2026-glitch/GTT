<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">well-intentioned</text>
  <text x="50" y="120" class="subtitle">[ˌwɛl ɪnˈtɛnʃənd] adj. 善意的，出于好意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> well (好) + intention (意图) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人心中充满了"好意图(well-intentioned)"，
    <tspan x="50" dy="25">他的脸上洋溢着善意，仿佛在说：“我这样做是为了你好。”</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His well-intentioned advice was not well received.
  </text>
  <text x="50" y="310" class="content">
    他善意的建议并没有被很好地接受。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 C50,20 90,20 90,50 S130,80 130,50" class="image" />
    <!-- Smiling face -->
    <circle cx="90" cy="100" r="30" class="image" />
    <circle cx="75" cy="90" r="5" class="image" />
    <circle cx="105" cy="90" r="5" class="image" />
    <path d="M75,110 Q90,120 105,110" class="image" />
    <!-- Text inside heart -->
    <text x="60" y="60" class="content" fill="#E74C3C">好意图</text>
  </g>
</svg>