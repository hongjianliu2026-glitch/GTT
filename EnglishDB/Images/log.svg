<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">log</text>
  <text x="50" y="120" class="subtitle">[lɔɡ] n. 原木，日志；v. 记录</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> log (原木，记录)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的航海家，在船上用"原木(log)"
    <tspan x="50" dy="25">记录航行的日志，这些记录帮助他记住航程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The captain kept a detailed log of the voyage.
  </text>
  <text x="50" y="310" class="content">
    船长详细记录了航行的日志。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Log -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Sailor -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <line x1="250" y1="90" x2="280" y2="80" class="image" />
    <!-- Pen -->
    <line x1="250" y1="70" x2="280" y2="70" class="image" />
    <line x1="280" y1="70" x2="280" y2="50" class="image" />
  </g>
</svg>