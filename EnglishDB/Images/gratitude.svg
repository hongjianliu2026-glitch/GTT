<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gratitude</text>
  <text x="50" y="120" class="subtitle">[ˈɡrætɪˌtjuːd] n. 感激，感谢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grat (高兴) + -itude (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为收到礼物而感到"高兴(grat)"，
    <tspan x="50" dy="25">这种"状态(-itude)"就是感激(gratitude)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She expressed her gratitude for the thoughtful gift.
  </text>
  <text x="50" y="310" class="content">
    她对那份贴心的礼物表达了感激之情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <!-- Gift box -->
    <rect x="50" y="50" width="100" height="60" class="image" />
    <!-- Bow -->
    <path d="M100 50 Q120 40 100 30" class="image" />
    <path d="M100 30 Q80 40 100 50" class="image" />
    <!-- Smiling face -->
    <circle cx="20" cy="100" r="15" class="image" />
    <circle cx="15" cy="95" r="2" class="image" />
    <circle cx="25" cy="95" r="2" class="image" />
    <path d="M15 110 Q20 115 25 110" class="image" />
  </g>
</svg>