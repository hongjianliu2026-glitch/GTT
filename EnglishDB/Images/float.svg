<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">float</text>
  <text x="50" y="120" class="subtitle">[floʊt] v. 漂浮，浮动；n. 浮子，漂浮物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fl- (流动) + -oat (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球在空中"流动(fl-)"，
    <tspan x="50" dy="25">它轻轻地"动作(oat)"，就像在空中漂浮(float)一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boat floated gently on the calm lake.
  </text>
  <text x="50" y="310" class="content">
    小船在平静的湖面上轻轻漂浮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Balloon -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <!-- Rope -->
    <line x1="100" y1="130" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <!-- Basket -->
    <rect x="140" y="180" width="20" height="10" class="image" />
  </g>
</svg>