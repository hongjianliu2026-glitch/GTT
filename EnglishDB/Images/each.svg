<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">each</text>
  <text x="50" y="120" class="subtitle">[iːtʃ] adj. 每个，各自的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + ach (强调)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群苹果，"每个(each)"苹果都被单独挑选出来，
    <tspan x="50" dy="25">强调它们各自的独特性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Each student received a different book.
  </text>
  <text x="50" y="310" class="content">
    每个学生都收到了不同的书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apples -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Arrows -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <polygon points="45,120 55,120 50,130" class="image" />
    <polygon points="145,120 155,120 150,130" class="image" />
    <polygon points="245,120 255,120 250,130" class="image" />
    <!-- Labels -->
    <text x="40" y="150" class="content">Each</text>
    <text x="140" y="150" class="content">Each</text>
    <text x="240" y="150" class="content">Each</text>
  </g>
</svg>