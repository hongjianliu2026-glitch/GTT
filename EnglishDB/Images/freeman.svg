<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Freeman</text>
  <text x="50" y="120" class="subtitle">[ˈfriːmən] n. 自由人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> free (自由) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"自由(free)"的人(man)，他摆脱了束缚，
    <tspan x="50" dy="25">像鸟儿一样在天空中翱翔，这就是自由人(Freeman)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He became a freeman after years of struggle.
  </text>
  <text x="50" y="310" class="content">
    经过多年的奋斗，他成为了一个自由人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Bird -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" fill="none" stroke="#34495E" stroke-width="3" />
    <!-- Person -->
    <circle cx="150" cy="100" r="15" class="image" fill="#34495E" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Chain -->
    <line x1="150" y1="115" x2="150" y2="180" class="image" stroke-dasharray="5,5" />
  </g>
</svg>