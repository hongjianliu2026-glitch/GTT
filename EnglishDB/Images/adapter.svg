<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adapter</text>
  <text x="50" y="120" class="subtitle">[əˈdæptər] n. 适配器，转接器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + apt (适合) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神奇的装置，"朝向(ad-)"
    <tspan x="50" dy="25">不同的设备，使其"适合(apt)"连接，</tspan>
    <tspan x="50" dy="25">这个装置就是适配器(adapter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I need an adapter to connect my laptop to the projector.
  </text>
  <text x="50" y="310" class="content">
    我需要一个适配器来连接我的笔记本电脑和投影仪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Adapter -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <!-- Plug -->
    <rect x="20" y="50" width="60" height="20" class="image" />
    <!-- Socket -->
    <rect x="40" y="70" width="20" height="20" class="image" />
    <!-- Cable -->
    <line x1="50" y1="90" x2="50" y2="150" class="image" />
    <!-- Device -->
    <rect x="30" y="160" width="40" height="20" class="image" />
  </g>
</svg>