<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">camper</text>
  <text x="50" y="120" class="subtitle">[ˈkæmpər] n. 露营者，野营车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> camp (营地) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个露营者(camper)在营地(camp)里，
    <tspan x="50" dy="25">搭起帐篷，享受大自然的美好时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They bought a new camper for their summer vacation.
  </text>
  <text x="50" y="310" class="content">
    他们为暑假买了一辆新的野营车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tent -->
    <polygon points="50,100 150,100 100,50" class="image" />
    <!-- Ground -->
    <rect x="0" y="100" width="200" height="50" class="image" />
    <!-- Camper -->
    <circle cx="100" cy="75" r="15" class="image" />
    <line x1="100" y1="90" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="140" class="image" />
    <line x1="100" y1="120" x2="120" y2="140" class="image" />
    <line x1="100" y1="100" x2="130" y2="90" class="image" />
  </g>
</svg>