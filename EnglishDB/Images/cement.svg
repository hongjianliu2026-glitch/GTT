<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cement</text>
  <text x="50" y="120" class="subtitle">[sɪˈment] n. 水泥；v. 粘合，巩固</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cem (放置) + -ent (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人正在用水泥(cement)
    <tspan x="50" dy="25">粘合(cement)两块石头，就像用胶水一样，</tspan>
    <tspan x="50" dy="25">把它们牢牢地固定在一起。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The workers cemented the bricks together to build a wall.
  </text>
  <text x="50" y="310" class="content">
    工人们用水泥把砖块粘合在一起，建造了一堵墙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cement bag -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <text x="20" y="50" class="content" style="fill: #000;">Cement</text>
    <!-- Worker -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="90" x2="240" y2="80" class="image" />
    <!-- Stones -->
    <rect x="250" y="0" width="100" height="100" class="image" />
    <rect x="360" y="0" width="100" height="100" class="image" />
    <!-- Cementing action -->
    <line x1="350" y1="50" x2="360" y2="50" class="image" />
    <line x1="350" y1="60" x2="360" y2="60" class="image" />
    <line x1="350" y1="70" x2="360" y2="70" class="image" />
  </g>
</svg>