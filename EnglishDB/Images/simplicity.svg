<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">simplicity</text>
  <text x="50" y="120" class="subtitle">[sɪmˈplɪsəti] n. 简单，朴素</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> simpli- (简单) + -city (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在画布上，"简单地(simpli-)"
    <tspan x="50" dy="25">用几笔勾勒出一幅美丽的风景，这就是简单(simplicity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beauty of the design lies in its simplicity.
  </text>
  <text x="50" y="310" class="content">
    这个设计的美在于它的简单。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canvas -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Simple landscape -->
    <line x1="50" y1="180" x2="300" y2="180" class="image" /> <!-- Ground -->
    <circle cx="100" cy="150" r="30" class="image" /> <!-- Sun -->
    <line x1="150" y1="180" x2="150" y2="100" class="image" /> <!-- Tree trunk -->
    <line x1="140" y1="140" x2="160" y2="140" class="image" /> <!-- Tree branch -->
    <line x1="145" y1="120" x2="155" y2="120" class="image" /> <!-- Tree branch -->
    <line x1="150" y1="100" x2="150" y2="80" class="image" /> <!-- Tree branch -->
  </g>
</svg>