<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">epitomize</text>
  <text x="50" y="120" class="subtitle">[ɪˈpɪtəmaɪz] v. 概括，代表</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> epi- (在...上) + tom (切割) + -ize (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高处，"在上面切割(epi-tom)"
    <tspan x="50" dy="25">出一个事物的核心，这个核心就代表了整个事物(epitomize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Eiffel Tower epitomizes Paris.
  </text>
  <text x="50" y="310" class="content">
    埃菲尔铁塔是巴黎的象征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person on a pedestal -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="150" y="20" width="50" height="160" class="image" />
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Cutting action -->
    <line x1="220" y1="100" x2="320" y2="100" class="image" />
    <line x1="220" y1="100" x2="270" y2="50" class="image" />
    <line x1="270" y1="50" x2="320" y2="100" class="image" />
    <!-- Core representation -->
    <circle cx="270" cy="100" r="20" class="image" />
  </g>
</svg>