<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overseer</text>
  <text x="50" y="120" class="subtitle">[ˈoʊvərˈsiːər] n. 监工，监督者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + see (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个监工站在高处，"从上面看(over-see)"
    <tspan x="50" dy="25">着工人们的工作，确保一切顺利进行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The overseer ensured that the construction work was completed on time.
  </text>
  <text x="50" y="310" class="content">
    监工确保了建筑工作按时完成。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- High platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Overseer -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="90" x2="240" y2="80" class="image" />
    <!-- Workers -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="140" y2="165" class="image" />
    <circle cx="300" cy="150" r="15" class="image" />
    <line x1="300" y1="165" x2="300" y2="190" class="image" />
    <line x1="300" y1="190" x2="280" y2="220" class="image" />
    <line x1="300" y1="190" x2="320" y2="220" class="image" />
    <line x1="300" y1="175" x2="340" y2="165" class="image" />
  </g>
</svg>