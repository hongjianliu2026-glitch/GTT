<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Islamist</text>
  <text x="50" y="120" class="subtitle">[ˈɪsləmɪst] n. 伊斯兰主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Islam (伊斯兰) + -ist (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个虔诚的伊斯兰主义者，头戴白色头巾，
    <tspan x="50" dy="25">手持古兰经，站在清真寺前，象征着对伊斯兰教的信仰和奉献。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Islamist leader gave a passionate speech about unity.
  </text>
  <text x="50" y="310" class="content">
    这位伊斯兰主义领袖发表了关于团结的热情演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mosque -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,20 300,20 175,150" class="image" />
    <!-- Headscarf -->
    <rect x="150" y="20" width="50" height="30" class="image" />
    <!-- Quran -->
    <rect x="140" y="60" width="70" height="100" class="image" />
    <!-- Person -->
    <circle cx="175" cy="180" r="15" class="image" />
    <line x1="175" y1="195" x2="175" y2="230" class="image" />
    <line x1="175" y1="230" x2="155" y2="260" class="image" />
    <line x1="175" y1="230" x2="195" y2="260" class="image" />
    <line x1="175" y1="210" x2="205" y2="200" class="image" />
  </g>
</svg>