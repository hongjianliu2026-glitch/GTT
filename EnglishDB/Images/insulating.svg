<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insulating</text>
  <text x="50" y="120" class="subtitle">[ˈɪnsəˌleɪtɪŋ] adj. 绝缘的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + -sul (岛) + -ate (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的岛屿(sul)被一层绝缘材料包裹，"进入(in)"
    <tspan x="50" dy="25">这个岛屿的任何热量都无法逃逸，这就是绝缘(insulating)的效果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The walls are insulated to keep the house warm.
  </text>
  <text x="50" y="310" class="content">
    墙壁是绝缘的，以保持房子温暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Island -->
    <circle cx="150" cy="100" r="80" class="image" />
    <!-- Insulation layer -->
    <circle cx="150" cy="100" r="70" class="image" stroke-dasharray="5,5" />
    <!-- Heat escaping -->
    <line x1="150" y1="20" x2="150" y2="80" class="image" stroke-dasharray="5,5" />
    <line x1="100" y1="50" x2="140" y2="90" class="image" stroke-dasharray="5,5" />
    <line x1="200" y1="50" x2="160" y2="90" class="image" stroke-dasharray="5,5" />
  </g>
</svg>