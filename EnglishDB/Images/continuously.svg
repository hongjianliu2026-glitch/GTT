<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">continuously</text>
  <text x="50" y="120" class="subtitle">[kənˈtɪnjuəsli] adv. 连续不断地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tinu (保持) + -ous (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条永不停歇的河流，"保持(tinu)"
    <tspan x="50" dy="25">流动，"一起(con)"没有间断，这就是连续不断(continuously)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The machine operates continuously for 24 hours.
  </text>
  <text x="50" y="310" class="content">
    这台机器连续工作了24小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 0 Q100 50 200 0 T400 0" class="image" />
    <path d="M0 20 Q100 70 200 20 T400 20" class="image" />
    <path d="M0 40 Q100 90 200 40 T400 40" class="image" />
    <path d="M0 60 Q100 110 200 60 T400 60" class="image" />
    <path d="M0 80 Q100 130 200 80 T400 80" class="image" />
    <path d="M0 100 Q100 150 200 100 T400 100" class="image" />
  </g>
</svg>