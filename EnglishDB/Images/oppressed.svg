<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oppressed</text>
  <text x="50" y="120" class="subtitle">[əˈprest] adj. 受压迫的，受压制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> op- (加强) + press (压) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被巨大的石头"压在(press)"身上，
    <tspan x="50" dy="25">无法动弹，这就是"受压迫的(oppressed)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oppressed people finally rose up against their oppressors.
  </text>
  <text x="50" y="310" class="content">
    受压迫的人民最终起来反抗压迫者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />

    <!-- Stone -->
    <rect x="20" y="50" width="60" height="50" class="image" />
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <line x1="20" y1="75" x2="80" y2="75" class="image" />
    <line x1="20" y1="100" x2="80" y2="100" class="image" />
  </g>
</svg>