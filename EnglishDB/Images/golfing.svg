<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">golfing</text>
  <text x="50" y="120" class="subtitle">[ˈɡɒlfɪŋ] n. 打高尔夫球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> golf (高尔夫球) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个高尔夫球手在绿茵场上，挥动球杆，
    <tspan x="50" dy="25">球飞向远方，这就是打高尔夫球(golfing)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He enjoys golfing on weekends.
  </text>
  <text x="50" y="310" class="content">
    他喜欢在周末打高尔夫球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Golf course -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Golf ball -->
    <circle cx="50" cy="100" r="10" class="image" />
    <!-- Golf club -->
    <line x1="70" y1="100" x2="150" y2="50" class="image" />
    <!-- Golf player -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <line x1="100" y1="165" x2="130" y2="155" class="image" />
  </g>
</svg>