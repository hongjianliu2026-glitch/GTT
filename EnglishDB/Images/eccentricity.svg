<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eccentricity</text>
  <text x="50" y="120" class="subtitle">[ˌɛksɛnˈtrɪsɪti] n. 古怪，反常</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ec- (出) + centr (中心) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个圆圈的中心，但他却"走出(ec-)"了中心，
    <tspan x="50" dy="25">行为变得"古怪(eccentricity)"，与常人不同。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His eccentricity made him the talk of the town.
  </text>
  <text x="50" y="310" class="content">
    他的古怪行为使他成为镇上的话题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Person at the center -->
    <circle cx="175" cy="100" r="15" class="image" />
    <!-- Person moving out of the center -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="190" y1="100" x2="235" y2="100" class="image" />
    <!-- Arrow pointing to the eccentric person -->
    <polygon points="260,90 260,110 280,100" class="image" />
    <!-- Text label -->
    <text x="290" y="105" class="content">eccentricity</text>
  </g>
</svg>