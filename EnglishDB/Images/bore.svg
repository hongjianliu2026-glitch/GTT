<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bore</text>
  <text x="50" y="120" class="subtitle">[bɔːr] v. 钻孔，使厌烦；n. 令人厌烦的人或事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bor (钻孔)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钻头在地下"钻孔(bor)"，
    <tspan x="50" dy="25">发出刺耳的声音，让人感到极度厌烦(bore)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lecture bored me to tears.
  </text>
  <text x="50" y="310" class="content">
    那个讲座让我无聊得想哭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Drill -->
    <line x1="0" y1="0" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="0" y2="0" class="image" />
    <!-- Ground -->
    <rect x="0" y="200" width="200" height="50" class="image" />
    <!-- Bored face -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="85" cy="90" r="5" class="image" />
    <circle cx="115" cy="90" r="5" class="image" />
    <line x1="85" y1="115" x2="115" y2="115" class="image" />
  </g>
</svg>