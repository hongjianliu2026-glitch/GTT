<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ugliness</text>
  <text x="50" y="120" class="subtitle">[ˈʌɡlɪnəs] n. 丑陋，难看</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ugl (丑陋) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个丑陋的怪物，它的脸上有许多扭曲的线条，
    <tspan x="50" dy="25">这些线条代表了"丑陋(ugl)"，而"-ness"则强调了这种状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ugliness of the graffiti on the wall was shocking.
  </text>
  <text x="50" y="310" class="content">
    墙上的涂鸦丑陋得令人震惊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Nose -->
    <line x1="100" y1="100" x2="100" y2="140" class="image" />
    <!-- Mouth -->
    <path d="M60 160 Q100 180 140 160" class="image" />
    <!-- Distorted lines -->
    <line x1="20" y1="20" x2="180" y2="180" class="image" />
    <line x1="20" y1="180" x2="180" y2="20" class="image" />
  </g>
</svg>