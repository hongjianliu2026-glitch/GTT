<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transient</text>
  <text x="50" y="120" class="subtitle">[ˈtrænziənt] adj. 短暂的，瞬时的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + ient (存在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个瞬间"跨越(trans-)"的"存在(ient)"，
    <tspan x="50" dy="25">就像流星划过夜空，转瞬即逝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The joy of winning was transient, as the team soon faced new challenges.
  </text>
  <text x="50" y="310" class="content">
    获胜的喜悦是短暂的，因为团队很快面临新的挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Star -->
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Shooting star -->
    <line x1="175" y1="100" x2="250" y2="50" class="image" />
    <line x1="175" y1="100" x2="250" y2="150" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="180" rx="80" ry="30" class="image" />
    <ellipse cx="250" cy="180" rx="80" ry="30" class="image" />
  </g>
</svg>