<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FF6347; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">color</text>
  <text x="50" y="120" class="subtitle">[ˈkʌlər] n. 颜色；v. 给...着色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (共同) + or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家在调色板上，"共同(col-)"
    <tspan x="50" dy="25">混合各种颜料，创造出丰富多彩的颜色(color)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a variety of colors to paint the sunset.
  </text>
  <text x="50" y="310" class="content">
    她用多种颜色来画日落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Palette -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Colors -->
    <circle cx="50" cy="100" r="30" fill="#FF6347" />
    <circle cx="120" cy="100" r="30" fill="#32CD32" />
    <circle cx="190" cy="100" r="30" fill="#1E90FF" />
    <circle cx="260" cy="100" r="30" fill="#FFD700" />
    <!-- Artist -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>