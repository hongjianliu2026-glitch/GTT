<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">await</text>
  <text x="50" y="120" class="subtitle">[əˈweɪt] v. 等待，期待</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (强调) + wait (等待)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在路边，"强调地等待(a-wait)"
    <tspan x="50" dy="25">一辆迟到的公交车，焦急地期待着它的到来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She patiently awaited the arrival of her friend.
  </text>
  <text x="50" y="310" class="content">
    她耐心地等待着朋友的到来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Person -->
    <circle cx="100" cy="80" r="15" class="image" />
    <line x1="100" y1="95" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="80" y2="160" class="image" />
    <line x1="100" y1="130" x2="120" y2="160" class="image" />
    <line x1="100" y1="110" x2="130" y2="100" class="image" />
    <!-- Bus -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <line x1="220" y1="50" x2="220" y2="100" class="image" />
    <line x1="240" y1="50" x2="240" y2="100" class="image" />
    <line x1="260" y1="50" x2="260" y2="100" class="image" />
    <line x1="280" y1="50" x2="280" y2="100" class="image" />
  </g>
</svg>