<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comb</text>
  <text x="50" y="120" class="subtitle">[koʊm] n. 梳子；v. 梳理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + b (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个梳子(comb)，它的齿(com-)是弯曲的(b)，
    <tspan x="50" dy="25">共同协作梳理头发，让头发变得整齐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a comb to tidy up her hair.
  </text>
  <text x="50" y="310" class="content">
    她用梳子整理头发。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Comb -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="10" class="image" />
    <line x1="70" y1="20" x2="70" y2="80" class="image" />
    <line x1="100" y1="20" x2="100" y2="80" class="image" />
    <line x1="130" y1="20" x2="130" y2="80" class="image" />
    <line x1="160" y1="20" x2="160" y2="80" class="image" />
    <line x1="190" y1="20" x2="190" y2="80" class="image" />
    <line x1="220" y1="20" x2="220" y2="80" class="image" />
    <line x1="250" y1="20" x2="250" y2="80" class="image" />
  </g>
</svg>