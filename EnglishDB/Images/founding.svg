<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">founding</text>
  <text x="50" y="120" class="subtitle">[ˈfaʊndɪŋ] n. 创立，建立</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> found (基础) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在打地基，"打下基础(found)"
    <tspan x="50" dy="25">来建立一个新城市，这个过程就是创立(founding)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The founding of the university was a historic event.
  </text>
  <text x="50" y="310" class="content">
    这所大学的创立是一个历史性的事件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Foundation -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ground -->
    <rect x="50" y="180" width="250" height="20" class="image" />
    <!-- People -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />

    <circle cx="200" cy="150" r="15" class="image" />
    <line x1="200" y1="165" x2="200" y2="190" class="image" />
    <line x1="200" y1="190" x2="180" y2="220" class="image" />
    <line x1="200" y1="190" x2="220" y2="220" class="image" />
    <line x1="200" y1="175" x2="230" y2="165" class="image" />

    <!-- Tools -->
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="140" y1="120" x2="160" y2="120" class="image" />
  </g>
</svg>