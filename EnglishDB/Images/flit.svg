<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flit</text>
  <text x="50" y="120" class="subtitle">[flɪt] v. 轻快地飞，迅速移动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flit (源自中古英语 flitten，意为“飞”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶在花丛中"轻快地飞(flit)"，
    <tspan x="50" dy="25">它的翅膀快速扇动，仿佛在跳舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The butterfly flitted from flower to flower.
  </text>
  <text x="50" y="310" class="content">
    蝴蝶在花丛中轻快地飞来飞去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butterfly -->
    <path d="M50 50 Q75 25 100 50 T150 50" class="image" />
    <path d="M50 50 Q25 75 50 100 T50 150" class="image" />
    <path d="M150 50 Q175 25 200 50 T250 50" class="image" />
    <path d="M150 50 Q125 75 150 100 T150 150" class="image" />
    <!-- Flower -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="120" cy="80" r="20" class="image" />
    <circle cx="140" cy="100" r="20" class="image" />
    <circle cx="120" cy="120" r="20" class="image" />
  </g>
</svg>