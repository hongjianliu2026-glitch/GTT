<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impurity</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpjʊərəti] n. 杂质，不纯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + pur (纯净) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯纯净的水中，"进入(im-)"
    <tspan x="50" dy="25">了一滴墨水，这滴墨水就是杂质(impurity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The water was tested for impurities before drinking.
  </text>
  <text x="50" y="310" class="content">
    这水在饮用前经过了杂质检测。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass of water -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Water -->
    <rect x="60" y="30" width="230" height="140" fill="#AED6F1" />
    <!-- Drop of ink -->
    <circle cx="175" cy="100" r="15" fill="#2C3E50" />
    <!-- Label -->
    <text x="160" y="130" class="highlight" font-size="14">impurity</text>
  </g>
</svg>