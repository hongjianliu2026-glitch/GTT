<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Prussian</text>
  <text x="50" y="120" class="subtitle">[ˈprʌʃən] adj. 普鲁士的；n. 普鲁士人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Pruss- (源自普鲁士)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个身穿传统普鲁士军装的士兵，手持长矛，
    <tspan x="50" dy="25">站在一座古老的城堡前，这就是"普鲁士(Prussian)"的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Prussian army was known for its discipline.
  </text>
  <text x="50" y="310" class="content">
    普鲁士军队以其纪律严明而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="130" x2="100" y2="120" class="image" />
    <!-- Spear -->
    <line x1="50" y1="20" x2="50" y2="0" class="image" />
    <line x1="50" y1="0" x2="30" y2="0" class="image" />
    <!-- Castle -->
    <rect x="120" y="50" width="150" height="150" class="image" />
    <line x1="120" y1="50" x2="270" y2="50" class="image" />
    <line x1="120" y1="100" x2="270" y2="100" class="image" />
    <line x1="120" y1="150" x2="270" y2="150" class="image" />
  </g>
</svg>