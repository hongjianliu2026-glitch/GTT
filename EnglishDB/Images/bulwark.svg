<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bulwark</text>
  <text x="50" y="120" class="subtitle">[ˈbʊlwərk] n. 堡垒，防御</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bulw- (堡垒) + -ark (加强)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的堡垒(bulw-)，它像一座山一样坚固(-ark)，
    <tspan x="50" dy="25">保护着城市免受敌人的攻击。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient bulwark protected the city for centuries.
  </text>
  <text x="50" y="310" class="content">
    这座古老的堡垒保护了城市几个世纪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fortress -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Walls -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Towers -->
    <rect x="70" y="40" width="50" height="120" class="image" />
    <rect x="230" y="40" width="50" height="120" class="image" />
    <!-- Gate -->
    <rect x="150" y="140" width="50" height="40" class="image" />
    <!-- Flag -->
    <line x1="175" y1="20" x2="175" y2="60" class="image" />
    <rect x="165" y="20" width="20" height="40" class="image" />
  </g>
</svg>