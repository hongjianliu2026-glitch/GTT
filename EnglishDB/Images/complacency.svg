<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">complacency</text>
  <text x="50" y="120" class="subtitle">[kəmˈpleɪsnsi] n. 自满，自得</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + plac (平静) + -ency (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在舒适的椅子上，脸上带着满足的微笑，
    <tspan x="50" dy="25">周围是平静的氛围，这就是"共同平静(com-plac-ency)"的状态，</tspan>
    <tspan x="50" dy="25">即自满(complacency)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His complacency after winning the award made him less motivated.
  </text>
  <text x="50" y="310" class="content">
    获奖后的自满让他变得不那么有动力了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Comfortable chair -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Smiling face -->
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="185" cy="90" r="5" class="image" />
    <circle cx="215" cy="90" r="5" class="image" />
    <path d="M185 110 Q200 120 215 110" class="image" />
    <!-- Calm atmosphere -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="70" r="10" class="image" />
    <circle cx="250" cy="60" r="10" class="image" />
    <circle cx="300" cy="80" r="10" class="image" />
  </g>
</svg>