<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uneducated</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˈɛdʒəˌkeɪtɪd] adj. 未受教育的，无知的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + educate (教育)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个没有受过教育的人，"没有(un-)"
    <tspan x="50" dy="25">接受过教育(educate)，显得无知(uneducated)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was uneducated and struggled to read.
  </text>
  <text x="50" y="310" class="content">
    他未受过教育，阅读困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Question marks -->
    <text x="100" y="120" class="image" font-size="48">?</text>
    <text x="150" y="120" class="image" font-size="48">?</text>
    <text x="200" y="120" class="image" font-size="48">?</text>
  </g>
</svg>