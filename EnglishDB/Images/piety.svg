<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">piety</text>
  <text x="50" y="120" class="subtitle">[ˈpaɪəti] n. 虔诚，孝敬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> piet- (虔诚) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个虔诚的信徒，跪在教堂前，双手合十，
    <tspan x="50" dy="25">脸上洋溢着对神的敬畏和孝敬之情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her piety was evident in her daily prayers.
  </text>
  <text x="50" y="310" class="content">
    她每天的祈祷显露出她的虔诚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cross -->
    <line x1="175" y1="50" x2="175" y2="120" class="image" />
    <line x1="150" y1="85" x2="200" y2="85" class="image" />
    <!-- Worshipper -->
    <circle cx="175" cy="150" r="15" class="image" />
    <line x1="175" y1="165" x2="175" y2="190" class="image" />
    <line x1="175" y1="190" x2="160" y2="210" class="image" />
    <line x1="175" y1="190" x2="190" y2="210" class="image" />
    <line x1="175" y1="175" x2="150" y2="165" class="image" />
    <line x1="175" y1="175" x2="200" y2="165" class="image" />
  </g>
</svg>