<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ninth</text>
  <text x="50" y="120" class="subtitle">[naɪnθ] adj. 第九的；n. 第九个</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nine (九) + -th (表示顺序)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“9”，它站在一排数字的最前面，
    <tspan x="50" dy="25">骄傲地宣称自己是“第九(ninth)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She finished ninth in the race.
  </text>
  <text x="50" y="310" class="content">
    她在比赛中获得了第九名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large number 9 -->
    <text x="0" y="100" font-size="200" class="image">9</text>
    <!-- Smaller numbers -->
    <text x="100" y="100" font-size="50" class="image">1</text>
    <text x="150" y="100" font-size="50" class="image">2</text>
    <text x="200" y="100" font-size="50" class="image">3</text>
    <text x="250" y="100" font-size="50" class="image">4</text>
    <text x="300" y="100" font-size="50" class="image">5</text>
    <text x="350" y="100" font-size="50" class="image">6</text>
    <text x="400" y="100" font-size="50" class="image">7</text>
    <text x="450" y="100" font-size="50" class="image">8</text>
    <!-- Arrow pointing to 9 -->
    <line x1="50" y1="150" x2="100" y2="250" class="image" />
    <polygon points="50,150 100,250 0,250" class="image" />
  </g>
</svg>