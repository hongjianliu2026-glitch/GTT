<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rocky</text>
  <text x="50" y="120" class="subtitle">[ˈrɒki] adj. 多岩石的，不稳定的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rock (岩石) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片崎岖不平的地面，到处都是"岩石(rock)"，
    <tspan x="50" dy="25">这样的地方就是"多岩石的(rocky)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The trail was rocky and difficult to navigate.
  </text>
  <text x="50" y="310" class="content">
    这条小径多岩石，很难行走。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Rocky ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rocks -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="120" cy="130" r="25" class="image" />
    <circle cx="200" cy="80" r="15" class="image" />
    <circle cx="280" cy="150" r="30" class="image" />
    <!-- Person struggling -->
    <circle cx="150" cy="180" r="15" class="image" />
    <line x1="150" y1="195" x2="150" y2="230" class="image" />
    <line x1="150" y1="230" x2="130" y2="260" class="image" />
    <line x1="150" y1="230" x2="170" y2="260" class="image" />
    <line x1="150" y1="210" x2="180" y2="200" class="image" />
  </g>
</svg>