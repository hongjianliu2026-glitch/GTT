<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abomination</text>
  <text x="50" y="120" class="subtitle">[əˌbɒmɪˈneɪʃn] n. 憎恶，可憎的事物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (远离) + -omin- (预兆) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个可怕的预兆(omin-)，让人远离(ab-)，
    <tspan x="50" dy="25">这种令人憎恶的事物(abomination)让人心生恐惧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sight of the rotting food was an abomination.
  </text>
  <text x="50" y="310" class="content">
    看到腐烂的食物让人感到憎恶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rotten food -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <!-- Person reacting -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="90" x2="180" y2="80" class="image" />
    <line x1="200" y1="90" x2="220" y2="80" class="image" />
    <line x1="200" y1="120" x2="180" y2="140" class="image" />
    <line x1="200" y1="120" x2="220" y2="140" class="image" />
    <!-- Exclamation mark -->
    <text x="220" y="100" class="highlight" font-size="48">!</text>
  </g>
</svg>