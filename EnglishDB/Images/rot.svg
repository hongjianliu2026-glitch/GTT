<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rot</text>
  <text x="50" y="120" class="subtitle">[rɒt] v. 腐烂，腐朽；n. 腐烂，腐朽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rot (源自原始日耳曼语 *rauta-, 意为“腐烂”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苹果在树上，"腐烂(rot)"
    <tspan x="50" dy="25">成了一滩烂泥，散发出难闻的气味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fruit began to rot after a week in the sun.
  </text>
  <text x="50" y="310" class="content">
    水果在阳光下放了一周后开始腐烂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="0" y1="0" x2="0" y2="150" class="image" />
    <line x1="0" y1="150" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="0" class="image" />

    <!-- Apple -->
    <circle cx="75" cy="75" r="20" class="image" />
    <line x1="75" y1="95" x2="75" y2="120" class="image" />
    <line x1="75" y1="120" x2="60" y2="140" class="image" />
    <line x1="75" y1="120" x2="90" y2="140" class="image" />

    <!-- Rotten part -->
    <circle cx="75" cy="75" r="15" class="image" fill="#8B4513" />
    <line x1="75" y1="90" x2="75" y2="110" class="image" stroke="#8B4513" />
    <line x1="75" y1="110" x2="65" y2="125" class="image" stroke="#8B4513" />
    <line x1="75" y1="110" x2="85" y2="125" class="image" stroke="#8B4513" />
  </g>
</svg>