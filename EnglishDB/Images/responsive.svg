<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">responsive</text>
  <text x="50" y="120" class="subtitle">[rɪˈspɒnsɪv] adj. 响应的，反应迅速的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + spond (承诺) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个网站，当用户点击按钮时，网站"回应(re-spond)"
    <tspan x="50" dy="25">迅速，就像它承诺的那样，这就是响应式(responsive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The website is designed to be responsive to different screen sizes.
  </text>
  <text x="50" y="310" class="content">
    该网站设计为对不同屏幕尺寸做出响应。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Website screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Button -->
    <rect x="50" y="50" width="100" height="50" class="image" />
    <text x="95" y="80" class="content">Click</text>
    <!-- Response -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <text x="245" y="80" class="content">Done</text>
    <!-- Arrow -->
    <line x1="150" y1="75" x2="200" y2="75" class="image" />
    <polygon points="190,65 200,75 190,85" class="image" />
  </g>
</svg>