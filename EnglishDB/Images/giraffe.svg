<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">giraffe</text>
  <text x="50" y="120" class="subtitle">[dʒəˈræf] n. 长颈鹿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自阿拉伯语 زرافة (zirāfah)，意为“长颈鹿”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只长颈鹿站在非洲大草原上，它的长脖子让它能够轻松地吃到高处的树叶。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The giraffe stretched its long neck to reach the leaves.
  </text>
  <text x="50" y="310" class="content">
    长颈鹿伸长脖子去够树叶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Giraffe body -->
    <rect x="100" y="100" width="100" height="150" class="image" />
    <!-- Giraffe neck -->
    <rect x="150" y="20" width="20" height="100" class="image" />
    <!-- Giraffe head -->
    <circle cx="160" cy="15" r="15" class="image" />
    <!-- Giraffe legs -->
    <line x1="120" y1="250" x2="120" y2="350" class="image" />
    <line x1="180" y1="250" x2="180" y2="350" class="image" />
    <!-- Giraffe spots -->
    <circle cx="130" cy="130" r="10" class="image" />
    <circle cx="170" cy="140" r="10" class="image" />
    <circle cx="140" cy="180" r="10" class="image" />
    <circle cx="160" cy="200" r="10" class="image" />
  </g>
</svg>