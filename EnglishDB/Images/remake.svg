<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">remake</text>
  <text x="50" y="120" class="subtitle">[riːˈmeɪk] v. 重制，重新制作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + make (制作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个电影导演在片场，"再次制作(re-make)"
    <tspan x="50" dy="25">一部经典电影，将旧版重新演绎成新版(remake)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to remake the classic film with modern technology.
  </text>
  <text x="50" y="310" class="content">
    他们决定用现代技术重制这部经典电影。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old film reel -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />

    <!-- New film reel -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <line x1="220" y1="20" x2="330" y2="20" class="image" />
    <line x1="220" y1="40" x2="330" y2="40" class="image" />
    <line x1="220" y1="60" x2="330" y2="60" class="image" />
    <line x1="220" y1="80" x2="330" y2="80" class="image" />

    <!-- Director -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="150" y2="170" class="image" />
  </g>
</svg>