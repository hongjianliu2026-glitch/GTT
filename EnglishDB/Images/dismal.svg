<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E9E2; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #6D4C3D; }
      .content { font: 18px sans-serif; fill: #5D4037; }
      .highlight { font-weight: bold; fill: #B22222; }
      .story { font: 16px serif; fill: #4E342E; }
      .image { stroke: #A52A2A; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dismal</text>
  <text x="50" y="120" class="subtitle">[ˈdɪzməl] adj. 阴沉的，凄凉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (否定) + mal (坏)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阴沉的天气，"否定(dis-)"了"坏(mal)"的气氛，
    <tspan x="50" dy="25">整个场景变得"dismal"，让人感到凄凉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dismal weather made everyone feel gloomy.
  </text>
  <text x="50" y="310" class="content">
    阴沉的天气让每个人都感到忧郁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Raindrops -->
    <line x1="70" y1="120" x2="70" y2="150" class="image" />
    <line x1="120" y1="120" x2="120" y2="150" class="image" />
    <line x1="170" y1="120" x2="170" y2="150" class="image" />
    <line x1="220" y1="120" x2="220" y2="150" class="image" />
    <line x1="270" y1="120" x2="270" y2="150" class="image" />
    <!-- Sun trying to break through -->
    <circle cx="350" cy="50" r="30" class="image" />
    <line x1="350" y1="80" x2="350" y2="150" class="image" />
    <line x1="320" y1="115" x2="380" y2="115" class="image" />
    <line x1="335" y1="90" x2="365" y2="140" class="image" />
    <line x1="365" y1="90" x2="335" y2="140" class="image" />
  </g>
</svg>