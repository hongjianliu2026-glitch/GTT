<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abolitionist</text>
  <text x="50" y="120" class="subtitle">[ˌæbəˈlɪʃənɪst] n. 废奴主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + olit (生长) + -ion (名词后缀) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个废奴主义者，他"离开(ab-)"了奴隶制的"生长(olit)"，
    <tspan x="50" dy="25">致力于废除奴隶制，成为了一个废奴主义者(abolitionist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Harriet Tubman was a famous abolitionist who helped many slaves escape.
  </text>
  <text x="50" y="310" class="content">
    哈丽特·塔布曼是一位著名的废奴主义者，她帮助许多奴隶逃脱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Abolitionist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Chains -->
    <line x1="70" y1="100" x2="120" y2="100" class="image" />
    <line x1="70" y1="120" x2="120" y2="120" class="image" />
    <line x1="70" y1="140" x2="120" y2="140" class="image" />
    <!-- Broken Chains -->
    <line x1="120" y1="100" x2="140" y2="80" class="image" />
    <line x1="120" y1="120" x2="140" y2="100" class="image" />
    <line x1="120" y1="140" x2="140" y2="120" class="image" />
  </g>
</svg>