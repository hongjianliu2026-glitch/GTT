<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irreversible</text>
  <text x="50" y="120" class="subtitle">[ˌɪrɪˈvɜːrsəbl] adj. 不可逆的，不可撤销的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (不) + revers (反转) + -ible (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时间机器，"无法反转(ir-revers-ible)"
    <tspan x="50" dy="25">回到过去，因为它的操作是不可逆的(irreversible)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The damage to the environment is irreversible.
  </text>
  <text x="50" y="310" class="content">
    对环境的破坏是不可逆的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Time machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="95" y1="100" x2="255" y2="100" class="image" />
    <!-- Arrow pointing forward -->
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <polygon points="255,85 255,115 275,100" class="image" />
    <!-- Crossed out arrow pointing backward -->
    <line x1="175" y1="100" x2="95" y2="100" class="image" />
    <polygon points="95,85 95,115 75,100" class="image" />
    <line x1="70" y1="85" x2="100" y2="115" class="image" />
    <line x1="70" y1="115" x2="100" y2="85" class="image" />
  </g>
</svg>