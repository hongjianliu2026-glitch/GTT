<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clipping</text>
  <text x="50" y="120" class="subtitle">[ˈklɪpɪŋ] n. 剪裁，剪报</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clip (剪) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个园丁用大剪刀"剪(clip)"下一片片叶子，这些叶子就变成了"剪裁(clipping)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She collected clippings of her favorite articles.
  </text>
  <text x="50" y="310" class="content">
    她收集了她最喜欢的文章的剪报。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Scissors -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <!-- Leaves -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <rect x="220" y="70" width="60" height="30" class="image" />
    <rect x="240" y="90" width="20" height="10" class="image" />
  </g>
</svg>