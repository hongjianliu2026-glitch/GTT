<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tenacious</text>
  <text x="50" y="120" class="subtitle">[təˈneɪʃəs] adj. 顽强的，坚持不懈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ten- (保持) + -acious (有...性质的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫紧紧抓住(ten-)
    <tspan x="50" dy="25">一根树枝，无论风吹雨打都不松手，</tspan>
    <tspan x="50" dy="25">这就是"tenacious"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is tenacious in her pursuit of justice.
  </text>
  <text x="50" y="310" class="content">
    她在追求正义的过程中非常顽强。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree branch -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Cat -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="150" y2="150" class="image" />
    <line x1="175" y1="120" x2="200" y2="150" class="image" />
    <line x1="175" y1="90" x2="220" y2="80" class="image" />
    <!-- Claws -->
    <line x1="175" y1="50" x2="160" y2="30" class="image" />
    <line x1="175" y1="50" x2="190" y2="30" class="image" />
    <line x1="175" y1="50" x2="160" y2="70" class="image" />
    <line x1="175" y1="50" x2="190" y2="70" class="image" />
  </g>
</svg>