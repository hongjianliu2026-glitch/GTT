<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bison</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪsən] n. 野牛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bis (双) + on (存在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头巨大的野牛，它的角像"双(bis)"叉戟一样，
    <tspan x="50" dy="25">象征着力量和存在(on)，这就是野牛(bison)的形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bison roamed the plains of North America.
  </text>
  <text x="50" y="310" class="content">
    野牛在北美大平原上漫游。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bison body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bison head -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Bison horns -->
    <line x1="30" y1="80" x2="0" y2="50" class="image" />
    <line x1="70" y1="80" x2="100" y2="50" class="image" />
    <!-- Bison legs -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="80" y1="130" x2="80" y2="180" class="image" />
    <line x1="110" y1="130" x2="110" y2="180" class="image" />
    <line x1="140" y1="130" x2="140" y2="180" class="image" />
  </g>
</svg>