<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glamour</text>
  <text x="50" y="120" class="subtitle">[ˈɡlæmər] n. 魅力，魔力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glam (魔法) + our (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满魔法的夜晚，"魔法(glam)"
    <tspan x="50" dy="25">笼罩着整个城市，每个人都感受到了它的魅力(glamour)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The actress exuded glamour on the red carpet.
  </text>
  <text x="50" y="310" class="content">
    这位女演员在红毯上散发着魅力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magic wand -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Starburst -->
    <line x1="100" y1="90" x2="120" y2="70" class="image" />
    <line x1="100" y1="90" x2="80" y2="70" class="image" />
    <line x1="100" y1="90" x2="120" y2="110" class="image" />
    <line x1="100" y1="90" x2="80" y2="110" class="image" />
    <!-- City skyline -->
    <rect x="150" y="80" width="50" height="40" class="image" />
    <rect x="210" y="60" width="50" height="60" class="image" />
    <rect x="270" y="40" width="50" height="80" class="image" />
    <!-- Moon -->
    <circle cx="350" cy="50" r="30" class="image" />
  </g>
</svg>