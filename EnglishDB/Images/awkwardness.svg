<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">awkwardness</text>
  <text x="50" y="120" class="subtitle">[ˈɔːkwədnes] n. 笨拙，尴尬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> awk- (不规则的) + ward (方向) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在舞会上，"不规则地(awk-ward)"
    <tspan x="50" dy="25">移动，显得非常笨拙和尴尬(awkwardness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His awkwardness made everyone laugh.
  </text>
  <text x="50" y="310" class="content">
    他的笨拙让大家都笑了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Dance floor -->
    <rect x="0" y="200" width="350" height="50" class="image" />
    <!-- Confused lines -->
    <line x1="70" y1="220" x2="100" y2="240" class="image" />
    <line x1="100" y1="220" x2="70" y2="240" class="image" />
    <line x1="130" y1="220" x2="160" y2="240" class="image" />
    <line x1="160" y1="220" x2="130" y2="240" class="image" />
  </g>
</svg>