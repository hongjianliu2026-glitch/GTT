<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surpass</text>
  <text x="50" y="120" class="subtitle">[sərˈpæs] v. 超越，胜过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (超过) + pass (通过)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在比赛中，"超过(sur-)"
    <tspan x="50" dy="25">其他人"通过(pass)"终点线，这就是超越(surpass)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She managed to surpass all her competitors in the race.
  </text>
  <text x="50" y="310" class="content">
    她在比赛中成功超越了所有竞争对手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Race track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Finish line -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="25" x2="300" y2="25" class="image" />
    <!-- Runner -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Surpassing -->
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="300" y2="20" class="image" />
  </g>
</svg>