<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">regulator</text>
  <text x="50" y="120" class="subtitle">[ˈreɡjəˌleɪtər] n. 调节器，监管者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> reg (统治) + ul (小) + ator (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小小的统治者(reg-ul-ator)，
    <tspan x="50" dy="25">他手持调节器，精准地控制着一切，确保秩序井然。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thermostat acts as a regulator for the room's temperature.
  </text>
  <text x="50" y="310" class="content">
    恒温器作为房间温度的调节器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Regulator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Small ruler -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Control panel -->
    <rect x="120" y="20" width="200" height="160" class="image" />
    <!-- Buttons -->
    <circle cx="140" cy="50" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <circle cx="140" cy="110" r="10" class="image" />
    <circle cx="140" cy="140" r="10" class="image" />
    <!-- Lines -->
    <line x1="160" y1="50" x2="300" y2="50" class="image" />
    <line x1="160" y1="80" x2="300" y2="80" class="image" />
    <line x1="160" y1="110" x2="300" y2="110" class="image" />
    <line x1="160" y1="140" x2="300" y2="140" class="image" />
  </g>
</svg>