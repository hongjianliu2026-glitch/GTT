<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">equatorial</text>
  <text x="50" y="120" class="subtitle">[ˌɛkwəˈtɔriəl] adj. 赤道的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> equi- (平等) + -terr (地球) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象地球被一条"平等的线(equi-terr)"分成两半，
    <tspan x="50" dy="25">这条线就是赤道(equatorial)，它将地球平等地分为南北两半。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The equatorial region experiences high temperatures year-round.
  </text>
  <text x="50" y="310" class="content">
    赤道地区全年气温都很高。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Equator line -->
    <line x1="20" y1="100" x2="330" y2="100" class="image" />
    <!-- North and South poles -->
    <circle cx="175" cy="20" r="10" class="image" />
    <circle cx="175" cy="180" r="10" class="image" />
    <!-- Sun -->
    <circle cx="350" cy="100" r="30" class="image" />
    <!-- Sun rays -->
    <line x1="380" y1="100" x2="420" y2="100" class="image" />
    <line x1="365" y1="85" x2="405" y2="45" class="image" />
    <line x1="365" y1="115" x2="405" y2="155" class="image" />
  </g>
</svg>