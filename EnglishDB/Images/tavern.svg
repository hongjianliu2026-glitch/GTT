<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tavern</text>
  <text x="50" y="120" class="subtitle">[ˈtævərn] n. 酒馆，客栈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> taverna (拉丁语，小酒馆)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的酒馆(tavern)，门口挂着
    <tspan x="50" dy="25">一个巨大的酒桶，里面装满了美酒，</tspan>
    <tspan x="50" dy="25">人们在里面欢声笑语，享受着美酒和美食。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They met at the local tavern to discuss business.
  </text>
  <text x="50" y="310" class="content">
    他们在当地的酒馆见面讨论生意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tavern building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <!-- Window -->
    <rect x="50" y="100" width="50" height="50" class="image" />
    <rect x="250" y="100" width="50" height="50" class="image" />
    <!-- Barrel -->
    <ellipse cx="100" cy="250" rx="50" ry="30" class="image" />
    <line x1="100" y1="220" x2="100" y2="280" class="image" />
    <!-- People -->
    <circle cx="200" cy="150" r="15" class="image" />
    <line x1="200" y1="165" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="180" x2="230" y2="170" class="image" />
  </g>
</svg>