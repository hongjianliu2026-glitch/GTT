<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">helpless</text>
  <text x="50" y="120" class="subtitle">[ˈhɛlplɪs] adj. 无助的，无能的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> help (帮助) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被困在荒岛上，"无(less)"法得到"帮助(help)"，
    <tspan x="50" dy="25">显得非常无助(helpless)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kitten looked helpless after falling from the tree.
  </text>
  <text x="50" y="310" class="content">
    小猫从树上掉下来后显得非常无助。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Island -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="145" y2="130" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Raised hands -->
    <line x1="175" y1="120" x2="155" y2="90" class="image" />
    <line x1="175" y1="120" x2="195" y2="90" class="image" />
    <!-- Waves -->
    <path d="M0,200 Q50,180 100,200 T200,200" class="image" />
    <path d="M100,200 Q150,180 200,200 T300,200" class="image" />
  </g>
</svg>