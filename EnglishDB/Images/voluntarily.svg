<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">voluntarily</text>
  <text x="50" y="120" class="subtitle">[ˈvɒləntərɪli] adv. 自愿地，自发地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> volunt (意愿) + -ary (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在舞台上，手里拿着麦克风，"自愿(volunt)"
    <tspan x="50" dy="25">地(ary)表达自己的想法，这种行为就是自愿的(voluntarily)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She volunteered to help with the event.
  </text>
  <text x="50" y="310" class="content">
    她自愿帮助组织活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person with microphone -->
    <circle cx="175" cy="80" r="20" class="image" />
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="120" x2="220" y2="110" class="image" />
    <line x1="220" y1="110" x2="220" y2="130" class="image" />
    <!-- Microphone -->
    <rect x="210" y="90" width="20" height="40" class="image" />
    <line x1="220" y1="90" x2="220" y2="50" class="image" />
    <line x1="220" y1="50" x2="200" y2="30" class="image" />
    <line x1="220" y1="50" x2="240" y2="30" class="image" />
  </g>
</svg>