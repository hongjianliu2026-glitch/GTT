<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inexperience</text>
  <text x="50" y="120" class="subtitle">[ˌɪnɪkˈspɪəriəns] n. 缺乏经验，不熟练</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + experience (经验)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新手厨师，"不(in-)"
    <tspan x="50" dy="25">熟练地(experience)"切菜，结果切得乱七八糟，这就是缺乏经验(inexperience)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His inexperience in handling such situations led to a mistake.
  </text>
  <text x="50" y="310" class="content">
    他在处理这种情况时的缺乏经验导致了一个错误。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef's hat -->
    <circle cx="20" cy="20" r="15" class="image" />
    <line x1="20" y1="35" x2="20" y2="60" class="image" />
    <!-- Knife -->
    <line x1="20" y1="60" x2="20" y2="100" class="image" />
    <line x1="20" y1="60" x2="0" y2="80" class="image" />
    <line x1="20" y1="60" x2="40" y2="80" class="image" />
    <!-- Vegetables -->
    <rect x="50" y="50" width="30" height="30" class="image" />
    <rect x="90" y="50" width="30" height="30" class="image" />
    <rect x="130" y="50" width="30" height="30" class="image" />
    <!-- Messy cutting -->
    <line x1="50" y1="80" x2="160" y2="80" class="image" />
    <line x1="50" y1="90" x2="160" y2="90" class="image" />
    <line x1="50" y1="100" x2="160" y2="100" class="image" />
  </g>
</svg>