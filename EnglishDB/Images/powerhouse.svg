<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">powerhouse</text>
  <text x="50" y="120" class="subtitle">[ˈpaʊərhaʊs] n. 发电站，精力充沛的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> power (力量) + house (房子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"力量房子(power-house)"，里面充满了无尽的能量，
    <tspan x="50" dy="25">就像一个发电站，源源不断地产生电力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a real powerhouse in the tech industry.
  </text>
  <text x="50" y="310" class="content">
    他是科技行业中真正的精力充沛的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Powerhouse building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="-50" width="50" height="50" class="image" />
    <!-- Smoke -->
    <circle cx="175" cy="-25" r="10" class="image" />
    <circle cx="175" cy="-15" r="15" class="image" />
    <circle cx="175" cy="-5" r="20" class="image" />
    <!-- Power lines -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="150" y1="200" x2="150" y2="250" class="image" />
    <line x1="200" y1="200" x2="200" y2="250" class="image" />
    <line x1="250" y1="200" x2="250" y2="250" class="image" />
    <line x1="300" y1="200" x2="300" y2="250" class="image" />
  </g>
</svg>