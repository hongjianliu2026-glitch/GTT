<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">usefulness</text>
  <text x="50" y="120" class="subtitle">[ˈjuːsfəlnəs] n. 有用性，实用性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> use (使用) + -ful (充满...的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工具箱里装满了各种"充满使用价值(use-ful-ness)"的工具，
    <tspan x="50" dy="25">每一件工具都能帮助你完成任务，这就是有用性(usefulness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The usefulness of the new software was immediately apparent.
  </text>
  <text x="50" y="310" class="content">
    这款新软件的有用性立刻显现出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toolbox -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tools -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="75" y1="50" x2="75" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="120" y1="50" x2="170" y2="50" class="image" />
    <line x1="145" y1="50" x2="145" y2="100" class="image" />
    <line x1="120" y1="100" x2="170" y2="100" class="image" />
    <line x1="190" y1="50" x2="240" y2="50" class="image" />
    <line x1="215" y1="50" x2="215" y2="100" class="image" />
    <line x1="190" y1="100" x2="240" y2="100" class="image" />
  </g>
</svg>