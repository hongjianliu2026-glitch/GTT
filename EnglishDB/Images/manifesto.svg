<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">manifesto</text>
  <text x="50" y="120" class="subtitle">[ˌmænɪˈfestəʊ] n. 宣言，声明</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mani- (手) + fest (打击) + -o (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个领袖站在高台上，"用手打击(mani-fest)"
    <tspan x="50" dy="25">空气，宣布他的宣言(manifesto)，声音响彻云霄。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The political party released a manifesto outlining their policies.
  </text>
  <text x="50" y="310" class="content">
    该政党发布了一份宣言，概述了他们的政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Leader -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Microphone -->
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <circle cx="100" cy="40" r="10" class="image" />
    <!-- Speech bubble -->
    <path d="M150,100 Q200,80 250,100 Q200,120 150,100" class="image" />
    <text x="160" y="105" class="content">Manifesto!</text>
  </g>
</svg>