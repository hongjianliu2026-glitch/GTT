<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">layoff</text>
  <text x="50" y="120" class="subtitle">[ˈleɪˌɔf] n. 解雇，裁员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lay (放置) + off (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个员工被"放置(lay)"在公司门外，"离开(off)"了工作岗位，这就是解雇(layoff)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company announced a layoff due to financial difficulties.
  </text>
  <text x="50" y="310" class="content">
    公司因财务困难宣布裁员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Office door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Employee being pushed out -->
    <circle cx="100" cy="200" r="20" class="image" />
    <line x1="100" y1="220" x2="100" y2="280" class="image" />
    <line x1="100" y1="280" x2="80" y2="320" class="image" />
    <line x1="100" y1="280" x2="120" y2="320" class="image" />
    <line x1="100" y1="250" x2="140" y2="240" class="image" />
    <!-- Door handle -->
    <circle cx="180" cy="150" r="10" class="image" />
  </g>
</svg>