<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intensely</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtensli] adv. 强烈地，极度地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + tens (伸展) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"拉进(in-)"一个"伸展(tens)"到极限的状态，
    <tspan x="50" dy="25">这种状态"极度(intensely)"紧张或强烈。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She studied the subject intensely for her exam.
  </text>
  <text x="50" y="310" class="content">
    她为了考试对这个科目进行了深入的学习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person being stretched -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <line x1="50" y1="50" x2="30" y2="80" class="image" />
    <line x1="50" y1="50" x2="70" y2="80" class="image" />
    <line x1="50" y1="200" x2="30" y2="170" class="image" />
    <line x1="50" y1="200" x2="70" y2="170" class="image" />
    <!-- Arrows indicating intensity -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="140" y2="90" class="image" />
    <line x1="150" y1="100" x2="140" y2="110" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="140" y2="140" class="image" />
    <line x1="150" y1="150" x2="140" y2="160" class="image" />
  </g>
</svg>