<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">watch</text>
  <text x="50" y="120" class="subtitle">[wɒtʃ] v. 观看，注视；n. 手表</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> watch (源自中古英语 wacche，意为“守夜”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个守夜人，"守望(watch)"着夜空，
    <tspan x="50" dy="25">他的手腕上戴着一块手表(watch)，时刻提醒他时间的流逝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She likes to watch movies on weekends.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在周末看电影。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" fill="#ECF0F1" />
    <circle cx="100" cy="30" r="5" class="image" fill="#ECF0F1" />
    <circle cx="150" cy="70" r="5" class="image" fill="#ECF0F1" />
    <circle cx="200" cy="40" r="5" class="image" fill="#ECF0F1" />
    <circle cx="250" cy="60" r="5" class="image" fill="#ECF0F1" />
    <!-- Watch -->
    <rect x="150" y="100" width="50" height="50" class="image" fill="#ECF0F1" />
    <line x1="175" y1="125" x2="175" y2="150" class="image" />
    <line x1="175" y1="125" x2="190" y2="135" class="image" />
    <!-- Night watcher -->
    <circle cx="300" cy="100" r="15" class="image" fill="#ECF0F1" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="330" y2="120" class="image" />
  </g>
</svg>