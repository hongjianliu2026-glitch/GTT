<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">terra-cotta</text>
  <text x="50" y="120" class="subtitle">[ˌtɛrəˈkɒtə] n. 赤陶，赤土陶器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> terra (土地) + cotta (陶器)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个陶艺家在土地(terra)上制作陶器(cotta)，
    <tspan x="50" dy="25">最终烧制成赤陶(terra-cotta)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The terra-cotta warriors are a famous Chinese artifact.
  </text>
  <text x="50" y="310" class="content">
    兵马俑是中国著名的文物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pottery wheel -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Clay -->
    <rect x="50" y="150" width="100" height="50" class="image" />
    <!-- Potter -->
    <circle cx="100" cy="50" r="15" class="image" />
    <line x1="100" y1="65" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="80" x2="130" y2="70" class="image" />
    <!-- Finished terra-cotta pot -->
    <rect x="200" y="50" width="50" height="100" class="image" />
    <circle cx="225" cy="100" r="25" class="image" />
  </g>
</svg>