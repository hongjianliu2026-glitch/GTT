<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delinquent</text>
  <text x="50" y="120" class="subtitle">[dɪˈlɪŋkwənt] n. 失职者，少年犯；adj. 失职的，有过失的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + linqu (离开) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个少年犯，"离开(de-)"了正常的社会轨道，"失职(linqu-ent)"
    <tspan x="50" dy="25">成为了社会的负担，这就是"失职者(delinquent)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge sentenced the delinquent to community service.
  </text>
  <text x="50" y="310" class="content">
    法官判决这个失职者进行社区服务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jail bars -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="50" x2="350" y2="50" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="150" x2="350" y2="150" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="250" x2="350" y2="250" class="image" />
    <line x1="0" y1="300" x2="350" y2="300" class="image" />
    <line x1="0" y1="350" x2="350" y2="350" class="image" />
    <line x1="0" y1="400" x2="350" y2="400" class="image" />
    <line x1="0" y1="450" x2="350" y2="450" class="image" />
    <line x1="0" y1="500" x2="350" y2="500" class="image" />
    <line x1="0" y1="550" x2="350" y2="550" class="image" />
    <line x1="0" y1="600" x2="350" y2="600" class="image" />
    <!-- Delinquent -->
    <circle cx="175" cy="275" r="30" class="image" />
    <line x1="175" y1="305" x2="175" y2="375" class="image" />
    <line x1="175" y1="375" x2="145" y2="425" class="image" />
    <line x1="175" y1="375" x2="205" y2="425" class="image" />
    <line x1="175" y1="335" x2="125" y2="355" class="image" />
    <line x1="175" y1="335" x2="225" y2="355" class="image" />
  </g>
</svg>