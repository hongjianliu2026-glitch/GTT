<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fervent</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrvənt] adj. 热情的，炽热的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ferv (热) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人心中燃起熊熊烈火，"热(ferv)"
    <tspan x="50" dy="25">情四溢，这种炽热的感觉就是fervent。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a fervent supporter of the local football team.
  </text>
  <text x="50" y="310" class="content">
    她是当地足球队的热情支持者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 40 C10 10, 90 10, 90 40 S170 70, 100 100 S10 70, 10 40" class="image" />
    <!-- Flame -->
    <path d="M50 100 Q70 50, 90 100 T130 100" class="image" />
    <path d="M50 100 Q70 70, 90 100 T130 100" class="image" />
    <path d="M50 100 Q70 90, 90 100 T130 100" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="70" y2="180" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
  </g>
</svg>