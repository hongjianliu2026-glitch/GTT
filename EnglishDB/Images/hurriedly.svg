<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hurriedly</text>
  <text x="50" y="120" class="subtitle">[ˈhɜːridli] adv. 匆忙地，急忙地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hurry (匆忙) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在街上"匆忙地(hurry)"跑着，
    <tspan x="50" dy="25">手里拿着一堆文件，脚下的影子也跟着急速移动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She packed her bags hurriedly before leaving for the airport.
  </text>
  <text x="50" y="310" class="content">
    她在去机场前匆忙地收拾了行李。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person running -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="200" class="image" /> <!-- Right leg -->
    <!-- Documents -->
    <rect x="80" y="120" width="50" height="30" class="image" />
    <rect x="80" y="160" width="50" height="30" class="image" />
    <!-- Shadow -->
    <ellipse cx="50" cy="220" rx="40" ry="10" class="image" />
  </g>
</svg>