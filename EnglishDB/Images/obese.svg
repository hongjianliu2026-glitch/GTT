<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">obese</text>
  <text x="50" y="120" class="subtitle">[oʊˈbis] adj. 肥胖的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (过度) + es (吃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"过度地吃(ob-es)"，
    <tspan x="50" dy="25">结果变得非常肥胖(obese)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor advised him to lose weight because he was obese.
  </text>
  <text x="50" y="310" class="content">
    医生建议他减肥，因为他很肥胖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Overweight person -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="150" r="70" class="image" />
    <circle cx="100" cy="220" r="90" class="image" />
    <!-- Fork and knife -->
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <line x1="20" y1="50" x2="20" y2="100" class="image" />
    <line x1="80" y1="50" x2="80" y2="100" class="image" />
    <line x1="80" y1="75" x2="120" y2="75" class="image" />
    <line x1="120" y1="75" x2="120" y2="125" class="image" />
  </g>
</svg>