<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wispy</text>
  <text x="50" y="120" class="subtitle">[ˈwɪspi] adj. 纤细的，稀薄的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wis (雾) + -py (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一缕轻柔的雾气，"纤细如雾(wis-py)"，
    <tspan x="50" dy="25">轻轻飘散在空气中，给人一种轻盈、稀薄的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wispy clouds drifted across the sky.
  </text>
  <text x="50" y="310" class="content">
    纤细的云朵在天空中飘过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wispy clouds -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" />
    <path d="M50 80 Q100 60 150 80 T250 80" class="image" />
    <path d="M50 110 Q100 90 150 110 T250 110" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="80" r="30" class="image" />
    <!-- Ground -->
    <line x1="0" y1="150" x2="400" y2="150" class="image" />
  </g>
</svg>