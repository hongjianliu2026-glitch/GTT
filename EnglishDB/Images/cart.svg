<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cart</text>
  <text x="50" y="120" class="subtitle">[kɑːrt] n. 手推车，购物车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cart (来自拉丁语 "carrus"，意为“车”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的购物车，"车(cart)"里装满了各种夸张的物品，
    <tspan x="50" dy="25">比如一座山那么高的蔬菜和水果，甚至还有一只活蹦乱跳的动物！</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She pushed her cart through the supermarket.
  </text>
  <text x="50" y="310" class="content">
    她推着购物车穿过超市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shopping cart -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="180" r="20" class="image" />
    <circle cx="280" cy="180" r="20" class="image" />
    <!-- Handle -->
    <line x1="150" y1="20" x2="150" y2="0" class="image" />
    <!-- Items in the cart -->
    <rect x="70" y="40" width="50" height="50" class="image" />
    <rect x="140" y="40" width="50" height="50" class="image" />
    <rect x="210" y="40" width="50" height="50" class="image" />
    <rect x="70" y="100" width="50" height="50" class="image" />
    <rect x="140" y="100" width="50" height="50" class="image" />
    <rect x="210" y="100" width="50" height="50" class="image" />
  </g>
</svg>