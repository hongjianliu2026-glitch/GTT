<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scandalous</text>
  <text x="50" y="120" class="subtitle">[ˈskændələs] adj. 丑闻的，令人震惊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scand (攀爬) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个丑闻像"攀爬(scand)"的藤蔓一样，
    <tspan x="50" dy="25">迅速蔓延，引起公众的震惊和议论。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The politician's scandalous behavior led to his resignation.
  </text>
  <text x="50" y="310" class="content">
    这位政客的丑闻行为导致了他辞职。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scandal vine -->
    <path d="M0,0 C50,100 150,100 200,0" class="image" />
    <path d="M200,0 C250,100 350,100 400,0" class="image" />
    <!-- People talking -->
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="100" y2="165" class="image" />
    <line x1="100" y1="165" x2="150" y2="165" class="image" />
    <!-- Newspaper -->
    <rect x="250" y="100" width="100" height="100" class="image" />
    <text x="260" y="150" class="content" fill="#000">丑闻</text>
  </g>
</svg>