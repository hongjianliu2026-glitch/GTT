<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drugstore</text>
  <text x="50" y="120" class="subtitle">[ˈdrʌɡstɔːr] n. 药店，杂货店</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drug (药物) + store (商店)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"药物(drug)"箱子，里面装满了各种药品，
    <tspan x="50" dy="25">这个箱子被放在一个"商店(store)"里，这就是药店(drugstore)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He went to the drugstore to buy some medicine.
  </text>
  <text x="50" y="310" class="content">
    他去药店买了些药。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Store -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Drug box -->
    <rect x="50" y="50" width="100" height="100" class="image" />
    <!-- Pills -->
    <circle cx="70" cy="70" r="10" class="image" />
    <circle cx="90" cy="90" r="10" class="image" />
    <circle cx="110" cy="70" r="10" class="image" />
    <circle cx="90" cy="50" r="10" class="image" />
    <!-- Store sign -->
    <text x="200" y="100" class="image" font-size="30">Drugstore</text>
  </g>
</svg>