<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">upside-down</text>
  <text x="50" y="120" class="subtitle">[ˌʌpˈsaɪd ˈdaʊn] adj. 颠倒的，倒转的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up (向上) + side (边) + down (向下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个世界，所有的东西都"颠倒(upside-down)"了，
    <tspan x="50" dy="25">房子倒立在天花板上，人们倒挂在空中行走。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The painting was hung upside-down.
  </text>
  <text x="50" y="310" class="content">
    那幅画挂倒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Upside-down house -->
    <rect x="50" y="20" width="200" height="150" class="image" />
    <line x1="150" y1="20" x2="150" y2="170" class="image" />
    <line x1="50" y1="95" x2="250" y2="95" class="image" />
    <line x1="100" y1="20" x2="100" y2="170" class="image" />
    <line x1="200" y1="20" x2="200" y2="170" class="image" />
    <!-- Upside-down person -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="350" y2="120" class="image" />
  </g>
</svg>