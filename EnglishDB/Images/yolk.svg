<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .egg { fill: #FFEB3B; }
      .yolk { fill: #FFC107; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yolk</text>
  <text x="50" y="120" class="subtitle">[joʊk] n. 蛋黄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> yol (卵) + k (表示名词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个鸡蛋，"卵(yol)"中的"黄色部分(k)"
    <tspan x="50" dy="25">就是蛋黄(yolk)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The yolk of the egg is rich in nutrients.
  </text>
  <text x="50" y="310" class="content">
    鸡蛋的蛋黄富含营养。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Egg -->
    <ellipse cx="175" cy="100" rx="150" ry="100" class="egg" />
    <!-- Yolk -->
    <circle cx="175" cy="100" r="50" class="yolk" />
  </g>
</svg>