<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nylon</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪlɑn] n. 尼龙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nylo- (源自商标名)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蜘蛛网，由"尼龙(nylon)"
    <tspan x="50" dy="25">丝线编织而成，坚韧且光滑，象征着尼龙的特性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a nylon jacket for the rainy season.
  </text>
  <text x="50" y="310" class="content">
    她为雨季买了一件尼龙夹克。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spider web -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="95" y1="100" x2="255" y2="100" class="image" />
    <line x1="175" y1="100" x2="95" y2="180" class="image" />
    <line x1="175" y1="100" x2="255" y2="180" class="image" />
    <line x1="175" y1="100" x2="95" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="20" class="image" />
    <!-- Nylon thread -->
    <line x1="175" y1="100" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="125" y2="300" class="image" />
    <line x1="175" y1="250" x2="225" y2="300" class="image" />
  </g>
</svg>