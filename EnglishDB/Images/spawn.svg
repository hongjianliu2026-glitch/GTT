<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spawn</text>
  <text x="50" y="120" class="subtitle">[spɔːn] v. 产卵，大量出现；n. 卵，幼体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sp- (喷射) + -awn (出现)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鱼妈妈在水中"喷射(sp-)"出无数的小鱼卵，
    <tspan x="50" dy="25">这些小鱼卵迅速"出现(awn)"，形成了大量的幼体(spawn)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fish spawned in the warm waters of the lake.
  </text>
  <text x="50" y="310" class="content">
    鱼在温暖的湖水中产卵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="70" x2="50" y2="130" class="image" />
    <line x1="50" y1="70" x2="20" y2="100" class="image" />
    <line x1="50" y1="70" x2="80" y2="100" class="image" />
    <line x1="50" y1="130" x2="20" y2="100" class="image" />
    <line x1="50" y1="130" x2="80" y2="100" class="image" />

    <!-- Eggs -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="170" cy="100" r="10" class="image" />
    <circle cx="190" cy="100" r="10" class="image" />
    <circle cx="210" cy="100" r="10" class="image" />
    <circle cx="230" cy="100" r="10" class="image" />
  </g>
</svg>