<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buffalo</text>
  <text x="50" y="120" class="subtitle">[ˈbʌfəloʊ] n. 水牛，美洲野牛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> buf- (牛) + alo (动物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头巨大的水牛(buf-alo)在草原上悠闲地吃草，
    <tspan x="50" dy="25">它的身影在夕阳下显得格外壮观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The buffalo roamed freely in the vast prairie.
  </text>
  <text x="50" y="310" class="content">
    水牛在广阔的草原上自由地游荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Buffalo body -->
    <ellipse cx="150" cy="100" rx="100" ry="60" class="image" />
    <!-- Buffalo head -->
    <ellipse cx="250" cy="80" rx="40" ry="30" class="image" />
    <!-- Buffalo horns -->
    <path d="M230,50 Q220,20 210,50" class="image" />
    <path d="M270,50 Q280,20 290,50" class="image" />
    <!-- Buffalo legs -->
    <line x1="100" y1="160" x2="100" y2="200" class="image" />
    <line x1="200" y1="160" x2="200" y2="200" class="image" />
    <line x1="120" y1="160" x2="120" y2="200" class="image" />
    <line x1="180" y1="160" x2="180" y2="200" class="image" />
    <!-- Grass -->
    <line x1="50" y1="220" x2="300" y2="220" class="image" />
    <line x1="50" y1="230" x2="300" y2="230" class="image" />
    <line x1="50" y1="240" x2="300" y2="240" class="image" />
  </g>
</svg>