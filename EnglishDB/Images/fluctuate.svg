<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fluctuate</text>
  <text x="50" y="120" class="subtitle">[ˈflʌktʃueɪt] v. 波动，起伏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flu (流动) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，水流"流动(flu)"不定，
    <tspan x="50" dy="25">时而急促，时而缓慢，这就是"波动(fluctuate)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stock market fluctuates daily.
  </text>
  <text x="50" y="310" class="content">
    股市每天都在波动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 100 Q100 50 200 100 T400 100 T600 100 T800 100" class="image" />
    <path d="M0 120 Q100 150 200 120 T400 120 T600 120 T800 120" class="image" />
    <path d="M0 140 Q100 100 200 140 T400 140 T600 140 T800 140" class="image" />
    <path d="M0 160 Q100 180 200 160 T400 160 T600 160 T800 160" class="image" />
  </g>
</svg>