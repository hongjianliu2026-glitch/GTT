<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">converted</text>
  <text x="50" y="120" class="subtitle">[kənˈvɜːrtɪd] adj. 被转换的，被改变的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (完全) + vert (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体被"完全转动(con-vert)"，
    <tspan x="50" dy="25">从一种形式变成了另一种，这就是被转换(converted)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old barn was converted into a modern home.
  </text>
  <text x="50" y="310" class="content">
    旧谷仓被改造成了一个现代化的家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old barn -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />

    <!-- Modern home -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <line x1="220" y1="20" x2="330" y2="20" class="image" />
    <line x1="220" y1="40" x2="330" y2="40" class="image" />
    <line x1="220" y1="60" x2="330" y2="60" class="image" />
    <line x1="220" y1="80" x2="330" y2="80" class="image" />
    <rect x="250" y="20" width="50" height="50" class="image" />
    <rect x="270" y="40" width="10" height="10" class="image" />
    <rect x="270" y="60" width="10" height="10" class="image" />

    <!-- Arrow -->
    <line x1="150" y1="50" x2="190" y2="50" class="image" />
    <polygon points="190,50 185,45 185,55" class="image" />
  </g>
</svg>