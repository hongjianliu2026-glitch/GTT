<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hush</text>
  <text x="50" y="120" class="subtitle">[hʌʃ] v. 安静，使安静；n. 安静，沉默</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hus- (来自古英语 hyscan，意为“使安静”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个母亲在哄婴儿睡觉，她轻轻地"嘘(hus)"了一声，
    <tspan x="50" dy="25">整个房间立刻安静下来，这就是hush的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hushed the baby to sleep.
  </text>
  <text x="50" y="310" class="content">
    她哄婴儿入睡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother and baby -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Mother's head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Mother's body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Mother's left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Mother's right arm -->
    <circle cx="150" cy="100" r="20" class="image" /> <!-- Baby's head -->
    <line x1="150" y1="120" x2="150" y2="160" class="image" /> <!-- Baby's body -->
    <line x1="150" y1="140" x2="130" y2="130" class="image" /> <!-- Baby's left arm -->
    <line x1="150" y1="140" x2="170" y2="130" class="image" /> <!-- Baby's right arm -->
    <!-- Hush symbol -->
    <text x="100" y="200" font-size="60" fill="#7F8C8D">嘘</text>
  </g>
</svg>