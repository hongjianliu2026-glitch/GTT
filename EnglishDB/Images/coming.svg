<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coming</text>
  <text x="50" y="120" class="subtitle">[ˈkʌmɪŋ] adj. 即将到来的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + ing (正在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"一起(com-)"走向你，"正在(ing)"
    <tspan x="50" dy="25">到来的场景，这就是"即将到来的(coming)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coming weekend is full of activities.
  </text>
  <text x="50" y="310" class="content">
    即将到来的周末充满了活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People walking -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="20" y1="0" x2="120" y2="100" class="image" />
    <line x1="40" y1="0" x2="140" y2="100" class="image" />
    <line x1="60" y1="0" x2="160" y2="100" class="image" />
    <line x1="80" y1="0" x2="180" y2="100" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="100" x2="200" y2="200" class="image" />
    <line x1="120" y1="100" x2="220" y2="200" class="image" />
    <line x1="140" y1="100" x2="240" y2="200" class="image" />
    <line x1="160" y1="100" x2="260" y2="200" class="image" />
    <line x1="180" y1="100" x2="280" y2="200" class="image" />
  </g>
</svg>