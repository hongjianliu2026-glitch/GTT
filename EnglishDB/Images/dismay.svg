<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dismay</text>
  <text x="50" y="120" class="subtitle">[dɪsˈmeɪ] n. 沮丧，惊愕；v. 使沮丧，使惊愕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (否定) + may (可能)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人原本"可能(may)"会成功，但突然间"否定(dis-)"了这种可能性，
    <tspan x="50" dy="25">结果感到沮丧(dismay)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the accident filled her with dismay.
  </text>
  <text x="50" y="310" class="content">
    事故的消息使她感到沮丧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Cloud -->
    <ellipse cx="100" cy="50" rx="80" ry="40" class="image" />
    <!-- Lightning bolt -->
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="100" y2="150" class="image" />
    <!-- Broken heart -->
    <path d="M200,100 C210,80 230,80 240,100 C250,120 230,120 220,100 Z" class="image" />
  </g>
</svg>