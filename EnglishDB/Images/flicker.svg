<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flicker</text>
  <text x="50" y="120" class="subtitle">[ˈflɪkər] v. 闪烁，摇曳；n. 闪烁，摇曳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flick (轻弹) + -er (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一盏老旧的灯泡，"轻弹(flick)"着发出微弱的光芒，
    <tspan x="50" dy="25">光芒忽明忽暗，就像是在"闪烁(flicker)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The candle flickered in the breeze.
  </text>
  <text x="50" y="310" class="content">
    蜡烛在微风中闪烁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Light bulb -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="75" y1="250" x2="125" y2="250" class="image" />
    <!-- Flickering light -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="50" y1="90" x2="150" y2="90" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="130" x2="150" y2="130" class="image" />
  </g>
</svg>