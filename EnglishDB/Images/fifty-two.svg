<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fifty-two</text>
  <text x="50" y="120" class="subtitle">[ˈfɪfti tuː] n. 五十二</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fifty (五十) + two (二)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“52”漂浮在空中，
    <tspan x="50" dy="25">像一个巨大的扑克牌，上面写着“52”，</tspan>
    <tspan x="50" dy="25">象征着一年中的52周。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are fifty-two weeks in a year.
  </text>
  <text x="50" y="310" class="content">
    一年有五十二周。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number "52" -->
    <text x="50" y="100" font-size="150" fill="#E74C3C">52</text>
    <!-- Poker card -->
    <rect x="20" y="20" width="150" height="200" class="image" />
    <text x="40" y="120" font-size="80" fill="#2C3E50">52</text>
  </g>
</svg>