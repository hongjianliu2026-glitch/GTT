<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lavish</text>
  <text x="50" y="120" class="subtitle">[ˈlævɪʃ] adj. 丰富的，浪费的；v. 慷慨给予</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lavi (洗) + -sh (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在洗澡时，"洗掉(lavi)"
    <tspan x="50" dy="25">所有的钱，毫不吝啬地给予，这就是lavish。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He lavished gifts on his girlfriend.
  </text>
  <text x="50" y="310" class="content">
    他慷慨地送礼物给他的女朋友。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shower -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Money falling -->
    <circle cx="70" cy="40" r="10" class="image" />
    <circle cx="120" cy="60" r="10" class="image" />
    <circle cx="170" cy="80" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="270" cy="120" r="10" class="image" />
    <circle cx="320" cy="140" r="10" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>