<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ballerina</text>
  <text x="50" y="120" class="subtitle">[ˌbæləˈriːnə] n. 芭蕾舞女演员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ball (舞) + -erina (女性)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个优雅的芭蕾舞女演员(ballerina)，
    <tspan x="50" dy="25">她轻盈地旋转，仿佛在空中"舞动(ball)"，</tspan>
    <tspan x="50" dy="25">展现出女性的柔美与力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ballerina performed a breathtaking pirouette.
  </text>
  <text x="50" y="310" class="content">
    那位芭蕾舞女演员表演了一个令人惊叹的旋转。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ballerina -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Tutu -->
    <path d="M30,180 Q50,200 70,180" class="image" />
    <!-- Ballet shoes -->
    <circle cx="30" cy="185" r="5" class="image" />
    <circle cx="70" cy="185" r="5" class="image" />
  </g>
</svg>