<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">withering</text>
  <text x="50" y="120" class="subtitle">[ˈwɪðərɪŋ] adj. 枯萎的，凋谢的；v. 使枯萎，使凋谢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wither (枯萎) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵花在烈日下逐渐"枯萎(wither)"，
    <tspan x="50" dy="25">花瓣一片片凋落，最终变成了一朵"枯萎的(withering)"花。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The withering flowers in the vase needed to be replaced.
  </text>
  <text x="50" y="310" class="content">
    花瓶里枯萎的花需要更换。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="50" r="40" class="image" fill="#F1C40F" />
    <!-- Flower -->
    <circle cx="200" cy="150" r="20" class="image" fill="#2ECC71" />
    <line x1="200" y1="170" x2="200" y2="250" class="image" />
    <line x1="200" y1="200" x2="170" y2="180" class="image" />
    <line x1="200" y1="200" x2="230" y2="180" class="image" />
    <line x1="200" y1="220" x2="170" y2="240" class="image" />
    <line x1="200" y1="220" x2="230" y2="240" class="image" />
    <!-- Withering effect -->
    <line x1="200" y1="250" x2="200" y2="280" class="image" stroke-dasharray="5,5" />
    <line x1="170" y1="180" x2="150" y2="160" class="image" stroke-dasharray="5,5" />
    <line x1="230" y1="180" x2="250" y2="160" class="image" stroke-dasharray="5,5" />
    <line x1="170" y1="240" x2="150" y2="260" class="image" stroke-dasharray="5,5" />
    <line x1="230" y1="240" x2="250" y2="260" class="image" stroke-dasharray="5,5" />
  </g>
</svg>