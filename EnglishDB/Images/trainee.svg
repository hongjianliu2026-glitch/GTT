<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trainee</text>
  <text x="50" y="120" class="subtitle">[treɪˈniː] n. 实习生，受训者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> train (训练) + ee (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个实习生在训练场上，"接受训练(train-ee)"
    <tspan x="50" dy="25">，努力学习新技能，成为一名合格的员工。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The trainee is learning how to operate the machine.
  </text>
  <text x="50" y="310" class="content">
    实习生正在学习如何操作机器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Training ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trainee -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Trainer -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Training action -->
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="120" y2="180" class="image" />
  </g>
</svg>