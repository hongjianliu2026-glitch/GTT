<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ecologist</text>
  <text x="50" y="120" class="subtitle">[ɪˈkɒlədʒɪst] n. 生态学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eco- (生态) + log (学) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个生态学家在森林中，"研究(log)"
    <tspan x="50" dy="25">生态系统，保护自然环境(eco-logist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ecologist studied the impact of deforestation on local wildlife.
  </text>
  <text x="50" y="310" class="content">
    生态学家研究了砍伐森林对当地野生动物的影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="180" x2="50" y2="100" class="image" />
    <line x1="100" y1="180" x2="100" y2="120" class="image" />
    <line x1="150" y1="180" x2="150" y2="140" class="image" />
    <line x1="200" y1="180" x2="200" y2="160" class="image" />
    <line x1="250" y1="180" x2="250" y2="180" class="image" />
    <!-- Ecologist -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
    <!-- Binoculars -->
    <line x1="100" y1="150" x2="130" y2="150" class="image" />
    <line x1="115" y1="140" x2="115" y2="160" class="image" />
    <line x1="115" y1="140" x2="130" y2="150" class="image" />
    <line x1="115" y1="160" x2="130" y2="150" class="image" />
  </g>
</svg>