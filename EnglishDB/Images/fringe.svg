<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fringe</text>
  <text x="50" y="120" class="subtitle">[frɪndʒ] n. 边缘，刘海；v. 加穗于</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frang (打破) + e (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女孩的头发被"打破(frang)"成细小的"边缘(e)"，
    <tspan x="50" dy="25">这些细小的边缘就形成了她的刘海(fringe)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a cute fringe that frames her face.
  </text>
  <text x="50" y="310" class="content">
    她有一头可爱的刘海，衬托着她的脸庞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Hair -->
    <line x1="40" y1="100" x2="160" y2="100" class="image" />
    <line x1="50" y1="90" x2="150" y2="90" class="image" />
    <line x1="60" y1="80" x2="140" y2="80" class="image" />
    <line x1="70" y1="70" x2="130" y2="70" class="image" />
    <line x1="80" y1="60" x2="120" y2="60" class="image" />
    <line x1="90" y1="50" x2="110" y2="50" class="image" />
    <!-- Fringe -->
    <line x1="60" y1="40" x2="140" y2="40" class="image" />
    <line x1="70" y1="30" x2="130" y2="30" class="image" />
    <line x1="80" y1="20" x2="120" y2="20" class="image" />
    <line x1="90" y1="10" x2="110" y2="10" class="image" />
  </g>
</svg>