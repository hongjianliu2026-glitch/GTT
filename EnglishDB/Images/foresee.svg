<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foresee</text>
  <text x="50" y="120" class="subtitle">[fɔːrˈsiː] v. 预见，预知</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (在前面) + see (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在未来，"提前看到(fore-see)"
    <tspan x="50" dy="25">即将发生的事情，这就是预见(foresee)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She could foresee the challenges ahead.
  </text>
  <text x="50" y="310" class="content">
    她能预见到前方的挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person looking into the future -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Eye looking into a crystal ball -->
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="25" class="image" fill="#E8F6F3" />
    <circle cx="150" cy="100" r="10" class="image" fill="#2980B9" />
    <!-- Future events -->
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="130" y2="290" class="image" />
    <line x1="150" y1="250" x2="170" y2="290" class="image" />
    <line x1="150" y1="220" x2="180" y2="210" class="image" />
  </g>
</svg>