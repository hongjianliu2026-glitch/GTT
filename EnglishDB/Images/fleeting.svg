<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fleeting</text>
  <text x="50" y="120" class="subtitle">[ˈfliːtɪŋ] adj. 短暂的，飞逝的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fleet (弯曲，转向) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶在花丛中"弯曲转向(fleet)"，
    <tspan x="50" dy="25">它的美丽和存在只是短暂的(fleeting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beauty of the sunset was fleeting.
  </text>
  <text x="50" y="310" class="content">
    日落的美景是短暂的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butterfly -->
    <path d="M50 50 C60 20, 90 20, 100 50 S140 80, 150 50" class="image" />
    <path d="M50 50 C60 80, 90 80, 100 50 S140 20, 150 50" class="image" />
    <!-- Flower -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="120" cy="80" r="15" class="image" />
    <circle cx="80" cy="80" r="15" class="image" />
    <circle cx="110" cy="110" r="15" class="image" />
    <circle cx="90" cy="110" r="15" class="image" />
    <!-- Sun -->
    <circle cx="200" cy="50" r="30" class="image" />
    <line x1="200" y1="20" x2="200" y2="0" class="image" />
    <line x1="230" y1="50" x2="250" y2="50" class="image" />
    <line x1="200" y1="80" x2="200" y2="100" class="image" />
    <line x1="170" y1="50" x2="150" y2="50" class="image" />
  </g>
</svg>