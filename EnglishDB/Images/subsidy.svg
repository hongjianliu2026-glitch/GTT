<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subsidy</text>
  <text x="50" y="120" class="subtitle">[ˈsʌbsɪdi] n. 补贴，补助金</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + sid (坐) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个政府官员坐在桌子下面，偷偷地"坐下来(sub-sid)"
    <tspan x="50" dy="25">给需要帮助的人发放补助金(subsidy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government provides a subsidy for farmers.
  </text>
  <text x="50" y="310" class="content">
    政府为农民提供补贴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Government official -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="180" x2="240" y2="170" class="image" />
    <!-- Money bag -->
    <rect x="180" y="100" width="40" height="30" class="image" />
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
    <line x1="180" y1="130" x2="220" y2="130" class="image" />
    <line x1="180" y1="100" x2="180" y2="130" class="image" />
    <line x1="220" y1="100" x2="220" y2="130" class="image" />
    <!-- Money -->
    <line x1="190" y1="110" x2="210" y2="110" class="image" />
    <line x1="190" y1="120" x2="210" y2="120" class="image" />
  </g>
</svg>