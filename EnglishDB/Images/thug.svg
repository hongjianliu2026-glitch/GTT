<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thug</text>
  <text x="50" y="120" class="subtitle">[θʌɡ] n. 暴徒，恶棍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thug (源自印度语，原意为“杀手”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着头巾的恶棍，手持棍棒，
    <tspan x="50" dy="25">眼神凶狠，准备对无辜的路人进行袭击。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thug threatened the shopkeeper with a knife.
  </text>
  <text x="50" y="310" class="content">
    那个恶棍用刀威胁店主。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Headband -->
    <rect x="50" y="20" width="150" height="20" class="image" />
    <!-- Face -->
    <circle cx="125" cy="70" r="30" class="image" />
    <!-- Eyes -->
    <circle cx="110" cy="60" r="5" class="image" />
    <circle cx="140" cy="60" r="5" class="image" />
    <!-- Nose -->
    <line x1="125" y1="75" x2="125" y2="90" class="image" />
    <!-- Mouth -->
    <line x1="115" y1="100" x2="135" y2="100" class="image" />
    <!-- Stick -->
    <line x1="125" y1="120" x2="125" y2="200" class="image" />
    <line x1="120" y1="160" x2="130" y2="160" class="image" />
    <line x1="120" y1="170" x2="130" y2="170" class="image" />
    <line x1="120" y1="180" x2="130" y2="180" class="image" />
  </g>
</svg>