<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brood</text>
  <text x="50" y="120" class="subtitle">[bruːd] n. 一窝，一伙；v. 沉思，孵蛋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brood (源自中古英语 brod，意为“一窝”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只母鸡在窝里"孵蛋(brood)"，
    <tspan x="50" dy="25">她的孩子们围绕着她，形成了一窝(brood)小鸡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hen was brooding her eggs in the nest.
  </text>
  <text x="50" y="310" class="content">
    母鸡在巢里孵蛋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hen -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Eggs -->
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="160" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="240" cy="100" r="15" class="image" />
    <circle cx="280" cy="100" r="15" class="image" />
  </g>
</svg>