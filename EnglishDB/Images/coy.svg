<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coy</text>
  <text x="50" y="120" class="subtitle">[kɔɪ] adj. 害羞的，腼腆的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "coy"，意为"害羞的"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小女孩在面对陌生人时，"害羞地(coy)"
    <tspan x="50" dy="25">低下头，脸颊泛红，不敢直视对方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave a coy smile when asked about her secret.
  </text>
  <text x="50" y="310" class="content">
    当被问及她的秘密时，她害羞地笑了笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Girl -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <!-- Blushing cheeks -->
    <circle cx="30" cy="40" r="5" class="image" fill="#FF6961" />
    <circle cx="70" cy="40" r="5" class="image" fill="#FF6961" />
    <!-- Downward gaze -->
    <line x1="50" y1="60" x2="50" y2="70" class="image" />
    <line x1="50" y1="70" x2="40" y2="65" class="image" />
    <line x1="50" y1="70" x2="60" y2="65" class="image" />
  </g>
</svg>