<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">restrain</text>
  <text x="50" y="120" class="subtitle">[rɪˈstreɪn] v. 抑制，约束</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + strain (拉紧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图"再次拉紧(re-strain)"一根弹簧，
    <tspan x="50" dy="25">努力控制不让它弹开，这就是抑制(restrain)的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had to restrain herself from laughing during the serious meeting.
  </text>
  <text x="50" y="310" class="content">
    她在严肃的会议上不得不抑制住自己的笑声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spring -->
    <path d="M50 50 Q100 100 150 50 Q200 0 250 50" class="image" />
    <!-- Hand holding the spring -->
    <circle cx="100" cy="50" r="15" class="image" />
    <line x1="100" y1="65" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="80" x2="130" y2="70" class="image" />
  </g>
</svg>