<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yacht</text>
  <text x="50" y="120" class="subtitle">[jɒt] n. 游艇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自荷兰语 "jacht"，意为"追逐"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘游艇在海上"追逐(jacht)"
    <tspan x="50" dy="25">着风浪，快速前行，这就是游艇(yacht)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They spent the weekend sailing their yacht.
  </text>
  <text x="50" y="310" class="content">
    他们周末开着游艇出海。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Yacht body -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Mast -->
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <!-- Sail -->
    <polygon points="175,0 225,50 125,50" class="image" />
    <!-- Water -->
    <line x1="0" y1="70" x2="350" y2="70" class="image" />
    <line x1="0" y1="75" x2="350" y2="75" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
  </g>
</svg>