<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #795548; }
      .content { font: 18px sans-serif; fill: #5D4037; }
      .highlight { font-weight: bold; fill: #FF5722; }
      .story { font: 16px serif; fill: #607D8B; }
      .image { stroke: #8D6E63; stroke-width: 2; fill: none; }
      .cream { fill: #FFF9C4; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">creamy</text>
  <text x="50" y="120" class="subtitle">[ˈkriːmi] adj. 奶油状的，柔滑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cream (奶油) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯满满的奶油(cream)，
    <tspan x="50" dy="25">它柔滑细腻，就像"奶油状的(creamy)"口感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dessert had a creamy texture that melted in your mouth.
  </text>
  <text x="50" y="310" class="content">
    这道甜点有着柔滑的口感，入口即化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Creamy cup -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="cream" />
    <!-- Spoon -->
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="300" y1="20" x2="280" y2="40" class="image" />
    <line x1="300" y1="20" x2="320" y2="40" class="image" />
  </g>
</svg>