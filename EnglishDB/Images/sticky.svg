<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sticky</text>
  <text x="50" y="120" class="subtitle">[ˈstɪki] adj. 粘的，粘性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stick (粘住) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在舔一块"粘性(sticky)"的糖果，
    <tspan x="50" dy="25">糖果粘在它的舌头上，怎么也甩不掉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The floor was sticky from the spilled soda.
  </text>
  <text x="50" y="310" class="content">
    地板因为洒出的汽水而变得粘粘的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sticky candy -->
    <circle cx="100" cy="100" r="30" class="image" fill="#FFD700" />
    <!-- Tongue -->
    <path d="M 100 130 Q 150 150 200 130" class="image" fill="#FF69B4" />
    <!-- Cat face -->
    <circle cx="150" cy="100" r="40" class="image" fill="#8B4513" />
    <circle cx="135" cy="90" r="5" class="image" fill="#FFFFFF" />
    <circle cx="165" cy="90" r="5" class="image" fill="#FFFFFF" />
    <path d="M 140 110 Q 150 120 160 110" class="image" fill="#FF4500" />
  </g>
</svg>