<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">salamander</text>
  <text x="50" y="120" class="subtitle">[ˈsæləˌmændər] n. 蝾螈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> salam (火) + ander (类似)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝾螈在火中"游动(salam-ander)"，
    <tspan x="50" dy="25">它不仅不怕火，反而像在水中一样自如。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The salamander is known for its ability to withstand extreme heat.
  </text>
  <text x="50" y="310" class="content">
    蝾螈以其耐高温的能力而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <path d="M0 100 C 50 50, 150 50, 200 100 S 300 150, 350 100" class="image" />
    <path d="M0 120 C 50 70, 150 70, 200 120 S 300 170, 350 120" class="image" />
    <path d="M0 140 C 50 90, 150 90, 200 140 S 300 190, 350 140" class="image" />
    <!-- Salamander -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
  </g>
</svg>