<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overt</text>
  <text x="50" y="120" class="subtitle">[oʊˈvɜːrt] adj. 公开的，明显的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + -t (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的公告牌"高高在上(over-t)"，
    <tspan x="50" dy="25">上面写着"公开的(overt)"信息，每个人都能看到。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The overt support from the public was overwhelming.
  </text>
  <text x="50" y="310" class="content">
    公众的公开支持非常强烈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Billboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Text on the billboard -->
    <text x="50" y="100" class="content" style="font-size: 36px; fill: #E74C3C;">OVERT</text>
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Rays of the sun -->
    <line x1="300" y1="20" x2="300" y2="0" class="image" />
    <line x1="330" y1="30" x2="350" y2="10" class="image" />
    <line x1="350" y1="50" x2="370" y2="30" class="image" />
    <line x1="350" y1="80" x2="370" y2="100" class="image" />
    <line x1="330" y1="100" x2="350" y2="120" class="image" />
    <line x1="300" y1="110" x2="300" y2="130" class="image" />
    <line x1="270" y1="100" x2="250" y2="120" class="image" />
    <line x1="250" y1="80" x2="230" y2="100" class="image" />
    <line x1="250" y1="50" x2="230" y2="30" class="image" />
    <line x1="270" y1="30" x2="250" y2="10" class="image" />
  </g>
</svg>