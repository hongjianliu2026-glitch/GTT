<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">religiously</text>
  <text x="50" y="120" class="subtitle">[rɪˈlɪdʒəsli] adv. 虔诚地，一丝不苟地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + lig (绑) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人每天"再次绑紧(re-lig)"自己的信仰，
    <tspan x="50" dy="25">就像每天都要虔诚地祈祷，这种行为就是虔诚地(religiously)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She follows her diet religiously.
  </text>
  <text x="50" y="310" class="content">
    她一丝不苟地遵循她的饮食计划。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person praying -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="150" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <!-- Prayer beads -->
    <circle cx="50" cy="200" r="10" class="image" />
    <line x1="50" y1="210" x2="50" y2="250" class="image" />
    <circle cx="50" cy="260" r="10" class="image" />
    <line x1="50" y1="270" x2="50" y2="310" class="image" />
    <circle cx="50" cy="320" r="10" class="image" />
  </g>
</svg>