<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nominally</text>
  <text x="50" y="120" class="subtitle">[ˈnɒmɪnəli] adv. 名义上，表面上</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nom (名字) + in (在...中) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的名字标签前，"名义上(nominally)"
    <tspan x="50" dy="25">他是一个公司的CEO，但实际上他只是个傀儡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is nominally the CEO, but his wife makes all the decisions.
  </text>
  <text x="50" y="310" class="content">
    他名义上是CEO，但实际上所有决定都是他妻子做的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Name tag -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <text x="50" y="50" class="content" fill="#34495E">CEO</text>
    <!-- Person -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
    <!-- Puppet strings -->
    <line x1="20" y1="150" x2="20" y2="100" class="image" />
    <line x1="20" y1="100" x2="50" y2="50" class="image" />
    <line x1="20" y1="100" x2="0" y2="50" class="image" />
  </g>
</svg>