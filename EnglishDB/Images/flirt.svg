<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flirt</text>
  <text x="50" y="120" class="subtitle">[flɜːrt] v. 调情，玩弄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fl- (飞) + -irt (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人像蝴蝶一样"飞来飞去(fl-)"，
    <tspan x="50" dy="25">不停地"动作(irt)"，这就是调情(flirt)的样子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to flirt with the waiter at the restaurant.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在餐厅里和侍者调情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butterfly -->
    <path d="M50 50 C 70 20, 130 20, 150 50" class="image" />
    <path d="M50 50 C 70 80, 130 80, 150 50" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <line x1="200" y1="140" x2="160" y2="130" class="image" />
  </g>
</svg>