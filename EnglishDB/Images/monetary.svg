<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monetary</text>
  <text x="50" y="120" class="subtitle">[ˈmʌnɪteri] adj. 货币的，金融的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mon (钱) + -etary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金币山，"钱(mon)"
    <tspan x="50" dy="25">堆成了山，这就是货币(monetary)的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The central bank is responsible for monetary policy.
  </text>
  <text x="50" y="310" class="content">
    中央银行负责货币政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coin stack -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="50" cy="150" r="30" class="image" />
    <circle cx="50" cy="200" r="30" class="image" />
    <circle cx="50" cy="250" r="30" class="image" />
    <circle cx="50" cy="300" r="30" class="image" />
    <circle cx="50" cy="350" r="30" class="image" />
    <circle cx="50" cy="400" r="30" class="image" />
    <circle cx="50" cy="450" r="30" class="image" />
    <circle cx="50" cy="500" r="30" class="image" />
  </g>
</svg>