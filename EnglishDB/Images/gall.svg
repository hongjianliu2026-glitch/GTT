<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gall</text>
  <text x="50" y="120" class="subtitle">[ɡɔːl] n. 胆汁，怨恨；v. 激怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gall (胆汁)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为被激怒而"胆汁(gall)"
    <tspan x="50" dy="25">涌上心头，满脸通红，眼中充满了怨恨。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His rude behavior filled her with gall.
  </text>
  <text x="50" y="310" class="content">
    他的粗鲁行为让她充满了怨恨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Red face -->
    <circle cx="100" cy="100" r="45" fill="#FF6347" />
    <!-- Gall symbol -->
    <rect x="150" y="70" width="30" height="60" class="image" />
    <text x="155" y="110" class="content" fill="#000">胆汁</text>
  </g>
</svg>