<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">explosion</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsploʊʒən] n. 爆炸，爆发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + plos (爆裂) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，"向外爆裂(ex-plos)"
    <tspan x="50" dy="25">成无数碎片，这就是爆炸(explosion)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The explosion caused a lot of damage.
  </text>
  <text x="50" y="310" class="content">
    爆炸造成了很大的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Explosion lines -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Explosion fragments -->
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
  </g>
</svg>