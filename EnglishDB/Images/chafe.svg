<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chafe</text>
  <text x="50" y="120" class="subtitle">[tʃeɪf] v. 摩擦，擦痛；n. 擦伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chaf (摩擦)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小羊在栅栏上"摩擦(chaf)"，
    <tspan x="50" dy="25">结果羊毛被擦掉了，露出红色的皮肤，这就是擦伤(chafe)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tight collar chafed his neck.
  </text>
  <text x="50" y="310" class="content">
    紧领子擦痛了他的脖子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fence -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Sheep -->
    <circle cx="120" cy="100" r="30" class="image" />
    <line x1="120" y1="130" x2="120" y2="180" class="image" />
    <line x1="120" y1="150" x2="80" y2="170" class="image" />
    <line x1="120" y1="150" x2="160" y2="170" class="image" />
    <!-- Chafed area -->
    <rect x="100" y="80" width="40" height="40" class="image" fill="#E74C3C" />
  </g>
</svg>