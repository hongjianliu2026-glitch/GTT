<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">huff</text>
  <text x="50" y="120" class="subtitle">[hʌf] v. 吹气，发怒；n. 吹气，发怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> huff (源自中古英语 huffen，意为“吹气”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为生气而“吹气(huff)”，
    <tspan x="50" dy="25">他的脸颊鼓起，像气球一样膨胀，</tspan>
    <tspan x="50" dy="25">这就是“huff”的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She huffed and puffed as she carried the heavy box up the stairs.
  </text>
  <text x="50" y="310" class="content">
    她扛着沉重的箱子上楼时，气喘吁吁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Cheeks -->
    <circle cx="70" cy="80" r="20" class="image" />
    <circle cx="130" cy="80" r="20" class="image" />
    <!-- Eyes -->
    <circle cx="85" cy="90" r="5" class="image" />
    <circle cx="115" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Air puff -->
    <path d="M 100 130 Q 150 150 200 130" class="image" />
    <path d="M 100 130 Q 50 150 0 130" class="image" />
  </g>
</svg>