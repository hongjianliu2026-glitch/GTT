<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brutal</text>
  <text x="50" y="120" class="subtitle">[ˈbruːtl] adj. 残忍的，野蛮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brut (野兽) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只野兽(brut)在森林中咆哮，它的行为
    <tspan x="50" dy="25">极其残忍(brutal)，让人不寒而栗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The brutal attack left the city in shock.
  </text>
  <text x="50" y="310" class="content">
    残忍的袭击让整个城市陷入震惊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="300" y2="50" class="image" />
    <line x1="300" y1="50" x2="350" y2="100" class="image" />
    <!-- Beast -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="145" y2="220" class="image" />
    <line x1="175" y1="180" x2="205" y2="220" class="image" />
    <line x1="175" y1="150" x2="225" y2="140" class="image" />
    <line x1="175" y1="150" x2="125" y2="140" class="image" />
  </g>
</svg>