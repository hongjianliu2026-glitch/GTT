<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">roster</text>
  <text x="50" y="120" class="subtitle">[ˈroʊstər] n. 花名册，名单</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rost (烤) + -er (表物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的烤肉店，"烤肉(rost)"
    <tspan x="50" dy="25">师傅每天都要在名单(-er)上记录</tspan>
    <tspan x="50" dy="25">哪些肉已经烤好，这个名单就是花名册(roster)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher posted the roster of students on the board.
  </text>
  <text x="50" y="310" class="content">
    老师把学生名单贴在了黑板上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grill -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Meat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- List -->
    <rect x="200" y="20" width="130" height="160" class="image" />
    <line x1="210" y1="50" x2="320" y2="50" class="image" />
    <line x1="210" y1="80" x2="320" y2="80" class="image" />
    <line x1="210" y1="110" x2="320" y2="110" class="image" />
    <line x1="210" y1="140" x2="320" y2="140" class="image" />
    <!-- Chef -->
    <circle cx="20" cy="180" r="15" class="image" />
    <line x1="20" y1="195" x2="20" y2="230" class="image" />
    <line x1="20" y1="230" x2="0" y2="260" class="image" />
    <line x1="20" y1="230" x2="40" y2="260" class="image" />
    <line x1="20" y1="210" x2="50" y2="200" class="image" />
  </g>
</svg>