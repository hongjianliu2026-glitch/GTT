<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">awaken</text>
  <text x="50" y="120" class="subtitle">[əˈweɪkən] v. 唤醒，觉醒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + wake (醒来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个沉睡的人被"加强的醒来(a-wake)"，
    <tspan x="50" dy="25">突然睁开眼睛，从梦中觉醒(awaken)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sound of the alarm clock awakened me.
  </text>
  <text x="50" y="310" class="content">
    闹钟的声音唤醒了我。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person sleeping -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="130" y2="140" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
    <!-- Eyes opening -->
    <line x1="160" y1="90" x2="190" y2="90" class="image" />
    <line x1="160" y1="90" x2="160" y2="100" class="image" />
    <line x1="190" y1="90" x2="190" y2="100" class="image" />
  </g>
</svg>