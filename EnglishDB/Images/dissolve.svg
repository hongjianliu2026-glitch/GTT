<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dissolve</text>
  <text x="50" y="120" class="subtitle">[dɪˈzɒlv] v. 溶解，解散</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + solve (松开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一粒盐在水中，"分开松开(dis-solve)"
    <tspan x="50" dy="25">成无数微小的颗粒，最终完全溶解(dissolve)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sugar dissolved in the tea quickly.
  </text>
  <text x="50" y="310" class="content">
    糖很快在茶中溶解了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water container -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#A9CCE3" />
    <!-- Salt crystal -->
    <rect x="150" y="90" width="20" height="20" class="image" fill="#F4D03F" />
    <!-- Dissolving effect -->
    <line x1="150" y1="110" x2="170" y2="130" class="image" />
    <line x1="150" y1="110" x2="130" y2="130" class="image" />
    <line x1="150" y1="110" x2="160" y2="140" class="image" />
    <line x1="150" y1="110" x2="140" y2="140" class="image" />
  </g>
</svg>