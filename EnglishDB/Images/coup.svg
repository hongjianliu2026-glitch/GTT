<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coup</text>
  <text x="50" y="120" class="subtitle">[kuː] n. 政变，突然行动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + up (向上)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"共同向上(co-up)"推翻政府，
    <tspan x="50" dy="25">这就是一场政变(coup)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The general staged a coup to overthrow the government.
  </text>
  <text x="50" y="310" class="content">
    将军发动了一场政变以推翻政府。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People pushing up -->
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="50" class="image" />
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <line x1="250" y1="100" x2="250" y2="50" class="image" />
    <!-- Government building -->
    <rect x="100" y="0" width="100" height="50" class="image" />
    <line x1="100" y1="0" x2="100" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <!-- Explosion -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="130" y1="30" x2="170" y2="70" class="image" />
    <line x1="170" y1="30" x2="130" y2="70" class="image" />
  </g>
</svg>