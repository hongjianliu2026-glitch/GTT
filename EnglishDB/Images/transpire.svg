<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transpire</text>
  <text x="50" y="120" class="subtitle">[trænˈspaɪər] v. 发生，泄露</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (穿过) + spir (呼吸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个秘密"穿过(trans-)"空气，"呼吸(spir)"出来，
    <tspan x="50" dy="25">最终泄露(transpire)了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It transpired that he had been lying all along.
  </text>
  <text x="50" y="310" class="content">
    结果表明他一直在撒谎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Secret bubble -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Air flow -->
    <line x1="175" y1="130" x2="175" y2="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="250" r="20" class="image" />
    <line x1="175" y1="270" x2="175" y2="300" class="image" />
    <line x1="175" y1="280" x2="155" y2="270" class="image" />
    <line x1="175" y1="280" x2="195" y2="270" class="image" />
    <line x1="175" y1="300" x2="155" y2="320" class="image" />
    <line x1="175" y1="300" x2="195" y2="320" class="image" />
  </g>
</svg>