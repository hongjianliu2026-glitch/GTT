<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">joist</text>
  <text x="50" y="120" class="subtitle">[dʒɔɪst] n. 托梁，搁栅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> joi (连接) + st (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的木头"连接(joi)"在一起，"站立(st)"
    <tspan x="50" dy="25">在建筑物中，支撑着整个结构，这就是托梁(joist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The joists in the ceiling were exposed during the renovation.
  </text>
  <text x="50" y="310" class="content">
    在翻修过程中，天花板上的托梁暴露了出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Joist -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Building -->
    <rect x="100" y="200" width="150" height="100" class="image" />
    <line x1="100" y1="200" x2="100" y2="300" class="image" />
    <line x1="250" y1="200" x2="250" y2="300" class="image" />
    <line x1="100" y1="300" x2="250" y2="300" class="image" />
  </g>
</svg>