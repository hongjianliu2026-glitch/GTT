<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">demented</text>
  <text x="50" y="120" class="subtitle">[dɪˈmɛntɪd] adj. 疯狂的，精神错乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + ment (心智) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人心智("ment")向下("de-")沉沦，变得疯狂("demented")。
    <tspan x="50" dy="25">他的眼神迷离，行为怪异，仿佛被黑暗吞噬。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man's demented behavior scared the children.
  </text>
  <text x="50" y="310" class="content">
    那位老人的疯狂行为吓坏了孩子们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="80" r="10" class="image" />
    <circle cx="125" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 70 130 Q 100 150 130 130" class="image" />
    <!-- Dark cloud -->
    <path d="M 50 50 Q 150 20 100 150" class="image" />
    <path d="M 50 100 Q 150 70 100 180" class="image" />
    <path d="M 50 150 Q 150 120 100 200" class="image" />
  </g>
</svg>