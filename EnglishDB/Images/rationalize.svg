<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rationalize</text>
  <text x="50" y="120" class="subtitle">[ˈræʃənəlaɪz] v. 合理化，使合理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ratio (理性) + -al (形容词后缀) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在用"理性(ratio)"的思维方式，
    <tspan x="50" dy="25">试图"使(ize)"某个行为或决定"合理化(rationalize)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He tried to rationalize his decision to quit his job.
  </text>
  <text x="50" y="310" class="content">
    他试图合理化自己辞职的决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Thought bubbles -->
    <ellipse cx="150" cy="50" rx="40" ry="20" class="image" />
    <ellipse cx="200" cy="70" rx="30" ry="15" class="image" />
    <ellipse cx="250" cy="60" rx="20" ry="10" class="image" />
    <!-- Rationalization process -->
    <line x1="100" y1="150" x2="150" y2="100" class="image" />
    <line x1="100" y1="150" x2="200" y2="120" class="image" />
    <line x1="100" y1="150" x2="250" y2="110" class="image" />
  </g>
</svg>