<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trifle</text>
  <text x="50" y="120" class="subtitle">[ˈtraɪfəl] n. 琐事，小事；v. 轻视，玩弄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tri- (三) + fle (逃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象三只小猫在追逐一只蝴蝶，蝴蝶轻盈地"逃(fle)"走了，
    <tspan x="50" dy="25">小猫们却还在玩耍，这些小猫追逐蝴蝶的情景就是"琐事(trifle)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't waste your time on trifles.
  </text>
  <text x="50" y="310" class="content">
    不要把时间浪费在琐事上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Three cats -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Butterfly -->
    <path d="M300,50 Q350,0 400,50" class="image" />
    <!-- Cat tails -->
    <line x1="50" y1="70" x2="30" y2="100" class="image" />
    <line x1="150" y1="70" x2="130" y2="100" class="image" />
    <line x1="250" y1="70" x2="230" y2="100" class="image" />
  </g>
</svg>