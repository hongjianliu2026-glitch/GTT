<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bitter</text>
  <text x="50" y="120" class="subtitle">[ˈbɪtər] adj. 苦的，痛苦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bit (咬) + -er (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人咬了一口苦涩的柠檬，"咬(bit)"
    <tspan x="50" dy="25">下去的瞬间，脸上露出痛苦的表情，这就是bitter(苦的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The medicine tasted bitter, but it was good for her health.
  </text>
  <text x="50" y="310" class="content">
    这药很苦，但对她的健康有好处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lemon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Bitten part -->
    <path d="M 70 100 Q 50 120 70 140" class="image" fill="#FFFACD" />
    <!-- Face -->
    <circle cx="200" cy="100" r="30" class="image" fill="#FFE4E1" />
    <circle cx="190" cy="90" r="5" class="image" fill="#000" />
    <circle cx="210" cy="90" r="5" class="image" fill="#000" />
    <path d="M 180 110 Q 200 120 220 110" class="image" fill="#000" />
  </g>
</svg>