<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">binary</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪnəri] adj. 二进制的，二元的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (二) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的占卜师，手持两枚硬币，"二(bi-)"
    <tspan x="50" dy="25">枚硬币的正反面决定了命运的走向，这就是二进制(binary)的奥秘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The computer stores data in binary format.
  </text>
  <text x="50" y="310" class="content">
    计算机以二进制格式存储数据。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two coins -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <!-- Coin faces -->
    <circle cx="50" cy="100" r="25" fill="#FFD700" />
    <circle cx="150" cy="100" r="25" fill="#C0C0C0" />
    <!-- Divination lines -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <!-- Divination symbols -->
    <text x="40" y="180" class="content">0</text>
    <text x="140" y="180" class="content">1</text>
  </g>
</svg>