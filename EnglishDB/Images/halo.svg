<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">halo</text>
  <text x="50" y="120" class="subtitle">[ˈheɪloʊ] n. 光环，光圈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hal- (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天使头上有一个巨大的光环(halo)，
    <tspan x="50" dy="25">这个光环是由无数闪耀的光线组成的，</tspan>
    <tspan x="50" dy="25">照亮了整个天空。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The saint was depicted with a halo around his head.
  </text>
  <text x="50" y="310" class="content">
    圣徒的头上被描绘有一个光环。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Halo -->
    <circle cx="100" cy="100" r="80" class="image" stroke-dasharray="10,10" />
    <!-- Angel -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="60" y2="130" class="image" />
    <line x1="100" y1="150" x2="140" y2="130" class="image" />
    <line x1="100" y1="180" x2="60" y2="220" class="image" />
    <line x1="100" y1="180" x2="140" y2="220" class="image" />
  </g>
</svg>