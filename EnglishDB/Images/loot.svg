<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loot</text>
  <text x="50" y="120" class="subtitle">[lut] n. 掠夺物，战利品；v. 抢劫，掠夺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "lute"，意为“掠夺”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群海盗在船上，"掠夺(loot)"
    <tspan x="50" dy="25">满载金银财宝，这些财宝就是他们的战利品(loot)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pirates looted the ship and took all the gold.
  </text>
  <text x="50" y="310" class="content">
    海盗们抢劫了那艘船，拿走了所有的黄金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pirate ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 250,150 200,120 50,120" class="image" />
    <!-- Treasure chest -->
    <rect x="100" y="50" width="100" height="60" class="image" />
    <line x1="120" y1="50" x2="120" y2="110" class="image" />
    <line x1="180" y1="50" x2="180" y2="110" class="image" />
    <!-- Gold coins -->
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="130" cy="70" r="8" class="image" />
    <circle cx="170" cy="90" r="9" class="image" />
    <!-- Pirate -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>