<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fourth-grade</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrθ ɡreɪd] n. 四年级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fourth (第四) + grade (年级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个教室里，"第四(fourth)"排的学生们正在认真听讲，
    <tspan x="50" dy="25">他们都是"四年级(fourth-grade)"的学生。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is in the fourth-grade this year.
  </text>
  <text x="50" y="310" class="content">
    她今年上四年级。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Students -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Teacher -->
    <circle cx="300" cy="50" r="20" class="image" />
    <line x1="300" y1="70" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="280" y2="130" class="image" />
    <line x1="300" y1="100" x2="320" y2="130" class="image" />
    <line x1="300" y1="80" x2="330" y2="70" class="image" />
    <!-- Fourth row -->
    <line x1="40" y1="150" x2="310" y2="150" class="image" />
    <line x1="40" y1="160" x2="310" y2="160" class="image" />
    <line x1="40" y1="170" x2="310" y2="170" class="image" />
    <line x1="40" y1="180" x2="310" y2="180" class="image" />
  </g>
</svg>