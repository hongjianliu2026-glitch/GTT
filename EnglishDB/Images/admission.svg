<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">admission</text>
  <text x="50" y="120" class="subtitle">[ədˈmɪʃn] n. 承认，入场许可</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + miss (发送) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在门口，"朝向(ad-)"门卫"发送(miss)"
    <tspan x="50" dy="25">他的入场请求，门卫点头表示许可(admission)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The admission to the concert was sold out within hours.
  </text>
  <text x="50" y="310" class="content">
    音乐会的入场券在几小时内就售罄了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="250" class="image" />
    <!-- Door handle -->
    <circle cx="130" cy="125" r="10" class="image" />
    <!-- Person -->
    <circle cx="200" cy="125" r="20" class="image" />
    <line x1="200" y1="145" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="160" x2="230" y2="150" class="image" />
    <!-- Guard -->
    <circle cx="300" cy="125" r="20" class="image" />
    <line x1="300" y1="145" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="280" y2="230" class="image" />
    <line x1="300" y1="200" x2="320" y2="230" class="image" />
    <line x1="300" y1="160" x2="330" y2="150" class="image" />
    <!-- Hand gesture -->
    <line x1="300" y1="145" x2="350" y2="145" class="image" />
    <line x1="350" y1="145" x2="340" y2="135" class="image" />
    <line x1="350" y1="145" x2="340" y2="155" class="image" />
  </g>
</svg>