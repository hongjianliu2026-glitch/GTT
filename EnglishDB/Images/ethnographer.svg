<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ethnographer</text>
  <text x="50" y="120" class="subtitle">[ˌɛθˈnɑːɡrəfər] n. 民族志学者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ethno- (民族) + graph (写) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学者，他深入不同的民族，"写下(graph)"
    <tspan x="50" dy="25">他们的文化和生活方式，这个人就是民族志学者(ethnographer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ethnographer spent years documenting the tribe's customs.
  </text>
  <text x="50" y="310" class="content">
    这位民族志学者花了数年时间记录部落的习俗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Anthropologist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Notebook -->
    <rect x="70" y="80" width="100" height="120" class="image" />
    <!-- Writing -->
    <line x1="80" y1="100" x2="160" y2="100" class="image" />
    <line x1="80" y1="120" x2="140" y2="120" class="image" />
    <line x1="80" y1="140" x2="150" y2="140" class="image" />
    <line x1="80" y1="160" x2="130" y2="160" class="image" />
    <!-- Tribe -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="240" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="200" y2="130" class="image" />
    <line x1="220" y1="110" x2="220" y2="130" class="image" />
    <line x1="240" y1="110" x2="240" y2="130" class="image" />
  </g>
</svg>