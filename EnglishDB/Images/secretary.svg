<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">secretary</text>
  <text x="50" y="120" class="subtitle">[ˈsɛkrəˌtɛri] n. 秘书，书记</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> secret (秘密) + -ary (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个秘书坐在桌子前，"保守秘密(secret)"
    <tspan x="50" dy="25">并处理各种文件，这就是秘书(secretary)的工作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She works as a secretary in a law firm.
  </text>
  <text x="50" y="310" class="content">
    她在一家律师事务所担任秘书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Secretary -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Files -->
    <rect x="100" y="50" width="50" height="70" class="image" />
    <rect x="160" y="50" width="50" height="70" class="image" />
    <rect x="220" y="50" width="50" height="70" class="image" />
    <!-- Lock -->
    <rect x="280" y="50" width="50" height="70" class="image" />
    <line x1="305" y1="50" x2="305" y2="120" class="image" />
    <circle cx="305" cy="130" r="10" class="image" />
  </g>
</svg>