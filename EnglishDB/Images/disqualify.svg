<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disqualify</text>
  <text x="50" y="120" class="subtitle">[dɪsˈkwɒlɪfaɪ] v. 取消资格，使不合格</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + qual (质量) + -ify (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在比赛中，因为犯规被"取消(dis-)"了"质量(qual)"，
    <tspan x="50" dy="25">结果被"使(ify)"不合格，失去了比赛资格。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His cheating disqualified him from the competition.
  </text>
  <text x="50" y="310" class="content">
    他的作弊行为使他失去了比赛资格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Athlete -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />

    <!-- Red Cross -->
    <line x1="10" y1="90" x2="90" y2="110" class="image" />
    <line x1="10" y1="110" x2="90" y2="90" class="image" />

    <!-- Text -->
    <text x="110" y="105" class="content" style="font-size: 24px; fill: #C0392B;">Disqualified</text>
  </g>
</svg>