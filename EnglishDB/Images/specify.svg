<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">specify</text>
  <text x="50" y="120" class="subtitle">[ˈspesɪfaɪ] v. 指定，详细说明</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> speci (种类) + -fy (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"使(fy)"
    <tspan x="50" dy="25">某种物质成为(specify)"特定的种类，</tspan>
    <tspan x="50" dy="25">详细说明其性质和用途。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please specify the exact date and time for the meeting.
  </text>
  <text x="50" y="310" class="content">
    请指定会议的确切日期和时间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Lab table -->
    <rect x="50" y="20" width="300" height="160" class="image" />
    <!-- Beakers -->
    <circle cx="100" cy="80" r="20" class="image" />
    <circle cx="150" cy="80" r="20" class="image" />
    <circle cx="200" cy="80" r="20" class="image" />
    <!-- Labels -->
    <text x="100" y="120" class="content">Specimen A</text>
    <text x="150" y="120" class="content">Specimen B</text>
    <text x="200" y="120" class="content">Specimen C</text>
  </g>
</svg>