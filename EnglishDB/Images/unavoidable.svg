<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unavoidable</text>
  <text x="50" y="120" class="subtitle">[ˌʌnəˈvɔɪdəbl] adj. 不可避免的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + avoid (避免) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图"避免(avoid)"一场"不可避免(unavoidable)"的
    <tspan x="50" dy="25">暴风雨，但无论他怎么跑，乌云总是紧随其后。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unavoidable storm forced us to cancel the picnic.
  </text>
  <text x="50" y="310" class="content">
    不可避免的暴风雨迫使我们取消了野餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person running -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Clouds -->
    <ellipse cx="200" cy="50" rx="100" ry="30" class="image" />
    <ellipse cx="250" cy="70" rx="80" ry="25" class="image" />
    <ellipse cx="150" cy="70" rx="80" ry="25" class="image" />
    <!-- Rain -->
    <line x1="180" y1="100" x2="180" y2="120" class="image" />
    <line x1="220" y1="100" x2="220" y2="120" class="image" />
    <line x1="260" y1="100" x2="260" y2="120" class="image" />
    <line x1="160" y1="100" x2="160" y2="120" class="image" />
    <line x1="200" y1="100" x2="200" y2="120" class="image" />
    <line x1="240" y1="100" x2="240" y2="120" class="image" />
  </g>
</svg>