<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impinge</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpɪndʒ] v. 撞击，影响</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + ping (撞击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的陨石"撞击(ping)"地球，"进入(im-)"大气层，
    <tspan x="50" dy="25">产生巨大的影响(impinge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy will impinge on our daily lives.
  </text>
  <text x="50" y="310" class="content">
    新政策将影响我们的日常生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meteor -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="50" x2="200" y2="200" class="image" />
    <!-- Earth -->
    <circle cx="200" cy="200" r="50" class="image" />
    <!-- Impact -->
    <circle cx="200" cy="200" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>