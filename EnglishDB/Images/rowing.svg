<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rowing</text>
  <text x="50" y="120" class="subtitle">[ˈroʊɪŋ] n. 划船，划艇运动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> row (划) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在湖上划船，"划(row)"
    <tspan x="50" dy="25">的动作不断重复，这就是划船运动(rowing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They enjoyed a peaceful afternoon of rowing on the lake.
  </text>
  <text x="50" y="310" class="content">
    他们在湖上享受了一个宁静的下午划船。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boat -->
    <rect x="150" y="50" width="100" height="30" class="image" />
    <!-- Rowers -->
    <line x1="160" y1="50" x2="160" y2="20" class="image" />
    <line x1="170" y1="50" x2="170" y2="20" class="image" />
    <line x1="180" y1="50" x2="180" y2="20" class="image" />
    <line x1="190" y1="50" x2="190" y2="20" class="image" />
    <line x1="200" y1="50" x2="200" y2="20" class="image" />
    <line x1="210" y1="50" x2="210" y2="20" class="image" />
    <line x1="220" y1="50" x2="220" y2="20" class="image" />
    <line x1="230" y1="50" x2="230" y2="20" class="image" />
    <!-- Oars -->
    <line x1="150" y1="50" x2="100" y2="100" class="image" />
    <line x1="250" y1="50" x2="300" y2="100" class="image" />
  </g>
</svg>