<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">centralized</text>
  <text x="50" y="120" class="subtitle">[ˈsɛntrəˌlaɪzd] adj. 集中的，中央集权的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> centr (中心) + al (形容词后缀) + ize (使动) + d (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的中心点，所有的线都"集中(centralize)"
    <tspan x="50" dy="25">到这个点上，形成了一个集中的系统(centralized)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to centralize its IT operations.
  </text>
  <text x="50" y="310" class="content">
    公司决定将其IT运营集中化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Central point -->
    <circle cx="175" cy="100" r="20" class="image" fill="#E74C3C" />
    <!-- Lines converging to the center -->
    <line x1="0" y1="100" x2="155" y2="100" class="image" />
    <line x1="350" y1="100" x2="195" y2="100" class="image" />
    <line x1="175" y1="0" x2="175" y2="80" class="image" />
    <line x1="175" y1="200" x2="175" y2="120" class="image" />
    <!-- Label for the central point -->
    <text x="165" y="90" class="content" fill="#FFFFFF">中心</text>
  </g>
</svg>