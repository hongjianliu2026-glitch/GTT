<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glut</text>
  <text x="50" y="120" class="subtitle">[ɡlʌt] v. 使吃饱，使满足；n. 过量，供过于求</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glut (来自古英语 glutton，意为“贪吃”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的盘子，上面堆满了食物，"贪吃(glut)"
    <tspan x="50" dy="25">到溢出，象征着过量的食物和满足感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The market is glutted with cheap imports.
  </text>
  <text x="50" y="310" class="content">
    市场上充斥着廉价的进口商品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="120" r="40" class="image" />
    <circle cx="200" cy="140" r="30" class="image" />
    <circle cx="250" cy="160" r="20" class="image" />
    <circle cx="300" cy="180" r="10" class="image" />
    <!-- Overflowing food -->
    <line x1="350" y1="100" x2="400" y2="50" class="image" />
    <line x1="350" y1="120" x2="400" y2="70" class="image" />
    <line x1="350" y1="140" x2="400" y2="90" class="image" />
    <line x1="350" y1="160" x2="400" y2="110" class="image" />
    <line x1="350" y1="180" x2="400" y2="130" class="image" />
  </g>
</svg>