<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nightly</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪtli] adj. 每夜的，夜间的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> night (夜晚) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜猫子，每晚(nightly)都在月光下
    <tspan x="50" dy="25">进行神秘的仪式，这就是"每夜的(nightly)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She takes a nightly walk to clear her mind.
  </text>
  <text x="50" y="310" class="content">
    她每晚散步以清空思绪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Night sky -->
    <rect x="0" y="0" width="300" height="200" class="image" fill="#1E90FF" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" fill="#FFFFFF" />
    <circle cx="250" cy="50" r="5" class="image" fill="#FFFFFF" />
    <circle cx="150" cy="150" r="5" class="image" fill="#FFFFFF" />
    <!-- Person -->
    <circle cx="200" cy="150" r="15" class="image" fill="#8B4513" />
    <line x1="200" y1="165" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="180" x2="230" y2="170" class="image" />
  </g>
</svg>