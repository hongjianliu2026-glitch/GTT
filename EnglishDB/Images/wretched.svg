<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wretched</text>
  <text x="50" y="120" class="subtitle">[ˈrɛtʃɪd] adj. 可怜的，悲惨的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wretch (可怜的人) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"可怜的人(wretch)"，
    <tspan x="50" dy="25">他衣衫褴褛，面容憔悴，</tspan>
    <tspan x="50" dy="25">这就是"悲惨的(wretched)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wretched man had no food or shelter.
  </text>
  <text x="50" y="310" class="content">
    这个可怜的人没有食物也没有住所。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Torn clothes -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="40" x2="100" y2="40" class="image" />
    <line x1="50" y1="60" x2="100" y2="60" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <!-- Wretched face -->
    <circle cx="75" cy="100" r="20" class="image" />
    <line x1="65" y1="95" x2="85" y2="95" class="image" />
    <line x1="70" y1="105" x2="75" y2="100" class="image" />
    <line x1="80" y1="105" x2="75" y2="100" class="image" />
    <!-- Wretched body -->
    <line x1="75" y1="120" x2="75" y2="160" class="image" />
    <line x1="75" y1="160" x2="50" y2="200" class="image" />
    <line x1="75" y1="160" x2="100" y2="200" class="image" />
    <line x1="75" y1="140" x2="120" y2="130" class="image" />
  </g>
</svg>