<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decisively</text>
  <text x="50" y="120" class="subtitle">[dɪˈsaɪsɪvli] adv. 果断地，决定性地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + cide (切) + -ive (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个将军在战场上，"果断地(decisively)"
    <tspan x="50" dy="25">挥刀(cide)斩断(de-)敌人的防线，取得决定性胜利。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She acted decisively to resolve the crisis.
  </text>
  <text x="50" y="310" class="content">
    她果断地采取行动解决了危机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- General -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Sword -->
    <line x1="20" y1="115" x2="70" y2="50" class="image" />
    <line x1="70" y1="50" x2="80" y2="60" class="image" />
    <line x1="80" y1="60" x2="90" y2="50" class="image" />
    <!-- Enemy line -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="110" x2="200" y2="110" class="image" />
    <line x1="100" y1="120" x2="200" y2="120" class="image" />
    <!-- Cut line -->
    <line x1="150" y1="90" x2="150" y2="130" class="image" stroke-dasharray="5,5" />
  </g>
</svg>