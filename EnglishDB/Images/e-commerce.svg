<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">e-commerce</text>
  <text x="50" y="120" class="subtitle">[ˈiːˌkɒmərs] n. 电子商务</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (电子) + commerce (商业)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的电子屏幕上，"电子(e-)"
    <tspan x="50" dy="25">交易正在进行，人们通过网络购买商品，这就是电子商务(e-commerce)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company expanded its business into e-commerce.
  </text>
  <text x="50" y="310" class="content">
    该公司将其业务扩展到了电子商务领域。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Electronic screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Shopping cart -->
    <circle cx="50" cy="100" r="20" class="image" />
    <rect x="70" y="80" width="100" height="40" class="image" />
    <line x1="170" y1="100" x2="200" y2="100" class="image" />
    <line x1="185" y1="80" x2="185" y2="120" class="image" />
    <!-- Products -->
    <rect x="220" y="80" width="50" height="50" class="image" />
    <rect x="280" y="80" width="50" height="50" class="image" />
    <rect x="220" y="140" width="50" height="50" class="image" />
    <rect x="280" y="140" width="50" height="50" class="image" />
  </g>
</svg>