<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flavor</text>
  <text x="50" y="120" class="subtitle">[ˈfleɪvər] n. 味道，风味；v. 给...调味</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flav (黄) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"用黄色(flav)"
    <tspan x="50" dy="25">的香料给食物增添风味(flavor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This dish has a unique flavor that everyone loves.
  </text>
  <text x="50" y="310" class="content">
    这道菜有一种独特的风味，大家都喜欢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Kitchen -->
    <rect x="50" y="20" width="300" height="200" class="image" />
    <!-- Spices -->
    <rect x="70" y="50" width="30" height="30" class="image" fill="#FFD700" />
    <rect x="110" y="50" width="30" height="30" class="image" fill="#FFD700" />
    <rect x="150" y="50" width="30" height="30" class="image" fill="#FFD700" />
    <!-- Food -->
    <rect x="200" y="50" width="100" height="100" class="image" fill="#FFA07A" />
  </g>
</svg>