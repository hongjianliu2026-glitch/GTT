<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consciously</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnʃəsli] adv. 有意识地，自觉地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + sci (知道) + -ous (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考，"共同知道(con-sci)"
    <tspan x="50" dy="25">并自觉地(consciously)做出决定，就像在脑海中点亮了一盏灯。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She consciously chose to study harder this semester.
  </text>
  <text x="50" y="310" class="content">
    她这学期自觉地选择了更加努力学习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Light bulb -->
    <circle cx="250" cy="100" r="50" class="image" />
    <line x1="250" y1="150" x2="250" y2="250" class="image" />
    <line x1="220" y1="220" x2="280" y2="220" class="image" />
    <line x1="235" y1="200" x2="265" y2="200" class="image" />
    <!-- Connection -->
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
  </g>
</svg>