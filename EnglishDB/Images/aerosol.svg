<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aerosol</text>
  <text x="50" y="120" class="subtitle">[ˈɛrəˌsɒl] n. 气溶胶，喷雾剂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aero- (空气) + sol (溶液)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个喷雾罐，"空气中的溶液(aero-sol)"
    <tspan x="50" dy="25">喷洒出来，形成细小的颗粒悬浮在空中，这就是气溶胶(aerosol)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor prescribed an aerosol inhaler for his asthma.
  </text>
  <text x="50" y="310" class="content">
    医生为他开了治疗哮喘的气溶胶吸入器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spray can -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <!-- Spray particles -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="120" cy="70" r="8" class="image" />
    <circle cx="140" cy="90" r="6" class="image" />
    <circle cx="160" cy="110" r="4" class="image" />
    <circle cx="180" cy="130" r="2" class="image" />
  </g>
</svg>