<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blocked</text>
  <text x="50" y="120" class="subtitle">[blɒkt] adj. 被阻挡的，受阻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> block (块) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条路被一块巨大的"块(block)"堵住了，
    <tspan x="50" dy="25">车辆无法通过，这就是"被阻挡的(blocked)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The road was blocked by a fallen tree.
  </text>
  <text x="50" y="310" class="content">
    道路被一棵倒下的树堵住了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Block -->
    <rect x="150" y="20" width="50" height="60" class="image" fill="#7F8C8D" />
    <!-- Car -->
    <rect x="50" y="50" width="30" height="20" class="image" />
    <rect x="60" y="40" width="10" height="10" class="image" />
    <rect x="80" y="50" width="30" height="20" class="image" />
    <rect x="90" y="40" width="10" height="10" class="image" />
  </g>
</svg>