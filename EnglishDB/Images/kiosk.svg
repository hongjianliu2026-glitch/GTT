<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kiosk</text>
  <text x="50" y="120" class="subtitle">[ˈkiːɒsk] n. 亭子，售货亭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kios (希腊语，意为“保护”) + -k (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小亭子(kiosk)，它像一个守护者(kios)，
    <tspan x="50" dy="25">保护着里面的商品，等待顾客的光临。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kiosk at the park sells ice cream and snacks.
  </text>
  <text x="50" y="310" class="content">
    公园里的售货亭出售冰淇淋和小吃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Kiosk structure -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <!-- Roof -->
    <polygon points="0,0 200,0 180,20 20,20" class="image" />
    <!-- Window -->
    <rect x="40" y="40" width="120" height="70" class="image" />
    <!-- Door -->
    <rect x="80" y="100" width="40" height="30" class="image" />
    <!-- Items inside -->
    <circle cx="60" cy="60" r="10" class="image" />
    <circle cx="100" cy="60" r="10" class="image" />
    <circle cx="140" cy="60" r="10" class="image" />
  </g>
</svg>