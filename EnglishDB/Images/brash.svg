  <!-- Title -->
  <text x="50" y="80" class="title">brash</text>
  <text x="50" y="120" class="subtitle">[bræʃ] adj. 鲁莽的，轻率的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> br- (打破) + ash (灰烬)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个鲁莽的人，"打破(br-)"
    <tspan x="50" dy="25">一切规则，留下一片"灰烬(ash)"，这就是brash。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His brash behavior offended many people.
  </text>
  <text x="50" y="310" class="content">
    他鲁莽的行为冒犯了许多人的。
  </text>

