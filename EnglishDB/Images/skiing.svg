<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skiing</text>
  <text x="50" y="120" class="subtitle">[ˈskiːɪŋ] n. 滑雪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ski (滑雪板) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着滑雪板，在雪山上"滑行(ski-ing)"，
    <tspan x="50" dy="25">速度快得像飞一样，雪花四溅，画面壮观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves skiing in the Alps during winter.
  </text>
  <text x="50" y="310" class="content">
    她喜欢冬天在阿尔卑斯山滑雪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowy mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Skier -->
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="190" class="image" />
    <line x1="150" y1="190" x2="130" y2="200" class="image" />
    <line x1="150" y1="190" x2="170" y2="200" class="image" />
    <!-- Skis -->
    <line x1="130" y1="200" x2="110" y2="190" class="image" />
    <line x1="170" y1="200" x2="190" y2="190" class="image" />
    <!-- Snowflakes -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="250" cy="50" r="5" class="image" />
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="200" cy="100" r="5" class="image" />
  </g>
</svg>