<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reward</text>
  <text x="50" y="120" class="subtitle">[rɪˈwɔːrd] n. 奖励，报酬；v. 奖励，报答</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + ward (守护)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个守护者(ward)在完成任务后，"回报(re-ward)"
    <tspan x="50" dy="25">得到了一份丰厚的奖励(reward)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received a reward for her hard work.
  </text>
  <text x="50" y="310" class="content">
    她因辛勤工作而获得了奖励。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <line x1="75" y1="0" x2="75" y2="200" class="image" />
    <line x1="0" y1="100" x2="150" y2="100" class="image" />
    <!-- Reward -->
    <circle cx="250" cy="100" r="50" class="image" />
    <line x1="250" y1="150" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="200" y2="250" class="image" />
    <line x1="250" y1="200" x2="300" y2="250" class="image" />
    <line x1="250" y1="170" x2="200" y2="160" class="image" />
    <line x1="250" y1="170" x2="300" y2="160" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,80 220,100 200,120" class="image" />
  </g>
</svg>