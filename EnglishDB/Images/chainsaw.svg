<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chainsaw</text>
  <text x="50" y="120" class="subtitle">[ˈtʃeɪnˌsɔː] n. 链锯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chain (链条) + saw (锯)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的链条(chain)上装满了锋利的锯齿(saw)，
    <tspan x="50" dy="25">这个链条锯(chainsaw)可以轻松地切割任何坚硬的物体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lumberjack used a chainsaw to cut down the tree.
  </text>
  <text x="50" y="310" class="content">
    伐木工人用链锯砍倒了那棵树。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chain -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Saw teeth -->
    <polygon points="50,0 70,20 50,40 30,20" class="image" />
    <polygon points="100,0 120,20 100,40 80,20" class="image" />
    <polygon points="150,0 170,20 150,40 130,20" class="image" />
    <polygon points="200,0 220,20 200,40 180,20" class="image" />
    <polygon points="250,0 270,20 250,40 230,20" class="image" />
    <polygon points="300,0 320,20 300,40 280,20" class="image" />
  </g>
</svg>