<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">malignancy</text>
  <text x="50" y="120" class="subtitle">[məˈlɪɡnənsi] n. 恶性，恶意</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mal- (坏) + ign (火) + -ancy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一团"坏火(mal-ign)"在心中燃烧，
    <tspan x="50" dy="25">这种"恶意(malignancy)"如同癌细胞般扩散。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor confirmed the malignancy of the tumor.
  </text>
  <text x="50" y="310" class="content">
    医生确认了肿瘤的恶性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bad fire -->
    <circle cx="50" cy="100" r="30" class="image" fill="#E74C3C" />
    <line x1="50" y1="70" x2="50" y2="130" class="image" stroke-width="5" />
    <line x1="30" y1="90" x2="70" y2="110" class="image" stroke-width="5" />
    <line x1="30" y1="110" x2="70" y2="90" class="image" stroke-width="5" />
    <!-- Heart -->
    <path d="M150,100 C150,50 250,50 250,100 C250,150 150,150 150,100 Z" class="image" fill="#F1C40F" />
    <!-- Cancer cell -->
    <circle cx="350" cy="100" r="20" class="image" fill="#8E44AD" />
    <line x1="350" y1="80" x2="350" y2="120" class="image" stroke-width="3" />
    <line x1="330" y1="100" x2="370" y2="100" class="image" stroke-width="3" />
    <line x1="340" y1="90" x2="360" y2="110" class="image" stroke-width="3" />
    <line x1="340" y1="110" x2="360" y2="90" class="image" stroke-width="3" />
  </g>
</svg>