<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trucking</text>
  <text x="50" y="120" class="subtitle">[ˈtrʌkɪŋ] n. 卡车运输</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> truck (卡车) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆巨大的卡车在公路上"轰隆隆地运输(trucking)"
    <tspan x="50" dy="25">货物，车轮滚滚，尘土飞扬，场面壮观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company specializes in long-haul trucking.
  </text>
  <text x="50" y="310" class="content">
    这家公司专门从事长途卡车运输。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Truck -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Wheels -->
    <circle cx="80" cy="140" r="20" class="image" />
    <circle cx="220" cy="140" r="20" class="image" />
    <!-- Cargo -->
    <rect x="50" y="20" width="250" height="60" class="image" />
    <!-- Dust -->
    <line x1="300" y1="150" x2="350" y2="150" class="image" />
    <line x1="300" y1="160" x2="350" y2="160" class="image" />
    <line x1="300" y1="170" x2="350" y2="170" class="image" />
  </g>
</svg>