<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eventual</text>
  <text x="50" y="120" class="subtitle">[ɪˈvɛntʃuəl] adj. 最终的，最后的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + vent (来) + -ual (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在漫长的旅程中，"最终走出(e-vent-ual)"
    <tspan x="50" dy="25">迷雾，到达了目的地，这就是最终的(eventual)结果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The eventual winner of the race was a surprise to everyone.
  </text>
  <text x="50" y="310" class="content">
    比赛的最终获胜者让所有人都感到意外。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path representing the journey -->
    <path d="M 0 100 Q 100 50 200 100 T 400 100" class="image" />
    <!-- Person reaching the destination -->
    <circle cx="400" cy="100" r="15" class="image" />
    <line x1="400" y1="115" x2="400" y2="150" class="image" />
    <line x1="400" y1="150" x2="380" y2="180" class="image" />
    <line x1="400" y1="150" x2="420" y2="180" class="image" />
    <line x1="400" y1="130" x2="450" y2="120" class="image" />
    <!-- Destination flag -->
    <line x1="450" y1="120" x2="450" y2="80" class="image" />
    <polygon points="450,80 440,100 460,100" class="image" />
  </g>
</svg>