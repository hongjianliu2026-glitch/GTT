<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wink</text>
  <text x="50" y="120" class="subtitle">[wɪŋk] v. 眨眼，使眼色；n. 眨眼，瞬间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> win (弯曲) + -k (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在眨眼，眼皮"弯曲(win)"然后快速"动作(-k)"，
    <tspan x="50" dy="25">这就是眨眼(wink)的动作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She winked at him to signal her agreement.
  </text>
  <text x="50" y="310" class="content">
    她向他眨眼以示同意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Eye -->
    <ellipse cx="150" cy="100" rx="80" ry="50" class="image" />
    <!-- Pupil -->
    <circle cx="150" cy="100" r="20" fill="#2C3E50" />
    <!-- Eyelid -->
    <line x1="70" y1="50" x2="230" y2="50" class="image" />
    <line x1="70" y1="55" x2="230" y2="55" class="image" />
    <line x1="70" y1="60" x2="230" y2="60" class="image" />
    <line x1="70" y1="65" x2="230" y2="65" class="image" />
    <line x1="70" y1="70" x2="230" y2="70" class="image" />
    <line x1="70" y1="75" x2="230" y2="75" class="image" />
    <line x1="70" y1="80" x2="230" y2="80" class="image" />
    <line x1="70" y1="85" x2="230" y2="85" class="image" />
    <line x1="70" y1="90" x2="230" y2="90" class="image" />
    <line x1="70" y1="95" x2="230" y2="95" class="image" />
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <line x1="70" y1="105" x2="230" y2="105" class="image" />
    <line x1="70" y1="110" x2="230" y2="110" class="image" />
    <line x1="70" y1="115" x2="230" y2="115" class="image" />
    <line x1="70" y1="120" x2="230" y2="120" class="image" />
    <line x1="70" y1="125" x2="230" y2="125" class="image" />
    <line x1="70" y1="130" x2="230" y2="130" class="image" />
    <line x1="70" y1="135" x2="230" y2="135" class="image" />
    <line x1="70" y1="140" x2="230" y2="140" class="image" />
    <line x1="70" y1="145" x2="230" y2="145" class="image" />
    <line x1="70" y1="150" x2="230" y2="150" class="image" />
  </g>
</svg>