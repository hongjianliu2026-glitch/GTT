<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">progress</text>
  <text x="50" y="120" class="subtitle">[ˈproʊɡrɛs] n. 进步，进展；v. 前进，发展</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + gress (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在一条道路上不断"向前走(pro-gress)"，
    <tspan x="50" dy="25">每一步都代表着进步(progress)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project is making good progress.
  </text>
  <text x="50" y="310" class="content">
    这个项目正在取得良好的进展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <!-- Person walking -->
    <circle cx="50" cy="110" r="15" class="image" />
    <line x1="50" y1="125" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Steps -->
    <line x1="100" y1="110" x2="100" y2="140" class="image" />
    <line x1="150" y1="110" x2="150" y2="140" class="image" />
    <line x1="200" y1="110" x2="200" y2="140" class="image" />
    <line x1="250" y1="110" x2="250" y2="140" class="image" />
    <line x1="300" y1="110" x2="300" y2="140" class="image" />
  </g>
</svg>