<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marked</text>
  <text x="50" y="120" class="subtitle">[mɑːrkt] adj. 有记号的，显著的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mark (标记) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫在墙上留下"标记(mark)"，
    <tspan x="50" dy="25">这个标记非常"显著(marked)"，让人一眼就能看到。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The marked difference between the two products surprised everyone.
  </text>
  <text x="50" y="310" class="content">
    两种产品之间的显著差异让每个人都感到惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Mark -->
    <line x1="100" y1="50" x2="200" y2="50" class="image" />
    <line x1="100" y1="80" x2="200" y2="80" class="image" />
    <line x1="100" y1="110" x2="200" y2="110" class="image" />
    <line x1="100" y1="140" x2="200" y2="140" class="image" />
    <line x1="100" y1="170" x2="200" y2="170" class="image" />
  </g>
</svg>