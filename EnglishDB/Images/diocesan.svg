<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diocesan</text>
  <text x="50" y="120" class="subtitle">[daɪˈɒsɪs(ə)n] adj. 主教的，主教辖区的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dio- (两个) + cese (离开) + -an (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个主教站在两个教堂之间，"离开(cese)"
    <tspan x="50" dy="25">一个教堂，前往另一个教堂，这就是主教的辖区(diocesan)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The diocesan bishop visited our church last Sunday.
  </text>
  <text x="50" y="310" class="content">
    主教上周日访问了我们的教堂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two churches -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="200" y="0" width="100" height="150" class="image" />
    <!-- Bishop -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="210" class="image" />
    <line x1="150" y1="180" x2="170" y2="210" class="image" />
    <line x1="150" y1="150" x2="120" y2="140" class="image" />
    <line x1="150" y1="150" x2="180" y2="140" class="image" />
  </g>
</svg>