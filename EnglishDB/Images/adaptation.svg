<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adaptation</text>
  <text x="50" y="120" class="subtitle">[ˌædæpˈteɪʃn] n. 适应，改编</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + apt (适合) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小动物在森林中，"朝向(ad-)"
    <tspan x="50" dy="25">适应(apt)"环境的变化，最终成功生存下来，这就是适应(adaptation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The adaptation of the novel to the screen was a great success.
  </text>
  <text x="50" y="310" class="content">
    这部小说改编成电影非常成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tree -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="40" y1="50" x2="60" y2="50" class="image" />
    <line x1="30" y1="80" x2="70" y2="80" class="image" />
    <line x1="20" y1="110" x2="80" y2="110" class="image" />
    <!-- Animal -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Adaptation symbol -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="140" class="image" />
    <line x1="240" y1="130" x2="260" y2="130" class="image" />
  </g>
</svg>