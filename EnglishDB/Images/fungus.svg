<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fungus</text>
  <text x="50" y="120" class="subtitle">[ˈfʌŋɡəs] n. 真菌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fung (菌) + -us (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林中，"菌(fung)"
    <tspan x="50" dy="25">在树根下悄悄生长，形成了一个个真菌(fungus)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forest floor was covered with various fungi.
  </text>
  <text x="50" y="310" class="content">
    森林的地面上覆盖着各种各样的真菌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Fungus -->
    <circle cx="50" cy="150" r="20" class="image" />
    <circle cx="70" cy="130" r="15" class="image" />
    <circle cx="30" cy="170" r="18" class="image" />
    <circle cx="60" cy="180" r="12" class="image" />
    <circle cx="40" cy="120" r="10" class="image" />
  </g>
</svg>