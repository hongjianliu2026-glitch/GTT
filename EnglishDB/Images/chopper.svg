<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chopper</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɒpə(r)] n. 砍刀，直升机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chop (砍) + -er (表示工具或人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的伐木工，手持一把巨大的"砍刀(chop-er)"，
    <tspan x="50" dy="25">在森林中砍伐树木，或者想象一架直升机在空中盘旋，</tspan>
    <tspan x="50" dy="25">就像一把巨大的"砍刀"在天空中切割空气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The chopper flew over the mountains to rescue the stranded hikers.
  </text>
  <text x="50" y="330" class="content">
    直升机飞越山脉去营救被困的徒步者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Axe -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="20" x2="100" y2="50" class="image" />
    <line x1="50" y1="20" x2="0" y2="50" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <!-- Helicopter -->
    <rect x="200" y="20" width="150" height="50" class="image" />
    <line x1="275" y1="20" x2="275" y2="0" class="image" />
    <line x1="225" y1="20" x2="225" y2="0" class="image" />
    <line x1="250" y1="0" x2="250" y2="20" class="image" />
    <line x1="250" y1="20" x2="250" y2="70" class="image" />
    <line x1="250" y1="70" x2="225" y2="100" class="image" />
    <line x1="250" y1="70" x2="275" y2="100" class="image" />
  </g>
</svg>