<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">upper-class</text>
  <text x="50" y="120" class="subtitle">[ˈʌpər klɑːs] n. 上层阶级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> upper (上面的) + class (阶级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着华丽的人站在高高的楼梯顶端，象征着"上层阶级(upper-class)"，
    <tspan x="50" dy="25">他们高高在上，俯视着下面的人群。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was born into an upper-class family.
  </text>
  <text x="50" y="310" class="content">
    她出生在一个上层阶级的家庭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stairs -->
    <polyline points="0,200 50,150 100,100 150,50 200,0" class="image" />
    <!-- Person on top of the stairs -->
    <circle cx="200" cy="0" r="15" class="image" />
    <line x1="200" y1="15" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="180" y2="80" class="image" />
    <line x1="200" y1="50" x2="220" y2="80" class="image" />
    <line x1="200" y1="30" x2="230" y2="20" class="image" />
  </g>
</svg>