<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">phenomenal</text>
  <text x="50" y="120" class="subtitle">[fəˈnɒmɪnl] adj. 非凡的，显著的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> phan (出现) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"出现(phan)"在夜空中的巨大流星，
    <tspan x="50" dy="25">它的光芒照亮了整个城市，这种"非凡的(phenomenal)"景象让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The performance was phenomenal; everyone was amazed.
  </text>
  <text x="50" y="310" class="content">
    表演非常出色，每个人都感到惊叹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Meteor -->
    <line x1="50" y1="20" x2="300" y2="180" class="image" />
    <!-- City skyline -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <rect x="50" y="160" width="30" height="40" class="image" />
    <rect x="120" y="140" width="30" height="60" class="image" />
    <rect x="190" y="150" width="30" height="50" class="image" />
    <rect x="260" y="170" width="30" height="30" class="image" />
    <!-- Light from meteor -->
    <circle cx="300" cy="180" r="50" class="image" />
  </g>
</svg>