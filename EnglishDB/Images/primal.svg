<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">primal</text>
  <text x="50" y="120" class="subtitle">[ˈpraɪml] adj. 原始的，最初的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> prim (第一) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始人站在"第一(prim)"的位置，
    <tspan x="50" dy="25">他是人类历史的起点，代表着最初的、原始的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The primal instincts of survival drove them to hunt.
  </text>
  <text x="50" y="310" class="content">
    原始的生存本能驱使他们去狩猎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Primitive figure -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="160" class="image" />
    <line x1="50" y1="120" x2="70" y2="160" class="image" />
    <line x1="50" y1="90" x2="20" y2="100" class="image" />
    <line x1="50" y1="90" x2="80" y2="100" class="image" />
    <!-- Primitive environment -->
    <rect x="0" y="160" width="100" height="50" class="image" />
    <line x1="20" y1="180" x2="80" y2="180" class="image" />
    <line x1="20" y1="200" x2="80" y2="200" class="image" />
    <line x1="20" y1="220" x2="80" y2="220" class="image" />
  </g>
</svg>