<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">expedition</text>
  <text x="50" y="120" class="subtitle">[ˌɛkspəˈdɪʃən] n. 远征，探险</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + ped (脚) + -ition (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群探险家，"向外(ex-)"迈出"脚(ped)"，
    <tspan x="50" dy="25">踏上未知的旅程，这就是一次远征(expedition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They embarked on an expedition to the North Pole.
  </text>
  <text x="50" y="310" class="content">
    他们踏上了前往北极的远征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Explorer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Path -->
    <line x1="20" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="260" y2="250" class="image" />
    <!-- Mountains -->
    <polyline points="260,250 300,200 340,250" class="image" />
    <polyline points="300,200 340,150 380,200" class="image" />
    <!-- Flag -->
    <line x1="340" y1="150" x2="340" y2="100" class="image" />
    <polygon points="340,100 320,120 360,120" class="image" />
  </g>
</svg>