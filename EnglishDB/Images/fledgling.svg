<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fledgling</text>
  <text x="50" y="120" class="subtitle">[ˈfledʒəlɪŋ] n. 雏鸟，新手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fledg (羽毛) + -ling (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只刚长出羽毛的小鸟，"羽毛未丰(fledg-ling)"，
    <tspan x="50" dy="25">还在学习飞翔，就像一个新手(fledgling)在学习新技能。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> As a fledgling programmer, he faced many challenges.
  </text>
  <text x="50" y="310" class="content">
    作为一个编程新手，他面临许多挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Bird head -->
    <circle cx="150" cy="70" r="20" class="image" />
    <!-- Bird beak -->
    <polygon points="160,70 180,75 160,80" class="image" />
    <!-- Bird wings -->
    <line x1="50" y1="100" x2="0" y2="50" class="image" />
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <!-- Feathers -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="80" y1="60" x2="80" y2="20" class="image" />
    <line x1="120" y1="60" x2="120" y2="20" class="image" />
  </g>
</svg>