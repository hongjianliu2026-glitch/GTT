<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interpreter</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɜːrprɪtər] n. 解释者，口译员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在中间) + pret (表达)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个口译员站在两个人中间，"在中间表达(inter-pret)"
    <tspan x="50" dy="25">他们的对话，这就是解释者(interpreter)的工作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The interpreter helped the foreign guests understand the speech.
  </text>
  <text x="50" y="310" class="content">
    口译员帮助外国客人理解了演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Interpreter -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
    <!-- People -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="190" y2="120" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="210" y2="120" class="image" />
    <!-- Speech bubbles -->
    <path d="M150,70 Q130,60 150,50 Q170,60 150,70" class="image" />
    <path d="M250,70 Q230,60 250,50 Q270,60 250,70" class="image" />
  </g>
</svg>