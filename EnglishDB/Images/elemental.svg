<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elemental</text>
  <text x="50" y="120" class="subtitle">[ˌɛləˈmɛntl] adj. 基本的，元素的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> element (元素) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个炼金术士在实验室里，"元素(element)"
    <tspan x="50" dy="25">是构成一切物质的基本单位，而"基本的(elemental)"</tspan>
    <tspan x="50" dy="25">就是指这些最基础的元素。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The elemental forces of nature are wind, water, fire, and earth.
  </text>
  <text x="50" y="310" class="content">
    自然界的基本力量是风、水、火和土。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Laboratory table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Elements -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Fire -->
    <circle cx="120" cy="50" r="20" class="image" /> <!-- Water -->
    <circle cx="190" cy="50" r="20" class="image" /> <!-- Earth -->
    <circle cx="260" cy="50" r="20" class="image" /> <!-- Air -->
    <!-- Alchemist -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>