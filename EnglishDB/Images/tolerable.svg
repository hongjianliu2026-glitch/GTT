<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tolerable</text>
  <text x="50" y="120" class="subtitle">[ˈtɒlərəbl] adj. 可忍受的，可容忍的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> toler- (忍受) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在忍受(toler-)着一只吵闹的鸟，虽然鸟叫声很烦人，但这个人还能忍受(tolerable)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The noise from the construction site was barely tolerable.
  </text>
  <text x="50" y="310" class="content">
    建筑工地的噪音几乎让人无法忍受。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />

    <!-- Bird -->
    <circle cx="200" cy="80" r="15" class="image" />
    <line x1="200" y1="95" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="100" x2="180" y2="90" class="image" />
    <line x1="200" y1="100" x2="220" y2="90" class="image" />

    <!-- Speech bubble -->
    <path d="M 200 50 Q 250 50 250 100 L 200 100 Z" class="image" />
    <text x="210" y="70" class="content">Chirp!</text>
  </g>
</svg>