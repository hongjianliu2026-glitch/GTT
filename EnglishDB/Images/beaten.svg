<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beaten</text>
  <text x="50" y="120" class="subtitle">[ˈbiːtn] adj. 被打败的，被击败的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> beat (打) + -en (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拳击手在擂台上被"打(beat)"得倒地不起，
    <tspan x="50" dy="25">他的脸上满是伤痕，这就是"被打败的(beaten)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boxer was beaten in the final round.
  </text>
  <text x="50" y="310" class="content">
    这个拳击手在最后一轮被打败了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ring -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Boxer -->
    <circle cx="120" cy="100" r="20" class="image" />
    <line x1="120" y1="120" x2="120" y2="160" class="image" />
    <line x1="120" y1="160" x2="100" y2="190" class="image" />
    <line x1="120" y1="160" x2="140" y2="190" class="image" />
    <line x1="120" y1="140" x2="80" y2="130" class="image" />
    <!-- Bruises -->
    <circle cx="110" cy="90" r="5" class="image" fill="#E74C3C" />
    <circle cx="130" cy="95" r="5" class="image" fill="#E74C3C" />
    <circle cx="120" cy="110" r="5" class="image" fill="#E74C3C" />
  </g>
</svg>