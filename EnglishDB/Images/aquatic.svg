<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .fish { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aquatic</text>
  <text x="50" y="120" class="subtitle">[əˈkwætɪk] adj. 水生的，水中的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aqua (水) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的"水(aqua)"域，里面充满了各种"水生(aquatic)"生物，
    <tspan x="50" dy="25">比如鱼、水草等，它们都在水中自由自在地生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lake is home to many aquatic plants and animals.
  </text>
  <text x="50" y="310" class="content">
    这个湖是许多水生植物和动物的家园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- Fish -->
    <circle cx="100" cy="100" r="20" class="fish" />
    <line x1="100" y1="80" x2="120" y2="100" class="image" />
    <line x1="100" y1="120" x2="120" y2="100" class="image" />
    <!-- Water plants -->
    <line x1="200" y1="200" x2="200" y2="150" class="image" />
    <line x1="220" y1="200" x2="220" y2="160" class="image" />
    <line x1="240" y1="200" x2="240" y2="170" class="image" />
  </g>
</svg>