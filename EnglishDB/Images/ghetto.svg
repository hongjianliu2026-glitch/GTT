<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ghetto</text>
  <text x="50" y="120" class="subtitle">[ˈɡɛtoʊ] n. 贫民区，犹太人区</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自意大利语 "borghetto" (小村庄)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拥挤的小村庄，"小村庄(borghetto)"
    <tspan x="50" dy="25">变成了一个贫民区(ghetto)，人们在这里生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many artists come from the ghetto.
  </text>
  <text x="50" y="310" class="content">
    许多艺术家来自贫民区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- People -->
    <circle cx="75" cy="60" r="10" class="image" />
    <circle cx="145" cy="60" r="10" class="image" />
    <circle cx="215" cy="60" r="10" class="image" />
    <circle cx="285" cy="60" r="10" class="image" />
    <!-- Roads -->
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
  </g>
</svg>