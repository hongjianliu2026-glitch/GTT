<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">erection</text>
  <text x="50" y="120" class="subtitle">[ɪˈrekʃən] n. 建立，竖立；建筑物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + rect (直) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的建筑工人，"用力拉直(e-rect)"
    <tspan x="50" dy="25">一根巨大的柱子，柱子直立起来，形成了一个建筑物(erection)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The erection of the new bridge took several months.
  </text>
  <text x="50" y="310" class="content">
    新桥的建造花了好几个月。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Construction worker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Column -->
    <rect x="70" y="20" width="20" height="160" class="image" />
    <!-- Building -->
    <rect x="100" y="20" width="150" height="160" class="image" />
    <line x1="120" y1="40" x2="230" y2="40" class="image" />
    <line x1="120" y1="70" x2="230" y2="70" class="image" />
    <line x1="120" y1="100" x2="230" y2="100" class="image" />
    <line x1="120" y1="130" x2="230" y2="130" class="image" />
  </g>
</svg>