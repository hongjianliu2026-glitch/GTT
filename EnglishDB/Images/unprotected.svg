<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unprotected</text>
  <text x="50" y="120" class="subtitle">[ˌʌnprəˈtektɪd] adj. 无保护的，未受保护的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + protect (保护)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个脆弱的小动物，"没有(un-)"
    <tspan x="50" dy="25">任何保护(protect)，暴露在危险中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unprotected area was vulnerable to attacks.
  </text>
  <text x="50" y="310" class="content">
    这个未受保护的区域容易受到攻击。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Unprotected animal -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <line x1="100" y1="150" x2="50" y2="140" class="image" />
    <!-- Danger symbol -->
    <polygon points="200,100 220,140 260,140 230,170 240,210 200,190 160,210 170,170 140,140 180,140" class="image" />
    <line x1="200" y1="100" x2="200" y2="210" class="image" />
  </g>
</svg>