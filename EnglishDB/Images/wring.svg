<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wring</text>
  <text x="50" y="120" class="subtitle">[rɪŋ] v. 拧，扭，榨取</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wr- (扭曲) + ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用力"扭曲(wr-ing)"一块湿布，
    <tspan x="50" dy="25">试图榨取(wring)出所有的水分。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wrung the water out of the towel.
  </text>
  <text x="50" y="310" class="content">
    她把毛巾里的水拧了出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloth -->
    <rect x="50" y="20" width="200" height="100" class="image" />
    <!-- Hands wringing the cloth -->
    <line x1="70" y1="40" x2="180" y2="40" class="image" />
    <line x1="70" y1="60" x2="180" y2="60" class="image" />
    <line x1="70" y1="80" x2="180" y2="80" class="image" />
    <line x1="70" y1="100" x2="180" y2="100" class="image" />
    <!-- Drops of water -->
    <circle cx="100" cy="120" r="10" class="image" />
    <circle cx="120" cy="120" r="10" class="image" />
    <circle cx="140" cy="120" r="10" class="image" />
    <circle cx="160" cy="120" r="10" class="image" />
  </g>
</svg>