<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .smell { fill: #873600; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stench</text>
  <text x="50" y="120" class="subtitle">[stɛntʃ] n. 恶臭，臭气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stink (臭) + -ch (加强语气)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个腐烂的垃圾堆，"臭气(stink)"
    <tspan x="50" dy="25">冲天，让人无法忍受，这就是恶臭(stench)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stench from the garbage dump was unbearable.
  </text>
  <text x="50" y="310" class="content">
    垃圾堆的恶臭让人无法忍受。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garbage dump -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rotten food -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="120" cy="100" r="30" class="image" />
    <circle cx="190" cy="100" r="30" class="image" />
    <!-- Smell lines -->
    <line x1="50" y1="70" x2="30" y2="30" class="image smell" />
    <line x1="120" y1="70" x2="100" y2="30" class="image smell" />
    <line x1="190" y1="70" x2="170" y2="30" class="image smell" />
    <line x1="50" y1="70" x2="70" y2="30" class="image smell" />
    <line x1="120" y1="70" x2="140" y2="30" class="image smell" />
    <line x1="190" y1="70" x2="210" y2="30" class="image smell" />
  </g>
</svg>