<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reflector</text>
  <text x="50" y="120" class="subtitle">[rɪˈflektər] n. 反射器，反射镜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + fleet (弯曲) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的镜子，"弯曲回(re-fleet)"
    <tspan x="50" dy="25">射光线，这个镜子就是一个反射器(reflector)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The reflector on the bicycle helped him see in the dark.
  </text>
  <text x="50" y="310" class="content">
    自行车上的反射器帮助他在黑暗中看清道路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Light rays -->
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <line x1="175" y1="20" x2="175" y2="40" class="image" />
    <line x1="175" y1="20" x2="175" y2="60" class="image" />
    <line x1="175" y1="20" x2="175" y2="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="120" class="image" />
    <line x1="175" y1="20" x2="175" y2="140" class="image" />
    <line x1="175" y1="20" x2="175" y2="160" class="image" />
    <!-- Reflection -->
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
    <line x1="175" y1="180" x2="175" y2="220" class="image" />
    <line x1="175" y1="180" x2="175" y2="240" class="image" />
    <line x1="175" y1="180" x2="175" y2="260" class="image" />
    <line x1="175" y1="180" x2="175" y2="280" class="image" />
    <line x1="175" y1="180" x2="175" y2="300" class="image" />
    <line x1="175" y1="180" x2="175" y2="320" class="image" />
    <line x1="175" y1="180" x2="175" y2="340" class="image" />
  </g>
</svg>