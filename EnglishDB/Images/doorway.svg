<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">doorway</text>
  <text x="50" y="120" class="subtitle">[ˈdɔːrweɪ] n. 门口，入口</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> door (门) + way (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门，门上写着"入口(doorway)"，
    <tspan x="50" dy="25">门后是一条通往未知世界的道路。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stood in the doorway, hesitating to enter.
  </text>
  <text x="50" y="310" class="content">
    她站在门口，犹豫是否要进去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Door frame -->
    <rect x="0" y="0" width="300" height="400" class="image" />
    <!-- Door -->
    <rect x="50" y="50" width="200" height="300" class="image" />
    <!-- Door handle -->
    <circle cx="230" cy="200" r="10" class="image" />
    <!-- Pathway -->
    <line x1="150" y1="400" x2="150" y2="500" class="image" />
    <line x1="100" y1="450" x2="200" y2="450" class="image" />
  </g>
</svg>