<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5EFE6; }
      .title { font: bold 48px sans-serif; fill: #344E41; }
      .subtitle { font: italic 24px serif; fill: #588157; }
      .content { font: 18px sans-serif; fill: #3A5A40; }
      .highlight { font-weight: bold; fill: #D4A373; }
      .story { font: 16px serif; fill: #A3B18A; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coal</text>
  <text x="50" y="120" class="subtitle">[koʊl] n. 煤，煤炭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + al (表示物质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群小动物在地下"共同(co-)"挖掘，
    <tspan x="50" dy="25">它们挖出的黑色物质就是"煤炭(coal)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory burns coal to generate electricity.
  </text>
  <text x="50" y="310" class="content">
    工厂燃烧煤炭来发电。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coal pile -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#343434" />
    <!-- Small animals digging -->
    <circle cx="50" cy="150" r="15" class="image" fill="#A3B18A" />
    <line x1="50" y1="165" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="35" y2="195" class="image" />
    <line x1="50" y1="180" x2="65" y2="195" class="image" />
    <line x1="50" y1="170" x2="70" y2="160" class="image" />

    <circle cx="100" cy="150" r="15" class="image" fill="#A3B18A" />
    <line x1="100" y1="165" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="85" y2="195" class="image" />
    <line x1="100" y1="180" x2="115" y2="195" class="image" />
    <line x1="100" y1="170" x2="120" y2="160" class="image" />

    <circle cx="150" cy="150" r="15" class="image" fill="#A3B18A" />
    <line x1="150" y1="165" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="135" y2="195" class="image" />
    <line x1="150" y1="180" x2="165" y2="195" class="image" />
    <line x1="150" y1="170" x2="170" y2="160" class="image" />
  </g>
</svg>