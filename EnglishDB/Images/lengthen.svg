<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lengthen</text>
  <text x="50" y="120" class="subtitle">[ˈlɛŋθən] v. 延长，拉长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> length (长度) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根橡皮筋被拉长，"使(en)"
    <tspan x="50" dy="25">它的长度(length)变得更长，这就是lengthen。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to lengthen the dress by adding a lace panel.
  </text>
  <text x="50" y="310" class="content">
    她决定通过添加蕾丝边来加长裙子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rubber band -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="350" y1="50" x2="300" y2="100" class="image" />
    <!-- Hands pulling -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="350" cy="50" r="10" class="image" />
    <line x1="50" y1="50" x2="30" y2="30" class="image" />
    <line x1="350" y1="50" x2="370" y2="30" class="image" />
  </g>
</svg>