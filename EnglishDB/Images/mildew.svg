<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mildew</text>
  <text x="50" y="120" class="subtitle">[ˈmɪlduː] n. 霉，霉菌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mil (软) + dew (露水)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块潮湿的面包上，"软露水(mil-dew)"
    <tspan x="50" dy="25">形成的霉菌，这就是霉(mildew)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bread got covered in mildew after being left out for too long.
  </text>
  <text x="50" y="310" class="content">
    面包放得太久，上面长满了霉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bread -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" fill="#F4D03F" />
    <!-- Mildew spots -->
    <circle cx="100" cy="60" r="15" class="image" fill="#8E44AD" />
    <circle cx="150" cy="90" r="15" class="image" fill="#8E44AD" />
    <circle cx="200" cy="120" r="15" class="image" fill="#8E44AD" />
    <circle cx="250" cy="150" r="15" class="image" fill="#8E44AD" />
  </g>
</svg>