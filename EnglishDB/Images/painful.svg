<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">painful</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪnfl] adj. 痛苦的，疼痛的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pain (痛苦) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为严重的头痛而"充满痛苦(pain-ful)"，
    <tspan x="50" dy="25">他的表情扭曲，双手抱头，试图缓解疼痛。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The injury was so painful that he couldn't sleep.
  </text>
  <text x="50" y="310" class="content">
    这个伤痛让他疼得无法入睡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Painful expression -->
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="70" y1="80" x2="60" y2="70" class="image" />
    <line x1="130" y1="80" x2="140" y2="70" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Hands -->
    <line x1="50" y1="100" x2="70" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="100" class="image" />
    <!-- Headache -->
    <line x1="80" y1="50" x2="120" y2="50" class="image" />
    <line x1="80" y1="50" x2="70" y2="40" class="image" />
    <line x1="120" y1="50" x2="130" y2="40" class="image" />
  </g>
</svg>