<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">selfish</text>
  <text x="50" y="120" class="subtitle">[ˈsɛlɪʃ] adj. 自私的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self (自己) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人只关心自己，"自己(self)"
    <tspan x="50" dy="25">占据了所有的注意力，完全不顾他人，这就是自私(selfish)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was too selfish to share her toys with her sister.
  </text>
  <text x="50" y="310" class="content">
    她太自私了，不愿意和妹妹分享她的玩具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Selfish person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Heart symbol -->
    <path d="M100,100 C110,80 140,80 150,100 S190,140 180,160" class="image" />
    <path d="M100,100 C90,80 60,80 50,100 S10,140 20,160" class="image" />
    <!-- Selfish behavior -->
    <line x1="50" y1="220" x2="180" y2="220" class="image" />
    <line x1="180" y1="220" x2="180" y2="160" class="image" />
    <line x1="180" y1="160" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="150" y2="220" class="image" />
  </g>
</svg>