<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accessory</text>
  <text x="50" y="120" class="subtitle">[əkˈsesəri] n. 附件，配件；同谋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (朝向) + cess (走) + -ory (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时尚达人，"走向(ac-cess)"
    <tspan x="50" dy="25">她的衣橱，挑选各种配件(accessory)，</tspan>
    <tspan x="50" dy="25">如帽子、围巾和包包，来搭配她的服装。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a new handbag as an accessory for her outfit.
  </text>
  <text x="50" y="310" class="content">
    她买了一个新包包作为她服装的配饰。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wardrobe -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Accessories -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Hat -->
    <rect x="100" y="30" width="40" height="40" class="image" /> <!-- Bag -->
    <rect x="160" y="40" width="20" height="60" class="image" /> <!-- Scarf -->
    <!-- Fashionista -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>