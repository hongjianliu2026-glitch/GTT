<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cookbook</text>
  <text x="50" y="120" class="subtitle">[ˈkʊkˌbʊk] n. 食谱，烹饪书</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cook (烹饪) + book (书)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"烹饪(cook)"
    <tspan x="50" dy="25">并参考一本"书(book)"，这本书就是食谱(cookbook)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a delicious recipe in the cookbook.
  </text>
  <text x="50" y="310" class="content">
    她在食谱中找到了一道美味的菜谱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="250" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="140" x2="180" y2="140" class="image" />
    <line x1="20" y1="180" x2="180" y2="180" class="image" />
    <line x1="20" y1="220" x2="180" y2="220" class="image" />
    <!-- Chef -->
    <circle cx="250" cy="125" r="20" class="image" />
    <line x1="250" y1="145" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="230" y2="230" class="image" />
    <line x1="250" y1="200" x2="270" y2="230" class="image" />
    <line x1="250" y1="160" x2="280" y2="150" class="image" />
    <!-- Cooking pot -->
    <rect x="230" y="240" width="40" height="30" class="image" />
    <line x1="230" y1="255" x2="270" y2="255" class="image" />
  </g>
</svg>