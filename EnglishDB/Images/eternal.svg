<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eternal</text>
  <text x="50" y="120" class="subtitle">[ɪˈtɜːrnl] adj. 永恒的，永远的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eter (永恒) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，指针永远在转动，象征着"永恒(eternal)"的时间。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The love between them is eternal.
  </text>
  <text x="50" y="310" class="content">
    他们之间的爱是永恒的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Clock face -->
    <circle cx="200" cy="200" r="150" class="image" />
    <!-- Clock hands -->
    <line x1="200" y1="200" x2="200" y2="50" class="image" />
    <line x1="200" y1="200" x2="350" y2="200" class="image" />
    <!-- Eternal symbol -->
    <text x="180" y="400" class="content" style="font-size: 36px;">∞</text>
  </g>
</svg>