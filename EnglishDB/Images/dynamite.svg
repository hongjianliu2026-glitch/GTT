<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dynamite</text>
  <text x="50" y="120" class="subtitle">[ˈdaɪnəmaɪt] n. 炸药；v. 炸毁，使震惊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dynam (力量) + -ite (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的力量(dynam)被包裹在一个小盒子(dynamite)里，
    <tspan x="50" dy="25">一旦释放，就会引发巨大的爆炸，震惊所有人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of his resignation was dynamite.
  </text>
  <text x="50" y="310" class="content">
    他辞职的消息震惊了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dynamite stick -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="10" y="10" width="130" height="80" class="image" />
    <!-- Explosion -->
    <circle cx="80" cy="150" r="50" class="image" />
    <circle cx="60" cy="130" r="30" class="image" />
    <circle cx="100" cy="130" r="30" class="image" />
    <circle cx="80" cy="110" r="20" class="image" />
  </g>
</svg>