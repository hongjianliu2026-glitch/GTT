<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .checkered { fill: #FFFFFF; stroke: #000000; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">checkered</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɛkərd] adj. 有格子图案的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> check (检查) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个棋盘，上面布满了"检查(check)"过的格子，
    <tspan x="50" dy="25">这些格子就构成了有格子图案的(checkered)棋盘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a checkered dress to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件格子图案的裙子去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Checkerboard -->
    <rect x="0" y="0" width="350" height="200" class="checkered" />
    <rect x="50" y="20" width="50" height="50" class="checkered" />
    <rect x="100" y="20" width="50" height="50" class="checkered" />
    <rect x="150" y="20" width="50" height="50" class="checkered" />
    <rect x="200" y="20" width="50" height="50" class="checkered" />
    <rect x="250" y="20" width="50" height="50" class="checkered" />
    <rect x="300" y="20" width="50" height="50" class="checkered" />
    <rect x="50" y="70" width="50" height="50" class="checkered" />
    <rect x="100" y="70" width="50" height="50" class="checkered" />
    <rect x="150" y="70" width="50" height="50" class="checkered" />
    <rect x="200" y="70" width="50" height="50" class="checkered" />
    <rect x="250" y="70" width="50" height="50" class="checkered" />
    <rect x="300" y="70" width="50" height="50" class="checkered" />
    <rect x="50" y="120" width="50" height="50" class="checkered" />
    <rect x="100" y="120" width="50" height="50" class="checkered" />
    <rect x="150" y="120" width="50" height="50" class="checkered" />
    <rect x="200" y="120" width="50" height="50" class="checkered" />
    <rect x="250" y="120" width="50" height="50" class="checkered" />
    <rect x="300" y="120" width="50" height="50" class="checkered" />
  </g>
</svg>