<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">remarkable</text>
  <text x="50" y="120" class="subtitle">[rɪˈmɑːrkəbl] adj. 显著的，非凡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + mark (标记) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的标记(mark)，"再次被标记(re-mark)"
    <tspan x="50" dy="25">在某个物体上，这个物体因此变得非常显著(remarkable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her performance was remarkable; everyone was impressed.
  </text>
  <text x="50" y="310" class="content">
    她的表现非常出色，每个人都印象深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large mark -->
    <circle cx="100" cy="100" r="50" class="image" />
    <text x="80" y="110" class="highlight" style="font-size: 36px;">!</text>
    <!-- Object -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <!-- Mark on object -->
    <line x1="170" y1="70" x2="230" y2="130" class="image" />
    <line x1="230" y1="70" x2="170" y2="130" class="image" />
  </g>
</svg>