<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shortcoming</text>
  <text x="50" y="120" class="subtitle">[ˈʃɔːrtˌkʌmɪŋ] n. 缺点，短处</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> short (短) + coming (来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在努力奔跑，但他的腿"短(short)"了，
    <tspan x="50" dy="25">导致他"来(coming)"不及到达终点，这就是他的"短处(shortcoming)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> One of his major shortcoming is his lack of patience.
  </text>
  <text x="50" y="310" class="content">
    他的一大缺点是缺乏耐心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person running -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="140" class="image" /> <!-- Right arm -->
    <!-- Short legs -->
    <line x1="30" y1="200" x2="30" y2="220" class="image" /> <!-- Left short leg -->
    <line x1="70" y1="200" x2="70" y2="220" class="image" /> <!-- Right short leg -->
    <!-- Finish line -->
    <line x1="200" y1="100" x2="200" y2="200" class="image" />
    <text x="210" y="150" class="content">Finish</text>
  </g>
</svg>