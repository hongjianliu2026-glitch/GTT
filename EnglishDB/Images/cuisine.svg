<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cuisine</text>
  <text x="50" y="120" class="subtitle">[kwɪˈzin] n. 烹饪，菜肴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cuis (烹饪) + -ine (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位大厨在厨房里，"烹饪(cuis)"
    <tspan x="50" dy="25">出各种美味佳肴，这些佳肴就构成了一个菜系(cuisine)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> French cuisine is famous for its rich flavors.
  </text>
  <text x="50" y="310" class="content">
    法国菜以其丰富的口味而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef's hat -->
    <circle cx="20" cy="20" r="15" class="image" />
    <rect x="10" y="35" width="20" height="10" class="image" />
    <!-- Chef's body -->
    <line x1="20" y1="45" x2="20" y2="80" class="image" />
    <line x1="20" y1="80" x2="0" y2="110" class="image" />
    <line x1="20" y1="80" x2="40" y2="110" class="image" />
    <line x1="20" y1="60" x2="50" y2="50" class="image" />
    <!-- Cooking pot -->
    <rect x="60" y="20" width="80" height="60" class="image" />
    <line x1="70" y1="30" x2="130" y2="30" class="image" />
    <line x1="70" y1="50" x2="120" y2="50" class="image" />
    <line x1="70" y1="70" x2="110" y2="70" class="image" />
  </g>
</svg>