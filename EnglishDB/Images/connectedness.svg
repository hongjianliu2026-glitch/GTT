<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">connectedness</text>
  <text x="50" y="120" class="subtitle">[kəˈnektɪdnəs] n. 连接性，连通性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + nect (连接) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的网络，"共同连接(con-nect)"
    <tspan x="50" dy="25">在一起的节点，形成了一个紧密的连接性(connectedness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The connectedness of the internet allows people to share information instantly.
  </text>
  <text x="50" y="310" class="content">
    互联网的连接性使得人们能够即时分享信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Network nodes -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <!-- Connections -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <line x1="50" y1="50" x2="100" y2="150" class="image" />
    <line x1="150" y1="50" x2="200" y2="150" class="image" />
  </g>
</svg>