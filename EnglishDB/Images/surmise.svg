<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surmise</text>
  <text x="50" y="120" class="subtitle">[sɜːrˈmaɪz] v. 推测，猜测；n. 推测</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (在上面) + mise (发送)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高处，"从上面发送(sur-mise)"
    <tspan x="50" dy="25">信息，这些信息是他根据现有线索做出的推测(surmise)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She could only surmise what had happened from the clues.
  </text>
  <text x="50" y="310" class="content">
    她只能根据线索推测发生了什么。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person on a hill -->
    <circle cx="20" cy="20" r="15" class="image" />
    <line x1="20" y1="35" x2="20" y2="80" class="image" />
    <line x1="20" y1="80" x2="0" y2="110" class="image" />
    <line x1="20" y1="80" x2="40" y2="110" class="image" />
    <line x1="20" y1="60" x2="50" y2="50" class="image" />
    <!-- Hill -->
    <path d="M0,110 Q20,80 40,110" class="image" />
    <!-- Thought bubble -->
    <circle cx="80" cy="20" r="15" class="image" />
    <circle cx="110" cy="20" r="15" class="image" />
    <circle cx="140" cy="20" r="15" class="image" />
    <path d="M80,35 Q110,50 140,35" class="image" />
  </g>
</svg>