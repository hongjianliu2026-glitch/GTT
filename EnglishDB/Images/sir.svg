<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sir</text>
  <text x="50" y="120" class="subtitle">[sɜːr] n. 先生，阁下</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "sire"，意为"主人"或"贵族"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位穿着华丽服饰的贵族，手持权杖，
    <tspan x="50" dy="25">头戴王冠，站在高台上，人们尊敬地称他为"先生(sir)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Yes, sir, I will complete the task on time.
  </text>
  <text x="50" y="310" class="content">
    是的，先生，我会按时完成任务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <path d="M10 20 L20 0 L30 20 Z" class="image" />
    <path d="M15 25 L20 10 L25 25 Z" class="image" />
    <!-- Robe -->
    <rect x="0" y="30" width="40" height="100" class="image" />
    <!-- Scepter -->
    <line x1="20" y1="130" x2="20" y2="200" class="image" />
    <circle cx="20" cy="210" r="10" class="image" />
  </g>
</svg>