<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lightning { stroke: #F1C40F; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">electrify</text>
  <text x="50" y="120" class="subtitle">[ɪˈlɛktrɪfaɪ] v. 使充电，使电气化；使兴奋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> electr- (电) + -ify (使...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的闪电(lightning)击中了一座城市，
    <tspan x="50" dy="25">瞬间"使(ify)"整个城市"充电(electr-)"，</tspan>
    <tspan x="50" dy="25">所有的灯都亮了起来，人们兴奋不已。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concert electrified the audience.
  </text>
  <text x="50" y="310" class="content">
    这场音乐会让观众兴奋不已。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="100" width="50" height="100" class="image" />
    <rect x="120" y="80" width="50" height="120" class="image" />
    <rect x="190" y="120" width="50" height="80" class="image" />
    <rect x="260" y="90" width="50" height="110" class="image" />
    <!-- Lightning bolt -->
    <path d="M 20 20 L 180 180 L 20 180 L 180 20 Z" class="lightning" />
    <!-- Lights -->
    <circle cx="75" cy="150" r="5" fill="#F1C40F" />
    <circle cx="145" cy="130" r="5" fill="#F1C40F" />
    <circle cx="215" cy="170" r="5" fill="#F1C40F" />
    <circle cx="285" cy="140" r="5" fill="#F1C40F" />
  </g>
</svg>