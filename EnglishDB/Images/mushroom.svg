<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .mushroom { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mushroom</text>
  <text x="50" y="120" class="subtitle">[ˈmʌʃrum] n. 蘑菇；v. 迅速增长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mush (软块) + room (形状)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林里，"软块(mush)"突然"长出(room)"
    <tspan x="50" dy="25">许多蘑菇，它们迅速增长，就像雨后春笋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's profits mushroomed last year.
  </text>
  <text x="50" y="310" class="content">
    去年公司的利润迅速增长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Mushrooms -->
    <circle cx="100" cy="140" r="30" class="mushroom" />
    <circle cx="150" cy="130" r="25" class="mushroom" />
    <circle cx="200" cy="145" r="35" class="mushroom" />
    <circle cx="250" cy="135" r="20" class="mushroom" />
    <!-- Stalks -->
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <line x1="200" y1="145" x2="200" y2="180" class="image" />
    <line x1="250" y1="135" x2="250" y2="180" class="image" />
  </g>
</svg>