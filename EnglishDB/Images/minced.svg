<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">minced</text>
  <text x="50" y="120" class="subtitle">[mɪnst] v. 切碎，剁碎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> min- (小) + ce (切)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"把大块的肉切成小块(min-ce)"，
    <tspan x="50" dy="25">这些小块肉就变成了切碎的肉(minced meat)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers to eat minced meat in her spaghetti.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃意大利面里的碎肉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cutting board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Knife -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <!-- Meat pieces -->
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="180" cy="70" r="10" class="image" />
    <circle cx="210" cy="90" r="10" class="image" />
    <circle cx="240" cy="110" r="10" class="image" />
    <circle cx="270" cy="130" r="10" class="image" />
    <circle cx="300" cy="150" r="10" class="image" />
  </g>
</svg>