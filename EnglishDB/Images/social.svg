<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">social</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊʃl] adj. 社会的，社交的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soci (同伴) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"同伴(soci)"
    <tspan x="50" dy="25">分享故事和笑声，这就是社交(social)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She enjoys attending social events.
  </text>
  <text x="50" y="310" class="content">
    她喜欢参加社交活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People sitting in a circle -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="100" r="50" class="image" />
    <circle cx="200" cy="100" r="50" class="image" />
    <circle cx="250" cy="100" r="50" class="image" />
    <circle cx="300" cy="100" r="50" class="image" />
    <!-- Connecting lines -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="100" y2="100" class="image" />
    <!-- Smiling faces -->
    <circle cx="100" cy="100" r="10" fill="#F1C40F" />
    <circle cx="150" cy="100" r="10" fill="#F1C40F" />
    <circle cx="200" cy="100" r="10" fill="#F1C40F" />
    <circle cx="250" cy="100" r="10" fill="#F1C40F" />
    <circle cx="300" cy="100" r="10" fill="#F1C40F" />
    <!-- Eyes -->
    <circle cx="95" cy="95" r="2" fill="#000" />
    <circle cx="155" cy="95" r="2" fill="#000" />
    <circle cx="205" cy="95" r="2" fill="#000" />
    <circle cx="255" cy="95" r="2" fill="#000" />
    <circle cx="305" cy="95" r="2" fill="#000" />
    <!-- Mouths -->
    <path d="M90 110 Q100 115 110 110" stroke="#000" stroke-width="2" fill="none" />
    <path d="M140 110 Q150 115 160 110" stroke="#000" stroke-width="2" fill="none" />
    <path d="M190 110 Q200 115 210 110" stroke="#000" stroke-width="2" fill="none" />
    <path d="M240 110 Q250 115 260 110" stroke="#000" stroke-width="2" fill="none" />
    <path d="M290 110 Q300 115 310 110" stroke="#000" stroke-width="2" fill="none" />
  </g>
</svg>