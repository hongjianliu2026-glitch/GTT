<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">merit</text>
  <text x="50" y="120" class="subtitle">[ˈmɛrɪt] n. 优点，价值；v. 值得</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meri- (奖励) + -t (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为表现出色而获得"奖励(meri-)"，
    <tspan x="50" dy="25">这个奖励就是他的"优点(merit)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His hard work certainly merits recognition.
  </text>
  <text x="50" y="310" class="content">
    他的辛勤工作确实值得认可。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trophy -->
    <polygon points="50,20 20,80 80,80" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="30" y1="150" x2="70" y2="150" class="image" />
    <!-- Person -->
    <circle cx="50" cy="180" r="15" class="image" />
    <line x1="50" y1="195" x2="50" y2="230" class="image" />
    <line x1="50" y1="230" x2="30" y2="260" class="image" />
    <line x1="50" y1="230" x2="70" y2="260" class="image" />
    <line x1="50" y1="210" x2="80" y2="200" class="image" />
  </g>
</svg>