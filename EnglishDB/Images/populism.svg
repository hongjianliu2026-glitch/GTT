<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">populism</text>
  <text x="50" y="120" class="subtitle">[ˈpɒpjʊlɪzəm] n. 民粹主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> populi (人民) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的演讲台，上面站着一个演讲者，"向人民(populi)"
    <tspan x="50" dy="25">大声疾呼，这种对人民的强烈关注就是民粹主义(populism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rise of populism has been a significant political trend in recent years.
  </text>
  <text x="50" y="310" class="content">
    民粹主义的兴起是近年来一个重要的政治趋势。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="150" y2="150" class="image" />
    <line x1="175" y1="120" x2="200" y2="150" class="image" />
    <line x1="175" y1="90" x2="220" y2="80" class="image" />
    <!-- Crowd -->
    <circle cx="50" cy="180" r="10" class="image" />
    <circle cx="100" cy="180" r="10" class="image" />
    <circle cx="150" cy="180" r="10" class="image" />
    <circle cx="200" cy="180" r="10" class="image" />
    <circle cx="250" cy="180" r="10" class="image" />
    <circle cx="300" cy="180" r="10" class="image" />
  </g>
</svg>