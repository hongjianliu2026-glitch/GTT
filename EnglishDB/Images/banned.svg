<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">banned</text>
  <text x="50" y="120" class="subtitle">[bænd] adj. 被禁止的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ban (禁止) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色"禁止"标志，上面写着"BANNED"，
    <tspan x="50" dy="25">象征着某些行为或物品被严格禁止。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Smoking is banned in public places.
  </text>
  <text x="50" y="310" class="content">
    在公共场所禁止吸烟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Red circle -->
    <circle cx="150" cy="150" r="100" fill="#E74C3C" />
    <!-- White line -->
    <line x1="50" y1="50" x2="250" y2="250" stroke="#FFFFFF" stroke-width="10" />
    <!-- Text -->
    <text x="110" y="170" font-size="48" fill="#FFFFFF" font-weight="bold">BANNED</text>
  </g>
</svg>