<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">politicization</text>
  <text x="50" y="120" class="subtitle">[ˌpɒlɪtɪsaɪˈzeɪʃən] n. 政治化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poli- (国家) + -tic (与...有关的) + -ize (使成为) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原本普通的议题被"国家化(poli-)"，
    <tspan x="50" dy="25">然后被"使成为(ize)"政治议题，最终"政治化(politicization)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The politicization of the issue led to widespread debate.
  </text>
  <text x="50" y="310" class="content">
    这个议题的政治化导致了广泛的辩论。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Political speech bubble -->
    <rect x="150" y="20" width="200" height="100" class="image" />
    <text x="160" y="70" class="content">政治议题</text>
    <!-- Arrow -->
    <line x1="100" y1="180" x2="250" y2="120" class="image" />
    <polygon points="250,120 240,110 240,130" class="image" />
  </g>
</svg>