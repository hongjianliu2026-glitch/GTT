<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">amnesty</text>
  <text x="50" y="120" class="subtitle">[ˈæmnəsti] n. 大赦，特赦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> amn- (遗忘) + -est (最高级) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个国王宣布"遗忘(amn-)"所有罪行，
    <tspan x="50" dy="25">给予所有人"最高级(est)"的宽恕，这就是大赦(amnesty)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government granted amnesty to all political prisoners.
  </text>
  <text x="50" y="310" class="content">
    政府对所有政治犯实行了大赦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <circle cx="100" cy="50" r="30" class="image" />
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <line x1="80" y1="30" x2="120" y2="30" class="image" />
    <line x1="90" y1="10" x2="110" y2="10" class="image" />
    <!-- Speech bubble -->
    <path d="M 150 50 Q 250 50 250 150 Q 250 250 150 250 Q 50 250 50 150 Q 50 50 150 50 Z" class="image" />
    <text x="160" y="120" class="content">"Amnesty"</text>
    <!-- Prisoners -->
    <rect x="300" y="20" width="50" height="100" class="image" />
    <rect x="360" y="20" width="50" height="100" class="image" />
    <rect x="420" y="20" width="50" height="100" class="image" />
    <!-- Release -->
    <line x1="300" y1="120" x2="470" y2="120" class="image" />
    <line x1="300" y1="120" x2="300" y2="140" class="image" />
    <line x1="470" y1="120" x2="470" y2="140" class="image" />
  </g>
</svg>