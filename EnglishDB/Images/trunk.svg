<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trunk</text>
  <text x="50" y="120" class="subtitle">[trʌŋk] n. 树干，躯干；行李箱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trun- (树干) + -k (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵巨大的树，树干(trun-)
    <tspan x="50" dy="25">支撑着整个树冠，就像一个巨大的行李箱(trunk)，</tspan>
    <tspan x="50" dy="25">里面装满了树叶和果实。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The elephant used its trunk to pick up the fruit.
  </text>
  <text x="50" y="310" class="content">
    大象用它的鼻子捡起了水果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree trunk -->
    <rect x="0" y="0" width="150" height="300" class="image" />
    <!-- Tree branches -->
    <line x1="75" y1="0" x2="20" y2="100" class="image" />
    <line x1="75" y1="0" x2="130" y2="100" class="image" />
    <line x1="75" y1="0" x2="50" y2="150" class="image" />
    <line x1="75" y1="0" x2="100" y2="150" class="image" />
    <!-- Leaves -->
    <circle cx="20" cy="100" r="10" class="image" />
    <circle cx="130" cy="100" r="10" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <!-- Fruit -->
    <circle cx="75" cy="250" r="20" class="image" fill="#FFD700" />
  </g>
</svg>