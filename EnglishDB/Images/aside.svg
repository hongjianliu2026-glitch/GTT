<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aside</text>
  <text x="50" y="120" class="subtitle">[əˈsaɪd] adv. 在旁边，到旁边</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (在) + side (旁边)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在舞台中央，突然"在旁边(a-side)"
    <tspan x="50" dy="25">说了一句悄悄话，这就是aside的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He whispered an aside to his friend.
  </text>
  <text x="50" y="310" class="content">
    他向朋友低声耳语了一句。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on stage -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Whisper -->
    <path d="M140,130 Q160,120 180,130" class="image" />
    <path d="M180,130 Q200,120 220,130" class="image" />
    <path d="M220,130 Q240,120 260,130" class="image" />
    <!-- Friend -->
    <circle cx="260" cy="100" r="20" class="image" />
    <line x1="260" y1="120" x2="260" y2="180" class="image" />
    <line x1="260" y1="180" x2="240" y2="210" class="image" />
    <line x1="260" y1="180" x2="280" y2="210" class="image" />
    <line x1="260" y1="140" x2="300" y2="130" class="image" />
  </g>
</svg>