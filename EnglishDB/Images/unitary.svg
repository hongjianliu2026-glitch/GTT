<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unitary</text>
  <text x="50" y="120" class="subtitle">[ˈjuːnɪtəri] adj. 单一的，整体的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (单一) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拼图，所有的碎片都完美地组合在一起，形成一个"单一的整体(uni-tary)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The unitary state was formed by combining several smaller regions.
  </text>
  <text x="50" y="310" class="content">
    这个单一的国家是由几个较小的地区合并而成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="110" y="0" width="100" height="100" class="image" />
    <rect x="220" y="0" width="100" height="100" class="image" />
    <rect x="0" y="110" width="100" height="100" class="image" />
    <rect x="110" y="110" width="100" height="100" class="image" />
    <rect x="220" y="110" width="100" height="100" class="image" />
    <rect x="0" y="220" width="100" height="100" class="image" />
    <rect x="110" y="220" width="100" height="100" class="image" />
    <rect x="220" y="220" width="100" height="100" class="image" />
    <!-- Connecting lines -->
    <line x1="100" y1="50" x2="110" y2="50" class="image" />
    <line x1="210" y1="50" x2="220" y2="50" class="image" />
    <line x1="50" y1="100" x2="50" y2="110" class="image" />
    <line x1="160" y1="100" x2="160" y2="110" class="image" />
    <line x1="270" y1="100" x2="270" y2="110" class="image" />
    <line x1="100" y1="150" x2="110" y2="150" class="image" />
    <line x1="210" y1="150" x2="220" y2="150" class="image" />
    <line x1="50" y1="200" x2="50" y2="210" class="image" />
    <line x1="160" y1="200" x2="160" y2="210" class="image" />
    <line x1="270" y1="200" x2="270" y2="210" class="image" />
    <line x1="100" y1="250" x2="110" y2="250" class="image" />
    <line x1="210" y1="250" x2="220" y2="250" class="image" />
  </g>
</svg>