<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">murdered</text>
  <text x="50" y="120" class="subtitle">[ˈmɜːrdərd] v. 谋杀，杀害</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> murd (杀) + -er (表示动作的执行者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黑暗的夜晚，一个"杀手(murd-er)"
    <tspan x="50" dy="25">在阴影中悄悄行动，他的目标被"杀害(murdered)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective solved the case of the murdered victim.
  </text>
  <text x="50" y="310" class="content">
    侦探解决了被害者的谋杀案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark night -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#1B2631" />
    <!-- Killer -->
    <circle cx="50" cy="100" r="20" class="image" fill="#2C3E50" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Victim -->
    <circle cx="250" cy="100" r="20" class="image" fill="#E74C3C" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Blood splatter -->
    <circle cx="250" cy="180" r="10" class="image" fill="#884EA0" />
    <circle cx="240" cy="170" r="8" class="image" fill="#884EA0" />
    <circle cx="260" cy="170" r="8" class="image" fill="#884EA0" />
  </g>
</svg>