<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inevitability</text>
  <text x="50" y="120" class="subtitle">[ˌɪnˌɛvɪtəˈbɪlɪti] n. 不可避免性，必然性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + evit (避免) + -ability (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头滚下山坡，"无法避免(in-evit)"
    <tspan x="50" dy="25">地撞向一棵树，这就是不可避免性(inevitability)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The inevitability of death makes life precious.
  </text>
  <text x="50" y="310" class="content">
    死亡的不可避免性使得生命更加珍贵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 0 L200 200 Z" class="image" />
    <!-- Rolling stone -->
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Tree -->
    <rect x="180" y="180" width="20" height="20" class="image" />
    <line x1="190" y1="180" x2="190" y2="160" class="image" />
    <line x1="180" y1="190" x2="160" y2="190" class="image" />
    <line x1="200" y1="190" x2="220" y2="190" class="image" />
  </g>
</svg>