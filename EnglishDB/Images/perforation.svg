<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perforation</text>
  <text x="50" y="120" class="subtitle">[ˌpɜːrfəˈreɪʃn] n. 穿孔，打孔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + for (打孔) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张纸被完全打穿(per-for-ation)，形成整齐的孔洞，这些孔洞就是穿孔(perforation)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The perforation on the ticket allows it to be easily torn off.
  </text>
  <text x="50" y="310" class="content">
    票上的穿孔使得它可以很容易地被撕下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Paper -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Perforations -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <!-- Holes -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="150" cy="50" r="5" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="150" cy="100" r="5" class="image" />
    <circle cx="200" cy="100" r="5" class="image" />
    <circle cx="100" cy="150" r="5" class="image" />
    <circle cx="150" cy="150" r="5" class="image" />
    <circle cx="200" cy="150" r="5" class="image" />
  </g>
</svg>