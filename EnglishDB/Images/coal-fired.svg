<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .coal { fill: #333; }
      .fire { fill: #FF4500; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coal-fired</text>
  <text x="50" y="120" class="subtitle">[ˈkoʊl ˈfaɪərd] adj. 燃煤的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> coal (煤) + fire (火)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工厂，"煤(coal)"被投入"火(fire)"中，
    <tspan x="50" dy="25">熊熊燃烧，这就是燃煤(coal-fired)发电厂的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coal-fired power plant emits a lot of smoke.
  </text>
  <text x="50" y="310" class="content">
    燃煤发电厂排放大量烟雾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="20" width="50" height="160" class="image" />
    <!-- Smoke -->
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <line x1="165" y1="30" x2="165" y2="10" class="image" />
    <line x1="185" y1="30" x2="185" y2="10" class="image" />
    <!-- Coal -->
    <rect x="50" y="150" width="30" height="30" class="coal" />
    <rect x="90" y="150" width="30" height="30" class="coal" />
    <!-- Fire -->
    <circle cx="250" cy="100" r="20" class="fire" />
    <circle cx="260" cy="110" r="15" class="fire" />
    <circle cx="240" cy="110" r="15" class="fire" />
  </g>
</svg>