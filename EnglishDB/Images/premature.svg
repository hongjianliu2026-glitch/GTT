<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">premature</text>
  <text x="50" y="120" class="subtitle">[ˌpriːməˈtʃʊə(r)] adj. 早产的，过早的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + mature (成熟的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个婴儿在妈妈的肚子里，"提前(pre-)"
    <tspan x="50" dy="25">成熟(mature)，迫不及待地想要出来，这就是早产(premature)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby was born premature, only 7 months into the pregnancy.
  </text>
  <text x="50" y="310" class="content">
    这个婴儿早产，怀孕仅7个月就出生了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Baby -->
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="150" x2="150" y2="70" class="image" />
    <polygon points="150,70 140,60 140,80" class="image" />
    <!-- Text -->
    <text x="160" y="60" class="content">早产</text>
  </g>
</svg>