<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enforcer</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfɔːrsər] n. 执行者，强制执行者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + force (力量) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的人，"使(en-)"
    <tspan x="50" dy="25">用"力量(force)"去执行规则，</tspan>
    <tspan x="50" dy="25">这个人就是"执行者(enforcer)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enforcer made sure everyone followed the rules.
  </text>
  <text x="50" y="310" class="content">
    执行者确保每个人都遵守规则。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Enforcer -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Force -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="125" y1="100" x2="125" y2="150" class="image" />
    <line x1="125" y1="150" x2="115" y2="130" class="image" />
    <line x1="125" y1="150" x2="135" y2="130" class="image" />
  </g>
</svg>