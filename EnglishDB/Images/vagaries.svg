<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vagaries</text>
  <text x="50" y="120" class="subtitle">[vəˈɡɛəriz] n. 反复无常，变幻莫测</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vag (流浪) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个流浪者(vag)在变幻莫测(vagaries)的天气中，
    <tspan x="50" dy="25">一会儿阳光明媚，一会儿狂风暴雨，这就是vagaries的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stock market's vagaries can be quite unpredictable.
  </text>
  <text x="50" y="310" class="content">
    股市的反复无常可能非常难以预测。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Cloud -->
    <ellipse cx="150" cy="50" rx="40" ry="20" class="image" />
    <!-- Rain -->
    <line x1="140" y1="70" x2="140" y2="90" class="image" />
    <line x1="160" y1="70" x2="160" y2="90" class="image" />
    <line x1="180" y1="70" x2="180" y2="90" class="image" />
    <!-- Wind -->
    <line x1="200" y1="50" x2="220" y2="30" class="image" />
    <line x1="220" y1="30" x2="240" y2="50" class="image" />
    <!-- Wanderer -->
    <circle cx="300" cy="50" r="15" class="image" />
    <line x1="300" y1="65" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="280" y2="130" class="image" />
    <line x1="300" y1="100" x2="320" y2="130" class="image" />
    <line x1="300" y1="80" x2="330" y2="70" class="image" />
  </g>
</svg>