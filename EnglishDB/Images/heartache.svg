<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .heart { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heartache</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrteɪk] n. 心痛，伤心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heart (心) + ache (痛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗心被箭射中，"心(heart)痛(ache)"
    <tspan x="50" dy="25">的感觉就像是被箭刺穿，让人难以忍受。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of her death caused him heartache.
  </text>
  <text x="50" y="310" class="content">
    她去世的消息让他心痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Heart shape -->
    <path d="M100,50 Q150,25 200,50 Q250,75 200,100 Q150,125 100,100 Q50,75 100,50" class="heart" />
    <!-- Arrow -->
    <line x1="200" y1="50" x2="150" y2="100" class="image" />
    <polygon points="200,50 190,40 195,45 185,50 195,55 200,50" class="image" />
  </g>
</svg>