<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">helplessly</text>
  <text x="50" y="120" class="subtitle">[ˈhɛlplɪsli] adv. 无助地，无能为力地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> help (帮助) + less (没有) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，双手举起，"无助地(helplessly)"
    <tspan x="50" dy="25">呼喊，却没有任何人能来帮助他。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She watched helplessly as the car drove away.
  </text>
  <text x="50" y="310" class="content">
    她无助地看着汽车开走了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="150" y2="190" class="image" />
    <line x1="175" y1="160" x2="200" y2="190" class="image" />
    <line x1="175" y1="140" x2="140" y2="130" class="image" />
    <line x1="175" y1="140" x2="210" y2="130" class="image" />
    <!-- Arms raised -->
    <line x1="175" y1="120" x2="140" y2="90" class="image" />
    <line x1="175" y1="120" x2="210" y2="90" class="image" />
  </g>
</svg>