<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swig</text>
  <text x="50" y="120" class="subtitle">[swɪɡ] n. 一大口；v. 大口喝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sw- (表示强烈的动作) + ig (表示动作的完成)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人举起酒杯，"猛地一大口(sw-ig)"
    <tspan x="50" dy="25">喝下去，这种豪爽的动作就是swig。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He took a swig of his beer and continued talking.
  </text>
  <text x="50" y="310" class="content">
    他大口喝了一口啤酒，然后继续说话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <!-- Liquid -->
    <rect x="10" y="10" width="80" height="130" fill="#FFD700" />
    <!-- Person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="210" class="image" />
    <line x1="150" y1="180" x2="170" y2="210" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Hand holding glass -->
    <line x1="150" y1="120" x2="50" y2="75" class="image" />
  </g>
</svg>