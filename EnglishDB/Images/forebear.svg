<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forebear</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrber] n. 祖先，祖宗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (前面) + bear (承载)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的家族，"祖先(forebear)"
    <tspan x="50" dy="25">承载着家族的历史和传统，站在时间的前面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My forebears came from a small village in Ireland.
  </text>
  <text x="50" y="310" class="content">
    我的祖先来自爱尔兰的一个小村庄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ancestor figure -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="210" class="image" />
    <line x1="50" y1="180" x2="80" y2="210" class="image" />
    <!-- Family tree -->
    <line x1="50" y1="210" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="20" y2="280" class="image" />
    <line x1="50" y1="250" x2="80" y2="280" class="image" />
    <line x1="20" y1="280" x2="80" y2="280" class="image" />
    <!-- Ancestor holding a scroll -->
    <rect x="30" y="70" width="40" height="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="90" class="image" />
  </g>
</svg>