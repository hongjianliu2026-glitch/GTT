<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gal</text>
  <text x="50" y="120" class="subtitle">[ɡæl] n. 女孩，少女</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "gal"，意为"女孩"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个活泼的"女孩(gal)"在草地上跳跃，
    <tspan x="50" dy="25">她的笑声如同阳光般灿烂，让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a lively gal who loves to dance.
  </text>
  <text x="50" y="310" class="content">
    她是一个活泼的女孩，喜欢跳舞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Girl -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Grass -->
    <rect x="0" y="200" width="100" height="20" class="image" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="130" y1="85" x2="170" y2="85" class="image" />
    <line x1="120" y1="70" x2="180" y2="70" class="image" />
    <line x1="130" y1="100" x2="170" y2="100" class="image" />
  </g>
</svg>