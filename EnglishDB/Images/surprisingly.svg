<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surprisingly</text>
  <text x="50" y="120" class="subtitle">[sərˈpraɪzɪŋli] adv. 令人惊讶地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (超过) + pris (抓住) + ing (形容词后缀) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"超过预期的抓住(sur-pris-ing)"，
    <tspan x="50" dy="25">这种出乎意料的情况让人感到"令人惊讶地(surprisingly)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She finished the marathon surprisingly fast.
  </text>
  <text x="50" y="310" class="content">
    她令人惊讶地快速完成了马拉松。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <!-- Surprise symbol -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <line x1="150" y1="155" x2="120" y2="145" class="image" />
    <line x1="150" y1="155" x2="180" y2="145" class="image" />
    <line x1="150" y1="180" x2="120" y2="210" class="image" />
    <line x1="150" y1="180" x2="180" y2="210" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="100" x2="140" y2="100" class="image" />
    <polygon points="140,100 135,95 135,105" class="image" />
  </g>
</svg>