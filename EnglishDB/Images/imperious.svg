<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imperious</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpɪriəs] adj. 专横的，傲慢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> imper- (命令) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个傲慢的国王，"命令(imper-)"
    <tspan x="50" dy="25">所有人都要服从他的意愿，这种态度就是专横的(imperious)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boss's imperious manner made everyone uncomfortable.
  </text>
  <text x="50" y="310" class="content">
    老板的专横态度让每个人都感到不舒服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <line x1="35" y1="20" x2="65" y2="20" class="image" />
    <line x1="35" y1="80" x2="65" y2="80" class="image" />
    <!-- King -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="260" class="image" />
    <line x1="50" y1="220" x2="70" y2="260" class="image" />
    <line x1="50" y1="190" x2="20" y2="180" class="image" />
    <line x1="50" y1="190" x2="80" y2="180" class="image" />
    <!-- Scepter -->
    <line x1="50" y1="220" x2="50" y2="300" class="image" />
    <circle cx="50" cy="300" r="10" class="image" />
  </g>
</svg>