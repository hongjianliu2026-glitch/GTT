<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consideration</text>
  <text x="50" y="120" class="subtitle">[kənˌsɪdəˈreɪʃn] n. 考虑，体贴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + sider (星星) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"共同(con-)"
    <tspan x="50" dy="25">仰望星空(sider)"，思考着未来的方向，</tspan>
    <tspan x="50" dy="25">这种深思熟虑的过程就是"考虑(consideration)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please give the matter your careful consideration.
  </text>
  <text x="50" y="310" class="content">
    请仔细考虑这件事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="150" cy="50" r="5" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
    <!-- Thought bubbles -->
    <ellipse cx="50" cy="70" rx="20" ry="10" class="image" />
    <ellipse cx="100" cy="70" rx="20" ry="10" class="image" />
    <ellipse cx="150" cy="70" rx="20" ry="10" class="image" />
    <ellipse cx="200" cy="70" rx="20" ry="10" class="image" />
  </g>
</svg>