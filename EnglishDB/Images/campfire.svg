<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #FF6347; }
      .ground { fill: #8B4513; }
      .logs { fill: #A0522D; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">campfire</text>
  <text x="50" y="120" class="subtitle">[ˈkæmpfaɪər] n. 营火</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> camp (营地) + fire (火)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在营地(camp)围着一堆熊熊燃烧的火(fire)，
    <tspan x="50" dy="25">这就是营火(campfire)，大家围坐在一起讲故事、唱歌。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They gathered around the campfire to roast marshmallows.
  </text>
  <text x="50" y="310" class="content">
    他们围坐在营火旁烤棉花糖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="ground" />
    <!-- Logs -->
    <rect x="100" y="100" width="150" height="20" class="logs" />
    <rect x="120" y="120" width="110" height="20" class="logs" />
    <!-- Fire -->
    <circle cx="175" cy="110" r="20" class="fire" />
    <circle cx="160" cy="90" r="15" class="fire" />
    <circle cx="190" cy="90" r="15" class="fire" />
    <circle cx="175" cy="70" r="10" class="fire" />
  </g>
</svg>