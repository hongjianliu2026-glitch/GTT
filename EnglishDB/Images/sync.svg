<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sync</text>
  <text x="50" y="120" class="subtitle">[sɪŋk] v. 同步，使同步</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syn- (共同) + chron (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两台设备同时"共同(syn-)"调整"时间(chron)"，
    <tspan x="50" dy="25">就像两个舞者同步动作，完美协调。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Make sure to sync your phone with the computer.
  </text>
  <text x="50" y="310" class="content">
    确保将你的手机与电脑同步。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two devices -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="200" y="0" width="150" height="100" class="image" />
    <!-- Syncing arrows -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="150" y1="50" x2="175" y2="25" class="image" />
    <line x1="150" y1="50" x2="175" y2="75" class="image" />
    <line x1="200" y1="50" x2="225" y2="25" class="image" />
    <line x1="200" y1="50" x2="225" y2="75" class="image" />
  </g>
</svg>