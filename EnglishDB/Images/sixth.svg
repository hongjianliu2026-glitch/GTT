<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sixth</text>
  <text x="50" y="120" class="subtitle">[sɪksθ] adj. 第六的，六分之一的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> six (六) + -th (表示顺序)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕被切成六份，每一份都是"第六(sixth)"，
    <tspan x="50" dy="25">象征着六分之一的部分。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She finished the race in sixth place.
  </text>
  <text x="50" y="310" class="content">
    她在比赛中获得了第六名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Slices -->
    <line x1="175" y1="100" x2="255" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="180" class="image" />
    <line x1="175" y1="100" x2="95" y2="20" class="image" />
    <line x1="175" y1="100" x2="95" y2="180" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <line x1="175" y1="100" x2="95" y2="100" class="image" />
    <!-- Sixth slice -->
    <rect x="175" y="20" width="80" height="160" class="image" />
  </g>
</svg>