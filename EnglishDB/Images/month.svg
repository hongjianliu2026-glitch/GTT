<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">month</text>
  <text x="50" y="120" class="subtitle">[mʌnθ] n. 月，月份</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mon- (月) + th (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的月亮(mon-)挂在天空中，每个月(month)
    <tspan x="50" dy="25">都会经历不同的变化，从新月到满月，再回到新月。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has been working here for three months.
  </text>
  <text x="50" y="310" class="content">
    她在这里工作已经三个月了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Crescent -->
    <path d="M 100 100 A 50 50 0 0 1 150 150 L 100 100 Z" class="image" fill="#ECF0F1" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="3" class="image" fill="#ECF0F1" />
    <circle cx="70" cy="70" r="3" class="image" fill="#ECF0F1" />
    <circle cx="80" cy="30" r="3" class="image" fill="#ECF0F1" />
    <circle cx="120" cy="40" r="3" class="image" fill="#ECF0F1" />
    <circle cx="140" cy="60" r="3" class="image" fill="#ECF0F1" />
  </g>
</svg>