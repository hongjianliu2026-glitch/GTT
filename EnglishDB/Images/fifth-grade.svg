<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fifth-grade</text>
  <text x="50" y="120" class="subtitle">[ˈfɪfθ ɡreɪd] n. 五年级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fifth (第五) + grade (年级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个五年级教室里，"第五(fifth)"排的学生们正在认真听讲，
    <tspan x="50" dy="25">他们正在学习新的知识，这就是五年级(fifth-grade)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is in the fifth-grade this year.
  </text>
  <text x="50" y="310" class="content">
    她今年上五年级。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Desks -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="120" y="20" width="50" height="30" class="image" />
    <rect x="190" y="20" width="50" height="30" class="image" />
    <rect x="260" y="20" width="50" height="30" class="image" />
    <rect x="50" y="70" width="50" height="30" class="image" />
    <rect x="120" y="70" width="50" height="30" class="image" />
    <rect x="190" y="70" width="50" height="30" class="image" />
    <rect x="260" y="70" width="50" height="30" class="image" />
    <!-- Students -->
    <circle cx="75" cy="45" r="10" class="image" />
    <circle cx="145" cy="45" r="10" class="image" />
    <circle cx="215" cy="45" r="10" class="image" />
    <circle cx="285" cy="45" r="10" class="image" />
    <circle cx="75" cy="95" r="10" class="image" />
    <circle cx="145" cy="95" r="10" class="image" />
    <circle cx="215" cy="95" r="10" class="image" />
    <circle cx="285" cy="95" r="10" class="image" />
    <!-- Teacher -->
    <circle cx="300" cy="150" r="15" class="image" />
    <line x1="300" y1="165" x2="300" y2="190" class="image" />
    <line x1="300" y1="190" x2="280" y2="210" class="image" />
    <line x1="300" y1="190" x2="320" y2="210" class="image" />
    <line x1="300" y1="175" x2="330" y2="165" class="image" />
  </g>
</svg>