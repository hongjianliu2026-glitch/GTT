<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">floating</text>
  <text x="50" y="120" class="subtitle">[ˈfloʊtɪŋ] adj. 漂浮的，浮动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> float (漂浮) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，"漂浮(float)"在空中，
    <tspan x="50" dy="25">随着风轻轻摇摆，这就是"漂浮的(floating)"感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leaves were floating on the surface of the pond.
  </text>
  <text x="50" y="310" class="content">
    树叶漂浮在池塘的水面上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#FFD700" />
    <!-- Balloon -->
    <circle cx="150" cy="100" r="20" class="image" fill="#FF69B4" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="200" class="image" />
    <line x1="150" y1="180" x2="170" y2="200" class="image" />
    <!-- Clouds -->
    <ellipse cx="50" cy="50" rx="40" ry="20" class="image" fill="#FFFFFF" />
    <ellipse cx="250" cy="70" rx="50" ry="25" class="image" fill="#FFFFFF" />
  </g>
</svg>