<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">electromagnetic</text>
  <text x="50" y="120" class="subtitle">[ɪˌlektrəʊmæɡˈnɛtɪk] adj. 电磁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> electro- (电) + magnetic (磁)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磁铁，"电(electro)"和"磁(magnetic)"
    <tspan x="50" dy="25">的力量在空中交织，形成了一个电磁场(electromagnetic field)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The electromagnetic waves are used in wireless communication.
  </text>
  <text x="50" y="310" class="content">
    电磁波用于无线通信。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnet -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="200" y="0" width="150" height="100" class="image" />
    <!-- Electric lines -->
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <line x1="75" y1="120" x2="275" y2="120" class="image" />
    <line x1="75" y1="140" x2="275" y2="140" class="image" />
    <line x1="75" y1="160" x2="275" y2="160" class="image" />
    <!-- Magnetic field -->
    <circle cx="150" cy="150" r="50" class="image" />
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <line x1="125" y1="125" x2="175" y2="175" class="image" />
    <line x1="125" y1="175" x2="175" y2="125" class="image" />
  </g>
</svg>