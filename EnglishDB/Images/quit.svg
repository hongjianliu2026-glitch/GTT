<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quit</text>
  <text x="50" y="120" class="subtitle">[kwɪt] v. 离开，放弃，停止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> qu- (离开) + -it (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然决定"离开(qu-it)"，
    <tspan x="50" dy="25">他放下手中的工作，转身离去，这就是quit的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He decided to quit his job and travel the world.
  </text>
  <text x="50" y="310" class="content">
    他决定辞去工作，环游世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking away -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Path -->
    <line x1="100" y1="220" x2="300" y2="220" class="image" />
    <!-- Dashed line indicating walking away -->
    <line x1="100" y1="220" x2="150" y2="220" class="image" stroke-dasharray="5,5" />
    <line x1="150" y1="220" x2="200" y2="220" class="image" stroke-dasharray="5,5" />
    <line x1="200" y1="220" x2="250" y2="220" class="image" stroke-dasharray="5,5" />
    <line x1="250" y1="220" x2="300" y2="220" class="image" stroke-dasharray="5,5" />
  </g>
</svg>