<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dialect</text>
  <text x="50" y="120" class="subtitle">[ˈdaɪəlekt] n. 方言，土话</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dia- (通过) + lect (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个村庄里，村民们通过"选择(lect)"
    <tspan x="50" dy="25">不同的词汇和发音，形成了独特的"方言(dialect)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks a dialect of the local language.
  </text>
  <text x="50" y="310" class="content">
    她说的是当地语言的一种方言。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- People -->
    <circle cx="70" cy="90" r="10" class="image" />
    <circle cx="140" cy="90" r="10" class="image" />
    <circle cx="210" cy="90" r="10" class="image" />
    <!-- Speech bubbles -->
    <path d="M 60 100 Q 50 110 60 120 L 100 120 L 100 100 Z" class="image" />
    <path d="M 130 100 Q 120 110 130 120 L 170 120 L 170 100 Z" class="image" />
    <path d="M 200 100 Q 190 110 200 120 L 240 120 L 240 100 Z" class="image" />
    <!-- Dialect text -->
    <text x="70" y="115" class="content" font-size="12">方言1</text>
    <text x="140" y="115" class="content" font-size="12">方言2</text>
    <text x="210" y="115" class="content" font-size="12">方言3</text>
  </g>
</svg>