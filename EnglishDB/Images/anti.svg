<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anti</text>
  <text x="50" y="120" class="subtitle">[ˈænti] pref. 反对，对抗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (反对，对抗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，"对抗(anti)"
    <tspan x="50" dy="25">着彼此，他们的立场完全相反。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The anti-virus software protects your computer from malware.
  </text>
  <text x="50" y="310" class="content">
    反病毒软件保护你的电脑免受恶意软件的侵害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="20" y2="130" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />

    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="170" y2="130" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />

    <!-- Arrows indicating opposition -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="140" y2="90" class="image" />
    <line x1="150" y1="100" x2="140" y2="110" class="image" />

    <line x1="150" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="110" y2="90" class="image" />
    <line x1="100" y1="100" x2="110" y2="110" class="image" />
  </g>
</svg>