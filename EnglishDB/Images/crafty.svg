<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crafty</text>
  <text x="50" y="120" class="subtitle">[ˈkræfti] adj. 狡猾的，巧妙的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> craft (工艺，技巧) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狡猾的狐狸，用它的"技巧(craft)"
    <tspan x="50" dy="25">巧妙地避开陷阱，这就是crafty的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crafty salesman used every trick in the book to close the deal.
  </text>
  <text x="50" y="310" class="content">
    那个狡猾的销售员用尽了书中的所有伎俩来达成交易。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fox -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Tail -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Tail -->
    <line x1="30" y1="140" x2="10" y2="140" class="image" /> <!-- Front leg -->
    <line x1="70" y1="140" x2="90" y2="140" class="image" /> <!-- Back leg -->
    <line x1="40" y1="110" x2="30" y2="120" class="image" /> <!-- Ear -->
    <line x1="60" y1="110" x2="70" y2="120" class="image" /> <!-- Ear -->
    <circle cx="40" cy="95" r="5" class="image" /> <!-- Eye -->
    <circle cx="60" cy="95" r="5" class="image" /> <!-- Eye -->
    <line x1="45" y1="105" x2="55" y2="105" class="image" /> <!-- Nose -->
    <line x1="50" y1="105" x2="50" y2="110" class="image" /> <!-- Nose -->

    <!-- Trap -->
    <rect x="150" y="150" width="100" height="50" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
    <line x1="150" y1="200" x2="250" y2="200" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <line x1="250" y1="150" x2="250" y2="200" class="image" />
    <line x1="200" y1="150" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="120" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
  </g>
</svg>