<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">obsession</text>
  <text x="50" y="120" class="subtitle">[əbˈseʃ(ə)n] n. 痴迷，困扰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (朝向) + sess (坐) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被一个想法"朝向(ob-)"并"坐(sess)"在心里，
    <tspan x="50" dy="25">这个想法不断困扰着他，形成了一种痴迷(obsession)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His obsession with video games affected his studies.
  </text>
  <text x="50" y="310" class="content">
    他对电子游戏的痴迷影响到了他的学习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Idea -->
    <rect x="50" y="20" width="100" height="60" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="80" x2="150" y2="80" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Arrow -->
    <line x1="180" y1="100" x2="100" y2="100" class="image" />
    <polygon points="100,100 90,95 90,105" class="image" />
  </g>
</svg>