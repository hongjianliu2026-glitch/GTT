<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ferocious</text>
  <text x="50" y="120" class="subtitle">[fəˈroʊʃəs] adj. 凶猛的，残忍的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> feroc (凶猛) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只"凶猛(feroc)"的狮子，它的眼神和动作都充满了"残忍(ious)"，
    <tspan x="50" dy="25">仿佛随时准备扑向猎物，这种场景让人不寒而栗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ferocious lion roared loudly, scaring all the animals away.
  </text>
  <text x="50" y="310" class="content">
    那只凶猛的狮子大声咆哮，吓跑了所有的动物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Nose -->
    <line x1="90" y1="120" x2="110" y2="120" class="image" />
    <!-- Mouth -->
    <path d="M 50 140 Q 100 180 150 140" class="image" />
    <!-- Fur -->
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="120" x2="180" y2="120" class="image" />
    <line x1="20" y1="140" x2="180" y2="140" class="image" />
  </g>
</svg>