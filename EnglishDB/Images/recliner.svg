<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recliner</text>
  <text x="50" y="120" class="subtitle">[rɪˈklaɪnər] n. 躺椅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + clin (倾斜) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在"向后倾斜(re-clin)"的椅子上，
    <tspan x="50" dy="25">享受着放松的时光，这就是躺椅(recliner)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spent the afternoon in his recliner, reading a book.
  </text>
  <text x="50" y="310" class="content">
    他整个下午都躺在躺椅上看书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Recliner chair -->
    <rect x="0" y="0" width="300" height="150" class="image" />
    <rect x="50" y="50" width="200" height="100" class="image" />
    <!-- Person reclining -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="120" y2="220" class="image" />
    <line x1="150" y1="180" x2="180" y2="220" class="image" />
    <line x1="150" y1="140" x2="100" y2="130" class="image" />
    <line x1="150" y1="140" x2="200" y2="130" class="image" />
  </g>
</svg>