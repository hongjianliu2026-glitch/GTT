<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">movement</text>
  <text x="50" y="120" class="subtitle">[ˈmuːvmənt] n. 运动，移动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> move (移动) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在广场上，"移动(move)"
    <tspan x="50" dy="25">形成一个"运动(movement)"，象征着集体的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The civil rights movement gained momentum in the 1960s.
  </text>
  <text x="50" y="310" class="content">
    民权运动在20世纪60年代获得了动力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- People -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="35" y2="200" class="image" />
    <line x1="50" y1="180" x2="65" y2="200" class="image" />
    <line x1="50" y1="170" x2="70" y2="160" class="image" />

    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="85" y2="200" class="image" />
    <line x1="100" y1="180" x2="115" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="160" class="image" />

    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="135" y2="200" class="image" />
    <line x1="150" y1="180" x2="165" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="160" class="image" />

    <!-- Movement arrows -->
    <line x1="200" y1="150" x2="250" y2="150" class="image" />
    <polygon points="250,150 240,145 240,155" class="image" />
  </g>
</svg>