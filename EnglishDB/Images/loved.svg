<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loved</text>
  <text x="50" y="120" class="subtitle">[lʌvd] adj. 被爱的，受喜爱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> love (爱) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被无数颗心包围，"被爱(loved)"
    <tspan x="50" dy="25">的感觉就像是被温暖的拥抱环绕。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt loved by her family and friends.
  </text>
  <text x="50" y="310" class="content">
    她感受到家人和朋友的爱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shapes -->
    <path d="M50,50 C50,25 90,25 90,50 S130,75 130,50" class="image" />
    <path d="M150,50 C150,25 190,25 190,50 S230,75 230,50" class="image" />
    <path d="M250,50 C250,25 290,25 290,50 S330,75 330,50" class="image" />
    <!-- Person -->
    <circle cx="200" cy="150" r="30" class="image" />
    <line x1="200" y1="180" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="170" y2="300" class="image" />
    <line x1="200" y1="250" x2="230" y2="300" class="image" />
    <line x1="200" y1="220" x2="150" y2="200" class="image" />
    <line x1="200" y1="220" x2="250" y2="200" class="image" />
  </g>
</svg>