<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rented</text>
  <text x="50" y="120" class="subtitle">[ˈrɛntɪd] adj. 租用的，租来的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + nt (名词后缀) + ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在租来的房子里，"再次(re-)"
    <tspan x="50" dy="25">支付租金，这个房子就是租用的(rented)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She lives in a rented apartment downtown.
  </text>
  <text x="50" y="310" class="content">
    她住在市中心的一套租来的公寓里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Door -->
    <rect x="80" y="100" width="40" height="50" class="image" />
    <!-- Windows -->
    <rect x="20" y="20" width="40" height="40" class="image" />
    <rect x="140" y="20" width="40" height="40" class="image" />
    <!-- Key -->
    <line x1="220" y1="50" x2="250" y2="50" class="image" />
    <line x1="220" y1="50" x2="220" y2="80" class="image" />
    <line x1="220" y1="80" x2="250" y2="80" class="image" />
    <line x1="250" y1="50" x2="250" y2="80" class="image" />
    <!-- Person -->
    <circle cx="235" cy="100" r="15" class="image" />
    <line x1="235" y1="115" x2="235" y2="150" class="image" />
    <line x1="235" y1="150" x2="220" y2="180" class="image" />
    <line x1="235" y1="150" x2="250" y2="180" class="image" />
    <line x1="235" y1="130" x2="270" y2="120" class="image" />
  </g>
</svg>