<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">the</text>
  <text x="50" y="120" class="subtitle">[ðə, ði] art. 这，那</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，为定冠词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指路的人，用手指着某个方向说："就是这个(the)！"
    <tspan x="50" dy="25">这个动作帮助我们确定特定的对象或事物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The book on the table is mine.
  </text>
  <text x="50" y="310" class="content">
    桌子上的那本书是我的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pointer finger -->
    <line x1="50" y1="50" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="180" y2="30" class="image" />
    <line x1="200" y1="50" x2="180" y2="70" class="image" />
    <!-- Circle to indicate the object -->
    <circle cx="250" cy="50" r="30" class="image" />
  </g>
</svg>