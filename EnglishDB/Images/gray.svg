<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #4A4A4A; }
      .subtitle { font: italic 24px serif; fill: #6D6D6D; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #808080; }
      .story { font: 16px serif; fill: #555555; }
      .image { stroke: #808080; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gray</text>
  <text x="50" y="120" class="subtitle">[ɡreɪ] adj. 灰色的，灰白的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gray (源自中古英语 grei, 意为灰色)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只老鹰在灰色的天空下翱翔，它的羽毛和天空融为一体，
    <tspan x="50" dy="25">仿佛整个世界都被灰色的色调所笼罩。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man's hair turned gray with age.
  </text>
  <text x="50" y="310" class="content">
    老人的头发随着年龄的增长变灰白了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gray sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#808080" />
    <!-- Eagle -->
    <circle cx="100" cy="100" r="20" class="image" fill="#FFFFFF" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="140" x2="80" y2="120" class="image" />
    <line x1="100" y1="140" x2="120" y2="120" class="image" />
    <line x1="100" y1="160" x2="80" y2="180" class="image" />
    <line x1="100" y1="160" x2="120" y2="180" class="image" />
  </g>
</svg>