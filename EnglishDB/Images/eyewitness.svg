<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eyewitness</text>
  <text x="50" y="120" class="subtitle">[ˈaɪˌwɪtnəs] n. 目击者，见证人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eye (眼睛) + witness (见证)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，一个人用他的"眼睛(eye)"
    <tspan x="50" dy="25">亲眼目睹了某个事件，他就是一个"目击者(eyewitness)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The eyewitness provided crucial details about the accident.
  </text>
  <text x="50" y="310" class="content">
    目击者提供了关于事故的关键细节。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="25" class="image" fill="#2C3E50" />
    <!-- Witness -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Connection -->
    <line x1="150" y1="100" x2="185" y2="100" class="image" />
  </g>
</svg>