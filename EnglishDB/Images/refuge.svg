<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">refuge</text>
  <text x="50" y="120" class="subtitle">[ˈrɛfjuːdʒ] n. 避难所，庇护</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + fuge (逃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在暴风雨中，"逃回(re-fuge)"
    <tspan x="50" dy="25">一个安全的地方，这个地方就是他的避难所(refuge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The villagers found refuge in the church during the storm.
  </text>
  <text x="50" y="310" class="content">
    村民们在暴风雨中在教堂里找到了避难所。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Storm clouds -->
    <ellipse cx="175" cy="50" rx="150" ry="30" class="image" />
    <ellipse cx="100" cy="30" rx="100" ry="20" class="image" />
    <ellipse cx="250" cy="30" rx="100" ry="20" class="image" />
    <!-- Rain drops -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="100" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="200" y1="70" x2="200" y2="100" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <!-- Refuge -->
    <rect x="125" y="120" width="100" height="100" class="image" />
    <line x1="125" y1="120" x2="175" y2="100" class="image" />
    <line x1="225" y1="120" x2="175" y2="100" class="image" />
    <!-- Person seeking refuge -->
    <circle cx="175" cy="240" r="15" class="image" />
    <line x1="175" y1="255" x2="175" y2="290" class="image" />
    <line x1="175" y1="290" x2="155" y2="320" class="image" />
    <line x1="175" y1="290" x2="195" y2="320" class="image" />
    <line x1="175" y1="270" x2="205" y2="260" class="image" />
  </g>
</svg>