<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indifference</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdɪfrəns] n. 冷漠，不关心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + differ (不同) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在两个不同的世界之间，"不(in-)"
    <tspan x="50" dy="25">表现出任何"不同(differ)"的态度，</tspan>
    <tspan x="50" dy="25">完全"冷漠(indifference)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His indifference to the situation was disturbing.
  </text>
  <text x="50" y="310" class="content">
    他对这种情况的冷漠令人不安。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two worlds -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="200" y="0" width="150" height="200" class="image" />
    <!-- Person in the middle -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Indifference symbol -->
    <line x1="150" y1="20" x2="200" y2="20" class="image" />
    <line x1="175" y1="20" x2="175" y2="40" class="image" />
  </g>
</svg>