<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jumper</text>
  <text x="50" y="120" class="subtitle">[ˈdʒʌmpər] n. 跳跃者，套头毛衣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jump (跳) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着套头毛衣的人，突然从地面"跳跃(jump)"
    <tspan x="50" dy="25">起来，就像一个跳跃者(jumper)一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a cozy jumper on a cold day.
  </text>
  <text x="50" y="310" class="content">
    她在寒冷的一天穿了一件舒适的套头毛衣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Jumper -->
    <rect x="50" y="50" width="150" height="200" class="image" />
    <!-- Head -->
    <circle cx="125" cy="30" r="20" class="image" />
    <!-- Arms -->
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <!-- Legs -->
    <line x1="125" y1="250" x2="125" y2="300" class="image" />
    <!-- Jump action -->
    <line x1="125" y1="300" x2="100" y2="350" class="image" />
    <line x1="125" y1="300" x2="150" y2="350" class="image" />
  </g>
</svg>