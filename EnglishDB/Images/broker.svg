<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">broker</text>
  <text x="50" y="120" class="subtitle">[ˈbroʊkər] n. 经纪人，中间人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brok (打破) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个经纪人站在中间，"打破(brok)"
    <tspan x="50" dy="25">双方之间的障碍，促成交易。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He works as a broker in the stock market.
  </text>
  <text x="50" y="310" class="content">
    他在股票市场做经纪人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Broken lines -->
    <line x1="70" y1="100" x2="150" y2="100" class="image" />
    <line x1="70" y1="120" x2="150" y2="120" class="image" />
    <line x1="70" y1="140" x2="150" y2="140" class="image" />
    <line x1="70" y1="160" x2="150" y2="160" class="image" />
    <line x1="70" y1="180" x2="150" y2="180" class="image" />
    <!-- Broken lines -->
    <line x1="200" y1="100" x2="280" y2="100" class="image" />
    <line x1="200" y1="120" x2="280" y2="120" class="image" />
    <line x1="200" y1="140" x2="280" y2="140" class="image" />
    <line x1="200" y1="160" x2="280" y2="160" class="image" />
    <line x1="200" y1="180" x2="280" y2="180" class="image" />
    <!-- Broker connecting lines -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="120" x2="200" y2="120" class="image" />
    <line x1="150" y1="140" x2="200" y2="140" class="image" />
    <line x1="150" y1="160" x2="200" y2="160" class="image" />
    <line x1="150" y1="180" x2="200" y2="180" class="image" />
  </g>
</svg>