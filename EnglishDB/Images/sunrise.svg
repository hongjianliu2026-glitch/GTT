<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #F1C40F; }
      .sky { fill: #3498DB; }
      .ground { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sunrise</text>
  <text x="50" y="120" class="subtitle">[ˈsʌnraɪz] n. 日出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + rise (升起)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳从地平线上缓缓"升起(rise)"，
    <tspan x="50" dy="25">照亮了整个天空，这就是日出(sunrise)的美丽景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We watched the sunrise from the mountaintop.
  </text>
  <text x="50" y="310" class="content">
    我们从山顶观看了日出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="sky" />
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="ground" />
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="sun" />
    <!-- Sun rays -->
    <line x1="50" y1="20" x2="50" y2="0" class="image" />
    <line x1="70" y1="30" x2="90" y2="10" class="image" />
    <line x1="80" y1="50" x2="100" y2="50" class="image" />
    <line x1="70" y1="70" x2="90" y2="90" class="image" />
    <line x1="50" y1="80" x2="50" y2="100" class="image" />
    <line x1="30" y1="70" x2="10" y2="90" class="image" />
    <line x1="20" y1="50" x2="0" y2="50" class="image" />
    <line x1="30" y1="30" x2="10" y2="10" class="image" />
  </g>
</svg>