<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tow</text>
  <text x="50" y="120" class="subtitle">[toʊ] v. 拖，拉；n. 拖，拉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "towen"，意为"拉，拖"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆大卡车在拖着一辆小汽车，"拖(tow)"
    <tspan x="50" dy="25">着它前进，这就是"tow"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The broken-down car was towed to the garage.
  </text>
  <text x="50" y="310" class="content">
    那辆抛锚的汽车被拖到了修车厂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Truck -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Car -->
    <rect x="220" y="40" width="100" height="60" class="image" />
    <!-- Rope -->
    <line x1="200" y1="50" x2="220" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="70" class="image" />
    <line x1="200" y1="70" x2="220" y2="70" class="image" />
  </g>
</svg>