<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bipartisan</text>
  <text x="50" y="120" class="subtitle">[ˌbaɪˈpɑːrtɪzn] adj. 两党的，代表两党的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (两个) + parti (党派) + -san (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个党派的代表在一张桌子前握手，"两个党派(bi-parti)"
    <tspan x="50" dy="25">达成共识，这就是两党合作的场景(bipartisan)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bill was passed with bipartisan support.
  </text>
  <text x="50" y="310" class="content">
    该法案在两党支持下通过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two parties -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Handshake -->
    <line x1="130" y1="100" x2="220" y2="100" class="image" />
    <!-- Labels -->
    <text x="80" y="150" class="content">Party A</text>
    <text x="230" y="150" class="content">Party B</text>
  </g>
</svg>