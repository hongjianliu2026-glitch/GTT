<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gritty</text>
  <text x="50" y="120" class="subtitle">[ˈɡrɪti] adj. 坚韧的，有砂砾感的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grit (砂砾) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在砂砾中行走，"砂砾(grit)"
    <tspan x="50" dy="25">磨砺了他的意志，使他变得坚韧(gritty)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The marathon runner showed a gritty determination to finish the race.
  </text>
  <text x="50" y="310" class="content">
    马拉松选手展现了坚韧不拔的决心，完成了比赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sand -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person walking -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Grit particles -->
    <circle cx="100" cy="120" r="3" class="image" />
    <circle cx="120" cy="130" r="3" class="image" />
    <circle cx="140" cy="110" r="3" class="image" />
    <circle cx="160" cy="140" r="3" class="image" />
    <circle cx="180" cy="120" r="3" class="image" />
  </g>
</svg>