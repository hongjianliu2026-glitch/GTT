<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">showdown</text>
  <text x="50" y="120" class="subtitle">[ˈʃoʊdaʊn] n. 摊牌，对决</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> show (展示) + down (向下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个牛仔在夕阳下，"展示(show)"
    <tspan x="50" dy="25">他们的牌，决定胜负，这就是"摊牌(showdown)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The final showdown between the two teams was intense.
  </text>
  <text x="50" y="310" class="content">
    两队之间的最终对决非常激烈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="175" cy="50" r="40" fill="#F1C40F" />
    <!-- Cowboys -->
    <circle cx="100" cy="150" r="20" fill="#2C3E50" />
    <circle cx="250" cy="150" r="20" fill="#2C3E50" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="250" y1="170" x2="250" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="250" y1="220" x2="230" y2="250" class="image" />
    <line x1="250" y1="220" x2="270" y2="250" class="image" />
    <!-- Cards -->
    <rect x="80" y="100" width="40" height="60" class="image" />
    <rect x="230" y="100" width="40" height="60" class="image" />
  </g>
</svg>