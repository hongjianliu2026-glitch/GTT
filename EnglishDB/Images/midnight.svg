<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">midnight</text>
  <text x="50" y="120" class="subtitle">[ˈmɪdnaɪt] n. 午夜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mid- (中间) + night (夜晚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟指针指向"中间(mid)"的"夜晚(night)"，
    <tspan x="50" dy="25">这就是午夜(midnight)，一天中最黑暗的时刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The party ended at midnight.
  </text>
  <text x="50" y="310" class="content">
    派对在午夜结束。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Hour hand -->
    <line x1="175" y1="100" x2="175" y2="40" class="image" />
    <!-- Minute hand -->
    <line x1="175" y1="100" x2="240" y2="100" class="image" />
    <!-- Moon -->
    <circle cx="300" cy="100" r="30" class="image" />
    <!-- Stars -->
    <circle cx="280" cy="80" r="5" class="image" />
    <circle cx="320" cy="120" r="5" class="image" />
    <circle cx="340" cy="90" r="5" class="image" />
  </g>
</svg>