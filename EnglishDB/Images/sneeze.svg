<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sneeze</text>
  <text x="50" y="120" class="subtitle">[sniːz] n. 喷嚏；v. 打喷嚏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sn- (鼻子) + eeze (喷出)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然"鼻子(sn-)"里喷出(eeze)
    <tspan x="50" dy="25">一股气流，这就是打喷嚏(sneeze)的瞬间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He couldn't stop sneezing because of the pollen.
  </text>
  <text x="50" y="310" class="content">
    他对花粉过敏，不停地打喷嚏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nose -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Air burst -->
    <line x1="100" y1="70" x2="150" y2="20" class="image" />
    <line x1="100" y1="70" x2="50" y2="20" class="image" />
    <line x1="100" y1="70" x2="130" y2="40" class="image" />
    <line x1="100" y1="70" x2="70" y2="40" class="image" />
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="80" cy="80" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <path d="M80 120 Q100 140 120 120" class="image" />
  </g>
</svg>