<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">headless</text>
  <text x="50" y="120" class="subtitle">[ˈhɛdlɪs] adj. 无头的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> head (头) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个无头骑士在夜晚的森林中骑行，"无头(headless)"
    <tspan x="50" dy="25">的骑士在月光下显得格外恐怖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The headless horseman appeared in the fog.
  </text>
  <text x="50" y="310" class="content">
    无头骑士在雾中出现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="50" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <!-- Rider -->
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <line x1="100" y1="75" x2="50" y2="75" class="image" />
    <line x1="100" y1="75" x2="150" y2="75" class="image" />
    <line x1="100" y1="75" x2="100" y2="100" class="image" />
    <!-- No head -->
    <text x="90" y="40" class="highlight" font-size="24">X</text>
  </g>
</svg>