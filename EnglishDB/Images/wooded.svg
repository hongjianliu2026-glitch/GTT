<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tree { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wooded</text>
  <text x="50" y="120" class="subtitle">[ˈwʊdid] adj. 多树木的，长满树木的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wood (木头) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林，"木头(wood)"
    <tspan x="50" dy="25">覆盖了整个区域，这就是"多树木的(wooded)"地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The path through the wooded area was quite peaceful.
  </text>
  <text x="50" y="310" class="content">
    穿过这片多树木的区域的小路非常宁静。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trees -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="30" height="160" class="tree" />
    <rect x="120" y="20" width="30" height="160" class="tree" />
    <rect x="190" y="20" width="30" height="160" class="tree" />
    <rect x="260" y="20" width="30" height="160" class="tree" />
    <rect x="330" y="20" width="30" height="160" class="tree" />
  </g>
</svg>