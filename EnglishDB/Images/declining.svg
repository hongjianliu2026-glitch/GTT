<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">declining</text>
  <text x="50" y="120" class="subtitle">[dɪˈklaɪnɪŋ] adj. 下降的，衰退的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + clin (倾斜) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体从高处"向下倾斜(de-clin-ing)"，
    <tspan x="50" dy="25">逐渐下降，就像一个衰退的趋势。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's profits have been declining for the past year.
  </text>
  <text x="50" y="310" class="content">
    公司的利润在过去一年一直在下降。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- High point -->
    <line x1="0" y1="0" x2="150" y2="0" class="image" />
    <!-- Low point -->
    <line x1="150" y1="0" x2="300" y2="150" class="image" />
    <!-- Arrow indicating decline -->
    <polygon points="300,150 280,130 280,170" class="image" />
    <!-- Text annotation -->
    <text x="150" y="80" class="content" text-anchor="middle">High</text>
    <text x="300" y="230" class="content" text-anchor="middle">Low</text>
  </g>
</svg>