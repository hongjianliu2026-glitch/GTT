<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">distributed</text>
  <text x="50" y="120" class="subtitle">[dɪˈstrɪbjutɪd] adj. 分布式的，分散的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + tribute (给予)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人站在不同的地方，"分开给予(dis-tribute)"
    <tspan x="50" dy="25">资源或任务，这就是分布式(distributed)的概念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company uses a distributed network for its data storage.
  </text>
  <text x="50" y="310" class="content">
    公司使用分布式网络来存储数据。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People standing in different locations -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <!-- Lines connecting them -->
    <line x1="50" y1="65" x2="150" y2="65" class="image" />
    <line x1="150" y1="65" x2="250" y2="65" class="image" />
    <line x1="50" y1="165" x2="150" y2="165" class="image" />
    <line x1="150" y1="165" x2="250" y2="165" class="image" />
    <line x1="50" y1="65" x2="50" y2="165" class="image" />
    <line x1="250" y1="65" x2="250" y2="165" class="image" />
  </g>
</svg>