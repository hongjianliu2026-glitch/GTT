<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">metabolic</text>
  <text x="50" y="120" class="subtitle">[ˌmɛtəˈbɒlɪk] adj. 新陈代谢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meta- (变化) + -bolic (抛，投)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个细胞在体内，"不断变化(meta-)"
    <tspan x="50" dy="25">并"抛出(bolic)"能量，这就是新陈代谢(metabolic)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Exercise can boost your metabolic rate.
  </text>
  <text x="50" y="310" class="content">
    运动可以提高你的新陈代谢率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cell -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Energy particles -->
    <circle cx="70" cy="70" r="10" class="image" />
    <circle cx="130" cy="70" r="10" class="image" />
    <circle cx="100" cy="130" r="10" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="50" x2="100" y2="30" class="image" />
    <line x1="100" y1="30" x2="90" y2="40" class="image" />
    <line x1="100" y1="30" x2="110" y2="40" class="image" />
    <line x1="100" y1="150" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="90" y2="160" class="image" />
    <line x1="100" y1="170" x2="110" y2="160" class="image" />
  </g>
</svg>