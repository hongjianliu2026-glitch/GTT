<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">astronomer</text>
  <text x="50" y="120" class="subtitle">[əˈstrɑːnəmər] n. 天文学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> astro- (星星) + nomer (学者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天文学家，"星星的学者(astro-nomer)"，
    <tspan x="50" dy="25">他站在山顶，用望远镜观察夜空中的星星。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The astronomer discovered a new star last night.
  </text>
  <text x="50" y="310" class="content">
    这位天文学家昨晚发现了一颗新星。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L400 200 L300 100 L200 150 L100 100 Z" class="image" />
    <!-- Astronomer -->
    <circle cx="200" cy="150" r="15" class="image" />
    <line x1="200" y1="165" x2="200" y2="190" class="image" />
    <line x1="200" y1="190" x2="180" y2="220" class="image" />
    <line x1="200" y1="190" x2="220" y2="220" class="image" />
    <line x1="200" y1="175" x2="230" y2="165" class="image" />
    <!-- Telescope -->
    <rect x="180" y="130" width="40" height="20" class="image" />
    <line x1="200" y1="130" x2="200" y2="100" class="image" />
    <!-- Stars -->
    <circle cx="150" cy="80" r="5" class="image" />
    <circle cx="250" cy="70" r="5" class="image" />
    <circle cx="300" cy="90" r="5" class="image" />
  </g>
</svg>