<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cyclone</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪkloʊn] n. 旋风，龙卷风</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cycl(o)- (圆) + -one (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"圆(cyclo-)"形风暴，
    <tspan x="50" dy="25">旋转着席卷一切，这就是旋风(cyclone)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cyclone destroyed several houses in the village.
  </text>
  <text x="50" y="310" class="content">
    旋风摧毁了村庄里的几栋房子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cyclone -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="95" y1="100" x2="255" y2="100" class="image" />
    <line x1="135" y1="60" x2="215" y2="140" class="image" />
    <line x1="215" y1="60" x2="135" y2="140" class="image" />
    <!-- Houses -->
    <rect x="50" y="150" width="50" height="30" class="image" />
    <rect x="200" y="150" width="50" height="30" class="image" />
  </g>
</svg>