<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swoon</text>
  <text x="50" y="120" class="subtitle">[swuːn] v. 昏厥，陶醉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swoon (源自中古英语 swon, 意为昏厥)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为过度陶醉而"昏厥(swoon)"，
    <tspan x="50" dy="25">他的身体突然软倒，仿佛被一股无形的力量击倒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She swooned at the sight of the beautiful sunset.
  </text>
  <text x="50" y="310" class="content">
    她看到美丽的日落时陶醉得昏厥了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person swooning -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <!-- Sun -->
    <circle cx="200" cy="50" r="30" class="image" />
    <!-- Rays -->
    <line x1="200" y1="20" x2="200" y2="0" class="image" />
    <line x1="230" y1="50" x2="250" y2="50" class="image" />
    <line x1="170" y1="50" x2="150" y2="50" class="image" />
    <line x1="200" y1="80" x2="200" y2="100" class="image" />
  </g>
</svg>