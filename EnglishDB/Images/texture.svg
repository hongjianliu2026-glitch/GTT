<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">texture</text>
  <text x="50" y="120" class="subtitle">[ˈtɛkstʃər] n. 质地，纹理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> text (编织) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块布料，"编织(text)"出不同的"质地(texture)"，
    <tspan x="50" dy="25">有的光滑，有的粗糙，这就是纹理(texture)的奇妙之处。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The texture of the fabric feels soft and smooth.
  </text>
  <text x="50" y="310" class="content">
    这块布料的质地感觉柔软而光滑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Fabric texture -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="20" x2="50" y2="200" class="image" />
    <line x1="100" y1="20" x2="100" y2="200" class="image" />
    <line x1="150" y1="20" x2="150" y2="200" class="image" />
    <line x1="200" y1="20" x2="200" y2="200" class="image" />
    <line x1="250" y1="20" x2="250" y2="200" class="image" />
    <line x1="300" y1="20" x2="300" y2="200" class="image" />
  </g>
</svg>