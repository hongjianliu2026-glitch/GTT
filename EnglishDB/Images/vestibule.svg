<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vestibule</text>
  <text x="50" y="120" class="subtitle">[ˈvɛstɪbjuːl] n. 门厅，前厅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vesti- (衣服) + -bule (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着华丽衣服的人，站在一个小空间里，
    <tspan x="50" dy="25">这个小空间就是门厅(vestibule)，用来整理衣服和准备进入更大的空间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She waited in the vestibule before entering the grand hall.
  </text>
  <text x="50" y="310" class="content">
    她在进入大厅之前，在门厅里等候。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vestibule -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="50" y="50" width="100" height="150" class="image" />
    <!-- Person -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="210" class="image" />
    <line x1="250" y1="180" x2="270" y2="210" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Clothes -->
    <rect x="230" y="80" width="40" height="20" class="image" />
    <rect x="240" y="60" width="20" height="20" class="image" />
  </g>
</svg>