<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antelope</text>
  <text x="50" y="120" class="subtitle">[ˈæntɪˌloʊp] n. 羚羊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ant- (蚂蚁) + -el (小) + -ope (动物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小蚂蚁(ant-)和一只小动物(-el)在草原上奔跑，
    <tspan x="50" dy="25">这只小动物就是羚羊(antelope)，它们一起在草原上跳跃。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The antelope gracefully leaped over the fence.
  </text>
  <text x="50" y="310" class="content">
    羚羊优雅地跃过了篱笆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Antelope -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- Ant -->
    <circle cx="250" cy="100" r="10" class="image" />
    <line x1="250" y1="110" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="220" y2="120" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>