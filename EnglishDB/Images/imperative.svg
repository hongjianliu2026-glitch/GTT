<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imperative</text>
  <text x="50" y="120" class="subtitle">[ɪmˈperətɪv] adj. 必要的，命令的；n. 命令，必要的事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + per (尝试) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个将军站在高台上，"进入(im-)"
    <tspan x="50" dy="25">战场，尝试(per)指挥士兵，</tspan>
    <tspan x="50" dy="25">他的命令是绝对必要的(imperative)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It is imperative that we finish this project on time.
  </text>
  <text x="50" y="310" class="content">
    我们必须按时完成这个项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- General on a platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="140" x2="250" y2="130" class="image" />
    <!-- Soldiers -->
    <circle cx="100" cy="150" r="10" class="image" />
    <line x1="100" y1="160" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="90" y2="200" class="image" />
    <line x1="100" y1="180" x2="110" y2="200" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <line x1="150" y1="160" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="140" y2="200" class="image" />
    <line x1="150" y1="180" x2="160" y2="200" class="image" />
  </g>
</svg>