<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dispersed</text>
  <text x="50" y="120" class="subtitle">[dɪˈspɜːrst] adj. 分散的，散布的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + pers (散开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群鸟儿从树上飞起，"分开散开(dis-pers)"
    <tspan x="50" dy="25">到天空中，形成一幅分散的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd dispersed after the concert.
  </text>
  <text x="50" y="310" class="content">
    音乐会结束后，人群散开了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Birds -->
    <circle cx="120" cy="50" r="10" class="image" />
    <circle cx="150" cy="70" r="10" class="image" />
    <circle cx="180" cy="90" r="10" class="image" />
    <circle cx="210" cy="110" r="10" class="image" />
    <circle cx="240" cy="130" r="10" class="image" />
    <circle cx="270" cy="150" r="10" class="image" />
    <circle cx="300" cy="170" r="10" class="image" />
    <circle cx="330" cy="190" r="10" class="image" />
    <circle cx="360" cy="210" r="10" class="image" />
    <circle cx="390" cy="230" r="10" class="image" />
    <circle cx="420" cy="250" r="10" class="image" />
    <circle cx="450" cy="270" r="10" class="image" />
    <circle cx="480" cy="290" r="10" class="image" />
    <circle cx="510" cy="310" r="10" class="image" />
    <circle cx="540" cy="330" r="10" class="image" />
    <circle cx="570" cy="350" r="10" class="image" />
    <circle cx="600" cy="370" r="10" class="image" />
    <circle cx="630" cy="390" r="10" class="image" />
    <circle cx="660" cy="410" r="10" class="image" />
    <circle cx="690" cy="430" r="10" class="image" />
    <circle cx="720" cy="450" r="10" class="image" />
    <circle cx="750" cy="470" r="10" class="image" />
    <circle cx="780" cy="490" r="10" class="image" />
  </g>
</svg>