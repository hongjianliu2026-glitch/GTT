<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ascendancy</text>
  <text x="50" y="120" class="subtitle">[əˈsendənsi] n. 优势，支配地位</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 ascendere (上升)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在山顶，象征着"上升(ascend)"到
    <tspan x="50" dy="25">优势地位(ascendancy)，俯视着山下的其他人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company gained ascendancy in the market.
  </text>
  <text x="50" y="310" class="content">
    这家公司在市场上获得了优势。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Person on top -->
    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="120" y2="90" class="image" />
    <line x1="150" y1="80" x2="180" y2="90" class="image" />
  </g>
</svg>