<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #4A4A4A; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #FF6F61; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">honeymoon</text>
  <text x="50" y="120" class="subtitle">[ˈhʌnɪmuːn] n. 蜜月</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> honey (蜂蜜) + moon (月亮)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一对新婚夫妇在月光下，"蜜月(honey-moon)"
    <tspan x="50" dy="25">的甜蜜时光，就像蜂蜜一样甜。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They went to Bali for their honeymoon.
  </text>
  <text x="50" y="310" class="content">
    他们去巴厘岛度蜜月。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Couple -->
    <circle cx="70" cy="120" r="10" class="image" fill="#FF6F61" />
    <circle cx="130" cy="120" r="10" class="image" fill="#FF6F61" />
    <line x1="70" y1="130" x2="130" y2="130" class="image" />
    <!-- Honey -->
    <rect x="50" y="150" width="100" height="20" class="image" fill="#FFD700" />
    <text x="90" y="165" class="content" fill="#333333">Honey</text>
  </g>
</svg>