<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .oil { fill: #333333; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">petroleum</text>
  <text x="50" y="120" class="subtitle">[pəˈtroʊliəm] n. 石油</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> petro- (石头) + -leum (油)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在地下深处，"石头(petro-)"中蕴藏着"油(leum)"，
    <tspan x="50" dy="25">这些油就是石油(petroleum)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The country relies heavily on petroleum for its economy.
  </text>
  <text x="50" y="310" class="content">
    这个国家的经济严重依赖石油。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Oil well -->
    <line x1="175" y1="0" x2="175" y2="100" class="image" />
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Oil -->
    <ellipse cx="175" cy="150" rx="50" ry="20" class="oil" />
    <!-- Rocks -->
    <rect x="100" y="180" width="50" height="20" class="image" />
    <rect x="200" y="180" width="50" height="20" class="image" />
  </g>
</svg>