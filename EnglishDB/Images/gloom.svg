<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #8B0000; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #000000; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gloom</text>
  <text x="50" y="120" class="subtitle">[ɡluːm] n. 忧郁，阴暗；v. 变阴暗，显得阴郁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glo- (黑暗) + -om (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阴暗的房间，"黑暗(glo-)"笼罩着整个空间，
    <tspan x="50" dy="25">让人感到"忧郁(gloom)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news cast a gloom over the entire office.
  </text>
  <text x="50" y="310" class="content">
    这个消息让整个办公室笼罩在忧郁之中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dark cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Light rays trying to penetrate -->
    <line x1="20" y1="20" x2="330" y2="20" class="image" />
    <line x1="20" y1="40" x2="330" y2="40" class="image" />
    <line x1="20" y1="60" x2="330" y2="60" class="image" />
    <line x1="20" y1="80" x2="330" y2="80" class="image" />
    <line x1="20" y1="100" x2="330" y2="100" class="image" />
    <line x1="20" y1="120" x2="330" y2="120" class="image" />
    <line x1="20" y1="140" x2="330" y2="140" class="image" />
    <line x1="20" y1="160" x2="330" y2="160" class="image" />
    <line x1="20" y1="180" x2="330" y2="180" class="image" />
  </g>
</svg>