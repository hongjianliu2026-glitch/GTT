<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aneurysm</text>
  <text x="50" y="120" class="subtitle">[ˈænjəˌrɪzəm] n. 动脉瘤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aneurys- (扩张) + -m (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条血管突然"扩张(aneurys-)"，
    <tspan x="50" dy="25">像气球一样膨胀，这就是动脉瘤(aneurysm)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor discovered an aneurysm in his artery.
  </text>
  <text x="50" y="310" class="content">
    医生在他的动脉中发现了一个动脉瘤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Normal artery -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <!-- Aneurysm -->
    <circle cx="175" cy="50" r="50" class="image" />
    <!-- Blood flow -->
    <line x1="50" y1="50" x2="125" y2="50" class="image" />
    <line x1="225" y1="50" x2="300" y2="50" class="image" />
  </g>
</svg>