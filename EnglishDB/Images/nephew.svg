<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nephew</text>
  <text x="50" y="120" class="subtitle">[ˈnɛfjuː] n. 侄子，外甥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nep- (侄子) + hew (后代)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭聚会，一个"侄子(nep-hew)"
    <tspan x="50" dy="25">在人群中跑来跑去，他是家族的后代(hew)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My nephew is always full of energy.
  </text>
  <text x="50" y="310" class="content">
    我的侄子总是充满活力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family gathering -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Nephew -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Family members -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="200" cy="150" r="20" class="image" />
  </g>
</svg>