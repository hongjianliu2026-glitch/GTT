<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quarry</text>
  <text x="50" y="120" class="subtitle">[ˈkwɒri] n. 采石场，猎物；v. 采石，猎取</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quarr (石头) + -y (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头山，工人们正在"采石(quarr-y)"，
    <tspan x="50" dy="25">这个场所就是采石场(quarry)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The workers were busy quarrying stone from the mountain.
  </text>
  <text x="50" y="310" class="content">
    工人们正忙着从山上采石。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 175,0 350,200" class="image" />
    <!-- Workers -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Stone -->
    <rect x="200" y="150" width="50" height="50" class="image" />
    <line x1="225" y1="150" x2="225" y2="200" class="image" />
    <line x1="200" y1="175" x2="250" y2="175" class="image" />
  </g>
</svg>