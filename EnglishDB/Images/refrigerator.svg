<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">refrigerator</text>
  <text x="50" y="120" class="subtitle">[rɪˈfrɪdʒəreɪtər] n. 冰箱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + friger (冷) + -ator (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的冰箱，"再次冷却(re-friger)"
    <tspan x="50" dy="25">食物，保持它们的新鲜，这个工具就是冰箱(refrigerator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stored the leftovers in the refrigerator.
  </text>
  <text x="50" y="310" class="content">
    她把剩菜放在冰箱里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Refrigerator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Handle -->
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- Ice cubes -->
    <rect x="70" y="50" width="20" height="20" class="image" />
    <rect x="100" y="50" width="20" height="20" class="image" />
    <rect x="130" y="50" width="20" height="20" class="image" />
    <!-- Food items -->
    <rect x="70" y="80" width="20" height="20" class="image" />
    <rect x="100" y="80" width="20" height="20" class="image" />
    <rect x="130" y="80" width="20" height="20" class="image" />
  </g>
</svg>