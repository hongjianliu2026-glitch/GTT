<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">partition</text>
  <text x="50" y="120" class="subtitle">[pɑːrˈtɪʃn] n. 分区，隔板；v. 分割，隔开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> part (部分) + -ition (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的房间被"部分(part)"隔开，形成多个小空间，
    <tspan x="50" dy="25">这些隔板就是分区(partition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was partitioned into several smaller sections.
  </text>
  <text x="50" y="310" class="content">
    房间被分隔成了几个小区域。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Partition lines -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Partition labels -->
    <text x="50" y="100" class="content" text-anchor="middle" transform="rotate(-90 50 100)">Part 1</text>
    <text x="150" y="100" class="content" text-anchor="middle" transform="rotate(-90 150 100)">Part 2</text>
    <text x="250" y="100" class="content" text-anchor="middle" transform="rotate(-90 250 100)">Part 3</text>
  </g>
</svg>