<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flint</text>
  <text x="50" y="120" class="subtitle">[flɪnt] n. 燧石，打火石</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flint (燧石)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始人手持燧石，"啪"的一声，
    <tspan x="50" dy="25">燧石碰撞出火花，点燃了篝火，温暖了整个夜晚。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hunter used a piece of flint to start a fire.
  </text>
  <text x="50" y="310" class="content">
    猎人用一块燧石生火。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flint -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <!-- Spark -->
    <circle cx="120" cy="25" r="10" class="image" />
    <circle cx="140" cy="25" r="10" class="image" />
    <circle cx="160" cy="25" r="10" class="image" />
    <!-- Fire -->
    <line x1="180" y1="25" x2="200" y2="5" class="image" />
    <line x1="180" y1="25" x2="200" y2="45" class="image" />
    <line x1="200" y1="5" x2="220" y2="25" class="image" />
    <line x1="200" y1="45" x2="220" y2="25" class="image" />
    <!-- Hunter -->
    <circle cx="250" cy="25" r="20" class="image" />
    <line x1="250" y1="45" x2="250" y2="80" class="image" />
    <line x1="250" y1="60" x2="230" y2="70" class="image" />
    <line x1="250" y1="60" x2="270" y2="70" class="image" />
    <line x1="250" y1="80" x2="230" y2="100" class="image" />
    <line x1="250" y1="80" x2="270" y2="100" class="image" />
  </g>
</svg>