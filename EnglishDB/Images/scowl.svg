<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scowl</text>
  <text x="50" y="120" class="subtitle">[skaʊl] v. 皱眉，怒视；n. 怒容</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scowl (源自中古英语 scowle，意为“皱眉”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为生气而"皱起(scowl)"眉头，
    <tspan x="50" dy="25">脸上露出怒容，仿佛要把对方吓跑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gave me a scowl when I interrupted him.
  </text>
  <text x="50" y="310" class="content">
    我打断他时，他对我怒目而视。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Scowling eyebrows -->
    <line x1="40" y1="60" x2="80" y2="50" class="image" />
    <line x1="120" y1="50" x2="160" y2="60" class="image" />
    <!-- Mouth -->
    <path d="M 60 140 Q 100 160 140 140" class="image" />
  </g>
</svg>