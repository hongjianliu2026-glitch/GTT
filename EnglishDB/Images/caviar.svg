<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">caviar</text>
  <text x="50" y="120" class="subtitle">[ˈkæviɑr] n. 鱼子酱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cav(e) (洞) + -ar (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的鱼，它的肚子里有一个"洞(cav)"，
    <tspan x="50" dy="25">里面装满了珍贵的鱼子，这些鱼子就是鱼子酱(caviar)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She served caviar at her luxurious dinner party.
  </text>
  <text x="50" y="310" class="content">
    她在豪华的晚宴上提供了鱼子酱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <circle cx="230" cy="100" r="20" class="image" />
    <line x1="230" y1="120" x2="230" y2="150" class="image" />
    <line x1="230" y1="150" x2="210" y2="180" class="image" />
    <line x1="230" y1="150" x2="250" y2="180" class="image" />
    <!-- Caviar -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
    <circle cx="160" cy="100" r="10" class="image" />
    <circle cx="180" cy="100" r="10" class="image" />
  </g>
</svg>