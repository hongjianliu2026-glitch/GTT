<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dog</text>
  <text x="50" y="120" class="subtitle">[dɔɡ] n. 狗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "dogge"，可能与古英语 "docga" 有关，意为“强壮的狗”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只忠诚的狗，"docga"（强壮的狗）在主人身边守护，
    <tspan x="50" dy="25">它的存在让人感到安全和温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog barked loudly when a stranger approached.
  </text>
  <text x="50" y="310" class="content">
    当陌生人靠近时，狗大声吠叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Dog head -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Dog ears -->
    <polygon points="70,50 80,20 90,50" class="image" />
    <polygon points="110,50 120,20 130,50" class="image" />
    <!-- Dog eyes -->
    <circle cx="85" cy="45" r="5" class="image" />
    <circle cx="115" cy="45" r="5" class="image" />
    <!-- Dog nose -->
    <circle cx="100" cy="60" r="5" class="image" />
    <!-- Dog mouth -->
    <line x1="90" y1="70" x2="110" y2="70" class="image" />
    <!-- Dog tail -->
    <path d="M 150,100 Q 170,80 150,60" class="image" />
  </g>
</svg>