<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">big</text>
  <text x="50" y="120" class="subtitle">[bɪɡ] adj. 大的，巨大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (双) + -g (表示大小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的双层蛋糕，"双倍(bi-)大(g)"
    <tspan x="50" dy="25">的蛋糕让人惊叹不已，这就是"大(big)"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The big elephant was standing in the middle of the field.
  </text>
  <text x="50" y="310" class="content">
    那只巨大的大象站在田野中央。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cake layers -->
    <rect x="50" y="20" width="250" height="40" class="image" />
    <rect x="70" y="80" width="210" height="40" class="image" />
    <rect x="90" y="140" width="170" height="40" class="image" />
    <!-- Candle -->
    <line x1="180" y1="180" x2="180" y2="220" class="image" />
    <circle cx="180" cy="220" r="10" class="image" />
  </g>
</svg>