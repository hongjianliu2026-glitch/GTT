<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">camcorder</text>
  <text x="50" y="120" class="subtitle">[ˈkæmkɔːrdər] n. 摄像机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cam (camera, 相机) + cord (record, 记录) + er (设备)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摄影师拿着"相机(cam)"，
    <tspan x="50" dy="25">边走边"记录(cord)"，这个设备就是摄像机(camcorder)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a camcorder to capture the wedding ceremony.
  </text>
  <text x="50" y="310" class="content">
    他用摄像机记录了婚礼仪式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camera body -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Lens -->
    <circle cx="100" cy="75" r="30" class="image" />
    <!-- Viewfinder -->
    <rect x="150" y="20" width="30" height="20" class="image" />
    <!-- Recorder -->
    <rect x="50" y="160" width="100" height="30" class="image" />
    <!-- Photographer -->
    <circle cx="100" cy="220" r="20" class="image" />
    <line x1="100" y1="240" x2="100" y2="280" class="image" />
    <line x1="100" y1="280" x2="80" y2="310" class="image" />
    <line x1="100" y1="280" x2="120" y2="310" class="image" />
    <line x1="100" y1="260" x2="140" y2="250" class="image" />
  </g>
</svg>