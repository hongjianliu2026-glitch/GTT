<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plumb</text>
  <text x="50" y="120" class="subtitle">[plʌm] v. 用铅锤测量，探测；adj. 垂直的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plumb (铅锤)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人手持"铅锤(plumb)"，
    <tspan x="50" dy="25">垂直地测量墙壁的垂直度，确保一切都是直的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The builder used a plumb line to ensure the wall was straight.
  </text>
  <text x="50" y="310" class="content">
    建筑工人用铅垂线确保墙壁是直的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Worker -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="240" class="image" />
    <line x1="50" y1="200" x2="70" y2="240" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />

    <!-- Plumb line -->
    <line x1="100" y1="50" x2="100" y2="250" class="image" />
    <circle cx="100" cy="50" r="5" class="image" />
  </g>
</svg>