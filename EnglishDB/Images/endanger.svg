<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">endanger</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdeɪndʒər] v. 危及，使处于危险</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + danger (危险)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟被"使(en)"入"危险(danger)"的境地，
    <tspan x="50" dy="25">它的巢穴被风暴摧毁，这就是"危及(endanger)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Pollution endangers the health of many species.
  </text>
  <text x="50" y="310" class="content">
    污染危及许多物种的健康。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird's nest -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <line x1="90" y1="80" x2="110" y2="80" class="image" />
    <line x1="100" y1="60" x2="100" y2="120" class="image" />
    <!-- Storm cloud -->
    <ellipse cx="200" cy="50" rx="50" ry="30" class="image" />
    <line x1="180" y1="50" x2="220" y2="50" class="image" />
    <line x1="190" y1="30" x2="210" y2="30" class="image" />
    <line x1="200" y1="10" x2="200" y2="70" class="image" />
    <!-- Lightning bolt -->
    <line x1="190" y1="10" x2="210" y2="70" class="image" />
    <line x1="210" y1="10" x2="190" y2="70" class="image" />
  </g>
</svg>