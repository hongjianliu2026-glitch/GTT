<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coronary</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːrəneri] adj. 冠状的，冠的；n. 冠状动脉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> coro- (冠) + nary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗心脏，"冠(coro-)"状的动脉环绕着它，
    <tspan x="50" dy="25">就像一顶王冠戴在心脏上，这就是冠状动脉(coronary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was diagnosed with coronary artery disease.
  </text>
  <text x="50" y="310" class="content">
    他被诊断出患有冠状动脉疾病。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart -->
    <circle cx="100" cy="100" r="50" class="image" />
    <path d="M 50 100 Q 75 50 100 100 Q 125 150 150 100" class="image" />
    <!-- Coronary arteries -->
    <path d="M 100 50 Q 150 20 200 50" class="image" />
    <path d="M 100 150 Q 150 180 200 150" class="image" />
    <path d="M 50 100 Q 0 70 50 40" class="image" />
    <path d="M 150 100 Q 200 70 150 40" class="image" />
  </g>
</svg>