<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skirmish</text>
  <text x="50" y="120" class="subtitle">[ˈskɜːrmɪʃ] n. 小规模战斗，小冲突</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skir- (分开) + -mish (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两支小队在战场上"分开(skir-)"，进行一场小规模的"动作(mish)"，
    <tspan x="50" dy="25">这就是一场小规模战斗(skirmish)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers engaged in a brief skirmish before retreating.
  </text>
  <text x="50" y="310" class="content">
    士兵们在撤退前进行了一场短暂的交火。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soldiers -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Weapons -->
    <line x1="60" y1="115" x2="80" y2="135" class="image" />
    <line x1="110" y1="115" x2="130" y2="135" class="image" />
    <line x1="260" y1="115" x2="280" y2="135" class="image" />
    <line x1="310" y1="115" x2="330" y2="135" class="image" />
    <!-- Separating line -->
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
  </g>
</svg>