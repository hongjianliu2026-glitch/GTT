<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">condiment</text>
  <text x="50" y="120" class="subtitle">[ˈkɒndɪmənt] n. 调味品，佐料</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + di- (分开) + ment (思考)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"一起思考(con-di-ment)"
    <tspan x="50" dy="25">如何将各种调味品(condiment)混合，</tspan>
    <tspan x="50" dy="25">以提升食物的味道。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added some hot sauce as a condiment to her dish.
  </text>
  <text x="50" y="310" class="content">
    她在菜里加了一些辣酱作为调味品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Kitchen counter -->
    <rect x="50" y="20" width="300" height="160" class="image" />
    <!-- Condiments -->
    <rect x="70" y="40" width="40" height="40" class="image" />
    <rect x="130" y="40" width="40" height="40" class="image" />
    <rect x="190" y="40" width="40" height="40" class="image" />
    <rect x="250" y="40" width="40" height="40" class="image" />
    <!-- Dots representing spices -->
    <circle cx="80" cy="60" r="3" class="image" />
    <circle cx="140" cy="60" r="3" class="image" />
    <circle cx="200" cy="60" r="3" class="image" />
    <circle cx="260" cy="60" r="3" class="image" />
  </g>
</svg>