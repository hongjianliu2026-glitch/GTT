<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #E67E22; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">noon</text>
  <text x="50" y="120" class="subtitle">[nuːn] n. 中午，正午</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> no- (没有) + on (在上面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳在天空的"正上方(no-on)"，
    <tspan x="50" dy="25">没有东西遮挡，这就是中午(noon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We have lunch at noon every day.
  </text>
  <text x="50" y="310" class="content">
    我们每天中午吃午饭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="200" cy="150" r="50" fill="#F1C40F" />
    <!-- Sky -->
    <rect x="0" y="0" width="400" height="300" fill="#3498DB" />
    <!-- Ground -->
    <rect x="0" y="250" width="400" height="50" fill="#2ECC71" />
    <!-- Sun rays -->
    <line x1="200" y1="100" x2="200" y2="20" class="image" />
    <line x1="250" y1="100" x2="300" y2="20" class="image" />
    <line x1="150" y1="100" x2="100" y2="20" class="image" />
    <line x1="200" y1="200" x2="200" y2="280" class="image" />
    <line x1="250" y1="200" x2="300" y2="280" class="image" />
    <line x1="150" y1="200" x2="100" y2="280" class="image" />
  </g>
</svg>