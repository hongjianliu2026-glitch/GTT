<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glider</text>
  <text x="50" y="120" class="subtitle">[ˈɡlaɪdər] n. 滑翔机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glide (滑行) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架滑翔机在空中"滑行(glide)"，
    <tspan x="50" dy="25">它轻盈地飞翔，仿佛在空中舞蹈。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The glider soared gracefully over the mountains.
  </text>
  <text x="50" y="310" class="content">
    滑翔机优雅地在山脉上空翱翔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glider -->
    <polyline points="0,100 50,50 100,100" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="0" y2="200" class="image" />
    <line x1="50" y1="150" x2="100" y2="200" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="300" fill="#87CEEB" />
    <!-- Mountains -->
    <polyline points="0,300 50,250 100,300" fill="none" stroke="#6A5ACD" stroke-width="2" />
    <polyline points="100,300 150,250 200,300" fill="none" stroke="#6A5ACD" stroke-width="2" />
    <polyline points="200,300 250,250 300,300" fill="none" stroke="#6A5ACD" stroke-width="2" />
  </g>
</svg>