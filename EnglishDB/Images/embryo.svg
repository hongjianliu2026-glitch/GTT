<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">embryo</text>
  <text x="50" y="120" class="subtitle">[ˈɛmbrioʊ] n. 胚胎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (在...之中) + bryo (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微小的生命在母体中"生长(bryo)"，
    <tspan x="50" dy="25">这个生命体就是胚胎(embryo)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scientist studied the development of the embryo.
  </text>
  <text x="50" y="310" class="content">
    科学家研究了胚胎的发育过程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Egg -->
    <ellipse cx="175" cy="100" rx="100" ry="60" class="image" />
    <!-- Embryo -->
    <circle cx="175" cy="100" r="20" class="image" />
    <!-- Mother -->
    <circle cx="175" cy="250" r="50" class="image" />
    <line x1="175" y1="300" x2="175" y2="400" class="image" />
    <line x1="175" y1="350" x2="125" y2="320" class="image" />
    <line x1="175" y1="350" x2="225" y2="320" class="image" />
    <line x1="175" y1="400" x2="125" y2="450" class="image" />
    <line x1="175" y1="400" x2="225" y2="450" class="image" />
  </g>
</svg>