<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F39C12; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .star { fill: #F1C40F; }
      .balloon { fill: #E74C3C; }
      .tree { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">festive</text>
  <text x="50" y="120" class="subtitle">[ˈfɛstɪv] adj. 节日的，喜庆的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fest (节日) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满节日气氛的场景，"节日(fest)"
    <tspan x="50" dy="25">的氛围(festive)让人感到欢乐和喜庆。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The town was decorated with festive lights.
  </text>
  <text x="50" y="310" class="content">
    小镇被节日的灯光装饰得五彩缤纷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <polygon points="0,50 25,0 50,50" class="star" />
    <!-- Balloons -->
    <circle cx="100" cy="50" r="20" class="balloon" />
    <circle cx="150" cy="50" r="20" class="balloon" />
    <!-- Tree -->
    <polygon points="200,50 250,0 300,50" class="tree" />
    <polygon points="210,30 250,10 290,30" class="tree" />
    <polygon points="220,10 250,0 280,10" class="tree" />
  </g>
</svg>