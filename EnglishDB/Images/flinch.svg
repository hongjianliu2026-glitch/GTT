<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flinch</text>
  <text x="50" y="120" class="subtitle">[flɪntʃ] v. 退缩，畏缩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fl- (飞) + inch (英寸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面对突如其来的危险，"飞快地退缩(fl-inch)"
    <tspan x="50" dy="25">了一英寸，表现出明显的畏缩。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She flinched when the loud noise suddenly erupted.
  </text>
  <text x="50" y="310" class="content">
    当突然发出巨大的噪音时，她畏缩了一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person flinching -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Flinch movement -->
    <line x1="50" y1="120" x2="30" y2="100" class="image" /> <!-- Flinch line -->
    <text x="30" y="90" class="content" style="font-size: 12px;">flinch</text>
  </g>
</svg>