<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unfamiliar</text>
  <text x="50" y="120" class="subtitle">[ˌʌnfəˈmɪliər] adj. 不熟悉的，陌生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + familiar (熟悉的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个陌生的城市街头，周围的一切都"不熟悉(un-familiar)"，
    <tspan x="50" dy="25">他感到迷茫和不安。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The streets of Tokyo were unfamiliar to him.
  </text>
  <text x="50" y="310" class="content">
    东京的街道对他来说很陌生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Question marks -->
    <text x="100" y="100" class="content">???</text>
    <text x="150" y="100" class="content">???</text>
    <text x="200" y="100" class="content">???</text>
  </g>
</svg>