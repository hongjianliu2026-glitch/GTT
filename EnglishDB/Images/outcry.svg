<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outcry</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtˌkraɪ] n. 大声疾呼，强烈抗议</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (向外) + cry (喊叫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在街头，"向外喊叫(out-cry)"
    <tspan x="50" dy="25">表达他们的强烈不满，这就是大声疾呼(outcry)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The public outcry forced the government to reconsider its policy.
  </text>
  <text x="50" y="310" class="content">
    公众的强烈抗议迫使政府重新考虑其政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowd -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Speech bubbles -->
    <path d="M 50 80 Q 30 60 50 40 Q 70 60 50 80" class="image" />
    <path d="M 100 80 Q 80 60 100 40 Q 120 60 100 80" class="image" />
    <path d="M 150 80 Q 130 60 150 40 Q 170 60 150 80" class="image" />
    <path d="M 200 80 Q 180 60 200 40 Q 220 60 200 80" class="image" />
    <!-- Outstretched arms -->
    <line x1="50" y1="115" x2="30" y2="150" class="image" />
    <line x1="50" y1="115" x2="70" y2="150" class="image" />
    <line x1="100" y1="115" x2="80" y2="150" class="image" />
    <line x1="100" y1="115" x2="120" y2="150" class="image" />
    <line x1="150" y1="115" x2="130" y2="150" class="image" />
    <line x1="150" y1="115" x2="170" y2="150" class="image" />
    <line x1="200" y1="115" x2="180" y2="150" class="image" />
    <line x1="200" y1="115" x2="220" y2="150" class="image" />
  </g>
</svg>