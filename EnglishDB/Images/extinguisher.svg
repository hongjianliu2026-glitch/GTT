<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extinguisher</text>
  <text x="50" y="120" class="subtitle">[ɪkˈstɪŋɡwɪʃər] n. 灭火器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + tinguish (熄灭) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的灭火器，"喷出(ex-)"
    <tspan x="50" dy="25">强大的水流，瞬间"熄灭(tinguish)"</tspan>
    <tspan x="50" dy="25">熊熊烈火，这就是灭火器(extinguisher)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fire extinguisher was used to put out the kitchen fire.
  </text>
  <text x="50" y="310" class="content">
    灭火器被用来扑灭厨房的火。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire extinguisher -->
    <rect x="0" y="0" width="100" height="300" class="image" />
    <rect x="20" y="20" width="60" height="260" class="image" />
    <!-- Water spray -->
    <line x1="50" y1="300" x2="50" y2="350" class="image" />
    <line x1="50" y1="350" x2="30" y2="400" class="image" />
    <line x1="50" y1="350" x2="70" y2="400" class="image" />
    <line x1="50" y1="350" x2="50" y2="400" class="image" />
    <!-- Fire -->
    <polygon points="150,300 200,300 175,250" class="image" />
    <polygon points="150,280 200,280 175,230" class="image" />
    <polygon points="150,260 200,260 175,210" class="image" />
  </g>
</svg>