<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">granddaughter</text>
  <text x="50" y="120" class="subtitle">[ˈɡrænˌdɔːtər] n. 孙女，外孙女</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grand- (大的) + daughter (女儿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"大(grand)"家庭中，有一个小女孩，她是"女儿(daughter)"的"女儿(daughter)"，
    <tspan x="50" dy="25">她就是"孙女(granddaughter)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves spending time with her granddaughter.
  </text>
  <text x="50" y="310" class="content">
    她喜欢和她的孙女一起度过时光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grandmother -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <!-- Daughter -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="190" y2="120" class="image" />

    <!-- Granddaughter -->
    <circle cx="250" cy="100" r="10" class="image" />
    <line x1="250" y1="110" x2="250" y2="140" class="image" />
    <line x1="250" y1="140" x2="230" y2="170" class="image" />
    <line x1="250" y1="140" x2="270" y2="170" class="image" />
    <line x1="250" y1="120" x2="290" y2="110" class="image" />

    <!-- Family connection -->
    <line x1="70" y1="120" x2="140" y2="120" class="image" />
    <line x1="165" y1="120" x2="240" y2="120" class="image" />
  </g>
</svg>