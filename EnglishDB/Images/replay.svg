<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">replay</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈpleɪ] v. 重放，重新比赛；n. 重放，重赛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + play (播放)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个视频播放器，"再次播放(re-play)"
    <tspan x="50" dy="25">一段精彩的片段，这就是重放(replay)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coach asked for a replay of the last goal.
  </text>
  <text x="50" y="310" class="content">
    教练要求重放最后一个进球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Video player -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Screen -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Play button -->
    <polygon points="175,100 150,130 200,130" class="image" />
    <!-- Replay arrow -->
    <polyline points="220,100 250,100 250,130 220,130" class="image" />
    <line x1="250" y1="115" x2="270" y2="115" class="image" />
    <line x1="270" y1="115" x2="260" y2="105" class="image" />
    <line x1="270" y1="115" x2="260" y2="125" class="image" />
  </g>
</svg>