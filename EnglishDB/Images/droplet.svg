<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .droplet { fill: #1ABC9C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">droplet</text>
  <text x="50" y="120" class="subtitle">[ˈdrɒplɪt] n. 小滴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drop (滴) + -let (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一滴水从天而降，"滴(drop)"
    <tspan x="50" dy="25">下来变成了一颗小小的水滴(droplet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The droplet of water glistened in the sunlight.
  </text>
  <text x="50" y="310" class="content">
    水滴在阳光下闪闪发光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Droplet -->
    <ellipse cx="100" cy="100" rx="50" ry="70" class="droplet" />
    <!-- Sun -->
    <circle cx="250" cy="100" r="40" fill="#F1C40F" />
    <!-- Sun rays -->
    <line x1="250" y1="60" x2="250" y2="20" class="image" />
    <line x1="280" y1="70" x2="320" y2="30" class="image" />
    <line x1="300" y1="100" x2="340" y2="100" class="image" />
    <line x1="280" y1="130" x2="320" y2="170" class="image" />
    <line x1="250" y1="140" x2="250" y2="180" class="image" />
    <line x1="220" y1="130" x2="180" y2="170" class="image" />
    <line x1="200" y1="100" x2="160" y2="100" class="image" />
    <line x1="220" y1="70" x2="180" y2="30" class="image" />
  </g>
</svg>