<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">benevolent</text>
  <text x="50" y="120" class="subtitle">[bɪˈnɛvələnt] adj. 仁慈的，慈善的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bene- (好) + volent (意愿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个仁慈的老人，"怀着好意(bene-volent)"
    <tspan x="50" dy="25">分发食物给饥饿的孩子们，他的善行让人感到温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The benevolent man donated money to the orphanage.
  </text>
  <text x="50" y="310" class="content">
    那位仁慈的男士向孤儿院捐赠了钱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old man -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Food -->
    <rect x="120" y="80" width="60" height="40" class="image" />
    <rect x="130" y="90" width="40" height="20" class="image" />
    <!-- Children -->
    <circle cx="220" cy="100" r="20" class="image" />
    <line x1="220" y1="120" x2="220" y2="160" class="image" />
    <line x1="220" y1="160" x2="200" y2="200" class="image" />
    <line x1="220" y1="160" x2="240" y2="200" class="image" />
    <line x1="220" y1="140" x2="260" y2="130" class="image" />
  </g>
</svg>