<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">second-floor</text>
  <text x="50" y="120" class="subtitle">[ˈsɛkənd flɔr] n. 二楼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> second (第二) + floor (层)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一栋楼，"第二层(second-floor)"
    <tspan x="50" dy="25">是人们经常聚会的地方，充满了欢声笑语。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The party was held on the second-floor.
  </text>
  <text x="50" y="310" class="content">
    派对在二楼举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Building -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- First floor -->
    <rect x="20" y="20" width="160" height="120" class="image" />
    <!-- Second floor -->
    <rect x="20" y="160" width="160" height="120" class="image" />
    <!-- Windows -->
    <rect x="40" y="40" width="40" height="40" class="image" />
    <rect x="120" y="40" width="40" height="40" class="image" />
    <rect x="40" y="180" width="40" height="40" class="image" />
    <rect x="120" y="180" width="40" height="40" class="image" />
    <!-- People -->
    <circle cx="60" cy="200" r="10" class="image" />
    <circle cx="140" cy="200" r="10" class="image" />
    <line x1="60" y1="210" x2="60" y2="230" class="image" />
    <line x1="140" y1="210" x2="140" y2="230" class="image" />
    <line x1="60" y1="230" x2="50" y2="250" class="image" />
    <line x1="60" y1="230" x2="70" y2="250" class="image" />
    <line x1="140" y1="230" x2="130" y2="250" class="image" />
    <line x1="140" y1="230" x2="150" y2="250" class="image" />
  </g>
</svg>