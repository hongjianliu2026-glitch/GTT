<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #873600; }
      .content { font: 18px sans-serif; fill: #212F3C; }
      .highlight { font-weight: bold; fill: #B03A2E; }
      .story { font: 16px serif; fill: #1A5276; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">black-eyed</text>
  <text x="50" y="120" class="subtitle">[blækˈaɪd] adj. 黑眼睛的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> black (黑色) + eye (眼睛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个有着深邃黑眼睛的人，仿佛他的眼睛是"黑色的(black)"
    <tspan x="50" dy="25">宝石，闪烁着神秘的光芒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has beautiful black-eyed children.
  </text>
  <text x="50" y="310" class="content">
    她有美丽的黑眼睛孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Left eye -->
    <circle cx="60" cy="80" r="20" class="image" fill="#000" />
    <!-- Right eye -->
    <circle cx="140" cy="80" r="20" class="image" fill="#000" />
    <!-- Mouth -->
    <path d="M 60 140 Q 100 160 140 140" class="image" />
  </g>
</svg>