<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reduction</text>
  <text x="50" y="120" class="subtitle">[rɪˈdʌkʃn] n. 减少，缩减</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + duc (引导) + -tion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，"向后引导(re-duc)"
    <tspan x="50" dy="25">空气，逐渐缩小，最终变成了一个小气球，这就是减少(reduction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The reduction in prices attracted more customers.
  </text>
  <text x="50" y="310" class="content">
    价格的降低吸引了更多的顾客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large balloon -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Small balloon -->
    <ellipse cx="150" cy="200" rx="50" ry="25" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="150" x2="150" y2="190" class="image" />
    <polygon points="145,155 150,150 155,155" class="image" />
  </g>
</svg>