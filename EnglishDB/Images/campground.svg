<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">campground</text>
  <text x="50" y="120" class="subtitle">[ˈkæmpɡraʊnd] n. 露营地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> camp (营地) + ground (地面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一片开阔的"地面(ground)"上搭起帐篷，
    <tspan x="50" dy="25">形成了一个热闹的"营地(camp)"，这就是露营地(campground)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We set up our tents at the campground near the lake.
  </text>
  <text x="50" y="310" class="content">
    我们在湖边的露营地搭起了帐篷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tent -->
    <polygon points="50,150 150,150 100,50" class="image" />
    <!-- Another Tent -->
    <polygon points="200,150 300,150 250,50" class="image" />
    <!-- Trees -->
    <line x1="20" y1="150" x2="20" y2="50" class="image" />
    <line x1="30" y1="150" x2="30" y2="70" class="image" />
    <line x1="25" y1="60" x2="35" y2="60" class="image" />
    <!-- Lake -->
    <ellipse cx="175" cy="180" rx="100" ry="20" class="image" />
  </g>
</svg>