<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">society</text>
  <text x="50" y="120" class="subtitle">[səˈsaɪəti] n. 社会，社团</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soci (同伴) + -ety (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人手拉手围成一个圈，象征着"同伴(soci)"
    <tspan x="50" dy="25">在一起形成了一个社会(society)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The society is facing many challenges today.
  </text>
  <text x="50" y="310" class="content">
    当今社会面临着许多挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle of people -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- People -->
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="280" cy="100" r="15" class="image" />
    <circle cx="200" cy="20" r="15" class="image" />
    <circle cx="200" cy="180" r="15" class="image" />
    <!-- Hands -->
    <line x1="135" y1="100" x2="265" y2="100" class="image" />
    <line x1="200" y1="35" x2="200" y2="165" class="image" />
  </g>
</svg>