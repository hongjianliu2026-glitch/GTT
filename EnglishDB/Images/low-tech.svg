<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B7D7D; }
      .content { font: 18px sans-serif; fill: #566573; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">low-tech</text>
  <text x="50" y="120" class="subtitle">[ˌloʊˈtɛk] adj. 低技术的，非高科技的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> low (低的) + tech (技术)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的村庄，"低技术(low-tech)"
    <tspan x="50" dy="25">的工具和方法被用来耕作和建造，</tspan>
    <tspan x="50" dy="25">没有现代高科技的痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The village still uses low-tech farming methods.
  </text>
  <text x="50" y="310" class="content">
    这个村庄仍然使用低技术的耕作方法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old tools -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="70" class="image" />
    <line x1="100" y1="20" x2="100" y2="70" class="image" />
    <line x1="75" y1="70" x2="75" y2="120" class="image" />
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <!-- Old house -->
    <rect x="150" y="20" width="150" height="100" class="image" />
    <line x1="150" y1="20" x2="300" y2="20" class="image" />
    <line x1="150" y1="20" x2="150" y2="120" class="image" />
    <line x1="300" y1="20" x2="300" y2="120" class="image" />
    <line x1="150" y1="120" x2="300" y2="120" class="image" />
    <!-- Farmer -->
    <circle cx="225" cy="150" r="15" class="image" />
    <line x1="225" y1="165" x2="225" y2="190" class="image" />
    <line x1="225" y1="190" x2="200" y2="220" class="image" />
    <line x1="225" y1="190" x2="250" y2="220" class="image" />
    <line x1="225" y1="175" x2="275" y2="165" class="image" />
  </g>
</svg>