<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">toothless</text>
  <text x="50" y="120" class="subtitle">[ˈtuːθləs] adj. 无牙的，无力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tooth (牙齿) + -less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只老虎失去了所有的牙齿，变得"无牙(toothless)"，
    <tspan x="50" dy="25">它再也无法捕猎，变得无力(toothless)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old lion looked toothless and weak.
  </text>
  <text x="50" y="310" class="content">
    那只老狮子看起来无牙且虚弱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tiger head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Nose -->
    <circle cx="100" cy="120" r="15" class="image" />
    <!-- Mouth -->
    <path d="M 50 150 Q 100 180 150 150" class="image" />
    <!-- Missing teeth -->
    <line x1="60" y1="150" x2="60" y2="160" class="image" />
    <line x1="70" y1="150" x2="70" y2="160" class="image" />
    <line x1="80" y1="150" x2="80" y2="160" class="image" />
    <line x1="120" y1="150" x2="120" y2="160" class="image" />
    <line x1="130" y1="150" x2="130" y2="160" class="image" />
    <line x1="140" y1="150" x2="140" y2="160" class="image" />
  </g>
</svg>