<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cake { fill: #F1C40F; }
      .frosting { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frosting</text>
  <text x="50" y="120" class="subtitle">[ˈfrɔstɪŋ] n. 糖霜，霜饰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frost (霜) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个蛋糕上覆盖着一层厚厚的"霜(frost)"，
    <tspan x="50" dy="25">这层霜就是糖霜(frosting)，让蛋糕看起来更加诱人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decorated the cake with colorful frosting.
  </text>
  <text x="50" y="310" class="content">
    她用彩色糖霜装饰了蛋糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <rect x="0" y="0" width="350" height="200" class="cake" />
    <!-- Frosting -->
    <rect x="20" y="20" width="310" height="160" class="frosting" />
    <!-- Decoration -->
    <circle cx="60" cy="60" r="10" class="frosting" />
    <circle cx="120" cy="80" r="10" class="frosting" />
    <circle cx="180" cy="60" r="10" class="frosting" />
    <circle cx="240" cy="80" r="10" class="frosting" />
    <circle cx="300" cy="60" r="10" class="frosting" />
  </g>
</svg>