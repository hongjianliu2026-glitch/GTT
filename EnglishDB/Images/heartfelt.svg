<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heartfelt</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrtfɛlt] adj. 衷心的，真诚的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heart (心) + felt (感觉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用手捧着一颗跳动的心，"用心感受(heart-felt)"
    <tspan x="50" dy="25">的情感，这种情感是真诚而深切的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave him a heartfelt apology.
  </text>
  <text x="50" y="310" class="content">
    她向他表达了真诚的道歉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Hand holding the heart -->
    <line x1="35" y1="30" x2="35" y2="100" class="image" />
    <line x1="35" y1="100" x2="20" y2="130" class="image" />
    <line x1="35" y1="100" x2="50" y2="130" class="image" />
    <line x1="35" y1="70" x2="60" y2="60" class="image" />
  </g>
</svg>