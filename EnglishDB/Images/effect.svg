<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">effect</text>
  <text x="50" y="120" class="subtitle">[ɪˈfekt] n. 效果，影响；v. 实现，引起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ef- (出) + fect (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师挥动魔杖，"做出(fect)"
    <tspan x="50" dy="25">一个惊人的效果(effect)，让观众惊叹不已。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy had a significant effect on the economy.
  </text>
  <text x="50" y="310" class="content">
    新政策对经济产生了重大影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magic wand -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Starburst effect -->
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="100" y1="100" x2="50" y2="50" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <!-- Audience -->
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="300" cy="50" r="15" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <circle cx="300" cy="150" r="15" class="image" />
  </g>
</svg>