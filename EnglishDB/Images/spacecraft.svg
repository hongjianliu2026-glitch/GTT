<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spacecraft</text>
  <text x="50" y="120" class="subtitle">[ˈspeɪskræft] n. 航天器，宇宙飞船</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> space (空间) + craft (工艺，船)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘宇宙飞船在太空中航行，"空间(space)"
    <tspan x="50" dy="25">中的工艺品(craft)，这就是航天器(spacecraft)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spacecraft successfully landed on Mars.
  </text>
  <text x="50" y="310" class="content">
    航天器成功降落在火星上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spacecraft -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="175,20 125,180 225,180" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="125" y1="180" x2="225" y2="180" class="image" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="100" cy="30" r="5" class="image" />
    <circle cx="250" cy="70" r="5" class="image" />
    <circle cx="300" cy="100" r="5" class="image" />
  </g>
</svg>