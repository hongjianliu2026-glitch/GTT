<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rude</text>
  <text x="50" y="120" class="subtitle">[ruːd] adj. 粗鲁的，无礼的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rud (原始，粗糙)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始人(rud)，他不懂礼貌，
    <tspan x="50" dy="25">行为粗鲁(rude)，让人感到不舒服。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His rude behavior shocked everyone at the party.
  </text>
  <text x="50" y="310" class="content">
    他在派对上的粗鲁行为震惊了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Primitive man -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Rude gesture -->
    <line x1="50" y1="220" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="20" y2="280" class="image" />
    <line x1="50" y1="250" x2="80" y2="280" class="image" />
  </g>
</svg>