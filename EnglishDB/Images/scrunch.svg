<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scrunch</text>
  <text x="50" y="120" class="subtitle">[skrʌntʃ] v. 压皱，缩拢；n. 压皱声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scrunch (源自拟声词，模仿压皱的声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在柔软的毯子上"压皱(scrunch)"，
    <tspan x="50" dy="25">发出"咔嚓咔嚓"的声音，这就是scrunch的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She scrunched up her nose in disgust.
  </text>
  <text x="50" y="310" class="content">
    她厌恶地皱起了鼻子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Blanket -->
    <rect x="0" y="200" width="150" height="50" class="image" />
    <!-- Scrunch effect -->
    <line x1="20" y1="210" x2="130" y2="210" class="image" />
    <line x1="20" y1="220" x2="130" y2="220" class="image" />
    <line x1="20" y1="230" x2="130" y2="230" class="image" />
    <line x1="20" y1="240" x2="130" y2="240" class="image" />
  </g>
</svg>