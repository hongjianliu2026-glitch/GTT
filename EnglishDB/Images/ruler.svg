<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ruler</text>
  <text x="50" y="120" class="subtitle">[ˈruːlər] n. 尺子，统治者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rule (统治) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个统治者(ruler)手持一把尺子，象征着他的权威和秩序。
    <tspan x="50" dy="25">他用尺子测量一切，确保一切都井然有序。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a ruler to draw straight lines.
  </text>
  <text x="50" y="310" class="content">
    她用尺子画直线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ruler -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <line x1="20" y1="10" x2="330" y2="10" class="image" />
    <line x1="20" y1="20" x2="330" y2="20" class="image" />
    <line x1="20" y1="30" x2="330" y2="30" class="image" />
    <line x1="20" y1="40" x2="330" y2="40" class="image" />
    <!-- Ruler's hand -->
    <circle cx="20" cy="25" r="10" class="image" />
    <line x1="20" y1="35" x2="0" y2="60" class="image" />
    <line x1="20" y1="35" x2="40" y2="60" class="image" />
  </g>
</svg>