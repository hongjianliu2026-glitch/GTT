<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #795548; }
      .content { font: 18px sans-serif; fill: #5D4037; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #388E3C; }
      .image { stroke: #6D4C41; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delicacy</text>
  <text x="50" y="120" class="subtitle">[ˈdelɪkəsi] n. 美味，精致，微妙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + lic (引诱) + -acy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一道精致的菜肴，"强调引诱(de-lic-acy)"
    <tspan x="50" dy="25">你的味蕾，让你无法抗拒它的美味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef prepared a dish of great delicacy.
  </text>
  <text x="50" y="310" class="content">
    厨师准备了一道非常精致的菜肴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="50" class="image" />
    <rect x="150" y="50" width="100" height="100" class="image" />
    <polygon points="270,100 320,50 320,150" class="image" />
    <!-- Fork -->
    <line x1="50" y1="150" x2="100" y2="100" class="image" />
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="0" y2="180" class="image" />
    <line x1="50" y1="200" x2="100" y2="180" class="image" />
  </g>
</svg>