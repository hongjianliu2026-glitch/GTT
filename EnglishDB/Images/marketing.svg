<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marketing</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrkɪtɪŋ] n. 市场营销</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> market (市场) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个市场里，人们正在"进行(ing)"
    <tspan x="50" dy="25">各种营销活动，如广告、促销等，这就是市场营销(marketing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She specializes in digital marketing.
  </text>
  <text x="50" y="310" class="content">
    她专门从事数字营销。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Banner -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <text x="125" y="50" class="content" fill="#FFFFFF">SALE</text>
    <!-- Products -->
    <circle cx="70" cy="120" r="15" class="image" />
    <circle cx="120" cy="120" r="15" class="image" />
    <circle cx="170" cy="120" r="15" class="image" />
    <circle cx="220" cy="120" r="15" class="image" />
    <!-- People -->
    <circle cx="50" cy="160" r="15" class="image" />
    <circle cx="100" cy="160" r="15" class="image" />
    <circle cx="150" cy="160" r="15" class="image" />
    <circle cx="200" cy="160" r="15" class="image" />
  </g>
</svg>