<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reconstitute</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈkɒnstɪtjuːt] v. 重新组成，恢复</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + con- (一起) + stitute (建立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个破碎的拼图，"再次(re-)"被"一起(con-)"
    <tspan x="50" dy="25">"建立(stitute)"成完整的画面，这就是重新组成(reconstitute)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scientists tried to reconstitute the ancient DNA.
  </text>
  <text x="50" y="310" class="content">
    科学家们试图恢复古代的DNA。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken puzzle pieces -->
    <path d="M50 20 L70 50 L90 20 Z" class="image" />
    <path d="M100 20 L120 50 L140 20 Z" class="image" />
    <path d="M150 20 L170 50 L190 20 Z" class="image" />
    <!-- Completed puzzle -->
    <rect x="50" y="100" width="150" height="100" class="image" />
    <!-- Connecting lines -->
    <line x1="70" y1="50" x2="120" y2="100" class="image" />
    <line x1="170" y1="50" x2="120" y2="100" class="image" />
  </g>
</svg>