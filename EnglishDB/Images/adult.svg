<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adult</text>
  <text x="50" y="120" class="subtitle">[əˈdʌlt] n. 成年人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + ult (成熟)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子逐渐"朝向(ad-)"成熟(ult)，最终成为一个成年人(adult)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She became an adult after graduating from college.
  </text>
  <text x="50" y="310" class="content">
    她大学毕业后成为了一个成年人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Child -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />

    <!-- Adult -->
    <circle cx="250" cy="100" r="40" class="image" />
    <line x1="250" y1="140" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="220" y2="250" class="image" />
    <line x1="250" y1="200" x2="280" y2="250" class="image" />
    <line x1="250" y1="170" x2="200" y2="160" class="image" />
    <line x1="250" y1="170" x2="300" y2="160" class="image" />

    <!-- Arrow -->
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <polygon points="200,150 190,140 190,160" class="image" />
  </g>
</svg>