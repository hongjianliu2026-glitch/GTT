<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">toil</text>
  <text x="50" y="120" class="subtitle">[tɔɪl] n. 辛劳，苦工；v. 辛勤劳作</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> toil (源自中古英语，意为“辛苦工作”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农民在田地里，"辛勤劳作(toil)"，
    <tspan x="50" dy="25">汗水滴落在土地上，象征着辛勤和努力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He toiled in the fields all day.
  </text>
  <text x="50" y="310" class="content">
    他整天在田地里辛勤劳作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Farmer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Hoe -->
    <line x1="50" y1="180" x2="100" y2="120" class="image" />
    <!-- Drops of sweat -->
    <circle cx="60" cy="90" r="5" class="image" />
    <circle cx="70" cy="85" r="5" class="image" />
    <circle cx="80" cy="80" r="5" class="image" />
  </g>
</svg>