<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preponderance</text>
  <text x="50" y="120" class="subtitle">[prɪˈpɑndərəns] n. 优势，压倒性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + ponder (重量) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天平，"前面(pre-)"放着一堆重物，"重量(ponder)"
    <tspan x="50" dy="25">压倒性地(preponderance)倾斜到一边，显示出明显的优势。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The preponderance of evidence supported his claim.
  </text>
  <text x="50" y="310" class="content">
    压倒性的证据支持了他的主张。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
    <!-- Heavy weights -->
    <rect x="70" y="160" width="60" height="60" class="image" />
    <rect x="180" y="160" width="60" height="60" class="image" />
    <rect x="290" y="160" width="60" height="60" class="image" />
    <!-- Tilted scale -->
    <line x1="50" y1="50" x2="350" y2="50" transform="rotate(10, 200, 50)" class="image" />
  </g>
</svg>