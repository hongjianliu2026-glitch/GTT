<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">waste</text>
  <text x="50" y="120" class="subtitle">[weɪst] n. 浪费，废物；v. 浪费</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wast (浪费)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的垃圾堆，"浪费(waste)"
    <tspan x="50" dy="25">的物品堆积如山，象征着资源的浪费。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't waste food; it's a precious resource.
  </text>
  <text x="50" y="310" class="content">
    不要浪费食物，它是宝贵的资源。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garbage pile -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <rect x="100" y="70" width="60" height="60" class="image" />
    <rect x="180" y="90" width="40" height="40" class="image" />
    <rect x="240" y="80" width="50" height="50" class="image" />
    <circle cx="300" cy="120" r="20" class="image" />
    <!-- Trash can -->
    <rect x="150" y="150" width="100" height="50" class="image" />
    <line x1="160" y1="150" x2="160" y2="200" class="image" />
    <line x1="240" y1="150" x2="240" y2="200" class="image" />
  </g>
</svg>