<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">qualifying</text>
  <text x="50" y="120" class="subtitle">[ˈkwɒlɪfaɪɪŋ] adj. 合格的，有资格的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quali- (质量) + -fy (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在赛道上，"使(fy)"
    <tspan x="50" dy="25">自己达到"质量(quali-)"标准，</tspan>
    <tspan x="50" dy="25">从而"有资格(qualifying)"参加比赛。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His performance in the trial was qualifying for the final race.
  </text>
  <text x="50" y="310" class="content">
    他在预赛中的表现使他有资格参加决赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Athlete -->
    <circle cx="100" cy="90" r="15" class="image" />
    <line x1="100" y1="105" x2="100" y2="140" class="image" />
    <line x1="100" y1="140" x2="80" y2="170" class="image" />
    <line x1="100" y1="140" x2="120" y2="170" class="image" />
    <line x1="100" y1="120" x2="130" y2="110" class="image" />
    <!-- Finish line -->
    <line x1="280" y1="0" x2="280" y2="200" class="image" />
    <text x="290" y="100" class="content" style="font-size: 24px;">Finish</text>
  </g>
</svg>