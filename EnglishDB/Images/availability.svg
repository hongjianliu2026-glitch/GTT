<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">availability</text>
  <text x="50" y="120" class="subtitle">[əˌveɪləˈbɪlɪti] n. 可用性，有效性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> avail (有用) + -ability (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宝箱，里面装满了各种有用的(avail)
    <tspan x="50" dy="25">物品，随时可以取用，这就是它的可用性(availability)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The availability of the product is limited.
  </text>
  <text x="50" y="310" class="content">
    该产品的可用性有限。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Treasure chest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Items inside the chest -->
    <circle cx="100" cy="100" r="20" class="image" />
    <rect x="150" y="80" width="40" height="40" class="image" />
    <line x1="220" y1="80" x2="260" y2="120" class="image" />
    <line x1="260" y1="80" x2="220" y2="120" class="image" />
    <!-- Open chest lid -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="20" x2="175" y2="0" class="image" />
    <line x1="300" y1="20" x2="175" y2="0" class="image" />
  </g>
</svg>