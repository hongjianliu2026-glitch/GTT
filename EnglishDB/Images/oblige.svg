<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oblige</text>
  <text x="50" y="120" class="subtitle">[əˈblaɪdʒ] v. 迫使，强制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (朝向) + lig (绑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"绑(lig)"在椅子上，"朝向(ob-)"
    <tspan x="50" dy="25">一个任务，不得不完成，这就是被"迫使(oblige)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The law obliges companies to provide safety equipment.
  </text>
  <text x="50" y="310" class="content">
    法律强制公司提供安全设备。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <!-- Person -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="20" y2="90" class="image" />
    <line x1="50" y1="80" x2="80" y2="90" class="image" />
    <!-- Rope -->
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <line x1="50" y1="0" x2="30" y2="20" class="image" />
    <line x1="50" y1="0" x2="70" y2="20" class="image" />
  </g>
</svg>