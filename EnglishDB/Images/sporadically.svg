<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sporadically</text>
  <text x="50" y="120" class="subtitle">[spəˈrædɪkli] adv. 零星地，偶尔地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spor- (种子) + adic (来自ad-，表示“朝向”) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片田野上，"种子(spor-)"
    <tspan x="50" dy="25">偶尔(adic)地散落，形成零星(sporadically)的分布。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rain fell sporadically throughout the day.
  </text>
  <text x="50" y="310" class="content">
    雨一整天都零星地下着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Seeds -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <circle cx="300" cy="30" r="10" class="image" />
    <circle cx="100" cy="170" r="10" class="image" />
  </g>
</svg>