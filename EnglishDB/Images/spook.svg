<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spook</text>
  <text x="50" y="120" class="subtitle">[spʊk] n. 鬼，幽灵；v. 惊吓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spook (源自荷兰语 spook，意为“幽灵”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幽灵(spook)在夜晚飘荡，突然出现在你面前，
    <tspan x="50" dy="25">吓得你心跳加速，这就是“惊吓(spook)”的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house was said to be haunted by a spook.
  </text>
  <text x="50" y="310" class="content">
    据说那座老房子里闹鬼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ghost -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="200" x2="50" y2="150" class="image" />
    <line x1="100" y1="200" x2="150" y2="150" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="80" r="10" fill="#000" />
    <circle cx="120" cy="80" r="10" fill="#000" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" stroke="#000" stroke-width="2" fill="none" />
  </g>
</svg>