<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unfurl</text>
  <text x="50" y="120" class="subtitle">[ʌnˈfɜːrl] v. 展开，铺开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (打开) + furl (卷起)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一面巨大的旗帜，原本紧紧卷起(furl)，
    <tspan x="50" dy="25">突然被风吹开，"打开(un-)"并"展开(furl)"，</tspan>
    <tspan x="50" dy="25">整个旗帜在风中飘扬，壮观无比。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The eagle unfurled its wings and soared into the sky.
  </text>
  <text x="50" y="310" class="content">
    老鹰展开翅膀，飞向天空。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flagpole -->
    <line x1="150" y1="0" x2="150" y2="200" class="image" />
    <!-- Furl part -->
    <rect x="100" y="20" width="100" height="30" class="image" />
    <!-- Unfurl part -->
    <rect x="100" y="50" width="100" height="150" class="image" />
    <!-- Wind effect -->
    <line x1="100" y1="50" x2="50" y2="100" class="image" />
    <line x1="200" y1="50" x2="250" y2="100" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <line x1="200" y1="200" x2="250" y2="250" class="image" />
  </g>
</svg>