<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fell</text>
  <text x="50" y="120" class="subtitle">[fel] v. 砍倒，击倒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fell (来自古英语 fellan，意为“击倒”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个伐木工人挥舞着斧头，"砍倒(fell)"
    <tspan x="50" dy="25">一棵巨大的树，树干轰然倒下，尘土飞扬。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lumberjack felled the tree with one powerful swing.
  </text>
  <text x="50" y="310" class="content">
    伐木工人用一次强有力的挥动砍倒了那棵树。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Axe -->
    <line x1="0" y1="0" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="0" class="image" />
    <!-- Tree -->
    <rect x="150" y="0" width="50" height="200" class="image" />
    <!-- Falling tree -->
    <line x1="150" y1="0" x2="125" y2="200" class="image" />
    <line x1="200" y1="0" x2="225" y2="200" class="image" />
    <!-- Dust -->
    <circle cx="130" cy="210" r="10" class="image" />
    <circle cx="170" cy="210" r="10" class="image" />
    <circle cx="210" cy="210" r="10" class="image" />
  </g>
</svg>