<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hopper</text>
  <text x="50" y="120" class="subtitle">[ˈhɒpə(r)] n. 跳跃者，漏斗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hop (跳跃) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只袋鼠(hopper)在草原上"跳跃(hop)"，
    <tspan x="50" dy="25">它的跳跃动作就像一个漏斗(hopper)在倾倒东西。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hopper in the factory feeds the machine with raw materials.
  </text>
  <text x="50" y="310" class="content">
    工厂里的漏斗给机器输送原材料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kangaroo -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="160" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="200" x2="20" y2="240" class="image" /> <!-- Front leg -->
    <line x1="50" y1="200" x2="80" y2="240" class="image" /> <!-- Back leg -->
    <line x1="50" y1="130" x2="20" y2="110" class="image" /> <!-- Tail -->

    <!-- Hopper -->
    <rect x="200" y="80" width="150" height="100" class="image" />
    <line x1="200" y1="80" x2="350" y2="80" class="image" />
    <line x1="200" y1="100" x2="350" y2="100" class="image" />
    <line x1="200" y1="120" x2="350" y2="120" class="image" />
    <line x1="200" y1="140" x2="350" y2="140" class="image" />
    <line x1="200" y1="160" x2="350" y2="160" class="image" />
    <line x1="200" y1="180" x2="350" y2="180" class="image" />
  </g>
</svg>