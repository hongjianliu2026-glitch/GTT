<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">italics</text>
  <text x="50" y="120" class="subtitle">[aɪˈtælɪks] n. 斜体字</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> italic (斜体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个字母"A"被"倾斜(italic)"，
    <tspan x="50" dy="25">就像一个滑滑梯上的孩子，滑下来变成了斜体字(italics)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The word "important" was printed in italics.
  </text>
  <text x="50" y="310" class="content">
    单词"important"是用斜体字印刷的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Slanted letter A -->
    <text x="50" y="100" transform="rotate(-15 50 100)" class="image" style="font-size: 100px; fill: #34495E;">A</text>
    <!-- Slide -->
    <line x1="50" y1="100" x2="200" y2="250" class="image" />
    <!-- Child -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="35" y2="180" class="image" />
    <line x1="50" y1="150" x2="65" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>