<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cartel</text>
  <text x="50" y="120" class="subtitle">[kɑrˈtɛl] n. 卡特尔，企业联合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cart (车) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群商人坐在一辆小车(cart-el)里，
    <tspan x="50" dy="25">他们正在秘密地制定价格和市场策略，</tspan>
    <tspan x="50" dy="25">这就是一个卡特尔(cartel)的形成。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oil cartel decided to cut production to raise prices.
  </text>
  <text x="50" y="310" class="content">
    石油卡特尔决定削减产量以提高价格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small cart -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="20" y="20" width="110" height="60" class="image" />
    <line x1="10" y1="100" x2="140" y2="100" class="image" />
    <circle cx="30" cy="110" r="10" class="image" />
    <circle cx="120" cy="110" r="10" class="image" />
    <!-- Businessmen -->
    <circle cx="40" cy="50" r="10" class="image" />
    <circle cx="90" cy="50" r="10" class="image" />
    <line x1="40" y1="60" x2="40" y2="80" class="image" />
    <line x1="90" y1="60" x2="90" y2="80" class="image" />
    <line x1="40" y1="80" x2="30" y2="90" class="image" />
    <line x1="40" y1="80" x2="50" y2="90" class="image" />
    <line x1="90" y1="80" x2="80" y2="90" class="image" />
    <line x1="90" y1="80" x2="100" y2="90" class="image" />
  </g>
</svg>