<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marinade</text>
  <text x="50" y="120" class="subtitle">[ˌmærɪˈneɪd] n. 腌泡汁，腌泡过的食物；v. 腌泡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar (海) + in (在...里面) + ade (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块肉被"浸泡在海水中(mar-in-ade)"，
    <tspan x="50" dy="25">就像古代水手用海水腌肉，这就是腌泡汁(marinade)的由来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The steak was marinated in a mixture of soy sauce and garlic.
  </text>
  <text x="50" y="310" class="content">
    牛排用酱油和大蒜混合腌泡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meat -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Sea -->
    <rect x="0" y="100" width="150" height="50" class="image" />
    <!-- Waves -->
    <line x1="10" y1="110" x2="30" y2="120" class="image" />
    <line x1="30" y1="120" x2="50" y2="110" class="image" />
    <line x1="50" y1="110" x2="70" y2="120" class="image" />
    <line x1="70" y1="120" x2="90" y2="110" class="image" />
    <line x1="90" y1="110" x2="110" y2="120" class="image" />
    <line x1="110" y1="120" x2="130" y2="110" class="image" />
    <line x1="130" y1="110" x2="150" y2="120" class="image" />
    <!-- Meat in sea -->
    <rect x="50" y="10" width="50" height="80" class="image" />
  </g>
</svg>