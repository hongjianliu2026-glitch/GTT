<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dub</text>
  <text x="50" y="120" class="subtitle">[dʌb] v. 配音，授予称号</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dub (打，击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个电影导演在电影院里，"打(dub)"
    <tspan x="50" dy="25">击麦克风，为电影角色配音，赋予他们声音和生命。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was dubbed in multiple languages.
  </text>
  <text x="50" y="310" class="content">
    这部电影被配音成了多种语言。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cinema screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Director -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Microphone -->
    <line x1="70" y1="50" x2="70" y2="150" class="image" />
    <circle cx="70" cy="40" r="10" class="image" />
    <!-- Sound waves -->
    <line x1="90" y1="50" x2="120" y2="50" class="image" />
    <line x1="90" y1="70" x2="120" y2="70" class="image" />
    <line x1="90" y1="90" x2="120" y2="90" class="image" />
  </g>
</svg>