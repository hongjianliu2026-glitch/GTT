<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .snow { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snow-covered</text>
  <text x="50" y="120" class="subtitle">[ˈsnoʊ ˈkʌvərd] adj. 被雪覆盖的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snow (雪) + covered (覆盖的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片大地，"雪(snow)"像一层厚厚的"被子(covered)"
    <tspan x="50" dy="25">覆盖在上面，整个世界都变成了白色。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mountains were snow-covered in winter.
  </text>
  <text x="50" y="310" class="content">
    冬天，山脉被雪覆盖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Snow cover -->
    <rect x="50" y="20" width="250" height="160" class="snow" />
    <!-- Mountains -->
    <polygon points="100,20 200,20 150,100" class="image" />
    <polygon points="150,20 250,20 200,100" class="image" />
    <!-- Snowflakes -->
    <circle cx="120" cy="50" r="5" class="snow" />
    <circle cx="180" cy="70" r="5" class="snow" />
    <circle cx="220" cy="40" r="5" class="snow" />
    <circle cx="260" cy="60" r="5" class="snow" />
  </g>
</svg>