<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">honestly</text>
  <text x="50" y="120" class="subtitle">[ˈɒnɪstli] adv. 诚实地，真诚地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hon (荣誉) + est (最高级) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在荣誉的巅峰，"最高荣誉(hon-est)"
    <tspan x="50" dy="25">地说话，这就是真诚(honestly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke honestly about her experience.
  </text>
  <text x="50" y="310" class="content">
    她真诚地谈了她的经历。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person on a pedestal -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="150" y="20" width="50" height="160" class="image" />
    <circle cx="175" cy="100" r="25" class="image" />
    <line x1="175" y1="125" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="170" class="image" />
    <line x1="175" y1="150" x2="200" y2="170" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Crown -->
    <polyline points="160,80 175,60 190,80" class="image" />
    <line x1="165" y1="80" x2="185" y2="80" class="image" />
  </g>
</svg>