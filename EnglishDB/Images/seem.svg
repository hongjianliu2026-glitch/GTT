<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seem</text>
  <text x="50" y="120" class="subtitle">[siːm] v. 似乎，好像</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + em (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考，"分开拿(se-em)"
    <tspan x="50" dy="25">不同的观点，最终得出结论，'似乎(seem)'如此。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It seems like it's going to rain.
  </text>
  <text x="50" y="310" class="content">
    看起来好像要下雨了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thought bubble -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <!-- Person -->
    <circle cx="100" cy="350" r="30" class="image" />
    <line x1="100" y1="380" x2="100" y2="450" class="image" />
    <line x1="100" y1="450" x2="70" y2="500" class="image" />
    <line x1="100" y1="450" x2="130" y2="500" class="image" />
    <line x1="100" y1="400" x2="50" y2="420" class="image" />
    <line x1="100" y1="400" x2="150" y2="420" class="image" />
  </g>
</svg>