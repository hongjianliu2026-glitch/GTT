<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paucity</text>
  <text x="50" y="120" class="subtitle">[ˈpɔːsɪti] n. 少量，缺乏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pauci- (少) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个空荡荡的碗里只有几粒米，"少量的(pauci-)"
    <tspan x="50" dy="25">食物，这就是缺乏(paucity)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The paucity of resources hindered their progress.
  </text>
  <text x="50" y="310" class="content">
    资源的缺乏阻碍了他们的进展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Rice grains -->
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="120" cy="100" r="5" class="image" />
    <circle cx="140" cy="100" r="5" class="image" />
    <circle cx="160" cy="100" r="5" class="image" />
    <circle cx="180" cy="100" r="5" class="image" />
    <circle cx="200" cy="100" r="5" class="image" />
    <circle cx="220" cy="100" r="5" class="image" />
    <circle cx="240" cy="100" r="5" class="image" />
    <circle cx="260" cy="100" r="5" class="image" />
    <circle cx="280" cy="100" r="5" class="image" />
  </g>
</svg>