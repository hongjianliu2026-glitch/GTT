<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rheumatoid</text>
  <text x="50" y="120" class="subtitle">[ˈruːmətɔɪd] adj. 类风湿的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rheum (流) + -oid (类似)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个关节，"流(rheum)"出类似(oid)
    <tspan x="50" dy="25">的液体，这就是类风湿(rheumatoid)的症状。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She suffers from rheumatoid arthritis.
  </text>
  <text x="50" y="310" class="content">
    她患有类风湿性关节炎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Joint -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Fluid -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="120" y2="170" class="image" />
    <line x1="100" y1="150" x2="80" y2="170" class="image" />
    <line x1="100" y1="150" x2="140" y2="160" class="image" />
    <line x1="100" y1="150" x2="60" y2="160" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="230" class="image" />
    <line x1="100" y1="250" x2="120" y2="230" class="image" />
  </g>
</svg>