<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mastermind</text>
  <text x="50" y="120" class="subtitle">[ˈmæstərmaɪnd] n. 策划者，智囊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> master (主人) + mind (头脑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"主人(master)"坐在一张桌子前，
    <tspan x="50" dy="25">他的"头脑(mind)"在飞速运转，策划着一切。</tspan>
    <tspan x="50" dy="25">这个画面让人联想到一个智囊(mastermind)在幕后操控全局。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mastermind behind the heist was never caught.
  </text>
  <text x="50" y="310" class="content">
    这次抢劫案的幕后策划者从未被抓获。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mastermind -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Brain -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="170" class="image" />
    <line x1="200" y1="150" x2="170" y2="140" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
    <line x1="200" y1="150" x2="180" y2="170" class="image" />
    <line x1="200" y1="150" x2="220" y2="170" class="image" />
  </g>
</svg>