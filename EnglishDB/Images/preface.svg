<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preface</text>
  <text x="50" y="120" class="subtitle">[ˈpriːfəs] n. 前言，序言；v. 为...作序</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + face (面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本书的"前面(pre-)"有一张"面(face)"，
    <tspan x="50" dy="25">这张面就是书的序言(preface)，引导读者进入书的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The author wrote a preface to introduce the book.
  </text>
  <text x="50" y="310" class="content">
    作者写了一篇序言来介绍这本书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Book cover -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Preface page -->
    <rect x="70" y="40" width="210" height="120" class="image" />
    <!-- Text lines -->
    <line x1="80" y1="60" x2="270" y2="60" class="image" />
    <line x1="80" y1="80" x2="240" y2="80" class="image" />
    <line x1="80" y1="100" x2="260" y2="100" class="image" />
    <line x1="80" y1="120" x2="230" y2="120" class="image" />
    <!-- Arrow pointing to preface -->
    <line x1="30" y1="100" x2="60" y2="70" class="image" />
    <line x1="60" y1="70" x2="80" y2="100" class="image" />
  </g>
</svg>