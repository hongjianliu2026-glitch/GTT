<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parent</text>
  <text x="50" y="120" class="subtitle">[ˈpɛərənt] n. 父母，家长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> par- (生) + ent (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的鸟巢，"生下(par-)"
    <tspan x="50" dy="25">小鸟的父母(parent)在巢中守护着它们。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My parents always support me in my decisions.
  </text>
  <text x="50" y="310" class="content">
    我的父母总是支持我的决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bird's nest -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Parent birds -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Baby birds -->
    <circle cx="130" cy="200" r="15" class="image" />
    <circle cx="170" cy="200" r="15" class="image" />
  </g>
</svg>