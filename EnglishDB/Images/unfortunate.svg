<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unfortunate</text>
  <text x="50" y="120" class="subtitle">[ʌnˈfɔːrtʃənət] adj. 不幸的，倒霉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + fortune (运气)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走在路上，突然被"不(un-)"好的"运气(fortune)"
    <tspan x="50" dy="25">击中，踩到了香蕉皮滑倒，这就是不幸(unfortunate)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was unfortunate that he missed the train.
  </text>
  <text x="50" y="310" class="content">
    他错过了火车，真是不幸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Banana peel -->
    <rect x="100" y="180" width="50" height="10" transform="rotate(-20, 100, 180)" class="image" />
    <!-- Ground -->
    <line x1="0" y1="230" x2="200" y2="230" class="image" />
  </g>
</svg>