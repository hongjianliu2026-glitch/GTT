<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">computer-generated</text>
  <text x="50" y="120" class="subtitle">[kəmˈpjuːtər dʒəˈnɛrətɪd] adj. 计算机生成的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> computer (计算机) + generate (生成)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台计算机在屏幕上"生成(generate)"
    <tspan x="50" dy="25">出各种图像和数据，这些就是计算机生成的(computer-generated)内容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie's special effects were entirely computer-generated.
  </text>
  <text x="50" y="310" class="content">
    这部电影的特效完全是计算机生成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Computer screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Generated image -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="220" class="image" />
    <line x1="175" y1="200" x2="200" y2="220" class="image" />
    <line x1="175" y1="180" x2="220" y2="170" class="image" />
    <!-- Computer -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Code lines -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>