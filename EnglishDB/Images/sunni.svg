<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Sunni</text>
  <text x="50" y="120" class="subtitle">[ˈsʊni] n. 逊尼派（伊斯兰教主要教派之一）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Sunni (源自阿拉伯语，意为“遵循传统者”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太阳(Sun)照耀着一群虔诚的信徒，他们遵循(ni)
    <tspan x="50" dy="25">传统，形成了伊斯兰教的逊尼派(Sunni)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The majority of Muslims are Sunni.
  </text>
  <text x="50" y="310" class="content">
    大多数穆斯林是逊尼派。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Followers -->
    <circle cx="50" cy="150" r="10" class="image" fill="#2C3E50" />
    <circle cx="150" cy="150" r="10" class="image" fill="#2C3E50" />
    <circle cx="100" cy="200" r="10" class="image" fill="#2C3E50" />
    <circle cx="200" cy="100" r="10" class="image" fill="#2C3E50" />
    <circle cx="0" cy="100" r="10" class="image" fill="#2C3E50" />
    <!-- Lines connecting followers to the sun -->
    <line x1="100" y1="150" x2="50" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="0" y2="100" class="image" />
  </g>
</svg>