<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forlorn</text>
  <text x="50" y="120" class="subtitle">[fəˈlɔːrn] adj. 孤独的，被遗弃的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (离开) + lorn (被遗弃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"离开(for-)"并"被遗弃(lorn)"在荒凉的沙漠中，
    <tspan x="50" dy="25">孤独无助，这就是forlorn的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forlorn child sat by the window, waiting for her parents to return.
  </text>
  <text x="50" y="310" class="content">
    那个孤独的孩子坐在窗边，等待父母归来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Sand dunes -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="250" y2="100" class="image" />
    <!-- Person -->
    <circle cx="100" cy="120" r="15" class="image" />
    <line x1="100" y1="135" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="200" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
  </g>
</svg>