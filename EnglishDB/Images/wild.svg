<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wild</text>
  <text x="50" y="120" class="subtitle">[waɪld] adj. 野生的，狂野的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wilde (古英语，意为“未驯化的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片茂密的森林，"未驯化的(wilde)"
    <tspan x="50" dy="25">野兽在其中自由奔跑，这就是野生的(wild)世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lion in the wild is a majestic creature.
  </text>
  <text x="50" y="310" class="content">
    野外的狮子是一种威严的生物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="100" x2="50" y2="20" class="image" />
    <line x1="70" y1="100" x2="70" y2="30" class="image" />
    <line x1="90" y1="100" x2="90" y2="40" class="image" />
    <line x1="110" y1="100" x2="110" y2="50" class="image" />
    <line x1="130" y1="100" x2="130" y2="60" class="image" />
    <!-- Wild animal -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
  </g>
</svg>