<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">degradation</text>
  <text x="50" y="120" class="subtitle">[ˌdeɡrəˈdeɪʃn] n. 降级，退化，恶化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + grad (走) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体从高处"向下走(de-grad)"，逐渐变得破旧不堪，
    <tspan x="50" dy="25">最终"退化(degradation)"成一堆废墟。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The degradation of the environment is a serious concern.
  </text>
  <text x="50" y="310" class="content">
    环境的恶化是一个严重的问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- High point -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Low point -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <!-- Path of degradation -->
    <polyline points="50,0 100,50 150,100 200,150 250,200" class="image" />
    <!-- Broken object -->
    <rect x="250" y="180" width="30" height="20" class="image" />
    <line x1="260" y1="180" x2="260" y2="200" class="image" />
    <line x1="270" y1="180" x2="270" y2="200" class="image" />
    <line x1="280" y1="180" x2="280" y2="200" class="image" />
  </g>
</svg>