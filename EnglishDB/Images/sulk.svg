<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sulk</text>
  <text x="50" y="120" class="subtitle">[sʌlk] v. 生气，愠怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sul- (来自古英语 sulc, 意为皱眉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为生气而皱起眉头，"皱眉(sul-)"
    <tspan x="50" dy="25">的表情就像乌云密布的天空，这就是生气的样子(sulk)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sulked for hours after being scolded.
  </text>
  <text x="50" y="310" class="content">
    她被责骂后生闷气了好几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Frown -->
    <path d="M60 120 Q100 150 140 120" class="image" />
  </g>
</svg>