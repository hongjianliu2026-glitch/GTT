<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">greeting</text>
  <text x="50" y="120" class="subtitle">[ˈɡriːtɪŋ] n. 问候，欢迎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> greet (问候) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在门口，微笑着伸出双手，"迎接(greet)"
    <tspan x="50" dy="25">每一位来访者，这就是一个温暖的问候(greeting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The host gave us a warm greeting when we arrived.
  </text>
  <text x="50" y="310" class="content">
    我们到达时，主人热情地迎接了我们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Person -->
    <circle cx="75" cy="100" r="20" class="image" />
    <line x1="75" y1="120" x2="75" y2="160" class="image" />
    <line x1="75" y1="160" x2="50" y2="200" class="image" />
    <line x1="75" y1="160" x2="100" y2="200" class="image" />
    <line x1="75" y1="140" x2="120" y2="130" class="image" />
    <!-- Handshake -->
    <line x1="75" y1="160" x2="150" y2="160" class="image" />
  </g>
</svg>