<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sod</text>
  <text x="50" y="120" class="subtitle">[sɒd] n. 草皮，草地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 sodde，意为“草地”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片绿油油的草地(sod)，上面长满了茂密的青草，
    <tspan x="50" dy="25">仿佛一块巨大的绿色地毯铺在大地上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lawn was covered with fresh sod.
  </text>
  <text x="50" y="310" class="content">
    草坪上铺满了新鲜的草皮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass patch -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Grass blades -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="80" y1="20" x2="80" y2="100" class="image" />
    <line x1="110" y1="20" x2="110" y2="100" class="image" />
    <line x1="140" y1="20" x2="140" y2="100" class="image" />
    <line x1="170" y1="20" x2="170" y2="100" class="image" />
    <line x1="200" y1="20" x2="200" y2="100" class="image" />
    <line x1="230" y1="20" x2="230" y2="100" class="image" />
    <line x1="260" y1="20" x2="260" y2="100" class="image" />
    <line x1="290" y1="20" x2="290" y2="100" class="image" />
    <line x1="320" y1="20" x2="320" y2="100" class="image" />
  </g>
</svg>