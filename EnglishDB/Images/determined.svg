<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">determined</text>
  <text x="50" y="120" class="subtitle">[dɪˈtɜːrmɪnd] adj. 坚定的，决心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + term (界限) + -ined (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一条界限前，"强调(de-)"
    <tspan x="50" dy="25">自己已经"确定(term)"了目标，</tspan>
    <tspan x="50" dy="25">这种状态就是"坚定的(determined)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is determined to achieve her goals.
  </text>
  <text x="50" y="310" class="content">
    她决心要实现她的目标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boundary line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person -->
    <circle cx="20" cy="50" r="15" class="image" />
    <line x1="20" y1="65" x2="20" y2="100" class="image" />
    <line x1="20" y1="100" x2="0" y2="130" class="image" />
    <line x1="20" y1="100" x2="40" y2="130" class="image" />
    <line x1="20" y1="80" x2="50" y2="70" class="image" />
    <!-- Arrow pointing to the boundary -->
    <line x1="20" y1="50" x2="150" y2="0" class="image" />
    <polygon points="150,0 140,10 160,10" class="image" />
  </g>
</svg>