<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irreplaceable</text>
  <text x="50" y="120" class="subtitle">[ˌɪrɪˈpleɪsəbl] adj. 不可替代的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (不) + replace (替换) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个珍贵的宝物，被一个巨大的锁链锁住，"无法被替换(ir-replace-able)"，
    <tspan x="50" dy="25">因为它独一无二，无可替代。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her irreplaceable contribution to the project was invaluable.
  </text>
  <text x="50" y="310" class="content">
    她对项目的不可替代的贡献是无价的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Treasure chest -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Lock -->
    <circle cx="100" cy="75" r="20" class="image" />
    <line x1="100" y1="95" x2="100" y2="125" class="image" />
    <line x1="80" y1="105" x2="120" y2="105" class="image" />
    <!-- Chain -->
    <line x1="100" y1="0" x2="100" y2="55" class="image" />
    <line x1="70" y1="20" x2="130" y2="20" class="image" />
    <line x1="70" y1="40" x2="130" y2="40" class="image" />
    <line x1="70" y1="60" x2="130" y2="60" class="image" />
  </g>
</svg>