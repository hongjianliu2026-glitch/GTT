<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jewelry</text>
  <text x="50" y="120" class="subtitle">[ˈdʒuːəlri] n. 珠宝，首饰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jewel (宝石) + -ry (表示集合名词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位女王戴着一顶镶满宝石的皇冠，"宝石(jewel)"
    <tspan x="50" dy="25">闪耀着光芒，这些宝石的集合就是珠宝(jewelry)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received a beautiful piece of jewelry for her birthday.
  </text>
  <text x="50" y="310" class="content">
    她生日时收到了一件漂亮的珠宝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <path d="M50 50 L100 50 L125 100 L75 100 Z" class="image" />
    <!-- Jewels -->
    <circle cx="62.5" cy="75" r="10" class="image" fill="#FFD700" />
    <circle cx="87.5" cy="75" r="10" class="image" fill="#FFD700" />
    <circle cx="112.5" cy="75" r="10" class="image" fill="#FFD700" />
    <!-- Queen -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="200" x2="140" y2="190" class="image" />
  </g>
</svg>