<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">defuse</text>
  <text x="50" y="120" class="subtitle">[diːˈfjuːz] v. 拆除（炸弹），缓和（紧张局势）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (去除) + fuse (导火线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拆弹专家小心翼翼地"去除(de-)"
    <tspan x="50" dy="25">炸弹上的"导火线(fuse)"，成功地"拆除(defuse)"了炸弹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bomb squad successfully defused the bomb.
  </text>
  <text x="50" y="310" class="content">
    炸弹小组成功拆除了炸弹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bomb -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Fuse -->
    <line x1="75" y1="0" x2="75" y2="50" class="image" />
    <!-- Scissors -->
    <line x1="75" y1="50" x2="100" y2="25" class="image" />
    <line x1="75" y1="50" x2="50" y2="25" class="image" />
    <!-- Bomb squad -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>