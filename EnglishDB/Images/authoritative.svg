<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">authoritative</text>
  <text x="50" y="120" class="subtitle">[ɔːˈθɒrɪtətɪv] adj. 权威的，官方的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> author (作者) + -itative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位权威的作者站在讲台上，手持一本厚重的书，
    <tspan x="50" dy="25">他的话语如同法律般不可置疑，这就是权威的(authoritative)力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The professor's authoritative tone made his lecture very convincing.
  </text>
  <text x="50" y="310" class="content">
    教授权威的语气使他的讲座非常有说服力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lectern -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Book -->
    <rect x="50" y="20" width="150" height="160" class="image" />
    <!-- Author -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="210" class="image" />
    <line x1="250" y1="180" x2="270" y2="210" class="image" />
    <line x1="250" y1="140" x2="200" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M200,50 Q150,70 100,50 Q150,30 200,50" class="image" />
    <text x="120" y="60" class="content">权威</text>
  </g>
</svg>