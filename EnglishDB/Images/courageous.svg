<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">courageous</text>
  <text x="50" y="120" class="subtitle">[kəˈreɪdʒəs] adj. 勇敢的，有胆量的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cour (心) + age (名词后缀) + ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇士，他的"心(cour)"中充满了"勇气(age)"，
    <tspan x="50" dy="25">因此他表现得非常"勇敢(courageous)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The courageous firefighter saved many lives.
  </text>
  <text x="50" y="310" class="content">
    那位勇敢的消防员救了许多人的生命。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 40 C10 10, 90 10, 90 40 S170 70, 100 100 S10 70, 10 40" class="image" />
    <!-- Warrior -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="260" class="image" />
    <line x1="50" y1="220" x2="70" y2="260" class="image" />
    <line x1="50" y1="190" x2="20" y2="180" class="image" />
    <line x1="50" y1="190" x2="80" y2="180" class="image" />
    <!-- Shield -->
    <rect x="30" y="130" width="40" height="40" class="image" />
  </g>
</svg>