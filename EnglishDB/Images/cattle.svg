<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #641E16; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cattle</text>
  <text x="50" y="120" class="subtitle">[ˈkætl] n. 牛，家畜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cat (牛) + -tle (表示复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的牧场，"一群牛(cat-tle)"
    <tspan x="50" dy="25">在悠闲地吃草，这就是cattle的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer raised a large herd of cattle.
  </text>
  <text x="50" y="310" class="content">
    农夫养了一大群牛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grassland -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cows -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Legs -->
    <line x1="40" y1="120" x2="40" y2="150" class="image" />
    <line x1="60" y1="120" x2="60" y2="150" class="image" />
    <line x1="90" y1="120" x2="90" y2="150" class="image" />
    <line x1="110" y1="120" x2="110" y2="150" class="image" />
    <line x1="140" y1="120" x2="140" y2="150" class="image" />
    <line x1="160" y1="120" x2="160" y2="150" class="image" />
    <line x1="190" y1="120" x2="190" y2="150" class="image" />
    <line x1="210" y1="120" x2="210" y2="150" class="image" />
    <line x1="240" y1="120" x2="240" y2="150" class="image" />
    <line x1="260" y1="120" x2="260" y2="150" class="image" />
  </g>
</svg>