<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uncharted</text>
  <text x="50" y="120" class="subtitle">[ʌnˈtʃɑːrtɪd] adj. 未知的，未标明的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + chart (图表) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家站在一片未知的海洋上，"没有图表(un-charted)"
    <tspan x="50" dy="25">的地方，充满了神秘和危险。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sailors ventured into uncharted waters.
  </text>
  <text x="50" y="310" class="content">
    水手们冒险进入了未知的领域。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Waves -->
    <path d="M50 50 Q100 20 150 50 T250 50 T300 20 T350 50" class="image" />
    <path d="M50 80 Q100 50 150 80 T250 80 T300 50 T350 80" class="image" />
    <path d="M50 110 Q100 80 150 110 T250 110 T300 80 T350 110" class="image" />
    <!-- Explorer -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Question mark -->
    <text x="250" y="150" class="image" font-size="48" fill="#7F8C8D">?</text>
  </g>
</svg>