<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wham</text>
  <text x="50" y="120" class="subtitle">[wɑːm] v. 猛击，砰地一声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 拟声词，模拟物体猛烈撞击的声音
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拳头"砰(wham)"地一声砸在墙上，
    <tspan x="50" dy="25">发出震耳欲聋的声音，这就是"wham"的威力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The door slammed shut with a loud wham.
  </text>
  <text x="50" y="310" class="content">
    门砰地一声关上了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fist -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="140" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
    <line x1="100" y1="150" x2="100" y2="180" class="image" />
    <!-- Impact -->
    <circle cx="100" cy="100" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>