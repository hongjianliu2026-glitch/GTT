<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #6D4C41; }
      .subtitle { font: italic 24px serif; fill: #5D4037; }
      .content { font: 18px sans-serif; fill: #3E2723; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #795548; }
      .image { stroke: #795548; stroke-width: 2; fill: #8D6E63; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brown</text>
  <text x="50" y="120" class="subtitle">[braʊn] adj. 棕色的，褐色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "brun"，意为"棕色"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只棕色的小熊在森林里，它的毛色是"棕色(brown)"，
    <tspan x="50" dy="25">这种颜色让人联想到大地和自然。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a brown coat to match her eyes.
  </text>
  <text x="50" y="310" class="content">
    她穿了一件棕色的大衣来搭配她的眼睛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bear -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- Forest -->
    <rect x="0" y="300" width="350" height="100" class="image" />
    <line x1="50" y1="300" x2="50" y2="200" class="image" />
    <line x1="150" y1="300" x2="150" y2="200" class="image" />
    <line x1="250" y1="300" x2="250" y2="200" class="image" />
  </g>
</svg>