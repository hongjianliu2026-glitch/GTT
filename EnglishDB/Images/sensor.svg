<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sensor</text>
  <text x="50" y="120" class="subtitle">[ˈsɛnsər] n. 传感器，探测器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sens (感觉) + -or (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机器人，它的"感觉器官(sens-or)"
    <tspan x="50" dy="25">能够探测周围环境，就像人类的感官一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sensor detected a sudden increase in temperature.
  </text>
  <text x="50" y="310" class="content">
    传感器检测到温度突然升高。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot -->
    <circle cx="50" cy="100" r="30" class="image" />
    <rect x="35" y="130" width="30" height="50" class="image" />
    <line x1="50" y1="180" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="250" class="image" />
    <line x1="50" y1="220" x2="70" y2="250" class="image" />
    <line x1="50" y1="130" x2="10" y2="150" class="image" />
    <line x1="50" y1="130" x2="90" y2="150" class="image" />
    <!-- Sensor -->
    <rect x="40" y="70" width="20" height="20" class="image" />
    <line x1="50" y1="90" x2="50" y2="100" class="image" />
  </g>
</svg>