<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uncle</text>
  <text x="50" y="120" class="subtitle">[ˈʌŋkl] n. 叔叔，伯父，舅父</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (表示亲属关系) + -cle (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小男孩在公园里，"小(cle)"
    <tspan x="50" dy="25">男孩的叔叔(uncle)正在陪他玩耍，</tspan>
    <tspan x="50" dy="25">叔叔就像一个小男孩的守护者。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My uncle took me to the zoo last weekend.
  </text>
  <text x="50" y="310" class="content">
    我叔叔上周末带我去动物园了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Uncle -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Boy -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="140" x2="180" y2="180" class="image" />
    <line x1="200" y1="140" x2="220" y2="180" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <!-- Park -->
    <rect x="0" y="250" width="350" height="50" class="image" />
    <!-- Play -->
    <line x1="50" y1="220" x2="200" y2="220" class="image" />
    <line x1="50" y1="220" x2="200" y2="220" class="image" />
    <line x1="50" y1="220" x2="200" y2="220" class="image" />
  </g>
</svg>