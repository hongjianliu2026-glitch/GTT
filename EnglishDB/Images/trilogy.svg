<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trilogy</text>
  <text x="50" y="120" class="subtitle">[ˈtraɪlədʒi] n. 三部曲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tri- (三) + logy (说，学)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个作家在桌前，"三次说(tri-logy)"
    <tspan x="50" dy="25">出三个相互关联的故事，这些故事就构成了一个三部曲(trilogy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Lord of the Rings is a famous trilogy.
  </text>
  <text x="50" y="310" class="content">
    《指环王》是一部著名的三部曲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Three books -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="120" y="0" width="100" height="150" class="image" />
    <rect x="240" y="0" width="100" height="150" class="image" />
    <!-- Writer -->
    <circle cx="170" cy="200" r="15" class="image" />
    <line x1="170" y1="215" x2="170" y2="250" class="image" />
    <line x1="170" y1="250" x2="150" y2="280" class="image" />
    <line x1="170" y1="250" x2="190" y2="280" class="image" />
    <line x1="170" y1="230" x2="200" y2="220" class="image" />
  </g>
</svg>