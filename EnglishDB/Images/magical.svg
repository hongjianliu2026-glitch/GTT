<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #8E44AD; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">magical</text>
  <text x="50" y="120" class="subtitle">[ˈmædʒɪkl] adj. 有魔力的，不可思议的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mag (魔法) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔法师挥动魔杖，"魔法(mag)"
    <tspan x="50" dy="25">的力量瞬间让一切变得不可思议(magical)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The performance was so magical that everyone was amazed.
  </text>
  <text x="50" y="310" class="content">
    这场表演如此神奇，以至于每个人都感到惊叹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Wand -->
    <line x1="20" y1="115" x2="70" y2="80" class="image" />
    <circle cx="70" cy="80" r="5" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="120" cy="60" r="5" class="image" />
    <circle cx="140" cy="50" r="5" class="image" />
  </g>
</svg>