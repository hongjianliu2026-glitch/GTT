<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shrinking</text>
  <text x="50" y="120" class="subtitle">[ˈʃrɪŋkɪŋ] v. 收缩，缩小</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shrink (收缩) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件衣服在洗衣机里，"不断收缩(shrinking)"，
    <tspan x="50" dy="25">变得越来越小，直到无法再穿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sweater started shrinking after the first wash.
  </text>
  <text x="50" y="310" class="content">
    这件毛衣第一次洗后就开始缩水了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Washing machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clothes before washing -->
    <rect x="50" y="20" width="250" height="80" class="image" />
    <!-- Clothes after washing -->
    <rect x="100" y="120" width="150" height="40" class="image" />
    <!-- Arrows -->
    <line x1="175" y1="100" x2="175" y2="120" class="image" />
    <polygon points="170,110 180,110 175,120" class="image" />
  </g>
</svg>