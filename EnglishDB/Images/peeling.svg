<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peeling</text>
  <text x="50" y="120" class="subtitle">[ˈpiːlɪŋ] n. 剥皮，剥落；v. 剥皮，剥落</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peel (剥皮) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的香蕉，"剥皮(peel)"
    <tspan x="50" dy="25">的动作正在进行中，香蕉皮一片片剥落(peeling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The paint on the wall started to peel.
  </text>
  <text x="50" y="310" class="content">
    墙上的油漆开始剥落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Banana -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Peeled part -->
    <ellipse cx="150" cy="100" rx="80" ry="40" class="image" fill="#FFD700" />
    <!-- Peeling action -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <!-- Peeling strip -->
    <rect x="50" y="50" width="50" height="50" class="image" fill="#FFD700" />
  </g>
</svg>