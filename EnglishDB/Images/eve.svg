<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eve</text>
  <text x="50" y="120" class="subtitle">[iːv] n. 前夕，前夜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eve (源自拉丁语 "evenire"，意为“到来”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚，"前夕(eve)"的月亮逐渐升起，
    <tspan x="50" dy="25">预示着新的一天即将到来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had a big party on Christmas Eve.
  </text>
  <text x="50" y="310" class="content">
    我们在圣诞夜举办了一个盛大的派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" fill="#ECF0F1" />
    <circle cx="150" cy="50" r="5" class="image" fill="#ECF0F1" />
    <circle cx="200" cy="100" r="5" class="image" fill="#ECF0F1" />
    <!-- Night sky -->
    <rect x="0" y="0" width="300" height="200" class="image" fill="#2C3E50" />
  </g>
</svg>