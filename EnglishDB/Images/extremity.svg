<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extremity</text>
  <text x="50" y="120" class="subtitle">[ɪkˈstrɛmɪti] n. 极端，末端</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + trem (颤抖) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"向外颤抖(ex-trem)"，
    <tspan x="50" dy="25">感受到极端的恐惧，这就是极端(extremity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The climber reached the extremity of the mountain.
  </text>
  <text x="50" y="310" class="content">
    登山者到达了山的顶端。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on the edge -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Dashed line indicating the edge -->
    <line x1="200" y1="100" x2="350" y2="100" class="image" stroke-dasharray="5,5" />
    <!-- Fear expression -->
    <circle cx="200" cy="90" r="5" class="image" fill="#000" />
    <circle cx="215" cy="90" r="5" class="image" fill="#000" />
    <line x1="195" y1="110" x2="225" y2="110" class="image" stroke-width="3" />
  </g>
</svg>