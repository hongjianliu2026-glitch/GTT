<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">expend</text>
  <text x="50" y="120" class="subtitle">[ɪkˈspend] v. 花费，消耗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + pend (花费)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从钱包里"掏出(ex-)"钱，"花费(pend)"
    <tspan x="50" dy="25">在购买物品上，这就是"花费(expend)"的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He expended all his savings on the new car.
  </text>
  <text x="50" y="310" class="content">
    他把所有的积蓄都花在了新车上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wallet -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Money coming out -->
    <line x1="75" y1="100" x2="75" y2="200" class="image" />
    <line x1="75" y1="200" x2="50" y2="250" class="image" />
    <line x1="75" y1="200" x2="100" y2="250" class="image" />
    <!-- Shopping bag -->
    <rect x="200" y="150" width="100" height="100" class="image" />
    <line x1="250" y1="150" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="225" y2="50" class="image" />
    <line x1="250" y1="100" x2="275" y2="50" class="image" />
  </g>
</svg>