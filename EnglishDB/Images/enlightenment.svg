<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enlightenment</text>
  <text x="50" y="120" class="subtitle">[ɪnˈlaɪtnmənt] n. 启蒙，启迪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + light (光) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被一道光束照亮，"使(en-)光(light)"
    <tspan x="50" dy="25">照亮了他的心灵，这就是启蒙(enlightenment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The book provided a moment of enlightenment.
  </text>
  <text x="50" y="310" class="content">
    这本书带来了一个启迪的时刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Light beam -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="80" y2="130" class="image" />
    <line x1="100" y1="150" x2="120" y2="130" class="image" />
    <line x1="100" y1="180" x2="80" y2="200" class="image" />
    <line x1="100" y1="180" x2="120" y2="200" class="image" />
    <!-- Light bulb -->
    <circle cx="250" cy="50" r="30" class="image" />
    <line x1="250" y1="80" x2="250" y2="120" class="image" />
  </g>
</svg>