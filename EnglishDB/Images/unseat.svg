<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unseat</text>
  <text x="50" y="120" class="subtitle">[ʌnˈsiːt] v. 使失去席位，使下台</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + seat (座位)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个政治家坐在高高的椅子上，突然被"否定(un-)"了他的"座位(seat)"，
    <tspan x="50" dy="25">他就被"unseat"了，失去了他的席位。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scandal eventually unseated the mayor.
  </text>
  <text x="50" y="310" class="content">
    丑闻最终使市长下台。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="50" y="20" width="150" height="100" class="image" />
    <line x1="125" y1="120" x2="125" y2="200" class="image" />
    <line x1="50" y1="200" x2="200" y2="200" class="image" />
    <!-- Person sitting -->
    <circle cx="125" cy="90" r="20" class="image" />
    <line x1="125" y1="110" x2="125" y2="180" class="image" />
    <line x1="125" y1="180" x2="100" y2="200" class="image" />
    <line x1="125" y1="180" x2="150" y2="200" class="image" />
    <!-- Unseat action -->
    <line x1="125" y1="90" x2="125" y2="20" class="image" stroke-dasharray="5,5" />
    <line x1="125" y1="20" x2="100" y2="0" class="image" />
    <line x1="125" y1="20" x2="150" y2="0" class="image" />
  </g>
</svg>