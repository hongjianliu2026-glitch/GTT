<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ruddy</text>
  <text x="50" y="120" class="subtitle">[ˈrʌdi] adj. 红润的，血色好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rud (红色) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在寒冷的冬天里，脸颊因为寒冷而变得"红润(ruddy)"，
    <tspan x="50" dy="25">就像苹果一样红扑扑的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her cheeks were ruddy from the cold wind.
  </text>
  <text x="50" y="310" class="content">
    她的脸颊因寒风而变得红润。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF6347" />
    <!-- Cheeks -->
    <circle cx="70" cy="120" r="15" class="image" fill="#FF4500" />
    <circle cx="130" cy="120" r="15" class="image" fill="#FF4500" />
    <!-- Eyes -->
    <circle cx="85" cy="90" r="5" class="image" fill="#000000" />
    <circle cx="115" cy="90" r="5" class="image" fill="#000000" />
    <!-- Mouth -->
    <path d="M 80 140 Q 100 150 120 140" class="image" fill="none" stroke="#000000" />
  </g>
</svg>