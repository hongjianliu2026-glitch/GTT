<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">finished</text>
  <text x="50" y="120" class="subtitle">[ˈfɪnɪʃt] adj. 完成的，结束的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fin (结束) + -ish (完成)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠在完成一件艺术品，"结束(fin)"
    <tspan x="50" dy="25">并将其打磨至完美，这件作品就"完成了(finished)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was finished ahead of schedule.
  </text>
  <text x="50" y="310" class="content">
    这个项目提前完成了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artwork -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Craftsman -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Tool -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="120" y1="120" x2="120" y2="80" class="image" />
  </g>
</svg>