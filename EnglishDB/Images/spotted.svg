<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spotted</text>
  <text x="50" y="120" class="subtitle">[ˈspɒtɪd] adj. 有斑点的，有污点的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spot (斑点) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只斑点狗，身上布满了"斑点(spot)"，
    <tspan x="50" dy="25">这些斑点让它的毛色变得"有斑点的(spotted)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The spotted leopard was hiding in the bushes.
  </text>
  <text x="50" y="310" class="content">
    那只斑点豹正躲在灌木丛中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog body -->
    <ellipse cx="175" cy="100" rx="150" ry="100" class="image" />
    <!-- Spots -->
    <circle cx="100" cy="80" r="20" class="image" />
    <circle cx="250" cy="80" r="20" class="image" />
    <circle cx="175" cy="120" r="20" class="image" />
    <circle cx="120" cy="140" r="20" class="image" />
    <circle cx="230" cy="140" r="20" class="image" />
    <!-- Dog head -->
    <ellipse cx="175" cy="50" rx="50" ry="30" class="image" />
    <!-- Eyes -->
    <circle cx="160" cy="45" r="5" class="image" />
    <circle cx="190" cy="45" r="5" class="image" />
    <!-- Nose -->
    <circle cx="175" cy="60" r="5" class="image" />
    <!-- Ears -->
    <polygon points="150,30 160,10 170,30" class="image" />
    <polygon points="190,30 200,10 210,30" class="image" />
  </g>
</svg>