<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mute</text>
  <text x="50" y="120" class="subtitle">[mjuːt] adj. 沉默的，无声的；v. 使沉默，消除声音</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mut (改变) + -e (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的喇叭，突然被一只手"改变(mut)"成了
    <tspan x="50" dy="25">无声的状态，这就是"mute"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He muted the TV during the commercial.
  </text>
  <text x="50" y="310" class="content">
    他在广告时间把电视静音了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large speaker -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="40" class="image" />
    <line x1="90" y1="80" x2="250" y2="80" class="image" />
    <line x1="90" y1="120" x2="250" y2="120" class="image" />
    <line x1="250" y1="80" x2="250" y2="120" class="image" />
    <!-- Hand covering the speaker -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="180" class="image" />
    <line x1="300" y1="150" x2="280" y2="130" class="image" />
    <line x1="300" y1="150" x2="320" y2="130" class="image" />
  </g>
</svg>