<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fragile</text>
  <text x="50" y="120" class="subtitle">[ˈfrædʒaɪl] adj. 易碎的，脆弱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frag (打破) + -ile (易于...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个玻璃杯，"轻轻一碰(frag)"
    <tspan x="50" dy="25">就会破碎，这就是易碎的(fragile)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Handle the vase with care; it is fragile.
  </text>
  <text x="50" y="310" class="content">
    小心拿花瓶，它是易碎的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <line x1="20" y1="20" x2="80" y2="20" class="image" />
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <line x1="20" y1="80" x2="80" y2="80" class="image" />
    <line x1="20" y1="110" x2="80" y2="110" class="image" />
    <line x1="20" y1="140" x2="80" y2="140" class="image" />
    <!-- Cracks -->
    <line x1="50" y1="20" x2="50" y2="140" class="image" />
    <line x1="20" y1="80" x2="80" y2="80" class="image" />
  </g>
</svg>