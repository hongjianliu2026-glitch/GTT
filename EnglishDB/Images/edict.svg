<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">edict</text>
  <text x="50" y="120" class="subtitle">[ˈiːdɪkt] n. 法令，敕令</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + dict (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个国王站在高台上，"说出(dict)"
    <tspan x="50" dy="25">并颁布(e-)一项法令(edict)，</tspan>
    <tspan x="50" dy="25">整个王国都为之震动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The king issued an edict to reduce taxes.
  </text>
  <text x="50" y="310" class="content">
    国王颁布了一项减税法令。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- King on the throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="50" r="30" class="image" />
    <line x1="175" y1="80" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="140" y2="200" class="image" />
    <line x1="175" y1="150" x2="210" y2="200" class="image" />
    <line x1="175" y1="100" x2="120" y2="120" class="image" />
    <line x1="175" y1="100" x2="230" y2="120" class="image" />
    <!-- Edict scroll -->
    <rect x="100" y="150" width="150" height="40" class="image" />
    <line x1="110" y1="160" x2="240" y2="160" class="image" />
    <line x1="110" y1="180" x2="240" y2="180" class="image" />
    <line x1="110" y1="200" x2="240" y2="200" class="image" />
  </g>
</svg>