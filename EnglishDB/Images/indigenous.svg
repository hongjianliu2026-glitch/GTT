<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indigenous</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdɪdʒənəs] adj. 土著的，本地的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (在...里面) + dig (挖) + -en (使) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群土著人，"在土地里挖掘(in-dig-en-ous)"
    <tspan x="50" dy="25">出他们的根，这些根深深扎在土地里，象征着他们的本土性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The indigenous people of the Amazon have lived there for thousands of years.
  </text>
  <text x="50" y="310" class="content">
    亚马逊的土著人民已经在那里生活了数千年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Roots -->
    <line x1="50" y1="150" x2="50" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="120" class="image" />
    <line x1="150" y1="150" x2="150" y2="80" class="image" />
    <line x1="200" y1="150" x2="200" y2="110" class="image" />
    <line x1="250" y1="150" x2="250" y2="90" class="image" />
    <!-- Indigenous people -->
    <circle cx="100" cy="140" r="15" class="image" />
    <line x1="100" y1="155" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="170" x2="130" y2="160" class="image" />
  </g>
</svg>