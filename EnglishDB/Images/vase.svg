<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vase</text>
  <text x="50" y="120" class="subtitle">[veɪs] n. 花瓶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vas (容器)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的陶匠，"塑造(vas)"
    <tspan x="50" dy="25">出一个精美的容器，这个容器就是花瓶(vase)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She placed fresh flowers in the vase.
  </text>
  <text x="50" y="310" class="content">
    她把新鲜的花插在花瓶里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Vase -->
    <path d="M50 200 Q100 100 150 200 T250 200" class="image" />
    <path d="M50 200 L50 250 Q150 300 250 250 L250 200" class="image" />
    <!-- Flowers -->
    <circle cx="100" cy="180" r="10" class="image" />
    <circle cx="120" cy="170" r="10" class="image" />
    <circle cx="140" cy="180" r="10" class="image" />
    <circle cx="160" cy="170" r="10" class="image" />
    <circle cx="180" cy="180" r="10" class="image" />
  </g>
</svg>