<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">voluminous</text>
  <text x="50" y="120" class="subtitle">[vəˈluːmɪnəs] adj. 大量的，多卷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> volu- (卷) + -minous (多的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的书架，上面堆满了"多卷的(volu-minous)"
    <tspan x="50" dy="25">书籍，每一卷都厚厚的，象征着大量的内容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The historian produced a voluminous work on ancient Rome.
  </text>
  <text x="50" y="310" class="content">
    这位历史学家撰写了一部关于古罗马的巨著。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bookshelf -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <!-- Overlapping books -->
    <rect x="50" y="20" width="50" height="160" class="image" transform="translate(25, -20)" />
    <rect x="120" y="20" width="50" height="160" class="image" transform="translate(25, -20)" />
    <rect x="190" y="20" width="50" height="160" class="image" transform="translate(25, -20)" />
    <rect x="260" y="20" width="50" height="160" class="image" transform="translate(25, -20)" />
  </g>
</svg>