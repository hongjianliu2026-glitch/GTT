<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vinyl</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪnəl] n. 乙烯基，乙烯树脂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vin (葡萄) + yl (基)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的葡萄(vin)，它被压榨后变成了乙烯基(yl)，
    <tspan x="50" dy="25">这种材料可以用来制作唱片(vinyl)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He collects vinyl records from the 70s.
  </text>
  <text x="50" y="310" class="content">
    他收集70年代的乙烯基唱片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Grape -->
    <circle cx="100" cy="100" r="50" fill="#8B4513" />
    <!-- Vinyl record -->
    <circle cx="300" cy="100" r="70" fill="#000000" />
    <circle cx="300" cy="100" r="60" fill="#FFFFFF" />
    <circle cx="300" cy="100" r="10" fill="#000000" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="250" y2="100" stroke="#FF6347" stroke-width="5" />
    <polygon points="250,80 250,120 280,100" fill="#FF6347" />
  </g>
</svg>