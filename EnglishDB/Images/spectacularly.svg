<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spectacularly</text>
  <text x="50" y="120" class="subtitle">[ˌspekˈtækjələrli] adv. 壮观地，引人注目地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spect (看) + ac (形容词后缀) + ular (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场烟花表演，"壮观地(spectacularly)"
    <tspan x="50" dy="25">在夜空中绽放，吸引了所有人的目光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fireworks display was spectacularly beautiful.
  </text>
  <text x="50" y="310" class="content">
    烟花表演非常壮观美丽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fireworks -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="120" r="25" class="image" />
    <circle cx="200" cy="80" r="30" class="image" />
    <circle cx="250" cy="110" r="25" class="image" />
    <circle cx="300" cy="90" r="20" class="image" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="3" class="image" />
    <circle cx="280" cy="40" r="3" class="image" />
    <circle cx="180" cy="30" r="3" class="image" />
    <circle cx="320" cy="60" r="3" class="image" />
  </g>
</svg>