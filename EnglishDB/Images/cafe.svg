<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cafe</text>
  <text x="50" y="120" class="subtitle">[ˈkæfeɪ] n. 咖啡馆，小餐馆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> café源自法语，原意为“咖啡”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满咖啡香气的“咖啡馆(café)”，
    <tspan x="50" dy="25">人们在这里享受着咖啡和小点心，放松身心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We met at the café near the park.
  </text>
  <text x="50" y="310" class="content">
    我们在公园附近的咖啡馆见面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cafe table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Coffee cup -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <!-- Plate -->
    <rect x="100" y="120" width="100" height="50" class="image" />
    <!-- Croissant -->
    <path d="M120,130 Q130,120 140,130 T160,140" class="image" />
    <!-- People -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>