<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ahead</text>
  <text x="50" y="120" class="subtitle">[əˈhɛd] adv. 在前，向前</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (在) + head (头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在队伍的最前面，"在头(a-head)"
    <tspan x="50" dy="25">的位置，意味着他领先其他人，走在前面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is always ahead of the class in math.
  </text>
  <text x="50" y="310" class="content">
    她在数学课上总是领先于全班。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person at the front -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <line x1="50" y1="140" x2="20" y2="130" class="image" />

    <!-- Arrow pointing ahead -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,100 140,90 140,110" class="image" />

    <!-- Other people behind -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <line x1="200" y1="140" x2="170" y2="130" class="image" />
  </g>
</svg>