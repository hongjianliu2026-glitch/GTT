<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">piracy</text>
  <text x="50" y="120" class="subtitle">[ˈpaɪrəsi] n. 海盗行为，盗版</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pir (海盗) + -acy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群海盗在海上，"海盗(pir)"
    <tspan x="50" dy="25">们肆意掠夺，这种行为就是海盗行为(piracy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie industry is fighting against piracy.
  </text>
  <text x="50" y="310" class="content">
    电影行业正在打击盗版行为。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pirate ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 250,150 200,120 50,120" class="image" />
    <!-- Pirate flag -->
    <rect x="120" y="20" width="60" height="100" class="image" />
    <line x1="150" y1="20" x2="150" y2="120" class="image" />
    <!-- Skull and crossbones -->
    <circle cx="150" cy="60" r="20" class="image" />
    <line x1="130" y1="80" x2="170" y2="80" class="image" />
    <line x1="140" y1="100" x2="160" y2="100" class="image" />
    <!-- Pirate -->
    <circle cx="280" cy="100" r="15" class="image" />
    <line x1="280" y1="115" x2="280" y2="150" class="image" />
    <line x1="280" y1="150" x2="260" y2="180" class="image" />
    <line x1="280" y1="150" x2="300" y2="180" class="image" />
    <line x1="280" y1="130" x2="310" y2="120" class="image" />
  </g>
</svg>