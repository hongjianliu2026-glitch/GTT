<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .photon { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">photon</text>
  <text x="50" y="120" class="subtitle">[ˈfoʊtɒn] n. 光子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> phos (光) + -on (表示粒子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个光子(photon)，它像一个小小的光球，
    <tspan x="50" dy="25">在宇宙中自由穿梭，带来光明和能量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Photons are the fundamental particles of light.
  </text>
  <text x="50" y="310" class="content">
    光子是光的基本粒子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Light rays -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="0" y1="0" x2="100" y2="50" class="image" />
    <line x1="0" y1="0" x2="50" y2="100" class="image" />
    <line x1="0" y1="0" x2="150" y2="150" class="image" />
    <line x1="0" y1="0" x2="150" y2="75" class="image" />
    <line x1="0" y1="0" x2="75" y2="150" class="image" />
    <!-- Photon -->
    <circle cx="0" cy="0" r="20" class="photon" />
  </g>
</svg>