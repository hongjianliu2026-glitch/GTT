<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Swiss</text>
  <text x="50" y="120" class="subtitle">[swɪs] adj. 瑞士的，瑞士人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自中古英语 "Swisse"，指瑞士。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个瑞士奶酪山，上面插满了瑞士国旗，
    <tspan x="50" dy="25">每个洞里都藏着瑞士巧克力，这就是瑞士(Swiss)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Swiss Alps are famous for their beauty.
  </text>
  <text x="50" y="310" class="content">
    瑞士阿尔卑斯山以其美丽而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cheese mountain -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cheese holes -->
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
    <circle cx="250" cy="140" r="10" class="image" />
    <!-- Swiss flag -->
    <rect x="100" y="160" width="20" height="30" class="image" />
    <rect x="150" y="160" width="20" height="30" class="image" />
    <rect x="200" y="160" width="20" height="30" class="image" />
    <rect x="250" y="160" width="20" height="30" class="image" />
    <!-- Chocolate -->
    <rect x="100" y="180" width="20" height="20" class="image" />
    <rect x="150" y="180" width="20" height="20" class="image" />
    <rect x="200" y="180" width="20" height="20" class="image" />
    <rect x="250" y="180" width="20" height="20" class="image" />
  </g>
</svg>