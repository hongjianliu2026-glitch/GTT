<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mood</text>
  <text x="50" y="120" class="subtitle">[muːd] n. 心情，情绪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mood (源自中古英语 mod, 意为“精神状态”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，脸上表情不断变化，
    <tspan x="50" dy="25">从微笑到皱眉，反映出他内心的各种情绪(mood)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was in a good mood after winning the prize.
  </text>
  <text x="50" y="310" class="content">
    她赢得奖品后心情很好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Smiling face -->
    <path d="M155,110 Q175,130 195,110" class="image" />
    <!-- Frowning face -->
    <path d="M155,120 Q175,100 195,120" class="image" />
    <!-- Eyes -->
    <circle cx="160" cy="90" r="5" class="image" />
    <circle cx="190" cy="90" r="5" class="image" />
  </g>
</svg>