<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">waist</text>
  <text x="50" y="120" class="subtitle">[weɪst] n. 腰部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wast (古英语，意为“腰部”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，双手叉腰，"腰部(waist)"
    <tspan x="50" dy="25">的曲线在镜子中清晰可见，这就是“腰部”的直观画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She measured her waist to find the perfect dress size.
  </text>
  <text x="50" y="310" class="content">
    她量了量自己的腰围，以找到合适的裙子尺码。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="250" x2="50" y2="350" class="image" /> <!-- Left leg -->
    <line x1="100" y1="250" x2="150" y2="350" class="image" /> <!-- Right leg -->
    <line x1="50" y1="200" x2="150" y2="200" class="image" /> <!-- Waist -->
    <!-- Hands on waist -->
    <line x1="50" y1="200" x2="30" y2="180" class="image" /> <!-- Left hand -->
    <line x1="150" y1="200" x2="170" y2="180" class="image" /> <!-- Right hand -->
    <!-- Mirror -->
    <rect x="200" y="50" width="150" height="200" class="image" />
    <line x1="225" y1="75" x2="325" y2="75" class="image" /> <!-- Top of mirror -->
    <line x1="225" y1="225" x2="325" y2="225" class="image" /> <!-- Bottom of mirror -->
    <line x1="225" y1="75" x2="225" y2="225" class="image" /> <!-- Left side of mirror -->
    <line x1="325" y1="75" x2="325" y2="225" class="image" /> <!-- Right side of mirror -->
  </g>
</svg>