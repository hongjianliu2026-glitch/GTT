<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">navigational</text>
  <text x="50" y="120" class="subtitle">[ˌnævɪˈɡeɪʃənl] adj. 导航的，航行的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> navi- (船) + gation (引导) + al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在大海上，船长使用"导航(navi-gation)"
    <tspan x="50" dy="25">设备来引导船只前进，这就是导航的(navigational)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The navigational system helped us avoid the storm.
  </text>
  <text x="50" y="310" class="content">
    导航系统帮助我们避开了风暴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 175,120 75,120" class="image" />
    <!-- Compass -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="70" x2="250" y2="130" class="image" />
    <line x1="220" y1="100" x2="280" y2="100" class="image" />
    <!-- Waves -->
    <path d="M50,180 Q100,200 150,180 Q200,200 250,180 Q300,200 350,180" class="image" />
  </g>
</svg>