<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">run-up</text>
  <text x="50" y="120" class="subtitle">[ˈrʌn ʌp] n. 准备阶段，赛前准备</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> run (跑) + up (向上)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在起跑线上，"跑向(run-up)"
    <tspan x="50" dy="25">终点前的准备阶段，这就是赛前准备(run-up)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The run-up to the race was intense.
  </text>
  <text x="50" y="310" class="content">
    赛前的准备阶段非常紧张。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Starting line -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Runner -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Arrow pointing up -->
    <line x1="150" y1="100" x2="150" y2="20" class="image" />
    <line x1="150" y1="20" x2="140" y2="30" class="image" />
    <line x1="150" y1="20" x2="160" y2="30" class="image" />
  </g>
</svg>