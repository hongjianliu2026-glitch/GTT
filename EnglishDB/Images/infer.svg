<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infer</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfɜːr] v. 推断，推论</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + fer (带来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考，"带入(in-fer)"
    <tspan x="50" dy="25">新的信息，从而推断出结论。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> From his silence, I inferred that he was upset.
  </text>
  <text x="50" y="310" class="content">
    从他的沉默中，我推断出他很沮丧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Lightbulb -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="230" y1="150" x2="270" y2="150" class="image" />
    <line x1="240" y1="160" x2="260" y2="160" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="220" y2="100" class="image" />
    <polygon points="220,100 210,90 210,110" class="image" />
  </g>
</svg>