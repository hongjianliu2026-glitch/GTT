<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">angle</text>
  <text x="50" y="120" class="subtitle">[ˈæŋɡl] n. 角，角度；v. 钓鱼，谋取</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> angul (角)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的角(angul)，它不仅是一个几何形状，
    <tspan x="50" dy="25">还可以用来钓鱼(angle)，就像一个巨大的鱼钩。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He tried to angle for a better position in the company.
  </text>
  <text x="50" y="310" class="content">
    他试图在公司里谋取一个更好的职位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Angle -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="250" class="image" />
    <!-- Fishhook -->
    <path d="M250,50 C270,70 270,130 250,150 L230,130" class="image" />
    <!-- Fish -->
    <circle cx="230" cy="130" r="20" class="image" />
    <line x1="230" y1="110" x2="230" y2="150" class="image" />
    <line x1="230" y1="150" x2="210" y2="170" class="image" />
    <line x1="230" y1="150" x2="250" y2="170" class="image" />
  </g>
</svg>