<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fathom</text>
  <text x="50" y="120" class="subtitle">[ˈfæðəm] n. 英寻（长度单位，等于6英尺）；v. 理解，领会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fath (深) + -om (测量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个潜水员在深海中，"测量(fath-om)"
    <tspan x="50" dy="25">海底的深度，试图理解(fathom)海洋的奥秘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's hard to fathom the depth of the ocean.
  </text>
  <text x="50" y="310" class="content">
    很难理解海洋的深度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Diver -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Depth measurement -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="45" y1="20" x2="55" y2="20" class="image" />
    <line x1="45" y1="100" x2="55" y2="100" class="image" />
    <line x1="45" y1="180" x2="55" y2="180" class="image" />
    <text x="60" y="100" class="content">Depth</text>
  </g>
</svg>