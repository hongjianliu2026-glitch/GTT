<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">short-term</text>
  <text x="50" y="120" class="subtitle">[ˈʃɔːrt tɜːrm] adj. 短期的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> short (短) + term (期限)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个短小的日历前，日历上只有几天的日期，
    <tspan x="50" dy="25">象征着"短期(short-term)"的计划或目标。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They made a short-term plan to save money.
  </text>
  <text x="50" y="310" class="content">
    他们制定了一个短期计划来存钱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <line x1="20" y1="40" x2="180" y2="40" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="120" x2="180" y2="120" class="image" />
    <line x1="20" y1="160" x2="180" y2="160" class="image" />
    <!-- Dates -->
    <text x="30" y="30" class="content">1</text>
    <text x="70" y="30" class="content">2</text>
    <text x="110" y="30" class="content">3</text>
    <text x="150" y="30" class="content">4</text>
    <text x="30" y="70" class="content">5</text>
    <text x="70" y="70" class="content">6</text>
    <text x="110" y="70" class="content">7</text>
    <text x="150" y="70" class="content">8</text>
    <!-- Person -->
    <circle cx="100" cy="250" r="20" class="image" />
    <line x1="100" y1="270" x2="100" y2="320" class="image" />
    <line x1="100" y1="320" x2="80" y2="350" class="image" />
    <line x1="100" y1="320" x2="120" y2="350" class="image" />
    <line x1="100" y1="290" x2="140" y2="280" class="image" />
  </g>
</svg>