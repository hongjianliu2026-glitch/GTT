<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Euro-American</text>
  <text x="50" y="120" class="subtitle">[ˌjʊroʊ əˈmerɪkən] adj. 欧美人的，欧美的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Euro- (欧洲) + American (美洲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个融合了欧洲和美洲文化的人，"欧洲(Euro)"
    <tspan x="50" dy="25">和"美洲(American)"的结合，形成了"欧美人(Euro-American)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Euro-American cultural exchange program was a great success.
  </text>
  <text x="50" y="310" class="content">
    欧美文化交流项目取得了巨大成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- European flag -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="25" y1="25" x2="125" y2="25" class="image" />
    <line x1="25" y1="50" x2="125" y2="50" class="image" />
    <line x1="25" y1="75" x2="125" y2="75" class="image" />
    <line x1="25" y1="25" x2="25" y2="75" class="image" />
    <line x1="50" y1="25" x2="50" y2="75" class="image" />
    <line x1="75" y1="25" x2="75" y2="75" class="image" />
    <line x1="100" y1="25" x2="100" y2="75" class="image" />
    <line x1="125" y1="25" x2="125" y2="75" class="image" />

    <!-- American flag -->
    <rect x="170" y="0" width="150" height="100" class="image" />
    <line x1="195" y1="25" x2="315" y2="25" class="image" />
    <line x1="195" y1="50" x2="315" y2="50" class="image" />
    <line x1="195" y1="75" x2="315" y2="75" class="image" />
    <line x1="195" y1="25" x2="195" y2="75" class="image" />
    <line x1="220" y1="25" x2="220" y2="75" class="image" />
    <line x1="245" y1="25" x2="245" y2="75" class="image" />
    <line x1="270" y1="25" x2="270" y2="75" class="image" />
    <line x1="295" y1="25" x2="295" y2="75" class="image" />
    <line x1="320" y1="25" x2="320" y2="75" class="image" />

    <!-- Person -->
    <circle cx="245" cy="150" r="20" class="image" />
    <line x1="245" y1="170" x2="245" y2="210" class="image" />
    <line x1="245" y1="210" x2="225" y2="240" class="image" />
    <line x1="245" y1="210" x2="265" y2="240" class="image" />
    <line x1="245" y1="190" x2="215" y2="180" class="image" />
    <line x1="245" y1="190" x2="275" y2="180" class="image" />
  </g>
</svg>