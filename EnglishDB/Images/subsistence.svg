<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subsistence</text>
  <text x="50" y="120" class="subtitle">[səbˈsɪstəns] n. 生存，生计</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + sist (站立) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在地面(sist)之下(sub-)，
    <tspan x="50" dy="25">依靠最基本的食物和资源维持生存(subsistence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The family's subsistence depended on farming.
  </text>
  <text x="50" y="310" class="content">
    这个家庭的生计依赖于农业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Person standing on ground -->
    <circle cx="175" cy="130" r="20" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="230" class="image" />
    <line x1="175" y1="200" x2="200" y2="230" class="image" />
    <line x1="175" y1="170" x2="220" y2="160" class="image" />
    <!-- Basic resources -->
    <rect x="50" y="50" width="50" height="50" class="image" />
    <rect x="120" y="50" width="50" height="50" class="image" />
    <rect x="190" y="50" width="50" height="50" class="image" />
    <rect x="260" y="50" width="50" height="50" class="image" />
  </g>
</svg>