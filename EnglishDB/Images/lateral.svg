<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lateral</text>
  <text x="50" y="120" class="subtitle">[ˈlætərəl] adj. 侧面的，横向的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> later (侧面) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在中间，两边各有一只手伸出，"侧面的(lateral)"
    <tspan x="50" dy="25">动作就像是在进行横向的交流。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lateral movement of the robot arm was smooth.
  </text>
  <text x="50" y="310" class="content">
    机器人的手臂横向移动得很平稳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Central figure -->
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Left arm -->
    <line x1="200" y1="120" x2="150" y2="170" class="image" />
    <!-- Right arm -->
    <line x1="200" y1="120" x2="250" y2="170" class="image" />
    <!-- Left hand -->
    <circle cx="150" cy="170" r="10" class="image" />
    <!-- Right hand -->
    <circle cx="250" cy="170" r="10" class="image" />
  </g>
</svg>