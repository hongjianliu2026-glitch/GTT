<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feces</text>
  <text x="50" y="120" class="subtitle">[ˈfiːsiːz] n. 粪便，排泄物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fe- (来自拉丁语 "fenum"，意为“肥料”) + -ces (复数形式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在田地里，"施肥(fe-)"
    <tspan x="50" dy="25">他的庄稼，这些肥料就是粪便(feces)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The veterinarian examined the dog's feces for signs of illness.
  </text>
  <text x="50" y="310" class="content">
    兽医检查了狗的粪便以寻找疾病的迹象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Farmer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Fertilizer -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
    <circle cx="160" cy="100" r="10" class="image" />
    <circle cx="180" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="240" cy="100" r="10" class="image" />
    <circle cx="260" cy="100" r="10" class="image" />
    <circle cx="280" cy="100" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
    <circle cx="320" cy="100" r="10" class="image" />
    <circle cx="340" cy="100" r="10" class="image" />
    <circle cx="360" cy="100" r="10" class="image" />
    <circle cx="380" cy="100" r="10" class="image" />
  </g>
</svg>