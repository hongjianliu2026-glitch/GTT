<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grimy</text>
  <text x="50" y="120" class="subtitle">[ˈɡraɪmi] adj. 肮脏的，污秽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grim (肮脏的) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个满脸污垢的小孩，"肮脏的(grim)"
    <tspan x="50" dy="25">脸上沾满了泥巴，看起来非常污秽(grimy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The walls of the old factory were grimy with years of dirt.
  </text>
  <text x="50" y="310" class="content">
    旧工厂的墙壁因多年的污垢而变得肮脏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dirty face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <line x1="90" y1="120" x2="110" y2="120" class="image" />
    <line x1="100" y1="120" x2="100" y2="140" class="image" />
    <line x1="90" y1="140" x2="110" y2="140" class="image" />
    <!-- Dirt spots -->
    <circle cx="70" cy="110" r="5" class="image" fill="#8B4513" />
    <circle cx="130" cy="110" r="5" class="image" fill="#8B4513" />
    <circle cx="100" cy="130" r="5" class="image" fill="#8B4513" />
  </g>
</svg>