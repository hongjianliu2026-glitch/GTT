<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .snow { fill: #FFFFFF; }
      .ice { fill: #A6D8E7; }
      .bear { fill: #8B4513; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Arctic</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrktɪk] adj. 北极的；n. 北极</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arct (熊) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象北极熊(arct)在冰天雪地(arctic)中漫步，
    <tspan x="50" dy="25">寒冷的北极(arctic)与熊(arct)的坚韧相映成趣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Arctic is known for its extreme cold and unique wildlife.
  </text>
  <text x="50" y="310" class="content">
    北极以其极端的寒冷和独特的野生动物而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snow -->
    <rect x="0" y="0" width="350" height="200" class="snow" />
    <!-- Iceberg -->
    <polygon points="50,180 150,20 250,180" class="ice" />
    <!-- Polar bear -->
    <circle cx="150" cy="150" r="30" class="bear" />
    <line x1="150" y1="180" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="120" y2="250" class="image" />
    <line x1="150" y1="220" x2="180" y2="250" class="image" />
    <line x1="150" y1="200" x2="100" y2="190" class="image" />
    <line x1="150" y1="200" x2="200" y2="190" class="image" />
  </g>
</svg>