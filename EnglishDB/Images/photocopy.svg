<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">photocopy</text>
  <text x="50" y="120" class="subtitle">[ˈfoʊtoʊˌkɒpi] n. 影印本，复印件；v. 影印，复印</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> photo- (光) + copy (复制)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台复印机在"光(photo)"的照射下，
    <tspan x="50" dy="25">将原稿"复制(copy)"成一份影印本(photocopy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I need to photocopy this document before the meeting.
  </text>
  <text x="50" y="310" class="content">
    我需要在会议前复印这份文件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Photocopier -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Original document -->
    <rect x="50" y="20" width="100" height="150" class="image" />
    <!-- Light beam -->
    <line x1="150" y1="95" x2="250" y2="95" class="image" />
    <!-- Copied document -->
    <rect x="250" y="20" width="100" height="150" class="image" />
  </g>
</svg>