<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blister</text>
  <text x="50" y="120" class="subtitle">[ˈblɪstər] n. 水泡，气泡；v. 起泡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blis- (燃烧) + ter (产生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个炎热的夏天，你的脚在鞋子里"燃烧(blis-)"，
    <tspan x="50" dy="25">结果"产生(ter)"了水泡(blister)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hot weather caused blisters on my feet.
  </text>
  <text x="50" y="310" class="content">
    炎热的天气让我的脚起了水泡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Foot with blister -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="120" cy="80" r="10" class="image" fill="#E74C3C" />
    <circle cx="140" cy="100" r="10" class="image" fill="#E74C3C" />
    <circle cx="110" cy="120" r="10" class="image" fill="#E74C3C" />
    <circle cx="130" cy="110" r="10" class="image" fill="#E74C3C" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" fill="#F1C40F" />
    <line x1="250" y1="80" x2="250" y2="120" class="image" />
    <line x1="220" y1="95" x2="180" y2="95" class="image" />
    <line x1="280" y1="95" x2="320" y2="95" class="image" />
    <line x1="235" y1="70" x2="205" y2="40" class="image" />
    <line x1="265" y1="70" x2="295" y2="40" class="image" />
  </g>
</svg>