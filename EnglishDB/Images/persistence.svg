<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">persistence</text>
  <text x="50" y="120" class="subtitle">[pərˈsɪstəns] n. 坚持，持续</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (贯穿) + sist (站立) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在漫长的道路上，"贯穿(per-)"
    <tspan x="50" dy="25">始终"站立(sist)"不倒，这就是坚持(persistence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her persistence in studying paid off; she finally passed the exam.
  </text>
  <text x="50" y="310" class="content">
    她坚持学习终于有了回报，她终于通过了考试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <!-- Person standing -->
    <circle cx="175" cy="80" r="15" class="image" />
    <line x1="175" y1="95" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="120" x2="205" y2="110" class="image" />
  </g>
</svg>