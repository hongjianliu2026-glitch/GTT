<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chatter</text>
  <text x="50" y="120" class="subtitle">[ˈtʃætər] v. 喋喋不休，唠叨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chat (聊天) + -ter (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人不停地"聊天(chat)"，嘴巴像机关枪一样"反复(ter)"
    <tspan x="50" dy="25">发射话语，这就是喋喋不休(chatter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were chattering excitedly about their trip.
  </text>
  <text x="50" y="310" class="content">
    孩子们兴奋地喋喋不休地谈论他们的旅行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Teeth -->
    <rect x="40" y="40" width="20" height="10" class="image" />
    <rect x="45" y="50" width="10" height="10" class="image" />
    <!-- Chatter lines -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="50" y1="75" x2="50" y2="105" class="image" />
    <line x1="50" y1="80" x2="50" y2="110" class="image" />
    <line x1="50" y1="85" x2="50" y2="115" class="image" />
    <line x1="50" y1="90" x2="50" y2="120" class="image" />
  </g>
</svg>