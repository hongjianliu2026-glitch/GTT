<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suggestion</text>
  <text x="50" y="120" class="subtitle">[səɡˈdʒɛstʃən] n. 建议，提议</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sug- (下面) + gest (带来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在会议中，"从下面带来(sug-gest)"
    <tspan x="50" dy="25">一个想法，这个想法就是建议(suggestion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His suggestion to improve the workflow was well-received.
  </text>
  <text x="50" y="310" class="content">
    他提出的改进工作流程的建议得到了很好的反响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 80 90 Q 120 80 150 90 Q 180 100 180 130 Q 180 160 150 170 Q 120 180 80 170 Q 50 160 50 130 Z" class="image" />
    <text x="100" y="130" class="content" text-anchor="middle">Idea</text>
  </g>
</svg>