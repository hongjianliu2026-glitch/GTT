<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Swedish</text>
  <text x="50" y="120" class="subtitle">[ˈswiːdɪʃ] adj. 瑞典的；n. 瑞典语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Swede (瑞典人) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个瑞典人(Swede)穿着传统的瑞典服装，
    <tspan x="50" dy="25">戴着一顶蓝色的帽子，上面有一个金色的十字架，</tspan>
    <tspan x="50" dy="25">这就是瑞典(Swedish)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks fluent Swedish.
  </text>
  <text x="50" y="310" class="content">
    她能说流利的瑞典语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Swedish flag -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="60" fill="#005293" />
    <rect x="50" y="80" width="250" height="60" fill="#FECC00" />
    <rect x="150" y="20" width="20" height="120" fill="#FECC00" />
    <rect x="50" y="70" width="250" height="20" fill="#FECC00" />
    <!-- Swedish hat -->
    <polygon points="175,10 225,10 250,50 150,50" fill="#005293" />
    <rect x="175" y="10" width="50" height="40" fill="#FECC00" />
    <line x1="200" y1="50" x2="200" y2="70" class="image" />
    <line x1="200" y1="70" x2="180" y2="100" class="image" />
    <line x1="200" y1="70" x2="220" y2="100" class="image" />
  </g>
</svg>