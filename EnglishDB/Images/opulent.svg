<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">opulent</text>
  <text x="50" y="120" class="subtitle">[ˈɒpjələnt] adj. 丰富的，富裕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> op- (财富) + -ulent (充满的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里堆满了金银珠宝，"财富(op-)"
    <tspan x="50" dy="25">溢出(ulent)，整个房间都充满了富裕的气息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The opulent mansion was filled with priceless art.
  </text>
  <text x="50" y="310" class="content">
    那座富裕的豪宅里摆满了无价之宝的艺术品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gold coins -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="80" cy="70" r="20" class="image" />
    <circle cx="110" cy="90" r="20" class="image" />
    <!-- Jewels -->
    <rect x="150" y="30" width="30" height="30" class="image" />
    <rect x="180" y="50" width="30" height="30" class="image" />
    <rect x="210" y="70" width="30" height="30" class="image" />
    <!-- Wealthy person -->
    <circle cx="280" cy="100" r="15" class="image" />
    <line x1="280" y1="115" x2="280" y2="150" class="image" />
    <line x1="280" y1="150" x2="260" y2="180" class="image" />
    <line x1="280" y1="150" x2="300" y2="180" class="image" />
    <line x1="280" y1="130" x2="310" y2="120" class="image" />
  </g>
</svg>