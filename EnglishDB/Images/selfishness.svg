<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">selfishness</text>
  <text x="50" y="120" class="subtitle">[ˈsɛlfɪʃnɪs] n. 自私，自我中心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self (自己) + ish (形容词后缀) + ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把所有的东西都"围在自己(self)"周围，
    <tspan x="50" dy="25">不让别人分享，这种行为就是自私(selfishness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His selfishness made him unpopular among his friends.
  </text>
  <text x="50" y="310" class="content">
    他的自私使他在朋友中不受欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Selfish person -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <line x1="100" y1="160" x2="70" y2="130" class="image" />
    <line x1="100" y1="160" x2="130" y2="130" class="image" />
    <line x1="100" y1="200" x2="70" y2="230" class="image" />
    <line x1="100" y1="200" x2="130" y2="230" class="image" />
    <!-- Surrounding objects -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <!-- Barriers -->
    <line x1="70" y1="70" x2="130" y2="70" class="image" />
    <line x1="70" y1="170" x2="130" y2="170" class="image" />
    <line x1="70" y1="70" x2="70" y2="170" class="image" />
    <line x1="130" y1="70" x2="130" y2="170" class="image" />
  </g>
</svg>