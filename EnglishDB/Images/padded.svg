<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">padded</text>
  <text x="50" y="120" class="subtitle">[ˈpædɪd] adj. 有衬垫的，填充的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pad (垫子) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拳击手穿着"有衬垫(padded)"的拳击手套，
    <tspan x="50" dy="25">保护双手免受伤害，这就是"padded"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chair was padded with soft cushions.
  </text>
  <text x="50" y="310" class="content">
    椅子用柔软的垫子填充。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gloves -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="160" y="0" width="150" height="100" class="image" />
    <!-- Padding -->
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <line x1="180" y1="20" x2="290" y2="20" class="image" />
    <line x1="180" y1="40" x2="290" y2="40" class="image" />
    <line x1="180" y1="60" x2="290" y2="60" class="image" />
    <line x1="180" y1="80" x2="290" y2="80" class="image" />
    <!-- Fist -->
    <circle cx="85" cy="60" r="20" class="image" />
    <circle cx="245" cy="60" r="20" class="image" />
  </g>
</svg>