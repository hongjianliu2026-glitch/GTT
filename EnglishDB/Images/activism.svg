<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">activism</text>
  <text x="50" y="120" class="subtitle">[ˈæktɪvɪzəm] n. 行动主义，激进主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> act (行动) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人举着标语，"行动(act)"
    <tspan x="50" dy="25">起来，为他们的信念而战，这就是行动主义(activism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Environmental activism has gained momentum in recent years.
  </text>
  <text x="50" y="310" class="content">
    近年来，环保行动主义势头强劲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Banner -->
    <rect x="20" y="50" width="160" height="30" class="image" />
    <text x="30" y="70" class="content" fill="#FFFFFF">ACT</text>
    <!-- Arms -->
    <line x1="50" y1="115" x2="20" y2="150" class="image" />
    <line x1="50" y1="115" x2="80" y2="150" class="image" />
    <line x1="100" y1="115" x2="70" y2="150" class="image" />
    <line x1="100" y1="115" x2="130" y2="150" class="image" />
    <line x1="150" y1="115" x2="120" y2="150" class="image" />
    <line x1="150" y1="115" x2="180" y2="150" class="image" />
  </g>
</svg>