<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dilemma</text>
  <text x="50" y="120" class="subtitle">[daɪˈlemə] n. 困境，进退两难</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (两个) + lemma (假设)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在两条路的交叉口，"面对两个(di-)假设(lemma)"，
    <tspan x="50" dy="25">无法决定走哪条路，这就是一个困境(dilemma)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was in a dilemma about whether to take the job or stay in school.
  </text>
  <text x="50" y="310" class="content">
    她对是否接受这份工作还是留在学校感到进退两难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crossroads -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Question marks -->
    <text x="150" y="80" class="image" font-size="30">?</text>
    <text x="200" y="80" class="image" font-size="30">?</text>
  </g>
</svg>