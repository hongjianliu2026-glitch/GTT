<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skiff</text>
  <text x="50" y="120" class="subtitle">[skɪf] n. 小艇，轻舟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skiff (源自中古荷兰语 skif，意为“小船”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘轻盈的小艇(skiff)在湖面上滑行，
    <tspan x="50" dy="25">船身轻盈如羽毛，仿佛能随风飘动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They rented a skiff to explore the lake.
  </text>
  <text x="50" y="310" class="content">
    他们租了一艘小艇去探索湖区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Water -->
    <rect x="0" y="150" width="400" height="100" fill="#3498DB" />
    <!-- Skiff -->
    <polygon points="150,150 250,150 225,100 175,100" fill="#F39C12" stroke="#D35400" stroke-width="2" />
    <!-- Oars -->
    <line x1="175" y1="100" x2="150" y2="50" class="image" />
    <line x1="225" y1="100" x2="250" y2="50" class="image" />
    <!-- Person -->
    <circle cx="200" cy="80" r="10" fill="#2C3E50" />
    <line x1="200" y1="90" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="190" y2="140" class="image" />
    <line x1="200" y1="120" x2="210" y2="140" class="image" />
    <line x1="200" y1="100" x2="220" y2="90" class="image" />
  </g>
</svg>