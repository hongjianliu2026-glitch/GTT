<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gravitational</text>
  <text x="50" y="120" class="subtitle">[ˌɡrævɪˈteɪʃənl] adj. 重力的，引力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gravit (重力) + -ation (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的星球，"重力(gravit)"
    <tspan x="50" dy="25">将所有东西都拉向它的中心，这就是引力(gravitational)的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gravitational force of the Earth keeps us on the ground.
  </text>
  <text x="50" y="310" class="content">
    地球的引力让我们保持在地面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Planet -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Objects being pulled -->
    <line x1="200" y1="100" x2="150" y2="100" class="image" />
    <line x1="200" y1="100" x2="150" y2="120" class="image" />
    <line x1="200" y1="100" x2="150" y2="80" class="image" />
    <line x1="200" y1="100" x2="150" y2="140" class="image" />
    <line x1="200" y1="100" x2="150" y2="60" class="image" />
    <!-- Arrows -->
    <polygon points="200,100 180,90 180,110" class="image" />
    <polygon points="200,100 180,130 180,150" class="image" />
    <polygon points="200,100 180,70 180,50" class="image" />
    <polygon points="200,100 180,170 180,190" class="image" />
    <polygon points="200,100 180,30 180,10" class="image" />
  </g>
</svg>