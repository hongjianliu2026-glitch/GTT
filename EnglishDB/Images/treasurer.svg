<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">treasurer</text>
  <text x="50" y="120" class="subtitle">[ˈtrɛʒərər] n. 司库，财务主管</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> treasure (财富) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个财务主管(treasurer)，他手里拿着一个巨大的金库钥匙，
    <tspan x="50" dy="25">守护着公司的财富(treasure)，确保每一分钱都安全无虞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The treasurer manages the company's finances.
  </text>
  <text x="50" y="310" class="content">
    财务主管管理公司的财务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vault door -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Vault handle -->
    <circle cx="175" cy="100" r="20" class="image" />
    <!-- Key -->
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="300" y2="50" class="image" />
    <line x1="300" y1="50" x2="280" y2="50" class="image" />
    <line x1="280" y1="50" x2="280" y2="70" class="image" />
    <!-- Treasurer -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>