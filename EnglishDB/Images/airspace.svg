<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">airspace</text>
  <text x="50" y="120" class="subtitle">[ˈɛrˌspeɪs] n. 空域，领空</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> air (空气) + space (空间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的天空，"空气中的空间(air-space)"
    <tspan x="50" dy="25">就是飞机自由飞翔的领空(airspace)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The drone violated the country's airspace.
  </text>
  <text x="50" y="310" class="content">
    无人机侵犯了该国的领空。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="50" rx="80" ry="30" class="image" />
    <ellipse cx="250" cy="70" rx="60" ry="25" class="image" />
    <!-- Plane -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
    <line x1="100" y1="100" x2="100" y2="140" class="image" />
    <line x1="100" y1="140" x2="80" y2="160" class="image" />
    <line x1="100" y1="140" x2="120" y2="160" class="image" />
  </g>
</svg>