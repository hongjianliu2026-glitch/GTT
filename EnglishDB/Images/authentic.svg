<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">authentic</text>
  <text x="50" y="120" class="subtitle">[ɔːˈθentɪk] adj. 真实的，真正的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> authent- (真实) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的"真实(authent-)"印章，
    <tspan x="50" dy="25">只有真正的国王才能使用，象征着"真正的(authentic)"权威。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The antique dealer assured us the painting was authentic.
  </text>
  <text x="50" y="310" class="content">
    古董商向我们保证这幅画是真品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ancient seal -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- King's crown -->
    <polygon points="100,20 70,70 130,70" class="image" />
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <line x1="85" y1="40" x2="115" y2="40" class="image" />
  </g>
</svg>