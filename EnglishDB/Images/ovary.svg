<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ovary</text>
  <text x="50" y="120" class="subtitle">[ˈoʊvəri] n. 卵巢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ov (卵) + -ary (表示场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的卵(ov)，它被放置在一个特殊的场所(-ary)，
    <tspan x="50" dy="25">这个场所就是卵巢(ovary)，它是孕育生命的地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor examined her ovaries during the ultrasound.
  </text>
  <text x="50" y="310" class="content">
    医生在超声波检查中检查了她的卵巢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ovary shape -->
    <ellipse cx="175" cy="100" rx="100" ry="60" class="image" />
    <!-- Egg shape -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Label -->
    <text x="175" y="200" text-anchor="middle" class="content">Ovary</text>
  </g>
</svg>