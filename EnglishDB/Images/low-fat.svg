<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">low-fat</text>
  <text x="50" y="120" class="subtitle">[ˈloʊ fæt] adj. 低脂肪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> low (低的) + fat (脂肪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个健康食品标签上写着"低脂肪(low-fat)"，
    <tspan x="50" dy="25">旁边有一个瘦小的脂肪分子在跳舞，表示脂肪含量很低。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers low-fat yogurt for breakfast.
  </text>
  <text x="50" y="310" class="content">
    她早餐更喜欢低脂酸奶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Food label -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <text x="50" y="50" class="content" fill="#2C3E50">Low-Fat</text>
    <!-- Fat molecule -->
    <circle cx="150" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="140" y2="150" class="image" />
    <line x1="150" y1="130" x2="160" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="110" class="image" />
  </g>
</svg>