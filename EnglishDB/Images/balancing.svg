<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">balancing</text>
  <text x="50" y="120" class="subtitle">[ˈbælənsɪŋ] n. 平衡，均衡；v. 使平衡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> balanc (平衡) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个杂技演员在高空钢丝上"保持平衡(balancing)"，
    <tspan x="50" dy="25">他的每一个动作都小心翼翼，生怕失去平衡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She practiced balancing on one foot for hours.
  </text>
  <text x="50" y="310" class="content">
    她练习单脚站立了好几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- High wire -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Acrobat -->
    <circle cx="175" cy="50" r="15" class="image" />
    <line x1="175" y1="65" x2="175" y2="100" class="image" />
    <line x1="175" y1="100" x2="155" y2="130" class="image" />
    <line x1="175" y1="100" x2="195" y2="130" class="image" />
    <line x1="175" y1="80" x2="205" y2="70" class="image" />
  </g>
</svg>