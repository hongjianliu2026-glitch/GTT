<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cascade</text>
  <text x="50" y="120" class="subtitle">[kæˈskeɪd] n. 小瀑布，层叠；v. 像瀑布般落下</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cas (落下) + -cade (连续动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象水流从高处"连续落下(cas-cade)"，形成一连串的小瀑布，
    <tspan x="50" dy="25">这些小瀑布就像一串串珍珠，美丽而壮观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The waterfall cascaded down the rocky cliff.
  </text>
  <text x="50" y="310" class="content">
    瀑布从岩石峭壁上层叠而下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Waterfall -->
    <path d="M0 0 L50 100 L100 0 L150 100 L200 0 L250 100 L300 0" class="image" />
    <!-- Water drops -->
    <circle cx="50" cy="100" r="5" class="image" />
    <circle cx="150" cy="100" r="5" class="image" />
    <circle cx="250" cy="100" r="5" class="image" />
    <!-- Rocks -->
    <rect x="0" y="100" width="300" height="50" class="image" />
  </g>
</svg>