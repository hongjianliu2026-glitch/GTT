<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oriented</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrientɪd] adj. 导向的，定向的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ori (升起) + ent (形容词后缀) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指南针，"升起(ori)"
    <tspan x="50" dy="25">并指向东方，这个指南针就是定向的(oriented)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is customer-oriented.
  </text>
  <text x="50" y="310" class="content">
    这家公司以客户为导向。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compass -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="95" y1="100" x2="255" y2="100" class="image" />
    <!-- Arrow pointing east -->
    <polygon points="255,100 235,80 235,120" class="image" />
    <!-- Text labels -->
    <text x="175" y="40" text-anchor="middle" class="content">N</text>
    <text x="280" y="105" text-anchor="middle" class="content">E</text>
    <text x="175" y="190" text-anchor="middle" class="content">S</text>
    <text x="70" y="105" text-anchor="middle" class="content">W</text>
  </g>
</svg>