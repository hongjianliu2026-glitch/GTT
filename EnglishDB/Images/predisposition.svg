<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">predisposition</text>
  <text x="50" y="120" class="subtitle">[ˌpriːdɪspəˈzɪʃən] n. 倾向，偏好</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + disposition (安排，倾向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的箭头前，箭头指向一个方向，
    <tspan x="50" dy="25">这个人"提前安排(pre-disposition)"了自己的倾向，</tspan>
    <tspan x="50" dy="25">就像箭头一样指向某个特定的方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His predisposition to help others made him a great leader.
  </text>
  <text x="50" y="310" class="content">
    他乐于助人的倾向使他成为了一个伟大的领导者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <polygon points="300,50 280,30 280,70" class="image" />
    <!-- Person -->
    <circle cx="20" cy="50" r="15" class="image" />
    <line x1="20" y1="65" x2="20" y2="100" class="image" />
    <line x1="20" y1="100" x2="0" y2="130" class="image" />
    <line x1="20" y1="100" x2="40" y2="130" class="image" />
    <line x1="20" y1="80" x2="50" y2="70" class="image" />
  </g>
</svg>