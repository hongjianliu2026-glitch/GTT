<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">polarize</text>
  <text x="50" y="120" class="subtitle">[ˈpoʊləraɪz] v. 使两极化，使分化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pol (pole, 极) + -arize (使...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磁铁，"使(arize)"
    <tspan x="50" dy="25">两极(pol)产生强烈的对立，人们被分成两派(polarize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The debate polarized the community into two opposing groups.
  </text>
  <text x="50" y="310" class="content">
    这场辩论使社区分化成了两个对立的群体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnet -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="300" y1="100" x2="300" y2="150" class="image" />
    <text x="40" y="170" class="content">N</text>
    <text x="310" y="170" class="content">S</text>
    <!-- People -->
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <line x1="100" y1="65" x2="100" y2="100" class="image" />
    <line x1="250" y1="65" x2="250" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <polygon points="250,150 240,140 240,160" class="image" />
    <polygon points="100,150 110,140 110,160" class="image" />
  </g>
</svg>