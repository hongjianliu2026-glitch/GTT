<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">devious</text>
  <text x="50" y="120" class="subtitle">[ˈdiːviəs] adj. 狡猾的，不正直的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + via (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在森林中，"离开(de-)"
    <tspan x="50" dy="25">正道(via)，走了一条狡猾的小路，</tspan>
    <tspan x="50" dy="25">这就是devious(狡猾的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used devious methods to win the election.
  </text>
  <text x="50" y="310" class="content">
    他用狡猾的手段赢得了选举。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest path -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <!-- Devious path -->
    <line x1="50" y1="0" x2="100" y2="200" class="image" />
    <line x1="100" y1="0" x2="150" y2="200" class="image" />
    <line x1="150" y1="0" x2="200" y2="200" class="image" />
    <line x1="200" y1="0" x2="250" y2="200" class="image" />
    <line x1="250" y1="0" x2="300" y2="200" class="image" />
    <line x1="300" y1="0" x2="350" y2="200" class="image" />
    <!-- Person -->
    <circle cx="75" cy="220" r="15" class="image" />
    <line x1="75" y1="235" x2="75" y2="270" class="image" />
    <line x1="75" y1="270" x2="55" y2="300" class="image" />
    <line x1="75" y1="270" x2="95" y2="300" class="image" />
    <line x1="75" y1="250" x2="105" y2="240" class="image" />
  </g>
</svg>