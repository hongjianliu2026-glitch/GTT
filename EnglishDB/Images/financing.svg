<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">financing</text>
  <text x="50" y="120" class="subtitle">[fəˈnænsɪŋ] n. 融资，筹资</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fin (结束) + ance (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人拿着一堆钱，"结束(fin)"
    <tspan x="50" dy="25">筹集资金的行为(ance)，这就是融资(financing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company secured financing for its new project.
  </text>
  <text x="50" y="310" class="content">
    公司为其新项目筹集了资金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Money stack -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="10" y="10" width="130" height="30" class="image" />
    <rect x="10" y="50" width="130" height="30" class="image" />
    <rect x="10" y="90" width="130" height="30" class="image" />
    <rect x="10" y="130" width="130" height="30" class="image" />
    <rect x="10" y="170" width="130" height="30" class="image" />
    <!-- Businessman -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Hand holding money -->
    <line x1="200" y1="150" x2="150" y2="100" class="image" />
  </g>
</svg>