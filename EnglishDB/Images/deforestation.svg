<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deforestation</text>
  <text x="50" y="120" class="subtitle">[ˌdiːfəˈsteɪʃən] n. 森林砍伐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (去除) + forest (森林) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片茂密的森林，突然被"去除(de-)"
    <tspan x="50" dy="25">成了一片光秃秃的土地，这就是森林砍伐(deforestation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Deforestation has led to a loss of biodiversity in the region.
  </text>
  <text x="50" y="310" class="content">
    森林砍伐导致了该地区生物多样性的丧失。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest before deforestation -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="180" x2="50" y2="20" class="image" />
    <line x1="100" y1="180" x2="100" y2="40" class="image" />
    <line x1="150" y1="180" x2="150" y2="60" class="image" />
    <line x1="200" y1="180" x2="200" y2="80" class="image" />
    <line x1="250" y1="180" x2="250" y2="100" class="image" />
    <line x1="300" y1="180" x2="300" y2="120" class="image" />

    <!-- Forest after deforestation -->
    <rect x="0" y="220" width="350" height="200" class="image" />
    <line x1="50" y1="400" x2="50" y2="220" class="image" />
    <line x1="100" y1="400" x2="100" y2="240" class="image" />
    <line x1="150" y1="400" x2="150" y2="260" class="image" />
    <line x1="200" y1="400" x2="200" y2="280" class="image" />
    <line x1="250" y1="400" x2="250" y2="300" class="image" />
    <line x1="300" y1="400" x2="300" y2="320" class="image" />

    <!-- Axe -->
    <line x1="320" y1="360" x2="340" y2="380" class="image" />
    <line x1="320" y1="360" x2="300" y2="380" class="image" />
    <line x1="310" y1="370" x2="330" y2="390" class="image" />
  </g>
</svg>