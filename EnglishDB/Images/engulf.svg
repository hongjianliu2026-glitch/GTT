<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">engulf</text>
  <text x="50" y="120" class="subtitle">[ɪnˈɡʌlf] v. 吞没，吞噬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + gulf (深渊)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的深渊，"进入(en-)"
    <tspan x="50" dy="25">并吞噬(gulf)一切，这就是吞没(engulf)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship was engulfed by the stormy sea.
  </text>
  <text x="50" y="310" class="content">
    船被暴风雨的大海吞没了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gulf -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Ship -->
    <rect x="150" y="150" width="50" height="20" class="image" />
    <line x1="150" y1="150" x2="175" y2="130" class="image" />
    <line x1="200" y1="150" x2="175" y2="130" class="image" />
    <!-- Waves -->
    <line x1="100" y1="180" x2="250" y2="180" class="image" />
    <line x1="100" y1="200" x2="250" y2="200" class="image" />
    <line x1="100" y1="220" x2="250" y2="220" class="image" />
  </g>
</svg>