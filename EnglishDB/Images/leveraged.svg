<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leveraged</text>
  <text x="50" y="120" class="subtitle">[ˈlɛvərɪdʒd] adj. 杠杆的，借力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lever (杠杆) + -age (名词后缀) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的杠杆上，"借力(leveraged)"
    <tspan x="50" dy="25">抬起了一座山，这种夸张的力量就是杠杆效应。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company used leveraged finance to acquire the new factory.
  </text>
  <text x="50" y="310" class="content">
    公司利用杠杆融资收购了新工厂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lever -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Fulcrum -->
    <rect x="175" y="-10" width="10" height="20" class="image" />
    <!-- Person -->
    <circle cx="30" cy="0" r="15" class="image" />
    <line x1="30" y1="15" x2="30" y2="50" class="image" />
    <line x1="30" y1="50" x2="10" y2="80" class="image" />
    <line x1="30" y1="50" x2="50" y2="80" class="image" />
    <line x1="30" y1="30" x2="60" y2="20" class="image" />
    <!-- Mountain -->
    <polygon points="200,0 250,50 150,50" class="image" />
  </g>
</svg>