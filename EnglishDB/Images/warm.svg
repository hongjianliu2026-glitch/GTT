<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">warm</text>
  <text x="50" y="120" class="subtitle">[wɔrm] adj. 温暖的，热情的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> war- (热)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温暖的太阳，"散发着热量(war-m)"，
    <tspan x="50" dy="25">照耀着大地，让人感到温暖(warm)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sun's rays made the room warm.
  </text>
  <text x="50" y="310" class="content">
    阳光使房间变得温暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#FFD700" stroke="#FFA000" stroke-width="5" />
    <!-- Rays -->
    <line x1="100" y1="50" x2="100" y2="0" stroke="#FFA000" stroke-width="5" />
    <line x1="150" y1="100" x2="200" y2="100" stroke="#FFA000" stroke-width="5" />
    <line x1="100" y1="150" x2="100" y2="200" stroke="#FFA000" stroke-width="5" />
    <line x1="50" y1="100" x2="0" y2="100" stroke="#FFA000" stroke-width="5" />
    <!-- Ground -->
    <rect x="0" y="200" width="200" height="50" fill="#8B4513" />
  </g>
</svg>