<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seating</text>
  <text x="50" y="120" class="subtitle">[ˈsiːtɪŋ] n. 座位安排，座椅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seat (座位) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宴会厅，"座位(seat)"
    <tspan x="50" dy="25">被精心安排(seating)，每个座位上都有一张</tspan>
    <tspan x="50" dy="25">精美的座位卡，确保每位宾客都能找到</tspan>
    <tspan x="50" dy="25">自己的位置。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The seating arrangement at the wedding was perfect.
  </text>
  <text x="50" y="330" class="content">
    婚礼上的座位安排非常完美。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chairs -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="150" y="20" width="50" height="100" class="image" />
    <rect x="250" y="20" width="50" height="100" class="image" />
    <!-- Place cards -->
    <rect x="60" y="130" width="30" height="30" class="image" />
    <rect x="160" y="130" width="30" height="30" class="image" />
    <rect x="260" y="130" width="30" height="30" class="image" />
    <!-- Text on place cards -->
    <text x="65" y="150" class="content">A</text>
    <text x="165" y="150" class="content">B</text>
    <text x="265" y="150" class="content">C</text>
  </g>
</svg>