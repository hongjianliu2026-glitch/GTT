<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">breakout</text>
  <text x="50" y="120" class="subtitle">[ˈbreɪkaʊt] n. 突破，爆发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> break (打破) + out (向外)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堵墙突然被打破，"向外爆发(break-out)"
    <tspan x="50" dy="25">出巨大的能量，这就是突破(breakout)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company experienced a breakout in sales last quarter.
  </text>
  <text x="50" y="310" class="content">
    公司上个季度的销售额出现了突破。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Broken wall -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Explosion -->
    <circle cx="200" cy="100" r="50" class="image" />
    <circle cx="200" cy="100" r="40" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
  </g>
</svg>