<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lined</text>
  <text x="50" y="120" class="subtitle">[laɪnd] adj. 有衬里的，有线条的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> line (线) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件衣服，"衬里(line)"
    <tspan x="50" dy="25">上有许多线条，这些线条让衣服看起来更有层次感，</tspan>
    <tspan x="50" dy="25">这就是"有衬里的(lined)"衣服。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a lined jacket to keep warm.
  </text>
  <text x="50" y="310" class="content">
    她穿了一件有衬里的夹克来保暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jacket outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lined pattern -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <!-- Jacket -->
    <rect x="50" y="20" width="250" height="160" class="image" />
  </g>
</svg>