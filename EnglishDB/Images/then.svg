<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">then</text>
  <text x="50" y="120" class="subtitle">[ðɛn] adv. 然后，接着</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> then (源自中古英语 thenne, 意为“那时”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时间线，"然后(then)"
    <tspan x="50" dy="25">发生的事情就像一条线上的点，一个接一个。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> First, we ate dinner, then we went for a walk.
  </text>
  <text x="50" y="310" class="content">
    我们先吃了晚饭，然后去散步。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Timeline -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Points on timeline -->
    <circle cx="50" cy="0" r="10" class="image" />
    <circle cx="150" cy="0" r="10" class="image" />
    <circle cx="250" cy="0" r="10" class="image" />
    <!-- Arrows -->
    <line x1="50" y1="0" x2="140" y2="0" class="image" />
    <line x1="150" y1="0" x2="240" y2="0" class="image" />
    <line x1="250" y1="0" x2="340" y2="0" class="image" />
    <!-- Text labels -->
    <text x="30" y="-20" class="content">First</text>
    <text x="130" y="-20" class="content">Then</text>
    <text x="230" y="-20" class="content">Next</text>
  </g>
</svg>