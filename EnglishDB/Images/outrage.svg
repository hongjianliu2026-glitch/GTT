<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outrage</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtreɪdʒ] n. 愤怒，暴行；v. 激怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (超过) + rage (愤怒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被激怒到"超过(out-)"了正常的愤怒(rage)，
    <tspan x="50" dy="25">他的脸变得通红，眼睛瞪得大大的，这就是outrage。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The public's outrage over the scandal forced the resignation of the minister.
  </text>
  <text x="50" y="310" class="content">
    公众对丑闻的愤怒迫使部长辞职。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <line x1="60" y1="140" x2="140" y2="140" class="image" />
    <line x1="80" y1="160" x2="120" y2="160" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="80" y1="190" x2="120" y2="190" class="image" />
    <line x1="60" y1="200" x2="140" y2="200" class="image" />
  </g>
</svg>