<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">noisy</text>
  <text x="50" y="120" class="subtitle">[ˈnɔɪzi] adj. 吵闹的，嘈杂的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> noise (噪音) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满噪音的房间，"噪音(noise)"
    <tspan x="50" dy="25">无处不在，让人感到"吵闹的(noisy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The noisy children were playing in the park.
  </text>
  <text x="50" y="310" class="content">
    吵闹的孩子们在公园里玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Noise symbols -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="150" cy="110" r="10" class="image" />
    <circle cx="200" cy="140" r="10" class="image" />
    <circle cx="250" cy="170" r="10" class="image" />
    <circle cx="300" cy="200" r="10" class="image" />
    <!-- Loudspeaker -->
    <rect x="100" y="20" width="150" height="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <line x1="175" y1="120" x2="175" y2="140" class="image" />
  </g>
</svg>