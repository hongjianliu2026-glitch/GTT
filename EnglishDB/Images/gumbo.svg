<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bowl { fill: #F5CBA7; }
      .ingredient { fill: #D4AC0D; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gumbo</text>
  <text x="50" y="120" class="subtitle">[ˈɡʌmbəʊ] n. 秋葵汤，浓汤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gumbo (源自非洲语言，意为“秋葵”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的碗里装满了秋葵和其他丰富的食材，
    <tspan x="50" dy="25">这些食材混合在一起，形成了一碗浓稠的秋葵汤(gumbo)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prepared a delicious gumbo for dinner.
  </text>
  <text x="50" y="310" class="content">
    她为晚餐准备了一道美味的秋葵汤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="bowl" />
    <!-- Ingredients -->
    <circle cx="100" cy="80" r="20" class="ingredient" />
    <circle cx="150" cy="90" r="20" class="ingredient" />
    <circle cx="200" cy="70" r="20" class="ingredient" />
    <circle cx="250" cy="85" r="20" class="ingredient" />
    <circle cx="300" cy="95" r="20" class="ingredient" />
    <!-- Spoon -->
    <line x1="350" y1="100" x2="450" y2="100" class="image" />
    <line x1="450" y1="100" x2="420" y2="70" class="image" />
    <line x1="450" y1="100" x2="420" y2="130" class="image" />
  </g>
</svg>