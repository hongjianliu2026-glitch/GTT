<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orderly</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrdərli] adj. 有秩序的，整齐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> order (顺序) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，所有的物品都按照"顺序(order)"排列，
    <tspan x="50" dy="25">整齐划一，这就是一个有秩序的(orderly)场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The books were arranged in an orderly manner on the shelf.
  </text>
  <text x="50" y="310" class="content">
    书架上的书整齐地排列着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bookshelf -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <rect x="260" y="20" width="50" height="160" class="image" />
    <!-- Lines representing order -->
    <line x1="50" y1="20" x2="310" y2="20" class="image" />
    <line x1="50" y1="100" x2="310" y2="100" class="image" />
    <line x1="50" y1="180" x2="310" y2="180" class="image" />
  </g>
</svg>