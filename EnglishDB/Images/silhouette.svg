<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">silhouette</text>
  <text x="50" y="120" class="subtitle">[ˌsɪluˈet] n. 剪影，轮廓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sil- (暗) + houette (形状)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黑暗的夜晚，月光下，"暗影(sil-houette)"
    <tspan x="50" dy="25">投射在墙上，形成了一个神秘的轮廓。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist drew a silhouette of the city skyline.
  </text>
  <text x="50" y="310" class="content">
    艺术家画了城市天际线的剪影。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Wall -->
    <rect x="0" y="150" width="350" height="150" fill="#D7DBDD" />
    <!-- Silhouette -->
    <path d="M50 200 Q100 100 150 200 L200 200 Q250 150 300 200" stroke="#2C3E50" stroke-width="5" fill="none" />
  </g>
</svg>