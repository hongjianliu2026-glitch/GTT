<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ozone { fill: #87CEEB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ozone</text>
  <text x="50" y="120" class="subtitle">[ˈoʊzoʊn] n. 臭氧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ozo- (气味) + -ne (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蓝色气球(ozone)，里面充满了清新的空气，
    <tspan x="50" dy="25">这个气球散发出一种特殊的气味(ozo-)，这就是臭氧(ozone)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ozone layer protects us from harmful UV rays.
  </text>
  <text x="50" y="310" class="content">
    臭氧层保护我们免受有害的紫外线辐射。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blue balloon -->
    <circle cx="100" cy="100" r="80" class="ozone" />
    <!-- Air inside the balloon -->
    <circle cx="100" cy="100" r="70" class="image" />
    <!-- Smell symbol -->
    <path d="M 50 150 Q 100 100 150 150" class="image" />
    <path d="M 50 150 Q 100 120 150 150" class="image" />
    <path d="M 50 150 Q 100 140 150 150" class="image" />
  </g>
</svg>