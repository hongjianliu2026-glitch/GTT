<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">willow</text>
  <text x="50" y="120" class="subtitle">[ˈwɪloʊ] n. 柳树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> will (意愿) + -ow (表示树木)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵柳树，它的枝条柔软如丝，
    <tspan x="50" dy="25">仿佛在风中轻轻摇曳，就像是在表达某种"意愿(will)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The willow tree by the river is a symbol of grace.
  </text>
  <text x="50" y="310" class="content">
    河边的柳树是优雅的象征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Willow tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="100" y1="50" x2="50" y2="100" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="100" y1="150" x2="50" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
  </g>
</svg>