<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">long-distance</text>
  <text x="50" y="120" class="subtitle">[ˌlɔːŋˈdɪstəns] adj. 长途的，远距离的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> long (长) + distance (距离)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在地球的一端，"长长的(long)"
    <tspan x="50" dy="25">距离(distance)的另一端，正在打电话。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a long-distance call to her family in China.
  </text>
  <text x="50" y="310" class="content">
    她给在中国的家人打了一个长途电话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Person on one side -->
    <circle cx="75" cy="100" r="15" class="image" />
    <line x1="75" y1="115" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="60" y2="180" class="image" />
    <line x1="75" y1="150" x2="90" y2="180" class="image" />
    <line x1="75" y1="130" x2="100" y2="120" class="image" />
    <!-- Person on the other side -->
    <circle cx="275" cy="100" r="15" class="image" />
    <line x1="275" y1="115" x2="275" y2="150" class="image" />
    <line x1="275" y1="150" x2="260" y2="180" class="image" />
    <line x1="275" y1="150" x2="290" y2="180" class="image" />
    <line x1="275" y1="130" x2="300" y2="120" class="image" />
    <!-- Phone lines -->
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <line x1="75" y1="105" x2="275" y2="105" class="image" />
    <line x1="75" y1="95" x2="275" y2="95" class="image" />
  </g>
</svg>