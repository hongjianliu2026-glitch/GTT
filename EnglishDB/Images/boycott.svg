<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boycott</text>
  <text x="50" y="120" class="subtitle">[ˈbɔɪkɑːt] n. 联合抵制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boy (男孩) + cott (cottages, 小屋)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群男孩聚集在"小屋(cott)"前，
    <tspan x="50" dy="25">他们决定联合起来"抵制(boycott)"某件事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The villagers decided to boycott the new supermarket.
  </text>
  <text x="50" y="310" class="content">
    村民们决定联合抵制新开的超市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cottage -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="100" x2="130" y2="100" class="image" />
    <line x1="75" y1="100" x2="75" y2="150" class="image" />
    <!-- Boys -->
    <circle cx="30" cy="120" r="10" class="image" />
    <circle cx="60" cy="120" r="10" class="image" />
    <circle cx="90" cy="120" r="10" class="image" />
    <circle cx="120" cy="120" r="10" class="image" />
    <!-- Arms raised -->
    <line x1="30" y1="130" x2="10" y2="140" class="image" />
    <line x1="60" y1="130" x2="40" y2="140" class="image" />
    <line x1="90" y1="130" x2="70" y2="140" class="image" />
    <line x1="120" y1="130" x2="100" y2="140" class="image" />
  </g>
</svg>