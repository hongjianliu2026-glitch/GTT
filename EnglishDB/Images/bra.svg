<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bra</text>
  <text x="50" y="120" class="subtitle">[brɑː] n. 胸罩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自法语“brassière”，意为“胸甲”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代战士穿着胸甲(brassière)，
    <tspan x="50" dy="25">现代女性则用胸罩(bra)来支撑和保护胸部。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a new bra for the party.
  </text>
  <text x="50" y="310" class="content">
    她为派对买了一件新胸罩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bra -->
    <path d="M50 50 C50 100, 150 100, 150 50" class="image" />
    <path d="M50 50 L150 50" class="image" />
    <path d="M50 50 L50 100" class="image" />
    <path d="M150 50 L150 100" class="image" />
    <path d="M50 100 L150 100" class="image" />
    <!-- Straps -->
    <line x1="50" y1="50" x2="20" y2="20" class="image" />
    <line x1="150" y1="50" x2="180" y2="20" class="image" />
  </g>
</svg>