<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #4A4A4A; }
      .subtitle { font: italic 24px serif; fill: #6D6D6D; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">all-white</text>
  <text x="50" y="120" class="subtitle">[ɔːl waɪt] adj. 全白的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> all- (全部) + white (白色)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完全被白色覆盖的世界，"全部都是白色(all-white)"，
    <tspan x="50" dy="25">仿佛置身于一个纯净无瑕的梦境中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was decorated in all-white, giving it a serene atmosphere.
  </text>
  <text x="50" y="310" class="content">
    房间被装饰成全白色，营造出一种宁静的氛围。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- White background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="white" />
    <!-- White objects -->
    <circle cx="50" cy="100" r="30" class="image" fill="white" />
    <rect x="100" y="70" width="60" height="60" class="image" fill="white" />
    <line x1="180" y1="70" x2="240" y2="130" class="image" stroke="white" stroke-width="10" />
    <line x1="240" y1="70" x2="180" y2="130" class="image" stroke="white" stroke-width="10" />
    <!-- White text -->
    <text x="260" y="120" class="content" fill="black">All-White</text>
  </g>
</svg>