<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">serious</text>
  <text x="50" y="120" class="subtitle">[ˈsɪəriəs] adj. 严肃的，认真的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seri (系列) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面对一排排整齐的文件，"系列(seri)"
    <tspan x="50" dy="25">地处理每一份，表现出严肃认真的态度(serious)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gave a serious speech at the conference.
  </text>
  <text x="50" y="310" class="content">
    他在会议上发表了严肃的演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Files -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="120" y="0" width="100" height="150" class="image" />
    <rect x="240" y="0" width="100" height="150" class="image" />
    <!-- Person -->
    <circle cx="180" cy="200" r="20" class="image" />
    <line x1="180" y1="220" x2="180" y2="280" class="image" />
    <line x1="180" y1="280" x2="160" y2="320" class="image" />
    <line x1="180" y1="280" x2="200" y2="320" class="image" />
    <line x1="180" y1="250" x2="220" y2="240" class="image" />
  </g>
</svg>