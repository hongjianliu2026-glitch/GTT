<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dike</text>
  <text x="50" y="120" class="subtitle">[daɪk] n. 堤坝，沟渠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dike (源自荷兰语，意为“堤坝”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的"堤坝(dike)"，它像一条巨龙一样蜿蜒在田野上，
    <tspan x="50" dy="25">保护着村庄免受洪水的侵袭。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dike was built to prevent flooding.
  </text>
  <text x="50" y="310" class="content">
    建造堤坝是为了防止洪水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Dike -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Water -->
    <rect x="0" y="100" width="350" height="100" class="image" fill="#3498DB" />
    <!-- Village -->
    <rect x="200" y="150" width="100" height="50" class="image" fill="#F1C40F" />
    <rect x="220" y="160" width="20" height="20" class="image" fill="#E74C3C" />
    <rect x="260" y="160" width="20" height="20" class="image" fill="#E74C3C" />
    <!-- Trees -->
    <line x1="50" y1="150" x2="50" y2="100" class="image" />
    <line x1="60" y1="150" x2="60" y2="100" class="image" />
    <line x1="70" y1="150" x2="70" y2="100" class="image" />
  </g>
</svg>