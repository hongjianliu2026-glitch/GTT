<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">step-by-step</text>
  <text x="50" y="120" class="subtitle">[ˈstɛp baɪ stɛp] adv. 逐步地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> step (步) + by (通过) + step (步)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在楼梯上，"一步一步(step-by-step)"
    <tspan x="50" dy="25">地向上走，每一步都稳稳地踏在台阶上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She followed the instructions step-by-step.
  </text>
  <text x="50" y="310" class="content">
    她一步一步地按照指示操作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stairs -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="50" y1="0" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="150" y2="40" class="image" />
    <line x1="150" y1="40" x2="200" y2="60" class="image" />
    <line x1="200" y1="60" x2="250" y2="80" class="image" />
    <line x1="250" y1="80" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="350" y2="120" class="image" />
    <line x1="350" y1="120" x2="400" y2="140" class="image" />
    <line x1="400" y1="140" x2="450" y2="160" class="image" />
    <line x1="450" y1="160" x2="500" y2="180" class="image" />
    <line x1="500" y1="180" x2="550" y2="200" class="image" />

    <!-- Person on stairs -->
    <circle cx="50" cy="0" r="10" class="image" />
    <circle cx="100" cy="20" r="10" class="image" />
    <circle cx="150" cy="40" r="10" class="image" />
    <circle cx="200" cy="60" r="10" class="image" />
    <circle cx="250" cy="80" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
    <circle cx="350" cy="120" r="10" class="image" />
    <circle cx="400" cy="140" r="10" class="image" />
    <circle cx="450" cy="160" r="10" class="image" />
    <circle cx="500" cy="180" r="10" class="image" />
    <circle cx="550" cy="200" r="10" class="image" />
  </g>
</svg>