<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">formative</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrmətɪv] adj. 形成的，构成的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> form (形状) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个雕塑家在塑造(form)一个雕像，这个过程是形成(formative)的，
    <tspan x="50" dy="25">最终的形状(form)是由这个过程决定的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The early years of a child's life are formative.
  </text>
  <text x="50" y="310" class="content">
    孩子的早年生活是形成性格的关键时期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sculptor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Sculpture -->
    <rect x="70" y="20" width="100" height="160" class="image" />
    <line x1="70" y1="20" x2="170" y2="20" class="image" />
    <line x1="70" y1="180" x2="170" y2="180" class="image" />
    <line x1="70" y1="20" x2="70" y2="180" class="image" />
    <line x1="170" y1="20" x2="170" y2="180" class="image" />
    <!-- Hammer and Chisel -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="225" y1="100" x2="225" y2="150" class="image" />
  </g>
</svg>