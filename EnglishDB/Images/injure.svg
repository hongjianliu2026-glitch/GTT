<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">injure</text>
  <text x="50" y="120" class="subtitle">[ˈɪndʒər] v. 伤害，损害</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + jure (法律)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为违反了"法律(jure)"而被"进入(in-)"了法律的惩罚，
    <tspan x="50" dy="25">结果受到了伤害(injure)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He injured his leg while playing football.
  </text>
  <text x="50" y="310" class="content">
    他在踢足球时伤了腿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Injury -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" stroke-dasharray="5,5" />
    <circle cx="50" cy="250" r="10" class="image" fill="#E74C3C" />
    <!-- Law symbol -->
    <rect x="150" y="80" width="50" height="100" class="image" />
    <line x1="150" y1="80" x2="200" y2="80" class="image" />
    <line x1="150" y1="130" x2="200" y2="130" class="image" />
    <line x1="150" y1="180" x2="200" y2="180" class="image" />
  </g>
</svg>