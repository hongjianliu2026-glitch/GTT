<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stirrup</text>
  <text x="50" y="120" class="subtitle">[ˈstɪrəp] n. 马镫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stirr (搅拌) + up (向上)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骑士骑在马上，"搅拌(stirr)"
    <tspan x="50" dy="25">向上的力量(up)，帮助他稳稳地站在马镫(stirrup)上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He placed his foot in the stirrup and mounted the horse.
  </text>
  <text x="50" y="310" class="content">
    他把脚放进马镫，骑上了马。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Horse body -->
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Horse head -->
    <circle cx="300" cy="80" r="30" class="image" />
    <!-- Horse legs -->
    <line x1="50" y1="180" x2="50" y2="250" class="image" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="250" y1="180" x2="250" y2="250" class="image" />
    <line x1="300" y1="180" x2="300" y2="250" class="image" />
    <!-- Stirrup -->
    <rect x="240" y="160" width="20" height="40" class="image" />
    <line x1="250" y1="160" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="100" class="image" />
    <line x1="250" y1="120" x2="270" y2="100" class="image" />
  </g>
</svg>