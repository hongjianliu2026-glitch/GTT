<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nurturing</text>
  <text x="50" y="120" class="subtitle">[ˈnɜːrtʃərɪŋ] adj. 养育的，培育的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nutri (滋养) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个母亲温柔地"滋养(nutri)"她的孩子，
    <tspan x="50" dy="25">这种温柔的养育行为就是 nurturing。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nurturing environment helped the child thrive.
  </text>
  <text x="50" y="310" class="content">
    这种养育环境帮助孩子茁壮成长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mother -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Child -->
    <circle cx="150" cy="120" r="20" class="image" />
    <line x1="150" y1="140" x2="150" y2="180" class="image" />
    <line x1="150" y1="160" x2="130" y2="170" class="image" />
    <line x1="150" y1="160" x2="170" y2="170" class="image" />
    <!-- Heart -->
    <path d="M200,100 C210,80 240,80 250,100 L250,150 C240,170 210,170 200,150 Z" class="image" />
  </g>
</svg>