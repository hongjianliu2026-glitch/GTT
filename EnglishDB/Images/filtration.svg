<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">filtration</text>
  <text x="50" y="120" class="subtitle">[ˌfɪltˈreɪʃn] n. 过滤，筛选</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> filt (过滤) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的筛子，"过滤(filt)"
    <tspan x="50" dy="25">掉杂质，只留下纯净的水(filtration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The water undergoes a process of filtration before it is safe to drink.
  </text>
  <text x="50" y="310" class="content">
    水在安全饮用之前要经过过滤过程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Filter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sieve -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Water droplets -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="200" cy="140" r="10" class="image" />
    <circle cx="250" cy="160" r="10" class="image" />
    <!-- Impurities -->
    <circle cx="70" cy="80" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <circle cx="170" cy="100" r="5" class="image" />
    <circle cx="220" cy="110" r="5" class="image" />
  </g>
</svg>