<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-week</text>
  <text x="50" y="120" class="subtitle">[θriː wiːk] adj. 三周的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + week (周)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个日历上，"三周(three-week)"
    <tspan x="50" dy="25">的时间被特别标注出来，形成了一个三周的周期。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent a three-week vacation in Hawaii.
  </text>
  <text x="50" y="310" class="content">
    她在夏威夷度过了一个三周的假期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Weeks -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="20" width="50" height="160" class="image" />
    <rect x="190" y="20" width="50" height="160" class="image" />
    <!-- Days -->
    <line x1="50" y1="40" x2="100" y2="40" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <line x1="50" y1="160" x2="100" y2="160" class="image" />
    <line x1="120" y1="40" x2="170" y2="40" class="image" />
    <line x1="120" y1="80" x2="170" y2="80" class="image" />
    <line x1="120" y1="120" x2="170" y2="120" class="image" />
    <line x1="120" y1="160" x2="170" y2="160" class="image" />
    <line x1="190" y1="40" x2="240" y2="40" class="image" />
    <line x1="190" y1="80" x2="240" y2="80" class="image" />
    <line x1="190" y1="120" x2="240" y2="120" class="image" />
    <line x1="190" y1="160" x2="240" y2="160" class="image" />
  </g>
</svg>