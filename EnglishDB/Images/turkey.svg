<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turkey</text>
  <text x="50" y="120" class="subtitle">[ˈtɜːrki] n. 火鸡，土耳其</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自土耳其语 "türki"，指土耳其。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的火鸡站在土耳其的国旗前，
    <tspan x="50" dy="25">它既是美味的节日食物，也是国家的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had turkey for Thanksgiving dinner.
  </text>
  <text x="50" y="310" class="content">
    我们在感恩节晚餐上吃了火鸡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Turkey -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="200" class="image" />
    <line x1="100" y1="180" x2="150" y2="200" class="image" />
    <!-- Turkish flag -->
    <rect x="200" y="50" width="150" height="100" class="image" />
    <line x1="275" y1="50" x2="275" y2="150" class="image" />
    <circle cx="275" cy="100" r="25" class="image" />
  </g>
</svg>