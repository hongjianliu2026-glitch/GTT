<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seventeenth-century</text>
  <text x="50" y="120" class="subtitle">[ˌsevənˈtiːnθ ˈsentʃəri] adj. 17世纪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seven (七) + teen (十) + th (第...) + century (世纪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的钟表，指针指向"第七个十年的第几个(seventeenth)"
    <tspan x="50" dy="25">位置，代表着17世纪(seventeenth-century)的时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The seventeenth-century architecture is fascinating.
  </text>
  <text x="50" y="310" class="content">
    17世纪的建筑非常迷人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="235" y2="100" class="image" />
    <!-- Roman numerals -->
    <text x="175" y="30" class="content" text-anchor="middle">XII</text>
    <text x="235" y="100" class="content" text-anchor="middle">III</text>
    <text x="175" y="170" class="content" text-anchor="middle">VI</text>
    <text x="115" y="100" class="content" text-anchor="middle">IX</text>
    <!-- Seventeenth -->
    <text x="175" y="100" class="content" text-anchor="middle">VII</text>
  </g>
</svg>