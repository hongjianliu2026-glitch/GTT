<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pacemaker</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪsmiːkər] n. 起搏器，领头人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pace (步伐) + maker (制造者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心脏起搏器，它像一个"步伐制造者(pace-maker)"，
    <tspan x="50" dy="25">稳定地控制着心脏的跳动，确保心脏按照正确的节奏跳动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pacemaker was implanted to regulate his heartbeat.
  </text>
  <text x="50" y="310" class="content">
    起搏器被植入以调节他的心跳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart -->
    <path d="M50,50 C50,20 90,20 90,50 S130,80 130,50" class="image" />
    <!-- Pacemaker -->
    <rect x="150" y="30" width="100" height="50" class="image" />
    <!-- Wires -->
    <line x1="200" y1="80" x2="100" y2="80" class="image" />
    <line x1="100" y1="80" x2="90" y2="60" class="image" />
  </g>
</svg>