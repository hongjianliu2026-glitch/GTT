<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">manifest</text>
  <text x="50" y="120" class="subtitle">[ˈmænɪfest] v. 表明，显示；n. 宣言</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mani- (手) + fest (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用手("mani-")重重地("fest")敲击桌子，
    <tspan x="50" dy="25">以此来表明他的观点，这就是"manifest"（表明）。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His actions clearly manifested his intentions.
  </text>
  <text x="50" y="310" class="content">
    他的行为清楚地表明了他的意图。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hand hitting the table -->
    <line x1="50" y1="20" x2="200" y2="20" class="image" />
    <line x1="200" y1="20" x2="180" y2="50" class="image" />
    <line x1="180" y1="50" x2="220" y2="50" class="image" />
    <line x1="220" y1="50" x2="200" y2="20" class="image" />
    <!-- Fist -->
    <circle cx="200" cy="35" r="15" class="image" />
  </g>
</svg>