<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oregano</text>
  <text x="50" y="120" class="subtitle">[ˌɔːrɪˈɡɑːnoʊ] n. 牛至（一种香草）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ori- (山) + gan (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在山坡上，"山(ori-)"上"生长(gan)"着茂盛的牛至，
    <tspan x="50" dy="25">它们散发着浓郁的香气，就像是大自然的调味品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Add some oregano to the pasta sauce for extra flavor.
  </text>
  <text x="50" y="310" class="content">
    在意大利面酱中加入一些牛至，增添风味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,200 L100,0 L200,200 Z" class="image" />
    <!-- Leaves -->
    <path d="M100,150 C110,130 130,130 140,150 S170,170 180,150" class="leaf" />
    <path d="M110,160 C120,140 140,140 150,160 S180,180 190,160" class="leaf" />
    <path d="M120,170 C130,150 150,150 160,170 S190,190 200,170" class="leaf" />
    <!-- Aroma -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="160" cy="90" r="10" class="image" />
    <circle cx="170" cy="80" r="10" class="image" />
  </g>
</svg>