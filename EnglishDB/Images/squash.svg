<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">squash</text>
  <text x="50" y="120" class="subtitle">[skwɒʃ] v. 压扁，压碎；n. 壁球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> squa- (压) + sh (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手掌，"压扁(squa-sh)"
    <tspan x="50" dy="25">一个西瓜，西瓜瞬间变成了一滩果汁。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She accidentally squashed the watermelon with her hand.
  </text>
  <text x="50" y="310" class="content">
    她不小心用手压扁了西瓜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant hand -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="40" class="image" />
    <line x1="50" y1="140" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="0" y2="180" class="image" />
    <line x1="50" y1="160" x2="100" y2="180" class="image" />
    <line x1="50" y1="160" x2="20" y2="120" class="image" />
    <line x1="50" y1="160" x2="80" y2="120" class="image" />

    <!-- Squashed watermelon -->
    <ellipse cx="200" cy="100" rx="60" ry="30" class="image" />
    <line x1="140" y1="100" x2="260" y2="100" class="image" />
    <line x1="170" y1="70" x2="230" y2="70" class="image" />
    <line x1="170" y1="130" x2="230" y2="130" class="image" />
  </g>
</svg>