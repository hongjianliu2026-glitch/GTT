<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bread</text>
  <text x="50" y="120" class="subtitle">[bred] n. 面包</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 bred，意为“烤过的面团”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的面包师，在炉火前，
    <tspan x="50" dy="25">将面团烤成金黄色的面包(bread)，</tspan>
    <tspan x="50" dy="25">香气四溢，让人垂涎欲滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spread butter on her bread.
  </text>
  <text x="50" y="310" class="content">
    她在面包上涂了黄油。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bread -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <rect x="20" y="20" width="160" height="60" class="image" />
    <rect x="40" y="40" width="120" height="20" class="image" />
    <!-- Baker -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="140" y2="180" class="image" />
  </g>
</svg>