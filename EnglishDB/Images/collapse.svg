<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">collapse</text>
  <text x="50" y="120" class="subtitle">[kəˈlæps] v. 倒塌，崩溃；n. 崩溃，倒塌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (一起) + lapse (滑落)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高塔，"一起滑落(col-lapse)"，
    <tspan x="50" dy="25">瞬间倒塌成一堆废墟，这就是崩溃(collapse)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bridge collapsed under the weight of the truck.
  </text>
  <text x="50" y="310" class="content">
    这座桥在卡车的重压下倒塌了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tower -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Collapsed tower -->
    <rect x="20" y="180" width="60" height="20" class="image" />
    <rect x="30" y="160" width="40" height="20" class="image" />
    <rect x="40" y="140" width="20" height="20" class="image" />
    <!-- Dust -->
    <circle cx="50" cy="220" r="10" class="image" />
    <circle cx="60" cy="230" r="10" class="image" />
    <circle cx="40" cy="230" r="10" class="image" />
  </g>
</svg>