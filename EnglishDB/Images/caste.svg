<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">caste</text>
  <text x="50" y="120" class="subtitle">[kɑːst] n. 种姓，社会等级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cast (铸造) + -e (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个社会被"铸造(cast)"成不同的阶层，
    <tspan x="50" dy="25">每个阶层就像一个固定的模具，无法改变。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> In India, the caste system is deeply rooted in society.
  </text>
  <text x="50" y="310" class="content">
    在印度，种姓制度深深植根于社会之中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Molds representing castes -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="120" y="0" width="100" height="150" class="image" />
    <rect x="240" y="0" width="100" height="150" class="image" />
    <!-- People in molds -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="35" y2="180" class="image" />
    <line x1="50" y1="150" x2="65" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />

    <circle cx="170" cy="100" r="15" class="image" />
    <line x1="170" y1="115" x2="170" y2="150" class="image" />
    <line x1="170" y1="150" x2="155" y2="180" class="image" />
    <line x1="170" y1="150" x2="185" y2="180" class="image" />
    <line x1="170" y1="130" x2="200" y2="120" class="image" />

    <circle cx="290" cy="100" r="15" class="image" />
    <line x1="290" y1="115" x2="290" y2="150" class="image" />
    <line x1="290" y1="150" x2="275" y2="180" class="image" />
    <line x1="290" y1="150" x2="305" y2="180" class="image" />
    <line x1="290" y1="130" x2="320" y2="120" class="image" />
  </g>
</svg>