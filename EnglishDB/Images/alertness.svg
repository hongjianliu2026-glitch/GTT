<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alertness</text>
  <text x="50" y="120" class="subtitle">[əˈlɜːrtnəs] n. 警觉，机敏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (朝向) + ert (唤醒) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫头鹰，"朝向(al-)"
    <tspan x="50" dy="25">并时刻"唤醒(ert)"自己保持警觉，</tspan>
    <tspan x="50" dy="25">这种状态就是警觉(alertness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The guard's alertness prevented the theft.
  </text>
  <text x="50" y="310" class="content">
    警卫的警觉阻止了盗窃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Owl -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="30" y1="40" x2="70" y2="40" class="image" />
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <line x1="50" y1="60" x2="50" y2="80" class="image" />
    <line x1="40" y1="80" x2="60" y2="80" class="image" />
    <line x1="30" y1="90" x2="70" y2="90" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="40" r="5" class="image" />
    <circle cx="60" cy="40" r="5" class="image" />
    <!-- Wings -->
    <line x1="20" y1="50" x2="0" y2="70" class="image" />
    <line x1="80" y1="50" x2="100" y2="70" class="image" />
  </g>
</svg>