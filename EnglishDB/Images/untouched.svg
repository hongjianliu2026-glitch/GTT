<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">untouched</text>
  <text x="50" y="120" class="subtitle">[ʌnˈtʌtʃt] adj. 未触及的，未受影响的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + touch (接触)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被保护的宝藏，"未被接触(un-touched)"
    <tspan x="50" dy="25">的宝箱，它依然保持着原始的纯净和完整。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient manuscript remained untouched for centuries.
  </text>
  <text x="50" y="310" class="content">
    这份古老的手稿几个世纪以来未被触碰。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Treasure chest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Lock -->
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Shield -->
    <polygon points="100,10 200,10 250,100 150,100" class="image" />
    <!-- Text on shield -->
    <text x="120" y="60" class="content" fill="#FFFFFF">UNTOUCHED</text>
  </g>
</svg>