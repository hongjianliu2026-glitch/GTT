<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forefather</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrˌfɑːðər] n. 祖先，祖宗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (在前面) + father (父亲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的家族，"在前面(fore-)"
    <tspan x="50" dy="25">的父亲(father)，他们就是我们的祖先(forefather)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We honor our forefathers by preserving their traditions.
  </text>
  <text x="50" y="310" class="content">
    我们通过保留他们的传统来纪念我们的祖先。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ancient figure -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="130" class="image" />
    <line x1="50" y1="150" x2="80" y2="130" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <!-- Family tree -->
    <line x1="50" y1="220" x2="50" y2="280" class="image" />
    <line x1="50" y1="250" x2="20" y2="250" class="image" />
    <line x1="50" y1="250" x2="80" y2="250" class="image" />
    <circle cx="20" cy="250" r="10" class="image" />
    <circle cx="80" cy="250" r="10" class="image" />
  </g>
</svg>