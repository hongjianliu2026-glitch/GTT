<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bathroom</text>
  <text x="50" y="120" class="subtitle">[ˈbæθruːm] n. 浴室，卫生间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bath (洗澡) + room (房间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里有一个浴缸，"洗澡的房间(bath-room)"
    <tspan x="50" dy="25">就是浴室(bathroom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spends a lot of time in the bathroom every morning.
  </text>
  <text x="50" y="310" class="content">
    她每天早上在浴室里花很多时间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bathtub -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Water -->
    <line x1="70" y1="70" x2="280" y2="70" class="image" />
    <line x1="70" y1="90" x2="250" y2="90" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="130" x2="240" y2="130" class="image" />
    <!-- Person -->
    <circle cx="200" cy="120" r="15" class="image" />
    <line x1="200" y1="135" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="180" y2="200" class="image" />
    <line x1="200" y1="170" x2="220" y2="200" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
  </g>
</svg>