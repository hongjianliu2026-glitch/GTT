<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">super</text>
  <text x="50" y="120" class="subtitle">[ˈsuːpər] adj. 超级的，极好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (在上面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个超级英雄飞在空中，"在上面(super)"
    <tspan x="50" dy="25">俯视着一切，他就是超级的(super)存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt super after winning the race.
  </text>
  <text x="50" y="310" class="content">
    赢得比赛后，她感觉超级棒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Superhero flying -->
    <circle cx="100" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="100" y1="120" x2="100" y2="180" class="image" /> <!-- Body -->
    <line x1="100" y1="140" x2="70" y2="160" class="image" /> <!-- Left arm -->
    <line x1="100" y1="140" x2="130" y2="160" class="image" /> <!-- Right arm -->
    <line x1="100" y1="180" x2="70" y2="220" class="image" /> <!-- Left leg -->
    <line x1="100" y1="180" x2="130" y2="220" class="image" /> <!-- Right leg -->
    <line x1="100" y1="80" x2="100" y2="40" class="image" /> <!-- Cape -->
    <line x1="70" y1="60" x2="130" y2="60" class="image" /> <!-- Cape -->
    <line x1="70" y1="60" x2="50" y2="40" class="image" /> <!-- Cape -->
    <line x1="130" y1="60" x2="150" y2="40" class="image" /> <!-- Cape -->
  </g>
</svg>