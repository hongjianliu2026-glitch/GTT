<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">statement</text>
  <text x="50" y="120" class="subtitle">[ˈsteɪtmənt] n. 声明，陈述</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> state (站) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在讲台上，"站(state)"
    <tspan x="50" dy="25">在那里发表声明(statement)，声音洪亮，</tspan>
    <tspan x="50" dy="25">整个大厅都能听到。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company issued a statement denying the allegations.
  </text>
  <text x="50" y="310" class="content">
    公司发表声明否认这些指控。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="80" r="20" class="image" />
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="120" x2="220" y2="110" class="image" />
    <!-- Microphone -->
    <line x1="175" y1="100" x2="175" y2="130" class="image" />
    <line x1="170" y1="130" x2="180" y2="130" class="image" />
    <line x1="175" y1="130" x2="175" y2="140" class="image" />
    <!-- Sound waves -->
    <path d="M175,140 Q190,150 205,140" class="image" />
    <path d="M175,140 Q160,150 145,140" class="image" />
  </g>
</svg>