<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vigilance</text>
  <text x="50" y="120" class="subtitle">[ˈvɪdʒɪləns] n. 警觉，警惕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vigi (唤醒) + -lance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫头鹰，它总是"唤醒(vigi)"自己保持警觉，
    <tspan x="50" dy="25">时刻准备捕捉猎物，这种状态就是警觉(vigilance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The security guard's vigilance prevented the theft.
  </text>
  <text x="50" y="310" class="content">
    保安的警觉阻止了盗窃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Owl -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="30" y1="50" x2="70" y2="50" class="image" />
    <line x1="50" y1="30" x2="50" y2="70" class="image" />
    <line x1="40" y1="40" x2="60" y2="60" class="image" />
    <line x1="40" y1="60" x2="60" y2="40" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="50" r="5" class="image" />
    <circle cx="60" cy="50" r="5" class="image" />
    <!-- Wings -->
    <line x1="20" y1="30" x2="80" y2="30" class="image" />
    <line x1="20" y1="70" x2="80" y2="70" class="image" />
    <!-- Tree branch -->
    <line x1="0" y1="100" x2="100" y2="100" class="image" />
  </g>
</svg>