<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whomever</text>
  <text x="50" y="120" class="subtitle">[huːmˈevər] pron. 无论谁，任何人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> who (谁) + ever (无论)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的门，"无论谁(who-ever)"
    <tspan x="50" dy="25">走进去，都会被欢迎。这就是whomever的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You can give the book to whomever you like.
  </text>
  <text x="50" y="310" class="content">
    你可以把书给任何你喜欢的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="250" class="image" />
    <!-- Handle -->
    <circle cx="130" cy="125" r="10" class="image" />
    <!-- Welcome sign -->
    <text x="10" y="280" class="content" fill="#2980B9">Welcome</text>
  </g>
</svg>