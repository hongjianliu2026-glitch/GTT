<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transformation</text>
  <text x="50" y="120" class="subtitle">[ˌtrænsfərˈmeɪʃn] n. 转变，变形</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + form (形状) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只毛毛虫"跨越(trans-)"它的"形状(form)"，
    <tspan x="50" dy="25">变成了一只美丽的蝴蝶，这就是"转变(transformation)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The caterpillar's transformation into a butterfly was remarkable.
  </text>
  <text x="50" y="310" class="content">
    毛毛虫变成蝴蝶的过程非常显著。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Caterpillar -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Butterfly -->
    <path d="M300,100 C350,50 450,50 500,100" class="image" />
    <path d="M300,100 C350,150 450,150 500,100" class="image" />
    <circle cx="400" cy="100" r="30" class="image" />
    <!-- Arrow -->
    <line x1="270" y1="100" x2="300" y2="100" class="image" />
    <polygon points="300,90 320,100 300,110" class="image" />
  </g>
</svg>