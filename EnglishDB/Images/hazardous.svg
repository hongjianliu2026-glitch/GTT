<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hazardous</text>
  <text x="50" y="120" class="subtitle">[ˈhæzərdəs] adj. 危险的，有害的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hazard (危险) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满"危险(hazard)"的场景，
    <tspan x="50" dy="25">比如一个巨大的骷髅头在警告你，</tspan>
    <tspan x="50" dy="25">这就是"危险的(hazardous)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chemicals in the factory are hazardous to health.
  </text>
  <text x="50" y="310" class="content">
    工厂里的化学物质对健康有害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hazard sign -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="60" y1="60" x2="140" y2="140" class="image" />
    <line x1="60" y1="140" x2="140" y2="60" class="image" />
    <!-- Skull -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="80" y1="150" x2="120" y2="150" class="image" />
  </g>
</svg>