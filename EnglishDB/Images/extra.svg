<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extra</text>
  <text x="50" y="120" class="subtitle">[ˈɛkstrə] adj. 额外的，特别的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + tra (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师从帽子里"向外拉出(ex-tra)"
    <tspan x="50" dy="25">一只兔子，这只兔子就是额外的惊喜(extra)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She got an extra dessert after dinner.
  </text>
  <text x="50" y="310" class="content">
    她晚餐后得到了一份额外的甜点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician's hat -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Rabbit -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="170" class="image" />
    <line x1="100" y1="150" x2="130" y2="170" class="image" />
    <line x1="100" y1="180" x2="70" y2="200" class="image" />
    <line x1="100" y1="180" x2="130" y2="200" class="image" />
  </g>
</svg>