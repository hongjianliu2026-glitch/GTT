<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">roadway</text>
  <text x="50" y="120" class="subtitle">[ˈroʊdeɪ] n. 道路，车道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> road (路) + way (方式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在一条宽阔的"路(road)"上行驶，
    <tspan x="50" dy="25">这条路就是"道路(roadway)"，是车辆行驶的"方式(way)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roadway was blocked by a fallen tree.
  </text>
  <text x="50" y="310" class="content">
    道路被一棵倒下的树堵住了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Roadway -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Road -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" stroke-width="10" stroke="#A0A0A0" />
    <!-- Car -->
    <rect x="150" y="70" width="50" height="30" class="image" fill="#FF5733" />
    <circle cx="165" cy="105" r="5" class="image" fill="#333333" />
    <circle cx="200" cy="105" r="5" class="image" fill="#333333" />
  </g>
</svg>