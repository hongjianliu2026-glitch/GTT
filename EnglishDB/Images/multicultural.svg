<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">multicultural</text>
  <text x="50" y="120" class="subtitle">[ˌmʌltiˈkʌltʃərəl] adj. 多元文化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> multi- (多) + cultural (文化的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市广场，"多种(multi)"
    <tspan x="50" dy="25">文化(cultural)的人们在这里和谐共处，</tspan>
    <tspan x="50" dy="25">展示着各自的特色和传统。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The festival was a celebration of multicultural diversity.
  </text>
  <text x="50" y="310" class="content">
    这个节日是对多元文化多样性的庆祝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City square -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Flags -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="100" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="200" y1="70" x2="200" y2="100" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <!-- Cultural symbols -->
    <rect x="50" y="100" width="20" height="20" class="image" />
    <rect x="100" y="100" width="20" height="20" class="image" />
    <rect x="150" y="100" width="20" height="20" class="image" />
    <rect x="200" y="100" width="20" height="20" class="image" />
    <rect x="250" y="100" width="20" height="20" class="image" />
  </g>
</svg>