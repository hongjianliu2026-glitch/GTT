<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discharge</text>
  <text x="50" y="120" class="subtitle">[dɪsˈtʃɑrdʒ] v. 排放，释放；n. 排放物，释放</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (离开) + charge (装载)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的容器，"离开装载(dis-charge)"
    <tspan x="50" dy="25">的状态，里面的东西被释放出来，形成排放物(discharge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory was fined for discharging toxic waste into the river.
  </text>
  <text x="50" y="310" class="content">
    工厂因向河流排放有毒废物而被罚款。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Container -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Liquid discharge -->
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <line x1="50" y1="120" x2="350" y2="120" class="image" />
    <line x1="50" y1="140" x2="350" y2="140" class="image" />
    <line x1="50" y1="160" x2="350" y2="160" class="image" />
    <!-- Arrow indicating discharge -->
    <polyline points="350,100 400,100 400,200" class="image" />
    <polygon points="400,200 390,190 410,190" class="image" />
  </g>
</svg>