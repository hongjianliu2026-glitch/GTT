<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peat</text>
  <text x="50" y="120" class="subtitle">[pit] n. 泥炭，泥煤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peat (源自中古英语pete, 意为“泥炭”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片沼泽地，"泥炭(peat)"
    <tspan x="50" dy="25">覆盖在地面，像一层厚厚的黑色地毯。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The village was built on a bed of peat.
  </text>
  <text x="50" y="310" class="content">
    这个村庄建在一片泥炭地上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Swamp -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Peat layer -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#4A235A" />
    <!-- Water droplets -->
    <circle cx="70" cy="50" r="10" class="image" fill="#1ABC9C" />
    <circle cx="100" cy="80" r="10" class="image" fill="#1ABC9C" />
    <circle cx="130" cy="110" r="10" class="image" fill="#1ABC9C" />
    <circle cx="160" cy="140" r="10" class="image" fill="#1ABC9C" />
    <!-- Plants -->
    <line x1="180" y1="180" x2="180" y2="140" class="image" />
    <line x1="190" y1="180" x2="190" y2="130" class="image" />
    <line x1="200" y1="180" x2="200" y2="150" class="image" />
    <line x1="210" y1="180" x2="210" y2="160" class="image" />
  </g>
</svg>