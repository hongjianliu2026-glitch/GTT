<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">patriotic</text>
  <text x="50" y="120" class="subtitle">[ˌpeɪtriˈɒtɪk] adj. 爱国的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> patri (父亲) + -otic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个爱国者，他像对待父亲一样热爱自己的国家，
    <tspan x="50" dy="25">这种深厚的感情让他变得"爱国(patriotic)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a patriotic shirt on Independence Day.
  </text>
  <text x="50" y="310" class="content">
    他在独立日那天穿了一件爱国的T恤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50 50 Q100 0 150 50 T250 50" class="image" />
    <!-- Flag -->
    <rect x="100" y="100" width="100" height="50" class="image" />
    <!-- Stars -->
    <circle cx="120" cy="110" r="5" class="image" />
    <circle cx="140" cy="120" r="5" class="image" />
    <circle cx="160" cy="110" r="5" class="image" />
    <circle cx="180" cy="120" r="5" class="image" />
    <!-- Person -->
    <circle cx="200" cy="150" r="15" class="image" />
    <line x1="200" y1="165" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="180" x2="230" y2="170" class="image" />
  </g>
</svg>