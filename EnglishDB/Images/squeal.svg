<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">squeal</text>
  <text x="50" y="120" class="subtitle">[skwiːl] v. 发出尖叫声，告密</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> squeal (源自拟声词，模拟尖叫声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猪被挠痒痒，发出"尖叫(squeal)"声，
    <tspan x="50" dy="25">声音尖锐刺耳，让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child squealed with delight when she saw the ice cream truck.
  </text>
  <text x="50" y="310" class="content">
    小女孩看到冰淇淋车时高兴得尖叫起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Pig -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <circle cx="70" cy="80" r="10" class="image" /> <!-- Left ear -->
    <circle cx="130" cy="80" r="10" class="image" /> <!-- Right ear -->
    <circle cx="100" cy="120" r="15" class="image" /> <!-- Snout -->
    <circle cx="85" cy="115" r="5" class="image" /> <!-- Left nostril -->
    <circle cx="115" cy="115" r="5" class="image" /> <!-- Right nostril -->
    <line x1="100" y1="135" x2="100" y2="160" class="image" /> <!-- Tail -->
    <line x1="100" y1="160" x2="80" y2="180" class="image" />
    <line x1="100" y1="160" x2="120" y2="180" class="image" />

    <!-- Sound waves -->
    <path d="M100,190 Q150,220 200,190" class="image" />
    <path d="M100,210 Q150,240 200,210" class="image" />
    <path d="M100,230 Q150,260 200,230" class="image" />
  </g>
</svg>