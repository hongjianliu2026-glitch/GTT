<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">low-wage</text>
  <text x="50" y="120" class="subtitle">[ˈloʊweɪdʒ] adj. 低工资的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> low (低) + wage (工资)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人拿着一个"低(low)"的"工资(wage)"信封，
    <tspan x="50" dy="25">信封里的钱少得可怜，这就是低工资(low-wage)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many workers in this industry are low-wage employees.
  </text>
  <text x="50" y="310" class="content">
    这个行业的许多工人都是低工资雇员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Worker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Envelope -->
    <rect x="70" y="80" width="100" height="60" class="image" />
    <line x1="70" y1="80" x2="170" y2="80" class="image" />
    <line x1="70" y1="140" x2="170" y2="140" class="image" />
    <line x1="70" y1="80" x2="70" y2="140" class="image" />
    <line x1="170" y1="80" x2="170" y2="140" class="image" />
    <!-- Money -->
    <rect x="90" y="100" width="20" height="10" class="image" />
    <rect x="120" y="100" width="20" height="10" class="image" />
    <rect x="150" y="100" width="20" height="10" class="image" />
  </g>
</svg>