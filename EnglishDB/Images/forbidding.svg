<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forbidding</text>
  <text x="50" y="120" class="subtitle">[fərˈbɪdɪŋ] adj. 令人生畏的，严峻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (禁止) + bid (命令) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的、"禁止(for-)"进入的标志，"命令(bid)"
    <tspan x="50" dy="25">人们远离，这个标志本身就给人一种"令人生畏(forbidding)"的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forbidding mountain peak was covered in snow.
  </text>
  <text x="50" y="310" class="content">
    那座令人生畏的山峰被雪覆盖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forbidden sign -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="60" y1="60" x2="140" y2="140" class="image" />
    <line x1="60" y1="140" x2="140" y2="60" class="image" />
    <!-- Mountain -->
    <polygon points="200,20 280,180 120,180" class="image" />
    <!-- Snow -->
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
    <line x1="190" y1="80" x2="210" y2="80" class="image" />
    <line x1="200" y1="60" x2="200" y2="60" class="image" />
  </g>
</svg>