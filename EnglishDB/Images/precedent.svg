<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">precedent</text>
  <text x="50" y="120" class="subtitle">[ˈpresɪdənt] n. 先例，前例</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + ced (走) + ent (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在前面"走(ced)"，为后面的人"树立(pre-cedent)"了一个先例。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The court's decision set a legal precedent.
  </text>
  <text x="50" y="310" class="content">
    法院的判决设立了一个法律先例。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />

    <!-- Path -->
    <line x1="50" y1="220" x2="50" y2="280" class="image" />
    <line x1="50" y1="250" x2="30" y2="230" class="image" />
    <line x1="50" y1="250" x2="70" y2="230" class="image" />
    <line x1="50" y1="280" x2="30" y2="310" class="image" />
    <line x1="50" y1="280" x2="70" y2="310" class="image" />

    <!-- Arrow indicating precedent -->
    <line x1="50" y1="280" x2="100" y2="280" class="image" />
    <polygon points="100,280 95,275 95,285" class="image" />
  </g>
</svg>