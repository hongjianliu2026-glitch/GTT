<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trivial</text>
  <text x="50" y="120" class="subtitle">[ˈtrɪviəl] adj. 琐碎的，不重要的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tri- (三) + via (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象三条路(tri-via)，其中一条路通向一个
    <tspan x="50" dy="25">微不足道的小问题，这个问题就是琐碎的(trivial)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't waste your time on trivial matters.
  </text>
  <text x="50" y="310" class="content">
    不要在琐碎的事情上浪费时间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Three roads -->
    <line x1="0" y1="0" x2="150" y2="0" class="image" />
    <line x1="0" y1="50" x2="150" y2="50" class="image" />
    <line x1="0" y1="100" x2="150" y2="100" class="image" />
    <!-- Trivial road -->
    <line x1="150" y1="100" x2="300" y2="100" class="image" />
    <!-- Small problem -->
    <circle cx="350" cy="100" r="20" class="image" />
    <text x="340" y="110" class="content" style="font-size: 12px;">小问题</text>
  </g>
</svg>