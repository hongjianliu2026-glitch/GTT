<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interact</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈækt] v. 互动，相互作用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + act (行动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在"中间(inter-)"进行"行动(act)"，
    <tspan x="50" dy="25">他们通过对话和手势相互作用，这就是互动(interact)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They interacted with each other during the meeting.
  </text>
  <text x="50" y="310" class="content">
    他们在会议期间相互互动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people interacting -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="180" y2="100" class="image" />
    <!-- Speech bubbles -->
    <path d="M50,130 Q30,150 50,170 Q70,150 50,130" class="image" />
    <path d="M200,130 Q180,150 200,170 Q220,150 200,130" class="image" />
  </g>
</svg>