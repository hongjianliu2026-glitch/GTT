<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">asset</text>
  <text x="50" y="120" class="subtitle">[ˈæsɛt] n. 资产，财产</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> as- (朝向) + set (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把一堆金币"朝向(as-)"自己"放置(set)"，
    <tspan x="50" dy="25">这些金币就是他的资产(asset)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His assets include a house, a car, and some stocks.
  </text>
  <text x="50" y="310" class="content">
    他的资产包括一栋房子、一辆车和一些股票。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gold coins -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="110" cy="100" r="15" class="image" />
    <circle cx="140" cy="100" r="15" class="image" />
    <circle cx="170" cy="100" r="15" class="image" />
    <!-- Person -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>