<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">namesake</text>
  <text x="50" y="120" class="subtitle">[ˈneɪmseɪk] n. 同名的人或物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> name (名字) + sake (缘故)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人，一个叫"小明"，另一个也叫"小明"，
    <tspan x="50" dy="25">因为他们有相同的名字(name)，所以他们是同名的人(namesake)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> John and his namesake, John Smith Jr., met for the first time.
  </text>
  <text x="50" y="310" class="content">
    约翰和他的同名者小约翰·史密斯第一次见面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people with the same name -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="30" y2="90" class="image" />
    <line x1="50" y1="80" x2="70" y2="90" class="image" />

    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="130" y2="90" class="image" />
    <line x1="150" y1="80" x2="170" y2="90" class="image" />

    <!-- Name tags -->
    <rect x="30" y="150" width="40" height="20" class="image" />
    <text x="35" y="165" class="content">小明</text>
    <rect x="130" y="150" width="40" height="20" class="image" />
    <text x="135" y="165" class="content">小明</text>
  </g>
</svg>