<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">steroids</text>
  <text x="50" y="120" class="subtitle">[ˈstɪrɔɪdz] n. 类固醇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ster- (固态) + -oid (类似)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在服用"固态(ster-)"的"类似(oid)"药物，
    <tspan x="50" dy="25">这些药物让他的肌肉变得异常强壮，就像超级英雄一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The athlete was banned for using steroids.
  </text>
  <text x="50" y="310" class="content">
    这名运动员因使用类固醇而被禁赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pill -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <!-- Muscle -->
    <circle cx="150" cy="25" r="20" class="image" />
    <circle cx="180" cy="25" r="20" class="image" />
    <circle cx="210" cy="25" r="20" class="image" />
    <!-- Superhero -->
    <circle cx="280" cy="25" r="30" class="image" />
    <line x1="280" y1="55" x2="280" y2="100" class="image" />
    <line x1="280" y1="70" x2="250" y2="60" class="image" />
    <line x1="280" y1="70" x2="310" y2="60" class="image" />
    <line x1="280" y1="100" x2="250" y2="130" class="image" />
    <line x1="280" y1="100" x2="310" y2="130" class="image" />
  </g>
</svg>