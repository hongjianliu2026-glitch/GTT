<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fistful</text>
  <text x="50" y="120" class="subtitle">[ˈfɪstfʊl] n. 一把，一撮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fist (拳头) + -ful (充满)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拳头，"握满(fist-ful)"
    <tspan x="50" dy="25">金币，金币从指缝中溢出，这就是一把(fistful)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He grabbed a fistful of coins from the jar.
  </text>
  <text x="50" y="310" class="content">
    他从罐子里抓了一把硬币。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fist -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Coins -->
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="140" cy="110" r="10" class="image" />
    <circle cx="160" cy="120" r="10" class="image" />
    <circle cx="180" cy="130" r="10" class="image" />
    <circle cx="200" cy="140" r="10" class="image" />
  </g>
</svg>