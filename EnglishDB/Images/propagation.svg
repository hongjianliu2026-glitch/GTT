<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">propagation</text>
  <text x="50" y="120" class="subtitle">[ˌprɒpəˈɡeɪʃn] n. 传播，繁殖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + pag (固定) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个种子被"向前固定(pro-pag)"在土壤中，
    <tspan x="50" dy="25">然后开始生根发芽，不断繁殖(propagation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The propagation of the virus was rapid.
  </text>
  <text x="50" y="310" class="content">
    病毒的传播速度很快。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seed -->
    <circle cx="50" cy="100" r="15" class="image" />
    <!-- Roots -->
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <!-- Soil -->
    <rect x="0" y="180" width="100" height="20" class="image" />
    <!-- Growing plant -->
    <line x1="50" y1="100" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="30" y2="20" class="image" />
    <line x1="50" y1="50" x2="70" y2="20" class="image" />
  </g>
</svg>