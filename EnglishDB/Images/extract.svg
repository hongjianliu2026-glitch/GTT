<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extract</text>
  <text x="50" y="120" class="subtitle">[ɪkˈstrækt] v. 提取，取出；n. 提取物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + tract (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用钳子从一堆东西中"拉出(tract)"
    <tspan x="50" dy="25">一个物体，这个动作就是提取(extract)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She extracted the juice from the oranges.
  </text>
  <text x="50" y="310" class="content">
    她从橙子中提取了果汁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Pile of objects -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Object being pulled out -->
    <rect x="100" y="50" width="50" height="50" class="image" />
    <!-- Pliers -->
    <line x1="125" y1="50" x2="125" y2="0" class="image" />
    <line x1="125" y1="0" x2="150" y2="20" class="image" />
    <line x1="125" y1="0" x2="100" y2="20" class="image" />
  </g>
</svg>