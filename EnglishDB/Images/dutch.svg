<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Dutch</text>
  <text x="50" y="120" class="subtitle">[dʌtʃ] adj. 荷兰的，荷兰人的；n. 荷兰人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中世纪荷兰语 "duutsch"，意为“人民的”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个荷兰人骑着自行车，"人民的(duutsch)"
    <tspan x="50" dy="25">在风车下悠闲地穿行，这就是荷兰(Dutch)的日常。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Dutch are known for their love of cycling.
  </text>
  <text x="50" y="310" class="content">
    荷兰人以热爱骑自行车而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Windmill -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="120" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <!-- Bicycle -->
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="250" y1="100" x2="300" y2="100" class="image" />
    <line x1="275" y1="100" x2="275" y2="50" class="image" />
    <line x1="275" y1="50" x2="250" y2="20" class="image" />
    <line x1="275" y1="50" x2="300" y2="20" class="image" />
  </g>
</svg>