<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .shine { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glistening</text>
  <text x="50" y="120" class="subtitle">[ˈɡlɪsənɪŋ] adj. 闪闪发光的，闪耀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gli- (光) + ss (闪烁) + en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗巨大的钻石，在阳光下"闪烁(gli-ss)"，
    <tspan x="50" dy="25">它的光芒让人无法直视，这就是"闪闪发光的(glistening)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lake glistened under the morning sun.
  </text>
  <text x="50" y="310" class="content">
    湖面在晨光下闪闪发光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diamond -->
    <polygon points="100,0 200,200 0,200" class="image" />
    <!-- Shine effect -->
    <circle cx="150" cy="100" r="50" class="shine" />
    <circle cx="120" cy="120" r="30" class="shine" />
    <circle cx="180" cy="120" r="30" class="shine" />
  </g>
</svg>