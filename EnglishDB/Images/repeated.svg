<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">repeated</text>
  <text x="50" y="120" class="subtitle">[rɪˈpiːtɪd] adj. 重复的，反复的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + peat (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子在玩拼图，"再次做(re-peat)"
    <tspan x="50" dy="25">同一块拼图，反复拼装，这就是重复(repeated)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher asked the students to repeat the exercise.
  </text>
  <text x="50" y="310" class="content">
    老师要求学生们重复做这个练习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle pieces -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <rect x="0" y="120" width="100" height="100" class="image" />
    <rect x="120" y="120" width="100" height="100" class="image" />
    <rect x="240" y="120" width="100" height="100" class="image" />
    <!-- Child -->
    <circle cx="180" cy="250" r="20" class="image" />
    <line x1="180" y1="270" x2="180" y2="320" class="image" />
    <line x1="180" y1="320" x2="160" y2="350" class="image" />
    <line x1="180" y1="320" x2="200" y2="350" class="image" />
    <line x1="180" y1="290" x2="220" y2="280" class="image" />
  </g>
</svg>