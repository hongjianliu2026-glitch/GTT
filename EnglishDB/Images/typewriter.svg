<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">typewriter</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪpˌraɪtər] n. 打字机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> type (打字) + writer (写者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的打字机，"打字(type)"
    <tspan x="50" dy="25">的写者(writer)，它用机械的敲击声</tspan>
    <tspan x="50" dy="25">记录下每一个字母，这就是打字机(typewriter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She typed the letter on an old typewriter.
  </text>
  <text x="50" y="310" class="content">
    她用一台旧打字机打出了这封信。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Typewriter body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Keyboard -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Keys -->
    <rect x="70" y="40" width="20" height="20" class="image" />
    <rect x="100" y="40" width="20" height="20" class="image" />
    <rect x="130" y="40" width="20" height="20" class="image" />
    <rect x="160" y="40" width="20" height="20" class="image" />
    <rect x="190" y="40" width="20" height="20" class="image" />
    <rect x="220" y="40" width="20" height="20" class="image" />
    <rect x="250" y="40" width="20" height="20" class="image" />
    <!-- Paper tray -->
    <rect x="50" y="180" width="250" height="20" class="image" />
    <!-- Paper -->
    <rect x="60" y="185" width="230" height="10" class="image" />
  </g>
</svg>