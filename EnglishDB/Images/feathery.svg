<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feathery</text>
  <text x="50" y="120" class="subtitle">[ˈfɛðəri] adj. 羽毛般的，轻柔的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> feather (羽毛) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只轻盈的鸟儿，它的羽毛(feather)
    <tspan x="50" dy="25">轻轻飘落，仿佛一片片轻柔的云朵(feathery)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pillow was as soft as a feathery cloud.
  </text>
  <text x="50" y="310" class="content">
    这个枕头像羽毛般的云朵一样柔软。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Feather -->
    <path d="M 0 0 L 20 20 L 40 0 L 60 20 L 80 0 L 100 20 L 120 0 L 140 20 L 160 0 L 180 20 L 200 0' class="image" />
    <!-- Bird -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="140" x2="80" y2="130" class="image" />
    <line x1="100" y1="140" x2="120" y2="130" class="image" />
    <line x1="100" y1="160" x2="80" y2="180" class="image" />
    <line x1="100" y1="160" x2="120" y2="180" class="image" />
  </g>
</svg>