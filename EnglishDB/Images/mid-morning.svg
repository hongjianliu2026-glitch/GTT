<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mid-morning</text>
  <text x="50" y="120" class="subtitle">[ˌmɪdˈmɔːrnɪŋ] n. 上午中段时间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mid- (中间) + morning (早晨)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟，指针指向"中间的早晨(mid-morning)"，
    <tspan x="50" dy="25">阳光正好，不冷不热，正是上午中段时间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We usually have a coffee break around mid-morning.
  </text>
  <text x="50" y="310" class="content">
    我们通常在上午中段时间喝咖啡休息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="70" x2="250" y2="40" class="image" />
    <line x1="250" y1="130" x2="250" y2="160" class="image" />
    <line x1="220" y1="100" x2="190" y2="100" class="image" />
    <line x1="280" y1="100" x2="310" y2="100" class="image" />
  </g>
</svg>