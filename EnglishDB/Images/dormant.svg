<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dormant</text>
  <text x="50" y="120" class="subtitle">[ˈdɔːrmənt] adj. 休眠的，静止的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dorm (睡眠) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只熊在冬天"沉睡(dorm)"在洞穴里，
    <tspan x="50" dy="25">它处于休眠状态(dormant)，等待春天的到来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The volcano remained dormant for centuries.
  </text>
  <text x="50" y="310" class="content">
    这座火山已经休眠了几个世纪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cave entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bear in cave -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="230" class="image" />
    <line x1="175" y1="200" x2="200" y2="230" class="image" />
    <line x1="175" y1="170" x2="220" y2="160" class="image" />
    <!-- Zzz -->
    <text x="250" y="120" class="content" style="font-size: 48px;">Zzz</text>
  </g>
</svg>