<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mouth</text>
  <text x="50" y="120" class="subtitle">[maʊθ] n. 口，嘴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mouth (源自原始日耳曼语 *munth-，意为“口”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的嘴巴，张开得像一个山洞，
    <tspan x="50" dy="25">里面有无数的牙齿，仿佛能吞下整个世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She opened her mouth to speak.
  </text>
  <text x="50" y="310" class="content">
    她张开嘴说话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mouth outline -->
    <path d="M 0 100 Q 50 50 100 100 Q 150 150 200 100 Q 250 50 300 100" class="image" />
    <!-- Teeth -->
    <rect x="50" y="80" width="20" height="20" class="image" />
    <rect x="80" y="80" width="20" height="20" class="image" />
    <rect x="110" y="80" width="20" height="20" class="image" />
    <rect x="140" y="80" width="20" height="20" class="image" />
    <rect x="170" y="80" width="20" height="20" class="image" />
    <rect x="200" y="80" width="20" height="20" class="image" />
    <rect x="230" y="80" width="20" height="20" class="image" />
    <rect x="260" y="80" width="20" height="20" class="image" />
  </g>
</svg>