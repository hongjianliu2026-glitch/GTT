<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">safeguard</text>
  <text x="50" y="120" class="subtitle">[ˈseɪfɡɑːrd] n. 保护措施；v. 保护</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> safe (安全) + guard (守卫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的盾牌(guard)，上面写着"安全(safe)"，
    <tspan x="50" dy="25">这个盾牌就是保护(safeguard)我们的最佳措施。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Installing a security system is a safeguard against burglars.
  </text>
  <text x="50" y="310" class="content">
    安装安全系统是防止入室盗窃的保护措施。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <polygon points="0,100 100,0 200,100 100,200" class="image" />
    <!-- Safe text -->
    <text x="100" y="110" class="content" text-anchor="middle" font-size="30">Safe</text>
  </g>
</svg>