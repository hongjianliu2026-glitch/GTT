<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">covenant</text>
  <text x="50" y="120" class="subtitle">[ˈkʌvənənt] n. 契约，盟约</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cov- (共同) + enant (存在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人站在一张桌子前，"共同存在(cov-enant)"
    <tspan x="50" dy="25">并签署一份契约(covenant)，象征着他们的合作与承诺。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They made a covenant to support each other in business.
  </text>
  <text x="50" y="310" class="content">
    他们在生意上达成了一项互相支持的契约。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two people -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />

    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="330" y2="120" class="image" />

    <!-- Document -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <line x1="160" y1="60" x2="240" y2="60" class="image" />
    <line x1="160" y1="80" x2="240" y2="80" class="image" />
    <line x1="160" y1="100" x2="240" y2="100" class="image" />
    <line x1="160" y1="120" x2="240" y2="120" class="image" />
  </g>
</svg>