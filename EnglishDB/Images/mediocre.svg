<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mediocre</text>
  <text x="50" y="120" class="subtitle">[ˌmiːdiˈoʊkər] adj. 平庸的，普通的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> medi- (中间) + ocre (像)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一群人中间，"既不突出也不落后(medi-ocre)"，
    <tspan x="50" dy="25">就像一个普通的(mediocre)人，没有特别的优点或缺点。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His performance was mediocre at best.
  </text>
  <text x="50" y="310" class="content">
    他的表现充其量只能算是平庸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Middle person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="200" class="image" />
    <line x1="175" y1="160" x2="195" y2="200" class="image" />
    <line x1="175" y1="140" x2="145" y2="130" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />

    <!-- Surrounding people -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="175" cy="50" r="20" class="image" />
    <circle cx="175" cy="150" r="20" class="image" />
  </g>
</svg>