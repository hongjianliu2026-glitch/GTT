<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nefarious</text>
  <text x="50" y="120" class="subtitle">[nɪˈfɛəriəs] adj. 恶毒的，邪恶的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ne- (不) + -fari (说) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶毒的巫师，"不能说(ne-fari)"
    <tspan x="50" dy="25">出他的邪恶计划，因为他的计划是如此邪恶(nefarious)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nefarious plot was exposed by the detective.
  </text>
  <text x="50" y="310" class="content">
    那个恶毒的阴谋被侦探揭露了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Evil wizard -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Dark cloud -->
    <ellipse cx="150" cy="80" rx="100" ry="50" class="image" />
    <!-- Lightning bolt -->
    <line x1="100" y1="80" x2="200" y2="180" class="image" />
    <line x1="150" y1="130" x2="200" y2="80" class="image" />
  </g>
</svg>