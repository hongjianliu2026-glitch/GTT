<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ego</text>
  <text x="50" y="120" class="subtitle">[ˈiːɡoʊ] n. 自我，自负</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ego (自我)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"自我(ego)"膨胀到
    <tspan x="50" dy="25">几乎看不见镜子里的自己，这就是自负的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His ego got in the way of his success.
  </text>
  <text x="50" y="310" class="content">
    他的自负阻碍了他的成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Ego balloon -->
    <circle cx="175" cy="50" r="30" class="image" />
    <line x1="175" y1="80" x2="175" y2="50" class="image" />
    <!-- Mirror reflection -->
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <line x1="160" y1="160" x2="190" y2="160" class="image" />
    <line x1="170" y1="170" x2="180" y2="170" class="image" />
  </g>
</svg>