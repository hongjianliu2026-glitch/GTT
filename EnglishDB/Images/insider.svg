<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insider</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsaɪdər] n. 内部人士，知情人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (内部) + side (边) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的"内部人士(insider)"，他站在一个巨大的
    <tspan x="50" dy="25">房间里，房间的墙壁上布满了秘密的符号和线索。</tspan>
    <tspan x="50" dy="25">他知道所有的秘密，因为他就在"内部(in-)"，站在"边(side)"上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The insider revealed confidential information to the press.
  </text>
  <text x="50" y="330" class="content">
    这位内部人士向媒体透露了机密信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Secret symbols -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="90" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="250" cy="130" r="10" class="image" />
    <!-- Insider -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>