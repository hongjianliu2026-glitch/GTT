<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">substandard</text>
  <text x="50" y="120" class="subtitle">[ˌsʌbˈstændərd] adj. 低于标准的，不合格的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + standard (标准)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个产品被放在"标准线(standard)"下面，
    <tspan x="50" dy="25">表示它"低于标准(sub-standard)"，不合格。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The quality of this product is substandard.
  </text>
  <text x="50" y="310" class="content">
    这个产品的质量是不合格的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Standard line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <text x="175" y="-20" class="content" text-anchor="middle">Standard</text>
    <!-- Substandard product -->
    <rect x="150" y="20" width="50" height="50" class="image" />
    <line x1="175" y1="70" x2="175" y2="100" class="image" />
    <text x="175" y="120" class="content" text-anchor="middle">Substandard</text>
  </g>
</svg>