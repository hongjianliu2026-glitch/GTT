<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">armchair</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrmtʃeər] n. 扶手椅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arm (手臂) + chair (椅子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个舒适的扶手椅，"手臂(arm)"
    <tspan x="50" dy="25">环绕着椅子，提供支撑和放松，这就是扶手椅(armchair)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He sat in his armchair, reading a book.
  </text>
  <text x="50" y="310" class="content">
    他坐在扶手椅上，读着一本书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Chair base -->
    <rect x="50" y="150" width="200" height="50" class="image" />
    <!-- Chair back -->
    <rect x="100" y="50" width="100" height="100" class="image" />
    <!-- Armrests -->
    <rect x="50" y="100" width="50" height="50" class="image" />
    <rect x="200" y="100" width="50" height="50" class="image" />
    <!-- Legs -->
    <line x1="75" y1="200" x2="75" y2="250" class="image" />
    <line x1="225" y1="200" x2="225" y2="250" class="image" />
  </g>
</svg>