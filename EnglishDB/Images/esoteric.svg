<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">esoteric</text>
  <text x="50" y="120" class="subtitle">[ˌɛsəˈtɛrɪk] adj. 深奥的，秘传的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> esot- (内部) + -eric (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的学者，手持一本"内部(esot-)"
    <tspan x="50" dy="25">秘传的书籍，只有少数人能理解其深奥的内容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lecture on quantum mechanics was so esoteric that few could follow.
  </text>
  <text x="50" y="310" class="content">
    关于量子力学的讲座非常深奥，很少有人能理解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="50" x2="180" y2="50" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="110" x2="180" y2="110" class="image" />
    <!-- Scholar -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="230" y2="160" class="image" />
    <line x1="250" y1="130" x2="270" y2="160" class="image" />
    <line x1="250" y1="110" x2="280" y2="100" class="image" />
    <!-- Hand holding book -->
    <line x1="250" y1="95" x2="200" y2="75" class="image" />
  </g>
</svg>