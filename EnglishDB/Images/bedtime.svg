<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bedtime</text>
  <text x="50" y="120" class="subtitle">[ˈbɛdtaɪm] n. 就寝时间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bed (床) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩在床上，"床(bed)"和"时间(time)"
    <tspan x="50" dy="25">的结合，就是他该睡觉的时间(bedtime)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's bedtime, time to say goodnight.
  </text>
  <text x="50" y="310" class="content">
    现在是就寝时间，该说晚安了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Pillow -->
    <rect x="100" y="40" width="150" height="30" class="image" />
    <!-- Blanket -->
    <rect x="70" y="80" width="210" height="100" class="image" />
    <!-- Child -->
    <circle cx="175" cy="130" r="20" class="image" />
    <line x1="175" y1="150" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="200" class="image" />
    <line x1="175" y1="180" x2="195" y2="200" class="image" />
    <line x1="175" y1="160" x2="200" y2="150" class="image" />
    <line x1="175" y1="160" x2="150" y2="150" class="image" />
  </g>
</svg>