<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">medium-high</text>
  <text x="50" y="120" class="subtitle">[ˌmiːdiəm ˈhaɪ] adj. 中高的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> medium (中间) + high (高)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体，它的高度既不是特别高，也不是特别低，而是"中间的高(medium-high)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The building is medium-high, not too tall but not short either.
  </text>
  <text x="50" y="310" class="content">
    这座建筑是中高的，不算太高但也不矮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Medium-high building -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <!-- High building -->
    <rect x="150" y="0" width="100" height="250" class="image" />
    <!-- Low building -->
    <rect x="300" y="0" width="100" height="100" class="image" />
    <!-- Arrows -->
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="180" class="image" />
    <line x1="50" y1="200" x2="70" y2="180" class="image" />
    <text x="30" y="220" class="content">medium-high</text>
  </g>
</svg>