<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foundry</text>
  <text x="50" y="120" class="subtitle">[ˈfaʊndri] n. 铸造厂，铸造车间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> found (铸造) + -ry (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的熔炉，"铸造(found)"
    <tspan x="50" dy="25">金属的地方，这就是铸造厂(foundry)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The foundry produces high-quality metal parts.
  </text>
  <text x="50" y="310" class="content">
    这家铸造厂生产高质量的金属零件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Furnace -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Molten metal -->
    <circle cx="175" cy="100" r="50" fill="#FF4500" />
    <!-- Metal parts -->
    <rect x="70" y="140" width="30" height="30" class="image" />
    <rect x="120" y="140" width="30" height="30" class="image" />
    <rect x="170" y="140" width="30" height="30" class="image" />
    <rect x="220" y="140" width="30" height="30" class="image" />
  </g>
</svg>