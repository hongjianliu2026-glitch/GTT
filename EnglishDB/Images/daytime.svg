<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">daytime</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪtaɪm] n. 白天，日间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> day (天) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳高高挂在天空，"天(day)"
    <tspan x="50" dy="25">和"时间(time)"结合，形成了白天(daytime)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We usually go for a walk in the daytime.
  </text>
  <text x="50" y="310" class="content">
    我们通常在白天去散步。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Ground -->
    <rect x="0" y="200" width="350" height="100" class="image" fill="#2ECC71" />
    <!-- Person walking -->
    <circle cx="200" cy="180" r="15" class="image" fill="#E74C3C" />
    <line x1="200" y1="195" x2="200" y2="230" class="image" />
    <line x1="200" y1="230" x2="180" y2="260" class="image" />
    <line x1="200" y1="230" x2="220" y2="260" class="image" />
    <line x1="200" y1="210" x2="230" y2="200" class="image" />
  </g>
</svg>