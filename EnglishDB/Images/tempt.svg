<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tempt</text>
  <text x="50" y="120" class="subtitle">[tɛmpt] v. 引诱，诱惑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> temp- (尝试)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔鬼拿着一个闪闪发光的苹果，"尝试(temp-)"
    <tspan x="50" dy="25">一下这个苹果，你就会被诱惑(tempt)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The delicious cake tempted me to eat more.
  </text>
  <text x="50" y="310" class="content">
    美味的蛋糕引诱我多吃了一点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Devil -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Apple -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="180" class="image" />
    <line x1="200" y1="160" x2="220" y2="180" class="image" />
    <!-- Hand offering apple -->
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
  </g>
</svg>