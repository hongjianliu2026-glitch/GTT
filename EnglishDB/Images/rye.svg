<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #B7950B; }
      .subtitle { font: italic 24px serif; fill: #6E2C00; }
      .content { font: 18px sans-serif; fill: #873600; }
      .highlight { font-weight: bold; fill: #D35400; }
      .story { font: 16px serif; fill: #196F3D; }
      .image { stroke: #7D6608; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rye</text>
  <text x="50" y="120" class="subtitle">[raɪ] n. 黑麦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "rye"，意为黑麦。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片金黄的黑麦田，风吹过时，
    <tspan x="50" dy="25">黑麦穗随风摇曳，仿佛在向你招手。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He planted rye in his field last spring.
  </text>
  <text x="50" y="310" class="content">
    他去年春天在田里种了黑麦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rye field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rye stalks -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Wind effect -->
    <polyline points="50,100 70,90 90,100" class="image" />
    <polyline points="100,100 120,90 140,100" class="image" />
    <polyline points="150,100 170,90 190,100" class="image" />
    <polyline points="200,100 220,90 240,100" class="image" />
    <polyline points="250,100 270,90 290,100" class="image" />
    <polyline points="300,100 320,90 340,100" class="image" />
  </g>
</svg>