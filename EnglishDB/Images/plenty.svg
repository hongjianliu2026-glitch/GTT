<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plenty</text>
  <text x="50" y="120" class="subtitle">[ˈplɛnti] n. 丰富，大量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plen (满) + -ty (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的碗，里面装满了各种水果，"满满(plen-ty)"
    <tspan x="50" dy="25">的水果象征着丰富的资源和大量的物品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There is plenty of food at the party.
  </text>
  <text x="50" y="310" class="content">
    派对上有大量的食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="200" cy="150" rx="150" ry="70" class="image" />
    <!-- Fruits -->
    <circle cx="100" cy="100" r="20" class="image" /> <!-- Apple -->
    <circle cx="250" cy="120" r="25" class="image" /> <!-- Orange -->
    <circle cx="180" cy="80" r="15" class="image" /> <!-- Banana -->
    <circle cx="300" cy="100" r="20" class="image" /> <!-- Grapes -->
    <circle cx="150" cy="130" r="18" class="image" /> <!-- Pear -->
  </g>
</svg>