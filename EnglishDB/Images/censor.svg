<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">censor</text>
  <text x="50" y="120" class="subtitle">[ˈsɛnsər] n. 审查员，检查员；v. 审查，检查</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cense (审查) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个审查员拿着一把巨大的剪刀，"审查(cense)"
    <tspan x="50" dy="25">并剪掉所有他认为不合适的内容，这就是审查(censor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government censored the news to control public opinion.
  </text>
  <text x="50" y="310" class="content">
    政府审查新闻以控制公众舆论。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Censor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Scissors -->
    <line x1="70" y1="100" x2="120" y2="100" class="image" />
    <line x1="70" y1="100" x2="70" y2="120" class="image" />
    <line x1="120" y1="100" x2="120" y2="120" class="image" />
    <line x1="70" y1="120" x2="120" y2="120" class="image" />
    <!-- Paper -->
    <rect x="150" y="90" width="200" height="60" class="image" />
    <line x1="160" y1="100" x2="340" y2="100" class="image" />
    <line x1="160" y1="120" x2="340" y2="120" class="image" />
    <line x1="160" y1="140" x2="340" y2="140" class="image" />
  </g>
</svg>