<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cliff</text>
  <text x="50" y="120" class="subtitle">[klɪf] n. 悬崖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cli (倾斜) + ff (表示陡峭)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"倾斜(cli)"山体，
    <tspan x="50" dy="25">它的边缘陡峭(ff)得让人心惊胆战，</tspan>
    <tspan x="50" dy="25">这就是悬崖(cliff)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hiker stood at the edge of the cliff, admiring the view.
  </text>
  <text x="50" y="310" class="content">
    徒步旅行者站在悬崖边，欣赏着风景。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cliff -->
    <polygon points="0,200 200,0 400,200" class="image" />
    <!-- Hiker -->
    <circle cx="180" cy="180" r="15" class="image" />
    <line x1="180" y1="195" x2="180" y2="230" class="image" />
    <line x1="180" y1="230" x2="160" y2="260" class="image" />
    <line x1="180" y1="230" x2="200" y2="260" class="image" />
    <line x1="180" y1="210" x2="210" y2="200" class="image" />
  </g>
</svg>