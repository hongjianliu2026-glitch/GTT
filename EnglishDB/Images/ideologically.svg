<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ideologically</text>
  <text x="50" y="120" class="subtitle">[ˌaɪdiəˈlɑːdʒɪkli] adv. 意识形态上</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ideo- (思想) + logy (学说) + -ical (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个思想家站在讲台上，"思想(ideo)"
    <tspan x="50" dy="25">和"学说(logy)"在他的脑海中碰撞，</tspan>
    <tspan x="50" dy="25">形成了强烈的"意识形态(ideology)"，</tspan>
    <tspan x="50" dy="25">这种思想在"意识形态上(ideologically)"影响着他的行为。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The two parties differ ideologically on many issues.
  </text>
  <text x="50" y="330" class="content">
    这两个政党在许多问题上意识形态不同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thought bubble -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="150" cy="150" r="50" class="image" />
    <circle cx="50" cy="150" r="50" class="image" />
    <circle cx="100" cy="200" r="50" class="image" />
    <!-- Speaker -->
    <circle cx="100" cy="300" r="30" class="image" />
    <line x1="100" y1="330" x2="100" y2="380" class="image" />
    <line x1="100" y1="380" x2="80" y2="410" class="image" />
    <line x1="100" y1="380" x2="120" y2="410" class="image" />
    <line x1="100" y1="360" x2="150" y2="350" class="image" />
  </g>
</svg>