<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">implode</text>
  <text x="50" y="120" class="subtitle">[ɪmˈploʊd] v. 内爆，向内破裂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (向内) + plod (爆裂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球，"向内爆裂(im-plod)"，
    <tspan x="50" dy="25">瞬间收缩成一个小点，这就是内爆(implode)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The building imploded in a matter of seconds.
  </text>
  <text x="50" y="310" class="content">
    那栋大楼在几秒钟内就内爆了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Implosion effect -->
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Shrink lines -->
    <line x1="100" y1="50" x2="100" y2="80" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="80" y2="100" class="image" />
    <line x1="120" y1="100" x2="150" y2="100" class="image" />
  </g>
</svg>