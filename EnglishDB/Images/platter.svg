<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">platter</text>
  <text x="50" y="120" class="subtitle">[ˈplætər] n. 大浅盘，托盘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plat (平) + -ter (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"平(plat)"盘子(ter)，上面堆满了美味的食物，
    <tspan x="50" dy="25">就像一个丰盛的自助餐，让人垂涎欲滴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The waiter brought a platter of assorted cheeses.
  </text>
  <text x="50" y="310" class="content">
    服务员端来了一盘各式各样的奶酪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food on the platter -->
    <circle cx="100" cy="100" r="30" class="image" /> <!-- Cheese -->
    <rect x="150" y="70" width="50" height="50" class="image" /> <!-- Bread -->
    <circle cx="250" cy="100" r="20" class="image" /> <!-- Fruit -->
    <rect x="200" y="120" width="30" height="30" class="image" /> <!-- Vegetable -->
  </g>
</svg>