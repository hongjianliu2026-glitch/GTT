<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prod</text>
  <text x="50" y="120" class="subtitle">[prɒd] v. 戳，刺；促使，激励</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + -d (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用手指"向前戳(pro-d)"，
    <tspan x="50" dy="25">试图推动或激励某人前进。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had to prod him to finish his homework.
  </text>
  <text x="50" y="310" class="content">
    她不得不督促他完成作业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Finger pointing -->
    <line x1="50" y1="50" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="180" y2="30" class="image" />
    <line x1="200" y1="50" x2="180" y2="70" class="image" />
    <line x1="200" y1="50" x2="220" y2="30" class="image" />
    <line x1="200" y1="50" x2="220" y2="70" class="image" />
    <!-- Person -->
    <circle cx="30" cy="50" r="20" class="image" />
    <line x1="30" y1="70" x2="30" y2="120" class="image" />
    <line x1="30" y1="120" x2="10" y2="150" class="image" />
    <line x1="30" y1="120" x2="50" y2="150" class="image" />
    <line x1="30" y1="90" x2="60" y2="80" class="image" />
  </g>
</svg>