<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wimp</text>
  <text x="50" y="120" class="subtitle">[wɪmp] n. 懦夫，软弱的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wim (软弱) + p (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"软弱(wim)"的人，"p"代表他
    <tspan x="50" dy="25">因为害怕而蜷缩成一团，这就是"懦夫(wimp)"的形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was such a wimp that he couldn't even stand up to his own shadow.
  </text>
  <text x="50" y="310" class="content">
    他如此懦弱，甚至不敢面对自己的影子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wimp -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Fear -->
    <path d="M10,100 Q50,50 90,100" class="image" />
    <path d="M10,120 Q50,170 90,120" class="image" />
  </g>
</svg>