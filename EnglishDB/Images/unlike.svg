<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unlike</text>
  <text x="50" y="120" class="subtitle">[ʌnˈlaɪk] prep. 不像，不同于</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + like (相似)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人，一个拿着苹果，一个拿着橙子，"不像(un-like)"
    <tspan x="50" dy="25">彼此，因为他们拿着不同的水果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Unlike her sister, she prefers reading to watching TV.
  </text>
  <text x="50" y="310" class="content">
    和她姐姐不同，她更喜欢读书而不是看电视。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person 1 with apple -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <circle cx="50" cy="200" r="15" class="image" fill="#FF5733" />
    <text x="40" y="215" class="content" fill="#000">苹果</text>

    <!-- Person 2 with orange -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="180" y2="130" class="image" />
    <line x1="200" y1="150" x2="220" y2="130" class="image" />
    <circle cx="200" cy="200" r="15" class="image" fill="#FFC300" />
    <text x="190" y="215" class="content" fill="#000">橙子</text>

    <!-- Unlike arrow -->
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <polygon points="150,140 160,150 150,160" class="image" />
  </g>
</svg>