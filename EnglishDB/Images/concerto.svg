<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">concerto</text>
  <text x="50" y="120" class="subtitle">[kənˈtʃɛrtoʊ] n. 协奏曲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + cert (竞争)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场音乐会，"一起竞争(con-cert)"
    <tspan x="50" dy="25">的乐器们，共同演奏出美妙的协奏曲(concerto)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The violinist played a beautiful concerto.
  </text>
  <text x="50" y="310" class="content">
    小提琴家演奏了一首美妙的协奏曲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Music notes -->
    <path d="M50 50 Q70 30 90 50 T130 50" class="image" />
    <path d="M50 80 Q70 60 90 80 T130 80" class="image" />
    <path d="M50 110 Q70 90 90 110 T130 110" class="image" />
    <!-- Violin -->
    <rect x="150" y="20" width="100" height="160" class="image" />
    <line x1="150" y1="20" x2="250" y2="20" class="image" />
    <line x1="150" y1="180" x2="250" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Music stand -->
    <rect x="270" y="20" width="50" height="160" class="image" />
    <line x1="270" y1="20" x2="320" y2="20" class="image" />
    <line x1="270" y1="180" x2="320" y2="180" class="image" />
    <line x1="270" y1="20" x2="270" y2="180" class="image" />
    <line x1="320" y1="20" x2="320" y2="180" class="image" />
  </g>
</svg>