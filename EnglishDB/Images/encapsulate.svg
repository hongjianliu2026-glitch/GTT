<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">encapsulate</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkæpsjuleɪt] v. 封装，概括</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + cap (头) + -sul (小) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家将复杂的实验数据"装进(en-)"一个小小的"胶囊(cap-sul)"里，
    <tspan x="50" dy="25">这样就能轻松地"概括(encapsulate)"并传递信息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The report encapsulates the key findings of the study.
  </text>
  <text x="50" y="310" class="content">
    这份报告概括了研究的关键发现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Capsule -->
    <rect x="0" y="0" width="200" height="100" rx="50" ry="50" class="image" />
    <!-- Data inside capsule -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <!-- Scientist -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
    <line x1="250" y1="80" x2="280" y2="70" class="image" />
  </g>
</svg>