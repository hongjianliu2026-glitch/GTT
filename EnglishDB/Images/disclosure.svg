<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disclosure</text>
  <text x="50" y="120" class="subtitle">[dɪsˈkloʊʒər] n. 揭露，透露</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + closure (关闭)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被锁住的秘密盒子，"分开关闭(dis-closure)"
    <tspan x="50" dy="25">的动作，秘密被揭露出来，真相大白。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The disclosure of the scandal shocked the public.
  </text>
  <text x="50" y="310" class="content">
    丑闻的揭露震惊了公众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Lock -->
    <rect x="80" y="50" width="40" height="50" class="image" />
    <!-- Open lock -->
    <line x1="80" y1="50" x2="120" y2="50" class="image" />
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <!-- Secret revealed -->
    <text x="220" y="100" class="content" style="font-size: 36px; fill: #E74C3C;">?</text>
    <text x="250" y="100" class="content" style="font-size: 36px; fill: #27AE60;">!</text>
  </g>
</svg>