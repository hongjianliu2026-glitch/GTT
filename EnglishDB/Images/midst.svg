<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">midst</text>
  <text x="50" y="120" class="subtitle">[mɪdst] n. 中间，中部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mid- (中间) + st (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人站成一排，"中间站立(mid-st)"的那个人
    <tspan x="50" dy="25">就是midst，象征着中间的位置。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found herself in the midst of a crowd.
  </text>
  <text x="50" y="310" class="content">
    她发现自己身处人群之中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- People standing in a line -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="300" cy="50" r="15" class="image" />
    <!-- Midst person -->
    <circle cx="200" cy="50" r="20" class="image" fill="#E74C3C" />
    <text x="190" y="65" class="highlight" font-size="24">midst</text>
  </g>
</svg>