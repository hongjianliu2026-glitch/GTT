<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deflect</text>
  <text x="50" y="120" class="subtitle">[dɪˈflekt] v. 使偏斜，使转向</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + flect (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个箭头原本直直地飞向目标，但突然被"弯曲离开(de-flect)"，
    <tspan x="50" dy="25">改变了方向，这就是deflect的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shield deflected the arrow and saved the knight.
  </text>
  <text x="50" y="310" class="content">
    盾牌使箭偏斜，救了骑士一命。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow -->
    <line x1="0" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
    <!-- Shield -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <!-- Deflection -->
    <line x1="200" y1="100" x2="300" y2="150" class="image" />
    <polygon points="300,150 290,140 290,160" class="image" />
  </g>
</svg>