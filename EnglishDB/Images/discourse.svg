<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discourse</text>
  <text x="50" y="120" class="subtitle">[ˈdɪskɔːrs] n. 演讲，论述；v. 谈论，讨论</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + course (跑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者在台上，"分开跑(dis-course)"
    <tspan x="50" dy="25">向不同的方向传递思想，这些思想就构成了一个演讲(discourse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The professor's discourse on ancient history was fascinating.
  </text>
  <text x="50" y="310" class="content">
    教授关于古代历史的演讲非常吸引人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lecturer -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Speech bubbles -->
    <path d="M100,50 Q150,20 200,50 T300,50" class="image" />
    <path d="M100,80 Q150,60 200,80 T300,80" class="image" />
    <path d="M100,110 Q150,90 200,110 T300,110" class="image" />
  </g>
</svg>