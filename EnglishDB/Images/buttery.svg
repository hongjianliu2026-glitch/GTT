<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #5D4037; }
      .content { font: 18px sans-serif; fill: #795548; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #388E3C; }
      .image { stroke: #795548; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buttery</text>
  <text x="50" y="120" class="subtitle">[ˈbʌtəri] adj. 黄油般的，光滑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> butter (黄油) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块黄油在热锅上融化，变得"黄油般(buttery)"
    <tspan x="50" dy="25">光滑，这种感觉就像触摸到buttery的质感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake had a buttery texture that melted in your mouth.
  </text>
  <text x="50" y="310" class="content">
    蛋糕有黄油般的质感，入口即化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butter melting -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <circle cx="100" cy="100" r="30" class="image" fill="#FFEB3B" />
    <circle cx="150" cy="120" r="25" class="image" fill="#FFEB3B" />
    <circle cx="200" cy="140" r="20" class="image" fill="#FFEB3B" />
    <circle cx="250" cy="160" r="15" class="image" fill="#FFEB3B" />
    <!-- Pan -->
    <rect x="50" y="180" width="250" height="20" class="image" fill="#795548" />
  </g>
</svg>