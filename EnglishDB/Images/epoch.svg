<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">epoch</text>
  <text x="50" y="120" class="subtitle">[ˈɛpək] n. 新纪元，时代</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + poch (停止)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，指针突然"停止(poch)"，
    <tspan x="50" dy="25">标志着旧时代的结束，一个全新的"纪元(epoch)"开始。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The invention of the internet marked a new epoch in human history.
  </text>
  <text x="50" y="310" class="content">
    互联网的发明标志着人类历史的新纪元。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Stop sign -->
    <rect x="150" y="180" width="50" height="50" class="image" />
    <text x="160" y="210" class="content">STOP</text>
    <!-- New era sign -->
    <rect x="220" y="180" width="100" height="50" class="image" />
    <text x="230" y="210" class="content">NEW EPOCH</text>
  </g>
</svg>