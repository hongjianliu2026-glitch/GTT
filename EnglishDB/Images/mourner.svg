<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mourner</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrnər] n. 哀悼者，送葬者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mourn (哀悼) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个悲伤的人，"哀悼(mourn)"
    <tspan x="50" dy="25">着逝去的亲人，他就是哀悼者(mourner)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mourner wept as the coffin was lowered into the ground.
  </text>
  <text x="50" y="310" class="content">
    当棺材被放入地下时，哀悼者哭泣着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Tear -->
    <circle cx="10" cy="90" r="5" class="image" fill="#1ABC9C" />
    <line x1="10" y1="90" x2="10" y2="70" class="image" />
    <!-- Coffin -->
    <rect x="50" y="120" width="100" height="50" class="image" />
    <line x1="50" y1="145" x2="150" y2="145" class="image" />
    <line x1="50" y1="170" x2="150" y2="170" class="image" />
  </g>
</svg>