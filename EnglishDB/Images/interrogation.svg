<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interrogation</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərəˈɡeɪʃn] n. 审问，盘问</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在中间) + rog (问) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个警察在审讯室里，"在中间提问(inter-rog-ation)"
    <tspan x="50" dy="25">嫌疑人，试图找出真相。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The suspect was subjected to hours of interrogation.
  </text>
  <text x="50" y="310" class="content">
    嫌疑人被审问了几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Interrogation room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Police officer -->
    <circle cx="80" cy="100" r="15" class="image" />
    <line x1="80" y1="115" x2="80" y2="150" class="image" />
    <line x1="80" y1="150" x2="60" y2="180" class="image" />
    <line x1="80" y1="150" x2="100" y2="180" class="image" />
    <line x1="80" y1="130" x2="110" y2="120" class="image" />
    <!-- Suspect -->
    <circle cx="220" cy="100" r="15" class="image" />
    <line x1="220" y1="115" x2="220" y2="150" class="image" />
    <line x1="220" y1="150" x2="200" y2="180" class="image" />
    <line x1="220" y1="150" x2="240" y2="180" class="image" />
    <line x1="220" y1="130" x2="250" y2="120" class="image" />
    <!-- Question marks -->
    <text x="150" y="80" font-size="48" fill="#E74C3C">?</text>
    <text x="170" y="120" font-size="48" fill="#E74C3C">?</text>
    <text x="130" y="120" font-size="48" fill="#E74C3C">?</text>
  </g>
</svg>