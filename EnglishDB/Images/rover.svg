<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rover</text>
  <text x="50" y="120" class="subtitle">[ˈroʊvər] n. 漫游者，流浪者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rov (漫游) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的探险家，"漫游(rov)"在未知的土地上，
    <tspan x="50" dy="25">他就是那个"漫游者(rover)"，探索着世界的每一个角落。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rover explored the surface of Mars.
  </text>
  <text x="50" y="310" class="content">
    漫游者探索了火星的表面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rover -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="20" y="20" width="110" height="60" class="image" />
    <line x1="30" y1="40" x2="120" y2="40" class="image" />
    <line x1="30" y1="60" x2="120" y2="60" class="image" />
    <circle cx="40" cy="80" r="10" class="image" />
    <circle cx="110" cy="80" r="10" class="image" />
    <!-- Landscape -->
    <line x1="0" y1="120" x2="150" y2="120" class="image" />
    <line x1="0" y1="140" x2="150" y2="140" class="image" />
    <line x1="0" y1="160" x2="150" y2="160" class="image" />
  </g>
</svg>