<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gawk</text>
  <text x="50" y="120" class="subtitle">[ɡɔːk] v. 笨拙地行动，呆呆地看</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gawk (笨拙)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人笨拙地走路，"呆呆地看(gawk)"
    <tspan x="50" dy="25">周围的一切，就像一只笨拙的鸟。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gawked at the beautiful scenery, unable to move.
  </text>
  <text x="50" y="310" class="content">
    他被美丽的景色惊呆了，无法移动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="160" class="image" />
    <line x1="50" y1="120" x2="70" y2="160" class="image" />
    <line x1="50" y1="90" x2="20" y2="100" class="image" />
    <line x1="50" y1="90" x2="80" y2="100" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="45" r="3" class="image" />
    <circle cx="60" cy="45" r="3" class="image" />
    <!-- Mouth -->
    <line x1="45" y1="60" x2="55" y2="60" class="image" />
    <!-- Scenery -->
    <rect x="100" y="20" width="200" height="100" class="image" />
    <line x1="120" y1="40" x2="180" y2="40" class="image" />
    <line x1="120" y1="60" x2="180" y2="60" class="image" />
    <line x1="120" y1="80" x2="180" y2="80" class="image" />
  </g>
</svg>