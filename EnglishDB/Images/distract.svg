<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">distract</text>
  <text x="50" y="120" class="subtitle">[dɪˈstrækt] v. 分散注意力，使分心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + tract (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人正在专心工作，突然一只巨大的手从天而降，"拉开(tract)"
    <tspan x="50" dy="25">他的注意力，让他分心(distract)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The loud noise from the street distracted me from my reading.
  </text>
  <text x="50" y="310" class="content">
    街上的噪音让我无法专心阅读。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person working -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Desk -->
    <rect x="20" y="180" width="60" height="20" class="image" />
    <!-- Book -->
    <rect x="30" y="160" width="40" height="20" class="image" />
    <!-- Giant hand -->
    <line x1="150" y1="20" x2="100" y2="100" class="image" />
    <line x1="150" y1="20" x2="120" y2="100" class="image" />
    <line x1="150" y1="20" x2="140" y2="100" class="image" />
    <line x1="150" y1="20" x2="160" y2="100" class="image" />
    <line x1="150" y1="20" x2="180" y2="100" class="image" />
  </g>
</svg>