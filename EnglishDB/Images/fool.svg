<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fool</text>
  <text x="50" y="120" class="subtitle">[fuːl] n. 傻瓜，愚人；v. 愚弄，欺骗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fol (愚蠢)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个傻瓜(fool)头上戴着一顶巨大的帽子，
    <tspan x="50" dy="25">帽子上有许多小铃铛，每走一步铃铛就叮当作响，</tspan>
    <tspan x="50" dy="25">象征着他的愚蠢和可笑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Don't be a fool and believe everything they say.
  </text>
  <text x="50" y="310" class="content">
    别傻了，别相信他们说的每句话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fool's head -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Fool's hat -->
    <path d="M 20 20 Q 50 0 80 20 L 80 40 Q 50 60 20 40 Z" class="image" />
    <!-- Bells on the hat -->
    <circle cx="30" cy="25" r="5" class="image" />
    <circle cx="50" cy="20" r="5" class="image" />
    <circle cx="70" cy="25" r="5" class="image" />
    <!-- Fool's body -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="200" class="image" />
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
  </g>
</svg>