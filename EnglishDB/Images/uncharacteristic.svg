<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uncharacteristic</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˌkærəktəˈrɪstɪk] adj. 非典型的，不寻常的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + characteristic (典型的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只通常温顺的猫突然"不(un-)"再表现出"典型的(characteristic)"
    <tspan x="50" dy="25">行为，开始像狗一样吠叫，这真是非典型的(uncharacteristic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His uncharacteristic outburst surprised everyone.
  </text>
  <text x="50" y="310" class="content">
    他那非典型的爆发让所有人都感到惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <!-- Dog-like behavior -->
    <text x="120" y="150" class="content" style="font-size: 36px;">🐶</text>
    <text x="120" y="190" class="content">Barking</text>
  </g>
</svg>