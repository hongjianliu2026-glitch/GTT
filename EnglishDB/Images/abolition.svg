<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abolition</text>
  <text x="50" y="120" class="subtitle">[ˌæbəˈlɪʃən] n. 废除，废止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + ol (生长) + -ition (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树，"离开(ab-)"了它的"生长(ol)"环境，
    <tspan x="50" dy="25">象征着某种制度或习惯被"废除(abolition)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The abolition of slavery was a significant milestone in history.
  </text>
  <text x="50" y="310" class="content">
    废除奴隶制是历史上一个重要的里程碑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="30" y2="80" class="image" />
    <line x1="50" y1="50" x2="70" y2="80" class="image" />
    <line x1="50" y1="50" x2="20" y2="100" class="image" />
    <line x1="50" y1="50" x2="80" y2="100" class="image" />
    <!-- Ground -->
    <line x1="0" y1="150" x2="100" y2="150" class="image" />
    <!-- Broken chain -->
    <line x1="10" y1="160" x2="40" y2="190" class="image" />
    <line x1="40" y1="190" x2="70" y2="160" class="image" />
    <line x1="70" y1="160" x2="100" y2="190" class="image" />
  </g>
</svg>