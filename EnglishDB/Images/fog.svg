<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fog { fill: #CCCCCC; opacity: 0.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fog</text>
  <text x="50" y="120" class="subtitle">[fɒɡ] n. 雾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fog (雾)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片浓雾笼罩着整个城市，"雾(fog)"
    <tspan x="50" dy="25">让一切都变得模糊不清，仿佛置身于梦境中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fog was so thick that we couldn't see the road ahead.
  </text>
  <text x="50" y="310" class="content">
    雾太浓了，我们看不清前面的路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fog -->
    <rect x="0" y="0" width="350" height="200" class="fog" />
    <!-- City skyline -->
    <line x1="50" y1="180" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="350" y2="180" class="image" />
  </g>
</svg>