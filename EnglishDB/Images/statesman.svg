<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">statesman</text>
  <text x="50" y="120" class="subtitle">[ˈsteɪtsmən] n. 政治家，国务活动家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> state (国家) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着西装的"国家之人(state-man)"，
    <tspan x="50" dy="25">站在讲台上，为国家的发展和人民的福祉发表演讲。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The statesman proposed a new economic policy.
  </text>
  <text x="50" y="310" class="content">
    这位政治家提出了一项新的经济政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Podium -->
    <rect x="100" y="150" width="200" height="50" class="image" />
    <!-- Statesman -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="170" y2="180" class="image" />
    <line x1="200" y1="150" x2="230" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M250,70 Q300,50 350,70 Q300,90 250,70" class="image" />
    <text x="260" y="75" class="content">Speech</text>
  </g>
</svg>