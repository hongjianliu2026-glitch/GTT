<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tack</text>
  <text x="50" y="120" class="subtitle">[tæk] n. 大头钉，策略；v. 用大头钉固定，采取某种策略</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tack (源自中世纪英语，意为“钉子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的大头钉(tack)，它不仅固定了纸张，
    <tspan x="50" dy="25">还固定了一个策略(tack)，让一切井然有序。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a tack to pin the note on the board.
  </text>
  <text x="50" y="310" class="content">
    她用一个大头钉把便条钉在板上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large tack -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <line x1="50" y1="0" x2="50" y2="100" class="image" />
    <circle cx="50" cy="10" r="10" class="image" />
    <!-- Paper pinned by the tack -->
    <rect x="120" y="20" width="150" height="100" class="image" />
    <line x1="120" y1="20" x2="270" y2="20" class="image" />
    <line x1="120" y1="120" x2="270" y2="120" class="image" />
    <line x1="120" y1="20" x2="120" y2="120" class="image" />
    <line x1="270" y1="20" x2="270" y2="120" class="image" />
    <!-- Strategy arrow -->
    <line x1="200" y1="140" x2="200" y2="200" class="image" />
    <polygon points="190,200 210,200 200,220" class="image" />
  </g>
</svg>