<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">genetically</text>
  <text x="50" y="120" class="subtitle">[dʒəˈnetɪkli] adv. 遗传地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gen- (出生) + etic (形容词后缀) + ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"通过遗传(gen-etic)"
    <tspan x="50" dy="25">的方式，研究生物的特性，这就是遗传学(genetics)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The twins were genetically identical.
  </text>
  <text x="50" y="310" class="content">
    这对双胞胎是遗传上相同的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- DNA Helix -->
    <path d="M50 50 C100 0, 150 0, 200 50" class="image" />
    <path d="M50 100 C100 150, 150 150, 200 100" class="image" />
    <path d="M50 150 C100 200, 150 200, 200 150" class="image" />
    <path d="M50 200 C100 250, 150 250, 200 200" class="image" />
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Microscope -->
    <rect x="250" y="50" width="50" height="100" class="image" />
    <line x1="275" y1="150" x2="275" y2="200" class="image" />
    <line x1="250" y1="200" x2="300" y2="200" class="image" />
  </g>
</svg>