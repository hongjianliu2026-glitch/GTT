<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mosaic</text>
  <text x="50" y="120" class="subtitle">[moʊˈzeɪɪk] n. 马赛克，镶嵌工艺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mosai (来自希腊语，意为“镶嵌工艺”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在墙上，用各种颜色的小块瓷砖
    <tspan x="50" dy="25">“镶嵌(mosaic)”出一幅美丽的图案。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The church's floor is covered with a beautiful mosaic.
  </text>
  <text x="50" y="310" class="content">
    教堂的地板覆盖着一幅美丽的马赛克。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mosaic background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tiles -->
    <rect x="50" y="20" width="50" height="50" class="image" fill="#FFD700" />
    <rect x="110" y="20" width="50" height="50" class="image" fill="#008000" />
    <rect x="170" y="20" width="50" height="50" class="image" fill="#0000FF" />
    <rect x="230" y="20" width="50" height="50" class="image" fill="#FF0000" />
    <rect x="50" y="80" width="50" height="50" class="image" fill="#800080" />
    <rect x="110" y="80" width="50" height="50" class="image" fill="#FFFF00" />
    <rect x="170" y="80" width="50" height="50" class="image" fill="#00FFFF" />
    <rect x="230" y="80" width="50" height="50" class="image" fill="#FFA500" />
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>