<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">masturbation</text>
  <text x="50" y="120" class="subtitle">[ˌmæstərˈbeɪʃn] n. 手淫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mastur- (手) + bat (打) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手在"打(bat)"自己，这就是"手淫(masturbation)"的夸张画面。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He admitted to having a problem with excessive masturbation.
  </text>
  <text x="50" y="310" class="content">
    他承认自己有过度手淫的问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Fist -->
    <rect x="30" y="180" width="40" height="20" class="image" />
    <!-- Motion lines -->
    <line x1="50" y1="130" x2="50" y2="160" class="image" stroke-dasharray="5,5" />
    <line x1="50" y1="160" x2="50" y2="130" class="image" stroke-dasharray="5,5" />
  </g>
</svg>