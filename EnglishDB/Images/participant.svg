<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">participant</text>
  <text x="50" y="120" class="subtitle">[pɑːrˈtɪsɪpənt] n. 参与者，参加者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> parti (部分) + cip (拿) + ant (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个会议室里，"拿(cip)"着"部分(parti)"
    <tspan x="50" dy="25">任务的人，他们就是参与者(participant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> All participants were given a certificate of appreciation.
  </text>
  <text x="50" y="310" class="content">
    所有参与者都获得了一张感谢证书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Participants -->
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="140" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="260" cy="100" r="15" class="image" />
    <!-- Hands holding tasks -->
    <line x1="80" y1="115" x2="80" y2="150" class="image" />
    <line x1="140" y1="115" x2="140" y2="150" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="260" y1="115" x2="260" y2="150" class="image" />
    <line x1="80" y1="150" x2="60" y2="180" class="image" />
    <line x1="140" y1="150" x2="120" y2="180" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="260" y1="150" x2="240" y2="180" class="image" />
  </g>
</svg>