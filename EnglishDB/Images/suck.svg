<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suck</text>
  <text x="50" y="120" class="subtitle">[sʌk] v. 吸，吮，吸取</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "sucken"，意为"吸吮"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个婴儿在"吸吮(suck)"奶瓶，
    <tspan x="50" dy="25">奶瓶里的奶被吸得一滴不剩，画面夸张又让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby was sucking on a bottle.
  </text>
  <text x="50" y="310" class="content">
    婴儿正在吸吮奶瓶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baby -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />

    <!-- Bottle -->
    <rect x="100" y="80" width="50" height="100" class="image" />
    <line x1="125" y1="80" x2="125" y2="50" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="100" y1="140" x2="150" y2="140" class="image" />
    <line x1="100" y1="160" x2="150" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="180" class="image" />
  </g>
</svg>