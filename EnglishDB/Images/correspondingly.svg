<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">correspondingly</text>
  <text x="50" y="120" class="subtitle">[ˌkɔːrəˈspɑːndɪŋli] adv. 相应地，对应地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cor- (共同) + respond (回应) + -ing (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在对话，一个人说了一句话，另一个人"共同回应(cor-respond)"，
    <tspan x="50" dy="25">并且他们的回应是"相应地(correspondingly)"，就像镜子里的映像一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The weather became colder, and correspondingly, people started wearing more clothes.
  </text>
  <text x="50" y="310" class="content">
    天气变冷了，相应地，人们开始穿更多的衣服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- Person 1 -->
    <circle cx="100" cy="50" r="20" class="image" />
    <line x1="100" y1="70" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="150" class="image" />
    <line x1="100" y1="90" x2="140" y2="80" class="image" />
    <!-- Person 2 (mirror image) -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <line x1="250" y1="90" x2="210" y2="80" class="image" />
  </g>
</svg>