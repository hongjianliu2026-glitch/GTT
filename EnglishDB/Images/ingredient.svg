<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ingredient</text>
  <text x="50" y="120" class="subtitle">[ɪnˈɡriːdiənt] n. 成分，原料</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + grad (走) + -ient (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"走进(in-)"
    <tspan x="50" dy="25">食材堆(grad)，挑选出各种原料(ingredient)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The main ingredient in this dish is chicken.
  </text>
  <text x="50" y="310" class="content">
    这道菜的主要原料是鸡肉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kitchen counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Ingredients -->
    <rect x="70" y="20" width="50" height="50" class="image" />
    <rect x="140" y="20" width="50" height="50" class="image" />
    <rect x="210" y="20" width="50" height="50" class="image" />
    <rect x="280" y="20" width="50" height="50" class="image" />
    <!-- Labels -->
    <text x="75" y="55" class="content">鸡</text>
    <text x="145" y="55" class="content">菜</text>
    <text x="215" y="55" class="content">盐</text>
    <text x="285" y="55" class="content">油</text>
  </g>
</svg>