<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coded</text>
  <text x="50" y="120" class="subtitle">[ˈkoʊdɪd] adj. 编码的，加密的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> code (代码) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的保险箱，上面布满了复杂的"代码(code)"，
    <tspan x="50" dy="25">只有输入正确的编码(coded)才能打开它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The message was coded to prevent unauthorized access.
  </text>
  <text x="50" y="310" class="content">
    这条信息被加密以防止未经授权的访问。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Safe -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Code lines -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Lock -->
    <circle cx="175" cy="180" r="15" class="image" />
    <line x1="175" y1="195" x2="175" y2="200" class="image" />
  </g>
</svg>