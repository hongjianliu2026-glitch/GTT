<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acquired</text>
  <text x="50" y="120" class="subtitle">[əˈkwaɪərd] adj. 获得的，后天习得的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + quir (寻求) + ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在"不断寻求(ac-quir)"知识，最终"获得(acquired)"了丰富的学识。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has acquired a deep understanding of the subject.
  </text>
  <text x="50" y="310" class="content">
    她已经获得了对该主题的深刻理解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person seeking knowledge -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Books -->
    <rect x="100" y="80" width="50" height="70" class="image" />
    <rect x="160" y="80" width="50" height="70" class="image" />
    <rect x="220" y="80" width="50" height="70" class="image" />
    <!-- Lightbulb -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="180" class="image" />
  </g>
</svg>