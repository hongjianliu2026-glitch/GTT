<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uh</text>
  <text x="50" y="120" class="subtitle">[ʌ] int. 嗯，呃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无特定词根，为口语中的填充词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考时，嘴里不停地说"嗯(uh)"，
    <tspan x="50" dy="25">这个声音就像是一个思考的标志。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Uh, let me think about it for a moment.
  </text>
  <text x="50" y="310" class="content">
    呃，让我想一想。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thinking bubble -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="70" y2="230" class="image" />
    <line x1="100" y1="200" x2="130" y2="230" class="image" />
    <!-- Mouth saying "uh" -->
    <path d="M100,250 Q120,270 100,290 Q80,270 100,250" class="image" />
    <text x="90" y="280" class="content" style="font-size: 24px;">uh</text>
  </g>
</svg>