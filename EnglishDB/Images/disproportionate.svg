<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disproportionate</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsprəˈpɔːrʃənət] adj. 不成比例的，不相称的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + proportion (比例) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的苹果和一个微小的蚂蚁，"不成比例(dis-proportionate)"
    <tspan x="50" dy="25">的对比让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The punishment was disproportionate to the crime.
  </text>
  <text x="50" y="310" class="content">
    这个惩罚与罪行不相称。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant apple -->
    <circle cx="100" cy="100" r="80" class="image" fill="#FF4500" />
    <!-- Tiny ant -->
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
    <line x1="220" y1="120" x2="240" y2="100" class="image" />
    <line x1="220" y1="120" x2="220" y2="140" class="image" />
    <line x1="220" y1="140" x2="200" y2="160" class="image" />
    <line x1="220" y1="140" x2="240" y2="160" class="image" />
  </g>
</svg>