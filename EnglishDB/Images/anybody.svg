<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anybody</text>
  <text x="50" y="120" class="subtitle">[ˈɛnɪˌbɑdi] pron. 任何人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> any (任何) + body (身体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的身体(body)，上面贴满了各种标签，每个标签上都写着"任何(any)"，
    <tspan x="50" dy="25">表示这个身体可以代表任何人(anybody)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Did anybody see the movie last night?
  </text>
  <text x="50" y="310" class="content">
    昨晚有人看过这部电影吗？
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant body -->
    <circle cx="150" cy="100" r="80" class="image" />
    <line x1="150" y1="180" x2="150" y2="300" class="image" />
    <line x1="150" y1="300" x2="100" y2="400" class="image" />
    <line x1="150" y1="300" x2="200" y2="400" class="image" />
    <line x1="150" y1="200" x2="100" y2="250" class="image" />
    <line x1="150" y1="200" x2="200" y2="250" class="image" />

    <!-- Labels -->
    <rect x="50" y="50" width="50" height="20" class="image" />
    <rect x="100" y="50" width="50" height="20" class="image" />
    <rect x="150" y="50" width="50" height="20" class="image" />
    <rect x="200" y="50" width="50" height="20" class="image" />
    <rect x="250" y="50" width="50" height="20" class="image" />

    <!-- Text on labels -->
    <text x="55" y="65" class="content">any</text>
    <text x="105" y="65" class="content">any</text>
    <text x="155" y="65" class="content">any</text>
    <text x="205" y="65" class="content">any</text>
    <text x="255" y="65" class="content">any</text>
  </g>
</svg>