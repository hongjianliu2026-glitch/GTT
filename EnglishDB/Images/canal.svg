<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">canal</text>
  <text x="50" y="120" class="subtitle">[kəˈnæl] n. 运河，沟渠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> can (能) + -al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的"能(can)"力之河，它"能(can)"
    <tspan x="50" dy="25">够运输货物和人们，这就是运河(canal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The canal connects two major rivers.
  </text>
  <text x="50" y="310" class="content">
    这条运河连接了两条主要河流。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canal -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Water -->
    <rect x="10" y="10" width="330" height="80" fill="#3498DB" />
    <!-- Boat -->
    <rect x="150" y="20" width="50" height="30" fill="#F39C12" />
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <polygon points="175,0 185,10 165,10" fill="#F39C12" />
  </g>
</svg>