<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">herb</text>
  <text x="50" y="120" class="subtitle">[hɜːrb] n. 草本植物，药草</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> herb (源自拉丁语 herba，意为“草”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片绿色的草地上，长满了各种药草(herb)，
    <tspan x="50" dy="25">它们散发着自然的香气，仿佛在治愈大地的每一寸肌肤。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She uses herbs to make tea for her family.
  </text>
  <text x="50" y="310" class="content">
    她用草药为家人泡茶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Grass -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <line x1="200" y1="20" x2="200" y2="100" class="image" />
    <line x1="250" y1="20" x2="250" y2="100" class="image" />
    <line x1="300" y1="20" x2="300" y2="100" class="image" />
    <!-- Leaves -->
    <polygon points="50,100 30,130 70,130" class="leaf" />
    <polygon points="100,100 80,130 120,130" class="leaf" />
    <polygon points="150,100 130,130 170,130" class="leaf" />
    <polygon points="200,100 180,130 220,130" class="leaf" />
    <polygon points="250,100 230,130 270,130" class="leaf" />
    <polygon points="300,100 280,130 320,130" class="leaf" />
  </g>
</svg>