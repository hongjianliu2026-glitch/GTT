<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twine</text>
  <text x="50" y="120" class="subtitle">[twaɪn] n. 细绳，麻线；v. 缠绕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twi- (双) + -ne (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根细绳"双线缠绕(twi-ne)"，
    <tspan x="50" dy="25">形成一个复杂的结，这就是twine的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used twine to tie up the package.
  </text>
  <text x="50" y="310" class="content">
    她用细绳把包裹捆起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Twine -->
    <path d="M50,50 C60,30 100,30 110,50 S150,70 160,50" class="image" />
    <path d="M50,100 C60,80 100,80 110,100 S150,120 160,100" class="image" />
    <path d="M50,150 C60,130 100,130 110,150 S150,170 160,150" class="image" />
    <!-- Knot -->
    <circle cx="105" cy="100" r="10" class="image" />
  </g>
</svg>