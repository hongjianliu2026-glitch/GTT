<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">catapult</text>
  <text x="50" y="120" class="subtitle">[ˈkætəpʌlt] n. 弹弓，投石器；v. 弹射，猛投</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cata- (向下) + pult (投掷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的弹弓，"向下投掷(cata-pult)"
    <tspan x="50" dy="25">一块巨石，瞬间将敌人击溃。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The catapult launched the stone over the castle walls.
  </text>
  <text x="50" y="310" class="content">
    投石器将石头投掷过城堡的城墙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Catapult -->
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <line x1="100" y1="0" x2="100" y2="100" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <!-- Stone -->
    <circle cx="100" cy="150" r="20" class="image" />
  </g>
</svg>