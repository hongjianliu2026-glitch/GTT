<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unilateral</text>
  <text x="50" y="120" class="subtitle">[ˌjuːnɪˈlætərəl] adj. 单方面的，单边的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (单一) + lateral (侧面的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一条直线上，"单一侧面的(uni-lateral)"
    <tspan x="50" dy="25">行动，就像他只用一只脚走路，这就是单方面的(unilateral)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The decision was made unilaterally by the CEO.
  </text>
  <text x="50" y="310" class="content">
    这个决定是由CEO单方面做出的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Straight line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person standing on one foot -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="155" y2="150" class="image" />
    <line x1="175" y1="120" x2="195" y2="150" class="image" />
    <line x1="175" y1="90" x2="205" y2="80" class="image" />
    <line x1="175" y1="90" x2="145" y2="80" class="image" />
  </g>
</svg>