<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knocking</text>
  <text x="50" y="120" class="subtitle">[ˈnɒkɪŋ] v. 敲击，敲门</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> knock (敲击) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个顽皮的小孩在不停地"敲击(knock)"
    <tspan x="50" dy="25">一扇门，发出持续的敲门声(knocking)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I heard someone knocking at the door.
  </text>
  <text x="50" y="310" class="content">
    我听到有人在敲门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Door handle -->
    <circle cx="180" cy="150" r="10" class="image" />
    <!-- Knocking hand -->
    <line x1="220" y1="140" x2="250" y2="140" class="image" />
    <line x1="250" y1="140" x2="240" y2="130" class="image" />
    <line x1="250" y1="140" x2="240" y2="150" class="image" />
  </g>
</svg>