<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">astonishment</text>
  <text x="50" y="120" class="subtitle">[əˈstɒnɪʃmənt] n. 惊讶，惊愕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + ston (惊奇) + -ish (动词后缀) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人看到一只巨大的猫头鹰从天而降，"惊奇(ston)"得目瞪口呆，
    <tspan x="50" dy="25">这种强烈的惊讶(astonishment)让人难以置信。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His sudden appearance caused astonishment among the crowd.
  </text>
  <text x="50" y="310" class="content">
    他的突然出现让众人感到惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with open mouth -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <line x1="50" y1="150" x2="10" y2="140" class="image" />
    <line x1="50" y1="130" x2="30" y2="120" class="image" />
    <line x1="50" y1="130" x2="70" y2="120" class="image" />
    <line x1="50" y1="130" x2="50" y2="140" class="image" />

    <!-- Owl -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="230" y1="90" x2="270" y2="90" class="image" />
    <line x1="240" y1="80" x2="260" y2="80" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
    <line x1="250" y1="150" x2="290" y2="140" class="image" />
    <line x1="250" y1="150" x2="210" y2="140" class="image" />
  </g>
</svg>