<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brand</text>
  <text x="50" y="120" class="subtitle">[brænd] n. 品牌，烙印；v. 打烙印，铭刻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bran- (燃烧) + d (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的铁匠，用燃烧的铁块在牛身上"烙印(brand)"，
    <tspan x="50" dy="25">这个烙印就成了牛的标识，也就是品牌(brand)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's brand is well-known worldwide.
  </text>
  <text x="50" y="310" class="content">
    这家公司的品牌在全球都很有名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Iron brand -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <line x1="10" y1="10" x2="90" y2="10" class="image" />
    <line x1="10" y1="20" x2="90" y2="20" class="image" />
    <line x1="10" y1="30" x2="90" y2="30" class="image" />
    <line x1="10" y1="40" x2="90" y2="40" class="image" />
    <!-- Cow -->
    <circle cx="200" cy="25" r="20" class="image" />
    <line x1="200" y1="45" x2="200" y2="100" class="image" />
    <line x1="200" y1="70" x2="180" y2="50" class="image" />
    <line x1="200" y1="70" x2="220" y2="50" class="image" />
    <line x1="200" y1="100" x2="180" y2="120" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
    <!-- Brand mark on cow -->
    <text x="190" y="90" class="content" style="font-size: 24px;">B</text>
  </g>
</svg>