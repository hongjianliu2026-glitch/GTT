<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">amusement</text>
  <text x="50" y="120" class="subtitle">[əˈmjuːzmənt] n. 娱乐，消遣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + muse (沉思) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公园里，"加强沉思(a-muse)"
    <tspan x="50" dy="25">通过玩旋转木马，这种活动带来了极大的娱乐(amusement)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The amusement park was filled with laughter and joy.
  </text>
  <text x="50" y="310" class="content">
    游乐园里充满了欢笑和快乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Park -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Carousel -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="125" y2="180" class="image" />
    <line x1="175" y1="150" x2="225" y2="180" class="image" />
    <!-- Person -->
    <circle cx="175" cy="50" r="15" class="image" />
    <line x1="175" y1="65" x2="175" y2="100" class="image" />
    <line x1="175" y1="80" x2="150" y2="70" class="image" />
    <line x1="175" y1="80" x2="200" y2="70" class="image" />
  </g>
</svg>