<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evolutionary</text>
  <text x="50" y="120" class="subtitle">[ˌɛvəˈluʃəˌnɛri] adj. 进化的，发展的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + volut (转) + -ion (名词后缀) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个生物从单细胞逐渐"转出(e-volut)"
    <tspan x="50" dy="25">成为复杂的生物，这个过程就是进化的(evolutionary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The evolutionary process of the species took millions of years.
  </text>
  <text x="50" y="310" class="content">
    这个物种的进化过程花费了数百万年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Single cell organism -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Multi-cell organism -->
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="170" cy="100" r="15" class="image" />
    <circle cx="190" cy="100" r="15" class="image" />
    <!-- Complex organism -->
    <circle cx="250" cy="100" r="25" class="image" />
    <line x1="250" y1="125" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
    <line x1="250" y1="130" x2="220" y2="120" class="image" />
    <!-- Arrows -->
    <line x1="80" y1="100" x2="140" y2="100" class="image" />
    <line x1="140" y1="100" x2="240" y2="100" class="image" />
    <polygon points="240,100 230,95 230,105" class="image" />
  </g>
</svg>