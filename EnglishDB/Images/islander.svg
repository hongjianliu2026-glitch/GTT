<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">islander</text>
  <text x="50" y="120" class="subtitle">[ˈaɪləndər] n. 岛民</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> island (岛) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个岛民(islander)，他站在一个
    <tspan x="50" dy="25">巨大的岛屿上，周围是广阔的海洋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The islander shared stories of his homeland.
  </text>
  <text x="50" y="310" class="content">
    岛民分享了他家乡的故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Island -->
    <circle cx="150" cy="100" r="80" class="image" fill="#2ECC71" />
    <!-- Sea -->
    <rect x="0" y="180" width="300" height="100" class="image" fill="#3498DB" />
    <!-- Islander -->
    <circle cx="150" cy="100" r="15" class="image" fill="#F1C40F" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
  </g>
</svg>