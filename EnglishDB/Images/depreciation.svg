<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">depreciation</text>
  <text x="50" y="120" class="subtitle">[dɪˌpriʃiˈeɪʃən] n. 贬值，折旧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + preci (价值) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆新车，随着时间推移，"价值逐渐下降(de-preciation)"，
    <tspan x="50" dy="25">就像它的外观和性能都在慢慢变差。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The depreciation of the car was faster than expected.
  </text>
  <text x="50" y="310" class="content">
    这辆车的贬值速度比预期的要快。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Depreciation arrow -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <polygon points="170,20 180,20 175,30" class="image" />
    <polygon points="170,180 180,180 175,170" class="image" />
    <!-- Value decrease -->
    <line x1="100" y1="50" x2="250" y2="50" class="image" />
    <line x1="100" y1="80" x2="220" y2="80" class="image" />
    <line x1="100" y1="110" x2="240" y2="110" class="image" />
    <line x1="100" y1="140" x2="210" y2="140" class="image" />
    <!-- Car details -->
    <circle cx="70" cy="100" r="15" class="image" />
    <circle cx="280" cy="100" r="15" class="image" />
    <line x1="70" y1="115" x2="70" y2="150" class="image" />
    <line x1="280" y1="115" x2="280" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="280" y1="150" x2="300" y2="180" class="image" />
    <line x1="70" y1="130" x2="100" y2="120" class="image" />
    <line x1="280" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>