<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">launcher</text>
  <text x="50" y="120" class="subtitle">[ˈlɔːntʃər] n. 发射器，启动器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> launch (发射) + -er (表示工具或人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的火箭发射器(launcher)，它"发射(launch)"
    <tspan x="50" dy="25">火箭进入太空，这个工具就是发射器(launcher)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The launcher successfully sent the satellite into orbit.
  </text>
  <text x="50" y="310" class="content">
    发射器成功地将卫星送入轨道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rocket launcher -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rocket -->
    <rect x="150" y="20" width="50" height="160" class="image" />
    <!-- Flame -->
    <polygon points="150,180 200,180 175,200" style="fill:orange;stroke:red;stroke-width:2" />
    <!-- Launcher base -->
    <rect x="100" y="180" width="150" height="20" class="image" />
  </g>
</svg>