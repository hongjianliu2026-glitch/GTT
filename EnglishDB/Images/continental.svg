<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">continental</text>
  <text x="50" y="120" class="subtitle">[ˌkɒntɪˈnentl] adj. 大陆的，洲的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + tinent (土地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广袤的"共同土地(con-tinent)"，
    <tspan x="50" dy="25">这就是我们所说的大陆(continental)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The continental climate is characterized by hot summers and cold winters.
  </text>
  <text x="50" y="310" class="content">
    大陆性气候的特点是夏季炎热，冬季寒冷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Landmass -->
    <path d="M0 100 L100 50 L200 100 L250 150 L200 200 L100 250 L0 200 Z" class="image" />
    <!-- Mountains -->
    <path d="M50 100 L70 50 L90 100 Z M150 100 L170 50 L190 100 Z" class="image" />
    <!-- River -->
    <path d="M100 200 Q150 150, 200 200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="200" x2="50" y2="180" class="image" />
    <line x1="60" y1="200" x2="60" y2="180" class="image" />
    <line x1="70" y1="200" x2="70" y2="180" class="image" />
    <line x1="150" y1="200" x2="150" y2="180" class="image" />
    <line x1="160" y1="200" x2="160" y2="180" class="image" />
    <line x1="170" y1="200" x2="170" y2="180" class="image" />
  </g>
</svg>