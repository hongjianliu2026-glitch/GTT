<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">defibrillator</text>
  <text x="50" y="120" class="subtitle">[ˌdiːfɪˈbrɪleɪtər] n. 除颤器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (去除) + fibr (纤维) + ill (病) + ator (器具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生拿着"去除(de-)纤维(fibr)病(ill)的器具(ator)"，
    <tspan x="50" dy="25">这个器具就是除颤器(defibrillator)，用来恢复心脏的正常跳动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The paramedic used a defibrillator to restart the patient's heart.
  </text>
  <text x="50" y="310" class="content">
    急救人员使用除颤器重启了病人的心脏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Defibrillator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Hand -->
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <!-- Pads -->
    <rect x="120" y="80" width="50" height="50" class="image" />
    <rect x="120" y="150" width="50" height="50" class="image" />
    <!-- Heart -->
    <path d="M200,100 C210,80 240,80 250,100 C260,120 230,120 220,100" class="image" />
    <line x1="220" y1="100" x2="250" y2="100" class="image" />
  </g>
</svg>