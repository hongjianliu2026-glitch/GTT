<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">collateral</text>
  <text x="50" y="120" class="subtitle">[kəˈlætərəl] n. 抵押品，附属物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (一起) + later (边)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个贷款人拿着"一起放在边上(col-later)"的
    <tspan x="50" dy="25">贵重物品作为抵押品(collateral)，确保贷款安全。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bank required collateral for the loan.
  </text>
  <text x="50" y="310" class="content">
    银行要求贷款提供抵押品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Loan agreement -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Banker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Collateral -->
    <rect x="100" y="20" width="100" height="100" class="image" />
    <text x="120" y="70" class="content">贵重物品</text>
    <!-- Loan agreement text -->
    <text x="220" y="70" class="content">贷款协议</text>
    <line x1="220" y1="80" x2="320" y2="80" class="image" />
    <line x1="220" y1="100" x2="320" y2="100" class="image" />
    <line x1="220" y1="120" x2="320" y2="120" class="image" />
  </g>
</svg>