<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sham</text>
  <text x="50" y="120" class="subtitle">[ʃæm] n. 赝品，假冒；v. 假装，欺骗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sham (来自古英语 scam，意为“欺骗”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一个看似昂贵的包包，但实际上是"假冒(sham)"的。
    <tspan x="50" dy="25">他试图欺骗别人，但最终被识破。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The expensive watch turned out to be a sham.
  </text>
  <text x="50" y="310" class="content">
    那块昂贵的手表原来是个赝品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fake bag -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <!-- Person holding the bag -->
    <circle cx="100" cy="180" r="15" class="image" />
    <line x1="100" y1="195" x2="100" y2="230" class="image" />
    <line x1="100" y1="230" x2="80" y2="260" class="image" />
    <line x1="100" y1="230" x2="120" y2="260" class="image" />
    <line x1="100" y1="210" x2="150" y2="200" class="image" />
  </g>
</svg>