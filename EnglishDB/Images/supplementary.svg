<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supplementary</text>
  <text x="50" y="120" class="subtitle">[ˌsʌplɪˈmɛntəri] adj. 补充的，附加的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sup- (在下面) + ple (充满) + ment (名词后缀) + ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个主菜盘子下面(sup-)，"充满(ple)"
    <tspan x="50" dy="25">着额外的配菜，这些配菜就是补充的(supplementary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher provided supplementary materials for the students.
  </text>
  <text x="50" y="310" class="content">
    老师为学生们提供了补充材料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main dish -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Supplementary dish -->
    <rect x="20" y="180" width="300" height="100" class="image" />
    <!-- Arrow -->
    <line x1="175" y1="180" x2="175" y2="150" class="image" />
    <polygon points="170,150 180,150 175,140" class="image" />
    <!-- Text -->
    <text x="150" y="130" class="content" text-anchor="middle">supplementary</text>
  </g>
</svg>