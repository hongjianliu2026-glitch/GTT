<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rescuer</text>
  <text x="50" y="120" class="subtitle">[ˈrɛskjuːər] n. 救援者，救助者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + scue (拯救)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的救援者，"再次拯救(re-scue)"
    <tspan x="50" dy="25">被困在危险中的人，他就是救援者(rescuer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rescuer saved the child from the burning building.
  </text>
  <text x="50" y="310" class="content">
    救援者从燃烧的建筑中救出了孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rescue scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rescuer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Victim -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <!-- Rescue action -->
    <line x1="50" y1="180" x2="250" y2="150" class="image" />
  </g>
</svg>