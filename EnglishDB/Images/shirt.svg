<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shirt</text>
  <text x="50" y="120" class="subtitle">[ʃɜːrt] n. 衬衫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "shirte"，与古英语 "scyrte" 相关，意为“衣服”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着衬衫的人，衬衫(shirt)
    <tspan x="50" dy="25">紧紧贴在身上，仿佛是第二层皮肤。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a crisp white shirt to the interview.
  </text>
  <text x="50" y="310" class="content">
    他穿着一件笔挺的白衬衫去面试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shirt -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Collar -->
    <rect x="120" y="10" width="110" height="20" class="image" />
    <!-- Sleeves -->
    <rect x="50" y="20" width="30" height="160" class="image" />
    <rect x="270" y="20" width="30" height="160" class="image" />
    <!-- Buttons -->
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="120" cy="100" r="5" class="image" />
    <circle cx="140" cy="100" r="5" class="image" />
    <circle cx="160" cy="100" r="5" class="image" />
    <circle cx="180" cy="100" r="5" class="image" />
  </g>
</svg>