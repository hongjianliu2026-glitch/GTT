<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anyway</text>
  <text x="50" y="120" class="subtitle">[ˈeniweɪ] adv. 无论如何，总之</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> any (任何) + way (方式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对各种选择时，"无论(any)"
    <tspan x="50" dy="25">选择哪种方式(way)，最终都能达到目的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Anyway, we managed to finish the project on time.
  </text>
  <text x="50" y="310" class="content">
    总之，我们按时完成了项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paths representing different ways -->
    <line x1="0" y1="0" x2="150" y2="150" class="image" />
    <line x1="0" y1="0" x2="150" y2="50" class="image" />
    <line x1="0" y1="0" x2="50" y2="150" class="image" />
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <!-- Person at the center -->
    <circle cx="0" cy="0" r="15" class="image" />
    <line x1="0" y1="15" x2="0" y2="50" class="image" />
    <line x1="0" y1="50" x2="-20" y2="80" class="image" />
    <line x1="0" y1="50" x2="20" y2="80" class="image" />
    <line x1="0" y1="30" x2="30" y2="20" class="image" />
  </g>
</svg>