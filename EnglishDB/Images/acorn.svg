<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acorn</text>
  <text x="50" y="120" class="subtitle">[ˈeɪkɔːrn] n. 橡子，橡果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (强调) + corn (角)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵巨大的橡树，"强调(a-)"
    <tspan x="50" dy="25">它的每一个"角(corn)"都长满了橡子(acorn)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The squirrel collected acorns for the winter.
  </text>
  <text x="50" y="310" class="content">
    松鼠为冬天收集橡子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Oak tree -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Acorns -->
    <circle cx="120" cy="80" r="10" class="image" />
    <circle cx="230" cy="90" r="10" class="image" />
    <circle cx="175" cy="50" r="10" class="image" />
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="200" cy="130" r="10" class="image" />
  </g>
</svg>