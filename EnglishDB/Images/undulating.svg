<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undulating</text>
  <text x="50" y="120" class="subtitle">[ˈʌndjəleɪtɪŋ] adj. 起伏的，波动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (向上) + du- (二) + late (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片起伏的波浪，"向上拉(un-du-late)"
    <tspan x="50" dy="25">形成两个波峰，这就是起伏的(undulating)景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The undulating hills were covered in golden wheat.
  </text>
  <text x="50" y="310" class="content">
    起伏的山丘上覆盖着金黄的麦田。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Waves -->
    <path d="M0 100 Q50 50, 100 100 T200 100 T300 100 T400 100 T500 100 T600 100 T700 100" class="image" />
    <path d="M0 150 Q50 200, 100 150 T200 150 T300 150 T400 150 T500 150 T600 150 T700 150" class="image" />
    <path d="M0 200 Q50 150, 100 200 T200 200 T300 200 T400 200 T500 200 T600 200 T700 200" class="image" />
  </g>
</svg>