<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trendy</text>
  <text x="50" y="120" class="subtitle">[ˈtrɛndi] adj. 时髦的，流行的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trend (趋势) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时尚达人穿着最流行的衣服，"跟随(trend)"
    <tspan x="50" dy="25">潮流，成为众人瞩目的焦点，这就是时髦的(trendy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always wears trendy clothes to parties.
  </text>
  <text x="50" y="310" class="content">
    她总是穿着时髦的衣服去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fashionable person -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Right leg -->
    <!-- Trendy clothes -->
    <rect x="20" y="130" width="60" height="50" class="image" /> <!-- Shirt -->
    <rect x="30" y="180" width="40" height="40" class="image" /> <!-- Pants -->
    <!-- Trend symbol -->
    <path d="M10,50 Q50,10 90,50 T170,50" class="image" /> <!-- Trend line -->
    <circle cx="50" cy="50" r="10" class="image" /> <!-- Trend dot -->
    <circle cx="130" cy="50" r="10" class="image" /> <!-- Trend dot -->
  </g>
</svg>