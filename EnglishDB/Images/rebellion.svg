<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rebellion</text>
  <text x="50" y="120" class="subtitle">[rɪˈbɛljən] n. 叛乱，反抗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (反) + bell (战争) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人举着旗帜，"反(re-)"对统治者，"战争(bell)"
    <tspan x="50" dy="25">的声音响彻云霄，这就是叛乱(rebellion)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rebellion was quickly crushed by the government.
  </text>
  <text x="50" y="310" class="content">
    叛乱很快被政府镇压了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flag -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <polygon points="0,0 100,0 50,150" class="image" />
    <!-- People -->
    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="180" y2="70" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="200" y1="80" x2="230" y2="70" class="image" />
  </g>
</svg>