<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">malnutrition</text>
  <text x="50" y="120" class="subtitle">[ˌmælnjʊˈtrɪʃən] n. 营养不良</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mal- (坏) + nutrition (营养)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个瘦弱的孩子，"坏的营养(mal-nutrition)"
    <tspan x="50" dy="25">导致他无法健康成长，这就是营养不良(malnutrition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The widespread malnutrition in the region is alarming.
  </text>
  <text x="50" y="310" class="content">
    该地区普遍存在的营养不良现象令人担忧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thin child -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="180" class="image" />
    <line x1="50" y1="160" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />

    <!-- Starving face -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="70" cy="90" r="5" class="image" />
    <line x1="50" y1="110" x2="70" y2="110" class="image" />

    <!-- Food bowl -->
    <rect x="100" y="150" width="100" height="50" class="image" />
    <line x1="120" y1="160" x2="180" y2="160" class="image" />
    <line x1="120" y1="170" x2="180" y2="170" class="image" />
    <line x1="120" y1="180" x2="180" y2="180" class="image" />
  </g>
</svg>