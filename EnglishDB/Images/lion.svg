<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lion</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪən] n. 狮子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "leo"，意为狮子
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只威猛的狮子在草原上咆哮，
    <tspan x="50" dy="25">它的鬃毛随风飘扬，展现出王者的风范。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lion roared loudly in the jungle.
  </text>
  <text x="50" y="310" class="content">
    狮子在丛林中大声咆哮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Lion's head -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Lion's mane -->
    <circle cx="70" cy="80" r="20" class="image" fill="#D35400" />
    <circle cx="130" cy="80" r="20" class="image" fill="#D35400" />
    <circle cx="50" cy="100" r="20" class="image" fill="#D35400" />
    <circle cx="150" cy="100" r="20" class="image" fill="#D35400" />
    <!-- Lion's eyes -->
    <circle cx="85" cy="90" r="5" class="image" fill="#000000" />
    <circle cx="115" cy="90" r="5" class="image" fill="#000000" />
    <!-- Lion's nose -->
    <circle cx="100" cy="110" r="10" class="image" fill="#000000" />
    <!-- Lion's mouth -->
    <line x1="90" y1="120" x2="110" y2="120" class="image" />
  </g>
</svg>