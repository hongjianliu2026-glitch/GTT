<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bombing</text>
  <text x="50" y="120" class="subtitle">[ˈbɒmɪŋ] n. 轰炸，投弹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bomb (炸弹) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机在空中，"投下(bomb-ing)"
    <tspan x="50" dy="25">无数炸弹，地面瞬间被炸得尘土飞扬。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city suffered heavy bombing during the war.
  </text>
  <text x="50" y="310" class="content">
    这座城市在战争期间遭受了猛烈的轰炸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airplane -->
    <line x1="0" y1="0" x2="150" y2="0" class="image" />
    <line x1="150" y1="0" x2="140" y2="20" class="image" />
    <line x1="150" y1="0" x2="140" y2="-20" class="image" />
    <line x1="140" y1="20" x2="140" y2="-20" class="image" />
    <!-- Bombs -->
    <circle cx="160" cy="0" r="10" class="image" />
    <circle cx="180" cy="0" r="10" class="image" />
    <circle cx="200" cy="0" r="10" class="image" />
    <!-- Explosion -->
    <circle cx="220" cy="50" r="30" class="image" />
    <circle cx="220" cy="50" r="20" class="image" />
    <circle cx="220" cy="50" r="10" class="image" />
  </g>
</svg>