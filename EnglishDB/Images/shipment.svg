<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shipment</text>
  <text x="50" y="120" class="subtitle">[ˈʃɪpmənt] n. 装运，运送；一批货物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ship (船) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘大船在海上航行，"船(ship)"上装满了货物，
    <tspan x="50" dy="25">这些货物就是"一批装运(shipment)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shipment of electronics arrived on time.
  </text>
  <text x="50" y="310" class="content">
    电子产品的装运按时到达。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 250,100 0,100" class="image" />
    <!-- Cargo -->
    <rect x="70" y="120" width="50" height="50" class="image" />
    <rect x="140" y="120" width="50" height="50" class="image" />
    <rect x="210" y="120" width="50" height="50" class="image" />
    <!-- Waves -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="220" x2="350" y2="220" class="image" />
    <line x1="0" y1="240" x2="350" y2="240" class="image" />
  </g>
</svg>