<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slain</text>
  <text x="50" y="120" class="subtitle">[sleɪn] v. slay的过去分词形式，意为“杀死”</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slay (杀死)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士在战场上，"杀死(slay)"
    <tspan x="50" dy="25">敌人，他的剑下倒下了许多被杀死的(slain)敌人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The knight had slain many foes in battle.
  </text>
  <text x="50" y="310" class="content">
    骑士在战斗中杀死了许多敌人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sword -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="120" y2="80" class="image" />
    <line x1="120" y1="80" x2="140" y2="100" class="image" />
    <line x1="140" y1="100" x2="240" y2="0" class="image" />
    <!-- Slain enemies -->
    <circle cx="50" cy="150" r="20" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="150" cy="150" r="20" class="image" />
    <!-- Blood splatter -->
    <circle cx="50" cy="150" r="5" class="image" fill="#B03A2E" />
    <circle cx="100" cy="150" r="5" class="image" fill="#B03A2E" />
    <circle cx="150" cy="150" r="5" class="image" fill="#B03A2E" />
  </g>
</svg>