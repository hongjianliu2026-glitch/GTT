<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bookkeeping</text>
  <text x="50" y="120" class="subtitle">[ˈbʊkˌkipɪŋ] n. 簿记</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> book (书) + keep (保持) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个会计师在办公室里，"保持(keep)"
    <tspan x="50" dy="25">记录在"书(book)"上，这就是簿记(bookkeeping)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is responsible for the bookkeeping at her company.
  </text>
  <text x="50" y="310" class="content">
    她在公司负责簿记工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Book -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Pen -->
    <line x1="170" y1="100" x2="270" y2="100" class="image" />
    <line x1="270" y1="100" x2="260" y2="90" class="image" />
    <line x1="270" y1="100" x2="260" y2="110" class="image" />
    <!-- Accountant -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="350" y2="120" class="image" />
  </g>
</svg>