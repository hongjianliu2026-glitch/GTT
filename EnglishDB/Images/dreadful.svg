<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dreadful</text>
  <text x="50" y="120" class="subtitle">[ˈdredfəl] adj. 可怕的，糟透的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dread (恐惧) + -ful (充满...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满恐惧(dread)的夜晚，"充满(ful)"
    <tspan x="50" dy="25">恐惧的(dreadful)场景让人毛骨悚然。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The horror movie was dreadful, and I couldn't sleep for nights.
  </text>
  <text x="50" y="310" class="content">
    那部恐怖电影太可怕了，我好几个晚上都没能睡着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Lightning bolt -->
    <line x1="100" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="100" y2="200" class="image" />
    <!-- Scared face -->
    <circle cx="175" cy="250" r="50" class="image" />
    <circle cx="150" cy="235" r="5" class="image" />
    <circle cx="200" cy="235" r="5" class="image" />
    <path d="M150 270 Q175 290 200 270" class="image" />
  </g>
</svg>