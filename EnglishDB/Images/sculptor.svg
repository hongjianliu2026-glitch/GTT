<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sculptor</text>
  <text x="50" y="120" class="subtitle">[ˈskʌlptər] n. 雕塑家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sculpt (雕刻) + -or (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个雕塑家(sculptor)手持凿子，"雕刻(sculpt)"
    <tspan x="50" dy="25">一块大理石，创造出栩栩如生的雕像。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sculptor created a masterpiece from a block of marble.
  </text>
  <text x="50" y="310" class="content">
    这位雕塑家用一块大理石创作了一件杰作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sculptor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Chisel -->
    <line x1="20" y1="150" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="70" y2="130" class="image" />
    <!-- Marble block -->
    <rect x="100" y="80" width="100" height="100" class="image" />
    <!-- Sculpted figure -->
    <circle cx="150" cy="130" r="20" class="image" />
    <line x1="150" y1="150" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="210" class="image" />
    <line x1="150" y1="180" x2="170" y2="210" class="image" />
    <line x1="150" y1="160" x2="180" y2="150" class="image" />
  </g>
</svg>