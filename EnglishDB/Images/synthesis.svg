<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">synthesis</text>
  <text x="50" y="120" class="subtitle">[ˈsɪnθəsɪs] n. 综合，合成</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syn- (一起) + thesis (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家将各种化学物质"一起放置(syn-thesis)"
    <tspan x="50" dy="25">在一个容器中，创造出一种新的化合物，这就是合成(synthesis)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The synthesis of these two compounds produced a new drug.
  </text>
  <text x="50" y="310" class="content">
    这两种化合物的合成产生了一种新药。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Container -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chemical substances -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Scientist -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
    <!-- New compound -->
    <circle cx="250" cy="100" r="25" class="image" />
  </g>
</svg>