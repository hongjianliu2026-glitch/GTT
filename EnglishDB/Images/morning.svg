<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FFC107; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #FFD700; }
      .sky { fill: #87CEEB; }
      .ground { fill: #2E8B57; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">morning</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrnɪŋ] n. 早晨，上午</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> morn (早晨) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个清晨，太阳刚刚升起，"早晨(morn)"
    <tspan x="50" dy="25">的光芒洒在大地上，带来新的一天(morning)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I usually wake up early in the morning.
  </text>
  <text x="50" y="310" class="content">
    我通常在早晨早起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="sky" />
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" class="sun" />
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="ground" />
    <!-- House -->
    <rect x="200" y="100" width="100" height="50" class="image" />
    <rect x="230" y="120" width="40" height="30" class="image" />
    <!-- Tree -->
    <rect x="100" y="100" width="20" height="50" class="image" />
    <circle cx="110" cy="90" r="20" class="image" />
  </g>
</svg>