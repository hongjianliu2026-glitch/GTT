<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ninety</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪnti] n. 九十</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nine (九) + ty (表示“十”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“9”，上面有十个点，每个点代表十，
    <tspan x="50" dy="25">九个点加起来就是九十(ninety)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He turned ninety last month.
  </text>
  <text x="50" y="310" class="content">
    他上个月满九十岁了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number 9 -->
    <text x="0" y="0" font-size="200" font-family="sans-serif" fill="#34495E">9</text>
    <!-- Dots representing tens -->
    <circle cx="100" cy="50" r="10" fill="#E74C3C" />
    <circle cx="120" cy="50" r="10" fill="#E74C3C" />
    <circle cx="140" cy="50" r="10" fill="#E74C3C" />
    <circle cx="160" cy="50" r="10" fill="#E74C3C" />
    <circle cx="180" cy="50" r="10" fill="#E74C3C" />
    <circle cx="200" cy="50" r="10" fill="#E74C3C" />
    <circle cx="220" cy="50" r="10" fill="#E74C3C" />
    <circle cx="240" cy="50" r="10" fill="#E74C3C" />
    <circle cx="260" cy="50" r="10" fill="#E74C3C" />
  </g>
</svg>