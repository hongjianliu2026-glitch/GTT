<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evolving</text>
  <text x="50" y="120" class="subtitle">[ɪˈvɒlvɪŋ] adj. 进化的，发展的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (向外) + volv (卷，转) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个生物从单细胞开始，"向外卷曲(e-volv)"
    <tspan x="50" dy="25">并逐渐进化成复杂的生物，这个过程就是evolving。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The technology is constantly evolving.
  </text>
  <text x="50" y="310" class="content">
    技术在不断发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Single cell -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Evolution stages -->
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="40" class="image" />
    <circle cx="350" cy="100" r="50" class="image" />
    <!-- Arrows -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
    <line x1="270" y1="100" x2="330" y2="100" class="image" />
    <polygon points="330,90 350,100 330,110" class="image" />
  </g>
</svg>