<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .pepper { fill: #FF6347; }
      .tomato { fill: #FF4500; }
      .onion { fill: #EEE8AA; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">salsa</text>
  <text x="50" y="120" class="subtitle">[ˈsɑːlsə] n. 萨尔萨舞，萨尔萨酱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sals (盐) + -a (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满活力的舞池，人们随着"盐味(sals)"
    <tspan x="50" dy="25">浓郁的音乐跳着萨尔萨舞(salsa)，舞池中央摆满了</tspan>
    <tspan x="50" dy="25">用盐调味的萨尔萨酱，让人忍不住想跳舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to dance salsa at the club.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在俱乐部跳萨尔萨舞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dance floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dancers -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Salsa sauce -->
    <circle cx="175" cy="150" r="30" class="image" />
    <!-- Ingredients -->
    <circle cx="150" cy="140" r="10" class="pepper" />
    <circle cx="200" cy="140" r="10" class="tomato" />
    <circle cx="175" cy="160" r="10" class="onion" />
  </g>
</svg>