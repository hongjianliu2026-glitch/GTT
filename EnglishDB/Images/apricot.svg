<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fruit { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">apricot</text>
  <text x="50" y="120" class="subtitle">[ˈeɪprɪkɒt] n. 杏，杏树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aprico- (杏) + -ot (表示“小”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小小的杏子(aprico-ot)，
    <tspan x="50" dy="25">它挂在树上，阳光下闪闪发光，</tspan>
    <tspan x="50" dy="25">就像一颗金色的宝石。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves eating fresh apricots in summer.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在夏天吃新鲜的杏子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <!-- Branches -->
    <line x1="100" y1="50" x2="50" y2="100" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <!-- Apricot -->
    <circle cx="75" cy="125" r="20" class="fruit" />
    <circle cx="125" cy="125" r="20" class="fruit" />
    <circle cx="100" cy="75" r="20" class="fruit" />
  </g>
</svg>