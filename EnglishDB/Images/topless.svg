<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">topless</text>
  <text x="50" y="120" class="subtitle">[ˈtɒpləs] adj. 无顶的，裸露上身的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> top (顶部) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个无顶的露天咖啡馆，阳光直射，顾客们都"无顶(top-less)"
    <tspan x="50" dy="25">地享受着阳光浴，这种场景让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beach was filled with topless sunbathers.
  </text>
  <text x="50" y="310" class="content">
    海滩上挤满了裸露上身的日光浴者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Umbrella -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <!-- Sun -->
    <circle cx="200" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="120" cy="100" r="20" class="image" fill="#E74C3C" />
    <line x1="120" y1="120" x2="120" y2="180" class="image" />
    <line x1="120" y1="150" x2="100" y2="130" class="image" />
    <line x1="120" y1="150" x2="140" y2="130" class="image" />
    <line x1="120" y1="180" x2="100" y2="200" class="image" />
    <line x1="120" y1="180" x2="140" y2="200" class="image" />
  </g>
</svg>