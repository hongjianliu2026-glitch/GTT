<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stylist</text>
  <text x="50" y="120" class="subtitle">[ˈstaɪlɪst] n. 造型师，设计师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> styl (风格) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个造型师拿着剪刀，"塑造(styl)"
    <tspan x="50" dy="25">出独特的风格，这个人就是造型师(stylist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hired a stylist to help her with her new look.
  </text>
  <text x="50" y="310" class="content">
    她雇了一位造型师来帮她打造新形象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scissors -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="50" class="image" />
    <line x1="100" y1="20" x2="100" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="75" y1="50" x2="75" y2="70" class="image" />
    <!-- Hair -->
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="90" x2="100" y2="90" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <!-- Stylist -->
    <circle cx="75" cy="120" r="15" class="image" />
    <line x1="75" y1="135" x2="75" y2="170" class="image" />
    <line x1="75" y1="170" x2="55" y2="200" class="image" />
    <line x1="75" y1="170" x2="95" y2="200" class="image" />
    <line x1="75" y1="150" x2="105" y2="140" class="image" />
  </g>
</svg>