<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flyer</text>
  <text x="50" y="120" class="subtitle">[ˈflaɪər] n. 传单，飞行器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fly (飞) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张传单(flyer)在空中"飞(fly)"舞，
    <tspan x="50" dy="25">吸引人们的目光，就像一个小飞行器(flyer)在空中翱翔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She handed out flyers at the event.
  </text>
  <text x="50" y="310" class="content">
    她在活动中分发传单。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paper flyer -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="50" x2="180" y2="50" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="110" x2="180" y2="110" class="image" />
    <!-- Flying motion -->
    <polyline points="200,75 250,50 300,75 350,50" class="image" />
  </g>
</svg>