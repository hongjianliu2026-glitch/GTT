<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cat { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kitten</text>
  <text x="50" y="120" class="subtitle">[ˈkɪtn] n. 小猫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kit (小) + -en (表示小的后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫(kitten)在草地上玩耍，它小小的身体(kit)
    <tspan x="50" dy="25">和灵活的动作让人忍不住想要抚摸它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She adopted a cute kitten from the shelter.
  </text>
  <text x="50" y="310" class="content">
    她从收容所领养了一只可爱的小猫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#27AE60" />
    <!-- Kitten -->
    <circle cx="100" cy="100" r="30" class="cat" />
    <line x1="100" y1="130" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="70" y2="120" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
  </g>
</svg>