<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sip</text>
  <text x="50" y="120" class="subtitle">[sɪp] v. 小口喝，啜饮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (表示动作) + ip (与液体接触)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在咖啡馆里，"轻轻地接触(s-ip)"
    <tspan x="50" dy="25">杯子边缘，小口啜饮(sip)着咖啡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She took a sip of her tea and smiled.
  </text>
  <text x="50" y="310" class="content">
    她啜了一口茶，微笑了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Liquid -->
    <rect x="10" y="10" width="130" height="80" fill="#85C1E9" />
    <!-- Straw -->
    <line x1="75" y1="100" x2="75" y2="150" class="image" />
    <!-- Lips -->
    <circle cx="75" cy="160" r="10" fill="#F1948A" />
  </g>
</svg>