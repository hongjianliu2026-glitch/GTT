<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cargo</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːrɡoʊ] n. 货物，船货</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> car- (车) + go (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆大卡车，"载着(car-)"
    <tspan x="50" dy="25">满满的货物，"走(go)"在繁忙的公路上，</tspan>
    <tspan x="50" dy="25">这些货物就是"cargo"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship was loaded with cargo from China.
  </text>
  <text x="50" y="310" class="content">
    这艘船载满了来自中国的货物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Truck -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Cargo boxes -->
    <rect x="70" y="40" width="50" height="50" class="image" />
    <rect x="140" y="40" width="50" height="50" class="image" />
    <rect x="210" y="40" width="50" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="80" cy="140" r="20" class="image" />
    <circle cx="270" cy="140" r="20" class="image" />
  </g>
</svg>