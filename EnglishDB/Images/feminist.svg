<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feminist</text>
  <text x="50" y="120" class="subtitle">[ˈfɛmənɪst] n. 女权主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> femin (女性) + -ist (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女性站在讲台上，高举着"女性(femin)"
    <tspan x="50" dy="25">权利的旗帜，她就是一位女权主义者(feminist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a strong feminist who advocates for gender equality.
  </text>
  <text x="50" y="310" class="content">
    她是一位坚定的女权主义者，倡导性别平等。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Woman on stage -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="200" class="image" />
    <line x1="200" y1="150" x2="150" y2="180" class="image" />
    <line x1="200" y1="150" x2="250" y2="180" class="image" />
    <line x1="200" y1="200" x2="150" y2="250" class="image" />
    <line x1="200" y1="200" x2="250" y2="250" class="image" />
    <!-- Stage -->
    <rect x="100" y="250" width="200" height="50" class="image" />
    <!-- Flag -->
    <line x1="200" y1="100" x2="200" y2="50" class="image" />
    <rect x="180" y="50" width="40" height="30" class="image" />
    <text x="185" y="70" class="content" fill="#FFFFFF">女</text>
  </g>
</svg>