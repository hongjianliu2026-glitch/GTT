<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">festivity</text>
  <text x="50" y="120" class="subtitle">[fɛˈstɪvɪti] n. 节日气氛，庆祝活动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fest (节日) + -ivity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满"节日(fest)"气氛的场景，人们欢聚一堂，
    <tspan x="50" dy="25">彩灯闪烁，音乐响起，这就是"节日气氛(festivity)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city was filled with festivity during the New Year's Eve.
  </text>
  <text x="50" y="310" class="content">
    新年夜，城市充满了节日气氛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Party scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Balloons -->
    <circle cx="50" cy="50" r="20" class="image" fill="#FF5733" />
    <circle cx="80" cy="50" r="20" class="image" fill="#33FF57" />
    <circle cx="110" cy="50" r="20" class="image" fill="#3357FF" />
    <!-- Confetti -->
    <line x1="150" y1="20" x2="170" y2="40" class="image" stroke="#FFC300" stroke-width="5" />
    <line x1="180" y1="20" x2="200" y2="40" class="image" stroke="#C70039" stroke-width="5" />
    <line x1="210" y1="20" x2="230" y2="40" class="image" stroke="#581845" stroke-width="5" />
    <!-- People -->
    <circle cx="50" cy="150" r="15" class="image" fill="#34495E" />
    <circle cx="80" cy="150" r="15" class="image" fill="#34495E" />
    <circle cx="110" cy="150" r="15" class="image" fill="#34495E" />
    <!-- Music notes -->
    <path d="M150 150 Q170 130 190 150 T230 150" class="image" stroke="#2ECC71" stroke-width="3" fill="none" />
    <path d="M160 140 Q180 120 200 140 T240 140" class="image" stroke="#2ECC71" stroke-width="3" fill="none" />
  </g>
</svg>