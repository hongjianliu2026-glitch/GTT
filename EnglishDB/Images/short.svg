<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">short</text>
  <text x="50" y="120" class="subtitle">[ʃɔːrt] adj. 短的，矮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shor (短)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个矮小的精灵，"短(short)"得几乎看不见，
    <tspan x="50" dy="25">但它依然快乐地跳跃在草地上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pants are too short for him.
  </text>
  <text x="50" y="310" class="content">
    这条裤子对他来说太短了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Short person -->
    <circle cx="100" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="100" y1="120" x2="100" y2="160" class="image" /> <!-- Body -->
    <line x1="100" y1="160" x2="80" y2="200" class="image" /> <!-- Left leg -->
    <line x1="100" y1="160" x2="120" y2="200" class="image" /> <!-- Right leg -->
    <line x1="100" y1="130" x2="80" y2="150" class="image" /> <!-- Left arm -->
    <line x1="100" y1="130" x2="120" y2="150" class="image" /> <!-- Right arm -->
    <!-- Grass -->
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <line x1="60" y1="190" x2="70" y2="200" class="image" />
    <line x1="80" y1="180" x2="90" y2="200" class="image" />
    <line x1="110" y1="180" x2="120" y2="200" class="image" />
    <line x1="130" y1="190" x2="140" y2="200" class="image" />
  </g>
</svg>