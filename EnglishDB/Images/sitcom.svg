<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sitcom</text>
  <text x="50" y="120" class="subtitle">[ˈsɪtkɒm] n. 情景喜剧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sit (坐) + com (喜剧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群演员坐在(sit)一个客厅里，
    <tspan x="50" dy="25">他们正在表演一出喜剧(com)，这就是情景喜剧(sitcom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sitcom has been a popular form of entertainment for decades.
  </text>
  <text x="50" y="310" class="content">
    情景喜剧几十年来一直是受欢迎的娱乐形式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Living room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sofa -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Actors -->
    <circle cx="100" cy="80" r="15" class="image" />
    <circle cx="150" cy="80" r="15" class="image" />
    <circle cx="200" cy="80" r="15" class="image" />
    <!-- Laughing bubble -->
    <path d="M 100 60 Q 120 40 140 60" class="image" />
    <path d="M 150 60 Q 170 40 190 60" class="image" />
  </g>
</svg>