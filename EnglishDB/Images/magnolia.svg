<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flower { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">magnolia</text>
  <text x="50" y="120" class="subtitle">[mæɡˈnoʊliə] n. 木兰花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> magn- (大) + -olia (花)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵巨大的(magn-)花(olia)，
    <tspan x="50" dy="25">它的花瓣像巨大的手掌一样展开，</tspan>
    <tspan x="50" dy="25">这就是木兰花(magnolia)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden was filled with the sweet scent of magnolias.
  </text>
  <text x="50" y="310" class="content">
    花园里充满了木兰花的甜香。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower petals -->
    <circle cx="100" cy="100" r="50" class="flower" />
    <circle cx="150" cy="100" r="50" class="flower" />
    <circle cx="125" cy="150" r="50" class="flower" />
    <circle cx="100" cy="200" r="50" class="flower" />
    <circle cx="150" cy="200" r="50" class="flower" />
    <!-- Flower center -->
    <circle cx="125" cy="150" r="20" fill="#E67E22" />
  </g>
</svg>