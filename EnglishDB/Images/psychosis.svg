<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">psychosis</text>
  <text x="50" y="120" class="subtitle">[saɪˈkoʊsɪs] n. 精神病，精神错乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> psycho- (心灵) + -osis (病态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心灵(psycho-)被扭曲成病态(-osis)的画面，
    <tspan x="50" dy="25">一个人在精神错乱(psychosis)中迷失了自我。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The patient's psychosis was triggered by severe stress.
  </text>
  <text x="50" y="310" class="content">
    病人的精神病是由严重的压力引发的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Distorted mind -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <!-- Person in distress -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="180" class="image" />
    <line x1="300" y1="150" x2="280" y2="190" class="image" />
    <line x1="300" y1="150" x2="320" y2="190" class="image" />
    <line x1="300" y1="130" x2="330" y2="120" class="image" />
  </g>
</svg>