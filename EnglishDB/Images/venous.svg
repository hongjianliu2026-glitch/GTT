<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .vein { stroke: #8E44AD; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">venous</text>
  <text x="50" y="120" class="subtitle">[ˈviːnəs] adj. 静脉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ven- (来) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的静脉(ven-)像一条河流，"流来(ven)"
    <tspan x="50" dy="25">血液，这就是静脉(venous)的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor checked his venous pressure.
  </text>
  <text x="50" y="310" class="content">
    医生检查了他的静脉压。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vein -->
    <path d="M50,100 Q100,50 150,100 T250,100" class="vein" />
    <path d="M50,150 Q100,100 150,150 T250,150" class="vein" />
    <path d="M50,200 Q100,150 150,200 T250,200" class="vein" />
    <!-- Blood drop -->
    <circle cx="100" cy="100" r="10" fill="#E74C3C" />
    <circle cx="175" cy="150" r="10" fill="#E74C3C" />
    <circle cx="250" cy="200" r="10" fill="#E74C3C" />
  </g>
</svg>