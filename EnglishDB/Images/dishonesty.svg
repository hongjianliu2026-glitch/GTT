<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dishonesty</text>
  <text x="50" y="120" class="subtitle">[dɪsˈɒnɪsti] n. 不诚实，欺骗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + honesty (诚实)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在说谎，"不(dis-)"
    <tspan x="50" dy="25">诚实(honesty)，这就是欺骗(dishonesty)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His dishonesty led to his dismissal.
  </text>
  <text x="50" y="310" class="content">
    他的不诚实导致他被解雇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lying person -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="120" x2="20" y2="110" class="image" />
    <line x1="50" y1="120" x2="80" y2="110" class="image" />
    <!-- Lying mouth -->
    <path d="M30 70 Q50 90 70 70" class="image" />
    <!-- Crossed out honesty -->
    <text x="150" y="100" class="content" style="font-size: 48px;">honesty</text>
    <line x1="130" y1="80" x2="270" y2="120" class="image" style="stroke: #E74C3C; stroke-width: 5;" />
  </g>
</svg>