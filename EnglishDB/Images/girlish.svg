<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">girlish</text>
  <text x="50" y="120" class="subtitle">[ˈɡɜːrlɪʃ] adj. 少女的，少女般的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> girl (女孩) + -ish (表示“具有...的性质”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小女孩穿着粉红色的裙子，头上戴着蝴蝶结，
    <tspan x="50" dy="25">手里拿着一个洋娃娃，这就是“girlish”的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a girlish charm that everyone loves.
  </text>
  <text x="50" y="310" class="content">
    她有一种大家都喜欢的少女魅力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Girl -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Right leg -->
    <!-- Dress -->
    <path d="M20,180 Q50,150 80,180" class="image" />
    <!-- Bow -->
    <path d="M40,80 Q50,60 60,80" class="image" />
    <!-- Doll -->
    <circle cx="150" cy="100" r="20" class="image" /> <!-- Doll head -->
    <line x1="150" y1="120" x2="150" y2="160" class="image" /> <!-- Doll body -->
    <line x1="150" y1="140" x2="130" y2="130" class="image" /> <!-- Doll left arm -->
    <line x1="150" y1="140" x2="170" y2="130" class="image" /> <!-- Doll right arm -->
    <line x1="150" y1="160" x2="130" y2="180" class="image" /> <!-- Doll left leg -->
    <line x1="150" y1="160" x2="170" y2="180" class="image" /> <!-- Doll right leg -->
  </g>
</svg>