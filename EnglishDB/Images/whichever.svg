<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whichever</text>
  <text x="50" y="120" class="subtitle">[wɪtʃˈevər] det. 无论哪个，任何一个</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> which (哪一个) + -ever (无论)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师在展示两个盒子，"无论哪一个(which-ever)"
    <tspan x="50" dy="25">你选择，里面都有惊喜。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You can take whichever book you like.
  </text>
  <text x="50" y="310" class="content">
    你可以拿走你喜欢的任何一本书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two boxes -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="200" y="0" width="150" height="100" class="image" />
    <!-- Question mark -->
    <text x="75" y="60" class="image" font-size="60">?</text>
    <text x="275" y="60" class="image" font-size="60">?</text>
    <!-- Magic wand -->
    <line x1="150" y1="120" x2="150" y2="200" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <!-- Magician -->
    <circle cx="150" cy="220" r="15" class="image" />
    <line x1="150" y1="235" x2="150" y2="270" class="image" />
    <line x1="150" y1="270" x2="130" y2="300" class="image" />
    <line x1="150" y1="270" x2="170" y2="300" class="image" />
    <line x1="150" y1="250" x2="120" y2="240" class="image" />
    <line x1="150" y1="250" x2="180" y2="240" class="image" />
  </g>
</svg>