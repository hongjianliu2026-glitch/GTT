<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">height</text>
  <text x="50" y="120" class="subtitle">[haɪt] n. 高度，身高</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heigh (高) + t (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨人，他的"高度(heigh)"
    <tspan x="50" dy="25">直冲云霄，这就是他的身高(height)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The building's height is 300 meters.
  </text>
  <text x="50" y="310" class="content">
    这座建筑的高度是300米。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tall figure -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <circle cx="100" cy="20" r="15" class="image" />
    <line x1="100" y1="35" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="70" y2="120" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Cloud -->
    <ellipse cx="100" cy="20" rx="30" ry="15" class="image" />
    <ellipse cx="80" cy="30" rx="20" ry="10" class="image" />
    <ellipse cx="120" cy="30" rx="20" ry="10" class="image" />
  </g>
</svg>