<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">digestive</text>
  <text x="50" y="120" class="subtitle">[daɪˈdʒestɪv] adj. 消化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + gest (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的胃，"分开携带(di-gest)"
    <tspan x="50" dy="25">食物，将其分解成更小的部分，这就是消化(digestive)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The digestive system breaks down food into nutrients.
  </text>
  <text x="50" y="310" class="content">
    消化系统将食物分解成营养物质。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stomach -->
    <ellipse cx="175" cy="100" rx="150" ry="100" class="image" />
    <!-- Food -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- Enzymes -->
    <circle cx="75" cy="120" r="10" class="image" />
    <circle cx="145" cy="120" r="10" class="image" />
    <circle cx="215" cy="120" r="10" class="image" />
    <!-- Broken down food -->
    <rect x="50" y="150" width="20" height="20" class="image" />
    <rect x="90" y="150" width="20" height="20" class="image" />
    <rect x="130" y="150" width="20" height="20" class="image" />
    <rect x="170" y="150" width="20" height="20" class="image" />
    <rect x="210" y="150" width="20" height="20" class="image" />
  </g>
</svg>