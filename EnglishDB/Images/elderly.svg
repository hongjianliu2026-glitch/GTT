<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">elderly</text>
  <text x="50" y="120" class="subtitle">[ˈeldərli] adj. 年长的，上了年纪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> elder (年长的) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位"年长的(elder)"老人，拄着拐杖，
    <tspan x="50" dy="25">步履蹒跚地走在公园里，享受着宁静的时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The elderly man was sitting on a bench, enjoying the sunshine.
  </text>
  <text x="50" y="310" class="content">
    那位老人坐在长椅上，享受着阳光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elderly person -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="30" y2="190" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="190" class="image" /> <!-- Right leg -->
    <line x1="40" y1="100" x2="60" y2="100" class="image" /> <!-- Mouth -->
    <line x1="45" y1="90" x2="55" y2="90" class="image" /> <!-- Nose -->
    <line x1="40" y1="80" x2="50" y2="85" class="image" /> <!-- Left eye -->
    <line x1="60" y1="80" x2="50" y2="85" class="image" /> <!-- Right eye -->
    <!-- Cane -->
    <line x1="30" y1="120" x2="10" y2="150" class="image" />
  </g>
</svg>