<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">televise</text>
  <text x="50" y="120" class="subtitle">[ˈtɛlɪvaɪz] v. 电视转播，用电视播放</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tele- (远) + vis (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的电视屏幕，"远距离观看(tele-vis)"
    <tspan x="50" dy="25">的画面被实时转播，这就是电视转播(televise)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concert will be televised live tonight.
  </text>
  <text x="50" y="310" class="content">
    今晚的音乐会将进行现场电视转播。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Television screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Broadcast signal -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <circle cx="175" cy="100" r="10" class="image" />
    <!-- Viewer -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="330" y2="120" class="image" />
  </g>
</svg>