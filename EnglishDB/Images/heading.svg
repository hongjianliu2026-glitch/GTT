<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heading</text>
  <text x="50" y="120" class="subtitle">[ˈhɛdɪŋ] n. 标题，航向</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> head (头) + ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一篇文章的"头部(head)"被放大，变成了一个巨大的标题(heading)，
    <tspan x="50" dy="25">标题上的每个字母都像巨人的头一样，引人注目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heading of the article caught my attention.
  </text>
  <text x="50" y="310" class="content">
    文章的标题引起了我的注意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large heading -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <text x="50" y="100" class="title" style="font-size: 60px;">HEADING</text>
    <!-- Giant letters -->
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="180" cy="150" r="20" class="image" />
    <circle cx="260" cy="150" r="20" class="image" />
    <circle cx="340" cy="150" r="20" class="image" />
  </g>
</svg>