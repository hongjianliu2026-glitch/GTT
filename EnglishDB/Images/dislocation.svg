<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dislocation</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsloʊˈkeɪʃn] n. 脱臼，混乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + loc (地方) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在打篮球时，"分开(dis-)"了原本"地方(loc)"上的关节，
    <tspan x="50" dy="25">导致脱臼(dislocation)，场面一片混乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffered a dislocation during the game.
  </text>
  <text x="50" y="310" class="content">
    他在比赛中脱臼了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basketball court -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Basketball hoop -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <circle cx="50" cy="15" r="10" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="150" x2="120" y2="130" class="image" />
    <line x1="150" y1="150" x2="180" y2="130" class="image" />
    <line x1="150" y1="180" x2="120" y2="200" class="image" />
    <line x1="150" y1="180" x2="180" y2="200" class="image" />
    <!-- Dislocated arm -->
    <line x1="150" y1="150" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
  </g>
</svg>