<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">militancy</text>
  <text x="50" y="120" class="subtitle">[ˈmɪlɪtənsi] n. 好战，激进</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> milit (士兵) + -ancy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群士兵在战场上，"士兵(milit)"
    <tspan x="50" dy="25">们表现出强烈的战斗精神，这种激进(militancy)让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The group's militancy led to violent protests.
  </text>
  <text x="50" y="310" class="content">
    该组织的激进态度导致了暴力抗议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="0" y2="180" class="image" />
    <line x1="50" y1="150" x2="100" y2="180" class="image" />
    <line x1="50" y1="130" x2="100" y2="120" class="image" />
    <!-- Battleground -->
    <rect x="120" y="0" width="250" height="200" class="image" />
    <line x1="130" y1="20" x2="350" y2="20" class="image" />
    <line x1="130" y1="50" x2="350" y2="50" class="image" />
    <line x1="130" y1="80" x2="350" y2="80" class="image" />
    <line x1="130" y1="110" x2="350" y2="110" class="image" />
    <line x1="130" y1="140" x2="350" y2="140" class="image" />
    <!-- Flag -->
    <line x1="370" y1="0" x2="370" y2="150" class="image" />
    <rect x="375" y="10" width="50" height="30" class="image" />
    <rect x="375" y="50" width="50" height="30" class="image" />
    <rect x="375" y="90" width="50" height="30" class="image" />
  </g>
</svg>