<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nursery</text>
  <text x="50" y="120" class="subtitle">[ˈnɜːrsəri] n. 托儿所，苗圃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nur (滋养) + -ery (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满爱心的地方，"滋养(nur)"
    <tspan x="50" dy="25">和照顾孩子们的场所，这就是托儿所(nursery)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nursery is filled with colorful toys.
  </text>
  <text x="50" y="310" class="content">
    托儿所里满是五颜六色的玩具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nursery building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Windows -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- Door -->
    <rect x="260" y="20" width="50" height="100" class="image" />
    <!-- Toys -->
    <circle cx="70" cy="120" r="15" class="image" />
    <circle cx="140" cy="120" r="15" class="image" />
    <circle cx="210" cy="120" r="15" class="image" />
    <circle cx="280" cy="120" r="15" class="image" />
    <!-- Children -->
    <circle cx="70" cy="160" r="15" class="image" />
    <circle cx="140" cy="160" r="15" class="image" />
    <circle cx="210" cy="160" r="15" class="image" />
    <circle cx="280" cy="160" r="15" class="image" />
  </g>
</svg>