<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">solution</text>
  <text x="50" y="120" class="subtitle">[səˈluːʃən] n. 解决方案，解答</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> solu- (松开) + -tion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"松开(solu-)"
    <tspan x="50" dy="25">一个复杂的化学反应，找到了问题的解答(solution)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team came up with a creative solution to the problem.
  </text>
  <text x="50" y="310" class="content">
    团队想出了一个创造性的解决方案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Lab table -->
    <rect x="50" y="20" width="300" height="160" class="image" />
    <!-- Beaker -->
    <rect x="100" y="50" width="50" height="100" class="image" />
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <!-- Chemical reaction -->
    <circle cx="125" cy="100" r="10" class="image" fill="#E74C3C" />
    <circle cx="110" cy="80" r="5" class="image" fill="#F1C40F" />
    <circle cx="140" cy="90" r="7" class="image" fill="#3498DB" />
  </g>
</svg>