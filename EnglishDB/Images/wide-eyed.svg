<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wide-eyed</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪd aɪd] adj. 睁大眼睛的，天真的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wide (宽的) + eyed (眼睛的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子睁大眼睛，好奇地看着世界，
    <tspan x="50" dy="25">他的眼睛(eyed)睁得大大的(wide)，充满了天真和好奇。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wide-eyed child stared at the magician's tricks.
  </text>
  <text x="50" y="310" class="content">
    那个睁大眼睛的孩子盯着魔术师的把戏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <ellipse cx="70" cy="80" rx="20" ry="10" class="image" />
    <ellipse cx="130" cy="80" rx="20" ry="10" class="image" />
    <!-- Pupils -->
    <circle cx="70" cy="80" r="5" class="image" fill="#000" />
    <circle cx="130" cy="80" r="5" class="image" fill="#000" />
    <!-- Mouth -->
    <path d="M 50 120 Q 100 140 150 120" class="image" />
  </g>
</svg>