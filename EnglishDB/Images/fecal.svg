<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fecal</text>
  <text x="50" y="120" class="subtitle">[ˈfiːkəl] adj. 粪便的，排泄物的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fe- (来自拉丁语 "faex"，意为渣滓或废物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的粪便(fecal)山，"渣滓(fe-)"堆积如山，
    <tspan x="50" dy="25">臭气熏天，让人难以忍受。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fecal matter was removed from the pet's cage.
  </text>
  <text x="50" y="310" class="content">
    宠物笼子里的粪便被清理掉了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fecal pile -->
    <circle cx="100" cy="100" r="50" class="image" fill="#8B4513" />
    <circle cx="150" cy="120" r="40" class="image" fill="#8B4513" />
    <circle cx="200" cy="140" r="30" class="image" fill="#8B4513" />
    <circle cx="250" cy="160" r="20" class="image" fill="#8B4513" />
    <!-- Smell lines -->
    <line x1="100" y1="50" x2="50" y2="20" class="image" />
    <line x1="150" y1="70" x2="100" y2="40" class="image" />
    <line x1="200" y1="90" x2="150" y2="60" class="image" />
    <line x1="250" y1="110" x2="200" y2="80" class="image" />
  </g>
</svg>