<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">statehood</text>
  <text x="50" y="120" class="subtitle">[ˈsteɪthʊd] n. 州或国家的地位，国家地位</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> state (国家) + -hood (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地图上，一个国家(state)被赋予了"地位(hood)"，
    <tspan x="50" dy="25">象征着它作为一个独立实体的存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The country celebrated its 50th anniversary of statehood.
  </text>
  <text x="50" y="310" class="content">
    这个国家庆祝了它建国50周年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Country outline -->
    <path d="M50,20 L300,20 L300,180 L50,180 Z" class="image" />
    <!-- Flag -->
    <rect x="70" y="40" width="50" height="30" class="image" />
    <line x1="70" y1="40" x2="70" y2="70" class="image" />
    <!-- Star -->
    <polygon points="95,55 85,70 105,60 85,50 95,65" class="image" />
  </g>
</svg>