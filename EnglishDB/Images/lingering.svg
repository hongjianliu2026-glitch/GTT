<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lingering</text>
  <text x="50" y="120" class="subtitle">[ˈlɪŋɡərɪŋ] adj. 拖延的，逗留的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> linger (逗留) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在门口"逗留(linger)"，迟迟不离开，
    <tspan x="50" dy="25">他的影子在夕阳下拉得很长，这就是"拖延的(lingering)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lingering smell of perfume filled the room.
  </text>
  <text x="50" y="310" class="content">
    香水的余香久久弥漫在房间里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="300" class="image" />
    <!-- Person -->
    <circle cx="75" cy="200" r="20" class="image" />
    <line x1="75" y1="220" x2="75" y2="280" class="image" />
    <line x1="75" y1="280" x2="50" y2="320" class="image" />
    <line x1="75" y1="280" x2="100" y2="320" class="image" />
    <line x1="75" y1="250" x2="120" y2="240" class="image" />
    <!-- Shadow -->
    <line x1="75" y1="320" x2="200" y2="400" class="image" />
  </g>
</svg>