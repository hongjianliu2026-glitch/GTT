<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrestle</text>
  <text x="50" y="120" class="subtitle">[ˈrɛsl] v. 摔跤，搏斗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wr- (扭曲) + es- (走) + tle (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在擂台上，"扭曲着身体(wr-)"
    <tspan x="50" dy="25">来回走动(es-)，反复搏斗(tle)，这就是摔跤(wrestle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They wrestled in the mud for hours.
  </text>
  <text x="50" y="310" class="content">
    他们在泥地里摔跤了好几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wrestling ring -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wrestlers -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Arms and legs -->
    <line x1="100" y1="120" x2="150" y2="150" class="image" />
    <line x1="100" y1="120" x2="50" y2="150" class="image" />
    <line x1="250" y1="120" x2="300" y2="150" class="image" />
    <line x1="250" y1="120" x2="200" y2="150" class="image" />
    <line x1="100" y1="180" x2="150" y2="210" class="image" />
    <line x1="100" y1="180" x2="50" y2="210" class="image" />
    <line x1="250" y1="180" x2="300" y2="210" class="image" />
    <line x1="250" y1="180" x2="200" y2="210" class="image" />
  </g>
</svg>