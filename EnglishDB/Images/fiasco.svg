<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fiasco</text>
  <text x="50" y="120" class="subtitle">[fiˈæskoʊ] n. 惨败，大失败</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fiasco (源自意大利语，原意为“玻璃瓶”，引申为“破碎”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个盛大的宴会，突然间所有的玻璃瓶(fiasco)都破碎了，
    <tspan x="50" dy="25">整个场面一片混乱，这就是一个惨败(fiasco)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The play was a complete fiasco; the audience left in disappointment.
  </text>
  <text x="50" y="310" class="content">
    这场演出完全失败了；观众失望地离开了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken bottles -->
    <line x1="50" y1="20" x2="100" y2="70" class="image" />
    <line x1="50" y1="70" x2="100" y2="20" class="image" />
    <line x1="150" y1="20" x2="200" y2="70" class="image" />
    <line x1="150" y1="70" x2="200" y2="20" class="image" />
    <line x1="250" y1="20" x2="300" y2="70" class="image" />
    <line x1="250" y1="70" x2="300" y2="20" class="image" />
    <!-- Confused people -->
    <circle cx="70" cy="120" r="15" class="image" />
    <line x1="70" y1="135" x2="70" y2="170" class="image" />
    <line x1="70" y1="170" x2="50" y2="200" class="image" />
    <line x1="70" y1="170" x2="90" y2="200" class="image" />
    <line x1="70" y1="150" x2="100" y2="140" class="image" />
    <circle cx="170" cy="120" r="15" class="image" />
    <line x1="170" y1="135" x2="170" y2="170" class="image" />
    <line x1="170" y1="170" x2="150" y2="200" class="image" />
    <line x1="170" y1="170" x2="190" y2="200" class="image" />
    <line x1="170" y1="150" x2="200" y2="140" class="image" />
    <circle cx="270" cy="120" r="15" class="image" />
    <line x1="270" y1="135" x2="270" y2="170" class="image" />
    <line x1="270" y1="170" x2="250" y2="200" class="image" />
    <line x1="270" y1="170" x2="290" y2="200" class="image" />
    <line x1="270" y1="150" x2="300" y2="140" class="image" />
  </g>
</svg>