<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mecca</text>
  <text x="50" y="120" class="subtitle">[ˈmɛkə] n. 麦加，朝圣地；某领域的中心</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自阿拉伯语 Makkah，指伊斯兰教的圣地麦加。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象成千上万的信徒涌向麦加，"朝圣(mecca)"
    <tspan x="50" dy="25">的场景，这里成为了信仰的中心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> New York is considered the mecca of fashion.
  </text>
  <text x="50" y="310" class="content">
    纽约被认为是时尚之都。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mecca symbol -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Minaret -->
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <!-- Dome -->
    <ellipse cx="100" cy="20" rx="60" ry="20" class="image" />
    <!-- People -->
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="100" cy="180" r="10" class="image" />
  </g>
</svg>