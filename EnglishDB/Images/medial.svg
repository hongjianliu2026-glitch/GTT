<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">medial</text>
  <text x="50" y="120" class="subtitle">[ˈmiːdiəl] adj. 中间的，中央的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> medi- (中间) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条直线上，"中间(medi-)"
    <tspan x="50" dy="25">有一个点，这个点就是"中央的(medial)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The medial line divides the field into two equal parts.
  </text>
  <text x="50" y="310" class="content">
    中间的线将场地分成两个相等的部分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Line -->
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <!-- Medial point -->
    <circle cx="200" cy="100" r="10" class="image" />
    <!-- Arrows -->
    <line x1="50" y1="100" x2="190" y2="100" class="image" />
    <line x1="210" y1="100" x2="350" y2="100" class="image" />
    <!-- Labels -->
    <text x="100" y="130" class="content">Start</text>
    <text x="300" y="130" class="content">End</text>
    <text x="190" y="150" class="content">Medial</text>
  </g>
</svg>