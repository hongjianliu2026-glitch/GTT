<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supermodel</text>
  <text x="50" y="120" class="subtitle">[ˈsuːpərmɒdl] n. 超级名模</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (超级) + model (模特)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个模特站在T台上，"超级(super)"
    <tspan x="50" dy="25">闪耀，吸引了所有人的目光，她就是超级名模(supermodel)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She aspired to become a supermodel.
  </text>
  <text x="50" y="310" class="content">
    她渴望成为一名超级名模。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Runway -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Model -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Star -->
    <polygon points="100,50 120,90 160,100 120,110 100,150 80,110 40,100 80,90" class="image" />
  </g>
</svg>