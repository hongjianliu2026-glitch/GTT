<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">making</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪkɪŋ] n. 制造，创作；v. make的现在分词</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> make (制造) + -ing (现在分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠在"制造(make)"
    <tspan x="50" dy="25">一件精美的艺术品，这个过程就是making。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The making of this sculpture took months.
  </text>
  <text x="50" y="310" class="content">
    这件雕塑的制作花了好几个月。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Workbench -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Art piece -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Tools -->
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="220" y1="20" x2="220" y2="180" class="image" />
    <line x1="240" y1="20" x2="240" y2="180" class="image" />
    <!-- Artisan -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="330" y2="120" class="image" />
  </g>
</svg>