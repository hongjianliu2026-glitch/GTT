<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">haunch</text>
  <text x="50" y="120" class="subtitle">[hɔːntʃ] n. 臀部，腰腿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> haunch (源自中古英语 hanche, 意为“臀部”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的动物，它的“臀部(haunch)”
    <tspan x="50" dy="25">像一座山一样高耸，让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lion's haunches were powerful and muscular.
  </text>
  <text x="50" y="310" class="content">
    狮子的臀部强壮且肌肉发达。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large animal body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Animal's haunch -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Legs -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="200" y1="150" x2="200" y2="250" class="image" />
    <!-- Feet -->
    <circle cx="100" cy="260" r="10" class="image" />
    <circle cx="200" cy="260" r="10" class="image" />
  </g>
</svg>