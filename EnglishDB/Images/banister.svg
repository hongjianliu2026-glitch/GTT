<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">banister</text>
  <text x="50" y="120" class="subtitle">[ˈbænɪstər] n. 楼梯扶手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ban (横梁) + -ister (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的横梁(ban)，它像一条巨龙一样蜿蜒在楼梯旁，
    <tspan x="50" dy="25">人们紧紧抓住它，就像抓住了安全(ister)的保障。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She held onto the banister as she descended the stairs.
  </text>
  <text x="50" y="310" class="content">
    她下楼梯时紧紧抓住了扶手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Staircase -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="250" y2="0" class="image" />
    <!-- Steps -->
    <line x1="50" y1="20" x2="250" y2="20" class="image" />
    <line x1="50" y1="60" x2="250" y2="60" class="image" />
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="50" y1="140" x2="250" y2="140" class="image" />
    <line x1="50" y1="180" x2="250" y2="180" class="image" />
    <!-- Banister -->
    <line x1="70" y1="0" x2="70" y2="200" class="image" />
    <line x1="90" y1="0" x2="90" y2="200" class="image" />
    <line x1="110" y1="0" x2="110" y2="200" class="image" />
    <line x1="130" y1="0" x2="130" y2="200" class="image" />
    <line x1="150" y1="0" x2="150" y2="200" class="image" />
    <line x1="170" y1="0" x2="170" y2="200" class="image" />
    <line x1="190" y1="0" x2="190" y2="200" class="image" />
    <line x1="210" y1="0" x2="210" y2="200" class="image" />
    <line x1="230" y1="0" x2="230" y2="200" class="image" />
  </g>
</svg>