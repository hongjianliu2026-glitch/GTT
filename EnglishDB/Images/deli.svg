<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deli</text>
  <text x="50" y="120" class="subtitle">[ˈdɛli] n. 熟食店</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自法语 "délicieux" (美味的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满美味食物的熟食店，"deli"
    <tspan x="50" dy="25">里的每一样食物都让人垂涎欲滴，仿佛在说"délicieux"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We bought some sandwiches from the deli.
  </text>
  <text x="50" y="310" class="content">
    我们从熟食店买了一些三明治。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Deli counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food items -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Sandwich -->
    <rect x="100" y="30" width="40" height="40" class="image" /> <!-- Cheese -->
    <rect x="160" y="30" width="40" height="40" class="image" /> <!-- Ham -->
    <rect x="220" y="30" width="40" height="40" class="image" /> <!-- Salad -->
    <!-- Customer -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>