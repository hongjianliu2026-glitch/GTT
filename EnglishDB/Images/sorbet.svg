<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sorbet { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sorbet</text>
  <text x="50" y="120" class="subtitle">[ˈsɔːrbət] n. 冰糕，果汁冰水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sorb (吸收) + -et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的吸管，"吸收(sorb)"
    <tspan x="50" dy="25">果汁并将其变成小巧(et)的冰糕(sorbet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to enjoy a refreshing sorbet on a hot day.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在热天享受清爽的冰糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sorbet -->
    <circle cx="100" cy="100" r="50" class="sorbet" />
    <!-- Straw -->
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <line x1="200" y1="100" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="220" class="image" />
    <line x1="200" y1="200" x2="220" y2="220" class="image" />
  </g>
</svg>