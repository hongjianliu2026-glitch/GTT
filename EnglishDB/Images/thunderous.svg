<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thunderous</text>
  <text x="50" y="120" class="subtitle">[ˈθʌndərəs] adj. 雷鸣般的，轰隆隆的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thunder (雷声) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的雷声，"轰隆隆(thunderous)"
    <tspan x="50" dy="25">地响彻天空，仿佛整个世界都在震动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thunderous applause filled the theater.
  </text>
  <text x="50" y="310" class="content">
    雷鸣般的掌声充满了整个剧院。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thunder cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Lightning bolt -->
    <polyline points="50,100 125,50 200,100" class="image" />
    <!-- Ground -->
    <rect x="0" y="200" width="350" height="100" class="image" />
    <!-- Sound waves -->
    <circle cx="100" cy="250" r="20" class="image" />
    <circle cx="150" cy="250" r="30" class="image" />
    <circle cx="200" cy="250" r="40" class="image" />
    <circle cx="250" cy="250" r="50" class="image" />
  </g>
</svg>