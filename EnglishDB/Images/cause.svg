<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cause</text>
  <text x="50" y="120" class="subtitle">[kɔːz] n. 原因，理由；v. 引起，导致</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> caus (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师挥动魔杖，"做(caus)"
    <tspan x="50" dy="25">出了一个奇迹，这就是"引起(cause)"的效果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heavy rain was the cause of the flood.
  </text>
  <text x="50" y="310" class="content">
    大雨是洪水的原因。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magic wand -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="240" y2="40" class="image" />
    <line x1="250" y1="50" x2="240" y2="60" class="image" />
    <!-- Star -->
    <polygon points="240,30 250,50 230,40 250,60" style="fill:#FFD700;stroke:#FFD700;stroke-width:2" />
    <!-- Result -->
    <circle cx="150" cy="150" r="50" style="fill:#3498DB;stroke:#3498DB;stroke-width:2" />
    <text x="135" y="160" class="content" style="fill:#FFFFFF;">奇迹</text>
  </g>
</svg>