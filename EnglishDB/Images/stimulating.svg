<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stimulating</text>
  <text x="50" y="120" class="subtitle">[ˈstɪmjəleɪtɪŋ] adj. 刺激的，令人兴奋的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stimul (刺激) + -ate (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满活力的场景，"刺激(stimul)"
    <tspan x="50" dy="25">的能量像电流一样"使(ate)"人兴奋，</tspan>
    <tspan x="50" dy="25">这就是"刺激的(stimulating)"感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new project was very stimulating for the team.
  </text>
  <text x="50" y="310" class="content">
    这个新项目对团队来说非常刺激。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lightning bolt -->
    <path d="M10 100 L50 50 L90 100 L50 150 Z" class="image" />
    <!-- Brain -->
    <circle cx="150" cy="100" r="40" class="image" />
    <!-- Exclamation marks -->
    <text x="220" y="100" class="image" font-size="40">!</text>
    <text x="250" y="100" class="image" font-size="40">!</text>
    <text x="280" y="100" class="image" font-size="40">!</text>
  </g>
</svg>