<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">goodwill</text>
  <text x="50" y="120" class="subtitle">[ˌɡʊdˈwɪl] n. 善意，友好</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> good (好的) + will (意愿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人伸出友好的手，脸上带着微笑，
    <tspan x="50" dy="25">这种"好的意愿(good-will)"让人感到温暖和友好。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's goodwill was evident in their charitable donations.
  </text>
  <text x="50" y="310" class="content">
    公司的善意在他们的慈善捐赠中显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Friendly hand -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />
    <line x1="150" y1="100" x2="150" y2="140" class="image" />
    <!-- Smiling face -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="85" cy="90" r="5" class="image" />
    <circle cx="115" cy="90" r="5" class="image" />
    <path d="M80 110 Q100 130 120 110" class="image" />
  </g>
</svg>