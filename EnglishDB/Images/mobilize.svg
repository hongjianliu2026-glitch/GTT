<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mobilize</text>
  <text x="50" y="120" class="subtitle">[ˈmoʊbəlaɪz] v. 动员，调动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mob (移动) + -ilize (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指挥官站在高台上，挥舞着旗帜，"移动(mob)"
    <tspan x="50" dy="25">并调动(ilize)士兵们，准备迎接战斗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government mobilized the army to respond to the crisis.
  </text>
  <text x="50" y="310" class="content">
    政府动员军队应对危机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Commander -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Flag -->
    <rect x="50" y="80" width="30" height="100" class="image" />
    <polygon points="50,80 80,100 50,120" class="image" />
    <!-- Soldiers -->
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="180" cy="100" r="10" class="image" />
    <line x1="120" y1="110" x2="120" y2="130" class="image" />
    <line x1="150" y1="110" x2="150" y2="130" class="image" />
    <line x1="180" y1="110" x2="180" y2="130" class="image" />
    <line x1="120" y1="130" x2="110" y2="150" class="image" />
    <line x1="150" y1="130" x2="140" y2="150" class="image" />
    <line x1="180" y1="130" x2="170" y2="150" class="image" />
    <line x1="120" y1="130" x2="130" y2="150" class="image" />
    <line x1="150" y1="130" x2="160" y2="150" class="image" />
    <line x1="180" y1="130" x2="190" y2="150" class="image" />
  </g>
</svg>