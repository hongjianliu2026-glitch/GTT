<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">natural</text>
  <text x="50" y="120" class="subtitle">[ˈnætʃrəl] adj. 自然的，天然的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nat (出生) + -ural (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个婴儿从母亲的子宫中"出生(nat)"，
    <tspan x="50" dy="25">这个过程是"自然的(natural)"，没有人为干预。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers natural remedies over synthetic ones.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢天然疗法而不是合成药物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother and baby -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Mother's belly -->
    <circle cx="100" cy="70" r="10" class="image" /> <!-- Baby's head -->
    <line x1="100" y1="80" x2="100" y2="100" class="image" /> <!-- Baby's body -->
    <line x1="90" y1="90" x2="80" y2="100" class="image" /> <!-- Baby's left arm -->
    <line x1="110" y1="90" x2="120" y2="100" class="image" /> <!-- Baby's right arm -->
    <line x1="95" y1="100" x2="85" y2="110" class="image" /> <!-- Baby's left leg -->
    <line x1="105" y1="100" x2="115" y2="110" class="image" /> <!-- Baby's right leg -->
  </g>
</svg>