<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">utterly</text>
  <text x="50" y="120" class="subtitle">[ˈʌtərli] adv. 完全地，彻底地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> utter (完全的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的空房间里，"完全地(utter)"
    <tspan x="50" dy="25">被黑暗包围，这种感觉就是"彻底地(utterly)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was utterly exhausted after the marathon.
  </text>
  <text x="50" y="310" class="content">
    马拉松之后，她完全筋疲力尽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person in the dark room -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Dark overlay -->
    <rect x="0" y="0" width="350" height="200" fill="rgba(0,0,0,0.5)" />
  </g>
</svg>