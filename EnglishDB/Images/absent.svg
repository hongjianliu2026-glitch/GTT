<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">absent</text>
  <text x="50" y="120" class="subtitle">[ˈæbsənt] adj. 缺席的，不在场的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + sent (存在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从房间里"离开(ab-)"，"不存在(sent)"
    <tspan x="50" dy="25">在房间里，这就是"缺席的(absent)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was absent from the meeting yesterday.
  </text>
  <text x="50" y="310" class="content">
    他昨天没有参加会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="300" y="80" width="30" height="40" class="image" />
    <!-- Person leaving -->
    <circle cx="315" cy="100" r="15" class="image" />
    <line x1="315" y1="115" x2="315" y2="150" class="image" />
    <line x1="315" y1="150" x2="300" y2="180" class="image" />
    <line x1="315" y1="150" x2="330" y2="180" class="image" />
    <line x1="315" y1="130" x2="345" y2="120" class="image" />
  </g>
</svg>