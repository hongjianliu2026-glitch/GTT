<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diced</text>
  <text x="50" y="120" class="subtitle">[daɪst] adj. 切成丁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + -ce (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"分开(di-)"
    <tspan x="50" dy="25">一块块食材，切成小丁(diced)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added diced onions to the soup.
  </text>
  <text x="50" y="310" class="content">
    她把切好的洋葱丁加到汤里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cutting board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Onion -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Diced onion pieces -->
    <rect x="100" y="80" width="20" height="20" class="image" />
    <rect x="130" y="80" width="20" height="20" class="image" />
    <rect x="160" y="80" width="20" height="20" class="image" />
    <rect x="100" y="110" width="20" height="20" class="image" />
    <rect x="130" y="110" width="20" height="20" class="image" />
    <rect x="160" y="110" width="20" height="20" class="image" />
    <!-- Chef -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>