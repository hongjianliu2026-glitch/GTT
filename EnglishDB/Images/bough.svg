<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bough</text>
  <text x="50" y="120" class="subtitle">[baʊ] n. 大树枝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bough (源自中古英语 bogh，意为“树枝”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树，树干上伸出一条巨大的树枝(bough)，
    <tspan x="50" dy="25">树枝上挂满了果实，仿佛在向你招手。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bird built its nest on a sturdy bough.
  </text>
  <text x="50" y="310" class="content">
    鸟儿在一根结实的树枝上筑巢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree trunk -->
    <rect x="100" y="0" width="50" height="300" class="image" />
    <!-- Bough -->
    <line x1="125" y1="50" x2="250" y2="100" class="image" />
    <!-- Fruits -->
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="220" cy="110" r="15" class="image" />
    <circle cx="240" cy="90" r="15" class="image" />
  </g>
</svg>