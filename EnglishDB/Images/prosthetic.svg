<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prosthetic</text>
  <text x="50" y="120" class="subtitle">[prɑːˈsθetɪk] n. 假肢；adj. 假体的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (在前面) + sthet (放置) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人失去了一条腿，医生为他"提前放置(pro-sthet)"
    <tspan x="50" dy="25">一个假肢(prosthetic)，让他能够重新行走。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He uses a prosthetic leg to walk after the accident.
  </text>
  <text x="50" y="310" class="content">
    事故后，他使用假肢行走。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Leg -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <!-- Prosthetic leg -->
    <rect x="40" y="150" width="20" height="50" class="image" />
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="30" y2="300" class="image" />
    <line x1="50" y1="250" x2="70" y2="300" class="image" />
    <!-- Person -->
    <circle cx="50" cy="10" r="15" class="image" />
    <line x1="50" y1="25" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="30" y2="80" class="image" />
    <line x1="50" y1="50" x2="70" y2="80" class="image" />
  </g>
</svg>