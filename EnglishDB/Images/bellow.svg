<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bellow</text>
  <text x="50" y="120" class="subtitle">[ˈbɛloʊ] v. 吼叫，咆哮；n. 吼声，咆哮声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bell (铃声) + -ow (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头愤怒的公牛，"铃声(bell)"般
    <tspan x="50" dy="25">震耳欲聋地吼叫(bellow)，整个山谷都在回响。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bull bellowed loudly when it saw the red cloth.
  </text>
  <text x="50" y="310" class="content">
    公牛看到红布时大声吼叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bull -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="20" y2="180" class="image" /> <!-- Front leg -->
    <line x1="50" y1="160" x2="80" y2="180" class="image" /> <!-- Back leg -->
    <line x1="50" y1="200" x2="20" y2="240" class="image" /> <!-- Front leg -->
    <line x1="50" y1="200" x2="80" y2="240" class="image" /> <!-- Back leg -->
    <line x1="50" y1="130" x2="20" y2="110" class="image" /> <!-- Horn -->
    <line x1="50" y1="130" x2="80" y2="110" class="image" /> <!-- Horn -->
    <!-- Sound waves -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="25" class="image" />
  </g>
</svg>