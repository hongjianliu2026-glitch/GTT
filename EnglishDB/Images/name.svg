<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">name</text>
  <text x="50" y="120" class="subtitle">[neɪm] n. 名字，名称；v. 命名，指定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> n (无意义) + ame (爱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新生儿，父母"爱(ame)"地给他/她取了一个名字(name)，
    <tspan x="50" dy="25">这个名字将伴随他/她一生。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She named her daughter Lily.
  </text>
  <text x="50" y="310" class="content">
    她给她的女儿取名为莉莉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baby -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Name tag -->
    <rect x="100" y="80" width="150" height="40" class="image" />
    <text x="110" y="105" class="content">Lily</text>
    <!-- Heart -->
    <path d="M200,100 C200,100 220,80 240,100 C260,120 240,140 200,140 Z" class="image" />
  </g>
</svg>