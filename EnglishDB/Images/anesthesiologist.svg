<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anesthesiologist</text>
  <text x="50" y="120" class="subtitle">[ˌænəsˌθizioʊˈlɑdʒɪst] n. 麻醉师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ana- (向上) + esthesia (感觉) + -logist (专家)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个麻醉师在手术室里，"提升(ana-)"病人的"感觉(esthesia)"，
    <tspan x="50" dy="25">让他们在手术过程中保持平静和无痛苦，这就是麻醉师(anesthesiologist)的工作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The anesthesiologist monitored the patient's vital signs during the surgery.
  </text>
  <text x="50" y="310" class="content">
    麻醉师在手术过程中监测病人的生命体征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Operating room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Anesthesiologist -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Patient -->
    <rect x="150" y="50" width="150" height="100" class="image" />
    <!-- Anesthesia equipment -->
    <rect x="200" y="160" width="100" height="30" class="image" />
    <line x1="220" y1="170" x2="220" y2="190" class="image" />
    <line x1="240" y1="170" x2="240" y2="190" class="image" />
    <line x1="260" y1="170" x2="260" y2="190" class="image" />
  </g>
</svg>