<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #2C3E50; }
      .subtitle { font: italic 24px serif; fill: #7F8C8D; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .atom { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uranium</text>
  <text x="50" y="120" class="subtitle">[jʊˈreɪniəm] n. 铀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uran- (天体) + -ium (元素)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天体(uran-)，它是由一种神秘的元素(-ium)构成的，
    <tspan x="50" dy="25">这种元素就是铀(uranium)，它闪烁着神秘的光芒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The reactor uses enriched uranium for power generation.
  </text>
  <text x="50" y="310" class="content">
    反应堆使用浓缩铀来发电。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Uranium atom -->
    <circle cx="100" cy="100" r="50" class="atom" />
    <!-- Nucleus -->
    <circle cx="100" cy="100" r="10" class="atom" />
    <!-- Electrons -->
    <circle cx="100" cy="50" r="5" class="atom" />
    <circle cx="150" cy="100" r="5" class="atom" />
    <circle cx="100" cy="150" r="5" class="atom" />
    <circle cx="50" cy="100" r="5" class="atom" />
    <!-- Orbit lines -->
    <ellipse cx="100" cy="100" rx="50" ry="20" class="image" />
    <ellipse cx="100" cy="100" rx="20" ry="50" class="image" />
  </g>
</svg>