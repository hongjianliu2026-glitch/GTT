<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">capricious</text>
  <text x="50" y="120" class="subtitle">[kəˈprɪʃəs] adj. 反复无常的，任性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> capri- (山羊) + -cious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只山羊(capri-)在山顶上跳来跳去，
    <tspan x="50" dy="25">它的行为难以预测，就像一个反复无常的人(capricious)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her capricious mood swings made it hard to plan anything.
  </text>
  <text x="50" y="310" class="content">
    她反复无常的情绪波动使得计划任何事情都很困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,100 L100,0 L200,100 Z" class="image" />
    <!-- Goat -->
    <circle cx="100" cy="50" r="20" class="image" />
    <line x1="100" y1="70" x2="100" y2="100" class="image" />
    <line x1="100" y1="80" x2="80" y2="90" class="image" />
    <line x1="100" y1="80" x2="120" y2="90" class="image" />
    <line x1="100" y1="100" x2="80" y2="120" class="image" />
    <line x1="100" y1="100" x2="120" y2="120" class="image" />
    <!-- Cloud -->
    <ellipse cx="150" cy="30" rx="30" ry="15" class="image" />
    <ellipse cx="180" cy="20" rx="20" ry="10" class="image" />
    <ellipse cx="130" cy="20" rx="20" ry="10" class="image" />
  </g>
</svg>