<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .waterproof { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">waterproof</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːtərˌpruːf] adj. 防水的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> water (水) + proof (防)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件防水夹克，"防(proof)"
    <tspan x="50" dy="25">止水(water)渗透，让你在雨中也能保持干爽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bought a waterproof jacket for the rainy season.
  </text>
  <text x="50" y="310" class="content">
    他为雨季买了一件防水夹克。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- Waterproof jacket -->
    <rect x="100" y="50" width="150" height="100" class="waterproof" />
    <!-- Rain drops -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="70" r="10" class="image" />
    <circle cx="110" cy="90" r="10" class="image" />
    <circle cx="140" cy="110" r="10" class="image" />
    <circle cx="170" cy="130" r="10" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
    <circle cx="230" cy="170" r="10" class="image" />
    <circle cx="260" cy="190" r="10" class="image" />
  </g>
</svg>