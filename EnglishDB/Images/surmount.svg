<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surmount</text>
  <text x="50" y="120" class="subtitle">[sərˈmaʊnt] v. 克服，超越</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (在上面) + mount (山)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在山顶，"在山上(sur-mount)"
    <tspan x="50" dy="25">俯视一切，象征着克服困难，超越自我。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She managed to surmount all the obstacles in her path.
  </text>
  <text x="50" y="310" class="content">
    她设法克服了前进道路上的一切障碍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 175,0 350,200" class="image" />
    <!-- Person on top -->
    <circle cx="175" cy="50" r="15" class="image" />
    <line x1="175" y1="65" x2="175" y2="100" class="image" />
    <line x1="175" y1="100" x2="150" y2="130" class="image" />
    <line x1="175" y1="100" x2="200" y2="130" class="image" />
    <line x1="175" y1="80" x2="220" y2="70" class="image" />
  </g>
</svg>