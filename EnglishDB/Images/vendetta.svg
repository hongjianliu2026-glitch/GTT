<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vendetta</text>
  <text x="50" y="120" class="subtitle">[vɛnˈdɛtə] n. 世仇，宿怨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ven- (来) + detta (给予)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个家族，"来(ven-)"自不同的背景，
    <tspan x="50" dy="25">因为某种原因，"给予(detta)"彼此无尽的仇恨，</tspan>
    <tspan x="50" dy="25">这种世仇(vendetta)持续了数代人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vendetta between the two families lasted for generations.
  </text>
  <text x="50" y="310" class="content">
    这两个家族之间的世仇持续了数代人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family 1 -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <circle cx="75" cy="50" r="20" class="image" />
    <line x1="75" y1="70" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="50" y2="180" class="image" />
    <line x1="75" y1="150" x2="100" y2="180" class="image" />
    <line x1="75" y1="100" x2="50" y2="90" class="image" />
    <line x1="75" y1="100" x2="100" y2="90" class="image" />

    <!-- Family 2 -->
    <rect x="200" y="0" width="150" height="200" class="image" />
    <circle cx="275" cy="50" r="20" class="image" />
    <line x1="275" y1="70" x2="275" y2="150" class="image" />
    <line x1="275" y1="150" x2="250" y2="180" class="image" />
    <line x1="275" y1="150" x2="300" y2="180" class="image" />
    <line x1="275" y1="100" x2="250" y2="90" class="image" />
    <line x1="275" y1="100" x2="300" y2="90" class="image" />

    <!-- Arrow of vendetta -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <polygon points="190,90 200,100 190,110" class="image" />
  </g>
</svg>