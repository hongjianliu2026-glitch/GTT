<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impropriety</text>
  <text x="50" y="120" class="subtitle">[ˌɪmprəˈpraɪəti] n. 不适当，不合适的行为</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + propri (适当) + -ety (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在正式场合穿着泳衣，"不适当(im-propriety)"
    <tspan x="50" dy="25">的行为让人侧目，这就是不合适的行为(impropriety)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Wearing flip-flops to a wedding is considered an impropriety.
  </text>
  <text x="50" y="310" class="content">
    穿拖鞋参加婚礼被认为是不合适的行为。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Formal event -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person in swimsuit -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Swimsuit -->
    <rect x="40" y="120" width="20" height="40" class="image" />
    <rect x="60" y="120" width="20" height="40" class="image" />
    <!-- Formal attire -->
    <rect x="200" y="80" width="100" height="120" class="image" />
    <line x1="200" y1="80" x2="300" y2="80" class="image" />
    <line x1="200" y1="140" x2="300" y2="140" class="image" />
    <line x1="200" y1="200" x2="300" y2="200" class="image" />
  </g>
</svg>