<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thread</text>
  <text x="50" y="120" class="subtitle">[θrɛd] n. 线，线索；v. 穿线，穿过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thred (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根线(thread)穿过针眼，"穿线(thread)"
    <tspan x="50" dy="25">的动作就像是在解开一个谜题的线索。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carefully threaded the needle with a piece of thread.
  </text>
  <text x="50" y="310" class="content">
    她小心翼翼地用一根线穿过了针眼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Thread -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <!-- Needle -->
    <rect x="280" y="40" width="20" height="20" class="image" />
    <!-- Eye of the needle -->
    <circle cx="290" cy="50" r="5" class="image" />
    <!-- Thread passing through the eye -->
    <line x1="290" y1="50" x2="290" y2="100" class="image" />
  </g>
</svg>