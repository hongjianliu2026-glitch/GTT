<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vast</text>
  <text x="50" y="120" class="subtitle">[væst] adj. 巨大的，广阔的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vast (来自拉丁语 vastus，意为“空旷的，未开垦的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片无边无际的海洋，"空旷的(vast)"
    <tspan x="50" dy="25">海面上只有几只海鸥在飞翔，这就是vast的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vast ocean stretched out before us.
  </text>
  <text x="50" y="310" class="content">
    广阔的海洋在我们面前展开。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Waves -->
    <path d="M50,100 Q100,50 150,100 T250,100 T300,50 T350,100" class="image" fill="none" stroke="#2980B9" stroke-width="3" />
    <path d="M50,120 Q100,70 150,120 T250,120 T300,70 T350,120" class="image" fill="none" stroke="#2980B9" stroke-width="3" />
    <path d="M50,140 Q100,90 150,140 T250,140 T300,90 T350,140" class="image" fill="none" stroke="#2980B9" stroke-width="3" />
    <!-- Seagulls -->
    <circle cx="100" cy="50" r="5" class="image" fill="#FFFFFF" />
    <circle cx="120" cy="40" r="5" class="image" fill="#FFFFFF" />
    <circle cx="140" cy="60" r="5" class="image" fill="#FFFFFF" />
  </g>
</svg>