<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">broaden</text>
  <text x="50" y="120" class="subtitle">[ˈbroʊdən] v. 拓宽，扩大</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> broad (宽) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条狭窄的小路，突然被"拓宽(broad-en)"成
    <tspan x="50" dy="25">一条宽阔的大道，视野瞬间开阔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Traveling abroad broadened her horizons.
  </text>
  <text x="50" y="310" class="content">
    出国旅行拓宽了她的视野。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Narrow path -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Wide path -->
    <rect x="120" y="0" width="250" height="200" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="100" x2="120" y2="100" class="image" />
    <polygon points="115,95 120,100 115,105" class="image" />
    <line x1="370" y1="100" x2="390" y2="100" class="image" />
    <polygon points="375,95 370,100 375,105" class="image" />
    <!-- Sun -->
    <circle cx="450" cy="100" r="30" class="image" />
  </g>
</svg>