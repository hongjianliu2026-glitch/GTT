<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">endearing</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdɪrɪŋ] adj. 令人喜爱的，讨人喜欢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + dear (亲爱的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫，"使(en)"
    <tspan x="50" dy="25">人感到"亲爱的(dear)"，</tspan>
    <tspan x="50" dy="25">这就是令人喜爱的(endearing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her endearing smile made everyone feel at ease.
  </text>
  <text x="50" y="310" class="content">
    她那讨人喜欢的微笑让每个人都感到轻松。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 31.362c0-8.138 6.623-14.762 14.762-14.762 7.268 0 13.303 5.114 14.56 11.986l.202 1.186c1.257 7.47-3.393 14.762-10.765 14.762-7.372 0-13.303-5.114-14.56-11.986l-.202-1.186z" class="image" />
    <!-- Cat face -->
    <circle cx="20" cy="20" r="15" class="image" />
    <line x1="10" y1="30" x2="30" y2="30" class="image" />
    <line x1="15" y1="40" x2="25" y2="40" class="image" />
    <line x1="10" y1="20" x2="30" y2="20" class="image" />
  </g>
</svg>