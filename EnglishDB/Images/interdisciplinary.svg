<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interdisciplinary</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈdɪsəplɪneri] adj. 跨学科的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + discipline (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学者在两个学科之间"穿梭(inter-)"，
    <tspan x="50" dy="25">将不同学科的知识"结合(inter-disciplinary)"，</tspan>
    <tspan x="50" dy="25">创造出全新的见解。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project required an interdisciplinary approach to solve the problem.
  </text>
  <text x="50" y="310" class="content">
    这个项目需要跨学科的方法来解决问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two books representing different disciplines -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="200" y="0" width="150" height="200" class="image" />
    <!-- Scholar crossing between the books -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="225" y2="120" class="image" />
    <!-- Arrows indicating crossing -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="140" y2="90" class="image" />
    <line x1="150" y1="100" x2="140" y2="110" class="image" />
    <line x1="200" y1="100" x2="210" y2="90" class="image" />
    <line x1="200" y1="100" x2="210" y2="110" class="image" />
  </g>
</svg>