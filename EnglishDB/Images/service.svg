<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">service</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrvɪs] n. 服务，服役；v. 维修，保养</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ser- (保持) + vice (代替)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个服务员在餐厅里，"保持(ser-)"
    <tspan x="50" dy="25">为顾客提供"代替(vice)"他们完成的服务，</tspan>
    <tspan x="50" dy="25">这就是服务(service)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hotel offers excellent service to its guests.
  </text>
  <text x="50" y="310" class="content">
    这家酒店为客人提供优质服务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Restaurant table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Plate -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Fork -->
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="150" y1="100" x2="170" y2="100" class="image" />
    <!-- Knife -->
    <line x1="180" y1="80" x2="180" y2="120" class="image" />
    <line x1="180" y1="100" x2="200" y2="100" class="image" />
    <!-- Waiter -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="290" y2="120" class="image" />
  </g>
</svg>