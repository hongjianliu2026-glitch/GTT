<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">belie</text>
  <text x="50" y="120" class="subtitle">[bɪˈlaɪ] v. 掩饰，与...不符</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + lie (谎言)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图"使(be-)谎言(lie)"看起来真实，
    <tspan x="50" dy="25">但最终真相大白，与表面现象不符(belie)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her calm demeanor belied her inner turmoil.
  </text>
  <text x="50" y="310" class="content">
    她平静的外表掩饰了她内心的混乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Mask -->
    <rect x="30" y="80" width="40" height="20" class="image" />
    <!-- Tornado -->
    <path d="M100,80 C120,60 140,100 160,80" class="image" />
    <path d="M100,100 C120,80 140,120 160,100" class="image" />
    <path d="M100,120 C120,100 140,140 160,120" class="image" />
  </g>
</svg>