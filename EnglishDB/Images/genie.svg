<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">genie</text>
  <text x="50" y="120" class="subtitle">[ˈdʒiːni] n. 妖怪，精灵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gen- (产生) + -ie (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的瓶子，里面藏着一个"产生(gen-)"
    <tspan x="50" dy="25">的小精灵(genie)，它突然从瓶子里冒出来，</tspan>
    <tspan x="50" dy="25">为你实现三个愿望。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The genie granted him three wishes.
  </text>
  <text x="50" y="310" class="content">
    精灵给了他三个愿望。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Genie -->
    <circle cx="75" cy="100" r="20" class="image" />
    <line x1="75" y1="120" x2="75" y2="160" class="image" />
    <line x1="75" y1="160" x2="60" y2="180" class="image" />
    <line x1="75" y1="160" x2="90" y2="180" class="image" />
    <line x1="75" y1="140" x2="100" y2="130" class="image" />
  </g>
</svg>