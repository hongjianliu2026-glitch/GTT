<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">finger</text>
  <text x="50" y="120" class="subtitle">[ˈfɪŋɡər] n. 手指</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fing (手指) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师用手指(finger)轻轻一弹，
    <tspan x="50" dy="25">变出了一只小鸟，小鸟飞向天空，留下了一串音符。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She pointed at the map with her finger.
  </text>
  <text x="50" y="310" class="content">
    她用手指指向地图。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hand -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Thumb -->
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <!-- Index finger -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Middle finger -->
    <line x1="100" y1="150" x2="50" y2="250" class="image" />
    <!-- Ring finger -->
    <line x1="100" y1="150" x2="0" y2="220" class="image" />
    <!-- Pinky finger -->
    <line x1="100" y1="150" x2="0" y2="180" class="image" />
    <!-- Bird -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
    <line x1="250" y1="150" x2="290" y2="140" class="image" />
    <!-- Music notes -->
    <path d="M250 100 Q270 80, 290 100 T330 100" class="image" />
    <path d="M250 120 Q270 100, 290 120 T330 120" class="image" />
    <path d="M250 140 Q270 120, 290 140 T330 140" class="image" />
  </g>
</svg>