<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sweatshirt</text>
  <text x="50" y="120" class="subtitle">[ˈswetʃɜrt] n. 运动衫，卫衣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sweat (汗) + shirt (衬衫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着一件卫衣，在运动时"出汗(sweat)"，
    <tspan x="50" dy="25">这件衣服就成了他的"汗衫(sweatshirt)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a comfortable sweatshirt during his morning run.
  </text>
  <text x="50" y="310" class="content">
    他在晨跑时穿了一件舒适的卫衣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sweatshirt -->
    <rect x="50" y="50" width="200" height="150" class="image" />
    <!-- Sweat drops -->
    <circle cx="100" cy="220" r="10" class="image" />
    <circle cx="150" cy="230" r="12" class="image" />
    <circle cx="200" cy="220" r="10" class="image" />
    <!-- Person -->
    <circle cx="150" cy="125" r="20" class="image" />
    <line x1="150" y1="145" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="210" class="image" />
    <line x1="150" y1="180" x2="170" y2="210" class="image" />
    <line x1="150" y1="160" x2="120" y2="150" class="image" />
    <line x1="150" y1="160" x2="180" y2="150" class="image" />
  </g>
</svg>