<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arterial</text>
  <text x="50" y="120" class="subtitle">[ɑːˈtɪəriəl] adj. 动脉的，干线的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arteri (动脉) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条宽阔的"动脉(arteri)"道路，
    <tspan x="50" dy="25">它像人体的动脉一样，是城市交通的"干线(arterial)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The arterial road connects the city center to the suburbs.
  </text>
  <text x="50" y="310" class="content">
    这条干线道路连接了市中心和郊区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artery road -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Artery -->
    <line x1="50" y1="25" x2="300" y2="25" class="image" />
    <circle cx="75" cy="25" r="10" class="image" />
    <circle cx="150" cy="25" r="10" class="image" />
    <circle cx="225" cy="25" r="10" class="image" />
    <circle cx="300" cy="25" r="10" class="image" />
    <!-- City -->
    <rect x="50" y="70" width="50" height="50" class="image" />
    <rect x="250" y="70" width="50" height="50" class="image" />
    <!-- Suburbs -->
    <rect x="100" y="130" width="30" height="30" class="image" />
    <rect x="150" y="130" width="30" height="30" class="image" />
    <rect x="200" y="130" width="30" height="30" class="image" />
  </g>
</svg>