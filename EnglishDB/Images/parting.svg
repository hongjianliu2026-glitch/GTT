<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parting</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːrtɪŋ] n. 分离，告别</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> part (部分) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在车站，"部分(part)"
    <tspan x="50" dy="25">分离，挥手告别(parting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The parting was hard for both of them.
  </text>
  <text x="50" y="310" class="content">
    对他们两人来说，告别是艰难的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Train station -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Train -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- People -->
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="250" cy="120" r="15" class="image" />
    <!-- Arms waving -->
    <line x1="100" y1="135" x2="80" y2="160" class="image" />
    <line x1="100" y1="135" x2="120" y2="160" class="image" />
    <line x1="250" y1="135" x2="230" y2="160" class="image" />
    <line x1="250" y1="135" x2="270" y2="160" class="image" />
  </g>
</svg>