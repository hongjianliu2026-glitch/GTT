<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tattoo</text>
  <text x="50" y="120" class="subtitle">[təˈtuː] n. 纹身</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tat (打) + too (标记)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在皮肤上"打上标记(tat-too)"，
    <tspan x="50" dy="25">这个标记就是永久的纹身(tattoo)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He got a dragon tattoo on his arm.
  </text>
  <text x="50" y="310" class="content">
    他在手臂上纹了一条龙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arm -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dragon tattoo -->
    <path d="M50,50 C100,20 200,20 250,50 C300,80 300,150 250,180 C200,210 100,210 50,180 Z" class="image" />
    <!-- Person's arm -->
    <line x1="100" y1="200" x2="300" y2="200" class="image" />
    <line x1="100" y1="200" x2="100" y2="0" class="image" />
    <line x1="300" y1="200" x2="300" y2="0" class="image" />
  </g>
</svg>