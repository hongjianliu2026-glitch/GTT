<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">day</text>
  <text x="50" y="120" class="subtitle">[deɪ] n. 天，白天</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dai- (白天)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个太阳高高挂在天空，照亮了整个"白天(dai-)"，
    <tspan x="50" dy="25">这就是一天(day)的开始。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We have a busy day ahead of us.
  </text>
  <text x="50" y="310" class="content">
    我们今天有很多事情要做。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#2E8B57" />
    <!-- Clouds -->
    <ellipse cx="200" cy="50" rx="60" ry="30" class="image" fill="#FFFFFF" />
    <ellipse cx="250" cy="80" rx="50" ry="25" class="image" fill="#FFFFFF" />
  </g>
</svg>