<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vibe</text>
  <text x="50" y="120" class="subtitle">[vaɪb] n. 氛围，感觉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vib (振动) + e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里充满了"振动(vib)"的能量，
    <tspan x="50" dy="25">这种能量形成了独特的氛围(vibe)，让人感到舒适或兴奋。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The party had a great vibe, everyone was dancing and having fun.
  </text>
  <text x="50" y="310" class="content">
    派对氛围很好，每个人都在跳舞和享受乐趣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Vibrating energy -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="70" x2="300" y2="70" class="image" />
    <line x1="50" y1="90" x2="300" y2="90" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="130" x2="300" y2="130" class="image" />
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <line x1="50" y1="190" x2="300" y2="190" class="image" />
    <!-- People -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <!-- Dancing lines -->
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
  </g>
</svg>