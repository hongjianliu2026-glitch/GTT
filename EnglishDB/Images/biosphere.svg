<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">biosphere</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪəˌsfɪr] n. 生物圈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bio- (生命) + sphere (球体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的球体，里面充满了各种生物，
    <tspan x="50" dy="25">这个球体就是我们的"生物圈(biosphere)"，</tspan>
    <tspan x="50" dy="25">它包含了地球上所有的生命。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The biosphere is a complex system that supports life.
  </text>
  <text x="50" y="310" class="content">
    生物圈是一个支持生命的复杂系统。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="80" class="image" fill="#2980B9" />
    <!-- Trees -->
    <line x1="100" y1="180" x2="100" y2="140" class="image" />
    <line x1="100" y1="140" x2="80" y2="160" class="image" />
    <line x1="100" y1="140" x2="120" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="180" class="image" />
    <line x1="100" y1="160" x2="120" y2="180" class="image" />
    <line x1="250" y1="180" x2="250" y2="140" class="image" />
    <line x1="250" y1="140" x2="230" y2="160" class="image" />
    <line x1="250" y1="140" x2="270" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="180" class="image" />
    <line x1="250" y1="160" x2="270" y2="180" class="image" />
    <!-- Animals -->
    <circle cx="140" cy="120" r="10" class="image" fill="#E74C3C" />
    <circle cx="210" cy="120" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>