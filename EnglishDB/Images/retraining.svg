<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retraining</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈtreɪnɪŋ] n. 再培训，重新训练</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + train (训练)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在健身房里，"再次训练(re-train)"
    <tspan x="50" dy="25">自己的肌肉，这就是再培训(retraining)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company offered retraining programs for its employees.
  </text>
  <text x="50" y="310" class="content">
    公司为员工提供了再培训项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gym -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Dumbbell -->
    <rect x="100" y="150" width="50" height="10" class="image" />
    <rect x="100" y="140" width="10" height="30" class="image" />
    <rect x="140" y="140" width="10" height="30" class="image" />
    <!-- Trainer -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Trainer's hand -->
    <line x1="200" y1="120" x2="100" y2="120" class="image" />
  </g>
</svg>