<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slaying</text>
  <text x="50" y="120" class="subtitle">[ˈsleɪɪŋ] n. 屠杀，杀害</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slay (杀) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇士手持巨剑，"屠杀(slay)"
    <tspan x="50" dy="25">怪物，场面血腥，令人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dragon's slaying was a legendary event.
  </text>
  <text x="50" y="310" class="content">
    屠龙的事件是一个传奇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warrior -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Sword -->
    <line x1="90" y1="140" x2="150" y2="100" class="image" />
    <!-- Monster -->
    <rect x="200" y="80" width="100" height="60" class="image" />
    <line x1="220" y1="100" x2="280" y2="100" class="image" />
    <line x1="220" y1="120" x2="280" y2="120" class="image" />
    <line x1="220" y1="140" x2="280" y2="140" class="image" />
    <!-- Blood splatter -->
    <circle cx="250" cy="110" r="10" class="image" fill="#E74C3C" />
    <circle cx="230" cy="130" r="8" class="image" fill="#E74C3C" />
    <circle cx="270" cy="130" r="8" class="image" fill="#E74C3C" />
  </g>
</svg>