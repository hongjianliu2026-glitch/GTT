<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">urgency</text>
  <text x="50" y="120" class="subtitle">[ˈɜːrdʒənsi] n. 紧急，迫切</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ur- (驱动) + gen (产生) + cy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个紧急情况，"驱动(ur-)"
    <tspan x="50" dy="25">产生(gen)了迫切的需求，这就是紧急(urgency)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The urgency of the situation required immediate action.
  </text>
  <text x="50" y="310" class="content">
    情况的紧急需要立即采取行动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Alarm clock -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="50" y1="50" x2="50" y2="90" class="image" />
    <line x1="50" y1="50" x2="70" y2="70" class="image" />
    <!-- Exclamation mark -->
    <polygon points="120,30 120,100 140,100 140,120 120,120 120,140 100,140 100,120 80,120 80,100 100,100 100,30" class="image" />
    <line x1="120" y1="140" x2="120" y2="160" class="image" />
  </g>
</svg>