<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conspicuous</text>
  <text x="50" y="120" class="subtitle">[kənˈspɪkjuəs] adj. 显眼的，显著的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + spic (看) + -uous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人中，有一个人穿着"共同(con-)"
    <tspan x="50" dy="25">"显眼(spic)"的衣服，"显著(conspicuous)"到每个人都能一眼看到他。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a conspicuous red dress at the party.
  </text>
  <text x="50" y="310" class="content">
    她在派对上穿了一件显眼的红色连衣裙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Conspicuous person -->
    <circle cx="250" cy="100" r="15" class="image" fill="#E74C3C" />
    <!-- Dress -->
    <rect x="235" y="85" width="30" height="30" class="image" fill="#E74C3C" />
    <!-- Arrows -->
    <line x1="50" y1="120" x2="250" y2="120" class="image" />
    <polygon points="250,120 240,130 260,130" class="image" />
  </g>
</svg>