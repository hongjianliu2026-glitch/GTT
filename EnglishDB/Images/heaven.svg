<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heaven</text>
  <text x="50" y="120" class="subtitle">[ˈhevn] n. 天堂，天空</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hev (天空) + -en (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天空，"天空(hev)"
    <tspan x="50" dy="25">中漂浮着云朵和天使，这就是天堂(heaven)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She believes her grandmother is in heaven now.
  </text>
  <text x="50" y="310" class="content">
    她相信她的祖母现在在天堂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="50" rx="80" ry="30" class="image" />
    <ellipse cx="200" cy="70" rx="90" ry="40" class="image" />
    <ellipse cx="300" cy="60" rx="70" ry="35" class="image" />
    <!-- Angel -->
    <circle cx="150" cy="120" r="15" class="image" />
    <line x1="150" y1="135" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
    <line x1="150" y1="150" x2="120" y2="140" class="image" />
    <line x1="150" y1="150" x2="180" y2="140" class="image" />
  </g>
</svg>