<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .shield { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">protected</text>
  <text x="50" y="120" class="subtitle">[prəˈtektɪd] adj. 受保护的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (在前面) + tect (覆盖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骑士站在城堡前，"在前面覆盖(pro-tect)"
    <tspan x="50" dy="25">着他的盾牌，保护着城堡和人民。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The endangered species are now protected by law.
  </text>
  <text x="50" y="310" class="content">
    这些濒危物种现在受到法律保护。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <polygon points="0,0 100,0 150,50 100,100 0,100" class="shield" />
    <!-- Knight -->
    <circle cx="75" cy="150" r="20" class="image" />
    <line x1="75" y1="170" x2="75" y2="220" class="image" />
    <line x1="75" y1="220" x2="50" y2="250" class="image" />
    <line x1="75" y1="220" x2="100" y2="250" class="image" />
    <line x1="75" y1="200" x2="120" y2="190" class="image" />
    <!-- Castle -->
    <rect x="180" y="50" width="150" height="150" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <line x1="230" y1="50" x2="230" y2="100" class="image" />
    <line x1="260" y1="50" x2="260" y2="100" class="image" />
  </g>
</svg>