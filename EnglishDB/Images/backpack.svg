<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">backpack</text>
  <text x="50" y="120" class="subtitle">[ˈbækˌpæk] n. 背包</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> back (背部) + pack (包裹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在旅行时，将所有必需品"背在背部(back-pack)"，
    <tspan x="50" dy="25">这个包裹就变成了一个背包(backpack)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He carried his books in a backpack to school.
  </text>
  <text x="50" y="310" class="content">
    他把书装在背包里带到学校。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Backpack -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <!-- Straps -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="80" y1="200" x2="120" y2="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="250" r="20" class="image" />
    <line x1="100" y1="270" x2="100" y2="320" class="image" />
    <line x1="100" y1="320" x2="80" y2="350" class="image" />
    <line x1="100" y1="320" x2="120" y2="350" class="image" />
    <line x1="100" y1="290" x2="140" y2="280" class="image" />
  </g>
</svg>