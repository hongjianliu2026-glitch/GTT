<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reclusive</text>
  <text x="50" y="120" class="subtitle">[rɪˈkluːsɪv] adj. 隐居的，孤僻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + clus (关闭) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"向后关闭(re-clus-ive)"自己，远离人群，
    <tspan x="50" dy="25">躲在一个小屋里，过着隐居的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The author was known for his reclusive lifestyle.
  </text>
  <text x="50" y="310" class="content">
    这位作家以其隐居的生活方式而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small house -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="20" y="20" width="110" height="60" class="image" />
    <!-- Door -->
    <rect x="60" y="60" width="30" height="40" class="image" />
    <!-- Person -->
    <circle cx="85" cy="120" r="15" class="image" />
    <line x1="85" y1="135" x2="85" y2="170" class="image" />
    <line x1="85" y1="170" x2="70" y2="200" class="image" />
    <line x1="85" y1="170" x2="100" y2="200" class="image" />
    <line x1="85" y1="150" x2="115" y2="140" class="image" />
  </g>
</svg>