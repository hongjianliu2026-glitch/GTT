<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">affected</text>
  <text x="50" y="120" class="subtitle">[əˈfektɪd] adj. 受影响的，做作的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> af- (朝向) + fect (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在表演时，"朝向(af-)"观众"做(fect)"出夸张的表情，
    <tspan x="50" dy="25">这种做作的行为就是affected。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke in an affected manner, trying to impress everyone.
  </text>
  <text x="50" y="310" class="content">
    她用一种做作的方式说话，试图给每个人留下深刻印象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actor -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Exaggerated expression -->
    <line x1="150" y1="80" x2="200" y2="80" class="image" />
    <line x1="150" y1="80" x2="145" y2="75" class="image" />
    <line x1="200" y1="80" x2="205" y2="75" class="image" />
    <line x1="160" y1="120" x2="190" y2="120" class="image" />
    <line x1="160" y1="120" x2="155" y2="125" class="image" />
    <line x1="190" y1="120" x2="195" y2="125" class="image" />
    <!-- Audience -->
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <circle cx="300" cy="150" r="10" class="image" />
  </g>
</svg>