<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">copier</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːpiər] n. 复印机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> copy (复制) + -er (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台巨大的复印机，"复制(copy)"
    <tspan x="50" dy="25">无数的纸张，这台机器就是复印机(copier)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The copier in the office broke down yesterday.
  </text>
  <text x="50" y="310" class="content">
    办公室的复印机昨天坏了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Copier machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Paper tray -->
    <rect x="50" y="20" width="250" height="30" class="image" />
    <!-- Paper output -->
    <rect x="50" y="150" width="250" height="30" class="image" />
    <!-- Paper -->
    <line x1="70" y1="50" x2="70" y2="150" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="130" y1="50" x2="130" y2="150" class="image" />
    <line x1="160" y1="50" x2="160" y2="150" class="image" />
    <line x1="190" y1="50" x2="190" y2="150" class="image" />
    <line x1="220" y1="50" x2="220" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <!-- Copier body -->
    <rect x="50" y="60" width="250" height="80" class="image" />
    <!-- Buttons -->
    <circle cx="80" cy="100" r="10" class="image" />
    <circle cx="110" cy="100" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
  </g>
</svg>