<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scenery</text>
  <text x="50" y="120" class="subtitle">[ˈsiːnəri] n. 风景，景色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scen (场景) + -ery (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家在户外，"场景(scen)"
    <tspan x="50" dy="25">中捕捉美丽的自然景色，这些景色就构成了风景(scenery)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scenery in the mountains is breathtaking.
  </text>
  <text x="50" y="310" class="content">
    山中的风景令人叹为观止。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,150 100,0 200,150" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" />
    <!-- River -->
    <line x1="0" y1="150" x2="200" y2="150" class="image" />
    <!-- Trees -->
    <line x1="50" y1="150" x2="50" y2="100" class="image" />
    <line x1="70" y1="150" x2="70" y2="110" class="image" />
    <line x1="90" y1="150" x2="90" y2="120" class="image" />
    <!-- Painter -->
    <circle cx="150" cy="200" r="15" class="image" />
    <line x1="150" y1="215" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="130" y2="280" class="image" />
    <line x1="150" y1="250" x2="170" y2="280" class="image" />
    <line x1="150" y1="230" x2="180" y2="220" class="image" />
  </g>
</svg>