<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fulfillment</text>
  <text x="50" y="120" class="subtitle">[fʊlˈfɪlmənt] n. 履行，实现，满足</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ful- (full, 满的) + fill (填充) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的杯子，"被完全填充(ful-fill)"
    <tspan x="50" dy="25">直到溢出，象征着愿望或承诺的完全实现(fulfillment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fulfillment of his dream brought him great joy.
  </text>
  <text x="50" y="310" class="content">
    他的梦想实现给他带来了极大的快乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Liquid -->
    <rect x="10" y="10" width="130" height="190" class="image" fill="#16A085" />
    <!-- Overflow -->
    <rect x="10" y="10" width="130" height="10" class="image" fill="#E74C3C" />
    <!-- Spill -->
    <rect x="10" y="0" width="130" height="10" class="image" fill="#E74C3C" />
  </g>
</svg>