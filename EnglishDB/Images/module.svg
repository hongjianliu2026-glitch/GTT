<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">module</text>
  <text x="50" y="120" class="subtitle">[ˈmɒdjuːl] n. 模块，组件</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mod (模式) + -ule (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机器，由许多"小模式(mod-ule)"
    <tspan x="50" dy="25">组成，每个模块都能独立运作，就像乐高积木一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The software is designed with reusable modules.
  </text>
  <text x="50" y="310" class="content">
    该软件设计有可重复使用的模块。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Module 1 -->
    <rect x="50" y="20" width="80" height="80" class="image" />
    <!-- Module 2 -->
    <rect x="150" y="20" width="80" height="80" class="image" />
    <!-- Module 3 -->
    <rect x="250" y="20" width="80" height="80" class="image" />
    <!-- Module 4 -->
    <rect x="50" y="120" width="80" height="80" class="image" />
    <!-- Module 5 -->
    <rect x="150" y="120" width="80" height="80" class="image" />
    <!-- Module 6 -->
    <rect x="250" y="120" width="80" height="80" class="image" />
  </g>
</svg>