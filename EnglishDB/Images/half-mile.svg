<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">half-mile</text>
  <text x="50" y="120" class="subtitle">[ˈhæf maɪl] n. 半英里</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> half (一半) + mile (英里)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你站在一条直线上，"一半(half)"的距离正好是"一英里(mile)"的一半，
    <tspan x="50" dy="25">这就是半英里(half-mile)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The park is just a half-mile from my house.
  </text>
  <text x="50" y="310" class="content">
    公园离我家只有半英里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path representing the mile -->
    <line x1="0" y1="50" x2="400" y2="50" class="image" />
    <!-- Marking the half-mile point -->
    <line x1="200" y1="40" x2="200" y2="60" class="image" />
    <!-- Person standing at the half-mile point -->
    <circle cx="200" cy="80" r="15" class="image" />
    <line x1="200" y1="95" x2="200" y2="130" class="image" />
    <line x1="200" y1="130" x2="180" y2="160" class="image" />
    <line x1="200" y1="130" x2="220" y2="160" class="image" />
    <line x1="200" y1="110" x2="230" y2="100" class="image" />
  </g>
</svg>