<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compact</text>
  <text x="50" y="120" class="subtitle">[kəmˈpækt] adj. 紧凑的，紧密的；v. 压缩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + pact (压紧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师将一堆物品"一起压紧(com-pact)"，
    <tspan x="50" dy="25">使它们变得非常紧凑，就像一个紧凑的盒子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car's design is compact, making it easy to park.
  </text>
  <text x="50" y="310" class="content">
    这辆车的设计很紧凑，停车很方便。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Items inside the box -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="100" y="30" width="40" height="40" class="image" />
    <line x1="180" y1="30" x2="220" y2="70" class="image" />
    <line x1="180" y1="70" x2="220" y2="30" class="image" />
    <!-- Magic wand -->
    <line x1="280" y1="20" x2="320" y2="60" class="image" />
    <line x1="320" y1="60" x2="300" y2="80" class="image" />
    <line x1="320" y1="60" x2="340" y2="80" class="image" />
  </g>
</svg>