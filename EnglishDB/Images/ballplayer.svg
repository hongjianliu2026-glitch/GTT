<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ballplayer</text>
  <text x="50" y="120" class="subtitle">[ˈbɔːlpleɪər] n. 棒球运动员，球员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ball (球) + player (运动员)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个球员在球场上，"拿着球(ball)"
    <tspan x="50" dy="25">奋力奔跑，他就是个球手(ballplayer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was a famous ballplayer in his youth.
  </text>
  <text x="50" y="310" class="content">
    他年轻时是个著名的球员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ball -->
    <circle cx="50" cy="100" r="30" class="image" fill="#FFD700" />
    <!-- Player -->
    <circle cx="150" cy="100" r="20" class="image" fill="#34495E" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Ball in hand -->
    <line x1="150" y1="120" x2="50" y2="100" class="image" />
  </g>
</svg>