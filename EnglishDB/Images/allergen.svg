<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">allergen</text>
  <text x="50" y="120" class="subtitle">[ˈælərdʒən] n. 过敏原</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> allo- (其他) + erg (工作) + -en (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"其他(allo-)"物质进入身体，"工作(erg)"异常，
    <tspan x="50" dy="25">引发过敏反应，这个物质就是过敏原(allergen)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Peanuts are a common allergen for many people.
  </text>
  <text x="50" y="310" class="content">
    花生是许多人的常见过敏原。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Allergen symbol -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="70" x2="50" y2="130" class="image" />
    <line x1="30" y1="100" x2="70" y2="100" class="image" />
    <!-- Body with allergic reaction -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="200" y1="150" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="150" y2="300" class="image" />
    <line x1="200" y1="250" x2="250" y2="300" class="image" />
    <line x1="200" y1="180" x2="150" y2="220" class="image" />
    <line x1="200" y1="180" x2="250" y2="220" class="image" />
    <!-- Red spots indicating allergic reaction -->
    <circle cx="180" cy="80" r="10" class="image" fill="#E74C3C" />
    <circle cx="220" cy="80" r="10" class="image" fill="#E74C3C" />
    <circle cx="200" cy="120" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>