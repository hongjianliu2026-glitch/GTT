<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reporting</text>
  <text x="50" y="120" class="subtitle">[rɪˈpɔːrtɪŋ] n. 报告，报道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + port (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个记者带着相机，"再次携带(re-port)"
    <tspan x="50" dy="25">信息回到办公室，整理成一篇报道(reporting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The journalist's reporting on the event was thorough.
  </text>
  <text x="50" y="310" class="content">
    这位记者对事件的报道非常详尽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camera -->
    <rect x="0" y="0" width="100" height="80" class="image" />
    <circle cx="50" cy="40" r="20" class="image" />
    <line x1="50" y1="60" x2="50" y2="80" class="image" />
    <!-- Journalist -->
    <circle cx="150" cy="40" r="15" class="image" />
    <line x1="150" y1="55" x2="150" y2="100" class="image" />
    <line x1="150" y1="70" x2="130" y2="90" class="image" />
    <line x1="150" y1="70" x2="170" y2="90" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />
    <!-- Office desk -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <line x1="220" y1="20" x2="330" y2="20" class="image" />
    <line x1="220" y1="40" x2="330" y2="40" class="image" />
    <line x1="220" y1="60" x2="330" y2="60" class="image" />
  </g>
</svg>