<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crowning</text>
  <text x="50" y="120" class="subtitle">[ˈkraʊnɪŋ] adj. 最高的，顶点的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crown (王冠) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的王冠(crown)，它高耸入云，象征着至高无上的地位，这就是"顶点的(crowning)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowning moment of his career was winning the championship.
  </text>
  <text x="50" y="310" class="content">
    他职业生涯的巅峰时刻是赢得冠军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Crown -->
    <path d="M50 50 L100 50 L125 100 L75 100 Z" class="image" />
    <path d="M50 50 L25 100 L75 100 Z" class="image" />
    <path d="M100 50 L125 100 L75 100 Z" class="image" />
    <!-- Clouds -->
    <ellipse cx="75" cy="150" rx="50" ry="20" class="image" />
    <ellipse cx="125" cy="130" rx="40" ry="15" class="image" />
    <ellipse cx="25" cy="130" rx="40" ry="15" class="image" />
  </g>
</svg>