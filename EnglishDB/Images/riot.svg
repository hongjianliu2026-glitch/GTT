<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">riot</text>
  <text x="50" y="120" class="subtitle">[ˈraɪət] n. 暴乱，骚乱；v. 闹事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ri- (上升) + ot (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人聚集在一起，"声音上升(ri-ot)"，
    <tspan x="50" dy="25">情绪激动，最终演变成一场暴乱(riot)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police had to intervene to stop the riot.
  </text>
  <text x="50" y="310" class="content">
    警察不得不介入以制止暴乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowd -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Police -->
    <rect x="300" y="80" width="50" height="40" class="image" />
    <line x1="325" y1="120" x2="325" y2="160" class="image" />
    <line x1="325" y1="160" x2="300" y2="190" class="image" />
    <line x1="325" y1="160" x2="350" y2="190" class="image" />
    <!-- Sound waves -->
    <path d="M50 50 Q100 20 150 50" class="image" />
    <path d="M50 60 Q100 30 150 60" class="image" />
    <path d="M50 70 Q100 40 150 70" class="image" />
  </g>
</svg>