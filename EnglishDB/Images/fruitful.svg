<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fruitful</text>
  <text x="50" y="120" class="subtitle">[ˈfruːtfəl] adj. 富有成效的，多产的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fruit (果实) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵树，"充满果实(fruit-ful)"，
    <tspan x="50" dy="25">树上挂满了各种水果，象征着多产和富有成效。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting was fruitful, and we came up with many ideas.
  </text>
  <text x="50" y="310" class="content">
    会议富有成效，我们提出了许多想法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="150" y="0" width="20" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="160" y1="20" x2="200" y2="100" class="image" />
    <line x1="160" y1="20" x2="120" y2="100" class="image" />
    <line x1="160" y1="100" x2="200" y2="180" class="image" />
    <line x1="160" y1="100" x2="120" y2="180" class="image" />
    <!-- Fruits -->
    <circle cx="200" cy="100" r="15" class="image" fill="#FFD700" />
    <circle cx="120" cy="100" r="15" class="image" fill="#FFD700" />
    <circle cx="200" cy="180" r="15" class="image" fill="#FFD700" />
    <circle cx="120" cy="180" r="15" class="image" fill="#FFD700" />
  </g>
</svg>