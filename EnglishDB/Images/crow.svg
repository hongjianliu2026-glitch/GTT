<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crow</text>
  <text x="50" y="120" class="subtitle">[kroʊ] n. 乌鸦；v. 啼叫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "crowe"，意为乌鸦。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只乌鸦站在树枝上，"啼叫(crow)"
    <tspan x="50" dy="25">的声音响彻整个森林，仿佛在宣告它的存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crow cawed loudly at dawn.
  </text>
  <text x="50" y="310" class="content">
    乌鸦在黎明时分大声啼叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree branch -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Crow -->
    <circle cx="175" cy="0" r="20" class="image" />
    <line x1="175" y1="20" x2="175" y2="60" class="image" />
    <line x1="175" y1="40" x2="155" y2="20" class="image" />
    <line x1="175" y1="40" x2="195" y2="20" class="image" />
    <line x1="175" y1="60" x2="155" y2="80" class="image" />
    <line x1="175" y1="60" x2="195" y2="80" class="image" />
    <!-- Cawing sound -->
    <text x="200" y="30" class="content">"Caw!"</text>
  </g>
</svg>