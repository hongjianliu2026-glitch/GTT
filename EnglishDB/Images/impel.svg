<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impel</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpel] v. 推动，驱使</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (向内) + pel (推)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手掌从天而降，"向内推动(im-pel)"
    <tspan x="50" dy="25">一个物体，迫使它前进。这种力量驱使(impel)着一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The strong wind impelled the boat forward.
  </text>
  <text x="50" y="310" class="content">
    强风推动着船向前。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand pushing -->
    <path d="M 0 0 L 50 50 L 100 0 Z" class="image" />
    <!-- Object being pushed -->
    <rect x="110" y="20" width="50" height="30" class="image" />
    <!-- Arrow indicating direction -->
    <line x1="135" y1="35" x2="180" y2="35" class="image" />
    <polygon points="180,30 180,40 190,35" class="image" />
  </g>
</svg>