<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">substrate</text>
  <text x="50" y="120" class="subtitle">[ˈsʌbstreɪt] n. 基质，底层</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + strate (层)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的建筑工地，"在下面(sub-)"
    <tspan x="50" dy="25">有一层坚固的"层(strate)"，这就是基质(substrate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The substrate of the painting is made of wood.
  </text>
  <text x="50" y="310" class="content">
    这幅画的基质是木头做的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground layer -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Building on top -->
    <rect x="100" y="10" width="150" height="80" class="image" />
    <!-- Construction worker -->
    <circle cx="50" cy="60" r="15" class="image" />
    <line x1="50" y1="75" x2="50" y2="110" class="image" />
    <line x1="50" y1="110" x2="30" y2="140" class="image" />
    <line x1="50" y1="110" x2="70" y2="140" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
  </g>
</svg>