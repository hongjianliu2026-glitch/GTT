<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rubber</text>
  <text x="50" y="120" class="subtitle">[ˈrʌbər] n. 橡皮，橡胶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rub (摩擦) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在用橡皮"摩擦(rub)"
    <tspan x="50" dy="25">纸上的错误，橡皮(rubber)就是用来擦除错误的工具。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a rubber to erase his mistakes.
  </text>
  <text x="50" y="310" class="content">
    他用橡皮擦掉了错误。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rubber -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <!-- Eraser -->
    <rect x="20" y="10" width="60" height="30" class="image" />
    <!-- Paper -->
    <rect x="120" y="0" width="150" height="100" class="image" />
    <!-- Mistake -->
    <line x1="140" y1="20" x2="260" y2="20" class="image" />
    <line x1="140" y1="40" x2="260" y2="40" class="image" />
    <line x1="140" y1="60" x2="260" y2="60" class="image" />
    <line x1="140" y1="80" x2="260" y2="80" class="image" />
    <!-- Student -->
    <circle cx="300" cy="50" r="15" class="image" />
    <line x1="300" y1="65" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="280" y2="130" class="image" />
    <line x1="300" y1="100" x2="320" y2="130" class="image" />
    <line x1="300" y1="80" x2="330" y2="70" class="image" />
  </g>
</svg>