<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">advanced</text>
  <text x="50" y="120" class="subtitle">[ədˈvænst] adj. 先进的，高级的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + vance (前进)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在跑步比赛中，"朝向(ad-)"
    <tspan x="50" dy="25">终点"前进(vance)"，他跑得比别人快，</tspan>
    <tspan x="50" dy="25">这就是"先进的(advanced)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has advanced technology in its field.
  </text>
  <text x="50" y="310" class="content">
    这家公司在该领域拥有先进的技术。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <!-- Runner -->
    <circle cx="50" cy="110" r="15" class="image" />
    <line x1="50" y1="125" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Finish line -->
    <line x1="300" y1="80" x2="300" y2="160" class="image" />
    <line x1="320" y1="80" x2="320" y2="160" class="image" />
    <line x1="300" y1="80" x2="320" y2="80" class="image" />
    <line x1="300" y1="160" x2="320" y2="160" class="image" />
  </g>
</svg>