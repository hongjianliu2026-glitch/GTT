<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cataract</text>
  <text x="50" y="120" class="subtitle">[ˈkætərækt] n. 白内障；大瀑布</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cata- (向下) + rach (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的瀑布从高处"向下落下(cata-rach)"，
    <tspan x="50" dy="25">水流如白内障般遮蔽了视线，这就是"cataract"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cataract surgery restored her vision.
  </text>
  <text x="50" y="310" class="content">
    白内障手术恢复了她的视力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Waterfall -->
    <path d="M0 0 L50 150 L100 0 Z" class="image" />
    <path d="M50 150 L100 300 L150 150 Z" class="image" />
    <path d="M100 300 L150 450 L200 300 Z" class="image" />
    <!-- Water drops -->
    <circle cx="75" cy="100" r="5" class="image" />
    <circle cx="125" cy="250" r="5" class="image" />
    <circle cx="175" cy="400" r="5" class="image" />
  </g>
</svg>