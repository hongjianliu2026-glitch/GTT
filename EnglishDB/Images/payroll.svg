<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">payroll</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪroʊl] n. 工资单，薪水册</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pay (支付) + roll (名单)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工资单(payroll)，上面列满了员工的薪水，
    <tspan x="50" dy="25">每个名字旁边都有一个数字，代表他们的工资。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's payroll includes over 500 employees.
  </text>
  <text x="50" y="310" class="content">
    公司的工资单包括了500多名员工。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Payroll list -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Names -->
    <text x="20" y="40" class="content">John Doe: $5000</text>
    <text x="20" y="70" class="content">Jane Smith: $6000</text>
    <text x="20" y="100" class="content">Mike Johnson: $5500</text>
    <text x="20" y="130" class="content">Emily Davis: $5200</text>
    <!-- Money bag -->
    <rect x="280" y="150" width="50" height="50" class="image" />
    <line x1="280" y1="150" x2="330" y2="150" class="image" />
    <line x1="280" y1="200" x2="330" y2="200" class="image" />
    <line x1="280" y1="150" x2="280" y2="200" class="image" />
    <line x1="330" y1="150" x2="330" y2="200" class="image" />
    <line x1="280" y1="175" x2="330" y2="175" class="image" />
  </g>
</svg>