<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bulimia</text>
  <text x="50" y="120" class="subtitle">[bjuˈliːmiə] n. 暴食症</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> boulē (渴望) + -ia (病症)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"渴望(boulē)"食物的欲望所控制，
    <tspan x="50" dy="25">不停地进食，然后又感到极度内疚，这种病症就是暴食症(bulimia)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was diagnosed with bulimia last year.
  </text>
  <text x="50" y="310" class="content">
    她去年被诊断出患有暴食症。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Food -->
    <rect x="50" y="80" width="30" height="30" class="image" />
    <rect x="90" y="80" width="30" height="30" class="image" />
    <rect x="130" y="80" width="30" height="30" class="image" />
    <rect x="170" y="80" width="30" height="30" class="image" />
    <!-- Guilt -->
    <line x1="20" y1="200" x2="20" y2="250" class="image" />
    <line x1="20" y1="225" x2="0" y2="225" class="image" />
    <line x1="20" y1="225" x2="40" y2="225" class="image" />
  </g>
</svg>