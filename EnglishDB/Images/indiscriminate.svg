<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indiscriminate</text>
  <text x="50" y="120" class="subtitle">[ˌɪndɪˈskrɪmɪnət] adj. 不加选择的，随意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + dis- (分开) + crimin (选择) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在超市里，"不加选择地(in-dis-criminate)"
    <tspan x="50" dy="25">抓起各种商品，不管是什么都放进购物车里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made an indiscriminate purchase of snacks.
  </text>
  <text x="50" y="310" class="content">
    她随意地购买了一大堆零食。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shopping cart -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Random items -->
    <circle cx="70" cy="50" r="15" class="image" /> <!-- Item 1 -->
    <rect x="100" y="40" width="30" height="30" class="image" /> <!-- Item 2 -->
    <line x1="150" y1="40" x2="180" y2="70" class="image" /> <!-- Item 3 -->
    <circle cx="200" cy="50" r="15" class="image" /> <!-- Item 4 -->
    <rect x="230" y="40" width="30" height="30" class="image" /> <!-- Item 5 -->
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>