<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trying</text>
  <text x="50" y="120" class="subtitle">[ˈtraɪɪŋ] adj. 费力的，困难的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> try (尝试) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在努力"尝试(try)"搬起一块巨大的石头，
    <tspan x="50" dy="25">这个过程非常"费力(trying)"，他的脸上满是汗水。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Climbing the mountain was a trying experience.
  </text>
  <text x="50" y="310" class="content">
    爬山是一次费力的经历。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large stone -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Person trying to lift the stone -->
    <circle cx="100" cy="200" r="20" class="image" />
    <line x1="100" y1="220" x2="100" y2="300" class="image" />
    <line x1="100" y1="260" x2="50" y2="240" class="image" />
    <line x1="100" y1="260" x2="150" y2="240" class="image" />
    <line x1="100" y1="300" x2="50" y2="350" class="image" />
    <line x1="100" y1="300" x2="150" y2="350" class="image" />
    <!-- Sweat drops -->
    <circle cx="80" cy="230" r="5" class="image" />
    <circle cx="120" cy="230" r="5" class="image" />
  </g>
</svg>