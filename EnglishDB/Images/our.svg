<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">our</text>
  <text x="50" y="120" class="subtitle">[aʊər] pron. 我们的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> our (源自中古英语，表示“我们的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，共同拥有(our)
    <tspan x="50" dy="25">一件物品，这件物品象征着他们的共同归属和联系。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Our team won the championship last night.
  </text>
  <text x="50" y="310" class="content">
    我们的团队昨晚赢得了冠军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Shared object -->
    <rect x="80" y="150" width="40" height="40" class="image" />
    <!-- Connecting lines -->
    <line x1="70" y1="70" x2="100" y2="170" class="image" />
    <line x1="170" y1="70" x2="100" y2="170" class="image" />
    <line x1="120" y1="120" x2="100" y2="170" class="image" />
  </g>
</svg>