<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lung</text>
  <text x="50" y="120" class="subtitle">[lʌŋ] n. 肺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lun (月亮) + g (连接字母)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的月亮(lun)挂在天空中，它的光芒照亮了整个世界，
    <tspan x="50" dy="25">就像肺(lung)为我们的身体提供氧气一样，让生命得以延续。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Smoking can damage your lungs.
  </text>
  <text x="50" y="310" class="content">
    吸烟会损害你的肺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Lungs -->
    <path d="M 200 50 Q 250 100 200 150 Q 150 100 200 50" class="image" fill="#E74C3C" />
    <path d="M 300 50 Q 350 100 300 150 Q 250 100 300 50" class="image" fill="#E74C3C" />
    <!-- Text annotations -->
    <text x="100" y="200" class="content" fill="#2C3E50">月亮</text>
    <text x="200" y="200" class="content" fill="#2C3E50">肺</text>
  </g>
</svg>