<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pirate</text>
  <text x="50" y="120" class="subtitle">[ˈpaɪrət] n. 海盗，盗版者；v. 盗版，掠夺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pir (掠夺) + ate (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个海盗船长，手持弯刀，"掠夺(pir)"
    <tspan x="50" dy="25">海上的一切，这就是海盗(pirate)的本质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was pirated and distributed online.
  </text>
  <text x="50" y="310" class="content">
    这部电影被非法盗版并在网上传播。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pirate ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 250,150 200,120 50,120" class="image" />
    <!-- Pirate flag -->
    <rect x="150" y="20" width="50" height="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="120" class="image" />
    <circle cx="175" cy="70" r="20" class="image" />
    <!-- Pirate -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
    <line x1="100" y1="175" x2="70" y2="165" class="image" />
  </g>
</svg>