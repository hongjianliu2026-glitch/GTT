<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">morbid</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrbɪd] adj. 病态的，不正常的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> morb (疾病) + -id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"疾病(morb)"缠身，
    <tspan x="50" dy="25">他的脸色苍白，眼神呆滞，这就是"病态的(morbid)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The morbid fascination with death is disturbing.
  </text>
  <text x="50" y="310" class="content">
    对死亡的病态迷恋令人不安。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sick person -->
    <circle cx="50" cy="100" r="30" class="image" fill="#D7DBDD" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Sick face -->
    <circle cx="50" cy="80" r="5" class="image" fill="#000" />
    <circle cx="65" cy="80" r="5" class="image" fill="#000" />
    <line x1="50" y1="100" x2="65" y2="100" class="image" />
    <!-- Sick aura -->
    <circle cx="50" cy="100" r="50" class="image" stroke-dasharray="5,5" />
  </g>
</svg>