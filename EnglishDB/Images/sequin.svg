<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sequin { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sequin</text>
  <text x="50" y="120" class="subtitle">[ˈsiːkwɪn] n. 亮片，闪光片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sequ (跟随) + in (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件闪闪发光的舞裙，上面缀满了"跟随(sequ)"着舞者
    <tspan x="50" dy="25">闪烁的小亮片(sequin)，它们在灯光下熠熠生辉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dress was adorned with sequins that sparkled under the lights.
  </text>
  <text x="50" y="310" class="content">
    这件衣服上装饰着在灯光下闪闪发光的亮片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dress -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sequins -->
    <circle cx="50" cy="50" r="10" class="sequin" />
    <circle cx="80" cy="70" r="10" class="sequin" />
    <circle cx="110" cy="90" r="10" class="sequin" />
    <circle cx="140" cy="110" r="10" class="sequin" />
    <circle cx="170" cy="130" r="10" class="sequin" />
    <circle cx="200" cy="150" r="10" class="sequin" />
    <circle cx="230" cy="170" r="10" class="sequin" />
    <circle cx="260" cy="190" r="10" class="sequin" />
    <circle cx="290" cy="210" r="10" class="sequin" />
    <circle cx="320" cy="230" r="10" class="sequin" />
  </g>
</svg>