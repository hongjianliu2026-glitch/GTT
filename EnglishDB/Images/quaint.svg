<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quaint</text>
  <text x="50" y="120" class="subtitle">[kweɪnt] adj. 古雅的，离奇有趣的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> qua- (来自拉丁语 "quam"，意为 "如何") + int (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的村庄，"如何(qua-)"
    <tspan x="50" dy="25">变得如此古雅(int)，充满了离奇有趣的故事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The quaint little village attracted many tourists.
  </text>
  <text x="50" y="310" class="content">
    这个古雅的小村庄吸引了许多游客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Old house -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="20" x2="75" y2="0" class="image" />
    <line x1="75" y1="0" x2="100" y2="20" class="image" />
    <!-- Old tree -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <line x1="200" y1="175" x2="150" y2="150" class="image" />
    <line x1="200" y1="175" x2="250" y2="150" class="image" />
    <line x1="200" y1="200" x2="150" y2="225" class="image" />
    <line x1="200" y1="200" x2="250" y2="225" class="image" />
  </g>
</svg>