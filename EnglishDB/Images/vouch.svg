<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vouch</text>
  <text x="50" y="120" class="subtitle">[vaʊtʃ] v. 担保，证明</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> voc (声音) + -h (加强)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在法庭上，大声"发出声音(voc-h)"
    <tspan x="50" dy="25">来担保某人的清白，这就是"vouch"的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He vouched for her honesty.
  </text>
  <text x="50" y="310" class="content">
    他为她担保她的诚实。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Defendant -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Vouching person -->
    <circle cx="125" cy="150" r="15" class="image" />
    <line x1="125" y1="165" x2="125" y2="200" class="image" />
    <line x1="125" y1="200" x2="105" y2="230" class="image" />
    <line x1="125" y1="200" x2="145" y2="230" class="image" />
    <line x1="125" y1="180" x2="155" y2="170" class="image" />
    <!-- Speech bubble -->
    <path d="M 125 120 Q 150 110 175 120 Q 150 130 125 120" class="image" />
    <text x="130" y="125" class="content">I vouch!</text>
  </g>
</svg>