<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flower { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flower</text>
  <text x="50" y="120" class="subtitle">[ˈflaʊər] n. 花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flow (流动) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵花在微风中轻轻摇曳，"流动(flow)"
    <tspan x="50" dy="25">的姿态就像它在跳舞，这就是花的美丽(flower)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She picked a beautiful flower from the garden.
  </text>
  <text x="50" y="310" class="content">
    她从花园里摘了一朵美丽的花。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower stem -->
    <line x1="175" y1="0" x2="175" y2="150" class="image" />
    <!-- Flower petals -->
    <circle cx="175" cy="100" r="50" class="flower" />
    <circle cx="135" cy="75" r="20" class="flower" />
    <circle cx="215" cy="75" r="20" class="flower" />
    <circle cx="135" cy="125" r="20" class="flower" />
    <circle cx="215" cy="125" r="20" class="flower" />
  </g>
</svg>