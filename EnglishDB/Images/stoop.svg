<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stoop</text>
  <text x="50" y="120" class="subtitle">[stuːp] v. 弯腰，屈身；n. 门廊，台阶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + -oop (向下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人原本"站立(st-)"得笔直，突然"向下(-oop)"弯腰，
    <tspan x="50" dy="25">这就是"stoop"的动作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had to stoop to pick up the fallen book.
  </text>
  <text x="50" y="310" class="content">
    她不得不弯腰去捡掉落的书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing straight -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="200" class="image" />
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="50" y1="50" x2="30" y2="80" class="image" />
    <line x1="50" y1="50" x2="70" y2="80" class="image" />
    <circle cx="50" cy="10" r="10" class="image" />

    <!-- Person stooping -->
    <line x1="200" y1="20" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="150" class="image" />
    <line x1="200" y1="100" x2="220" y2="150" class="image" />
    <line x1="200" y1="70" x2="180" y2="100" class="image" />
    <line x1="200" y1="70" x2="220" y2="100" class="image" />
    <circle cx="200" cy="10" r="10" class="image" />

    <!-- Arrow indicating the stoop -->
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <polygon points="180,100 170,95 170,105" class="image" />
  </g>
</svg>