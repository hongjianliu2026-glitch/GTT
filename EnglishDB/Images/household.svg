<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">household</text>
  <text x="50" y="120" class="subtitle">[ˈhaʊshəʊld] n. 家庭，户</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> house (房子) + hold (持有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温馨的房子里，"持有(hold)"着一家人，
    <tspan x="50" dy="25">他们共同生活，构成了一个家庭(household)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The household chores were shared equally among the family members.
  </text>
  <text x="50" y="310" class="content">
    家务活在家庭成员之间平均分配。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,20 350,180" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="80" class="image" />
    <!-- Family members -->
    <circle cx="80" cy="150" r="15" class="image" />
    <line x1="80" y1="165" x2="80" y2="190" class="image" />
    <line x1="80" y1="190" x2="60" y2="220" class="image" />
    <line x1="80" y1="190" x2="100" y2="220" class="image" />
    <line x1="80" y1="175" x2="110" y2="165" class="image" />
    <circle cx="120" cy="150" r="15" class="image" />
    <line x1="120" y1="165" x2="120" y2="190" class="image" />
    <line x1="120" y1="190" x2="100" y2="220" class="image" />
    <line x1="120" y1="190" x2="140" y2="220" class="image" />
    <line x1="120" y1="175" x2="150" y2="165" class="image" />
  </g>
</svg>