<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">veranda</text>
  <text x="50" y="120" class="subtitle">[vəˈrændə] n. 阳台，走廊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ver (真实) + and (连接) + a (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个真实的(ver)连接(and)到房屋的阳台(a)，
    <tspan x="50" dy="25">就像一个延伸的走廊，让你可以享受户外的美好时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They sat on the veranda, enjoying the sunset.
  </text>
  <text x="50" y="310" class="content">
    他们坐在阳台上，享受着日落的美景。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Veranda -->
    <rect x="0" y="150" width="200" height="50" class="image" />
    <!-- Pillars -->
    <line x1="20" y1="150" x2="20" y2="200" class="image" />
    <line x1="180" y1="150" x2="180" y2="200" class="image" />
    <!-- Railing -->
    <line x1="0" y1="150" x2="200" y2="150" class="image" />
    <!-- Chairs -->
    <rect x="30" y="160" width="30" height="30" class="image" />
    <rect x="140" y="160" width="30" height="30" class="image" />
  </g>
</svg>