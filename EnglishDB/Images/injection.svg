<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">injection</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdʒekʃn] n. 注射，注入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + ject (投掷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生拿着注射器，"投掷(ject)"
    <tspan x="50" dy="25">药物进入(in)病人的身体，这就是注射(injection)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nurse gave him an injection to reduce the pain.
  </text>
  <text x="50" y="310" class="content">
    护士给他打了一针以减轻疼痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Syringe -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <rect x="30" y="30" width="40" height="140" class="image" />
    <!-- Liquid -->
    <line x1="50" y1="30" x2="50" y2="170" class="image" />
    <line x1="50" y1="30" x2="45" y2="40" class="image" />
    <line x1="50" y1="30" x2="55" y2="40" class="image" />
    <line x1="50" y1="170" x2="45" y2="160" class="image" />
    <line x1="50" y1="170" x2="55" y2="160" class="image" />
    <!-- Doctor -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
  </g>
</svg>