<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transmitter</text>
  <text x="50" y="120" class="subtitle">[trænsˈmɪtər] n. 发射器，传送器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + mit (发送) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的发射器，"跨越(trans-)"
    <tspan x="50" dy="25">空间，将信号"发送(mit)"到远方，</tspan>
    <tspan x="50" dy="25">这个装置就是发射器(transmitter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The satellite uses a powerful transmitter to broadcast signals.
  </text>
  <text x="50" y="310" class="content">
    卫星使用强大的发射器来广播信号。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Transmitter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Antenna -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="175" y1="20" x2="150" y2="60" class="image" />
    <line x1="175" y1="20" x2="200" y2="60" class="image" />
    <line x1="175" y1="60" x2="150" y2="100" class="image" />
    <line x1="175" y1="60" x2="200" y2="100" class="image" />
    <line x1="175" y1="100" x2="150" y2="140" class="image" />
    <line x1="175" y1="100" x2="200" y2="140" class="image" />
    <!-- Signal lines -->
    <line x1="175" y1="180" x2="100" y2="250" class="image" />
    <line x1="175" y1="180" x2="250" y2="250" class="image" />
    <line x1="175" y1="180" x2="300" y2="250" class="image" />
  </g>
</svg>