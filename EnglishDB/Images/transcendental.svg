<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transcendental</text>
  <text x="50" y="120" class="subtitle">[ˌtrænsənˈdɛntl] adj. 超越的，卓越的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (超越) + -scend (攀登) + -ental (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在攀登一座高山，"超越(trans-)"
    <tspan x="50" dy="25">了平凡的境界，达到了卓越(transcendental)的境界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His transcendental philosophy influenced many thinkers.
  </text>
  <text x="50" y="310" class="content">
    他的卓越哲学影响了众多思想家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 0 L200 200 Z" class="image" />
    <!-- Climber -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="90" y2="180" class="image" />
    <line x1="100" y1="150" x2="110" y2="180" class="image" />
    <line x1="100" y1="130" x2="120" y2="120" class="image" />
  </g>
</svg>