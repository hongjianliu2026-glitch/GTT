<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bemoan</text>
  <text x="50" y="120" class="subtitle">[bɪˈmoʊn] v. 悲叹，哀悼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + moan (呻吟)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为失去心爱的东西而"使劲呻吟(be-moan)"，
    <tspan x="50" dy="25">他的脸上充满了悲伤和哀悼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bemoaned the loss of her favorite toy.
  </text>
  <text x="50" y="310" class="content">
    她为失去她最喜欢的玩具而悲叹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Moaning expression -->
    <line x1="40" y1="90" x2="60" y2="90" class="image" />
    <line x1="45" y1="85" x2="55" y2="85" class="image" />
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
    <line x1="45" y1="115" x2="55" y2="115" class="image" />
    <!-- Lost object -->
    <rect x="150" y="80" width="50" height="50" class="image" />
    <line x1="150" y1="80" x2="200" y2="130" class="image" />
    <line x1="200" y1="80" x2="150" y2="130" class="image" />
  </g>
</svg>