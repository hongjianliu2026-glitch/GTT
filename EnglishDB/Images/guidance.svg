<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">guidance</text>
  <text x="50" y="120" class="subtitle">[ˈɡaɪdns] n. 指导，引导</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> guid (引导) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个迷路的人，"引导(guid)"
    <tspan x="50" dy="25">他走向正确的方向，这就是指导(guidance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She provided valuable guidance during the project.
  </text>
  <text x="50" y="310" class="content">
    她在项目中提供了宝贵的指导。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path -->
    <path d="M50 50 Q150 150 250 50" class="image" />
    <!-- Person -->
    <circle cx="70" cy="50" r="15" class="image" />
    <line x1="70" y1="65" x2="70" y2="100" class="image" />
    <line x1="70" y1="100" x2="50" y2="130" class="image" />
    <line x1="70" y1="100" x2="90" y2="130" class="image" />
    <line x1="70" y1="80" x2="100" y2="70" class="image" />
    <!-- Arrow -->
    <polygon points="250,50 240,40 240,60" class="image" />
  </g>
</svg>