<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Belgian</text>
  <text x="50" y="120" class="subtitle">[ˈbɛldʒən] adj. 比利时的；n. 比利时人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Belg- (源自凯尔特语，意为“勇敢的”) + -ian (表示“属于...的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的比利时人(Belg-ian)，
    <tspan x="50" dy="25">手持比利时国旗，站在欧洲地图上，</tspan>
    <tspan x="50" dy="25">象征着比利时的勇敢与骄傲。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Belgian chocolate is famous worldwide.
  </text>
  <text x="50" y="310" class="content">
    比利时的巧克力闻名世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- European map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Belgium location -->
    <rect x="100" y="50" width="50" height="50" class="image" />
    <!-- Belgian flag -->
    <rect x="110" y="60" width="10" height="30" fill="#000000" />
    <rect x="120" y="60" width="10" height="30" fill="#FF0000" />
    <rect x="130" y="60" width="10" height="30" fill="#FFCC00" />
    <!-- Person -->
    <circle cx="120" cy="120" r="15" class="image" />
    <line x1="120" y1="135" x2="120" y2="170" class="image" />
    <line x1="120" y1="170" x2="100" y2="200" class="image" />
    <line x1="120" y1="170" x2="140" y2="200" class="image" />
    <line x1="120" y1="150" x2="150" y2="140" class="image" />
  </g>
</svg>