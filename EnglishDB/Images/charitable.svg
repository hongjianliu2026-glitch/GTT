<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">charitable</text>
  <text x="50" y="120" class="subtitle">[ˈtʃærɪtəbl] adj. 慈善的，慷慨的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> charit (爱) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满爱心的人，"爱(charit)"
    <tspan x="50" dy="25">心满满地捐赠物品，这种行为就是慈善的(charitable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is known for her charitable donations to the community.
  </text>
  <text x="50" y="310" class="content">
    她因对社区的慈善捐赠而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 40 C10 10, 40 10, 40 40 S70 70, 40 100 S10 70, 10 40" class="image" />
    <!-- Hand giving -->
    <line x1="50" y1="110" x2="80" y2="140" class="image" />
    <line x1="50" y1="110" x2="20" y2="140" class="image" />
    <line x1="50" y1="110" x2="50" y2="140" class="image" />
    <!-- Donation box -->
    <rect x="20" y="150" width="60" height="30" class="image" />
    <line x1="30" y1="160" x2="70" y2="160" class="image" />
    <line x1="30" y1="170" x2="70" y2="170" class="image" />
    <line x1="30" y1="180" x2="70" y2="180" class="image" />
  </g>
</svg>