<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overeat</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvəˈriːt] v. 吃得过多，暴食</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (过度) + eat (吃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在餐桌前，面前堆满了食物，"过度地吃(over-eat)"
    <tspan x="50" dy="25">以至于肚子都鼓起来了，这就是暴食(overeat)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He often overeats during the holidays.
  </text>
  <text x="50" y="310" class="content">
    他经常在假期吃得过多。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="30" class="image" /> <!-- Pizza -->
    <rect x="150" y="70" width="60" height="60" class="image" /> <!-- Burger -->
    <rect x="220" y="80" width="40" height="40" class="image" /> <!-- Fries -->
    <!-- Person -->
    <circle cx="50" cy="150" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="170" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="180" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Overstuffed stomach -->
    <circle cx="50" cy="200" r="30" class="image" />
  </g>
</svg>