<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">melon</text>
  <text x="50" y="120" class="subtitle">[ˈmelən] n. 瓜，甜瓜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> melo- (甜) + -on (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的甜瓜(melon)，它的甜味(melo-)
    <tspan x="50" dy="25">让人忍不住想咬一口，这就是甜瓜的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sliced the melon and shared it with her friends.
  </text>
  <text x="50" y="310" class="content">
    她把甜瓜切开，和朋友们分享。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Melon -->
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Slice -->
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <!-- Seeds -->
    <circle cx="125" cy="80" r="5" class="image" />
    <circle cx="150" cy="90" r="5" class="image" />
    <circle cx="175" cy="80" r="5" class="image" />
    <circle cx="200" cy="90" r="5" class="image" />
    <circle cx="225" cy="80" r="5" class="image" />
  </g>
</svg>