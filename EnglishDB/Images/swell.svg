<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swell</text>
  <text x="50" y="120" class="subtitle">[swɛl] v. 膨胀，增大；n. 膨胀，增大</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (加强) + well (泉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个泉眼，"加强(s-)"
    <tspan x="50" dy="25">喷涌而出，水流不断增大(swell)，</tspan>
    <tspan x="50" dy="25">最终形成了一个巨大的水柱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The river swelled after the heavy rain.
  </text>
  <text x="50" y="310" class="content">
    大雨过后，河水暴涨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Well -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Water flow -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <!-- Water column -->
    <rect x="75" y="300" width="50" height="100" class="image" />
  </g>
</svg>