<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9F9F9; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whiteness</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪtnəs] n. 白色，洁白</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> white (白色) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片无尽的雪原，"白色(white)"
    <tspan x="50" dy="25">覆盖了整个世界，这就是"洁白(whiteness)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The whiteness of the snow was blinding.
  </text>
  <text x="50" y="310" class="content">
    雪的洁白让人目眩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowfield -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#FFFFFF" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#FFD700" />
    <!-- Snowflakes -->
    <line x1="50" y1="20" x2="70" y2="40" class="image" />
    <line x1="50" y1="40" x2="70" y2="20" class="image" />
    <line x1="150" y1="20" x2="170" y2="40" class="image" />
    <line x1="150" y1="40" x2="170" y2="20" class="image" />
    <line x1="250" y1="20" x2="270" y2="40" class="image" />
    <line x1="250" y1="40" x2="270" y2="20" class="image" />
  </g>
</svg>