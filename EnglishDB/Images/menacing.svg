<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">menacing</text>
  <text x="50" y="120" class="subtitle">[ˈmɛnəsɪŋ] adj. 威胁的，险恶的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> men (威胁) + -ace (表示状态或性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的阴影笼罩着城市，"威胁(men)"
    <tspan x="50" dy="25">着每一个角落，这种险恶(menacing)的氛围让人不寒而栗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dark clouds made the sky look menacing.
  </text>
  <text x="50" y="310" class="content">
    乌云密布的天空显得十分险恶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shadow -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" opacity="0.5" />
    <!-- City skyline -->
    <rect x="50" y="100" width="50" height="100" class="image" fill="#7F8C8D" />
    <rect x="120" y="80" width="50" height="120" class="image" fill="#7F8C8D" />
    <rect x="190" y="120" width="50" height="80" class="image" fill="#7F8C8D" />
    <rect x="260" y="90" width="50" height="110" class="image" fill="#7F8C8D" />
    <!-- Lightning -->
    <line x1="100" y1="50" x2="150" y2="150" class="image" stroke="#E74C3C" stroke-width="4" />
    <line x1="200" y1="50" x2="250" y2="150" class="image" stroke="#E74C3C" stroke-width="4" />
  </g>
</svg>