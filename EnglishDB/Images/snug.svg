<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snug</text>
  <text x="50" y="120" class="subtitle">[snʌɡ] adj. 舒适的，紧贴的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snug (来自中古英语 snugge，意为“温暖、舒适”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温暖的冬夜，你蜷缩在一张
    <tspan x="50" dy="25">舒适的沙发上，身上裹着一条柔软的毯子，</tspan>
    <tspan x="50" dy="25">这种感觉就是“snug”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt snug in her new winter coat.
  </text>
  <text x="50" y="310" class="content">
    她穿着新冬衣感觉很舒适。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sofa -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Blanket -->
    <rect x="180" y="80" width="40" height="40" class="image" />
    <rect x="170" y="70" width="60" height="60" class="image" />
    <rect x="160" y="60" width="80" height="80" class="image" />
  </g>
</svg>