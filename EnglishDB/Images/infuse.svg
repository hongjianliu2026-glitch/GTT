<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infuse</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfjuːz] v. 注入，灌输</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + fuse (流)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个茶壶，"将茶(in-fuse)"
    <tspan x="50" dy="25">倒入杯中，茶水缓缓流入，注入(infuse)了新的味道。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She infused the room with the scent of lavender.
  </text>
  <text x="50" y="310" class="content">
    她用薰衣草的香味充满了房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teapot -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="50" y="100" width="50" height="50" class="image" />
    <!-- Teacup -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <!-- Liquid flow -->
    <line x1="125" y1="100" x2="250" y2="75" class="image" />
    <line x1="125" y1="110" x2="250" y2="85" class="image" />
    <line x1="125" y1="120" x2="250" y2="95" class="image" />
  </g>
</svg>