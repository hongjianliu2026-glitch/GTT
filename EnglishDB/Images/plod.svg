<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plod</text>
  <text x="50" y="120" class="subtitle">[plɒd] v. 沉重缓慢地走</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plod (来自中古英语 plodden, 意为沉重地走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头大象在泥泞的路上"沉重缓慢地走(plod)"，
    <tspan x="50" dy="25">每一步都留下深深的脚印，这就是plod的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He plodded through the snow to reach the cabin.
  </text>
  <text x="50" y="310" class="content">
    他艰难地穿过雪地，到达了小屋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elephant -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <rect x="40" y="130" width="20" height="50" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="50" y2="230" class="image" /> <!-- Leg 1 -->
    <line x1="70" y1="180" x2="70" y2="230" class="image" /> <!-- Leg 2 -->
    <line x1="30" y1="180" x2="30" y2="230" class="image" /> <!-- Leg 3 -->
    <line x1="90" y1="180" x2="90" y2="230" class="image" /> <!-- Leg 4 -->
    <!-- Muddy path -->
    <line x1="0" y1="250" x2="200" y2="250" class="image" />
    <line x1="0" y1="260" x2="200" y2="260" class="image" />
    <line x1="0" y1="270" x2="200" y2="270" class="image" />
    <!-- Footprints -->
    <circle cx="50" cy="260" r="10" class="image" />
    <circle cx="100" cy="260" r="10" class="image" />
    <circle cx="150" cy="260" r="10" class="image" />
  </g>
</svg>