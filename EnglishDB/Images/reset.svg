<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reset</text>
  <text x="50" y="120" class="subtitle">[ˈriːsɛt] v. 重置，重新设定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + set (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个按钮被按下，"再次放置(re-set)"
    <tspan x="50" dy="25">一切回到原点，就像时间被重置(reset)了一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the crash, he had to reset the computer.
  </text>
  <text x="50" y="310" class="content">
    崩溃后，他不得不重置电脑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Button -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <text x="20" y="30" class="content" fill="#34495E">RESET</text>
    <!-- Arrow -->
    <line x1="120" y1="25" x2="180" y2="25" class="image" />
    <polygon points="180,25 170,20 170,30" class="image" />
    <!-- Clock -->
    <circle cx="250" cy="25" r="20" class="image" />
    <line x1="250" y1="25" x2="250" y2="10" class="image" />
    <line x1="250" y1="25" x2="240" y2="35" class="image" />
  </g>
</svg>