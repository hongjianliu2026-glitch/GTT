<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">individual</text>
  <text x="50" y="120" class="subtitle">[ˌɪndɪˈvɪdʒuəl] n. 个人，个体；adj. 个别的，独特的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + dividu (分开) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人被"分开(dividu)"，每个人都是"不(in-)"同的，
    <tspan x="50" dy="25">形成了独特的个体(individual)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Each individual has their own unique talents.
  </text>
  <text x="50" y="310" class="content">
    每个人都有自己独特的才能。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Dividing lines -->
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <!-- Individual person -->
    <circle cx="350" cy="100" r="20" class="image" />
    <line x1="350" y1="120" x2="350" y2="160" class="image" />
    <line x1="350" y1="160" x2="330" y2="190" class="image" />
    <line x1="350" y1="160" x2="370" y2="190" class="image" />
    <line x1="350" y1="140" x2="380" y2="130" class="image" />
  </g>
</svg>