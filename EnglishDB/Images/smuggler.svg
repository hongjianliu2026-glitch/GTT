<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smuggler</text>
  <text x="50" y="120" class="subtitle">[ˈsmʌɡlər] n. 走私者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smug (偷偷地) + gler (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个走私者，"偷偷地(smug)"
    <tspan x="50" dy="25">带着违禁品，试图避开海关的检查。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smuggler was caught with a large shipment of drugs.
  </text>
  <text x="50" y="310" class="content">
    走私者因携带大量毒品被抓获。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Smuggler -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Bag -->
    <rect x="50" y="90" width="30" height="40" class="image" />
    <!-- Customs officer -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="200" y2="120" class="image" />
    <!-- Searchlight -->
    <line x1="150" y1="80" x2="200" y2="30" class="image" />
    <line x1="200" y1="30" x2="250" y2="80" class="image" />
  </g>
</svg>