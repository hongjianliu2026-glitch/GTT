<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">technologist</text>
  <text x="50" y="120" class="subtitle">[tekˈnɑːlədʒɪst] n. 技术专家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> techno- (技术) + -logist (专家)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个技术专家(technologist)，他/她就像一个"技术(techno)"的"专家(logist)"，
    <tspan x="50" dy="25">手里拿着一个巨大的放大镜，正在研究复杂的电路板。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The technologist developed a new algorithm for data processing.
  </text>
  <text x="50" y="310" class="content">
    这位技术专家开发了一种新的数据处理算法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <!-- Circuit board -->
    <rect x="150" y="50" width="200" height="150" class="image" />
    <line x1="170" y1="70" x2="330" y2="70" class="image" />
    <line x1="170" y1="100" x2="330" y2="100" class="image" />
    <line x1="170" y1="130" x2="330" y2="130" class="image" />
    <line x1="170" y1="160" x2="330" y2="160" class="image" />
    <!-- Technologist -->
    <circle cx="50" cy="200" r="20" class="image" />
    <line x1="50" y1="220" x2="50" y2="260" class="image" />
    <line x1="50" y1="260" x2="30" y2="300" class="image" />
    <line x1="50" y1="260" x2="70" y2="300" class="image" />
    <line x1="50" y1="240" x2="90" y2="230" class="image" />
  </g>
</svg>