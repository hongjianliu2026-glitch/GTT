<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gondola</text>
  <text x="50" y="120" class="subtitle">[ˈɡɒndələ] n. 贡多拉（一种平底船）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gond (船) + -ola (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘小巧的贡多拉船在威尼斯的运河上轻轻滑行，
    <tspan x="50" dy="25">"小船(gond-ola)"载着游客，穿梭在浪漫的水城中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We took a gondola ride through the canals of Venice.
  </text>
  <text x="50" y="310" class="content">
    我们乘坐贡多拉船游览了威尼斯的运河。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gondola -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 250,100 0,100" class="image" fill="#85C1E9" />
    <!-- Water -->
    <rect x="0" y="180" width="350" height="20" class="image" fill="#3498DB" />
    <!-- Buildings -->
    <rect x="0" y="0" width="350" height="100" class="image" fill="#F4D03F" />
    <rect x="50" y="20" width="50" height="80" class="image" fill="#F4D03F" />
    <rect x="150" y="20" width="50" height="80" class="image" fill="#F4D03F" />
    <rect x="250" y="20" width="50" height="80" class="image" fill="#F4D03F" />
  </g>
</svg>