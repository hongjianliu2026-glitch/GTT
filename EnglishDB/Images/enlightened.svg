<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enlightened</text>
  <text x="50" y="120" class="subtitle">[ɪnˈlaɪtnd] adj. 开明的，有见识的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + light (光) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"光照亮(en-light-ed)"，突然间变得
    <tspan x="50" dy="25">聪明而有见识，这就是开明的状态(enlightened)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher's enlightened approach to education made a big difference.
  </text>
  <text x="50" y="310" class="content">
    这位老师开明的教育方法产生了很大的影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Light bulb -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="75" y1="200" x2="125" y2="200" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <!-- Person enlightened -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="200" class="image" />
    <line x1="300" y1="150" x2="250" y2="180" class="image" />
    <line x1="300" y1="150" x2="350" y2="180" class="image" />
    <line x1="300" y1="200" x2="250" y2="250" class="image" />
    <line x1="300" y1="200" x2="350" y2="250" class="image" />
    <!-- Light rays -->
    <line x1="100" y1="50" x2="300" y2="100" class="image" />
    <line x1="100" y1="50" x2="300" y2="150" class="image" />
    <line x1="100" y1="50" x2="300" y2="50" class="image" />
  </g>
</svg>