<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impressively</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpresɪvli] adv. 令人印象深刻地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + press (压) + -ive (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在演讲中，"压入(im-press)"
    <tspan x="50" dy="25">听众的心中，留下深刻的印象(impressively)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She performed impressively at the competition.
  </text>
  <text x="50" y="310" class="content">
    她在比赛中表现出色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Speaker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Audience -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Impressive effect -->
    <line x1="20" y1="115" x2="100" y2="115" class="image" />
    <line x1="20" y1="115" x2="150" y2="115" class="image" />
    <line x1="20" y1="115" x2="200" y2="115" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="80" r="5" class="image" />
    <circle cx="150" cy="80" r="5" class="image" />
    <circle cx="200" cy="80" r="5" class="image" />
  </g>
</svg>