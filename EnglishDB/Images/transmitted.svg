<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transmitted</text>
  <text x="50" y="120" class="subtitle">[trænzˈmɪtɪd] v. 传输，传播</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + mit (发送)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个信号从一座山"跨越(trans-)"到另一座山，
    <tspan x="50" dy="25">就像信息被"发送(mit)"出去，这就是传输(transmitted)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The message was transmitted across the ocean.
  </text>
  <text x="50" y="310" class="content">
    这条信息被跨越大洋传输。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountains -->
    <path d="M0 150 L100 50 L200 150 L300 50 L400 150" class="image" />
    <!-- Signal -->
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="350" cy="100" r="10" class="image" />
  </g>
</svg>