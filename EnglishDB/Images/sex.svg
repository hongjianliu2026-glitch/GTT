<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sex</text>
  <text x="50" y="120" class="subtitle">[sɛks] n. 性别，性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sex (来自拉丁语 sexus，意为“性别”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的拉丁语学者，用“性别(sex)”这个词
    <tspan x="50" dy="25">来区分男性和女性，这个概念一直延续至今。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor asked about the baby's sex.
  </text>
  <text x="50" y="310" class="content">
    医生询问了婴儿的性别。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Male symbol -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="120" class="image" />
    <line x1="50" y1="150" x2="80" y2="120" class="image" />

    <!-- Female symbol -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <line x1="150" y1="150" x2="120" y2="180" class="image" />
    <line x1="150" y1="150" x2="180" y2="180" class="image" />
  </g>
</svg>