<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sewage { fill: #8D4E4B; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sewage</text>
  <text x="50" y="120" class="subtitle">[ˈsuːɪdʒ] n. 污水，下水道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分离) + w- (水) + age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市，"分离的水(se-w-age)"
    <tspan x="50" dy="25">被排入下水道，这些水就是污水(sewage)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sewage system needs to be upgraded.
  </text>
  <text x="50" y="310" class="content">
    下水道系统需要升级。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sewage pipe -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Water flow -->
    <path d="M50,50 Q100,20 150,50 T300,50" class="sewage" />
    <path d="M50,70 Q100,40 150,70 T300,70" class="sewage" />
    <path d="M50,90 Q100,60 150,90 T300,90" class="sewage" />
    <!-- City -->
    <rect x="50" y="120" width="50" height="50" class="image" />
    <rect x="120" y="120" width="50" height="50" class="image" />
    <rect x="190" y="120" width="50" height="50" class="image" />
  </g>
</svg>