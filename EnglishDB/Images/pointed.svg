<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pointed</text>
  <text x="50" y="120" class="subtitle">[ˈpɔɪntɪd] adj. 尖的，尖锐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> point (点) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根尖锐的针，"尖端(point)"
    <tspan x="50" dy="25">刺入皮肤，这种尖锐的感觉就是pointed。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher gave a pointed look at the noisy students.
  </text>
  <text x="50" y="310" class="content">
    老师对吵闹的学生投以尖锐的目光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sharp needle -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <polygon points="40,50 60,50 50,30" class="image" />
    <!-- Skin -->
    <rect x="20" y="200" width="60" height="20" class="image" />
    <!-- Blood drop -->
    <circle cx="50" cy="220" r="5" class="image" />
  </g>
</svg>