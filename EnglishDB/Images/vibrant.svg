<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vibrant</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪbrənt] adj. 充满活力的，鲜艳的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vibr (振动) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满活力的城市，"振动(vibr)"
    <tspan x="50" dy="25">着生机与色彩，就像一幅鲜艳的画卷(vibrant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vibrant city lights at night are mesmerizing.
  </text>
  <text x="50" y="310" class="content">
    夜晚充满活力的城市灯光令人着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Buildings -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="120" y="40" width="50" height="140" class="image" />
    <rect x="190" y="60" width="50" height="120" class="image" />
    <rect x="260" y="80" width="50" height="100" class="image" />
    <!-- Lights -->
    <circle cx="75" cy="30" r="10" fill="#F1C40F" />
    <circle cx="145" cy="50" r="10" fill="#F1C40F" />
    <circle cx="215" cy="70" r="10" fill="#F1C40F" />
    <circle cx="285" cy="90" r="10" fill="#F1C40F" />
    <!-- Vibrating effect -->
    <line x1="50" y1="20" x2="300" y2="200" class="image" />
    <line x1="300" y1="20" x2="50" y2="200" class="image" />
  </g>
</svg>