<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">re-enactment</text>
  <text x="50" y="120" class="subtitle">[ˌriːɪˈnæktmənt] n. 重演，再现</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + enact (表演)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群演员在舞台上，"再次表演(re-enact)"
    <tspan x="50" dy="25">一个历史事件，观众仿佛穿越时空，亲眼目睹了那场重演(re-enactment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The re-enactment of the battle was very realistic.
  </text>
  <text x="50" y="310" class="content">
    那场战斗的重演非常逼真。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actors -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Audience -->
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="280" cy="50" r="10" class="image" />
    <circle cx="310" cy="50" r="10" class="image" />
    <!-- Re-enactment -->
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <line x1="50" y1="160" x2="150" y2="160" class="image" />
  </g>
</svg>