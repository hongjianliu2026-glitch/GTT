<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">otherwise</text>
  <text x="50" y="120" class="subtitle">[ˈʌðərwaɪz] adv. 否则，除此之外</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> other (其他的) + wise (方式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考，"如果(other)"
    <tspan x="50" dy="25">不这样做，"那么(wise)"就会发生什么？</tspan>
    <tspan x="50" dy="25">这就是"否则(otherwise)"的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You should wear a jacket, otherwise you might catch a cold.
  </text>
  <text x="50" y="310" class="content">
    你应该穿件夹克，否则你可能会感冒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thought bubble -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <!-- Person -->
    <circle cx="100" cy="320" r="20" class="image" />
    <line x1="100" y1="340" x2="100" y2="380" class="image" />
    <line x1="100" y1="380" x2="80" y2="420" class="image" />
    <line x1="100" y1="380" x2="120" y2="420" class="image" />
    <line x1="100" y1="360" x2="140" y2="350" class="image" />
    <!-- Other way -->
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <text x="230" y="170" class="content">other</text>
    <text x="230" y="190" class="content">wise</text>
  </g>
</svg>