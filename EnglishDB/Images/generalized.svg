<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">generalized</text>
  <text x="50" y="120" class="subtitle">[ˈdʒenrəlaɪzd] adj. 普遍的，广义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> general (普遍的) + -ize (使) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的放大镜，"放大(general-ize)"
    <tspan x="50" dy="25">并"使(ize)"某个概念变得"普遍(general)"，</tspan>
    <tspan x="50" dy="25">这就是"广义的(generalized)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concept of "freedom" is often generalized in political discussions.
  </text>
  <text x="50" y="310" class="content">
    在政治讨论中，"自由"的概念经常被广义化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <!-- Concept being magnified -->
    <rect x="260" y="70" width="100" height="60" class="image" />
    <text x="270" y="100" class="content" fill="#34495E">Concept</text>
  </g>
</svg>