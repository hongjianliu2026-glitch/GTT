<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crumb</text>
  <text x="50" y="120" class="subtitle">[krʌm] n. 面包屑，碎屑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crumb (碎屑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟在餐桌上，"啄食(crumb)"
    <tspan x="50" dy="25">掉落的面包屑，这些碎屑就是crumb。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mouse left a trail of crumbs on the kitchen floor.
  </text>
  <text x="50" y="310" class="content">
    老鼠在厨房地板上留下了一串面包屑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bread crumbs -->
    <circle cx="50" cy="100" r="5" class="image" />
    <circle cx="70" cy="110" r="5" class="image" />
    <circle cx="90" cy="90" r="5" class="image" />
    <circle cx="110" cy="105" r="5" class="image" />
    <circle cx="130" cy="95" r="5" class="image" />
    <!-- Bird -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
  </g>
</svg>