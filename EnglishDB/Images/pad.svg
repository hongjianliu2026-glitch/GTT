<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pad</text>
  <text x="50" y="120" class="subtitle">[pæd] n. 垫子，衬垫；v. 填充，加衬垫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pad (来自古英语pæd，意为“脚印”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只大象在泥地上留下深深的“脚印(pad)”，
    <tspan x="50" dy="25">这些脚印后来变成了柔软的垫子(pad)，供人们休息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a pad to cushion the fragile vase.
  </text>
  <text x="50" y="310" class="content">
    她用垫子来缓冲易碎的花瓶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Elephant foot -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Pad -->
    <rect x="50" y="150" width="200" height="50" class="image" />
    <!-- Text on pad -->
    <text x="100" y="180" class="content">Pad</text>
  </g>
</svg>