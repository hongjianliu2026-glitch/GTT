<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">danger</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪndʒər] n. 危险</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dang (危险) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"危险(dang)"标志，上面有一个红色的
    <tspan x="50" dy="25">闪电符号，警告人们远离危险区域。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm poses a danger to the coastal residents.
  </text>
  <text x="50" y="310" class="content">
    这场风暴对沿海居民构成了危险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Danger sign -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="175,20 330,180 20,180" class="image" fill="#E74C3C" />
    <!-- Lightning bolt -->
    <polyline points="100,100 150,150 100,150 150,200" class="image" fill="none" stroke="#F1C40F" stroke-width="10" />
    <!-- Warning text -->
    <text x="120" y="140" class="content" fill="#FFFFFF" font-size="48">DANGER</text>
  </g>
</svg>