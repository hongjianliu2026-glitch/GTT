<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skitter</text>
  <text x="50" y="120" class="subtitle">[ˈskɪtər] v. 轻快地跑，疾走</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skit (轻快) + -ter (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小老鼠在地板上"轻快地跑(skit-ter)"，
    <tspan x="50" dy="25">它的脚步轻盈，仿佛在跳舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat skittered across the room when it saw the dog.
  </text>
  <text x="50" y="310" class="content">
    猫看到狗时，轻快地跑过了房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mouse -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Path -->
    <path d="M50,100 Q100,50 150,100 T300,100" class="image" />
  </g>
</svg>