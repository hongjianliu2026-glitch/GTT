<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bartender</text>
  <text x="50" y="120" class="subtitle">[ˈbɑːrtendər] n. 酒吧招待，调酒师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bar (酒吧) + tender (照顾者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调酒师站在酒吧(bar)前，"照顾(tender)"
    <tspan x="50" dy="25">每一位顾客的需求，为他们调制美味的饮品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bartender skillfully mixed a cocktail for the guest.
  </text>
  <text x="50" y="310" class="content">
    调酒师熟练地为客人调制了一杯鸡尾酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bar counter -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Bartender -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Glass -->
    <rect x="100" y="30" width="30" height="50" class="image" />
    <line x1="115" y1="30" x2="115" y2="80" class="image" />
    <!-- Bottle -->
    <rect x="150" y="40" width="20" height="40" class="image" />
    <line x1="160" y1="40" x2="160" y2="80" class="image" />
  </g>
</svg>