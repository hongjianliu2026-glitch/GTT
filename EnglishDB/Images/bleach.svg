<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bleach</text>
  <text x="50" y="120" class="subtitle">[blitʃ] v. 漂白，变白；n. 漂白剂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bleac (白) + h (加强)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师挥动魔杖，"变白(bleac-h)"
    <tspan x="50" dy="25">一件原本脏兮兮的衣服，瞬间变得洁白如新。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used bleach to clean the stubborn stains.
  </text>
  <text x="50" y="310" class="content">
    她用漂白剂清洗顽固的污渍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magic wand -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Dirty cloth -->
    <rect x="120" y="0" width="150" height="150" class="image" />
    <line x1="130" y1="10" x2="260" y2="10" class="image" />
    <line x1="130" y1="30" x2="250" y2="30" class="image" />
    <line x1="130" y1="50" x2="270" y2="50" class="image" />
    <line x1="130" y1="70" x2="240" y2="70" class="image" />
    <!-- Clean cloth -->
    <rect x="120" y="160" width="150" height="150" class="image" />
    <line x1="130" y1="170" x2="260" y2="170" class="image" />
    <line x1="130" y1="190" x2="250" y2="190" class="image" />
    <line x1="130" y1="210" x2="270" y2="210" class="image" />
    <line x1="130" y1="230" x2="240" y2="230" class="image" />
  </g>
</svg>