<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conformity</text>
  <text x="50" y="120" class="subtitle">[kənˈfɔːrmɪti] n. 一致，符合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + form (形状) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人排成一列，"共同形成(con-form)"
    <tspan x="50" dy="25">相同的形状，这就是一致(conformity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The students were praised for their conformity to the school rules.
  </text>
  <text x="50" y="310" class="content">
    学生们因遵守学校规则而受到表扬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People in a line -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="300" cy="50" r="15" class="image" />
    <!-- Line connecting them -->
    <line x1="50" y1="65" x2="300" y2="65" class="image" />
  </g>
</svg>