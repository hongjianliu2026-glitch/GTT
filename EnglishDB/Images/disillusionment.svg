<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disillusionment</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsɪˈluːʒənmənt] n. 幻灭，觉醒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + illusion (幻觉) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人曾经相信一个美丽的"幻觉(illusion)"，
    <tspan x="50" dy="25">但最终发现那只是虚幻，"不再(dis-)"相信，</tspan>
    <tspan x="50" dy="25">这种感觉就是"幻灭(disillusionment)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His disillusionment with politics grew after the scandal.
  </text>
  <text x="50" y="310" class="content">
    丑闻发生后，他对政治的幻灭感加深了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken mirror -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="0" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Person looking at the broken mirror -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <line x1="175" y1="150" x2="130" y2="140" class="image" />
    <line x1="175" y1="150" x2="220" y2="140" class="image" />
  </g>
</svg>