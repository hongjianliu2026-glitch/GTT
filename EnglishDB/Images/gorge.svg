<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gorge</text>
  <text x="50" y="120" class="subtitle">[ɡɔːrdʒ] n. 峡谷；v. 狼吞虎咽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gour (喉咙) + -ge (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在峡谷(gorge)边上，突然感到饥饿，
    <tspan x="50" dy="25">于是开始"狼吞虎咽(gorge)"食物，仿佛要把整个峡谷都吞下去。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hiker stopped to gorge on trail mix at the canyon's edge.
  </text>
  <text x="50" y="310" class="content">
    徒步旅行者在峡谷边缘停下来狼吞虎咽地吃着混合坚果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canyon -->
    <path d="M0 0 L350 0 L350 200 L0 200 Z" class="image" />
    <path d="M50 200 L150 100 L250 200 Z" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
    <!-- Food -->
    <rect x="110" y="140" width="20" height="10" class="image" />
    <rect x="115" y="130" width="10" height="10" class="image" />
    <rect x="120" y="120" width="5" height="10" class="image" />
  </g>
</svg>