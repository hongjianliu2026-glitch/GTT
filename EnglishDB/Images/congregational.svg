<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">congregational</text>
  <text x="50" y="120" class="subtitle">[ˌkɒŋɡrɪˈɡeɪʃənl] adj. 会众的，公理会的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + greg (群体) + -ational (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"聚集在一起(con-greg)"，形成一个"群体(greg)"，
    <tspan x="50" dy="25">这个群体就是"会众(congregational)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The church follows a congregational governance model.
  </text>
  <text x="50" y="310" class="content">
    该教堂采用会众治理模式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Connecting lines -->
    <line x1="50" y1="65" x2="250" y2="65" class="image" />
    <line x1="50" y1="80" x2="250" y2="80" class="image" />
    <line x1="50" y1="95" x2="250" y2="95" class="image" />
    <!-- Church building -->
    <rect x="100" y="100" width="150" height="100" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <line x1="175" y1="100" x2="175" y2="50" class="image" />
  </g>
</svg>