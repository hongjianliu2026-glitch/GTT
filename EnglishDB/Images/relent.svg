<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relent</text>
  <text x="50" y="120" class="subtitle">[rɪˈlent] v. 减弱，放松，让步</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + lent (松)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个严厉的老师，"再次放松(re-lent)"
    <tspan x="50" dy="25">对学生的要求，最终让步(relent)了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher finally relented and gave us an extra day to finish the project.
  </text>
  <text x="50" y="310" class="content">
    老师最终让步了，给了我们额外的一天来完成项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teacher -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Relaxed expression -->
    <line x1="10" y1="90" x2="30" y2="90" class="image" />
    <line x1="15" y1="85" x2="25" y2="85" class="image" />
    <!-- Students -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="130" cy="100" r="15" class="image" />
    <circle cx="160" cy="100" r="15" class="image" />
    <!-- Happy expression -->
    <line x1="90" y1="90" x2="110" y2="90" class="image" />
    <line x1="95" y1="85" x2="105" y2="85" class="image" />
    <line x1="120" y1="90" x2="140" y2="90" class="image" />
    <line x1="125" y1="85" x2="135" y2="85" class="image" />
    <line x1="150" y1="90" x2="170" y2="90" class="image" />
    <line x1="155" y1="85" x2="165" y2="85" class="image" />
  </g>
</svg>