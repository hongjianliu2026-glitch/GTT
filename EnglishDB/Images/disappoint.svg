<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disappoint</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈpɔɪnt] v. 使失望</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (否定) + appoint (指定)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人满怀期待地等待着被"指定(appoint)"
    <tspan x="50" dy="25">去做某事，结果却被告知"否定(dis-)"了，</tspan>
    <tspan x="50" dy="25">这种感觉就是失望(disappoint)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His performance disappointed his fans.
  </text>
  <text x="50" y="310" class="content">
    他的表现让他的粉丝们失望了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a sad face -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="40" y1="40" x2="60" y2="40" class="image" />
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <line x1="50" y1="70" x2="50" y2="90" class="image" />
    <line x1="40" y1="80" x2="60" y2="80" class="image" />
    <!-- Broken heart -->
    <path d="M100,50 C110,30 130,30 140,50 L120,70 Z" class="image" />
    <line x1="120" y1="70" x2="120" y2="90" class="image" />
  </g>
</svg>