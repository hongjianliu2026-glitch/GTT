<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fragmentation</text>
  <text x="50" y="120" class="subtitle">[ˌfræɡˌmɛnˈteɪʃən] n. 碎片化，分裂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frag (打破) + ment (名词后缀) + ation (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的玻璃球被"打破(frag)"成无数的小碎片，
    <tspan x="50" dy="25">这些碎片散落在地上，形成了碎片化(fragmentation)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fragmentation of the market made it difficult to manage.
  </text>
  <text x="50" y="310" class="content">
    市场的碎片化使得管理变得困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken glass ball -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="20" y1="20" x2="180" y2="180" class="image" />
    <line x1="20" y1="180" x2="180" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <!-- Fragments -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
  </g>
</svg>