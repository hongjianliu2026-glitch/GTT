<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commitment</text>
  <text x="50" y="120" class="subtitle">[kəˈmɪtmənt] n. 承诺，奉献</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + mit (发送) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的信封前，"共同发送(com-mit)"
    <tspan x="50" dy="25">他的承诺，这个信封就象征着他的奉献(commitment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a commitment to finish the project by the end of the month.
  </text>
  <text x="50" y="310" class="content">
    她承诺在月底前完成这个项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Envelope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,20 300,20 350,70 0,70" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Letter -->
    <rect x="150" y="50" width="150" height="100" class="image" />
    <line x1="160" y1="60" x2="290" y2="60" class="image" />
    <line x1="160" y1="80" x2="290" y2="80" class="image" />
    <line x1="160" y1="100" x2="290" y2="100" class="image" />
  </g>
</svg>