<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swelling</text>
  <text x="50" y="120" class="subtitle">[ˈswelɪŋ] n. 肿胀，膨胀；v. 肿胀，膨胀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swell (膨胀) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球在充气时，"膨胀(swell)"
    <tspan x="50" dy="25">得越来越大，最终形成了一个肿胀(swelling)的气球。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The swelling on his ankle was caused by a sprain.
  </text>
  <text x="50" y="310" class="content">
    他脚踝的肿胀是由扭伤引起的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="60" class="image" />
    <circle cx="100" cy="100" r="70" class="image" />
    <!-- String -->
    <line x1="100" y1="170" x2="100" y2="250" class="image" />
  </g>
</svg>