<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">braid</text>
  <text x="50" y="120" class="subtitle">[breɪd] n. 辫子，编织物；v. 编织</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> br- (编织) + -aid (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女孩在镜子前，"编织(br-aid)"
    <tspan x="50" dy="25">她的头发，形成了一条美丽的辫子(braid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She braided her hair before going out.
  </text>
  <text x="50" y="310" class="content">
    她出门前编了辫子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Girl -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <!-- Braided hair -->
    <path d="M100,130 C90,150 110,150 100,170" class="image" />
    <path d="M100,130 C110,150 90,150 100,170" class="image" />
  </g>
</svg>