<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">redirect</text>
  <text x="50" y="120" class="subtitle">[ˌriːdɪˈrekt] v. 重定向，转移</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + direct (引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个导航员在指挥交通，"再次引导(re-direct)"
    <tspan x="50" dy="25">车辆改变方向，这就是重定向(redirect)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The website automatically redirected me to the new page.
  </text>
  <text x="50" y="310" class="content">
    网站自动将我重定向到新页面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="45" x2="250" y2="45" class="image" />
    <polygon points="250,45 240,40 240,50" class="image" />
    <!-- Traffic light -->
    <rect x="300" y="20" width="30" height="100" class="image" />
    <circle cx="315" cy="45" r="10" fill="#E74C3C" />
    <circle cx="315" cy="75" r="10" fill="#F1C40F" />
    <circle cx="315" cy="105" r="10" fill="#2ECC71" />
  </g>
</svg>