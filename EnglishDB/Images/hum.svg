<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hum</text>
  <text x="50" y="120" class="subtitle">[hʌm] v. 哼唱，发嗡嗡声；n. 嗡嗡声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hum (源自拟声词，模仿嗡嗡声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蜜蜂在花丛中飞舞，发出"嗡嗡(hum)"的声音，
    <tspan x="50" dy="25">这种声音让人感到宁静而愉悦。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hummed a tune while she worked.
  </text>
  <text x="50" y="310" class="content">
    她一边工作一边哼着曲子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bee -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <line x1="50" y1="90" x2="20" y2="80" class="image" />
    <!-- Flower -->
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="170" cy="50" r="15" class="image" />
    <circle cx="160" cy="30" r="15" class="image" />
    <circle cx="160" cy="70" r="15" class="image" />
    <circle cx="140" cy="30" r="15" class="image" />
    <circle cx="180" cy="30" r="15" class="image" />
    <circle cx="140" cy="70" r="15" class="image" />
    <circle cx="180" cy="70" r="15" class="image" />
    <!-- Humming sound -->
    <path d="M200,50 Q220,30 240,50 Q260,70 280,50" class="image" />
    <path d="M200,70 Q220,50 240,70 Q260,90 280,70" class="image" />
  </g>
</svg>