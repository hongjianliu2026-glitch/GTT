<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vineyard</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪnˌjɑːrd] n. 葡萄园</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vine (葡萄藤) + yard (场地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的场地(yard)上，
    <tspan x="50" dy="25">爬满了葡萄藤(vine)，这就是一个葡萄园(vineyard)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They visited a beautiful vineyard in Napa Valley.
  </text>
  <text x="50" y="310" class="content">
    他们参观了纳帕谷的一个美丽的葡萄园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Vines -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Grapes -->
    <circle cx="100" cy="35" r="10" class="image" />
    <circle cx="150" cy="35" r="10" class="image" />
    <circle cx="200" cy="35" r="10" class="image" />
    <circle cx="250" cy="35" r="10" class="image" />
    <circle cx="100" cy="65" r="10" class="image" />
    <circle cx="150" cy="65" r="10" class="image" />
    <circle cx="200" cy="65" r="10" class="image" />
    <circle cx="250" cy="65" r="10" class="image" />
    <circle cx="100" cy="95" r="10" class="image" />
    <circle cx="150" cy="95" r="10" class="image" />
    <circle cx="200" cy="95" r="10" class="image" />
    <circle cx="250" cy="95" r="10" class="image" />
    <circle cx="100" cy="125" r="10" class="image" />
    <circle cx="150" cy="125" r="10" class="image" />
    <circle cx="200" cy="125" r="10" class="image" />
    <circle cx="250" cy="125" r="10" class="image" />
    <circle cx="100" cy="155" r="10" class="image" />
    <circle cx="150" cy="155" r="10" class="image" />
    <circle cx="200" cy="155" r="10" class="image" />
    <circle cx="250" cy="155" r="10" class="image" />
  </g>
</svg>