<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shoreline</text>
  <text x="50" y="120" class="subtitle">[ˈʃɔːrlaɪn] n. 海岸线</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shore (岸) + line (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条线(line)沿着海岸(shore)延伸，
    <tspan x="50" dy="25">这条线就是海岸线(shoreline)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shoreline was dotted with colorful shells.
  </text>
  <text x="50" y="310" class="content">
    海岸线上点缀着五颜六色的贝壳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Shore -->
    <rect x="0" y="100" width="350" height="100" class="image" fill="#82CA9D" />
    <!-- Water -->
    <rect x="0" y="200" width="350" height="100" class="image" fill="#3498DB" />
    <!-- Shoreline -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" stroke-width="4" stroke="#F39C12" />
    <!-- Shells -->
    <circle cx="50" cy="180" r="10" class="image" fill="#F1C40F" />
    <circle cx="100" cy="180" r="10" class="image" fill="#E67E22" />
    <circle cx="150" cy="180" r="10" class="image" fill="#D35400" />
    <circle cx="200" cy="180" r="10" class="image" fill="#E74C3C" />
    <circle cx="250" cy="180" r="10" class="image" fill="#9B59B6" />
  </g>
</svg>