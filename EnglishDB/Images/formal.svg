<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">formal</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrml] adj. 正式的，正规的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> form (形式) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着西装的人，"形式(form)"
    <tspan x="50" dy="25">上非常正式，这就是formal(正式的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a formal suit to the wedding.
  </text>
  <text x="50" y="310" class="content">
    他穿着正式的西装去参加婚礼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Suit -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Tie -->
    <line x1="75" y1="20" x2="75" y2="60" class="image" />
    <line x1="75" y1="40" x2="50" y2="30" class="image" />
    <line x1="75" y1="40" x2="100" y2="30" class="image" />
    <!-- Shirt -->
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Pants -->
    <rect x="20" y="180" width="110" height="40" class="image" />
    <!-- Shoes -->
    <rect x="30" y="220" width="30" height="20" class="image" />
    <rect x="90" y="220" width="30" height="20" class="image" />
  </g>
</svg>