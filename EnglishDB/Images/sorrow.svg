<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #7E5109; }
      .content { font: 18px sans-serif; fill: #1B4F72; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2874A6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sorrow</text>
  <text x="50" y="120" class="subtitle">[ˈsɒrəʊ] n. 悲伤，悲痛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sor (痛苦) + row (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为失去心爱的东西而"痛苦(sor)"，
    <tspan x="50" dy="25">这种状态(row)就是悲伤(sorrow)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The loss of her pet filled her with sorrow.
  </text>
  <text x="50" y="310" class="content">
    她失去了宠物，心中充满了悲伤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Tears -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <!-- Broken heart -->
    <path d="M100,100 C120,80 140,80 160,100 C140,120 120,120 100,100 Z" class="image" />
    <line x1="120" y1="100" x2="120" y2="120" class="image" />
  </g>
</svg>