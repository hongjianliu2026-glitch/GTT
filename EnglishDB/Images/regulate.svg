<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">regulate</text>
  <text x="50" y="120" class="subtitle">[ˈreɡjəleɪt] v. 调节，管理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> reg (统治) + -ulate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个国王拿着权杖，"统治(reg)"
    <tspan x="50" dy="25">并调节(regulate)整个国家的秩序。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government regulates the traffic to ensure safety.
  </text>
  <text x="50" y="310" class="content">
    政府管理交通以确保安全。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- King -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Scepter -->
    <line x1="50" y1="120" x2="100" y2="50" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <!-- Kingdom -->
    <rect x="120" y="80" width="150" height="100" class="image" />
    <line x1="130" y1="90" x2="260" y2="90" class="image" />
    <line x1="130" y1="110" x2="250" y2="110" class="image" />
    <line x1="130" y1="130" x2="270" y2="130" class="image" />
    <line x1="130" y1="150" x2="240" y2="150" class="image" />
  </g>
</svg>