<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shear</text>
  <text x="50" y="120" class="subtitle">[ʃɪər] v. 剪切，剪羊毛；n. 剪刀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shea- (剪切) + -r (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫用巨大的剪刀"剪切(shea-r)"羊毛，
    <tspan x="50" dy="25">羊毛像瀑布一样从羊身上落下，场面壮观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer used a pair of shears to trim the sheep's wool.
  </text>
  <text x="50" y="310" class="content">
    农夫用一把剪刀修剪羊毛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shears -->
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="40" x2="150" y2="40" class="image" />
    <line x1="50" y1="20" x2="50" y2="40" class="image" />
    <line x1="150" y1="20" x2="150" y2="40" class="image" />
    <!-- Sheep -->
    <circle cx="250" cy="30" r="20" class="image" />
    <line x1="250" y1="50" x2="250" y2="100" class="image" />
    <line x1="250" y1="70" x2="230" y2="90" class="image" />
    <line x1="250" y1="70" x2="270" y2="90" class="image" />
    <line x1="250" y1="100" x2="230" y2="120" class="image" />
    <line x1="250" y1="100" x2="270" y2="120" class="image" />
    <!-- Wool -->
    <line x1="250" y1="50" x2="250" y2="80" class="image" />
    <line x1="240" y1="55" x2="240" y2="85" class="image" />
    <line x1="260" y1="55" x2="260" y2="85" class="image" />
  </g>
</svg>