<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">emigrate</text>
  <text x="50" y="120" class="subtitle">[ˈɛmɪɡreɪt] v. 移居，移民</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + migr (移动) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人背着行李，"走出(e-)"
    <tspan x="50" dy="25">自己的国家，"移动(migr)"到另一个国家，</tspan>
    <tspan x="50" dy="25">这就是"移居(emigrate)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many people emigrate to find better job opportunities.
  </text>
  <text x="50" y="310" class="content">
    许多人移民是为了寻找更好的工作机会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with luggage -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Luggage -->
    <rect x="100" y="130" width="40" height="50" class="image" />
    <line x1="100" y1="130" x2="140" y2="130" class="image" />
    <line x1="100" y1="155" x2="140" y2="155" class="image" />
    <line x1="100" y1="180" x2="140" y2="180" class="image" />
    <!-- Arrow pointing out -->
    <line x1="150" y1="155" x2="200" y2="155" class="image" />
    <polygon points="200,155 190,150 190,160" class="image" />
  </g>
</svg>