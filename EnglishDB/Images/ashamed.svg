<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ashamed</text>
  <text x="50" y="120" class="subtitle">[əˈʃeɪmd] adj. 羞愧的，惭愧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (强调) + shame (羞耻)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为做错了事，脸上"强调(a-)"
    <tspan x="50" dy="25">露出"羞耻(shame)"的表情，满脸通红，这就是"羞愧的(ashamed)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt ashamed for lying to her friends.
  </text>
  <text x="50" y="310" class="content">
    她因为对朋友撒谎而感到羞愧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <!-- Red cheeks -->
    <circle cx="70" cy="110" r="10" fill="#E74C3C" />
    <circle cx="130" cy="110" r="10" fill="#E74C3C" />
    <!-- Mouth -->
    <path d="M 80 120 Q 100 130 120 120" class="image" />
  </g>
</svg>