<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">patriarchal</text>
  <text x="50" y="120" class="subtitle">[ˌpeɪtriˈɑːrkəl] adj. 家长的，族长的，父权制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> patri (父亲) + arch (统治) + al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大家庭中，"父亲(patri)"
    <tspan x="50" dy="25">统治(arch)着整个家族，这种</tspan>
    <tspan x="50" dy="25">统治方式就是父权制的(patriarchal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The society was organized in a patriarchal manner.
  </text>
  <text x="50" y="310" class="content">
    这个社会是以父权制的方式组织的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Father figure -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Family members -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Lines connecting father to family -->
    <line x1="80" y1="130" x2="150" y2="120" class="image" />
    <line x1="80" y1="130" x2="200" y2="120" class="image" />
    <line x1="80" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>