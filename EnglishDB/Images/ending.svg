<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ending</text>
  <text x="50" y="120" class="subtitle">[ˈɛndɪŋ] n. 结尾，结局</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> end (结束) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一部电影的结尾，"结束(end)"
    <tspan x="50" dy="25">的场景，所有情节都汇聚于此，这就是结局(ending)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ending of the movie was unexpected.
  </text>
  <text x="50" y="310" class="content">
    这部电影的结局出乎意料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Movie screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Film reel -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="80" y1="100" x2="270" y2="100" class="image" />
    <line x1="80" y1="100" x2="80" y2="150" class="image" />
    <line x1="270" y1="100" x2="270" y2="150" class="image" />
    <!-- Ending text -->
    <text x="150" y="120" class="content" style="font-size: 36px; fill: #E74C3C;">END</text>
  </g>
</svg>