<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sand</text>
  <text x="50" y="120" class="subtitle">[sænd] n. 沙子；v. 磨光，用砂纸磨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sand (沙子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的沙漠，"沙子(sand)"
    <tspan x="50" dy="25">覆盖了整个地面，形成了一个巨大的沙海。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beach was covered with fine sand.
  </text>
  <text x="50" y="310" class="content">
    海滩上覆盖着细沙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sand dunes -->
    <path d="M0,100 Q50,50 100,100 T200,100 T300,100 T400,100" class="image" />
    <path d="M0,120 Q50,70 100,120 T200,120 T300,120 T400,120" class="image" />
    <path d="M0,140 Q50,90 100,140 T200,140 T300,140 T400,140" class="image" />
    <!-- Sun -->
    <circle cx="350" cy="50" r="30" class="image" />
    <!-- Sun rays -->
    <line x1="350" y1="20" x2="350" y2="0" class="image" />
    <line x1="370" y1="30" x2="390" y2="10" class="image" />
    <line x1="380" y1="50" x2="400" y2="50" class="image" />
    <line x1="370" y1="70" x2="390" y2="90" class="image" />
    <line x1="350" y1="80" x2="350" y2="100" class="image" />
    <line x1="330" y1="70" x2="310" y2="90" class="image" />
    <line x1="320" y1="50" x2="300" y2="50" class="image" />
    <line x1="330" y1="30" x2="310" y2="10" class="image" />
  </g>
</svg>