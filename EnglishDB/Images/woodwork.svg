<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">woodwork</text>
  <text x="50" y="120" class="subtitle">[ˈwʊdwɜːrk] n. 木工活，木制品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wood (木头) + work (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个木匠在工作室里，"用木头(wood)进行工作(work)"，
    <tspan x="50" dy="25">制作出各种精美的木制品(woodwork)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spent the weekend doing some woodwork in his garage.
  </text>
  <text x="50" y="310" class="content">
    他周末在车库里做了一些木工活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Carpenter -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Workbench -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Wood pieces -->
    <rect x="70" y="50" width="50" height="30" class="image" />
    <rect x="140" y="50" width="50" height="30" class="image" />
    <rect x="210" y="50" width="50" height="30" class="image" />
    <!-- Tools -->
    <line x1="70" y1="100" x2="120" y2="100" class="image" />
    <line x1="70" y1="100" x2="70" y2="130" class="image" />
    <line x1="140" y1="100" x2="190" y2="100" class="image" />
    <line x1="140" y1="100" x2="140" y2="130" class="image" />
  </g>
</svg>