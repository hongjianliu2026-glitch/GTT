<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sturgeon</text>
  <text x="50" y="120" class="subtitle">[ˈstɜːrdʒən] n. 鲟鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stur- (强壮) + geon (鱼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条强壮的鲟鱼(sturgeon)在水中游动，
    <tspan x="50" dy="25">它的身体强壮(stur-)如钢铁，游动时激起层层波浪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sturgeon is a large, prehistoric-looking fish.
  </text>
  <text x="50" y="310" class="content">
    鲟鱼是一种体型巨大、看起来像史前生物的鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Tail -->
    <polygon points="250,100 300,70 300,130" class="image" />
    <!-- Fins -->
    <polygon points="150,50 180,70 120,70" class="image" />
    <polygon points="150,150 180,130 120,130" class="image" />
    <!-- Eyes -->
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Mouth -->
    <line x1="50" y1="100" x2="70" y2="100" class="image" />
  </g>
</svg>