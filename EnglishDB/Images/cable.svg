<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cable</text>
  <text x="50" y="120" class="subtitle">[ˈkeɪbl] n. 电缆，缆绳；v. 用电报发送</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cab- (车) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆小车(cab-)被一根细长的缆绳(-le)牵引着，
    <tspan x="50" dy="25">这根缆绳就像电缆一样，连接着各个设备。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The technician installed a new cable for the internet connection.
  </text>
  <text x="50" y="310" class="content">
    技术人员为互联网连接安装了一根新电缆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cable -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Car -->
    <rect x="150" y="120" width="50" height="30" class="image" />
    <rect x="160" y="110" width="30" height="10" class="image" />
    <circle cx="165" cy="155" r="10" class="image" />
    <circle cx="195" cy="155" r="10" class="image" />
  </g>
</svg>