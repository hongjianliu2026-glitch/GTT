<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Internet</text>
  <text x="50" y="120" class="subtitle">[ˈɪntərnɛt] n. 互联网</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + net (网)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张巨大的网，"在(inter-)各个节点之间连接(net)"，
    <tspan x="50" dy="25">形成了一个全球互联的网络，这就是互联网(Internet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Internet has revolutionized the way we communicate.
  </text>
  <text x="50" y="310" class="content">
    互联网彻底改变了我们的交流方式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Global network -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="200" cy="100" r="50" class="image" />
    <circle cx="150" cy="180" r="50" class="image" />
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="180" class="image" />
    <line x1="200" y1="100" x2="150" y2="180" class="image" />
    <!-- Globe -->
    <circle cx="150" cy="140" r="30" class="image" />
    <!-- Nodes -->
    <circle cx="100" cy="100" r="10" class="image" fill="#E74C3C" />
    <circle cx="200" cy="100" r="10" class="image" fill="#E74C3C" />
    <circle cx="150" cy="180" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>