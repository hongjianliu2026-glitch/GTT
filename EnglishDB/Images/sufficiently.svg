<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sufficiently</text>
  <text x="50" y="120" class="subtitle">[səˈfɪʃntli] adv. 足够地，充分地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> suf- (在下面) + fic (做) + -ient (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在地下室里，"在下面充分地(suf-ficient-ly)"
    <tspan x="50" dy="25">做着准备工作，确保一切准备就绪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was sufficiently prepared before the launch.
  </text>
  <text x="50" y="310" class="content">
    这个项目在启动前已经充分准备好了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basement -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Tools -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="130" x2="150" y2="130" class="image" />
    <line x1="100" y1="160" x2="150" y2="160" class="image" />
    <!-- Checkmark -->
    <polyline points="200,100 220,130 250,80" class="image" />
  </g>
</svg>