<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incursion</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkɜːrʒən] n. 入侵，袭击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + cur (跑) + -sion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群士兵"跑进(in-cur)"敌人的领地，
    <tspan x="50" dy="25">这种突然的"进入"就是"入侵(incursion)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The incursion of the enemy forces was unexpected.
  </text>
  <text x="50" y="310" class="content">
    敌军的入侵出乎意料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Enemy territory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soldiers running in -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="80" x2="150" y2="80" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <!-- Soldiers -->
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="130" cy="110" r="10" class="image" />
    <circle cx="160" cy="140" r="10" class="image" />
    <!-- Arrows indicating direction -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="150" y1="80" x2="200" y2="80" class="image" />
    <line x1="150" y1="110" x2="200" y2="110" class="image" />
    <line x1="150" y1="140" x2="200" y2="140" class="image" />
    <polygon points="200,45 210,50 200,55" class="image" />
    <polygon points="200,75 210,80 200,85" class="image" />
    <polygon points="200,105 210,110 200,115" class="image" />
    <polygon points="200,135 210,140 200,145" class="image" />
  </g>
</svg>