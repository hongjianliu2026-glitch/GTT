<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hamlet</text>
  <text x="50" y="120" class="subtitle">[ˈhæmlɪt] n. 小村庄，小村落</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ham (家) + let (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小村庄，"家(ham)"的规模"小(let)"，
    <tspan x="50" dy="25">就像一个小小的家庭聚居地，这就是一个hamlet。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hamlet was surrounded by dense forests.
  </text>
  <text x="50" y="310" class="content">
    这个小村庄被茂密的森林包围着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- Trees -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="120" y1="100" x2="120" y2="150" class="image" />
    <line x1="190" y1="100" x2="190" y2="150" class="image" />
    <!-- Path -->
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
  </g>
</svg>