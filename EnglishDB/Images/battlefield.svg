<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">battlefield</text>
  <text x="50" y="120" class="subtitle">[ˈbætəlfiːld] n. 战场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> battle (战斗) + field (场地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"战斗场地(battle-field)"，
    <tspan x="50" dy="25">士兵们在其中激烈交战，硝烟弥漫，</tspan>
    <tspan x="50" dy="25">这就是战场(battlefield)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers fought bravely on the battlefield.
  </text>
  <text x="50" y="310" class="content">
    士兵们在战场上英勇作战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battlefield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soldiers -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Another soldier -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Smoke -->
    <path d="M200,50 Q250,20 300,50 T400,50" class="image" />
    <path d="M200,70 Q250,40 300,70 T400,70" class="image" />
    <path d="M200,90 Q250,60 300,90 T400,90" class="image" />
  </g>
</svg>