<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enslave</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsleɪv] v. 奴役，使成为奴隶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + slave (奴隶)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"使(en-)"成了"奴隶(slave)"，
    <tspan x="50" dy="25">他的自由被剥夺，成为了被奴役的对象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient empire enslaved many people.
  </text>
  <text x="50" y="310" class="content">
    这个古代帝国奴役了许多人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chains -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <!-- Person -->
    <circle cx="125" cy="100" r="20" class="image" />
    <line x1="125" y1="120" x2="125" y2="160" class="image" />
    <line x1="125" y1="160" x2="105" y2="200" class="image" />
    <line x1="125" y1="160" x2="145" y2="200" class="image" />
    <line x1="125" y1="140" x2="160" y2="130" class="image" />
    <!-- Chains connecting to person -->
    <line x1="50" y1="100" x2="105" y2="100" class="image" />
    <line x1="100" y1="100" x2="145" y2="100" class="image" />
  </g>
</svg>