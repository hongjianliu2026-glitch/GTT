<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dichotomous</text>
  <text x="50" y="120" class="subtitle">[daɪˈkɒtəməs] adj. 二分的，两分的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (二) + chotom (切) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把巨大的剪刀，"咔嚓"一声，将一个物体"切成两半(di-chotom-ous)"，
    <tspan x="50" dy="25">这就是二分的概念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The debate was dichotomous, with no middle ground.
  </text>
  <text x="50" y="310" class="content">
    这场辩论是二分的，没有中间立场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scissors -->
    <line x1="0" y1="0" x2="150" y2="150" class="image" />
    <line x1="0" y1="150" x2="150" y2="0" class="image" />
    <line x1="75" y1="75" x2="200" y2="75" class="image" />
    <!-- Object being cut -->
    <rect x="220" y="50" width="100" height="50" class="image" />
    <!-- Two halves -->
    <rect x="220" y="50" width="45" height="50" class="image" />
    <rect x="275" y="50" width="45" height="50" class="image" />
  </g>
</svg>