<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overwhelm</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈwɛlm] v. 淹没，压倒，使不知所措</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在上面) + whelm (淹没)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被一堆书"压在上面(over-whelm)"，
    <tspan x="50" dy="25">完全无法动弹，这就是被压倒(overwhelm)的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sheer volume of work overwhelmed me.
  </text>
  <text x="50" y="310" class="content">
    工作量之大让我不知所措。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Books -->
    <rect x="0" y="150" width="40" height="30" class="image" />
    <rect x="10" y="120" width="40" height="30" class="image" />
    <rect x="20" y="90" width="40" height="30" class="image" />
    <rect x="30" y="60" width="40" height="30" class="image" />
    <rect x="40" y="30" width="40" height="30" class="image" />
  </g>
</svg>