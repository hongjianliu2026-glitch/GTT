<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">constituency</text>
  <text x="50" y="120" class="subtitle">[kənˈstɪtʃuənsi] n. 选区，支持者群体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + stitut (站立) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"共同站立(con-stitut)"在一起，
    <tspan x="50" dy="25">形成一个支持某个候选人的群体，这就是选区(constituency)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The candidate needs to win the support of his constituency.
  </text>
  <text x="50" y="310" class="content">
    这位候选人需要赢得他选区的支持。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />

    <circle cx="100" cy="50" r="15" class="image" />
    <line x1="100" y1="65" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="80" x2="130" y2="70" class="image" />

    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="130" class="image" />
    <line x1="150" y1="100" x2="170" y2="130" class="image" />
    <line x1="150" y1="80" x2="180" y2="70" class="image" />

    <!-- Voting box -->
    <rect x="200" y="20" width="100" height="60" class="image" />
    <line x1="220" y1="40" x2="280" y2="40" class="image" />
    <line x1="220" y1="60" x2="280" y2="60" class="image" />
  </g>
</svg>