<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glamorous</text>
  <text x="50" y="120" class="subtitle">[ˈɡlæmərəs] adj. 迷人的，富有魅力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glam (魅力) + -orous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个闪闪发光的明星，"魅力四射(glam)"
    <tspan x="50" dy="25">在红毯上，吸引了所有人的目光，这就是glamorous。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked glamorous in her new dress.
  </text>
  <text x="50" y="310" class="content">
    她穿着新裙子看起来非常迷人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <polygon points="100,10 40,198 190,78 10,78 160,198" class="image" fill="#FFD700" />
    <!-- Red carpet -->
    <rect x="0" y="200" width="350" height="50" class="image" fill="#8B0000" />
    <!-- Person -->
    <circle cx="175" cy="150" r="20" class="image" fill="#FF69B4" />
    <line x1="175" y1="170" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="150" y2="250" class="image" />
    <line x1="175" y1="220" x2="200" y2="250" class="image" />
    <line x1="175" y1="190" x2="140" y2="180" class="image" />
    <line x1="175" y1="190" x2="210" y2="180" class="image" />
  </g>
</svg>