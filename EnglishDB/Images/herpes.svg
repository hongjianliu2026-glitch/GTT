<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">herpes</text>
  <text x="50" y="120" class="subtitle">[ˈhɜrpiz] n. 疱疹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> herp- (爬行) + -es (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群小虫子在皮肤上"爬行(herp-)"，
    <tspan x="50" dy="25">这些小虫子就是引起疱疹(herpes)的病毒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was diagnosed with herpes simplex.
  </text>
  <text x="50" y="310" class="content">
    她被诊断出患有单纯疱疹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skin -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Herpes spots -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="70" r="10" class="image" />
    <circle cx="110" cy="90" r="10" class="image" />
    <circle cx="140" cy="110" r="10" class="image" />
    <circle cx="170" cy="130" r="10" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
    <circle cx="230" cy="170" r="10" class="image" />
    <circle cx="260" cy="190" r="10" class="image" />
    <!-- Crawling bugs -->
    <line x1="50" y1="50" x2="60" y2="60" class="image" />
    <line x1="80" y1="70" x2="90" y2="80" class="image" />
    <line x1="110" y1="90" x2="120" y2="100" class="image" />
    <line x1="140" y1="110" x2="150" y2="120" class="image" />
    <line x1="170" y1="130" x2="180" y2="140" class="image" />
    <line x1="200" y1="150" x2="210" y2="160" class="image" />
    <line x1="230" y1="170" x2="240" y2="180" class="image" />
    <line x1="260" y1="190" x2="270" y2="200" class="image" />
  </g>
</svg>