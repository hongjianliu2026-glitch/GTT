<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">post</text>
  <text x="50" y="120" class="subtitle">[poʊst] n. 柱子，岗位；v. 张贴，邮寄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> post- (在后面) + - (表示动作或状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个士兵站在一个高高的柱子(post)上，"在后面(post-)"
    <tspan x="50" dy="25">守护着整个营地，这个柱子就是他的岗位(post)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The guard was posted at the gate all night.
  </text>
  <text x="50" y="310" class="content">
    守卫整夜都站在门口的岗位上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Post -->
    <rect x="0" y="0" width="50" height="200" class="image" />
    <!-- Soldier -->
    <circle cx="25" cy="220" r="15" class="image" />
    <line x1="25" y1="235" x2="25" y2="270" class="image" />
    <line x1="25" y1="270" x2="10" y2="300" class="image" />
    <line x1="25" y1="270" x2="40" y2="300" class="image" />
    <line x1="25" y1="250" x2="50" y2="240" class="image" />
  </g>
</svg>