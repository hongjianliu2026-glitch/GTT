<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flush</text>
  <text x="50" y="120" class="subtitle">[flʌʃ] v. 冲洗，脸红；n. 冲洗，红晕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fl- (流动) + ush (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个水龙头突然打开，水流(fl-)猛烈地冲刷(ush)着洗手池，
    <tspan x="50" dy="25">水花四溅，这就是冲洗(flush)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She flushed the toilet after using it.
  </text>
  <text x="50" y="310" class="content">
    她用完后冲了马桶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sink -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Faucet -->
    <line x1="175" y1="20" x2="175" y2="50" class="image" />
    <!-- Water flow -->
    <line x1="175" y1="50" x2="150" y2="100" class="image" />
    <line x1="175" y1="50" x2="200" y2="100" class="image" />
    <line x1="175" y1="50" x2="175" y2="100" class="image" />
    <!-- Water splash -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="175" cy="100" r="10" class="image" />
  </g>
</svg>