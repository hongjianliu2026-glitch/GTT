<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forfeit</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrfɪt] n. 没收物，罚金；v. 丧失，没收</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (离开) + feit (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为违规而被"离开(for-)"了他的财产，
    <tspan x="50" dy="25">这些财产被"做(feit)"成了罚金(forfeit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He forfeited his car for speeding.
  </text>
  <text x="50" y="310" class="content">
    他因超速而被没收了汽车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Car -->
    <rect x="70" y="80" width="100" height="50" class="image" />
    <rect x="80" y="70" width="80" height="10" class="image" />
    <circle cx="90" cy="135" r="10" class="image" />
    <circle cx="140" cy="135" r="10" class="image" />
    <!-- Forfeit sign -->
    <line x1="120" y1="50" x2="120" y2="150" class="image" />
    <line x1="100" y1="70" x2="140" y2="70" class="image" />
    <line x1="100" y1="70" x2="120" y2="50" class="image" />
    <line x1="140" y1="70" x2="120" y2="50" class="image" />
    <text x="110" y="90" class="content" style="font-size: 24px;">X</text>
  </g>
</svg>