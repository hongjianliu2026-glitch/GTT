<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conform</text>
  <text x="50" y="120" class="subtitle">[kənˈfɔːrm] v. 符合，遵守，适应</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + form (形状)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人排成一列，"共同形成(con-form)"
    <tspan x="50" dy="25">一个整齐的队形，每个人都遵守规则，适应环境。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to conform to the company's dress code.
  </text>
  <text x="50" y="310" class="content">
    她决定遵守公司的着装规定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People in a line -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <circle cx="70" cy="20" r="10" class="image" />
    <circle cx="120" cy="20" r="10" class="image" />
    <circle cx="170" cy="20" r="10" class="image" />
    <circle cx="220" cy="20" r="10" class="image" />
    <circle cx="270" cy="20" r="10" class="image" />
    <circle cx="320" cy="20" r="10" class="image" />
    <!-- Rule line -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <text x="180" y="65" class="content">Rule</text>
  </g>
</svg>