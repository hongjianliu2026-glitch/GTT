<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gifted</text>
  <text x="50" y="120" class="subtitle">[ˈɡɪftɪd] adj. 有天赋的，有才华的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gift (礼物) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子收到一份"礼物(gift)"，这份礼物赋予了他
    <tspan x="50" dy="25">非凡的才能，使他成为"有天赋的(gifted)"人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a gifted musician who can play multiple instruments.
  </text>
  <text x="50" y="310" class="content">
    她是一位有天赋的音乐家，能演奏多种乐器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gift box -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Ribbon -->
    <line x1="75" y1="0" x2="75" y2="20" class="image" />
    <line x1="60" y1="20" x2="90" y2="20" class="image" />
    <!-- Child -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="90" x2="180" y2="110" class="image" />
    <line x1="200" y1="90" x2="220" y2="110" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <!-- Musical note -->
    <path d="M230,50 Q250,30 270,50 T310,50" class="image" />
    <path d="M230,70 Q250,50 270,70 T310,70" class="image" />
  </g>
</svg>