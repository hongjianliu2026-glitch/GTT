<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">startling</text>
  <text x="50" y="120" class="subtitle">[ˈstɑːrtlɪŋ] adj. 令人吃惊的，惊人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> start (开始) + -ling (表示状态或性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个平静的早晨，突然"开始(start)"
    <tspan x="50" dy="25">一声巨响，让人"吃惊(ling)"不已。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The startling news made everyone speechless.
  </text>
  <text x="50" y="310" class="content">
    这个惊人的消息让所有人都哑口无言。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F39C12" />
    <!-- House -->
    <rect x="150" y="120" width="100" height="80" fill="#8E44AD" />
    <!-- Door -->
    <rect x="190" y="160" width="20" height="40" fill="#2C3E50" />
    <!-- Window -->
    <rect x="160" y="140" width="20" height="20" fill="#ECF0F1" />
    <rect x="200" y="140" width="20" height="20" fill="#ECF0F1" />
    <!-- Explosion -->
    <circle cx="300" cy="100" r="30" fill="#E74C3C" />
    <line x1="270" y1="70" x2="330" y2="130" class="image" />
    <line x1="270" y1="130" x2="330" y2="70" class="image" />
    <line x1="285" y1="85" x2="315" y2="115" class="image" />
    <line x1="285" y1="115" x2="315" y2="85" class="image" />
  </g>
</svg>