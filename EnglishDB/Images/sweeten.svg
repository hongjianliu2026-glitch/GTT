<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #6B5B43; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #FF4500; }
      .image { stroke: #D2691E; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sweeten</text>
  <text x="50" y="120" class="subtitle">[ˈswiːtn] v. 使变甜，使愉快</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sweet (甜) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"使(en)"
    <tspan x="50" dy="25">食物变甜(sweet)，让每一口都充满甜蜜(sweeten)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added honey to sweeten the tea.
  </text>
  <text x="50" y="310" class="content">
    她加了蜂蜜使茶变甜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kitchen counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Honey jar -->
    <rect x="50" y="20" width="50" height="80" class="image" />
    <line x1="75" y1="20" x2="75" y2="100" class="image" />
    <!-- Spoon -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="140" y2="40" class="image" />
    <line x1="150" y1="50" x2="140" y2="60" class="image" />
    <!-- Tea cup -->
    <rect x="200" y="20" width="50" height="80" class="image" />
    <line x1="225" y1="20" x2="225" y2="100" class="image" />
  </g>
</svg>