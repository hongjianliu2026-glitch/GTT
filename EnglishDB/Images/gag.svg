<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gag</text>
  <text x="50" y="120" class="subtitle">[ɡæɡ] n. 塞口物，笑话；v. 塞住，使窒息</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gag (来自古法语 gagner，意为“塞住”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被塞住嘴巴，无法说话，只能发出"嘎嘎(gag)"的声音，这就是"gag"的来源。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The comedian told a gag that made everyone laugh.
  </text>
  <text x="50" y="310" class="content">
    喜剧演员讲了一个笑话，大家都笑了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mouth -->
    <path d="M50 50 Q100 100 150 50" class="image" />
    <!-- Gag -->
    <rect x="70" y="30" width="60" height="40" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="30" r="10" class="image" />
    <circle cx="140" cy="30" r="10" class="image" />
  </g>
</svg>