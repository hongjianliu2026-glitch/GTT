<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sly</text>
  <text x="50" y="120" class="subtitle">[slaɪ] adj. 狡猾的，偷偷摸摸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sl- (滑，偷偷) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狐狸在月光下，"偷偷滑行(sl-y)"，
    <tspan x="50" dy="25">它的眼睛闪烁着狡猾的光芒，这就是sly的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sly fox stole the chicken from the farm.
  </text>
  <text x="50" y="310" class="content">
    那只狡猾的狐狸从农场偷走了鸡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Fox -->
    <circle cx="150" cy="150" r="20" class="image" fill="#D35400" />
    <line x1="150" y1="170" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
    <!-- Eyes -->
    <circle cx="140" cy="140" r="5" class="image" fill="#2C3E50" />
    <circle cx="160" cy="140" r="5" class="image" fill="#2C3E50" />
  </g>
</svg>