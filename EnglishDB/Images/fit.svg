<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fit</text>
  <text x="50" y="120" class="subtitle">[fɪt] v. 适合，安装；adj. 合适的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fit (适合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拼图块，"恰好适合(fit)"
    <tspan x="50" dy="25">在一个空缺的位置，完美契合。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The key fits perfectly into the lock.
  </text>
  <text x="50" y="310" class="content">
    这把钥匙完美地插入了锁中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Puzzle piece -->
    <path d="M50 50 Q100 25 150 50 T250 50 L250 150 Q200 175 150 150 T50 150 Z" class="image" fill="#3498DB" />
    <!-- Hole -->
    <rect x="100" y="100" width="100" height="50" class="image" fill="#ECF0F1" />
    <!-- Fit -->
    <path d="M100 100 Q150 75 200 100 T200 150 L100 150 Z" class="image" fill="#E74C3C" />
  </g>
</svg>