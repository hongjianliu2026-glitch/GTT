<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #E67E22; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .pepper { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paprika</text>
  <text x="50" y="120" class="subtitle">[ˈpæprikə] n. 辣椒粉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> paprika源自匈牙利语，意为“辣椒”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，手里拿着一罐“辣椒粉(paprika)”，
    <tspan x="50" dy="25">准备给菜肴增添一丝辛辣的味道。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sprinkled paprika on her scrambled eggs.
  </text>
  <text x="50" y="310" class="content">
    她在炒蛋上撒了些辣椒粉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Pepper -->
    <rect x="70" y="80" width="50" height="50" class="pepper" />
    <rect x="130" y="80" width="50" height="50" class="pepper" />
    <rect x="190" y="80" width="50" height="50" class="pepper" />
    <!-- Jar -->
    <rect x="70" y="140" width="170" height="60" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <line x1="70" y1="200" x2="240" y2="200" class="image" />
    <line x1="70" y1="140" x2="70" y2="200" class="image" />
    <line x1="240" y1="140" x2="240" y2="200" class="image" />
  </g>
</svg>