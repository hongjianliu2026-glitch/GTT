<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">collide</text>
  <text x="50" y="120" class="subtitle">[kəˈlaɪd] v. 碰撞，冲突</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (一起) + lide (滑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两辆车在高速公路上"一起滑动(col-lide)"，
    <tspan x="50" dy="25">结果发生了激烈的碰撞(collide)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two cars collided at the intersection.
  </text>
  <text x="50" y="310" class="content">
    两辆车在十字路口相撞了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car 1 -->
    <rect x="50" y="50" width="100" height="50" class="image" />
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="130" cy="100" r="10" class="image" />
    <!-- Car 2 -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="280" cy="100" r="10" class="image" />
    <!-- Collision effect -->
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
  </g>
</svg>