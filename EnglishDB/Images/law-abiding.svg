<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">law-abiding</text>
  <text x="50" y="120" class="subtitle">[ˈlɔːˌbaɪdɪŋ] adj. 守法的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> law (法律) + abide (遵守)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个守法的人，"遵守(abide)"
    <tspan x="50" dy="25">法律(law)，始终走在法律的正道上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a law-abiding citizen who never breaks the rules.
  </text>
  <text x="50" y="310" class="content">
    他是一个从不违反规则的守法公民。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Law book -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="50" x2="130" y2="50" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <line x1="20" y1="110" x2="130" y2="110" class="image" />
    <line x1="20" y1="140" x2="130" y2="140" class="image" />
    <line x1="20" y1="170" x2="130" y2="170" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Path -->
    <line x1="100" y1="220" x2="300" y2="220" class="image" />
    <line x1="100" y1="220" x2="100" y2="240" class="image" />
    <line x1="300" y1="220" x2="300" y2="240" class="image" />
    <line x1="100" y1="240" x2="300" y2="240" class="image" />
    <!-- Person walking on path -->
    <line x1="200" y1="150" x2="200" y2="220" class="image" />
  </g>
</svg>