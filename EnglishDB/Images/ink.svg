<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ink</text>
  <text x="50" y="120" class="subtitle">[ɪŋk] n. 墨水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + k (液体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一支笔蘸入墨水瓶，"墨水(ink)"
    <tspan x="50" dy="25">从瓶中流入笔尖，书写出文字。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spilled ink on his shirt while writing.
  </text>
  <text x="50" y="310" class="content">
    他在写字时把墨水洒在了衬衫上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ink bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Ink inside the bottle -->
    <rect x="10" y="10" width="80" height="180" fill="#000080" />
    <!-- Pen dipping into the ink -->
    <line x1="120" y1="100" x2="100" y2="20" class="image" />
    <line x1="120" y1="100" x2="120" y2="200" class="image" />
    <line x1="120" y1="100" x2="140" y2="200" class="image" />
    <line x1="120" y1="100" x2="140" y2="20" class="image" />
  </g>
</svg>