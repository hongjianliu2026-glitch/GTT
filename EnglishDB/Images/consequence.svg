<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consequence</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnsɪkwəns] n. 结果，后果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + sequ (跟随) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在做出决定后，"跟随(sequ)"着这个决定，
    <tspan x="50" dy="25">结果(consequence)就像影子一样紧随其后。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The consequence of his actions was a loss of trust.
  </text>
  <text x="50" y="310" class="content">
    他的行为的后果是失去了信任。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Decision -->
    <circle cx="50" cy="100" r="30" class="image" />
    <text x="40" y="105" class="content" fill="#E74C3C">D</text>
    <!-- Result -->
    <line x1="80" y1="100" x2="200" y2="100" class="image" />
    <circle cx="230" cy="100" r="30" class="image" />
    <text x="220" y="105" class="content" fill="#E74C3C">R</text>
    <!-- Shadow -->
    <rect x="200" y="130" width="60" height="30" class="image" />
  </g>
</svg>