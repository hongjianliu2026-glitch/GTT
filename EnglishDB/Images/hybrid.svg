<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hybrid</text>
  <text x="50" y="120" class="subtitle">[ˈhaɪbrɪd] n. 杂交种，混合物；adj. 混合的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hybr- (杂交) + id (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只奇特的动物，"杂交(hybr-)"了狮子和鹰的特征，
    <tspan x="50" dy="25">它既有狮子的身体又有鹰的翅膀，这就是一个杂交种(hybrid)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hybrid car combines the best features of both gasoline and electric vehicles.
  </text>
  <text x="50" y="310" class="content">
    混合动力汽车结合了汽油车和电动车的最佳特性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion body -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Eagle wings -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="20" x2="20" y2="80" class="image" />
    <line x1="180" y1="20" x2="180" y2="80" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <!-- Lion head -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Eagle head -->
    <circle cx="100" cy="30" r="10" class="image" />
    <line x1="90" y1="30" x2="80" y2="20" class="image" />
    <line x1="110" y1="30" x2="120" y2="20" class="image" />
  </g>
</svg>