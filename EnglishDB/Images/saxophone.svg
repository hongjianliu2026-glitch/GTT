<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">saxophone</text>
  <text x="50" y="120" class="subtitle">[ˈsæksəfoʊn] n. 萨克斯管</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sax (saxon, 撒克逊人) + phone (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个撒克逊人(sax)吹奏着一种发出美妙声音(phone)的乐器，
    <tspan x="50" dy="25">这个乐器就是萨克斯管(saxophone)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He played a haunting melody on his saxophone.
  </text>
  <text x="50" y="310" class="content">
    他用萨克斯管演奏了一首令人难忘的旋律。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Saxophone -->
    <path d="M50 50 L100 50 L120 70 L120 150 L100 170 L50 170 Z" class="image" />
    <!-- Mouthpiece -->
    <rect x="40" y="40" width="10" height="20" class="image" />
    <!-- Keys -->
    <circle cx="110" cy="80" r="3" class="image" />
    <circle cx="110" cy="90" r="3" class="image" />
    <circle cx="110" cy="100" r="3" class="image" />
    <circle cx="110" cy="110" r="3" class="image" />
    <circle cx="110" cy="120" r="3" class="image" />
    <circle cx="110" cy="130" r="3" class="image" />
    <circle cx="110" cy="140" r="3" class="image" />
    <!-- Music notes -->
    <path d="M150 50 Q170 70 150 90 T150 130" class="image" />
    <path d="M160 60 Q180 80 160 100 T160 140" class="image" />
  </g>
</svg>