<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">revitalization</text>
  <text x="50" y="120" class="subtitle">[ˌriːvaɪtəlaɪˈzeɪʃən] n. 复兴，新生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + vital (生命) + -ize (使) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个枯萎的植物，"再次获得生命(re-vital-ize)"
    <tspan x="50" dy="25">，重新焕发生机，这就是复兴(revitalization)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city's revitalization plan includes new parks and public spaces.
  </text>
  <text x="50" y="310" class="content">
    城市的复兴计划包括新建公园和公共空间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dying plant -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="40" y2="180" class="image" />
    <line x1="50" y1="150" x2="60" y2="180" class="image" />
    <line x1="50" y1="130" x2="30" y2="120" class="image" />
    <line x1="50" y1="130" x2="70" y2="120" class="image" />

    <!-- Revitalized plant -->
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="190" y2="180" class="image" />
    <line x1="200" y1="150" x2="210" y2="180" class="image" />
    <line x1="200" y1="130" x2="180" y2="120" class="image" />
    <line x1="200" y1="130" x2="220" y2="120" class="image" />
    <circle cx="200" cy="80" r="20" class="image" />

    <!-- Arrow -->
    <line x1="100" y1="120" x2="180" y2="120" class="image" />
    <polygon points="180,120 170,115 170,125" class="image" />
  </g>
</svg>