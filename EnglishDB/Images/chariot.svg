<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chariot</text>
  <text x="50" y="120" class="subtitle">[ˈtʃæriət] n. 战车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> char- (车) + iot (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代战士驾驶着一辆"小车(char-iot)"，
    <tspan x="50" dy="25">在战场上疾驰，这就是战车(chariot)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient Romans used chariots in battle.
  </text>
  <text x="50" y="310" class="content">
    古罗马人在战斗中使用战车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chariot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Wheels -->
    <circle cx="80" cy="180" r="20" class="image" />
    <circle cx="270" cy="180" r="20" class="image" />
    <!-- Axle -->
    <line x1="80" y1="160" x2="270" y2="160" class="image" />
    <!-- Warrior -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>