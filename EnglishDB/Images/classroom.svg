<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">classroom</text>
  <text x="50" y="120" class="subtitle">[ˈklæsruːm] n. 教室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> class (班级) + room (房间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个班级(class)的学生们在一个房间(room)里，
    <tspan x="50" dy="25">这个房间就是他们的教室(classroom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The students entered the classroom quietly.
  </text>
  <text x="50" y="310" class="content">
    学生们安静地进入了教室。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classroom outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Desk and chair -->
    <rect x="50" y="50" width="100" height="50" class="image" />
    <rect x="60" y="110" width="30" height="50" class="image" />
    <!-- Another desk and chair -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <rect x="210" y="110" width="30" height="50" class="image" />
    <!-- Teacher's desk -->
    <rect x="125" y="20" width="100" height="50" class="image" />
    <!-- Teacher -->
    <circle cx="175" cy="40" r="15" class="image" />
    <line x1="175" y1="55" x2="175" y2="80" class="image" />
    <line x1="175" y1="80" x2="160" y2="100" class="image" />
    <line x1="175" y1="80" x2="190" y2="100" class="image" />
    <line x1="175" y1="65" x2="200" y2="55" class="image" />
  </g>
</svg>