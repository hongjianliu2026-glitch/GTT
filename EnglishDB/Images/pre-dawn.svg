<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pre-dawn</text>
  <text x="50" y="120" class="subtitle">[priːˈdɔːn] adj. 黎明前的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在...之前) + dawn (黎明)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在黎明前(pre-dawn)的黑暗中，
    <tspan x="50" dy="25">等待着第一缕阳光的到来，这种时刻充满了神秘和期待。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hikers started their journey in the pre-dawn darkness.
  </text>
  <text x="50" y="310" class="content">
    徒步旅行者在黎明前的黑暗中开始了他们的旅程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#1C1C1C" />
    <!-- Moon -->
    <circle cx="50" cy="50" r="20" class="image" fill="#F1C40F" />
    <!-- Stars -->
    <circle cx="100" cy="30" r="2" class="image" fill="#FFFFFF" />
    <circle cx="120" cy="60" r="2" class="image" fill="#FFFFFF" />
    <circle cx="140" cy="40" r="2" class="image" fill="#FFFFFF" />
    <circle cx="160" cy="70" r="2" class="image" fill="#FFFFFF" />
    <!-- Horizon line -->
    <line x1="0" y1="180" x2="350" y2="180" class="image" stroke="#34495E" stroke-width="4" />
    <!-- Sun rising -->
    <circle cx="300" cy="180" r="20" class="image" fill="#F39C12" />
    <!-- Sun rays -->
    <line x1="300" y1="160" x2="300" y2="100" class="image" stroke="#F39C12" stroke-width="2" />
    <line x1="280" y1="160" x2="240" y2="100" class="image" stroke="#F39C12" stroke-width="2" />
    <line x1="320" y1="160" x2="360" y2="100" class="image" stroke="#F39C12" stroke-width="2" />
  </g>
</svg>