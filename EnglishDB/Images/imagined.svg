<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imagined</text>
  <text x="50" y="120" class="subtitle">[ɪˈmædʒɪnd] v. 想象（imagine的过去分词）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + ag (做) + in (在...中)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人闭上眼睛，"进入(im-)"
    <tspan x="50" dy="25">一个充满创造力的世界，在那里他"做(ag)"</tspan>
    <tspan x="50" dy="25">出各种奇妙的想法，这就是"想象(imagine)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She imagined a world without pollution.
  </text>
  <text x="50" y="310" class="content">
    她想象了一个没有污染的世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head with closed eyes -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="70" y1="90" x2="130" y2="90" class="image" />
    <line x1="70" y1="110" x2="130" y2="110" class="image" />
    <!-- Thought bubble -->
    <path d="M 150 50 Q 250 20 300 100 Q 250 180 150 150" class="image" />
    <!-- Imaginary world -->
    <circle cx="225" cy="125" r="20" class="image" />
    <rect x="200" y="150" width="50" height="30" class="image" />
    <line x1="225" y1="180" x2="225" y2="200" class="image" />
    <line x1="225" y1="200" x2="210" y2="220" class="image" />
    <line x1="225" y1="200" x2="240" y2="220" class="image" />
  </g>
</svg>