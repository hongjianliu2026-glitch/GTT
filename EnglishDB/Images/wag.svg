<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wag</text>
  <text x="50" y="120" class="subtitle">[wæɡ] v. 摇摆，摇动；n. 摇摆，摇动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wag (摇摆)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小狗在草地上，尾巴"摇摆(wag)"得像风中的旗帜，
    <tspan x="50" dy="25">快乐地奔跑，这就是wag的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog wagged its tail happily when it saw its owner.
  </text>
  <text x="50" y="310" class="content">
    狗看到主人时高兴地摇尾巴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#2ECC71" />
    <!-- Dog -->
    <circle cx="100" cy="100" r="30" class="image" fill="#F1C40F" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="150" x2="70" y2="140" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
    <!-- Tail -->
    <path d="M130,100 Q150,80 170,100" class="image" fill="none" stroke="#F1C40F" stroke-width="10" />
  </g>
</svg>