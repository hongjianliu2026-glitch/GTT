<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mason</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪsən] n. 石匠，泥瓦匠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> maso (拉丁语，意为“石头”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个石匠(mason)，手持锤子和凿子，
    <tspan x="50" dy="25">在一块巨大的石头(maso)上雕刻出精美的图案。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mason carefully chiseled the stone to create a beautiful sculpture.
  </text>
  <text x="50" y="310" class="content">
    石匠仔细地用凿子雕刻石头，创造出美丽的雕塑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Mason -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="120" x2="280" y2="110" class="image" />
    <!-- Hammer and chisel -->
    <line x1="250" y1="95" x2="220" y2="65" class="image" />
    <line x1="220" y1="65" x2="210" y2="75" class="image" />
  </g>
</svg>