<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impending</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpendɪŋ] adj. 即将发生的，迫近的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + pend (悬挂) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钟摆悬挂在空中，"悬挂(pend)"
    <tspan x="50" dy="25">在即将"进入(im-)"某个时刻，预示着某事即将发生(impending)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The impending storm caused the schools to close early.
  </text>
  <text x="50" y="310" class="content">
    即将到来的暴风雨导致学校提前关闭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pendulum -->
    <line x1="175" y1="0" x2="175" y2="150" class="image" />
    <circle cx="175" cy="20" r="10" class="image" />
    <line x1="175" y1="20" x2="100" y2="150" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <!-- Clock face -->
    <circle cx="175" cy="20" r="50" class="image" />
    <line x1="175" y1="20" x2="225" y2="20" class="image" />
    <line x1="175" y1="20" x2="175" y2="70" class="image" />
    <!-- Hour hand -->
    <line x1="175" y1="20" x2="150" y2="40" class="image" />
    <!-- Minute hand -->
    <line x1="175" y1="20" x2="190" y2="40" class="image" />
  </g>
</svg>