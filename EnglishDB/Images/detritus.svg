<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">detritus</text>
  <text x="50" y="120" class="subtitle">[dɪˈtraɪtəs] n. 碎屑，瓦砾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + tritus (摩擦)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座古老的城堡，"离开(de-)"了它的辉煌，
    <tspan x="50" dy="25">被时间"摩擦(tritus)"成了碎屑(detritus)，散落在地上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The construction site was littered with detritus.
  </text>
  <text x="50" y="310" class="content">
    建筑工地上到处都是碎屑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Debris -->
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="120" cy="130" r="15" class="image" />
    <circle cx="180" cy="90" r="12" class="image" />
    <circle cx="240" cy="110" r="8" class="image" />
    <circle cx="290" cy="140" r="14" class="image" />
  </g>
</svg>