<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sexy</text>
  <text x="50" y="120" class="subtitle">[ˈsɛksi] adj. 性感的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sex (性别) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满魅力的人，"性别(sex)"
    <tspan x="50" dy="25">特征明显，让人感到非常性感(sexy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked absolutely sexy in that dress.
  </text>
  <text x="50" y="310" class="content">
    她穿那条裙子看起来非常性感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <!-- Sparkles -->
    <circle cx="20" cy="20" r="5" class="image" />
    <circle cx="60" cy="20" r="5" class="image" />
    <circle cx="40" cy="40" r="5" class="image" />
    <!-- Person silhouette -->
    <circle cx="40" cy="80" r="20" class="image" />
    <line x1="40" y1="100" x2="40" y2="140" class="image" />
    <line x1="40" y1="120" x2="20" y2="100" class="image" />
    <line x1="40" y1="120" x2="60" y2="100" class="image" />
    <line x1="40" y1="140" x2="20" y2="160" class="image" />
    <line x1="40" y1="140" x2="60" y2="160" class="image" />
  </g>
</svg>