<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">banter</text>
  <text x="50" y="120" class="subtitle">[ˈbæntər] n. 打趣，开玩笑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ban (禁止) + ter (反复)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在互相"反复禁止(ban-ter)"对方认真，
    <tspan x="50" dy="25">结果却是在不停地开玩笑，这就是打趣(banter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They exchanged banter during the meeting.
  </text>
  <text x="50" y="310" class="content">
    他们在会议期间互相打趣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Mouths -->
    <path d="M40,110 Q50,130 60,110" class="image" />
    <path d="M140,110 Q150,130 160,110" class="image" />
    <!-- Arms -->
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <!-- Speech bubbles -->
    <path d="M80,80 Q120,60 160,80" class="image" />
    <path d="M120,80 Q80,60 40,80" class="image" />
    <!-- Text in speech bubbles -->
    <text x="90" y="85" class="content" text-anchor="middle">Ha!</text>
    <text x="150" y="85" class="content" text-anchor="middle">Ha!</text>
  </g>
</svg>