<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">presidential</text>
  <text x="50" y="120" class="subtitle">[ˌprɛzɪˈdɛnʃəl] adj. 总统的，总统职务的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + sid (坐) + ent (人) + ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个总统坐在"前面(pre-sid)"的椅子上，
    <tspan x="50" dy="25">象征着他的领导地位和权威，这就是"总统的(presidential)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The presidential election will be held next month.
  </text>
  <text x="50" y="310" class="content">
    总统选举将在下个月举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Presidential chair -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- President -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="150" y2="190" class="image" />
    <line x1="175" y1="160" x2="200" y2="190" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
    <!-- Presidential seal -->
    <circle cx="175" cy="100" r="10" class="image" />
    <line x1="175" y1="90" x2="175" y2="110" class="image" />
    <line x1="165" y1="100" x2="185" y2="100" class="image" />
  </g>
</svg>