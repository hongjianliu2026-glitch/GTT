<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fragmented</text>
  <text x="50" y="120" class="subtitle">[ˈfræɡməntɪd] adj. 破碎的，零碎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frag (打破) + ment (名词后缀) + ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完整的玻璃杯被"打破(frag)"成无数碎片，
    <tspan x="50" dy="25">这些碎片就是"零碎的(fragmented)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fragmented pieces of the vase were scattered all over the floor.
  </text>
  <text x="50" y="310" class="content">
    花瓶的碎片散落了一地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken glass -->
    <line x1="50" y1="20" x2="100" y2="100" class="image" />
    <line x1="100" y1="20" x2="50" y2="100" class="image" />
    <line x1="120" y1="20" x2="170" y2="100" class="image" />
    <line x1="170" y1="20" x2="120" y2="100" class="image" />
    <line x1="190" y1="20" x2="240" y2="100" class="image" />
    <line x1="240" y1="20" x2="190" y2="100" class="image" />
    <line x1="260" y1="20" x2="310" y2="100" class="image" />
    <line x1="310" y1="20" x2="260" y2="100" class="image" />
    <line x1="330" y1="20" x2="380" y2="100" class="image" />
    <line x1="380" y1="20" x2="330" y2="100" class="image" />
    <line x1="400" y1="20" x2="450" y2="100" class="image" />
    <line x1="450" y1="20" x2="400" y2="100" class="image" />
  </g>
</svg>