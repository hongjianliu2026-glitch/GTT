<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">simultaneously</text>
  <text x="50" y="120" class="subtitle">[ˌsɪməlˈteɪniəsli] adv. 同时地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> simul- (同时) + -tane- (时间) + -ous (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在同一时间(simul-tane-ous-ly)
    <tspan x="50" dy="25">跳入水中，溅起的水花同时飞溅，这就是同时(simultaneously)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They both spoke simultaneously, causing confusion.
  </text>
  <text x="50" y="310" class="content">
    他们同时说话，造成了混乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people jumping into water -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <line x1="50" y1="150" x2="30" y2="200" class="image" />
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="150" y1="150" x2="130" y2="200" class="image" />
    <line x1="150" y1="150" x2="170" y2="200" class="image" />
    <!-- Water splashes -->
    <circle cx="40" cy="200" r="10" class="image" />
    <circle cx="60" cy="200" r="10" class="image" />
    <circle cx="140" cy="200" r="10" class="image" />
    <circle cx="160" cy="200" r="10" class="image" />
  </g>
</svg>