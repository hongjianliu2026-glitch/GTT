<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">East-West</text>
  <text x="50" y="120" class="subtitle">[ˈiːst ˈwɛst] adj. 东西方的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> East (东方) + West (西方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球，"东方(East)"和"西方(West)"
    <tspan x="50" dy="25">的文化和思想在这里交汇，形成了一个独特的融合体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The East-West cultural exchange has enriched both societies.
  </text>
  <text x="50" y="310" class="content">
    东西方文化交流丰富了两个社会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- East -->
    <text x="100" y="80" class="content" fill="#E74C3C">East</text>
    <!-- West -->
    <text x="250" y="80" class="content" fill="#2980B9">West</text>
    <!-- Arrow -->
    <line x1="120" y1="120" x2="230" y2="120" class="image" />
    <polygon points="230,120 220,115 220,125" class="image" />
  </g>
</svg>