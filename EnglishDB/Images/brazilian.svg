<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Brazilian</text>
  <text x="50" y="120" class="subtitle">[brəˈzɪliən] adj. 巴西的；n. 巴西人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Brazil (巴西) + -ian (表示“属于...的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热情的巴西人，戴着传统的巴西帽子，
    <tspan x="50" dy="25">在里约热内卢的沙滩上跳着桑巴舞，这就是“巴西的(Brazilian)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a Brazilian who loves samba.
  </text>
  <text x="50" y="310" class="content">
    她是一个热爱桑巴舞的巴西人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brazilian hat -->
    <path d="M50 20 L100 20 L120 50 L30 50 Z" class="image" />
    <!-- Person -->
    <circle cx="85" cy="80" r="15" class="image" />
    <line x1="85" y1="95" x2="85" y2="130" class="image" />
    <line x1="85" y1="130" x2="70" y2="160" class="image" />
    <line x1="85" y1="130" x2="100" y2="160" class="image" />
    <line x1="85" y1="110" x2="110" y2="100" class="image" />
    <line x1="85" y1="110" x2="60" y2="100" class="image" />
    <!-- Beach -->
    <rect x="0" y="160" width="350" height="40" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
  </g>
</svg>