<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">colonize</text>
  <text x="50" y="120" class="subtitle">[ˈkɒlənaɪz] v. 殖民，定居</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (共同) + -on (名词后缀) + -ize (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人带着房子(col-)，一起(col-)到一个新地方定居，
    <tspan x="50" dy="25">就像一群小房子(col-)在新土地上扎根(colonize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The British colonized many parts of Africa.
  </text>
  <text x="50" y="310" class="content">
    英国人殖民了非洲的许多地方。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- New land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- People -->
    <circle cx="75" cy="100" r="15" class="image" />
    <circle cx="145" cy="100" r="15" class="image" />
    <circle cx="215" cy="100" r="15" class="image" />
    <circle cx="285" cy="100" r="15" class="image" />
    <!-- Roots -->
    <line x1="75" y1="115" x2="75" y2="150" class="image" />
    <line x1="145" y1="115" x2="145" y2="150" class="image" />
    <line x1="215" y1="115" x2="215" y2="150" class="image" />
    <line x1="285" y1="115" x2="285" y2="150" class="image" />
  </g>
</svg>