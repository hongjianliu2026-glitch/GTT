<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">idiotic</text>
  <text x="50" y="120" class="subtitle">[ˌɪdiˈɒtɪk] adj. 愚蠢的，白痴的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> idio- (个人的，独特的) + -otic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"独特的(idio-)"人，他的行为如此"独特"以至于显得"愚蠢(idiotic)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was idiotic to leave the door unlocked.
  </text>
  <text x="50" y="310" class="content">
    不锁门真是愚蠢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="10" class="image" />
    <circle cx="120" cy="90" r="10" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Thought bubble -->
    <path d="M 150 50 Q 200 20 250 50 Q 200 80 150 50" class="image" />
    <!-- Lightning bolt in thought bubble -->
    <line x1="170" y1="60" x2="230" y2="70" class="image" />
    <line x1="230" y1="70" x2="170" y2="80" class="image" />
  </g>
</svg>