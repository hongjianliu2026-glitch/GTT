<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quotient</text>
  <text x="50" y="120" class="subtitle">[ˈkwoʊʃnt] n. 商，份额</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quot (多少) + -ient (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个数学家在计算，"多少(quot)"
    <tspan x="50" dy="25">份才能平均分配，这个结果就是商(quotient)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The quotient of 10 divided by 2 is 5.
  </text>
  <text x="50" y="310" class="content">
    10除以2的商是5。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Division symbol -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <!-- Numbers -->
    <text x="70" y="90" class="content">10</text>
    <text x="200" y="90" class="content">2</text>
    <text x="150" y="180" class="content">5</text>
    <!-- Math symbols -->
    <text x="150" y="120" class="content">=</text>
  </g>
</svg>