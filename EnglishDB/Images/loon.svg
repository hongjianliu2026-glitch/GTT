<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loon</text>
  <text x="50" y="120" class="subtitle">[luːn] n. 潜鸟，笨蛋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loon (源自中古英语，意为“笨蛋”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只潜鸟在水面上优雅地滑行，突然它一头扎进水里，
    <tspan x="50" dy="25">结果却因为笨拙的动作而溅起大片水花，就像一个笨蛋(loon)一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He acted like a loon at the party, making everyone laugh.
  </text>
  <text x="50" y="310" class="content">
    他在派对上表现得像个笨蛋，逗得大家哈哈大笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Loon -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="210" class="image" />
    <line x1="100" y1="180" x2="130" y2="210" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <!-- Splash -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="170" cy="120" r="15" class="image" />
    <circle cx="130" cy="120" r="15" class="image" />
  </g>
</svg>