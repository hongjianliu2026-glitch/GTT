<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decentralization</text>
  <text x="50" y="120" class="subtitle">[diːˌsɛntrəlaɪˈzeɪʃən] n. 分散，去中心化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + central (中心) + -ization (名词化后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的中心球体，"离开(de-)"
    <tspan x="50" dy="25">中心(central)，分散成无数小球体，这就是去中心化(decentralization)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is moving towards decentralization to improve efficiency.
  </text>
  <text x="50" y="310" class="content">
    公司正在朝着去中心化方向发展以提高效率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Central sphere -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Decentralized spheres -->
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
    <circle cx="150" cy="200" r="20" class="image" />
    <circle cx="50" cy="150" r="20" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="100" x2="200" y2="50" class="image" />
    <line x1="100" y1="100" x2="250" y2="150" class="image" />
    <line x1="100" y1="100" x2="150" y2="200" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
  </g>
</svg>