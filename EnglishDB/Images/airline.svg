<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">airline</text>
  <text x="50" y="120" class="subtitle">[ˈɛrˌlaɪn] n. 航空公司，航线</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> air (空气) + line (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机在空中划出一条"空气中的线(air-line)"，
    <tspan x="50" dy="25">这条线就是航线(airline)，而经营这条线的公司就是航空公司(airline)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She booked a flight with a major airline.
  </text>
  <text x="50" y="310" class="content">
    她预订了一家大型航空公司的航班。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airplane -->
    <polygon points="0,0 100,0 120,20 100,40 0,40" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cloud -->
    <ellipse cx="200" cy="50" rx="50" ry="20" class="image" />
    <ellipse cx="250" cy="70" rx="40" ry="15" class="image" />
    <ellipse cx="150" cy="70" rx="40" ry="15" class="image" />
    <!-- Airline path -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <circle cx="50" cy="100" r="5" class="image" />
    <circle cx="300" cy="100" r="5" class="image" />
  </g>
</svg>