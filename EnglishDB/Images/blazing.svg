<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fire { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blazing</text>
  <text x="50" y="120" class="subtitle">[ˈbleɪzɪŋ] adj. 炽热的，燃烧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blaz (燃烧) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片"燃烧(blaz)"的火焰，火光"炽热(blazing)"，
    <tspan x="50" dy="25">仿佛能将一切吞噬。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sun was blazing down on the desert.
  </text>
  <text x="50" y="310" class="content">
    太阳炽热地照射在沙漠上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="50" cy="50" r="30" class="fire" />
    <circle cx="80" cy="70" r="25" class="fire" />
    <circle cx="110" cy="50" r="30" class="fire" />
    <circle cx="140" cy="70" r="25" class="fire" />
    <circle cx="170" cy="50" r="30" class="fire" />
    <!-- Fire lines -->
    <line x1="50" y1="80" x2="170" y2="80" class="image" />
    <line x1="50" y1="110" x2="170" y2="110" class="image" />
    <line x1="50" y1="140" x2="170" y2="140" class="image" />
  </g>
</svg>