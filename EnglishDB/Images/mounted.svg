<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mounted</text>
  <text x="50" y="120" class="subtitle">[maʊntɪd] adj. 安装好的，骑在马上的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mount (山，上升) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骑士骑在马上，"上升(mount)"到马背上，
    <tspan x="50" dy="25">这个动作就构成了"骑在马上的(mounted)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldier was mounted on his horse, ready for battle.
  </text>
  <text x="50" y="310" class="content">
    士兵骑在马上，准备战斗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Horse head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Horse neck -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Horse front leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Horse front leg -->
    <line x1="50" y1="180" x2="50" y2="250" class="image" /> <!-- Horse body -->
    <line x1="50" y1="250" x2="20" y2="290" class="image" /> <!-- Horse back leg -->
    <line x1="50" y1="250" x2="80" y2="290" class="image" /> <!-- Horse back leg -->
    <line x1="50" y1="250" x2="50" y2="300" class="image" /> <!-- Horse tail -->

    <!-- Rider -->
    <circle cx="150" cy="100" r="15" class="image" /> <!-- Rider head -->
    <line x1="150" y1="115" x2="150" y2="150" class="image" /> <!-- Rider body -->
    <line x1="150" y1="150" x2="130" y2="180" class="image" /> <!-- Rider left arm -->
    <line x1="150" y1="150" x2="170" y2="180" class="image" /> <!-- Rider right arm -->
    <line x1="150" y1="150" x2="150" y2="200" class="image" /> <!-- Rider leg -->
    <line x1="150" y1="200" x2="130" y2="230" class="image" /> <!-- Rider left leg -->
    <line x1="150" y1="200" x2="170" y2="230" class="image" /> <!-- Rider right leg -->
  </g>
</svg>