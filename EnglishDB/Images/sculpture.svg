<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sculpture</text>
  <text x="50" y="120" class="subtitle">[ˈskʌlptʃər] n. 雕塑，雕刻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sculpt (雕刻) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家手持凿子，"雕刻(sculpt)"
    <tspan x="50" dy="25">一块巨大的石头，最终创造出一个栩栩如生的雕塑(sculpture)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The museum has a famous sculpture by Michelangelo.
  </text>
  <text x="50" y="310" class="content">
    博物馆里有一件米开朗基罗的著名雕塑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone block -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sculptor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Chisel -->
    <line x1="20" y1="115" x2="70" y2="50" class="image" />
    <!-- Sculpted figure -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="150" y1="130" x2="150" y2="180" class="image" />
    <line x1="150" y1="150" x2="120" y2="180" class="image" />
    <line x1="150" y1="150" x2="180" y2="180" class="image" />
    <line x1="150" y1="130" x2="190" y2="120" class="image" />
  </g>
</svg>