<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intrinsically</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtrɪnsɪkli] adv. 内在地，本质地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> intro- (向内) + -insic (本质的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宝石，它的美丽和价值"内在地(intrinsically)"
    <tspan x="50" dy="25">是由其内部的纯净和光泽决定的，而不是外表的装饰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beauty of the diamond is intrinsically determined by its clarity.
  </text>
  <text x="50" y="310" class="content">
    钻石的美丽本质上是取决于它的纯净度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gemstone -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Light rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <!-- Inner light -->
    <circle cx="100" cy="100" r="20" class="image" fill="#FFFFFF" />
  </g>
</svg>