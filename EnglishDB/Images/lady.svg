<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lady</text>
  <text x="50" y="120" class="subtitle">[ˈleɪdi] n. 女士，夫人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> la- (来自拉丁语的“优雅”) + dy (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位优雅的女士(lady)，她穿着华丽的礼服，
    <tspan x="50" dy="25">举止优雅，仿佛是从古代宫廷中走出来的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lady in the red dress was the center of attention.
  </text>
  <text x="50" y="310" class="content">
    那位穿红裙子的女士是全场的焦点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elegant lady -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="130" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="130" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Dress -->
    <path d="M20,130 Q50,100 80,130" class="image" />
    <path d="M20,130 Q50,150 80,130" class="image" />
    <!-- Elegant pose -->
    <line x1="50" y1="130" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="40" y2="110" class="image" />
    <line x1="50" y1="120" x2="60" y2="110" class="image" />
  </g>
</svg>