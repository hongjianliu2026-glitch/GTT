<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .fiber { fill: #F39C12; }
      .optic { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fiber-optic</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪbər ˈɒptɪk] adj. 光纤的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fiber (纤维) + optic (光的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根细长的纤维(fiber)，里面充满了闪烁的光(optic)，
    <tspan x="50" dy="25">这些光在纤维中快速传输信息，就像光纤(fiber-optic)一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The internet connection uses fiber-optic cables for faster data transfer.
  </text>
  <text x="50" y="310" class="content">
    互联网连接使用光纤电缆以实现更快的数据传输。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fiber -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="250" height="100" class="fiber" />
    <!-- Optic -->
    <circle cx="175" cy="100" r="20" class="optic" />
    <line x1="175" y1="120" x2="175" y2="150" class="optic" />
    <line x1="175" y1="150" x2="155" y2="180" class="optic" />
    <line x1="175" y1="150" x2="195" y2="180" class="optic" />
  </g>
</svg>