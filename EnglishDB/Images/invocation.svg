<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">invocation</text>
  <text x="50" y="120" class="subtitle">[ˌɪnvəˈkeɪʃn] n. 祈祷，召唤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (向内) + voc (声音) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的仪式，"向内发出(in-voc)"
    <tspan x="50" dy="25">声音，召唤神灵或力量，这就是祈祷(invocation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The priest's invocation was filled with reverence.
  </text>
  <text x="50" y="310" class="content">
    牧师的祈祷充满了敬意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Priest -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Altar -->
    <rect x="100" y="150" width="200" height="50" class="image" />
    <!-- Light rays -->
    <line x1="200" y1="100" x2="200" y2="50" class="image" />
    <line x1="180" y1="100" x2="180" y2="50" class="image" />
    <line x1="220" y1="100" x2="220" y2="50" class="image" />
    <!-- Sound waves -->
    <path d="M100,220 Q150,200 200,220 Q250,240 300,220" class="image" />
    <path d="M100,230 Q150,210 200,230 Q250,250 300,230" class="image" />
    <path d="M100,240 Q150,220 200,240 Q250,260 300,240" class="image" />
  </g>
</svg>