<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snort</text>
  <text x="50" y="120" class="subtitle">[snɔːrt] v. 喷鼻息，打呼噜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sn- (鼻子) + ort (呼吸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头大象在喷鼻息，"鼻子(sn-)呼吸(ort)"
    <tspan x="50" dy="25">发出巨大的声音，这就是snort(喷鼻息)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The horse snorted loudly when it saw the carrot.
  </text>
  <text x="50" y="310" class="content">
    马看到胡萝卜时大声喷鼻息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nose -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Nostrils -->
    <ellipse cx="70" cy="100" rx="20" ry="10" class="image" />
    <ellipse cx="130" cy="100" rx="20" ry="10" class="image" />
    <!-- Air flow -->
    <line x1="70" y1="100" x2="0" y2="100" class="image" />
    <line x1="130" y1="100" x2="200" y2="100" class="image" />
    <!-- Exaggerated air flow -->
    <line x1="0" y1="100" x2="-50" y2="150" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
  </g>
</svg>