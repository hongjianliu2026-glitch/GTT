<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrecked</text>
  <text x="50" y="120" class="subtitle">[rɛkt] adj. 毁坏的，失事的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wreck (毁坏) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在大海上，被风暴"毁坏(wreck)"
    <tspan x="50" dy="25">得支离破碎，变成了一艘"失事的(wrecked)"船。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship was completely wrecked in the storm.
  </text>
  <text x="50" y="310" class="content">
    那艘船在风暴中完全毁坏了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Sunken ship -->
    <rect x="100" y="100" width="150" height="50" class="image" fill="#7F8C8D" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <!-- Broken mast -->
    <line x1="175" y1="100" x2="175" y2="50" class="image" />
    <line x1="175" y1="50" x2="150" y2="20" class="image" />
    <line x1="175" y1="50" x2="200" y2="20" class="image" />
  </g>
</svg>