<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spurt</text>
  <text x="50" y="120" class="subtitle">[spɜːrt] n. 喷射，冲刺；v. 喷出，冲刺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spur (刺激) + -t (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在赛道上，突然受到"刺激(spur)"，
    <tspan x="50" dy="25">像火箭一样"喷射(spurt)"出去，冲刺到终点。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gave a final spurt to overtake the leader.
  </text>
  <text x="50" y="310" class="content">
    他最后冲刺超过了领先者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Runner -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Spurt effect -->
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="50" y1="100" x2="80" y2="80" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
  </g>
</svg>