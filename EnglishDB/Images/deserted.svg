<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deserted</text>
  <text x="50" y="120" class="subtitle">[dɪˈzɜːrtɪd] adj. 荒废的，无人居住的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + sert (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个曾经繁华的城市，人们都"离开(de-)"并"放置(sert)"了它，
    <tspan x="50" dy="25">现在只剩下荒废的建筑和空荡的街道，这就是"deserted"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The town looked deserted after the hurricane.
  </text>
  <text x="50" y="310" class="content">
    飓风过后，小镇看起来荒无人烟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Deserted town -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Buildings -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="20" width="50" height="100" class="image" />
    <rect x="190" y="20" width="50" height="100" class="image" />
    <!-- Empty streets -->
    <line x1="50" y1="130" x2="240" y2="130" class="image" />
    <line x1="50" y1="150" x2="240" y2="150" class="image" />
    <!-- Wind blowing -->
    <polyline points="250,140 270,120 290,140" class="image" />
    <polyline points="250,160 270,180 290,160" class="image" />
  </g>
</svg>