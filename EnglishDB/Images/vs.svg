<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vs</text>
  <text x="50" y="120" class="subtitle">[vəs] prep. 对，对抗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vs 源自拉丁语 "versus"，意为“转向”或“对抗”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个战士面对面，"转向(versus)"彼此，准备进行一场激烈的对抗。
    <tspan x="50" dy="25">这种对抗的姿态就是 "vs" 的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The match was between Team A vs Team B.
  </text>
  <text x="50" y="310" class="content">
    比赛是A队对B队。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two warriors facing each other -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />

    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="270" y2="220" class="image" />
    <line x1="300" y1="180" x2="330" y2="220" class="image" />
    <line x1="300" y1="150" x2="250" y2="140" class="image" />

    <!-- Arrow pointing from one warrior to the other -->
    <line x1="130" y1="100" x2="270" y2="100" class="image" />
    <polygon points="270,100 260,90 260,110" class="image" />
  </g>
</svg>