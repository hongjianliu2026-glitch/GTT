<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #E67E22; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shining</text>
  <text x="50" y="120" class="subtitle">[ˈʃaɪnɪŋ] adj. 闪耀的，发光的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shin (发光) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗巨大的钻石在阳光下"闪耀(shin-ing)"，
    <tspan x="50" dy="25">它的光芒照亮了整个房间，让人无法移开视线。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The diamond on her finger was shining brightly.
  </text>
  <text x="50" y="310" class="content">
    她手指上的钻石闪闪发光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diamond -->
    <polygon points="100,10 150,150 50,150" class="image" style="fill: #FFD700; stroke: #C7A000;" />
    <!-- Sun rays -->
    <line x1="100" y1="10" x2="100" y2="0" class="image" style="stroke: #FFD700;" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" style="stroke: #FFD700;" />
    <line x1="50" y1="150" x2="0" y2="150" class="image" style="stroke: #FFD700;" />
    <!-- Room -->
    <rect x="0" y="150" width="200" height="100" class="image" style="fill: #F4F6F7;" />
  </g>
</svg>