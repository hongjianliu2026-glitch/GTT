<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lineman</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪnmən] n. 线务员，架线工</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> line (线) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人站在高高的电线杆上，"拉线(line)"
    <tspan x="50" dy="25">和"人(man)"的结合，他就是线务员(lineman)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lineman was fixing the power lines after the storm.
  </text>
  <text x="50" y="310" class="content">
    暴风雨后，线务员正在修理电线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pole -->
    <rect x="150" y="0" width="20" height="200" class="image" />
    <!-- Line -->
    <line x1="160" y1="20" x2="300" y2="20" class="image" />
    <!-- Lineman -->
    <circle cx="160" cy="50" r="15" class="image" />
    <line x1="160" y1="65" x2="160" y2="100" class="image" />
    <line x1="160" y1="100" x2="140" y2="130" class="image" />
    <line x1="160" y1="100" x2="180" y2="130" class="image" />
    <line x1="160" y1="80" x2="200" y2="70" class="image" />
  </g>
</svg>