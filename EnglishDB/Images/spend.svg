<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spend</text>
  <text x="50" y="120" class="subtitle">[spend] v. 花费，度过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spen- (花费) + d (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在"花费(spen-)"
    <tspan x="50" dy="25">时间和金钱，就像把钱扔进一个无底洞，</tspan>
    <tspan x="50" dy="25">这就是"花费(spend)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent all her savings on the trip.
  </text>
  <text x="50" y="310" class="content">
    她把所有的积蓄都花在了这次旅行上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Money falling into a hole -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <!-- Money -->
    <rect x="150" y="50" width="50" height="20" class="image" />
    <rect x="160" y="40" width="30" height="10" class="image" />
    <rect x="170" y="30" width="10" height="10" class="image" />
  </g>
</svg>