<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">depressive</text>
  <text x="50" y="120" class="subtitle">[dɪˈprɛsɪv] adj. 压抑的，抑郁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + press (压) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"向下压(de-press)"得喘不过气，
    <tspan x="50" dy="25">心情沉重，这就是抑郁(depressive)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news had a depressive effect on everyone.
  </text>
  <text x="50" y="310" class="content">
    这个消息对每个人都产生了压抑的影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Person -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="155" y2="250" class="image" />
    <line x1="175" y1="220" x2="195" y2="250" class="image" />
    <line x1="175" y1="190" x2="145" y2="180" class="image" />
    <line x1="175" y1="190" x2="205" y2="180" class="image" />
    <!-- Arrow -->
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <polygon points="175,100 170,110 180,110" class="image" />
  </g>
</svg>