<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">all-purpose</text>
  <text x="50" y="120" class="subtitle">[ˈɔːl ˈpɜːrpəs] adj. 多用途的，万能的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> all- (全部) + purpose (目的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神奇的工具箱，里面装满了各种工具，"全部(all)"
    <tspan x="50" dy="25">都能用来完成不同的"目的(purpose)"，这就是多用途的(all-purpose)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This all-purpose cleaner can be used on various surfaces.
  </text>
  <text x="50" y="310" class="content">
    这种万能清洁剂可以用于各种表面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Toolbox -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tools -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="110" x2="100" y2="110" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="150" y1="80" x2="200" y2="80" class="image" />
    <line x1="150" y1="110" x2="200" y2="110" class="image" />
    <line x1="150" y1="140" x2="200" y2="140" class="image" />
    <line x1="250" y1="50" x2="300" y2="50" class="image" />
    <line x1="250" y1="80" x2="300" y2="80" class="image" />
    <line x1="250" y1="110" x2="300" y2="110" class="image" />
    <line x1="250" y1="140" x2="300" y2="140" class="image" />
    <!-- Label -->
    <text x="150" y="250" class="content">All-Purpose Toolbox</text>
  </g>
</svg>