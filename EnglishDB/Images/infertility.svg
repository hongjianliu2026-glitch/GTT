<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infertility</text>
  <text x="50" y="120" class="subtitle">[ˌɪnfərˈtɪləti] n. 不育，不孕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + fertility (生育)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个渴望孩子的家庭，但"不能生育(in-fertility)"，
    <tspan x="50" dy="25">他们的心中充满了无尽的失望和悲伤。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The couple struggled with infertility for years.
  </text>
  <text x="50" y="310" class="content">
    这对夫妇多年来一直与不孕不育作斗争。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken heart -->
    <path d="M50 50 Q100 0 150 50 T250 50" class="image" />
    <path d="M50 50 Q0 100 50 150 T150 150" class="image" />
    <path d="M250 50 Q300 100 250 150 T150 150" class="image" />
    <!-- Baby crib -->
    <rect x="100" y="200" width="100" height="50" class="image" />
    <line x1="120" y1="220" x2="180" y2="220" class="image" />
    <line x1="120" y1="240" x2="180" y2="240" class="image" />
    <!-- Empty crib -->
    <line x1="140" y1="210" x2="160" y2="210" class="image" />
    <line x1="140" y1="230" x2="160" y2="230" class="image" />
  </g>
</svg>