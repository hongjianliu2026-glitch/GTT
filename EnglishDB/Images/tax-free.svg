<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tax-free</text>
  <text x="50" y="120" class="subtitle">[tæks friː] adj. 免税的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tax (税) + free (免除)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钱袋，上面贴着"免税(tax-free)"的标签，
    <tspan x="50" dy="25">里面装满了金币，象征着不用交税的财富。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bought a tax-free car last year.
  </text>
  <text x="50" y="310" class="content">
    他去年买了一辆免税车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Money bag -->
    <path d="M50 50 L300 50 Q350 50 350 100 L350 250 Q350 300 300 300 L50 300 Q0 300 0 250 L0 100 Q0 50 50 50 Z" class="image" />
    <!-- Coins -->
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="150" cy="150" r="20" class="image" />
    <circle cx="200" cy="150" r="20" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
    <!-- Tax-free label -->
    <rect x="125" y="200" width="100" height="50" class="image" />
    <text x="140" y="235" class="content" fill="#FFFFFF">tax-free</text>
  </g>
</svg>