<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intelligence</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɛlɪdʒəns] n. 智力，智能，情报</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> intel- (在中间) + lig (选择) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个智者在人群中，"在中间选择(intel-lig)"
    <tspan x="50" dy="25">出最聪明的想法，这就是智力(intelligence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Artificial intelligence is transforming many industries.
  </text>
  <text x="50" y="310" class="content">
    人工智能正在改变许多行业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Light bulb -->
    <circle cx="250" cy="100" r="50" class="image" />
    <line x1="250" y1="150" x2="250" y2="250" class="image" />
    <line x1="250" y1="250" x2="220" y2="300" class="image" />
    <line x1="250" y1="250" x2="280" y2="300" class="image" />
    <line x1="250" y1="250" x2="250" y2="300" class="image" />
    <!-- Thought bubble -->
    <path d="M150,50 Q200,20 250,50 T350,100" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="350" cy="100" r="10" class="image" />
  </g>
</svg>