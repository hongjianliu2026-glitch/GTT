<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fig</text>
  <text x="50" y="120" class="subtitle">[fɪɡ] n. 无花果，无花果树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fig (源自拉丁语 ficus，意为无花果树)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵巨大的无花果树，树上挂满了成熟的
    <tspan x="50" dy="25">无花果，每一颗都饱满多汁，仿佛在向你招手。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fig tree in our garden produces delicious fruit every year.
  </text>
  <text x="50" y="310" class="content">
    我们花园里的无花果树每年都结出美味的果实。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="150" y="0" width="20" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="160" y1="20" x2="100" y2="100" class="image" />
    <line x1="160" y1="20" x2="220" y2="100" class="image" />
    <line x1="160" y1="60" x2="100" y2="160" class="image" />
    <line x1="160" y1="60" x2="220" y2="160" class="image" />
    <!-- Fruits -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="220" cy="100" r="15" class="image" />
    <circle cx="100" cy="160" r="15" class="image" />
    <circle cx="220" cy="160" r="15" class="image" />
  </g>
</svg>