<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pummel</text>
  <text x="50" y="120" class="subtitle">[ˈpʌml] v. 连续打击，猛击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pumm (拳头) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小拳头(pumm-el)不停地"猛击(pummel)"一个沙袋，
    <tspan x="50" dy="25">沙袋被击打得摇摇晃晃，这就是pummel的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He pummeled the punching bag until his hands hurt.
  </text>
  <text x="50" y="310" class="content">
    他不停地击打沙袋，直到手疼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Punching bag -->
    <ellipse cx="175" cy="100" rx="50" ry="80" class="image" />
    <!-- Fist -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <!-- Impact lines -->
    <line x1="100" y1="100" x2="175" y2="100" class="image" />
    <line x1="100" y1="100" x2="175" y2="80" class="image" />
    <line x1="100" y1="100" x2="175" y2="120" class="image" />
  </g>
</svg>