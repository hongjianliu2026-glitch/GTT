<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">staffing</text>
  <text x="50" y="120" class="subtitle">[ˈstæfɪŋ] n. 人员配备，员工配置</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> staff (杆，杖) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个公司，"杆子(staff)"上挂满了员工的照片，
    <tspan x="50" dy="25">每个照片代表一个员工，这就是人员配备(staffing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is currently in the process of staffing new positions.
  </text>
  <text x="50" y="310" class="content">
    公司目前正在为新职位配备人员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Staff -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <!-- Photos -->
    <rect x="20" y="20" width="60" height="60" class="image" />
    <rect x="20" y="90" width="60" height="60" class="image" />
    <rect x="20" y="160" width="60" height="60" class="image" />
    <!-- Faces in photos -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="50" cy="120" r="20" class="image" />
    <circle cx="50" cy="190" r="20" class="image" />
  </g>
</svg>