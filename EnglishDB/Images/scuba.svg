<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scuba</text>
  <text x="50" y="120" class="subtitle">[ˈskuːbə] n. 水肺潜水装备</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self-contained underwater breathing apparatus
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人背着"自给式水下呼吸器(scuba)"，
    <tspan x="50" dy="25">潜入深海，与鱼群共舞，探索海底的神秘世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bought a new scuba set for his next diving trip.
  </text>
  <text x="50" y="310" class="content">
    他为下一次潜水旅行买了一套新的水肺潜水装备。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diver -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Scuba gear -->
    <rect x="30" y="80" width="40" height="20" class="image" />
    <line x1="50" y1="80" x2="50" y2="60" class="image" />
    <line x1="50" y1="60" x2="30" y2="40" class="image" />
    <line x1="50" y1="60" x2="70" y2="40" class="image" />
    <!-- Fish -->
    <path d="M100,100 C110,80 130,80 140,100" class="image" />
    <path d="M100,100 C110,120 130,120 140,100" class="image" />
    <circle cx="120" cy="100" r="5" class="image" />
  </g>
</svg>