<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adaptive</text>
  <text x="50" y="120" class="subtitle">[əˈdæptɪv] adj. 适应的，适合的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + apt (适合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只变色龙，它能够"朝向(ad-)"不同的环境"适合(apt)"自己的颜色，
    <tspan x="50" dy="25">这就是适应性(adaptive)的体现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The adaptive learning system adjusts to each student's needs.
  </text>
  <text x="50" y="310" class="content">
    这个适应性学习系统会根据每个学生的需求进行调整。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chameleon body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Chameleon eyes -->
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <!-- Chameleon tail -->
    <path d="M100,150 Q150,200 200,150" class="image" />
    <!-- Environment -->
    <rect x="250" y="50" width="100" height="100" class="image" />
    <rect x="370" y="50" width="100" height="100" class="image" />
    <!-- Chameleon adapting -->
    <circle cx="270" cy="100" r="50" class="image" />
    <circle cx="390" cy="100" r="50" class="image" />
  </g>
</svg>