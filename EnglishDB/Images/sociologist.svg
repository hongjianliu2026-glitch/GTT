<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sociologist</text>
  <text x="50" y="120" class="subtitle">[ˌsoʊsiˈɒlədʒɪst] n. 社会学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soci- (社会) + -logist (学者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个社会学家在人群中，"研究(logist)"
    <tspan x="50" dy="25">社会的各种现象和行为，试图理解社会的运作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sociologist conducted a study on urban migration.
  </text>
  <text x="50" y="310" class="content">
    这位社会学家进行了一项关于城市迁移的研究。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <!-- Sociologist -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <line x1="250" y1="90" x2="280" y2="80" class="image" />
    <!-- Book -->
    <rect x="230" y="160" width="40" height="30" class="image" />
    <line x1="235" y1="165" x2="265" y2="165" class="image" />
    <line x1="235" y1="175" x2="265" y2="175" class="image" />
    <line x1="235" y1="185" x2="265" y2="185" class="image" />
  </g>
</svg>