<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">multiply</text>
  <text x="50" y="120" class="subtitle">[ˈmʌltɪplaɪ] v. 乘；增加</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> multi- (多) + ply (折叠)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师在舞台上，"多次折叠(multi-ply)"
    <tspan x="50" dy="25">一张纸，每次折叠都让纸的数量倍增，这就是乘法(multiply)的魔力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> To solve the problem, you need to multiply 3 by 4.
  </text>
  <text x="50" y="310" class="content">
    要解决这个问题，你需要把3乘以4。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Paper folding -->
    <rect x="70" y="20" width="100" height="100" class="image" />
    <rect x="100" y="50" width="100" height="100" class="image" />
    <rect x="130" y="80" width="100" height="100" class="image" />
    <!-- Arrows -->
    <line x1="120" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="120" y2="120" class="image" />
  </g>
</svg>