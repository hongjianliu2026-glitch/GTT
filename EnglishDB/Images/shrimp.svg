<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shrimp</text>
  <text x="50" y="120" class="subtitle">[ʃrɪmp] n. 虾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shrim (小) + p (表示名词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小虾(shrimp)在海底跳跃，
    <tspan x="50" dy="25">它的身体小巧玲珑，像个小精灵一样在水中穿梭。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat shrimp in her salad.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃沙拉里的虾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shrimp body -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <!-- Shrimp tail -->
    <polygon points="150,100 200,80 200,120" class="image" />
    <!-- Shrimp eyes -->
    <circle cx="70" cy="80" r="5" class="image" />
    <circle cx="80" cy="80" r="5" class="image" />
    <!-- Shrimp legs -->
    <line x1="50" y1="110" x2="30" y2="130" class="image" />
    <line x1="60" y1="110" x2="40" y2="130" class="image" />
    <line x1="70" y1="110" x2="50" y2="130" class="image" />
    <line x1="80" y1="110" x2="60" y2="130" class="image" />
    <line x1="90" y1="110" x2="70" y2="130" class="image" />
  </g>
</svg>