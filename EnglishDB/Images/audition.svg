<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">audition</text>
  <text x="50" y="120" class="subtitle">[ɔːˈdɪʃn] n. 试镜，试听；v. 试镜，试听</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aud- (听) + -ition (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演员站在舞台上，"听(aud-)"
    <tspan x="50" dy="25">着导演的指示，进行试镜(audition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She went to an audition for the lead role in the play.
  </text>
  <text x="50" y="310" class="content">
    她去参加了这部戏主角的试镜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actor -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Director -->
    <circle cx="250" cy="50" r="15" class="image" />
    <line x1="250" y1="65" x2="250" y2="90" class="image" />
    <line x1="250" y1="90" x2="230" y2="120" class="image" />
    <line x1="250" y1="90" x2="270" y2="120" class="image" />
    <line x1="250" y1="75" x2="280" y2="65" class="image" />
    <!-- Microphone -->
    <line x1="250" y1="50" x2="250" y2="20" class="image" />
    <circle cx="250" cy="20" r="5" class="image" />
  </g>
</svg>