<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">TRUE</text>
  <text x="50" y="120" class="subtitle">[truː] adj. 真实的，正确的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> true (源自中古英语 "trewe"，意为"忠诚的")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个忠诚的骑士，手持盾牌，盾牌上刻着"TRUE"，
    <tspan x="50" dy="25">象征着他的忠诚和真实。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news report was true.
  </text>
  <text x="50" y="310" class="content">
    新闻报道是真实的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Knight -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="90" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="90" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <!-- Shield -->
    <rect x="80" y="30" width="100" height="80" class="image" />
    <text x="110" y="70" class="title" style="font-size: 36px;">TRUE</text>
  </g>
</svg>