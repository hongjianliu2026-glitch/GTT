<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">favor</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪvər] n. 喜爱，偏爱；v. 支持，偏袒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fa- (做) + vor (吃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在做(fa-)饭，大家都喜欢吃(vor)他做的菜，
    <tspan x="50" dy="25">于是他得到了大家的喜爱(favor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always favors her youngest child.
  </text>
  <text x="50" y="310" class="content">
    她总是偏爱她最小的孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef cooking -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Chef's head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Chef's body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Chef's left arm -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Chef's right arm -->
    <line x1="50" y1="160" x2="20" y2="150" class="image" /> <!-- Chef's left leg -->
    <line x1="50" y1="160" x2="80" y2="150" class="image" /> <!-- Chef's right leg -->
    <!-- Cooking pot -->
    <rect x="30" y="70" width="40" height="30" class="image" />
    <!-- Food -->
    <circle cx="40" cy="85" r="5" class="image" />
    <circle cx="50" cy="85" r="5" class="image" />
    <circle cx="60" cy="85" r="5" class="image" />
    <!-- People eating -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="120" y1="130" x2="150" y2="120" class="image" />
    <circle cx="180" cy="100" r="15" class="image" />
    <line x1="180" y1="115" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="160" y2="180" class="image" />
    <line x1="180" y1="150" x2="200" y2="180" class="image" />
    <line x1="180" y1="130" x2="210" y2="120" class="image" />
  </g>
</svg>