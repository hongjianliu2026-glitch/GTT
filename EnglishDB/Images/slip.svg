<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slip</text>
  <text x="50" y="120" class="subtitle">[slɪp] v. 滑倒，溜走；n. 滑倒，小错误</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sl- (滑) + -ip (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在冰面上"滑(sl-)"了一下，"动作(ip)"
    <tspan x="50" dy="25">迅速而突然，这就是滑倒(slip)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He slipped on the icy sidewalk and fell.
  </text>
  <text x="50" y="310" class="content">
    他在结冰的人行道上滑倒了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ice surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person slipping -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Ice crack -->
    <line x1="150" y1="180" x2="250" y2="180" class="image" />
    <line x1="150" y1="180" x2="150" y2="190" class="image" />
    <line x1="250" y1="180" x2="250" y2="190" class="image" />
  </g>
</svg>