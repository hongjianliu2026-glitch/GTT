<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mistakenly</text>
  <text x="50" y="120" class="subtitle">[mɪˈsteɪkənli] adv. 错误地，误解地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + take (拿) + -en (使) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在超市里，"错误地(mis-)"
    <tspan x="50" dy="25">拿(take)了别人的购物车，结果发现自己</tspan>
    <tspan x="50" dy="25">"错误地(mistakenly)"买了别人的东西。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He mistakenly thought the cake was for him.
  </text>
  <text x="50" y="310" class="content">
    他错误地以为那块蛋糕是给他的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Supermarket cart -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Mistakenly taken items -->
    <circle cx="80" cy="60" r="15" class="image" />
    <circle cx="120" cy="60" r="15" class="image" />
    <circle cx="160" cy="60" r="15" class="image" />
    <circle cx="200" cy="60" r="15" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Mistakenly taken cart -->
    <line x1="70" y1="140" x2="280" y2="140" class="image" />
    <line x1="70" y1="170" x2="250" y2="170" class="image" />
    <line x1="70" y1="200" x2="270" y2="200" class="image" />
  </g>
</svg>