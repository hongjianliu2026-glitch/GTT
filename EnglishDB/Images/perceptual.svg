<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perceptual</text>
  <text x="50" y="120" class="subtitle">[pərˈsɛpʧuəl] adj. 感知的，知觉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + cept (拿) + -ual (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人完全"拿住(per-cept)"了周围的一切，
    <tspan x="50" dy="25">他的感知能力如此强大，仿佛能"看穿"一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist's perceptual skills allowed him to capture the essence of the scene.
  </text>
  <text x="50" y="310" class="content">
    艺术家的感知能力使他能够捕捉到场景的精髓。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="20" class="image" fill="#2C3E50" />
    <!-- Rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Brain -->
    <rect x="200" y="50" width="100" height="100" class="image" />
    <!-- Connections -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
  </g>
</svg>