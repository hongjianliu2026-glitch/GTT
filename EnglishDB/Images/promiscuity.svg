<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">promiscuity</text>
  <text x="50" y="120" class="subtitle">[ˌproʊmɪˈskjuːəti] n. 混杂，杂乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + misc (混合) + -uity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的搅拌机，"向前混合(pro-misc)"
    <tspan x="50" dy="25">各种颜色和物品，结果就是一片混乱(promiscuity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The promiscuity of her social life was a topic of gossip.
  </text>
  <text x="50" y="310" class="content">
    她社交生活的杂乱无章成了八卦的话题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blender -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Blender container -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Mixed items -->
    <circle cx="100" cy="100" r="15" class="image" />
    <rect x="130" y="90" width="20" height="20" class="image" />
    <line x1="170" y1="90" x2="190" y2="110" class="image" />
    <line x1="170" y1="110" x2="190" y2="90" class="image" />
    <circle cx="220" cy="100" r="15" class="image" />
    <!-- Blender blades -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>