<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peripheral</text>
  <text x="50" y="120" class="subtitle">[pəˈrɪfərəl] adj. 外围的，次要的；n. 外围设备</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peri- (周围) + pher (携带) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一台电脑，"周围携带(peri-pher)"
    <tspan x="50" dy="25">着各种设备，这些设备就是电脑的外围设备(peripheral)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The printer is a common peripheral for a computer.
  </text>
  <text x="50" y="310" class="content">
    打印机是电脑的常见外围设备。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Computer -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Peripheral devices -->
    <rect x="220" y="20" width="100" height="50" class="image" /> <!-- Printer -->
    <rect x="220" y="90" width="100" height="50" class="image" /> <!-- Mouse -->
    <rect x="340" y="20" width="100" height="50" class="image" /> <!-- Keyboard -->
    <rect x="340" y="90" width="100" height="50" class="image" /> <!-- External Hard Drive -->
  </g>
</svg>