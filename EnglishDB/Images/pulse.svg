<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pulse</text>
  <text x="50" y="120" class="subtitle">[pʌls] n. 脉搏，脉动；v. 跳动，搏动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> puls (推动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗心脏在胸腔中"推动(puls)"血液，
    <tspan x="50" dy="25">每一次跳动都像是在发送一个脉冲(pulse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor checked his pulse to monitor his heart rate.
  </text>
  <text x="50" y="310" class="content">
    医生检查了他的脉搏以监测他的心率。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 50 Q20 20 50 30 Q80 20 90 50" class="image" />
    <path d="M10 50 Q20 80 50 70 Q80 80 90 50" class="image" />
    <!-- Pulse lines -->
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="150" class="image" />
    <line x1="50" y1="100" x2="70" y2="150" class="image" />
    <!-- Arrows indicating pulse -->
    <polygon points="50,100 40,120 60,120" class="image" />
    <polygon points="50,100 40,80 60,80" class="image" />
  </g>
</svg>