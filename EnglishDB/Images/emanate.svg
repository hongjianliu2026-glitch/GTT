<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">emanate</text>
  <text x="50" y="120" class="subtitle">[ˈɛməˌneɪt] v. 发出，散发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + man (手) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手从某个物体中"伸出(e-man-ate)"，
    <tspan x="50" dy="25">仿佛光芒或气味从物体中散发出来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fragrance of the flowers emanated from the garden.
  </text>
  <text x="50" y="310" class="content">
    花香从花园中散发出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Object emitting -->
    <rect x="100" y="50" width="100" height="100" class="image" />
    <!-- Hand reaching out -->
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="120" y2="300" class="image" />
    <line x1="150" y1="250" x2="180" y2="300" class="image" />
    <!-- Rays of light or scent -->
    <line x1="150" y1="100" x2="100" y2="50" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <line x1="150" y1="100" x2="150" y2="0" class="image" />
  </g>
</svg>