<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flurry</text>
  <text x="50" y="120" class="subtitle">[ˈflɜːri] n. 一阵疾风，一阵慌乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flurr- (快速移动) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一阵疾风(flurr-)突然袭来，树叶和雪花纷纷扬扬，
    <tspan x="50" dy="25">人们慌乱(flurry)地躲避。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A flurry of snowflakes greeted us as we stepped outside.
  </text>
  <text x="50" y="310" class="content">
    我们出门时，一阵雪花迎面而来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wind -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="20" x2="350" y2="220" class="image" />
    <line x1="0" y1="40" x2="350" y2="240" class="image" />
    <!-- Snowflakes -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="90" r="10" class="image" />
    <circle cx="200" cy="110" r="10" class="image" />
    <circle cx="250" cy="130" r="10" class="image" />
    <circle cx="300" cy="150" r="10" class="image" />
    <!-- People -->
    <circle cx="70" cy="180" r="15" class="image" />
    <line x1="70" y1="195" x2="70" y2="230" class="image" />
    <line x1="70" y1="230" x2="50" y2="260" class="image" />
    <line x1="70" y1="230" x2="90" y2="260" class="image" />
    <line x1="70" y1="210" x2="100" y2="200" class="image" />
  </g>
</svg>