<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">siphon</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪfən] n. 虹吸管；v. 用虹吸管吸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> siphon (源自希腊语 siphōn, 意为“管子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的虹吸管，"吸(siphon)"
    <tspan x="50" dy="25">起海洋中的水，形成壮观的瀑布。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a siphon to transfer the gasoline.
  </text>
  <text x="50" y="310" class="content">
    他用虹吸管转移汽油。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Siphon tube -->
    <path d="M0 100 C 50 50, 150 50, 200 100" class="image" />
    <path d="M200 100 C 250 150, 350 150, 400 100" class="image" />
    <!-- Water flow -->
    <path d="M200 100 Q 250 120, 300 100" class="image" stroke-dasharray="5,5" />
    <path d="M300 100 Q 350 80, 400 100" class="image" stroke-dasharray="5,5" />
    <!-- Ocean -->
    <rect x="0" y="150" width="400" height="50" class="image" />
    <!-- Waterfall -->
    <path d="M200 100 Q 250 50, 300 100" class="image" stroke-dasharray="5,5" />
    <path d="M300 100 Q 350 150, 400 100" class="image" stroke-dasharray="5,5" />
  </g>
</svg>