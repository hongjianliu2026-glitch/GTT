<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outpatient</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtˌpeɪʃnt] n. 门诊病人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (外面) + patient (病人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个病人从医院外面走进来，"外面的病人(out-patient)"
    <tspan x="50" dy="25">不需要住院，直接在门诊接受治疗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is an outpatient who visits the clinic regularly.
  </text>
  <text x="50" y="310" class="content">
    他是一个定期去诊所的门诊病人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hospital entrance -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Patient walking in -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Clinic sign -->
    <text x="200" y="100" class="content" style="font-size: 36px; fill: #2C3E50;">Clinic</text>
  </g>
</svg>