<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cycling</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪklɪŋ] n. 骑自行车，自行车运动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cycl(e) (圆圈) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人骑着自行车，车轮在地面画出一个个"圆圈(cycle)"，
    <tspan x="50" dy="25">这就是"骑自行车(cycling)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He enjoys cycling in the park on weekends.
  </text>
  <text x="50" y="310" class="content">
    他喜欢在周末去公园骑自行车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle -->
    <circle cx="100" cy="100" r="30" class="image" /> <!-- Front wheel -->
    <circle cx="250" cy="100" r="30" class="image" /> <!-- Back wheel -->
    <line x1="130" y1="100" x2="220" y2="100" class="image" /> <!-- Frame -->
    <line x1="175" y1="100" x2="175" y2="50" class="image" /> <!-- Seat post -->
    <line x1="175" y1="50" x2="175" y2="30" class="image" /> <!-- Seat -->
    <line x1="175" y1="70" x2="220" y2="70" class="image" /> <!-- Handlebar -->
    <line x1="220" y1="70" x2="220" y2="80" class="image" /> <!-- Handlebar -->
    <line x1="175" y1="100" x2="130" y2="130" class="image" /> <!-- Pedal -->
    <line x1="130" y1="130" x2="130" y2="140" class="image" /> <!-- Pedal -->
  </g>
</svg>