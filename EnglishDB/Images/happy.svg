<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E3; }
      .title { font: bold 48px sans-serif; fill: #FFD700; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">happy</text>
  <text x="50" y="120" class="subtitle">[ˈhæpi] adj. 快乐的，幸福的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hap (运气，机会)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幸运的人，"抓住了好运气(hap)"，
    <tspan x="50" dy="25">脸上洋溢着幸福的笑容，这就是快乐(happy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was happy to see her old friends.
  </text>
  <text x="50" y="310" class="content">
    她见到老朋友很开心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Happy face -->
    <circle cx="100" cy="100" r="80" class="image" fill="#FFD700" />
    <circle cx="70" cy="80" r="10" class="image" fill="#000" />
    <circle cx="130" cy="80" r="10" class="image" fill="#000" />
    <path d="M70 120 Q100 150 130 120" class="image" fill="none" stroke="#000" stroke-width="5" />
  </g>
</svg>