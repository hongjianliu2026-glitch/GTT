<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">degeneration</text>
  <text x="50" y="120" class="subtitle">[ˌdiːdʒənəˈreɪʃn] n. 退化，恶化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + gener (产生) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个曾经生机勃勃的植物，"向下产生(de-gener)"
    <tspan x="50" dy="25">变化，逐渐枯萎，象征着退化(degeneration)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The degeneration of the ecosystem is alarming.
  </text>
  <text x="50" y="310" class="content">
    生态系统的退化令人担忧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Healthy plant -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="30" y2="80" class="image" />
    <line x1="50" y1="50" x2="70" y2="80" class="image" />
    <line x1="50" y1="50" x2="20" y2="100" class="image" />
    <line x1="50" y1="50" x2="80" y2="100" class="image" />
    <!-- Degenerating plant -->
    <line x1="200" y1="150" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="200" y1="100" x2="170" y2="150" class="image" />
    <line x1="200" y1="100" x2="230" y2="150" class="image" />
    <!-- Arrow -->
    <line x1="125" y1="150" x2="125" y2="200" class="image" />
    <polygon points="120,200 130,200 125,210" class="image" />
  </g>
</svg>