<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hotly</text>
  <text x="50" y="120" class="subtitle">[ˈhɒtli] adv. 激烈地，热烈地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hot (热) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个辩论赛场上，双方"热烈地(hotly)"
    <tspan x="50" dy="25">争论，气氛紧张，仿佛火焰在燃烧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They debated the issue hotly.
  </text>
  <text x="50" y="310" class="content">
    他们就这个问题进行了激烈的辩论。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flame -->
    <path d="M50 50 C 70 20, 90 20, 110 50 S 150 80, 130 110 S 90 140, 70 110 S 30 80, 50 50" class="image" fill="#FF6347" />
    <!-- Debate -->
    <rect x="150" y="20" width="200" height="160" class="image" fill="#F4D03F" />
    <line x1="170" y1="50" x2="330" y2="50" class="image" />
    <line x1="170" y1="80" x2="330" y2="80" class="image" />
    <line x1="170" y1="110" x2="330" y2="110" class="image" />
    <line x1="170" y1="140" x2="330" y2="140" class="image" />
    <!-- Speakers -->
    <circle cx="200" cy="100" r="15" class="image" fill="#3498DB" />
    <circle cx="280" cy="100" r="15" class="image" fill="#E74C3C" />
  </g>
</svg>