<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FF5733; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C70039; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">colorful</text>
  <text x="50" y="120" class="subtitle">[ˈkʌlərfəl] adj. 色彩丰富的，丰富多彩的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> color (颜色) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家在调色板上，"充满(ful)"
    <tspan x="50" dy="25">各种颜色(color)，创造出一幅色彩斑斓的画作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist's palette was filled with colorful paints.
  </text>
  <text x="50" y="310" class="content">
    画家的调色板上充满了色彩丰富的颜料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Palette -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Colors -->
    <circle cx="50" cy="100" r="20" fill="#FF5733" />
    <circle cx="120" cy="100" r="20" fill="#33FF57" />
    <circle cx="190" cy="100" r="20" fill="#3357FF" />
    <circle cx="260" cy="100" r="20" fill="#FF33A6" />
    <circle cx="330" cy="100" r="20" fill="#A633FF" />
    <!-- Artist -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>