<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">falter</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːltər] v. 蹒跚，踌躇，动摇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fal (跌倒) + -ter (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路时，突然"跌倒(fal)"了，
    <tspan x="50" dy="25">然后又试图站起来，但再次"跌倒(ter)"，</tspan>
    <tspan x="50" dy="25">这种反复的动作就是"蹒跚(falter)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man faltered as he climbed the stairs.
  </text>
  <text x="50" y="310" class="content">
    老人在上楼梯时蹒跚了一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person faltering -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Falling motion -->
    <line x1="50" y1="220" x2="30" y2="260" class="image" /> <!-- Left leg faltering -->
    <line x1="50" y1="220" x2="70" y2="260" class="image" /> <!-- Right leg faltering -->
  </g>
</svg>