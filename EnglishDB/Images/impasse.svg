<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impasse</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpæs] n. 僵局，死路</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + pass (通过)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在一条路上，"无法通过(im-pass)"，
    <tspan x="50" dy="25">因为前方有一堵墙，这就是一个僵局(impasse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The negotiations reached an impasse.
  </text>
  <text x="50" y="310" class="content">
    谈判陷入了僵局。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="100" height="60" class="image" />
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="130" cy="50" r="10" class="image" />
    <!-- Wall -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <!-- Impasse sign -->
    <text x="275" y="60" class="highlight">Impasse</text>
  </g>
</svg>