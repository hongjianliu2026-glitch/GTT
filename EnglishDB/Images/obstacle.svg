<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">obstacle</text>
  <text x="50" y="120" class="subtitle">[ˈɑːbstəkl] n. 障碍，阻碍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (对面) + sta (站立) + -cle (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在前进的路上，"对面站立(ob-sta)"
    <tspan x="50" dy="25">着一个巨大的石头，这个石头就是他前进的障碍(obstacle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fallen tree was an obstacle to our path.
  </text>
  <text x="50" y="310" class="content">
    倒下的树成了我们道路上的障碍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Obstacle (stone) -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
  </g>
</svg>