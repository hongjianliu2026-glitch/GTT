<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jut</text>
  <text x="50" y="120" class="subtitle">[dʒʌt] v. 突出，伸出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jut (来自古英语geotan，意为“倒出”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块石头从悬崖边"倒出(jut)"，
    <tspan x="50" dy="25">它突然"伸出(jut)"，给人一种突兀的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rocks jutted out from the cliff, creating a dangerous path.
  </text>
  <text x="50" y="310" class="content">
    岩石从悬崖边突出，形成了一条危险的路径。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cliff -->
    <rect x="0" y="100" width="300" height="100" class="image" />
    <!-- Rock jutting out -->
    <rect x="100" y="50" width="100" height="100" class="image" />
    <!-- Arrow pointing to the jutting rock -->
    <line x1="150" y1="50" x2="150" y2="20" class="image" />
    <polygon points="140,20 160,20 150,10" class="image" />
    <!-- Text label -->
    <text x="150" y="15" class="content" text-anchor="middle">jut</text>
  </g>
</svg>