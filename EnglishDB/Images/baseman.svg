<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">baseman</text>
  <text x="50" y="120" class="subtitle">[ˈbeɪsmən] n. 棒球的一垒手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> base (基础) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个棒球场上，一个球员站在一垒(base)，
    <tspan x="50" dy="25">他是一个"基础人(baseman)"，负责守住这个关键位置。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baseman caught the ball and tagged the runner.
  </text>
  <text x="50" y="310" class="content">
    一垒手接住了球并触碰了跑垒员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baseball field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Base -->
    <rect x="50" y="100" width="50" height="50" class="image" />
    <!-- Baseman -->
    <circle cx="75" cy="125" r="15" class="image" />
    <line x1="75" y1="140" x2="75" y2="170" class="image" />
    <line x1="75" y1="170" x2="60" y2="190" class="image" />
    <line x1="75" y1="170" x2="90" y2="190" class="image" />
    <line x1="75" y1="155" x2="100" y2="145" class="image" />
    <!-- Ball -->
    <circle cx="150" cy="125" r="10" class="image" />
  </g>
</svg>