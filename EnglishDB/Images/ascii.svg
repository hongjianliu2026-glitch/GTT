<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ASCII</text>
  <text x="50" y="120" class="subtitle">[ˈæski] n. 美国信息交换标准代码</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> American Standard Code for Information Interchange
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的键盘，每个键上都刻着不同的符号和数字，
    <tspan x="50" dy="25">这些符号和数字就是ASCII码，它们是计算机用来交流的"语言"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ASCII code for the letter 'A' is 65.
  </text>
  <text x="50" y="310" class="content">
    'A'字母的ASCII码是65。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Keyboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Keys -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="260" y="20" width="50" height="50" class="image" />
    <!-- Symbols -->
    <text x="60" y="55" class="content">A</text>
    <text x="130" y="55" class="content">B</text>
    <text x="200" y="55" class="content">C</text>
    <text x="270" y="55" class="content">1</text>
    <!-- Numbers -->
    <text x="60" y="85" class="content">65</text>
    <text x="130" y="85" class="content">66</text>
    <text x="200" y="85" class="content">67</text>
    <text x="270" y="85" class="content">49</text>
  </g>
</svg>