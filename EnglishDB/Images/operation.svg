<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">operation</text>
  <text x="50" y="120" class="subtitle">[ˌɒpəˈreɪʃn] n. 操作，手术，行动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oper (工作) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个外科医生在手术室里，"工作(oper)"
    <tspan x="50" dy="25">进行手术，这个过程就是操作(operation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The operation was a success, and the patient is recovering well.
  </text>
  <text x="50" y="310" class="content">
    手术很成功，病人正在康复中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Operating room -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Surgeon -->
    <circle cx="80" cy="100" r="15" class="image" />
    <line x1="80" y1="115" x2="80" y2="150" class="image" />
    <line x1="80" y1="150" x2="60" y2="180" class="image" />
    <line x1="80" y1="150" x2="100" y2="180" class="image" />
    <line x1="80" y1="130" x2="110" y2="120" class="image" />
    <!-- Patient -->
    <rect x="150" y="80" width="100" height="40" class="image" />
    <!-- Surgical tools -->
    <line x1="200" y1="140" x2="220" y2="160" class="image" />
    <line x1="200" y1="160" x2="220" y2="140" class="image" />
    <line x1="230" y1="140" x2="230" y2="160" class="image" />
  </g>
</svg>