<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sovereignty</text>
  <text x="50" y="120" class="subtitle">[ˈsɒvrənti] n. 主权，统治权</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sover- (统治) + -eign (属于) + -ty (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个国王坐在宝座上，手持权杖，"统治(sover-)"
    <tspan x="50" dy="25">整个王国，这就是他的主权(sovereignty)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The country declared its sovereignty over the disputed territory.
  </text>
  <text x="50" y="310" class="content">
    该国宣布对争议领土拥有主权。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- King -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="120" y2="140" class="image" />
    <line x1="175" y1="150" x2="230" y2="140" class="image" />
    <!-- Scepter -->
    <line x1="175" y1="130" x2="175" y2="50" class="image" />
    <circle cx="175" cy="40" r="10" class="image" />
  </g>
</svg>