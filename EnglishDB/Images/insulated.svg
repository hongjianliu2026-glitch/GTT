<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insulated</text>
  <text x="50" y="120" class="subtitle">[ˈɪnsəˌleɪtɪd] adj. 绝缘的，隔热的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + sul (盖) + -ate (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房子被"盖上一层(in-sul-ate)"
    <tspan x="50" dy="25">厚厚的绝缘材料，这样房子就变得隔热了(insulated)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The house was insulated to keep the heat in during winter.
  </text>
  <text x="50" y="310" class="content">
    这房子做了隔热处理，以在冬天保持室内温暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Roof -->
    <polygon points="175,20 50,100 300,100" class="image" />
    <!-- Insulation layer -->
    <rect x="50" y="100" width="250" height="80" class="image" />
    <!-- Insulation material -->
    <line x1="70" y1="120" x2="280" y2="120" class="image" />
    <line x1="70" y1="140" x2="250" y2="140" class="image" />
    <line x1="70" y1="160" x2="270" y2="160" class="image" />
    <line x1="70" y1="180" x2="240" y2="180" class="image" />
  </g>
</svg>