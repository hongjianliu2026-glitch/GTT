<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nod</text>
  <text x="50" y="120" class="subtitle">[nɒd] v. 点头，打盹；n. 点头，打盹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nod (来自古英语 "hniodan"，意为"点头")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在会议上，"点头(nod)"表示同意，
    <tspan x="50" dy="25">或者在午休时"打盹(nod)"，头轻轻地上下晃动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She nodded in agreement during the meeting.
  </text>
  <text x="50" y="310" class="content">
    她在会议上点头表示同意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Body -->
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <!-- Arms -->
    <line x1="70" y1="150" x2="130" y2="150" class="image" />
    <!-- Legs -->
    <line x1="85" y1="200" x2="70" y2="250" class="image" />
    <line x1="115" y1="200" x2="130" y2="250" class="image" />
    <!-- Nodding motion -->
    <line x1="100" y1="100" x2="100" y2="80" class="image" />
    <line x1="100" y1="80" x2="90" y2="70" class="image" />
    <line x1="100" y1="80" x2="110" y2="70" class="image" />
  </g>
</svg>