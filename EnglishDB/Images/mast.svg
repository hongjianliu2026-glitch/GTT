<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mast</text>
  <text x="50" y="120" class="subtitle">[mæst] n. 桅杆，旗杆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mast (木头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘古老的帆船，船上竖立着一根高大的"木头(mast)"，
    <tspan x="50" dy="25">它支撑着船帆，带领船只在大海上航行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sailors climbed the mast to adjust the sails.
  </text>
  <text x="50" y="310" class="content">
    水手们爬上桅杆调整船帆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mast -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <!-- Sail -->
    <polygon points="100,0 50,100 150,100" class="image" />
    <!-- Ship -->
    <rect x="50" y="200" width="100" height="50" class="image" />
    <!-- Waves -->
    <path d="M0,250 Q50,230 100,250 T200,250" class="image" />
    <path d="M0,270 Q50,250 100,270 T200,270" class="image" />
  </g>
</svg>