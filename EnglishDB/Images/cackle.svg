<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cackle</text>
  <text x="50" y="120" class="subtitle">[ˈkækl] v. 咯咯笑，发出咯咯声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cack (咯咯声) + -le (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只母鸡在阳光下，"反复发出咯咯声(cack-le)"，
    <tspan x="50" dy="25">它的笑声像是在庆祝什么好事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old lady cackled with delight when she saw the surprise.
  </text>
  <text x="50" y="310" class="content">
    老妇人看到惊喜时高兴地咯咯笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hen -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="20" y2="100" class="image" /> <!-- Left wing -->
    <line x1="50" y1="120" x2="80" y2="100" class="image" /> <!-- Right wing -->
    <line x1="50" y1="150" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Cackle sound -->
    <path d="M100,50 Q150,20 200,50" class="image" />
    <path d="M100,70 Q150,40 200,70" class="image" />
    <path d="M100,90 Q150,60 200,90" class="image" />
  </g>
</svg>