<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hijacking</text>
  <text x="50" y="120" class="subtitle">[ˈhaɪdʒækɪŋ] n. 劫持，劫机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hi- (高) + jack (劫持)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架飞机被"高高举起(hi-jack)"，
    <tspan x="50" dy="25">一群劫匪控制了飞机，这就是劫持(hijacking)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news reported a hijacking incident at the airport.
  </text>
  <text x="50" y="310" class="content">
    新闻报道了机场发生的一起劫机事件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Airplane -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="50" x2="70" y2="20" class="image" />
    <line x1="300" y1="50" x2="280" y2="20" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="100" y2="150" class="image" />
    <line x1="150" y1="100" x2="200" y2="150" class="image" />
    <!-- Hijackers -->
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="200" cy="120" r="15" class="image" />
    <line x1="100" y1="135" x2="100" y2="170" class="image" />
    <line x1="200" y1="135" x2="200" y2="170" class="image" />
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="200" y1="170" x2="220" y2="200" class="image" />
    <line x1="100" y1="150" x2="120" y2="140" class="image" />
    <line x1="200" y1="150" x2="180" y2="140" class="image" />
  </g>
</svg>