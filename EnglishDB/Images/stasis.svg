<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stasis</text>
  <text x="50" y="120" class="subtitle">[ˈsteɪsɪs] n. 停滞，静止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sta- (站立) + -sis (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，指针"站立不动(sta-sis)"，
    <tspan x="50" dy="25">时间仿佛停滞了一般，这就是停滞(stasis)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project has been in stasis for months.
  </text>
  <text x="50" y="310" class="content">
    这个项目已经停滞了几个月。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="30" class="image" />
    <line x1="175" y1="100" x2="235" y2="100" class="image" />
    <!-- Stagnant water -->
    <rect x="50" y="200" width="250" height="50" class="image" />
    <text x="175" y="230" text-anchor="middle" class="content">停滞的水</text>
  </g>
</svg>