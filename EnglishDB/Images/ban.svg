<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ban</text>
  <text x="50" y="120" class="subtitle">[bæn] n. 禁令，禁止；v. 禁止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ban (源自拉丁语 "bannum"，意为宣布或命令)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色"禁止"标志，上面写着"BAN"，
    <tspan x="50" dy="25">象征着某种行为的严厉禁止。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government imposed a ban on smoking in public places.
  </text>
  <text x="50" y="310" class="content">
    政府颁布了公共场所禁烟令。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red circle -->
    <circle cx="100" cy="100" r="80" class="image" fill="#E74C3C" />
    <!-- Slash -->
    <line x1="40" y1="40" x2="160" y2="160" class="image" stroke="#FFFFFF" stroke-width="10" />
    <!-- Text "BAN" -->
    <text x="60" y="120" class="content" fill="#FFFFFF" font-size="48" font-weight="bold">BAN</text>
  </g>
</svg>