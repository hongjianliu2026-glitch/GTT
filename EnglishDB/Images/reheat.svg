<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reheat</text>
  <text x="50" y="120" class="subtitle">[riːˈhiːt] v. 重新加热</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + heat (加热)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"再次加热(re-heat)"
    <tspan x="50" dy="25">一盘冷掉的菜，让它重新变得热腾腾。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She reheated the leftovers for dinner.
  </text>
  <text x="50" y="310" class="content">
    她把剩菜重新加热作为晚餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kitchen counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Plate -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Food -->
    <circle cx="100" cy="60" r="20" class="image" />
    <circle cx="80" cy="40" r="15" class="image" />
    <circle cx="120" cy="40" r="15" class="image" />
    <!-- Stove -->
    <rect x="200" y="20" width="100" height="80" class="image" />
    <!-- Flame -->
    <polygon points="250,20 230,40 270,40" class="image" />
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>