<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">activate</text>
  <text x="50" y="120" class="subtitle">[ˈæktɪveɪt] v. 激活，启动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> act (行动) + -ive (形容词后缀) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个按钮被按下，"行动(act)"的力量被"激活(activate)"，
    <tspan x="50" dy="25">整个系统开始运转。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The technician activated the machine with a single press.
  </text>
  <text x="50" y="310" class="content">
    技术人员轻轻一按就启动了机器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Button -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <text x="20" y="30" class="content" fill="#FFFFFF">ACT</text>
    <!-- Machine -->
    <rect x="150" y="0" width="200" height="150" class="image" />
    <!-- Moving parts -->
    <line x1="170" y1="50" x2="230" y2="50" class="image" />
    <line x1="170" y1="80" x2="230" y2="80" class="image" />
    <line x1="170" y1="110" x2="230" y2="110" class="image" />
  </g>
</svg>