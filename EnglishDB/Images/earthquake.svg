<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">earthquake</text>
  <text x="50" y="120" class="subtitle">[ˈɜːrθkweɪk] n. 地震</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> earth (地球) + quake (震动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象地球(earth)突然开始剧烈震动(quake)，
    <tspan x="50" dy="25">地面裂开，建筑物摇晃，这就是地震(earthquake)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The earthquake caused widespread damage.
  </text>
  <text x="50" y="310" class="content">
    地震造成了广泛的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="80" class="image" fill="#2ECC71" />
    <!-- Cracks -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <!-- Buildings -->
    <rect x="20" y="20" width="30" height="60" class="image" />
    <rect x="60" y="20" width="30" height="60" class="image" />
    <rect x="100" y="20" width="30" height="60" class="image" />
    <rect x="140" y="20" width="30" height="60" class="image" />
    <!-- Shaking effect -->
    <line x1="20" y1="20" x2="170" y2="20" class="image" />
    <line x1="20" y1="80" x2="170" y2="80" class="image" />
    <line x1="20" y1="140" x2="170" y2="140" class="image" />
  </g>
</svg>