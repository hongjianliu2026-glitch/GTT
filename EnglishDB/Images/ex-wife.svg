<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ex-wife</text>
  <text x="50" y="120" class="subtitle">[ˈɛksˌwaɪf] n. 前妻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (前) + wife (妻子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个男人站在法庭前，"前(ex-)"
    <tspan x="50" dy="25">妻(wife)正在与他办理离婚手续，</tspan>
    <tspan x="50" dy="25">从此她成为了他的前妻(ex-wife)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His ex-wife moved to another city after the divorce.
  </text>
  <text x="50" y="310" class="content">
    离婚后，他的前妻搬到了另一个城市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Man -->
    <circle cx="100" cy="120" r="15" class="image" />
    <line x1="100" y1="135" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="200" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
    <!-- Woman (ex-wife) -->
    <circle cx="200" cy="120" r="15" class="image" />
    <line x1="200" y1="135" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="180" y2="200" class="image" />
    <line x1="200" y1="170" x2="220" y2="200" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
    <!-- Divorce papers -->
    <rect x="150" y="80" width="50" height="30" class="image" />
    <line x1="150" y1="80" x2="200" y2="110" class="image" />
    <line x1="200" y1="80" x2="150" y2="110" class="image" />
  </g>
</svg>