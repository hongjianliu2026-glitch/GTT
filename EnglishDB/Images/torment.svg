<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">torment</text>
  <text x="50" y="120" class="subtitle">[ˈtɔːrmənt] n. 折磨，痛苦；v. 使痛苦，折磨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tor- (扭曲) + ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"扭曲(tor-)"得痛苦不堪，
    <tspan x="50" dy="25">这种痛苦就是折磨(torment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The constant noise tormented her.
  </text>
  <text x="50" y="310" class="content">
    持续的噪音折磨着她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tormented person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Twisted lines -->
    <path d="M100,50 Q150,100 200,50 Q250,0 300,50" class="image" />
    <path d="M100,150 Q150,200 200,150 Q250,100 300,150" class="image" />
  </g>
</svg>