<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cannibalism</text>
  <text x="50" y="120" class="subtitle">[ˈkænɪbəlɪzəm] n. 同类相食，食人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cann (吃) + ibal (人) + ism (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恐怖的场景，一个人类"吃(cann)"
    <tspan x="50" dy="25">另一个人类(ibal)，这种行为就是同类相食(cannibalism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tribe was accused of practicing cannibalism.
  </text>
  <text x="50" y="310" class="content">
    这个部落被指控实行同类相食。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Human figure -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />

    <!-- Another human figure being eaten -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="150" x2="170" y2="140" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />

    <!-- Eating action -->
    <line x1="80" y1="100" x2="170" y2="100" class="image" />
    <line x1="125" y1="100" x2="125" y2="150" class="image" />
  </g>
</svg>