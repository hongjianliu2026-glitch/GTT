<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trudge</text>
  <text x="50" y="120" class="subtitle">[trʌdʒ] v. 跋涉，艰难地走</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trud- (推，挤) + -e (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在泥泞的路上，"用力推挤(trud-)"
    <tspan x="50" dy="25">着前行，每一步都显得异常艰难，这就是跋涉(trudge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They trudged through the snow for hours.
  </text>
  <text x="50" y="310" class="content">
    他们在雪地里跋涉了几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Muddy path -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Footprints -->
    <line x1="70" y1="50" x2="100" y2="50" class="image" />
    <line x1="85" y1="50" x2="85" y2="70" class="image" />
    <line x1="120" y1="80" x2="150" y2="80" class="image" />
    <line x1="135" y1="80" x2="135" y2="100" class="image" />
    <line x1="170" y1="110" x2="200" y2="110" class="image" />
    <line x1="185" y1="110" x2="185" y2="130" class="image" />
    <!-- Person trudging -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>