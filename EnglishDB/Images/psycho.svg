<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">psycho</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪkoʊ] n. 精神病患者，疯子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> psych- (心灵，精神) + -o (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"心灵(psych-)"被扭曲的人，
    <tspan x="50" dy="25">他的行为异常，就像一个"疯子(psycho)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie's psycho character scared everyone.
  </text>
  <text x="50" y="310" class="content">
    电影中的精神病患者角色吓坏了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Distorted face -->
    <line x1="70" y1="80" x2="130" y2="120" class="image" />
    <line x1="70" y1="120" x2="130" y2="80" class="image" />
    <!-- Crazy eyes -->
    <circle cx="80" cy="90" r="10" class="image" />
    <circle cx="120" cy="90" r="10" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="130" x2="120" y2="130" class="image" />
    <!-- Distorted body -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="200" class="image" />
    <line x1="100" y1="180" x2="150" y2="200" class="image" />
  </g>
</svg>