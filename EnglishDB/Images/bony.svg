<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bony</text>
  <text x="50" y="120" class="subtitle">[ˈboʊni] adj. 骨头的，瘦骨嶙峋的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bone (骨头) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个瘦骨嶙峋的人，"骨头(bone)"
    <tspan x="50" dy="25">突出，看起来就像是由骨头构成的(bony)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man had a bony appearance.
  </text>
  <text x="50" y="310" class="content">
    那位老人看起来瘦骨嶙峋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skeleton -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="30" y2="60" class="image" />
    <line x1="50" y1="20" x2="70" y2="60" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="80" x2="30" y2="120" class="image" />
    <line x1="50" y1="80" x2="70" y2="120" class="image" />
    <line x1="50" y1="130" x2="30" y2="170" class="image" />
    <line x1="50" y1="130" x2="70" y2="170" class="image" />
  </g>
</svg>