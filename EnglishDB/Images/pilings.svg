<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pilings</text>
  <text x="50" y="120" class="subtitle">[ˈpaɪlɪŋz] n. 桩，柱子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pile (堆) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群巨大的木桩(pile)像士兵一样整齐地排列着，
    <tspan x="50" dy="25">它们就是"桩群(pilings)"，支撑着整个建筑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pilings were driven deep into the ground to support the bridge.
  </text>
  <text x="50" y="310" class="content">
    这些桩子被深深打入地下，以支撑桥梁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Piles -->
    <rect x="0" y="0" width="50" height="200" class="image" />
    <rect x="70" y="0" width="50" height="200" class="image" />
    <rect x="140" y="0" width="50" height="200" class="image" />
    <rect x="210" y="0" width="50" height="200" class="image" />
    <rect x="280" y="0" width="50" height="200" class="image" />
  </g>
</svg>