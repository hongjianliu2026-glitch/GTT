<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">duel</text>
  <text x="50" y="120" class="subtitle">[ˈdjuːəl] n. 决斗；v. 决斗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> du- (二) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个勇士手持剑，面对面站立，准备进行一场"二对二(du-el)"的决斗。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to duel to settle their dispute.
  </text>
  <text x="50" y="310" class="content">
    他们决定通过决斗来解决争端。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Two warriors -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="80" y2="130" class="image" />
    <line x1="100" y1="150" x2="120" y2="130" class="image" />
    <line x1="100" y1="180" x2="80" y2="200" class="image" />
    <line x1="100" y1="180" x2="120" y2="200" class="image" />
    <line x1="100" y1="120" x2="80" y2="140" class="image" />
    <line x1="100" y1="120" x2="120" y2="140" class="image" />

    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="180" class="image" />
    <line x1="300" y1="150" x2="280" y2="130" class="image" />
    <line x1="300" y1="150" x2="320" y2="130" class="image" />
    <line x1="300" y1="180" x2="280" y2="200" class="image" />
    <line x1="300" y1="180" x2="320" y2="200" class="image" />
    <line x1="300" y1="120" x2="280" y2="140" class="image" />
    <line x1="300" y1="120" x2="320" y2="140" class="image" />

    <!-- Swords -->
    <line x1="100" y1="100" x2="300" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="80" class="image" />
    <line x1="300" y1="100" x2="320" y2="80" class="image" />
  </g>
</svg>