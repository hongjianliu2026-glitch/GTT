<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clandestine</text>
  <text x="50" y="120" class="subtitle">[klænˈdɛstɪn] adj. 秘密的，暗中的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clandes- (秘密) + -tine (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个间谍在黑暗中，"秘密地(clandes-tine)"
    <tspan x="50" dy="25">执行任务，不被任何人发现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clandestine meeting was held in a secluded location.
  </text>
  <text x="50" y="310" class="content">
    秘密会议在一个偏僻的地方举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Spy silhouette -->
    <circle cx="50" cy="100" r="20" class="image" fill="#FFFFFF" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" stroke="#FFFFFF" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" stroke="#FFFFFF" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" stroke="#FFFFFF" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" stroke="#FFFFFF" />
    <!-- Dark alley -->
    <line x1="100" y1="190" x2="350" y2="190" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="180" x2="350" y2="180" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="170" x2="350" y2="170" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="160" x2="350" y2="160" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="150" x2="350" y2="150" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="140" x2="350" y2="140" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="130" x2="350" y2="130" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="120" x2="350" y2="120" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="110" x2="350" y2="110" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="100" x2="350" y2="100" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="90" x2="350" y2="90" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="80" x2="350" y2="80" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="70" x2="350" y2="70" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="60" x2="350" y2="60" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="50" x2="350" y2="50" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="40" x2="350" y2="40" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="30" x2="350" y2="30" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="20" x2="350" y2="20" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="10" x2="350" y2="10" class="image" stroke="#FFFFFF" />
    <line x1="100" y1="0" x2="350" y2="0" class="image" stroke="#FFFFFF" />
  </g>
</svg>