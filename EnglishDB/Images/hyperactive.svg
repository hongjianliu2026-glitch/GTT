<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hyperactive</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪpərˈæktɪv] adj. 极度活跃的，多动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hyper- (超过) + active (活跃的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子，"超过(hyper-)"正常活跃的程度，
    <tspan x="50" dy="25">像个小火箭一样四处乱窜，这就是极度活跃(hyperactive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hyperactive child couldn't sit still during the class.
  </text>
  <text x="50" y="310" class="content">
    那个极度活跃的孩子在课堂上坐不住。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hyperactive child -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="140" class="image" /> <!-- Right arm -->
    <!-- Rocket -->
    <polygon points="100,100 150,100 125,50" class="image" /> <!-- Rocket body -->
    <line x1="125" y1="100" x2="125" y2="150" class="image" /> <!-- Rocket tail -->
    <line x1="115" y1="140" x2="135" y2="140" class="image" /> <!-- Rocket flame -->
  </g>
</svg>