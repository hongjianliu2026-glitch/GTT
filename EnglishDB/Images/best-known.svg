<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">best-known</text>
  <text x="50" y="120" class="subtitle">[ˌbɛstˈnoʊn] adj. 最著名的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> best (最好的) + known (已知的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的奖杯，上面刻着"最著名的(best-known)"
    <tspan x="50" dy="25">人物或事物，这个奖杯象征着无人不知的荣耀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is the best-known actress in Hollywood.
  </text>
  <text x="50" y="310" class="content">
    她是好莱坞最著名的女演员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trophy -->
    <polygon points="0,100 50,0 100,100" class="image" />
    <rect x="30" y="100" width="40" height="100" class="image" />
    <circle cx="50" cy="220" r="20" class="image" />
    <!-- Star -->
    <polygon points="50,180 60,200 80,200 65,215 70,235 50,225 30,235 35,215 20,200 40,200" class="image" />
    <!-- Text on trophy -->
    <text x="35" y="150" class="content" fill="#E74C3C">Best-Known</text>
  </g>
</svg>