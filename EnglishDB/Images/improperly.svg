<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">improperly</text>
  <text x="50" y="120" class="subtitle">[ɪmˈprɒpəli] adv. 不恰当地，错误地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + proper (适当的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着西装，却"不恰当地(im-proper-ly)"
    <tspan x="50" dy="25">戴着一顶滑稽的帽子，这种搭配显然是错误的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was criticized for improperly handling the situation.
  </text>
  <text x="50" y="310" class="content">
    他因错误地处理情况而受到批评。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Suit -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Shirt -->
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Tie -->
    <rect x="60" y="20" width="30" height="100" class="image" />
    <!-- Hat -->
    <rect x="40" y="0" width="70" height="20" class="image" />
    <!-- Question mark -->
    <text x="120" y="100" class="image" font-size="60">?</text>
  </g>
</svg>