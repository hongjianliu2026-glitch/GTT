<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">corpus</text>
  <text x="50" y="120" class="subtitle">[ˈkɔːrpəs] n. 文集，语料库</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> corp (身体) + -us (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的“身体(corp)”，里面装满了各种书籍和文档，
    <tspan x="50" dy="25">这些书籍和文档集合在一起，形成了一个“文集(corpus)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The corpus of Shakespeare's works is vast.
  </text>
  <text x="50" y="310" class="content">
    莎士比亚作品的文集非常庞大。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Body outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="50" height="80" class="image" />
    <rect x="120" y="20" width="50" height="80" class="image" />
    <rect x="190" y="20" width="50" height="80" class="image" />
    <rect x="260" y="20" width="50" height="80" class="image" />
    <!-- Documents -->
    <rect x="50" y="120" width="50" height="60" class="image" />
    <rect x="120" y="120" width="50" height="60" class="image" />
    <rect x="190" y="120" width="50" height="60" class="image" />
    <rect x="260" y="120" width="50" height="60" class="image" />
  </g>
</svg>