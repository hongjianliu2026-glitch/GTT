<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mommy</text>
  <text x="50" y="120" class="subtitle">[ˈmʌmi] n. 妈咪，妈妈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mom (妈妈) + -y (表示亲昵)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小宝宝在妈妈的怀里，"妈咪(mommy)"
    <tspan x="50" dy="25">温柔地抱着他，给他无尽的爱和关怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby called out "Mommy" when she saw her mother.
  </text>
  <text x="50" y="310" class="content">
    宝宝看到妈妈时喊了一声"妈咪"。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Baby -->
    <circle cx="150" cy="120" r="20" class="image" />
    <line x1="150" y1="140" x2="150" y2="180" class="image" />
    <line x1="150" y1="160" x2="130" y2="150" class="image" />
    <line x1="150" y1="160" x2="170" y2="150" class="image" />
    <line x1="150" y1="180" x2="130" y2="200" class="image" />
    <line x1="150" y1="180" x2="170" y2="200" class="image" />
    <!-- Connection -->
    <line x1="80" y1="200" x2="120" y2="180" class="image" />
  </g>
</svg>