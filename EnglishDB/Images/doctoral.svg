<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">doctoral</text>
  <text x="50" y="120" class="subtitle">[ˈdɑktərəl] adj. 博士的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> doctor (医生，博士) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个博士(doctor)站在讲台上，"高高在上(doctor-al)"
    <tspan x="50" dy="25">地发表演讲，他的博士学位让他显得格外权威。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He received his doctoral degree in physics.
  </text>
  <text x="50" y="310" class="content">
    他获得了物理学博士学位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lectern -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Doctor -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="170" y2="220" class="image" />
    <line x1="200" y1="180" x2="230" y2="220" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M250,70 Q300,70 300,100 Q250,100 250,70 Z" class="image" />
    <text x="260" y="90" class="content">博士</text>
  </g>
</svg>