<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">capsule</text>
  <text x="50" y="120" class="subtitle">[ˈkæpsjuːl] n. 胶囊，太空舱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cap (头) + -sule (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小小的"头(cap)"形状的"小(sule)"容器，
    <tspan x="50" dy="25">就像一个胶囊(capsule)，里面装满了药物或信息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She took a capsule of vitamin C before breakfast.
  </text>
  <text x="50" y="310" class="content">
    她在早餐前吃了一粒维生素C胶囊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Capsule shape -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <ellipse cx="175" cy="100" rx="90" ry="45" class="image" />
    <!-- Capsule top -->
    <ellipse cx="175" cy="50" rx="50" ry="25" class="image" />
    <!-- Capsule bottom -->
    <ellipse cx="175" cy="150" rx="50" ry="25" class="image" />
    <!-- Capsule lines -->
    <line x1="75" y1="100" x2="275" y2="100" class="image" />
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
  </g>
</svg>