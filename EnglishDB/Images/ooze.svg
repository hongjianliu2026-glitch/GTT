<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ooze</text>
  <text x="50" y="120" class="subtitle">[uːz] v. 渗出，慢慢流出；n. 渗出物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oo- (液体) + ze (移动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一滩黏稠的液体，"慢慢移动(oo-ze)"
    <tspan x="50" dy="25">从高处渗出，形成一条黏糊糊的路径。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oil began to ooze out of the cracked pipe.
  </text>
  <text x="50" y="310" class="content">
    油开始从破裂的管道中渗出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Liquid oozing -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <line x1="100" y1="200" x2="200" y2="200" class="image" />
    <line x1="150" y1="200" x2="150" y2="250" class="image" />
    <line x1="100" y1="250" x2="200" y2="250" class="image" />
    <line x1="150" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="300" x2="200" y2="300" class="image" />
  </g>
</svg>