<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">graph</text>
  <text x="50" y="120" class="subtitle">[ɡræf] n. 图表，图形</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grapho (写)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"写下(grapho)"
    <tspan x="50" dy="25">数据并绘制成图表(graph)，以便更直观地展示研究结果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The graph shows a steady increase in sales over the past year.
  </text>
  <text x="50" y="310" class="content">
    图表显示过去一年销售额稳步增长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Graph paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Axes -->
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="180" x2="50" y2="20" class="image" />
    <!-- Data points -->
    <circle cx="70" cy="160" r="5" class="image" />
    <circle cx="100" cy="140" r="5" class="image" />
    <circle cx="130" cy="120" r="5" class="image" />
    <circle cx="160" cy="100" r="5" class="image" />
    <circle cx="190" cy="80" r="5" class="image" />
    <circle cx="220" cy="60" r="5" class="image" />
    <circle cx="250" cy="40" r="5" class="image" />
    <circle cx="280" cy="20" r="5" class="image" />
    <!-- Connecting lines -->
    <polyline points="70,160 100,140 130,120 160,100 190,80 220,60 250,40 280,20" class="image" />
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>