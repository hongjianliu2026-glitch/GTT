<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">black-and-white</text>
  <text x="50" y="120" class="subtitle">[ˌblæk ənd ˈwaɪt] adj. 黑白的；非黑即白的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> black (黑色) + white (白色)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个世界只有黑色和白色，没有其他颜色，
    <tspan x="50" dy="25">这种极端的对比让人印象深刻，就像是非黑即白的思维方式。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was filmed in black-and-white.
  </text>
  <text x="50" y="310" class="content">
    这部电影是用黑白胶片拍摄的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Black square -->
    <rect x="0" y="0" width="150" height="150" fill="black" />
    <!-- White square -->
    <rect x="200" y="0" width="150" height="150" fill="white" stroke="black" stroke-width="2" />
    <!-- Text labels -->
    <text x="75" y="180" class="content" text-anchor="middle">Black</text>
    <text x="275" y="180" class="content" text-anchor="middle">White</text>
  </g>
</svg>