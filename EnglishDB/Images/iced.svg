<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ice { fill: #AED6F1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">iced</text>
  <text x="50" y="120" class="subtitle">[aɪst] adj. 冰镇的，冰冻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ice (冰) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯饮料被"冰(ice)"覆盖，
    <tspan x="50" dy="25">表面结满了冰晶，这就是冰镇的(iced)饮料。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I prefer my coffee iced during the summer.
  </text>
  <text x="50" y="310" class="content">
    夏天我喜欢喝冰咖啡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass of iced drink -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <rect x="20" y="20" width="160" height="260" class="image" />
    <!-- Ice cubes -->
    <rect x="40" y="40" width="30" height="30" class="ice" />
    <rect x="90" y="40" width="30" height="30" class="ice" />
    <rect x="140" y="40" width="30" height="30" class="ice" />
    <rect x="40" y="90" width="30" height="30" class="ice" />
    <rect x="90" y="90" width="30" height="30" class="ice" />
    <rect x="140" y="90" width="30" height="30" class="ice" />
    <!-- Drink -->
    <rect x="20" y="280" width="160" height="20" class="image" />
  </g>
</svg>