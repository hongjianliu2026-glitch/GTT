<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rugged</text>
  <text x="50" y="120" class="subtitle">[ˈrʌɡɪd] adj. 崎岖的，粗糙的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rug (皱) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片崎岖不平的山地，"皱皱的(rug)"
    <tspan x="50" dy="25">表面布满了岩石和裂缝，这就是崎岖的(rugged)景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hiker traversed the rugged terrain with ease.
  </text>
  <text x="50" y="310" class="content">
    徒步者轻松地穿越了崎岖的地形。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rugged mountain -->
    <path d="M0 100 L100 0 L200 100 L300 0 L400 100 L500 0 L600 100 L700 0 L800 100" class="image" />
    <!-- Rocks -->
    <circle cx="150" cy="150" r="20" class="image" />
    <circle cx="250" cy="150" r="25" class="image" />
    <circle cx="350" cy="150" r="30" class="image" />
    <circle cx="450" cy="150" r="25" class="image" />
    <circle cx="550" cy="150" r="20" class="image" />
  </g>
</svg>