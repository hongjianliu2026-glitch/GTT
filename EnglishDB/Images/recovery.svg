<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recovery</text>
  <text x="50" y="120" class="subtitle">[rɪˈkʌvəri] n. 恢复，康复</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + cover (覆盖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从病床上站起来，"再次覆盖(re-cover)"
    <tspan x="50" dy="25">自己的健康，这就是康复(recovery)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the surgery, his recovery was quick.
  </text>
  <text x="50" y="310" class="content">
    手术后，他的恢复很快。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person standing -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Health symbol -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="240" y2="120" class="image" />
  </g>
</svg>