<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enthusiast</text>
  <text x="50" y="120" class="subtitle">[ɪnˈθjuːziæst] n. 热心者，狂热者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + thus (神) + iast (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狂热者被"神(thus)"的力量"注入(en)"，
    <tspan x="50" dy="25">变得无比热情，就像被神附体一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a real enthusiast for classical music.
  </text>
  <text x="50" y="310" class="content">
    他是个真正的古典音乐狂热者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Enthusiast -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Lightning bolt -->
    <polyline points="100,50 120,70 80,90 120,110 100,130" class="image" />
    <!-- God -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="150" x2="120" y2="130" class="image" />
    <line x1="150" y1="150" x2="180" y2="130" class="image" />
    <line x1="150" y1="180" x2="120" y2="220" class="image" />
    <line x1="150" y1="180" x2="180" y2="220" class="image" />
  </g>
</svg>