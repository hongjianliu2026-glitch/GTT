<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">collagen</text>
  <text x="50" y="120" class="subtitle">[ˈkɒlədʒən] n. 胶原蛋白</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (共同) + lage (粘合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你的皮肤是由无数的"粘合剂(lage)"
    <tspan x="50" dy="25">共同(col-)组成的，这些粘合剂就是胶原蛋白(collagen)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Collagen is essential for maintaining skin elasticity.
  </text>
  <text x="50" y="310" class="content">
    胶原蛋白对于保持皮肤弹性至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skin layer -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Collagen fibers -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Skin texture -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <!-- Collagen molecules -->
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
  </g>
</svg>