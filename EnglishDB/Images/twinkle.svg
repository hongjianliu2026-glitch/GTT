<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .star { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twinkle</text>
  <text x="50" y="120" class="subtitle">[ˈtwɪŋkl] v. 闪烁，闪耀；n. 闪烁，闪光</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twink (闪烁) + -le (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象夜空中，星星在不停地"闪烁(twink-le)"，
    <tspan x="50" dy="25">就像是在对你眨眼，这种反复的动作就是twinkle。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stars twinkled in the clear night sky.
  </text>
  <text x="50" y="310" class="content">
    星星在晴朗的夜空中闪烁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star 1 -->
    <polygon points="0,50 20,0 40,50 0,30 40,30" class="star" />
    <!-- Star 2 -->
    <polygon points="60,50 80,0 100,50 60,30 100,30" class="star" />
    <!-- Star 3 -->
    <polygon points="120,50 140,0 160,50 120,30 160,30" class="star" />
    <!-- Star 4 -->
    <polygon points="180,50 200,0 220,50 180,30 220,30" class="star" />
    <!-- Star 5 -->
    <polygon points="240,50 260,0 280,50 240,30 280,30" class="star" />
  </g>
</svg>