<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #8B0000; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dreary</text>
  <text x="50" y="120" class="subtitle">[ˈdrɪəri] adj. 沉闷的，阴郁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dreg- (拖，拉) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阴沉的天气，"拖拉着(dreg-)"
    <tspan x="50" dy="25">沉重的步伐，整个世界都显得沉闷(dreary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dreary weather made everyone feel gloomy.
  </text>
  <text x="50" y="310" class="content">
    阴沉的天气让每个人都感到忧郁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Rain drops -->
    <line x1="70" y1="150" x2="70" y2="250" class="image" />
    <line x1="120" y1="150" x2="120" y2="250" class="image" />
    <line x1="170" y1="150" x2="170" y2="250" class="image" />
    <line x1="220" y1="150" x2="220" y2="250" class="image" />
    <line x1="270" y1="150" x2="270" y2="250" class="image" />
    <!-- Person -->
    <circle cx="200" cy="300" r="20" class="image" />
    <line x1="200" y1="320" x2="200" y2="380" class="image" />
    <line x1="200" y1="380" x2="180" y2="420" class="image" />
    <line x1="200" y1="380" x2="220" y2="420" class="image" />
    <line x1="200" y1="350" x2="160" y2="360" class="image" />
    <line x1="200" y1="350" x2="240" y2="360" class="image" />
  </g>
</svg>