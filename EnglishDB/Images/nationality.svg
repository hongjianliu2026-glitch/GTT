<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nationality</text>
  <text x="50" y="120" class="subtitle">[ˌnæʃəˈnæləti] n. 国籍，民族</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nation (国家) + -ality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个世界地图上，每个国家都有一个独特的标志，
    <tspan x="50" dy="25">这些标志代表着不同的"国籍(nationality)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She holds dual nationality, American and British.
  </text>
  <text x="50" y="310" class="content">
    她拥有美国和英国双重国籍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- World map -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="150" cy="150" r="50" class="image" />
    <circle cx="50" cy="150" r="40" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <circle cx="250" cy="150" r="60" class="image" />
    <!-- Flags -->
    <rect x="50" y="20" width="20" height="40" class="image" />
    <rect x="100" y="20" width="20" height="40" class="image" />
    <rect x="150" y="20" width="20" height="40" class="image" />
    <rect x="200" y="20" width="20" height="40" class="image" />
    <rect x="250" y="20" width="20" height="40" class="image" />
    <!-- Nationality labels -->
    <text x="50" y="80" class="content">USA</text>
    <text x="100" y="80" class="content">UK</text>
    <text x="150" y="80" class="content">FR</text>
    <text x="200" y="80" class="content">CN</text>
    <text x="250" y="80" class="content">JP</text>
  </g>
</svg>