<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">affinity</text>
  <text x="50" y="120" class="subtitle">[əˈfɪnɪti] n. 亲和力，吸引力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> af- (加强) + fin (边界) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人之间有一种看不见的"边界(fin)"，
    <tspan x="50" dy="25">这种边界被"加强(af-)"，形成了一种强烈的"亲和力(affinity)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt an instant affinity with her new colleague.
  </text>
  <text x="50" y="310" class="content">
    她立刻对她的新同事产生了亲和力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Invisible boundary -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Two people -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />

    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="120" y2="120" class="image" />

    <!-- Connecting lines -->
    <line x1="65" y1="115" x2="135" y2="115" class="image" />
    <line x1="65" y1="130" x2="135" y2="130" class="image" />
  </g>
</svg>