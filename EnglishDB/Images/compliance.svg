<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compliance</text>
  <text x="50" y="120" class="subtitle">[kəmˈplaɪəns] n. 服从，遵守</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + pli (充满) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"共同充满(com-pli)"
    <tspan x="50" dy="25">了服从的意愿，他们整齐划一地遵守规则。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company ensured compliance with all safety regulations.
  </text>
  <text x="50" y="310" class="content">
    公司确保遵守所有安全规定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Lines -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="100" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <!-- Rule -->
    <rect x="30" y="110" width="140" height="20" class="image" />
    <text x="50" y="125" class="content" fill="#7F8C8D">Rule</text>
  </g>
</svg>