<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">winding</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪndɪŋ] n. 绕组，缠绕；adj. 弯曲的，蜿蜒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wind (弯曲，缠绕) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条蛇在草地上"弯曲缠绕(wind-ing)"，
    <tspan x="50" dy="25">它的身体形成了一个蜿蜒的形状，这就是winding。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The road to the village was a winding path through the forest.
  </text>
  <text x="50" y="310" class="content">
    通往村庄的路是一条蜿蜒穿过森林的小径。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snake winding -->
    <path d="M0,0 C50,50 100,50 150,0 C200,-50 250,-50 300,0" class="image" />
    <circle cx="150" cy="0" r="10" class="image" />
    <circle cx="300" cy="0" r="10" class="image" />
  </g>
</svg>