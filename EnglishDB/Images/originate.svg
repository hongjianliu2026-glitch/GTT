<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">originate</text>
  <text x="50" y="120" class="subtitle">[əˈrɪdʒɪneɪt] v. 起源，创始</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ori- (开始) + gin (产生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个创意从无到有，"开始产生(ori-gin)"，
    <tspan x="50" dy="25">就像一颗种子发芽，最终成长为一个伟大的想法。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The idea for the project originated in a brainstorming session.
  </text>
  <text x="50" y="310" class="content">
    这个项目的想法源自一次头脑风暴会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seed -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Sprout -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Idea -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="180" y2="130" class="image" />
    <line x1="200" y1="150" x2="220" y2="130" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <!-- Connection -->
    <line x1="70" y1="120" x2="180" y2="120" class="image" />
  </g>
</svg>