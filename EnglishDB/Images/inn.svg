<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inn</text>
  <text x="50" y="120" class="subtitle">[ɪn] n. 小旅馆，客栈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (内部) + -n (表示地点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的旅人，"进入(in-)"
    <tspan x="50" dy="25">一个小旅馆(inn)，寻求休息和庇护。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He stayed at a cozy inn during his trip.
  </text>
  <text x="50" y="310" class="content">
    他在旅行期间住在一个舒适的小旅馆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Inn building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Door -->
    <rect x="150" y="100" width="50" height="80" class="image" />
    <!-- Windows -->
    <rect x="80" y="50" width="40" height="40" class="image" />
    <rect x="230" y="50" width="40" height="40" class="image" />
    <!-- Chimney -->
    <rect x="190" y="0" width="20" height="20" class="image" />
    <!-- Smoke -->
    <line x1="200" y1="0" x2="200" y2="-20" class="image" />
    <line x1="200" y1="0" x2="200" y2="-40" class="image" />
    <!-- Traveler -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>