<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">autoimmune</text>
  <text x="50" y="120" class="subtitle">[ˌɔːtəʊɪˈmjuːn] adj. 自身免疫的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auto- (自己) + immune (免疫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个身体内部的"自我(auto-)"防御系统，
    <tspan x="50" dy="25">错误地攻击"自己(auto-)"，导致"免疫(immune)"系统失常。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She suffers from an autoimmune disease.
  </text>
  <text x="50" y="310" class="content">
    她患有自身免疫性疾病。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Body outline -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Immune cells -->
    <circle cx="70" cy="70" r="10" class="image" />
    <circle cx="130" cy="70" r="10" class="image" />
    <circle cx="100" cy="130" r="10" class="image" />
    <!-- Attack arrows -->
    <line x1="70" y1="70" x2="100" y2="100" class="image" />
    <line x1="130" y1="70" x2="100" y2="100" class="image" />
    <line x1="100" y1="130" x2="100" y2="100" class="image" />
    <!-- Arrows -->
    <polygon points="60,60 80,70 60,80" class="image" />
    <polygon points="120,60 140,70 120,80" class="image" />
    <polygon points="90,120 100,140 110,120" class="image" />
  </g>
</svg>