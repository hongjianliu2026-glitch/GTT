<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">puberty</text>
  <text x="50" y="120" class="subtitle">[ˈpjuːbərti] n. 青春期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> puber (成熟) + -ty (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子在成长过程中，"成熟(puber)"
    <tspan x="50" dy="25">到青春期(puberty)，身体和心理都发生了巨大的变化。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She noticed the changes in her body during puberty.
  </text>
  <text x="50" y="310" class="content">
    她在青春期注意到了自己身体的变化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Growing plant -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="40" y2="70" class="image" />
    <line x1="50" y1="50" x2="60" y2="70" class="image" />
    <line x1="50" y1="50" x2="30" y2="90" class="image" />
    <line x1="50" y1="50" x2="70" y2="90" class="image" />
    <!-- Child -->
    <circle cx="50" cy="160" r="20" class="image" />
    <line x1="50" y1="180" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="250" class="image" />
    <line x1="50" y1="220" x2="70" y2="250" class="image" />
    <line x1="50" y1="200" x2="20" y2="190" class="image" />
    <line x1="50" y1="200" x2="80" y2="190" class="image" />
  </g>
</svg>