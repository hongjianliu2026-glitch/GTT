<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">boat</text>
  <text x="50" y="120" class="subtitle">[boʊt] n. 小船，艇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bo- (来自古英语 bāt)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘小船在湖面上轻轻漂浮，"漂浮(bo-at)"
    <tspan x="50" dy="25">在水面上，就像一只轻盈的鸟儿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We rented a boat to explore the lake.
  </text>
  <text x="50" y="310" class="content">
    我们租了一条小船去探索湖面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Boat -->
    <polygon points="150,100 250,100 200,50" class="image" fill="#F39C12" />
    <!-- Waves -->
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <line x1="50" y1="190" x2="300" y2="190" class="image" />
  </g>
</svg>