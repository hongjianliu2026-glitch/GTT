<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swarm</text>
  <text x="50" y="120" class="subtitle">[swɔrm] n. 蜂群，一大群；v. 蜂拥，成群结队</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (表示“一起”) + warm (热)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一大群蜜蜂"一起(s-)"飞舞，"热(warm)"闹非凡，
    <tspan x="50" dy="25">形成了一个蜂群(swarm)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bees swarmed around the hive.
  </text>
  <text x="50" y="310" class="content">
    蜜蜂在蜂巢周围成群结队。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hive -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Bees -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="70" r="10" class="image" />
    <circle cx="120" cy="60" r="10" class="image" />
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="180" cy="90" r="10" class="image" />
    <circle cx="20" cy="120" r="10" class="image" />
    <circle cx="160" cy="110" r="10" class="image" />
    <circle cx="90" cy="130" r="10" class="image" />
    <circle cx="130" cy="140" r="10" class="image" />
  </g>
</svg>