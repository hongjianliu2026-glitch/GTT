<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tease</text>
  <text x="50" y="120" class="subtitle">[tiːz] v. 戏弄，取笑；n. 爱戏弄他人的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> te- (拉丁语tenere，抓住) + -ase (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小丑用手指"抓住(te-)"你的注意力，
    <tspan x="50" dy="25">然后开始"动作(ase)"戏弄你，这就是tease的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to tease her little brother.
  </text>
  <text x="50" y="310" class="content">
    她喜欢戏弄她的小弟弟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clown -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="40" cy="40" r="5" class="image" />
    <circle cx="60" cy="40" r="5" class="image" />
    <path d="M40 60 Q50 70 60 60" class="image" />
    <!-- Finger pointing -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <!-- Target -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="130" y1="100" x2="170" y2="100" class="image" />
  </g>
</svg>