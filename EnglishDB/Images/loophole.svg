<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">loophole</text>
  <text x="50" y="120" class="subtitle">[ˈluːpˌhoʊl] n. 漏洞，空子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loop (环) + hole (洞)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城堡的墙上有一个"环形洞(loop-hole)"，
    <tspan x="50" dy="25">这个洞可以让人偷偷溜出去，就像法律或规则中的漏洞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He found a loophole in the contract and saved a lot of money.
  </text>
  <text x="50" y="310" class="content">
    他在合同中找到了一个漏洞，省了一大笔钱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle wall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Loophole -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="80" x2="175" y2="120" class="image" />
    <line x1="155" y1="100" x2="195" y2="100" class="image" />
    <!-- Person sneaking out -->
    <circle cx="175" cy="140" r="15" class="image" />
    <line x1="175" y1="155" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="160" y2="200" class="image" />
    <line x1="175" y1="180" x2="190" y2="200" class="image" />
  </g>
</svg>