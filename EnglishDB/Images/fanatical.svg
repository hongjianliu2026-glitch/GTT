<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fanatical</text>
  <text x="50" y="120" class="subtitle">[fəˈnætɪkl] adj. 狂热的，盲信的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fanat (狂热) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狂热的球迷，"狂热(fanat)"到
    <tspan x="50" dy="25">眼睛都变成了火焰，这就是"狂热的(fanatical)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a fanatical supporter of the team.
  </text>
  <text x="50" y="310" class="content">
    他是这个球队的狂热支持者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fanatic -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Eyes -->
    <circle cx="35" cy="90" r="5" class="image" />
    <circle cx="65" cy="90" r="5" class="image" />
    <!-- Fire in eyes -->
    <line x1="35" y1="90" x2="30" y2="80" class="image" />
    <line x1="35" y1="90" x2="40" y2="80" class="image" />
    <line x1="65" y1="90" x2="60" y2="80" class="image" />
    <line x1="65" y1="90" x2="70" y2="80" class="image" />
    <!-- Mouth -->
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
    <!-- Body -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <!-- Arms -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Legs -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
  </g>
</svg>