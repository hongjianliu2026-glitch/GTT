<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .fish { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">freshwater</text>
  <text x="50" y="120" class="subtitle">[ˈfrɛʃˌwɔtər] n. 淡水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fresh (新鲜的) + water (水)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条鱼在清澈的"新鲜水(fresh-water)"中游动，
    <tspan x="50" dy="25">这种水没有咸味，适合鱼类生存。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lake is a habitat for freshwater fish.
  </text>
  <text x="50" y="310" class="content">
    这个湖是淡水鱼的栖息地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- Fish -->
    <circle cx="100" cy="100" r="30" class="fish" />
    <line x1="100" y1="70" x2="100" y2="130" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="80" y1="80" x2="120" y2="120" class="image" />
    <line x1="80" y1="120" x2="120" y2="80" class="image" />
  </g>
</svg>