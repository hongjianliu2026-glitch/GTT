<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sentient</text>
  <text x="50" y="120" class="subtitle">[ˈsɛnʃənt] adj. 有感觉的，有知觉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sent (感觉) + -ient (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的大脑，"感觉(sent)"
    <tspan x="50" dy="25">到周围的一切，这个大脑就是有知觉的(sentient)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The robot was designed to be sentient, capable of feeling emotions.
  </text>
  <text x="50" y="310" class="content">
    这个机器人被设计成有知觉的，能够感受情感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Sensory lines -->
    <line x1="100" y1="180" x2="100" y2="300" class="image" />
    <line x1="100" y1="180" x2="20" y2="250" class="image" />
    <line x1="100" y1="180" x2="180" y2="250" class="image" />
    <line x1="100" y1="180" x2="50" y2="350" class="image" />
    <line x1="100" y1="180" x2="150" y2="350" class="image" />
    <!-- Sensory dots -->
    <circle cx="100" cy="300" r="10" class="image" />
    <circle cx="20" cy="250" r="10" class="image" />
    <circle cx="180" cy="250" r="10" class="image" />
    <circle cx="50" cy="350" r="10" class="image" />
    <circle cx="150" cy="350" r="10" class="image" />
  </g>
</svg>