<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">attractiveness</text>
  <text x="50" y="120" class="subtitle">[əˈtræktɪvnəs] n. 吸引力，魅力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> attract (吸引) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个闪闪发光的宝石，"吸引(attract)"
    <tspan x="50" dy="25">所有人的目光，它的魅力(attractiveness)无法抗拒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her attractiveness made her the center of attention at the party.
  </text>
  <text x="50" y="310" class="content">
    她的魅力使她成为派对的焦点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gemstone -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Sparkles -->
    <circle cx="80" cy="80" r="5" class="image" fill="#FFFFFF" />
    <circle cx="120" cy="80" r="5" class="image" fill="#FFFFFF" />
    <circle cx="100" cy="60" r="5" class="image" fill="#FFFFFF" />
    <circle cx="100" cy="120" r="5" class="image" fill="#FFFFFF" />
    <circle cx="80" cy="120" r="5" class="image" fill="#FFFFFF" />
    <circle cx="120" cy="120" r="5" class="image" fill="#FFFFFF" />
  </g>
</svg>