<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plant</text>
  <text x="50" y="120" class="subtitle">[plænt] n. 植物，工厂；v. 种植，安置</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plan (平面) + -t (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在平坦的土地上"安置(plant)"
    <tspan x="50" dy="25">种子，这些种子逐渐成长为植物(plant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She planted a rose bush in her garden.
  </text>
  <text x="50" y="310" class="content">
    她在花园里种了一株玫瑰。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Seed -->
    <circle cx="50" cy="100" r="10" class="image" />
    <!-- Plant -->
    <line x1="50" y1="100" x2="50" y2="20" class="image" />
    <line x1="50" y1="20" x2="40" y2="40" class="image" />
    <line x1="50" y1="20" x2="60" y2="40" class="image" />
    <line x1="50" y1="20" x2="30" y2="60" class="image" />
    <line x1="50" y1="20" x2="70" y2="60" class="image" />
    <!-- Farmer -->
    <circle cx="20" cy="180" r="15" class="image" />
    <line x1="20" y1="195" x2="20" y2="230" class="image" />
    <line x1="20" y1="230" x2="0" y2="260" class="image" />
    <line x1="20" y1="230" x2="40" y2="260" class="image" />
    <line x1="20" y1="210" x2="50" y2="200" class="image" />
  </g>
</svg>