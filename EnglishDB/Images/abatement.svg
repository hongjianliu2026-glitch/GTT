<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abatement</text>
  <text x="50" y="120" class="subtitle">[əˈbeɪtmənt] n. 减少，减轻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + -ate (做) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，"离开(ab-)"
    <tspan x="50" dy="25">并逐渐"做(ate)"得越来越小，</tspan>
    <tspan x="50" dy="25">最终"减少(abatement)"到几乎看不见。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The abatement of pollution levels is a key goal.
  </text>
  <text x="50" y="310" class="content">
    减少污染水平是一个关键目标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Smaller balloon -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="250" class="image" />
    <!-- Even smaller balloon -->
    <circle cx="400" cy="100" r="15" class="image" />
    <line x1="400" y1="115" x2="400" y2="250" class="image" />
  </g>
</svg>