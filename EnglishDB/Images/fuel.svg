<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fuel</text>
  <text x="50" y="120" class="subtitle">[fjuːəl] n. 燃料；v. 加燃料</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fu- (火) + el (表示物质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车在加油站，"火(fu-)"
    <tspan x="50" dy="25">被加注到"物质(el)"中，这就是燃料(fuel)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The plane needs to fuel before taking off.
  </text>
  <text x="50" y="310" class="content">
    飞机起飞前需要加燃料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gas station -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Gas pump -->
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <rect x="280" y="20" width="40" height="160" class="image" />
    <!-- Fuel line -->
    <line x1="300" y1="180" x2="175" y2="180" class="image" />
    <!-- Flame -->
    <polygon points="175,180 160,200 190,200" class="image" />
  </g>
</svg>