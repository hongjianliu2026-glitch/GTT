<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rally</text>
  <text x="50" y="120" class="subtitle">[ˈræli] v. 召集，集合；n. 集会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rali (来自法语 rallier，意为“集合”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人被"召集(rally)"到一个广场上，
    <tspan x="50" dy="25">他们挥舞着旗帜，高声呼喊，形成了一个壮观的集会(rally)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leader rallied the troops before the battle.
  </text>
  <text x="50" y="310" class="content">
    领导人在战斗前召集了部队。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Square for the rally -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Flag -->
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <rect x="280" y="20" width="40" height="100" class="image" />
    <line x1="280" y1="20" x2="320" y2="20" class="image" />
    <line x1="280" y1="70" x2="320" y2="70" class="image" />
    <line x1="280" y1="120" x2="320" y2="120" class="image" />
  </g>
</svg>