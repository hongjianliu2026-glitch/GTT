<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sardonic</text>
  <text x="50" y="120" class="subtitle">[sɑrˈdɒnɪk] adj. 讥讽的，嘲笑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sardo (苦涩的) + -onic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人脸上挂着苦涩的笑容，"苦涩地嘲笑(sardo-onic)"
    <tspan x="50" dy="25">别人，这种笑容就是讥讽的(sardonic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His sardonic remarks made everyone uncomfortable.
  </text>
  <text x="50" y="310" class="content">
    他讥讽的言论让每个人都感到不舒服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 60 120 Q 100 140 140 120" class="image" />
    <!-- Teeth -->
    <line x1="70" y1="120" x2="75" y2="120" class="image" />
    <line x1="80" y1="120" x2="85" y2="120" class="image" />
    <line x1="90" y1="120" x2="95" y2="120" class="image" />
    <line x1="105" y1="120" x2="110" y2="120" class="image" />
    <line x1="115" y1="120" x2="120" y2="120" class="image" />
    <line x1="125" y1="120" x2="130" y2="120" class="image" />
  </g>
</svg>