<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sky</text>
  <text x="50" y="120" class="subtitle">[skaɪ] n. 天空</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sk- (与天空相关)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蓝色画布，上面点缀着
    <tspan x="50" dy="25">白色的云朵和闪烁的星星，这就是天空(sky)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sky was clear and blue, with no clouds in sight.
  </text>
  <text x="50" y="310" class="content">
    天空晴朗湛蓝，看不到一丝云彩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#FFD700" />
    <!-- Clouds -->
    <ellipse cx="100" cy="80" rx="50" ry="30" class="image" fill="#FFFFFF" />
    <ellipse cx="150" cy="120" rx="40" ry="25" class="image" fill="#FFFFFF" />
    <ellipse cx="200" cy="90" rx="60" ry="35" class="image" fill="#FFFFFF" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="3" class="image" fill="#FFFFFF" />
    <circle cx="70" cy="70" r="3" class="image" fill="#FFFFFF" />
    <circle cx="90" cy="60" r="3" class="image" fill="#FFFFFF" />
  </g>
</svg>