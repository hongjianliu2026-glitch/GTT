<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">freeway</text>
  <text x="50" y="120" class="subtitle">[ˈfriːweɪ] n. 高速公路</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> free (自由) + way (道路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在"自由的道路(free-way)"上飞驰，
    <tspan x="50" dy="25">畅通无阻，这就是高速公路(freeway)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The freeway was packed with cars during rush hour.
  </text>
  <text x="50" y="310" class="content">
    高峰时段，高速公路上挤满了汽车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="60" y="10" width="30" height="10" class="image" />
    <!-- Wheels -->
    <circle cx="65" cy="50" r="10" class="image" />
    <circle cx="115" cy="50" r="10" class="image" />
    <!-- Road lines -->
    <line x1="0" y1="50" x2="350" y2="50" class="image" />
    <line x1="0" y1="70" x2="350" y2="70" class="image" />
  </g>
</svg>