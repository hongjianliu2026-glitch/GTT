<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">genocide</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɛnəˌsaɪd] n. 种族灭绝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> geno- (种族) + -cide (杀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"种族(geno-)"标志被一个巨大的"杀(cide)"字
    <tspan x="50" dy="25">压碎，象征着种族灭绝(genocide)的残酷现实。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The UN condemned the genocide in the region.
  </text>
  <text x="50" y="310" class="content">
    联合国谴责了该地区的种族灭绝行为。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Geno symbol -->
    <circle cx="100" cy="100" r="50" class="image" />
    <text x="85" y="110" class="content" fill="#2C3E50">种族</text>
    <!-- Cide symbol -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <text x="170" y="110" class="content" fill="#2C3E50">杀</text>
    <!-- Crushing effect -->
    <line x1="100" y1="100" x2="250" y2="150" class="image" />
    <line x1="100" y1="150" x2="250" y2="100" class="image" />
  </g>
</svg>