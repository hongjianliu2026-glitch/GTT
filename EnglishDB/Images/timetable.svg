<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">timetable</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪmteɪbl] n. 时间表，时刻表</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> time (时间) + table (表)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，"时间(time)"
    <tspan x="50" dy="25">被精确地刻在一张"表(table)"上，</tspan>
    <tspan x="50" dy="25">这就是时间表(timetable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please check the timetable for the train schedule.
  </text>
  <text x="50" y="310" class="content">
    请查看时间表以了解火车时刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Table -->
    <rect x="200" y="20" width="200" height="160" class="image" />
    <!-- Time marks -->
    <text x="220" y="60" class="content">9:00</text>
    <text x="220" y="90" class="content">10:00</text>
    <text x="220" y="120" class="content">11:00</text>
    <text x="220" y="150" class="content">12:00</text>
  </g>
</svg>