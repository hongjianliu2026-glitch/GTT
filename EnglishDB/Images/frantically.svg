<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frantically</text>
  <text x="50" y="120" class="subtitle">[ˈfræntɪkli] adv. 疯狂地，狂乱地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frant- (疯狂) + -ic (形容词后缀) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在房间里"疯狂地(frant-ic-ally)"跑来跑去，
    <tspan x="50" dy="25">手里拿着一堆文件，脸上满是焦虑的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She frantically searched for her lost keys.
  </text>
  <text x="50" y="310" class="content">
    她疯狂地寻找她丢失的钥匙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person running -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Papers flying -->
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="120" y1="50" x2="170" y2="100" class="image" />
    <line x1="140" y1="50" x2="190" y2="100" class="image" />
    <!-- Anxious face -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <line x1="50" y1="110" x2="60" y2="110" class="image" />
  </g>
</svg>