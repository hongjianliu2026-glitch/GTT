<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F1DE; }
      .title { font: bold 48px sans-serif; fill: #81B29A; }
      .subtitle { font: italic 24px serif; fill: #3D405B; }
      .content { font: 18px sans-serif; fill: #3D405B; }
      .highlight { font-weight: bold; fill: #E07A5F; }
      .story { font: 16px serif; fill: #F2CC8F; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Italian</text>
  <text x="50" y="120" class="subtitle">[ɪˈtæliən] adj. 意大利的；n. 意大利人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Ital (意大利) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个意大利人站在罗马斗兽场前，自豪地说："我是意大利人(Italian)！"
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is an Italian chef who specializes in pasta.
  </text>
  <text x="50" y="310" class="content">
    她是一位专门做意大利面的意大利厨师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Colosseum -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <line x1="25" y1="20" x2="325" y2="20" class="image" />
    <line x1="25" y1="180" x2="325" y2="180" class="image" />
    <line x1="25" y1="20" x2="25" y2="180" class="image" />
    <line x1="325" y1="20" x2="325" y2="180" class="image" />
    <!-- Italian person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="200" class="image" />
    <line x1="100" y1="160" x2="120" y2="200" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <line x1="100" y1="140" x2="60" y2="130" class="image" />
  </g>
</svg>