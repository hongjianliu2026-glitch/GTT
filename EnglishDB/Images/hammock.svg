<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hammock</text>
  <text x="50" y="120" class="subtitle">[ˈhæmək] n. 吊床</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ham (腿) + mock (模仿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在吊床上，"模仿(mock)"
    <tspan x="50" dy="25">双腿(ham)放松的姿势，享受悠闲时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent the afternoon reading in her hammock.
  </text>
  <text x="50" y="310" class="content">
    她整个下午都在吊床上读书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hammock -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="200" class="image" />
    <line x1="350" y1="50" x2="300" y2="200" class="image" />
    <line x1="100" y1="200" x2="300" y2="200" class="image" />
    <!-- Person in hammock -->
    <circle cx="200" cy="125" r="20" class="image" />
    <line x1="200" y1="145" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <line x1="200" y1="160" x2="230" y2="150" class="image" />
  </g>
</svg>