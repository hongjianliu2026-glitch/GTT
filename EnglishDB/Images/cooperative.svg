<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cooperative</text>
  <text x="50" y="120" class="subtitle">[koʊˈɑːpərətɪv] adj. 合作的，协作的；n. 合作社</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + oper (工作) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人手拉手，"共同工作(co-oper)"
    <tspan x="50" dy="25">在一起，形成了一个合作的团队(cooperative)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team worked in a cooperative manner to complete the project.
  </text>
  <text x="50" y="310" class="content">
    团队以合作的方式完成了项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hands -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <!-- People -->
    <circle cx="50" cy="120" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <line x1="50" y1="135" x2="50" y2="170" class="image" />
    <line x1="150" y1="135" x2="150" y2="170" class="image" />
    <line x1="50" y1="170" x2="30" y2="200" class="image" />
    <line x1="50" y1="170" x2="70" y2="200" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="200" class="image" />
  </g>
</svg>