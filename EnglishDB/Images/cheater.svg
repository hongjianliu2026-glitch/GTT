<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheater</text>
  <text x="50" y="120" class="subtitle">[ˈtʃiːtər] n. 骗子，作弊者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cheat (欺骗) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狡猾的"骗子(cheater)"，
    <tspan x="50" dy="25">他偷偷在考试中作弊，被老师当场抓住。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cheater was caught red-handed during the exam.
  </text>
  <text x="50" y="310" class="content">
    那个作弊者在考试中被当场抓住。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cheater -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Exam paper -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cheating hand -->
    <line x1="70" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="130" y2="130" class="image" />
    <!-- Teacher -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Teacher pointing -->
    <line x1="200" y1="115" x2="100" y2="115" class="image" />
  </g>
</svg>