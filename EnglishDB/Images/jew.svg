<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Jew</text>
  <text x="50" y="120" class="subtitle">[dʒuː] n. 犹太人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自希伯来语 "Yehudi"，意为 "来自犹大的人"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的犹太人，头戴小圆帽，手持经书，
    <tspan x="50" dy="25">象征着智慧与信仰，这就是 "Jew" 的形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Jew was known for his wisdom and knowledge.
  </text>
  <text x="50" y="310" class="content">
    这位犹太人以其智慧和知识而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jewish man -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <!-- Kippah (Jewish skullcap) -->
    <circle cx="50" cy="30" r="10" class="image" />
    <!-- Torah scroll -->
    <rect x="100" y="50" width="100" height="100" class="image" />
    <line x1="120" y1="70" x2="180" y2="70" class="image" />
    <line x1="120" y1="90" x2="180" y2="90" class="image" />
    <line x1="120" y1="110" x2="180" y2="110" class="image" />
  </g>
</svg>