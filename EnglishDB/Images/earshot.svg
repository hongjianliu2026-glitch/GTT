<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">earshot</text>
  <text x="50" y="120" class="subtitle">[ˈɪrʃɒt] n. 听力所及的范围</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ear (耳朵) + shot (范围)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的耳朵旁边，这个耳朵的"听力范围(ear-shot)"
    <tspan x="50" dy="25">大到可以覆盖整个城市，任何声音都逃不过它的捕捉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Keep your voice down; he's within earshot.
  </text>
  <text x="50" y="310" class="content">
    小声点，他在听力所及的范围内。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant ear -->
    <ellipse cx="200" cy="100" rx="150" ry="100" class="image" />
    <!-- City skyline -->
    <rect x="50" y="200" width="300" height="50" class="image" />
    <rect x="70" y="180" width="20" height="70" class="image" />
    <rect x="100" y="190" width="20" height="60" class="image" />
    <rect x="130" y="170" width="20" height="80" class="image" />
    <rect x="160" y="180" width="20" height="70" class="image" />
    <rect x="190" y="190" width="20" height="60" class="image" />
    <rect x="220" y="170" width="20" height="80" class="image" />
    <rect x="250" y="180" width="20" height="70" class="image" />
    <rect x="280" y="190" width="20" height="60" class="image" />
    <!-- Person -->
    <circle cx="350" cy="150" r="15" class="image" />
    <line x1="350" y1="165" x2="350" y2="200" class="image" />
    <line x1="350" y1="200" x2="330" y2="230" class="image" />
    <line x1="350" y1="200" x2="370" y2="230" class="image" />
    <line x1="350" y1="180" x2="380" y2="170" class="image" />
  </g>
</svg>