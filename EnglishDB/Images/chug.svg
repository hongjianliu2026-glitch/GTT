<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chug</text>
  <text x="50" y="120" class="subtitle">[tʃʌɡ] v. 咕噜咕噜地喝，缓慢行进</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chug (拟声词，模仿喝东西或机器缓慢行进的声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在喝一大杯啤酒，"咕噜咕噜(chug)"
    <tspan x="50" dy="25">的声音从杯子里传出，这就是chug的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He chugged his beer quickly to finish it before the game started.
  </text>
  <text x="50" y="310" class="content">
    他在比赛开始前迅速喝完了啤酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass of beer -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" fill="#F1C40F" />
    <!-- Bubbles -->
    <circle cx="40" cy="40" r="10" class="image" fill="#FFFFFF" />
    <circle cx="70" cy="60" r="10" class="image" fill="#FFFFFF" />
    <circle cx="100" cy="80" r="10" class="image" fill="#FFFFFF" />
    <!-- Person -->
    <circle cx="80" cy="250" r="30" class="image" />
    <line x1="80" y1="280" x2="80" y2="350" class="image" />
    <line x1="80" y1="350" x2="50" y2="400" class="image" />
    <line x1="80" y1="350" x2="110" y2="400" class="image" />
    <line x1="80" y1="300" x2="120" y2="320" class="image" />
    <line x1="80" y1="300" x2="40" y2="320" class="image" />
  </g>
</svg>