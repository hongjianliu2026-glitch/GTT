<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">archway</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrtʃweɪ] n. 拱门，拱道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arch (拱形) + way (道路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的拱门(arch)横跨在一条道路(way)上，
    <tspan x="50" dy="25">形成了一个壮观的入口，这就是拱道(archway)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The archway led to a beautiful garden.
  </text>
  <text x="50" y="310" class="content">
    拱道通向一个美丽的花园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Archway -->
    <path d="M50 150 Q150 50 250 150" class="image" />
    <path d="M50 150 Q150 250 250 150" class="image" />
    <!-- Road -->
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <!-- Ground -->
    <line x1="0" y1="160" x2="300" y2="160" class="image" />
  </g>
</svg>