<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unrestricted</text>
  <text x="50" y="120" class="subtitle">[ˌʌnrɪˈstrɪktɪd] adj. 无限制的，自由的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + restrict (限制) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个自由飞翔的小鸟，"不受限制(un-restrict-ed)"
    <tspan x="50" dy="25">地在天空中翱翔，享受着无拘无束的自由。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The park offers unrestricted access to all visitors.
  </text>
  <text x="50" y="310" class="content">
    公园对所有游客开放，没有任何限制。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Bird -->
    <circle cx="50" cy="50" r="15" class="image" fill="#FFFFFF" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="80" x2="30" y2="70" class="image" />
    <line x1="50" y1="80" x2="70" y2="70" class="image" />
    <line x1="50" y1="100" x2="30" y2="110" class="image" />
    <line x1="50" y1="100" x2="70" y2="110" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="30" r="20" class="image" fill="#FFD700" />
  </g>
</svg>