<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imagine</text>
  <text x="50" y="120" class="subtitle">[ɪˈmædʒɪn] v. 想象，设想</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + ag (做) + ine (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人闭上眼睛，"进入(im-)"
    <tspan x="50" dy="25">一个"做(ag)"梦的"状态(ine)"，这就是想象(imagine)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She could imagine herself living in a castle.
  </text>
  <text x="50" y="310" class="content">
    她能想象自己住在城堡里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person with closed eyes -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <!-- Cloud with thought bubble -->
    <circle cx="250" cy="100" r="50" class="image" />
    <line x1="250" y1="150" x2="250" y2="250" class="image" />
    <line x1="250" y1="250" x2="200" y2="300" class="image" />
    <line x1="250" y1="250" x2="300" y2="300" class="image" />
    <line x1="250" y1="220" x2="350" y2="210" class="image" />
    <!-- Castle in thought bubble -->
    <rect x="200" y="50" width="100" height="100" class="image" />
    <line x1="200" y1="50" x2="250" y2="0" class="image" />
    <line x1="250" y1="0" x2="300" y2="50" class="image" />
    <line x1="225" y1="25" x2="275" y2="25" class="image" />
  </g>
</svg>