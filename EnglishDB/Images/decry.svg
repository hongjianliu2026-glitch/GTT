<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decry</text>
  <text x="50" y="120" class="subtitle">[dɪˈkraɪ] v. 公开谴责，大声反对</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + cry (喊叫)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高台上，"向下大声喊叫(de-cry)"，
    <tspan x="50" dy="25">公开谴责某事或某人，这就是decry的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The politician decried the corruption in the government.
  </text>
  <text x="50" y="310" class="content">
    这位政治家公开谴责政府的腐败行为。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="100" x2="120" y2="90" class="image" />
    <line x1="175" y1="100" x2="230" y2="90" class="image" />
    <!-- Speech bubble -->
    <path d="M 175 30 Q 250 30 250 70 Q 250 110 175 110 Q 100 110 100 70 Q 100 30 175 30 Z" class="image" />
    <text x="175" y="70" text-anchor="middle" class="content" fill="#34495E">谴责</text>
  </g>
</svg>