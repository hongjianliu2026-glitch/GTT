<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">waving</text>
  <text x="50" y="120" class="subtitle">[ˈweɪvɪŋ] v. 挥动，摇摆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wave (波浪) + -ing (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在海边，海浪(wave)不断拍打着沙滩，
    <tspan x="50" dy="25">他挥动(waving)手臂，仿佛在与海浪共舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She waved goodbye to her friends at the airport.
  </text>
  <text x="50" y="310" class="content">
    她在机场向朋友们挥手告别。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Waves -->
    <path d="M50 50 Q100 20 150 50 T250 50 T300 20 T350 50" class="image" />
    <path d="M50 80 Q100 50 150 80 T250 80 T300 50 T350 80" class="image" />
    <path d="M50 110 Q100 80 150 110 T250 110 T300 80 T350 110" class="image" />
    <!-- Person waving -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>