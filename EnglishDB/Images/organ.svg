<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">organ</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrɡən] n. 器官，风琴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> organ (工具，器官)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的风琴，它的每一个管子都是一个器官，
    <tspan x="50" dy="25">当这些器官一起工作时，就像风琴演奏出美妙的音乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heart is a vital organ in the human body.
  </text>
  <text x="50" y="310" class="content">
    心脏是人体中一个至关重要的器官。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Organ pipes -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="120" y="0" width="100" height="180" class="image" />
    <rect x="240" y="0" width="100" height="160" class="image" />
    <rect x="360" y="0" width="100" height="140" class="image" />
    <!-- Organ -->
    <rect x="50" y="220" width="300" height="50" class="image" />
    <!-- Music notes -->
    <circle cx="70" cy="200" r="10" class="image" />
    <circle cx="190" cy="180" r="10" class="image" />
    <circle cx="310" cy="160" r="10" class="image" />
    <circle cx="430" cy="140" r="10" class="image" />
  </g>
</svg>