<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sarcasm</text>
  <text x="50" y="120" class="subtitle">[ˈsɑːrkæzəm] n. 讽刺，挖苦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sarc (肉) + asm (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用刀子在肉上刻字，"刻下(sarc)"
    <tspan x="50" dy="25">讽刺的话语，这些话语就像刀子一样刺痛人心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His sarcasm made her feel hurt.
  </text>
  <text x="50" y="310" class="content">
    他的讽刺让她感到受伤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Knife -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <!-- Words on meat -->
    <text x="150" y="100" class="content" style="font-size: 36px; fill: #C0392B;">"Ouch!"</text>
  </g>
</svg>