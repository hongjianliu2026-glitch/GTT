<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deck</text>
  <text x="50" y="120" class="subtitle">[dɛk] n. 甲板，层</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dek- (十) + -k (表示“层”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘巨大的船，"十层(dek-)"
    <tspan x="50" dy="25">高的甲板(deck)，每一层都堆满了货物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sailors gathered on the deck to watch the sunset.
  </text>
  <text x="50" y="310" class="content">
    水手们聚集在甲板上观看日落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship deck -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Deck layers -->
    <rect x="50" y="20" width="250" height="30" class="image" />
    <rect x="50" y="60" width="250" height="30" class="image" />
    <rect x="50" y="100" width="250" height="30" class="image" />
    <rect x="50" y="140" width="250" height="30" class="image" />
    <!-- Sailors -->
    <circle cx="70" cy="35" r="10" class="image" />
    <circle cx="100" cy="75" r="10" class="image" />
    <circle cx="130" cy="115" r="10" class="image" />
    <circle cx="160" cy="155" r="10" class="image" />
  </g>
</svg>