<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suddenly</text>
  <text x="50" y="120" class="subtitle">[ˈsʌdənli] adv. 突然地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sud- (突然) + -en (使) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个平静的湖面，"突然(sud-)"
    <tspan x="50" dy="25">一颗石头被扔进去，激起层层涟漪，这就是突然(suddenly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lights went out suddenly during the movie.
  </text>
  <text x="50" y="310" class="content">
    电影放映时灯突然熄灭了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" fill="#AAD8E6" />
    <!-- Ripples -->
    <circle cx="175" cy="100" r="50" fill="none" stroke="#3498DB" stroke-width="3" />
    <circle cx="175" cy="100" r="70" fill="none" stroke="#3498DB" stroke-width="3" />
    <circle cx="175" cy="100" r="90" fill="none" stroke="#3498DB" stroke-width="3" />
    <!-- Stone -->
    <circle cx="175" cy="100" r="10" fill="#7F8C8D" />
  </g>
</svg>