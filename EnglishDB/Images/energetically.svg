<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">energetically</text>
  <text x="50" y="120" class="subtitle">[ˌenərˈdʒetɪkli] adv. 精力充沛地，充满活力地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> energe (能量) + -tic (形容词后缀) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人像"能量球(energe)"一样，
    <tspan x="50" dy="25">全身散发着光芒，充满活力地跳跃和奔跑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She danced energetically at the party.
  </text>
  <text x="50" y="310" class="content">
    她在派对上充满活力地跳舞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Energy ball -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F39C12" />
    <!-- Person jumping -->
    <circle cx="100" cy="150" r="20" class="image" fill="#2ECC71" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="260" class="image" />
    <line x1="100" y1="220" x2="120" y2="260" class="image" />
    <line x1="100" y1="190" x2="140" y2="180" class="image" />
    <line x1="100" y1="190" x2="60" y2="180" class="image" />
  </g>
</svg>