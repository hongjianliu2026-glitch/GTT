<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shallow</text>
  <text x="50" y="120" class="subtitle">[ˈʃæloʊ] adj. 浅的，肤浅的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shal- (浅) + -ow (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个浅浅的池塘，水只到脚踝，"浅浅的(shal-low)"
    <tspan x="50" dy="25">水面上漂浮着几片叶子，这就是浅(shallow)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The water in the pond was shallow enough for the children to play.
  </text>
  <text x="50" y="310" class="content">
    池塘里的水很浅，孩子们可以在里面玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pond -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water surface -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Leaves -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="70" r="10" class="image" />
    <circle cx="200" cy="60" r="10" class="image" />
    <!-- Child's foot -->
    <line x1="120" y1="180" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="130" class="image" />
    <line x1="120" y1="150" x2="140" y2="130" class="image" />
  </g>
</svg>