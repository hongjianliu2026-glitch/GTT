<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">countryside</text>
  <text x="50" y="120" class="subtitle">[ˈkʌntriˌsaɪd] n. 乡村，农村</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> country (国家) + side (边)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个远离城市喧嚣的"国家边缘(country-side)"，
    <tspan x="50" dy="25">那里有广阔的田野、宁静的村庄和清新的空气，这就是乡村(countryside)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We spent the weekend in the countryside, enjoying the peace and quiet.
  </text>
  <text x="50" y="310" class="content">
    我们周末在乡村度过，享受宁静与平和。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- House -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Roof -->
    <polygon points="50,20 100,20 125,50 25,50" class="image" />
    <!-- Tree -->
    <line x1="200" y1="20" x2="200" y2="120" class="image" />
    <circle cx="200" cy="10" r="15" class="image" />
    <circle cx="185" cy="25" r="15" class="image" />
    <circle cx="215" cy="25" r="15" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Sun rays -->
    <line x1="300" y1="20" x2="300" y2="0" class="image" />
    <line x1="330" y1="50" x2="350" y2="50" class="image" />
    <line x1="270" y1="50" x2="250" y2="50" class="image" />
    <line x1="300" y1="80" x2="300" y2="100" class="image" />
  </g>
</svg>