<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">moisturizer</text>
  <text x="50" y="120" class="subtitle">[ˈmɔɪstʃəˌraɪzər] n. 保湿霜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> moist (潮湿) + -ur (表示状态) + -izer (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个干燥的皮肤，突然被"潮湿(moist)"的
    <tspan x="50" dy="25">保湿霜(moisturizer)滋润，皮肤瞬间变得水润光滑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She applies a moisturizer every morning to keep her skin hydrated.
  </text>
  <text x="50" y="310" class="content">
    她每天早上都涂抹保湿霜以保持皮肤水润。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="20" class="image" />
    <!-- Drop -->
    <ellipse cx="150" cy="100" rx="30" ry="50" class="image" />
    <!-- Skin -->
    <rect x="200" y="0" width="150" height="200" class="image" />
    <line x1="220" y1="20" x2="330" y2="20" class="image" />
    <line x1="220" y1="50" x2="330" y2="50" class="image" />
    <line x1="220" y1="80" x2="330" y2="80" class="image" />
    <line x1="220" y1="110" x2="330" y2="110" class="image" />
    <line x1="220" y1="140" x2="330" y2="140" class="image" />
    <line x1="220" y1="170" x2="330" y2="170" class="image" />
  </g>
</svg>