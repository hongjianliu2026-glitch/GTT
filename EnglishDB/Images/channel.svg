<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">channel</text>
  <text x="50" y="120" class="subtitle">[ˈtʃænl] n. 频道，渠道；v. 引导，输送</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chan- (通道) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条小河(chan-el)，水流通过它流向大海，
    <tspan x="50" dy="25">这条小河就是一个通道(channel)，引导水流的方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She changed the channel to watch the news.
  </text>
  <text x="50" y="310" class="content">
    她换了个频道看新闻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 100 Q 100 50 200 100 T 400 100" class="image" />
    <!-- Water flow -->
    <path d="M0 105 Q 100 55 200 105 T 400 105" class="image" stroke-dasharray="5,5" />
    <!-- Sea -->
    <rect x="400" y="80" width="100" height="40" class="image" />
    <!-- Boat -->
    <polygon points="300,100 320,120 280,120" class="image" />
  </g>
</svg>