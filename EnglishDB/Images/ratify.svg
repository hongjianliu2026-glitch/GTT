<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ratify</text>
  <text x="50" y="120" class="subtitle">[ˈrætɪfaɪ] v. 批准，认可</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rat (思考) + -ify (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在会议室里，"思考(rat)"
    <tspan x="50" dy="25">后决定"使(ify)"某事成为正式的，</tspan>
    <tspan x="50" dy="25">这就是批准(ratify)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The committee will ratify the new policy next week.
  </text>
  <text x="50" y="310" class="content">
    委员会将在下周批准新政策。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People -->
    <circle cx="80" cy="60" r="15" class="image" />
    <circle cx="150" cy="60" r="15" class="image" />
    <circle cx="220" cy="60" r="15" class="image" />
    <!-- Documents -->
    <rect x="70" y="100" width="50" height="40" class="image" />
    <rect x="140" y="100" width="50" height="40" class="image" />
    <rect x="210" y="100" width="50" height="40" class="image" />
    <!-- Checkmarks -->
    <line x1="80" y1="120" x2="100" y2="140" class="image" />
    <line x1="100" y1="140" x2="120" y2="100" class="image" />
    <line x1="150" y1="120" x2="170" y2="140" class="image" />
    <line x1="170" y1="140" x2="190" y2="100" class="image" />
    <line x1="220" y1="120" x2="240" y2="140" class="image" />
    <line x1="240" y1="140" x2="260" y2="100" class="image" />
  </g>
</svg>