<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">special</text>
  <text x="50" y="120" class="subtitle">[ˈspeʃl] adj. 特别的，特殊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> speci (种类) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个五彩斑斓的"种类(speci)"，
    <tspan x="50" dy="25">其中有一个特别(special)的品种，</tspan>
    <tspan x="50" dy="25">它闪闪发光，与众不同。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This is a special occasion, let's celebrate!
  </text>
  <text x="50" y="310" class="content">
    这是一个特别的场合，让我们庆祝吧！
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rainbow -->
    <polyline points="0,100 50,50 100,100 150,50 200,100 250,50 300,100" style="fill:none;stroke:red;stroke-width:5" />
    <polyline points="0,120 50,70 100,120 150,70 200,120 250,70 300,120" style="fill:none;stroke:orange;stroke-width:5" />
    <polyline points="0,140 50,90 100,140 150,90 200,140 250,90 300,140" style="fill:none;stroke:yellow;stroke-width:5" />
    <polyline points="0,160 50,110 100,160 150,110 200,160 250,110 300,160" style="fill:none;stroke:green;stroke-width:5" />
    <polyline points="0,180 50,130 100,180 150,130 200,180 250,130 300,180" style="fill:none;stroke:blue;stroke-width:5" />
    <polyline points="0,200 50,150 100,200 150,150 200,200 250,150 300,200" style="fill:none;stroke:indigo;stroke-width:5" />
    <polyline points="0,220 50,170 100,220 150,170 200,220 250,170 300,220" style="fill:none;stroke:violet;stroke-width:5" />

    <!-- Special star -->
    <polygon points="150,50 170,100 220,100 180,130 200,180 150,150 100,180 120,130 80,100 130,100" style="fill:gold;stroke:black;stroke-width:2" />
  </g>
</svg>