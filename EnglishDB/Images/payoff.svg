<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">payoff</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪˌɔf] n. 回报，结果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pay (支付) + off (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你辛勤工作后，终于得到了"支付(pay)"，
    <tspan x="50" dy="25">然后你"离开(off)"工作，享受你的回报(payoff)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The payoff for all his hard work was a promotion.
  </text>
  <text x="50" y="310" class="content">
    他辛勤工作的回报是得到了晋升。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Money bag -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Person -->
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="200" y1="80" x2="230" y2="70" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="50" x2="190" y2="50" class="image" />
    <polygon points="190,50 185,45 185,55" class="image" />
  </g>
</svg>