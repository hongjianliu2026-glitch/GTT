<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">groin</text>
  <text x="50" y="120" class="subtitle">[ɡrɔɪn] n. 腹股沟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> groin (来自古法语 "grouine"，意为"腹股沟")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在踢足球时，"腹股沟(groin)"
    <tspan x="50" dy="25">被球击中，疼痛难忍，这就是groin的直观感受。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He injured his groin while playing soccer.
  </text>
  <text x="50" y="310" class="content">
    他在踢足球时伤到了腹股沟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Right leg -->
    <!-- Groin area -->
    <rect x="30" y="180" width="40" height="20" class="image" />
    <!-- Ball -->
    <circle cx="120" cy="200" r="20" class="image" />
    <!-- Ball trajectory -->
    <line x1="120" y1="180" x2="50" y2="190" class="image" />
  </g>
</svg>