<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indebted</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdɛtɪd] adj. 负债的，感激的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + debt (债务) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"债务(debt)"深深"困住(in-)"，
    <tspan x="50" dy="25">他感到"负债的(indebted)"，同时也对帮助他的人充满感激。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I am deeply indebted to my teachers for their guidance.
  </text>
  <text x="50" y="310" class="content">
    我对老师的指导深表感激。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Debt symbol -->
    <circle cx="50" cy="100" r="30" class="image" />
    <text x="40" y="110" class="content" fill="#C0392B">债</text>
    <!-- Person trapped -->
    <rect x="100" y="70" width="100" height="60" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="140" y2="150" class="image" />
    <line x1="150" y1="130" x2="160" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="110" class="image" />
    <!-- Gratitude symbol -->
    <path d="M250,70 C260,90 270,110 280,130" class="image" />
    <text x="260" y="140" class="content" fill="#8E44AD">感</text>
  </g>
</svg>