<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">moist</text>
  <text x="50" y="120" class="subtitle">[mɔɪst] adj. 潮湿的，湿润的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> moist (来自拉丁语 "humidus"，意为湿润)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片清晨的草地，露水"湿润(moist)"了每一片叶子，
    <tspan x="50" dy="25">整个场景都充满了湿润的气息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The air was moist after the rain.
  </text>
  <text x="50" y="310" class="content">
    雨后空气变得湿润。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Dew drops -->
    <circle cx="50" cy="140" r="10" class="water" />
    <circle cx="100" cy="130" r="10" class="water" />
    <circle cx="150" cy="145" r="10" class="water" />
    <circle cx="200" cy="135" r="10" class="water" />
    <circle cx="250" cy="140" r="10" class="water" />
    <circle cx="300" cy="130" r="10" class="water" />
    <!-- Sun -->
    <circle cx="320" cy="50" r="30" class="image" />
  </g>
</svg>