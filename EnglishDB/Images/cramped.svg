<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cramped</text>
  <text x="50" y="120" class="subtitle">[kræmpt] adj. 狭窄的，拥挤的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cramp (夹紧) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，"夹紧(cramp)"了太多家具和物品，
    <tspan x="50" dy="25">空间变得非常狭窄(cramped)，人们几乎无法移动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The apartment was so cramped that there was hardly any room to move.
  </text>
  <text x="50" y="310" class="content">
    这个公寓非常狭窄，几乎没有移动的空间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cramped room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Furniture -->
    <rect x="20" y="20" width="100" height="80" class="image" />
    <rect x="140" y="20" width="100" height="80" class="image" />
    <rect x="260" y="20" width="70" height="80" class="image" />
    <rect x="20" y="120" width="100" height="60" class="image" />
    <rect x="140" y="120" width="100" height="60" class="image" />
    <rect x="260" y="120" width="70" height="60" class="image" />
    <!-- People -->
    <circle cx="60" cy="180" r="15" class="image" />
    <circle cx="180" cy="180" r="15" class="image" />
    <circle cx="300" cy="180" r="15" class="image" />
  </g>
</svg>