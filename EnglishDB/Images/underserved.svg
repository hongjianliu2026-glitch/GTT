<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underserved</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈsɜːrvd] adj. 服务不足的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在...下面) + serve (服务)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个社区，"服务在下面(under-serve)"，
    <tspan x="50" dy="25">居民们排队等待，但服务窗口却空无一人，</tspan>
    <tspan x="50" dy="25">这就是服务不足(underserved)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rural area is often underserved by healthcare facilities.
  </text>
  <text x="50" y="310" class="content">
    农村地区常常缺乏医疗设施。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Community -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People waiting -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <!-- Service window -->
    <rect x="150" y="100" width="50" height="50" class="image" />
    <!-- Empty window -->
    <line x1="160" y1="110" x2="190" y2="140" class="image" />
    <line x1="190" y1="110" x2="160" y2="140" class="image" />
  </g>
</svg>