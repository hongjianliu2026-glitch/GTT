<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lunar</text>
  <text x="50" y="120" class="subtitle">[ˈluːnər] adj. 月亮的，阴历的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lun (月亮) + -ar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚，月亮(lun)高挂在天空中，
    <tspan x="50" dy="25">它的光芒照亮了整个世界，这就是"月亮的(lunar)"景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lunar calendar is used in many Asian countries.
  </text>
  <text x="50" y="310" class="content">
    阴历在许多亚洲国家被使用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Moon -->
    <circle cx="150" cy="150" r="100" class="image" fill="#FFD700" />
    <!-- Crater -->
    <circle cx="100" cy="120" r="15" class="image" fill="#D3D3D3" />
    <circle cx="180" cy="130" r="20" class="image" fill="#D3D3D3" />
    <circle cx="130" cy="180" r="10" class="image" fill="#D3D3D3" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" fill="#FFFFFF" />
    <circle cx="250" cy="70" r="5" class="image" fill="#FFFFFF" />
    <circle cx="300" cy="120" r="5" class="image" fill="#FFFFFF" />
    <circle cx="200" cy="250" r="5" class="image" fill="#FFFFFF" />
  </g>
</svg>