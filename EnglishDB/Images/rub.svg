<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rub</text>
  <text x="50" y="120" class="subtitle">[rʌb] v. 摩擦，擦；n. 摩擦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "rubben"，意为“摩擦”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在用爪子"摩擦(rub)"
    <tspan x="50" dy="25">地毯，试图留下自己的气味标记。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She rubbed her eyes after a long day at work.
  </text>
  <text x="50" y="310" class="content">
    她工作了一整天后揉了揉眼睛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Carpet -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cat -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="170" class="image" />
    <line x1="100" y1="150" x2="130" y2="170" class="image" />
    <line x1="100" y1="180" x2="70" y2="200" class="image" />
    <line x1="100" y1="180" x2="130" y2="200" class="image" />
    <!-- Paw rubbing -->
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="150" y2="140" class="image" />
    <line x1="150" y1="140" x2="100" y2="150" class="image" />
  </g>
</svg>