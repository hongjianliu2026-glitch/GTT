<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">turban</text>
  <text x="50" y="120" class="subtitle">[ˈtɜːrbən] n. 头巾，缠头巾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> turb (搅动) + an (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的战士，他的头巾(turban)像旋风一样"搅动(turb)"，
    <tspan x="50" dy="25">保护着他的头部，同时也象征着他的勇气和力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Sikh man wore a colorful turban.
  </text>
  <text x="50" y="310" class="content">
    那位锡克教男子戴着一条色彩鲜艳的头巾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Turban -->
    <path d="M 50 100 Q 100 20, 150 100 T 250 100" class="image" />
    <!-- Turbulent effect -->
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
    <line x1="200" y1="100" x2="250" y2="50" class="image" />
  </g>
</svg>