<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impeachment</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpiːtʃmənt] n. 弹劾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + peach (控告) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法庭场景，"进入(im-)"
    <tspan x="50" dy="25">控告(peach)"某位官员，这个过程就是弹劾(impeachment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The impeachment of the president caused a national uproar.
  </text>
  <text x="50" y="310" class="content">
    总统的弹劾引起了全国的轰动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Judge -->
    <circle cx="100" cy="45" r="15" class="image" />
    <line x1="100" y1="60" x2="100" y2="90" class="image" />
    <line x1="100" y1="70" x2="80" y2="60" class="image" />
    <line x1="100" y1="70" x2="120" y2="60" class="image" />
    <!-- Accuser -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="140" class="image" />
    <line x1="200" y1="125" x2="180" y2="115" class="image" />
    <line x1="200" y1="125" x2="220" y2="115" class="image" />
    <!-- Defendant -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="140" class="image" />
    <line x1="250" y1="125" x2="230" y2="115" class="image" />
    <line x1="250" y1="125" x2="270" y2="115" class="image" />
  </g>
</svg>