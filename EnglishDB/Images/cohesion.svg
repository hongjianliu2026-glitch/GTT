<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cohesion</text>
  <text x="50" y="120" class="subtitle">[koʊˈhiːʒən] n. 内聚力，凝聚力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + hese (粘附)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人手拉手，"共同粘附(co-hese)"在一起，
    <tspan x="50" dy="25">形成强大的凝聚力(cohesion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team's cohesion helped them win the championship.
  </text>
  <text x="50" y="310" class="content">
    团队的凝聚力帮助他们赢得了冠军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People holding hands -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="65" y1="100" x2="85" y2="100" class="image" />
    <line x1="115" y1="100" x2="135" y2="100" class="image" />
    <line x1="85" y1="100" x2="115" y2="100" class="image" />
    <!-- Ground -->
    <line x1="0" y1="120" x2="200" y2="120" class="image" />
  </g>
</svg>