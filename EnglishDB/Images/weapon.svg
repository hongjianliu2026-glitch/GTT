<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">weapon</text>
  <text x="50" y="120" class="subtitle">[ˈwepən] n. 武器，兵器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> weap (战利品) + -on (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士手持一把巨大的剑，剑身闪耀着寒光，
    <tspan x="50" dy="25">这把剑就是他的"战利品(weap-on)"，用来保护自己和攻击敌人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldier carried a weapon for self-defense.
  </text>
  <text x="50" y="310" class="content">
    士兵携带武器用于自卫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sword -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="10" y2="60" class="image" />
    <line x1="50" y1="20" x2="90" y2="60" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Soldier -->
    <circle cx="50" cy="250" r="20" class="image" />
    <line x1="50" y1="270" x2="50" y2="320" class="image" />
    <line x1="50" y1="320" x2="30" y2="360" class="image" />
    <line x1="50" y1="320" x2="70" y2="360" class="image" />
    <line x1="50" y1="290" x2="20" y2="280" class="image" />
    <line x1="50" y1="290" x2="80" y2="280" class="image" />
  </g>
</svg>