<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rioting</text>
  <text x="50" y="120" class="subtitle">[ˈraɪətɪŋ] n. 暴乱，骚乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> riot (暴乱) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"暴乱(riot)"，他们愤怒地挥舞着拳头，
    <tspan x="50" dy="25">街道上充满了混乱和破坏，这就是"暴乱(rioting)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police had to intervene to stop the rioting.
  </text>
  <text x="50" y="310" class="content">
    警察不得不介入以制止暴乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry crowd -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Fists -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="100" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="200" y1="70" x2="200" y2="100" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <!-- Broken objects -->
    <line x1="30" y1="120" x2="70" y2="160" class="image" />
    <line x1="30" y1="160" x2="70" y2="120" class="image" />
    <line x1="130" y1="120" x2="170" y2="160" class="image" />
    <line x1="130" y1="160" x2="170" y2="120" class="image" />
    <line x1="230" y1="120" x2="270" y2="160" class="image" />
    <line x1="230" y1="160" x2="270" y2="120" class="image" />
  </g>
</svg>