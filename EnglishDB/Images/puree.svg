<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">puree</text>
  <text x="50" y="120" class="subtitle">[pʊˈreɪ] n. 浓汤，果泥；v. 把...做成浓汤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pur- (纯净) + -ee (表示状态或结果)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"纯净地(pur-)"
    <tspan x="50" dy="25">将食材打成细腻的浓汤(puree)，每一口都是纯净的美味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She pureed the vegetables for the baby.
  </text>
  <text x="50" y="310" class="content">
    她为宝宝把蔬菜打成了浓汤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blender -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Blender container -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Vegetables -->
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="100" cy="60" r="10" class="image" />
    <circle cx="120" cy="60" r="10" class="image" />
    <!-- Puree -->
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <line x1="70" y1="130" x2="250" y2="130" class="image" />
    <line x1="70" y1="160" x2="270" y2="160" class="image" />
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>