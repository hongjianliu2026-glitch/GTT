<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ether</text>
  <text x="50" y="120" class="subtitle">[ˈiːθər] n. 以太，太空</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aether (古希腊语，意为“纯净的天空”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个纯净的太空，"以太(ether)"
    <tspan x="50" dy="25">中充满了神秘的光芒，仿佛是宇宙的灵魂。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concept of ether was once used to explain the transmission of light.
  </text>
  <text x="50" y="310" class="content">
    以太的概念曾被用来解释光的传播。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Space background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#0C343D" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" fill="#FFFFFF" />
    <circle cx="100" cy="30" r="5" fill="#FFFFFF" />
    <circle cx="150" cy="70" r="5" fill="#FFFFFF" />
    <circle cx="200" cy="40" r="5" fill="#FFFFFF" />
    <circle cx="250" cy="60" r="5" fill="#FFFFFF" />
    <circle cx="300" cy="20" r="5" fill="#FFFFFF" />
    <!-- Ether -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" stroke="#8E44AD" stroke-width="3" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" stroke="#8E44AD" stroke-width="3" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" stroke="#8E44AD" stroke-width="3" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" stroke="#8E44AD" stroke-width="3" />
    <line x1="0" y1="180" x2="350" y2="180" class="image" stroke="#8E44AD" stroke-width="3" />
  </g>
</svg>