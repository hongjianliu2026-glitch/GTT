<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #C51162; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mom</text>
  <text x="50" y="120" class="subtitle">[mɒm] n. 妈妈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "mome"，意为"妈妈"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温暖的厨房里，"妈妈(mom)"
    <tspan x="50" dy="25">正在为你准备美味的晚餐，她的笑容和</tspan>
    <tspan x="50" dy="25">温暖的拥抱让你感到无比安心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My mom always makes the best cookies.
  </text>
  <text x="50" y="310" class="content">
    我妈妈总是做最好的饼干。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Kitchen -->
    <rect x="0" y="0" width="350" height="300" class="image" />
    <!-- Mom -->
    <circle cx="100" cy="150" r="30" class="image" />
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="220" class="image" />
    <line x1="100" y1="200" x2="150" y2="220" class="image" />
    <!-- Kitchen utensils -->
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="225" y1="100" x2="225" y2="150" class="image" />
    <line x1="200" y1="150" x2="250" y2="150" class="image" />
    <!-- Food -->
    <circle cx="300" cy="120" r="20" class="image" />
    <circle cx="320" cy="140" r="15" class="image" />
    <circle cx="280" cy="130" r="10" class="image" />
  </g>
</svg>