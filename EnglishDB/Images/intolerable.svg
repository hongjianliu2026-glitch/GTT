<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intolerable</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɒlərəbl] adj. 无法忍受的，难以容忍的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + toler (忍受) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"无法忍受(in-toler-able)"的噪音包围，
    <tspan x="50" dy="25">他捂住耳朵，表情痛苦，这就是intolerable的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The noise from the construction site was intolerable.
  </text>
  <text x="50" y="310" class="content">
    建筑工地的噪音让人无法忍受。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with hands over ears -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <!-- Noise lines -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="70" x2="150" y2="70" class="image" />
    <line x1="100" y1="90" x2="150" y2="90" class="image" />
    <line x1="100" y1="110" x2="150" y2="110" class="image" />
    <line x1="100" y1="130" x2="150" y2="130" class="image" />
  </g>
</svg>