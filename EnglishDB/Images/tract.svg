<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tract</text>
  <text x="50" y="120" class="subtitle">[trækt] n. 地带，区域；v. 拖拉，吸引</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tract (拉，拖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磁铁，"拖拉(tract)"
    <tspan x="50" dy="25">着周围的金属物体，形成了一个吸引的区域(tract)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tractor can tract heavy loads easily.
  </text>
  <text x="50" y="310" class="content">
    拖拉机可以轻松拖动重物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnet -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Metal objects -->
    <circle cx="200" cy="50" r="20" class="image" />
    <rect x="230" y="30" width="40" height="40" class="image" />
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="150" y1="50" x2="230" y2="50" class="image" />
    <!-- Lines indicating attraction -->
    <line x1="75" y1="100" x2="200" y2="50" class="image" />
    <line x1="75" y1="100" x2="250" y2="50" class="image" />
  </g>
</svg>