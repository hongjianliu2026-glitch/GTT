<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">win-win</text>
  <text x="50" y="120" class="subtitle">[ˈwɪnˈwɪn] adj. 双赢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> win (赢) + win (赢)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在比赛中，"双方都赢(win-win)"，
    <tspan x="50" dy="25">他们互相拥抱庆祝，场面非常和谐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The negotiation resulted in a win-win situation.
  </text>
  <text x="50" y="310" class="content">
    谈判结果是双赢的局面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people shaking hands -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <!-- Smiling faces -->
    <path d="M50 90 Q55 80 60 90" class="image" />
    <path d="M150 90 Q155 80 160 90" class="image" />
    <!-- Hugging -->
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
    <line x1="70" y1="120" x2="70" y2="150" class="image" />
    <line x1="130" y1="120" x2="130" y2="150" class="image" />
  </g>
</svg>