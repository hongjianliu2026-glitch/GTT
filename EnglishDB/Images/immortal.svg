<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">immortal</text>
  <text x="50" y="120" class="subtitle">[ɪˈmɔːrtl] adj. 不朽的，永生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + mortal (死亡)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"不死(immortal)"的神，站在一个"不死亡(im-mortal)"的领域，
    <tspan x="50" dy="25">永远年轻，永远强大。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The legend of the immortal hero has been passed down through generations.
  </text>
  <text x="50" y="310" class="content">
    不朽英雄的传说代代相传。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Immortal figure -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- Eternal flame -->
    <circle cx="250" cy="100" r="30" class="image" fill="#FFD700" />
    <line x1="250" y1="130" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="220" y2="230" class="image" />
    <line x1="250" y1="200" x2="280" y2="230" class="image" />
    <line x1="250" y1="160" x2="220" y2="150" class="image" />
    <line x1="250" y1="160" x2="280" y2="150" class="image" />
  </g>
</svg>