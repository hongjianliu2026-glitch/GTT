<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outgrowth</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtɡroʊθ] n. 结果，产物；长出物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (向外) + growth (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵树，"向外生长(out-growth)"
    <tspan x="50" dy="25">出新的枝条，这些枝条就是树的产物(outgrowth)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outgrowth of the project was a new business model.
  </text>
  <text x="50" y="310" class="content">
    这个项目的结果是一个新的商业模式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="100" y="0" width="20" height="200" class="image" />
    <!-- Branches -->
    <line x1="110" y1="50" x2="150" y2="20" class="image" />
    <line x1="110" y1="100" x2="180" y2="70" class="image" />
    <line x1="110" y1="150" x2="200" y2="120" class="image" />
    <!-- Leaves -->
    <circle cx="150" cy="20" r="10" class="image" />
    <circle cx="180" cy="70" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
  </g>
</svg>