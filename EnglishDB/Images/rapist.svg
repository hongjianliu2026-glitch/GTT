<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rapist</text>
  <text x="50" y="120" class="subtitle">[ˈreɪpɪst] n. 强奸犯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rap (抓取) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶人用"抓取(rap)"的方式侵犯他人，
    <tspan x="50" dy="25">这种行为令人发指，他就是强奸犯(rapist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rapist was finally caught by the police.
  </text>
  <text x="50" y="310" class="content">
    那个强奸犯最终被警察抓住了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand grabbing -->
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="50" y1="50" x2="0" y2="100" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="50" y1="50" x2="100" y2="0" class="image" />
    <line x1="50" y1="50" x2="0" y2="0" class="image" />
    <!-- Victim -->
    <circle cx="150" cy="75" r="20" class="image" />
    <line x1="150" y1="95" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="130" y2="160" class="image" />
    <line x1="150" y1="130" x2="170" y2="160" class="image" />
    <line x1="150" y1="110" x2="120" y2="100" class="image" />
    <line x1="150" y1="110" x2="180" y2="100" class="image" />
  </g>
</svg>