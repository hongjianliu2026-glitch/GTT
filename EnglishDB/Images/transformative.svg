<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transformative</text>
  <text x="50" y="120" class="subtitle">[trænsˈfɔːrmətɪv] adj. 变革的，变形的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + form (形状) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通的石头，经过"跨越形状(trans-form)"的
    <tspan x="50" dy="25">变化，变成了一个闪闪发光的宝石，这就是transformative的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy had a transformative effect on the economy.
  </text>
  <text x="50" y="310" class="content">
    新政策对经济产生了变革性的影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Original stone -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <!-- Transformed gem -->
    <polygon points="150,0 200,50 150,100 100,50" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <polygon points="145,45 150,50 145,55" class="image" />
  </g>
</svg>