<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">usual</text>
  <text x="50" y="120" class="subtitle">[ˈjuːʒuəl] adj. 通常的，惯常的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> us (使用) + -ual (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个日常场景，"使用(us)"
    <tspan x="50" dy="25">惯常的方式(usual)，就像每天早上喝咖啡一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It is usual for him to wake up at 6 AM.
  </text>
  <text x="50" y="310" class="content">
    他通常在早上6点醒来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee cup -->
    <circle cx="50" cy="50" r="30" class="image" />
    <rect x="35" y="80" width="30" height="40" class="image" />
    <!-- Clock -->
    <circle cx="150" cy="50" r="40" class="image" />
    <line x1="150" y1="50" x2="150" y2="20" class="image" />
    <line x1="150" y1="50" x2="170" y2="50" class="image" />
    <!-- Bed -->
    <rect x="220" y="30" width="100" height="60" class="image" />
    <line x1="220" y1="30" x2="320" y2="30" class="image" />
    <line x1="220" y1="90" x2="320" y2="90" class="image" />
  </g>
</svg>