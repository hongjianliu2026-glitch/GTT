<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fur</text>
  <text x="50" y="120" class="subtitle">[fɜːr] n. 毛皮，皮毛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fur (来自古英语 "feorr"，意为毛皮)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小熊，全身覆盖着厚厚的"毛皮(fur)"，
    <tspan x="50" dy="25">它在雪地里打滚，毛皮保护它不受寒冷侵袭。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a coat made of fur to stay warm.
  </text>
  <text x="50" y="310" class="content">
    她穿了一件毛皮大衣来保暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bear with fur -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Bear head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Bear body -->
    <line x1="100" y1="200" x2="50" y2="150" class="image" /> <!-- Bear left arm -->
    <line x1="100" y1="200" x2="150" y2="150" class="image" /> <!-- Bear right arm -->
    <line x1="100" y1="250" x2="50" y2="300" class="image" /> <!-- Bear left leg -->
    <line x1="100" y1="250" x2="150" y2="300" class="image" /> <!-- Bear right leg -->
    <!-- Fur texture -->
    <line x1="70" y1="160" x2="130" y2="160" class="image" />
    <line x1="75" y1="170" x2="125" y2="170" class="image" />
    <line x1="80" y1="180" x2="120" y2="180" class="image" />
    <line x1="85" y1="190" x2="115" y2="190" class="image" />
    <line x1="90" y1="200" x2="110" y2="200" class="image" />
    <line x1="95" y1="210" x2="105" y2="210" class="image" />
  </g>
</svg>