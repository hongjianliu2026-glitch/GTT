<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thorn</text>
  <text x="50" y="120" class="subtitle">[θɔːrn] n. 刺，荆棘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thorn (刺)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在花园里玩耍，不小心踩到了一根"刺(thorn)"，
    <tspan x="50" dy="25">疼得它喵喵叫，这根刺就像是一个小小的敌人，</tspan>
    <tspan x="50" dy="25">提醒我们要小心脚下的危险。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stepped on a thorn and had to remove it with tweezers.
  </text>
  <text x="50" y="310" class="content">
    她踩到了一根刺，不得不用镊子把它拔出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Thorn -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="50" x2="40" y2="70" class="image" />
    <line x1="50" y1="50" x2="60" y2="70" class="image" />
    <line x1="50" y1="100" x2="40" y2="120" class="image" />
    <line x1="50" y1="100" x2="60" y2="120" class="image" />
    <!-- Cat -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <line x1="200" y1="140" x2="170" y2="130" class="image" />
    <!-- Expression -->
    <circle cx="200" cy="90" r="5" class="image" />
    <circle cx="215" cy="90" r="5" class="image" />
    <line x1="195" y1="110" x2="220" y2="110" class="image" />
  </g>
</svg>