<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #7E5109; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #1A5276; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sadden</text>
  <text x="50" y="120" class="subtitle">[ˈsædn] v. 使悲伤，使难过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sad (悲伤) + -en (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个悲伤的小丑，他的脸被"悲伤(sad)"
    <tspan x="50" dy="25">的力量"使动(en)"，变成了一个难过的表情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news saddened her deeply.
  </text>
  <text x="50" y="310" class="content">
    这个消息让她深感悲伤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sad clown face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Sad mouth -->
    <path d="M 60 140 Q 100 180 140 140" class="image" />
    <!-- Tears -->
    <line x1="70" y1="160" x2="70" y2="200" class="image" />
    <line x1="130" y1="160" x2="130" y2="200" class="image" />
  </g>
</svg>