<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vital</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪtl] adj. 至关重要的，生命的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vit (生命) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心脏在跳动，"生命(vit)"的力量源源不断，
    <tspan x="50" dy="25">这个心脏对整个身体来说是至关重要的(vital)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Oxygen is vital for human survival.
  </text>
  <text x="50" y="310" class="content">
    氧气对人类的生存至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 50 C10 0, 90 0, 90 50 S170 100, 90 150 S10 100, 10 50" class="image" />
    <!-- Arteries -->
    <line x1="50" y1="150" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="20" y2="300" class="image" />
    <line x1="50" y1="250" x2="80" y2="300" class="image" />
    <!-- Blood cells -->
    <circle cx="50" cy="100" r="5" class="image" />
    <circle cx="70" cy="120" r="5" class="image" />
    <circle cx="30" cy="130" r="5" class="image" />
  </g>
</svg>