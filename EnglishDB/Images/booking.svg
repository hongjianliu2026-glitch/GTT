<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">booking</text>
  <text x="50" y="120" class="subtitle">[ˈbʊkɪŋ] n. 预订，预约</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> book (书) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在书店里，"写下(book)"
    <tspan x="50" dy="25">预订信息，这些信息就构成了一个预订(booking)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a booking for a hotel room online.
  </text>
  <text x="50" y="310" class="content">
    她在网上预订了一间酒店房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Pages -->
    <line x1="10" y1="20" x2="140" y2="20" class="image" />
    <line x1="10" y1="50" x2="140" y2="50" class="image" />
    <line x1="10" y1="80" x2="140" y2="80" class="image" />
    <line x1="10" y1="110" x2="140" y2="110" class="image" />
    <line x1="10" y1="140" x2="140" y2="140" class="image" />
    <line x1="10" y1="170" x2="140" y2="170" class="image" />
    <!-- Person writing -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Pen -->
    <line x1="250" y1="120" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="240" y2="90" class="image" />
  </g>
</svg>