<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Hungarian</text>
  <text x="50" y="120" class="subtitle">[hʌŋˈɡɛəriən] adj. 匈牙利的；n. 匈牙利人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Hun- (匈牙利) + -garian (人或语言)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着传统匈牙利服装的人，站在一片广阔的匈牙利平原上，
    <tspan x="50" dy="25">背景是壮丽的匈牙利城堡，这个人就是匈牙利人(Hungarian)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a Hungarian who loves her country's rich culture.
  </text>
  <text x="50" y="310" class="content">
    她是一个热爱自己国家丰富文化的匈牙利人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional Hungarian costume -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="120" x2="100" y2="110" class="image" />
    <!-- Hungarian plain -->
    <line x1="150" y1="180" x2="350" y2="180" class="image" />
    <line x1="150" y1="190" x2="350" y2="190" class="image" />
    <line x1="150" y1="200" x2="350" y2="200" class="image" />
    <!-- Hungarian castle -->
    <rect x="250" y="20" width="100" height="150" class="image" />
    <line x1="270" y1="40" x2="270" y2="150" class="image" />
    <line x1="290" y1="40" x2="290" y2="150" class="image" />
    <line x1="310" y1="40" x2="310" y2="150" class="image" />
  </g>
</svg>