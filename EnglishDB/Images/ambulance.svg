<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ambulance</text>
  <text x="50" y="120" class="subtitle">[ˈæmbjələns] n. 救护车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ambul- (行走) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆救护车在街道上"行走(ambul-)"，
    <tspan x="50" dy="25">急速前进，拯救生命。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ambulance rushed to the accident scene.
  </text>
  <text x="50" y="310" class="content">
    救护车急速赶往事故现场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ambulance body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="140" r="20" class="image" />
    <circle cx="300" cy="140" r="20" class="image" />
    <!-- Ambulance lights -->
    <rect x="150" y="10" width="50" height="30" class="image" />
    <rect x="220" y="10" width="50" height="30" class="image" />
    <!-- Ambulance windows -->
    <rect x="50" y="50" width="100" height="50" class="image" />
    <rect x="200" y="50" width="100" height="50" class="image" />
  </g>
</svg>