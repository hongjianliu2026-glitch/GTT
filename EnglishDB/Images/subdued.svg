<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subdued</text>
  <text x="50" y="120" class="subtitle">[səbˈdjuːd] adj. 柔和的，压抑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + due (引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"压在下面(sub-due)"，
    <tspan x="50" dy="25">他的声音和情绪都被压抑了，变得柔和(subdued)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was dimly lit and the atmosphere was subdued.
  </text>
  <text x="50" y="310" class="content">
    房间光线昏暗，气氛压抑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person being subdued -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <!-- Pressure -->
    <rect x="30" y="80" width="40" height="20" class="image" />
    <text x="45" y="95" class="content" fill="#FF6347">压</text>
  </g>
</svg>