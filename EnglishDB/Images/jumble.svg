<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jumble</text>
  <text x="50" y="120" class="subtitle">[ˈdʒʌmbl] v. 使混乱，混杂；n. 混乱，杂乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jumbl (混乱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，所有的东西都被"混乱地堆在一起(jumble)"，
    <tspan x="50" dy="25">书本、衣服、玩具混杂在一起，形成了一个杂乱无章的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The papers on his desk were all jumbled together.
  </text>
  <text x="50" y="310" class="content">
    他桌子上的文件都混杂在一起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="50" height="70" class="image" />
    <rect x="120" y="20" width="50" height="70" class="image" />
    <rect x="190" y="20" width="50" height="70" class="image" />
    <!-- Clothes -->
    <rect x="50" y="110" width="50" height="70" class="image" />
    <rect x="120" y="110" width="50" height="70" class="image" />
    <rect x="190" y="110" width="50" height="70" class="image" />
    <!-- Toys -->
    <circle cx="280" cy="55" r="20" class="image" />
    <circle cx="320" cy="55" r="20" class="image" />
    <circle cx="280" cy="145" r="20" class="image" />
    <circle cx="320" cy="145" r="20" class="image" />
  </g>
</svg>