<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intelligent</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtelɪdʒənt] adj. 聪明的，智能的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> intel- (在中间) + lig (选择) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大脑在思考，"在中间选择(intel-lig)"
    <tspan x="50" dy="25">出最优的解决方案，这就是聪明的(intelligent)表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The AI system is highly intelligent and can solve complex problems.
  </text>
  <text x="50" y="310" class="content">
    这个AI系统非常智能，能够解决复杂的问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Neurons -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <!-- Light bulb -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="230" y2="230" class="image" />
    <line x1="250" y1="200" x2="270" y2="230" class="image" />
    <line x1="250" y1="160" x2="220" y2="160" class="image" />
    <line x1="250" y1="160" x2="280" y2="160" class="image" />
  </g>
</svg>