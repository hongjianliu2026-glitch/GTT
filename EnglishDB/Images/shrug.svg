<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shrug</text>
  <text x="50" y="120" class="subtitle">[ʃrʌɡ] v. 耸肩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sh- (表示动作) + rug (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对无法回答的问题时，"拉起(rug)"
    <tspan x="50" dy="25">肩膀，表示无奈或不关心，这就是耸肩(shrug)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She shrugged her shoulders and walked away.
  </text>
  <text x="50" y="310" class="content">
    她耸了耸肩，然后走开了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg -->
    <line x1="50" y1="80" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="80" x2="70" y2="100" class="image" /> <!-- Right arm -->
    <line x1="30" y1="100" x2="20" y2="90" class="image" /> <!-- Left shoulder -->
    <line x1="70" y1="100" x2="80" y2="90" class="image" /> <!-- Right shoulder -->
  </g>
</svg>