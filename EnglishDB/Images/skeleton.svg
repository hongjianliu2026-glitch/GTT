<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skeleton</text>
  <text x="50" y="120" class="subtitle">[ˈskelɪtn] n. 骨骼，骨架</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skel- (骨) + -eton (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的恐龙骨架(skeleton)，"骨(skel-)"
    <tspan x="50" dy="25">头小(eton)，支撑着整个身体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The museum displayed a complete dinosaur skeleton.
  </text>
  <text x="50" y="310" class="content">
    博物馆展示了一具完整的恐龙骨架。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Skeleton -->
    <line x1="100" y1="50" x2="100" y2="200" class="image" /> <!-- Spine -->
    <line x1="100" y1="50" x2="50" y2="100" class="image" /> <!-- Left arm -->
    <line x1="100" y1="50" x2="150" y2="100" class="image" /> <!-- Right arm -->
    <line x1="100" y1="200" x2="50" y2="250" class="image" /> <!-- Left leg -->
    <line x1="100" y1="200" x2="150" y2="250" class="image" /> <!-- Right leg -->
    <circle cx="100" cy="50" r="10" class="image" /> <!-- Head -->
  </g>
</svg>