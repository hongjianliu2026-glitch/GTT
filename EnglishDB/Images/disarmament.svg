<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disarmament</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsɑːrˈmæmənt] n. 裁军，解除武装</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (否定) + arm (武器) + ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个和平的场景，"否定(dis-)"
    <tspan x="50" dy="25">武器(arm)"的存在，象征着裁军(disarmament)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The treaty aims for global disarmament.
  </text>
  <text x="50" y="310" class="content">
    该条约旨在实现全球裁军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken weapon -->
    <line x1="50" y1="20" x2="250" y2="20" class="image" />
    <line x1="50" y1="20" x2="150" y2="120" class="image" />
    <line x1="250" y1="20" x2="150" y2="120" class="image" />
    <!-- Peace symbol -->
    <circle cx="150" cy="200" r="50" class="image" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <line x1="100" y1="200" x2="200" y2="200" class="image" />
  </g>
</svg>