<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subdivide</text>
  <text x="50" y="120" class="subtitle">[ˌsʌbdɪˈvaɪd] v. 细分，再分</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + divide (分开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕被"在下面分开(sub-divide)"，
    <tspan x="50" dy="25">变成许多小块，每一块都更小、更易管理。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The land was subdivided into smaller plots for sale.
  </text>
  <text x="50" y="310" class="content">
    这块土地被细分成更小的地块出售。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large cake -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Smaller pieces -->
    <rect x="20" y="20" width="40" height="40" class="image" />
    <rect x="80" y="20" width="40" height="40" class="image" />
    <rect x="140" y="20" width="40" height="40" class="image" />
    <rect x="20" y="80" width="40" height="40" class="image" />
    <rect x="80" y="80" width="40" height="40" class="image" />
    <rect x="140" y="80" width="40" height="40" class="image" />
    <!-- Knife cutting -->
    <line x1="0" y1="50" x2="200" y2="50" class="image" />
    <line x1="100" y1="0" x2="100" y2="100" class="image" />
  </g>
</svg>