<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supplant</text>
  <text x="50" y="120" class="subtitle">[səˈplænt] v. 取代，排挤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sup- (在下面) + plant (种植)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树被"种植在另一棵树的下面(sup-plant)"，
    <tspan x="50" dy="25">最终取代了原来的树，这就是"supplant"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new CEO supplanted the old one.
  </text>
  <text x="50" y="310" class="content">
    新任CEO取代了老CEO。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Original tree -->
    <line x1="50" y1="100" x2="50" y2="200" class="image" />
    <circle cx="50" cy="80" r="20" class="image" />
    <circle cx="30" cy="90" r="15" class="image" />
    <circle cx="70" cy="90" r="15" class="image" />
    <circle cx="50" cy="60" r="10" class="image" />

    <!-- New tree -->
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <circle cx="150" cy="130" r="20" class="image" />
    <circle cx="130" cy="140" r="15" class="image" />
    <circle cx="170" cy="140" r="15" class="image" />
    <circle cx="150" cy="110" r="10" class="image" />

    <!-- Arrow indicating replacement -->
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="150" y2="150" class="image" />
  </g>
</svg>