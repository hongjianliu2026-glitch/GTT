<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surviving</text>
  <text x="50" y="120" class="subtitle">[sərˈvaɪvɪŋ] adj. 幸存的，残存的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (超过) + viv (生命) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在荒岛上，"超过(sur-)"了其他人的生命，
    <tspan x="50" dy="25">成为了唯一的幸存者(surviving)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The surviving members of the expedition shared their story.
  </text>
  <text x="50" y="310" class="content">
    探险队的幸存成员分享了他们的故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Island -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Survivor -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Raft -->
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <line x1="50" y1="180" x2="70" y2="160" class="image" />
    <line x1="150" y1="180" x2="130" y2="160" class="image" />
  </g>
</svg>