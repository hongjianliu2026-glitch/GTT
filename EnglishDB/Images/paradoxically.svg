<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paradoxically</text>
  <text x="50" y="120" class="subtitle">[ˌpærəˈdɒksɪkəli] adv. 自相矛盾地，反常地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (旁边) + dox (观点) + -ic (形容词后缀) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在两个对立的观点之间，"旁边(para)"
    <tspan x="50" dy="25">有两个完全相反的"观点(dox)"，这种"自相矛盾(paradox)"的情况</tspan>
    <tspan x="50" dy="25">就是"反常地(paradoxically)"发生的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Paradoxically, the more he tried to help, the more he seemed to hinder.
  </text>
  <text x="50" y="310" class="content">
    反常的是，他越想帮忙，似乎越帮倒忙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two opposing signs -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="200" y="0" width="150" height="100" class="image" />
    <text x="20" y="50" class="content" text-anchor="middle">YES</text>
    <text x="380" y="50" class="content" text-anchor="middle">NO</text>
    <!-- Person in the middle -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="190" x2="160" y2="180" class="image" />
    <line x1="200" y1="190" x2="240" y2="180" class="image" />
  </g>
</svg>