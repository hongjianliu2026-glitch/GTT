<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">legging</text>
  <text x="50" y="120" class="subtitle">[ˈlɛɡɪŋ] n. 紧身裤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leg (腿) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条紧身裤紧紧包裹着你的腿，就像"腿(leg)"被"包裹(ing)"住一样，这就是紧身裤(legging)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a pair of black leggings for her workout.
  </text>
  <text x="50" y="310" class="content">
    她穿着一条黑色紧身裤去锻炼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Legs -->
    <line x1="50" y1="100" x2="50" y2="200" class="image" />
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <!-- Leggings -->
    <rect x="30" y="100" width="40" height="100" class="image" />
    <rect x="130" y="100" width="40" height="100" class="image" />
    <!-- Feet -->
    <circle cx="50" cy="220" r="20" class="image" />
    <circle cx="150" cy="220" r="20" class="image" />
  </g>
</svg>