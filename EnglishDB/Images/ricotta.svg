<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #5D4037; }
      .content { font: 18px sans-serif; fill: #795548; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #388E3C; }
      .image { stroke: #6D4C41; stroke-width: 2; fill: none; }
      .cheese { fill: #FFF9C4; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ricotta</text>
  <text x="50" y="120" class="subtitle">[riˈkɔtə] n. 意大利乳清干酪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ricotta (源自意大利语，意为“再煮”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"再煮(ricotta)"
    <tspan x="50" dy="25">乳清，制作出柔软的意大利乳清干酪(ricotta)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used ricotta in her lasagna recipe.
  </text>
  <text x="50" y="310" class="content">
    她在她的千层面食谱中使用了意大利乳清干酪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cooking pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cheese -->
    <circle cx="100" cy="100" r="50" class="cheese" />
    <circle cx="200" cy="100" r="50" class="cheese" />
    <circle cx="300" cy="100" r="50" class="cheese" />
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>