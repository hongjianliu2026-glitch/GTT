<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whaling</text>
  <text x="50" y="120" class="subtitle">[ˈweɪlɪŋ] n. 捕鲸</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> whale (鲸鱼) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群捕鲸者在海上，"追逐(ing)"
    <tspan x="50" dy="25">巨大的鲸鱼(whale)，这就是捕鲸(whaling)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The whaling industry has been controversial for decades.
  </text>
  <text x="50" y="310" class="content">
    捕鲸业几十年来一直备受争议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#4CAF50" />
    <!-- Whale -->
    <path d="M50,100 C100,50 250,50 300,100" class="image" stroke-width="5" />
    <!-- Boat -->
    <rect x="150" y="150" width="100" height="30" class="image" fill="#F44336" />
    <!-- Harpoon -->
    <line x1="200" y1="150" x2="200" y2="100" class="image" stroke-width="3" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" stroke-width="3" />
  </g>
</svg>