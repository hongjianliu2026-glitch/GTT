<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">African</text>
  <text x="50" y="120" class="subtitle">[ˈæfrɪkən] adj. 非洲的，非洲人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Afri- (非洲) + -can (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个非洲草原上，"非洲(Afri-)"
    <tspan x="50" dy="25">的狮子在阳光下威风凛凛，这就是"非洲的(African)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is fascinated by African culture.
  </text>
  <text x="50" y="310" class="content">
    她对非洲文化非常着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- African landscape -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" fill="#F1C40F" />
    <!-- Lion -->
    <circle cx="100" cy="150" r="20" fill="#D35400" />
    <line x1="100" y1="170" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="70" y2="170" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Grass -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="210" x2="350" y2="210" class="image" />
    <line x1="0" y1="220" x2="350" y2="220" class="image" />
  </g>
</svg>