<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inconclusive</text>
  <text x="50" y="120" class="subtitle">[ˌɪnkənˈkluːsɪv] adj. 无定论的，不确定的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + con- (一起) + clus (关闭) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个侦探在调查案件，但线索"无法一起关闭(in-con-clus-ive)"，
    <tspan x="50" dy="25">导致案件无法得出结论，这就是无定论的(inconclusive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The investigation was inconclusive, leaving many questions unanswered.
  </text>
  <text x="50" y="310" class="content">
    调查结果无定论，留下了许多未解之谜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Detective -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Magnifying glass -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <!-- Question marks -->
    <text x="180" y="120" class="image" font-size="48" fill="#7B241C">?</text>
    <text x="220" y="120" class="image" font-size="48" fill="#7B241C">?</text>
    <text x="260" y="120" class="image" font-size="48" fill="#7B241C">?</text>
  </g>
</svg>