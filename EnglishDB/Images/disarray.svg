<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disarray</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈreɪ] n. 混乱，杂乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + array (排列)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，所有的东西都被"不排列(dis-array)"
    <tspan x="50" dy="25">成了一团糟，这就是混乱(disarray)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was in complete disarray after the party.
  </text>
  <text x="50" y="310" class="content">
    派对过后，房间完全是一片混乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Messy items -->
    <line x1="50" y1="20" x2="100" y2="180" class="image" />
    <line x1="120" y1="20" x2="170" y2="180" class="image" />
    <line x1="190" y1="20" x2="240" y2="180" class="image" />
    <line x1="260" y1="20" x2="310" y2="180" class="image" />
    <!-- Cluttered items -->
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <circle cx="220" cy="140" r="15" class="image" />
    <circle cx="290" cy="160" r="15" class="image" />
  </g>
</svg>