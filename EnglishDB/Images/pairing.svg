<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pairing</text>
  <text x="50" y="120" class="subtitle">[ˈperɪŋ] n. 配对，成对</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pair (一对) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两只鞋子被"配对(pair)"在一起，形成了一个完美的"配对(pairing)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef demonstrated the perfect pairing of wine and cheese.
  </text>
  <text x="50" y="310" class="content">
    厨师展示了葡萄酒和奶酪的完美搭配。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Left shoe -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <line x1="20" y1="50" x2="20" y2="70" class="image" />
    <line x1="80" y1="50" x2="80" y2="70" class="image" />
    <line x1="20" y1="70" x2="80" y2="70" class="image" />
    <!-- Right shoe -->
    <rect x="150" y="0" width="100" height="50" class="image" />
    <line x1="170" y1="50" x2="230" y2="50" class="image" />
    <line x1="170" y1="50" x2="170" y2="70" class="image" />
    <line x1="230" y1="50" x2="230" y2="70" class="image" />
    <line x1="170" y1="70" x2="230" y2="70" class="image" />
    <!-- Connecting line -->
    <line x1="100" y1="25" x2="150" y2="25" class="image" />
  </g>
</svg>