<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gorgeous</text>
  <text x="50" y="120" class="subtitle">[ˈɡɔːrdʒəs] adj. 华丽的，极好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gord (财富) + -eous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满财富(gord)的宫殿，
    <tspan x="50" dy="25">里面装饰着金碧辉煌的物品，</tspan>
    <tspan x="50" dy="25">整个场景华丽(gorgeous)到令人惊叹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ballroom was absolutely gorgeous.
  </text>
  <text x="50" y="310" class="content">
    舞厅绝对华丽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Palace -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Golden decorations -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Wealth symbols -->
    <rect x="50" y="100" width="50" height="50" class="image" />
    <rect x="150" y="100" width="50" height="50" class="image" />
    <rect x="250" y="100" width="50" height="50" class="image" />
    <!-- Crown -->
    <polygon points="175,20 150,70 200,70" class="image" />
  </g>
</svg>