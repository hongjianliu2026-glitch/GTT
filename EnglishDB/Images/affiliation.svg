<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">affiliation</text>
  <text x="50" y="120" class="subtitle">[əˌfɪliˈeɪʃn] n. 联系，从属关系</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> af- (加强) + fili (儿子) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子(fili)被紧紧地(af-)
    <tspan x="50" dy="25">抱在怀里，象征着紧密的联系(affiliation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has strong affiliation with the local community.
  </text>
  <text x="50" y="310" class="content">
    她与当地社区有着紧密的联系。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parent and child -->
    <circle cx="100" cy="100" r="30" class="image" /> <!-- Parent -->
    <circle cx="150" cy="100" r="20" class="image" /> <!-- Child -->
    <line x1="100" y1="130" x2="150" y2="120" class="image" /> <!-- Connection -->
    <!-- Arms -->
    <line x1="70" y1="110" x2="130" y2="110" class="image" /> <!-- Parent's left arm -->
    <line x1="170" y1="110" x2="230" y2="110" class="image" /> <!-- Parent's right arm -->
  </g>
</svg>