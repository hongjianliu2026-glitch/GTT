<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snap</text>
  <text x="50" y="120" class="subtitle">[snæp] v. 猛咬，突然折断；n. 快照</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sn- (咬) + ap (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只饥饿的鳄鱼突然"猛咬(sn-ap)"
    <tspan x="50" dy="25">住了一块肉，发出清脆的"咔嚓"声，这就是snap的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The branch snapped under the weight of the snow.
  </text>
  <text x="50" y="310" class="content">
    树枝在雪的重压下突然折断了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crocodile -->
    <path d="M0 100 C 50 50, 150 50, 200 100 S 300 150, 350 100" class="image" />
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Meat -->
    <rect x="150" y="80" width="50" height="40" class="image" />
    <!-- Snap effect -->
    <line x1="150" y1="80" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="150" y2="160" class="image" />
  </g>
</svg>