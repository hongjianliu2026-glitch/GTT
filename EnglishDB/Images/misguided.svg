<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misguided</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsˈɡaɪdɪd] adj. 被误导的，错误的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + guide (引导) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着地图，但地图上的路线是错误的，
    <tspan x="50" dy="25">他完全被误导了，走上了错误的道路。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His misguided efforts led to failure.
  </text>
  <text x="50" y="310" class="content">
    他错误的努力导致了失败。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a map -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Map -->
    <rect x="100" y="80" width="200" height="120" class="image" />
    <!-- Wrong path -->
    <line x1="120" y1="100" x2="280" y2="100" class="image" />
    <line x1="120" y1="120" x2="280" y2="120" class="image" />
    <line x1="120" y1="140" x2="280" y2="140" class="image" />
    <line x1="120" y1="160" x2="280" y2="160" class="image" />
    <!-- Arrow pointing to wrong path -->
    <polyline points="300,100 320,110 300,120" class="image" />
  </g>
</svg>