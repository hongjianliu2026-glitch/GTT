<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rabid</text>
  <text x="50" y="120" class="subtitle">[ˈreɪbɪd] adj. 狂热的，狂怒的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rabi- (狂犬病) + -d (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狂犬病发作的狗，"狂怒地(rabid)"
    <tspan x="50" dy="25">四处乱咬，这种狂热的状态让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rabid fans cheered loudly for their favorite team.
  </text>
  <text x="50" y="310" class="content">
    狂热的粉丝们为他们的最爱队伍欢呼雀跃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Leg 1 -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Leg 2 -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Ear 1 -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Ear 2 -->
    <!-- Fangs -->
    <line x1="40" y1="110" x2="45" y2="120" class="image" />
    <line x1="55" y1="110" x2="60" y2="120" class="image" />
    <!-- Drooling -->
    <path d="M50 120 Q50 130, 60 135" class="image" />
    <path d="M50 120 Q50 130, 40 135" class="image" />
  </g>
</svg>