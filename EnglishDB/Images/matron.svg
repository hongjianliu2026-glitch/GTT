<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">matron</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪtrən] n. 女舍监，女总管</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> matr (母亲) + -on (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位慈祥的"母亲(matr)"，她像一位女舍监(matron)一样，
    <tspan x="50" dy="25">照顾着一群孩子，给他们温暖和关怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The matron of the orphanage took good care of the children.
  </text>
  <text x="50" y="310" class="content">
    孤儿院的女舍监很好地照顾了孩子们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother figure -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Children -->
    <circle cx="120" cy="120" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <circle cx="180" cy="120" r="15" class="image" />
    <line x1="120" y1="135" x2="120" y2="160" class="image" />
    <line x1="150" y1="135" x2="150" y2="160" class="image" />
    <line x1="180" y1="135" x2="180" y2="160" class="image" />
    <line x1="120" y1="160" x2="100" y2="180" class="image" />
    <line x1="150" y1="160" x2="130" y2="180" class="image" />
    <line x1="180" y1="160" x2="160" y2="180" class="image" />
    <line x1="120" y1="160" x2="140" y2="180" class="image" />
    <line x1="150" y1="160" x2="170" y2="180" class="image" />
    <line x1="180" y1="160" x2="200" y2="180" class="image" />
  </g>
</svg>