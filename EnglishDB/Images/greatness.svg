<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">greatness</text>
  <text x="50" y="120" class="subtitle">[ˈɡreɪtnəs] n. 伟大，卓越</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> great (大的，伟大的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的山峰，象征着"伟大(great)"，
    <tspan x="50" dy="25">而山峰的顶端闪耀着光芒，代表着"卓越(greatness)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His greatness as a leader was recognized worldwide.
  </text>
  <text x="50" y="310" class="content">
    他作为领导者的伟大被全世界认可。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="30" class="image" />
    <!-- Shine -->
    <line x1="150" y1="20" x2="150" y2="0" class="image" />
    <line x1="120" y1="35" x2="100" y2="20" class="image" />
    <line x1="180" y1="35" x2="200" y2="20" class="image" />
  </g>
</svg>