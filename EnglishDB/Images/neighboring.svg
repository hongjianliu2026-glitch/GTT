<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neighboring</text>
  <text x="50" y="120" class="subtitle">[ˈneɪbərɪŋ] adj. 邻近的，附近的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neighbor (邻居) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个房子紧紧挨在一起，"邻居(neighbor)"
    <tspan x="50" dy="25">的房子就是邻近的(neighboring)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The neighboring towns often collaborate on community projects.
  </text>
  <text x="50" y="310" class="content">
    邻近的城镇经常在社区项目上合作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House 1 -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="20" y="20" width="40" height="40" class="image" /> <!-- Window -->
    <rect x="90" y="20" width="40" height="40" class="image" /> <!-- Window -->
    <line x1="75" y1="100" x2="75" y2="120" class="image" /> <!-- Door -->

    <!-- House 2 -->
    <rect x="160" y="0" width="150" height="100" class="image" />
    <rect x="180" y="20" width="40" height="40" class="image" /> <!-- Window -->
    <rect x="250" y="20" width="40" height="40" class="image" /> <!-- Window -->
    <line x1="235" y1="100" x2="235" y2="120" class="image" /> <!-- Door -->

    <!-- Path between houses -->
    <line x1="150" y1="50" x2="160" y2="50" class="image" />
  </g>
</svg>