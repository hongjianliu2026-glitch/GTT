<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accelerate</text>
  <text x="50" y="120" class="subtitle">[əkˈsɛləˌreɪt] v. 加速，加快</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + celer (快速)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆赛车在赛道上，"加强(ac-)"
    <tspan x="50" dy="25">速度(celer)，瞬间加速(accelerate)，</tspan>
    <tspan x="50" dy="25">冲向终点。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new engine can accelerate the car from 0 to 60 mph in just 3 seconds.
  </text>
  <text x="50" y="310" class="content">
    新引擎可以让汽车在3秒内从0加速到60英里每小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Race track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <!-- Racing car -->
    <rect x="250" y="80" width="50" height="40" class="image" />
    <circle cx="260" cy="100" r="5" class="image" />
    <circle cx="290" cy="100" r="5" class="image" />
    <!-- Speed lines -->
    <line x1="240" y1="80" x2="230" y2="70" class="image" />
    <line x1="240" y1="90" x2="230" y2="80" class="image" />
    <line x1="240" y1="100" x2="230" y2="90" class="image" />
    <line x1="240" y1="110" x2="230" y2="100" class="image" />
    <line x1="240" y1="120" x2="230" y2="110" class="image" />
  </g>
</svg>