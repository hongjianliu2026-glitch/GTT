<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vacant</text>
  <text x="50" y="120" class="subtitle">[ˈveɪkənt] adj. 空的，空缺的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vac (空) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的空房间，"空(vac)"无一物，
    <tspan x="50" dy="25">只有回声在回荡，这就是"空的(vacant)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The position of manager is still vacant.
  </text>
  <text x="50" y="310" class="content">
    经理的职位仍然空缺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Empty room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Window -->
    <rect x="150" y="20" width="50" height="160" class="image" />
    <!-- Echo -->
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="270" cy="100" r="15" class="image" />
    <circle cx="290" cy="100" r="10" class="image" />
  </g>
</svg>