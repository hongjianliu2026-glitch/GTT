<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .heart { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reassuring</text>
  <text x="50" y="120" class="subtitle">[ˌriːəˈʃʊərɪŋ] adj. 令人安心的，使人放心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + assure (保证)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在安慰另一个人，"再次保证(re-assure)"
    <tspan x="50" dy="25">他们的心情，这种行为让人感到安心(reassuring)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His reassuring words made her feel better.
  </text>
  <text x="50" y="310" class="content">
    他令人安心的话语让她感觉好多了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="heart" />
    <!-- Person comforting another -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <circle cx="60" cy="100" r="15" class="image" />
    <line x1="60" y1="115" x2="60" y2="150" class="image" />
    <line x1="60" y1="150" x2="40" y2="180" class="image" />
    <line x1="60" y1="150" x2="80" y2="180" class="image" />
    <line x1="60" y1="130" x2="90" y2="120" class="image" />
    <!-- Hand comforting -->
    <line x1="20" y1="130" x2="60" y2="130" class="image" />
  </g>
</svg>