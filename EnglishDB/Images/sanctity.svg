<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sanctity</text>
  <text x="50" y="120" class="subtitle">[ˈsæŋktɪti] n. 神圣，圣洁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sanct- (神圣) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神圣的教堂，"神圣(sanct-)"
    <tspan x="50" dy="25">的光芒笼罩着整个空间，给人一种圣洁(sanctity)的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sanctity of the church was palpable.
  </text>
  <text x="50" y="310" class="content">
    教堂的神圣感是显而易见的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,20 300,20 350,100 0,100" class="image" />
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="300" y1="20" x2="300" y2="100" class="image" />
    <!-- Holy light -->
    <circle cx="175" cy="60" r="50" class="image" />
    <line x1="175" y1="10" x2="175" y2="110" class="image" />
    <line x1="125" y1="60" x2="225" y2="60" class="image" />
    <line x1="150" y1="30" x2="200" y2="90" class="image" />
    <line x1="200" y1="30" x2="150" y2="90" class="image" />
  </g>
</svg>