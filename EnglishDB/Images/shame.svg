<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shame</text>
  <text x="50" y="120" class="subtitle">[ʃeɪm] n. 羞耻，羞愧；v. 使羞愧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s(h)ame (类似) + -e (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为做错了事，脸上"类似(s(h)ame)"
    <tspan x="50" dy="25">被涂上了红色，感到羞愧(shame)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt shame for lying to her parents.
  </text>
  <text x="50" y="310" class="content">
    她因为对父母撒谎而感到羞愧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Red blush -->
    <circle cx="70" cy="80" r="15" class="image" fill="#E74C3C" />
    <circle cx="130" cy="80" r="15" class="image" fill="#E74C3C" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" fill="#2C3E50" />
    <circle cx="120" cy="90" r="5" class="image" fill="#2C3E50" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 130 130 120" class="image" fill="none" stroke="#2C3E50" stroke-width="2" />
  </g>
</svg>