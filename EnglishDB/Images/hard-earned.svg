<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hard-earned</text>
  <text x="50" y="120" class="subtitle">[ˌhɑːrdˈɜːrnd] adj. 辛苦挣得的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hard (辛苦) + earn (挣得)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在烈日下挥汗如雨，"辛苦地挣得(hard-earned)"
    <tspan x="50" dy="25">每一分钱，这些钱都是他辛勤劳动的成果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She saved her hard-earned money for a new laptop.
  </text>
  <text x="50" y="310" class="content">
    她用辛苦挣来的钱买了一台新笔记本电脑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="200" cy="100" r="50" fill="#F39C12" />
    <!-- Person -->
    <circle cx="200" cy="200" r="20" fill="#2C3E50" />
    <line x1="200" y1="220" x2="200" y2="280" class="image" />
    <line x1="200" y1="250" x2="180" y2="230" class="image" />
    <line x1="200" y1="250" x2="220" y2="230" class="image" />
    <line x1="200" y1="280" x2="180" y2="300" class="image" />
    <line x1="200" y1="280" x2="220" y2="300" class="image" />
    <!-- Money -->
    <rect x="180" y="310" width="40" height="20" fill="#D35400" />
    <text x="190" y="325" fill="#FFFFFF" font-size="14">$$</text>
  </g>
</svg>