<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">six-year</text>
  <text x="50" y="120" class="subtitle">[sɪks jɪr] adj. 六年的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> six (六) + year (年)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子从出生到六岁，"六年的时光(six-year)"
    <tspan x="50" dy="25">见证了他的成长和变化。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has been teaching for six-year.
  </text>
  <text x="50" y="310" class="content">
    她已经教了六年书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Six-year timeline -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="0" x2="0" y2="50" class="image" />
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <line x1="100" y1="0" x2="100" y2="50" class="image" />
    <line x1="150" y1="0" x2="150" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <line x1="250" y1="0" x2="250" y2="50" class="image" />
    <line x1="300" y1="0" x2="300" y2="50" class="image" />
    <line x1="350" y1="0" x2="350" y2="50" class="image" />
    <!-- Child growth -->
    <circle cx="0" cy="60" r="10" class="image" />
    <circle cx="50" cy="60" r="15" class="image" />
    <circle cx="100" cy="60" r="20" class="image" />
    <circle cx="150" cy="60" r="25" class="image" />
    <circle cx="200" cy="60" r="30" class="image" />
    <circle cx="250" cy="60" r="35" class="image" />
    <circle cx="300" cy="60" r="40" class="image" />
    <circle cx="350" cy="60" r="45" class="image" />
  </g>
</svg>