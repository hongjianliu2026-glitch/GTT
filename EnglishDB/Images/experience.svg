<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">experience</text>
  <text x="50" y="120" class="subtitle">[ɪkˈspɪriəns] n. 经验，经历；v. 体验，感受</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + peri (尝试) + ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人勇敢地"尝试(peri)"新事物，
    <tspan x="50" dy="25">从中学到的知识和感受就是"经验(experience)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gained valuable experience during her internship.
  </text>
  <text x="50" y="310" class="content">
    她在实习期间获得了宝贵的经验。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person trying something new -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- New experience -->
    <rect x="100" y="80" width="150" height="100" class="image" />
    <text x="120" y="130" class="content">New Experience</text>
  </g>
</svg>