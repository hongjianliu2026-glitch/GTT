<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jobless</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɒbləs] adj. 失业的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> job (工作) + -less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在空荡荡的办公室里，"没有工作(job-less)"，
    <tspan x="50" dy="25">周围只有空椅子和空桌子，象征着失业的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jobless rate has increased significantly this year.
  </text>
  <text x="50" y="310" class="content">
    今年的失业率显著上升。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Empty office -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Empty chair -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <line x1="75" y1="120" x2="75" y2="180" class="image" />
    <line x1="50" y1="150" x2="100" y2="150" class="image" />
    <!-- Empty desk -->
    <rect x="150" y="20" width="150" height="100" class="image" />
    <line x1="150" y1="120" x2="300" y2="120" class="image" />
    <line x1="150" y1="120" x2="150" y2="200" class="image" />
    <line x1="300" y1="120" x2="300" y2="200" class="image" />
    <!-- Person sitting -->
    <circle cx="225" cy="160" r="15" class="image" />
    <line x1="225" y1="175" x2="225" y2="200" class="image" />
    <line x1="225" y1="200" x2="200" y2="230" class="image" />
    <line x1="225" y1="200" x2="250" y2="230" class="image" />
  </g>
</svg>