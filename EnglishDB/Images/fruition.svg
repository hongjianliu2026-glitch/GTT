<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fruition</text>
  <text x="50" y="120" class="subtitle">[fruˈɪʃən] n. 实现，结果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fruit (果实) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵树，经过辛勤的耕耘和等待，
    <tspan x="50" dy="25">最终结出了丰硕的果实(fruit)，这便是努力的实现(fruition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After years of hard work, his dream finally came to fruition.
  </text>
  <text x="50" y="310" class="content">
    经过多年的努力，他的梦想终于实现了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <!-- Branches -->
    <line x1="100" y1="50" x2="50" y2="100" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <!-- Fruits -->
    <circle cx="50" cy="100" r="10" class="image" fill="#FFD700" />
    <circle cx="150" cy="100" r="10" class="image" fill="#FFD700" />
    <circle cx="50" cy="150" r="10" class="image" fill="#FFD700" />
    <circle cx="150" cy="150" r="10" class="image" fill="#FFD700" />
  </g>
</svg>