<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">witchcraft</text>
  <text x="50" y="120" class="subtitle">[ˈwɪtʃkræft] n. 巫术，魔法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> witch (女巫) + craft (技艺)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女巫在月光下，手持魔杖，"施展技艺(craft)"
    <tspan x="50" dy="25">在空中画出神秘的符号，这就是巫术(witchcraft)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The villagers believed in the power of witchcraft.
  </text>
  <text x="50" y="310" class="content">
    村民们相信巫术的力量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="175" cy="100" r="50" fill="#F1C40F" />
    <!-- Witch -->
    <circle cx="175" cy="150" r="20" fill="#8E44AD" />
    <line x1="175" y1="170" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="155" y2="250" class="image" />
    <line x1="175" y1="220" x2="195" y2="250" class="image" />
    <line x1="175" y1="190" x2="145" y2="180" class="image" />
    <line x1="175" y1="190" x2="205" y2="180" class="image" />
    <!-- Wand -->
    <line x1="175" y1="150" x2="175" y2="80" class="image" />
    <circle cx="175" cy="80" r="5" fill="#C0392B" />
    <!-- Symbols -->
    <path d="M150,100 Q175,50 200,100" class="image" />
    <path d="M150,120 Q175,170 200,120" class="image" />
  </g>
</svg>