<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">memorial</text>
  <text x="50" y="120" class="subtitle">[məˈmɔːriəl] n. 纪念碑，纪念物；adj. 纪念的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> memori (记忆) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的纪念碑，上面刻满了人们的名字，
    <tspan x="50" dy="25">这些名字是为了"记住(memori)"那些逝去的人，</tspan>
    <tspan x="50" dy="25">这座纪念碑就是他们的"纪念物(memorial)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They built a memorial to honor the fallen soldiers.
  </text>
  <text x="50" y="310" class="content">
    他们建造了一座纪念碑来纪念阵亡的士兵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monument -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Names -->
    <text x="20" y="40" class="content">John</text>
    <text x="20" y="70" class="content">Mary</text>
    <text x="20" y="100" class="content">Tom</text>
    <text x="20" y="130" class="content">Lisa</text>
    <text x="20" y="160" class="content">Mike</text>
  </g>
</svg>