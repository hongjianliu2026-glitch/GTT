<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infraction</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfrækʃn] n. 违反，犯规</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + fract (打破) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个足球运动员在比赛中"进入(in-)"禁区并"打破(fract)"了规则，
    <tspan x="50" dy="25">裁判立即吹哨，这就是一次犯规(infraction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The referee called an infraction for a handball.
  </text>
  <text x="50" y="310" class="content">
    裁判因手球判罚了一次犯规。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Football field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Football player -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Referee -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Whistle -->
    <circle cx="200" cy="80" r="5" class="image" />
    <line x1="200" y1="85" x2="200" y2="95" class="image" />
    <!-- Penalty area -->
    <rect x="0" y="100" width="100" height="100" class="image" />
  </g>
</svg>