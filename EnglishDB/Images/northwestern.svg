<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">northwestern</text>
  <text x="50" y="120" class="subtitle">[ˌnɔrθˈwɛstərn] adj. 西北的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> north (北) + west (西) + -ern (方向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指南针指向西北方向，"北(north)和西(west)"
    <tspan x="50" dy="25">的结合，形成了西北(northwestern)的方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The northwestern part of the city is less developed.
  </text>
  <text x="50" y="310" class="content">
    城市的西北部分发展较慢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compass -->
    <circle cx="175" cy="100" r="80" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="20" y1="100" x2="330" y2="100" class="image" />
    <line x1="175" y1="100" x2="330" y2="20" class="image" />
    <line x1="175" y1="100" x2="330" y2="180" class="image" />
    <line x1="175" y1="100" x2="20" y2="20" class="image" />
    <line x1="175" y1="100" x2="20" y2="180" class="image" />
    <!-- Arrow pointing northwest -->
    <polygon points="175,100 140,140 150,150 175,125 200,150 210,140" class="image" />
    <text x="150" y="160" class="content">NW</text>
  </g>
</svg>