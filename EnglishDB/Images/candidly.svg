<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">candidly</text>
  <text x="50" y="120" class="subtitle">[ˈkændɪdli] adv. 坦率地，直率地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> candid (坦率的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"坦率地(candidly)"
    <tspan x="50" dy="25">面对自己的真实想法，毫不掩饰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke candidly about her feelings.
  </text>
  <text x="50" y="310" class="content">
    她坦率地谈了她的感受。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="140" y2="130" class="image" />
    <line x1="175" y1="150" x2="210" y2="130" class="image" />
    <line x1="175" y1="180" x2="140" y2="210" class="image" />
    <line x1="175" y1="180" x2="210" y2="210" class="image" />
    <!-- Reflection -->
    <circle cx="175" cy="250" r="30" class="image" />
    <line x1="175" y1="280" x2="175" y2="330" class="image" />
    <line x1="175" y1="300" x2="140" y2="280" class="image" />
    <line x1="175" y1="300" x2="210" y2="280" class="image" />
    <line x1="175" y1="330" x2="140" y2="360" class="image" />
    <line x1="175" y1="330" x2="210" y2="360" class="image" />
  </g>
</svg>