<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pipeline</text>
  <text x="50" y="120" class="subtitle">[ˈpaɪplaɪn] n. 管道，流水线</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pipe (管道) + line (线)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的管道，里面有无数的小球在滚动，
    <tspan x="50" dy="25">每个小球代表一个任务，它们沿着管道(pipeline)流动，</tspan>
    <tspan x="50" dy="25">最终完成整个流程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a well-organized pipeline for product development.
  </text>
  <text x="50" y="310" class="content">
    该公司有一个组织良好的产品开发流水线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pipeline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Balls -->
    <circle cx="70" cy="40" r="10" class="image" />
    <circle cx="120" cy="80" r="10" class="image" />
    <circle cx="170" cy="120" r="10" class="image" />
    <circle cx="220" cy="160" r="10" class="image" />
    <circle cx="270" cy="200" r="10" class="image" />
  </g>
</svg>