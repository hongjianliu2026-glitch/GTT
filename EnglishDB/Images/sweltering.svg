<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #F1C40F; }
      .person { fill: #ECF0F1; stroke: #7F8C8D; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sweltering</text>
  <text x="50" y="120" class="subtitle">[ˈsweltərɪŋ] adj. 酷热的，闷热的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swel (膨胀) + -ter (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个太阳(sun)在天空中"膨胀(swel)"，
    <tspan x="50" dy="25">地面上的一个人(person)被热得满头大汗，</tspan>
    <tspan x="50" dy="25">这就是酷热(sweltering)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sweltering heat made it difficult to sleep.
  </text>
  <text x="50" y="310" class="content">
    酷热让人难以入睡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="sun" />
    <!-- Person -->
    <circle cx="250" cy="150" r="20" class="person" />
    <line x1="250" y1="170" x2="250" y2="220" class="person" />
    <line x1="250" y1="220" x2="230" y2="250" class="person" />
    <line x1="250" y1="220" x2="270" y2="250" class="person" />
    <line x1="250" y1="190" x2="220" y2="180" class="person" />
    <line x1="250" y1="190" x2="280" y2="180" class="person" />
    <!-- Sweat drops -->
    <circle cx="240" cy="140" r="5" class="person" />
    <circle cx="260" cy="140" r="5" class="person" />
    <circle cx="250" cy="130" r="5" class="person" />
  </g>
</svg>