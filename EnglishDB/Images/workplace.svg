<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">workplace</text>
  <text x="50" y="120" class="subtitle">[ˈwɜːrkpleɪs] n. 工作场所，办公室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> work (工作) + place (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个忙碌的办公室，"工作(work)"
    <tspan x="50" dy="25">和"地方(place)"的结合，构成了一个充满活力的工作场所(workplace)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new workplace is equipped with modern facilities.
  </text>
  <text x="50" y="310" class="content">
    新的工作场所配备了现代化的设施。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Office desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Computer screen -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Chair -->
    <rect x="30" y="180" width="40" height="20" class="image" />
    <!-- Desk -->
    <rect x="0" y="160" width="350" height="20" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>