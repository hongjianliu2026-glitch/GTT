<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .denim { fill: #003366; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">denim</text>
  <text x="50" y="120" class="subtitle">[ˈdɛnɪm] n. 牛仔布，斜纹棉布</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (来自) + nim (尼姆)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条牛仔裤，"来自尼姆(de-nim)"
    <tspan x="50" dy="25">的坚韧布料，这就是牛仔布(denim)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a pair of denim jeans to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一条牛仔布裤子去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jeans -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="denim" />
    <!-- Pockets -->
    <rect x="70" y="40" width="50" height="40" class="image" />
    <rect x="230" y="40" width="50" height="40" class="image" />
    <!-- Belt -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="25" x2="300" y2="25" class="image" />
    <line x1="50" y1="30" x2="300" y2="30" class="image" />
    <!-- Buttons -->
    <circle cx="100" cy="35" r="5" class="image" />
    <circle cx="150" cy="35" r="5" class="image" />
    <circle cx="200" cy="35" r="5" class="image" />
    <circle cx="250" cy="35" r="5" class="image" />
  </g>
</svg>