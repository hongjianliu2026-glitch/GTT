<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reunite</text>
  <text x="50" y="120" class="subtitle">[ˌriːjuːˈnaɪt] v. 重聚，再结合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + unite (联合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人被一条线分开，然后"再次联合(re-unite)"
    <tspan x="50" dy="25">在一起，紧紧拥抱，这就是重聚(reunite)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After years of separation, they finally reunited.
  </text>
  <text x="50" y="310" class="content">
    经过多年的分离，他们终于重聚了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Line separating two people -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <!-- First person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="200" class="image" />
    <line x1="100" y1="160" x2="120" y2="200" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Second person -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="200" class="image" />
    <line x1="300" y1="160" x2="320" y2="200" class="image" />
    <line x1="300" y1="140" x2="340" y2="130" class="image" />
    <!-- Reunited -->
    <line x1="100" y1="160" x2="300" y2="160" class="image" />
  </g>
</svg>