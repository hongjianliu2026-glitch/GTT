<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">space</text>
  <text x="50" y="120" class="subtitle">[speɪs] n. 空间，太空；v. 隔开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spaci (宽阔)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宇航员在太空中漂浮，"宽阔的(spaci)"
    <tspan x="50" dy="25">空间让他感到自由和无限，这就是太空(space)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The astronaut floated in the vast space.
  </text>
  <text x="50" y="310" class="content">
    宇航员在广阔的太空中漂浮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Space background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Astronaut -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="3" class="image" />
    <circle cx="100" cy="30" r="3" class="image" />
    <circle cx="250" cy="70" r="3" class="image" />
    <circle cx="300" cy="40" r="3" class="image" />
    <circle cx="330" cy="90" r="3" class="image" />
  </g>
</svg>