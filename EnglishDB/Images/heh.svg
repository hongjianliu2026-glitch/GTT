<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heh</text>
  <text x="50" y="120" class="subtitle">[hɛ] int. 呵呵（表示轻蔑或尴尬）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无明显词根，为拟声词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在尴尬或轻蔑时，发出"呵呵(heh)"的声音，
    <tspan x="50" dy="25">这个声音就像是一个小小的嘲讽，让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Heh, I guess I was wrong about that.
  </text>
  <text x="50" y="310" class="content">
    呵呵，我猜我错了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 130 130 120" class="image" />
    <!-- Speech bubble -->
    <path d="M 150 80 Q 250 80 250 150 Q 250 220 150 220 Q 50 220 50 150 Q 50 80 150 80" class="image" />
    <text x="160" y="140" class="content">"Heh"</text>
  </g>
</svg>