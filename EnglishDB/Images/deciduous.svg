<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deciduous</text>
  <text x="50" y="120" class="subtitle">[dɪˈsɪdʒuəs] adj. 落叶的，脱落的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + cid (落下) + uous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵树，"离开(de-)"它的叶子，"落下(cid)"
    <tspan x="50" dy="25">在秋天，这些叶子就构成了落叶树(deciduous tree)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The deciduous trees shed their leaves in autumn.
  </text>
  <text x="50" y="310" class="content">
    落叶树在秋天会落叶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="150" y="0" width="50" height="200" class="image" />
    <!-- Branches -->
    <line x1="175" y1="20" x2="100" y2="100" class="image" />
    <line x1="175" y1="20" x2="250" y2="100" class="image" />
    <line x1="175" y1="50" x2="100" y2="150" class="image" />
    <line x1="175" y1="50" x2="250" y2="150" class="image" />
    <!-- Leaves -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
    <!-- Falling leaves -->
    <line x1="100" y1="100" x2="100" y2="250" class="image" />
    <line x1="250" y1="100" x2="250" y2="250" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="250" y1="150" x2="250" y2="250" class="image" />
  </g>
</svg>