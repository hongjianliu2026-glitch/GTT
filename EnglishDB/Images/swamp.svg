<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swamp</text>
  <text x="50" y="120" class="subtitle">[swɒmp] n. 沼泽，湿地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swamp (沼泽)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片"沼泽(swamp)"，里面充满了泥泞和
    <tspan x="50" dy="25">水，还有各种奇怪的生物在水中游动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The explorers got stuck in the swamp.
  </text>
  <text x="50" y="310" class="content">
    探险者们陷入了沼泽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Swamp -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Water -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Mud -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Creatures -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
  </g>
</svg>