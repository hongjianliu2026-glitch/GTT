<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">syntax</text>
  <text x="50" y="120" class="subtitle">[ˈsɪntæks] n. 句法，语法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syn- (一起) + tax (安排)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个语言学家在整理一堆字母卡片，"一起安排(syn-tax)"
    <tspan x="50" dy="25">这些卡片，让它们形成有意义的句子，这就是语法(syntax)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The syntax of this sentence is incorrect.
  </text>
  <text x="50" y="310" class="content">
    这个句子的语法不正确。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Letter cards -->
    <rect x="0" y="0" width="50" height="50" class="image" />
    <rect x="60" y="0" width="50" height="50" class="image" />
    <rect x="120" y="0" width="50" height="50" class="image" />
    <rect x="180" y="0" width="50" height="50" class="image" />
    <rect x="240" y="0" width="50" height="50" class="image" />
    <rect x="300" y="0" width="50" height="50" class="image" />
    <!-- Letters -->
    <text x="10" y="35" class="content">S</text>
    <text x="70" y="35" class="content">Y</text>
    <text x="130" y="35" class="content">N</text>
    <text x="190" y="35" class="content">T</text>
    <text x="250" y="35" class="content">A</text>
    <text x="310" y="35" class="content">X</text>
    <!-- Language expert -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>