<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nightgown</text>
  <text x="50" y="120" class="subtitle">[ˈnaɪtɡaʊn] n. 睡衣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> night (夜晚) + gown (长袍)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宁静的夜晚，一位女士穿着长袍(gown)，
    <tspan x="50" dy="25">舒适地躺在床上，享受着夜晚(night)的宁静。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She changed into her nightgown before bedtime.
  </text>
  <text x="50" y="310" class="content">
    她在睡前换上了睡衣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#1E1E2E" />
    <!-- Moon -->
    <circle cx="50" cy="50" r="20" class="image" fill="#F5F5F5" />
    <!-- Stars -->
    <circle cx="100" cy="30" r="3" class="image" fill="#F5F5F5" />
    <circle cx="120" cy="60" r="3" class="image" fill="#F5F5F5" />
    <circle cx="140" cy="40" r="3" class="image" fill="#F5F5F5" />
    <!-- Bed -->
    <rect x="150" y="100" width="150" height="50" class="image" fill="#D3D3D3" />
    <!-- Pillow -->
    <rect x="160" y="90" width="40" height="10" class="image" fill="#FFFFFF" />
    <!-- Nightgown -->
    <rect x="180" y="100" width="80" height="100" class="image" fill="#F5E0E0" />
    <!-- Person -->
    <circle cx="220" cy="80" r="15" class="image" fill="#F5E0E0" />
  </g>
</svg>