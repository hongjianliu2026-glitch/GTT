<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .smog { fill: #808080; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smog</text>
  <text x="50" y="120" class="subtitle">[smɒɡ] n. 烟雾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smoke (烟) + fog (雾)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市被浓重的"烟(smoke)"和"雾(fog)"笼罩，
    <tspan x="50" dy="25">形成了一层厚厚的"烟雾(smog)"，让人难以呼吸。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smog in the city was so thick that visibility was reduced to a few meters.
  </text>
  <text x="50" y="310" class="content">
    城市中的烟雾非常浓，能见度降低到只有几米。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="100" width="50" height="100" class="image" />
    <rect x="120" y="80" width="50" height="120" class="image" />
    <rect x="190" y="120" width="50" height="80" class="image" />
    <rect x="260" y="90" width="50" height="110" class="image" />
    <!-- Smog -->
    <rect x="0" y="0" width="350" height="200" class="smog" opacity="0.5" />
  </g>
</svg>