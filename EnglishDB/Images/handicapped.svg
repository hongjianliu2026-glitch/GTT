<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handicapped</text>
  <text x="50" y="120" class="subtitle">[ˈhændɪkæpt] adj. 残障的，有障碍的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> handi- (手) + cap (抓住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为手部受伤，"手被抓住(handi-cap)"，
    <tspan x="50" dy="25">导致行动不便，这就是残障(handicapped)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new ramp makes the building accessible to handicapped people.
  </text>
  <text x="50" y="310" class="content">
    新的斜坡使得建筑物对残障人士更加友好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person with a hand injury -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Right leg -->
    <!-- Hand injury -->
    <line x1="80" y1="180" x2="100" y2="180" class="image" /> <!-- Hand -->
    <line x1="90" y1="175" x2="90" y2="185" class="image" /> <!-- Injury mark -->
    <line x1="85" y1="180" x2="95" y2="180" class="image" /> <!-- Injury mark -->
  </g>
</svg>