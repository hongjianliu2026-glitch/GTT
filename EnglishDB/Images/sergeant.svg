<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sergeant</text>
  <text x="50" y="120" class="subtitle">[ˈsɑːrdʒənt] n. 中士，警官</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ser- (服务) + -geant (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个中士在军队中，"服务(ser-)"
    <tspan x="50" dy="25">并指挥士兵，他就是中士(sergeant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sergeant ordered his troops to advance.
  </text>
  <text x="50" y="310" class="content">
    中士命令他的部队前进。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Sergeant -->
    <rect x="120" y="0" width="100" height="200" class="image" />
    <!-- Rank insignia -->
    <rect x="140" y="20" width="60" height="30" class="image" />
    <!-- Command -->
    <line x1="150" y1="70" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="100" y2="150" class="image" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <!-- Soldiers -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="50" cy="200" r="15" class="image" />
  </g>
</svg>