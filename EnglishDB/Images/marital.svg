<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marital</text>
  <text x="50" y="120" class="subtitle">[ˈmærɪtl] adj. 婚姻的，夫妻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar (婚姻) + -ital (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一对夫妻在婚礼上，"婚姻(mar)"
    <tspan x="50" dy="25">的誓言让他们成为"婚姻的(marital)"伴侣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They discussed their marital problems in therapy.
  </text>
  <text x="50" y="310" class="content">
    他们在治疗中讨论了他们的婚姻问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wedding ring -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Couple -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Heart -->
    <path d="M100,150 C80,180 120,180 100,150 Z" class="image" />
  </g>
</svg>