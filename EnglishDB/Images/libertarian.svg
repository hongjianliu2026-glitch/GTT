<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">libertarian</text>
  <text x="50" y="120" class="subtitle">[ˌlɪbərˈtɛəriən] n. 自由意志主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liber (自由) + -tarian (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个自由意志主义者，他站在一个巨大的自由女神像前，
    <tspan x="50" dy="25">手里拿着一本宪法，象征着他对自由的坚定追求。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The libertarian believes in minimal government intervention.
  </text>
  <text x="50" y="310" class="content">
    这位自由意志主义者相信政府干预应尽可能少。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Statue of Liberty -->
    <path d="M0 200 L50 100 L100 200 Z" class="image" />
    <line x1="50" y1="100" x2="50" y2="0" class="image" />
    <circle cx="50" cy="0" r="10" class="image" />
    <!-- Constitution book -->
    <rect x="120" y="150" width="80" height="50" class="image" />
    <line x1="120" y1="150" x2="200" y2="150" class="image" />
    <line x1="120" y1="175" x2="200" y2="175" class="image" />
    <line x1="120" y1="200" x2="200" y2="200" class="image" />
    <!-- Libertarian -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>