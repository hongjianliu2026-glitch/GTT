<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dusky</text>
  <text x="50" y="120" class="subtitle">[ˈdʌski] adj. 昏暗的，暗淡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dusk (黄昏) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黄昏时分，太阳刚刚落下，天空变得"昏暗(dusk)"，
    <tspan x="50" dy="25">整个世界笼罩在一片"暗淡(dusky)"的光线中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was dusky, with only a faint light coming through the window.
  </text>
  <text x="50" y="310" class="content">
    房间里昏暗，只有微弱的光线透过窗户进来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#87CEEB" />
    <!-- Ground -->
    <rect x="0" y="200" width="350" height="100" class="image" fill="#8B4513" />
    <!-- Dusky effect -->
    <rect x="0" y="0" width="350" height="300" class="image" fill="#000000" opacity="0.3" />
    <!-- Tree -->
    <line x1="200" y1="200" x2="200" y2="100" class="image" />
    <line x1="180" y1="150" x2="220" y2="150" class="image" />
    <line x1="190" y1="120" x2="210" y2="120" class="image" />
  </g>
</svg>