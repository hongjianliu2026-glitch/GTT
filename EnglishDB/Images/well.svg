<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">well</text>
  <text x="50" y="120" class="subtitle">[wɛl] adv. 好，充分地；n. 井</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> well (源自古英语，意为“井”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的村庄，村民们围着一口"井(well)"，
    <tspan x="50" dy="25">井水清澈，村民们生活得很好(well)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is doing well in her studies.
  </text>
  <text x="50" y="310" class="content">
    她在学习上做得很好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Well -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <circle cx="100" cy="100" r="75" class="image" />
    <!-- Water -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="75" y1="100" x2="75" y2="150" class="image" />
    <line x1="125" y1="100" x2="125" y2="150" class="image" />
    <!-- Villagers -->
    <circle cx="30" cy="180" r="15" class="image" />
    <circle cx="80" cy="180" r="15" class="image" />
    <circle cx="130" cy="180" r="15" class="image" />
    <circle cx="180" cy="180" r="15" class="image" />
  </g>
</svg>