<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">apology</text>
  <text x="50" y="120" class="subtitle">[əˈpɑːlədʒi] n. 道歉，谢罪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> apo- (离开) + logy (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为做错了事，"离开(apo-)"
    <tspan x="50" dy="25">原来的位置，走到对方面前，"说(logy)"</tspan>
    <tspan x="50" dy="25">对不起，这就是道歉(apology)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She offered a sincere apology for her mistake.
  </text>
  <text x="50" y="310" class="content">
    她为她的错误真诚地道歉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person moving -->
    <line x1="0" y1="0" x2="150" y2="150" class="image" />
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="120" y2="170" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
    <!-- Speech bubble -->
    <path d="M170,130 Q200,120 230,130 Q240,140 230,150 Q200,160 170,150 Z" class="image" />
    <text x="180" y="145" class="content">"Sorry!"</text>
  </g>
</svg>