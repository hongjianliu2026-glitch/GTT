<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skirt</text>
  <text x="50" y="120" class="subtitle">[skɜːrt] n. 裙子；v. 绕过，回避</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skir (边缘) + t
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女孩穿着一条"边缘(skir)"
    <tspan x="50" dy="25">飘逸的裙子(skirt)，在风中翩翩起舞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a beautiful skirt to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一条漂亮的裙子去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skirt -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" />
    <path d="M50 50 L50 100 L250 100 L250 50 Z" class="image" />
    <!-- Girl -->
    <circle cx="150" cy="120" r="20" class="image" />
    <line x1="150" y1="140" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
    <line x1="150" y1="160" x2="120" y2="150" class="image" />
    <line x1="150" y1="160" x2="180" y2="150" class="image" />
  </g>
</svg>