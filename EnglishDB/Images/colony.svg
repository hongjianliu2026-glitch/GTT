<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">colony</text>
  <text x="50" y="120" class="subtitle">[ˈkɒləni] n. 殖民地，聚居地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (共同) + -ony (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人共同(col-)在一个地方(-ony)建立了一个聚居地，
    <tspan x="50" dy="25">这个聚居地就成为了他们的殖民地(colony)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The British established a colony in India.
  </text>
  <text x="50" y="310" class="content">
    英国在印度建立了一个殖民地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- People -->
    <circle cx="75" cy="100" r="15" class="image" />
    <circle cx="145" cy="100" r="15" class="image" />
    <circle cx="215" cy="100" r="15" class="image" />
    <!-- Roads -->
    <line x1="50" y1="80" x2="240" y2="80" class="image" />
    <line x1="50" y1="120" x2="240" y2="120" class="image" />
  </g>
</svg>