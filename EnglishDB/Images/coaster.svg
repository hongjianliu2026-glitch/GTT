<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coaster</text>
  <text x="50" y="120" class="subtitle">[ˈkoʊstər] n. 杯垫，滑行物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> coast (海岸) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个杯垫(coaster)，它像一艘小船，"滑行(coast)"在桌面上，
    <tspan x="50" dy="25">保护桌面不被热杯烫伤。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She placed a coaster under her coffee mug.
  </text>
  <text x="50" y="310" class="content">
    她在咖啡杯下放了一个杯垫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coaster -->
    <rect x="0" y="0" width="150" height="50" class="image" />
    <!-- Coffee mug -->
    <circle cx="75" cy="25" r="20" class="image" />
    <line x1="75" y1="45" x2="75" y2="70" class="image" />
    <line x1="60" y1="60" x2="90" y2="60" class="image" />
  </g>
</svg>