<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">moody</text>
  <text x="50" y="120" class="subtitle">[ˈmuːdi] adj. 喜怒无常的，情绪化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mood (心情) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"心情(mood)"
    <tspan x="50" dy="25">像天气一样多变，时而阳光明媚，时而乌云密布，</tspan>
    <tspan x="50" dy="25">这就是喜怒无常的(moody)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a moody person, always changing her mind.
  </text>
  <text x="50" y="310" class="content">
    她是个喜怒无常的人，总是改变主意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Sun -->
    <circle cx="50" cy="50" r="20" class="image" />
    <!-- Cloud -->
    <ellipse cx="250" cy="50" rx="30" ry="20" class="image" />
    <!-- Rain drops -->
    <line x1="240" y1="70" x2="240" y2="90" class="image" />
    <line x1="260" y1="70" x2="260" y2="90" class="image" />
    <line x1="280" y1="70" x2="280" y2="90" class="image" />
  </g>
</svg>