<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">through</text>
  <text x="50" y="120" class="subtitle">[θruː] prep. 通过，穿过；adv. 从头到尾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> throu- (穿过) + -gh (表示方向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"穿过(throu-gh)"一个隧道，从一端到另一端，
    <tspan x="50" dy="25">这个过程就是"through"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She walked through the forest to reach the village.
  </text>
  <text x="50" y="310" class="content">
    她穿过森林到达村庄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tunnel -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- Person walking through -->
    <circle cx="70" cy="100" r="15" class="image" />
    <line x1="70" y1="115" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <line x1="70" y1="130" x2="100" y2="120" class="image" />
  </g>
</svg>