<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">auxiliary</text>
  <text x="50" y="120" class="subtitle">[ɔːɡˈzɪliəri] adj. 辅助的，备用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aux- (增加) + -iliary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机器，"增加(aux-)"
    <tspan x="50" dy="25">了一个小助手，这个小助手就是辅助的(auxiliary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The auxiliary generator kicked in during the power outage.
  </text>
  <text x="50" y="310" class="content">
    停电期间，备用发电机启动了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Main machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Small helper -->
    <rect x="50" y="50" width="50" height="100" class="image" />
    <!-- Plus sign -->
    <line x1="120" y1="100" x2="170" y2="100" class="image" />
    <line x1="145" y1="75" x2="145" y2="125" class="image" />
    <!-- Arrow pointing to helper -->
    <line x1="180" y1="100" x2="100" y2="100" class="image" />
    <polygon points="180,100 170,95 170,105" class="image" />
  </g>
</svg>