<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">normal</text>
  <text x="50" y="120" class="subtitle">[ˈnɔːrml] adj. 正常的，标准的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> norm (规则，标准) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个标准的尺子，"按照规则(norm)"
    <tspan x="50" dy="25">测量一切，这就是正常的(normal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His temperature is normal, so he should be fine.
  </text>
  <text x="50" y="310" class="content">
    他的体温正常，所以他应该没事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ruler -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Marks on the ruler -->
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <line x1="100" y1="0" x2="100" y2="50" class="image" />
    <line x1="150" y1="0" x2="150" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <line x1="250" y1="0" x2="250" y2="50" class="image" />
    <line x1="300" y1="0" x2="300" y2="50" class="image" />
    <!-- Normal mark -->
    <line x1="175" y1="0" x2="175" y2="50" class="image" style="stroke: #E74C3C; stroke-width: 4;" />
    <text x="165" y="70" class="content" style="fill: #E74C3C;">Normal</text>
  </g>
</svg>