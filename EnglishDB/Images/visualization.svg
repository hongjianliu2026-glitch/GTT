<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">visualization</text>
  <text x="50" y="120" class="subtitle">[ˌvɪʒuəlaɪˈzeɪʃn] n. 可视化，形象化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vis (看) + -ual (形容词后缀) + -ize (动词后缀) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个数据科学家，通过"看(vis)"
    <tspan x="50" dy="25">的方式将复杂的数据"形象化(visualization)"，</tspan>
    <tspan x="50" dy="25">变成直观的图表，让数据变得易于理解。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The data visualization tool helped us understand the trends easily.
  </text>
  <text x="50" y="310" class="content">
    数据可视化工具帮助我们轻松理解趋势。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="20" class="image" fill="#7F8C8D" />
    <!-- Bar chart -->
    <rect x="20" y="150" width="50" height="100" class="image" />
    <rect x="90" y="100" width="50" height="150" class="image" />
    <rect x="160" y="120" width="50" height="130" class="image" />
    <!-- Axis lines -->
    <line x1="10" y1="250" x2="200" y2="250" class="image" />
    <line x1="10" y1="50" x2="10" y2="250" class="image" />
  </g>
</svg>