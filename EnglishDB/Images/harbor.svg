<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">harbor</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrbər] n. 港口，避风港；v. 庇护，藏匿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> harb (停泊) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在暴风雨中，"停泊(harb)"
    <tspan x="50" dy="25">在一个安全的港口(harbor)，躲避风暴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship sought harbor during the storm.
  </text>
  <text x="50" y="310" class="content">
    船只在风暴中寻找避风港。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Harbor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boat -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="70" x2="100" y2="70" class="image" />
    <line x1="50" y1="20" x2="50" y2="70" class="image" />
    <line x1="100" y1="20" x2="100" y2="70" class="image" />
    <!-- Waves -->
    <line x1="150" y1="40" x2="200" y2="40" class="image" />
    <line x1="150" y1="60" x2="200" y2="60" class="image" />
    <line x1="150" y1="80" x2="200" y2="80" class="image" />
    <!-- Storm clouds -->
    <ellipse cx="250" cy="30" rx="50" ry="20" class="image" />
    <ellipse cx="300" cy="50" rx="50" ry="20" class="image" />
  </g>
</svg>