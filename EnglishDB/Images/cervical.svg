<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cervical</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrvɪkəl] adj. 颈的，子宫颈的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cervix (颈) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只长颈鹿，它的"颈(cervix)"特别长，
    <tspan x="50" dy="25">所以它的颈(cervical)部位非常显眼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor examined her cervical region carefully.
  </text>
  <text x="50" y="310" class="content">
    医生仔细检查了她的颈部区域。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Long neck -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <!-- Head -->
    <circle cx="100" cy="10" r="20" class="image" />
    <!-- Body -->
    <rect x="80" y="180" width="40" height="60" class="image" />
    <!-- Legs -->
    <line x1="80" y1="240" x2="80" y2="300" class="image" />
    <line x1="120" y1="240" x2="120" y2="300" class="image" />
  </g>
</svg>