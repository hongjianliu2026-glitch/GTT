<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">casually</text>
  <text x="50" y="120" class="subtitle">[ˈkæʒuəli] adv. 随便地，不经意地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cas (落下) + -ual (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公园里，"不经意地(casually)"
    <tspan x="50" dy="25">掉落(cas)了一本书，然后继续悠闲地散步。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spoke casually about his plans for the weekend.
  </text>
  <text x="50" y="310" class="content">
    他不经意地谈起了他周末的计划。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Park scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Book -->
    <rect x="100" y="120" width="50" height="30" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <!-- Park bench -->
    <line x1="200" y1="180" x2="300" y2="180" class="image" />
    <line x1="200" y1="180" x2="200" y2="200" class="image" />
    <line x1="300" y1="180" x2="300" y2="200" class="image" />
  </g>
</svg>