<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rallying</text>
  <text x="50" y="120" class="subtitle">[ˈræliɪŋ] v. 召集，集合；n. 集会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rali (召集) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人被"召集(rali)"在一起，
    <tspan x="50" dy="25">形成一个强大的"集合(rallying)"力量，准备迎接挑战。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team's rallying cry boosted their morale.
  </text>
  <text x="50" y="310" class="content">
    队伍的集结口号提升了他们的士气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People gathering -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Lines connecting people -->
    <line x1="50" y1="65" x2="250" y2="65" class="image" />
    <line x1="50" y1="80" x2="250" y2="80" class="image" />
    <line x1="50" y1="95" x2="250" y2="95" class="image" />
    <!-- Rallying point -->
    <circle cx="150" cy="120" r="20" class="image" />
    <text x="140" y="125" class="content" fill="#E74C3C">R</text>
  </g>
</svg>