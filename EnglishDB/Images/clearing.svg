<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clearing</text>
  <text x="50" y="120" class="subtitle">[ˈklɪərɪŋ] n. 空地，清算</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clear (清除) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林中，"清除(clear)"了所有的树木，
    <tspan x="50" dy="25">留下了一片空旷的"空地(clearing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They found a clearing in the forest to set up their tent.
  </text>
  <text x="50" y="310" class="content">
    他们在森林中找到一片空地搭起了帐篷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="300" class="image" />
    <!-- Trees -->
    <line x1="50" y1="200" x2="50" y2="50" class="image" />
    <line x1="100" y1="200" x2="100" y2="70" class="image" />
    <line x1="150" y1="200" x2="150" y2="90" class="image" />
    <line x1="200" y1="200" x2="200" y2="110" class="image" />
    <line x1="250" y1="200" x2="250" y2="130" class="image" />
    <!-- Clearing -->
    <rect x="100" y="150" width="150" height="50" class="image" />
    <!-- Tent -->
    <polygon points="150,200 200,200 175,250" class="image" />
  </g>
</svg>