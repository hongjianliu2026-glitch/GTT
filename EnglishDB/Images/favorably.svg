<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">favorably</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪvərəbli] adv. 有利地，顺利地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> favor (喜爱) + -ably (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面试中，面试官对他微笑并点头，
    <tspan x="50" dy="25">表示对他的表现非常满意，这就是"顺利地(favorably)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company reviewed his application favorably.
  </text>
  <text x="50" y="310" class="content">
    公司对他的申请给予了有利的评价。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Interview scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Interviewer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Smiling face -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <path d="M45 110 Q50 105 55 110" class="image" />
    <!-- Candidate -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Thumbs up -->
    <path d="M240 120 L230 140 L250 140 Z" class="image" />
  </g>
</svg>