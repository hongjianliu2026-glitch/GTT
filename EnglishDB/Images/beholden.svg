<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beholden</text>
  <text x="50" y="120" class="subtitle">[bɪˈhoʊldən] adj. 感激的，负债的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + hold (持有) + -en (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"使持有(be-hold-en)"了一份巨大的恩惠，
    <tspan x="50" dy="25">他感到无比感激，就像背负着一份沉重的债务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I am beholden to you for your help.
  </text>
  <text x="50" y="310" class="content">
    我对你帮助我感到非常感激。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person holding a gift -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="150" class="image" /> <!-- Right arm -->
    <rect x="70" y="140" width="30" height="20" class="image" /> <!-- Gift box -->
    <line x1="85" y1="140" x2="85" y2="160" class="image" /> <!-- Ribbon -->
  </g>
</svg>