<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underdog</text>
  <text x="50" y="120" class="subtitle">[ˈʌndərdɔɡ] n. 弱者，失败者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在下面) + dog (狗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小狗在比赛场上，"在下面(under)"
    <tspan x="50" dy="25">被其他狗压着，但它依然勇敢地战斗，</tspan>
    <tspan x="50" dy="25">最终成为了人们心中的英雄(underdog)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The underdog team surprised everyone by winning the championship.
  </text>
  <text x="50" y="310" class="content">
    弱队出人意料地赢得了冠军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arena -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Underdog -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Other dogs -->
    <circle cx="200" cy="80" r="25" class="image" />
    <line x1="200" y1="105" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="175" y2="180" class="image" />
    <line x1="200" y1="150" x2="225" y2="180" class="image" />
    <line x1="200" y1="130" x2="240" y2="120" class="image" />
    <circle cx="250" cy="120" r="25" class="image" />
    <line x1="250" y1="145" x2="250" y2="190" class="image" />
    <line x1="250" y1="190" x2="225" y2="220" class="image" />
    <line x1="250" y1="190" x2="275" y2="220" class="image" />
    <line x1="250" y1="170" x2="290" y2="160" class="image" />
  </g>
</svg>