<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">survey</text>
  <text x="50" y="120" class="subtitle">[sərˈveɪ] n. 调查，测量；v. 调查，测量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (在上面) + vey (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在高处，"从上面看(sur-vey)"
    <tspan x="50" dy="25">整个区域，进行调查或测量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They conducted a survey to gather public opinion.
  </text>
  <text x="50" y="310" class="content">
    他们进行了一项调查以收集公众意见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person on a hill -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Hill -->
    <path d="M10,150 Q50,100 90,150" class="image" />
    <!-- Area being surveyed -->
    <rect x="100" y="100" width="200" height="100" class="image" />
    <!-- Eye looking down -->
    <circle cx="50" cy="40" r="5" class="image" />
  </g>
</svg>