<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infect</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfekt] v. 感染，传染</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + fect (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个病毒"进入(in-)"人体，"做(fect)"
    <tspan x="50" dy="25">坏事，导致人体被感染(infect)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The virus quickly infected the entire population.
  </text>
  <text x="50" y="310" class="content">
    病毒迅速感染了整个群体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Virus -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="40" y1="90" x2="60" y2="110" class="image" />
    <line x1="40" y1="110" x2="60" y2="90" class="image" />
    <!-- Human body -->
    <rect x="100" y="80" width="100" height="140" class="image" />
    <circle cx="150" cy="60" r="20" class="image" />
    <!-- Arrow -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <polygon points="130,90 140,100 130,110" class="image" />
  </g>
</svg>