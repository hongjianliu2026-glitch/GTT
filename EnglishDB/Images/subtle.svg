<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subtle</text>
  <text x="50" y="120" class="subtitle">[ˈsʌtl] adj. 微妙的，精细的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + -tle (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在画布上，"在下面(sub-)"
    <tspan x="50" dy="25">轻轻地(tle)添加几笔，这些细微的改动</tspan>
    <tspan x="50" dy="25">使得整幅画变得微妙而精细(subtle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The subtle changes in color made the painting more vibrant.
  </text>
  <text x="50" y="310" class="content">
    颜色的微妙变化使画作更加生动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canvas -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Brush -->
    <line x1="20" y1="115" x2="70" y2="80" class="image" />
    <circle cx="70" cy="80" r="5" class="image" />
    <!-- Subtle changes -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="100" y1="140" x2="150" y2="140" class="image" />
  </g>
</svg>