<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resulting</text>
  <text x="50" y="120" class="subtitle">[rɪˈzʌltɪŋ] adj. 作为结果的，因而发生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + sult (跳)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个弹簧，"跳回(re-sult)"到原来的位置，
    <tspan x="50" dy="25">这个动作的结果(resulting)就是弹簧恢复了原状。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The resulting explosion was heard miles away.
  </text>
  <text x="50" y="310" class="content">
    爆炸的结果在几英里外都能听到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spring -->
    <path d="M50 50 Q75 100 100 50 Q125 0 150 50 Q175 100 200 50" class="image" />
    <!-- Arrow -->
    <line x1="200" y1="50" x2="250" y2="50" class="image" />
    <polygon points="250,40 260,50 250,60" class="image" />
    <!-- Result -->
    <circle cx="300" cy="50" r="20" class="image" />
    <text x="290" y="55" class="content">结果</text>
  </g>
</svg>