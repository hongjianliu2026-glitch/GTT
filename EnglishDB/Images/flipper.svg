<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flipper</text>
  <text x="50" y="120" class="subtitle">[ˈflɪpər] n. 鳍状肢，鳍状物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flip (翻转) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只海豚在海中翻转，它的"翻转(flip)"
    <tspan x="50" dy="25">动作是由它的鳍状肢(flipper)完成的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dolphin used its flippers to swim gracefully.
  </text>
  <text x="50" y="310" class="content">
    海豚用它的鳍状肢优雅地游泳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dolphin body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Flippers -->
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <line x1="250" y1="100" x2="300" y2="150" class="image" />
    <!-- Tail -->
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="100" y2="250" class="image" />
    <line x1="150" y1="200" x2="200" y2="250" class="image" />
  </g>
</svg>