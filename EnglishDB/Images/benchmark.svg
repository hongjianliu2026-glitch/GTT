<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">benchmark</text>
  <text x="50" y="120" class="subtitle">[ˈbɛntʃˌmɑrk] n. 基准，标准</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bench (长凳) + mark (标记)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的木匠，在长凳(bench)上刻下标记(mark)，
    <tspan x="50" dy="25">作为测量工具的标准(benchmark)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new software was tested against industry benchmarks.
  </text>
  <text x="50" y="310" class="content">
    这款新软件是根据行业标准进行测试的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bench -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Mark -->
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <line x1="100" y1="0" x2="100" y2="50" class="image" />
    <line x1="150" y1="0" x2="150" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
    <line x1="250" y1="0" x2="250" y2="50" class="image" />
    <line x1="300" y1="0" x2="300" y2="50" class="image" />
    <!-- Carpenter -->
    <circle cx="20" cy="70" r="15" class="image" />
    <line x1="20" y1="85" x2="20" y2="120" class="image" />
    <line x1="20" y1="120" x2="0" y2="150" class="image" />
    <line x1="20" y1="120" x2="40" y2="150" class="image" />
    <line x1="20" y1="100" x2="50" y2="90" class="image" />
  </g>
</svg>