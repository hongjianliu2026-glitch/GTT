<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interweave</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈwiːv] v. 交织，混杂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + weave (编织)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两根绳子在空中"交织(inter-weave)"，
    <tspan x="50" dy="25">它们互相缠绕，形成了一个复杂的结构。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist interweaved different colors to create a unique pattern.
  </text>
  <text x="50" y="310" class="content">
    艺术家将不同的颜色交织在一起，创造出独特的图案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rope 1 -->
    <path d="M0 0 Q50 50 100 0" class="image" />
    <path d="M0 20 Q50 70 100 20" class="image" />
    <path d="M0 40 Q50 90 100 40" class="image" />
    <!-- Rope 2 -->
    <path d="M0 10 Q50 -30 100 10" class="image" />
    <path d="M0 30 Q50 -10 100 30" class="image" />
    <path d="M0 50 Q50 10 100 50" class="image" />
  </g>
</svg>