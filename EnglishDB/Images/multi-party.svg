<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">multi-party</text>
  <text x="50" y="120" class="subtitle">[ˈmʌlti ˈpɑːrti] adj. 多方的，多党的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> multi- (多) + party (党派)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的会议桌，"多(multi)"个"党派(party)"的代表围坐在一起，
    <tspan x="50" dy="25">讨论着共同的事务，这就是多方(multi-party)会议的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The agreement was reached through a multi-party negotiation.
  </text>
  <text x="50" y="310" class="content">
    该协议是通过多方谈判达成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chairs -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="350" cy="100" r="15" class="image" />
    <!-- People -->
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="350" y1="115" x2="350" y2="150" class="image" />
    <!-- Arms -->
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="350" y1="150" x2="330" y2="180" class="image" />
    <!-- Legs -->
    <line x1="50" y1="150" x2="50" y2="180" class="image" />
    <line x1="150" y1="150" x2="150" y2="180" class="image" />
    <line x1="250" y1="150" x2="250" y2="180" class="image" />
    <line x1="350" y1="150" x2="350" y2="180" class="image" />
  </g>
</svg>