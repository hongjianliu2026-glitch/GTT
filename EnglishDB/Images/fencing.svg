<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fencing</text>
  <text x="50" y="120" class="subtitle">[ˈfɛnsɪŋ] n. 击剑，围栏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fence (围栏) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个击剑手在赛场上，"围栏(fence)"
    <tspan x="50" dy="25">中挥舞着剑，这就是击剑(fencing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He practices fencing every weekend.
  </text>
  <text x="50" y="310" class="content">
    他每个周末都练习击剑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fencing arena -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fencing swords -->
    <line x1="50" y1="50" x2="100" y2="150" class="image" />
    <line x1="100" y1="50" x2="150" y2="150" class="image" />
    <!-- Fencing mask -->
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Fencing jacket -->
    <rect x="70" y="120" width="60" height="60" class="image" />
    <!-- Fencing glove -->
    <rect x="120" y="120" width="30" height="30" class="image" />
  </g>
</svg>