<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beta</text>
  <text x="50" y="120" class="subtitle">[ˈbiːtə] n. 测试版，第二位</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> beta (希腊字母β，表示第二)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个软件开发者在发布正式版之前，先发布一个"第二位(beta)"
    <tspan x="50" dy="25">的测试版，让用户测试并反馈问题。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beta version of the app has some bugs.
  </text>
  <text x="50" y="310" class="content">
    这个应用的测试版有一些漏洞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beta symbol -->
    <path d="M 0 0 L 100 0 L 100 200 L 0 200 Z" class="image" />
    <path d="M 50 0 L 50 200" class="image" />
    <!-- Developer -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="200" y2="120" class="image" />
    <!-- Computer screen -->
    <rect x="220" y="20" width="250" height="160" class="image" />
    <!-- Beta version text -->
    <text x="240" y="100" class="content" fill="#A93226">Beta Version</text>
  </g>
</svg>