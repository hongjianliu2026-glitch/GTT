<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">demolish</text>
  <text x="50" y="120" class="subtitle">[dɪˈmɒlɪʃ] v. 拆除，毁坏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + mol (建筑) + -ish (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的挖掘机，"向下拆除(de-mol-ish)"
    <tspan x="50" dy="25">一座老旧的建筑，瞬间将其夷为平地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old bridge was demolished to make way for a new one.
  </text>
  <text x="50" y="310" class="content">
    为了给新桥让路，旧桥被拆除了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <rect x="40" y="40" width="70" height="120" class="image" />
    <!-- Demolition -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="180" y1="70" x2="220" y2="70" class="image" />
    <line x1="180" y1="130" x2="220" y2="130" class="image" />
    <!-- Excavator -->
    <rect x="250" y="150" width="100" height="50" class="image" />
    <line x1="270" y1="150" x2="270" y2="100" class="image" />
    <line x1="270" y1="100" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="300" y2="150" class="image" />
  </g>
</svg>