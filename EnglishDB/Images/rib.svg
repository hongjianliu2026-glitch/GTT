<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rib</text>
  <text x="50" y="120" class="subtitle">[rɪb] n. 肋骨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 ribbe, 与古英语 ribb 相关
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的肋骨从天而降，"咔嚓"一声插入地面，
    <tspan x="50" dy="25">形成了一道坚固的屏障，保护着内部的柔软。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He broke a rib in the accident.
  </text>
  <text x="50" y="310" class="content">
    他在事故中断了一根肋骨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ribs -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="50" y1="80" x2="350" y2="80" class="image" />
    <line x1="50" y1="110" x2="350" y2="110" class="image" />
    <line x1="50" y1="140" x2="350" y2="140" class="image" />
    <line x1="50" y1="170" x2="350" y2="170" class="image" />
    <!-- Ground -->
    <line x1="50" y1="200" x2="350" y2="200" class="image" />
    <!-- Rib falling -->
    <line x1="200" y1="0" x2="200" y2="50" class="image" />
  </g>
</svg>