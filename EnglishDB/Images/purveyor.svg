<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">purveyor</text>
  <text x="50" y="120" class="subtitle">[pərˈveɪ.ər] n. 供应商，承办商</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pur- (向前) + vey (道路) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个供应商推着满载货物的小车，"向前(pur-)"
    <tspan x="50" dy="25">沿着道路(vey)，为顾客提供各种商品，这就是供应商(purveyor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The restaurant's purveyor of fresh produce is local.
  </text>
  <text x="50" y="310" class="content">
    这家餐厅的新鲜农产品供应商是本地的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cart -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Goods -->
    <rect x="20" y="20" width="60" height="60" class="image" />
    <rect x="100" y="20" width="60" height="60" class="image" />
    <rect x="180" y="20" width="60" height="60" class="image" />
    <!-- Supplier -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="140" y2="180" class="image" />
    <!-- Road -->
    <line x1="0" y1="280" x2="300" y2="280" class="image" />
    <line x1="0" y1="300" x2="300" y2="300" class="image" />
  </g>
</svg>