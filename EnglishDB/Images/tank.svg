<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tank</text>
  <text x="50" y="120" class="subtitle">[tæŋk] n. 坦克，水箱；v. 把...储于槽中</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tank (源自德语 "Tank"，意为容器)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金属容器，"坦克(tank)"
    <tspan x="50" dy="25">在战场上轰隆隆地前进，装满了水和燃料，</tspan>
    <tspan x="50" dy="25">准备随时发动攻击。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The army deployed several tanks to the front line.
  </text>
  <text x="50" y="310" class="content">
    军队在前线部署了几辆坦克。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tank body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Tank tracks -->
    <rect x="20" y="150" width="310" height="20" class="image" />
    <rect x="20" y="170" width="310" height="20" class="image" />
    <!-- Tank turret -->
    <rect x="150" y="0" width="50" height="50" class="image" />
    <!-- Tank gun -->
    <line x1="175" y1="50" x2="175" y2="100" class="image" />
  </g>
</svg>