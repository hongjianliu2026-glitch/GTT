<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suburban</text>
  <text x="50" y="120" class="subtitle">[səˈbɜːrbən] adj. 郊区的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在...下面) + urb (城市) + -an (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市(urb)的边缘，"在城市下面(sub-)"
    <tspan x="50" dy="25">的地方，就是郊区(suburban)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They moved to a suburban neighborhood last year.
  </text>
  <text x="50" y="310" class="content">
    他们去年搬到了一个郊区社区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="20" width="50" height="150" class="image" />
    <rect x="190" y="20" width="50" height="120" class="image" />
    <rect x="260" y="20" width="50" height="80" class="image" />
    <!-- Suburban house -->
    <rect x="100" y="150" width="100" height="50" class="image" />
    <line x1="100" y1="150" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="200" y2="150" class="image" />
    <!-- Lawn -->
    <rect x="90" y="200" width="120" height="10" class="image" />
  </g>
</svg>