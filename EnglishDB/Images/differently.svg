<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">differently</text>
  <text x="50" y="120" class="subtitle">[ˈdɪfrəntli] adv. 不同地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> differ (不同) + -ent (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在争论，"不同地(differently)"
    <tspan x="50" dy="25">表达他们的观点，就像两条不同的道路，</tspan>
    <tspan x="50" dy="25">各自通往不同的目的地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They solved the problem differently.
  </text>
  <text x="50" y="310" class="content">
    他们用不同的方法解决了问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two paths -->
    <path d="M0 0 L150 150" class="image" />
    <path d="M0 150 L150 0" class="image" />
    <!-- Arrows -->
    <polygon points="150,150 140,140 140,160" class="image" />
    <polygon points="150,0 140,10 140,-10" class="image" />
    <!-- People -->
    <circle cx="20" cy="20" r="15" class="image" />
    <circle cx="20" cy="130" r="15" class="image" />
    <line x1="20" y1="35" x2="20" y2="70" class="image" />
    <line x1="20" y1="145" x2="20" y2="180" class="image" />
    <line x1="20" y1="70" x2="0" y2="100" class="image" />
    <line x1="20" y1="70" x2="40" y2="100" class="image" />
    <line x1="20" y1="180" x2="0" y2="210" class="image" />
    <line x1="20" y1="180" x2="40" y2="210" class="image" />
  </g>
</svg>