<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clover</text>
  <text x="50" y="120" class="subtitle">[ˈkloʊvər] n. 三叶草</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clov- (三叶草)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片绿色的草地上，"三叶草(clover)"
    <tspan x="50" dy="25">在阳光下闪闪发光，每片叶子都象征着幸运。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a four-leaf clover in the meadow.
  </text>
  <text x="50" y="310" class="content">
    她在草地上找到了一片四叶草。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clover leaves -->
    <circle cx="50" cy="50" r="30" class="leaf" />
    <circle cx="100" cy="50" r="30" class="leaf" />
    <circle cx="75" cy="100" r="30" class="leaf" />
    <!-- Stem -->
    <line x1="75" y1="130" x2="75" y2="180" class="image" />
  </g>
</svg>