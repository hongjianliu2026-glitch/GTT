<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrack</text>
  <text x="50" y="120" class="subtitle">[ræk] n. 破坏，残骸；v. 破坏，毁坏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wr- (扭曲) + ack (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船在大海中被"扭曲(wr-)"得支离破碎，
    <tspan x="50" dy="25">最终变成了一堆残骸(wrack)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm left the beach covered in wrack.
  </text>
  <text x="50" y="310" class="content">
    风暴过后，海滩上布满了残骸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <line x1="50" y1="20" x2="50" y2="170" class="image" />
    <line x1="300" y1="20" x2="300" y2="170" class="image" />
    <!-- Waves -->
    <path d="M50,20 Q100,100 150,20 T300,20" class="image" />
    <path d="M50,50 Q100,130 150,50 T300,50" class="image" />
    <path d="M50,80 Q100,160 150,80 T300,80" class="image" />
    <path d="M50,110 Q100,190 150,110 T300,110" class="image" />
    <path d="M50,140 Q100,220 150,140 T300,140" class="image" />
    <path d="M50,170 Q100,250 150,170 T300,170" class="image" />
  </g>
</svg>