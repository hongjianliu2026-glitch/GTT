<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disparate</text>
  <text x="50" y="120" class="subtitle">[ˈdɪspərət] adj. 完全不同的，异类的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + par (平等) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，"分开(dis-)"成两个"不平等(par)"的物体，
    <tspan x="50" dy="25">它们之间没有任何共同点，完全不同(disparate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two groups are so disparate that they have nothing in common.
  </text>
  <text x="50" y="310" class="content">
    这两个群体如此不同，以至于他们没有任何共同点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First object -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Second object -->
    <rect x="150" y="70" width="60" height="60" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="100" x2="140" y2="100" class="image" />
    <polygon points="140,90 150,100 140,110" class="image" />
    <!-- Text -->
    <text x="100" y="150" class="content" text-anchor="middle">完全不同</text>
  </g>
</svg>