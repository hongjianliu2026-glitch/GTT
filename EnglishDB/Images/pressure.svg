<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pressure</text>
  <text x="50" y="120" class="subtitle">[ˈprɛʃər] n. 压力，压迫；v. 对…施加压力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> press (压) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手指"压(press)"在一块脆弱的玻璃上，
    <tspan x="50" dy="25">玻璃开始出现裂痕，这就是"压力(pressure)"的直观体现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pressure of work made him feel exhausted.
  </text>
  <text x="50" y="310" class="content">
    工作的压力让他感到筋疲力尽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Finger pressing on glass -->
    <circle cx="150" cy="100" r="50" class="image" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="100" y2="300" class="image" />
    <line x1="150" y1="250" x2="200" y2="300" class="image" />
    <line x1="150" y1="200" x2="250" y2="180" class="image" />
    <!-- Glass -->
    <rect x="50" y="50" width="200" height="100" class="image" />
    <line x1="70" y1="70" x2="230" y2="70" class="image" />
    <line x1="70" y1="90" x2="230" y2="90" class="image" />
    <line x1="70" y1="110" x2="230" y2="110" class="image" />
    <line x1="70" y1="130" x2="230" y2="130" class="image" />
    <!-- Cracks on glass -->
    <line x1="100" y1="50" x2="150" y2="150" class="image" />
    <line x1="150" y1="50" x2="200" y2="150" class="image" />
  </g>
</svg>