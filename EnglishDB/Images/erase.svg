<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">erase</text>
  <text x="50" y="120" class="subtitle">[ɪˈreɪs] v. 擦除，抹去</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + ras (刮)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的橡皮擦，"刮出(e-ras)"
    <tspan x="50" dy="25">所有的痕迹，就像抹去(erase)黑板上的字迹一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He erased the mistake from the whiteboard.
  </text>
  <text x="50" y="310" class="content">
    他把白板上的错误擦掉了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eraser -->
    <rect x="0" y="0" width="150" height="50" class="image" />
    <!-- Lines to be erased -->
    <line x1="20" y1="70" x2="130" y2="70" class="image" />
    <line x1="20" y1="90" x2="130" y2="90" class="image" />
    <line x1="20" y1="110" x2="130" y2="110" class="image" />
    <!-- Erase action -->
    <line x1="100" y1="50" x2="100" y2="110" class="image" />
    <line x1="100" y1="50" x2="130" y2="70" class="image" />
    <line x1="100" y1="50" x2="130" y2="90" class="image" />
    <line x1="100" y1="50" x2="130" y2="110" class="image" />
  </g>
</svg>