<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shred</text>
  <text x="50" y="120" class="subtitle">[ʃred] v. 撕碎，切碎；n. 碎片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shred (撕碎)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的手在撕碎一张纸，纸片像雪花一样飘落，
    <tspan x="50" dy="25">这就是“撕碎(shred)”的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She shredded the confidential documents before throwing them away.
  </text>
  <text x="50" y="310" class="content">
    她在扔掉之前撕碎了机密文件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="170" x2="100" y2="160" class="image" />

    <!-- Paper -->
    <rect x="120" y="80" width="150" height="100" class="image" />
    <line x1="130" y1="90" x2="260" y2="90" class="image" />
    <line x1="130" y1="120" x2="240" y2="120" class="image" />
    <line x1="130" y1="150" x2="250" y2="150" class="image" />

    <!-- Shredded pieces -->
    <line x1="140" y1="100" x2="160" y2="140" class="image" />
    <line x1="150" y1="110" x2="170" y2="150" class="image" />
    <line x1="160" y1="120" x2="180" y2="160" class="image" />
    <line x1="170" y1="130" x2="190" y2="170" class="image" />
  </g>
</svg>