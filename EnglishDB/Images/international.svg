<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">international</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈnæʃənl] adj. 国际的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + nation (国家) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，上面插满了各国的小旗子，
    <tspan x="50" dy="25">象征着各国之间的交流与合作，这就是"国际的(international)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The United Nations is an international organization.
  </text>
  <text x="50" y="310" class="content">
    联合国是一个国际组织。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Flags -->
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <rect x="90" y="40" width="20" height="30" class="image" />
    <line x1="250" y1="20" x2="250" y2="40" class="image" />
    <rect x="240" y="40" width="20" height="30" class="image" />
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
    <rect x="165" y="200" width="20" height="30" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <rect x="90" y="200" width="20" height="30" class="image" />
    <line x1="250" y1="180" x2="250" y2="200" class="image" />
    <rect x="240" y="200" width="20" height="30" class="image" />
  </g>
</svg>