<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">familial</text>
  <text x="50" y="120" class="subtitle">[fəˈmɪliəl] adj. 家庭的，家族的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> familia (家庭) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大家庭围坐在餐桌旁，"家庭(familia)"
    <tspan x="50" dy="25">的温暖和亲密感让人感到无比的"家族的(familial)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The familial bond between them is very strong.
  </text>
  <text x="50" y="310" class="content">
    他们之间的家族纽带非常牢固。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Family members -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Arms -->
    <line x1="50" y1="115" x2="70" y2="130" class="image" />
    <line x1="70" y1="130" x2="50" y2="145" class="image" />
    <line x1="100" y1="115" x2="120" y2="130" class="image" />
    <line x1="120" y1="130" x2="100" y2="145" class="image" />
    <line x1="150" y1="115" x2="170" y2="130" class="image" />
    <line x1="170" y1="130" x2="150" y2="145" class="image" />
    <line x1="200" y1="115" x2="220" y2="130" class="image" />
    <line x1="220" y1="130" x2="200" y2="145" class="image" />
    <line x1="250" y1="115" x2="270" y2="130" class="image" />
    <line x1="270" y1="130" x2="250" y2="145" class="image" />
  </g>
</svg>