<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">panda</text>
  <text x="50" y="120" class="subtitle">[ˈpændə] n. 熊猫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自藏语 "panda"，意为“竹林中的熊”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只熊猫在竹林中悠闲地吃着竹子，
    <tspan x="50" dy="25">它的黑白相间的毛色和圆滚滚的身体让人一眼就能认出它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The panda is a symbol of conservation efforts in China.
  </text>
  <text x="50" y="310" class="content">
    熊猫是中国保护工作的象征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Panda body -->
    <circle cx="100" cy="100" r="50" class="image" fill="#000" />
    <circle cx="100" cy="70" r="30" class="image" fill="#FFF" />
    <!-- Panda ears -->
    <circle cx="70" cy="50" r="15" class="image" fill="#000" />
    <circle cx="130" cy="50" r="15" class="image" fill="#000" />
    <!-- Panda eyes -->
    <circle cx="85" cy="65" r="5" class="image" fill="#000" />
    <circle cx="115" cy="65" r="5" class="image" fill="#000" />
    <!-- Panda mouth -->
    <line x1="95" y1="85" x2="105" y2="85" class="image" />
    <!-- Bamboo -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="60" y1="150" x2="60" y2="50" class="image" />
    <line x1="70" y1="150" x2="70" y2="50" class="image" />
  </g>
</svg>