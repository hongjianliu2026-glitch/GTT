<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">topsoil</text>
  <text x="50" y="120" class="subtitle">[ˈtɒpˌsɔɪl] n. 表土，表层土</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> top (顶部) + soil (土壤)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片肥沃的土地，"顶部(top)"覆盖着一层
    <tspan x="50" dy="25">富含养分的"土壤(soil)"，这就是表土(topsoil)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer carefully preserved the topsoil during the construction.
  </text>
  <text x="50" y="310" class="content">
    农民在施工期间仔细保护了表土。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soil layer -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Topsoil layer -->
    <rect x="50" y="20" width="250" height="60" class="image" fill="#8B4513" />
    <!-- Ground layer -->
    <rect x="50" y="80" width="250" height="100" class="image" fill="#A0522D" />
    <!-- Plants -->
    <line x1="70" y1="40" x2="70" y2="20" class="image" />
    <line x1="90" y1="40" x2="90" y2="20" class="image" />
    <line x1="110" y1="40" x2="110" y2="20" class="image" />
    <line x1="130" y1="40" x2="130" y2="20" class="image" />
    <line x1="150" y1="40" x2="150" y2="20" class="image" />
    <line x1="170" y1="40" x2="170" y2="20" class="image" />
    <line x1="190" y1="40" x2="190" y2="20" class="image" />
    <line x1="210" y1="40" x2="210" y2="20" class="image" />
    <line x1="230" y1="40" x2="230" y2="20" class="image" />
    <line x1="250" y1="40" x2="250" y2="20" class="image" />
  </g>
</svg>