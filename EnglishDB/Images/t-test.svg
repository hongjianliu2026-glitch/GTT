<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">t-test</text>
  <text x="50" y="120" class="subtitle">[tiː test] n. 学生t检验</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> t (代表学生) + test (测试)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在考试中，"学生(t)"
    <tspan x="50" dy="25">通过一系列测试(test)来检验自己的知识。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The t-test was used to compare the means of two groups.
  </text>
  <text x="50" y="310" class="content">
    学生t检验被用来比较两组的平均值。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Student -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Test paper -->
    <rect x="100" y="80" width="200" height="150" class="image" />
    <line x1="120" y1="100" x2="280" y2="100" class="image" />
    <line x1="120" y1="130" x2="250" y2="130" class="image" />
    <line x1="120" y1="160" x2="270" y2="160" class="image" />
    <line x1="120" y1="190" x2="240" y2="190" class="image" />
  </g>
</svg>