<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">torque</text>
  <text x="50" y="120" class="subtitle">[tɔːrk] n. 扭矩，转矩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> torqu (扭曲) + -e (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的扳手在拧紧螺丝，"扭曲(torqu)"的力量
    <tspan x="50" dy="25">产生了强大的"扭矩(torque)"，让机器运转起来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car's engine delivers high torque at low speeds.
  </text>
  <text x="50" y="310" class="content">
    这辆车的发动机在低速时能提供高扭矩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wrench -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="200" y2="50" class="image" />
    <line x1="250" y1="100" x2="200" y2="150" class="image" />
    <!-- Nut -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Bolt -->
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="80" x2="30" y2="90" class="image" />
    <line x1="50" y1="80" x2="70" y2="90" class="image" />
    <line x1="50" y1="120" x2="30" y2="110" class="image" />
    <line x1="50" y1="120" x2="70" y2="110" class="image" />
  </g>
</svg>