<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">health-related</text>
  <text x="50" y="120" class="subtitle">[ˌhelθ rɪˈleɪtɪd] adj. 与健康相关的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> health (健康) + related (相关的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在检查一个巨大的心脏，这个心脏代表"健康(health)"，
    <tspan x="50" dy="25">而医生正在研究与心脏相关的"问题(related)"，这就是与健康相关(health-related)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Regular exercise is a health-related activity.
  </text>
  <text x="50" y="310" class="content">
    定期锻炼是一项与健康相关的活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart -->
    <path d="M50,50 C50,50 100,0 150,50 C200,100 150,150 100,150 C50,150 0,100 50,50 Z" class="image" fill="#E74C3C" />
    <!-- Doctor -->
    <circle cx="100" cy="100" r="15" class="image" fill="#2C3E50" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Stethoscope -->
    <line x1="100" y1="115" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="100" y2="130" class="image" />
  </g>
</svg>