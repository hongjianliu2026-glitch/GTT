<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unintentional</text>
  <text x="50" y="120" class="subtitle">[ˌʌnɪnˈtenʃənl] adj. 无意的，非故意的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + intentional (故意的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路时，不小心踩到了一只猫的尾巴，
    <tspan x="50" dy="25">他立刻举起双手表示"不是故意的(un-intentional)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His unintentional remark hurt her feelings.
  </text>
  <text x="50" y="310" class="content">
    他无意中说的话伤害了她的感情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Cat -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Tail -->
    <path d="M215,100 C230,80 250,80 265,100" class="image" />
    <!-- Footprint -->
    <path d="M100,180 C110,170 120,170 130,180" class="image" />
    <path d="M105,190 C115,180 125,180 135,190" class="image" />
    <!-- Hands up -->
    <line x1="50" y1="120" x2="30" y2="100" class="image" />
    <line x1="50" y1="120" x2="70" y2="100" class="image" />
  </g>
</svg>