<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .liquid { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liquid</text>
  <text x="50" y="120" class="subtitle">[ˈlɪkwɪd] n. 液体；adj. 液体的，流动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liqu (液体) + -id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水滴，"液体(liqu)"
    <tspan x="50" dy="25">在空中自由流动，形成了一个流动的(liquid)世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Water is a common liquid that we use every day.
  </text>
  <text x="50" y="310" class="content">
    水是我们每天使用的常见液体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Liquid drop -->
    <ellipse cx="175" cy="100" rx="100" ry="70" class="liquid" />
    <!-- Ripples -->
    <ellipse cx="175" cy="100" rx="120" ry="80" class="image" />
    <ellipse cx="175" cy="100" rx="140" ry="90" class="image" />
    <ellipse cx="175" cy="100" rx="160" ry="100" class="image" />
  </g>
</svg>