<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slink</text>
  <text x="50" y="120" class="subtitle">[slɪŋk] v. 偷偷溜走，鬼鬼祟祟地移动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sl- (滑) + ink (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫在夜晚"滑行(sl-)"，"悄悄地走(ink)"，
    <tspan x="50" dy="25">它鬼鬼祟祟地移动，就像在偷偷溜走(slink)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thief slinked away in the dark.
  </text>
  <text x="50" y="310" class="content">
    小偷在黑暗中偷偷溜走了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Back leg -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Front leg -->
    <line x1="50" y1="130" x2="30" y2="140" class="image" /> <!-- Tail -->
    <line x1="30" y1="140" x2="20" y2="160" class="image" /> <!-- Tail -->
    <line x1="20" y1="160" x2="10" y2="180" class="image" /> <!-- Tail -->
    <line x1="10" y1="180" x2="0" y2="200" class="image" /> <!-- Tail -->
    <!-- Moon -->
    <circle cx="200" cy="50" r="30" class="image" />
    <!-- Stars -->
    <circle cx="250" cy="30" r="5" class="image" />
    <circle cx="270" cy="60" r="5" class="image" />
    <circle cx="230" cy="70" r="5" class="image" />
  </g>
</svg>