<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slim</text>
  <text x="50" y="120" class="subtitle">[slɪm] adj. 苗条的，纤细的；v. 减肥，变苗条</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sli- (滑，细) + m (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个苗条的人，像"滑溜溜的(sli-)"
    <tspan x="50" dy="25">细线一样，轻盈地走过，这就是slim(苗条)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to slim down for the summer.
  </text>
  <text x="50" y="310" class="content">
    她决定在夏天来临前减肥。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Slim person -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="200" class="image" />
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <circle cx="50" cy="40" r="15" class="image" />
    <!-- Slim line -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="120" class="image" />
    <line x1="250" y1="100" x2="250" y2="120" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <text x="180" y="140" class="content">滑溜溜的细线</text>
  </g>
</svg>