<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undocumented</text>
  <text x="50" y="120" class="subtitle">[ˌʌnˈdɑːkjuməntɪd] adj. 无文件记录的，未记录的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + document (文件) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的代码块，"没有文件记录(un-documented)"，
    <tspan x="50" dy="25">就像一个隐藏的宝藏，等待被发现和记录。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The undocumented features of the software were discovered by the team.
  </text>
  <text x="50" y="310" class="content">
    团队发现了软件中未记录的功能。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hidden code block -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Question mark -->
    <text x="175" y="100" font-size="100" fill="#7F8C8D">?</text>
    <!-- Hidden treasure -->
    <rect x="150" y="120" width="50" height="50" class="image" />
    <line x1="150" y1="120" x2="200" y2="170" class="image" />
    <line x1="200" y1="170" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="200" y2="120" class="image" />
  </g>
</svg>