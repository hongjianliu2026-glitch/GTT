<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">innocently</text>
  <text x="50" y="120" class="subtitle">[ˈɪnəsntli] adv. 无辜地，天真地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (无) + noc (伤害) + -ent (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在玩耍，"无伤害(in-noc-ent)"
    <tspan x="50" dy="25">地笑着，表现出天真无邪的样子(innocently)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She smiled innocently at the camera.
  </text>
  <text x="50" y="310" class="content">
    她对着镜头天真地笑了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <!-- Smile -->
    <path d="M30 90 Q50 80 70 90" class="image" />
    <!-- Innocence -->
    <circle cx="40" cy="80" r="5" class="image" />
    <circle cx="60" cy="80" r="5" class="image" />
  </g>
</svg>