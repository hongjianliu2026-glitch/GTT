<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gridlock</text>
  <text x="50" y="120" class="subtitle">[ˈɡrɪdlɒk] n. 交通大堵塞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grid (网格) + lock (锁住)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市的交通网络像一个巨大的网格(grid)，
    <tspan x="50" dy="25">所有的车辆都被锁住(lock)，动弹不得，</tspan>
    <tspan x="50" dy="25">这就是交通大堵塞(gridlock)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city was in a gridlock due to the heavy snow.
  </text>
  <text x="50" y="310" class="content">
    由于大雪，城市陷入了交通大堵塞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grid -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="20" y1="50" x2="320" y2="50" class="image" />
    <line x1="20" y1="100" x2="320" y2="100" class="image" />
    <line x1="20" y1="150" x2="320" y2="150" class="image" />

    <!-- Cars -->
    <rect x="60" y="30" width="30" height="20" class="image" />
    <rect x="110" y="30" width="30" height="20" class="image" />
    <rect x="160" y="30" width="30" height="20" class="image" />
    <rect x="210" y="30" width="30" height="20" class="image" />
    <rect x="260" y="30" width="30" height="20" class="image" />
    <rect x="60" y="80" width="30" height="20" class="image" />
    <rect x="110" y="80" width="30" height="20" class="image" />
    <rect x="160" y="80" width="30" height="20" class="image" />
    <rect x="210" y="80" width="30" height="20" class="image" />
    <rect x="260" y="80" width="30" height="20" class="image" />
    <rect x="60" y="130" width="30" height="20" class="image" />
    <rect x="110" y="130" width="30" height="20" class="image" />
    <rect x="160" y="130" width="30" height="20" class="image" />
    <rect x="210" y="130" width="30" height="20" class="image" />
    <rect x="260" y="130" width="30" height="20" class="image" />
  </g>
</svg>