<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preference</text>
  <text x="50" y="120" class="subtitle">[ˈprɛfərəns] n. 偏爱，优先选择</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + fer (拿) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在众多选项中，"提前拿(pre-fer)"
    <tspan x="50" dy="25">出他最喜欢的那个，这就是他的偏爱(preference)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a preference for chocolate over vanilla.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢巧克力而不是香草。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Options -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <rect x="120" y="0" width="100" height="100" class="image" />
    <rect x="240" y="0" width="100" height="100" class="image" />
    <!-- Selected preference -->
    <rect x="120" y="0" width="100" height="100" class="image" fill="#FFD700" />
    <!-- Hand pointing -->
    <line x1="170" y1="120" x2="170" y2="200" class="image" />
    <line x1="170" y1="200" x2="150" y2="180" class="image" />
    <line x1="170" y1="200" x2="190" y2="180" class="image" />
  </g>
</svg>