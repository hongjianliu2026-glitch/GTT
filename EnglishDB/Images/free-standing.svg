<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">free-standing</text>
  <text x="50" y="120" class="subtitle">[ˌfriːˈstændɪŋ] adj. 独立的，不依靠支撑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> free (自由的) + stand (站立) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的雕塑，"自由地站立(free-standing)"
    <tspan x="50" dy="25">在广场中央，没有任何支撑，显得格外独立和壮观。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The free-standing sculpture in the park is a masterpiece.
  </text>
  <text x="50" y="310" class="content">
    公园里那座独立的雕塑是一件杰作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Sculpture -->
    <line x1="175" y1="180" x2="175" y2="20" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="160" y1="40" x2="190" y2="40" class="image" />
    <line x1="175" y1="20" x2="175" y2="40" class="image" />
  </g>
</svg>