<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pouch</text>
  <text x="50" y="120" class="subtitle">[paʊtʃ] n. 小袋，袋状物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pou (袋子) + ch (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只袋鼠妈妈，它的肚子上有一个"小袋子(pouch)"，
    <tspan x="50" dy="25">里面装着它的宝宝，这个袋子就是袋鼠的标志性特征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carried her phone in a small pouch.
  </text>
  <text x="50" y="310" class="content">
    她把手机放在一个小袋子里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pouch -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Kangaroo -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Baby kangaroo -->
    <circle cx="100" cy="70" r="20" class="image" />
    <!-- Pouch opening -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
  </g>
</svg>