<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">multi-ethnic</text>
  <text x="50" y="120" class="subtitle">[ˌmʌltiˈɛθnɪk] adj. 多民族的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> multi- (多) + ethnic (民族的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市广场上，"多种(multi)"
    <tspan x="50" dy="25">不同民族(ethnic)的人们和谐共处，</tspan>
    <tspan x="50" dy="25">形成了一个多民族的社区(multi-ethnic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The school is known for its multi-ethnic student body.
  </text>
  <text x="50" y="310" class="content">
    这所学校以其多民族的学生群体而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City square -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Ethnic symbols -->
    <rect x="50" y="80" width="20" height="20" class="image" />
    <rect x="100" y="80" width="20" height="20" class="image" />
    <rect x="150" y="80" width="20" height="20" class="image" />
    <rect x="200" y="80" width="20" height="20" class="image" />
    <rect x="250" y="80" width="20" height="20" class="image" />
    <!-- Harmony -->
    <line x1="50" y1="120" x2="250" y2="120" class="image" />
    <line x1="50" y1="130" x2="250" y2="130" class="image" />
    <line x1="50" y1="140" x2="250" y2="140" class="image" />
  </g>
</svg>