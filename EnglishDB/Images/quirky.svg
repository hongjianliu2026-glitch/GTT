<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quirky</text>
  <text x="50" y="120" class="subtitle">[ˈkwɜːrki] adj. 古怪的，离奇的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quirk (怪癖) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着奇装异服的人，"怪癖(quirk)"
    <tspan x="50" dy="25">的行为让人忍俊不禁，这就是quirky(古怪的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His quirky sense of humor always makes us laugh.
  </text>
  <text x="50" y="310" class="content">
    他古怪的幽默感总是让我们发笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Quirky person -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Right leg -->
    <!-- Quirky outfit -->
    <rect x="20" y="120" width="60" height="30" class="image" /> <!-- Shirt -->
    <rect x="30" y="150" width="40" height="50" class="image" /> <!-- Pants -->
    <line x1="50" y1="120" x2="50" y2="150" class="image" /> <!-- Belt -->
    <!-- Quirky expression -->
    <circle cx="40" cy="90" r="5" class="image" /> <!-- Left eye -->
    <circle cx="60" cy="90" r="5" class="image" /> <!-- Right eye -->
    <line x1="40" y1="110" x2="60" y2="110" class="image" /> <!-- Mouth -->
  </g>
</svg>