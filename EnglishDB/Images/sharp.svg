      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sharp</text>
  <text x="50" y="120" class="subtitle">[ʃɑːrp] adj. 锋利的，尖锐的；adv. 急剧地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shar (切割) + p (强调)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的刀，"切割(shar)"
    <tspan x="50" dy="25">一切物体，它的边缘非常尖锐(sharp)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Be careful with that sharp knife.
  </text>
  <text x="50" y="310" class="content">
    小心那把锋利的刀。
  </text>

