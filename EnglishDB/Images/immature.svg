<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">immature</text>
  <text x="50" y="120" class="subtitle">[ˌɪməˈtʃʊr] adj. 不成熟的，未完全发展的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + mature (成熟的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩在玩泥巴，"不成熟(im-mature)"
    <tspan x="50" dy="25">的行为让人忍俊不禁，这就是immature的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His immature behavior made everyone laugh.
  </text>
  <text x="50" y="310" class="content">
    他那不成熟的行为让大家笑了起来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child playing with mud -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Right leg -->
    <rect x="20" y="200" width="60" height="20" class="image" /> <!-- Mud -->
  </g>
</svg>