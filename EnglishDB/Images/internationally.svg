<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">internationally</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈnæʃənəli] adv. 国际性地，在国际间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + nation (国家) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，上面插满了各国国旗，象征着"在国家之间(inter-nation-ally)"
    <tspan x="50" dy="25">的交流与合作，这就是国际性的(internationally)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event was broadcast internationally.
  </text>
  <text x="50" y="310" class="content">
    这个活动在国际上进行了转播。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Flags -->
    <rect x="100" y="20" width="30" height="50" class="image" />
    <rect x="250" y="20" width="30" height="50" class="image" />
    <rect x="50" y="150" width="30" height="50" class="image" />
    <rect x="300" y="150" width="30" height="50" class="image" />
    <!-- Lines connecting flags -->
    <line x1="115" y1="70" x2="265" y2="70" class="image" />
    <line x1="65" y1="200" x2="315" y2="200" class="image" />
    <line x1="115" y1="70" x2="65" y2="200" class="image" />
    <line x1="265" y1="70" x2="315" y2="200" class="image" />
  </g>
</svg>