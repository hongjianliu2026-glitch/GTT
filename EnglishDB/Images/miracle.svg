<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">miracle</text>
  <text x="50" y="120" class="subtitle">[ˈmɪrəkl] n. 奇迹，不可思议的事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mir (看) + -acle (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通人抬头"看(mir)"到天空中出现了一道彩虹，
    <tspan x="50" dy="25">这道彩虹就是"奇迹(miracle)"，因为它让人感到不可思议。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor said her recovery was a miracle.
  </text>
  <text x="50" y="310" class="content">
    医生说她的康复是一个奇迹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person looking up -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <line x1="50" y1="90" x2="20" y2="80" class="image" />

    <!-- Rainbow -->
    <path d="M100,100 C150,50 250,50 300,100" class="image" />
    <path d="M100,110 C150,60 250,60 300,110" class="image" />
    <path d="M100,120 C150,70 250,70 300,120" class="image" />
    <path d="M100,130 C150,80 250,80 300,130" class="image" />
    <path d="M100,140 C150,90 250,90 300,140" class="image" />
    <path d="M100,150 C150,100 250,100 300,150" class="image" />
  </g>
</svg>