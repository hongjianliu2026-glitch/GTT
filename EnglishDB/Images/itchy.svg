<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">itchy</text>
  <text x="50" y="120" class="subtitle">[ˈɪtʃi] adj. 痒的，渴望的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> it (痒) + -chy (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫不停地挠痒痒，"痒(it)"得它
    <tspan x="50" dy="25">不停地抓，这就是"痒的(itchy)"感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wool sweater made her skin itchy.
  </text>
  <text x="50" y="310" class="content">
    羊毛衫让她的皮肤感到痒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Tail -->
    <line x1="50" y1="180" x2="80" y2="200" class="image" /> <!-- Tail -->
    <!-- Itching -->
    <line x1="50" y1="130" x2="50" y2="120" class="image" /> <!-- Scratching -->
    <line x1="50" y1="120" x2="40" y2="110" class="image" /> <!-- Scratching -->
    <line x1="50" y1="120" x2="60" y2="110" class="image" /> <!-- Scratching -->
  </g>
</svg>