<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">breakfast</text>
  <text x="50" y="120" class="subtitle">[ˈbrekfəst] n. 早餐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> break (打破) + fast (禁食)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在早晨"打破(break)"了"禁食(fast)"的状态，
    <tspan x="50" dy="25">开始享用早餐(breakfast)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always has a healthy breakfast before work.
  </text>
  <text x="50" y="310" class="content">
    她总是在上班前吃一顿健康的早餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food items -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Egg -->
    <rect x="100" y="80" width="40" height="40" class="image" /> <!-- Toast -->
    <rect x="160" y="80" width="40" height="40" class="image" /> <!-- Bacon -->
    <rect x="220" y="80" width="40" height="40" class="image" /> <!-- Cereal -->
    <!-- Person -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>