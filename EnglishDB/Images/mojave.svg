<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Mojave</text>
  <text x="50" y="120" class="subtitle">[məˈhɑːvi] n. 莫哈韦沙漠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自美洲原住民语言，意为“广阔的沙漠”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的沙漠，阳光炙热，沙丘连绵，
    <tspan x="50" dy="25">这就是莫哈韦沙漠(Mojave)，一个充满神秘与荒凉的地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Mojave Desert is known for its extreme temperatures.
  </text>
  <text x="50" y="310" class="content">
    莫哈韦沙漠以其极端的温度而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#FFD700" />
    <!-- Sand dunes -->
    <path d="M0 200 Q50 150 100 200 T200 200" stroke="#D2B48C" stroke-width="30" fill="none" />
    <path d="M0 220 Q50 170 100 220 T200 220" stroke="#D2B48C" stroke-width="30" fill="none" />
    <path d="M0 240 Q50 190 100 240 T200 240" stroke="#D2B48C" stroke-width="30" fill="none" />
  </g>
</svg>