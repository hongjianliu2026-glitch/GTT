<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overestimate</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈɛstɪˌmeɪt] v. 高估</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (过度) + estimate (估计)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的天平上，"过度估计(over-estimate)"
    <tspan x="50" dy="25">自己的体重，结果天平倾斜，他差点摔倒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He overestimated his abilities and failed the exam.
  </text>
  <text x="50" y="310" class="content">
    他高估了自己的能力，结果考试不及格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <line x1="50" y1="180" x2="350" y2="180" class="image" />
    <!-- Person on the scale -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="200" class="image" />
    <line x1="100" y1="160" x2="120" y2="200" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />
    <!-- Tipping scale -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" transform="rotate(10, 50, 20)" />
    <line x1="50" y1="180" x2="350" y2="180" class="image" transform="rotate(10, 50, 180)" />
  </g>
</svg>