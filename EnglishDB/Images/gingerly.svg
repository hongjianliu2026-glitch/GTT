<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gingerly</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɪndʒərli] adv. 小心翼翼地，谨慎地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ginger (姜) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一块姜，"小心翼翼地(gingerly)"
    <tspan x="50" dy="25">生怕姜汁溅出来，这种谨慎的态度就是gingerly。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She picked up the glass gingerly, afraid it might break.
  </text>
  <text x="50" y="310" class="content">
    她小心翼翼地拿起玻璃杯，生怕它会碎掉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Ginger -->
    <rect x="70" y="90" width="30" height="60" class="image" />
    <line x1="85" y1="90" x2="85" y2="30" class="image" />
    <line x1="70" y1="100" x2="100" y2="100" class="image" />
    <line x1="70" y1="120" x2="100" y2="120" class="image" />
    <line x1="70" y1="140" x2="100" y2="140" class="image" />
    <line x1="70" y1="160" x2="100" y2="160" class="image" />
  </g>
</svg>