<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undue</text>
  <text x="50" y="120" class="subtitle">[ʌnˈdjuː] adj. 不适当的，过度的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + due (适当的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图"不适当(un-due)"地举起一个巨大的石头，
    <tspan x="50" dy="25">结果石头压在他身上，这就是"过度的(undue)"力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was criticized for giving undue attention to his appearance.
  </text>
  <text x="50" y="310" class="content">
    他因过度关注自己的外表而受到批评。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant stone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person struggling -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Arrow pointing to the stone -->
    <line x1="200" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="140" y2="60" class="image" />
    <line x1="150" y1="50" x2="160" y2="60" class="image" />
  </g>
</svg>