<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">full-fledged</text>
  <text x="50" y="120" class="subtitle">[ˌfʊlˈfledʒd] adj. 成熟的，完全发展的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> full (完全) + fledge (羽毛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟，"完全长出羽毛(full-fledged)"，
    <tspan x="50" dy="25">准备展翅高飞，象征着成熟和完全发展。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After years of training, he became a full-fledged pilot.
  </text>
  <text x="50" y="310" class="content">
    经过多年的训练，他成为了一名成熟的飞行员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird with full feathers -->
    <circle cx="100" cy="100" r="50" class="image" /> <!-- Head -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" /> <!-- Body -->
    <line x1="100" y1="200" x2="50" y2="150" class="image" /> <!-- Left wing -->
    <line x1="100" y1="200" x2="150" y2="150" class="image" /> <!-- Right wing -->
    <line x1="100" y1="250" x2="50" y2="300" class="image" /> <!-- Left leg -->
    <line x1="100" y1="250" x2="150" y2="300" class="image" /> <!-- Right leg -->
    <!-- Feathers -->
    <polyline points="100,150 70,200 130,200 100,150" class="image" />
    <polyline points="100,170 60,220 140,220 100,170" class="image" />
    <polyline points="100,190 50,240 150,240 100,190" class="image" />
  </g>
</svg>