<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">digitally</text>
  <text x="50" y="120" class="subtitle">[ˈdɪdʒɪtəli] adv. 数字地，用数字方式</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> digit (数字) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字屏幕，上面滚动着无数的数字，
    <tspan x="50" dy="25">这些数字就像瀑布一样倾泻而下，这就是"数字地(digitally)"的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She pays her bills digitally every month.
  </text>
  <text x="50" y="310" class="content">
    她每个月都用数字方式支付账单。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Digital screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Digital numbers -->
    <text x="50" y="50" class="image" font-size="30" fill="#3498DB">10101010</text>
    <text x="50" y="100" class="image" font-size="30" fill="#3498DB">01010101</text>
    <text x="50" y="150" class="image" font-size="30" fill="#3498DB">11110000</text>
    <text x="50" y="200" class="image" font-size="30" fill="#3498DB">00001111</text>
  </g>
</svg>