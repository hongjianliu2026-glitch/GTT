<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">judgmental</text>
  <text x="50" y="120" class="subtitle">[dʒʌdʒˈmɛntl] adj. 判断的，审判的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> judge (判断) + mental (心理的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在法庭上，手持天平，"判断(judge)"
    <tspan x="50" dy="25">他人的行为，这种心理状态就是判断的(judgmental)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is very judgmental about others' choices.
  </text>
  <text x="50" y="310" class="content">
    她对别人的选择非常判断。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Scale -->
    <line x1="150" y1="80" x2="250" y2="80" class="image" />
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="250" y1="80" x2="250" y2="120" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <!-- Weight -->
    <rect x="160" y="90" width="20" height="30" class="image" />
    <rect x="220" y="90" width="20" height="30" class="image" />
  </g>
</svg>