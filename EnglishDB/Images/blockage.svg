<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blockage</text>
  <text x="50" y="120" class="subtitle">[ˈblɒkɪdʒ] n. 堵塞，障碍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> block (块) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条道路被巨大的"块(block)"堵住，
    <tspan x="50" dy="25">车辆无法通行，这就是"堵塞(blockage)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The blockage in the pipe caused the water to overflow.
  </text>
  <text x="50" y="310" class="content">
    管道中的堵塞导致水溢出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Blockage -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <!-- Car -->
    <rect x="50" y="120" width="80" height="40" class="image" />
    <rect x="60" y="130" width="20" height="20" class="image" />
    <rect x="100" y="130" width="20" height="20" class="image" />
    <!-- Car wheels -->
    <circle cx="70" cy="160" r="10" class="image" />
    <circle cx="110" cy="160" r="10" class="image" />
  </g>
</svg>