<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recipe</text>
  <text x="50" y="120" class="subtitle">[ˈresəpi] n. 食谱，配方</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再) + cipe (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"再次拿起(re-cipe)"
    <tspan x="50" dy="25">食谱，按照上面的步骤做出美味佳肴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She followed the recipe to make a cake.
  </text>
  <text x="50" y="310" class="content">
    她按照食谱做了一个蛋糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Recipe book -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Ingredients -->
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="120" cy="50" r="10" class="image" />
    <circle cx="160" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <!-- Cooking pot -->
    <rect x="100" y="100" width="150" height="80" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="180" x2="250" y2="180" class="image" />
    <line x1="100" y1="100" x2="100" y2="180" class="image" />
    <line x1="250" y1="100" x2="250" y2="180" class="image" />
  </g>
</svg>