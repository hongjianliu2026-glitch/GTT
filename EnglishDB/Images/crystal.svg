<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .crystal { fill: #66CCFF; stroke: #336699; stroke-width: 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crystal</text>
  <text x="50" y="120" class="subtitle">[ˈkrɪstl] n. 水晶，结晶体；adj. 水晶的，透明的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crys- (晶体) + -tal (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水晶球，"晶体(cryst-)"
    <tspan x="50" dy="25">在阳光下闪闪发光，仿佛能看透一切(crystal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chandelier was adorned with sparkling crystals.
  </text>
  <text x="50" y="310" class="content">
    吊灯上装饰着闪闪发光的水晶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crystal ball -->
    <circle cx="100" cy="100" r="80" class="crystal" />
    <!-- Sunlight rays -->
    <line x1="100" y1="20" x2="100" y2="50" class="image" />
    <line x1="70" y1="30" x2="100" y2="50" class="image" />
    <line x1="130" y1="30" x2="100" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="150" y1="50" x2="100" y2="50" class="image" />
    <line x1="30" y1="70" x2="100" y2="50" class="image" />
    <line x1="170" y1="70" x2="100" y2="50" class="image" />
  </g>
</svg>