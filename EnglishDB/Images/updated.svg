<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">updated</text>
  <text x="50" y="120" class="subtitle">[ʌpˈdeɪtɪd] adj. 最新的，更新的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + date (日期)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个日历，"向上更新(up-date)"
    <tspan x="50" dy="25">日期，使其保持最新状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The software has been updated to the latest version.
  </text>
  <text x="50" y="310" class="content">
    该软件已更新至最新版本。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Dates -->
    <text x="70" y="50" class="content">1</text>
    <text x="120" y="50" class="content">2</text>
    <text x="170" y="50" class="content">3</text>
    <text x="220" y="50" class="content">4</text>
    <text x="270" y="50" class="content">5</text>
    <text x="70" y="80" class="content">6</text>
    <text x="120" y="80" class="content">7</text>
    <text x="170" y="80" class="content">8</text>
    <text x="220" y="80" class="content">9</text>
    <text x="270" y="80" class="content">10</text>
    <!-- Arrow -->
    <line x1="170" y1="110" x2="170" y2="140" class="image" />
    <polygon points="170,140 160,130 180,130" class="image" />
    <!-- Updated date -->
    <text x="170" y="160" class="content">11</text>
  </g>
</svg>