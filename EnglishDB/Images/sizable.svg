<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sizable</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪzəbl] adj. 相当大的，可观的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> size (大小) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕，"大小(size)"
    <tspan x="50" dy="25">足以让人惊叹，这就是"相当大的(sizable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company made a sizable profit last quarter.
  </text>
  <text x="50" y="310" class="content">
    公司上个季度获得了可观的利润。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large cake -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="100" cy="100" r="70" class="image" />
    <circle cx="100" cy="100" r="60" class="image" />
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="40" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Candle -->
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <circle cx="100" cy="20" r="5" class="image" />
  </g>
</svg>