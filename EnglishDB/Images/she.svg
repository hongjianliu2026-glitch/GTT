<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">she</text>
  <text x="50" y="120" class="subtitle">[ʃiː] pron. 她</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 无明显词根，为代词
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个优雅的女士(she)，她穿着华丽的裙子，
    <tspan x="50" dy="25">优雅地走在街上，成为众人瞩目的焦点。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a talented musician.
  </text>
  <text x="50" y="310" class="content">
    她是一位有才华的音乐家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Elegant lady -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="80" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="100" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <!-- Dress -->
    <path d="M50,150 Q80,130 50,110 Q20,130 50,150" class="image" />
  </g>
</svg>