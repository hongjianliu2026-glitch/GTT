<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chef</text>
  <text x="50" y="120" class="subtitle">[ʃɛf] n. 厨师，主厨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chef (源自法语，意为“头”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师戴着高高的帽子，"头(chef)"
    <tspan x="50" dy="25">在厨房里指挥着一切，他就是主厨(chef)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef prepared a delicious meal for the guests.
  </text>
  <text x="50" y="310" class="content">
    主厨为客人们准备了一顿美味的饭菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef's hat -->
    <rect x="50" y="20" width="150" height="50" class="image" />
    <!-- Chef's face -->
    <circle cx="125" cy="80" r="30" class="image" />
    <!-- Chef's body -->
    <line x1="125" y1="110" x2="125" y2="200" class="image" />
    <!-- Chef's arms -->
    <line x1="125" y1="130" x2="75" y2="160" class="image" />
    <line x1="125" y1="130" x2="175" y2="160" class="image" />
    <!-- Chef's legs -->
    <line x1="125" y1="200" x2="100" y2="250" class="image" />
    <line x1="125" y1="200" x2="150" y2="250" class="image" />
    <!-- Chef's knife -->
    <line x1="75" y1="160" x2="50" y2="140" class="image" />
    <line x1="50" y1="140" x2="40" y2="160" class="image" />
  </g>
</svg>