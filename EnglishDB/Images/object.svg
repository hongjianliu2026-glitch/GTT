<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">object</text>
  <text x="50" y="120" class="subtitle">[ˈɒbdʒɪkt] n. 物体，对象；v. 反对</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (朝向) + ject (投掷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的物体从天而降，"朝向(ob-)"地面"投掷(ject)"，
    <tspan x="50" dy="25">这个物体就是我们要研究的对象(object)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She pointed at the object on the table.
  </text>
  <text x="50" y="310" class="content">
    她指着桌子上的物体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Falling object -->
    <rect x="150" y="0" width="100" height="100" class="image" />
    <line x1="200" y1="100" x2="200" y2="200" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="400" y2="200" class="image" />
    <!-- Table -->
    <rect x="50" y="220" width="300" height="50" class="image" />
    <!-- Object on table -->
    <rect x="150" y="230" width="100" height="30" class="image" />
  </g>
</svg>