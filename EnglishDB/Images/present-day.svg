<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">present-day</text>
  <text x="50" y="120" class="subtitle">[ˈprɛzənt deɪ] adj. 当今的，现代的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> present (现在的) + day (日子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟指针指向"现在(present)"，
    <tspan x="50" dy="25">而太阳正高挂在"日子(day)"的天空中，</tspan>
    <tspan x="50" dy="25">这就是"当今的(present-day)"画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The present-day technology is rapidly advancing.
  </text>
  <text x="50" y="310" class="content">
    当今的技术正在迅速发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="100" x2="130" y2="100" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="100" r="40" class="image" fill="#F1C40F" />
    <line x1="250" y1="60" x2="250" y2="20" class="image" />
    <line x1="270" y1="80" x2="290" y2="60" class="image" />
    <line x1="270" y1="120" x2="290" y2="140" class="image" />
    <line x1="250" y1="140" x2="250" y2="180" class="image" />
    <line x1="230" y1="120" x2="210" y2="140" class="image" />
    <line x1="230" y1="80" x2="210" y2="60" class="image" />
  </g>
</svg>