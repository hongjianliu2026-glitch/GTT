<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spiky</text>
  <text x="50" y="120" class="subtitle">[ˈspaɪki] adj. 多刺的，尖锐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spi (刺) + -ky (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只刺猬，全身都是"刺(spi)"，
    <tspan x="50" dy="25">看起来非常"尖锐(spiky)"，让人不敢靠近。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hedgehog's back was covered with spiky quills.
  </text>
  <text x="50" y="310" class="content">
    刺猬的背上覆盖着尖锐的刺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hedgehog body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Spikes -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="40" y1="70" x2="160" y2="70" class="image" />
    <line x1="30" y1="90" x2="170" y2="90" class="image" />
    <line x1="20" y1="110" x2="180" y2="110" class="image" />
    <line x1="10" y1="130" x2="190" y2="130" class="image" />
    <line x1="0" y1="150" x2="200" y2="150" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
  </g>
</svg>