<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">attitude</text>
  <text x="50" y="120" class="subtitle">[ˈætɪˌtjuːd] n. 态度，看法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> atti- (朝向) + -tude (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的箭头前，箭头指向不同的方向，
    <tspan x="50" dy="25">象征着他对不同事物的不同态度(attitude)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her positive attitude towards challenges helped her succeed.
  </text>
  <text x="50" y="310" class="content">
    她对挑战的积极态度帮助她取得了成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />

    <!-- Arrow -->
    <line x1="100" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
    <text x="150" y="90" class="content" text-anchor="middle">Positive</text>

    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <polygon points="200,150 190,140 190,160" class="image" />
    <text x="150" y="140" class="content" text-anchor="middle">Neutral</text>

    <line x1="100" y1="200" x2="200" y2="200" class="image" />
    <polygon points="200,200 190,190 190,210" class="image" />
    <text x="150" y="190" class="content" text-anchor="middle">Negative</text>
  </g>
</svg>