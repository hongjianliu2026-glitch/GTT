<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">personable</text>
  <text x="50" y="120" class="subtitle">[ˈpɜːrsənəbl] adj. 风度翩翩的，有魅力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> person (人) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在舞台上，"能够吸引(person-able)"
    <tspan x="50" dy="25">所有人的目光，他就是风度翩翩的(personable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a personable young man who easily makes friends.
  </text>
  <text x="50" y="310" class="content">
    他是一个风度翩翩的年轻人，很容易交到朋友。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on stage -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="170" class="image" />
    <line x1="175" y1="150" x2="205" y2="170" class="image" />
    <line x1="175" y1="180" x2="155" y2="200" class="image" />
    <line x1="175" y1="180" x2="195" y2="200" class="image" />
    <!-- Spotlight -->
    <ellipse cx="175" cy="50" rx="50" ry="20" class="image" />
    <!-- Audience -->
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <circle cx="300" cy="150" r="10" class="image" />
  </g>
</svg>