<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stellar</text>
  <text x="50" y="120" class="subtitle">[ˈstɛlər] adj. 星的，星球的；杰出的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stell (星) + -ar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的星星(stell)在天空中闪耀，
    <tspan x="50" dy="25">它的光芒如此耀眼，以至于人们都称它为"星的(stellar)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a stellar performance in the play.
  </text>
  <text x="50" y="310" class="content">
    她在剧中的表演非常出色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <polygon points="100,10 40,198 190,78 10,78 160,198" class="image" fill="#FFD700" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#1E90FF" />
    <!-- Moon -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F0E68C" />
  </g>
</svg>