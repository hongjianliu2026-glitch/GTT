<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">merge</text>
  <text x="50" y="120" class="subtitle">[mɜːrdʒ] v. 合并，融合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> merg (沉没) + -e (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两条河流"沉没(merg)"在一起，
    <tspan x="50" dy="25">形成一条更宽广的河流，这就是合并(merge)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two companies decided to merge to increase their market share.
  </text>
  <text x="50" y="310" class="content">
    两家公司决定合并以增加市场份额。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River 1 -->
    <path d="M0 100 Q50 50 100 100 L200 100" class="image" />
    <!-- River 2 -->
    <path d="M0 150 Q50 200 100 150 L200 150" class="image" />
    <!-- Merged River -->
    <path d="M200 100 Q250 125 300 100 L400 100" class="image" />
    <!-- Merging point -->
    <circle cx="200" cy="125" r="10" class="image" fill="#E74C3C" />
    <!-- Arrow -->
    <path d="M200 125 L250 125" class="image" />
    <polygon points="250,120 260,125 250,130" class="image" fill="#E74C3C" />
  </g>
</svg>