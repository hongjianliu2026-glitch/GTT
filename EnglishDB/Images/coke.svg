<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coke</text>
  <text x="50" y="120" class="subtitle">[koʊk] n. 焦炭，可口可乐；v. 炼焦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自荷兰语 "kool" (煤)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的煤块被"炼焦(coke)"成焦炭，
    <tspan x="50" dy="25">同时，一瓶可口可乐(coke)在旁边冒着气泡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He prefers drinking coke over other soft drinks.
  </text>
  <text x="50" y="310" class="content">
    他更喜欢喝可乐而不是其他软饮料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coke can -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="30" class="image" />
    <!-- Bubbles -->
    <circle cx="30" cy="180" r="10" class="image" />
    <circle cx="70" cy="160" r="10" class="image" />
    <circle cx="50" cy="140" r="10" class="image" />
    <!-- Coal -->
    <rect x="150" y="0" width="200" height="200" class="image" />
    <!-- Coke -->
    <rect x="200" y="50" width="100" height="150" class="image" />
  </g>
</svg>