<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abnormality</text>
  <text x="50" y="120" class="subtitle">[ˌæbnɔrˈmæləti] n. 异常，反常</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (远离) + norm (标准) + -ality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色箭头，"远离(ab-)"
    <tspan x="50" dy="25">标准(norm)，指向一个奇怪的生物，</tspan>
    <tspan x="50" dy="25">这就是异常(abnormality)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor found several abnormalities in the patient's blood test.
  </text>
  <text x="50" y="310" class="content">
    医生在患者的血液检查中发现了几处异常。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red arrow -->
    <line x1="0" y1="0" x2="200" y2="100" class="image" stroke="#C0392B" stroke-width="5" />
    <polygon points="200,100 180,90 180,110" class="image" stroke="#C0392B" fill="#C0392B" />
    <!-- Strange creature -->
    <circle cx="250" cy="100" r="30" class="image" stroke="#2C3E50" fill="#2C3E50" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" stroke="#2C3E50" />
    <line x1="250" y1="180" x2="220" y2="220" class="image" stroke="#2C3E50" />
    <line x1="250" y1="180" x2="280" y2="220" class="image" stroke="#2C3E50" />
    <line x1="250" y1="150" x2="200" y2="140" class="image" stroke="#2C3E50" />
    <line x1="250" y1="150" x2="300" y2="140" class="image" stroke="#2C3E50" />
  </g>
</svg>