<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">satisfied</text>
  <text x="50" y="120" class="subtitle">[ˈsætɪsfaɪd] adj. 满意的，满足的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> satis- (足够) + -fy (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人吃饱了，"足够(satis)"
    <tspan x="50" dy="25">并且感到"使(fy)满意"，这就是satisfied。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was satisfied with her new job.
  </text>
  <text x="50" y="310" class="content">
    她对她的新工作感到满意。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="150" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Smiley face -->
    <circle cx="275" cy="100" r="30" class="image" />
    <line x1="260" y1="90" x2="270" y2="90" class="image" />
    <line x1="280" y1="90" x2="290" y2="90" class="image" />
    <path d="M260 110 Q275 130 290 110" class="image" />
  </g>
</svg>