<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">binoculars</text>
  <text x="50" y="120" class="subtitle">[baɪˈnɑːkjələrz] n. 双筒望远镜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bino- (双) + -cular (眼睛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着"双筒望远镜(binoculars)"，
    <tspan x="50" dy="25">两只眼睛(bino-)通过望远镜看到远处的景象，</tspan>
    <tspan x="50" dy="25">仿佛置身于一个放大镜下的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used binoculars to watch the birds in the distance.
  </text>
  <text x="50" y="310" class="content">
    他用双筒望远镜观察远处的鸟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Binoculars -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <rect x="50" y="20" width="250" height="60" class="image" />
    <circle cx="70" cy="50" r="15" class="image" />
    <circle cx="280" cy="50" r="15" class="image" />
    <!-- Eyes -->
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
    <!-- Lines connecting eyes to binoculars -->
    <line x1="100" y1="170" x2="70" y2="70" class="image" />
    <line x1="250" y1="170" x2="280" y2="70" class="image" />
  </g>
</svg>