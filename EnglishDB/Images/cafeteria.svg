<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cafeteria</text>
  <text x="50" y="120" class="subtitle">[ˌkæfəˈtɪriə] n. 自助餐厅</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cafe (咖啡) + teria (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满咖啡香气的场所，"咖啡(cafe)的场所(teria)"
    <tspan x="50" dy="25">里，人们自助选择食物，这就是自助餐厅(cafeteria)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had lunch at the school cafeteria.
  </text>
  <text x="50" y="310" class="content">
    我们在学校的自助餐厅吃了午饭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cafeteria counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food trays -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="170" y="20" width="100" height="160" class="image" />
    <rect x="290" y="20" width="100" height="160" class="image" />
    <!-- Coffee cup -->
    <circle cx="20" cy="180" r="15" class="image" />
    <line x1="20" y1="195" x2="20" y2="200" class="image" />
    <!-- People -->
    <circle cx="80" cy="180" r="15" class="image" />
    <circle cx="200" cy="180" r="15" class="image" />
    <circle cx="320" cy="180" r="15" class="image" />
  </g>
</svg>