<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alleviate</text>
  <text x="50" y="120" class="subtitle">[əˈliːvieɪt] v. 减轻，缓解</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (加强) + levi (轻) + ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人背着重重的包袱，突然有人给他递上一杯"减轻(al-levi-ate)"
    <tspan x="50" dy="25">负担的药水，他立刻感到轻松了许多。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The medicine helped to alleviate her pain.
  </text>
  <text x="50" y="310" class="content">
    这种药帮助她减轻了疼痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heavy backpack -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="100" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Medicine bottle -->
    <rect x="200" y="20" width="50" height="100" class="image" />
    <line x1="225" y1="120" x2="225" y2="150" class="image" />
    <!-- Relief expression -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="90" y1="110" x2="110" y2="110" class="image" />
    <line x1="95" y1="120" x2="105" y2="120" class="image" />
  </g>
</svg>