<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Pulitzer</text>
  <text x="50" y="120" class="subtitle">[ˈpʊlɪtsər] n. 普利策奖（美国新闻界最高荣誉）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 以约瑟夫·普利策（Joseph Pulitzer）命名
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新闻记者，手持一支笔，"书写(write)"
    <tspan x="50" dy="25">出震撼人心的报道，最终赢得普利策奖(Pulitzer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She won a Pulitzer Prize for her investigative journalism.
  </text>
  <text x="50" y="310" class="content">
    她因调查性新闻报道而获得普利策奖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Newspaper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Pen -->
    <line x1="30" y1="100" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="90" y2="80" class="image" />
    <line x1="100" y1="100" x2="90" y2="120" class="image" />
    <!-- Award -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
  </g>
</svg>