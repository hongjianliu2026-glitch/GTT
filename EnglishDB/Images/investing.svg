<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">investing</text>
  <text x="50" y="120" class="subtitle">[ɪnˈvestɪŋ] v. 投资</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + vest (衣服)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把金币"穿进(in-vest)"一件衣服里，
    <tspan x="50" dy="25">这件衣服变成了他的"投资(investing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He decided to start investing in the stock market.
  </text>
  <text x="50" y="310" class="content">
    他决定开始投资股市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coin -->
    <circle cx="50" cy="100" r="20" class="image" fill="#FFD700" />
    <text x="45" y="105" class="content" fill="#000">💰</text>
    <!-- Vest -->
    <rect x="80" y="80" width="150" height="100" class="image" fill="#A0C5E8" />
    <line x1="100" y1="80" x2="100" y2="180" class="image" />
    <line x1="200" y1="80" x2="200" y2="180" class="image" />
    <!-- Person -->
    <circle cx="150" cy="220" r="20" class="image" fill="#7F8C8D" />
    <line x1="150" y1="240" x2="150" y2="280" class="image" />
    <line x1="150" y1="280" x2="130" y2="310" class="image" />
    <line x1="150" y1="280" x2="170" y2="310" class="image" />
    <line x1="150" y1="260" x2="120" y2="250" class="image" />
    <line x1="150" y1="260" x2="180" y2="250" class="image" />
  </g>
</svg>