<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">allot</text>
  <text x="50" y="120" class="subtitle">[əˈlɒt] v. 分配，分派</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (to) + lot (portion)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个管理者在分配任务，"把(al-)"
    <tspan x="50" dy="25">每个部分(lot)分派给不同的人，这就是分配(allot)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager allotted different tasks to each team member.
  </text>
  <text x="50" y="310" class="content">
    经理将不同的任务分配给每个团队成员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Manager -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />

    <!-- Tasks -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <rect x="170" y="20" width="100" height="50" class="image" />
    <rect x="290" y="20" width="100" height="50" class="image" />

    <!-- Arrows -->
    <line x1="20" y1="150" x2="100" y2="45" class="image" />
    <line x1="20" y1="150" x2="220" y2="45" class="image" />
    <line x1="20" y1="150" x2="340" y2="45" class="image" />
    <polygon points="100,45 90,35 110,35" class="image" />
    <polygon points="220,45 210,35 230,35" class="image" />
    <polygon points="340,45 330,35 350,35" class="image" />
  </g>
</svg>