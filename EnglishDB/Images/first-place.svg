<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">first-place</text>
  <text x="50" y="120" class="subtitle">[ˈfɜːrst pleɪs] n. 第一名，冠军</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> first (第一) + place (位置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员在比赛中，"第一个到达(first)"
    <tspan x="50" dy="25">终点线，占据了第一名的位置(place)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She won the race and took first-place.
  </text>
  <text x="50" y="310" class="content">
    她赢得了比赛，获得了第一名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Finish line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="10" x2="350" y2="10" class="image" />
    <!-- Runner -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- First place ribbon -->
    <path d="M100,50 Q150,20 200,50 T300,50" class="image" />
    <text x="150" y="60" class="content" fill="#E74C3C">1st</text>
  </g>
</svg>