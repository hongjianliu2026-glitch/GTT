<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">muscle</text>
  <text x="50" y="120" class="subtitle">[ˈmʌsl] n. 肌肉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mus (老鼠) + cle (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小老鼠(mus)在健身房里，"小(cle)"
    <tspan x="50" dy="25">但强壮的肌肉(muscle)让它变得非常有力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He developed his muscles by lifting weights.
  </text>
  <text x="50" y="310" class="content">
    他通过举重锻炼了肌肉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gym -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mouse -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Muscles -->
    <ellipse cx="150" cy="100" rx="50" ry="30" class="image" />
    <ellipse cx="250" cy="100" rx="50" ry="30" class="image" />
    <!-- Dumbbell -->
    <rect x="100" y="50" width="100" height="20" class="image" />
    <rect x="120" y="30" width="60" height="40" class="image" />
    <rect x="120" y="110" width="60" height="40" class="image" />
  </g>
</svg>