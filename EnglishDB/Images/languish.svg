<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">languish</text>
  <text x="50" y="120" class="subtitle">[ˈlæŋɡwɪʃ] v. 凋萎，衰弱，失去活力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lang (疲倦) + -ish (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵花在阳光下逐渐"疲倦(lang)"，
    <tspan x="50" dy="25">花瓣开始凋萎，失去了往日的活力，这就是"languish"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project languished due to lack of funding.
  </text>
  <text x="50" y="310" class="content">
    由于缺乏资金，这个项目逐渐失去了活力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="40" class="image" />
    <!-- Flower -->
    <line x1="150" y1="100" x2="150" y2="180" class="image" />
    <line x1="150" y1="120" x2="130" y2="140" class="image" />
    <line x1="150" y1="120" x2="170" y2="140" class="image" />
    <line x1="150" y1="160" x2="130" y2="180" class="image" />
    <line x1="150" y1="160" x2="170" y2="180" class="image" />
    <!-- Wilted petals -->
    <line x1="150" y1="100" x2="130" y2="80" class="image" />
    <line x1="150" y1="100" x2="170" y2="80" class="image" />
    <line x1="150" y1="100" x2="140" y2="120" class="image" />
    <line x1="150" y1="100" x2="160" y2="120" class="image" />
  </g>
</svg>