<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sundown</text>
  <text x="50" y="120" class="subtitle">[ˈsʌndaʊn] n. 日落</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + down (向下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳缓缓"向下(down)"，
    <tspan x="50" dy="25">消失在地平线，这就是日落(sundown)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We watched the sundown from the beach.
  </text>
  <text x="50" y="310" class="content">
    我们在海滩上观看了日落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F39C12" />
    <!-- Sun rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Horizon line -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <!-- Sun setting -->
    <circle cx="100" cy="200" r="50" fill="#F39C12" opacity="0.5" />
  </g>
</svg>