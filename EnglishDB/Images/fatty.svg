<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fatty</text>
  <text x="50" y="120" class="subtitle">[ˈfæti] adj. 脂肪的，肥胖的；n. 胖子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fat (脂肪) + -ty (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"脂肪(fat)"堆积如山的人，
    <tspan x="50" dy="25">他的身体被脂肪包裹，变成了一个"胖子(fatty)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor advised him to avoid fatty foods.
  </text>
  <text x="50" y="310" class="content">
    医生建议他避免吃高脂肪的食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fatty person -->
    <circle cx="100" cy="100" r="60" class="image" fill="#F1C40F" />
    <circle cx="100" cy="100" r="50" class="image" fill="#F39C12" />
    <circle cx="100" cy="100" r="40" class="image" fill="#E67E22" />
    <circle cx="100" cy="100" r="30" class="image" fill="#D35400" />
    <circle cx="100" cy="100" r="20" class="image" fill="#B74C00" />
    <circle cx="100" cy="100" r="10" class="image" fill="#9C4000" />
    <!-- Eyes -->
    <circle cx="80" cy="80" r="5" class="image" fill="#000" />
    <circle cx="120" cy="80" r="5" class="image" fill="#000" />
    <!-- Mouth -->
    <path d="M 80 120 Q 100 130 120 120" class="image" fill="none" stroke="#000" stroke-width="2" />
  </g>
</svg>