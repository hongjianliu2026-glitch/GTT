<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deep-seated</text>
  <text x="50" y="120" class="subtitle">[ˌdiːpˈsiːtɪd] adj. 根深蒂固的，深层的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> deep (深的) + seat (坐，安置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树，它的根深深地"坐(seat)"在土壤中，
    <tspan x="50" dy="25">这种"深坐(deep-seated)"的状态象征着根深蒂固。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her deep-seated fear of heights made her avoid skyscrapers.
  </text>
  <text x="50" y="310" class="content">
    她对高度的根深蒂固的恐惧使她避开了摩天大楼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="100" y="0" width="50" height="200" class="image" />
    <!-- Roots -->
    <line x1="125" y1="200" x2="100" y2="250" class="image" />
    <line x1="125" y1="200" x2="150" y2="250" class="image" />
    <line x1="125" y1="200" x2="125" y2="250" class="image" />
    <!-- Soil -->
    <rect x="0" y="250" width="300" height="50" class="image" />
    <!-- Tree top -->
    <circle cx="125" cy="0" r="50" class="image" />
  </g>
</svg>