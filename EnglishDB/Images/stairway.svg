<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stairway</text>
  <text x="50" y="120" class="subtitle">[ˈsterweɪ] n. 楼梯，阶梯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stair (楼梯) + way (路径)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的楼梯，"楼梯(stair)"
    <tspan x="50" dy="25">通向无尽的"路径(way)"，仿佛通往天堂的阶梯。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She climbed the stairway to reach the top floor.
  </text>
  <text x="50" y="310" class="content">
    她爬上楼梯到达顶楼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stairway -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="40" x2="100" y2="40" class="image" />
    <line x1="50" y1="60" x2="100" y2="60" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <line x1="50" y1="140" x2="100" y2="140" class="image" />
    <line x1="50" y1="160" x2="100" y2="160" class="image" />
    <line x1="50" y1="180" x2="100" y2="180" class="image" />
    <line x1="50" y1="200" x2="100" y2="200" class="image" />
    <!-- Steps -->
    <rect x="50" y="20" width="50" height="20" class="image" />
    <rect x="50" y="40" width="50" height="20" class="image" />
    <rect x="50" y="60" width="50" height="20" class="image" />
    <rect x="50" y="80" width="50" height="20" class="image" />
    <rect x="50" y="100" width="50" height="20" class="image" />
    <rect x="50" y="120" width="50" height="20" class="image" />
    <rect x="50" y="140" width="50" height="20" class="image" />
    <rect x="50" y="160" width="50" height="20" class="image" />
    <rect x="50" y="180" width="50" height="20" class="image" />
    <rect x="50" y="200" width="50" height="20" class="image" />
  </g>
</svg>