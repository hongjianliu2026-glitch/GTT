<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">femininity</text>
  <text x="50" y="120" class="subtitle">[ˌfɛməˈnɪnɪti] n. 女性气质，温柔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> femi- (女性) + -ninity (表示性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个优雅的女性，"女性(femi-)"
    <tspan x="50" dy="25">的特质在她身上完美展现，</tspan>
    <tspan x="50" dy="25">这就是她的女性气质(femininity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her femininity was evident in her graceful movements.
  </text>
  <text x="50" y="310" class="content">
    她优雅的动作中明显展现出她的女性气质。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elegant woman -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="180" class="image" />
    <line x1="50" y1="160" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Dress -->
    <path d="M20,250 Q50,220 80,250" class="image" />
    <!-- Flowers -->
    <circle cx="30" cy="80" r="10" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="50" cy="60" r="10" class="image" />
  </g>
</svg>