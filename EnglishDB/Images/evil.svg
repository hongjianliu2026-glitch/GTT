<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evil</text>
  <text x="50" y="120" class="subtitle">[ˈiːvəl] adj. 邪恶的，有害的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + vil (低劣)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个邪恶的巫师，"从低劣(vil)中"
    <tspan x="50" dy="25">释放出(e-)黑暗力量，这就是邪恶(evil)的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The evil sorcerer cast a dark spell.
  </text>
  <text x="50" y="310" class="content">
    邪恶的巫师施放了一个黑暗的咒语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Evil sorcerer -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Dark spell -->
    <path d="M120,100 C150,50 200,50 230,100" class="image" />
    <path d="M120,150 C150,200 200,200 230,150" class="image" />
    <path d="M120,200 C150,250 200,250 230,200" class="image" />
  </g>
</svg>