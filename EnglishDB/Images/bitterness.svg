<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bitterness</text>
  <text x="50" y="120" class="subtitle">[ˈbɪtərnəs] n. 苦味，痛苦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bitter (苦的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人尝到苦涩的药，脸上露出痛苦的表情，
    <tspan x="50" dy="25">这种苦味和痛苦的感觉就是bitterness。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bitterness of the medicine made her wince.
  </text>
  <text x="50" y="310" class="content">
    药的苦味让她皱起了眉头。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <line x1="70" y1="80" x2="80" y2="90" class="image" />
    <line x1="120" y1="80" x2="130" y2="90" class="image" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" />
    <!-- Medicine -->
    <rect x="160" y="70" width="50" height="60" class="image" />
    <text x="165" y="110" class="content" fill="#34495E">药</text>
  </g>
</svg>