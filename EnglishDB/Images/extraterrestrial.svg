<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extraterrestrial</text>
  <text x="50" y="120" class="subtitle">[ˌɛkstrətəˈrɛstriəl] adj. 地球外的，外星的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> extra- (外面) + terrestrial (地球的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个外星人从"外面(extra-)"来到地球，
    <tspan x="50" dy="25">这个外星人就是"地球外的(extraterrestrial)"存在。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie is about extraterrestrial beings visiting Earth.
  </text>
  <text x="50" y="310" class="content">
    这部电影讲述的是外星生物访问地球的故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="50" class="image" fill="#2980B9" />
    <!-- Alien -->
    <circle cx="250" cy="100" r="20" class="image" fill="#8E44AD" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Spaceship -->
    <polygon points="300,50 350,50 375,100 325,100" class="image" fill="#F39C12" />
    <line x1="337.5" y1="100" x2="337.5" y2="150" class="image" />
    <line x1="337.5" y1="150" x2="317.5" y2="180" class="image" />
    <line x1="337.5" y1="150" x2="357.5" y2="180" class="image" />
  </g>
</svg>