<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">last</text>
  <text x="50" y="120" class="subtitle">[læst] adj. 最后的，最近的；v. 持续</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> last (源自拉丁语 "ultimus"，意为最后的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人排成一列，"最后(last)"
    <tspan x="50" dy="25">的那个人总是引人注目，因为他站在队列的末尾。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was the last person to leave the party.
  </text>
  <text x="50" y="310" class="content">
    他是最后一个离开派对的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Line of people -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="300" cy="50" r="15" class="image" />
    <!-- Last person -->
    <circle cx="350" cy="50" r="20" class="image" />
    <text x="340" y="80" class="highlight">LAST</text>
  </g>
</svg>