<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">veil</text>
  <text x="50" y="120" class="subtitle">[veɪl] n. 面纱，遮盖物；v. 遮盖，掩饰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vei (看) + -l (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的女子，脸上覆盖着一层薄薄的面纱(veil)，
    <tspan x="50" dy="25">她轻轻地揭开面纱，露出美丽的面容，仿佛揭开了隐藏的真相。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a veil at her wedding.
  </text>
  <text x="50" y="310" class="content">
    她在婚礼上戴了面纱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Woman -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Veil -->
    <path d="M 50 100 Q 100 50 150 100 L 150 150 Q 100 200 50 150 Z" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
  </g>
</svg>