<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arthritic</text>
  <text x="50" y="120" class="subtitle">[ɑːˈrɪtɪk] adj. 关节炎的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arthr- (关节) + -itic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老人，关节(arthr-)疼痛，走路困难，
    <tspan x="50" dy="25">他的关节就像被锁住了一样，这就是关节炎(arthritic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man's arthritic knees made it hard for him to walk.
  </text>
  <text x="50" y="310" class="content">
    老人的关节炎膝盖使他走路困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old man -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Arthritic knees -->
    <circle cx="50" cy="180" r="15" class="image" />
    <line x1="50" y1="195" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="20" y2="250" class="image" />
    <line x1="50" y1="220" x2="80" y2="250" class="image" />
  </g>
</svg>