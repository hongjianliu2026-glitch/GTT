<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">narcissism</text>
  <text x="50" y="120" class="subtitle">[ˈnɑːrsɪsɪzəm] n. 自恋，自我陶醉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> narciss (自恋) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"自恋(narciss)"
    <tspan x="50" dy="25">到无法自拔，完全沉浸在自己的世界里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His narcissism made him unpopular among his peers.
  </text>
  <text x="50" y="310" class="content">
    他的自恋让他不受同龄人的欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="125" y2="140" class="image" />
    <line x1="175" y1="150" x2="225" y2="140" class="image" />
    <!-- Reflection -->
    <circle cx="175" cy="120" r="30" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="200" x2="150" y2="240" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="200" x2="200" y2="240" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="170" x2="125" y2="160" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="170" x2="225" y2="160" class="image" stroke-dasharray="5,5" />
  </g>
</svg>