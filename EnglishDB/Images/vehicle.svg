<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vehicle</text>
  <text x="50" y="120" class="subtitle">[ˈviːɪkl] n. 交通工具，车辆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vehi- (携带) + cle (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆巨大的卡车，"携带(vehi-)"着无数的货物，
    <tspan x="50" dy="25">这辆卡车就是一种交通工具(vehicle)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new vehicle model has advanced safety features.
  </text>
  <text x="50" y="310" class="content">
    这款新车具有先进的安全功能。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Truck body -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="160" r="30" class="image" />
    <circle cx="250" cy="160" r="30" class="image" />
    <!-- Cargo -->
    <rect x="20" y="20" width="310" height="100" class="image" />
    <!-- Driver -->
    <circle cx="320" cy="80" r="15" class="image" />
    <line x1="320" y1="95" x2="320" y2="120" class="image" />
    <line x1="320" y1="120" x2="300" y2="140" class="image" />
    <line x1="320" y1="120" x2="340" y2="140" class="image" />
    <line x1="320" y1="105" x2="350" y2="95" class="image" />
  </g>
</svg>