<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enhance</text>
  <text x="50" y="120" class="subtitle">[ɪnˈhæns] v. 提高，增强</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + hance (高)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师挥动魔杖，"使(en-)"
    <tspan x="50" dy="25">物体"变高(hance)"，从而增强了它的效果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new software will enhance the performance of your computer.
  </text>
  <text x="50" y="310" class="content">
    新软件将提高你电脑的性能。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magic wand -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Object before enhancement -->
    <rect x="150" y="50" width="50" height="50" class="image" />
    <!-- Object after enhancement -->
    <rect x="250" y="0" width="50" height="100" class="image" />
    <!-- Arrows -->
    <line x1="200" y1="75" x2="250" y2="25" class="image" />
    <polygon points="250,25 240,15 260,15" class="image" />
  </g>
</svg>