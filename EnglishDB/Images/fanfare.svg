<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fanfare</text>
  <text x="50" y="120" class="subtitle">[ˈfænfeər] n. 喇叭声，盛大的仪式</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fan (扇子) + fare (去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个盛大的仪式上，"扇子(fan)"
    <tspan x="50" dy="25">伴随着喇叭声(fare)，宣告着重要时刻的到来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new product launch was announced with a fanfare of trumpets.
  </text>
  <text x="50" y="310" class="content">
    新产品发布伴随着喇叭声宣布。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trumpet -->
    <path d="M50 50 L70 50 L80 100 L60 100 Z" class="image" />
    <path d="M70 50 L90 50 L100 100 L80 100 Z" class="image" />
    <!-- Fan -->
    <path d="M150 50 A50 50 0 0 1 200 100 L175 75 Z" class="image" />
    <path d="M150 50 A50 50 0 0 1 100 100 L125 75 Z" class="image" />
    <!-- Ceremony -->
    <rect x="250" y="20" width="100" height="160" class="image" />
    <line x1="270" y1="50" x2="330" y2="50" class="image" />
    <line x1="270" y1="80" x2="330" y2="80" class="image" />
    <line x1="270" y1="110" x2="330" y2="110" class="image" />
    <line x1="270" y1="140" x2="330" y2="140" class="image" />
  </g>
</svg>