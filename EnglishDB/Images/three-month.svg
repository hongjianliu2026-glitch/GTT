<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-month</text>
  <text x="50" y="120" class="subtitle">[θriː mʌnθ] adj. 三个月的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + month (月)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个日历上，"三个月(three-month)"
    <tspan x="50" dy="25">的时间被特别标注出来，形成了一个</tspan>
    <tspan x="50" dy="25">重要的周期。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a three-month internship at the company.
  </text>
  <text x="50" y="310" class="content">
    她在公司有一个为期三个月的实习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Months -->
    <rect x="50" y="20" width="80" height="160" class="image" />
    <rect x="150" y="20" width="80" height="160" class="image" />
    <rect x="250" y="20" width="80" height="160" class="image" />
    <!-- Month labels -->
    <text x="70" y="100" class="content">1st</text>
    <text x="170" y="100" class="content">2nd</text>
    <text x="270" y="100" class="content">3rd</text>
  </g>
</svg>