<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fond</text>
  <text x="50" y="120" class="subtitle">[fɒnd] adj. 喜欢的，喜爱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fon- (声音) + -d (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人听到他最喜欢的音乐，"声音(fon-)"
    <tspan x="50" dy="25">让他感到非常开心，这种感觉就是"喜欢的(fond)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is fond of classical music.
  </text>
  <text x="50" y="310" class="content">
    她喜欢古典音乐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head with smile -->
    <circle cx="50" cy="50" r="30" class="image" />
    <path d="M40 60 Q50 70 60 60" class="image" />
    <!-- Ears -->
    <circle cx="30" cy="50" r="5" class="image" />
    <circle cx="70" cy="50" r="5" class="image" />
    <!-- Music notes -->
    <path d="M100 50 Q120 30 140 50 T180 50" class="image" />
    <path d="M110 60 Q130 40 150 60 T190 60" class="image" />
    <path d="M120 70 Q140 50 160 70 T200 70" class="image" />
  </g>
</svg>