<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seniority</text>
  <text x="50" y="120" class="subtitle">[ˌsiːniˈɔːrəti] n. 资历，年长</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> senior (年长的) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个年长的领导坐在高高的椅子上，"年长(senior)"
    <tspan x="50" dy="25">意味着更高的地位和更多的经验，这就是资历(seniority)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gained seniority after working at the company for 20 years.
  </text>
  <text x="50" y="310" class="content">
    他在公司工作了20年后获得了资历。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Senior leader -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="120" x2="100" y2="110" class="image" />
    <!-- High chair -->
    <rect x="30" y="150" width="40" height="100" class="image" />
    <rect x="20" y="250" width="60" height="20" class="image" />
    <!-- Experience symbol -->
    <line x1="120" y1="50" x2="180" y2="50" class="image" />
    <line x1="120" y1="80" x2="180" y2="80" class="image" />
    <line x1="120" y1="110" x2="180" y2="110" class="image" />
    <line x1="120" y1="140" x2="180" y2="140" class="image" />
  </g>
</svg>