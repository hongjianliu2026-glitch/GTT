<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">summertime</text>
  <text x="50" y="120" class="subtitle">[ˈsʌmərtaɪm] n. 夏季，夏天</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sum (夏天) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个炎热的夏天，太阳高高挂在天空，
    <tspan x="50" dy="25">人们在海滩上享受阳光和海浪，这就是"夏天的时光(summertime)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We love to go camping in the summertime.
  </text>
  <text x="50" y="310" class="content">
    我们喜欢在夏天去露营。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Beach -->
    <rect x="0" y="150" width="350" height="100" fill="#3498DB" />
    <!-- Waves -->
    <path d="M0,150 Q50,170 100,150 T200,150 T300,150 T350,150" stroke="#2980B9" stroke-width="5" fill="none" />
    <!-- Person -->
    <circle cx="200" cy="120" r="15" fill="#E74C3C" />
    <line x1="200" y1="135" x2="200" y2="160" stroke="#E74C3C" stroke-width="2" />
    <line x1="200" y1="160" x2="180" y2="180" stroke="#E74C3C" stroke-width="2" />
    <line x1="200" y1="160" x2="220" y2="180" stroke="#E74C3C" stroke-width="2" />
    <line x1="200" y1="145" x2="230" y2="135" stroke="#E74C3C" stroke-width="2" />
  </g>
</svg>