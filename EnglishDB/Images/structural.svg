<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">structural</text>
  <text x="50" y="120" class="subtitle">[ˈstrʌktʃərəl] adj. 结构的，构造的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> struct (建造) + -ural (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个建筑师在设计一座大楼，"建造(struct)"
    <tspan x="50" dy="25">出坚固的结构，这座大楼就是结构性的(structural)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The structural integrity of the bridge was compromised.
  </text>
  <text x="50" y="310" class="content">
    这座桥的结构完整性受到了损害。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Building structure -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Columns -->
    <line x1="70" y1="50" x2="70" y2="180" class="image" />
    <line x1="120" y1="50" x2="120" y2="180" class="image" />
    <line x1="170" y1="50" x2="170" y2="180" class="image" />
    <line x1="220" y1="50" x2="220" y2="180" class="image" />
    <!-- Roof -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="20" x2="175" y2="0" class="image" />
    <line x1="300" y1="20" x2="175" y2="0" class="image" />
  </g>
</svg>