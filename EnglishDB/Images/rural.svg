<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rural</text>
  <text x="50" y="120" class="subtitle">[ˈrʊərəl] adj. 农村的，乡村的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rus (乡村)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片宁静的乡村(rus)，
    <tspan x="50" dy="25">田野、小屋和远处的山丘，这就是"乡村的(rural)"景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves the peaceful rural life.
  </text>
  <text x="50" y="310" class="content">
    她喜欢宁静的乡村生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- House -->
    <rect x="50" y="50" width="100" height="80" class="image" />
    <line x1="50" y1="50" x2="100" y2="20" class="image" />
    <line x1="100" y1="20" x2="150" y2="50" class="image" />
    <!-- Trees -->
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="210" y1="50" x2="210" y2="150" class="image" />
    <line x1="220" y1="50" x2="220" y2="150" class="image" />
    <!-- Hill -->
    <ellipse cx="275" cy="150" rx="75" ry="50" class="image" />
  </g>
</svg>