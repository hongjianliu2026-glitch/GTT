<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lobby</text>
  <text x="50" y="120" class="subtitle">[ˈlɒbi] n. 大厅，休息室；v. 游说</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lob (来自古法语 "lober"，意为“大声喊叫”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一个大房间里，"大声喊叫(lob)"
    <tspan x="50" dy="25">以影响决策者，这个房间就是他们的"lobby"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The group is lobbying for stricter environmental laws.
  </text>
  <text x="50" y="310" class="content">
    这个团体正在游说制定更严格的环境法律。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lobby room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <!-- Talking -->
    <line x1="50" y1="70" x2="50" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="100" class="image" />
    <line x1="150" y1="70" x2="150" y2="100" class="image" />
    <line x1="200" y1="70" x2="200" y2="100" class="image" />
    <!-- Decision maker -->
    <rect x="250" y="20" width="80" height="160" class="image" />
    <line x1="290" y1="100" x2="290" y2="150" class="image" />
    <line x1="290" y1="150" x2="270" y2="180" class="image" />
    <line x1="290" y1="150" x2="310" y2="180" class="image" />
  </g>
</svg>