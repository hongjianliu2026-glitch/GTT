<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ten-year</text>
  <text x="50" y="120" class="subtitle">[ˈten jɪr] adj. 十年的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ten- (十) + year (年)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，上面有十个刻度，每个刻度代表一年，
    <tspan x="50" dy="25">走过这十个刻度，就意味着十年(ten-year)过去了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They celebrated their ten-year anniversary last month.
  </text>
  <text x="50" y="310" class="content">
    他们上个月庆祝了他们的十年纪念日。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Ten marks -->
    <line x1="175" y1="20" x2="175" y2="30" class="image" />
    <line x1="245" y1="90" x2="255" y2="100" class="image" />
    <line x1="245" y1="110" x2="255" y2="120" class="image" />
    <line x1="175" y1="180" x2="175" y2="170" class="image" />
    <line x1="105" y1="110" x2="95" y2="120" class="image" />
    <line x1="105" y1="90" x2="95" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="30" class="image" />
    <line x1="245" y1="90" x2="255" y2="100" class="image" />
    <line x1="245" y1="110" x2="255" y2="120" class="image" />
    <line x1="175" y1="180" x2="175" y2="170" class="image" />
    <line x1="105" y1="110" x2="95" y2="120" class="image" />
    <line x1="105" y1="90" x2="95" y2="100" class="image" />
  </g>
</svg>