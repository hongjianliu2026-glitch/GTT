<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humankind</text>
  <text x="50" y="120" class="subtitle">[ˌhjuːmənˈkaɪnd] n. 人类</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> huma (人) + kind (种类)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球，上面布满了各种肤色的人类，
    <tspan x="50" dy="25">他们和谐共处，共同构成了"人类(humankind)"这个大家庭。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Humankind has made great strides in technology.
  </text>
  <text x="50" y="310" class="content">
    人类在科技方面取得了巨大的进步。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- People -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="175" cy="150" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <!-- Arms and legs -->
    <line x1="100" y1="60" x2="90" y2="80" class="image" />
    <line x1="100" y1="60" x2="110" y2="80" class="image" />
    <line x1="250" y1="60" x2="240" y2="80" class="image" />
    <line x1="250" y1="60" x2="260" y2="80" class="image" />
    <line x1="175" y1="160" x2="165" y2="180" class="image" />
    <line x1="175" y1="160" x2="185" y2="180" class="image" />
    <line x1="100" y1="160" x2="90" y2="180" class="image" />
    <line x1="100" y1="160" x2="110" y2="180" class="image" />
    <line x1="250" y1="160" x2="240" y2="180" class="image" />
    <line x1="250" y1="160" x2="260" y2="180" class="image" />
  </g>
</svg>