<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hectic</text>
  <text x="50" y="120" class="subtitle">[ˈhektɪk] adj. 繁忙的，紧张的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hekt- (来自希腊语 hektikos，意为“紧张的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个繁忙的都市，人们匆忙地穿梭在街道上，
    <tspan x="50" dy="25">每个人都在紧张地赶时间，这种场景就是“hectic”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hectic pace of city life can be overwhelming.
  </text>
  <text x="50" y="310" class="content">
    城市生活的繁忙节奏可能会让人感到不知所措。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Busy street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="60" r="10" class="image" />
    <circle cx="200" cy="80" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="300" cy="70" r="10" class="image" />
    <!-- Cars -->
    <rect x="50" y="100" width="40" height="20" class="image" />
    <rect x="120" y="100" width="40" height="20" class="image" />
    <rect x="190" y="100" width="40" height="20" class="image" />
    <rect x="260" y="100" width="40" height="20" class="image" />
    <!-- Buildings -->
    <rect x="0" y="150" width="50" height="50" class="image" />
    <rect x="70" y="150" width="50" height="50" class="image" />
    <rect x="140" y="150" width="50" height="50" class="image" />
    <rect x="210" y="150" width="50" height="50" class="image" />
    <rect x="280" y="150" width="50" height="50" class="image" />
  </g>
</svg>