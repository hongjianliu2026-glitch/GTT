<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foundational</text>
  <text x="50" y="120" class="subtitle">[ˌfaʊndəˈneɪʃənl] adj. 基础的，根本的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> found (基础) + -ation (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高楼大厦，它的"基础(found)"
    <tspan x="50" dy="25">是如此坚固，以至于整个建筑都依赖于它。</tspan>
    <tspan x="50" dy="25">这个基础就是"根本的(foundational)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The foundational principles of this theory are still valid today.
  </text>
  <text x="50" y="310" class="content">
    这个理论的基础原则至今仍然有效。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Foundation -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Building -->
    <rect x="100" y="50" width="150" height="150" class="image" />
    <rect x="120" y="70" width="110" height="130" class="image" />
    <rect x="140" y="90" width="70" height="110" class="image" />
    <!-- Windows -->
    <rect x="150" y="100" width="20" height="20" class="image" />
    <rect x="180" y="100" width="20" height="20" class="image" />
    <rect x="150" y="130" width="20" height="20" class="image" />
    <rect x="180" y="130" width="20" height="20" class="image" />
  </g>
</svg>