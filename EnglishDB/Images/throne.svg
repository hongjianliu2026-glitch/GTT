<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">throne</text>
  <text x="50" y="120" class="subtitle">[θroʊn] n. 王座，宝座</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thron (座位)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个国王坐在一个巨大的"座位(thron)"上，
    <tspan x="50" dy="25">这个座位就是他的王座(throne)，象征着权力和威严。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The king ascended the throne after his father's death.
  </text>
  <text x="50" y="310" class="content">
    国王在他父亲去世后登上了王位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Throne -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Backrest -->
    <rect x="100" y="20" width="100" height="160" class="image" />
    <!-- Seat -->
    <rect x="50" y="180" width="200" height="20" class="image" />
    <!-- Armrests -->
    <rect x="50" y="100" width="20" height="80" class="image" />
    <rect x="230" y="100" width="20" height="80" class="image" />
    <!-- King -->
    <circle cx="150" cy="140" r="20" class="image" />
    <line x1="150" y1="160" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="120" y2="170" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
  </g>
</svg>