<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beset</text>
  <text x="50" y="120" class="subtitle">[bɪˈsɛt] v. 困扰，包围</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + set (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"放置(set)"在"周围(be-)"
    <tspan x="50" dy="25">无数的麻烦中，这些麻烦"困扰(beset)"着他。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company was beset by financial troubles.
  </text>
  <text x="50" y="310" class="content">
    公司被财务问题所困扰。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="130" class="image" />
    <line x1="50" y1="140" x2="70" y2="130" class="image" />

    <!-- Problems -->
    <circle cx="150" cy="80" r="15" class="image" />
    <circle cx="200" cy="120" r="15" class="image" />
    <circle cx="180" cy="50" r="15" class="image" />
    <circle cx="220" cy="90" r="15" class="image" />
    <circle cx="160" cy="150" r="15" class="image" />
    <circle cx="240" cy="110" r="15" class="image" />

    <!-- Arrows -->
    <line x1="150" y1="80" x2="60" y2="100" class="image" />
    <line x1="200" y1="120" x2="60" y2="120" class="image" />
    <line x1="180" y1="50" x2="60" y2="80" class="image" />
    <line x1="220" y1="90" x2="60" y2="100" class="image" />
    <line x1="160" y1="150" x2="60" y2="140" class="image" />
    <line x1="240" y1="110" x2="60" y2="120" class="image" />
  </g>
</svg>