<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">panicky</text>
  <text x="50" y="120" class="subtitle">[ˈpænɪki] adj. 恐慌的，惊慌的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> panic (恐慌) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在人群中突然感到"恐慌(panic)"，
    <tspan x="50" dy="25">心跳加速，手心出汗，这就是"恐慌的(panicky)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The panicky crowd rushed to the exit.
  </text>
  <text x="50" y="310" class="content">
    恐慌的人群冲向出口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in panic -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Heartbeat -->
    <rect x="120" y="80" width="50" height="50" class="image" />
    <line x1="145" y1="80" x2="145" y2="130" class="image" />
    <line x1="145" y1="105" x2="120" y2="95" class="image" />
    <line x1="145" y1="105" x2="170" y2="95" class="image" />
    <!-- Sweat drops -->
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="240" cy="110" r="10" class="image" />
    <circle cx="260" cy="120" r="10" class="image" />
  </g>
</svg>