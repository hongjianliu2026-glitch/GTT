<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anguished</text>
  <text x="50" y="120" class="subtitle">[ˈæŋɡwɪʃt] adj. 痛苦的，苦恼的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ang (痛苦) + -uish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为内心的"痛苦(ang)"而"苦恼(uish)"，
    <tspan x="50" dy="25">他的表情扭曲，仿佛在无声地呐喊。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The anguished look on his face told the whole story.
  </text>
  <text x="50" y="310" class="content">
    他脸上痛苦的表情说明了一切。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="85" r="10" class="image" />
    <circle cx="125" cy="85" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 50 130 Q 100 150 150 130" class="image" />
    <!-- Tears -->
    <line x1="75" y1="100" x2="75" y2="150" class="image" />
    <line x1="125" y1="100" x2="125" y2="150" class="image" />
  </g>
</svg>