<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sequencing</text>
  <text x="50" y="120" class="subtitle">[ˈsiːkwənsɪŋ] n. 排序，序列化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sequ (跟随) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指挥家在指挥乐队，"跟随(sequ)"
    <tspan x="50" dy="25">着他的指挥棒，乐手们依次演奏，这就是排序(sequencing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sequencing of the DNA is crucial for genetic research.
  </text>
  <text x="50" y="310" class="content">
    DNA排序对基因研究至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Conductor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Baton -->
    <line x1="20" y1="115" x2="70" y2="80" class="image" />
    <!-- Musicians -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="130" cy="100" r="10" class="image" />
    <circle cx="160" cy="100" r="10" class="image" />
    <circle cx="190" cy="100" r="10" class="image" />
    <!-- Instruments -->
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="130" y1="110" x2="130" y2="130" class="image" />
    <line x1="160" y1="110" x2="160" y2="130" class="image" />
    <line x1="190" y1="110" x2="190" y2="130" class="image" />
  </g>
</svg>