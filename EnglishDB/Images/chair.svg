<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chair</text>
  <text x="50" y="120" class="subtitle">[tʃer] n. 椅子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chair (源自拉丁语 "cathedra"，意为“座位”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的教堂里，主教坐在一个高高的“座位(cathedra)”上，
    <tspan x="50" dy="25">这个座位后来演变成了我们今天所知的椅子(chair)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sat in the chair and started reading.
  </text>
  <text x="50" y="310" class="content">
    她坐在椅子上开始阅读。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Chair -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="50" y="150" width="100" height="50" class="image" />
    <line x1="75" y1="200" x2="75" y2="300" class="image" />
    <line x1="125" y1="200" x2="125" y2="300" class="image" />
    <line x1="50" y1="250" x2="150" y2="250" class="image" />
    <line x1="50" y1="250" x2="0" y2="300" class="image" />
    <line x1="150" y1="250" x2="200" y2="300" class="image" />
  </g>
</svg>