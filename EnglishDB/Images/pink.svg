<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF5EE; }
      .title { font: bold 48px sans-serif; fill: #FF69B4; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #FF69B4; stroke-width: 2; fill: none; }
      .pink-fill { fill: #FF69B4; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pink</text>
  <text x="50" y="120" class="subtitle">[pɪŋk] n. 粉红色；adj. 粉红色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "pinke"，意为“尖锐的”，
    <tspan x="50" dy="25">可能与植物“石竹”（pink）的花瓣尖锐形状有关。</tspan>
  </text>

  <!-- Story -->
  <text x="50" y="230" class="story">
    想象一朵石竹花，它的花瓣尖锐而美丽，
    <tspan x="50" dy="25">这种花的颜色就是粉红色(pink)，象征着温柔与甜美。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> She wore a pink dress to the party.
  </text>
  <text x="50" y="330" class="content">
    她穿着一件粉红色的裙子去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower -->
    <circle cx="50" cy="50" r="40" class="pink-fill" />
    <circle cx="80" cy="50" r="40" class="pink-fill" />
    <circle cx="65" cy="80" r="40" class="pink-fill" />
    <circle cx="50" cy="110" r="40" class="pink-fill" />
    <circle cx="80" cy="110" r="40" class="pink-fill" />
    <!-- Stem -->
    <line x1="65" y1="150" x2="65" y2="250" class="image" />
    <!-- Leaves -->
    <path d="M65,250 Q50,230 65,210 Q80,230 65,250" class="image" />
  </g>
</svg>