<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .blood { fill: #8B0000; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bloodied</text>
  <text x="50" y="120" class="subtitle">[ˈblʌdid] adj. 流血的，沾满血的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blood (血) + -ied (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在战斗中，"血(blood)"
    <tspan x="50" dy="25">流满身，变成了"流血的(bloodied)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldier returned from the battlefield bloodied but unbowed.
  </text>
  <text x="50" y="310" class="content">
    士兵从战场上回来，浑身是血但毫不屈服。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="160" x2="100" y2="140" class="image" />
    <!-- Blood drops -->
    <circle cx="60" cy="120" r="5" class="blood" />
    <circle cx="40" cy="140" r="5" class="blood" />
    <circle cx="70" cy="150" r="5" class="blood" />
    <circle cx="55" cy="170" r="5" class="blood" />
    <circle cx="35" cy="180" r="5" class="blood" />
  </g>
</svg>