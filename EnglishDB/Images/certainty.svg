<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">certainty</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrtnti] n. 确定性，确信</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cert (确定) + -ain + -ty (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的"确定(cert)"标志前，
    <tspan x="50" dy="25">这个标志像一个巨大的盾牌，保护着他免受怀疑和不确定的侵扰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There is no certainty about the outcome of the election.
  </text>
  <text x="50" y="310" class="content">
    选举结果尚不确定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <polygon points="0,0 150,0 175,50 150,100 0,100" class="image" />
    <!-- Person -->
    <circle cx="87.5" cy="150" r="15" class="image" />
    <line x1="87.5" y1="165" x2="87.5" y2="200" class="image" />
    <line x1="87.5" y1="200" x2="70" y2="230" class="image" />
    <line x1="87.5" y1="200" x2="105" y2="230" class="image" />
    <line x1="87.5" y1="180" x2="120" y2="170" class="image" />
  </g>
</svg>