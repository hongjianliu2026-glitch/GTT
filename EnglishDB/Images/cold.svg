<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cold { fill: #BDC3C7; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cold</text>
  <text x="50" y="120" class="subtitle">[koʊld] adj. 冷的，寒冷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (冷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在寒冷的冬天，"冷(col-)"得直打哆嗦，
    <tspan x="50" dy="25">这种感觉就是cold。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The winter wind was so cold that it made her shiver.
  </text>
  <text x="50" y="310" class="content">
    冬天的风如此寒冷，以至于让她打了个寒颤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowman -->
    <circle cx="50" cy="50" r="30" class="cold" />
    <circle cx="50" cy="100" r="40" class="cold" />
    <circle cx="50" cy="160" r="50" class="cold" />
    <!-- Snowflakes -->
    <circle cx="150" cy="50" r="5" class="cold" />
    <circle cx="170" cy="70" r="5" class="cold" />
    <circle cx="190" cy="90" r="5" class="cold" />
    <circle cx="210" cy="110" r="5" class="cold" />
    <!-- Person shivering -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="190" class="image" />
    <line x1="300" y1="160" x2="320" y2="190" class="image" />
    <line x1="300" y1="140" x2="330" y2="130" class="image" />
    <line x1="300" y1="140" x2="270" y2="130" class="image" />
  </g>
</svg>