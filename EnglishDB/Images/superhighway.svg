<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">superhighway</text>
  <text x="50" y="120" class="subtitle">[ˌsuːpərˈhaɪweɪ] n. 超级高速公路</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (超级) + highway (高速公路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条"超级(super)"宽阔的"高速公路(highway)"，
    <tspan x="50" dy="25">上面飞驰着各种高科技交通工具，速度快到让人眼花缭乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new superhighway connects the two major cities.
  </text>
  <text x="50" y="310" class="content">
    这条新的超级高速公路连接了两个主要城市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Highway -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Road lines -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="130" x2="300" y2="130" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <!-- Cars -->
    <rect x="70" y="80" width="30" height="20" class="image" />
    <rect x="120" y="80" width="30" height="20" class="image" />
    <rect x="170" y="80" width="30" height="20" class="image" />
    <rect x="220" y="80" width="30" height="20" class="image" />
    <!-- Super symbol -->
    <text x="150" y="50" class="highlight">SUPER</text>
  </g>
</svg>