<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">span</text>
  <text x="50" y="120" class="subtitle">[spæn] n. 跨度，一段时间；v. 跨越，持续</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sp- (扩展) + an (持续)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的蜘蛛，它用丝线"扩展(sp-)"并"持续(an)"
    <tspan x="50" dy="25">地跨越(span)整个房间，形成了一个巨大的网。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bridge spans the river, connecting the two cities.
  </text>
  <text x="50" y="310" class="content">
    这座桥横跨河流，连接了两座城市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spider -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Web -->
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <line x1="50" y1="100" x2="200" y2="250" class="image" />
    <line x1="350" y1="100" x2="200" y2="250" class="image" />
    <line x1="50" y1="100" x2="200" y2="50" class="image" />
    <line x1="350" y1="100" x2="200" y2="50" class="image" />
  </g>
</svg>