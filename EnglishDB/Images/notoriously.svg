<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">notoriously</text>
  <text x="50" y="120" class="subtitle">[noʊˈtɔːriəsli] adv. 臭名昭著地，众所周知地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> not (知道) + -orious (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶名昭彰的罪犯，"大家都知道(not-orious)"
    <tspan x="50" dy="25">他的恶行，他走到哪里都被人指指点点，这就是臭名昭著(notoriously)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The restaurant is notoriously known for its bad service.
  </text>
  <text x="50" y="310" class="content">
    这家餐厅因其糟糕的服务而臭名昭著。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Criminal -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Speech bubbles -->
    <path d="M 70 80 Q 120 80 120 130 Q 120 180 70 180 Q 20 180 20 130 Z" class="image" />
    <text x="80" y="120" class="content">"He's the one!"</text>
    <path d="M 150 80 Q 200 80 200 130 Q 200 180 150 180 Q 100 180 100 130 Z" class="image" />
    <text x="160" y="120" class="content">"Notorious!"</text>
  </g>
</svg>