<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">restless</text>
  <text x="50" y="120" class="subtitle">[ˈrɛsləs] adj. 不安的，焦躁的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + st (站立) + -less (没有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人不停地"再次站立(re-st)"，
    <tspan x="50" dy="25">却无法"没有(less)"动作，表现出焦躁不安的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The restless child couldn't sit still during the lecture.
  </text>
  <text x="50" y="310" class="content">
    那个焦躁不安的孩子在讲座中无法安静地坐着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="200" class="image" />
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="100" y2="200" class="image" />
    <!-- Moving lines -->
    <line x1="50" y1="200" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="240" class="image" />
    <line x1="50" y1="220" x2="70" y2="240" class="image" />
  </g>
</svg>