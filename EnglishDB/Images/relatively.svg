<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">relatively</text>
  <text x="50" y="120" class="subtitle">[ˈrɛlətɪvli] adv. 相对地，比较地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + lat (携带) + -ive (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在比较他们的体重，"再次携带(re-lat)"
    <tspan x="50" dy="25">他们的体重，发现一个人相对(relatively)较轻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is relatively young for her position.
  </text>
  <text x="50" y="310" class="content">
    她相对于她的职位来说比较年轻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scale -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="0" x2="0" y2="200" class="image" />
    <line x1="350" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <!-- Weight comparison -->
    <rect x="50" y="100" width="50" height="100" class="image" />
    <rect x="250" y="50" width="50" height="150" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <polygon points="200,150 190,140 190,160" class="image" />
    <text x="150" y="140" class="content" text-anchor="middle">relatively</text>
  </g>
</svg>