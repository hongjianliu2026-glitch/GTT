<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jiggle</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɪɡl] v. 轻摇，抖动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jig (轻快地跳) + -le (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装满水的杯子，"轻快地跳动(jig)"
    <tspan x="50" dy="25">并反复抖动(jiggle)，水花四溅，形成一幅生动的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She jiggled the key in the lock until it turned.
  </text>
  <text x="50" y="310" class="content">
    她把钥匙在锁里抖动，直到锁转动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Water -->
    <line x1="20" y1="50" x2="130" y2="50" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <line x1="20" y1="110" x2="130" y2="110" class="image" />
    <line x1="20" y1="140" x2="130" y2="140" class="image" />
    <!-- Jiggling effect -->
    <line x1="20" y1="50" x2="10" y2="40" class="image" />
    <line x1="130" y1="50" x2="140" y2="40" class="image" />
    <line x1="20" y1="80" x2="10" y2="70" class="image" />
    <line x1="130" y1="80" x2="140" y2="70" class="image" />
    <line x1="20" y1="110" x2="10" y2="100" class="image" />
    <line x1="130" y1="110" x2="140" y2="100" class="image" />
    <line x1="20" y1="140" x2="10" y2="130" class="image" />
    <line x1="130" y1="140" x2="140" y2="130" class="image" />
  </g>
</svg>