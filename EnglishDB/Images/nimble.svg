<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nimble</text>
  <text x="50" y="120" class="subtitle">[ˈnɪmbl] adj. 敏捷的，灵活的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nim (拿) + -ble (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫，"能够轻松地拿起(nim-ble)"
    <tspan x="50" dy="25">各种小物件，展现出它的敏捷和灵活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dancer's nimble movements impressed the audience.
  </text>
  <text x="50" y="310" class="content">
    舞者敏捷的动作给观众留下了深刻印象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Front leg -->
    <line x1="50" y1="130" x2="20" y2="150" class="image" /> <!-- Ear -->
    <line x1="50" y1="130" x2="80" y2="150" class="image" /> <!-- Ear -->
    <circle cx="40" cy="90" r="5" class="image" /> <!-- Eye -->
    <circle cx="60" cy="90" r="5" class="image" /> <!-- Eye -->
    <line x1="45" y1="110" x2="55" y2="110" class="image" /> <!-- Mouth -->
    <!-- Object -->
    <rect x="100" y="150" width="30" height="30" class="image" />
  </g>
</svg>