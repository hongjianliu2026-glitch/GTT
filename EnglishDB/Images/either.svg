<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">either</text>
  <text x="50" y="120" class="subtitle">[ˈaɪðər] adj. 任一的；pron. 任一</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + -ther (两者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你站在一个分岔路口，面前有两条路，你可以选择"任一(either)"
    <tspan x="50" dy="25">条路走，无论选择哪一条，你都能到达目的地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You can take either road to reach the village.
  </text>
  <text x="50" y="310" class="content">
    你可以选择任一条路到达村庄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road 1 -->
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <!-- Road 2 -->
    <line x1="0" y1="50" x2="200" y2="50" class="image" />
    <!-- Person at the fork -->
    <circle cx="250" cy="25" r="15" class="image" />
    <line x1="250" y1="40" x2="250" y2="70" class="image" />
    <line x1="250" y1="70" x2="230" y2="100" class="image" />
    <line x1="250" y1="70" x2="270" y2="100" class="image" />
    <line x1="250" y1="50" x2="280" y2="40" class="image" />
  </g>
</svg>