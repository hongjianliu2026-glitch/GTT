<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sexuality</text>
  <text x="50" y="120" class="subtitle">[ˌsɛkʃuˈælɪti] n. 性取向，性特征</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sex (性) + -uality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个多彩的彩虹，代表不同的性取向，
    <tspan x="50" dy="25">每个人都在彩虹下找到自己的位置，这就是性特征(sexuality)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Understanding one's sexuality is a personal journey.
  </text>
  <text x="50" y="310" class="content">
    理解自己的性取向是一个个人的旅程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rainbow -->
    <path d="M0,100 C100,-100 300,300 400,100" class="image" stroke="#FF0000" />
    <path d="M0,100 C100,-100 300,300 400,100" class="image" stroke="#FF7F00" />
    <path d="M0,100 C100,-100 300,300 400,100" class="image" stroke="#FFFF00" />
    <path d="M0,100 C100,-100 300,300 400,100" class="image" stroke="#00FF00" />
    <path d="M0,100 C100,-100 300,300 400,100" class="image" stroke="#0000FF" />
    <path d="M0,100 C100,-100 300,300 400,100" class="image" stroke="#4B0082" />
    <path d="M0,100 C100,-100 300,300 400,100" class="image" stroke="#8B00FF" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" fill="#7F8C8D" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>