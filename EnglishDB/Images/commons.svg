<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commons</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmənz] n. 公共用地，公地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + mon (公共)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人共同使用一片"公共(com-mon)"的草地，
    <tspan x="50" dy="25">这片草地就是他们的"公地(commons)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The villagers gathered in the commons to discuss the new project.
  </text>
  <text x="50" y="310" class="content">
    村民们在公地上聚集，讨论新项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grassland -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2ECC71" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" fill="#3498DB" />
    <circle cx="100" cy="100" r="15" class="image" fill="#3498DB" />
    <circle cx="150" cy="100" r="15" class="image" fill="#3498DB" />
    <circle cx="200" cy="100" r="15" class="image" fill="#3498DB" />
    <circle cx="250" cy="100" r="15" class="image" fill="#3498DB" />
    <!-- Trees -->
    <rect x="30" y="50" width="20" height="50" class="image" fill="#27AE60" />
    <rect x="300" y="50" width="20" height="50" class="image" fill="#27AE60" />
  </g>
</svg>