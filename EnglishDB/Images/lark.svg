<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lark</text>
  <text x="50" y="120" class="subtitle">[lɑːrk] n. 云雀，百灵鸟；v. 嬉戏，玩耍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lark (源自中古英语，意为“云雀”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只云雀(lark)在天空中自由翱翔，
    <tspan x="50" dy="25">欢快地歌唱，仿佛在嬉戏(lark)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were larking around in the park.
  </text>
  <text x="50" y="310" class="content">
    孩子们在公园里嬉戏玩耍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" fill="#F1C40F" />
    <!-- Lark -->
    <path d="M50 100 Q100 50 150 100 T250 100" stroke="#2ECC71" stroke-width="5" fill="none" />
    <circle cx="50" cy="100" r="10" fill="#2ECC71" />
    <circle cx="150" cy="100" r="10" fill="#2ECC71" />
    <circle cx="250" cy="100" r="10" fill="#2ECC71" />
    <!-- Clouds -->
    <ellipse cx="100" cy="50" rx="50" ry="20" fill="#ECF0F1" />
    <ellipse cx="200" cy="70" rx="40" ry="15" fill="#ECF0F1" />
  </g>
</svg>