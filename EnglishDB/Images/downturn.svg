<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">downturn</text>
  <text x="50" y="120" class="subtitle">[ˈdaʊntɜːrn] n. 低迷，衰退</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> down (向下) + turn (转向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个经济图表，原本是上升的，突然"转向(turn)"
    <tspan x="50" dy="25">向下(down)，这就是经济低迷(downturn)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company faced a severe downturn during the recession.
  </text>
  <text x="50" y="310" class="content">
    公司在经济衰退期间遭遇了严重低迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Graph -->
    <line x1="50" y1="150" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="350" y2="150" class="image" />
    <!-- Arrow -->
    <polygon points="350,150 330,130 330,170" class="image" />
    <!-- Down arrow -->
    <polygon points="250,50 230,70 270,70" class="image" />
    <!-- Labels -->
    <text x="50" y="160" class="content">上升</text>
    <text x="350" y="160" class="content">下降</text>
  </g>
</svg>