<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">valor</text>
  <text x="50" y="120" class="subtitle">[ˈvælər] n. 勇气，英勇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> val (力量) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇士，手持利剑，面对巨龙，展现出无畏的"力量(val-or)"，
    <tspan x="50" dy="25">这种力量就是勇气(valor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The knight showed great valor in the battle.
  </text>
  <text x="50" y="310" class="content">
    骑士在战斗中展现了极大的勇气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warrior -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Sword -->
    <line x1="50" y1="120" x2="100" y2="60" class="image" />
    <line x1="100" y1="60" x2="120" y2="80" class="image" />
    <!-- Dragon -->
    <path d="M150,100 C160,80 200,80 210,100" class="image" />
    <circle cx="180" cy="100" r="10" class="image" />
    <line x1="180" y1="110" x2="180" y2="150" class="image" />
    <line x1="180" y1="150" x2="160" y2="190" class="image" />
    <line x1="180" y1="150" x2="200" y2="190" class="image" />
  </g>
</svg>