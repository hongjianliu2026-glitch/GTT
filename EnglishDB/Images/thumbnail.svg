<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thumbnail</text>
  <text x="50" y="120" class="subtitle">[ˈθʌmneɪl] n. 缩略图，拇指甲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thumb (拇指) + nail (指甲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拇指甲(thumb-nail)，上面印着一张微小的图片，
    <tspan x="50" dy="25">这张图片就是缩略图(thumbnail)，用来快速预览内容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Click on the thumbnail to view the full-size image.
  </text>
  <text x="50" y="310" class="content">
    点击缩略图查看完整尺寸的图片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thumbnail -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Thumbnail image -->
    <rect x="20" y="20" width="160" height="110" class="image" />
    <!-- Thumbnail border -->
    <rect x="10" y="10" width="180" height="130" class="image" />
    <!-- Thumb -->
    <circle cx="100" cy="200" r="50" class="image" />
    <line x1="100" y1="250" x2="100" y2="350" class="image" />
    <line x1="100" y1="350" x2="50" y2="400" class="image" />
    <line x1="100" y1="350" x2="150" y2="400" class="image" />
    <line x1="100" y1="270" x2="150" y2="260" class="image" />
  </g>
</svg>