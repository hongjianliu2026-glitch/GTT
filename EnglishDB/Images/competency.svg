<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">competency</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmpɪtənsi] n. 能力，胜任</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + pet (追求) + ency (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在竞技场上，"共同追求(com-pet)"
    <tspan x="50" dy="25">卓越，展现出他们的能力(competency)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her competency in handling complex projects is impressive.
  </text>
  <text x="50" y="310" class="content">
    她在处理复杂项目方面的能力令人印象深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arena -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Target -->
    <circle cx="300" cy="100" r="30" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
    <!-- Arrows -->
    <line x1="50" y1="100" x2="290" y2="100" class="image" />
    <line x1="100" y1="100" x2="295" y2="100" class="image" />
    <line x1="150" y1="100" x2="300" y2="100" class="image" />
    <line x1="200" y1="100" x2="305" y2="100" class="image" />
    <line x1="250" y1="100" x2="310" y2="100" class="image" />
  </g>
</svg>