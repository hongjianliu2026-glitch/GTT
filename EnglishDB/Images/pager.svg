<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pager</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪdʒər] n. 寻呼机，传呼机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> page (页) + -er (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寻呼机(pager)，它就像一本小书(page)，
    <tspan x="50" dy="25">每次收到信息时，就像翻开新的一页，传递重要消息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used to carry a pager for work.
  </text>
  <text x="50" y="310" class="content">
    他过去工作时总是带着寻呼机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pager device -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Screen -->
    <rect x="20" y="20" width="110" height="60" class="image" />
    <!-- Buttons -->
    <circle cx="40" cy="90" r="10" class="image" />
    <circle cx="80" cy="90" r="10" class="image" />
    <circle cx="120" cy="90" r="10" class="image" />
    <!-- Message -->
    <text x="30" y="50" class="content" fill="#34495E">New Page</text>
  </g>
</svg>