<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marketplace</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrkɪtpleɪs] n. 市场，集市</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> market (市场) + place (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热闹的市场，"市场(market)"
    <tspan x="50" dy="25">里摆满了各种摊位，人们在这里买卖商品，</tspan>
    <tspan x="50" dy="25">这就是一个"地方(place)"，即市场(marketplace)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The marketplace was bustling with activity.
  </text>
  <text x="50" y="310" class="content">
    市场里熙熙攘攘，热闹非凡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stalls -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="150" class="image" />
    <rect x="170" y="20" width="100" height="150" class="image" />
    <rect x="290" y="20" width="100" height="150" class="image" />
    <!-- People -->
    <circle cx="80" cy="180" r="10" class="image" />
    <circle cx="200" cy="180" r="10" class="image" />
    <circle cx="320" cy="180" r="10" class="image" />
    <!-- Goods -->
    <line x1="60" y1="40" x2="140" y2="40" class="image" />
    <line x1="60" y1="70" x2="140" y2="70" class="image" />
    <line x1="60" y1="100" x2="140" y2="100" class="image" />
    <line x1="180" y1="40" x2="260" y2="40" class="image" />
    <line x1="180" y1="70" x2="260" y2="70" class="image" />
    <line x1="180" y1="100" x2="260" y2="100" class="image" />
    <line x1="300" y1="40" x2="380" y2="40" class="image" />
    <line x1="300" y1="70" x2="380" y2="70" class="image" />
    <line x1="300" y1="100" x2="380" y2="100" class="image" />
  </g>
</svg>