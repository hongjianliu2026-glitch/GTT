<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flammable</text>
  <text x="50" y="120" class="subtitle">[ˈflæməbl] adj. 易燃的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flam (火焰) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个易燃的物体，"火焰(flam)"
    <tspan x="50" dy="25">能够轻易地在其上燃烧，这就是易燃的(flammable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Store flammable liquids in a safe place.
  </text>
  <text x="50" y="310" class="content">
    将易燃液体存放在安全的地方。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flammable object -->
    <rect x="0" y="0" width="150" height="150" class="image" />
    <!-- Flame -->
    <polygon points="100,50 125,100 75,100" class="flame" />
    <polygon points="100,75 125,125 75,125" class="flame" />
    <polygon points="100,100 125,150 75,150" class="flame" />
  </g>
</svg>