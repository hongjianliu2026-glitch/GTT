<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vulgar</text>
  <text x="50" y="120" class="subtitle">[ˈvʌlɡər] adj. 粗俗的，庸俗的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vulg (人群) + -ar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人(vulg)在街头大声喧哗，
    <tspan x="50" dy="25">他们的行为显得非常粗俗(vulgar)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His vulgar language shocked everyone in the room.
  </text>
  <text x="50" y="310" class="content">
    他粗俗的语言让房间里的每个人都感到震惊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowd -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Loud noises -->
    <line x1="50" y1="70" x2="50" y2="90" class="image" />
    <line x1="100" y1="70" x2="100" y2="90" class="image" />
    <line x1="150" y1="70" x2="150" y2="90" class="image" />
    <line x1="200" y1="70" x2="200" y2="90" class="image" />
    <line x1="250" y1="70" x2="250" y2="90" class="image" />
    <!-- Street -->
    <line x1="0" y1="100" x2="300" y2="100" class="image" />
    <line x1="0" y1="110" x2="300" y2="110" class="image" />
    <line x1="0" y1="120" x2="300" y2="120" class="image" />
  </g>
</svg>