<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">seven-day</text>
  <text x="50" y="120" class="subtitle">[ˈsevən deɪ] adj. 七天的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> seven (七) + day (天)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个日历上，"七天(seven-day)"
    <tspan x="50" dy="25">的行程安排，从周一到周日，</tspan>
    <tspan x="50" dy="25">每个格子都充满了活动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She planned a seven-day trip to Europe.
  </text>
  <text x="50" y="310" class="content">
    她计划了一次为期七天的欧洲之旅。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Days of the week -->
    <text x="20" y="30" class="content">Mon</text>
    <text x="80" y="30" class="content">Tue</text>
    <text x="140" y="30" class="content">Wed</text>
    <text x="200" y="30" class="content">Thu</text>
    <text x="260" y="30" class="content">Fri</text>
    <text x="320" y="30" class="content">Sat</text>
    <text x="380" y="30" class="content">Sun</text>
    <!-- Activities -->
    <line x1="20" y1="50" x2="380" y2="50" class="image" />
    <line x1="20" y1="80" x2="380" y2="80" class="image" />
    <line x1="20" y1="110" x2="380" y2="110" class="image" />
    <line x1="20" y1="140" x2="380" y2="140" class="image" />
    <line x1="20" y1="170" x2="380" y2="170" class="image" />
    <line x1="20" y1="200" x2="380" y2="200" class="image" />
  </g>
</svg>