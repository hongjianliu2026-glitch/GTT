<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inflationary</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfleɪʃənri] adj. 通货膨胀的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + flate (膨胀) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气球不断膨胀，"进入膨胀(in-flate)"
    <tspan x="50" dy="25">的状态，这就是通货膨胀(inflationary)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government is concerned about the inflationary trend.
  </text>
  <text x="50" y="310" class="content">
    政府对通货膨胀的趋势感到担忧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Inflating -->
    <line x1="100" y1="150" x2="50" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <!-- Money -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <text x="220" y="80" class="content">$</text>
    <rect x="200" y="120" width="100" height="50" class="image" />
    <text x="220" y="150" class="content">$</text>
    <rect x="200" y="190" width="100" height="50" class="image" />
    <text x="220" y="220" class="content">$</text>
  </g>
</svg>