<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">robot</text>
  <text x="50" y="120" class="subtitle">[ˈroʊbɑːt] n. 机器人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> robota (捷克语，意为“劳役、苦工”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机器人(robot)在工厂里辛勤工作，代替人类完成繁重的劳役(robota)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory uses robots to assemble cars.
  </text>
  <text x="50" y="310" class="content">
    这家工厂使用机器人来组装汽车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot body -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Robot head -->
    <circle cx="75" cy="50" r="30" class="image" />
    <!-- Robot arms -->
    <line x1="20" y1="100" x2="0" y2="150" class="image" />
    <line x1="130" y1="100" x2="150" y2="150" class="image" />
    <!-- Robot legs -->
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <!-- Robot details -->
    <circle cx="60" cy="40" r="5" class="image" />
    <circle cx="90" cy="40" r="5" class="image" />
    <line x1="60" y1="60" x2="90" y2="60" class="image" />
  </g>
</svg>