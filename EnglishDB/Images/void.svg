<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">void</text>
  <text x="50" y="120" class="subtitle">[vɔɪd] n. 空虚，空白；adj. 无效的，空的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> voi- (空)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的黑洞，"吞噬一切(voi-d)"，
    <tspan x="50" dy="25">周围的一切都被吸入其中，只剩下无尽的空虚(void)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The contract was declared void by the court.
  </text>
  <text x="50" y="310" class="content">
    法院宣布该合同无效。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Black hole -->
    <circle cx="175" cy="100" r="70" class="image" fill="#000" />
    <!-- Stars being sucked in -->
    <circle cx="100" cy="50" r="5" class="image" fill="#FFF" />
    <circle cx="250" cy="50" r="5" class="image" fill="#FFF" />
    <circle cx="50" cy="150" r="5" class="image" fill="#FFF" />
    <circle cx="300" cy="150" r="5" class="image" fill="#FFF" />
    <!-- Lines indicating suction -->
    <line x1="100" y1="50" x2="175" y2="100" class="image" stroke-dasharray="5,5" />
    <line x1="250" y1="50" x2="175" y2="100" class="image" stroke-dasharray="5,5" />
    <line x1="50" y1="150" x2="175" y2="100" class="image" stroke-dasharray="5,5" />
    <line x1="300" y1="150" x2="175" y2="100" class="image" stroke-dasharray="5,5" />
  </g>
</svg>