<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Georgian</text>
  <text x="50" y="120" class="subtitle">[dʒɔːˈdʒiən] adj. 格鲁吉亚的；n. 格鲁吉亚人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Georg (乔治) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着传统服饰的格鲁吉亚人，站在一片美丽的山脉前，
    <tspan x="50" dy="25">他的名字叫乔治(Georg)，代表着格鲁吉亚(Georgian)的文化和历史。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Georgian architecture is famous for its unique style.
  </text>
  <text x="50" y="310" class="content">
    格鲁吉亚建筑以其独特的风格而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountains -->
    <polyline points="0,150 50,100 100,150 150,100 200,150 250,100 300,150" class="image" />
    <!-- Person -->
    <circle cx="150" cy="80" r="15" class="image" />
    <line x1="150" y1="95" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="130" y2="160" class="image" />
    <line x1="150" y1="130" x2="170" y2="160" class="image" />
    <line x1="150" y1="110" x2="120" y2="100" class="image" />
    <line x1="150" y1="110" x2="180" y2="100" class="image" />
    <!-- Traditional clothing -->
    <rect x="135" y="95" width="30" height="35" class="image" />
    <line x1="150" y1="95" x2="150" y2="130" class="image" />
  </g>
</svg>