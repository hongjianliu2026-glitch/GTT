<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hippie</text>
  <text x="50" y="120" class="subtitle">[ˈhɪpi] n. 嬉皮士</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hippie 源自 "hip"，意为"时髦的"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着花哨衣服、留着长发的人，
    <tspan x="50" dy="25">他/她就是"时髦的(hip)"嬉皮士(hippie)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hippie movement of the 1960s was known for its counterculture.
  </text>
  <text x="50" y="310" class="content">
    20世纪60年代的嬉皮士运动以其反主流文化而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="50" cy="50" r="30" class="image" />
    <!-- Hair -->
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <line x1="20" y1="40" x2="80" y2="40" class="image" />
    <line x1="20" y1="30" x2="80" y2="30" class="image" />
    <!-- Flower shirt -->
    <rect x="0" y="80" width="100" height="100" class="image" />
    <circle cx="20" cy="100" r="10" class="image" />
    <circle cx="40" cy="120" r="10" class="image" />
    <circle cx="60" cy="100" r="10" class="image" />
    <circle cx="80" cy="120" r="10" class="image" />
    <!-- Bell-bottom pants -->
    <rect x="20" y="180" width="60" height="80" class="image" />
    <line x1="20" y1="260" x2="0" y2="300" class="image" />
    <line x1="80" y1="260" x2="100" y2="300" class="image" />
  </g>
</svg>