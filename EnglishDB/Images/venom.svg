<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .venom { fill: #8E44AD; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">venom</text>
  <text x="50" y="120" class="subtitle">[ˈvɛnəm] n. 毒液，恶意</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ven- (来) + -om (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条蛇从洞穴中"出来(ven-)"，
    <tspan x="50" dy="25">吐出致命的"毒液(venom)"，让人不寒而栗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snake's venom can be fatal if not treated immediately.
  </text>
  <text x="50" y="310" class="content">
    如果不立即治疗，蛇的毒液可能是致命的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snake -->
    <path d="M0 100 C 50 50, 150 50, 200 100 S 250 150, 300 100" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="150" class="image" />
    <line x1="280" y1="130" x2="320" y2="130" class="image" />
    <!-- Venom droplet -->
    <circle cx="250" cy="120" r="10" class="venom" />
    <line x1="250" y1="130" x2="250" y2="150" class="venom" />
  </g>
</svg>