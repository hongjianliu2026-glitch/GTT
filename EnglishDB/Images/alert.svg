<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">alert</text>
  <text x="50" y="120" class="subtitle">[əˈlɜːrt] adj. 警觉的，警惕的；v. 使警觉，使警惕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (加强) + ert (惊动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫在黑暗中，突然听到"惊动(ert)"的声音，
    <tspan x="50" dy="25">立刻"加强(al-)"警觉，竖起耳朵，准备应对任何威胁。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The security guard was alert to any suspicious activity.
  </text>
  <text x="50" y="310" class="content">
    保安对任何可疑活动都保持警觉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Tail -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Tail -->
    <!-- Ears -->
    <line x1="35" y1="70" x2="50" y2="90" class="image" />
    <line x1="65" y1="70" x2="50" y2="90" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="95" r="5" class="image" />
    <circle cx="60" cy="95" r="5" class="image" />
    <!-- Alert symbol -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
  </g>
</svg>