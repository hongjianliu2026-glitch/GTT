<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mortgage</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrɡɪdʒ] n. 抵押贷款</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mort (死亡) + gage (抵押)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人为了买房，"抵押(gage)"了自己的未来，
    <tspan x="50" dy="25">仿佛"死亡(mort)"般沉重，这就是抵押贷款(mortgage)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He took out a mortgage to buy his first house.
  </text>
  <text x="50" y="310" class="content">
    他申请了抵押贷款来购买他的第一套房子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <line x1="60" y1="20" x2="60" y2="0" class="image" />
    <line x1="140" y1="20" x2="140" y2="0" class="image" />
    <!-- Crossbones -->
    <line x1="220" y1="20" x2="260" y2="60" class="image" />
    <line x1="260" y1="20" x2="220" y2="60" class="image" />
    <!-- Chain -->
    <line x1="240" y1="70" x2="240" y2="150" class="image" />
    <circle cx="240" cy="80" r="5" class="image" />
    <circle cx="240" cy="100" r="5" class="image" />
    <circle cx="240" cy="120" r="5" class="image" />
    <circle cx="240" cy="140" r="5" class="image" />
  </g>
</svg>