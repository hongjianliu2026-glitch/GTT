<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trajectory</text>
  <text x="50" y="120" class="subtitle">[trəˈdʒɛktəri] n. 轨迹，弹道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tra- (穿过) + ject (投掷) + -ory (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个火箭"穿过(tra-)"天空，"投掷(ject)"出一条明显的路径，
    <tspan x="50" dy="25">这条路径就是它的轨迹(trajectory)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The satellite's trajectory was carefully calculated.
  </text>
  <text x="50" y="310" class="content">
    卫星的轨迹经过了精心计算。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rocket -->
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="250" y2="150" class="image" />
    <!-- Trajectory path -->
    <path d="M50,150 Q100,100 150,50 T250,150" class="image" />
    <!-- Stars -->
    <circle cx="70" cy="130" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <circle cx="200" cy="100" r="5" class="image" />
  </g>
</svg>