<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">broadcaster</text>
  <text x="50" y="120" class="subtitle">[ˈbrɔːdkæstər] n. 广播员，播音员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> broad (宽广) + cast (投掷) + er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个广播员站在宽广的舞台上，"投掷(cast)"
    <tspan x="50" dy="25">声音到四面八方，让所有人都听到他的广播(broadcaster)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The broadcaster announced the news at 6 PM.
  </text>
  <text x="50" y="310" class="content">
    广播员在下午6点宣布了新闻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Broadcaster -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="150" y2="190" class="image" />
    <line x1="175" y1="160" x2="200" y2="190" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
    <!-- Microphone -->
    <line x1="175" y1="120" x2="175" y2="50" class="image" />
    <circle cx="175" cy="40" r="10" class="image" />
    <!-- Sound waves -->
    <line x1="175" y1="40" x2="100" y2="0" class="image" />
    <line x1="175" y1="40" x2="250" y2="0" class="image" />
    <line x1="175" y1="40" x2="300" y2="-50" class="image" />
  </g>
</svg>