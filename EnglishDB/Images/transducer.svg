<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transducer</text>
  <text x="50" y="120" class="subtitle">[trænsˈdjuːsər] n. 传感器，转换器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + duce (引导) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神奇的装置，它能够"跨越(trans-)"不同领域，"引导(duce)"能量或信号的转换，
    <tspan x="50" dy="25">这个装置就是传感器(transducer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The transducer converts sound waves into electrical signals.
  </text>
  <text x="50" y="310" class="content">
    传感器将声波转换为电信号。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Transducer device -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Signal lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <!-- Transducer symbol -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="130" x2="175" y2="170" class="image" />
    <line x1="155" y1="150" x2="195" y2="150" class="image" />
    <!-- Arrows indicating conversion -->
    <polygon points="100,100 120,110 100,120" class="image" />
    <polygon points="250,100 230,110 250,120" class="image" />
  </g>
</svg>