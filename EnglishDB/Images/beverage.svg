<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beverage</text>
  <text x="50" y="120" class="subtitle">[ˈbɛvərɪdʒ] n. 饮料</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + verb (喝)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个炎热的夏日，你口渴难耐，"使劲喝(be-verb)"
    <tspan x="50" dy="25">一杯冰凉的饮料(beverage)，瞬间解渴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She ordered a refreshing beverage at the café.
  </text>
  <text x="50" y="310" class="content">
    她在咖啡馆点了一杯清爽的饮料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass of beverage -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="25" y="25" width="100" height="150" class="image" />
    <!-- Ice cubes -->
    <rect x="40" y="40" width="20" height="20" class="image" />
    <rect x="70" y="40" width="20" height="20" class="image" />
    <rect x="40" y="70" width="20" height="20" class="image" />
    <rect x="70" y="70" width="20" height="20" class="image" />
    <!-- Straw -->
    <line x1="100" y1="25" x2="100" y2="175" class="image" />
    <line x1="95" y1="30" x2="105" y2="30" class="image" />
    <line x1="95" y1="170" x2="105" y2="170" class="image" />
  </g>
</svg>