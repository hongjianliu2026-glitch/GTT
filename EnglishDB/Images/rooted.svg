<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rooted</text>
  <text x="50" y="120" class="subtitle">[ˈruːtɪd] adj. 根深蒂固的，扎根的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> root (根) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树，它的根深深地"扎根(rooted)"
    <tspan x="50" dy="25">在土壤中，象征着某种观念或习惯的根深蒂固。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her love for music was deeply rooted in her childhood.
  </text>
  <text x="50" y="310" class="content">
    她对音乐的热爱深深植根于她的童年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="150" y="0" width="50" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="175" y1="20" x2="100" y2="100" class="image" />
    <line x1="175" y1="20" x2="250" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="100" class="image" />
    <!-- Tree roots -->
    <line x1="175" y1="200" x2="100" y2="280" class="image" />
    <line x1="175" y1="200" x2="250" y2="280" class="image" />
    <line x1="175" y1="200" x2="175" y2="280" class="image" />
    <!-- Soil -->
    <rect x="0" y="280" width="350" height="50" class="image" />
  </g>
</svg>