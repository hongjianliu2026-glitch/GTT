<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">raccoon</text>
  <text x="50" y="120" class="subtitle">[rəˈkuːn] n. 浣熊</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rac (拉丁语“手”) + coon (拟声词，表示动物的叫声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只浣熊用它灵巧的“手(rac)”在水中洗食物，发出“coon”的声音，
    <tspan x="50" dy="25">这个画面让人印象深刻，浣熊也因此得名。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The raccoon was playing with a piece of food in the water.
  </text>
  <text x="50" y="310" class="content">
    那只浣熊正在水中玩弄一块食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Raccoon face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="10" class="image" />
    <circle cx="120" cy="90" r="10" class="image" />
    <!-- Nose -->
    <circle cx="100" cy="110" r="8" class="image" />
    <!-- Ears -->
    <circle cx="70" cy="70" r="15" class="image" />
    <circle cx="130" cy="70" r="15" class="image" />
    <!-- Water -->
    <rect x="50" y="150" width="100" height="50" class="image" />
    <!-- Food -->
    <rect x="90" y="160" width="20" height="20" class="image" />
  </g>
</svg>