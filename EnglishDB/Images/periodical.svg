<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">periodical</text>
  <text x="50" y="120" class="subtitle">[ˌpɪriˈɑːdɪkl] n. 期刊，杂志；adj. 周期的，定期的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peri- (周围，周期) + od (路程) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个邮递员骑着自行车，"定期(peri-od)"
    <tspan x="50" dy="25">绕着小镇送杂志(periodical)，每到一个路口就投递一本。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She subscribes to several periodicals on gardening.
  </text>
  <text x="50" y="310" class="content">
    她订阅了几本关于园艺的期刊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mailman -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Bicycle -->
    <rect x="0" y="180" width="60" height="20" class="image" />
    <circle cx="20" cy="200" r="10" class="image" />
    <circle cx="50" cy="200" r="10" class="image" />
    <!-- Magazines -->
    <rect x="70" y="100" width="30" height="40" class="image" />
    <rect x="110" y="100" width="30" height="40" class="image" />
    <rect x="150" y="100" width="30" height="40" class="image" />
    <!-- Road -->
    <line x1="0" y1="220" x2="200" y2="220" class="image" />
    <line x1="50" y1="220" x2="50" y2="240" class="image" />
    <line x1="100" y1="220" x2="100" y2="240" class="image" />
    <line x1="150" y1="220" x2="150" y2="240" class="image" />
  </g>
</svg>