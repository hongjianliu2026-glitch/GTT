<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">curricular</text>
  <text x="50" y="120" class="subtitle">[kəˈrɪkjələr] adj. 课程的，与课程相关的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> curricul(um) (课程) + -ar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在教室里，"按照课程(curricul-ar)"
    <tspan x="50" dy="25">表上的安排，认真学习每一门课。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The curricular activities are designed to enhance students' learning.
  </text>
  <text x="50" y="310" class="content">
    这些课程活动旨在增强学生的学习效果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Student -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Desk -->
    <rect x="30" y="150" width="40" height="30" class="image" />
    <!-- Books -->
    <rect x="100" y="20" width="50" height="160" class="image" />
    <rect x="160" y="20" width="50" height="160" class="image" />
    <rect x="220" y="20" width="50" height="160" class="image" />
    <!-- Curriculum -->
    <rect x="280" y="20" width="50" height="160" class="image" />
    <line x1="290" y1="40" x2="320" y2="40" class="image" />
    <line x1="290" y1="70" x2="320" y2="70" class="image" />
    <line x1="290" y1="100" x2="320" y2="100" class="image" />
    <line x1="290" y1="130" x2="320" y2="130" class="image" />
  </g>
</svg>