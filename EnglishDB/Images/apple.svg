<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .apple { fill: #FF4500; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">apple</text>
  <text x="50" y="120" class="subtitle">[ˈæpl] n. 苹果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "appel"，
    <tspan x="50" dy="25">可能来自古英语 "æppel"，意为“苹果”。</tspan>
  </text>

  <!-- Story -->
  <text x="50" y="230" class="story">
    想象一个巨大的苹果树，树上挂满了红彤彤的苹果，
    <tspan x="50" dy="25">每个苹果都像一个小太阳，照亮了整个果园。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> She picked a ripe apple from the tree.
  </text>
  <text x="50" y="330" class="content">
    她从树上摘了一个熟透的苹果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apple tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <!-- Apples -->
    <circle cx="100" cy="50" r="20" class="apple" />
    <circle cx="150" cy="70" r="20" class="apple" />
    <circle cx="50" cy="100" r="20" class="apple" />
    <circle cx="120" cy="130" r="20" class="apple" />
    <circle cx="80" cy="160" r="20" class="apple" />
  </g>
</svg>