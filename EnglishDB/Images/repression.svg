<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">repression</text>
  <text x="50" y="120" class="subtitle">[rɪˈprɛʃən] n. 压抑，镇压</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + press (压) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手掌"再次压下(re-press)"，
    <tspan x="50" dy="25">试图压制住内心的情感或反抗的力量，这就是压抑(repression)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government's repression of the protest was brutal.
  </text>
  <text x="50" y="310" class="content">
    政府对抗议活动的镇压是残酷的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant hand pressing down -->
    <path d="M0 0 L100 0 L100 100 L0 100 Z" class="image" />
    <path d="M50 100 L50 200" class="image" />
    <path d="M50 150 L20 180" class="image" />
    <path d="M50 150 L80 180" class="image" />
    <path d="M50 150 L100 120" class="image" />
    <path d="M50 150 L0 120" class="image" />
    <!-- Small figure being pressed -->
    <circle cx="50" cy="250" r="15" class="image" />
    <line x1="50" y1="265" x2="50" y2="300" class="image" />
    <line x1="50" y1="300" x2="30" y2="330" class="image" />
    <line x1="50" y1="300" x2="70" y2="330" class="image" />
    <line x1="50" y1="280" x2="80" y2="270" class="image" />
  </g>
</svg>