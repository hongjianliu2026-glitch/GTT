<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outcome</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtkʌm] n. 结果，成果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (外面) + come (来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个实验结束后，"从外面(out-)来(come)"
    <tspan x="50" dy="25">的结果，这个结果就是实验的outcome。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outcome of the election was unexpected.
  </text>
  <text x="50" y="310" class="content">
    选举的结果出乎意料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Experiment setup -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Beaker -->
    <ellipse cx="100" cy="100" rx="50" ry="70" class="image" />
    <!-- Flask -->
    <rect x="150" y="30" width="100" height="140" class="image" />
    <!-- Result -->
    <circle cx="300" cy="100" r="30" class="image" />
    <text x="285" y="105" class="content" fill="#2C3E50">Result</text>
  </g>
</svg>