<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">windowless</text>
  <text x="50" y="120" class="subtitle">[ˈwɪndoʊləs] adj. 无窗的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> window (窗户) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间，"没有窗户(windowless)"，
    <tspan x="50" dy="25">里面一片漆黑，只有一盏灯在闪烁。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old building had several windowless rooms.
  </text>
  <text x="50" y="310" class="content">
    那栋老建筑有几个无窗的房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="250" class="image" />
    <!-- Door -->
    <rect x="150" y="180" width="50" height="70" class="image" />
    <!-- Light -->
    <circle cx="250" cy="100" r="20" class="image" fill="#F39C12" />
    <!-- Light rays -->
    <line x1="250" y1="120" x2="250" y2="250" class="image" stroke-dasharray="5,5" />
    <line x1="230" y1="140" x2="100" y2="250" class="image" stroke-dasharray="5,5" />
    <line x1="270" y1="140" x2="400" y2="250" class="image" stroke-dasharray="5,5" />
  </g>
</svg>