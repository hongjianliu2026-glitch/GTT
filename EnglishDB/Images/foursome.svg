<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foursome</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrsəm] n. 四人一组，四人组</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> four (四) + some (一些)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个高尔夫球场上有四个人，他们组成了一个"四人组(foursome)"，
    <tspan x="50" dy="25">每个人都在挥杆，场面热闹非凡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to form a foursome for the golf tournament.
  </text>
  <text x="50" y="310" class="content">
    他们决定组成一个四人组参加高尔夫锦标赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Golfers -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="50" cy="150" r="20" class="image" />
    <circle cx="150" cy="150" r="20" class="image" />
    <!-- Golf clubs -->
    <line x1="50" y1="70" x2="30" y2="100" class="image" />
    <line x1="150" y1="70" x2="130" y2="100" class="image" />
    <line x1="50" y1="170" x2="30" y2="200" class="image" />
    <line x1="150" y1="170" x2="130" y2="200" class="image" />
    <!-- Golf ball -->
    <circle cx="100" cy="100" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>