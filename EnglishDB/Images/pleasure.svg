<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pleasure</text>
  <text x="50" y="120" class="subtitle">[ˈplɛʒər] n. 愉快，快乐；v. 使高兴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pl(e) (充满) + as (去) + ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"充满(pl)"了"快乐(as)"，
    <tspan x="50" dy="25">这种感觉就是"愉快(pleasure)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It gives me great pleasure to see you happy.
  </text>
  <text x="50" y="310" class="content">
    看到你快乐，我感到非常愉快。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Happy face -->
    <circle cx="100" cy="100" r="80" class="image" fill="#F1C40F" />
    <circle cx="60" cy="70" r="10" class="image" fill="#000" />
    <circle cx="140" cy="70" r="10" class="image" fill="#000" />
    <path d="M60 130 Q100 160 140 130" class="image" fill="none" stroke="#000" stroke-width="5" />
  </g>
</svg>