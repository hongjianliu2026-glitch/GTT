<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vacationer</text>
  <text x="50" y="120" class="subtitle">[vəˈkeɪʃənər] n. 度假者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vac (空) + -ation (名词后缀) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个度假者(vacationer)在海滩上，"空出(vac)"
    <tspan x="50" dy="25">时间来享受假期，放松身心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vacationer enjoyed the sunny beach.
  </text>
  <text x="50" y="310" class="content">
    这位度假者享受着阳光明媚的海滩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beach -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Vacationer -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Beach chair -->
    <line x1="80" y1="150" x2="120" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="130" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
  </g>
</svg>