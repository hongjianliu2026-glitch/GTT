<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dedication</text>
  <text x="50" y="120" class="subtitle">[ˌdedɪˈkeɪʃn] n. 奉献，献身</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + dic (说) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人跪在地上，"向下说(de-dic)"
    <tspan x="50" dy="25">出自己的誓言，表达对某事的献身(dedication)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her dedication to the project was evident in her long hours.
  </text>
  <text x="50" y="310" class="content">
    她对项目的奉献精神体现在她长时间的工作中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person kneeling -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <!-- Heart symbol -->
    <path d="M100,100 C110,80 130,80 140,100 L120,120 Z" class="image" />
    <!-- Speech bubble -->
    <path d="M100,150 Q150,140 200,150 Q150,160 100,150 Z" class="image" />
    <text x="120" y="160" class="content">"I dedicate myself to this cause."</text>
  </g>
</svg>