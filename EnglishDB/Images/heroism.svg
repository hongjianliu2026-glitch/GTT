<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heroism</text>
  <text x="50" y="120" class="subtitle">[ˈhɪərəʊɪzəm] n. 英雄主义，英勇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hero (英雄) + -ism (表示“主义”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个英雄(hero)站在悬崖边，面对巨龙，
    <tspan x="50" dy="25">他的勇气和决心体现了英雄主义(heroism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His heroism saved the entire village from the flood.
  </text>
  <text x="50" y="310" class="content">
    他的英勇拯救了整个村庄免受洪水侵袭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hero -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Dragon -->
    <path d="M150,100 C180,50 250,50 280,100" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="280" y1="100" x2="280" y2="150" class="image" />
    <line x1="215" y1="100" x2="215" y2="150" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="280" cy="150" r="10" class="image" />
    <circle cx="215" cy="150" r="10" class="image" />
    <!-- Cliff -->
    <path d="M0,250 L300,250 L250,300 L50,300 Z" class="image" />
  </g>
</svg>