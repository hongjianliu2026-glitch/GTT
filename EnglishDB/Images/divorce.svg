<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">divorce</text>
  <text x="50" y="120" class="subtitle">[dɪˈvɔːrs] n. 离婚；v. 使离婚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + vorce (结合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一对夫妻原本"结合(vorce)"在一起，
    <tspan x="50" dy="25">但最终"分开(di-)"了，这就是离婚(divorce)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to divorce after years of conflict.
  </text>
  <text x="50" y="310" class="content">
    经过多年的冲突，他们决定离婚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Couple -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <!-- Broken heart -->
    <path d="M 50 120 Q 100 150 150 120" class="image" />
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <!-- Separating lines -->
    <line x1="100" y1="100" x2="100" y2="200" class="image" />
    <line x1="0" y1="150" x2="200" y2="150" class="image" />
  </g>
</svg>