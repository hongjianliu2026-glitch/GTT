<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anthology</text>
  <text x="50" y="120" class="subtitle">[ænˈθɒlədʒi] n. 诗集，文选</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> antho- (花) + -logy (学说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本厚厚的书，里面"收集了(antho-)"
    <tspan x="50" dy="25">各种"花朵(antho)"般的诗篇和文章，</tspan>
    <tspan x="50" dy="25">就像一本"花学说(-logy)"，</tspan>
    <tspan x="50" dy="25">这就是诗集(anthology)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> She published an anthology of her favorite poems.
  </text>
  <text x="50" y="330" class="content">
    她出版了一本她最喜欢的诗集。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Book -->
    <rect x="0" y="0" width="300" height="400" class="image" />
    <!-- Pages -->
    <line x1="50" y1="0" x2="50" y2="400" class="image" />
    <line x1="100" y1="0" x2="100" y2="400" class="image" />
    <line x1="150" y1="0" x2="150" y2="400" class="image" />
    <line x1="200" y1="0" x2="200" y2="400" class="image" />
    <line x1="250" y1="0" x2="250" y2="400" class="image" />
    <!-- Flowers -->
    <circle cx="75" cy="75" r="20" class="image" />
    <circle cx="125" cy="125" r="20" class="image" />
    <circle cx="175" cy="175" r="20" class="image" />
    <circle cx="225" cy="225" r="20" class="image" />
    <circle cx="275" cy="275" r="20" class="image" />
  </g>
</svg>