<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rationalization</text>
  <text x="50" y="120" class="subtitle">[ˌræʃənəlaɪˈzeɪʃən] n. 合理化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ratio (理性) + -al (形容词后缀) + -ize (使动) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在用"理性(ratio)"的思维，"使(ize)"
    <tspan x="50" dy="25">一切变得"合理(-ation)"，这就是合理化(rationalization)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He tried to rationalize his decision by listing all the pros and cons.
  </text>
  <text x="50" y="310" class="content">
    他试图通过列出所有的利弊来合理化他的决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Thought bubbles -->
    <ellipse cx="150" cy="50" rx="30" ry="20" class="image" />
    <ellipse cx="200" cy="70" rx="25" ry="15" class="image" />
    <ellipse cx="250" cy="90" rx="20" ry="10" class="image" />
    <!-- Rationalization process -->
    <line x1="100" y1="150" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="300" y2="200" class="image" />
    <line x1="300" y1="200" x2="250" y2="250" class="image" />
    <line x1="300" y1="200" x2="350" y2="250" class="image" />
    <!-- Rationalized result -->
    <rect x="200" y="250" width="100" height="50" class="image" />
    <text x="220" y="280" class="content">合理</text>
  </g>
</svg>