<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thirty-three</text>
  <text x="50" y="120" class="subtitle">[ˈθɜːrti θriː] n. 三十三</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thirty (三十) + three (三)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“33”，它由两个“3”组成，
    <tspan x="50" dy="25">每个“3”都像一个旋转的螺旋，象征着无限循环和重复。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He turned thirty-three last month.
  </text>
  <text x="50" y="310" class="content">
    他上个月满三十三岁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number "33" -->
    <text x="0" y="100" font-size="200" fill="#E74C3C">33</text>
    <!-- Spirals -->
    <path d="M50,100 C50,50 150,50 150,100 C150,150 50,150 50,100 Z" class="image" />
    <path d="M250,100 C250,50 350,50 350,100 C350,150 250,150 250,100 Z" class="image" />
  </g>
</svg>