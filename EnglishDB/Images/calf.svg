<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">calf</text>
  <text x="50" y="120" class="subtitle">[kæf] n. 小牛，小腿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "calf"，意为“小牛”，后引申为“小腿”。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只可爱的小牛(calf)在草地上跳跃，它的腿(calf)强壮而灵活，
    <tspan x="50" dy="25">就像你跑步时的小腿一样有力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer raised a healthy calf in his barn.
  </text>
  <text x="50" y="310" class="content">
    农夫在他的谷仓里养了一只健康的小牛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calf -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="150" class="image" />
    <line x1="100" y1="180" x2="150" y2="150" class="image" />
    <!-- Grass -->
    <rect x="0" y="300" width="300" height="50" class="image" />
  </g>
</svg>