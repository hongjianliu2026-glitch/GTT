<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">methodological</text>
  <text x="50" y="120" class="subtitle">[ˌmɛθədəˈlɑdʒɪkəl] adj. 方法论的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> method (方法) + -o- (连接词) + logy (学科) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学者在研究室里，"系统地(method)"
    <tspan x="50" dy="25">整理和分析(logy)各种研究方法，</tspan>
    <tspan x="50" dy="25">这些方法就构成了方法论(methodological)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The professor presented a methodological approach to solving the problem.
  </text>
  <text x="50" y="310" class="content">
    教授提出了一种解决问题的系统方法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scholar -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="60" y="30" width="80" height="140" class="image" />
    <rect x="70" y="40" width="60" height="120" class="image" />
    <!-- Methodology -->
    <line x1="170" y1="50" x2="280" y2="50" class="image" />
    <line x1="170" y1="80" x2="250" y2="80" class="image" />
    <line x1="170" y1="110" x2="270" y2="110" class="image" />
    <line x1="170" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>