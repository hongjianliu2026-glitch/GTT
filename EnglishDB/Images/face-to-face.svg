<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">face-to-face</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪs tu ˈfeɪs] adj. 面对面的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> face (脸) + to (向) + face (脸)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面站着，他们的脸几乎贴在一起，
    <tspan x="50" dy="25">这种直接的交流方式就是"face-to-face"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to have a face-to-face meeting to discuss the project.
  </text>
  <text x="50" y="310" class="content">
    他们决定面对面开会讨论这个项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- First face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <circle cx="180" cy="80" r="5" class="image" />
    <path d="M120 120 Q150 140 180 120" class="image" />

    <!-- Second face -->
    <circle cx="300" cy="100" r="50" class="image" />
    <circle cx="320" cy="80" r="5" class="image" />
    <circle cx="380" cy="80" r="5" class="image" />
    <path d="M320 120 Q350 140 380 120" class="image" />

    <!-- Line connecting faces -->
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>