<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flower { fill: #FF6F61; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wreath</text>
  <text x="50" y="120" class="subtitle">[riːθ] n. 花环，花圈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wr- (扭曲) + -eath (环)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个花匠用鲜花"扭曲(wr-)"成一个美丽的环形花环(wreath)，
    <tspan x="50" dy="25">这个花环象征着美好和纪念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a wreath of roses on her head.
  </text>
  <text x="50" y="310" class="content">
    她头上戴着一顶玫瑰花环。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wreath circle -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Flowers -->
    <circle cx="100" cy="50" r="15" class="flower" />
    <circle cx="250" cy="50" r="15" class="flower" />
    <circle cx="75" cy="120" r="15" class="flower" />
    <circle cx="275" cy="120" r="15" class="flower" />
    <circle cx="175" cy="150" r="15" class="flower" />
  </g>
</svg>