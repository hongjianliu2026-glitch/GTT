<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beater</text>
  <text x="50" y="120" class="subtitle">[ˈbiːtər] n. 搅拌器，打蛋器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> beat (打) + -er (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师拿着一个"打蛋器(beater)"，
    <tspan x="50" dy="25">在碗里疯狂地"打(beat)"鸡蛋，</tspan>
    <tspan x="50" dy="25">鸡蛋液在空中飞溅，形成了一幅夸张的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a beater to mix the batter.
  </text>
  <text x="50" y="310" class="content">
    她用打蛋器搅拌面糊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bowl -->
    <ellipse cx="200" cy="250" rx="150" ry="100" class="image" />
    <!-- Beater -->
    <line x1="100" y1="150" x2="300" y2="150" class="image" />
    <line x1="100" y1="170" x2="300" y2="170" class="image" />
    <line x1="100" y1="190" x2="300" y2="190" class="image" />
    <!-- Egg splatter -->
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="300" cy="120" r="15" class="image" />
    <circle cx="280" cy="80" r="10" class="image" />
    <!-- Chef -->
    <circle cx="50" cy="200" r="20" class="image" />
    <line x1="50" y1="220" x2="50" y2="280" class="image" />
    <line x1="50" y1="280" x2="30" y2="320" class="image" />
    <line x1="50" y1="280" x2="70" y2="320" class="image" />
    <line x1="50" y1="250" x2="100" y2="240" class="image" />
  </g>
</svg>