<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mixing</text>
  <text x="50" y="120" class="subtitle">[ˈmɪksɪŋ] v. 混合，搅拌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mix (混合) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"不停地搅拌(mix-ing)"
    <tspan x="50" dy="25">各种食材，直到它们完美融合。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She enjoys mixing different ingredients to create new dishes.
  </text>
  <text x="50" y="310" class="content">
    她喜欢混合不同的食材来创造新菜肴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Ingredients -->
    <circle cx="100" cy="50" r="20" class="image" />
    <rect x="200" y="30" width="30" height="40" class="image" />
    <line x1="150" y1="80" x2="200" y2="80" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="120" x2="200" y2="120" class="image" />
    <!-- Chef -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="180" x2="30" y2="190" class="image" />
    <line x1="50" y1="180" x2="70" y2="190" class="image" />
    <line x1="50" y1="200" x2="30" y2="220" class="image" />
    <line x1="50" y1="200" x2="70" y2="220" class="image" />
    <!-- Spoon -->
    <line x1="100" y1="150" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
  </g>
</svg>