<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deformed</text>
  <text x="50" y="120" class="subtitle">[dɪˈfɔrmd] adj. 畸形的，变形的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下，离开) + form (形状)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原本完美的形状被"向下拉离(de-form)"
    <tspan x="50" dy="25">原本的形态，变成了一个畸形的形状(deformed)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sculpture was deformed by the earthquake.
  </text>
  <text x="50" y="310" class="content">
    地震使雕塑变形了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Original shape -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Deformed shape -->
    <ellipse cx="250" cy="100" rx="70" ry="40" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,80 220,100 200,120" class="image" />
    <!-- Text annotations -->
    <text x="80" y="200" class="content">Original Shape</text>
    <text x="230" y="200" class="content">Deformed Shape</text>
  </g>
</svg>