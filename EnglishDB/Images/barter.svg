<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">barter</text>
  <text x="50" y="120" class="subtitle">[ˈbɑːrtər] v. 以物易物，交换</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> barter源自中古英语barat，意为“交换”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人站在市场上，互相交换<tspan x="50" dy="25">手中的物品，这就是“以物易物(barter)”的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They bartered goods with the villagers.
  </text>
  <text x="50" y="310" class="content">
    他们与村民们交换了货物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person 1 -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Person 2 -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="190" class="image" />
    <line x1="300" y1="160" x2="320" y2="190" class="image" />
    <line x1="300" y1="140" x2="340" y2="130" class="image" />
    <!-- Goods -->
    <rect x="100" y="80" width="50" height="50" class="image" />
    <rect x="250" y="80" width="50" height="50" class="image" />
    <!-- Exchange arrows -->
    <line x1="150" y1="105" x2="250" y2="105" class="image" />
    <line x1="250" y1="105" x2="250" y2="95" class="image" />
    <line x1="250" y1="95" x2="150" y2="95" class="image" />
    <line x1="150" y1="95" x2="150" y2="105" class="image" />
  </g>
</svg>