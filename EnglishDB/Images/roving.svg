<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">roving</text>
  <text x="50" y="120" class="subtitle">[ˈroʊvɪŋ] adj. 流浪的，漂泊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rov (流浪) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个流浪者，背着行囊，"四处流浪(rov-ing)"，
    <tspan x="50" dy="25">他的足迹遍布各地，象征着漂泊的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roving reporter covered stories from all over the world.
  </text>
  <text x="50" y="310" class="content">
    这位流浪的记者报道了世界各地的故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Backpack -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Person -->
    <circle cx="100" cy="120" r="20" class="image" />
    <line x1="100" y1="140" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="160" x2="140" y2="150" class="image" />
    <!-- Path -->
    <line x1="50" y1="240" x2="350" y2="240" class="image" />
    <line x1="50" y1="240" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="150" y2="240" class="image" />
    <line x1="150" y1="240" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="250" y2="240" class="image" />
    <line x1="250" y1="240" x2="300" y2="220" class="image" />
    <line x1="300" y1="220" x2="350" y2="240" class="image" />
  </g>
</svg>