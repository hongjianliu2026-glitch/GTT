<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">concentration</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnsənˈtreɪʃn] n. 集中，专注；浓度</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + centr (中心) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人把所有的注意力"集中(con-)"到"中心(centr)"，
    <tspan x="50" dy="25">就像所有的光线汇聚到一个点，这就是专注(concentration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She needs complete concentration to solve the puzzle.
  </text>
  <text x="50" y="310" class="content">
    她需要全神贯注才能解开这个谜题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Light rays converging -->
    <line x1="0" y1="0" x2="200" y2="200" class="image" />
    <line x1="0" y1="50" x2="200" y2="150" class="image" />
    <line x1="0" y1="100" x2="200" y2="100" class="image" />
    <line x1="0" y1="150" x2="200" y2="50" class="image" />
    <line x1="0" y1="200" x2="200" y2="0" class="image" />
    <!-- Central point -->
    <circle cx="200" cy="200" r="10" class="image" />
    <!-- Person focusing -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="180" y2="170" class="image" />
  </g>
</svg>