<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .crimson { fill: #DC143C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crimson</text>
  <text x="50" y="120" class="subtitle">[ˈkrɪmzn] adj. 深红色的；n. 深红色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crim (红色) + son (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个深红色的声音(crim-son)，
    <tspan x="50" dy="25">它像血一样红，发出深沉而有力的声音。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sky turned crimson at sunset.
  </text>
  <text x="50" y="310" class="content">
    日落时天空变成了深红色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crimson circle -->
    <circle cx="100" cy="100" r="80" class="crimson" />
    <!-- Sound waves -->
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <line x1="70" y1="200" x2="130" y2="200" class="image" />
    <line x1="50" y1="220" x2="150" y2="220" class="image" />
    <line x1="30" y1="240" x2="170" y2="240" class="image" />
  </g>
</svg>