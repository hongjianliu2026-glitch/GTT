<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #922B21; }
      .subtitle { font: italic 24px serif; fill: #7B7D7D; }
      .content { font: 18px sans-serif; fill: #515A5A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #7D3C98; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hopelessness</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊplɪsnəs] n. 绝望，无望</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hope (希望) + -less (无) + -ness (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"无希望(hopeless)"
    <tspan x="50" dy="25">地望着远方，心中充满了绝望(hopelessness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the disaster brought a sense of hopelessness.
  </text>
  <text x="50" y="310" class="content">
    灾难的消息带来了绝望的感觉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Horizon -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="20" class="image" />
    <!-- Clouds -->
    <ellipse cx="50" cy="50" rx="30" ry="20" class="image" />
    <ellipse cx="100" cy="70" rx="30" ry="20" class="image" />
    <ellipse cx="250" cy="60" rx="30" ry="20" class="image" />
  </g>
</svg>