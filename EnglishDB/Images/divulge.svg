<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">divulge</text>
  <text x="50" y="120" class="subtitle">[daɪˈvʌldʒ] v. 泄露，透露</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + vulg (人群)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个秘密被"分开(di-)"并"透露给人群(vulg)"，
    <tspan x="50" dy="25">就像一个神秘的信封被撕开，里面的内容被公之于众。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He refused to divulge the details of the meeting.
  </text>
  <text x="50" y="310" class="content">
    他拒绝透露会议的细节。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Envelope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,20 300,20 270,180 80,180" class="image" />
    <!-- Tearing line -->
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <!-- Secret content -->
    <text x="100" y="100" class="content" style="font-size: 24px; fill: #2980B9;">Secret</text>
  </g>
</svg>