<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">steadfast</text>
  <text x="50" y="120" class="subtitle">[ˈstɛdfæst] adj. 坚定的，不动摇的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stead (站立) + fast (牢固的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人像石头一样"站立(stead)"，
    <tspan x="50" dy="25">牢牢地"固定(fast)"在原地，</tspan>
    <tspan x="50" dy="25">无论风吹雨打，他都"坚定不移(steadfast)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She remained steadfast in her beliefs despite the criticism.
  </text>
  <text x="50" y="310" class="content">
    尽管受到批评，她依然坚定不移地坚持自己的信念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Person standing -->
    <circle cx="175" cy="150" r="20" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="230" class="image" />
    <line x1="175" y1="200" x2="195" y2="230" class="image" />
    <line x1="175" y1="180" x2="145" y2="190" class="image" />
    <line x1="175" y1="180" x2="205" y2="190" class="image" />
    <!-- Stone -->
    <rect x="165" y="230" width="20" height="20" class="image" />
  </g>
</svg>