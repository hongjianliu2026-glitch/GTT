<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nomad</text>
  <text x="50" y="120" class="subtitle">[ˈnoʊmæd] n. 游牧民，流浪者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nom (牧场) + -ad (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个游牧民骑着骆驼，穿越无垠的沙漠，寻找新的牧场(nom)，
    <tspan x="50" dy="25">他们没有固定的家园，总是"牧场的人(nom-ad)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The nomad tribes roamed the vast desert.
  </text>
  <text x="50" y="310" class="content">
    游牧部落在大沙漠中游荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Camel -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="180" class="image" />
    <line x1="50" y1="160" x2="70" y2="180" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Nomad -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="120" y1="130" x2="150" y2="120" class="image" />
    <!-- Horizon -->
    <line x1="0" y1="190" x2="350" y2="190" class="image" />
  </g>
</svg>