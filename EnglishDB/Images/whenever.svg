<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whenever</text>
  <text x="50" y="120" class="subtitle">[wenˈevər] conj. 无论何时，每当</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> when (何时) + ever (曾经)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时间机器，"无论何时(when-ever)"
    <tspan x="50" dy="25">你都可以回到过去或前往未来，这就是whenever的魔力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> You can call me whenever you need help.
  </text>
  <text x="50" y="310" class="content">
    无论何时你需要帮助，都可以给我打电话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Time machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="255" y2="100" class="image" />
    <!-- Time portal -->
    <rect x="100" y="20" width="150" height="160" class="image" />
    <!-- Time travel -->
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="155" y2="220" class="image" />
    <line x1="175" y1="200" x2="195" y2="220" class="image" />
  </g>
</svg>