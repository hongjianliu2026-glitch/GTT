<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pathway</text>
  <text x="50" y="120" class="subtitle">[ˈpæθweɪ] n. 路径，通道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> path (路径) + way (道路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条蜿蜒的"路径(path)"，它像一条"道路(way)"
    <tspan x="50" dy="25">引领你穿越森林，这就是"pathway"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pathway through the forest was narrow and winding.
  </text>
  <text x="50" y="310" class="content">
    穿过森林的小路又窄又弯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pathway -->
    <path d="M50 100 Q100 50, 150 100 T250 100" class="image" />
    <path d="M50 150 Q100 200, 150 150 T250 150" class="image" />
    <path d="M50 200 Q100 250, 150 200 T250 200" class="image" />
    <!-- Trees -->
    <rect x="30" y="50" width="20" height="100" class="image" />
    <rect x="280" y="50" width="20" height="100" class="image" />
    <rect x="150" y="50" width="20" height="100" class="image" />
    <!-- Leaves -->
    <circle cx="40" cy="40" r="10" class="image" />
    <circle cx="290" cy="40" r="10" class="image" />
    <circle cx="160" cy="40" r="10" class="image" />
  </g>
</svg>