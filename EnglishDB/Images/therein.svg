<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">therein</text>
  <text x="50" y="120" class="subtitle">[ˌðerˈɪn] adv. 在那里，在其中</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> there (那里) + in (在...里面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宝箱，"在那里(there)"
    <tspan x="50" dy="25">的里面(in)藏着珍贵的宝物，这就是"therein"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The treasure was hidden therein.
  </text>
  <text x="50" y="310" class="content">
    宝藏被藏在那里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Treasure chest -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="40" x2="180" y2="40" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="120" x2="180" y2="120" class="image" />
    <!-- Treasure -->
    <circle cx="100" cy="75" r="20" class="image" />
    <line x1="100" y1="95" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="140" class="image" />
    <line x1="100" y1="120" x2="120" y2="140" class="image" />
    <line x1="100" y1="105" x2="130" y2="95" class="image" />
  </g>
</svg>