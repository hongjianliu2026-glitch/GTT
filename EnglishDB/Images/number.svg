<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">number</text>
  <text x="50" y="120" class="subtitle">[ˈnʌmbər] n. 数字，号码；v. 编号，计数</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> numer (数) + -ber (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字"1234567890"在空中飘浮，
    <tspan x="50" dy="25">每个数字都像是一个小精灵，它们在空中跳跃，</tspan>
    <tspan x="50" dy="25">形成了一个巨大的数字海洋，这就是"number"的奇妙世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> Please enter your phone number.
  </text>
  <text x="50" y="330" class="content">
    请输入您的电话号码。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Floating numbers -->
    <text x="0" y="0" class="image" font-size="100">1</text>
    <text x="100" y="50" class="image" font-size="100">2</text>
    <text x="200" y="100" class="image" font-size="100">3</text>
    <text x="300" y="150" class="image" font-size="100">4</text>
    <text x="400" y="200" class="image" font-size="100">5</text>
    <text x="500" y="250" class="image" font-size="100">6</text>
    <text x="600" y="300" class="image" font-size="100">7</text>
    <text x="700" y="350" class="image" font-size="100">8</text>
    <text x="800" y="400" class="image" font-size="100">9</text>
    <text x="900" y="450" class="image" font-size="100">0</text>
  </g>
</svg>