<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intriguing</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtriːɡɪŋ] adj. 引起兴趣的，有迷惑力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + trigue (陷阱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的盒子，"进入陷阱(in-trigue)"
    <tspan x="50" dy="25">吸引你探索，这就是intriguing(引起兴趣的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The book's intriguing plot kept me up all night.
  </text>
  <text x="50" y="310" class="content">
    这本书引人入胜的情节让我彻夜未眠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mysterious box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Question mark -->
    <text x="100" y="80" class="image" font-size="80" text-anchor="middle">?</text>
    <!-- Hand reaching out -->
    <line x1="220" y1="75" x2="300" y2="75" class="image" />
    <line x1="300" y1="75" x2="280" y2="55" class="image" />
    <line x1="300" y1="75" x2="280" y2="95" class="image" />
  </g>
</svg>