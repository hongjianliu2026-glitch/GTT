<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recklessly</text>
  <text x="50" y="120" class="subtitle">[ˈrɛkləsli] adv. 鲁莽地，不顾后果地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> reck (顾虑) + less (没有) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在悬崖边上，"没有顾虑(reck-less)"
    <tspan x="50" dy="25">地奔跑，结果掉下了悬崖，这就是鲁莽(recklessly)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He drove recklessly on the highway.
  </text>
  <text x="50" y="310" class="content">
    他在高速公路上鲁莽驾驶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person running -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="30" y2="220" class="image" />
    <line x1="50" y1="190" x2="70" y2="220" class="image" />
    <line x1="50" y1="175" x2="80" y2="165" class="image" />
    <!-- Falling -->
    <line x1="50" y1="190" x2="50" y2="250" class="image" />
    <!-- Ground -->
    <line x1="0" y1="250" x2="350" y2="250" class="image" />
  </g>
</svg>