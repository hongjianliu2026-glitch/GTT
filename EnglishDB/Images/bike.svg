<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bike</text>
  <text x="50" y="120" class="subtitle">[baɪk] n. 自行车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (二) + -ke (轮)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆自行车，它有两个轮子(bi-ke)，
    <tspan x="50" dy="25">骑在上面就像在风中自由飞翔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He rides his bike to work every day.
  </text>
  <text x="50" y="310" class="content">
    他每天骑自行车去上班。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bicycle frame -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="250" y1="50" x2="150" y2="150" class="image" />
    <!-- Wheels -->
    <circle cx="100" cy="150" r="30" class="image" />
    <circle cx="200" cy="150" r="30" class="image" />
    <!-- Handlebars -->
    <line x1="150" y1="50" x2="150" y2="30" class="image" />
    <line x1="150" y1="30" x2="130" y2="10" class="image" />
    <line x1="150" y1="30" x2="170" y2="10" class="image" />
    <!-- Seat -->
    <line x1="150" y1="80" x2="150" y2="100" class="image" />
  </g>
</svg>