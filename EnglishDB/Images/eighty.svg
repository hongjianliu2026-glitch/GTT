<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eighty</text>
  <text x="50" y="120" class="subtitle">[ˈeɪti] n. 八十</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eight (八) + -ty (表示“十”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“8”，它被放大了十倍，变成了“80”。
    <tspan x="50" dy="25">这个数字就像一个巨大的气球，充满了整个房间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He turned eighty last month.
  </text>
  <text x="50" y="310" class="content">
    他上个月满八十岁了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number 8 -->
    <path d="M50 50 Q100 0 150 50 T250 50 Q200 100 150 50 T50 50" class="image" />
    <!-- Enlarged number 8 -->
    <path d="M50 150 Q100 100 150 150 T250 150 Q200 200 150 150 T50 150" class="image" />
    <!-- Balloon -->
    <circle cx="150" cy="100" r="50" class="image" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
  </g>
</svg>