<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pout</text>
  <text x="50" y="120" class="subtitle">[paʊt] v. 撅嘴，生气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pout (源自中古英语 pouten，意为撅嘴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小孩子在生气时，"撅起(pout)"
    <tspan x="50" dy="25">嘴巴，满脸不高兴的样子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She pouted when she didn't get her way.
  </text>
  <text x="50" y="310" class="content">
    她没有如愿以偿时撅起了嘴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Mouth -->
    <path d="M 50 140 Q 100 180 150 140" class="image" />
  </g>
</svg>