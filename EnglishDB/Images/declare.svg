<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">declare</text>
  <text x="50" y="120" class="subtitle">[dɪˈkler] v. 宣布，声明</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + clar (清楚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在讲台上，"强调清楚地(de-clar)"
    <tspan x="50" dy="25">宣布一个重要消息，这就是声明(declare)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The president declared a state of emergency.
  </text>
  <text x="50" y="310" class="content">
    总统宣布进入紧急状态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Podium -->
    <rect x="100" y="150" width="200" height="50" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="170" y2="180" class="image" />
    <line x1="200" y1="150" x2="230" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Microphone -->
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <rect x="190" y="200" width="20" height="30" class="image" />
    <!-- Speech bubble -->
    <path d="M 200 50 Q 250 70 200 90 Q 150 70 200 50" class="image" />
    <text x="190" y="60" class="content" text-anchor="middle">宣布</text>
  </g>
</svg>