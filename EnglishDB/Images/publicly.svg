<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">publicly</text>
  <text x="50" y="120" class="subtitle">[ˈpʌblɪkli] adv. 公开地，公然地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> public (公共的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在广场上，"公开地(publicly)"
    <tspan x="50" dy="25">大声宣布一个消息，所有人都能听到。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company announced the merger publicly.
  </text>
  <text x="50" y="310" class="content">
    公司公开宣布了合并的消息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Square representing a public place -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person speaking -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 80 90 Q 120 80 150 90 Q 180 100 150 110 Q 120 120 80 110 Z" class="image" />
    <text x="100" y="100" class="content" text-anchor="middle">Announcement</text>
  </g>
</svg>