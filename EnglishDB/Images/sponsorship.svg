<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sponsorship</text>
  <text x="50" y="120" class="subtitle">[ˈspɒnsəʃɪp] n. 赞助，资助</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spons (承诺) + -or (人) + -ship (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个慷慨的赞助人，"承诺(spons)"
    <tspan x="50" dy="25">支持一个活动或项目，这种支持关系就是赞助(sponsorship)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event was made possible by the sponsorship of a local company.
  </text>
  <text x="50" y="310" class="content">
    这个活动因当地公司的赞助而得以举办。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sponsor -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Event -->
    <rect x="120" y="80" width="200" height="100" class="image" />
    <line x1="130" y1="90" x2="310" y2="90" class="image" />
    <line x1="130" y1="110" x2="290" y2="110" class="image" />
    <line x1="130" y1="130" x2="300" y2="130" class="image" />
    <line x1="130" y1="150" x2="280" y2="150" class="image" />
    <!-- Connection -->
    <line x1="80" y1="100" x2="120" y2="130" class="image" />
  </g>
</svg>