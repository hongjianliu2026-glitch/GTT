<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">altered</text>
  <text x="50" y="120" class="subtitle">[ˈɔːltərd] adj. 改变的，修改的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alter (改变) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在画布上，"改变(alter)"
    <tspan x="50" dy="25">原来的画作，使其变得完全不同，这就是"altered"的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The original design was altered to meet the new requirements.
  </text>
  <text x="50" y="310" class="content">
    原来的设计被修改以满足新的要求。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Original painting -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <text x="20" y="30" class="content">Original</text>
    <!-- Altered painting -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <text x="220" y="30" class="content">Altered</text>
    <!-- Artist -->
    <circle cx="175" cy="120" r="15" class="image" />
    <line x1="175" y1="135" x2="175" y2="170" class="image" />
    <line x1="175" y1="170" x2="155" y2="200" class="image" />
    <line x1="175" y1="170" x2="195" y2="200" class="image" />
    <line x1="175" y1="150" x2="205" y2="140" class="image" />
    <!-- Brush -->
    <line x1="175" y1="135" x2="200" y2="110" class="image" />
    <line x1="200" y1="110" x2="210" y2="120" class="image" />
  </g>
</svg>