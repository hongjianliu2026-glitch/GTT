<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">editor-in-chief</text>
  <text x="50" y="120" class="subtitle">[ˌɛdɪtər ɪn ˈtʃiːf] n. 主编，总编辑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> editor (编辑) + in-chief (主要的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个主编坐在高高的椅子上，"主要负责(in-chief)"
    <tspan x="50" dy="25">整个编辑部的工作，掌控全局(editor-in-chief)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The editor-in-chief approved the final draft.
  </text>
  <text x="50" y="310" class="content">
    主编批准了最终稿件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Editor's chair -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Editor -->
    <circle cx="75" cy="50" r="20" class="image" />
    <line x1="75" y1="70" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="50" y2="180" class="image" />
    <line x1="75" y1="150" x2="100" y2="180" class="image" />
    <line x1="75" y1="100" x2="120" y2="90" class="image" />
    <!-- Papers -->
    <rect x="180" y="20" width="150" height="160" class="image" />
    <line x1="200" y1="50" x2="300" y2="50" class="image" />
    <line x1="200" y1="80" x2="280" y2="80" class="image" />
    <line x1="200" y1="110" x2="270" y2="110" class="image" />
    <line x1="200" y1="140" x2="250" y2="140" class="image" />
  </g>
</svg>