<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rum</text>
  <text x="50" y="120" class="subtitle">[rʌm] n. 朗姆酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rum (源自荷兰语 "rum"，意为“强有力的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个海盗船长举起一杯朗姆酒，"强有力的(rum)"
    <tspan x="50" dy="25">液体在阳光下闪闪发光，象征着力量与冒险。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pirate captain enjoyed a glass of rum after a long voyage.
  </text>
  <text x="50" y="310" class="content">
    海盗船长在长途航行后喜欢喝一杯朗姆酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pirate captain -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Glass of rum -->
    <rect x="120" y="150" width="60" height="100" class="image" />
    <line x1="120" y1="150" x2="180" y2="150" class="image" />
    <line x1="120" y1="250" x2="180" y2="250" class="image" />
    <line x1="120" y1="150" x2="120" y2="250" class="image" />
    <line x1="180" y1="150" x2="180" y2="250" class="image" />
    <!-- Liquid in the glass -->
    <rect x="125" y="160" width="50" height="80" fill="#E74C3C" />
  </g>
</svg>