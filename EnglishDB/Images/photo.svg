<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">photo</text>
  <text x="50" y="120" class="subtitle">[ˈfoʊtoʊ] n. 照片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> photo- (光) + -graph (写)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个摄影师在阳光下，"用光写下(photo-graph)"
    <tspan x="50" dy="25">瞬间的画面，这些画面就构成了照片(photo)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She took a photo of the sunset.
  </text>
  <text x="50" y="310" class="content">
    她拍了一张日落的照片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camera -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <rect x="80" y="80" width="200" height="40" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="20" class="image" fill="#F1C40F" />
    <!-- Photographer -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>