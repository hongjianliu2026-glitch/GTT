<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Baptist</text>
  <text x="50" y="120" class="subtitle">[ˈbæptɪst] n. 浸礼会教徒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bapt (浸) + -ist (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个浸礼会教徒在水中"浸入(bapt)"，象征着洗礼和重生。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a devout Baptist who attends church regularly.
  </text>
  <text x="50" y="310" class="content">
    他是一个虔诚的浸礼会教徒，经常去教堂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Water -->
    <rect x="0" y="100" width="350" height="150" class="image" fill="#A9CCE3" />
    <!-- Person -->
    <circle cx="175" cy="80" r="20" class="image" fill="#F1C40F" />
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="120" x2="220" y2="110" class="image" />
    <!-- Cross -->
    <line x1="175" y1="50" x2="175" y2="70" class="image" />
    <line x1="165" y1="60" x2="185" y2="60" class="image" />
  </g>
</svg>