<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">topple</text>
  <text x="50" y="120" class="subtitle">[ˈtɒpəl] v. 推翻，倒塌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> top (顶部) + -ple (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高塔，"从顶部(top)"
    <tspan x="50" dy="25">开始摇晃，最终倒塌(topple)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm toppled several trees in the park.
  </text>
  <text x="50" y="310" class="content">
    风暴吹倒了公园里的几棵树。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tower -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Toppling effect -->
    <line x1="50" y1="200" x2="150" y2="300" class="image" />
    <line x1="50" y1="200" x2="0" y2="300" class="image" />
    <!-- Cracked top -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="0" y1="0" x2="50" y2="20" class="image" />
    <line x1="100" y1="0" x2="50" y2="20" class="image" />
  </g>
</svg>