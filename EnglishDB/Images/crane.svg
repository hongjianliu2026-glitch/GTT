<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crane</text>
  <text x="50" y="120" class="subtitle">[kreɪn] n. 鹤，起重机；v. 伸长脖子看</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cran (脖子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鹤(crane)优雅地伸长脖子，
    <tspan x="50" dy="25">就像起重机(crane)伸长吊臂一样，</tspan>
    <tspan x="50" dy="25">两者都展现了"伸长"的特性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The construction workers used a crane to lift the heavy steel beams.
  </text>
  <text x="50" y="310" class="content">
    建筑工人用起重机吊起了沉重的钢梁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crane (bird) -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="70" y1="100" x2="120" y2="100" class="image" /> <!-- Neck -->
    <line x1="120" y1="80" x2="120" y2="120" class="image" /> <!-- Body -->
    <line x1="120" y1="120" x2="100" y2="150" class="image" /> <!-- Leg -->
    <line x1="120" y1="120" x2="140" y2="150" class="image" /> <!-- Leg -->
    <line x1="120" y1="80" x2="100" y2="60" class="image" /> <!-- Wing -->
    <line x1="120" y1="80" x2="140" y2="60" class="image" /> <!-- Wing -->

    <!-- Crane (machine) -->
    <line x1="200" y1="50" x2="200" y2="150" class="image" /> <!-- Base -->
    <line x1="200" y1="50" x2="250" y2="50" class="image" /> <!-- Arm -->
    <line x1="250" y1="50" x2="250" y2="100" class="image" /> <!-- Arm -->
    <line x1="250" y1="100" x2="300" y2="100" class="image" /> <!-- Hook -->
  </g>
</svg>