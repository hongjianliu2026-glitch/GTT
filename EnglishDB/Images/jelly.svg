<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .jelly { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jelly</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɛli] n. 果冻，胶状物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gel (胶状物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的果冻(jelly)在桌子上颤动，
    <tspan x="50" dy="25">它的胶状(gel)质地让人忍不住想戳一下。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat strawberry jelly with her breakfast.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在早餐时吃草莓果冻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jelly -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="jelly" />
    <!-- Strawberries -->
    <circle cx="100" cy="80" r="15" class="jelly" />
    <circle cx="250" cy="80" r="15" class="jelly" />
    <circle cx="175" cy="120" r="15" class="jelly" />
    <!-- Table -->
    <rect x="50" y="150" width="250" height="50" class="image" />
  </g>
</svg>