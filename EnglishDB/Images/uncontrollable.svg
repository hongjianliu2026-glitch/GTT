<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uncontrollable</text>
  <text x="50" y="120" class="subtitle">[ˌʌnkənˈtroʊləbl] adj. 无法控制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + control (控制) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个失控的野兽，"无法控制(un-controllable)"
    <tspan x="50" dy="25">在森林中狂奔，没有人能阻止它。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The situation became uncontrollable after the storm.
  </text>
  <text x="50" y="310" class="content">
    暴风雨过后，局势变得无法控制。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wild beast -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <line x1="50" y1="150" x2="0" y2="140" class="image" />
    <!-- Forest -->
    <line x1="0" y1="250" x2="150" y2="250" class="image" />
    <line x1="20" y1="230" x2="130" y2="230" class="image" />
    <line x1="40" y1="210" x2="110" y2="210" class="image" />
    <line x1="60" y1="190" x2="90" y2="190" class="image" />
  </g>
</svg>