<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conundrum</text>
  <text x="50" y="120" class="subtitle">[kəˈnʌndrəm] n. 难题，谜语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + un- (一) + drum (圆圈)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个复杂的谜题，"共同围绕(con-un-drum)"
    <tspan x="50" dy="25">在一个圆圈中，让人难以解开，这就是一个难题(conundrum)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The conundrum of climate change is difficult to solve.
  </text>
  <text x="50" y="310" class="content">
    气候变化的难题很难解决。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle representing the conundrum -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Question marks inside the circle -->
    <text x="125" y="105" class="content" font-size="48" fill="#7F8C8D">?</text>
    <text x="225" y="105" class="content" font-size="48" fill="#7F8C8D">?</text>
    <text x="175" y="155" class="content" font-size="48" fill="#7F8C8D">?</text>
  </g>
</svg>