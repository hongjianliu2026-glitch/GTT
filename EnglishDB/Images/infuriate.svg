<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infuriate</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfjʊriˌeɪt] v. 激怒，使狂怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + furia (愤怒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"带入(in-)"了"愤怒(furia)"的深渊，
    <tspan x="50" dy="25">他的脸因为愤怒而扭曲，眼睛喷火，这就是激怒(infuriate)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His constant interruptions infuriated me.
  </text>
  <text x="50" y="310" class="content">
    他不断的打断让我非常愤怒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="90" y1="140" x2="110" y2="140" class="image" />
    <line x1="100" y1="160" x2="100" y2="160" class="image" />
    <!-- Fire -->
    <polygon points="100,50 70,80 130,80" class="image" />
    <polygon points="100,40 60,70 140,70" class="image" />
    <polygon points="100,30 50,60 150,60" class="image" />
  </g>
</svg>