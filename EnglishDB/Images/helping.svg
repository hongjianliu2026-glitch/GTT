<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">helping</text>
  <text x="50" y="120" class="subtitle">[ˈhɛlɪŋ] n. 帮助，一份食物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> help (帮助) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手(help)伸出来，"帮助(helping)"
    <tspan x="50" dy="25">一个小人，同时这个手也端着一份食物(helping)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She offered me a helping of soup.
  </text>
  <text x="50" y="310" class="content">
    她给了我一份汤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant hand -->
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <line x1="200" y1="0" x2="180" y2="20" class="image" />
    <line x1="200" y1="0" x2="220" y2="20" class="image" />
    <line x1="200" y1="0" x2="200" y2="40" class="image" />
    <line x1="200" y1="40" x2="180" y2="60" class="image" />
    <line x1="200" y1="40" x2="220" y2="60" class="image" />
    <!-- Small person -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="140" class="image" />
    <line x1="100" y1="140" x2="90" y2="160" class="image" />
    <line x1="100" y1="140" x2="110" y2="160" class="image" />
    <line x1="100" y1="120" x2="120" y2="110" class="image" />
    <!-- Food -->
    <rect x="180" y="20" width="40" height="20" class="image" />
  </g>
</svg>