<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">favored</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪvərd] adj. 受宠的，有利的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> favor (喜爱) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被众人"喜爱(favor)"的人，
    <tspan x="50" dy="25">他/她被视为"受宠的(favored)"，</tspan>
    <tspan x="50" dy="25">周围的人都对他/她特别友好。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was the favored candidate for the job.
  </text>
  <text x="50" y="310" class="content">
    她是这份工作的热门候选人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Person -->
    <circle cx="40" cy="100" r="15" class="image" />
    <line x1="40" y1="115" x2="40" y2="150" class="image" />
    <line x1="40" y1="150" x2="25" y2="180" class="image" />
    <line x1="40" y1="150" x2="55" y2="180" class="image" />
    <line x1="40" y1="130" x2="70" y2="120" class="image" />
    <!-- Arrows -->
    <line x1="10" y1="30" x2="25" y2="100" class="image" />
    <line x1="70" y1="30" x2="55" y2="100" class="image" />
  </g>
</svg>