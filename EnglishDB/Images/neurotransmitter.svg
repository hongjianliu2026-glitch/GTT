<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neurotransmitter</text>
  <text x="50" y="120" class="subtitle">[ˌnʊroʊtrænzˈmɪtər] n. 神经递质</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neuro- (神经) + trans- (跨越) + mit (发送)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神经细胞，"跨越(trans-)"细胞间隙，"发送(mit)"
    <tspan x="50" dy="25">化学信号，这些信号就是神经递质(neurotransmitter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Serotonin is a well-known neurotransmitter.
  </text>
  <text x="50" y="310" class="content">
    血清素是一种众所周知的神经递质。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Neuron -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="170" y2="80" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />
    <!-- Synapse -->
    <rect x="180" y="80" width="40" height="40" class="image" />
    <!-- Neurotransmitter -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="250" y2="110" class="image" />
    <line x1="250" y1="110" x2="270" y2="90" class="image" />
    <line x1="250" y1="110" x2="270" y2="130" class="image" />
  </g>
</svg>