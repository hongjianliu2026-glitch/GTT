<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">assume</text>
  <text x="50" y="120" class="subtitle">[əˈsjuːm] v. 假定，承担</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> as- (朝向) + sum (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"朝向(as-)"某个物体，"拿(sum)"起它，
    <tspan x="50" dy="25">并开始假定(assume)它的性质或责任。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We should not assume anything without evidence.
  </text>
  <text x="50" y="310" class="content">
    在没有证据的情况下，我们不应该假定任何事情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person reaching out -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="130" y2="50" class="image" />
    <line x1="150" y1="50" x2="170" y2="50" class="image" />
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Object being assumed -->
    <rect x="180" y="40" width="40" height="40" class="image" />
    <!-- Arrow pointing to object -->
    <line x1="150" y1="70" x2="180" y2="60" class="image" />
    <polygon points="180,60 175,55 175,65" class="image" />
  </g>
</svg>