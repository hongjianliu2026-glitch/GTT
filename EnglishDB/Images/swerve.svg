<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swerve</text>
  <text x="50" y="120" class="subtitle">[swɜːrv] v. 突然转向，偏离</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (表示加强) + werf (转向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在高速公路上，突然"加强转向(s-werf)"，
    <tspan x="50" dy="25">猛地偏离了原来的路线，这就是"swerve"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The driver had to swerve to avoid hitting the deer.
  </text>
  <text x="50" y="310" class="content">
    司机不得不突然转向以避免撞到鹿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="70" r="10" class="image" />
    <circle cx="130" cy="70" r="10" class="image" />
    <!-- Original path -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <!-- Swerved path -->
    <line x1="150" y1="20" x2="250" y2="120" class="image" />
    <!-- Deer -->
    <circle cx="300" cy="150" r="20" class="image" />
    <line x1="300" y1="170" x2="300" y2="200" class="image" />
    <line x1="300" y1="185" x2="280" y2="175" class="image" />
    <line x1="300" y1="185" x2="320" y2="175" class="image" />
  </g>
</svg>