<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drizzle</text>
  <text x="50" y="120" class="subtitle">[ˈdrɪzəl] n. 毛毛雨；v. 下毛毛雨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drizz (细小的水滴) + -le (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个细小的水滴(drizz)反复落下，就像毛毛雨(drizzle)一样，轻轻地洒在大地上。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The morning was cool, with a light drizzle falling.
  </text>
  <text x="50" y="310" class="content">
    早晨很凉爽，下着细细的毛毛雨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Drops -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <line x1="200" y1="150" x2="200" y2="250" class="image" />
    <line x1="250" y1="150" x2="250" y2="250" class="image" />
    <line x1="300" y1="150" x2="300" y2="250" class="image" />
  </g>
</svg>