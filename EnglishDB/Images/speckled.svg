<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .dot { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">speckled</text>
  <text x="50" y="120" class="subtitle">[ˈspɛkəld] adj. 有斑点的，有斑纹的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> speck (斑点) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟，身上布满了"斑点(speck)"，
    <tspan x="50" dy="25">就像是被洒上了五彩斑斓的颜料，</tspan>
    <tspan x="50" dy="25">这就是"有斑点的(speckled)"小鸟。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The speckled butterfly fluttered by.
  </text>
  <text x="50" y="310" class="content">
    那只斑点蝴蝶翩翩飞过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Speckles -->
    <circle cx="70" cy="80" r="5" class="dot" />
    <circle cx="120" cy="90" r="5" class="dot" />
    <circle cx="90" cy="120" r="5" class="dot" />
    <circle cx="130" cy="110" r="5" class="dot" />
    <circle cx="80" cy="140" r="5" class="dot" />
    <circle cx="110" cy="130" r="5" class="dot" />
    <!-- Bird beak -->
    <polygon points="150,100 160,95 160,105" class="image" />
    <!-- Bird eye -->
    <circle cx="140" cy="100" r="5" class="image" />
  </g>
</svg>