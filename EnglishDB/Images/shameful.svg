<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shameful</text>
  <text x="50" y="120" class="subtitle">[ˈʃeɪmfəl] adj. 可耻的，丢脸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shame (羞耻) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为做了"可耻(shame)"的事情，脸上充满了"羞耻(shameful)"的表情，
    <tspan x="50" dy="25">他的脸红得像熟透的苹果，周围的人都对他投来异样的目光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was shameful to cheat in the exam.
  </text>
  <text x="50" y="310" class="content">
    在考试中作弊是可耻的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Red cheeks -->
    <circle cx="70" cy="80" r="15" class="image" fill="#E74C3C" />
    <circle cx="130" cy="80" r="15" class="image" fill="#E74C3C" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" fill="#2C3E50" />
    <circle cx="120" cy="90" r="5" class="image" fill="#2C3E50" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" fill="none" stroke="#2C3E50" stroke-width="3" />
    <!-- Surrounding people -->
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <circle cx="400" cy="100" r="20" class="image" />
    <!-- Gaze lines -->
    <line x1="220" y1="100" x2="100" y2="100" class="image" />
    <line x1="320" y1="100" x2="100" y2="100" class="image" />
    <line x1="420" y1="100" x2="100" y2="100" class="image" />
  </g>
</svg>