<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">considerate</text>
  <text x="50" y="120" class="subtitle">[kənˈsɪdərət] adj. 体贴的，考虑周到的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + sider (星星) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在夜晚仰望星空，"共同(con-)观察(sider)"
    <tspan x="50" dy="25">星星的轨迹，思考如何体贴地照顾他人，</tspan>
    <tspan x="50" dy="25">这样的人就是considerate(体贴的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is always considerate of others' feelings.
  </text>
  <text x="50" y="310" class="content">
    她总是很体贴别人的感受。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="100" cy="30" r="5" class="image" />
    <circle cx="150" cy="70" r="5" class="image" />
    <circle cx="200" cy="40" r="5" class="image" />
    <circle cx="250" cy="60" r="5" class="image" />
    <!-- Person looking at the sky -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Thought bubble -->
    <path d="M 50 80 Q 100 50 150 80 Q 100 110 50 80" class="image" />
    <text x="70" y="90" class="content" text-anchor="middle">体贴</text>
  </g>
</svg>