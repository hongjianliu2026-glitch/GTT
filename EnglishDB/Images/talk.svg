<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">talk</text>
  <text x="50" y="120" class="subtitle">[tɔːk] v. 说话，交谈；n. 谈话，演讲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tal (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，嘴巴张开，"说(tal)"
    <tspan x="50" dy="25">出话语，这就是交谈(talk)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They sat down to talk about their future plans.
  </text>
  <text x="50" y="310" class="content">
    他们坐下来谈论未来的计划。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person 1 -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="70" y2="220" class="image" />
    <line x1="100" y1="180" x2="130" y2="220" class="image" />
    <line x1="100" y1="150" x2="150" y2="140" class="image" />
    <line x1="100" y1="150" x2="50" y2="140" class="image" />
    <line x1="100" y1="110" x2="100" y2="120" class="image" />
    <line x1="90" y1="110" x2="110" y2="110" class="image" />

    <!-- Person 2 -->
    <circle cx="300" cy="100" r="30" class="image" />
    <line x1="300" y1="130" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="270" y2="220" class="image" />
    <line x1="300" y1="180" x2="330" y2="220" class="image" />
    <line x1="300" y1="150" x2="350" y2="140" class="image" />
    <line x1="300" y1="150" x2="250" y2="140" class="image" />
    <line x1="300" y1="110" x2="300" y2="120" class="image" />
    <line x1="290" y1="110" x2="310" y2="110" class="image" />

    <!-- Speech bubbles -->
    <path d="M130,80 Q180,70 200,100 Q180,130 130,120 Z" class="image" />
    <path d="M270,80 Q220,70 200,100 Q220,130 270,120 Z" class="image" />
  </g>
</svg>