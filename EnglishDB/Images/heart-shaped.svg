<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .heart { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heart-shaped</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrtˌʃeɪpt] adj. 心形的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heart (心) + shaped (形状的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗巨大的心形糖果，"心(heart)"
    <tspan x="50" dy="25">被塑造成了一个完美的形状(shaped)，</tspan>
    <tspan x="50" dy="25">让人一看就感到甜蜜和温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She received a heart-shaped box of chocolates on Valentine's Day.
  </text>
  <text x="50" y="310" class="content">
    她在情人节收到了一个心形的巧克力盒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10,30 A20,20 0,0,1 50,30 A20,20 0,0,1 90,30 Q90,60 50,90 Q10,60 10,30 Z" class="heart" />
    <!-- Candy wrapper -->
    <rect x="0" y="90" width="100" height="20" class="image" />
    <!-- Candy lines -->
    <line x1="10" y1="100" x2="90" y2="100" class="image" />
    <line x1="10" y1="110" x2="90" y2="110" class="image" />
    <line x1="10" y1="120" x2="90" y2="120" class="image" />
  </g>
</svg>