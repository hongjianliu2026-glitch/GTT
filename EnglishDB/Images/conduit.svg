<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conduit</text>
  <text x="50" y="120" class="subtitle">[ˈkɒndjuːɪt] n. 导管，管道；渠道</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + duce (引导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条巨大的管道，"共同引导(con-duce)"
    <tspan x="50" dy="25">水流，这就是导管(conduit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The conduit carries water from the river to the city.
  </text>
  <text x="50" y="310" class="content">
    这条导管将水从河流输送到城市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pipe -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Water flow -->
    <line x1="20" y1="50" x2="330" y2="50" class="image" />
    <line x1="20" y1="40" x2="330" y2="40" class="image" />
    <line x1="20" y1="60" x2="330" y2="60" class="image" />
    <!-- Water droplets -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="150" cy="50" r="5" class="image" />
    <circle cx="200" cy="50" r="5" class="image" />
    <circle cx="250" cy="50" r="5" class="image" />
    <circle cx="300" cy="50" r="5" class="image" />
  </g>
</svg>