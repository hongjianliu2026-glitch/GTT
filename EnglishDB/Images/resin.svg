<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .resin { fill: #D98880; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resin</text>
  <text x="50" y="120" class="subtitle">[ˈrɛzɪn] n. 树脂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再) + sin (粘)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵树在受伤后，"再次粘合(re-sin)"
    <tspan x="50" dy="25">伤口，分泌出树脂(resin)来保护自己。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient Egyptians used resin to embalm bodies.
  </text>
  <text x="50" y="310" class="content">
    古埃及人用树脂来保存尸体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Wound -->
    <rect x="40" y="100" width="20" height="20" class="image" />
    <!-- Resin -->
    <ellipse cx="50" cy="120" rx="30" ry="15" class="resin" />
    <!-- Dripping resin -->
    <line x1="50" y1="135" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="40" y2="180" class="image" />
    <line x1="50" y1="160" x2="60" y2="180" class="image" />
  </g>
</svg>