<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">makeover</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪkˌoʊvər] n. 改造，改头换面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> make (做) + over (重新)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"重新做(make over)"
    <tspan x="50" dy="25">自己的形象，从头发到服装都焕然一新。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to give her room a complete makeover.
  </text>
  <text x="50" y="310" class="content">
    她决定彻底改造她的房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person before makeover -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Person after makeover -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Hair and clothes change -->
    <line x1="100" y1="80" x2="120" y2="80" class="image" />
    <line x1="250" y1="80" x2="270" y2="80" class="image" />
    <line x1="100" y1="100" x2="120" y2="100" class="image" />
    <line x1="250" y1="100" x2="270" y2="100" class="image" />
  </g>
</svg>