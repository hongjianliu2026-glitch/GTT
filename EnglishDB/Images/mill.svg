<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mill</text>
  <text x="50" y="120" class="subtitle">[mɪl] n. 磨坊，工厂；v. 碾磨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mill (磨坊)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磨坊(mill)，里面有巨大的轮子在转动，
    <tspan x="50" dy="25">碾磨着谷物，发出轰隆隆的声音，这就是磨坊(mill)的工作场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old mill still grinds wheat into flour.
  </text>
  <text x="50" y="310" class="content">
    那座老磨坊仍然把小麦磨成面粉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mill building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Mill wheel -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Mill blades -->
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <line x1="125" y1="100" x2="225" y2="100" class="image" />
    <!-- Grain -->
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="70" cy="150" r="10" class="image" />
    <circle cx="90" cy="150" r="10" class="image" />
  </g>
</svg>