<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accelerating</text>
  <text x="50" y="120" class="subtitle">[əkˈsɛləˌreɪtɪŋ] adj. 加速的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + celer (快速) + -ate (动词后缀) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆赛车在赛道上"加速(ac-celer-ate)"，
    <tspan x="50" dy="25">速度越来越快，仿佛要飞起来一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car's engine was accelerating rapidly.
  </text>
  <text x="50" y="310" class="content">
    汽车的引擎正在快速加速。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Race track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="100" width="100" height="50" class="image" />
    <circle cx="70" cy="125" r="10" class="image" />
    <circle cx="130" cy="125" r="10" class="image" />
    <!-- Speed lines -->
    <line x1="150" y1="125" x2="200" y2="125" class="image" />
    <line x1="150" y1="135" x2="200" y2="135" class="image" />
    <line x1="150" y1="145" x2="200" y2="145" class="image" />
  </g>
</svg>