<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">management</text>
  <text x="50" y="120" class="subtitle">[ˈmænɪdʒmənt] n. 管理，经营</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man (手) + age (做) + ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个管理者用"手(man)"去"做(age)"事情，
    <tspan x="50" dy="25">这些动作和决策就构成了管理(management)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Effective management is crucial for the success of any business.
  </text>
  <text x="50" y="310" class="content">
    有效的管理对任何企业的成功都至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Manager -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Hand -->
    <line x1="20" y1="150" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="60" y2="140" class="image" />
    <line x1="70" y1="150" x2="60" y2="160" class="image" />
    <line x1="70" y1="150" x2="80" y2="140" class="image" />
    <line x1="70" y1="150" x2="80" y2="160" class="image" />
    <!-- Decision -->
    <rect x="100" y="130" width="50" height="40" class="image" />
    <text x="110" y="155" class="content" fill="#2C3E50">决策</text>
  </g>
</svg>