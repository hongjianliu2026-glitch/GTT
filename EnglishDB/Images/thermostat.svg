<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thermostat</text>
  <text x="50" y="120" class="subtitle">[ˈθɜːrməstæt] n. 恒温器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thermo- (热) + stat (保持)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恒温器，它像一个"热守护者(thermo-stat)"，
    <tspan x="50" dy="25">始终保持房间的温度在一个舒适的范围内。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thermostat controls the temperature of the room.
  </text>
  <text x="50" y="310" class="content">
    恒温器控制着房间的温度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Thermostat -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Temperature display -->
    <rect x="20" y="20" width="110" height="50" class="image" />
    <text x="30" y="50" class="content">72°F</text>
    <!-- Buttons -->
    <circle cx="40" cy="100" r="10" class="image" />
    <circle cx="110" cy="100" r="10" class="image" />
    <!-- Heat symbol -->
    <line x1="75" y1="150" x2="75" y2="180" class="image" />
    <line x1="65" y1="165" x2="85" y2="165" class="image" />
  </g>
</svg>