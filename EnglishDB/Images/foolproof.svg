<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foolproof</text>
  <text x="50" y="120" class="subtitle">[ˈfuːlpruːf] adj. 极简单的，极安全的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fool (傻瓜) + proof (防)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个傻瓜(fool)试图破坏一个系统，但系统却像防弹衣(proof)一样，
    <tspan x="50" dy="25">完全不受影响，这就是foolproof(极简单的，极安全的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new software is foolproof and easy to use.
  </text>
  <text x="50" y="310" class="content">
    这个新软件非常简单易用，傻瓜也能操作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,100 200,20 350,100" class="image" />
    <!-- Fool -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="140" y2="170" class="image" />
    <!-- Hammer -->
    <line x1="150" y1="150" x2="200" y2="100" class="image" />
    <rect x="190" y="90" width="20" height="10" class="image" />
  </g>
</svg>