<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">batter</text>
  <text x="50" y="120" class="subtitle">[ˈbætər] v. 连续猛击；n. 击球手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bat (打) + -er (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个击球手(batter)在棒球场上，"反复击打(bat-er)"
    <tspan x="50" dy="25">棒球，展现出他的力量和技巧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The batter hit the ball out of the park.
  </text>
  <text x="50" y="310" class="content">
    击球手将球击出了球场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baseball field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Baseball player -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Bat -->
    <line x1="50" y1="120" x2="100" y2="50" class="image" />
    <!-- Ball -->
    <circle cx="120" cy="40" r="10" class="image" />
  </g>
</svg>