<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">expression</text>
  <text x="50" y="120" class="subtitle">[ɪkˈspreʃn] n. 表达，表情</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + press (压) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在舞台上，"向外压出(ex-press)"
    <tspan x="50" dy="25">他的情感，这些情感就构成了他的表情(expression)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her face showed a range of expressions as she listened to the story.
  </text>
  <text x="50" y="310" class="content">
    她听故事时脸上表现出各种表情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Emotions -->
    <line x1="150" y1="120" x2="200" y2="120" class="image" />
    <line x1="160" y1="130" x2="190" y2="130" class="image" />
    <line x1="170" y1="140" x2="180" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M 220 80 Q 300 80 300 120 Q 300 160 220 160 Q 200 160 200 140 Q 200 120 220 120 Z" class="image" />
    <text x="230" y="110" class="content">情感</text>
  </g>
</svg>