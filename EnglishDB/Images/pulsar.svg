<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pulsar</text>
  <text x="50" y="120" class="subtitle">[ˈpʌlsɑːr] n. 脉冲星</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> puls (脉冲) + -ar (表示“与...有关的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宇宙中的脉冲星，它像一个巨大的心脏，
    <tspan x="50" dy="25">"脉动(puls)"着发出强烈的电磁波，就像宇宙中的灯塔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pulsar emits regular pulses of radiation.
  </text>
  <text x="50" y="310" class="content">
    这颗脉冲星定期发射辐射脉冲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Pulsating effect -->
    <circle cx="100" cy="100" r="60" class="image" stroke-dasharray="10,10" />
    <circle cx="100" cy="100" r="70" class="image" stroke-dasharray="10,10" />
    <circle cx="100" cy="100" r="80" class="image" stroke-dasharray="10,10" />
    <!-- Radiation lines -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
  </g>
</svg>