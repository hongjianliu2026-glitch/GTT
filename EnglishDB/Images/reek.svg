<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reek</text>
  <text x="50" y="120" class="subtitle">[riːk] v. 发出恶臭，散发 n. 恶臭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> reek (烟雾，恶臭)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个垃圾堆，"烟雾(reek)"
    <tspan x="50" dy="25">弥漫，散发出令人作呕的恶臭。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garbage dump reeked of rotten food.
  </text>
  <text x="50" y="310" class="content">
    垃圾堆散发着腐烂食物的恶臭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garbage dump -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trash -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="120" r="25" class="image" />
    <circle cx="150" cy="80" r="30" class="image" />
    <circle cx="200" cy="110" r="20" class="image" />
    <circle cx="250" cy="90" r="25" class="image" />
    <!-- Smoke -->
    <line x1="50" y1="50" x2="40" y2="40" class="image" />
    <line x1="50" y1="50" x2="60" y2="40" class="image" />
    <line x1="100" y1="70" x2="90" y2="60" class="image" />
    <line x1="100" y1="70" x2="110" y2="60" class="image" />
    <line x1="150" y1="30" x2="140" y2="20" class="image" />
    <line x1="150" y1="30" x2="160" y2="20" class="image" />
    <line x1="200" y1="60" x2="190" y2="50" class="image" />
    <line x1="200" y1="60" x2="210" y2="50" class="image" />
    <line x1="250" y1="40" x2="240" y2="30" class="image" />
    <line x1="250" y1="40" x2="260" y2="30" class="image" />
  </g>
</svg>