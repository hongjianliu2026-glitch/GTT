<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">taut</text>
  <text x="50" y="120" class="subtitle">[tɔːt] adj. 拉紧的，紧张的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> taut (拉紧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根橡皮筋被拉到极限，"拉紧(taut)"
    <tspan x="50" dy="25">的状态让人感觉紧张，仿佛随时会断裂。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rope was taut as they pulled in opposite directions.
  </text>
  <text x="50" y="310" class="content">
    他们向相反方向拉绳子，绳子绷得紧紧的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rubber band -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="300" y1="50" x2="250" y2="100" class="image" />
    <!-- Tautness -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <!-- Hand pulling -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="300" cy="50" r="10" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="300" y1="50" x2="300" y2="100" class="image" />
  </g>
</svg>