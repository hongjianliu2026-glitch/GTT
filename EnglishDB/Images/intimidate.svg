<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intimidate</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɪmɪdeɪt] v. 恐吓，威胁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + tim (害怕) + -id (形容词后缀) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恶霸走进教室，"进入(in-)"
    <tspan x="50" dy="25">并让所有人"害怕(tim)"，这就是"恐吓(intimidate)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bully tried to intimidate the new student.
  </text>
  <text x="50" y="310" class="content">
    恶霸试图恐吓新来的学生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Classroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bully -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Students -->
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Fearful expressions -->
    <line x1="150" y1="120" x2="150" y2="140" class="image" />
    <line x1="200" y1="120" x2="200" y2="140" class="image" />
    <line x1="250" y1="120" x2="250" y2="140" class="image" />
    <line x1="140" y1="130" x2="160" y2="130" class="image" />
    <line x1="190" y1="130" x2="210" y2="130" class="image" />
    <line x1="240" y1="130" x2="260" y2="130" class="image" />
  </g>
</svg>