<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Arabic</text>
  <text x="50" y="120" class="subtitle">[ˈærəbɪk] adj. 阿拉伯的；n. 阿拉伯语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Arab (阿拉伯)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个沙漠中的阿拉伯人，骑着骆驼，
    <tspan x="50" dy="25">在夕阳下吟唱着古老的阿拉伯诗歌。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks fluent Arabic.
  </text>
  <text x="50" y="310" class="content">
    她能说一口流利的阿拉伯语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Camel -->
    <ellipse cx="100" cy="150" rx="50" ry="30" class="image" />
    <line x1="100" y1="150" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="70" y2="50" class="image" />
    <line x1="100" y1="100" x2="130" y2="50" class="image" />
    <!-- Arab person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
  </g>
</svg>