<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">volcanic</text>
  <text x="50" y="120" class="subtitle">[vɒlˈkeɪnɪk] adj. 火山的，火山性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> volca- (火山) + -nic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座火山正在喷发，熔岩如"火山(volca-)"般
    <tspan x="50" dy="25">喷涌而出，整个场景充满了"火山性的(volcanic)"力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The volcanic eruption caused widespread destruction.
  </text>
  <text x="50" y="310" class="content">
    火山喷发造成了广泛的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Volcano -->
    <polygon points="100,0 150,100 50,100" class="image" />
    <!-- Lava -->
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="90" y1="120" x2="110" y2="120" class="image" />
    <line x1="80" y1="140" x2="120" y2="140" class="image" />
    <!-- Smoke -->
    <circle cx="100" cy="20" r="10" class="image" />
    <circle cx="110" cy="30" r="10" class="image" />
    <circle cx="90" cy="30" r="10" class="image" />
  </g>
</svg>