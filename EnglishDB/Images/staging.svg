<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">staging</text>
  <text x="50" y="120" class="subtitle">[ˈsteɪdʒɪŋ] n. 舞台布置，分阶段进行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stage (舞台) + -ing (进行中的动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的舞台，上面有各种道具和布景，
    <tspan x="50" dy="25">演员们正在"布置(staging)"舞台，准备上演一场精彩的表演。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The staging of the play was meticulously planned.
  </text>
  <text x="50" y="310" class="content">
    这场戏的舞台布置经过了精心策划。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Curtains -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <!-- Props -->
    <rect x="70" y="80" width="50" height="50" class="image" />
    <rect x="150" y="80" width="50" height="50" class="image" />
    <rect x="230" y="80" width="50" height="50" class="image" />
    <!-- Actors -->
    <circle cx="100" cy="160" r="15" class="image" />
    <circle cx="200" cy="160" r="15" class="image" />
    <circle cx="300" cy="160" r="15" class="image" />
  </g>
</svg>