<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">benefactor</text>
  <text x="50" y="120" class="subtitle">[ˈbenɪfæktər] n. 捐助者，恩人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bene- (好) + fact (做) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个慷慨的"好人(bene-)"，他"做出(fact)"
    <tspan x="50" dy="25">善举，帮助他人，他就是"恩人(benefactor)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The benefactor donated a large sum to the charity.
  </text>
  <text x="50" y="310" class="content">
    这位恩人向慈善机构捐赠了一大笔钱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Benefactor -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Money bag -->
    <rect x="120" y="80" width="60" height="60" class="image" />
    <line x1="120" y1="140" x2="180" y2="140" class="image" />
    <line x1="150" y1="80" x2="150" y2="140" class="image" />
    <!-- Beneficiary -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="200" class="image" />
    <line x1="250" y1="160" x2="220" y2="140" class="image" />
    <line x1="250" y1="160" x2="280" y2="140" class="image" />
    <line x1="250" y1="200" x2="220" y2="240" class="image" />
    <line x1="250" y1="200" x2="280" y2="240" class="image" />
    <!-- Heart -->
    <path d="M230,180 C220,160 240,160 250,180 C260,160 280,160 270,180 Z" class="image" />
  </g>
</svg>