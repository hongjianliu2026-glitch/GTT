<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">malignant</text>
  <text x="50" y="120" class="subtitle">[məˈlɪɡnənt] adj. 恶性的，有害的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mal- (坏) + ign (火) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一团"坏火(mal-ign)"在体内燃烧，
    <tspan x="50" dy="25">这团火是"恶性的(malignant)"，会带来严重的伤害。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor found a malignant tumor in her lung.
  </text>
  <text x="50" y="310" class="content">
    医生在她的肺部发现了一个恶性肿瘤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bad fire -->
    <circle cx="50" cy="100" r="30" class="image" fill="#E74C3C" />
    <line x1="50" y1="70" x2="50" y2="130" class="image" stroke-width="5" />
    <line x1="35" y1="85" x2="65" y2="115" class="image" stroke-width="5" />
    <line x1="35" y1="115" x2="65" y2="85" class="image" stroke-width="5" />
    <!-- Body -->
    <circle cx="150" cy="100" r="50" class="image" fill="#F1C40F" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <line x1="120" y1="200" x2="180" y2="200" class="image" />
    <line x1="100" y1="300" x2="150" y2="250" class="image" />
    <line x1="200" y1="300" x2="150" y2="250" class="image" />
    <!-- Fire inside body -->
    <circle cx="150" cy="120" r="10" class="image" fill="#E74C3C" />
    <line x1="150" y1="110" x2="150" y2="130" class="image" stroke-width="2" />
    <line x1="145" y1="115" x2="155" y2="125" class="image" stroke-width="2" />
    <line x1="145" y1="125" x2="155" y2="115" class="image" stroke-width="2" />
  </g>
</svg>