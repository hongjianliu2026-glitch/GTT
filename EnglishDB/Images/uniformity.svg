<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uniformity</text>
  <text x="50" y="120" class="subtitle">[ˌjuːnɪˈfɔːrmɪti] n. 一致性，统一性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (一个) + form (形式) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工厂，所有工人都穿着"统一(uni-form)"的制服，
    <tspan x="50" dy="25">他们的动作和表情都"一致(uniformity)"，仿佛复制粘贴一般。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The uniformity of the products was impressive.
  </text>
  <text x="50" y="310" class="content">
    产品的一致性令人印象深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Workers -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Uniforms -->
    <line x1="40" y1="65" x2="60" y2="65" class="image" />
    <line x1="90" y1="65" x2="110" y2="65" class="image" />
    <line x1="140" y1="65" x2="160" y2="65" class="image" />
    <line x1="190" y1="65" x2="210" y2="65" class="image" />
    <line x1="240" y1="65" x2="260" y2="65" class="image" />
    <!-- Actions -->
    <line x1="50" y1="80" x2="50" y2="100" class="image" />
    <line x1="100" y1="80" x2="100" y2="100" class="image" />
    <line x1="150" y1="80" x2="150" y2="100" class="image" />
    <line x1="200" y1="80" x2="200" y2="100" class="image" />
    <line x1="250" y1="80" x2="250" y2="100" class="image" />
  </g>
</svg>