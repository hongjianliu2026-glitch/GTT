<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plop</text>
  <text x="50" y="120" class="subtitle">[plɑp] v. 扑通落下，扑通一声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pl- (落下) + -op (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体从高处"扑通(pl-op)"一声落下，
    <tspan x="50" dy="25">溅起水花，发出清脆的声音。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The apple plopped into the water.
  </text>
  <text x="50" y="310" class="content">
    苹果扑通一声掉进了水里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Splash -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <line x1="125" y1="100" x2="225" y2="100" class="image" />
    <!-- Falling object -->
    <circle cx="175" cy="20" r="20" class="image" />
    <line x1="175" y1="20" x2="175" y2="100" class="image" />
  </g>
</svg>