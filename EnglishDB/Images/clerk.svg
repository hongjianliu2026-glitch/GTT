<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clerk</text>
  <text x="50" y="120" class="subtitle">[klɜːrk] n. 职员，办事员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cler (源自拉丁语 "clericus"，意为"牧师")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的"牧师(cler)"在教堂里记录账目，
    <tspan x="50" dy="25">这些记录账目的人逐渐演变成了现代的职员(clerk)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clerk at the bank helped me with my transaction.
  </text>
  <text x="50" y="310" class="content">
    银行的职员帮我处理了交易。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clerk -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Paper and pen -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <line x1="120" y1="70" x2="250" y2="70" class="image" />
    <line x1="120" y1="90" x2="250" y2="90" class="image" />
    <line x1="120" y1="110" x2="250" y2="110" class="image" />
    <line x1="270" y1="70" x2="270" y2="110" class="image" />
  </g>
</svg>