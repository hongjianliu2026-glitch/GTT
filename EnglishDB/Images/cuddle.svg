<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cuddle</text>
  <text x="50" y="120" class="subtitle">[ˈkʌdl] v. 拥抱，依偎</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cud (温暖) + -dle (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个寒冷的夜晚，两个人紧紧"依偎(cud-dle)"在一起，
    <tspan x="50" dy="25">互相取暖，这种温暖的拥抱让人感到无比的安慰和幸福。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They cuddled together under a blanket to stay warm.
  </text>
  <text x="50" y="310" class="content">
    他们依偎在一起，裹着毯子取暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blanket -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two people -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Arms -->
    <line x1="130" y1="100" x2="220" y2="100" class="image" />
    <line x1="130" y1="100" x2="130" y2="130" class="image" />
    <line x1="220" y1="100" x2="220" y2="130" class="image" />
    <!-- Hearts -->
    <path d="M100,150 Q125,130 150,150 T200,150" class="image" />
    <path d="M250,150 Q275,130 300,150 T350,150" class="image" />
  </g>
</svg>