<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acquiescence</text>
  <text x="50" y="120" class="subtitle">[ˌækwiˈɛsns] n. 默许，顺从</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + quiesc (静止) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人面对一个巨大的红色按钮，"朝向(ad-)"
    <tspan x="50" dy="25">静止(quiesc)"，没有任何反抗，这就是默许(acquiescence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave her acquiescence to the plan without much enthusiasm.
  </text>
  <text x="50" y="310" class="content">
    她对这个计划表示了默许，但没有太多热情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />

    <!-- Red button -->
    <rect x="100" y="80" width="100" height="50" class="image" fill="#E74C3C" />
    <text x="135" y="110" class="content" fill="#FFFFFF">Button</text>

    <!-- Arrow pointing to button -->
    <line x1="50" y1="100" x2="150" y2="105" class="image" />
    <polygon points="150,105 145,95 145,115" class="image" />
  </g>
</svg>