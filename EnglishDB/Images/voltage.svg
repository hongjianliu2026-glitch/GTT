<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">voltage</text>
  <text x="50" y="120" class="subtitle">[ˈvoʊltɪdʒ] n. 电压</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> volt (伏特) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的电池，"伏特(volt)"
    <tspan x="50" dy="25">的力量推动着电流，这种力量就是电压(voltage)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The voltage in the circuit must be carefully controlled.
  </text>
  <text x="50" y="310" class="content">
    电路中的电压必须小心控制。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Battery -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Positive terminal -->
    <circle cx="75" cy="30" r="10" class="image" />
    <!-- Negative terminal -->
    <circle cx="75" cy="170" r="10" class="image" />
    <!-- Lightning bolt -->
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
  </g>
</svg>