<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interdependence</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərdɪˈpɛndəns] n. 相互依赖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + depend (依赖) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个小人手拉手，"在彼此之间(inter-)"
    <tspan x="50" dy="25">互相依赖(dependence)，形成了一种相互依赖(interdependence)的关系。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The countries in the region have a high degree of interdependence.
  </text>
  <text x="50" y="310" class="content">
    该地区的国家之间有着高度的相互依赖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people holding hands -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="130" y1="100" x2="170" y2="100" class="image" />
    <!-- Arms -->
    <line x1="100" y1="100" x2="70" y2="70" class="image" />
    <line x1="200" y1="100" x2="230" y2="70" class="image" />
    <!-- Legs -->
    <line x1="100" y1="130" x2="100" y2="160" class="image" />
    <line x1="200" y1="130" x2="200" y2="160" class="image" />
    <!-- Ground -->
    <line x1="50" y1="160" x2="250" y2="160" class="image" />
  </g>
</svg>