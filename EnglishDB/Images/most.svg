<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">most</text>
  <text x="50" y="120" class="subtitle">[moʊst] adj. 最多的，大多数的；adv. 最，非常</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> most (来自古英语的 "mest"，意为 "更多")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天平，"最多(most)"的财富和资源都集中在一边，
    <tspan x="50" dy="25">而另一边则空空如也。这个画面展示了"most"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He has the most books in the class.
  </text>
  <text x="50" y="310" class="content">
    他在班上拥有的书最多。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <!-- Weights on the left side -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="120" cy="140" r="20" class="image" />
    <circle cx="80" cy="140" r="20" class="image" />
    <!-- Empty right side -->
    <line x1="400" y1="20" x2="400" y2="180" class="image" />
    <line x1="400" y1="20" x2="500" y2="20" class="image" />
    <line x1="400" y1="20" x2="300" y2="20" class="image" />
  </g>
</svg>