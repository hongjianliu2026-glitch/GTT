<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bouncing</text>
  <text x="50" y="120" class="subtitle">[ˈbaʊnsɪŋ] adj. 弹跳的，有弹性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bounce (弹跳) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满弹性的球，"弹跳(bounce)"
    <tspan x="50" dy="25">在地板上，每次弹起都像是在跳舞，这就是"弹跳的(bouncing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kids were playing with a bouncing ball in the park.
  </text>
  <text x="50" y="310" class="content">
    孩子们在公园里玩着一个弹跳球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Floor -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Bouncing ball -->
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <!-- Ball shadow -->
    <ellipse cx="100" cy="200" rx="20" ry="5" class="image" />
  </g>
</svg>