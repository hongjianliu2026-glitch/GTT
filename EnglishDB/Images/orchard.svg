<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .tree { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orchard</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrtʃərd] n. 果园</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> or- (生长) + chard (田地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片田地(chard)上，"生长(or-)"
    <tspan x="50" dy="25">着各种果树，这就是一个果园(orchard)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They planted an apple orchard last spring.
  </text>
  <text x="50" y="310" class="content">
    他们去年春天种了一个苹果园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ground -->
    <rect x="0" y="150" width="400" height="50" class="image" />
    <!-- Trees -->
    <rect x="50" y="50" width="50" height="100" class="tree" />
    <rect x="150" y="50" width="50" height="100" class="tree" />
    <rect x="250" y="50" width="50" height="100" class="tree" />
    <!-- Apples -->
    <circle cx="75" cy="40" r="10" class="image" />
    <circle cx="175" cy="40" r="10" class="image" />
    <circle cx="275" cy="40" r="10" class="image" />
  </g>
</svg>