<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">symphony</text>
  <text x="50" y="120" class="subtitle">[ˈsɪmfəni] n. 交响乐，交响曲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sym- (一起) + phon (声音)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的音乐厅，"一起发出(sym-phon)"
    <tspan x="50" dy="25">和谐的声音，这些声音交织成了一首交响乐(symphony)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The symphony orchestra performed beautifully last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚交响乐团表演得非常出色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Music Hall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stage -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Instruments -->
    <circle cx="80" cy="100" r="15" class="image" /> <!-- Violin -->
    <circle cx="120" cy="100" r="15" class="image" /> <!-- Cello -->
    <circle cx="160" cy="100" r="15" class="image" /> <!-- Flute -->
    <circle cx="200" cy="100" r="15" class="image" /> <!-- Trumpet -->
    <circle cx="240" cy="100" r="15" class="image" /> <!-- Piano -->
    <!-- Musicians -->
    <circle cx="80" cy="150" r="15" class="image" />
    <circle cx="120" cy="150" r="15" class="image" />
    <circle cx="160" cy="150" r="15" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <circle cx="240" cy="150" r="15" class="image" />
    <!-- Sound Waves -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
  </g>
</svg>