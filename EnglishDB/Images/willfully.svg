<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">willfully</text>
  <text x="50" y="120" class="subtitle">[ˈwɪlfəli] adv. 故意地，任性固执地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> will (意愿) + -ful (充满) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"充满意愿(will-ful)"
    <tspan x="50" dy="25">地跳下去，这就是故意的(willfully)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He willfully ignored the warning signs.
  </text>
  <text x="50" y="310" class="content">
    他故意忽视了警告信号。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person jumping -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="30" y2="220" class="image" />
    <line x1="50" y1="190" x2="70" y2="220" class="image" />
    <line x1="50" y1="175" x2="80" y2="165" class="image" />
    <!-- Arrow pointing down -->
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <polygon points="95,150 105,150 100,160" class="image" />
    <!-- Will symbol -->
    <text x="150" y="100" class="content" style="font-size: 48px;">W</text>
  </g>
</svg>