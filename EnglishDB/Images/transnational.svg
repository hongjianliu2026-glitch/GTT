<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transnational</text>
  <text x="50" y="120" class="subtitle">[ˌtrænzˈnæʃənl] adj. 跨国的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + nation (国家) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的桥梁，"跨越(trans-)"
    <tspan x="50" dy="25">多个国家(nation)，连接着不同文化，这就是跨国的(transnational)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is a transnational corporation with branches in many countries.
  </text>
  <text x="50" y="310" class="content">
    这家公司是一家在许多国家设有分支机构的跨国公司。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bridge -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="100" x2="0" y2="150" class="image" />
    <line x1="350" y1="100" x2="350" y2="150" class="image" />
    <!-- Countries -->
    <rect x="50" y="150" width="50" height="50" class="image" />
    <rect x="250" y="150" width="50" height="50" class="image" />
    <!-- Flags -->
    <line x1="75" y1="150" x2="75" y2="100" class="image" />
    <line x1="275" y1="150" x2="275" y2="100" class="image" />
    <polygon points="75,100 65,80 85,80" class="image" />
    <polygon points="275,100 265,80 285,80" class="image" />
  </g>
</svg>