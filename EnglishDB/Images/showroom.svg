<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">showroom</text>
  <text x="50" y="120" class="subtitle">[ˈʃoʊˌrum] n. 陈列室，展览室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> show (展示) + room (房间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的房间里，"展示(show)"
    <tspan x="50" dy="25">着各种豪华汽车，这个房间就是陈列室(showroom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new car models were displayed in the showroom.
  </text>
  <text x="50" y="310" class="content">
    新款汽车在陈列室中展出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="270" cy="100" r="15" class="image" />
    <!-- Showroom sign -->
    <text x="150" y="180" class="image" style="font: bold 24px sans-serif; fill: #7F8C8D;">Showroom</text>
  </g>
</svg>