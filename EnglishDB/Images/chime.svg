<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chime</text>
  <text x="50" y="120" class="subtitle">[tʃaɪm] n. 钟声，和谐的声音；v. 发出钟声，和谐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chim (钟声) + e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钟楼，钟声"叮咚(chim)"作响，
    <tspan x="50" dy="25">整个城市都被这和谐的声音(chime)所包围。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The church bells chimed at noon.
  </text>
  <text x="50" y="310" class="content">
    教堂的钟声在正午时分响起。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bell tower -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bell -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Striking bell -->
    <line x1="175" y1="50" x2="175" y2="150" class="image" />
    <line x1="175" y1="50" x2="125" y2="75" class="image" />
    <line x1="175" y1="50" x2="225" y2="75" class="image" />
    <!-- Sound waves -->
    <circle cx="175" cy="200" r="20" class="image" />
    <circle cx="175" cy="250" r="30" class="image" />
    <circle cx="175" cy="300" r="40" class="image" />
  </g>
</svg>