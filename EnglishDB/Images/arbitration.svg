<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arbitration</text>
  <text x="50" y="120" class="subtitle">[ˌɑːrbɪˈtreɪʃn] n. 仲裁，公断</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arbi- (法官) + tration (过程)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官(arbi-)坐在中间，两边是争吵的双方，
    <tspan x="50" dy="25">法官通过公正的判断(tration)来解决他们的争议，这就是仲裁(arbitration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dispute was resolved through arbitration.
  </text>
  <text x="50" y="310" class="content">
    争议通过仲裁得到了解决。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Parties -->
    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="130" y2="230" class="image" />
    <line x1="150" y1="200" x2="170" y2="230" class="image" />
    <line x1="150" y1="180" x2="190" y2="170" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <line x1="250" y1="165" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="230" y2="230" class="image" />
    <line x1="250" y1="200" x2="270" y2="230" class="image" />
    <line x1="250" y1="180" x2="210" y2="170" class="image" />
    <!-- Gavel -->
    <rect x="190" y="80" width="20" height="40" class="image" />
    <line x1="200" y1="80" x2="200" y2="60" class="image" />
  </g>
</svg>