<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">episodic</text>
  <text x="50" y="120" class="subtitle">[ˌɛpɪˈsɒdɪk] adj. 插曲的，片段的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> epi- (在...之间) + -sod- (插入) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一部电视剧，"在剧情之间(epi-)"
    <tspan x="50" dy="25">插入(sod-)一些小故事，这些小故事就是插曲(episodic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The show has an episodic structure, with each episode telling a self-contained story.
  </text>
  <text x="50" y="310" class="content">
    这部剧采用了插曲式的结构，每集都讲述一个独立的故事。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- TV screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Episode lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Episode markers -->
    <circle cx="100" cy="65" r="10" class="image" />
    <circle cx="150" cy="65" r="10" class="image" />
    <circle cx="200" cy="65" r="10" class="image" />
    <circle cx="250" cy="65" r="10" class="image" />
  </g>
</svg>