<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rational</text>
  <text x="50" y="120" class="subtitle">[ˈræʃənl] adj. 理性的，合理的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ratio (比率) + -nal (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考问题时，"按照比率(ratio)"
    <tspan x="50" dy="25">和逻辑来分析，这种思考方式就是理性的(rational)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made a rational decision after weighing all the options.
  </text>
  <text x="50" y="310" class="content">
    她在权衡所有选项后做出了一个理性的决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Thought bubbles -->
    <ellipse cx="150" cy="50" rx="30" ry="20" class="image" />
    <ellipse cx="200" cy="70" rx="35" ry="25" class="image" />
    <ellipse cx="250" cy="90" rx="40" ry="30" class="image" />
    <!-- Ratio symbol -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="100" y1="100" x2="100" y2="200" class="image" />
    <!-- Rational thinking -->
    <text x="50" y="250" class="content" fill="#2980B9">理性思考</text>
  </g>
</svg>