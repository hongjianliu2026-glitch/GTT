<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">informer</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfɔːrmər] n. 告密者，提供信息者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + form (形式) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的告密者，悄悄地"进入(in-)"
    <tspan x="50" dy="25">某个组织，"形成(form)"信息并传递出去。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The informer provided crucial information to the police.
  </text>
  <text x="50" y="310" class="content">
    告密者向警方提供了关键信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spy -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Information bubble -->
    <path d="M 70 80 Q 100 50 130 80 T 190 80" class="image" />
    <text x="90" y="90" class="content">Info</text>
    <!-- Organization -->
    <rect x="50" y="120" width="200" height="100" class="image" />
    <text x="100" y="170" class="content">Org</text>
  </g>
</svg>