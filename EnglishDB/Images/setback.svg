<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">setback</text>
  <text x="50" y="120" class="subtitle">[ˈsɛtbæk] n. 挫折，倒退</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> set (放置) + back (向后)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人正在努力前进，突然被"放置(set)"
    <tspan x="50" dy="25">向后(back)，这就是一个挫折(setback)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project suffered a major setback due to budget cuts.
  </text>
  <text x="50" y="310" class="content">
    由于预算削减，该项目遭受了重大挫折。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking forward -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="80" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="80" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <!-- Arrow pushing back -->
    <line x1="200" y1="100" x2="150" y2="100" class="image" />
    <line x1="200" y1="100" x2="190" y2="90" class="image" />
    <line x1="200" y1="100" x2="190" y2="110" class="image" />
  </g>
</svg>