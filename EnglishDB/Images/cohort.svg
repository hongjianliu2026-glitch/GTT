<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cohort</text>
  <text x="50" y="120" class="subtitle">[ˈkoʊhɔrt] n. 一群，同伴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + hort (聚集)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"共同聚集(co-hort)"在一起，形成了一个紧密的群体。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cohort of students graduated together.
  </text>
  <text x="50" y="310" class="content">
    这群学生一起毕业了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Lines connecting them -->
    <line x1="70" y1="70" x2="90" y2="70" class="image" />
    <line x1="120" y1="70" x2="140" y2="70" class="image" />
    <line x1="170" y1="70" x2="190" y2="70" class="image" />
    <line x1="220" y1="70" x2="240" y2="70" class="image" />
  </g>
</svg>