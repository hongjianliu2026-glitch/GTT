<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unbalanced</text>
  <text x="50" y="120" class="subtitle">[ʌnˈbælənst] adj. 不平衡的，不稳定的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + balance (平衡)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个跷跷板，一边重一边轻，"不平衡(un-balanced)"
    <tspan x="50" dy="25">的状态让人无法安心玩耍。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scales were unbalanced, showing an incorrect weight.
  </text>
  <text x="50" y="310" class="content">
    天平不平衡，显示了错误的重量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seesaw -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Heavy side -->
    <rect x="50" y="-20" width="100" height="40" class="image" />
    <!-- Light side -->
    <rect x="200" y="-20" width="50" height="40" class="image" />
    <!-- Person on heavy side -->
    <circle cx="100" cy="-40" r="15" class="image" />
    <line x1="100" y1="-25" x2="100" y2="0" class="image" />
    <line x1="100" y1="0" x2="80" y2="30" class="image" />
    <line x1="100" y1="0" x2="120" y2="30" class="image" />
    <!-- Person on light side -->
    <circle cx="225" cy="-40" r="10" class="image" />
    <line x1="225" y1="-30" x2="225" y2="0" class="image" />
    <line x1="225" y1="0" x2="215" y2="20" class="image" />
    <line x1="225" y1="0" x2="235" y2="20" class="image" />
  </g>
</svg>