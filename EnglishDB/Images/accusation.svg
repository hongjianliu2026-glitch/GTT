<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accusation</text>
  <text x="50" y="120" class="subtitle">[ˌækjuˈzeɪʃn] n. 指控，指责</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (朝向) + cus (指责) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"朝向(ac-)"另一个人，"指责(cus)"
    <tspan x="50" dy="25">他做了坏事，这种行为就构成了指控(accusation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police made a serious accusation against the suspect.
  </text>
  <text x="50" y="310" class="content">
    警方对嫌疑人提出了严重的指控。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person pointing -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <circle cx="15" cy="15" r="15" class="image" />
    <line x1="15" y1="30" x2="15" y2="70" class="image" />
    <line x1="15" y1="50" x2="0" y2="60" class="image" />
    <line x1="15" y1="50" x2="30" y2="60" class="image" />
    <line x1="15" y1="70" x2="0" y2="100" class="image" />
    <line x1="15" y1="70" x2="30" y2="100" class="image" />

    <!-- Person being accused -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="130" x2="90" y2="120" class="image" />
    <line x1="120" y1="130" x2="150" y2="120" class="image" />
    <line x1="120" y1="150" x2="90" y2="180" class="image" />
    <line x1="120" y1="150" x2="150" y2="180" class="image" />
  </g>
</svg>