<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #8B4513; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #000000; stroke-width: 2; fill: #000000; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ebony</text>
  <text x="50" y="120" class="subtitle">[ˈɛbəni] n. 乌木，黑檀木</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ebon (黑檀木)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片神秘的森林，"黑檀木(ebon)"
    <tspan x="50" dy="25">在月光下闪烁着深邃的光泽，仿佛吸收了所有的光线，</tspan>
    <tspan x="50" dy="25">这种木材因其深黑色而被称为乌木(ebony)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The piano keys were made of ebony and ivory.
  </text>
  <text x="50" y="310" class="content">
    钢琴的琴键是由乌木和象牙制成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree trunk -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Moon -->
    <circle cx="100" cy="50" r="30" class="image" />
    <!-- Moonlight -->
    <line x1="100" y1="80" x2="100" y2="300" class="image" />
    <!-- Tree branches -->
    <line x1="0" y1="50" x2="200" y2="50" class="image" />
    <line x1="0" y1="100" x2="200" y2="100" class="image" />
    <line x1="0" y1="150" x2="200" y2="150" class="image" />
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <line x1="0" y1="250" x2="200" y2="250" class="image" />
  </g>
</svg>