<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sincerity</text>
  <text x="50" y="120" class="subtitle">[sɪnˈsɛrɪti] n. 真诚，诚实</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sin- (自己) + cer (真实) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"真实地面对自己(sin-cer)"，
    <tspan x="50" dy="25">展现出内心的真诚(sincerity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her sincerity in helping others was evident.
  </text>
  <text x="50" y="310" class="content">
    她帮助他人的真诚是显而易见的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="125" y2="140" class="image" />
    <line x1="175" y1="150" x2="225" y2="140" class="image" />
    <!-- Reflection -->
    <circle cx="175" cy="300" r="30" class="image" />
    <line x1="175" y1="330" x2="175" y2="380" class="image" />
    <line x1="175" y1="380" x2="150" y2="420" class="image" />
    <line x1="175" y1="380" x2="200" y2="420" class="image" />
    <line x1="175" y1="350" x2="125" y2="340" class="image" />
    <line x1="175" y1="350" x2="225" y2="340" class="image" />
  </g>
</svg>