<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B7D7D; }
      .content { font: 18px sans-serif; fill: #566573; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scrapbook</text>
  <text x="50" y="120" class="subtitle">[ˈskreɪpˌbʊk] n. 剪贴簿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scrap (碎片) + book (书)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子把各种"碎片(scrap)"
    <tspan x="50" dy="25">粘贴在一本书(book)里，</tspan>
    <tspan x="50" dy="25">这本充满回忆的书就是剪贴簿(scrapbook)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She keeps a scrapbook of all her travel memories.
  </text>
  <text x="50" y="310" class="content">
    她保留了一本记录所有旅行记忆的剪贴簿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pages -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="150" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <!-- Scraps -->
    <rect x="70" y="40" width="60" height="40" class="image" />
    <rect x="120" y="60" width="60" height="40" class="image" />
    <rect x="170" y="80" width="60" height="40" class="image" />
    <rect x="220" y="100" width="60" height="40" class="image" />
    <!-- Glue -->
    <line x1="300" y1="120" x2="340" y2="120" class="image" />
    <line x1="300" y1="130" x2="340" y2="130" class="image" />
    <line x1="300" y1="140" x2="340" y2="140" class="image" />
  </g>
</svg>