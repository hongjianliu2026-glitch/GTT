<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jar</text>
  <text x="50" y="120" class="subtitle">[dʒɑːr] n. 罐子，广口瓶；v. 震动，刺激</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "jare"，意为“震动”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的罐子(jar)，突然被打开，里面的东西"震动(jar)"了出来，
    <tspan x="50" dy="25">吓得周围的人都跳了起来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She accidentally jarred the jar while opening it.
  </text>
  <text x="50" y="310" class="content">
    她在打开罐子时不小心震动了它。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Jar -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <rect x="20" y="20" width="160" height="260" class="image" />
    <!-- Lid -->
    <rect x="10" y="10" width="180" height="30" class="image" />
    <!-- Shocked face -->
    <circle cx="100" cy="350" r="30" class="image" />
    <line x1="80" y1="340" x2="120" y2="340" class="image" />
    <line x1="90" y1="360" x2="110" y2="360" class="image" />
    <line x1="100" y1="370" x2="100" y2="380" class="image" />
    <line x1="90" y1="380" x2="110" y2="380" class="image" />
  </g>
</svg>