<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brat</text>
  <text x="50" y="120" class="subtitle">[bræt] n. 顽童，小淘气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brat (源自中古英语，意为“小”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小顽童(brat)在厨房里捣乱，
    <tspan x="50" dy="25">把面粉撒得到处都是，脸上还沾满了巧克力酱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The brat spilled juice all over the floor.
  </text>
  <text x="50" y="310" class="content">
    那个小淘气把果汁洒了一地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kitchen counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flour spill -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="70" x2="300" y2="70" class="image" />
    <line x1="50" y1="90" x2="300" y2="90" class="image" />
    <!-- Chocolate sauce on face -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Chocolate sauce -->
    <line x1="190" y1="90" x2="210" y2="90" class="image" />
    <line x1="190" y1="80" x2="210" y2="80" class="image" />
    <line x1="190" y1="70" x2="210" y2="70" class="image" />
  </g>
</svg>