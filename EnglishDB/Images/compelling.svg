<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compelling</text>
  <text x="50" y="120" class="subtitle">[kəmˈpɛlɪŋ] adj. 引人注目的，令人信服的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + pel (推)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者用"共同推动(com-pel)"的力量，
    <tspan x="50" dy="25">让听众无法抗拒，深深被吸引，这就是引人注目的(compelling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie had a compelling storyline that kept us on the edge of our seats.
  </text>
  <text x="50" y="310" class="content">
    这部电影有一个引人入胜的故事情节，让我们一直坐在座位边缘。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Speaker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Audience -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Force arrows -->
    <line x1="20" y1="100" x2="100" y2="100" class="image">
      <animate attributeName="x2" from="20" to="100" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="20" y1="100" x2="150" y2="100" class="image">
      <animate attributeName="x2" from="20" to="150" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="20" y1="100" x2="200" y2="100" class="image">
      <animate attributeName="x2" from="20" to="200" dur="2s" repeatCount="indefinite" />
    </line>
  </g>
</svg>