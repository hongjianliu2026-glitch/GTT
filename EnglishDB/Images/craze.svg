<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">craze</text>
  <text x="50" y="120" class="subtitle">[kreɪz] n. 狂热，风尚；v. 使疯狂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cra- (疯狂) + -ze (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人为了某个新奇的玩意儿"疯狂(cra-)"
    <tspan x="50" dy="25">地追逐，这种狂热(craze)让人难以抗拒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new fashion craze swept the nation.
  </text>
  <text x="50" y="310" class="content">
    新的时尚风潮席卷了全国。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People chasing -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="20" y1="0" x2="120" y2="100" class="image" />
    <line x1="40" y1="0" x2="140" y2="100" class="image" />
    <line x1="60" y1="0" x2="160" y2="100" class="image" />
    <line x1="80" y1="0" x2="180" y2="100" class="image" />
    <!-- New toy -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="180" class="image" />
    <line x1="200" y1="160" x2="220" y2="180" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
  </g>
</svg>