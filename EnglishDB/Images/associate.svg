<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">associate</text>
  <text x="50" y="120" class="subtitle">[əˈsoʊʃieɪt] v. 使联合，使发生联系；n. 伙伴，同事</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> as- (朝向) + soci (同伴) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人手拉手，"朝向(as-)"彼此，"成为同伴(soci)"，
    <tspan x="50" dy="25">他们就是"联合(associate)"在一起的伙伴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She often associates with creative people.
  </text>
  <text x="50" y="310" class="content">
    她经常与有创造力的人交往。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people holding hands -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <!-- Arrows pointing towards each other -->
    <polygon points="30,100 45,95 45,105" class="image" />
    <polygon points="170,100 155,95 155,105" class="image" />
  </g>
</svg>