<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">senator</text>
  <text x="50" y="120" class="subtitle">[ˈsɛnətər] n. 参议员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sen- (老) + -ator (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"老(sen-)"人，坐在高高的椅子上，
    <tspan x="50" dy="25">代表着智慧和权威，他就是参议员(senator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The senator proposed a new bill.
  </text>
  <text x="50" y="310" class="content">
    参议员提出了一项新法案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Old man -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Chair -->
    <rect x="20" y="150" width="60" height="50" class="image" />
    <line x1="50" y1="200" x2="50" y2="250" class="image" />
    <line x1="20" y1="250" x2="80" y2="250" class="image" />
  </g>
</svg>