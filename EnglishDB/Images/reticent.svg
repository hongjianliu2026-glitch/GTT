<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reticent</text>
  <text x="50" y="120" class="subtitle">[ˈrɛtɪsnt] adj. 沉默寡言的，不情愿的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + tic (说话) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在社交场合中，"向后退缩(re-tic)"，
    <tspan x="50" dy="25">不愿意说话，显得非常沉默寡言(reticent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was reticent about his past experiences.
  </text>
  <text x="50" y="310" class="content">
    他对自己的过去经历保持沉默。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="30" y2="250" class="image" />
    <line x1="50" y1="200" x2="70" y2="250" class="image" />
    <!-- Mouth -->
    <line x1="40" y1="110" x2="60" y2="110" class="image" />
    <!-- Speech bubble -->
    <path d="M 100 80 Q 150 50 200 80 Q 250 110 200 140 Q 150 170 100 140 Z" class="image" />
    <text x="120" y="110" class="content" fill="#34495E">...</text>
  </g>
</svg>