<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spender</text>
  <text x="50" y="120" class="subtitle">[ˈspendər] n. 花钱者，挥霍者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spend (花费) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个挥霍者(spender)，手里拿着一大把钞票，
    <tspan x="50" dy="25">不停地往外撒钱，就像一个"撒钱机器"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is known as a big spender at the casino.
  </text>
  <text x="50" y="310" class="content">
    他在赌场里以大手大脚花钱而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Money -->
    <rect x="50" y="80" width="30" height="20" class="image" />
    <rect x="80" y="80" width="30" height="20" class="image" />
    <rect x="110" y="80" width="30" height="20" class="image" />
    <rect x="140" y="80" width="30" height="20" class="image" />
    <rect x="170" y="80" width="30" height="20" class="image" />
    <!-- Money flying -->
    <line x1="50" y1="80" x2="30" y2="60" class="image" />
    <line x1="80" y1="80" x2="60" y2="60" class="image" />
    <line x1="110" y1="80" x2="90" y2="60" class="image" />
    <line x1="140" y1="80" x2="120" y2="60" class="image" />
    <line x1="170" y1="80" x2="150" y2="60" class="image" />
  </g>
</svg>