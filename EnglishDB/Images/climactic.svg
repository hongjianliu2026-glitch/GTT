<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">climactic</text>
  <text x="50" y="120" class="subtitle">[klaɪˈmæktɪk] adj. 高潮的，顶点的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clima (顶点) + -tic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场戏剧的高潮部分，演员们站在舞台的"顶点(clima)"，
    <tspan x="50" dy="25">他们的表演达到了最激动人心的时刻，这就是climactic的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The climactic scene of the movie left the audience in awe.
  </text>
  <text x="50" y="310" class="content">
    电影的高潮场景让观众惊叹不已。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actors -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Spotlight -->
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="180" y1="40" x2="220" y2="40" class="image" />
    <line x1="160" y1="60" x2="240" y2="60" class="image" />
    <line x1="140" y1="80" x2="260" y2="80" class="image" />
    <line x1="120" y1="100" x2="280" y2="100" class="image" />
    <line x1="100" y1="120" x2="300" y2="120" class="image" />
    <line x1="80" y1="140" x2="320" y2="140" class="image" />
    <line x1="60" y1="160" x2="340" y2="160" class="image" />
  </g>
</svg>