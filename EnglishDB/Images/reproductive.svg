<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reproductive</text>
  <text x="50" y="120" class="subtitle">[ˌriːprəˈdʌktɪv] adj. 生殖的，再生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + produce (生产) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶在花丛中，"再次生产(re-produce)"
    <tspan x="50" dy="25">出更多的蝴蝶，这就是生殖(reproductive)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The reproductive system of mammals is complex.
  </text>
  <text x="50" y="310" class="content">
    哺乳动物的生殖系统很复杂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flower -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="100" r="50" class="image" />
    <circle cx="125" cy="150" r="50" class="image" />
    <circle cx="100" cy="200" r="50" class="image" />
    <circle cx="150" cy="200" r="50" class="image" />
    <!-- Butterfly -->
    <path d="M50,100 C50,50 150,50 150,100" class="image" />
    <path d="M50,100 C50,150 150,150 150,100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
  </g>
</svg>