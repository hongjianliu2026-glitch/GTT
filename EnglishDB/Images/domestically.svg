<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">domestically</text>
  <text x="50" y="120" class="subtitle">[dəˈmestɪkəli] adv. 在国内，家庭式地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dom (家) + est (存在) + -ic (形容词后缀) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温馨的家庭场景，"家(dom)"中
    <tspan x="50" dy="25">"存在(est)"着和谐与爱，这就是"家庭式地(domestically)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is expanding domestically.
  </text>
  <text x="50" y="310" class="content">
    这家公司正在国内扩张。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,50 350,180" class="image" />
    <!-- Door -->
    <rect x="150" y="120" width="50" height="60" class="image" />
    <!-- Window -->
    <rect x="80" y="80" width="40" height="40" class="image" />
    <rect x="230" y="80" width="40" height="40" class="image" />
    <!-- Family -->
    <circle cx="100" cy="220" r="15" class="image" />
    <circle cx="150" cy="220" r="15" class="image" />
    <circle cx="200" cy="220" r="15" class="image" />
    <line x1="100" y1="235" x2="100" y2="270" class="image" />
    <line x1="150" y1="235" x2="150" y2="270" class="image" />
    <line x1="200" y1="235" x2="200" y2="270" class="image" />
    <line x1="100" y1="270" x2="80" y2="300" class="image" />
    <line x1="100" y1="270" x2="120" y2="300" class="image" />
    <line x1="150" y1="270" x2="130" y2="300" class="image" />
    <line x1="150" y1="270" x2="170" y2="300" class="image" />
    <line x1="200" y1="270" x2="180" y2="300" class="image" />
    <line x1="200" y1="270" x2="220" y2="300" class="image" />
  </g>
</svg>