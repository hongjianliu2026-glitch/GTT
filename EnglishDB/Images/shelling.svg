<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shelling</text>
  <text x="50" y="120" class="subtitle">[ˈʃɛlɪŋ] n. 剥壳，炮击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shell (壳) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在剥玉米的壳，"剥壳(shelling)"
    <tspan x="50" dy="25">的动作正在进行，或者想象炮弹在空中飞舞，"炮击(shelling)"</tspan>
    <tspan x="50" dy="25">的场景正在进行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers were under heavy shelling last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚士兵们遭到了猛烈的炮击。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Corn cob -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <circle cx="20" cy="50" r="10" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="110" cy="50" r="10" class="image" />
    <circle cx="140" cy="50" r="10" class="image" />
    <!-- Farmer -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
    <!-- Shelling -->
    <line x1="200" y1="0" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="120" class="image" />
    <line x1="200" y1="100" x2="220" y2="120" class="image" />
    <line x1="200" y1="100" x2="180" y2="80" class="image" />
    <line x1="200" y1="100" x2="220" y2="80" class="image" />
  </g>
</svg>