<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coffer</text>
  <text x="50" y="120" class="subtitle">[ˈkɒfə(r)] n. 保险箱，钱箱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cof- (箱子) + -fer (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的保险箱，"箱子(cof-)"里装满了金币，
    <tspan x="50" dy="25">守护着财富，就像一个守护者(fer)一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He kept his valuable coins in a secure coffer.
  </text>
  <text x="50" y="310" class="content">
    他把珍贵的硬币放在一个安全的保险箱里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffer box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Lock -->
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Coins -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="70" cy="50" r="10" class="image" />
    <circle cx="90" cy="50" r="10" class="image" />
    <circle cx="110" cy="50" r="10" class="image" />
    <circle cx="130" cy="50" r="10" class="image" />
  </g>
</svg>