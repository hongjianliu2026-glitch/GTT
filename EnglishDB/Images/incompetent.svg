<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incompetent</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkɒmpɪtənt] adj. 无能力的，不胜任的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + com- (共同) + pet (追求) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"不(in-)"能"共同(com-)"追求"目标(pet)"的人，
    <tspan x="50" dy="25">他总是失败，显得"无能力(incompetent)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new employee was deemed incompetent for the job.
  </text>
  <text x="50" y="310" class="content">
    新员工被认为不胜任这份工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person struggling -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Target -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="180" y1="150" x2="220" y2="150" class="image" />
    <!-- Missed arrow -->
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <polygon points="180,100 170,90 170,110" class="image" />
  </g>
</svg>