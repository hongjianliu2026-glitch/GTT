<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wand</text>
  <text x="50" y="120" class="subtitle">[wɒnd] n. 魔杖，棍子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wand (源自中古英语 wand, 意为“棍子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔法师手持一根魔杖(wand)，轻轻一挥，
    <tspan x="50" dy="25">瞬间变出一只巨大的兔子，兔子跳跃着，仿佛在嘲笑魔法师的魔法。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician waved his wand and a rabbit appeared.
  </text>
  <text x="50" y="310" class="content">
    魔术师挥动魔杖，一只兔子出现了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wand -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <circle cx="50" cy="15" r="10" class="image" />
    <!-- Magician -->
    <circle cx="50" cy="200" r="20" class="image" />
    <line x1="50" y1="220" x2="50" y2="260" class="image" />
    <line x1="50" y1="260" x2="30" y2="300" class="image" />
    <line x1="50" y1="260" x2="70" y2="300" class="image" />
    <line x1="50" y1="240" x2="90" y2="230" class="image" />
    <!-- Rabbit -->
    <circle cx="150" cy="200" r="20" class="image" />
    <line x1="150" y1="220" x2="150" y2="260" class="image" />
    <line x1="150" y1="260" x2="130" y2="300" class="image" />
    <line x1="150" y1="260" x2="170" y2="300" class="image" />
    <line x1="150" y1="240" x2="190" y2="230" class="image" />
    <line x1="150" y1="240" x2="110" y2="230" class="image" />
  </g>
</svg>