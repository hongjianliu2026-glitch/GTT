<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">priestly</text>
  <text x="50" y="120" class="subtitle">[ˈpriːstli] adj. 牧师的，神职人员的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> priest (牧师) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个牧师穿着他的<tspan x="50" dy="25">神职服装，手持圣经，站在教堂前，</tspan>
    <tspan x="50" dy="25">他的形象就是"牧师的(priestly)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The priestly robes were adorned with gold threads.
  </text>
  <text x="50" y="310" class="content">
    牧师的袍子上装饰着金线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Priest -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Robe -->
    <rect x="30" y="180" width="40" height="60" class="image" />
    <!-- Bible -->
    <rect x="60" y="120" width="30" height="40" class="image" />
  </g>
</svg>