<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .smoke { fill: #BDC3C7; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smoke</text>
  <text x="50" y="120" class="subtitle">[smoʊk] n. 烟；v. 吸烟，冒烟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smog (烟雾)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的烟囱，"冒出(smoke)"
    <tspan x="50" dy="25">滚滚浓烟，这些烟雾弥漫在空气中，形成了烟(smoke)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The factory chimney was smoking heavily.
  </text>
  <text x="50" y="310" class="content">
    工厂的烟囱冒着浓烟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chimney -->
    <rect x="100" y="0" width="50" height="150" class="image" />
    <!-- Smoke -->
    <ellipse cx="125" cy="0" rx="50" ry="20" class="smoke" />
    <ellipse cx="125" cy="-30" rx="40" ry="15" class="smoke" />
    <ellipse cx="125" cy="-60" rx="30" ry="10" class="smoke" />
  </g>
</svg>