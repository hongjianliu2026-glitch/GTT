<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">singer</text>
  <text x="50" y="120" class="subtitle">[ˈsɪŋər] n. 歌手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sing (唱) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个歌手站在舞台上，"唱(sing)"
    <tspan x="50" dy="25">出美妙的旋律，他就是歌手(singer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a famous singer with a powerful voice.
  </text>
  <text x="50" y="310" class="content">
    她是一位声音洪亮的著名歌手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Singer -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="140" y2="130" class="image" />
    <line x1="175" y1="150" x2="210" y2="130" class="image" />
    <line x1="175" y1="180" x2="140" y2="200" class="image" />
    <line x1="175" y1="180" x2="210" y2="200" class="image" />
    <!-- Microphone -->
    <line x1="175" y1="130" x2="175" y2="80" class="image" />
    <circle cx="175" cy="70" r="10" class="image" />
  </g>
</svg>