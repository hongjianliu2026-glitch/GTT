<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .butter { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buttered</text>
  <text x="50" y="120" class="subtitle">[ˈbʌtəd] adj. 涂了黄油的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> butter (黄油) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片面包上涂满了金黄的黄油，"涂了黄油(buttered)"
    <tspan x="50" dy="25">的面包看起来诱人又美味。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spread buttered toast on the table.
  </text>
  <text x="50" y="310" class="content">
    她把涂了黄油的吐司放在桌上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bread -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Butter -->
    <rect x="70" y="50" width="210" height="30" class="butter" />
    <rect x="70" y="100" width="210" height="30" class="butter" />
    <!-- Knife -->
    <line x1="300" y1="50" x2="350" y2="100" class="image" />
    <line x1="300" y1="100" x2="350" y2="150" class="image" />
  </g>
</svg>