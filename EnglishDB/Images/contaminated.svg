<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .contaminated { fill: #800000; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contaminated</text>
  <text x="50" y="120" class="subtitle">[kənˈtæmɪˌneɪtɪd] adj. 被污染的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tamin (接触) + -ate (动词后缀) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原本纯净的苹果，"接触(tamin)"
    <tspan x="50" dy="25">了脏东西，变得"被污染(contaminated)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The water was contaminated by the oil spill.
  </text>
  <text x="50" y="310" class="content">
    水被石油泄漏污染了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clean apple -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Dirty apple -->
    <circle cx="300" cy="100" r="50" class="image contaminated" />
    <!-- Dirt spots -->
    <circle cx="280" cy="80" r="10" class="image contaminated" />
    <circle cx="320" cy="110" r="10" class="image contaminated" />
    <circle cx="290" cy="130" r="10" class="image contaminated" />
    <!-- Arrows -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <polygon points="245,95 255,100 245,105" class="image" />
  </g>
</svg>