<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E7E7; }
      .title { font: bold 48px sans-serif; fill: #8B0000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grimly</text>
  <text x="50" y="120" class="subtitle">[ˈɡrɪmli] adv. 严峻地，冷酷地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grim (冷酷的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冷酷的(grim)战士，面无表情地(ly)
    <tspan x="50" dy="25">面对敌人，他的表情严峻(grimly)，令人不寒而栗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He faced the challenge grimly, without a hint of fear.
  </text>
  <text x="50" y="310" class="content">
    他冷酷地面对挑战，没有一丝恐惧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grim face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="80" y1="130" x2="90" y2="130" class="image" />
    <line x1="110" y1="130" x2="120" y2="130" class="image" />
    <!-- Cold expression -->
    <line x1="80" y1="80" x2="90" y2="80" class="image" />
    <line x1="110" y1="80" x2="120" y2="80" class="image" />
  </g>
</svg>