<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inlet</text>
  <text x="50" y="120" class="subtitle">[ˈɪnlet] n. 入口，水湾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + let (让)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流"让(let)"水"进入(in)"一个狭窄的通道，
    <tspan x="50" dy="25">这个通道就是水湾(inlet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boat sailed into the inlet and anchored.
  </text>
  <text x="50" y="310" class="content">
    船驶入水湾并停泊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- River -->
    <line x1="0" y1="100" x2="300" y2="100" class="image" />
    <!-- Inlet -->
    <line x1="150" y1="100" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <!-- Water flow -->
    <polyline points="150,100 150,75 175,75 175,100" class="image" />
    <polyline points="175,100 175,75 200,75 200,100" class="image" />
    <!-- Boat -->
    <rect x="160" y="80" width="30" height="10" class="image" />
    <line x1="175" y1="80" x2="175" y2="70" class="image" />
  </g>
</svg>