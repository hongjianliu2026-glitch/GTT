<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deceptive</text>
  <text x="50" y="120" class="subtitle">[dɪˈseptɪv] adj. 欺骗性的，误导的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + cept (拿) + ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一个看似美味的苹果，但当你咬下去时，发现它是"拿走(de-cept)"了真实味道的"欺骗性(deceptive)"苹果。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The advertisement's claims were deceptive; the product did not work as promised.
  </text>
  <text x="50" y="310" class="content">
    广告的声明是欺骗性的；产品并没有像承诺的那样工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apple -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF6347" />
    <!-- Bite mark -->
    <path d="M 70 100 A 30 30 0 0 1 130 100" class="image" fill="#FFF" />
    <!-- Question mark -->
    <text x="150" y="120" class="image" font-size="80" fill="#FFD700">?</text>
  </g>
</svg>