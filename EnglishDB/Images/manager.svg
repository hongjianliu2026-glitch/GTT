<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">manager</text>
  <text x="50" y="120" class="subtitle">[ˈmænɪdʒər] n. 经理，管理者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man (手) + age (做) + er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个经理用他的"手(man)"来"做(age)"
    <tspan x="50" dy="25">管理，指挥团队，这就是管理者(manager)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager organized the team meeting efficiently.
  </text>
  <text x="50" y="310" class="content">
    经理高效地组织了团队会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Manager -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Hand -->
    <line x1="20" y1="150" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="60" y2="140" class="image" />
    <line x1="70" y1="150" x2="60" y2="160" class="image" />
    <line x1="70" y1="150" x2="80" y2="140" class="image" />
    <line x1="70" y1="150" x2="80" y2="160" class="image" />
    <!-- Team -->
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
    <circle cx="160" cy="100" r="10" class="image" />
    <line x1="120" y1="110" x2="120" y2="130" class="image" />
    <line x1="140" y1="110" x2="140" y2="130" class="image" />
    <line x1="160" y1="110" x2="160" y2="130" class="image" />
  </g>
</svg>