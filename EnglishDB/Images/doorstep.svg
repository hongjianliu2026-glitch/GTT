<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">doorstep</text>
  <text x="50" y="120" class="subtitle">[ˈdɔːrstɛp] n. 门阶，门口</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> door (门) + step (台阶)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的门，门前有一个高高的台阶，
    <tspan x="50" dy="25">你站在台阶上，感觉自己离天空更近了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The delivery man left the package on the doorstep.
  </text>
  <text x="50" y="310" class="content">
    送货员把包裹留在了门阶上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Door -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Step -->
    <rect x="0" y="300" width="200" height="50" class="image" />
    <!-- Person -->
    <circle cx="100" cy="330" r="15" class="image" />
    <line x1="100" y1="345" x2="100" y2="380" class="image" />
    <line x1="100" y1="380" x2="80" y2="410" class="image" />
    <line x1="100" y1="380" x2="120" y2="410" class="image" />
    <line x1="100" y1="360" x2="130" y2="350" class="image" />
  </g>
</svg>