<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .grease { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grease</text>
  <text x="50" y="120" class="subtitle">[ɡriːs] n. 油脂，润滑油；v. 涂油脂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gres- (行走) + -e (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆老旧的汽车，轮子上沾满了"行走(gres-)"时留下的
    <tspan x="50" dy="25">油脂(grease)，需要定期涂抹润滑油以保持顺畅行驶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used grease to lubricate the rusty hinges.
  </text>
  <text x="50" y="310" class="content">
    他用油脂润滑生锈的铰链。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Wheels -->
    <circle cx="100" cy="180" r="30" class="image" />
    <circle cx="250" cy="180" r="30" class="image" />
    <!-- Grease spots -->
    <circle cx="100" cy="180" r="15" class="grease" />
    <circle cx="250" cy="180" r="15" class="grease" />
    <!-- Grease can -->
    <rect x="300" y="100" width="40" height="80" class="image" />
    <line x1="300" y1="100" x2="340" y2="100" class="image" />
    <line x1="300" y1="180" x2="340" y2="180" class="image" />
    <line x1="300" y1="100" x2="300" y2="180" class="image" />
    <line x1="340" y1="100" x2="340" y2="180" class="image" />
    <!-- Grease drip -->
    <line x1="320" y1="100" x2="320" y2="80" class="image" />
    <line x1="320" y1="80" x2="310" y2="70" class="image" />
    <line x1="320" y1="80" x2="330" y2="70" class="image" />
  </g>
</svg>