<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peculiar</text>
  <text x="50" y="120" class="subtitle">[pɪˈkjuːliər] adj. 奇特的，特殊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pecul (牛群) + -iar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个牧场，里面有一群牛，其中一头牛
    <tspan x="50" dy="25">长着三条腿，"特殊的(peculiar)"，与众不同。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The museum has a peculiar collection of artifacts.
  </text>
  <text x="50" y="310" class="content">
    博物馆有一批奇特的文物收藏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cow with three legs -->
    <circle cx="100" cy="100" r="30" class="image" /> <!-- Body -->
    <line x1="100" y1="130" x2="100" y2="180" class="image" /> <!-- Middle leg -->
    <line x1="70" y1="150" x2="100" y2="130" class="image" /> <!-- Left leg -->
    <line x1="130" y1="150" x2="100" y2="130" class="image" /> <!-- Right leg -->
    <line x1="100" y1="130" x2="150" y2="150" class="image" /> <!-- Extra leg -->
    <!-- Head -->
    <circle cx="150" cy="80" r="20" class="image" />
    <circle cx="140" cy="75" r="3" class="image" /> <!-- Left eye -->
    <circle cx="160" cy="75" r="3" class="image" /> <!-- Right eye -->
    <line x1="145" y1="90" x2="155" y2="90" class="image" /> <!-- Mouth -->
  </g>
</svg>