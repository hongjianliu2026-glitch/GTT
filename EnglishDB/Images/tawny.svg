<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tawny</text>
  <text x="50" y="120" class="subtitle">[ˈtɔːni] adj. 黄褐色的，茶色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tawn (黄褐色)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只黄褐色的狮子在夕阳下，"黄褐色(tawn)"
    <tspan x="50" dy="25">的毛发在阳光下闪闪发光，这就是tawny的颜色。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lion's fur was a beautiful tawny color.
  </text>
  <text x="50" y="310" class="content">
    狮子的毛皮是美丽的黄褐色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion -->
    <circle cx="100" cy="100" r="50" class="image" fill="#D35400" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="180" class="image" />
    <line x1="100" y1="200" x2="150" y2="180" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Ground -->
    <rect x="0" y="300" width="350" height="50" class="image" fill="#D35400" />
  </g>
</svg>