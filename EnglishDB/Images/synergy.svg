<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">synergy</text>
  <text x="50" y="120" class="subtitle">[ˈsɪnərdʒi] n. 协同作用，协同效应</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> syn- (一起) + erg (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人一起工作，"一起工作(syn-erg)"
    <tspan x="50" dy="25">产生的力量比单独工作要大得多，这就是协同作用(synergy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The synergy between the two departments boosted productivity.
  </text>
  <text x="50" y="310" class="content">
    两个部门之间的协同作用提高了生产力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people working together -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="190" y2="130" class="image" />

    <!-- Connecting lines -->
    <line x1="70" y1="130" x2="130" y2="130" class="image" />
    <line x1="70" y1="140" x2="130" y2="140" class="image" />
    <line x1="70" y1="150" x2="130" y2="150" class="image" />

    <!-- Resulting power -->
    <text x="100" y="250" class="content" text-anchor="middle">
      <tspan class="highlight">协同力量</tspan>
    </text>
    <line x1="100" y1="260" x2="100" y2="300" class="image" />
    <line x1="100" y1="300" x2="80" y2="340" class="image" />
    <line x1="100" y1="300" x2="120" y2="340" class="image" />
  </g>
</svg>