<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incinerator</text>
  <text x="50" y="120" class="subtitle">[ɪnˈsɪnəˌreɪtər] n. 焚化炉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + ciner (灰烬) + -ator (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的焚化炉，"将物品投入(in-)"
    <tspan x="50" dy="25">其中，瞬间化为灰烬(ciner)，这就是焚化炉(incinerator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city uses an incinerator to dispose of waste.
  </text>
  <text x="50" y="310" class="content">
    这座城市使用焚化炉来处理废物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Incinerator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fire -->
    <polygon points="50,180 150,180 100,50" style="fill:orange;stroke:red;stroke-width:2" />
    <polygon points="100,180 200,180 150,50" style="fill:orange;stroke:red;stroke-width:2" />
    <polygon points="150,180 250,180 200,50" style="fill:orange;stroke:red;stroke-width:2" />
    <!-- Smoke -->
    <circle cx="100" cy="30" r="10" style="fill:gray;stroke:black;stroke-width:1" />
    <circle cx="120" cy="20" r="10" style="fill:gray;stroke:black;stroke-width:1" />
    <circle cx="140" cy="10" r="10" style="fill:gray;stroke:black;stroke-width:1" />
  </g>
</svg>