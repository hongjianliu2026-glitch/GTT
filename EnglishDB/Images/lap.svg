<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lap</text>
  <text x="50" y="120" class="subtitle">[læp] n. 大腿前部，一圈；v. 舔食，跑完一圈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lap (来自古英语 læppe，意为“大腿前部”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫在舔食牛奶，牛奶溅到了它的"大腿前部(lap)"，
    <tspan x="50" dy="25">形成了一圈湿漉漉的痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat lapped up the milk from its bowl.
  </text>
  <text x="50" y="310" class="content">
    猫从碗里舔食牛奶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Milk bowl -->
    <rect x="100" y="100" width="50" height="30" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="130" x2="150" y2="130" class="image" />
    <line x1="100" y1="100" x2="100" y2="130" class="image" />
    <line x1="150" y1="100" x2="150" y2="130" class="image" />
    <!-- Milk splashes -->
    <circle cx="125" cy="90" r="5" class="image" />
    <circle cx="130" cy="85" r="5" class="image" />
    <circle cx="135" cy="90" r="5" class="image" />
  </g>
</svg>