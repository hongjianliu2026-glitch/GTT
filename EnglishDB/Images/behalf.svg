<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">behalf</text>
  <text x="50" y="120" class="subtitle">[bɪˈhælf] n. 代表，利益</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + half (一半)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在中间，"代表(be-half)"
    <tspan x="50" dy="25">两边的利益，就像站在两个半圆的中间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spoke on behalf of the company.
  </text>
  <text x="50" y="310" class="content">
    他代表公司发言。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person in the middle -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="160" y2="130" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />

    <!-- Two halves -->
    <path d="M100,100 A100,100 0 0,1 300,100" class="image" />
    <path d="M300,100 A100,100 0 0,1 100,100" class="image" />
  </g>
</svg>