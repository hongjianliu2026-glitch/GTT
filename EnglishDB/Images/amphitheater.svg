<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">amphitheater</text>
  <text x="50" y="120" class="subtitle">[ˈæmfɪˌθiːətər] n. 圆形剧场，竞技场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> amphi- (两边) + theater (剧场)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆形剧场，"两边(amphi-)"
    <tspan x="50" dy="25">都有观众席，中间是表演区，这就是一个圆形剧场(amphitheater)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient Romans built many amphitheaters for gladiator fights.
  </text>
  <text x="50" y="310" class="content">
    古罗马人建造了许多圆形剧场用于角斗士比赛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Amphitheater outline -->
    <circle cx="200" cy="100" r="100" class="image" />
    <!-- Stands -->
    <rect x="100" y="0" width="200" height="100" class="image" />
    <!-- Stage -->
    <rect x="150" y="100" width="100" height="50" class="image" />
    <!-- Spectators -->
    <circle cx="120" cy="50" r="5" class="image" />
    <circle cx="180" cy="50" r="5" class="image" />
    <circle cx="240" cy="50" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <circle cx="180" cy="80" r="5" class="image" />
    <circle cx="240" cy="80" r="5" class="image" />
  </g>
</svg>