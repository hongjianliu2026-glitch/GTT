<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">strenuous</text>
  <text x="50" y="120" class="subtitle">[ˈstrɛnjuəs] adj. 费力的，艰苦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stren (力量) + -uous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在健身房里，"用力(stren)"
    <tspan x="50" dy="25">举起沉重的哑铃，汗水如雨下，这就是"费力的(strenuous)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Climbing Mount Everest is a strenuous task.
  </text>
  <text x="50" y="310" class="content">
    攀登珠穆朗玛峰是一项艰苦的任务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gym scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dumbbell -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <rect x="100" y="20" width="50" height="160" class="image" />
    <!-- Person lifting -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Sweat drops -->
    <circle cx="210" cy="90" r="5" class="image" />
    <circle cx="220" cy="85" r="5" class="image" />
    <circle cx="230" cy="80" r="5" class="image" />
  </g>
</svg>