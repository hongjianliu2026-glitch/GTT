<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Mormon</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrmən] n. 摩门教徒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Mor- (来自摩门教创始人约瑟夫·史密斯的名字) + mon (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着传统摩门教服装的人，"摩门(Mor-)"
    <tspan x="50" dy="25">教的信徒(mon)，他们信仰摩门教的教义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Mormon church is known for its strict rules.
  </text>
  <text x="50" y="310" class="content">
    摩门教以其严格的教规而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Traditional Mormon attire -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Man in traditional attire -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Clothing details -->
    <rect x="80" y="120" width="40" height="50" class="image" />
    <rect x="120" y="120" width="40" height="50" class="image" />
    <line x1="100" y1="120" x2="100" y2="70" class="image" />
    <line x1="80" y1="70" x2="120" y2="70" class="image" />
  </g>
</svg>