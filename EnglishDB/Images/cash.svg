<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cash</text>
  <text x="50" y="120" class="subtitle">[kæʃ] n. 现金</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cas (落下)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个装满现金的袋子突然"落下(cas)"，
    <tspan x="50" dy="25">袋子里的硬币和纸币散落一地，这就是现金(cash)的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He paid for the groceries with cash.
  </text>
  <text x="50" y="310" class="content">
    他用现金支付了杂货。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Money bag -->
    <path d="M0 0 L100 0 L100 50 L50 100 L0 50 Z" class="image" fill="#F1C40F" />
    <!-- Coins falling -->
    <circle cx="70" cy="60" r="10" class="image" fill="#D35400" />
    <circle cx="80" cy="80" r="10" class="image" fill="#D35400" />
    <circle cx="90" cy="100" r="10" class="image" fill="#D35400" />
    <circle cx="60" cy="120" r="10" class="image" fill="#D35400" />
    <!-- Paper money -->
    <rect x="20" y="140" width="60" height="30" class="image" fill="#8E44AD" />
    <rect x="30" y="170" width="60" height="30" class="image" fill="#8E44AD" />
  </g>
</svg>