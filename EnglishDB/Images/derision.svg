<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">derision</text>
  <text x="50" y="120" class="subtitle">[dɪˈrɪʒən] n. 嘲笑，嘲弄</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + ris (笑) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在向下看，"向下笑(de-ris)"
    <tspan x="50" dy="25">某人，这种行为就是嘲笑(derision)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His jokes were met with derision from the audience.
  </text>
  <text x="50" y="310" class="content">
    他的笑话遭到了观众的嘲笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People looking down -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <!-- Smiling faces -->
    <circle cx="50" cy="120" r="15" class="image" />
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="150" cy="120" r="15" class="image" />
    <!-- Mouths -->
    <path d="M40,130 Q50,140 60,130" class="image" />
    <path d="M90,130 Q100,140 110,130" class="image" />
    <path d="M140,130 Q150,140 160,130" class="image" />
    <!-- Person being laughed at -->
    <circle cx="100" cy="200" r="20" class="image" />
    <line x1="100" y1="220" x2="100" y2="260" class="image" />
    <line x1="100" y1="260" x2="80" y2="300" class="image" />
    <line x1="100" y1="260" x2="120" y2="300" class="image" />
    <line x1="100" y1="240" x2="130" y2="230" class="image" />
  </g>
</svg>