<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">environmentalist</text>
  <text x="50" y="120" class="subtitle">[ɪnˌvaɪrənˈmɛntlɪst] n. 环保主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> environment (环境) + -al (形容词后缀) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个环保主义者站在一片绿意盎然的森林中，
    <tspan x="50" dy="25">他/她正在保护这片环境(environment)，</tspan>
    <tspan x="50" dy="25">确保未来的世代也能享受这片自然之美。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The environmentalist organized a clean-up event at the local park.
  </text>
  <text x="50" y="310" class="content">
    这位环保主义者在当地公园组织了一次清洁活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="180" x2="50" y2="100" class="image" />
    <line x1="100" y1="180" x2="100" y2="120" class="image" />
    <line x1="150" y1="180" x2="150" y2="140" class="image" />
    <line x1="200" y1="180" x2="200" y2="160" class="image" />
    <line x1="250" y1="180" x2="250" y2="180" class="image" />
    <!-- Environmentalist -->
    <circle cx="125" cy="150" r="15" class="image" />
    <line x1="125" y1="165" x2="125" y2="190" class="image" />
    <line x1="125" y1="190" x2="110" y2="210" class="image" />
    <line x1="125" y1="190" x2="140" y2="210" class="image" />
    <line x1="125" y1="180" x2="150" y2="170" class="image" />
  </g>
</svg>