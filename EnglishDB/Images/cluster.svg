<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cluster</text>
  <text x="50" y="120" class="subtitle">[ˈklʌstər] n. 群，簇；v. 聚集</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clus- (关闭) + -ter (表示动作或状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群蜜蜂"关闭(clus-)"在一起，形成了一个紧密的"群(cluster)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flowers formed a beautiful cluster in the garden.
  </text>
  <text x="50" y="310" class="content">
    花园里的花朵形成了一簇美丽的花群。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cluster of bees -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="80" cy="50" r="15" class="image" />
    <circle cx="110" cy="50" r="15" class="image" />
    <circle cx="65" cy="70" r="15" class="image" />
    <circle cx="95" cy="70" r="15" class="image" />
    <!-- Wings -->
    <line x1="40" y1="40" x2="60" y2="60" class="image" />
    <line x1="60" y1="40" x2="40" y2="60" class="image" />
    <line x1="70" y1="40" x2="90" y2="60" class="image" />
    <line x1="90" y1="40" x2="70" y2="60" class="image" />
    <line x1="100" y1="40" x2="120" y2="60" class="image" />
    <line x1="120" y1="40" x2="100" y2="60" class="image" />
  </g>
</svg>