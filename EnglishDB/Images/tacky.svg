<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tacky</text>
  <text x="50" y="120" class="subtitle">[ˈtæki] adj. 俗气的，粘的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tack (钉子) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个钉子(tack)上粘着(tacky)
    <tspan x="50" dy="25">一块俗气的(tacky)装饰品，让人忍不住皱眉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The decorations at the party were a bit tacky.
  </text>
  <text x="50" y="310" class="content">
    派对上的装饰有点俗气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Nail -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <!-- Tacky decoration -->
    <circle cx="50" cy="30" r="20" class="image" />
    <rect x="30" y="60" width="40" height="40" class="image" />
    <rect x="20" y="110" width="60" height="20" class="image" />
    <!-- Face with frown -->
    <circle cx="150" cy="100" r="30" class="image" />
    <line x1="135" y1="90" x2="165" y2="90" class="image" />
    <line x1="140" y1="110" x2="160" y2="110" class="image" />
    <line x1="145" y1="120" x2="155" y2="120" class="image" />
  </g>
</svg>