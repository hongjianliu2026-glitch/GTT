<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hat</text>
  <text x="50" y="120" class="subtitle">[hæt] n. 帽子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hat (源自中古英语 hatt，意为“帽子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着帽子的人，帽子(hat)
    <tspan x="50" dy="25">就像一个保护伞，遮挡阳光和雨水。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a stylish hat to the party.
  </text>
  <text x="50" y="310" class="content">
    她戴着一顶时尚的帽子去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hat -->
    <path d="M50 50 L300 50 L280 100 L70 100 Z" class="image" />
    <!-- Person -->
    <circle cx="165" cy="150" r="20" class="image" />
    <line x1="165" y1="170" x2="165" y2="220" class="image" />
    <line x1="165" y1="220" x2="145" y2="250" class="image" />
    <line x1="165" y1="220" x2="185" y2="250" class="image" />
    <line x1="165" y1="190" x2="120" y2="180" class="image" />
    <line x1="165" y1="190" x2="210" y2="180" class="image" />
  </g>
</svg>