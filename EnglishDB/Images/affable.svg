<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">affable</text>
  <text x="50" y="120" class="subtitle">[ˈæfəbl] adj. 和蔼可亲的，友好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> af- (加强) + -fable (说话)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人说话时，脸上总是带着微笑，"加强(af-)"
    <tspan x="50" dy="25">说话(fable)的友好氛围，让人感到和蔼可亲(affable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The affable host made everyone feel welcome.
  </text>
  <text x="50" y="310" class="content">
    和蔼可亲的主人让每个人都感到宾至如归。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Smiling face -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <circle cx="80" cy="80" r="10" class="image" fill="#000" />
    <circle cx="120" cy="80" r="10" class="image" fill="#000" />
    <path d="M 60 120 Q 100 150 140 120" class="image" fill="none" stroke="#000" stroke-width="5" />
  </g>
</svg>