<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">US-led</text>
  <text x="50" y="120" class="subtitle">[ˌjuː ɛs ˈlɛd] adj. 由美国领导的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> US (美国) + led (lead的过去分词，领导)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的美国国旗在前面飘扬，"美国(US)"
    <tspan x="50" dy="25">领导着(led)一群小国家，形成了一个强大的联盟。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The US-led coalition launched airstrikes against the enemy.
  </text>
  <text x="50" y="310" class="content">
    由美国领导的联盟对敌人发动了空袭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- American flag -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Stars -->
    <circle cx="80" cy="30" r="5" class="image" />
    <circle cx="100" cy="30" r="5" class="image" />
    <circle cx="120" cy="30" r="5" class="image" />
    <circle cx="140" cy="30" r="5" class="image" />
    <circle cx="160" cy="30" r="5" class="image" />
    <!-- Stripes -->
    <rect x="50" y="50" width="250" height="10" class="image" />
    <rect x="50" y="70" width="250" height="10" class="image" />
    <rect x="50" y="90" width="250" height="10" class="image" />
    <rect x="50" y="110" width="250" height="10" class="image" />
    <rect x="50" y="130" width="250" height="10" class="image" />
    <rect x="50" y="150" width="250" height="10" class="image" />
    <!-- Leader -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>