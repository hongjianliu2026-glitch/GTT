<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #8B0000; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #000000; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shadowy</text>
  <text x="50" y="120" class="subtitle">[ˈʃædoʊi] adj. 阴暗的，神秘的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shadow (影子) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的夜晚，月光下，"影子(shadow)"
    <tspan x="50" dy="25">在墙上摇曳，给人一种阴暗(shadowy)的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shadowy figure disappeared into the mist.
  </text>
  <text x="50" y="310" class="content">
    那个阴暗的身影消失在雾中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Moon -->
    <circle cx="150" cy="100" r="50" class="image" fill="#CCCCCC" />
    <!-- Shadow -->
    <path d="M 100 200 Q 150 150 200 200" class="image" fill="#000000" opacity="0.5" />
    <!-- Wall -->
    <rect x="50" y="200" width="200" height="100" class="image" fill="#8B4513" />
    <!-- Ground -->
    <rect x="0" y="300" width="400" height="100" class="image" fill="#654321" />
  </g>
</svg>