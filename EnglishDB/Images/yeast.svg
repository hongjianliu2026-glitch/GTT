<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yeast</text>
  <text x="50" y="120" class="subtitle">[jiːst] n. 酵母</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> yeast (源自中古英语，意为“发酵”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的酵母菌在面团中"发酵(yeast)"，
    <tspan x="50" dy="25">面团迅速膨胀，变成了一个巨大的面包山。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baker added yeast to the dough to make it rise.
  </text>
  <text x="50" y="310" class="content">
    面包师在面团中加入了酵母，使其发酵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dough -->
    <ellipse cx="200" cy="100" rx="150" ry="80" class="image" />
    <!-- Yeast -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="200" cy="130" r="20" class="image" />
    <!-- Rising dough -->
    <ellipse cx="200" cy="180" rx="180" ry="100" class="image" />
  </g>
</svg>