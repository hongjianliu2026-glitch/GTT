<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">colleague</text>
  <text x="50" y="120" class="subtitle">[ˈkɒliːɡ] n. 同事，同僚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (共同) + league (联盟)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个同事在办公室里，"共同联盟(col-league)"
    <tspan x="50" dy="25">一起工作，互相支持，这就是同事(colleague)的意义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My colleague helped me finish the project on time.
  </text>
  <text x="50" y="310" class="content">
    我的同事帮助我按时完成了项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Office desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Two colleagues -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />

    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />

    <!-- Handshake -->
    <line x1="70" y1="120" x2="130" y2="120" class="image" />
  </g>
</svg>