<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pathological</text>
  <text x="50" y="120" class="subtitle">[ˌpæθəˈlɑdʒɪkl] adj. 病理的，病态的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> patho- (疾病) + -logy (学科) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在显微镜下观察，"研究(logy)"
    <tspan x="50" dy="25">疾病的(patho-)细节，这种深入的分析就是病理的(pathological)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor found a pathological condition in the patient's blood.
  </text>
  <text x="50" y="310" class="content">
    医生在病人的血液中发现了一种病理状况。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microscope -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="0" y2="200" class="image" />
    <line x1="50" y1="180" x2="100" y2="200" class="image" />
    <!-- Blood cells -->
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="220" cy="120" r="10" class="image" />
    <circle cx="180" cy="130" r="10" class="image" />
    <circle cx="240" cy="110" r="10" class="image" />
    <!-- Doctor -->
    <circle cx="100" cy="50" r="15" class="image" />
    <line x1="100" y1="65" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="80" x2="130" y2="70" class="image" />
  </g>
</svg>