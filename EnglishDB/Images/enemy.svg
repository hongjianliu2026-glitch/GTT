<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enemy</text>
  <text x="50" y="120" class="subtitle">[ˈɛnəmi] n. 敌人，敌军</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + emy (战争)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个士兵"进入(en-)"战场，面对"战争(emy)"中的敌人(enemy)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The general ordered his troops to attack the enemy.
  </text>
  <text x="50" y="310" class="content">
    将军命令他的部队攻击敌人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Soldier -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Enemy -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Battlefield -->
    <line x1="0" y1="250" x2="300" y2="250" class="image" />
    <line x1="0" y1="260" x2="300" y2="260" class="image" />
    <line x1="0" y1="270" x2="300" y2="270" class="image" />
  </g>
</svg>