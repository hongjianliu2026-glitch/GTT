<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twirl</text>
  <text x="50" y="120" class="subtitle">[twɜːrl] v. 旋转，卷曲；n. 旋转，卷曲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twir- (旋转) + -l (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个芭蕾舞者在舞台上，"旋转(twir-)"
    <tspan x="50" dy="25">她的身体，像一阵旋风，这就是twirl的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She twirled her hair around her finger.
  </text>
  <text x="50" y="310" class="content">
    她把头发绕在手指上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dancer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Twirling motion -->
    <path d="M50,100 A50,50 0 0,1 100,150" class="image" />
    <path d="M100,150 A50,50 0 0,1 50,200" class="image" />
    <path d="M50,200 A50,50 0 0,1 0,150" class="image" />
    <path d="M0,150 A50,50 0 0,1 50,100" class="image" />
  </g>
</svg>