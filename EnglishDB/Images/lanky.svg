<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lanky</text>
  <text x="50" y="120" class="subtitle">[ˈlæŋki] adj. 瘦长的，瘦高的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lank (瘦长) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个瘦长的人，像一根"瘦长的(lank)"竹竿，
    <tspan x="50" dy="25">他的四肢和身体都异常细长，就像被拉长的橡皮人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was a lanky teenager with long arms and legs.
  </text>
  <text x="50" y="310" class="content">
    他是一个瘦高的少年，手臂和腿都很长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Long limbs -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" /> <!-- Vertical line for body -->
    <line x1="50" y1="70" x2="0" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="70" x2="100" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="0" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="100" y2="250" class="image" /> <!-- Right leg -->
    <!-- Head -->
    <circle cx="50" cy="40" r="15" class="image" />
  </g>
</svg>