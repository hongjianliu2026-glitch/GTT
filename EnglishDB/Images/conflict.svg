<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conflict</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnflɪkt] n. 冲突，矛盾；v. 冲突，抵触</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + flict (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，"一起打击(con-flict)"
    <tspan x="50" dy="25">对方，这种对抗就形成了冲突(conflict)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The conflict between the two countries led to a war.
  </text>
  <text x="50" y="310" class="content">
    两国之间的冲突导致了战争。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Arms and fists -->
    <line x1="50" y1="120" x2="250" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <!-- Fists -->
    <circle cx="30" cy="150" r="10" class="image" />
    <circle cx="270" cy="150" r="10" class="image" />
  </g>
</svg>