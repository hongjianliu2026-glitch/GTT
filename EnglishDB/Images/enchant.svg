<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enchant</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtʃænt] v. 施魔法，使陶醉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + chant (歌唱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔法师用歌声("歌唱(chant)")
    <tspan x="50" dy="25">施展魔法，使人们陶醉其中，这就是"施魔法(enchant)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The beautiful melody enchanted the audience.
  </text>
  <text x="50" y="310" class="content">
    美妙的旋律使观众陶醉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Music notes -->
    <path d="M100,100 C120,80 140,120 160,100" class="image" />
    <path d="M120,120 C140,100 160,140 180,120" class="image" />
    <path d="M140,140 C160,120 180,160 200,140" class="image" />
    <!-- Enchanted people -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="290" y2="120" class="image" />
  </g>
</svg>