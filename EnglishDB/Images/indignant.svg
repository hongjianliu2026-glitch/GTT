<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indignant</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdɪɡnənt] adj. 愤怒的，愤慨的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + dign (值得) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为不值得的事情感到愤怒，"不值得(in-dign)"
    <tspan x="50" dy="25">的事情让他感到愤慨(indignant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was indignant at the unfair treatment.
  </text>
  <text x="50" y="310" class="content">
    她对不公平的待遇感到愤慨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="30" y1="40" x2="40" y2="50" class="image" />
    <line x1="60" y1="40" x2="70" y2="50" class="image" />
    <line x1="30" y1="60" x2="70" y2="60" class="image" />
    <line x1="50" y1="70" x2="50" y2="80" class="image" />
    <!-- Exclamation mark -->
    <line x1="50" y1="90" x2="50" y2="120" class="image" />
    <circle cx="50" cy="130" r="10" class="image" />
  </g>
</svg>