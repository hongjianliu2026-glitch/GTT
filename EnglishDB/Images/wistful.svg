<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3F51B5; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wistful</text>
  <text x="50" y="120" class="subtitle">[ˈwɪstfəl] adj. 渴望的，怀念的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wist (渴望) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在窗边，望着远方，眼中充满了对过去的
    <tspan x="50" dy="25">"渴望(wist)"，这种情感让他变得"充满(ful)"怀念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a wistful look as she remembered her childhood.
  </text>
  <text x="50" y="310" class="content">
    她回忆起童年时，脸上露出了怀念的神情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Window -->
    <rect x="0" y="0" width="350" height="250" class="image" />
    <!-- Person -->
    <circle cx="175" cy="125" r="30" class="image" />
    <line x1="175" y1="155" x2="175" y2="200" class="image" />
    <line x1="175" y1="200" x2="150" y2="230" class="image" />
    <line x1="175" y1="200" x2="200" y2="230" class="image" />
    <line x1="175" y1="170" x2="125" y2="160" class="image" />
    <line x1="175" y1="170" x2="225" y2="160" class="image" />
    <!-- Horizon -->
    <line x1="50" y1="250" x2="300" y2="250" class="image" />
    <!-- Sun -->
    <circle cx="320" cy="50" r="30" class="image" />
  </g>
</svg>