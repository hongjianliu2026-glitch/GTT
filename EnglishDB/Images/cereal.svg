<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cereal</text>
  <text x="50" y="120" class="subtitle">[ˈsɪəriəl] n. 谷类，谷物；麦片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cere- (谷物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的谷仓，里面堆满了金黄色的谷物，
    <tspan x="50" dy="25">这些谷物被加工成早餐麦片，供人们享用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She enjoys a bowl of cereal every morning.
  </text>
  <text x="50" y="310" class="content">
    她每天早上都喜欢喝一碗麦片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Barn -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Grain -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Bowl of cereal -->
    <rect x="150" y="150" width="100" height="50" class="image" />
    <line x1="160" y1="160" x2="240" y2="160" class="image" />
    <line x1="160" y1="170" x2="240" y2="170" class="image" />
    <line x1="160" y1="180" x2="240" y2="180" class="image" />
    <line x1="160" y1="190" x2="240" y2="190" class="image" />
  </g>
</svg>