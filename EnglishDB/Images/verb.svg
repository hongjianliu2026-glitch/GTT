<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">verb</text>
  <text x="50" y="120" class="subtitle">[vɜːrb] n. 动词</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ver- (真实) + -b (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个真实的动作(ver-b)，就像一个演员在舞台上表演，
    <tspan x="50" dy="25">每个动作都是动词(verb)，描述着真实发生的事情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The verb "run" describes the action of moving quickly.
  </text>
  <text x="50" y="310" class="content">
    动词“跑”描述了快速移动的动作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Actor -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="150" y2="190" class="image" />
    <line x1="175" y1="160" x2="200" y2="190" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
    <!-- Action -->
    <line x1="175" y1="120" x2="150" y2="100" class="image" />
    <line x1="175" y1="120" x2="200" y2="100" class="image" />
  </g>
</svg>