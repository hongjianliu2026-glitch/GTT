<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">serene</text>
  <text x="50" y="120" class="subtitle">[səˈriːn] adj. 宁静的，安详的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (离开) + -rene (吵闹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人远离(se-)了所有的吵闹(-rene)，
    <tspan x="50" dy="25">坐在湖边，享受着宁静的时光，这就是serene的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The serene lake was a perfect place to relax.
  </text>
  <text x="50" y="310" class="content">
    宁静的湖边是放松的完美之地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Lake -->
    <ellipse cx="200" cy="250" rx="250" ry="100" class="image" />
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Person -->
    <circle cx="200" cy="200" r="20" class="image" />
    <line x1="200" y1="220" x2="200" y2="280" class="image" />
    <line x1="200" y1="280" x2="180" y2="320" class="image" />
    <line x1="200" y1="280" x2="220" y2="320" class="image" />
    <line x1="200" y1="240" x2="160" y2="230" class="image" />
    <line x1="200" y1="240" x2="240" y2="230" class="image" />
  </g>
</svg>