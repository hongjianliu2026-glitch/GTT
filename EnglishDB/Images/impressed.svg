<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impressed</text>
  <text x="50" y="120" class="subtitle">[ɪmˈprest] v. 使印象深刻，使铭记</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + press (压)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"压入(im-press)"心中，留下深刻的印象，
    <tspan x="50" dy="25">就像一个印章在纸上留下印记一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The speech deeply impressed the audience.
  </text>
  <text x="50" y="310" class="content">
    演讲深深打动了观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 Q100,20 150,50 T250,50" class="image" />
    <!-- Stamp -->
    <rect x="100" y="20" width="100" height="50" class="image" />
    <text x="120" y="50" class="content" fill="#E74C3C">IMPRESS</text>
    <!-- Arrow -->
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <polygon points="145,115 155,115 150,125" class="image" />
  </g>
</svg>