<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">weakest</text>
  <text x="50" y="120" class="subtitle">[ˈwiːkɪst] adj. 最弱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> weak (弱的) + -est (最高级后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人中，有一个人的腿像面条一样软，"最弱(weakest)"
    <tspan x="50" dy="25">到几乎站不住，这就是最弱的人(weakest)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was the weakest in the class, but he never gave up.
  </text>
  <text x="50" y="310" class="content">
    他是班上最弱的，但他从未放弃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Weak person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Legs like noodles -->
    <path d="M30,200 Q20,220 30,240" class="image" />
    <path d="M70,200 Q80,220 70,240" class="image" />
  </g>
</svg>