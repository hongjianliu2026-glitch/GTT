<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">goodnight</text>
  <text x="50" y="120" class="subtitle">[ˌɡʊdˈnaɪt] int. 晚安</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> good (好的) + night (夜晚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温馨的夜晚，"好的(good)"
    <tspan x="50" dy="25">夜晚(night)"，人们互道晚安，</tspan>
    <tspan x="50" dy="25">祝愿彼此有个美好的睡眠。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She whispered "goodnight" before going to bed.
  </text>
  <text x="50" y="310" class="content">
    她在上床睡觉前轻声说了句“晚安”。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" fill="#FFFFFF" />
    <circle cx="150" cy="50" r="5" class="image" fill="#FFFFFF" />
    <circle cx="100" cy="150" r="5" class="image" fill="#FFFFFF" />
    <!-- Bed -->
    <rect x="200" y="50" width="150" height="100" class="image" fill="#8B4513" />
    <rect x="210" y="60" width="130" height="80" class="image" fill="#F5DEB3" />
    <!-- Person -->
    <circle cx="275" cy="120" r="15" class="image" fill="#FF69B4" />
    <line x1="275" y1="135" x2="275" y2="160" class="image" />
    <line x1="275" y1="160" x2="260" y2="180" class="image" />
    <line x1="275" y1="160" x2="290" y2="180" class="image" />
    <line x1="275" y1="145" x2="300" y2="135" class="image" />
  </g>
</svg>