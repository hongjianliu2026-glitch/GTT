<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #F1C40F; }
      .ground { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">daylight</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪlaɪt] n. 日光，白天</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> day (天) + light (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太阳("day")在天上，
    <tspan x="50" dy="25">它的光芒("light")照亮了整个世界，这就是日光(daylight)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We woke up at daylight and started our journey.
  </text>
  <text x="50" y="310" class="content">
    我们在天亮时醒来，开始了我们的旅程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="sun" />
    <!-- Ground -->
    <rect x="0" y="200" width="350" height="100" class="ground" />
    <!-- Rays of light -->
    <line x1="100" y1="50" x2="0" y2="0" class="image" />
    <line x1="100" y1="50" x2="200" y2="0" class="image" />
    <line x1="100" y1="50" x2="300" y2="0" class="image" />
    <line x1="100" y1="50" x2="0" y2="200" class="image" />
    <line x1="100" y1="50" x2="200" y2="200" class="image" />
    <line x1="100" y1="50" x2="300" y2="200" class="image" />
  </g>
</svg>