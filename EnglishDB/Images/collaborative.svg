<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">collaborative</text>
  <text x="50" y="120" class="subtitle">[kəˈlæbəreɪtɪv] adj. 合作的，协作的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (共同) + labor (劳动) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"共同劳动(col-labor-ative)"，
    <tspan x="50" dy="25">他们齐心协力完成一个项目，这就是协作(collaborative)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was a collaborative effort between multiple departments.
  </text>
  <text x="50" y="310" class="content">
    这个项目是多个部门协作完成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Hands -->
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <!-- Project -->
    <rect x="100" y="150" width="100" height="50" class="image" />
    <text x="125" y="180" class="content">Project</text>
  </g>
</svg>