<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recognized</text>
  <text x="50" y="120" class="subtitle">[ˈrekəɡnaɪzd] v. 认可，承认</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + cogn (知道) + -ize (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在颁奖典礼上，"再次知道(re-cogn)"
    <tspan x="50" dy="25">并公开承认(recognize)某人的成就。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her talent was finally recognized by the industry.
  </text>
  <text x="50" y="310" class="content">
    她的才华终于得到了行业的认可。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person receiving award -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
    <!-- Award -->
    <rect x="150" y="80" width="50" height="50" class="image" />
    <line x1="175" y1="80" x2="175" y2="30" class="image" />
    <line x1="175" y1="30" x2="150" y2="50" class="image" />
    <line x1="175" y1="30" x2="200" y2="50" class="image" />
    <!-- Crowd -->
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="280" cy="100" r="10" class="image" />
    <circle cx="310" cy="100" r="10" class="image" />
  </g>
</svg>