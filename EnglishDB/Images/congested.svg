<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">congested</text>
  <text x="50" y="120" class="subtitle">[kənˈdʒestɪd] adj. 拥挤的，堵塞的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + gest (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条街道上，"一起携带(con-gest)"
    <tspan x="50" dy="25">着大量的人和车，导致街道变得非常拥挤(congested)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roads were congested during rush hour.
  </text>
  <text x="50" y="310" class="content">
    高峰时段道路非常拥堵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cars -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="120" y="20" width="50" height="30" class="image" />
    <rect x="190" y="20" width="50" height="30" class="image" />
    <rect x="260" y="20" width="50" height="30" class="image" />
    <!-- People -->
    <circle cx="75" cy="70" r="10" class="image" />
    <circle cx="145" cy="70" r="10" class="image" />
    <circle cx="215" cy="70" r="10" class="image" />
    <circle cx="285" cy="70" r="10" class="image" />
    <!-- Crowdedness -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
  </g>
</svg>