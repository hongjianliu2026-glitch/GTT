<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">via</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪə] prep. 经由，通过</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拉丁语 "via" (道路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你正在旅行，"通过(via)"一条蜿蜒的道路，
    <tspan x="50" dy="25">这条道路带你到达目的地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She traveled to Paris via London.
  </text>
  <text x="50" y="310" class="content">
    她经由伦敦前往巴黎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <!-- Car -->
    <rect x="150" y="70" width="50" height="30" class="image" />
    <circle cx="170" cy="100" r="10" class="image" />
    <circle cx="230" cy="100" r="10" class="image" />
    <!-- Destination -->
    <rect x="300" y="50" width="50" height="50" class="image" />
    <text x="310" y="85" class="content">Paris</text>
  </g>
</svg>