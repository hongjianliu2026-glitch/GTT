<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acoustic</text>
  <text x="50" y="120" class="subtitle">[əˈkuːstɪk] adj. 声学的，听觉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> acou- (听) + -stic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的耳朵，"倾听(acou-)"
    <tspan x="50" dy="25">整个世界的声音，这就是声学(acoustic)的奇妙之处。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The acoustic performance was mesmerizing.
  </text>
  <text x="50" y="310" class="content">
    这场声学表演令人着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large ear -->
    <ellipse cx="175" cy="100" rx="150" ry="100" class="image" />
    <!-- Sound waves -->
    <line x1="25" y1="100" x2="325" y2="100" class="image" />
    <line x1="25" y1="80" x2="325" y2="80" class="image" />
    <line x1="25" y1="120" x2="325" y2="120" class="image" />
    <!-- Sound wave labels -->
    <text x="50" y="70" class="content">Sound Waves</text>
  </g>
</svg>