<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">multinational</text>
  <text x="50" y="120" class="subtitle">[ˌmʌltiˈnæʃnəl] adj. 多国的，跨国公司的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> multi- (多) + national (国家的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的公司，"跨越多个国家(multi-national)"，
    <tspan x="50" dy="25">它的业务遍布全球，就像一个巨大的跨国公司(multinational)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The multinational corporation has offices in over 50 countries.
  </text>
  <text x="50" y="310" class="content">
    这家跨国公司在50多个国家设有办事处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Countries -->
    <line x1="100" y1="50" x2="250" y2="50" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <!-- Company logo -->
    <rect x="135" y="70" width="80" height="60" class="image" />
    <text x="150" y="105" class="content" fill="#34495E">MNC</text>
  </g>
</svg>