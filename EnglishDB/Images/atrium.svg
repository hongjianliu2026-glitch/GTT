<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">atrium</text>
  <text x="50" y="120" class="subtitle">[ˈeɪtriəm] n. 中庭，心房</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> atri- (房子) + -um (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座古老的罗马建筑，中央有一个宽敞的"房子(atri-)"
    <tspan x="50" dy="25">空间，阳光透过顶部洒下，这就是中庭(atrium)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The atrium of the museum was filled with natural light.
  </text>
  <text x="50" y="310" class="content">
    博物馆的中庭充满了自然光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Atrium space -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Sunlight -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="125" y1="20" x2="125" y2="180" class="image" />
    <line x1="225" y1="20" x2="225" y2="180" class="image" />
    <!-- Pillars -->
    <line x1="70" y1="20" x2="70" y2="180" class="image" />
    <line x1="280" y1="20" x2="280" y2="180" class="image" />
  </g>
</svg>