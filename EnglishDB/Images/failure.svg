<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">failure</text>
  <text x="50" y="120" class="subtitle">[ˈfeɪljər] n. 失败，故障</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fail (失败) + -ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"失败(fail)"标志，
    <tspan x="50" dy="25">上面写着"失败(failure)"，</tspan>
    <tspan x="50" dy="25">就像一个巨大的红色叉号，</tspan>
    <tspan x="50" dy="25">象征着一切努力都化为乌有。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> His failure in the exam was a big disappointment.
  </text>
  <text x="50" y="330" class="content">
    他考试不及格让人非常失望。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red cross -->
    <line x1="50" y1="50" x2="300" y2="300" class="image" />
    <line x1="50" y1="300" x2="300" y2="50" class="image" />
    <!-- Failure text -->
    <text x="150" y="200" class="title" style="font-size: 60px; fill: #E74C3C;">FAILURE</text>
  </g>
</svg>