<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misrepresent</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsˌreprɪˈzent] v. 歪曲，误传</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + represent (代表)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在演讲台上，"错误地代表(mis-represent)"
    <tspan x="50" dy="25">事实，他的话与真相完全相反，听众被误导了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He misrepresented the facts to gain support.
  </text>
  <text x="50" y="310" class="content">
    他歪曲事实以获得支持。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Microphone -->
    <line x1="20" y1="115" x2="20" y2="20" class="image" />
    <rect x="10" y="20" width="20" height="10" class="image" />
    <!-- Truth and Misrepresentation -->
    <text x="80" y="60" class="content">Truth</text>
    <text x="250" y="60" class="content">Misrepresentation</text>
    <line x1="80" y1="70" x2="250" y2="70" class="image" />
    <line x1="80" y1="70" x2="80" y2="180" class="image" />
    <line x1="250" y1="70" x2="250" y2="180" class="image" />
    <line x1="80" y1="180" x2="250" y2="180" class="image" />
    <!-- Crossed out truth -->
    <line x1="80" y1="70" x2="250" y2="180" class="image" />
    <line x1="80" y1="180" x2="250" y2="70" class="image" />
  </g>
</svg>