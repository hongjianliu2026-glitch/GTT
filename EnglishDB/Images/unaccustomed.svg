<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unaccustomed</text>
  <text x="50" y="120" class="subtitle">[ˌʌnəˈkʌstəmd] adj. 不习惯的，不熟悉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + accustomed (习惯的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个陌生的地方，"不习惯(un-accustomed)"
    <tspan x="50" dy="25">周围的环境，感到困惑和不安。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt unaccustomed to the new city's hustle and bustle.
  </text>
  <text x="50" y="310" class="content">
    她对这座城市的热闹感到不习惯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <!-- Question mark -->
    <text x="80" y="120" class="image" font-size="40">?</text>
    <!-- Surrounding environment -->
    <rect x="10" y="20" width="80" height="80" class="image" />
    <rect x="100" y="20" width="80" height="80" class="image" />
    <rect x="10" y="120" width="80" height="80" class="image" />
    <rect x="100" y="120" width="80" height="80" class="image" />
  </g>
</svg>