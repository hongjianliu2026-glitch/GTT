<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #7F8C8D; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lonely</text>
  <text x="50" y="120" class="subtitle">[ˈloʊnli] adj. 孤独的，寂寞的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lone (单独) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在广阔的草原上，"单独(lone)"
    <tspan x="50" dy="25">无助地望着远方，这就是孤独(lonely)的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt lonely after moving to a new city.
  </text>
  <text x="50" y="310" class="content">
    她搬到一个新城市后感到孤独。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grassland -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
    <!-- Horizon -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>