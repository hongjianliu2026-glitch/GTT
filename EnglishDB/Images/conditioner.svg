<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conditioner</text>
  <text x="50" y="120" class="subtitle">[kənˈdɪʃənər] n. 调节器，护发素</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (加强) + dit (给予) + ion (名词后缀) + er (物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神奇的瓶子，"加强给予(con-dit)"
    <tspan x="50" dy="25">头发营养，让头发变得柔顺有光泽，这就是护发素(conditioner)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She uses a conditioner to keep her hair soft and shiny.
  </text>
  <text x="50" y="310" class="content">
    她使用护发素来保持头发柔软有光泽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="20" y="20" width="60" height="160" class="image" />
    <!-- Liquid inside -->
    <line x1="40" y1="40" x2="40" y2="160" class="image" />
    <line x1="50" y1="40" x2="50" y2="160" class="image" />
    <line x1="60" y1="40" x2="60" y2="160" class="image" />
    <!-- Hair strands -->
    <line x1="120" y1="50" x2="220" y2="50" class="image" />
    <line x1="120" y1="80" x2="220" y2="80" class="image" />
    <line x1="120" y1="110" x2="220" y2="110" class="image" />
    <line x1="120" y1="140" x2="220" y2="140" class="image" />
    <!-- Shiny effect -->
    <circle cx="170" cy="95" r="10" class="image" />
  </g>
</svg>