<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">semantics</text>
  <text x="50" y="120" class="subtitle">[sɪˈmæntɪks] n. 语义学</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sema (信号) + -tics (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个语言学家在研究"信号(sema)"的含义，
    <tspan x="50" dy="25">这些信号构成了语言的语义(semantics)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The professor specializes in semantics.
  </text>
  <text x="50" y="310" class="content">
    这位教授专门研究语义学。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Signal -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
    <line x1="50" y1="90" x2="150" y2="90" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <line x1="50" y1="130" x2="150" y2="130" class="image" />
    <!-- Language symbols -->
    <text x="200" y="80" class="content">A</text>
    <text x="220" y="80" class="content">B</text>
    <text x="240" y="80" class="content">C</text>
    <text x="200" y="100" class="content">D</text>
    <text x="220" y="100" class="content">E</text>
    <text x="240" y="100" class="content">F</text>
    <!-- Professor -->
    <circle cx="300" cy="90" r="15" class="image" />
    <line x1="300" y1="105" x2="300" y2="140" class="image" />
    <line x1="300" y1="140" x2="280" y2="170" class="image" />
    <line x1="300" y1="140" x2="320" y2="170" class="image" />
    <line x1="300" y1="120" x2="350" y2="110" class="image" />
  </g>
</svg>