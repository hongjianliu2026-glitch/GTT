<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imperialism</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpɪriəlɪzəm] n. 帝国主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> imper (统治) + -ial (形容词后缀) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的帝国，统治者站在高塔上，"统治(imper)"
    <tspan x="50" dy="25">整个世界，这就是帝国主义(imperialism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rise of imperialism in the 19th century led to many conflicts.
  </text>
  <text x="50" y="310" class="content">
    19世纪帝国主义的兴起导致了多次冲突。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Empire tower -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="150" y="20" width="50" height="160" class="image" />
    <rect x="140" y="180" width="70" height="20" class="image" />
    <!-- Ruler -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="160" y2="180" class="image" />
    <line x1="175" y1="150" x2="190" y2="180" class="image" />
    <line x1="175" y1="130" x2="200" y2="120" class="image" />
    <!-- World map -->
    <circle cx="275" cy="100" r="50" class="image" />
    <line x1="275" y1="50" x2="275" y2="150" class="image" />
    <line x1="225" y1="100" x2="325" y2="100" class="image" />
    <line x1="250" y1="75" x2="300" y2="125" class="image" />
    <line x1="250" y1="125" x2="300" y2="75" class="image" />
  </g>
</svg>