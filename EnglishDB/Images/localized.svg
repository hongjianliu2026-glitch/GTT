<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">localized</text>
  <text x="50" y="120" class="subtitle">[ˈloʊkəlaɪzd] adj. 本地化的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> local (地方) + -ize (使) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个全球化的产品被"使(ize)"成了适应"地方(local)"的版本，
    <tspan x="50" dy="25">这个版本就是本地化的(localized)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The software was localized for the Chinese market.
  </text>
  <text x="50" y="310" class="content">
    该软件已为中国市场进行了本地化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Localized area -->
    <circle cx="100" cy="100" r="40" class="image" fill="#16A085" />
    <!-- Arrow -->
    <line x1="100" y1="180" x2="100" y2="220" class="image" />
    <polygon points="90,220 100,230 110,220" class="image" />
    <!-- Text -->
    <text x="100" y="250" class="content" text-anchor="middle">Localized</text>
  </g>
</svg>