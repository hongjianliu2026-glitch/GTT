<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sales</text>
  <text x="50" y="120" class="subtitle">[seɪlz] n. 销售，销售额</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sal (卖) + -es (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热闹的市场，人们争相购买商品，"卖(sal)"
    <tspan x="50" dy="25">出许多东西，这些交易的总和就是销售额(sales)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company reported a 10% increase in sales last quarter.
  </text>
  <text x="50" y="310" class="content">
    公司报告上季度销售额增长了10%。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Products -->
    <circle cx="50" cy="50" r="20" class="image" />
    <rect x="90" y="30" width="40" height="40" class="image" />
    <rect x="150" y="30" width="40" height="40" class="image" />
    <circle cx="210" cy="50" r="20" class="image" />
    <!-- Customers -->
    <circle cx="70" cy="150" r="15" class="image" />
    <line x1="70" y1="165" x2="70" y2="180" class="image" />
    <line x1="70" y1="180" x2="60" y2="200" class="image" />
    <line x1="70" y1="180" x2="80" y2="200" class="image" />
    <line x1="70" y1="170" x2="50" y2="160" class="image" />
    <circle cx="130" cy="150" r="15" class="image" />
    <line x1="130" y1="165" x2="130" y2="180" class="image" />
    <line x1="130" y1="180" x2="120" y2="200" class="image" />
    <line x1="130" y1="180" x2="140" y2="200" class="image" />
    <line x1="130" y1="170" x2="110" y2="160" class="image" />
  </g>
</svg>