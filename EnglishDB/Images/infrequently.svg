<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infrequently</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfriːkwəntli] adv. 不经常地，偶尔地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + frequent (频繁的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟上只有几个稀疏的标记，"不频繁地(infrequent)"
    <tspan x="50" dy="25">发生的事件就像这些标记一样稀少。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He visits his grandparents infrequently.
  </text>
  <text x="50" y="310" class="content">
    他不经常去看望他的祖父母。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="175" y1="100" x2="175" y2="20" class="image" />
    <line x1="175" y1="100" x2="235" y2="100" class="image" />
    <!-- Sparse marks -->
    <line x1="175" y1="20" x2="175" y2="30" class="image" />
    <line x1="235" y1="100" x2="245" y2="100" class="image" />
    <line x1="175" y1="180" x2="175" y2="170" class="image" />
    <line x1="115" y1="100" x2="105" y2="100" class="image" />
  </g>
</svg>