<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">idealize</text>
  <text x="50" y="120" class="subtitle">[aɪˈdiːəlaɪz] v. 理想化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ide(a) (思想) + -alize (使...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"使(alize)"
    <tspan x="50" dy="25">自己的形象"思想化(ide-alize)"，</tspan>
    <tspan x="50" dy="25">镜子里的他变得完美无瑕。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tends to idealize her heroes.
  </text>
  <text x="50" y="310" class="content">
    她倾向于将她的英雄理想化。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Perfect reflection -->
    <circle cx="200" cy="250" r="15" class="image" />
    <line x1="200" y1="265" x2="200" y2="300" class="image" />
    <line x1="200" y1="300" x2="180" y2="330" class="image" />
    <line x1="200" y1="300" x2="220" y2="330" class="image" />
    <line x1="200" y1="280" x2="250" y2="270" class="image" />
  </g>
</svg>