<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cupcake { fill: #FFD700; }
      .icing { fill: #FF69B4; }
      .cherry { fill: #FF0000; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cupcake</text>
  <text x="50" y="120" class="subtitle">[ˈkʌpkeɪk] n. 纸杯蛋糕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cup (杯子) + cake (蛋糕)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小巧的杯子(cup)里装着美味的蛋糕(cake)，
    <tspan x="50" dy="25">这就是纸杯蛋糕(cupcake)，甜美的诱惑让人无法抗拒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She baked a dozen cupcakes for the party.
  </text>
  <text x="50" y="310" class="content">
    她为派对烤了一打纸杯蛋糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cupcake base -->
    <rect x="0" y="0" width="150" height="100" class="cupcake" />
    <!-- Icing -->
    <rect x="10" y="10" width="130" height="60" class="icing" />
    <!-- Cherry on top -->
    <circle cx="75" cy="40" r="20" class="cherry" />
  </g>
</svg>