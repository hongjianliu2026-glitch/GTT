<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dolphin</text>
  <text x="50" y="120" class="subtitle">[ˈdɒlfɪn] n. 海豚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dolph- (海豚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只海豚在海中跳跃，"海豚(dolph-)"
    <tspan x="50" dy="25">在阳光下闪闪发光，它的优雅和智慧让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dolphin performed amazing tricks at the aquarium.
  </text>
  <text x="50" y="310" class="content">
    海豚在水族馆表演了令人惊叹的特技。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#4CAF50" />
    <!-- Dolphin -->
    <path d="M50 100 C 70 50, 130 50, 150 100 S 210 150, 230 100" class="image" fill="#FFFFFF" />
    <!-- Tail -->
    <path d="M230 100 C 250 120, 270 80, 290 100" class="image" fill="#FFFFFF" />
    <!-- Eye -->
    <circle cx="100" cy="90" r="5" class="image" fill="#000000" />
  </g>
</svg>