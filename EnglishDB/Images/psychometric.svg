<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">psychometric</text>
  <text x="50" y="120" class="subtitle">[ˌsaɪkoʊmɛˈtrɪk] adj. 心理测量的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> psycho- (心理) + metric (测量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个心理学家拿着一把巨大的尺子，"测量(metric)"
    <tspan x="50" dy="25">人们的心理状态，这就是心理测量(psychometric)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The psychometric test helped identify the candidate's personality traits.
  </text>
  <text x="50" y="310" class="content">
    心理测量测试帮助识别了候选人的性格特征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Psychologist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Giant ruler -->
    <line x1="70" y1="50" x2="350" y2="50" class="image" />
    <line x1="70" y1="80" x2="350" y2="80" class="image" />
    <line x1="70" y1="110" x2="350" y2="110" class="image" />
    <line x1="70" y1="140" x2="350" y2="140" class="image" />
    <line x1="70" y1="170" x2="350" y2="170" class="image" />
    <line x1="70" y1="200" x2="350" y2="200" class="image" />
    <!-- Person being measured -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>