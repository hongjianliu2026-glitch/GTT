<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ordinarily</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrdnərəli] adv. 通常地，一般地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ordin- (顺序) + -ary (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通人每天按照"顺序(ordin-)"
    <tspan x="50" dy="25">起床、吃饭、工作，这就是"通常地(ordinarily)"的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Ordinarily, he wakes up at 7 AM.
  </text>
  <text x="50" y="310" class="content">
    通常，他早上7点起床。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="50" y1="50" x2="50" y2="15" class="image" />
    <line x1="50" y1="50" x2="85" y2="50" class="image" />
    <!-- Bed -->
    <rect x="100" y="20" width="150" height="80" class="image" />
    <!-- Person -->
    <circle cx="120" cy="60" r="15" class="image" />
    <line x1="120" y1="75" x2="120" y2="110" class="image" />
    <line x1="120" y1="110" x2="100" y2="140" class="image" />
    <line x1="120" y1="110" x2="140" y2="140" class="image" />
    <line x1="120" y1="90" x2="150" y2="80" class="image" />
  </g>
</svg>