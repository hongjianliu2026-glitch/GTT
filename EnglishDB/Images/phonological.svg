<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">phonological</text>
  <text x="50" y="120" class="subtitle">[ˌfoʊnəˈlɒdʒɪkəl] adj. 语音学的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> phono- (声音) + -logy (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个语音学家在研究声音，"声音(phono)"
    <tspan x="50" dy="25">的学科(logy)就是语音学(phonological)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The phonological analysis helped us understand the accent.
  </text>
  <text x="50" y="310" class="content">
    语音学分析帮助我们理解了口音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sound waves -->
    <path d="M50 50 C80 20, 120 20, 150 50 S220 80, 250 50" class="image" />
    <path d="M50 70 C80 40, 120 40, 150 70 S220 100, 250 70" class="image" />
    <path d="M50 90 C80 60, 120 60, 150 90 S220 120, 250 90" class="image" />
    <!-- Microphone -->
    <rect x="150" y="100" width="50" height="100" class="image" />
    <circle cx="175" cy="90" r="10" class="image" />
    <!-- Researcher -->
    <circle cx="200" cy="250" r="20" class="image" />
    <line x1="200" y1="270" x2="200" y2="320" class="image" />
    <line x1="200" y1="320" x2="180" y2="350" class="image" />
    <line x1="200" y1="320" x2="220" y2="350" class="image" />
    <line x1="200" y1="290" x2="230" y2="280" class="image" />
  </g>
</svg>