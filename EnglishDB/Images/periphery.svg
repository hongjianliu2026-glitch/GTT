<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">periphery</text>
  <text x="50" y="120" class="subtitle">[pəˈrɪfəri] n. 外围，边缘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> peri- (周围) + pher (携带) + y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆圈，"周围(peri)"
    <tspan x="50" dy="25">携带(pher)着一切，这个圆圈的外围(periphery)就是边缘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city's periphery is expanding rapidly.
  </text>
  <text x="50" y="310" class="content">
    城市的外围正在迅速扩展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large circle -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- Smaller circle at the periphery -->
    <circle cx="200" cy="100" r="5" class="image" />
    <!-- Arrow pointing to the periphery -->
    <line x1="200" y1="100" x2="280" y2="100" class="image" />
    <polygon points="280,100 270,95 270,105" class="image" />
    <!-- Text label -->
    <text x="290" y="105" class="content">Periphery</text>
  </g>
</svg>