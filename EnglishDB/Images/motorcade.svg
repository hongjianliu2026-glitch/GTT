<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">motorcade</text>
  <text x="50" y="120" class="subtitle">[ˈmoʊtərkeɪd] n. 车队</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> motor (汽车) + -cade (队列)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆辆汽车排成"队列(cade)"，形成一个壮观的车队(motorcade)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The president's motorcade passed through the city.
  </text>
  <text x="50" y="310" class="content">
    总统的车队穿过了城市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Car 1 -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <rect x="20" y="10" width="60" height="30" class="image" />
    <circle cx="30" cy="50" r="10" class="image" />
    <circle cx="80" cy="50" r="10" class="image" />

    <!-- Car 2 -->
    <rect x="120" y="0" width="100" height="50" class="image" />
    <rect x="140" y="10" width="60" height="30" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />

    <!-- Car 3 -->
    <rect x="240" y="0" width="100" height="50" class="image" />
    <rect x="260" y="10" width="60" height="30" class="image" />
    <circle cx="270" cy="50" r="10" class="image" />
    <circle cx="320" cy="50" r="10" class="image" />
  </g>
</svg>