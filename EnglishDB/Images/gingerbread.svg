<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .gingerbread { fill: #CD853F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gingerbread</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɪndʒərbred] n. 姜饼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ginger (姜) + bread (面包)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的姜饼人，"姜(ginger)"
    <tspan x="50" dy="25">和"面包(bread)"结合，变成了美味的姜饼(gingerbread)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She baked a gingerbread house for Christmas.
  </text>
  <text x="50" y="310" class="content">
    她为圣诞节烤了一个姜饼屋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gingerbread man -->
    <rect x="0" y="0" width="150" height="200" class="gingerbread" />
    <circle cx="75" cy="50" r="30" class="gingerbread" />
    <line x1="75" y1="80" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="25" y2="200" class="image" />
    <line x1="75" y1="150" x2="125" y2="200" class="image" />
    <line x1="75" y1="120" x2="25" y2="100" class="image" />
    <line x1="75" y1="120" x2="125" y2="100" class="image" />
    <!-- Buttons -->
    <circle cx="75" cy="100" r="5" class="gingerbread" />
    <circle cx="75" cy="120" r="5" class="gingerbread" />
    <circle cx="75" cy="140" r="5" class="gingerbread" />
  </g>
</svg>