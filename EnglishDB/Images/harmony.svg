<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">harmony</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrməni] n. 和谐，协调</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> harmo- (和谐) + -ny (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群音符在空中"和谐(harmo-ny)"地飞舞，
    <tspan x="50" dy="25">它们相互配合，形成美妙的旋律。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The couple lives in perfect harmony.
  </text>
  <text x="50" y="310" class="content">
    这对夫妇生活得非常和谐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Musical notes -->
    <path d="M10 10 Q50 50 100 10" class="image" />
    <path d="M10 30 Q50 70 100 30" class="image" />
    <path d="M10 50 Q50 90 100 50" class="image" />
    <path d="M10 70 Q50 110 100 70" class="image" />
    <path d="M10 90 Q50 130 100 90" class="image" />
    <!-- Connecting lines -->
    <line x1="100" y1="10" x2="100" y2="90" class="image" />
    <line x1="100" y1="30" x2="100" y2="110" class="image" />
    <line x1="100" y1="50" x2="100" y2="130" class="image" />
    <line x1="100" y1="70" x2="100" y2="150" class="image" />
    <line x1="100" y1="90" x2="100" y2="170" class="image" />
  </g>
</svg>