<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">symbolism</text>
  <text x="50" y="120" class="subtitle">[ˈsɪmbəˌlɪzəm] n. 象征主义，符号象征</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sym- (共同) + bol (投掷) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群艺术家在创作，他们"共同投掷(sym-bol)"
    <tspan x="50" dy="25">各种符号，这些符号就构成了象征主义(symbolism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The painting is rich in symbolism, with each color and shape representing a different idea.
  </text>
  <text x="50" y="310" class="content">
    这幅画充满了象征主义，每种颜色和形状都代表不同的思想。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artists -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />

    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />

    <!-- Symbols -->
    <rect x="200" y="80" width="50" height="50" class="image" />
    <circle cx="300" cy="105" r="25" class="image" />
    <line x1="350" y1="80" x2="350" y2="130" class="image" />
    <line x1="330" y1="105" x2="370" y2="105" class="image" />
  </g>
</svg>