<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">returning</text>
  <text x="50" y="120" class="subtitle">[rɪˈtɜːrnɪŋ] adj. 返回的，归来的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + turn (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在远处，"再次转身(re-turn)"
    <tspan x="50" dy="25">朝家的方向走去，这就是返回(returning)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The returning soldiers were welcomed with open arms.
  </text>
  <text x="50" y="310" class="content">
    归来的士兵们受到了热烈的欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path for the returning journey -->
    <path d="M 0 100 Q 100 50 200 100 T 400 100" class="image" />
    <!-- Person turning back -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Home -->
    <rect x="350" y="80" width="50" height="50" class="image" />
    <line x1="375" y1="80" x2="375" y2="30" class="image" />
    <line x1="350" y1="105" x2="400" y2="105" class="image" />
  </g>
</svg>