<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">world-class</text>
  <text x="50" y="120" class="subtitle">[ˈwɜːrld klæs] adj. 世界级的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> world (世界) + class (等级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个运动员站在世界级的领奖台上，"世界(world)"
    <tspan x="50" dy="25">级的等级(class)，代表着最高水平的成就。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team won a world-class championship.
  </text>
  <text x="50" y="310" class="content">
    这支队伍赢得了世界级的冠军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Podium -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="100" y="50" width="150" height="150" class="image" />
    <!-- Athlete -->
    <circle cx="175" cy="125" r="20" class="image" />
    <line x1="175" y1="145" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="200" class="image" />
    <line x1="175" y1="180" x2="195" y2="200" class="image" />
    <line x1="175" y1="160" x2="200" y2="150" class="image" />
    <!-- World symbol -->
    <circle cx="275" cy="125" r="30" class="image" />
    <line x1="275" y1="95" x2="275" y2="155" class="image" />
    <line x1="245" y1="125" x2="305" y2="125" class="image" />
    <line x1="255" y1="105" x2="295" y2="145" class="image" />
    <line x1="255" y1="145" x2="295" y2="105" class="image" />
  </g>
</svg>