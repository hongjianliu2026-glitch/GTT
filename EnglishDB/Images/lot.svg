<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lot</text>
  <text x="50" y="120" class="subtitle">[lɒt] n. 许多，大量；一块地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lot (来自古英语 hlot，意为“抽签”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的集市，人们通过抽签(lot)来决定谁得到
    <tspan x="50" dy="25">哪块地，最终每个人都能得到一块地(lot)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a lot of books last week.
  </text>
  <text x="50" y="310" class="content">
    她上周买了许多书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Lots -->
    <rect x="50" y="80" width="50" height="50" class="image" />
    <rect x="120" y="80" width="50" height="50" class="image" />
    <rect x="190" y="80" width="50" height="50" class="image" />
    <!-- Draw lots -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="180" class="image" />
    <line x1="150" y1="150" x2="150" y2="180" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
  </g>
</svg>