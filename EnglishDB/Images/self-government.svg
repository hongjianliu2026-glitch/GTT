<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">self-government</text>
  <text x="50" y="120" class="subtitle">[ˌself ˈɡʌvərnmənt] n. 自治，自我管理</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self- (自己) + govern (统治) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"自己统治(self-govern)"
    <tspan x="50" dy="25">自己，共同制定规则，这就是自治(self-government)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The community practices self-government to resolve local issues.
  </text>
  <text x="50" y="310" class="content">
    社区通过自治来解决当地问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People sitting in a circle -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="150" r="50" class="image" />
    <circle cx="200" cy="100" r="50" class="image" />
    <circle cx="150" cy="50" r="50" class="image" />
    <!-- Table -->
    <rect x="50" y="50" width="200" height="100" class="image" />
    <!-- Gavel (symbol of governance) -->
    <rect x="140" y="30" width="20" height="50" class="image" />
    <rect x="135" y="25" width="30" height="10" class="image" />
  </g>
</svg>