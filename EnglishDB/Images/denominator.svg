<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">denominator</text>
  <text x="50" y="120" class="subtitle">[dɪˈnɒmɪˌneɪtər] n. 分母</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + nomin (名称) + -ator (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个数学家在黑板上写下分数，"向下命名(de-nomin)"
    <tspan x="50" dy="25">分母(denominator)，它决定了分数的单位。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The denominator in the fraction 3/4 is 4.
  </text>
  <text x="50" y="310" class="content">
    分数3/4中的分母是4。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blackboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fraction -->
    <line x1="150" y1="80" x2="250" y2="80" class="image" />
    <text x="160" y="70" class="content">3</text>
    <text x="200" y="100" class="content">4</text>
    <!-- Arrow pointing to denominator -->
    <line x1="200" y1="110" x2="200" y2="150" class="image" />
    <polygon points="195,150 205,150 200,160" class="image" />
    <text x="180" y="170" class="content">denominator</text>
  </g>
</svg>