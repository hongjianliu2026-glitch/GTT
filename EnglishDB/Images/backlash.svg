<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">backlash</text>
  <text x="50" y="120" class="subtitle">[ˈbæklæʃ] n. 强烈反对，强烈反应</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> back (后面) + lash (鞭打)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在前面走，突然感到"后面(back)"
    <tspan x="50" dy="25">被"鞭打(lash)"，这种强烈的反应就是backlash。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy caused a backlash from the public.
  </text>
  <text x="50" y="310" class="content">
    新政策引起了公众的强烈反对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="80" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="80" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <!-- Backlash -->
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="130" class="image" />
    <line x1="100" y1="150" x2="120" y2="130" class="image" />
    <line x1="100" y1="150" x2="100" y2="170" class="image" />
  </g>
</svg>