<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">destroy</text>
  <text x="50" y="120" class="subtitle">[dɪˈstrɔɪ] v. 破坏，毁灭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + stroy (建造)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨人挥舞着锤子，"向下(de-)"
    <tspan x="50" dy="25">砸向一座刚刚"建造(stroy)"好的城堡，</tspan>
    <tspan x="50" dy="25">瞬间将其"破坏(destroy)"成废墟。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The earthquake destroyed the entire village.
  </text>
  <text x="50" y="310" class="content">
    地震摧毁了整个村庄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <rect x="70" y="40" width="210" height="120" class="image" />
    <rect x="90" y="60" width="170" height="80" class="image" />
    <!-- Hammer -->
    <line x1="350" y1="100" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="250" y2="150" class="image" />
    <!-- Giant -->
    <circle cx="350" cy="50" r="20" class="image" />
    <line x1="350" y1="70" x2="350" y2="120" class="image" />
    <line x1="350" y1="120" x2="330" y2="150" class="image" />
    <line x1="350" y1="120" x2="370" y2="150" class="image" />
    <line x1="350" y1="90" x2="390" y2="80" class="image" />
  </g>
</svg>