<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neoliberal</text>
  <text x="50" y="120" class="subtitle">[ˌniːoʊˈlɪbərəl] adj. 新自由主义的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neo- (新的) + liberal (自由的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个现代城市，"新(neo)"
    <tspan x="50" dy="25">自由主义者(liberal)在街头演讲，</tspan>
    <tspan x="50" dy="25">倡导自由市场和减少政府干预。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government's neoliberal policies have been controversial.
  </text>
  <text x="50" y="310" class="content">
    政府的新自由主义政策一直备受争议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Modern city skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="40" width="50" height="80" class="image" />
    <rect x="190" y="60" width="50" height="60" class="image" />
    <rect x="260" y="80" width="50" height="40" class="image" />
    <!-- Speaker -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="175" x2="50" y2="165" class="image" />
    <!-- Speech bubble -->
    <path d="M 50 140 Q 100 140 100 100 Q 100 60 50 60 Q 0 60 0 100 Q 0 140 50 140 Z" class="image" />
    <text x="60" y="110" class="content">Free Market!</text>
  </g>
</svg>