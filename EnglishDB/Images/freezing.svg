<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ice { fill: #AED6F1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">freezing</text>
  <text x="50" y="120" class="subtitle">[ˈfriːzɪŋ] adj. 冻结的，极冷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> freeze (冻结) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冰天雪地的场景，"冻结(freeze)"
    <tspan x="50" dy="25">的空气让人瑟瑟发抖，这就是极冷的(freezing)感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The temperature dropped to freezing last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚气温降到了冰点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowman -->
    <circle cx="100" cy="100" r="40" class="ice" />
    <circle cx="100" cy="160" r="50" class="ice" />
    <circle cx="100" cy="230" r="60" class="ice" />
    <!-- Snowflakes -->
    <line x1="50" y1="50" x2="70" y2="70" class="image" />
    <line x1="50" y1="70" x2="70" y2="50" class="image" />
    <line x1="150" y1="50" x2="170" y2="70" class="image" />
    <line x1="150" y1="70" x2="170" y2="50" class="image" />
    <line x1="250" y1="50" x2="270" y2="70" class="image" />
    <line x1="250" y1="70" x2="270" y2="50" class="image" />
    <!-- Cold breath -->
    <circle cx="100" cy="20" r="10" class="ice" />
    <circle cx="120" cy="25" r="10" class="ice" />
    <circle cx="140" cy="30" r="10" class="ice" />
  </g>
</svg>