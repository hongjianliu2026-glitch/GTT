<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">departure</text>
  <text x="50" y="120" class="subtitle">[dɪˈpɑːrtʃər] n. 离开，出发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + part (部分)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从一个大拼图中"离开(de-)"，
    <tspan x="50" dy="25">带走了一块"部分(part)"，这就是出发(departure)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The departure of the train was delayed due to fog.
  </text>
  <text x="50" y="310" class="content">
    由于雾，火车的出发被延迟了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puzzle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="100" class="image" />
    <rect x="170" y="20" width="100" height="100" class="image" />
    <rect x="50" y="140" width="100" height="100" class="image" />
    <rect x="170" y="140" width="100" height="100" class="image" />
    <!-- Missing piece -->
    <rect x="290" y="20" width="50" height="50" class="image" />
    <!-- Person -->
    <circle cx="315" cy="50" r="15" class="image" />
    <line x1="315" y1="65" x2="315" y2="100" class="image" />
    <line x1="315" y1="100" x2="300" y2="130" class="image" />
    <line x1="315" y1="100" x2="330" y2="130" class="image" />
    <line x1="315" y1="80" x2="340" y2="70" class="image" />
  </g>
</svg>