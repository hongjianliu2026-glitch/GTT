<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .coffee { fill: #A5694F; }
      .foam { fill: #F4D03F; }
      .cup { fill: #FFFFFF; stroke: #7F8C8D; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cappuccino</text>
  <text x="50" y="120" class="subtitle">[ˌkæpʊˈtʃiːnoʊ] n. 卡布奇诺咖啡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cap (头) + puc (小) + ino (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯卡布奇诺咖啡，上面覆盖着一层厚厚的奶泡，
    <tspan x="50" dy="25">就像一个小小的白色“头”(cap)，象征着温暖和舒适。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She ordered a cappuccino at the coffee shop.
  </text>
  <text x="50" y="310" class="content">
    她在咖啡店点了一杯卡布奇诺。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup -->
    <rect x="0" y="0" width="200" height="150" class="cup" />
    <!-- Coffee -->
    <rect x="10" y="10" width="180" height="100" class="coffee" />
    <!-- Foam -->
    <rect x="10" y="110" width="180" height="30" class="foam" />
    <!-- Steam -->
    <line x1="100" y1="10" x2="100" y2="0" class="image" />
    <line x1="110" y1="10" x2="110" y2="0" class="image" />
    <line x1="120" y1="10" x2="120" y2="0" class="image" />
  </g>
</svg>