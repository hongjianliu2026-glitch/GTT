<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cotton { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cotton</text>
  <text x="50" y="120" class="subtitle">[ˈkɒtn] n. 棉花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cot- (来自古英语cot，意为小屋) + -on (表示物质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小屋(cot)里堆满了白色的棉花(cotton)，
    <tspan x="50" dy="25">这些棉花柔软而温暖，就像冬天的温暖拥抱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a cotton dress for the summer.
  </text>
  <text x="50" y="310" class="content">
    她为夏天买了一件棉质连衣裙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small house -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="20" y="20" width="110" height="60" class="image" />
    <line x1="75" y1="20" x2="75" y2="0" class="image" />
    <line x1="20" y1="20" x2="75" y2="0" class="image" />
    <line x1="130" y1="20" x2="75" y2="0" class="image" />

    <!-- Cotton balls -->
    <circle cx="20" cy="120" r="15" class="cotton" />
    <circle cx="60" cy="120" r="15" class="cotton" />
    <circle cx="100" cy="120" r="15" class="cotton" />
    <circle cx="40" cy="140" r="15" class="cotton" />
    <circle cx="80" cy="140" r="15" class="cotton" />
  </g>
</svg>