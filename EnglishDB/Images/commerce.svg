<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commerce</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmərs] n. 商业，贸易</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + merc (贸易)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群商人围坐在一起，"共同(com-)"
    <tspan x="50" dy="25">进行贸易(merc)，这就是商业(commerce)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The country's commerce is booming.
  </text>
  <text x="50" y="310" class="content">
    这个国家的商业正在蓬勃发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Merchants -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Goods -->
    <rect x="70" y="50" width="30" height="30" class="image" />
    <rect x="170" y="50" width="30" height="30" class="image" />
    <rect x="270" y="50" width="30" height="30" class="image" />
    <!-- Money -->
    <line x1="50" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <line x1="50" y1="140" x2="150" y2="140" class="image" />
    <line x1="150" y1="140" x2="250" y2="140" class="image" />
  </g>
</svg>