<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shambles</text>
  <text x="50" y="120" class="subtitle">[ˈʃæmbəlz] n. 混乱，废墟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shamb- (混乱) + -les (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，所有的东西都被"混乱(shamb-)"地扔在地上，
    <tspan x="50" dy="25">就像一个"废墟(shambles)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was in a complete shambles after the party.
  </text>
  <text x="50" y="310" class="content">
    派对结束后，房间一片狼藉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Messy items -->
    <line x1="50" y1="20" x2="100" y2="180" class="image" />
    <line x1="150" y1="20" x2="200" y2="180" class="image" />
    <line x1="250" y1="20" x2="300" y2="180" class="image" />
    <line x1="70" y1="20" x2="120" y2="180" class="image" />
    <line x1="170" y1="20" x2="220" y2="180" class="image" />
    <line x1="270" y1="20" x2="320" y2="180" class="image" />
    <!-- Broken items -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
  </g>
</svg>