<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reactive</text>
  <text x="50" y="120" class="subtitle">[rɪˈæktɪv] adj. 反应性的，反作用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + act (行动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学实验室里，一个科学家在观察一个"再次行动(re-act)"的化学反应，
    <tspan x="50" dy="25">这个反应非常迅速且剧烈，就像一个"反应性(reactive)"的物质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The reactive chemicals must be handled with care.
  </text>
  <text x="50" y="310" class="content">
    这些反应性化学品必须小心处理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flask -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Bubbles -->
    <circle cx="75" cy="100" r="20" class="image" />
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="50" cy="140" r="10" class="image" />
    <!-- Scientist -->
    <circle cx="20" cy="250" r="15" class="image" />
    <line x1="20" y1="265" x2="20" y2="300" class="image" />
    <line x1="20" y1="300" x2="0" y2="330" class="image" />
    <line x1="20" y1="300" x2="40" y2="330" class="image" />
    <line x1="20" y1="280" x2="50" y2="270" class="image" />
  </g>
</svg>