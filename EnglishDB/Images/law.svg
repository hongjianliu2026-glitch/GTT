<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">law</text>
  <text x="50" y="120" class="subtitle">[lɔː] n. 法律，规律</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> leg- (法律)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官在法庭上，手持一本厚重的法律书，
    <tspan x="50" dy="25">"法律(law)"就是维护社会秩序的"规律(leg-)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Everyone must obey the law.
  </text>
  <text x="50" y="310" class="content">
    每个人都必须遵守法律。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Judge -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Law book -->
    <rect x="100" y="30" width="150" height="100" class="image" />
    <line x1="120" y1="50" x2="230" y2="50" class="image" />
    <line x1="120" y1="70" x2="230" y2="70" class="image" />
    <line x1="120" y1="90" x2="230" y2="90" class="image" />
  </g>
</svg>