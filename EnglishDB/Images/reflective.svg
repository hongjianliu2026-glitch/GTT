<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reflective</text>
  <text x="50" y="120" class="subtitle">[rɪˈflektɪv] adj. 反射的，沉思的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + fleet (弯曲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一面镜子，光线"弯曲回(re-fleet)"到你的眼睛，
    <tspan x="50" dy="25">这就是反射(reflective)的原理。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The reflective surface of the water made the sunset look even more beautiful.
  </text>
  <text x="50" y="310" class="content">
    水面的反射使日落看起来更加美丽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mirror -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Reflection -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="80" x2="150" y2="80" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
    <!-- Sun -->
    <circle cx="100" cy="250" r="30" class="image" />
    <!-- Sun rays -->
    <line x1="100" y1="220" x2="100" y2="180" class="image" />
    <line x1="70" y1="230" x2="40" y2="200" class="image" />
    <line x1="130" y1="230" x2="160" y2="200" class="image" />
  </g>
</svg>