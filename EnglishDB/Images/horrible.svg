<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">horrible</text>
  <text x="50" y="120" class="subtitle">[ˈhɒrəbl] adj. 可怕的，极坏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> horr (恐怖) + -ible (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恐怖电影场景，"恐怖(horr)"
    <tspan x="50" dy="25">的氛围让人感到"极坏的(horrible)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The horror movie was so horrible that I couldn't sleep.
  </text>
  <text x="50" y="310" class="content">
    那部恐怖电影太可怕了，我晚上都睡不着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horror movie scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ghost -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Scream -->
    <path d="M100,100 Q150,50 200,100" class="image" />
    <path d="M100,120 Q150,70 200,120" class="image" />
    <path d="M100,140 Q150,90 200,140" class="image" />
  </g>
</svg>