<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">regenerate</text>
  <text x="50" y="120" class="subtitle">[rɪˈdʒenəreɪt] v. 再生，重生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + gen (产生) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵枯萎的树，"再次产生(re-gen)"
    <tspan x="50" dy="25">新的生命，重新长出绿叶，这就是再生(regenerate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forest regenerated after the fire.
  </text>
  <text x="50" y="310" class="content">
    森林在火灾后重新生长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree stump -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <!-- New branches -->
    <line x1="50" y1="100" x2="20" y2="150" class="image" />
    <line x1="50" y1="100" x2="80" y2="150" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <!-- Leaves -->
    <circle cx="20" cy="150" r="10" class="image" />
    <circle cx="80" cy="150" r="10" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
  </g>
</svg>