<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trough</text>
  <text x="50" y="120" class="subtitle">[trɔːf] n. 槽，水槽；低谷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tr(o)ugh (源自中古英语，意为“沟渠”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头牛在农场里，低头在"槽(trough)"里喝水，
    <tspan x="50" dy="25">这个槽就是用来盛放食物或水的容器。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pigs were eating from the trough.
  </text>
  <text x="50" y="310" class="content">
    猪正在从槽里吃东西。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Trough -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Water in the trough -->
    <rect x="10" y="10" width="330" height="80" fill="#AED6F1" />
    <!-- Cow -->
    <circle cx="20" cy="120" r="20" class="image" />
    <line x1="20" y1="140" x2="20" y2="180" class="image" />
    <line x1="20" y1="180" x2="0" y2="210" class="image" />
    <line x1="20" y1="180" x2="40" y2="210" class="image" />
    <line x1="20" y1="160" x2="50" y2="150" class="image" />
    <!-- Cow's head in the trough -->
    <circle cx="100" cy="60" r="15" class="image" />
    <line x1="100" y1="75" x2="100" y2="90" class="image" />
  </g>
</svg>