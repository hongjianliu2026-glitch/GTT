<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">artfully</text>
  <text x="50" y="120" class="subtitle">[ˈɑːrtfəli] adv. 巧妙地，艺术地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> art (艺术) + -ful (充满) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在画布上"充满艺术地(art-ful-ly)"
    <tspan x="50" dy="25">创作，每一笔都巧妙而精致，展现出艺术的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She artfully arranged the flowers in the vase.
  </text>
  <text x="50" y="310" class="content">
    她巧妙地安排了花瓶里的花。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Canvas -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Brush -->
    <line x1="300" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="130" class="image" />
    <!-- Artwork -->
    <circle cx="120" cy="100" r="20" class="image" />
    <rect x="150" y="80" width="40" height="40" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="140" class="image" />
    <line x1="200" y1="120" x2="220" y2="140" class="image" />
  </g>
</svg>