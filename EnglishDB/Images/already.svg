<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">already</text>
  <text x="50" y="120" class="subtitle">[ɔːlˈredi] adv. 已经</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> al- (全部) + ready (准备好的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"全部(al-)"
    <tspan x="50" dy="25">都已经准备好了(ready)"，</tspan>
    <tspan x="50" dy="25">所有的食材都已经切好，</tspan>
    <tspan x="50" dy="25">这意味着他已经"已经(already)"准备好了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> She had already finished her homework before dinner.
  </text>
  <text x="50" y="330" class="content">
    她在晚饭前已经完成了作业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Kitchen counter -->
    <rect x="50" y="20" width="300" height="160" class="image" />
    <!-- Ingredients -->
    <circle cx="80" cy="60" r="10" class="image" />
    <rect x="110" y="50" width="20" height="20" class="image" />
    <rect x="140" y="50" width="20" height="20" class="image" />
    <rect x="170" y="50" width="20" height="20" class="image" />
    <rect x="200" y="50" width="20" height="20" class="image" />
    <rect x="230" y="50" width="20" height="20" class="image" />
    <rect x="260" y="50" width="20" height="20" class="image" />
  </g>
</svg>