<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decree</text>
  <text x="50" y="120" class="subtitle">[dɪˈkriː] n. 法令，命令；v. 颁布法令</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + cre (创造)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位国王站在高台上，"向下创造(de-cre)"
    <tspan x="50" dy="25">一个法令，这个法令就成为了国家的法律(decree)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The king decreed that all taxes must be paid by the end of the month.
  </text>
  <text x="50" y="310" class="content">
    国王颁布法令，要求所有税款必须在月底前缴纳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- King on the throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="50" r="30" class="image" />
    <line x1="175" y1="80" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="145" y2="200" class="image" />
    <line x1="175" y1="150" x2="205" y2="200" class="image" />
    <line x1="175" y1="100" x2="125" y2="120" class="image" />
    <line x1="175" y1="100" x2="225" y2="120" class="image" />
    <!-- Decree scroll -->
    <rect x="100" y="150" width="150" height="50" class="image" />
    <line x1="110" y1="160" x2="240" y2="160" class="image" />
    <line x1="110" y1="180" x2="240" y2="180" class="image" />
    <line x1="110" y1="200" x2="240" y2="200" class="image" />
  </g>
</svg>