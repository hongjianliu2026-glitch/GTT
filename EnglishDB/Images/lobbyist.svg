<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lobbyist</text>
  <text x="50" y="120" class="subtitle">[ˈlɒbɪst] n. 说客</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lobby (大厅) + -ist (从事...的人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个说客在大厅里，"在大厅(lobby)里游说(ist)"
    <tspan x="50" dy="25">议员，试图影响政策决策。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lobbyist tried to persuade the senator to support the new bill.
  </text>
  <text x="50" y="310" class="content">
    说客试图说服参议员支持新法案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lobby -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Senator -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 50 80 Q 100 60 150 80 Q 200 100 150 120 Q 100 140 50 120 Z" class="image" />
    <text x="80" y="100" class="content" text-anchor="middle">说服</text>
  </g>
</svg>