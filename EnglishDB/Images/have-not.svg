<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">have-not</text>
  <text x="50" y="120" class="subtitle">[ˈhæv nɑːt] n. 穷人，无产者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> have (拥有) + not (不)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"没有(not)"任何东西的"拥有者(have)"，
    <tspan x="50" dy="25">他就是一个"穷人(have-not)"，站在空荡荡的房间里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The have-nots often struggle to make ends meet.
  </text>
  <text x="50" y="310" class="content">
    穷人常常难以维持生计。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Empty room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="30" y="150" width="50" height="50" class="image" />
    <!-- Window -->
    <rect x="270" y="150" width="50" height="50" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="145" y2="130" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
  </g>
</svg>