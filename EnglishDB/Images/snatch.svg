<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snatch</text>
  <text x="50" y="120" class="subtitle">[snætʃ] v. 抢夺，迅速抓住</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sn- (表示快速) + -atch (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在街上，"迅速抓住(sn-atch)"
    <tspan x="50" dy="25">一个掉落的物品，这个动作就是抢夺(snatch)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He snatched the book from her hands.
  </text>
  <text x="50" y="310" class="content">
    他从她手中抢走了书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="20" y2="160" class="image" />
    <line x1="50" y1="140" x2="80" y2="160" class="image" />

    <!-- Hand reaching out -->
    <line x1="50" y1="120" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="120" class="image" />

    <!-- Object being snatched -->
    <rect x="110" y="90" width="30" height="20" class="image" />
  </g>
</svg>