<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unassuming</text>
  <text x="50" y="120" class="subtitle">[ˌʌnəˈsjuːmɪŋ] adj. 不摆架子的，谦逊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + assume (假定，自负)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着朴素的人，"不假定(un-assume)"
    <tspan x="50" dy="25">自己比别人优越，始终保持谦逊的态度。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was an unassuming man who never boasted about his achievements.
  </text>
  <text x="50" y="310" class="content">
    他是一个从不夸耀自己成就的谦逊的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Simple person -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="90" x2="30" y2="80" class="image" />
    <line x1="50" y1="90" x2="70" y2="80" class="image" />
    <line x1="50" y1="120" x2="30" y2="140" class="image" />
    <line x1="50" y1="120" x2="70" y2="140" class="image" />
    <!-- Simple clothes -->
    <rect x="30" y="70" width="40" height="50" class="image" />
    <!-- Humble expression -->
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <line x1="45" y1="65" x2="55" y2="65" class="image" />
  </g>
</svg>