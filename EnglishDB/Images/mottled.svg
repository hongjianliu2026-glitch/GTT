<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mottled</text>
  <text x="50" y="120" class="subtitle">[ˈmɒtld] adj. 斑驳的，杂色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mot (斑点) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只斑点狗，身上布满了"斑点(mot)"，
    <tspan x="50" dy="25">这些斑点让它的毛色变得"杂色(mottled)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mottled pattern on the wall made it look like a giant leopard.
  </text>
  <text x="50" y="310" class="content">
    墙上的斑驳图案让它看起来像一只巨大的豹子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Spots -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="80" r="25" class="image" />
    <circle cx="250" cy="120" r="30" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <circle cx="200" cy="180" r="25" class="image" />
    <!-- Dog head -->
    <circle cx="300" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="280" cy="80" r="10" class="image" />
    <circle cx="320" cy="80" r="10" class="image" />
    <!-- Nose -->
    <circle cx="300" cy="120" r="15" class="image" />
  </g>
</svg>