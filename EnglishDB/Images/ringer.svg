<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ringer</text>
  <text x="50" y="120" class="subtitle">[ˈrɪŋər] n. 冒名顶替者，替身</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ring (铃声) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冒名顶替者(ringer)在铃声(ring)响起时，
    <tspan x="50" dy="25">悄悄地取代了原本的人，就像铃声掩盖了真相。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team had a ringer who played exceptionally well.
  </text>
  <text x="50" y="310" class="content">
    这个队伍有一个表现异常出色的冒名顶替者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bell -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <!-- Person 1 -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Person 2 (ringer) -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Arrow indicating substitution -->
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
    <polygon points="230,100 220,90 220,110" class="image" />
  </g>
</svg>