<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">late</text>
  <text x="50" y="120" class="subtitle">[leɪt] adj. 迟的，晚的；adv. 晚，迟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lat (携带) + e (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人背着沉重的包袱，"携带(lat)"着太多东西，
    <tspan x="50" dy="25">结果"晚(late)"到了目的地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was late for the meeting because of traffic.
  </text>
  <text x="50" y="310" class="content">
    他因为交通堵塞而开会迟到了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person carrying a heavy bag -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="150" class="image" /> <!-- Right arm -->
    <rect x="70" y="140" width="40" height="20" class="image" /> <!-- Bag -->
    <line x1="90" y1="140" x2="90" y2="160" class="image" /> <!-- Bag strap -->
    <line x1="50" y1="130" x2="90" y2="140" class="image" /> <!-- Bag strap connection -->
    <!-- Sun setting -->
    <circle cx="200" cy="50" r="30" class="image" /> <!-- Sun -->
    <line x1="200" y1="80" x2="200" y2="150" class="image" /> <!-- Sun rays -->
    <line x1="170" y1="115" x2="230" y2="115" class="image" /> <!-- Sun rays -->
    <line x1="185" y1="90" x2="215" y2="140" class="image" /> <!-- Sun rays -->
    <line x1="215" y1="90" x2="185" y2="140" class="image" /> <!-- Sun rays -->
  </g>
</svg>