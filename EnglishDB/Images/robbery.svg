<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">robbery</text>
  <text x="50" y="120" class="subtitle">[ˈrɑːbəri] n. 抢劫，盗窃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rob (抢夺) + -ery (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强盗在夜晚"抢夺(rob)"
    <tspan x="50" dy="25">一个无辜的路人，这就是抢劫(robbery)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police are investigating the recent robbery.
  </text>
  <text x="50" y="310" class="content">
    警方正在调查最近的抢劫案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Moon -->
    <circle cx="300" cy="50" r="20" class="image" fill="#ECF0F1" />
    <!-- Thief -->
    <circle cx="50" cy="100" r="15" class="image" fill="#E74C3C" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Victim -->
    <circle cx="150" cy="100" r="15" class="image" fill="#3498DB" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="200" y2="120" class="image" />
    <!-- Money bag -->
    <rect x="250" y="80" width="30" height="40" class="image" fill="#F1C40F" />
    <line x1="265" y1="80" x2="265" y2="40" class="image" />
  </g>
</svg>