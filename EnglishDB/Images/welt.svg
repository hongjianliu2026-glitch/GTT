<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">welt</text>
  <text x="50" y="120" class="subtitle">[welt] n. 鞭痕，肿块；v. 使起鞭痕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wel- (来自古英语 "weal"，意为肿块或鞭痕)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调皮的孩子被鞭子抽打后，"肿起(wel-)"
    <tspan x="50" dy="25">一个明显的鞭痕(welt)，这个肿块让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The punishment left a welt on his back.
  </text>
  <text x="50" y="310" class="content">
    惩罚在他的背上留下了一道鞭痕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Whip -->
    <line x1="100" y1="80" x2="200" y2="120" class="image" />
    <!-- Welt -->
    <rect x="150" y="100" width="50" height="20" class="image" />
    <text x="155" y="115" class="content" fill="#E74C3C">welt</text>
  </g>
</svg>