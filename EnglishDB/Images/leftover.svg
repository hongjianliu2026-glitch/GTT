<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leftover</text>
  <text x="50" y="120" class="subtitle">[ˈlɛftˌoʊvər] n. 剩余物，剩菜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> left (剩下的) + over (在上面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一顿丰盛的晚餐后，"剩下的(left)"
    <tspan x="50" dy="25">食物"在上面(over)"，这些就是剩菜(leftover)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She packed the leftover food for lunch the next day.
  </text>
  <text x="50" y="310" class="content">
    她把剩菜打包，准备第二天带去吃午饭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Leftover food -->
    <circle cx="100" cy="100" r="30" class="image" />
    <rect x="150" y="70" width="100" height="60" class="image" />
    <line x1="270" y1="70" x2="320" y2="130" class="image" />
    <line x1="320" y1="130" x2="270" y2="190" class="image" />
    <line x1="270" y1="190" x2="320" y2="130" class="image" />
    <!-- Fork -->
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="30" y2="170" class="image" />
    <line x1="50" y1="150" x2="70" y2="170" class="image" />
  </g>
</svg>