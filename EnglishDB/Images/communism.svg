<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">communism</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmjʊnɪzəm] n. 共产主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + mun (服务) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色旗帜下，人们"共同服务(com-mun)"
    <tspan x="50" dy="25">于一个理想社会，这就是共产主义(communism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He studied the history of communism in college.
  </text>
  <text x="50" y="310" class="content">
    他在大学里学习了共产主义的历史。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Red flag -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#C0392B" />
    <!-- Hammer and sickle -->
    <circle cx="100" cy="100" r="30" class="image" fill="#F1C40F" />
    <line x1="100" y1="70" x2="100" y2="130" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <!-- People -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="300" y2="120" class="image" />
  </g>
</svg>