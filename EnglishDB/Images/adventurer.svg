<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adventurer</text>
  <text x="50" y="120" class="subtitle">[ədˈvɛntʃərər] n. 冒险者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + vent (来) + -ure (名词后缀) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的人，"朝向(ad-)"未知的"来(vent)"，
    <tspan x="50" dy="25">他/她就是一位冒险者(adventurer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The adventurer set out on a journey to explore the uncharted island.
  </text>
  <text x="50" y="310" class="content">
    这位冒险者出发去探索那座未知的岛屿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Adventurer -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="140" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <!-- Map -->
    <rect x="100" y="80" width="200" height="150" class="image" />
    <line x1="120" y1="100" x2="280" y2="100" class="image" />
    <line x1="120" y1="130" x2="280" y2="130" class="image" />
    <line x1="120" y1="160" x2="280" y2="160" class="image" />
    <!-- Compass -->
    <circle cx="350" cy="150" r="20" class="image" />
    <line x1="350" y1="130" x2="350" y2="170" class="image" />
    <line x1="340" y1="150" x2="360" y2="150" class="image" />
    <line x1="350" y1="150" x2="340" y2="140" class="image" />
    <line x1="350" y1="150" x2="360" y2="140" class="image" />
  </g>
</svg>