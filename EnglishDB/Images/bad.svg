<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bad</text>
  <text x="50" y="120" class="subtitle">[bæd] adj. 坏的，不好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bad (源自中古英语，意为“坏的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个腐烂的苹果，"坏(bad)"到不能再吃，
    <tspan x="50" dy="25">它的表面布满了霉菌，让人一看就知道是坏的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The weather was so bad that we had to stay indoors.
  </text>
  <text x="50" y="310" class="content">
    天气太坏了，我们不得不待在室内。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rotten apple -->
    <circle cx="100" cy="100" r="60" class="image" fill="#8B4513" />
    <circle cx="80" cy="80" r="10" class="image" fill="#556B2F" />
    <circle cx="120" cy="90" r="15" class="image" fill="#556B2F" />
    <circle cx="100" cy="120" r="20" class="image" fill="#556B2F" />
    <circle cx="130" cy="110" r="10" class="image" fill="#556B2F" />
    <circle cx="90" cy="130" r="15" class="image" fill="#556B2F" />
    <!-- Mold -->
    <path d="M100,40 Q120,50 100,60 Q80,50 100,40" class="image" fill="#8B0000" />
    <path d="M100,70 Q130,80 100,90 Q70,80 100,70" class="image" fill="#8B0000" />
    <path d="M100,100 Q140,110 100,120 Q60,110 100,100" class="image" fill="#8B0000" />
  </g>
</svg>