<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">softball</text>
  <text x="50" y="120" class="subtitle">[ˈsɔftbɔːl] n. 垒球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soft (软的) + ball (球)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个柔软的球(soft ball)在空中飞舞，
    <tspan x="50" dy="25">就像一个巨大的棉花糖，轻轻地落在草地上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They played softball in the park yesterday.
  </text>
  <text x="50" y="310" class="content">
    他们昨天在公园里打垒球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Softball -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Glove -->
    <rect x="150" y="50" width="100" height="100" class="image" fill="#D35400" />
    <!-- Player -->
    <circle cx="200" cy="150" r="20" class="image" fill="#2C3E50" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="190" x2="240" y2="180" class="image" />
  </g>
</svg>