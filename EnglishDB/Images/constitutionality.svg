<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">constitutionality</text>
  <text x="50" y="120" class="subtitle">[ˌkɒnstɪˌtjuːʃənəˈlɪəti] n. 合宪性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + stitut (建立) + -ality (性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群法官在法庭上，"共同建立(con-stitut)"
    <tspan x="50" dy="25">一个法律体系，确保其符合宪法(constitutionality)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The court must review the law's constitutionality.
  </text>
  <text x="50" y="310" class="content">
    法院必须审查该法律的合宪性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judges -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Constitution -->
    <rect x="200" y="20" width="100" height="160" class="image" />
    <line x1="210" y1="40" x2="290" y2="40" class="image" />
    <line x1="210" y1="70" x2="290" y2="70" class="image" />
    <line x1="210" y1="100" x2="290" y2="100" class="image" />
    <line x1="210" y1="130" x2="290" y2="130" class="image" />
    <!-- Scales of Justice -->
    <line x1="250" y1="180" x2="250" y2="200" class="image" />
    <line x1="240" y1="190" x2="260" y2="190" class="image" />
    <line x1="240" y1="190" x2="240" y2="200" class="image" />
    <line x1="260" y1="190" x2="260" y2="200" class="image" />
  </g>
</svg>