<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">southern</text>
  <text x="50" y="120" class="subtitle">[ˈsʌðərn] adj. 南方的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> south (南) + -ern (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指南针指向南方，"南方(south)"
    <tspan x="50" dy="25">的太阳温暖而明亮，这就是南方的特征(southern)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The southern part of the country is warmer.
  </text>
  <text x="50" y="310" class="content">
    这个国家的南部地区更温暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compass -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="100" y1="100" x2="50" y2="50" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="100" r="40" class="image" fill="#F1C40F" />
    <line x1="250" y1="60" x2="250" y2="20" class="image" />
    <line x1="250" y1="140" x2="250" y2="180" class="image" />
    <line x1="210" y1="100" x2="170" y2="100" class="image" />
    <line x1="290" y1="100" x2="330" y2="100" class="image" />
    <line x1="230" y1="70" x2="200" y2="40" class="image" />
    <line x1="270" y1="70" x2="300" y2="40" class="image" />
    <line x1="230" y1="130" x2="200" y2="160" class="image" />
    <line x1="270" y1="130" x2="300" y2="160" class="image" />
  </g>
</svg>