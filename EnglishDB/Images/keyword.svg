<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">keyword</text>
  <text x="50" y="120" class="subtitle">[ˈkiːwɜːrd] n. 关键词</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> key (关键) + word (词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钥匙(key)上刻着一个词(word)，
    <tspan x="50" dy="25">这个词就是打开知识宝库的关键词(keyword)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The keyword for this lesson is "innovation."
  </text>
  <text x="50" y="310" class="content">
    这节课的关键词是“创新”。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Key -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <rect x="20" y="20" width="160" height="60" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <!-- Word -->
    <text x="30" y="55" class="content" style="font-size: 24px;">word</text>
  </g>
</svg>