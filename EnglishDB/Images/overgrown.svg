<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overgrown</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈɡroʊn] adj. 过度生长的，杂草丛生的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (过度) + grown (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个花园，"过度生长(over-grown)"
    <tspan x="50" dy="25">的植物覆盖了整个地面，杂草丛生，几乎看不到土壤。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden was overgrown with weeds.
  </text>
  <text x="50" y="310" class="content">
    花园里杂草丛生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Overgrown plants -->
    <line x1="50" y1="20" x2="100" y2="180" class="image" />
    <line x1="120" y1="20" x2="170" y2="180" class="image" />
    <line x1="190" y1="20" x2="240" y2="180" class="image" />
    <line x1="260" y1="20" x2="310" y2="180" class="image" />
    <line x1="330" y1="20" x2="380" y2="180" class="image" />
    <!-- Overgrown plants (more) -->
    <line x1="70" y1="20" x2="120" y2="180" class="image" />
    <line x1="140" y1="20" x2="190" y2="180" class="image" />
    <line x1="210" y1="20" x2="260" y2="180" class="image" />
    <line x1="280" y1="20" x2="330" y2="180" class="image" />
    <line x1="350" y1="20" x2="400" y2="180" class="image" />
  </g>
</svg>