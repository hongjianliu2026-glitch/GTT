<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irritability</text>
  <text x="50" y="120" class="subtitle">[ˌɪrɪtəˈbɪləti] n. 易怒，烦躁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (进入) + rit (擦) + -ability (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"擦入(ir-rit)"了神经，变得非常"易怒(irritability)"，
    <tspan x="50" dy="25">就像一只被触碰到的刺猬，全身都是刺。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His irritability was evident after a long day at work.
  </text>
  <text x="50" y="310" class="content">
    经过一天漫长的工作后，他的易怒显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Irritable person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Spikes -->
    <line x1="50" y1="70" x2="50" y2="50" class="image" />
    <line x1="40" y1="75" x2="30" y2="60" class="image" />
    <line x1="60" y1="75" x2="70" y2="60" class="image" />
    <line x1="35" y1="85" x2="20" y2="75" class="image" />
    <line x1="65" y1="85" x2="80" y2="75" class="image" />
  </g>
</svg>