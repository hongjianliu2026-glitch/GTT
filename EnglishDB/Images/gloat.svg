<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gloat</text>
  <text x="50" y="120" class="subtitle">[ɡloʊt] v. 幸灾乐祸，得意地笑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glo- (光) + -at (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在黑暗中，突然看到一束光(glo-)，
    <tspan x="50" dy="25">他得意地笑(gloat)起来，仿佛发现了什么秘密。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He couldn't help but gloat over his rival's failure.
  </text>
  <text x="50" y="310" class="content">
    他忍不住对对手的失败幸灾乐祸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Light beam -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" stroke-width="5" stroke="#F1C40F" />
    <!-- Smiling face -->
    <circle cx="200" cy="100" r="30" class="image" fill="#F1C40F" />
    <circle cx="185" cy="90" r="5" class="image" fill="#000" />
    <circle cx="215" cy="90" r="5" class="image" fill="#000" />
    <path d="M180 110 Q200 120 220 110" class="image" stroke="#000" stroke-width="3" fill="none" />
  </g>
</svg>