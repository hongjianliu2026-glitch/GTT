<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">poach</text>
  <text x="50" y="120" class="subtitle">[poʊtʃ] v. 偷猎，水煮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> poach (源自中古英语pochen，意为“踩踏”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个猎人偷偷“踩踏(poach)”进别人的领地，
    <tspan x="50" dy="25">偷猎野生动物，或者在锅里轻轻“踩踏”水煮食物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was caught poaching deer in the forest.
  </text>
  <text x="50" y="310" class="content">
    他在森林里偷猎鹿时被抓了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hunter -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Deer -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="150" y2="130" class="image" />
    <!-- Pot -->
    <rect x="200" y="80" width="100" height="80" class="image" />
    <line x1="220" y1="100" x2="280" y2="100" class="image" />
    <line x1="220" y1="120" x2="280" y2="120" class="image" />
    <line x1="220" y1="140" x2="280" y2="140" class="image" />
  </g>
</svg>