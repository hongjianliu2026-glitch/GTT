<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cigarette</text>
  <text x="50" y="120" class="subtitle">[ˌsɪɡəˈrɛt] n. 香烟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ciga (雪茄) + ret (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小小的"雪茄(ciga)"，被切成"小(ret)"段，
    <tspan x="50" dy="25">就成了我们熟悉的香烟(cigarette)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He lit a cigarette and took a deep puff.
  </text>
  <text x="50" y="310" class="content">
    他点燃了一支香烟，深深地吸了一口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cigarette -->
    <rect x="0" y="0" width="200" height="20" class="image" />
    <rect x="20" y="5" width="160" height="10" class="image" />
    <!-- Smoke -->
    <line x1="100" y1="0" x2="100" y2="-50" class="image" />
    <line x1="100" y1="-50" x2="80" y2="-70" class="image" />
    <line x1="100" y1="-50" x2="120" y2="-70" class="image" />
    <line x1="100" y1="-50" x2="100" y2="-90" class="image" />
  </g>
</svg>