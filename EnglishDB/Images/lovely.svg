<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #4A4A4A; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #FF6F61; }
      .story { font: 16px serif; fill: #6D6D6D; }
      .image { stroke: #FF6F61; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lovely</text>
  <text x="50" y="120" class="subtitle">[ˈlʌvli] adj. 可爱的，令人愉快的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> love (爱) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满爱(love)的小狗，它的每一个动作都让人感到无比可爱(lovely)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a lovely smile that brightens everyone's day.
  </text>
  <text x="50" y="310" class="content">
    她有一个可爱的笑容，照亮了每个人的一天。
  </text>

