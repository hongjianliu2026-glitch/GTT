<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">biomass</text>
  <text x="50" y="120" class="subtitle">[ˈbaɪoʊmæs] n. 生物量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bio- (生命) + mass (质量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片茂密的森林，"生命(bio-)"
    <tspan x="50" dy="25">的质量(mass)堆积如山，这就是生物量(biomass)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The biomass of the rainforest is enormous.
  </text>
  <text x="50" y="310" class="content">
    热带雨林的生物量非常巨大。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="30" class="image" />
    <!-- Another tree -->
    <rect x="120" y="0" width="100" height="200" class="image" />
    <circle cx="170" cy="220" r="30" class="image" />
    <!-- Another tree -->
    <rect x="240" y="0" width="100" height="200" class="image" />
    <circle cx="290" cy="220" r="30" class="image" />
    <!-- Ground -->
    <rect x="0" y="250" width="350" height="50" class="image" />
  </g>
</svg>