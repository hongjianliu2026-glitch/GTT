<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">valuation</text>
  <text x="50" y="120" class="subtitle">[ˌvæljuˈeɪʃn] n. 估价，评价</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> valu- (价值) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个专家拿着放大镜，仔细"评估(valu-)"
    <tspan x="50" dy="25">一件古董的价值，这个过程就是估价(valuation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The valuation of the antique vase was surprisingly high.
  </text>
  <text x="50" y="310" class="content">
    这个古董花瓶的估价出乎意料地高。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="80" y1="100" x2="150" y2="100" class="image" />
    <!-- Antique vase -->
    <rect x="200" y="70" width="100" height="60" class="image" />
    <line x1="250" y1="70" x2="250" y2="10" class="image" />
    <line x1="220" y1="10" x2="280" y2="10" class="image" />
    <line x1="220" y1="10" x2="220" y2="30" class="image" />
    <line x1="280" y1="10" x2="280" y2="30" class="image" />
    <line x1="220" y1="30" x2="280" y2="30" class="image" />
  </g>
</svg>