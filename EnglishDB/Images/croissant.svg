<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .croissant { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">croissant</text>
  <text x="50" y="120" class="subtitle">[krwɑ:'sɒ̃] n. 羊角面包</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> croissant (源自法语，意为“新月”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新月形状的面包，"新月(croissant)"
    <tspan x="50" dy="25">在早晨的阳光下闪闪发光，这就是羊角面包(croissant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She enjoyed a croissant with her coffee.
  </text>
  <text x="50" y="310" class="content">
    她喜欢用羊角面包配咖啡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Croissant shape -->
    <path d="M 0 100 C 50 50, 150 50, 200 100 C 150 150, 50 150, 0 100" class="croissant" />
    <!-- Sun -->
    <circle cx="250" cy="100" r="30" fill="#FFD700" />
    <!-- Rays of the sun -->
    <line x1="250" y1="70" x2="250" y2="20" stroke="#FFD700" stroke-width="2" />
    <line x1="280" y1="70" x2="310" y2="40" stroke="#FFD700" stroke-width="2" />
    <line x1="280" y1="100" x2="310" y2="100" stroke="#FFD700" stroke-width="2" />
    <line x1="280" y1="130" x2="310" y2="160" stroke="#FFD700" stroke-width="2" />
    <line x1="250" y1="130" x2="250" y2="180" stroke="#FFD700" stroke-width="2" />
    <line x1="220" y1="130" x2="190" y2="160" stroke="#FFD700" stroke-width="2" />
    <line x1="220" y1="100" x2="190" y2="100" stroke="#FFD700" stroke-width="2" />
    <line x1="220" y1="70" x2="190" y2="40" stroke="#FFD700" stroke-width="2" />
  </g>
</svg>