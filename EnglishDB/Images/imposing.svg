<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imposing</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpoʊzɪŋ] adj. 令人印象深刻的，壮观的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + pos (放置) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的山峰"进入(im-)"你的视野，"放置(pos)"在那里，
    <tspan x="50" dy="25">它的壮观景象令人印象深刻(imposing)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The imposing building stood tall in the city center.
  </text>
  <text x="50" y="310" class="content">
    这座壮观的建筑矗立在市中心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Sun -->
    <circle cx="225" cy="50" r="30" class="image" />
    <!-- Person -->
    <circle cx="50" cy="180" r="15" class="image" />
    <line x1="50" y1="195" x2="50" y2="230" class="image" />
    <line x1="50" y1="230" x2="35" y2="260" class="image" />
    <line x1="50" y1="230" x2="65" y2="260" class="image" />
    <line x1="50" y1="210" x2="80" y2="200" class="image" />
  </g>
</svg>