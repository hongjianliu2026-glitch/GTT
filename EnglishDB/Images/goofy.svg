<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">goofy</text>
  <text x="50" y="120" class="subtitle">[ˈɡuːfi] adj. 愚蠢的，滑稽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> goof (愚蠢) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着大鞋子、戴着大耳朵帽子的滑稽角色，
    <tspan x="50" dy="25">他走路摇摇晃晃，总是做出一些愚蠢的动作，</tspan>
    <tspan x="50" dy="25">这就是“goofy”的生动画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clown's goofy antics made everyone laugh.
  </text>
  <text x="50" y="310" class="content">
    小丑滑稽的举动让每个人都笑了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Big shoes -->
    <rect x="50" y="100" width="100" height="30" class="image" />
    <rect x="170" y="100" width="100" height="30" class="image" />
    <!-- Big ears -->
    <circle cx="100" cy="50" r="30" class="image" />
    <circle cx="200" cy="50" r="30" class="image" />
    <!-- Face -->
    <circle cx="150" cy="80" r="40" class="image" />
    <!-- Eyes -->
    <circle cx="130" cy="70" r="5" class="image" />
    <circle cx="170" cy="70" r="5" class="image" />
    <!-- Mouth -->
    <line x1="130" y1="100" x2="170" y2="100" class="image" />
  </g>
</svg>