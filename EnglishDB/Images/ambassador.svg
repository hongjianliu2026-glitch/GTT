<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ambassador</text>
  <text x="50" y="120" class="subtitle">[æmˈbæsədər] n. 大使，代表</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> amb- (周围) + ass- (走) + -ad (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"周围走动(amb-ass)"的人，他代表着一个国家，
    <tspan x="50" dy="25">在不同国家之间穿梭，这个人就是大使(ambassador)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ambassador was warmly welcomed in the foreign country.
  </text>
  <text x="50" y="310" class="content">
    大使在外国受到了热烈欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="70" class="image" />
    <!-- Path around the globe -->
    <path d="M105,100 A70,70 0 0,1 245,100" class="image" />
    <!-- Ambassador -->
    <circle cx="175" cy="100" r="15" class="image" />
    <line x1="175" y1="115" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="155" y2="180" class="image" />
    <line x1="175" y1="150" x2="195" y2="180" class="image" />
    <line x1="175" y1="130" x2="205" y2="120" class="image" />
  </g>
</svg>