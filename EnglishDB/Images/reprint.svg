<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reprint</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈprɪnt] v. 再版，重印</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + print (印刷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本书被"再次印刷(re-print)"，
    <tspan x="50" dy="25">封面上的字迹因为多次印刷而变得模糊，</tspan>
    <tspan x="50" dy="25">但内容依然清晰可见。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The publisher decided to reprint the best-selling novel.
  </text>
  <text x="50" y="310" class="content">
    出版商决定重印这本畅销小说。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book cover -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Faded text on cover -->
    <text x="50" y="100" class="content" style="fill: #7F8C8D; font-size: 36px;">
      <tspan>Best-Selling</tspan>
      <tspan x="50" dy="40">Novel</tspan>
    </text>
    <!-- Printer -->
    <rect x="200" y="120" width="100" height="60" class="image" />
    <!-- Paper coming out of printer -->
    <rect x="220" y="110" width="60" height="10" class="image" />
  </g>
</svg>