<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enjoyable</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdʒɔɪəbl] adj. 愉快的，有趣的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + joy (快乐) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在享受(en-joy)一个愉快的(able)
    <tspan x="50" dy="25">时刻，脸上洋溢着笑容，这就是enjoyable的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was enjoyable, and we all had a great time.
  </text>
  <text x="50" y="310" class="content">
    这部电影很有趣，我们都玩得很开心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="10" class="image" fill="#2C3E50" />
    <circle cx="120" cy="85" r="10" class="image" fill="#2C3E50" />
    <!-- Smile -->
    <path d="M 60 120 Q 100 140 140 120" class="image" fill="none" stroke="#2C3E50" stroke-width="5" />
    <!-- Sun -->
    <circle cx="200" cy="50" r="30" class="image" fill="#F39C12" />
    <line x1="200" y1="20" x2="200" y2="80" class="image" />
    <line x1="170" y1="50" x2="230" y2="50" class="image" />
    <line x1="185" y1="35" x2="215" y2="65" class="image" />
    <line x1="185" y1="65" x2="215" y2="35" class="image" />
  </g>
</svg>