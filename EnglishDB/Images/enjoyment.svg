<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enjoyment</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdʒɔɪmənt] n. 享受，乐趣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + joy (快乐) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人完全沉浸在快乐的氛围中，"进入(en-)"
    <tspan x="50" dy="25">快乐的(joy)状态，这就是享受(enjoyment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children found great enjoyment in the playground.
  </text>
  <text x="50" y="310" class="content">
    孩子们在操场上找到了极大的乐趣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Happy face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="80" cy="80" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <path d="M80 120 Q100 140 120 120" class="image" />

    <!-- Surrounding joy -->
    <circle cx="100" cy="100" r="70" class="image" stroke-dasharray="5,5" />
    <circle cx="100" cy="100" r="90" class="image" stroke-dasharray="5,5" />
    <circle cx="100" cy="100" r="110" class="image" stroke-dasharray="5,5" />
  </g>
</svg>