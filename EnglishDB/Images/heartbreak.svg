<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .heart { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heartbreak</text>
  <text x="50" y="120" class="subtitle">[ˈhɑːrtbreɪk] n. 心碎，极度悲伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heart (心) + break (破碎)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗心被"破碎(break)"，
    <tspan x="50" dy="25">这种情感上的极度悲伤就是心碎(heartbreak)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of her death caused a heartbreak.
  </text>
  <text x="50" y="310" class="content">
    她去世的消息让人心碎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken heart -->
    <path d="M50,50 C100,0 100,100 50,150 C0,100 0,0 50,50 Z" class="heart" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <!-- Tears -->
    <circle cx="30" cy="180" r="10" class="image" />
    <circle cx="70" cy="180" r="10" class="image" />
  </g>
</svg>