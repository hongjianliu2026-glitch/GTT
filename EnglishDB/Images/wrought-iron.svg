<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wrought-iron</text>
  <text x="50" y="120" class="subtitle">[rɔːt ˈaɪərn] n. 熟铁，锻铁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wrought (work的过去式，工作) + iron (铁)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个铁匠在锻造铁块，"工作(wrought)"
    <tspan x="50" dy="25">铁(iron)，经过反复锤炼，最终成为熟铁(wrought-iron)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fence was made of wrought-iron.
  </text>
  <text x="50" y="310" class="content">
    这个栅栏是用熟铁制成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Anvil -->
    <rect x="0" y="0" width="200" height="50" class="image" />
    <!-- Iron block -->
    <rect x="50" y="60" width="100" height="30" class="image" />
    <!-- Hammer -->
    <line x1="150" y1="60" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="80" class="image" />
    <line x1="150" y1="100" x2="170" y2="80" class="image" />
    <!-- Iron being worked -->
    <line x1="50" y1="90" x2="150" y2="90" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="110" x2="150" y2="110" class="image" />
  </g>
</svg>