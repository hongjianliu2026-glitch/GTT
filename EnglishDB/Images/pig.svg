<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pig</text>
  <text x="50" y="120" class="subtitle">[pɪɡ] n. 猪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "pigge"，古英语 "picga"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猪在泥潭里打滚，"picga"
    <tspan x="50" dy="25">这个词根形象地描绘了猪的特征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer raised a pig for the fair.
  </text>
  <text x="50" y="310" class="content">
    农夫养了一头猪参加集市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pig body -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <!-- Pig head -->
    <circle cx="180" cy="80" r="30" class="image" />
    <!-- Pig ears -->
    <ellipse cx="160" cy="60" rx="15" ry="25" class="image" />
    <ellipse cx="200" cy="60" rx="15" ry="25" class="image" />
    <!-- Pig eyes -->
    <circle cx="170" cy="75" r="5" class="image" />
    <circle cx="190" cy="75" r="5" class="image" />
    <!-- Pig nose -->
    <ellipse cx="180" cy="90" rx="10" ry="5" class="image" />
    <!-- Pig legs -->
    <line x1="60" y1="150" x2="60" y2="180" class="image" />
    <line x1="140" y1="150" x2="140" y2="180" class="image" />
    <line x1="80" y1="150" x2="80" y2="180" class="image" />
    <line x1="120" y1="150" x2="120" y2="180" class="image" />
  </g>
</svg>