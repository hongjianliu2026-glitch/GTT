<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mainland</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪnlænd] n. 大陆，本土</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> main (主要的) + land (土地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的岛屿，"主要的土地(main-land)"
    <tspan x="50" dy="25">是连接所有其他小岛屿的核心，这就是大陆(mainland)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship sailed from the mainland to the island.
  </text>
  <text x="50" y="310" class="content">
    船从大陆航行到岛屿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mainland -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Islands -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="150" cy="120" r="20" class="image" />
    <circle cx="250" cy="80" r="25" class="image" />
    <!-- Mainland label -->
    <text x="150" y="180" class="content" text-anchor="middle">Mainland</text>
  </g>
</svg>