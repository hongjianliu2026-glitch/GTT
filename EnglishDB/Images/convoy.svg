<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">convoy</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnvoɪ] n. 护航，护送；v. 护送</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + voy (路)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在前面开路，后面跟着一群车，"一起上路(con-voy)"，
    <tspan x="50" dy="25">形成了一个护送队(convoy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The military provided a convoy to protect the supply trucks.
  </text>
  <text x="50" y="310" class="content">
    军队提供了一个护送队来保护补给卡车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <!-- Leading car -->
    <rect x="50" y="70" width="60" height="40" class="image" />
    <rect x="60" y="60" width="40" height="10" class="image" />
    <!-- Following cars -->
    <rect x="150" y="70" width="60" height="40" class="image" />
    <rect x="160" y="60" width="40" height="10" class="image" />
    <rect x="250" y="70" width="60" height="40" class="image" />
    <rect x="260" y="60" width="40" height="10" class="image" />
  </g>
</svg>