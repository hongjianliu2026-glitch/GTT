<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">affirmative</text>
  <text x="50" y="120" class="subtitle">[əˈfɜːrmətɪv] adj. 肯定的，积极的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> af- (加强) + firm (坚定) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在法庭上，"坚定地(firm)"
    <tspan x="50" dy="25">说出"是的(affirm)"，这种坚定的肯定就是affirmative。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The judge asked if the witness agreed, and she replied with an affirmative nod.
  </text>
  <text x="50" y="310" class="content">
    法官问证人是否同意，她点头表示肯定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Witness -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="230" y2="150" class="image" />
    <line x1="250" y1="120" x2="270" y2="150" class="image" />
    <line x1="250" y1="90" x2="220" y2="80" class="image" />
    <!-- Nodding head -->
    <path d="M250,50 Q270,30 250,10" class="image" />
  </g>
</svg>