<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ancestor</text>
  <text x="50" y="120" class="subtitle">[ˈænsɛstər] n. 祖先，祖宗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (向上) + cest (走) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家族树，"向上走(an-cest)"
    <tspan x="50" dy="25">到最顶端，那里站着你的祖先(ancestor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My ancestors came from China.
  </text>
  <text x="50" y="310" class="content">
    我的祖先来自中国。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <!-- Ancestor at the top -->
    <circle cx="100" cy="20" r="15" class="image" />
    <text x="90" y="30" class="content">祖先</text>
  </g>
</svg>