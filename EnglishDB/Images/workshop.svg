<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">workshop</text>
  <text x="50" y="120" class="subtitle">[ˈwɜːrkʃɒp] n. 车间，工场；研讨会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> work (工作) + shop (商店)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工人在车间里，"工作(work)"
    <tspan x="50" dy="25">和"商店(shop)"的结合，就构成了一个workshop。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He attended a workshop on digital marketing last weekend.
  </text>
  <text x="50" y="310" class="content">
    他上周末参加了一个关于数字营销的研讨会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Workshop -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Worker -->
    <circle cx="70" cy="100" r="15" class="image" />
    <line x1="70" y1="115" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <line x1="70" y1="130" x2="100" y2="120" class="image" />
    <!-- Tools -->
    <line x1="120" y1="100" x2="150" y2="100" class="image" />
    <line x1="120" y1="120" x2="150" y2="120" class="image" />
    <line x1="120" y1="140" x2="150" y2="140" class="image" />
  </g>
</svg>