<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dame</text>
  <text x="50" y="120" class="subtitle">[deɪm] n. 夫人，女士</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dam (源自法语，意为“夫人”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位优雅的女士，头戴一顶华丽的帽子，
    <tspan x="50" dy="25">手持一把精致的阳伞，走在巴黎的街头。</tspan>
    <tspan x="50" dy="25">她就是那位令人尊敬的“夫人(dame)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dame in the red dress was the center of attention.
  </text>
  <text x="50" y="310" class="content">
    那位穿红裙的女士是众人瞩目的焦点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Lady -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <!-- Hat -->
    <path d="M20,20 Q50,10 80,20" class="image" />
    <!-- Umbrella -->
    <path d="M50,150 Q50,100 100,100" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
  </g>
</svg>