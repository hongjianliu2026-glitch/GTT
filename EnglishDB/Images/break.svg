<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">break</text>
  <text x="50" y="120" class="subtitle">[breɪk] v. 打破，中断；n. 休息</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brev (短) + ak (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"打破(break)"一块坚硬的石头，
    <tspan x="50" dy="25">瞬间石头碎裂成无数小块，这个动作就是"break"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He decided to take a break from work.
  </text>
  <text x="50" y="310" class="content">
    他决定从工作中休息一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <line x1="0" y1="0" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="70" y2="30" class="image" />
    <line x1="70" y1="30" x2="90" y2="50" class="image" />
    <line x1="90" y1="50" x2="140" y2="0" class="image" />
    <!-- Stone -->
    <rect x="150" y="0" width="100" height="100" class="image" />
    <!-- Cracks -->
    <line x1="160" y1="20" x2="240" y2="20" class="image" />
    <line x1="160" y1="40" x2="240" y2="40" class="image" />
    <line x1="160" y1="60" x2="240" y2="60" class="image" />
    <line x1="160" y1="80" x2="240" y2="80" class="image" />
  </g>
</svg>