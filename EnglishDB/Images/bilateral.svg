<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bilateral</text>
  <text x="50" y="120" class="subtitle">[ˌbaɪˈlætərəl] adj. 双边的，双方的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bi- (两个) + lateral (侧面的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面站立，"两侧(bi-lateral)"
    <tspan x="50" dy="25">同时伸出双手，形成一个双边(bilateral)的握手。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The agreement was reached through bilateral talks.
  </text>
  <text x="50" y="310" class="content">
    该协议是通过双边会谈达成的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="200" class="image" />
    <line x1="100" y1="160" x2="120" y2="200" class="image" />
    <line x1="100" y1="140" x2="140" y2="130" class="image" />

    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="160" class="image" />
    <line x1="300" y1="160" x2="280" y2="200" class="image" />
    <line x1="300" y1="160" x2="320" y2="200" class="image" />
    <line x1="300" y1="140" x2="260" y2="130" class="image" />

    <!-- Hands shaking -->
    <line x1="120" y1="130" x2="280" y2="130" class="image" />
  </g>
</svg>