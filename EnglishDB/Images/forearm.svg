<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forearm</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrɑːm] n. 前臂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fore- (前面) + arm (手臂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在你面前，伸出他的"前面(fore)"
    <tspan x="50" dy="25">手臂(arm)，展示他的前臂(forearm)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He flexed his forearm to show his muscle.
  </text>
  <text x="50" y="310" class="content">
    他弯曲前臂展示他的肌肉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forearm -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="50" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="150" class="image" />
    <!-- Hand -->
    <circle cx="100" cy="200" r="20" class="image" />
    <line x1="100" y1="220" x2="120" y2="240" class="image" />
    <line x1="100" y1="220" x2="80" y2="240" class="image" />
    <line x1="100" y1="220" x2="110" y2="260" class="image" />
    <line x1="100" y1="220" x2="90" y2="260" class="image" />
  </g>
</svg>