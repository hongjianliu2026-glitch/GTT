<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">meteorological</text>
  <text x="50" y="120" class="subtitle">[ˌmiːtiərəˈlɒdʒɪkl] adj. 气象的，气象学的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> meteor (天空) + -o- (连接词) + log (学) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个气象学家站在山顶，"观察天空(meteor)"
    <tspan x="50" dy="25">中的云层变化，研究气象学(meteorological)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meteorological report predicted heavy rain tomorrow.
  </text>
  <text x="50" y="310" class="content">
    气象报告预测明天会有大雨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0 200 L100 0 L200 200 Z" class="image" />
    <!-- Meteorologist -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="80" y2="220" class="image" />
    <line x1="100" y1="190" x2="120" y2="220" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />
    <!-- Clouds -->
    <ellipse cx="50" cy="50" rx="40" ry="20" class="image" />
    <ellipse cx="150" cy="50" rx="40" ry="20" class="image" />
    <ellipse cx="100" cy="30" rx="40" ry="20" class="image" />
  </g>
</svg>