<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misdemeanor</text>
  <text x="50" y="120" class="subtitle">[ˌmɪsdɪˈmiːnər] n. 轻罪，不端行为</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + de- (向下) + mean (行为) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为"错误的行为(mis-de-mean-or)"
    <tspan x="50" dy="25">被法官判罚，但这个行为并不严重，只是轻罪(misdemeanor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was charged with a misdemeanor for shoplifting.
  </text>
  <text x="50" y="310" class="content">
    他因盗窃商店而被指控犯有轻罪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <rect x="0" y="180" width="40" height="20" class="image" />
    <line x1="20" y1="200" x2="20" y2="220" class="image" />
    <line x1="20" y1="220" x2="0" y2="240" class="image" />
    <line x1="20" y1="220" x2="40" y2="240" class="image" />
    <!-- Defendant -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <rect x="80" y="180" width="40" height="20" class="image" />
    <line x1="100" y1="200" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="240" class="image" />
    <line x1="100" y1="220" x2="120" y2="240" class="image" />
    <!-- Courtroom -->
    <rect x="0" y="250" width="200" height="50" class="image" />
    <line x1="100" y1="250" x2="100" y2="300" class="image" />
    <line x1="0" y1="275" x2="200" y2="275" class="image" />
  </g>
</svg>