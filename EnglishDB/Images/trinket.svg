<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trinket</text>
  <text x="50" y="120" class="subtitle">[ˈtrɪŋkɪt] n. 小装饰品，小玩意儿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trink (小) + -et (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小女孩在她的房间里，"小(trink)"
    <tspan x="50" dy="25">装饰品(et)散落在她的梳妆台上，每一个都是她的小宝贝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She collected various trinkets from her travels.
  </text>
  <text x="50" y="310" class="content">
    她从旅行中收集了各种小装饰品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dresser -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trinkets -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="70" r="10" class="image" />
    <circle cx="110" cy="90" r="10" class="image" />
    <circle cx="140" cy="110" r="10" class="image" />
    <circle cx="170" cy="130" r="10" class="image" />
    <!-- Girl -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
  </g>
</svg>