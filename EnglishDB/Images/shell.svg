<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shell</text>
  <text x="50" y="120" class="subtitle">[ʃɛl] n. 壳，外壳；v. 剥壳</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shell (源自中古英语 shelle，意为“硬壳”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小螃蟹在沙滩上，"剥开(shell)"
    <tspan x="50" dy="25">它的硬壳，露出柔软的身体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She collected seashells on the beach.
  </text>
  <text x="50" y="310" class="content">
    她在海滩上收集贝壳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shell -->
    <path d="M50,50 Q100,20 150,50 T250,50 Q200,80 150,50 T50,50" class="image" />
    <!-- Crab -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <line x1="150" y1="160" x2="130" y2="180" class="image" />
    <line x1="150" y1="160" x2="170" y2="180" class="image" />
  </g>
</svg>