<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">splay</text>
  <text x="50" y="120" class="subtitle">[spleɪ] v. 展开，伸展</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> splay (来自中古英语 splaien，意为展开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在阳光下伸展四肢，"展开(splay)"
    <tspan x="50" dy="25">身体，享受温暖的阳光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat splayed its legs out on the floor.
  </text>
  <text x="50" y="310" class="content">
    猫在地板上伸展四肢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat body -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Cat legs -->
    <line x1="100" y1="130" x2="50" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="180" class="image" />
    <line x1="100" y1="130" x2="70" y2="200" class="image" />
    <line x1="100" y1="130" x2="130" y2="200" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="40" class="image" fill="#F1C40F" />
    <!-- Rays of the sun -->
    <line x1="250" y1="10" x2="250" y2="0" class="image" />
    <line x1="290" y1="50" x2="300" y2="50" class="image" />
    <line x1="250" y1="90" x2="250" y2="100" class="image" />
    <line x1="210" y1="50" x2="200" y2="50" class="image" />
  </g>
</svg>