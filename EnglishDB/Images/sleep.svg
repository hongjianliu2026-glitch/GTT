<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sleep</text>
  <text x="50" y="120" class="subtitle">[sliːp] n. 睡眠；v. 睡觉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slēp (古英语，意为“睡眠”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的人躺在床上，"闭上眼睛(slēp)"
    <tspan x="50" dy="25">进入梦乡，享受宁静的睡眠(sleep)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She needs a good night's sleep to feel refreshed.
  </text>
  <text x="50" y="310" class="content">
    她需要一个良好的夜间睡眠来感觉神清气爽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pillow -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Blanket -->
    <rect x="50" y="70" width="250" height="130" class="image" />
    <!-- Person -->
    <circle cx="175" cy="120" r="20" class="image" />
    <line x1="175" y1="140" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="200" class="image" />
    <line x1="175" y1="180" x2="195" y2="200" class="image" />
    <line x1="175" y1="160" x2="145" y2="150" class="image" />
    <line x1="175" y1="160" x2="205" y2="150" class="image" />
  </g>
</svg>