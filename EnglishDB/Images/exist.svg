<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">exist</text>
  <text x="50" y="120" class="subtitle">[ɪɡˈzɪst] v. 存在，生存</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + sist (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体从虚无中"站出来(ex-sist)"，
    <tspan x="50" dy="25">它就"存在(exist)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Do aliens really exist?
  </text>
  <text x="50" y="310" class="content">
    外星人真的存在吗？
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Circle representing nothingness -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Line representing emergence -->
    <line x1="150" y1="50" x2="150" y2="250" class="image" />
    <!-- Dot representing existence -->
    <circle cx="150" cy="250" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>