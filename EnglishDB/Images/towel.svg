<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">towel</text>
  <text x="50" y="120" class="subtitle">[ˈtaʊəl] n. 毛巾</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tow (拉) + el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的毛巾，"拉(tow)"着一个小人，
    <tspan x="50" dy="25">小人被毛巾包裹着，就像被一条大毛巾保护着。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She dried her hair with a towel after shower.
  </text>
  <text x="50" y="310" class="content">
    她洗完澡后用毛巾擦干头发。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Towel -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Person -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="190" x2="170" y2="180" class="image" />
    <line x1="200" y1="190" x2="230" y2="180" class="image" />
    <!-- Towel wrapping -->
    <line x1="180" y1="150" x2="180" y2="100" class="image" />
    <line x1="220" y1="150" x2="220" y2="100" class="image" />
  </g>
</svg>