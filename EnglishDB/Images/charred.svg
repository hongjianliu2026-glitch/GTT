<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #922B21; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .charred { fill: #6E2C00; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">charred</text>
  <text x="50" y="120" class="subtitle">[tʃɑːrd] adj. 烧焦的，烤焦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> char (烧焦) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块木头被火焰"烧焦(char)"，表面变得黑黑的，
    <tspan x="50" dy="25">这就是"烧焦的(charred)"木头。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The steak was overcooked and charred on the outside.
  </text>
  <text x="50" y="310" class="content">
    牛排煮过头了，外面都烤焦了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Charred wood -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="charred" />
    <!-- Flame -->
    <polygon points="300,20 350,100 300,180 250,100" class="image" />
    <polygon points="280,40 330,120 280,200 230,120" class="image" />
  </g>
</svg>