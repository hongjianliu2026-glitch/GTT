<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abundantly</text>
  <text x="50" y="120" class="subtitle">[əˈbʌndəntli] adv. 丰富地，大量地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (加强) + und (波浪) + -ant (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个波浪(und)涌来的场景，"加强(ab-)"
    <tspan x="50" dy="25">波浪的力量，使得水流"丰富地(abundantly)"涌来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden is abundantly filled with colorful flowers.
  </text>
  <text x="50" y="310" class="content">
    花园里开满了五彩缤纷的花朵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Waves -->
    <path d="M0 100 C100 50, 200 150, 300 100 S500 0, 600 100" class="image" />
    <path d="M0 120 C100 70, 200 170, 300 120 S500 20, 600 120" class="image" />
    <path d="M0 140 C100 90, 200 190, 300 140 S500 40, 600 140" class="image" />
    <!-- Abundant symbols -->
    <circle cx="100" cy="80" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
    <circle cx="250" cy="140" r="10" class="image" />
    <circle cx="300" cy="160" r="10" class="image" />
    <circle cx="350" cy="180" r="10" class="image" />
    <circle cx="400" cy="200" r="10" class="image" />
    <circle cx="450" cy="220" r="10" class="image" />
    <circle cx="500" cy="240" r="10" class="image" />
    <circle cx="550" cy="260" r="10" class="image" />
  </g>
</svg>