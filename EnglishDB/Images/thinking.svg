<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thinking</text>
  <text x="50" y="120" class="subtitle">[ˈθɪŋkɪŋ] n. 思考，想法；v. 思考（think的现在分词）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> think (思考) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大脑在思考，"思考(think)"
    <tspan x="50" dy="25">的过程中，大脑里充满了各种想法和思绪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is deep in thinking about the future.
  </text>
  <text x="50" y="310" class="content">
    她正在深入思考未来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Thought bubbles -->
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="100" r="25" class="image" />
    <circle cx="150" cy="150" r="30" class="image" />
    <!-- Thought lines -->
    <line x1="100" y1="100" x2="200" y2="50" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
  </g>
</svg>