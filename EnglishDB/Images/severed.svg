<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">severed</text>
  <text x="50" y="120" class="subtitle">[ˈsɛvərd] adj. 被切断的，分离的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + ver (转) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根绳子被"分开(se-)"并"转动(ver)"，
    <tspan x="50" dy="25">最终"被切断(severed)"成两段。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The communication line was severed during the storm.
  </text>
  <text x="50" y="310" class="content">
    通信线路在暴风雨中被切断了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rope -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <!-- Severed part -->
    <line x1="175" y1="30" x2="175" y2="70" class="image" />
    <line x1="175" y1="50" x2="300" y2="50" class="image" />
    <!-- Scissors -->
    <polygon points="320,40 350,60 320,80 330,60" class="image" />
    <polygon points="330,40 360,60 330,80 340,60" class="image" />
  </g>
</svg>