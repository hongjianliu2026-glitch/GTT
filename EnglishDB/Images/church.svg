<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">church</text>
  <text x="50" y="120" class="subtitle">[tʃɜːrtʃ] n. 教堂，教会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kirk (教堂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的教堂(kirk)，
    <tspan x="50" dy="25">它的尖顶直插云霄，象征着信仰的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They went to church every Sunday.
  </text>
  <text x="50" y="310" class="content">
    他们每个星期天都去教堂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Church building -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <polygon points="0,0 200,0 150,100 50,100" class="image" />
    <!-- Church windows -->
    <rect x="30" y="50" width="50" height="50" class="image" />
    <rect x="120" y="50" width="50" height="50" class="image" />
    <!-- Church door -->
    <rect x="80" y="200" width="40" height="100" class="image" />
  </g>
</svg>