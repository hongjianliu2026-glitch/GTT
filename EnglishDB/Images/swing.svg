<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swing</text>
  <text x="50" y="120" class="subtitle">[swɪŋ] v. 摇摆，摆动；n. 秋千</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swing (源自中古英语 swingen，意为“摇摆”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子在公园里，坐在秋千上，"摇摆(swing)"
    <tspan x="50" dy="25">得越来越高，笑声回荡在空中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were swinging on the swings in the park.
  </text>
  <text x="50" y="310" class="content">
    孩子们在公园的秋千上摇摆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Swing -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <!-- Child on swing -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="180" class="image" />
    <line x1="100" y1="160" x2="120" y2="180" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
  </g>
</svg>