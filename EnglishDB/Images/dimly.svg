<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dimly</text>
  <text x="50" y="120" class="subtitle">[ˈdɪmli] adv. 昏暗地，模糊地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dim (暗淡) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在一个昏暗的房间里，只有一盏微弱的灯光，"暗淡地(dimly)"
    <tspan x="50" dy="25">照亮着周围，一切都显得模糊不清。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She could only see the path dimly in the fog.
  </text>
  <text x="50" y="310" class="content">
    她在雾中只能模糊地看到小路。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Light source -->
    <circle cx="175" cy="100" r="30" fill="#FFD700" />
    <!-- Light rays -->
    <line x1="175" y1="100" x2="0" y2="200" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="100" x2="350" y2="200" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="100" x2="0" y2="0" class="image" stroke-dasharray="5,5" />
    <line x1="175" y1="100" x2="350" y2="0" class="image" stroke-dasharray="5,5" />
  </g>
</svg>