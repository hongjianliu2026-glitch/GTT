<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .radiation { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">radioactive</text>
  <text x="50" y="120" class="subtitle">[ˌreɪdiəʊˈæktɪv] adj. 放射性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> radio- (射线) + active (活动的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满放射性物质的实验室，"射线(radio)"
    <tspan x="50" dy="25">不断释放能量，这些能量非常活跃(active)，</tspan>
    <tspan x="50" dy="25">形成了放射性(radioactive)的环境。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The area was contaminated with radioactive material.
  </text>
  <text x="50" y="310" class="content">
    该区域被放射性物质污染了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lab table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Radioactive material -->
    <circle cx="100" cy="100" r="30" class="radiation" />
    <circle cx="200" cy="100" r="30" class="radiation" />
    <circle cx="300" cy="100" r="30" class="radiation" />
    <!-- Radiation lines -->
    <line x1="100" y1="100" x2="0" y2="0" class="image" />
    <line x1="100" y1="100" x2="200" y2="0" class="image" />
    <line x1="100" y1="100" x2="350" y2="0" class="image" />
    <line x1="200" y1="100" x2="0" y2="200" class="image" />
    <line x1="200" y1="100" x2="350" y2="200" class="image" />
    <line x1="300" y1="100" x2="0" y2="0" class="image" />
    <line x1="300" y1="100" x2="200" y2="0" class="image" />
    <line x1="300" y1="100" x2="350" y2="0" class="image" />
  </g>
</svg>