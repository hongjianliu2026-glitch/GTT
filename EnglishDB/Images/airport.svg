<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">airport</text>
  <text x="50" y="120" class="subtitle">[ˈɛrˌpɔrt] n. 机场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> air (空气) + port (港口)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"空气港口(air-port)"，
    <tspan x="50" dy="25">飞机在这里起飞和降落，就像船只在港口进出一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We arrived at the airport two hours early.
  </text>
  <text x="50" y="310" class="content">
    我们提前两小时到达了机场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Runway -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Airplane -->
    <polygon points="50,50 150,50 170,70 170,90 150,110 50,110 30,90 30,70" class="image" />
    <!-- Terminal -->
    <rect x="200" y="20" width="100" height="60" class="image" />
    <!-- Airplane wings -->
    <line x1="50" y1="70" x2="30" y2="70" class="image" />
    <line x1="150" y1="70" x2="170" y2="70" class="image" />
  </g>
</svg>