<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">division</text>
  <text x="50" y="120" class="subtitle">[dɪˈvɪʒən] n. 分割，部门，除法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + vis (看) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕被"分开(di-vis)"成几块，
    <tspan x="50" dy="25">每一块代表一个部门(division)，这就是分割的概念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is divided into several divisions.
  </text>
  <text x="50" y="310" class="content">
    公司被分成了几个部门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Slices -->
    <line x1="100" y1="100" x2="20" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="180" class="image" />
    <line x1="100" y1="100" x2="20" y2="180" class="image" />
    <!-- Division labels -->
    <text x="20" y="10" class="content">A</text>
    <text x="180" y="10" class="content">B</text>
    <text x="180" y="190" class="content">C</text>
    <text x="20" y="190" class="content">D</text>
  </g>
</svg>