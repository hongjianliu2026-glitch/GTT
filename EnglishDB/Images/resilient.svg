<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resilient</text>
  <text x="50" y="120" class="subtitle">[rɪˈzɪliənt] adj. 有弹性的，能迅速恢复的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + sili (跳跃) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个弹簧，被压下去后，"再次跳跃(re-sili)"
    <tspan x="50" dy="25">回到原来的位置，这就是有弹性的(resilient)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is resilient and quickly bounced back from the setback.
  </text>
  <text x="50" y="310" class="content">
    她很有弹性，很快就从挫折中恢复过来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spring -->
    <path d="M50 50 Q75 100 100 50 Q125 0 150 50 Q175 100 200 50" class="image" />
    <!-- Compression -->
    <line x1="50" y1="50" x2="200" y2="50" class="image" />
    <line x1="50" y1="70" x2="200" y2="70" class="image" />
    <line x1="50" y1="90" x2="200" y2="90" class="image" />
    <!-- Rebound -->
    <line x1="50" y1="110" x2="200" y2="110" class="image" />
    <line x1="50" y1="130" x2="200" y2="130" class="image" />
    <line x1="50" y1="150" x2="200" y2="150" class="image" />
  </g>
</svg>