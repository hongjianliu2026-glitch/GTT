<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abnormally</text>
  <text x="50" y="120" class="subtitle">[æbˈnɔːrməli] adv. 异常地，不正常地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + norm (正常) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫在树上，"离开(ab-)"
    <tspan x="50" dy="25">正常的地面，爬到"不正常(norm-al)"的高度，</tspan>
    <tspan x="50" dy="25">这就是"异常地(abnormally)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The weather has been abnormally hot this summer.
  </text>
  <text x="50" y="310" class="content">
    今年夏天的天气异常炎热。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <!-- Branches -->
    <line x1="50" y1="50" x2="20" y2="100" class="image" />
    <line x1="50" y1="50" x2="80" y2="100" class="image" />
    <line x1="50" y1="100" x2="20" y2="150" class="image" />
    <line x1="50" y1="100" x2="80" y2="150" class="image" />
    <!-- Cat -->
    <circle cx="50" cy="120" r="15" class="image" />
    <line x1="50" y1="135" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="35" y2="180" class="image" />
    <line x1="50" y1="160" x2="65" y2="180" class="image" />
    <line x1="50" y1="145" x2="70" y2="135" class="image" />
  </g>
</svg>