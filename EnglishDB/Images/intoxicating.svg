<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intoxicating</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɒksɪkeɪtɪŋ] adj. 令人陶醉的，使人兴奋的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + toxic (毒) + -ate (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人喝了一杯"有毒的(toxic)"饮料，
    <tspan x="50" dy="25">结果整个人都"进入(in)"了一种"陶醉(intoxicating)"的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The music was so intoxicating that everyone started dancing.
  </text>
  <text x="50" y="310" class="content">
    音乐如此令人陶醉，以至于每个人都开始跳舞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass of drink -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <!-- Bubbles -->
    <circle cx="20" cy="20" r="5" class="image" />
    <circle cx="40" cy="30" r="5" class="image" />
    <circle cx="60" cy="40" r="5" class="image" />
    <circle cx="80" cy="50" r="5" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Stars -->
    <circle cx="200" cy="50" r="5" class="image" />
    <circle cx="220" cy="60" r="5" class="image" />
    <circle cx="240" cy="70" r="5" class="image" />
  </g>
</svg>