<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">doomed</text>
  <text x="50" y="120" class="subtitle">[duːmd] adj. 注定失败的，命定的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> doom (命运) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，背后是"命运(doom)"的阴影，
    <tspan x="50" dy="25">他知道自己"注定(doomed)"无法逃脱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was doomed from the start due to lack of funding.
  </text>
  <text x="50" y="310" class="content">
    由于缺乏资金，这个项目从一开始就注定失败。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cliff -->
    <rect x="0" y="100" width="350" height="150" class="image" />
    <!-- Person -->
    <circle cx="175" cy="80" r="20" class="image" />
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
    <line x1="175" y1="120" x2="150" y2="140" class="image" />
    <line x1="175" y1="120" x2="200" y2="140" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <!-- Shadow -->
    <path d="M175,180 Q175,250 100,250" class="image" />
    <path d="M175,180 Q175,250 250,250" class="image" />
  </g>
</svg>