<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pose</text>
  <text x="50" y="120" class="subtitle">[poʊz] v. 摆姿势；n. 姿势，姿态</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pos (放置) + e
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个模特在舞台上，"放置(pos)"
    <tspan x="50" dy="25">自己的身体，摆出一个优雅的姿势(pose)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She posed for a photo in front of the Eiffel Tower.
  </text>
  <text x="50" y="310" class="content">
    她在埃菲尔铁塔前摆姿势拍照。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Model -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="140" x2="130" y2="130" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
  </g>
</svg>