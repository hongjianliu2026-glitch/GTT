<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">term</text>
  <text x="50" y="120" class="subtitle">[tɜːrm] n. 学期，术语，期限</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> termin (界限)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学期(term)就像一个时间界限(termin)，
    <tspan x="50" dy="25">学生们在这个界限内学习，时间一到，界限就结束了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The final exam is at the end of the term.
  </text>
  <text x="50" y="310" class="content">
    期末考试在学期末进行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Boundary -->
    <rect x="50" y="200" width="100" height="50" class="image" />
    <text x="75" y="230" class="content">Term</text>
  </g>
</svg>