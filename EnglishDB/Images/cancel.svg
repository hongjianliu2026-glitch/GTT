<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cancel</text>
  <text x="50" y="120" class="subtitle">[ˈkænsl] v. 取消，废除</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> can (能够) + cel (下降)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个计划被"能够(can)""下降(cel)"，
    <tspan x="50" dy="25">就像一个气球被戳破，计划瞬间消失，这就是取消(cancel)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The flight was canceled due to bad weather.
  </text>
  <text x="50" y="310" class="content">
    由于恶劣天气，航班被取消了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- String -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Pin -->
    <rect x="80" y="250" width="40" height="20" class="image" />
    <!-- Hole in balloon -->
    <circle cx="100" cy="100" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>