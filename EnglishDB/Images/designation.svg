<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">designation</text>
  <text x="50" y="120" class="subtitle">[ˌdɛzɪɡˈneɪʃən] n. 指定，任命，名称</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + sign (标记) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个领导在会议上，"向下标记(de-sign)"
    <tspan x="50" dy="25">某人的名字，宣布他的新职位，这就是指定(designation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The designation of the new CEO was announced today.
  </text>
  <text x="50" y="310" class="content">
    新任首席执行官的任命今天宣布了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Leader -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Name tag -->
    <rect x="100" y="50" width="100" height="50" class="image" />
    <text x="110" y="80" class="content">New CEO</text>
    <!-- Arrow pointing down -->
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <polygon points="145,150 155,150 150,160" class="image" />
  </g>
</svg>