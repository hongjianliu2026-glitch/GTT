<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">redraw</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈdrɔː] v. 重画，重新绘制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + draw (画)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个画家不满意自己的画作，"再次(re-)"
    <tspan x="50" dy="25">拿起画笔"画(draw)"，重新绘制(redraw)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist decided to redraw the landscape to make it more vivid.
  </text>
  <text x="50" y="310" class="content">
    艺术家决定重新绘制风景画，使其更加生动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Original drawing -->
    <rect x="0" y="0" width="150" height="150" class="image" />
    <line x1="20" y1="20" x2="130" y2="130" class="image" />
    <line x1="20" y1="130" x2="130" y2="20" class="image" />
    <!-- Redrawing -->
    <rect x="200" y="0" width="150" height="150" class="image" />
    <line x1="220" y1="20" x2="330" y2="130" class="image" />
    <line x1="220" y1="130" x2="330" y2="20" class="image" />
    <circle cx="275" cy="75" r="20" class="image" />
    <!-- Artist -->
    <circle cx="100" cy="200" r="15" class="image" />
    <line x1="100" y1="215" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="280" class="image" />
    <line x1="100" y1="250" x2="120" y2="280" class="image" />
    <line x1="100" y1="230" x2="150" y2="220" class="image" />
  </g>
</svg>