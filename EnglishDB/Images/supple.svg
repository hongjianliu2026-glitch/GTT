<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">supple</text>
  <text x="50" y="120" class="subtitle">[ˈsʌpl] adj. 柔软的，灵活的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sup- (下面) + ple (充满)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个柔软的瑜伽垫，"下面充满(sup-ple)"
    <tspan x="50" dy="25">弹性，让人可以轻松地进行各种瑜伽动作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a supple body and can do many yoga poses.
  </text>
  <text x="50" y="310" class="content">
    她身体柔软，可以做很多瑜伽动作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Yoga mat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person doing yoga -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
  </g>
</svg>