<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">encompass</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkʌmpəs] v. 包含，包围</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + compass (范围)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的圆圈，"进入(en-)"
    <tspan x="50" dy="25">并"包围(compass)"了所有的东西，</tspan>
    <tspan x="50" dy="25">这就是encompass的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy encompasses all aspects of the company's operations.
  </text>
  <text x="50" y="310" class="content">
    新政策涵盖了公司运营的所有方面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle -->
    <circle cx="175" cy="100" r="100" class="image" />
    <!-- Objects inside the circle -->
    <rect x="100" y="50" width="50" height="50" class="image" />
    <rect x="200" y="50" width="50" height="50" class="image" />
    <rect x="150" y="120" width="50" height="50" class="image" />
  </g>
</svg>