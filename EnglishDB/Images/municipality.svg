<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">municipality</text>
  <text x="50" y="120" class="subtitle">[mjuːˌnɪsɪˈpæləti] n. 自治市，市政府</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mun- (公共) + -cip- (头) + -ality (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市的"头(cip)"，即市政府，负责管理"公共(mun)"事务，
    <tspan x="50" dy="25">这就是自治市(municipality)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The municipality is responsible for maintaining the city's parks.
  </text>
  <text x="50" y="310" class="content">
    市政府负责维护城市的公园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City hall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Mayor's head -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- City symbol -->
    <rect x="150" y="140" width="50" height="20" class="image" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <line x1="150" y1="160" x2="200" y2="160" class="image" />
    <line x1="150" y1="170" x2="200" y2="170" class="image" />
  </g>
</svg>