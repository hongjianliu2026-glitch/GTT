<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gratify</text>
  <text x="50" y="120" class="subtitle">[ˈɡrætɪfaɪ] v. 使满足，使高兴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grat (高兴) + -ify (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人收到一份礼物，脸上露出"高兴(grat)"的表情，
    <tspan x="50" dy="25">这份礼物"使(ify)"他感到非常满足和快乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The surprise party really gratified her.
  </text>
  <text x="50" y="310" class="content">
    这个惊喜派对真的让她很高兴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gift box -->
    <rect x="0" y="0" width="100" height="70" class="image" />
    <line x1="20" y1="10" x2="80" y2="10" class="image" />
    <line x1="20" y1="30" x2="80" y2="30" class="image" />
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <!-- Happy face -->
    <circle cx="150" cy="35" r="30" class="image" />
    <circle cx="135" cy="25" r="5" class="image" />
    <circle cx="165" cy="25" r="5" class="image" />
    <path d="M135 45 Q150 55 165 45" class="image" />
  </g>
</svg>