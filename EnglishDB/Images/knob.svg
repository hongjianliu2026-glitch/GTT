<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knob</text>
  <text x="50" y="120" class="subtitle">[nɒb] n. 旋钮，把手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kn- (手) + -ob (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手握着一个微小的旋钮，"手(kn-)"
    <tspan x="50" dy="25">握着"小(ob)"东西，这个东西就是旋钮(knob)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Turn the knob to adjust the volume.
  </text>
  <text x="50" y="310" class="content">
    转动旋钮来调节音量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large hand -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="200" x2="180" y2="180" class="image" />

    <!-- Small knob -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="180" class="image" />
  </g>
</svg>