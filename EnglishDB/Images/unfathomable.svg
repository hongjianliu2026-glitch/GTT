<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unfathomable</text>
  <text x="50" y="120" class="subtitle">[ʌnˈfæðəməbl] adj. 深不可测的，难以理解的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + fathom (测量) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个深海潜水员试图测量一个"无法测量(un-fathom-able)"
    <tspan x="50" dy="25">的深渊，结果发现它深不可测，难以理解。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mysteries of the universe are unfathomable to the human mind.
  </text>
  <text x="50" y="310" class="content">
    宇宙的奥秘对人类思维来说是深不可测的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Deep sea -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Diver -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="35" y2="210" class="image" />
    <line x1="50" y1="190" x2="65" y2="210" class="image" />
    <line x1="50" y1="175" x2="70" y2="165" class="image" />
    <!-- Abyss -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="150" y1="0" x2="150" y2="200" class="image" />
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <line x1="250" y1="0" x2="250" y2="200" class="image" />
    <line x1="300" y1="0" x2="300" y2="200" class="image" />
    <!-- Question mark -->
    <text x="175" y="100" font-size="60" fill="#E74C3C">?</text>
  </g>
</svg>