<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forty-one</text>
  <text x="50" y="120" class="subtitle">[ˈfɔrti wʌn] n. 四十一</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> forty (四十) + one (一)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“40”旁边站着一个小小的“1”，
    <tspan x="50" dy="25">它们手拉手，组成了“四十一(forty-one)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He turned forty-one last week.
  </text>
  <text x="50" y="310" class="content">
    他上周刚满四十一岁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number 40 -->
    <text x="0" y="0" font-size="150" class="image">40</text>
    <!-- Small number 1 -->
    <text x="200" y="100" font-size="80" class="image">1</text>
    <!-- Hand holding -->
    <line x1="150" y1="150" x2="200" y2="100" class="image" />
  </g>
</svg>