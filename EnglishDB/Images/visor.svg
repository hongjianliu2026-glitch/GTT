<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">visor</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪzər] n. 面罩，遮阳帽檐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vis (看) + -or (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着面罩的骑士，面罩(visor)保护他的脸，
    <tspan x="50" dy="25">让他能清晰地看到(vis)前方的敌人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a visor to protect his eyes from the sun.
  </text>
  <text x="50" y="310" class="content">
    他戴了一个面罩来保护眼睛免受阳光照射。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Helmet -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Visor -->
    <rect x="20" y="20" width="160" height="40" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Nose -->
    <line x1="100" y1="100" x2="100" y2="120" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="140" x2="120" y2="140" class="image" />
  </g>
</svg>