<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slaughterhouse</text>
  <text x="50" y="120" class="subtitle">[ˈslɔːtərhaʊs] n. 屠宰场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slaughter (屠杀) + house (房子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的房子，里面充满了血腥的屠杀场景，
    <tspan x="50" dy="25">这就是屠宰场(slaughterhouse)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cattle were taken to the slaughterhouse early in the morning.
  </text>
  <text x="50" y="310" class="content">
    牛群一大早就被送到了屠宰场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Blood splatter -->
    <circle cx="50" cy="50" r="20" class="image" fill="#C0392B" />
    <circle cx="100" cy="80" r="15" class="image" fill="#C0392B" />
    <circle cx="150" cy="120" r="25" class="image" fill="#C0392B" />
    <circle cx="200" cy="160" r="18" class="image" fill="#C0392B" />
    <!-- Slaughter tools -->
    <line x1="250" y1="20" x2="280" y2="50" class="image" />
    <line x1="250" y1="50" x2="280" y2="20" class="image" />
    <line x1="300" y1="20" x2="300" y2="50" class="image" />
    <line x1="310" y1="20" x2="310" y2="50" class="image" />
  </g>
</svg>