<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lawsuit</text>
  <text x="50" y="120" class="subtitle">[ˈlɔːsuːt] n. 诉讼，官司</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> law (法律) + suit (诉讼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法庭场景，法官在"法律(law)"的指导下，
    <tspan x="50" dy="25">审理"诉讼(suit)"案件，这就是一场官司(lawsuit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is facing a lawsuit over patent infringement.
  </text>
  <text x="50" y="310" class="content">
    该公司因专利侵权面临诉讼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge's bench -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <!-- Judge -->
    <circle cx="100" cy="45" r="15" class="image" />
    <line x1="100" y1="60" x2="100" y2="100" class="image" />
    <line x1="100" y1="70" x2="80" y2="90" class="image" />
    <line x1="100" y1="70" x2="120" y2="90" class="image" />
    <!-- Lawyer -->
    <circle cx="200" cy="45" r="15" class="image" />
    <line x1="200" y1="60" x2="200" y2="100" class="image" />
    <line x1="200" y1="70" x2="180" y2="90" class="image" />
    <line x1="200" y1="70" x2="220" y2="90" class="image" />
    <!-- Gavel -->
    <rect x="100" y="10" width="20" height="10" class="image" />
    <line x1="110" y1="10" x2="110" y2="20" class="image" />
  </g>
</svg>