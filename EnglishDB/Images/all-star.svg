<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">all-star</text>
  <text x="50" y="120" class="subtitle">[ˈɔːlˌstɑːr] n. 全明星，明星球员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> all (全部) + star (星星)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个篮球场上，"全部(all)"
    <tspan x="50" dy="25">的"星星(star)"球员聚集在一起，</tspan>
    <tspan x="50" dy="25">他们都是全明星(all-star)球员。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The NBA All-Star Game features the best players from around the league.
  </text>
  <text x="50" y="310" class="content">
    NBA全明星赛汇集了联盟中最优秀的球员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basketball court -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Basketball hoop -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="200" class="image" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="70" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <!-- Basketball -->
    <circle cx="100" cy="150" r="20" class="image" />
  </g>
</svg>