<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vex</text>
  <text x="50" y="120" class="subtitle">[veks] v. 使烦恼，使恼怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ve- (扭曲) + x (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"扭曲(ve-)"了心情，
    <tspan x="50" dy="25">脸上露出痛苦的表情，这就是"使烦恼(vex)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His constant interruptions vex me.
  </text>
  <text x="50" y="310" class="content">
    他不断的打断让我很烦恼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <path d="M 70 120 Q 100 140 130 120" class="image" />
    <!-- Twisted expression -->
    <line x1="80" y1="90" x2="70" y2="100" class="image" />
    <line x1="120" y1="90" x2="130" y2="100" class="image" />
  </g>
</svg>