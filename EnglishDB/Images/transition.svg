<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transition</text>
  <text x="50" y="120" class="subtitle">[trænˈzɪʃən] n. 过渡，转变</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + it (走) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从一座桥上"跨越(trans-)"，从一端走到另一端，
    <tspan x="50" dy="25">这个过程就是从一个状态到另一个状态的"过渡(transition)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The transition from winter to spring is always beautiful.
  </text>
  <text x="50" y="310" class="content">
    从冬天到春天的过渡总是很美丽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bridge -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Person walking -->
    <circle cx="50" cy="100" r="10" class="image" />
    <line x1="50" y1="110" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="40" y2="180" class="image" />
    <line x1="50" y1="150" x2="60" y2="180" class="image" />
    <line x1="50" y1="130" x2="70" y2="120" class="image" />
    <!-- Arrow indicating transition -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,100 140,95 140,105" class="image" />
  </g>
</svg>