<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inequality</text>
  <text x="50" y="120" class="subtitle">[ˌɪnɪˈkwɒləti] n. 不平等，不均等</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + equ (平等) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，一边是满满的金币，另一边却只有几枚硬币，
    <tspan x="50" dy="25">这种"不平等(inequality)"让人一眼就能看出差距。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The inequality in wealth distribution is a major issue.
  </text>
  <text x="50" y="310" class="content">
    财富分配不均是一个主要问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="50" y1="20" x2="150" y2="20" class="image" />
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <!-- Coins on the left -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="130" cy="100" r="20" class="image" />
    <circle cx="160" cy="100" r="20" class="image" />
    <!-- Coins on the right -->
    <circle cx="300" cy="100" r="10" class="image" />
    <circle cx="330" cy="100" r="10" class="image" />
  </g>
</svg>