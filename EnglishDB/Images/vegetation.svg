<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vegetation</text>
  <text x="50" y="120" class="subtitle">[ˌvedʒɪˈteɪʃn] n. 植被，植物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> veget (生长) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片茂密的森林，"生长(veget)"
    <tspan x="50" dy="25">出无数的植物，这些植物就构成了植被(vegetation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tropical rainforest has dense vegetation.
  </text>
  <text x="50" y="310" class="content">
    热带雨林有茂密的植被。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Trees -->
    <line x1="50" y1="180" x2="50" y2="50" class="image" />
    <line x1="100" y1="180" x2="100" y2="70" class="image" />
    <line x1="150" y1="180" x2="150" y2="60" class="image" />
    <line x1="200" y1="180" x2="200" y2="80" class="image" />
    <line x1="250" y1="180" x2="250" y2="50" class="image" />
    <!-- Leaves -->
    <circle cx="50" cy="50" r="20" class="leaf" />
    <circle cx="100" cy="70" r="20" class="leaf" />
    <circle cx="150" cy="60" r="20" class="leaf" />
    <circle cx="200" cy="80" r="20" class="leaf" />
    <circle cx="250" cy="50" r="20" class="leaf" />
  </g>
</svg>