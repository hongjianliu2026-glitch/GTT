<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">desk</text>
  <text x="50" y="120" class="subtitle">[dɛsk] n. 书桌，办公桌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> des- (来自拉丁语 discus，意为“盘子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的“盘子(discus)”被放大，变成了一个现代的办公桌(desk)，
    <tspan x="50" dy="25">上面堆满了文件和电脑，象征着工作和学习的地方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spends hours working at her desk every day.
  </text>
  <text x="50" y="310" class="content">
    她每天在办公桌前工作数小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Desk -->
    <rect x="0" y="0" width="300" height="150" class="image" />
    <!-- Computer -->
    <rect x="50" y="20" width="200" height="100" class="image" />
    <!-- Papers -->
    <line x1="70" y1="130" x2="280" y2="130" class="image" />
    <line x1="70" y1="140" x2="250" y2="140" class="image" />
    <line x1="70" y1="150" x2="270" y2="150" class="image" />
    <line x1="70" y1="160" x2="240" y2="160" class="image" />
    <!-- Chair -->
    <circle cx="250" cy="180" r="20" class="image" />
    <line x1="250" y1="200" x2="250" y2="250" class="image" />
    <line x1="250" y1="250" x2="230" y2="280" class="image" />
    <line x1="250" y1="250" x2="270" y2="280" class="image" />
  </g>
</svg>