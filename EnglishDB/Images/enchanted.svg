<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enchanted</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtʃæntɪd] adj. 着迷的，被施了魔法的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (使) + chant (唱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被施了魔法的人，"使他唱(en-chant)"
    <tspan x="50" dy="25">出美妙的歌声，完全被迷住了(enchanted)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was enchanted by the beautiful melody.
  </text>
  <text x="50" y="310" class="content">
    她被那美妙的旋律迷住了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Enchanted person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Musical notes -->
    <path d="M100,80 C110,60 130,60 140,80 S160,100 170,80" class="image" />
    <path d="M120,100 C130,80 150,80 160,100 S180,120 190,100" class="image" />
    <path d="M140,120 C150,100 170,100 180,120 S200,140 210,120" class="image" />
  </g>
</svg>