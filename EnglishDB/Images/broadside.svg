<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">broadside</text>
  <text x="50" y="120" class="subtitle">[ˈbrɔːdsaɪd] n. 船的侧舷；v. 侧舷齐射</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> broad (宽的) + side (侧面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘巨大的战舰，"宽阔的侧面(broad-side)"
    <tspan x="50" dy="25">上装满了大炮，齐射时炮火连天，震撼无比。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ship fired a broadside at the enemy.
  </text>
  <text x="50" y="310" class="content">
    这艘船向敌人进行了侧舷齐射。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ship side -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cannons -->
    <rect x="70" y="50" width="30" height="30" class="image" />
    <rect x="120" y="50" width="30" height="30" class="image" />
    <rect x="170" y="50" width="30" height="30" class="image" />
    <rect x="220" y="50" width="30" height="30" class="image" />
    <rect x="270" y="50" width="30" height="30" class="image" />
    <!-- Fire -->
    <line x1="70" y1="80" x2="50" y2="100" class="image" />
    <line x1="120" y1="80" x2="100" y2="100" class="image" />
    <line x1="170" y1="80" x2="150" y2="100" class="image" />
    <line x1="220" y1="80" x2="200" y2="100" class="image" />
    <line x1="270" y1="80" x2="250" y2="100" class="image" />
  </g>
</svg>