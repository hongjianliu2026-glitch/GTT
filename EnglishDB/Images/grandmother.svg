<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grandmother</text>
  <text x="50" y="120" class="subtitle">[ˈɡrænˌmʌðər] n. 祖母，外祖母</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grand- (大的) + mother (母亲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的母亲形象，"大(grand)"
    <tspan x="50" dy="25">到足以成为祖母(grandmother)，</tspan>
    <tspan x="50" dy="25">她慈祥地抱着孙子，传递着爱与温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> My grandmother always bakes the best cookies.
  </text>
  <text x="50" y="310" class="content">
    我的祖母总是烤出最好吃的饼干。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grandmother -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="180" class="image" />
    <line x1="100" y1="180" x2="150" y2="180" class="image" />
    <!-- Grandchild -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="220" class="image" />
    <line x1="200" y1="200" x2="220" y2="220" class="image" />
    <line x1="200" y1="180" x2="180" y2="180" class="image" />
    <line x1="200" y1="180" x2="220" y2="180" class="image" />
    <!-- Heart -->
    <path d="M150,280 C140,260 160,260 150,280 Z" class="image" />
    <path d="M150,280 C160,260 140,260 150,280 Z" class="image" />
  </g>
</svg>