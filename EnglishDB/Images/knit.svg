<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">knit</text>
  <text x="50" y="120" class="subtitle">[nɪt] v. 编织，紧密结合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kni- (编织) + t (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老奶奶坐在摇椅上，手里拿着两根针，
    <tspan x="50" dy="25">"编织(kni-t)"着温暖的毛衣，每一针都紧密结合，</tspan>
    <tspan x="50" dy="25">就像家人之间的情感一样牢固。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to knit sweaters for her grandchildren.
  </text>
  <text x="50" y="310" class="content">
    她喜欢为她的孙子孙女编织毛衣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Grandma -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Needles -->
    <line x1="70" y1="50" x2="70" y2="150" class="image" />
    <line x1="90" y1="50" x2="90" y2="150" class="image" />
    <!-- Yarn -->
    <circle cx="80" cy="160" r="10" class="image" />
    <circle cx="100" cy="160" r="10" class="image" />
    <circle cx="120" cy="160" r="10" class="image" />
    <!-- Sweater -->
    <rect x="150" y="20" width="150" height="160" class="image" />
    <line x1="170" y1="50" x2="280" y2="50" class="image" />
    <line x1="170" y1="80" x2="250" y2="80" class="image" />
    <line x1="170" y1="110" x2="270" y2="110" class="image" />
    <line x1="170" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>