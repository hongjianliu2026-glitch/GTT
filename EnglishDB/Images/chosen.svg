<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chosen</text>
  <text x="50" y="120" class="subtitle">[ˈtʃoʊzn] adj. 被选中的，精选的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> choos (选择) + -en (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手从天而降，"选择(choos)"
    <tspan x="50" dy="25">并标记出最特别的那一个，这个被标记的</tspan>
    <tspan x="50" dy="25">就是被选中的(chosen)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was chosen to represent the team at the conference.
  </text>
  <text x="50" y="310" class="content">
    她被选中代表团队参加会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant hand -->
    <path d="M0 100 C50 50, 150 50, 200 100 S350 150, 400 100" class="image" />
    <!-- Selected item -->
    <circle cx="200" cy="100" r="20" class="image" fill="#E74C3C" />
    <!-- Arrow -->
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <polygon points="190,150 210,150 200,160" class="image" fill="#7F8C8D" />
  </g>
</svg>