<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
      .wool { fill: #FFFFFF; stroke: #8B4513; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">woolly</text>
  <text x="50" y="120" class="subtitle">[ˈwʊli] adj. 羊毛的，毛茸茸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wool (羊毛) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只羊，身上覆盖着厚厚的"羊毛(wool)"，
    <tspan x="50" dy="25">看起来毛茸茸的(woolly)，摸起来非常柔软。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a woolly sweater on a cold day.
  </text>
  <text x="50" y="310" class="content">
    她在寒冷的日子里穿了一件羊毛衫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sheep body -->
    <ellipse cx="150" cy="150" rx="100" ry="70" class="wool" />
    <!-- Sheep head -->
    <circle cx="100" cy="100" r="30" class="wool" />
    <!-- Sheep legs -->
    <rect x="120" y="200" width="20" height="50" class="wool" />
    <rect x="160" y="200" width="20" height="50" class="wool" />
    <rect x="200" y="200" width="20" height="50" class="wool" />
    <rect x="240" y="200" width="20" height="50" class="wool" />
    <!-- Wool texture -->
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <line x1="50" y1="170" x2="250" y2="170" class="image" />
    <line x1="50" y1="190" x2="250" y2="190" class="image" />
    <line x1="50" y1="210" x2="250" y2="210" class="image" />
  </g>
</svg>