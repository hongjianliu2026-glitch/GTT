<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .firework { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fireworks</text>
  <text x="50" y="120" class="subtitle">[ˈfaɪərwɜːrks] n. 烟火，烟花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fire (火) + work (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场盛大的烟花表演，"火(fire)"在夜空中"工作(work)"，
    <tspan x="50" dy="25">绽放出五彩斑斓的"烟火(fireworks)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fireworks display was spectacular.
  </text>
  <text x="50" y="310" class="content">
    烟火表演非常壮观。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Firework 1 -->
    <circle cx="50" cy="50" r="20" class="firework" />
    <line x1="50" y1="50" x2="30" y2="30" class="image" />
    <line x1="50" y1="50" x2="70" y2="30" class="image" />
    <line x1="50" y1="50" x2="50" y2="70" class="image" />
    <line x1="50" y1="50" x2="30" y2="70" class="image" />
    <line x1="50" y1="50" x2="70" y2="70" class="image" />

    <!-- Firework 2 -->
    <circle cx="150" cy="50" r="20" class="firework" />
    <line x1="150" y1="50" x2="130" y2="30" class="image" />
    <line x1="150" y1="50" x2="170" y2="30" class="image" />
    <line x1="150" y1="50" x2="150" y2="70" class="image" />
    <line x1="150" y1="50" x2="130" y2="70" class="image" />
    <line x1="150" y1="50" x2="170" y2="70" class="image" />

    <!-- Firework 3 -->
    <circle cx="250" cy="50" r="20" class="firework" />
    <line x1="250" y1="50" x2="230" y2="30" class="image" />
    <line x1="250" y1="50" x2="270" y2="30" class="image" />
    <line x1="250" y1="50" x2="250" y2="70" class="image" />
    <line x1="250" y1="50" x2="230" y2="70" class="image" />
    <line x1="250" y1="50" x2="270" y2="70" class="image" />
  </g>
</svg>