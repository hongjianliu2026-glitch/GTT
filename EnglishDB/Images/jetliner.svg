<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jetliner</text>
  <text x="50" y="120" class="subtitle">[ˈdʒetˌlaɪnər] n. 喷气式客机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jet (喷气) + liner (班机)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一架巨大的喷气式飞机(jet)，像一条长长的班机(liner)，
    <tspan x="50" dy="25">在天空中划出一道长长的轨迹，这就是喷气式客机(jetliner)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jetliner took off smoothly from the runway.
  </text>
  <text x="50" y="310" class="content">
    喷气式客机平稳地从跑道上起飞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jetliner -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <circle cx="20" cy="50" r="15" class="image" />
    <circle cx="330" cy="50" r="15" class="image" />
    <line x1="20" y1="50" x2="330" y2="50" class="image" />
    <line x1="20" y1="50" x2="20" y2="100" class="image" />
    <line x1="330" y1="50" x2="330" y2="100" class="image" />
    <line x1="20" y1="100" x2="330" y2="100" class="image" />
  </g>
</svg>