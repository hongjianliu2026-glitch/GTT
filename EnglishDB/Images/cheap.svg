<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheap</text>
  <text x="50" y="120" class="subtitle">[tʃiːp] adj. 便宜的，廉价的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chea (古英语，意为“便宜的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个市场摊位上，一个商人正在大声吆喝：“便宜(cheap)货，快来买！”
    <tspan x="50" dy="25">顾客们纷纷涌来，因为价格实在太诱人了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I bought this shirt because it was really cheap.
  </text>
  <text x="50" y="310" class="content">
    我买了这件衬衫，因为它真的很便宜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Market stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Merchant -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Products -->
    <rect x="100" y="50" width="50" height="50" class="image" />
    <rect x="160" y="50" width="50" height="50" class="image" />
    <rect x="220" y="50" width="50" height="50" class="image" />
    <!-- Customers -->
    <circle cx="120" cy="150" r="15" class="image" />
    <circle cx="180" cy="150" r="15" class="image" />
    <circle cx="240" cy="150" r="15" class="image" />
  </g>
</svg>