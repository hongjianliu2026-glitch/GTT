<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overseas</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈsiːz] adv. 在海外，在国外</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (在...之上) + seas (海洋)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在船上，"跨越(over)"
    <tspan x="50" dy="25">海洋(seas)，前往海外(overseas)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He moved overseas for a new job.
  </text>
  <text x="50" y="310" class="content">
    他为了新工作搬到了海外。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boat -->
    <polygon points="150,100 200,150 250,100" class="image" />
    <!-- Person -->
    <circle cx="200" cy="80" r="15" class="image" />
    <line x1="200" y1="95" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="105" x2="230" y2="95" class="image" />
  </g>
</svg>