<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sojourn</text>
  <text x="50" y="120" class="subtitle">[ˈsəʊdʒɜːrn] n. 逗留，旅居；v. 暂住，旅居</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> so- (跟随) + journ (日)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人跟随太阳的轨迹，"每日(journ)"
    <tspan x="50" dy="25">在不同的地方停留，这就是旅居(sojourn)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He decided to sojourn in the countryside for a few weeks.
  </text>
  <text x="50" y="310" class="content">
    他决定在乡下暂住几周。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F39C12" />
    <!-- Path -->
    <path d="M 50 150 Q 100 50 150 150" class="image" />
    <!-- Person -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="35" y2="230" class="image" />
    <line x1="50" y1="200" x2="65" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
  </g>
</svg>