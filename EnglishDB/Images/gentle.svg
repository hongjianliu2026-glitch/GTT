<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gentle</text>
  <text x="50" y="120" class="subtitle">[ˈdʒentl] adj. 温和的，温柔的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gen- (出生) + -tle (表示“小”或“轻”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新生儿，"出生时(gen-)"
    <tspan x="50" dy="25">轻轻地(tle)被抱在怀里，这种温柔(gentle)的呵护让人感到温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke in a gentle voice to comfort the child.
  </text>
  <text x="50" y="310" class="content">
    她用温柔的声音安慰孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baby -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Arms -->
    <line x1="70" y1="100" x2="40" y2="120" class="image" />
    <line x1="130" y1="100" x2="160" y2="120" class="image" />
    <!-- Head -->
    <circle cx="100" cy="70" r="15" class="image" />
    <!-- Body -->
    <line x1="100" y1="130" x2="100" y2="160" class="image" />
    <!-- Legs -->
    <line x1="80" y1="160" x2="60" y2="180" class="image" />
    <line x1="120" y1="160" x2="140" y2="180" class="image" />
    <!-- Caretaker -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="180" class="image" />
    <line x1="250" y1="160" x2="270" y2="180" class="image" />
    <line x1="250" y1="140" x2="220" y2="130" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Heart -->
    <path d="M200,150 C200,120 250,120 250,150 C250,180 200,180 200,150" class="image" />
  </g>
</svg>