<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pertaining</text>
  <text x="50" y="120" class="subtitle">[pərˈteɪnɪŋ] adj. 相关的，附属的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + tain (持有)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手，"完全持有(per-tain)"
    <tspan x="50" dy="25">并紧紧抓住一个物体，这个物体与手紧密相关(pertaining)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The documents pertaining to the project were all in order.
  </text>
  <text x="50" y="310" class="content">
    与项目相关的文件都井然有序。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant hand -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="170" class="image" />
    <line x1="50" y1="150" x2="80" y2="170" class="image" />
    <line x1="50" y1="150" x2="65" y2="180" class="image" />
    <!-- Object -->
    <rect x="100" y="150" width="50" height="50" class="image" />
    <!-- Connection -->
    <line x1="80" y1="180" x2="100" y2="175" class="image" />
  </g>
</svg>