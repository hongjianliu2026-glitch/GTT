<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">freshman</text>
  <text x="50" y="120" class="subtitle">[ˈfrɛʃmən] n. 新生，大学一年级学生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fresh (新鲜的) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"新鲜的人(fresh-man)"，刚刚进入大学，
    <tspan x="50" dy="25">对一切都感到新奇和兴奋，这就是大学一年级学生(freshman)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> As a freshman, he was eager to explore the campus.
  </text>
  <text x="50" y="310" class="content">
    作为一名新生，他渴望探索校园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Freshman -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Freshness symbol -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="130" y1="140" x2="170" y2="140" class="image" />
  </g>
</svg>