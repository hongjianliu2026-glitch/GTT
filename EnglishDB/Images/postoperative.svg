<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">postoperative</text>
  <text x="50" y="120" class="subtitle">[ˌpoʊstˈɒpərətɪv] adj. 手术后的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> post- (在...之后) + operative (手术的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个病人刚做完手术，躺在病床上，"手术后(post-operative)"
    <tspan x="50" dy="25">的状态，需要休息和恢复。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor advised a postoperative check-up after the surgery.
  </text>
  <text x="50" y="310" class="content">
    医生建议手术后进行复查。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hospital bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Patient -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <line x1="175" y1="150" x2="125" y2="140" class="image" />
    <line x1="175" y1="150" x2="225" y2="140" class="image" />
    <!-- Surgery symbol -->
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="50" y1="100" x2="100" y2="50" class="image" />
    <circle cx="75" cy="75" r="20" class="image" />
  </g>
</svg>