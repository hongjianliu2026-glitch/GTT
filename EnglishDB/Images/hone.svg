<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hone</text>
  <text x="50" y="120" class="subtitle">[hoʊn] v. 磨练，磨尖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hon (来自古英语 hōn，意为“磨”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠在磨刀石上"磨(hon)"
    <tspan x="50" dy="25">一把刀，使其更加锋利，这就是磨练(hone)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He honed his skills through years of practice.
  </text>
  <text x="50" y="310" class="content">
    他通过多年的练习磨练了自己的技能。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grinding stone -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Knife -->
    <line x1="50" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <!-- Hand -->
    <circle cx="150" cy="180" r="15" class="image" />
    <line x1="150" y1="195" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="130" y2="240" class="image" />
    <line x1="150" y1="220" x2="170" y2="240" class="image" />
  </g>
</svg>