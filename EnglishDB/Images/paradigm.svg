<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paradigm</text>
  <text x="50" y="120" class="subtitle">[ˈpærədaɪm] n. 范例，典范</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (旁边) + -digm (展示)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的展示板(digm)，旁边(para-)
    <tspan x="50" dy="25">展示着各种成功的范例(paradigm)，供人们学习和模仿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company adopted a new management paradigm.
  </text>
  <text x="50" y="310" class="content">
    公司采用了新的管理范例。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Display board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Examples -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <rect x="200" y="20" width="100" height="50" class="image" />
    <rect x="50" y="100" width="100" height="50" class="image" />
    <rect x="200" y="100" width="100" height="50" class="image" />
    <!-- Arrows -->
    <line x1="100" y1="75" x2="200" y2="75" class="image" />
    <line x1="100" y1="155" x2="200" y2="155" class="image" />
    <line x1="150" y1="50" x2="150" y2="130" class="image" />
    <!-- Text -->
    <text x="60" y="50" class="content">范例1</text>
    <text x="210" y="50" class="content">范例2</text>
    <text x="60" y="130" class="content">范例3</text>
    <text x="210" y="130" class="content">范例4</text>
  </g>
</svg>