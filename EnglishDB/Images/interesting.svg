<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interesting</text>
  <text x="50" y="120" class="subtitle">[ˈɪntrəstɪŋ] adj. 有趣的，引起兴趣的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + est (存在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满好奇心的人，"在事物之间(inter-)"
    <tspan x="50" dy="25">寻找存在的(est)趣味，这就是有趣的(interesting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The book was so interesting that I couldn't put it down.
  </text>
  <text x="50" y="310" class="content">
    这本书非常有趣，我无法放下它。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with magnifying glass -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Magnifying glass -->
    <circle cx="120" cy="100" r="30" class="image" />
    <line x1="120" y1="130" x2="180" y2="130" class="image" />
    <!-- Objects -->
    <rect x="200" y="80" width="40" height="40" class="image" />
    <rect x="250" y="80" width="40" height="40" class="image" />
    <rect x="300" y="80" width="40" height="40" class="image" />
  </g>
</svg>