<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">keynote</text>
  <text x="50" y="120" class="subtitle">[ˈkiːnoʊt] n. 基调演讲，主旨演讲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> key (关键) + note (笔记)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者在舞台上，手持"关键笔记(key-note)"，
    <tspan x="50" dy="25">他的演讲为整个会议定下了基调。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The CEO delivered the keynote speech at the conference.
  </text>
  <text x="50" y="310" class="content">
    首席执行官在会议上发表了主旨演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Microphone -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <!-- Notes -->
    <rect x="200" y="80" width="100" height="40" class="image" />
    <line x1="210" y1="90" x2="290" y2="90" class="image" />
    <line x1="210" y1="110" x2="290" y2="110" class="image" />
  </g>
</svg>