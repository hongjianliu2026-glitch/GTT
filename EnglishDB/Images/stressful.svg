<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stressful</text>
  <text x="50" y="120" class="subtitle">[ˈstresfəl] adj. 充满压力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stress (压力) + -ful (充满...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被巨大的压力球压在下面，"充满(ful)"
    <tspan x="50" dy="25">压力(stress)，无法动弹，这就是充满压力的(stressful)场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The final exams were a stressful time for all students.
  </text>
  <text x="50" y="310" class="content">
    期末考试对所有学生来说都是一段充满压力的时期。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="140" x2="60" y2="160" class="image" />
    <line x1="100" y1="140" x2="140" y2="160" class="image" />

    <!-- Stress ball -->
    <ellipse cx="250" cy="100" rx="50" ry="30" class="image" />
    <line x1="250" y1="100" x2="100" y2="100" class="image" />
  </g>
</svg>