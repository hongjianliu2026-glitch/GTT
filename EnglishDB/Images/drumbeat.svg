<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drumbeat</text>
  <text x="50" y="120" class="subtitle">[ˈdrʌmˌbit] n. 鼓声，连续的敲击声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drum (鼓) + beat (敲击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个鼓手在舞台上，"连续敲击(beat)"
    <tspan x="50" dy="25">鼓面，发出有节奏的鼓声(drumbeat)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The drumbeat echoed through the valley.
  </text>
  <text x="50" y="310" class="content">
    鼓声在山谷中回荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Drum -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Drumstick -->
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="80" class="image" />
    <!-- Beat marks -->
    <circle cx="100" cy="80" r="5" class="image" />
    <circle cx="100" cy="120" r="5" class="image" />
    <circle cx="100" cy="100" r="5" class="image" />
  </g>
</svg>