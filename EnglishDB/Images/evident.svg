<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">evident</text>
  <text x="50" y="120" class="subtitle">[ˈɛvɪdənt] adj. 明显的，显然的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + vid (看) + -ent (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"眼睛(vid)"从天而降，"看(vid)"
    <tspan x="50" dy="25">到了一切，一切都变得"明显(evident)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was evident that she was upset.
  </text>
  <text x="50" y="310" class="content">
    很明显她很沮丧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eye -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="25" class="image" fill="#2C3E50" />
    <!-- Light rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <!-- Objects -->
    <rect x="250" y="75" width="50" height="50" class="image" />
    <circle cx="350" cy="100" r="25" class="image" />
    <line x1="400" y1="75" x2="450" y2="125" class="image" />
    <line x1="400" y1="125" x2="450" y2="75" class="image" />
  </g>
</svg>