<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">standstill</text>
  <text x="50" y="120" class="subtitle">[ˈstændstɪl] n. 停滞，停顿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stand (站立) + still (静止)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车突然"站立(stand)"在原地，"静止(still)"不动，
    <tspan x="50" dy="25">整个交通都陷入了停滞(standstill)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project came to a standstill due to lack of funding.
  </text>
  <text x="50" y="310" class="content">
    由于缺乏资金，项目陷入了停滞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="150" y="50" width="100" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="170" cy="100" r="10" class="image" />
    <circle cx="230" cy="100" r="10" class="image" />
    <!-- Stop sign -->
    <rect x="280" y="20" width="30" height="100" class="image" />
    <polygon points="280,20 310,20 310,50 295,50 295,70 310,70 310,100 280,100" class="image" />
    <text x="285" y="65" class="content" fill="#E74C3C">STOP</text>
  </g>
</svg>