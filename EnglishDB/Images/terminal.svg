<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">terminal</text>
  <text x="50" y="120" class="subtitle">[ˈtɜːrmɪnl] n. 终端，终点；adj. 末端的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> termin (界限) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆火车驶入"界限(termin)"的终点站，
    <tspan x="50" dy="25">这个终点站就是火车的"终端(terminal)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The train arrived at the terminal station.
  </text>
  <text x="50" y="310" class="content">
    火车到达了终点站。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Train -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="50" width="250" height="100" class="image" />
    <line x1="70" y1="70" x2="280" y2="70" class="image" />
    <line x1="70" y1="90" x2="250" y2="90" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="130" x2="240" y2="130" class="image" />
    <!-- Station -->
    <rect x="100" y="150" width="150" height="50" class="image" />
    <line x1="120" y1="170" x2="230" y2="170" class="image" />
    <line x1="120" y1="190" x2="230" y2="190" class="image" />
    <text x="170" y="185" class="content" fill="#2C3E50">Terminal</text>
  </g>
</svg>