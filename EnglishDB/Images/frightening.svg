<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frightening</text>
  <text x="50" y="120" class="subtitle">[ˈfraɪtənɪŋ] adj. 令人恐惧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> frigh (恐惧) + -ten (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的怪物在夜晚的森林中，"使(ten)"
    <tspan x="50" dy="25">人们感到"恐惧(frigh)"，这就是"令人恐惧的(frightening)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm was so frightening that everyone stayed indoors.
  </text>
  <text x="50" y="310" class="content">
    这场风暴如此令人恐惧，以至于每个人都待在室内。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monster -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="160" class="image" />
    <line x1="100" y1="180" x2="150" y2="160" class="image" />
    <!-- Forest -->
    <rect x="0" y="250" width="350" height="100" class="image" />
    <line x1="50" y1="250" x2="50" y2="350" class="image" />
    <line x1="150" y1="250" x2="150" y2="350" class="image" />
    <line x1="250" y1="250" x2="250" y2="350" class="image" />
    <!-- Night sky -->
    <rect x="0" y="0" width="350" height="250" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="70" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
  </g>
</svg>