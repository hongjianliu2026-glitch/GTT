<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">miraculous</text>
  <text x="50" y="120" class="subtitle">[mɪˈrækjələs] adj. 奇迹般的，不可思议的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mir (奇迹) + -aculous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"奇迹(mir)"之手，从天而降，
    <tspan x="50" dy="25">轻轻一挥，瞬间治愈了所有疾病，这就是"奇迹般的(miraculous)"力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The recovery of the patient was nothing short of miraculous.
  </text>
  <text x="50" y="310" class="content">
    病人的康复简直是奇迹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Miracle hand -->
    <line x1="50" y1="50" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="180" y2="80" class="image" />
    <line x1="200" y1="50" x2="220" y2="80" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <!-- Healing effect -->
    <circle cx="120" cy="150" r="30" class="image" />
    <circle cx="160" cy="150" r="30" class="image" />
    <circle cx="200" cy="150" r="30" class="image" />
    <circle cx="240" cy="150" r="30" class="image" />
    <circle cx="280" cy="150" r="30" class="image" />
  </g>
</svg>