<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">world</text>
  <text x="50" y="120" class="subtitle">[wɜːrld] n. 世界，地球</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wer (转) + ld (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地球仪，"转动(wer)"
    <tspan x="50" dy="25">着展示各个"地方(ld)"，这就是我们的世界(world)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She traveled around the world last year.
  </text>
  <text x="50" y="310" class="content">
    她去年环游了世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Continents -->
    <path d="M175,20 A80,80 0 1,1 175,180 A80,80 0 1,1 175,20" class="image" />
    <!-- Rotation arrow -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <polygon points="175,20 160,50 190,50" class="image" />
  </g>
</svg>