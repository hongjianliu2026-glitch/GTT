<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inauguration</text>
  <text x="50" y="120" class="subtitle">[ɪˌnɔːɡjəˈreɪʃn] n. 就职典礼，开幕式</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + augur (预兆) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个盛大的仪式，"进入(in-)"一个新阶段，
    <tspan x="50" dy="25">预兆(augur)着美好的未来，这就是就职典礼(inauguration)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The inauguration of the new president was a grand event.
  </text>
  <text x="50" y="310" class="content">
    新总统的就职典礼是一个盛大的活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Podium -->
    <rect x="125" y="150" width="100" height="50" class="image" />
    <!-- President -->
    <circle cx="175" cy="120" r="20" class="image" />
    <line x1="175" y1="140" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="155" y2="200" class="image" />
    <line x1="175" y1="180" x2="195" y2="200" class="image" />
    <line x1="175" y1="160" x2="145" y2="150" class="image" />
    <line x1="175" y1="160" x2="205" y2="150" class="image" />
    <!-- Crowd -->
    <circle cx="50" cy="180" r="10" class="image" />
    <circle cx="80" cy="180" r="10" class="image" />
    <circle cx="110" cy="180" r="10" class="image" />
    <circle cx="240" cy="180" r="10" class="image" />
    <circle cx="270" cy="180" r="10" class="image" />
    <circle cx="300" cy="180" r="10" class="image" />
  </g>
</svg>