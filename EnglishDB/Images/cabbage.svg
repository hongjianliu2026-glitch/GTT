<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cabbage</text>
  <text x="50" y="120" class="subtitle">[ˈkæbɪdʒ] n. 卷心菜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cab (头) + age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的卷心菜，它的形状像一个"头(cab)"，
    <tspan x="50" dy="25">紧紧包裹着，就像一个巨大的绿色头盔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added some cabbage to the soup.
  </text>
  <text x="50" y="310" class="content">
    她在汤里加了一些卷心菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cabbage -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="100" cy="100" r="70" class="leaf" />
    <circle cx="100" cy="100" r="60" class="image" />
    <circle cx="100" cy="100" r="50" class="leaf" />
    <circle cx="100" cy="100" r="40" class="image" />
    <circle cx="100" cy="100" r="30" class="leaf" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="10" class="leaf" />
  </g>
</svg>