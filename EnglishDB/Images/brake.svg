<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brake</text>
  <text x="50" y="120" class="subtitle">[breɪk] n. 刹车；v. 刹车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> br- (打破) + ake (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆飞驰的汽车突然"打破(br-)"速度，"动作(ake)"
    <tspan x="50" dy="25">停下来，这就是刹车(brake)的作用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He quickly applied the brakes to avoid hitting the dog.
  </text>
  <text x="50" y="310" class="content">
    他迅速刹车以避免撞到那只狗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="150" r="30" class="image" />
    <circle cx="300" cy="150" r="30" class="image" />
    <!-- Brake -->
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="100" y2="150" class="image" />
    <line x1="150" y1="150" x2="200" y2="150" class="image" />
    <!-- Brake lines -->
    <line x1="150" y1="100" x2="100" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
  </g>
</svg>