<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orientation</text>
  <text x="50" y="120" class="subtitle">[ˌɔːriənˈteɪʃn] n. 方向，定位，定向</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ori- (升起) + ent (名词后缀) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个指南针在早晨的阳光下，"升起(ori-)"
    <tspan x="50" dy="25">并指向正确的方向，这就是定位(orientation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The orientation of the map is crucial for navigation.
  </text>
  <text x="50" y="310" class="content">
    地图的定位对于导航至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compass -->
    <circle cx="175" cy="100" r="75" class="image" />
    <line x1="175" y1="25" x2="175" y2="175" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="175" y1="100" x2="100" y2="175" class="image" />
    <line x1="175" y1="100" x2="250" y2="175" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="20" class="image" fill="#F1C40F" />
    <line x1="300" y1="70" x2="300" y2="100" class="image" />
    <line x1="280" y1="85" x2="320" y2="85" class="image" />
    <line x1="270" y1="100" x2="330" y2="100" class="image" />
  </g>
</svg>