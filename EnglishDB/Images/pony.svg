<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pony</text>
  <text x="50" y="120" class="subtitle">[ˈpoʊni] n. 小马</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语“pouny”，意为“小马”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小马(pony)在草原上欢快地奔跑，
    <tspan x="50" dy="25">它的鬃毛随风飘扬，蹄声清脆，仿佛在说“我是小马(pony)！”</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children rode the ponies at the fair.
  </text>
  <text x="50" y="310" class="content">
    孩子们在集市上骑小马。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pony body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Pony head -->
    <circle cx="230" cy="80" r="30" class="image" />
    <!-- Pony legs -->
    <line x1="80" y1="150" x2="80" y2="200" class="image" />
    <line x1="120" y1="150" x2="120" y2="200" class="image" />
    <line x1="180" y1="150" x2="180" y2="200" class="image" />
    <line x1="220" y1="150" x2="220" y2="200" class="image" />
    <!-- Pony tail -->
    <path d="M250,100 Q270,80 290,100" class="image" />
    <!-- Pony mane -->
    <path d="M230,50 Q210,30 190,50" class="image" />
    <path d="M230,50 Q220,30 210,50" class="image" />
    <path d="M230,50 Q240,30 250,50" class="image" />
  </g>
</svg>