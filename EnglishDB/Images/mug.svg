<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mug</text>
  <text x="50" y="120" class="subtitle">[mʌɡ] n. 大杯子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mug (源自中古英语 mugge, 意为“大杯子”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的杯子(mug)，里面装满了你最喜欢的饮料，
    <tspan x="50" dy="25">你每天早上都会用它来开始新的一天。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She drinks her coffee from a large mug every morning.
  </text>
  <text x="50" y="310" class="content">
    她每天早上都用一个大杯子喝咖啡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mug -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Handle -->
    <rect x="210" y="50" width="30" height="50" class="image" />
    <!-- Liquid -->
    <rect x="10" y="10" width="180" height="130" fill="#85C1E9" />
    <!-- Steam -->
    <line x1="50" y1="10" x2="40" y2="0" class="image" />
    <line x1="70" y1="10" x2="60" y2="0" class="image" />
    <line x1="90" y1="10" x2="80" y2="0" class="image" />
  </g>
</svg>