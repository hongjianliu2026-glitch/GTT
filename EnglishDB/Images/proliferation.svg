<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">proliferation</text>
  <text x="50" y="120" class="subtitle">[ˌproʊlɪfəˈreɪʃn] n. 增殖，扩散</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + lifer (生命) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个细胞在实验室中，"向前(pro-)"
    <tspan x="50" dy="25">不断"生命(lifer)"，迅速分裂成无数个细胞，</tspan>
    <tspan x="50" dy="25">这就是"增殖(proliferation)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The proliferation of nuclear weapons is a global concern.
  </text>
  <text x="50" y="310" class="content">
    核武器的扩散是全球关注的问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cell division -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="350" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
    <line x1="270" y1="100" x2="330" y2="100" class="image" />
    <!-- Lab equipment -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <rect x="50" y="160" width="250" height="30" class="image" />
  </g>
</svg>