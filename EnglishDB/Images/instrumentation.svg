<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">instrumentation</text>
  <text x="50" y="120" class="subtitle">[ˌɪnstrəmɛnˈteɪʃən] n. 仪器使用，仪器仪表</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + strum (弦) + -ent (名词后缀) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在舞台上，"进入(in-)"
    <tspan x="50" dy="25">弦乐器(strum)的世界，使用各种乐器(instrumentation)来演奏美妙的音乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The orchestra's instrumentation was carefully chosen to enhance the performance.
  </text>
  <text x="50" y="310" class="content">
    乐团的乐器使用经过精心挑选，以增强演出效果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Musician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Instruments -->
    <rect x="70" y="80" width="50" height="100" class="image" /> <!-- Guitar -->
    <rect x="140" y="80" width="50" height="100" class="image" /> <!-- Violin -->
    <rect x="210" y="80" width="50" height="100" class="image" /> <!-- Piano -->
    <!-- Music notes -->
    <line x1="80" y1="70" x2="100" y2="70" class="image" />
    <line x1="85" y1="60" x2="95" y2="60" class="image" />
    <line x1="90" y1="50" x2="100" y2="50" class="image" />
    <line x1="150" y1="70" x2="170" y2="70" class="image" />
    <line x1="155" y1="60" x2="165" y2="60" class="image" />
    <line x1="160" y1="50" x2="170" y2="50" class="image" />
    <line x1="220" y1="70" x2="240" y2="70" class="image" />
    <line x1="225" y1="60" x2="235" y2="60" class="image" />
    <line x1="230" y1="50" x2="240" y2="50" class="image" />
  </g>
</svg>