<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nest</text>
  <text x="50" y="120" class="subtitle">[nest] n. 巢，窝；v. 筑巢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nest (巢)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟在树枝上，"筑起(nest)"
    <tspan x="50" dy="25">一个温暖的巢，里面放满了柔软的羽毛和树枝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The birds built a nest in the tree.
  </text>
  <text x="50" y="310" class="content">
    鸟儿在树上筑了一个巢。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree branch -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Nest -->
    <circle cx="175" cy="0" r="50" class="image" />
    <!-- Feathers -->
    <line x1="150" y1="0" x2="175" y2="-30" class="image" />
    <line x1="200" y1="0" x2="175" y2="-30" class="image" />
    <line x1="160" y1="0" x2="175" y2="-20" class="image" />
    <line x1="190" y1="0" x2="175" y2="-20" class="image" />
    <!-- Bird -->
    <circle cx="175" cy="50" r="15" class="image" />
    <line x1="175" y1="65" x2="175" y2="90" class="image" />
    <line x1="175" y1="90" x2="160" y2="110" class="image" />
    <line x1="175" y1="90" x2="190" y2="110" class="image" />
    <line x1="175" y1="75" x2="200" y2="70" class="image" />
  </g>
</svg>