<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">receiver</text>
  <text x="50" y="120" class="subtitle">[rɪˈsiːvər] n. 接收器，收件人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + ceiv (拿) + -er (人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的天线，"收回(re-ceiv)"
    <tspan x="50" dy="25">来自外太空的信号，这个天线就是接收器(receiver)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The satellite dish acts as a receiver for TV signals.
  </text>
  <text x="50" y="310" class="content">
    卫星天线作为电视信号的接收器。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Antenna -->
    <line x1="175" y1="0" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="200" class="image" />
    <line x1="175" y1="150" x2="200" y2="200" class="image" />
    <!-- Signal lines -->
    <line x1="175" y1="0" x2="100" y2="50" class="image" />
    <line x1="175" y1="0" x2="250" y2="50" class="image" />
    <line x1="175" y1="0" x2="50" y2="100" class="image" />
    <line x1="175" y1="0" x2="300" y2="100" class="image" />
    <!-- Receiver -->
    <rect x="150" y="200" width="50" height="30" class="image" />
  </g>
</svg>