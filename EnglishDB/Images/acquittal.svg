<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acquittal</text>
  <text x="50" y="120" class="subtitle">[əˈkwɪtl] n. 宣判无罪，开释</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (加强) + quit (自由) + -al (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被指控的人，经过审判后，法官宣布他"获得自由(ad-quit)"，
    <tspan x="50" dy="25">这就是"宣判无罪(acquittal)"的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jury's acquittal of the defendant surprised many.
  </text>
  <text x="50" y="310" class="content">
    陪审团宣判被告无罪，这让许多人感到惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Judge -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="90" y2="170" class="image" />
    <text x="40" y="100" class="content" fill="#2C3E50">法官</text>

    <!-- Defendant -->
    <rect x="150" y="0" width="100" height="150" class="image" />
    <line x1="200" y1="150" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="180" x2="240" y2="170" class="image" />
    <text x="190" y="100" class="content" fill="#2C3E50">被告</text>

    <!-- Verdict -->
    <rect x="300" y="0" width="100" height="150" class="image" />
    <text x="320" y="100" class="content" fill="#2C3E50">无罪</text>
  </g>
</svg>