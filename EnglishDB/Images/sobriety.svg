<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sobriety</text>
  <text x="50" y="120" class="subtitle">[səˈbraɪəti] n. 清醒，节制</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sobr (清醒) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在酒吧里，手里拿着一杯水，而不是酒，
    <tspan x="50" dy="25">他保持清醒(sobriety)，拒绝酒精的诱惑。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His sobriety helped him make better decisions.
  </text>
  <text x="50" y="310" class="content">
    他的清醒帮助他做出了更好的决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bar counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Glass of water -->
    <rect x="50" y="50" width="50" height="100" class="image" />
    <line x1="75" y1="50" x2="75" y2="150" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Alcohol bottles -->
    <rect x="280" y="50" width="30" height="100" class="image" />
    <rect x="320" y="50" width="30" height="100" class="image" />
  </g>
</svg>