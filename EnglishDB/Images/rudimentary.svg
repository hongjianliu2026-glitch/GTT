<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rudimentary</text>
  <text x="50" y="120" class="subtitle">[ˌruːdɪˈmɛntəri] adj. 基本的，初步的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rud (原始) + -ment (名词后缀) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始人拿着一根"原始的(rud)"木棍，
    <tspan x="50" dy="25">这是他最基本的工具，代表着初步的知识和技能。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The students have only a rudimentary understanding of the subject.
  </text>
  <text x="50" y="310" class="content">
    学生们对这个科目只有初步的理解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Primitive stick -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <!-- Primitive person -->
    <circle cx="50" cy="200" r="20" class="image" />
    <line x1="50" y1="220" x2="50" y2="260" class="image" />
    <line x1="50" y1="260" x2="30" y2="300" class="image" />
    <line x1="50" y1="260" x2="70" y2="300" class="image" />
    <line x1="50" y1="240" x2="80" y2="230" class="image" />
  </g>
</svg>