<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">defiant</text>
  <text x="50" y="120" class="subtitle">[dɪˈfaɪənt] adj. 反抗的，挑衅的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + fiant (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的人，"向下做(de-fiant)"
    <tspan x="50" dy="25">出反抗的姿态，面对强权毫不畏惧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The defiant protesters refused to back down.
  </text>
  <text x="50" y="310" class="content">
    那些反抗的抗议者拒绝退缩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with raised fist -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="140" x2="80" y2="140" class="image" /> <!-- Raised fist -->
    <!-- Arrow pointing down -->
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <polygon points="95,150 105,150 100,160" class="image" />
  </g>
</svg>