<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">teapot</text>
  <text x="50" y="120" class="subtitle">[ˈtiːpɒt] n. 茶壶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tea (茶) + pot (壶)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的茶壶，"茶(tea)"
    <tspan x="50" dy="25">在壶(pot)里沸腾，散发出诱人的香气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She poured tea from the teapot into the cups.
  </text>
  <text x="50" y="310" class="content">
    她从茶壶里把茶倒进杯子里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teapot body -->
    <rect x="50" y="20" width="200" height="100" class="image" />
    <!-- Teapot spout -->
    <rect x="250" y="60" width="30" height="60" class="image" />
    <!-- Teapot handle -->
    <rect x="20" y="60" width="30" height="60" class="image" />
    <!-- Teapot lid -->
    <rect x="100" y="0" width="100" height="20" class="image" />
    <!-- Steam -->
    <line x1="150" y1="20" x2="150" y2="0" class="image" />
    <line x1="160" y1="20" x2="160" y2="0" class="image" />
    <line x1="170" y1="20" x2="170" y2="0" class="image" />
  </g>
</svg>