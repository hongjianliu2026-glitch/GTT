<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">counterattack</text>
  <text x="50" y="120" class="subtitle">[ˈkaʊntərəˌtæk] n. 反击，反攻；v. 反击，反攻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> counter- (相反) + attack (攻击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士在被敌人攻击后，"相反地(counter-)"
    <tspan x="50" dy="25">发起猛烈的反击(attack)，这就是反攻(counterattack)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The army launched a counterattack to regain lost territory.
  </text>
  <text x="50" y="310" class="content">
    军队发起反击以夺回失去的领土。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Enemy attack -->
    <line x1="0" y1="0" x2="200" y2="200" class="image" />
    <line x1="0" y1="20" x2="200" y2="220" class="image" />
    <line x1="0" y1="40" x2="200" y2="240" class="image" />
    <!-- Soldier -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
    <line x1="250" y1="150" x2="300" y2="140" class="image" />
    <!-- Counterattack -->
    <line x1="300" y1="140" x2="500" y2="340" class="image" />
    <line x1="300" y1="160" x2="500" y2="360" class="image" />
    <line x1="300" y1="180" x2="500" y2="380" class="image" />
  </g>
</svg>