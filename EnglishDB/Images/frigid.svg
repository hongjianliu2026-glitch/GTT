<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cold { fill: #BDC3C7; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frigid</text>
  <text x="50" y="120" class="subtitle">[ˈfrɪdʒɪd] adj. 寒冷的，冷淡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> friger (冷) + -id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"冷(friger)"到极点的场景，
    <tspan x="50" dy="25">连空气都凝固了，这就是"frigid"的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The frigid winter wind made her shiver.
  </text>
  <text x="50" y="310" class="content">
    寒冷的冬风让她瑟瑟发抖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowflake -->
    <polygon points="0,0 20,40 40,0 20,20" class="image cold" />
    <polygon points="20,20 40,60 60,20 40,40" class="image cold" />
    <polygon points="40,40 60,80 80,40 60,60" class="image cold" />
    <!-- Ice block -->
    <rect x="100" y="0" width="100" height="100" class="image cold" />
    <!-- Person shivering -->
    <circle cx="250" cy="50" r="20" class="image" />
    <line x1="250" y1="70" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
    <line x1="250" y1="80" x2="220" y2="90" class="image" />
    <line x1="250" y1="80" x2="280" y2="90" class="image" />
  </g>
</svg>