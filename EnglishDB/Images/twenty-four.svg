<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twenty-four</text>
  <text x="50" y="120" class="subtitle">[ˈtwɛnti fɔːr] n. 二十四</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twenty (二十) + four (四)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，上面有24个数字，每个数字都代表一个小时。
    <tspan x="50" dy="25">这个时钟的每一圈都包含了24个小时，这就是"二十四(twenty-four)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clock struck twenty-four, marking the end of the day.
  </text>
  <text x="50" y="310" class="content">
    时钟敲响了二十四下，标志着一天的结束。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Numbers -->
    <text x="175" y="60" text-anchor="middle" class="content">12</text>
    <text x="240" y="105" text-anchor="middle" class="content">3</text>
    <text x="175" y="150" text-anchor="middle" class="content">6</text>
    <text x="110" y="105" text-anchor="middle" class="content">9</text>
    <!-- Hour hand -->
    <line x1="175" y1="100" x2="175" y2="30" class="image" />
    <!-- Minute hand -->
    <line x1="175" y1="100" x2="240" y2="100" class="image" />
  </g>
</svg>