<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reciprocal</text>
  <text x="50" y="120" class="subtitle">[rɪˈsɪprəkəl] adj. 相互的，互惠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + cip (拿) + roc (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人互相交换礼物，"拿回(re-cip)"
    <tspan x="50" dy="25">彼此的东西，这种互惠的行为就是reciprocal。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two countries have a reciprocal trade agreement.
  </text>
  <text x="50" y="310" class="content">
    这两个国家有一个互惠的贸易协议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people exchanging gifts -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <!-- Gifts -->
    <rect x="30" y="70" width="40" height="60" class="image" />
    <rect x="280" y="70" width="40" height="60" class="image" />
    <!-- Arrows -->
    <line x1="70" y1="100" x2="120" y2="100" class="image" />
    <line x1="120" y1="100" x2="120" y2="80" class="image" />
    <line x1="120" y1="80" x2="140" y2="100" class="image" />
    <line x1="280" y1="100" x2="230" y2="100" class="image" />
    <line x1="230" y1="100" x2="230" y2="80" class="image" />
    <line x1="230" y1="80" x2="210" y2="100" class="image" />
  </g>
</svg>