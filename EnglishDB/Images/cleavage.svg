<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cleavage</text>
  <text x="50" y="120" class="subtitle">[ˈklivɪdʒ] n. 裂缝，分裂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cleav (裂开) + -age (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块巨大的岩石，"裂开(cleav)"
    <tspan x="50" dy="25">成两半，中间形成了一个深深的裂缝(cleavage)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The earthquake caused a significant cleavage in the ground.
  </text>
  <text x="50" y="310" class="content">
    地震导致地面出现了一条明显的裂缝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rock -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Crack -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- Broken parts -->
    <rect x="50" y="0" width="150" height="200" class="image" />
    <rect x="200" y="0" width="150" height="200" class="image" />
  </g>
</svg>