<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">purr</text>
  <text x="50" y="120" class="subtitle">[pɜːr] v. 发出呜呜声，咕噜咕噜叫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> purr (源自拟声词，模拟猫的咕噜声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在阳光下，"咕噜咕噜(purr)"
    <tspan x="50" dy="25">地发出满足的声音，仿佛在说：“我好开心！”</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cat purred softly as it was petted.
  </text>
  <text x="50" y="310" class="content">
    猫在被抚摸时轻轻地咕噜咕噜叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="140" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="20" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="140" x2="80" y2="180" class="image" /> <!-- Right leg -->
    <line x1="50" y1="100" x2="20" y2="90" class="image" /> <!-- Left ear -->
    <line x1="50" y1="100" x2="80" y2="90" class="image" /> <!-- Right ear -->
    <!-- Purr sound -->
    <text x="100" y="50" class="content" font-size="36">🐾</text>
    <text x="120" y="50" class="content" font-size="36">🐾</text>
    <text x="140" y="50" class="content" font-size="36">🐾</text>
  </g>
</svg>