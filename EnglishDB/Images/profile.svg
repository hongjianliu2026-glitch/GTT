<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">profile</text>
  <text x="50" y="120" class="subtitle">[ˈproʊfaɪl] n. 侧面；轮廓；简介</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + file (线条)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"向前展示(pro-file)"
    <tspan x="50" dy="25">自己的侧面轮廓，这个轮廓就是他的个人简介(profile)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She updated her social media profile with new photos.
  </text>
  <text x="50" y="310" class="content">
    她用新照片更新了她的社交媒体简介。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person's profile -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="300" y1="50" x2="300" y2="150" class="image" />
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <!-- Head -->
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Body -->
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="220" class="image" />
    <line x1="100" y1="180" x2="120" y2="220" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
  </g>
</svg>