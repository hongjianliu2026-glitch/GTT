<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">carnival</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːrnɪvəl] n. 狂欢节，嘉年华</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> carni- (肉) + val (节日)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的肉(carni-)节日(val)，人们穿着奇装异服，
    <tspan x="50" dy="25">载歌载舞，各种美食和游戏摊位遍布，这就是狂欢节(carnival)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Rio Carnival is the most famous in the world.
  </text>
  <text x="50" y="310" class="content">
    里约狂欢节是世界上最著名的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Carnival tent -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Food stalls -->
    <rect x="200" y="20" width="100" height="60" class="image" />
    <rect x="200" y="100" width="100" height="60" class="image" />
    <!-- Games -->
    <circle cx="300" cy="50" r="20" class="image" />
    <circle cx="300" cy="120" r="20" class="image" />
    <!-- Decorations -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
  </g>
</svg>