<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insurer</text>
  <text x="50" y="120" class="subtitle">[ɪnˈʃʊrər] n. 保险公司，承保人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + sure (确定) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个保险公司的人，"进入(in-)"
    <tspan x="50" dy="25">一个房间，手里拿着一份"确定(sure)"的合同，</tspan>
    <tspan x="50" dy="25">这个人就是承保人(insurer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The insurer agreed to cover the damages.
  </text>
  <text x="50" y="310" class="content">
    保险公司同意赔偿损失。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Door -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Contract -->
    <rect x="200" y="50" width="100" height="80" class="image" />
    <line x1="210" y1="60" x2="290" y2="60" class="image" />
    <line x1="210" y1="80" x2="280" y2="80" class="image" />
    <line x1="210" y1="100" x2="270" y2="100" class="image" />
    <line x1="210" y1="120" x2="260" y2="120" class="image" />
  </g>
</svg>