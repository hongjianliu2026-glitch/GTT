<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transfusion</text>
  <text x="50" y="120" class="subtitle">[trænsˈfjuːʒn] n. 输血</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + fus (流) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生正在给病人进行输血，血液从一袋子"跨越(trans-)"
    <tspan x="50" dy="25">到另一个人的身体里，这就是"输血(transfusion)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The patient needed an emergency transfusion.
  </text>
  <text x="50" y="310" class="content">
    病人需要紧急输血。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blood bag -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="200" class="image" />
    <!-- Blood flow -->
    <line x1="50" y1="200" x2="200" y2="200" class="image" />
    <!-- Patient -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="200" class="image" />
    <line x1="250" y1="200" x2="200" y2="250" class="image" />
    <line x1="250" y1="200" x2="300" y2="250" class="image" />
    <line x1="250" y1="150" x2="300" y2="140" class="image" />
  </g>
</svg>