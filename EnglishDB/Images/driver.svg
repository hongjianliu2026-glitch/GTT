<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">driver</text>
  <text x="50" y="120" class="subtitle">[ˈdraɪvər] n. 司机，驾驶员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drive (驾驶) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个司机(driver)在驾驶座上，"驾驶(drive)"
    <tspan x="50" dy="25">着一辆车，他就是那个掌控方向的人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The driver skillfully navigated through the busy streets.
  </text>
  <text x="50" y="310" class="content">
    司机熟练地穿梭在繁忙的街道上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car -->
    <rect x="0" y="0" width="350" height="150" class="image" />
    <rect x="50" y="20" width="250" height="110" class="image" />
    <!-- Wheels -->
    <circle cx="80" cy="140" r="20" class="image" />
    <circle cx="270" cy="140" r="20" class="image" />
    <!-- Driver -->
    <circle cx="150" cy="80" r="15" class="image" />
    <line x1="150" y1="95" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="140" class="image" />
    <line x1="150" y1="120" x2="170" y2="140" class="image" />
    <line x1="150" y1="105" x2="180" y2="95" class="image" />
  </g>
</svg>