<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hilarious</text>
  <text x="50" y="120" class="subtitle">[hɪˈleəriəs] adj. 非常滑稽的，引人发笑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hilar (高兴) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个喜剧演员在舞台上，"高兴得(hilar)"
    <tspan x="50" dy="25">让观众笑得前仰后合，这就是hilarious的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The comedian's performance was absolutely hilarious.
  </text>
  <text x="50" y="310" class="content">
    那个喜剧演员的表演非常滑稽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Comedian -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="140" y2="140" class="image" />
    <line x1="175" y1="150" x2="210" y2="140" class="image" />
    <line x1="175" y1="180" x2="140" y2="200" class="image" />
    <line x1="175" y1="180" x2="210" y2="200" class="image" />
    <!-- Laughing audience -->
    <circle cx="70" cy="150" r="10" class="image" />
    <circle cx="280" cy="150" r="10" class="image" />
    <line x1="70" y1="160" x2="70" y2="180" class="image" />
    <line x1="280" y1="160" x2="280" y2="180" class="image" />
    <line x1="60" y1="180" x2="80" y2="180" class="image" />
    <line x1="270" y1="180" x2="290" y2="180" class="image" />
  </g>
</svg>