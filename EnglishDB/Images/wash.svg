<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wash</text>
  <text x="50" y="120" class="subtitle">[wɒʃ] v. 洗，冲洗；n. 洗涤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> was (水) + -h (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水龙头，"水(was)"
    <tspan x="50" dy="25">从天而降，冲洗(wash)着一切，</tspan>
    <tspan x="50" dy="25">把所有的污垢都冲走了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She washed the dishes after dinner.
  </text>
  <text x="50" y="310" class="content">
    她晚饭后洗了碗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water faucet -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="20" r="10" class="image" />
    <line x1="50" y1="30" x2="50" y2="180" class="image" />
    <!-- Water stream -->
    <line x1="50" y1="180" x2="50" y2="250" class="image" />
    <line x1="45" y1="190" x2="45" y2="260" class="image" />
    <line x1="55" y1="190" x2="55" y2="260" class="image" />
    <!-- Dirt being washed away -->
    <circle cx="50" cy="250" r="10" class="image" fill="#D35400" />
    <circle cx="45" cy="260" r="5" class="image" fill="#D35400" />
    <circle cx="55" cy="260" r="5" class="image" fill="#D35400" />
  </g>
</svg>