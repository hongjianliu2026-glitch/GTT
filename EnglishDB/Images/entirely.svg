<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">entirely</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtaɪərli] adv. 完全地，彻底地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> en- (进入) + tire (疲劳) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人进入了一个无尽的迷宫，"完全疲劳(en-tire-ly)"，
    <tspan x="50" dy="25">直到他彻底迷失，这就是"完全地(entirely)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was entirely exhausted after the marathon.
  </text>
  <text x="50" y="310" class="content">
    马拉松结束后，她完全筋疲力尽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Maze -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <line x1="50" y1="20" x2="50" y2="170" class="image" />
    <line x1="100" y1="20" x2="100" y2="170" class="image" />
    <line x1="150" y1="20" x2="150" y2="170" class="image" />
    <line x1="200" y1="20" x2="200" y2="170" class="image" />
    <line x1="250" y1="20" x2="250" y2="170" class="image" />
    <line x1="300" y1="20" x2="300" y2="170" class="image" />
    <!-- Person in maze -->
    <circle cx="75" cy="40" r="15" class="image" />
    <line x1="75" y1="55" x2="75" y2="80" class="image" />
    <line x1="75" y1="80" x2="60" y2="100" class="image" />
    <line x1"75" y1="80" x2="90" y2="100" class="image" />
    <line x1="75" y1="65" x2="100" y2="55" class="image" />
  </g>
</svg>