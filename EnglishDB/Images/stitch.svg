<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .needle { fill: #C0392B; }
      .thread { fill: #F39C12; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stitch</text>
  <text x="50" y="120" class="subtitle">[stɪtʃ] n. 针脚，缝线；v. 缝合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stit (站立) + -ch (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个裁缝在缝纫机前，"站立(stit)"
    <tspan x="50" dy="25">并进行缝合的动作(stitch)，每一针都稳稳地站住。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carefully stitched the torn fabric.
  </text>
  <text x="50" y="310" class="content">
    她仔细地缝合了撕裂的布料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fabric -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Needle -->
    <rect x="50" y="20" width="10" height="160" class="needle" />
    <!-- Thread -->
    <rect x="60" y="20" width="250" height="2" class="thread" />
    <rect x="60" y="50" width="250" height="2" class="thread" />
    <rect x="60" y="80" width="250" height="2" class="thread" />
    <rect x="60" y="110" width="250" height="2" class="thread" />
    <rect x="60" y="140" width="250" height="2" class="thread" />
    <!-- Stitches -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>