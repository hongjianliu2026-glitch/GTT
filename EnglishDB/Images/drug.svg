<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drug</text>
  <text x="50" y="120" class="subtitle">[drʌɡ] n. 药物，毒品；v. 使服麻醉药</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dru- (树) + g (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵神奇的树，"树上(dru-)"
    <tspan x="50" dy="25">结满了各种药物，这些药物可以治愈疾病，</tspan>
    <tspan x="50" dy="25">但也有可能成为毒品(drug)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor prescribed a new drug for her migraines.
  </text>
  <text x="50" y="310" class="content">
    医生为她开了治疗偏头痛的新药。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <line x1="80" y1="50" x2="120" y2="50" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="60" y1="150" x2="140" y2="150" class="image" />
    <!-- Drugs -->
    <rect x="80" y="20" width="40" height="30" class="image" />
    <rect x="70" y="70" width="60" height="30" class="image" />
    <rect x="60" y="120" width="80" height="30" class="image" />
    <rect x="50" y="170" width="100" height="30" class="image" />
  </g>
</svg>