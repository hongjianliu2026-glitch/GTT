<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .custard { fill: #FFE082; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">custard</text>
  <text x="50" y="120" class="subtitle">[ˈkʌstərd] n. 蛋奶沙司，奶油冻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cust- (来自拉丁语 "caseus"，意为奶酪) + -ard (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的奶酪(cust-)被融化成浓稠的奶油冻(custard)，
    <tspan x="50" dy="25">上面还漂浮着几片香草叶，看起来既美味又诱人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She served a delicious custard for dessert.
  </text>
  <text x="50" y="310" class="content">
    她为甜点准备了一份美味的奶油冻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Custard bowl -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <ellipse cx="175" cy="100" rx="150" ry="80" class="custard" />
    <!-- Vanilla bean -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="125" y1="50" x2="125" y2="80" class="image" />
    <line x1="125" y1="80" x2="100" y2="100" class="image" />
    <line x1="125" y1="80" x2="150" y2="100" class="image" />
  </g>
</svg>