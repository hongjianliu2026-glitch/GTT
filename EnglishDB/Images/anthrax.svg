<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anthrax</text>
  <text x="50" y="120" class="subtitle">[ˈænθræks] n. 炭疽病</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anthrax (希腊语，意为“炭”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的炼金术士，他正在用炭(anthrax)
    <tspan x="50" dy="25">进行实验，结果不小心引发了炭疽病(anthrax)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The outbreak of anthrax in the village was quickly contained.
  </text>
  <text x="50" y="310" class="content">
    村庄里的炭疽病爆发很快得到了控制。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Alchemist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Cauldron -->
    <rect x="50" y="20" width="150" height="100" class="image" />
    <!-- Charcoal -->
    <rect x="70" y="40" width="30" height="60" class="image" />
    <rect x="110" y="40" width="30" height="60" class="image" />
    <rect x="150" y="40" width="30" height="60" class="image" />
    <!-- Smoke -->
    <line x1="85" y1="30" x2="85" y2="10" class="image" />
    <line x1="125" y1="30" x2="125" y2="10" class="image" />
    <line x1="165" y1="30" x2="165" y2="10" class="image" />
  </g>
</svg>