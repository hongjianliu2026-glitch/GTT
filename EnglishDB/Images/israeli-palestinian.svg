<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Israeli-Palestinian</text>
  <text x="50" y="120" class="subtitle">[ˌɪzreɪli pæləˈstiniən] adj. 以色列-巴勒斯坦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Israeli (以色列的) + Palestinian (巴勒斯坦的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个地图上，"以色列(Israeli)"和"巴勒斯坦(Palestinian)"
    <tspan x="50" dy="25">两个国家紧紧相邻，共同构成了这片复杂而充满历史的地域。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Israeli-Palestinian conflict has been ongoing for decades.
  </text>
  <text x="50" y="310" class="content">
    以色列-巴勒斯坦冲突已经持续了几十年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Israeli flag -->
    <rect x="50" y="20" width="100" height="60" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="20" x2="100" y2="80" class="image" />
    <!-- Palestinian flag -->
    <rect x="200" y="20" width="100" height="60" class="image" />
    <line x1="200" y1="50" x2="300" y2="50" class="image" />
    <line x1="250" y1="20" x2="250" y2="80" class="image" />
    <!-- Border line -->
    <line x1="150" y1="20" x2="150" y2="80" class="image" />
  </g>
</svg>