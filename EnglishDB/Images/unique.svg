<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unique</text>
  <text x="50" y="120" class="subtitle">[juˈniːk] adj. 独特的，唯一的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> uni- (单一) + -que (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的宝石，"单一(uni-)"
    <tspan x="50" dy="25">且闪耀着独特的光芒，它就是独一无二的(unique)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her unique style sets her apart from others.
  </text>
  <text x="50" y="310" class="content">
    她独特的风格使她与众不同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gemstone -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Shine -->
    <line x1="100" y1="50" x2="100" y2="20" class="image" stroke-width="3" stroke="#FFFFFF" />
    <line x1="75" y1="75" x2="50" y2="50" class="image" stroke-width="3" stroke="#FFFFFF" />
    <line x1="125" y1="75" x2="150" y2="50" class="image" stroke-width="3" stroke="#FFFFFF" />
  </g>
</svg>