<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bedside</text>
  <text x="50" y="120" class="subtitle">[ˈbɛdsaɪd] n. 床边</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bed (床) + side (边)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温馨的夜晚，你坐在床边(bedside)，
    <tspan x="50" dy="25">轻轻地为熟睡的孩子盖上被子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She read a book by the bedside.
  </text>
  <text x="50" y="310" class="content">
    她在床边读书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bed -->
    <rect x="0" y="0" width="300" height="150" class="image" />
    <!-- Mattress -->
    <rect x="20" y="20" width="260" height="110" class="image" />
    <!-- Pillow -->
    <rect x="40" y="40" width="80" height="60" class="image" />
    <!-- Person sitting by the bedside -->
    <circle cx="200" cy="180" r="20" class="image" />
    <line x1="200" y1="200" x2="200" y2="250" class="image" />
    <line x1="200" y1="250" x2="180" y2="280" class="image" />
    <line x1="200" y1="250" x2="220" y2="280" class="image" />
    <line x1="200" y1="230" x2="240" y2="220" class="image" />
  </g>
</svg>