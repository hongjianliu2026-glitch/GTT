<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lacquer</text>
  <text x="50" y="120" class="subtitle">[ˈlækər] n. 漆，漆器；v. 涂漆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lac (牛奶) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在画板上，"涂上一层(lac)"
    <tspan x="50" dy="25">像牛奶一样光滑的漆(lacquer)，让作品闪闪发光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used lacquer to finish the wooden table.
  </text>
  <text x="50" y="310" class="content">
    她用漆来完成木桌的表面处理。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paintbrush -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="100" y1="0" x2="90" y2="10" class="image" />
    <line x1="90" y1="10" x2="110" y2="10" class="image" />
    <line x1="110" y1="10" x2="100" y2="20" class="image" />
    <!-- Paint can -->
    <rect x="120" y="0" width="80" height="60" class="image" />
    <line x1="160" y1="60" x2="160" y2="80" class="image" />
    <!-- Shiny surface -->
    <rect x="220" y="0" width="150" height="100" class="image" />
    <circle cx="295" cy="50" r="20" class="image" />
    <circle cx="295" cy="50" r="15" class="image" />
    <circle cx="295" cy="50" r="10" class="image" />
    <circle cx="295" cy="50" r="5" class="image" />
  </g>
</svg>