<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bereaved</text>
  <text x="50" y="120" class="subtitle">[bɪˈriːvd] adj. 失去亲人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + reave (夺走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"夺走(reave)"了亲人，
    <tspan x="50" dy="25">他的心被撕裂，脸上写满了悲伤。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bereaved family held a memorial service for their lost loved one.
  </text>
  <text x="50" y="310" class="content">
    失去亲人的家庭为逝去的亲人举行了追悼会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50,50 Q80,20 110,50 T170,50" class="image" />
    <!-- Broken heart -->
    <line x1="80" y1="40" x2="140" y2="60" class="image" />
    <!-- Person -->
    <circle cx="110" cy="100" r="15" class="image" />
    <line x1="110" y1="115" x2="110" y2="150" class="image" />
    <line x1="110" y1="150" x2="90" y2="180" class="image" />
    <line x1="110" y1="150" x2="130" y2="180" class="image" />
    <line x1="110" y1="130" x2="140" y2="120" class="image" />
    <!-- Tear drop -->
    <ellipse cx="100" cy="190" rx="10" ry="15" class="image" />
  </g>
</svg>