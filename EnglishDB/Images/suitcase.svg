<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suitcase</text>
  <text x="50" y="120" class="subtitle">[ˈsuːtkeɪs] n. 手提箱，行李箱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> suit (适合) + case (箱子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旅行者，"适合(suit)"
    <tspan x="50" dy="25">携带的箱子(case)，就是手提箱(suitcase)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He packed his suitcase for the trip.
  </text>
  <text x="50" y="310" class="content">
    他为旅行打包了手提箱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Suitcase -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Handle -->
    <rect x="80" y="-20" width="40" height="20" class="image" />
    <!-- Wheels -->
    <circle cx="30" cy="150" r="15" class="image" />
    <circle cx="170" cy="150" r="15" class="image" />
    <!-- Traveler -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="210" class="image" />
    <line x1="250" y1="180" x2="270" y2="210" class="image" />
    <line x1="250" y1="140" x2="290" y2="130" class="image" />
  </g>
</svg>