<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bushel</text>
  <text x="50" y="120" class="subtitle">[ˈbʊʃəl] n. 蒲式耳（容量单位）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "busshel"，意为“一束”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的“束(busshel)”里装满了苹果，
    <tspan x="50" dy="25">这个“束”就是一蒲式耳(bushel)，用来计量农产品的容量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer harvested 50 bushels of wheat.
  </text>
  <text x="50" y="310" class="content">
    农民收获了50蒲式耳的小麦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bushel basket -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Apples -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Bushel label -->
    <text x="150" y="150" class="content" text-anchor="middle">Bushel</text>
  </g>
</svg>