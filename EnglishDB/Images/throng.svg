<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">throng</text>
  <text x="50" y="120" class="subtitle">[θrɒŋ] n. 人群，一大群；v. 挤满，群集</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thron (座位) + -g (聚集)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的座位(thron)上，"聚集(g)"
    <tspan x="50" dy="25">了无数的人，形成了一个拥挤的人群(throng)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The concert was so popular that it was thronged with fans.
  </text>
  <text x="50" y="310" class="content">
    这场音乐会非常受欢迎，挤满了粉丝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large seat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Crowd -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="120" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="120" r="15" class="image" />
    <!-- More crowd -->
    <circle cx="70" cy="150" r="15" class="image" />
    <circle cx="120" cy="170" r="15" class="image" />
    <circle cx="170" cy="150" r="15" class="image" />
    <circle cx="220" cy="170" r="15" class="image" />
    <circle cx="270" cy="150" r="15" class="image" />
  </g>
</svg>