<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inequity</text>
  <text x="50" y="120" class="subtitle">[ɪnˈekwɪti] n. 不公平，不公正</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + equ (平等) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，一边是满满的金币，另一边却空空如也，
    <tspan x="50" dy="25">这就是"不平等(inequity)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The inequity in wealth distribution is a major issue.
  </text>
  <text x="50" y="310" class="content">
    财富分配不公是一个主要问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="200" x2="150" y2="200" class="image" />
    <!-- Coins on one side -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="120" cy="100" r="15" class="image" />
    <circle cx="80" cy="100" r="15" class="image" />
    <!-- Empty side -->
    <line x1="200" y1="50" x2="200" y2="200" class="image" />
    <line x1="200" y1="50" x2="300" y2="50" class="image" />
    <line x1="200" y1="200" x2="300" y2="200" class="image" />
  </g>
</svg>