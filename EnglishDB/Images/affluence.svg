<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">affluence</text>
  <text x="50" y="120" class="subtitle">[ˈæfluəns] n. 富裕，丰富</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> af- (加强) + flu (流动) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金流(flu)从天而降，"加强(af-)"
    <tspan x="50" dy="25">了你的财富，让你变得极其富裕(affluence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His affluence allowed him to travel the world.
  </text>
  <text x="50" y="310" class="content">
    他的财富使他能够环游世界。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gold stream -->
    <path d="M0 0 Q100 100 200 0 T400 0" class="image" stroke="gold" stroke-width="10" />
    <!-- Coins -->
    <circle cx="50" cy="50" r="10" class="image" fill="gold" />
    <circle cx="100" cy="30" r="10" class="image" fill="gold" />
    <circle cx="150" cy="70" r="10" class="image" fill="gold" />
    <circle cx="200" cy="40" r="10" class="image" fill="gold" />
    <circle cx="250" cy="60" r="10" class="image" fill="gold" />
    <circle cx="300" cy="50" r="10" class="image" fill="gold" />
    <!-- Person -->
    <circle cx="350" cy="100" r="15" class="image" />
    <line x1="350" y1="115" x2="350" y2="150" class="image" />
    <line x1="350" y1="150" x2="330" y2="180" class="image" />
    <line x1="350" y1="150" x2="370" y2="180" class="image" />
    <line x1="350" y1="130" x2="380" y2="120" class="image" />
  </g>
</svg>