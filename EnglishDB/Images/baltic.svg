<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Baltic</text>
  <text x="50" y="120" class="subtitle">[ˈbɔːltɪk] adj. 波罗的海的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Balt- (源自拉丁语 "Baltus"，意为“白”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片波光粼粼的“白色(Balt-)”海洋，
    <tspan x="50" dy="25">这就是波罗的海(Baltic Sea)，它的名字源于其清澈的海水。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Baltic Sea is known for its clear waters.
  </text>
  <text x="50" y="310" class="content">
    波罗的海以其清澈的海水而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#A9CCE3" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Waves -->
    <path d="M50,100 Q100,50 150,100 T250,100" class="image" fill="none" />
    <path d="M50,120 Q100,70 150,120 T250,120" class="image" fill="none" />
    <path d="M50,140 Q100,90 150,140 T250,140" class="image" fill="none" />
  </g>
</svg>