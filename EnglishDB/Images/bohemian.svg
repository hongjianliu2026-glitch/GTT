<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bohemian</text>
  <text x="50" y="120" class="subtitle">[boʊˈhiːmiən] n. 波西米亚人，放荡不羁的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Bohem (波西米亚) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家，穿着色彩斑斓的衣服，
    <tspan x="50" dy="25">在波西米亚风格的咖啡馆里，自由地创作，</tspan>
    <tspan x="50" dy="25">这就是典型的波西米亚风格(bohemian)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a bohemian style of dressing.
  </text>
  <text x="50" y="310" class="content">
    她有一种波西米亚风格的穿衣风格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Colorful clothes -->
    <rect x="0" y="150" width="40" height="30" class="image" />
    <rect x="0" y="180" width="40" height="30" class="image" />
    <!-- Coffee shop -->
    <rect x="50" y="20" width="250" height="200" class="image" />
    <!-- Table -->
    <rect x="70" y="100" width="200" height="50" class="image" />
    <!-- Coffee cup -->
    <circle cx="100" cy="125" r="10" class="image" />
    <!-- Paintbrush -->
    <line x1="200" y1="120" x2="250" y2="120" class="image" />
    <line x1="250" y1="120" x2="240" y2="100" class="image" />
  </g>
</svg>