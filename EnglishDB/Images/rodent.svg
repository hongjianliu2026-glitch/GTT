<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rodent</text>
  <text x="50" y="120" class="subtitle">[ˈroʊdnt] n. 啮齿动物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rod (咬) + -ent (表示“具有...性质的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小老鼠，它不停地"咬(rod)"东西，
    <tspan x="50" dy="25">这就是为什么它被称为啮齿动物(rodent)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rodent gnawed through the wooden door.
  </text>
  <text x="50" y="310" class="content">
    那只啮齿动物啃穿了木门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouse body -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <!-- Mouse head -->
    <circle cx="150" cy="80" r="20" class="image" />
    <!-- Mouse ears -->
    <circle cx="140" cy="60" r="10" class="image" />
    <circle cx="160" cy="60" r="10" class="image" />
    <!-- Mouse eyes -->
    <circle cx="145" cy="75" r="3" class="image" />
    <circle cx="155" cy="75" r="3" class="image" />
    <!-- Mouse nose -->
    <circle cx="150" cy="85" r="2" class="image" />
    <!-- Mouse tail -->
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <!-- Mouse teeth -->
    <line x1="140" y1="90" x2="160" y2="90" class="image" />
    <line x1="140" y1="95" x2="160" y2="95" class="image" />
  </g>
</svg>