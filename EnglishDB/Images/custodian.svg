<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">custodian</text>
  <text x="50" y="120" class="subtitle">[kʌˈstoʊdiən] n. 管理人，看守人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> custos (看守) + -dian (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钥匙(key)被一个"看守人(custos-dian)"
    <tspan x="50" dy="25">紧紧握在手中，他守护着重要的宝藏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The custodian of the museum keeps the keys to all the exhibits.
  </text>
  <text x="50" y="310" class="content">
    博物馆的管理人保管着所有展品的钥匙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Key -->
    <rect x="50" y="20" width="100" height="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="100" y1="80" x2="100" y2="20" class="image" />
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <!-- Custodian -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Holding the key -->
    <line x1="200" y1="120" x2="150" y2="50" class="image" />
  </g>
</svg>