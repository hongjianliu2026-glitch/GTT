<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cockpit</text>
  <text x="50" y="120" class="subtitle">[ˈkɑːkˌpɪt] n. 驾驶舱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cock (公鸡) + pit (坑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只公鸡(cock)站在一个坑(pit)里，
    <tspan x="50" dy="25">这个坑变成了飞机的驾驶舱(cockpit)，</tspan>
    <tspan x="50" dy="25">公鸡变成了飞行员，正在操控飞机。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pilot sat in the cockpit, ready for takeoff.
  </text>
  <text x="50" y="310" class="content">
    飞行员坐在驾驶舱里，准备起飞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cockpit -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Pilot -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Controls -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <line x1="120" y1="50" x2="280" y2="50" class="image" />
    <line x1="120" y1="80" x2="250" y2="80" class="image" />
    <line x1="120" y1="110" x2="270" y2="110" class="image" />
    <line x1="120" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>