<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hunt</text>
  <text x="50" y="120" class="subtitle">[hʌnt] v. 打猎，搜索；n. 狩猎，搜索</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hunt (源自中古英语 hunten，意为追逐)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个猎人手持弓箭，"追逐(hunt)"
    <tspan x="50" dy="25">一只奔跑的鹿，这场追逐就是一场狩猎(hunt)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They went on a hunt for the missing keys.
  </text>
  <text x="50" y="310" class="content">
    他们去寻找丢失的钥匙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hunter -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Bow -->
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="90" y2="110" class="image" />
    <line x1="100" y1="120" x2="90" y2="130" class="image" />
    <!-- Deer -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
    <line x1="200" y1="150" x2="240" y2="160" class="image" />
  </g>
</svg>