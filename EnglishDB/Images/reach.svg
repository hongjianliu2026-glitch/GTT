<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reach</text>
  <text x="50" y="120" class="subtitle">[riːtʃ] v. 到达，延伸；n. 范围</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + ach (接近)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人不断"再次接近(re-ach)"目标，
    <tspan x="50" dy="25">最终成功"到达(reach)"目的地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She reached the top of the mountain after a long hike.
  </text>
  <text x="50" y="310" class="content">
    经过长时间的徒步旅行，她到达了山顶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 150,0 300,200" class="image" />
    <!-- Person reaching the top -->
    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="100" y2="200" class="image" />
    <line x1="150" y1="150" x2="200" y2="200" class="image" />
    <line x1="150" y1="100" x2="180" y2="90" class="image" />
  </g>
</svg>