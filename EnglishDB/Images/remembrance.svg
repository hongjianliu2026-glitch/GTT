<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">remembrance</text>
  <text x="50" y="120" class="subtitle">[rɪˈmembrəns] n. 记忆，纪念</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + member (记忆)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在脑海中"再次回忆(re-member)"
    <tspan x="50" dy="25">起过去的时光，这些回忆就构成了记忆(remembrance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She kept a photo as a remembrance of her trip to Paris.
  </text>
  <text x="50" y="310" class="content">
    她保留了一张照片作为她巴黎之行的纪念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Memory lines -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <!-- Photo -->
    <rect x="220" y="20" width="150" height="100" class="image" />
    <!-- Paris landmarks -->
    <line x1="240" y1="40" x2="260" y2="60" class="image" />
    <line x1="260" y1="40" x2="240" y2="60" class="image" />
    <line x1="280" y1="40" x2="300" y2="60" class="image" />
    <line x1="300" y1="40" x2="280" y2="60" class="image" />
    <line x1="250" y1="80" x2="290" y2="80" class="image" />
  </g>
</svg>