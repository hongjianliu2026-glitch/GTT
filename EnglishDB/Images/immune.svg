<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">immune</text>
  <text x="50" y="120" class="subtitle">[ɪˈmjuːn] adj. 免疫的，免除的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + munis (服务)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个超级英雄，"不需要服务(im-munis)"
    <tspan x="50" dy="25">因为他已经免疫(immune)了所有的疾病和伤害。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the vaccination, she became immune to the flu.
  </text>
  <text x="50" y="310" class="content">
    接种疫苗后，她对流感产生了免疫力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="175,20 325,100 175,180 25,100" class="image" />
    <!-- Superhero -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="140" y2="120" class="image" />
    <line x1="175" y1="150" x2="210" y2="120" class="image" />
    <line x1="175" y1="180" x2="140" y2="220" class="image" />
    <line x1="175" y1="180" x2="210" y2="220" class="image" />
  </g>
</svg>