<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sense</text>
  <text x="50" y="120" class="subtitle">[sɛns] n. 感觉，意识；v. 意识到</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sens- (感觉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人闭上眼睛，用手指轻轻触摸物体，"感觉(sens)"
    <tspan x="50" dy="25">到它的形状和质地，这就是sense的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a good sense of direction.
  </text>
  <text x="50" y="310" class="content">
    她方向感很好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with closed eyes -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="40" y1="40" x2="60" y2="60" class="image" />
    <line x1="40" y1="60" x2="60" y2="40" class="image" />
    <!-- Hand touching object -->
    <line x1="80" y1="50" x2="120" y2="50" class="image" />
    <line x1="120" y1="50" x2="120" y2="80" class="image" />
    <line x1="120" y1="80" x2="100" y2="100" class="image" />
    <line x1="120" y1="80" x2="140" y2="100" class="image" />
    <!-- Object -->
    <rect x="150" y="40" width="50" height="50" class="image" />
  </g>
</svg>