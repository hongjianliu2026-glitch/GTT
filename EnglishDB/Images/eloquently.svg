<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eloquently</text>
  <text x="50" y="120" class="subtitle">[ˈɛləkwəntli] adv. 雄辩地，有口才地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + loqu (说) + -ent (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在讲台上，"说出(loqu)"
    <tspan x="50" dy="25">的话语如泉水般涌出(e-)，</tspan>
    <tspan x="50" dy="25">他的演讲如此雄辩(eloquent)，</tspan>
    <tspan x="50" dy="25">以至于所有人都被深深打动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> He spoke eloquently about the importance of education.
  </text>
  <text x="50" y="330" class="content">
    他雄辩地讲述了教育的重要性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <line x1="175" y1="140" x2="120" y2="130" class="image" />
    <line x1="175" y1="140" x2="230" y2="130" class="image" />
    <!-- Speech bubbles -->
    <path d="M200,80 Q250,80 250,50 Q250,20 200,20 Q150,20 150,50 Q150,80 200,80" class="image" />
    <path d="M220,100 Q270,100 270,70 Q270,40 220,40 Q170,40 170,70 Q170,100 220,100" class="image" />
  </g>
</svg>