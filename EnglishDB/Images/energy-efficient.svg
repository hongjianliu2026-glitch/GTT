<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .energy { fill: #F39C12; }
      .efficient { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">energy-efficient</text>
  <text x="50" y="120" class="subtitle">[ˌenərdʒi ɪˈfɪʃnt] adj. 节能的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> energy (能量) + efficient (高效的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的能量球，"高效地(efficient)"
    <tspan x="50" dy="25">转化为电力，点亮了整个城市，这就是节能(energy-efficient)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new refrigerator is energy-efficient.
  </text>
  <text x="50" y="310" class="content">
    这台新冰箱是节能的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Energy ball -->
    <circle cx="100" cy="100" r="50" class="energy" />
    <!-- Lightning bolt -->
    <polygon points="150,100 200,50 250,100 200,150" class="efficient" />
    <!-- City skyline -->
    <rect x="250" y="100" width="100" height="50" class="efficient" />
    <rect x="300" y="75" width="50" height="75" class="efficient" />
    <rect x="350" y="125" width="50" height="25" class="efficient" />
    <!-- Light bulbs -->
    <circle cx="275" cy="125" r="10" class="efficient" />
    <circle cx="325" cy="100" r="10" class="efficient" />
    <circle cx="375" cy="150" r="10" class="efficient" />
  </g>
</svg>