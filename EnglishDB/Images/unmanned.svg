<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unmanned</text>
  <text x="50" y="120" class="subtitle">[ʌnˈmænd] adj. 无人驾驶的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + man (人) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车在高速公路上飞驰，但车里却空无一人，"无人驾驶(un-manned)"
    <tspan x="50" dy="25">的场景让人惊叹科技的进步。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company launched an unmanned delivery drone.
  </text>
  <text x="50" y="310" class="content">
    该公司推出了一款无人驾驶的送货无人机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="150" y="50" width="100" height="50" class="image" />
    <!-- Wheels -->
    <circle cx="170" cy="110" r="10" class="image" />
    <circle cx="230" cy="110" r="10" class="image" />
    <!-- Empty seat -->
    <rect x="160" y="60" width="30" height="30" class="image" />
    <rect x="210" y="60" width="30" height="30" class="image" />
  </g>
</svg>