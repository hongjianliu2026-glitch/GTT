<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aha</text>
  <text x="50" y="120" class="subtitle">[ɑːhə] int. 啊哈（表示惊讶、得意等）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 拟声词，模拟惊讶或得意的声音
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然发现了一个秘密，他惊讶地喊出"啊哈(aha)"，
    <tspan x="50" dy="25">脸上露出得意的笑容。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Aha! I finally found the missing key.
  </text>
  <text x="50" y="310" class="content">
    啊哈！我终于找到了丢失的钥匙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lightbulb -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <!-- Face -->
    <circle cx="300" cy="100" r="50" class="image" />
    <circle cx="280" cy="80" r="10" class="image" />
    <circle cx="320" cy="80" r="10" class="image" />
    <path d="M280 120 Q300 140 320 120" class="image" />
    <!-- Speech bubble -->
    <path d="M350 50 Q450 50 450 150 Q450 50 550 50" class="image" />
    <text x="370" y="100" class="content">aha!</text>
  </g>
</svg>