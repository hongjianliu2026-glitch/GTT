<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flounder</text>
  <text x="50" y="120" class="subtitle">[ˈflaʊndər] v. 挣扎，踉跄；n. 比目鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flounder (源自中古英语 floundren，意为“挣扎”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条比目鱼(flounder)在水中"挣扎(flounder)"，
    <tspan x="50" dy="25">它的身体扭曲，试图找到平衡，这个画面让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The swimmer floundered in the rough sea.
  </text>
  <text x="50" y="310" class="content">
    游泳者在汹涌的海中挣扎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Fish tail -->
    <polygon points="250,100 280,80 280,120" class="image" />
    <!-- Fish eyes -->
    <circle cx="100" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Fish fins -->
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="100" y1="75" x2="200" y2="75" class="image" />
    <!-- Struggling motion -->
    <line x1="150" y1="100" x2="100" y2="120" class="image" />
    <line x1="150" y1="100" x2="200" y2="120" class="image" />
  </g>
</svg>