<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">campsite</text>
  <text x="50" y="120" class="subtitle">[ˈkæmpˌsaɪt] n. 露营地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> camp (营地) + site (地点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在森林中，"扎营(camp)"在一个特定的"地点(site)"，
    <tspan x="50" dy="25">这就是他们的露营地(campsite)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We found a perfect campsite by the lake.
  </text>
  <text x="50" y="310" class="content">
    我们在湖边找到了一个完美的露营地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tent -->
    <polygon points="50,100 150,100 100,50" class="image" />
    <!-- Ground -->
    <rect x="0" y="100" width="200" height="100" class="image" />
    <!-- Trees -->
    <line x1="20" y1="100" x2="20" y2="20" class="image" />
    <line x1="30" y1="100" x2="30" y2="30" class="image" />
    <line x1="40" y1="100" x2="40" y2="40" class="image" />
    <!-- Campfire -->
    <circle cx="100" cy="150" r="10" class="image" />
    <line x1="90" y1="150" x2="110" y2="150" class="image" />
    <line x1="95" y1="140" x2="105" y2="140" class="image" />
    <line x1="100" y1="130" x2="100" y2="140" class="image" />
  </g>
</svg>