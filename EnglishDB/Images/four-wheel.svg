<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">four-wheel</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrˌwiːl] adj. 四轮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> four (四) + wheel (轮子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆有四个轮子的车，"四(four)个轮子(wheel)"
    <tspan x="50" dy="25">一起转动，这辆车就是四轮车(four-wheel)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He bought a four-wheel drive vehicle for off-road adventures.
  </text>
  <text x="50" y="310" class="content">
    他买了一辆四轮驱动车，用于越野冒险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Wheels -->
    <circle cx="80" cy="140" r="20" class="image" />
    <circle cx="220" cy="140" r="20" class="image" />
    <circle cx="80" cy="140" r="20" class="image" />
    <circle cx="220" cy="140" r="20" class="image" />
  </g>
</svg>