<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vile</text>
  <text x="50" y="120" class="subtitle">[vaɪl] adj. 卑鄙的，可耻的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vil (卑鄙)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个卑鄙的人，他的心是黑色的，
    <tspan x="50" dy="25">他的行为让人感到恶心和厌恶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His vile actions were condemned by everyone.
  </text>
  <text x="50" y="310" class="content">
    他的卑鄙行为受到了所有人的谴责。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Black heart -->
    <path d="M50,50 C50,25 80,25 80,50 C80,75 50,75 50,50 Z" class="image" fill="#000" />
    <!-- Vile person -->
    <circle cx="100" cy="100" r="15" class="image" fill="#7F8C8D" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Nausea symbol -->
    <path d="M150,50 C150,25 180,25 180,50 C180,75 150,75 150,50 Z" class="image" fill="#E74C3C" />
    <line x1="150" y1="50" x2="180" y2="50" class="image" />
    <line x1="165" y1="35" x2="165" y2="65" class="image" />
  </g>
</svg>