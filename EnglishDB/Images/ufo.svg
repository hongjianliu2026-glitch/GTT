<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">UFO</text>
  <text x="50" y="120" class="subtitle">[ˌjuː ˌef ˈoʊ] n. 不明飞行物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Unidentified Flying Object
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚，天空中突然出现一个闪烁的飞行物，
    <tspan x="50" dy="25">它快速移动，形状奇特，没有人能识别它是什么。</tspan>
    <tspan x="50" dy="25">这个神秘的飞行物就是UFO，不明飞行物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Many people claim to have seen a UFO last night.
  </text>
  <text x="50" y="310" class="content">
    许多人声称昨晚看到了不明飞行物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- UFO -->
    <circle cx="100" cy="100" r="50" class="image" fill="#AED6F1" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Stars -->
    <circle cx="200" cy="50" r="5" class="image" fill="#F1C40F" />
    <circle cx="250" cy="80" r="5" class="image" fill="#F1C40F" />
    <circle cx="300" cy="30" r="5" class="image" fill="#F1C40F" />
    <circle cx="350" cy="60" r="5" class="image" fill="#F1C40F" />
  </g>
</svg>