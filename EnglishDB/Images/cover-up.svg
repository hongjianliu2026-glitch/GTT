<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cover-up</text>
  <text x="50" y="120" class="subtitle">[ˈkʌvərˌʌp] n. 掩盖，掩饰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cover (覆盖) + up (向上)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图用一块布"覆盖(cover)"
    <tspan x="50" dy="25">住一个秘密，不让别人看到，这就是"掩盖(cover-up)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company tried to cover up the scandal.
  </text>
  <text x="50" y="310" class="content">
    公司试图掩盖丑闻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Secret -->
    <circle cx="100" cy="100" r="50" class="image" />
    <text x="85" y="110" class="content" fill="#34495E">秘密</text>
    <!-- Cover -->
    <rect x="50" y="50" width="100" height="100" class="image" />
    <text x="65" y="110" class="content" fill="#34495E">覆盖</text>
  </g>
</svg>