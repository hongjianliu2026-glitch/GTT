<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ribbon</text>
  <text x="50" y="120" class="subtitle">[ˈrɪbən] n. 丝带，缎带</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rib (肋骨) + -bon (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条丝带像肋骨一样弯曲，"小肋骨(rib-bon)"
    <tspan x="50" dy="25">缠绕在礼物上，增添了一份优雅和精致。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tied a beautiful ribbon around the gift box.
  </text>
  <text x="50" y="310" class="content">
    她在礼物盒上系了一条漂亮的丝带。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ribbon -->
    <path d="M50,50 C100,20 200,20 250,50" class="image" />
    <path d="M50,50 C100,80 200,80 250,50" class="image" />
    <!-- Gift box -->
    <rect x="100" y="100" width="150" height="100" class="image" />
    <!-- Bow -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="150" class="image" />
    <line x1="160" y1="135" x2="190" y2="135" class="image" />
  </g>
</svg>