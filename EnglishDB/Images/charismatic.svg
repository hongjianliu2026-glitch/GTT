<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">charismatic</text>
  <text x="50" y="120" class="subtitle">[ˌkærɪzˈmætɪk] adj. 有魅力的，有感召力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> charis (恩惠) + -matic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个领袖站在高台上，"散发着恩惠(charis)"
    <tspan x="50" dy="25">和魅力，吸引着无数追随者，这就是charismatic。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The charismatic leader inspired the crowd with his speech.
  </text>
  <text x="50" y="310" class="content">
    这位有魅力的领袖用他的演讲激励了人群。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Leader -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="145" y2="130" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Followers -->
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <circle cx="175" cy="180" r="10" class="image" />
    <!-- Rays of light -->
    <line x1="175" y1="80" x2="100" y2="0" class="image" />
    <line x1="175" y1="80" x2="250" y2="0" class="image" />
    <line x1="175" y1="80" x2="350" y2="100" class="image" />
    <line x1="175" y1="80" x2="0" y2="100" class="image" />
  </g>
</svg>