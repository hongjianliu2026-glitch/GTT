<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lightweight</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪtweɪt] adj. 轻量的，轻巧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> light (轻) + weight (重量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个羽毛轻轻飘落，"轻如羽毛(light)"，
    <tspan x="50" dy="25">没有重量(weight)，这就是轻量级(lightweight)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new laptop is a lightweight model, easy to carry.
  </text>
  <text x="50" y="310" class="content">
    这款新笔记本电脑是轻量级型号，便于携带。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Feather -->
    <path d="M50,50 Q75,25 100,50 T150,50" class="image" />
    <path d="M50,70 Q75,45 100,70 T150,70" class="image" />
    <path d="M50,90 Q75,65 100,90 T150,90" class="image" />
    <!-- Weight scale -->
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="180" y1="150" x2="220" y2="150" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
    <!-- Zero weight -->
    <text x="190" y="170" class="content">0</text>
  </g>
</svg>