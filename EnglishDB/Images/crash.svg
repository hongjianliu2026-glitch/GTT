<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crash</text>
  <text x="50" y="120" class="subtitle">[kræʃ] v. 碰撞，崩溃；n. 碰撞，崩溃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cr- (破碎) + ash (灰烬)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车"破碎(cr-)"成"灰烬(ash)"，
    <tspan x="50" dy="25">这就是一次"碰撞(crash)"的惨烈画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car crashed into a tree.
  </text>
  <text x="50" y="310" class="content">
    汽车撞到了树上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car -->
    <rect x="0" y="0" width="150" height="50" class="image" />
    <rect x="20" y="50" width="110" height="20" class="image" />
    <circle cx="40" cy="70" r="10" class="image" />
    <circle cx="120" cy="70" r="10" class="image" />
    <!-- Tree -->
    <rect x="180" y="0" width="20" height="100" class="image" />
    <circle cx="190" cy="100" r="30" class="image" />
    <!-- Crash effect -->
    <line x1="150" y1="25" x2="180" y2="50" class="image" />
    <line x1="150" y1="35" x2="180" y2="60" class="image" />
    <line x1="150" y1="45" x2="180" y2="70" class="image" />
  </g>
</svg>