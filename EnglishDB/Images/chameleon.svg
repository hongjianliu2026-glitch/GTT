<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chameleon</text>
  <text x="50" y="120" class="subtitle">[kəˈmiːliən] n. 变色龙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chamæl (骆驼) + leon (狮子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只变色龙，它像骆驼一样在沙漠中行走，
    <tspan x="50" dy="25">突然遇到一只狮子，它立刻改变颜色，</tspan>
    <tspan x="50" dy="25">融入周围环境，成功躲避了危险。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chameleon changed its color to blend with the leaves.
  </text>
  <text x="50" y="310" class="content">
    变色龙改变了颜色以融入树叶中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chameleon body -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Chameleon head -->
    <circle cx="150" cy="80" r="20" class="image" />
    <!-- Chameleon eyes -->
    <circle cx="140" cy="70" r="5" class="image" />
    <circle cx="160" cy="70" r="5" class="image" />
    <!-- Chameleon tail -->
    <path d="M 100 150 Q 50 200 100 250" class="image" />
    <!-- Chameleon legs -->
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <!-- Background elements -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="250" y2="80" class="image" />
    <line x1="50" y1="110" x2="270" y2="110" class="image" />
    <line x1="50" y1="140" x2="240" y2="140" class="image" />
  </g>
</svg>