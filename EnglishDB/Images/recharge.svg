<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">recharge</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈtʃɑːrdʒ] v. 充电，恢复精力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + charge (装载)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的人躺在床上，"再次装载(re-charge)"
    <tspan x="50" dy="25">能量，就像给手机充电一样，恢复精力(recharge)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a long day at work, she needed to recharge her batteries.
  </text>
  <text x="50" y="310" class="content">
    工作了一整天后，她需要恢复精力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Lightning bolt -->
    <polyline points="250,50 270,70 250,90 270,110 250,130" class="image" />
    <!-- Phone -->
    <rect x="300" y="70" width="40" height="80" class="image" />
    <line x1="320" y1="70" x2="320" y2="150" class="image" />
  </g>
</svg>