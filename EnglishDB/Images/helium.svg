<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .balloon { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">helium</text>
  <text x="50" y="120" class="subtitle">[ˈhiːliəm] n. 氦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heli- (太阳) + -um (元素)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太阳(heli-)，它释放出一种神奇的气体，这种气体让气球(balloon)
    <tspan x="50" dy="25">飘浮在空中。这种气体就是氦(helium)，因为它最早是从太阳中发现的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The balloon filled with helium floated high into the sky.
  </text>
  <text x="50" y="310" class="content">
    充满氦气的气球高高飘向天空。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F39C12" />
    <!-- Balloon -->
    <circle cx="250" cy="150" r="30" class="balloon" />
    <line x1="250" y1="180" x2="250" y2="250" class="image" />
    <!-- Clouds -->
    <ellipse cx="150" cy="50" rx="40" ry="20" class="image" fill="#ECF0F1" />
    <ellipse cx="200" cy="70" rx="30" ry="15" class="image" fill="#ECF0F1" />
    <ellipse cx="250" cy="60" rx="35" ry="18" class="image" fill="#ECF0F1" />
  </g>
</svg>