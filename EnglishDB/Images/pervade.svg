<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pervade</text>
  <text x="50" y="120" class="subtitle">[pərˈveɪd] v. 弥漫，渗透</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + vad (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一种气味"完全走遍(per-vade)"整个房间，
    <tspan x="50" dy="25">无处不在，这就是弥漫(pervade)的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scent of flowers pervaded the garden.
  </text>
  <text x="50" y="310" class="content">
    花香弥漫了整个花园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flowers -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="120" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="120" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Smell lines -->
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="100" y1="140" x2="300" y2="140" class="image" />
    <line x1="150" y1="120" x2="300" y2="120" class="image" />
    <line x1="200" y1="140" x2="300" y2="140" class="image" />
    <line x1="250" y1="120" x2="300" y2="120" class="image" />
  </g>
</svg>