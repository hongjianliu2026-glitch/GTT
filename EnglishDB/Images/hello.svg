<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hello</text>
  <text x="50" y="120" class="subtitle">[həˈloʊ] int. 你好，喂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hel- (健康) + -o (表示感叹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代医生，他看到病人恢复健康，高兴地喊出"Hel-o!"，
    <tspan x="50" dy="25">这个声音逐渐演变成了我们今天打招呼的"hello"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She greeted him with a cheerful "Hello!"
  </text>
  <text x="50" y="310" class="content">
    她愉快地向他打招呼："你好！"
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ancient doctor -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Patient -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Health symbol -->
    <line x1="125" y1="50" x2="125" y2="150" class="image" />
    <circle cx="125" cy="40" r="10" class="image" />
    <circle cx="125" cy="160" r="10" class="image" />
    <!-- Hello text -->
    <text x="100" y="250" class="title" style="fill: #E74C3C;">Hel-o!</text>
  </g>
</svg>