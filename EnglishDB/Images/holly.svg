<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">holly</text>
  <text x="50" y="120" class="subtitle">[ˈhɒli] n. 冬青树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hol- (神圣的) + -ly (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵冬青树，它的叶子像"神圣的(hol-)"
    <tspan x="50" dy="25">盾牌，保护着周围的一切，给人一种神圣的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The holly tree's bright red berries added a festive touch to the garden.
  </text>
  <text x="50" y="310" class="content">
    冬青树鲜红的浆果为花园增添了节日气氛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Holly tree -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="150" y1="60" x2="200" y2="60" class="image" />
    <line x1="140" y1="100" x2="210" y2="100" class="image" />
    <line x1="160" y1="140" x2="190" y2="140" class="image" />
    <!-- Holly berries -->
    <circle cx="160" cy="50" r="10" fill="#E74C3C" />
    <circle cx="190" cy="50" r="10" fill="#E74C3C" />
    <circle cx="150" cy="90" r="10" fill="#E74C3C" />
    <circle cx="200" cy="90" r="10" fill="#E74C3C" />
    <circle cx="170" cy="130" r="10" fill="#E74C3C" />
    <circle cx="180" cy="130" r="10" fill="#E74C3C" />
  </g>
</svg>