<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">land-use</text>
  <text x="50" y="120" class="subtitle">[ˈlænd juːs] n. 土地使用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> land (土地) + use (使用)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的土地上，"使用(use)"
    <tspan x="50" dy="25">不同的区域进行农业、建筑和自然保护，</tspan>
    <tspan x="50" dy="25">这就是土地使用(land-use)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city council is planning the land-use for the new development area.
  </text>
  <text x="50" y="310" class="content">
    市议会正在规划新开发区的土地使用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Land -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Agricultural area -->
    <rect x="20" y="20" width="100" height="160" class="image" />
    <text x="60" y="110" class="content" fill="#27AE60">农业</text>
    <!-- Building area -->
    <rect x="140" y="20" width="100" height="160" class="image" />
    <text x="180" y="110" class="content" fill="#F39C12">建筑</text>
    <!-- Natural reserve -->
    <rect x="260" y="20" width="70" height="160" class="image" />
    <text x="285" y="110" class="content" fill="#3498DB">自然</text>
  </g>
</svg>