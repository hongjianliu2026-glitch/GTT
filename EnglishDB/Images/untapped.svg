<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">untapped</text>
  <text x="50" y="120" class="subtitle">[ʌnˈtæpt] adj. 未开发的，未利用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + tap (开发)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广袤的森林，"未被开发(un-tap)"
    <tspan x="50" dy="25">的资源，就像一个巨大的宝藏等待被发现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The region has vast untapped potential for tourism.
  </text>
  <text x="50" y="310" class="content">
    该地区拥有巨大的未开发的旅游潜力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="180" x2="50" y2="100" class="image" />
    <line x1="100" y1="180" x2="100" y2="120" class="image" />
    <line x1="150" y1="180" x2="150" y2="140" class="image" />
    <line x1="200" y1="180" x2="200" y2="160" class="image" />
    <line x1="250" y1="180" x2="250" y2="180" class="image" />
    <line x1="300" y1="180" x2="300" y2="200" class="image" />
    <!-- Untapped sign -->
    <text x="150" y="50" class="highlight" style="font-size: 36px;">Untapped</text>
  </g>
</svg>