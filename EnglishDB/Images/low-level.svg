<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">low-level</text>
  <text x="50" y="120" class="subtitle">[ˈloʊ ˈlɛvəl] adj. 低级的，底层的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> low (低) + level (水平)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个程序员站在一个巨大的楼梯底部，"低水平(low-level)"
    <tspan x="50" dy="25">的位置，处理最基础的代码，这些代码构成了程序的底层(low-level)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He specializes in low-level programming languages.
  </text>
  <text x="50" y="310" class="content">
    他专门研究低级编程语言。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Staircase -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <line x1="50" y1="150" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <line x1="50" y1="50" x2="200" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="200" class="image" />
    <!-- Programmer at the bottom -->
    <circle cx="50" cy="210" r="15" class="image" />
    <line x1="50" y1="225" x2="50" y2="260" class="image" />
    <line x1="50" y1="260" x2="30" y2="290" class="image" />
    <line x1="50" y1="260" x2="70" y2="290" class="image" />
    <line x1="50" y1="240" x2="80" y2="230" class="image" />
  </g>
</svg>