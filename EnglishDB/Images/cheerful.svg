<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F39C12; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #F1C40F; }
      .face { fill: #FFD700; }
      .smile { stroke: #000; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheerful</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɪərfl] adj. 愉快的，高兴的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cheer (愉快) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阳光明媚的日子，"充满愉快(cheer-ful)"
    <tspan x="50" dy="25">的笑容挂在每个人的脸上，整个世界都变得明亮起来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always has a cheerful attitude, no matter what happens.
  </text>
  <text x="50" y="310" class="content">
    无论发生什么，她总是保持着愉快的心态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="sun" />
    <!-- Face -->
    <circle cx="200" cy="100" r="30" class="face" />
    <!-- Eyes -->
    <circle cx="190" cy="90" r="5" class="face" />
    <circle cx="210" cy="90" r="5" class="face" />
    <!-- Smile -->
    <path d="M180,110 Q200,120 220,110" class="smile" />
  </g>
</svg>