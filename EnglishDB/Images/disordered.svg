<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disordered</text>
  <text x="50" y="120" class="subtitle">[dɪsˈɔːrdəd] adj. 混乱的，无序的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + order (顺序)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，所有的东西都被"不(dis-)"按照"顺序(order)"摆放，
    <tspan x="50" dy="25">书本、衣服、玩具散落一地，整个房间显得非常混乱(disordered)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was so disordered that I couldn't find my keys.
  </text>
  <text x="50" y="310" class="content">
    房间太乱了，我找不到我的钥匙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Books -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="40" x2="100" y2="40" class="image" />
    <line x1="50" y1="60" x2="100" y2="60" class="image" />
    <!-- Clothes -->
    <line x1="150" y1="20" x2="200" y2="20" class="image" />
    <line x1="150" y1="40" x2="200" y2="40" class="image" />
    <line x1="150" y1="60" x2="200" y2="60" class="image" />
    <!-- Toys -->
    <circle cx="250" cy="40" r="15" class="image" />
    <circle cx="280" cy="40" r="15" class="image" />
    <circle cx="310" cy="40" r="15" class="image" />
    <!-- Messy lines -->
    <line x1="50" y1="80" x2="300" y2="180" class="image" />
    <line x1="100" y1="80" x2="350" y2="180" class="image" />
    <line x1="150" y1="80" x2="400" y2="180" class="image" />
  </g>
</svg>