<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flame { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ablaze</text>
  <text x="50" y="120" class="subtitle">[əˈbleɪz] adj. 着火的，燃烧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + blaze (火焰)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林被"加强的火焰(a-blaze)"吞噬，
    <tspan x="50" dy="25">整个场景都被火焰照亮，仿佛世界都在燃烧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The forest was ablaze with wildfire.
  </text>
  <text x="50" y="310" class="content">
    森林被野火吞噬，熊熊燃烧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="100" x2="50" y2="180" class="image" />
    <line x1="100" y1="100" x2="100" y2="180" class="image" />
    <line x1="150" y1="100" x2="150" y2="180" class="image" />
    <line x1="200" y1="100" x2="200" y2="180" class="image" />
    <line x1="250" y1="100" x2="250" y2="180" class="image" />
    <!-- Flames -->
    <polygon points="50,100 70,80 90,100" class="flame" />
    <polygon points="100,100 120,80 140,100" class="flame" />
    <polygon points="150,100 170,80 190,100" class="flame" />
    <polygon points="200,100 220,80 240,100" class="flame" />
    <polygon points="250,100 270,80 290,100" class="flame" />
  </g>
</svg>