<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">microcosm</text>
  <text x="50" y="120" class="subtitle">[ˈmaɪkrəˌkɒzəm] n. 微观世界，缩影</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> micro- (小) + cosmos (世界)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微小的玻璃球，里面装着整个世界，
    <tspan x="50" dy="25">"小(micro)" 却 "完整(cosmos)"，这就是微观世界(microcosm)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The classroom is a microcosm of society.
  </text>
  <text x="50" y="310" class="content">
    教室是社会的缩影。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass ball -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Miniature world inside the ball -->
    <circle cx="100" cy="100" r="70" fill="#E8F6F3" />
    <circle cx="100" cy="100" r="60" fill="#D5DBDB" />
    <circle cx="100" cy="100" r="50" fill="#E8F6F3" />
    <circle cx="100" cy="100" r="40" fill="#D5DBDB" />
    <circle cx="100" cy="100" r="30" fill="#E8F6F3" />
    <circle cx="100" cy="100" r="20" fill="#D5DBDB" />
    <circle cx="100" cy="100" r="10" fill="#E8F6F3" />
  </g>
</svg>