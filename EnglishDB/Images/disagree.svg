<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disagree</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈɡriː] v. 不同意，不一致</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + agree (同意)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，一个人说"同意(agree)"，
    <tspan x="50" dy="25">另一个人却摇头说"不(dis-)"，这就是不同意(disagree)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They often disagree on political issues.
  </text>
  <text x="50" y="310" class="content">
    他们在政治问题上经常意见不合。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person 1 -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <text x="40" y="250" class="content">同意</text>

    <!-- Person 2 -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="250" y1="130" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="220" y2="220" class="image" />
    <line x1="250" y1="180" x2="280" y2="220" class="image" />
    <line x1="250" y1="150" x2="220" y2="140" class="image" />
    <line x1="250" y1="150" x2="280" y2="140" class="image" />
    <text x="240" y="250" class="content">不同意</text>

    <!-- Disagreement symbol -->
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <line x1="140" y1="150" x2="160" y2="150" class="image" />
  </g>
</svg>