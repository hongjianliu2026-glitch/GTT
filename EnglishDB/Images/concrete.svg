<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">concrete</text>
  <text x="50" y="120" class="subtitle">[ˈkɒŋkriːt] adj. 具体的，实在的；n. 混凝土</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + crete (生长)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆沙子和石头"一起生长(con-crete)"，
    <tspan x="50" dy="25">它们混合在一起就变成了坚固的混凝土(concrete)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The foundation of the building is made of concrete.
  </text>
  <text x="50" y="310" class="content">
    这座建筑的地基是用混凝土建造的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Concrete block -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sand and stones -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Mixing -->
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <!-- Concrete result -->
    <rect x="50" y="180" width="250" height="20" class="image" />
  </g>
</svg>