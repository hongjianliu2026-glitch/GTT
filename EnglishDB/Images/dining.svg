<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dining</text>
  <text x="50" y="120" class="subtitle">[ˈdaɪnɪŋ] n. 进餐，用餐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> din (吃饭) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在餐厅里，"正在进行(ing)"
    <tspan x="50" dy="25">吃饭(din)，这就是用餐(dining)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They enjoyed a pleasant dining experience at the new restaurant.
  </text>
  <text x="50" y="310" class="content">
    他们在新餐厅享受了一次愉快的用餐体验。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Plates -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Utensils -->
    <line x1="70" y1="80" x2="70" y2="120" class="image" />
    <line x1="80" y1="100" x2="100" y2="100" class="image" />
    <line x1="170" y1="80" x2="170" y2="120" class="image" />
    <line x1="180" y1="100" x2="200" y2="100" class="image" />
    <line x1="270" y1="80" x2="270" y2="120" class="image" />
    <line x1="280" y1="100" x2="300" y2="100" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
  </g>
</svg>