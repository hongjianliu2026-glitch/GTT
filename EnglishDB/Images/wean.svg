<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wean</text>
  <text x="50" y="120" class="subtitle">[wiːn] v. 使断奶，使戒掉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wean (源自中古英语 weanen，意为“使断奶”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个母亲温柔地"使(wean)"她的孩子从奶瓶转向杯子，
    <tspan x="50" dy="25">帮助孩子逐渐断奶，这个过程就是wean。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to wean her baby at six months.
  </text>
  <text x="50" y="310" class="content">
    她决定在六个月大时给她的宝宝断奶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="140" x2="30" y2="130" class="image" />
    <line x1="50" y1="140" x2="70" y2="130" class="image" />
    <line x1="50" y1="160" x2="30" y2="180" class="image" />
    <line x1="50" y1="160" x2="70" y2="180" class="image" />

    <!-- Baby -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="140" class="image" />
    <line x1="150" y1="140" x2="130" y2="160" class="image" />
    <line x1="150" y1="140" x2="170" y2="160" class="image" />

    <!-- Bottle -->
    <rect x="135" y="70" width="30" height="30" class="image" />
    <line x1="150" y1="70" x2="150" y2="50" class="image" />

    <!-- Cup -->
    <rect x="135" y="170" width="30" height="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="150" class="image" />
  </g>
</svg>