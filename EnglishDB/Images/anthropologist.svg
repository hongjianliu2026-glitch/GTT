<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anthropologist</text>
  <text x="50" y="120" class="subtitle">[ˌænθrəˈpɑːlədʒɪst] n. 人类学家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anthropo- (人类) + -logist (学者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着放大镜的学者，"研究人类(anthropo-logist)"
    <tspan x="50" dy="25">的各个方面，从古代到现代，从文化到生物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The anthropologist studied the ancient tribes in the Amazon.
  </text>
  <text x="50" y="310" class="content">
    这位人类学家研究了亚马逊的古代部落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Anthropologist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Magnifying glass -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="120" y1="100" x2="150" y2="100" class="image" />
    <!-- Human figure -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>