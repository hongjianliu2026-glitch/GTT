<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spinal</text>
  <text x="50" y="120" class="subtitle">[ˈspaɪnl] adj. 脊椎的，脊柱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spin (脊椎) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"脊椎(spin)"
    <tspan x="50" dy="25">像一根笔直的柱子，支撑着整个身体，这就是脊柱(spinal)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffered a spinal injury in the accident.
  </text>
  <text x="50" y="310" class="content">
    他在事故中受了脊椎伤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spinal column -->
    <line x1="50" y1="20" x2="50" y2="200" class="image" />
    <circle cx="50" cy="40" r="10" class="image" />
    <circle cx="50" cy="80" r="10" class="image" />
    <circle cx="50" cy="120" r="10" class="image" />
    <circle cx="50" cy="160" r="10" class="image" />
    <circle cx="50" cy="200" r="10" class="image" />
    <!-- Person -->
    <circle cx="50" cy="220" r="20" class="image" />
    <line x1="50" y1="240" x2="50" y2="300" class="image" />
    <line x1="50" y1="300" x2="30" y2="350" class="image" />
    <line x1="50" y1="300" x2="70" y2="350" class="image" />
    <line x1="50" y1="260" x2="30" y2="280" class="image" />
    <line x1="50" y1="260" x2="70" y2="280" class="image" />
  </g>
</svg>