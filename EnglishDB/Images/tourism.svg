<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tourism</text>
  <text x="50" y="120" class="subtitle">[ˈtʊərɪzəm] n. 旅游业</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tour (旅行) + -ism (表示行为或状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群游客在世界各地"旅行(tour)"，
    <tspan x="50" dy="25">他们的行为和状态构成了"旅游业(tourism)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The growth of tourism has boosted the local economy.
  </text>
  <text x="50" y="310" class="content">
    旅游业的增长促进了当地经济的发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="75" class="image" />
    <!-- Tourists -->
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="175" cy="150" r="15" class="image" />
    <!-- Camera -->
    <rect x="150" y="20" width="50" height="30" class="image" />
    <line x1="175" y1="50" x2="175" y2="70" class="image" />
    <!-- Bag -->
    <rect x="220" y="20" width="30" height="30" class="image" />
    <!-- Plane -->
    <line x1="50" y1="100" x2="200" y2="100" class="image" />
    <line x1="50" y1="100" x2="70" y2="80" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <line x1="200" y1="100" x2="180" y2="80" class="image" />
    <line x1="200" y1="100" x2="180" y2="120" class="image" />
  </g>
</svg>