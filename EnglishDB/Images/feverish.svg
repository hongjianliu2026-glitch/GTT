<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feverish</text>
  <text x="50" y="120" class="subtitle">[ˈfiːvərɪʃ] adj. 发烧的，狂热的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fever (发烧) + -ish (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为发烧而满脸通红，"发烧(fever)"
    <tspan x="50" dy="25">的状态让他变得"狂热(ish)"，无法冷静下来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt feverish and decided to take a rest.
  </text>
  <text x="50" y="310" class="content">
    她感到发烧，决定休息一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FF6347" />
    <!-- Red cheeks -->
    <circle cx="70" cy="80" r="10" class="image" fill="#FF4500" />
    <circle cx="130" cy="80" r="10" class="image" fill="#FF4500" />
    <!-- Sweat drops -->
    <circle cx="90" cy="120" r="5" class="image" fill="#8B4513" />
    <circle cx="110" cy="120" r="5" class="image" fill="#8B4513" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" fill="#000000" />
    <circle cx="120" cy="90" r="5" class="image" fill="#000000" />
    <!-- Mouth -->
    <path d="M 70 110 Q 100 130 130 110" class="image" fill="none" stroke="#000000" />
  </g>
</svg>