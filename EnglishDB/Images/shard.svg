<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shard</text>
  <text x="50" y="120" class="subtitle">[ʃɑːrd] n. 碎片，破片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shard (源自中古英语 "scharre"，意为碎片)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的陶罐被打碎，"碎片(shard)"
    <tspan x="50" dy="25">散落一地，每一片都闪烁着历史的痕迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The archaeologist found shards of pottery at the site.
  </text>
  <text x="50" y="310" class="content">
    考古学家在遗址发现了陶器的碎片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken pot -->
    <path d="M50 50 Q100 20 150 50 T250 50" class="image" />
    <path d="M50 100 Q100 130 150 100 T250 100" class="image" />
    <path d="M50 150 Q100 180 150 150 T250 150" class="image" />
    <!-- Shards -->
    <line x1="70" y1="60" x2="100" y2="90" class="image" />
    <line x1="120" y1="60" x2="150" y2="90" class="image" />
    <line x1="170" y1="60" x2="200" y2="90" class="image" />
    <line x1="70" y1="110" x2="100" y2="140" class="image" />
    <line x1="120" y1="110" x2="150" y2="140" class="image" />
    <line x1="170" y1="110" x2="200" y2="140" class="image" />
    <line x1="70" y1="160" x2="100" y2="190" class="image" />
    <line x1="120" y1="160" x2="150" y2="190" class="image" />
    <line x1="170" y1="160" x2="200" y2="190" class="image" />
  </g>
</svg>