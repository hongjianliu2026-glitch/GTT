<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orchestrate</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrkɪstreɪt] v. 精心安排，策划</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> orche- (舞蹈) + -strate (安排)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位指挥家在舞台上，"精心安排(orchestrate)"
    <tspan x="50" dy="25">每一个音符和舞者的动作，就像在编排一场盛大的舞蹈。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She orchestrated the entire event with precision.
  </text>
  <text x="50" y="310" class="content">
    她精心策划了整个活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Conductor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Baton -->
    <line x1="20" y1="115" x2="70" y2="80" class="image" />
    <!-- Music notes -->
    <circle cx="100" cy="80" r="10" class="image" />
    <line x1="100" y1="90" x2="120" y2="110" class="image" />
    <circle cx="130" cy="100" r="10" class="image" />
    <line x1="130" y1="110" x2="150" y2="90" class="image" />
    <!-- Dancers -->
    <line x1="180" y1="100" x2="200" y2="120" class="image" />
    <line x1="180" y1="100" x2="160" y2="120" class="image" />
    <line x1="180" y1="100" x2="180" y2="140" class="image" />
    <line x1="220" y1="100" x2="240" y2="120" class="image" />
    <line x1="220" y1="100" x2="200" y2="120" class="image" />
    <line x1="220" y1="100" x2="220" y2="140" class="image" />
  </g>
</svg>