<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">distance</text>
  <text x="50" y="120" class="subtitle">[ˈdɪstəns] n. 距离，远处</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + -stance (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人站在"分开(dis-)"的地方，他们之间的"站立(stance)"
    <tspan x="50" dy="25">位置就是距离(distance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The distance between the two cities is 500 kilometers.
  </text>
  <text x="50" y="310" class="content">
    这两个城市之间的距离是500公里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people standing apart -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />

    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="330" y2="120" class="image" />

    <!-- Distance line -->
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <text x="175" y="90" class="content" text-anchor="middle">distance</text>
  </g>
</svg>