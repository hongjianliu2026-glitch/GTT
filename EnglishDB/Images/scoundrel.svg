<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scoundrel</text>
  <text x="50" y="120" class="subtitle">[ˈskaʊndrəl] n. 恶棍，无赖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scound (坏) + rel (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"坏人(scound-rel)"在街头，
    <tspan x="50" dy="25">他偷了老太太的钱包，还朝她做鬼脸。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scoundrel stole the old lady's purse.
  </text>
  <text x="50" y="310" class="content">
    那个恶棍偷了老太太的钱包。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Old lady -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Scoundrel -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <!-- Purse -->
    <rect x="250" y="120" width="30" height="20" class="image" />
    <line x1="265" y1="120" x2="265" y2="100" class="image" />
    <!-- Money -->
    <line x1="255" y1="130" x2="275" y2="130" class="image" />
    <line x1="255" y1="140" x2="275" y2="140" class="image" />
    <line x1="255" y1="150" x2="275" y2="150" class="image" />
  </g>
</svg>