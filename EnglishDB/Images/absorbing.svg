<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">absorbing</text>
  <text x="50" y="120" class="subtitle">[əbˈsɔːrbɪŋ] adj. 吸引人的，引人入胜的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + sorb (吸收)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人完全被一本书"吸收(absorb)"了，
    <tspan x="50" dy="25">他的注意力完全被书中的内容吸引，仿佛被吸进了书里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The novel was so absorbing that I forgot the time.
  </text>
  <text x="50" y="310" class="content">
    这本小说太吸引人了，以至于我忘记了时间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="60" x2="180" y2="60" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="20" y1="140" x2="180" y2="140" class="image" />
    <line x1="20" y1="180" x2="180" y2="180" class="image" />
    <line x1="20" y1="220" x2="180" y2="220" class="image" />
    <line x1="20" y1="260" x2="180" y2="260" class="image" />
    <!-- Person absorbed in the book -->
    <circle cx="100" cy="350" r="20" class="image" />
    <line x1="100" y1="370" x2="100" y2="420" class="image" />
    <line x1="100" y1="420" x2="80" y2="450" class="image" />
    <line x1="100" y1="420" x2="120" y2="450" class="image" />
    <line x1="100" y1="390" x2="70" y2="380" class="image" />
    <line x1="100" y1="390" x2="130" y2="380" class="image" />
  </g>
</svg>