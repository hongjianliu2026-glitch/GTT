<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">robin</text>
  <text x="50" y="120" class="subtitle">[ˈrɒbɪn] n. 知更鸟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rob (红色) + in (在...里面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只知更鸟，它的胸前有一块"红色(rob)"的羽毛，
    <tspan x="50" dy="25">就像一个小红点"在...里面(in)"，这就是知更鸟(robin)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The robin sang sweetly in the morning.
  </text>
  <text x="50" y="310" class="content">
    知更鸟在早晨甜美地歌唱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robin bird -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="80" r="10" class="image" fill="#E74C3C" />
    <line x1="100" y1="110" x2="100" y2="150" class="image" />
    <line x1="100" y1="130" x2="70" y2="120" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <line x1="100" y1="150" x2="70" y2="180" class="image" />
    <line x1="100" y1="150" x2="130" y2="180" class="image" />
  </g>
</svg>