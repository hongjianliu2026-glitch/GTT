<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gap</text>
  <text x="50" y="120" class="subtitle">[ɡæp] n. 缺口，间隔，差距</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> g- (表示“去”) + ap (表示“接近”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图"去接近(g-ap)"某个目标，
    <tspan x="50" dy="25">但中间有一道无法跨越的"缺口(gap)"，</tspan>
    <tspan x="50" dy="25">这个缺口象征着差距和障碍。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There was a gap in the fence where the dog could escape.
  </text>
  <text x="50" y="310" class="content">
    篱笆上有一个缺口，狗可以从那里逃出去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fence -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <line x1="0" y1="60" x2="350" y2="60" class="image" />
    <line x1="0" y1="80" x2="350" y2="80" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Gap in the fence -->
    <line x1="150" y1="0" x2="150" y2="100" class="image" />
    <line x1="200" y1="0" x2="200" y2="100" class="image" />
    <!-- Dog -->
    <circle cx="175" cy="120" r="15" class="image" />
    <line x1="175" y1="135" x2="175" y2="170" class="image" />
    <line x1="175" y1="170" x2="155" y2="200" class="image" />
    <line x1="175" y1="170" x2="195" y2="200" class="image" />
    <line x1="175" y1="150" x2="205" y2="140" class="image" />
  </g>
</svg>