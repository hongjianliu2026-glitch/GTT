<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unambiguous</text>
  <text x="50" y="120" class="subtitle">[ˌʌnæmˈbɪɡjuəs] adj. 明确的，不含糊的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + ambiguous (含糊的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个清晰的指示牌，上面写着"明确(unambiguous)"
    <tspan x="50" dy="25">的方向，没有任何歧义，让人一眼就能明白。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The instructions were unambiguous, so everyone knew exactly what to do.
  </text>
  <text x="50" y="310" class="content">
    指示非常明确，所以每个人都知道该做什么。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clear sign -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <text x="150" y="110" class="content" style="font-size: 36px; fill: #16A085;">CLEAR</text>
    <!-- Arrows -->
    <line x1="100" y1="150" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="130" class="image" />
    <line x1="200" y1="150" x2="180" y2="170" class="image" />
  </g>
</svg>