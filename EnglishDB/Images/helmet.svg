<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">helmet</text>
  <text x="50" y="120" class="subtitle">[ˈhelmɪt] n. 头盔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> helm (头) + et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的骑士，戴着"小头(helm-et)"
    <tspan x="50" dy="25">盔，保护自己的头部，这就是头盔(helmet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldier wore a helmet to protect his head.
  </text>
  <text x="50" y="310" class="content">
    士兵戴着头盔保护头部。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Helmet -->
    <circle cx="100" cy="100" r="50" class="image" />
    <rect x="50" y="100" width="100" height="50" class="image" />
    <!-- Face -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="80" y1="160" x2="120" y2="160" class="image" />
    <line x1="90" y1="170" x2="110" y2="170" class="image" />
    <!-- Body -->
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="70" y2="210" class="image" />
    <line x1="100" y1="190" x2="130" y2="210" class="image" />
  </g>
</svg>