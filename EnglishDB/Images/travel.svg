<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">travel</text>
  <text x="50" y="120" class="subtitle">[ˈtrævəl] v. 旅行，移动；n. 旅行</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tra- (穿过) + vel (快速)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人快速地"穿过(tra-)"各种地形，
    <tspan x="50" dy="25">从城市到乡村，从山脉到海洋，这就是旅行(travel)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to travel and explore new places.
  </text>
  <text x="50" y="310" class="content">
    她喜欢旅行并探索新地方。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Mountains -->
    <polyline points="50,100 70,50 90,100 110,50 130,100" class="image" />
    <!-- Sea -->
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <circle cx="170" cy="110" r="5" class="image" />
    <circle cx="190" cy="115" r="5" class="image" />
    <circle cx="210" cy="110" r="5" class="image" />
    <!-- Person -->
    <circle cx="30" cy="90" r="10" class="image" />
    <line x1="30" y1="100" x2="30" y2="130" class="image" />
    <line x1="30" y1="130" x2="20" y2="150" class="image" />
    <line x1="30" y1="130" x2="40" y2="150" class="image" />
    <line x1="30" y1="110" x2="50" y2="100" class="image" />
  </g>
</svg>