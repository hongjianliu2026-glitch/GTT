<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nuke</text>
  <text x="50" y="120" class="subtitle">[njuːk] n. 核武器；v. 用核武器攻击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nuke (源自 nuclear，核的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蘑菇云从地面升起，"核(nuke)"
    <tspan x="50" dy="25">武器的威力瞬间摧毁了一切，这就是"核攻击(nuke)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The country threatened to nuke its enemy.
  </text>
  <text x="50" y="310" class="content">
    这个国家威胁要用核武器攻击敌人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mushroom cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <ellipse cx="175" cy="50" rx="100" ry="50" class="image" />
    <ellipse cx="175" cy="20" rx="50" ry="20" class="image" />
    <!-- Ground -->
    <rect x="0" y="170" width="350" height="30" class="image" />
    <!-- Explosion -->
    <circle cx="175" cy="170" r="10" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="175" y1="170" x2="150" y2="200" class="image" />
    <line x1="175" y1="170" x2="200" y2="200" class="image" />
    <line x1="175" y1="170" x2="135" y2="185" class="image" />
    <line x1="175" y1="170" x2="215" y2="185" class="image" />
  </g>
</svg>