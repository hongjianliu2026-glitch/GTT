<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delete</text>
  <text x="50" y="120" class="subtitle">[dɪˈliːt] v. 删除，擦去</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + lete (擦去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个文件被"擦去(lete)"，"离开(de-)"了屏幕，
    <tspan x="50" dy="25">就像被魔术师变没了一样，这就是删除(delete)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He accidentally deleted the important file.
  </text>
  <text x="50" y="310" class="content">
    他不小心删除了重要的文件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Computer screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- File -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <!-- Erasing effect -->
    <line x1="150" y1="20" x2="250" y2="120" class="image" />
    <line x1="150" y1="120" x2="250" y2="20" class="image" />
    <!-- Magic wand -->
    <line x1="300" y1="20" x2="350" y2="120" class="image" />
    <line x1="300" y1="120" x2="350" y2="20" class="image" />
    <circle cx="325" cy="70" r="10" class="image" />
  </g>
</svg>