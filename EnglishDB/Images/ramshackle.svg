<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ramshackle</text>
  <text x="50" y="120" class="subtitle">[ˈræmˌʃækəl] adj. 摇摇欲坠的，破烂的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ram (撞击) + shac (摇晃) + le (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一栋房子，"被撞击(ram)"后"摇晃(shac)"得快要倒塌，
    <tspan x="50" dy="25">这就是ramshackle(摇摇欲坠的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house was in a ramshackle condition.
  </text>
  <text x="50" y="310" class="content">
    那栋老房子状况很差，摇摇欲坠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Roof -->
    <polygon points="175,20 50,100 300,100" class="image" />
    <!-- Windows -->
    <rect x="70" y="50" width="50" height="50" class="image" />
    <rect x="230" y="50" width="50" height="50" class="image" />
    <!-- Door -->
    <rect x="150" y="120" width="50" height="80" class="image" />
    <!-- Cracks -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="200" class="image" />
    <line x1="50" y1="100" x2="175" y2="20" class="image" />
    <line x1="300" y1="100" x2="175" y2="20" class="image" />
    <!-- Swaying effect -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="350" y1="0" x2="0" y2="200" class="image" />
  </g>
</svg>