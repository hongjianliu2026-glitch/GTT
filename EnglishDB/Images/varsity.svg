<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">varsity</text>
  <text x="50" y="120" class="subtitle">[ˈvɑːrsəti] n. 大学代表队，校队</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> var- (变体) + -sity (集合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一所大学里，各种"变体(var-)"的学生集合(sity)
    <tspan x="50" dy="25">在一起，组成了一个强大的校队(varsity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He made the varsity basketball team.
  </text>
  <text x="50" y="310" class="content">
    他入选了校篮球队。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- University building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Students -->
    <circle cx="70" cy="50" r="15" class="image" />
    <circle cx="120" cy="50" r="15" class="image" />
    <circle cx="170" cy="50" r="15" class="image" />
    <circle cx="220" cy="50" r="15" class="image" />
    <circle cx="270" cy="50" r="15" class="image" />
    <!-- Basketball court -->
    <line x1="70" y1="80" x2="280" y2="80" class="image" />
    <line x1="70" y1="110" x2="250" y2="110" class="image" />
    <line x1="70" y1="140" x2="270" y2="140" class="image" />
    <line x1="70" y1="170" x2="240" y2="170" class="image" />
    <!-- Basketball hoop -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
  </g>
</svg>