<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">altar</text>
  <text x="50" y="120" class="subtitle">[ˈɔːltər] n. 祭坛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> alt- (高) + -ar (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个高高的(alt-)祭坛(altar)，上面摆放着神圣的物品，
    <tspan x="50" dy="25">人们在这里进行宗教仪式。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The priest placed the offering on the altar.
  </text>
  <text x="50" y="310" class="content">
    牧师把祭品放在祭坛上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Altar -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Sacred items -->
    <circle cx="100" cy="75" r="20" class="image" />
    <line x1="80" y1="100" x2="120" y2="100" class="image" />
    <line x1="90" y1="110" x2="110" y2="110" class="image" />
    <line x1="100" y1="120" x2="100" y2="130" class="image" />
  </g>
</svg>