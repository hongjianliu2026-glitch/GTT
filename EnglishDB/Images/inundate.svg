<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inundate</text>
  <text x="50" y="120" class="subtitle">[ˈɪnəndeɪt] v. 淹没，泛滥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + und (波浪) + ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场大雨过后，"波浪(und)"涌入(in-)城市，
    <tspan x="50" dy="25">街道被淹没(inundate)，水位迅速上升。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city was inundated by the heavy rain.
  </text>
  <text x="50" y="310" class="content">
    这座城市被大雨淹没了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- City -->
    <rect x="50" y="120" width="250" height="60" class="image" />
    <rect x="70" y="140" width="30" height="40" class="image" />
    <rect x="120" y="140" width="30" height="40" class="image" />
    <rect x="170" y="140" width="30" height="40" class="image" />
    <rect x="220" y="140" width="30" height="40" class="image" />
    <!-- Waves -->
    <path d="M0 20 Q50 40, 100 20 T200 20" class="image" />
    <path d="M0 40 Q50 60, 100 40 T200 40" class="image" />
    <path d="M0 60 Q50 80, 100 60 T200 60" class="image" />
  </g>
</svg>