<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">basin</text>
  <text x="50" y="120" class="subtitle">[ˈbeɪsɪn] n. 盆地，水槽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bas (低) + in (在...中)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的盆地(basin)，"低洼(bas)"
    <tspan x="50" dy="25">的地方，水流汇聚其中，形成一个深邃的盆地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The river flows into a large basin.
  </text>
  <text x="50" y="310" class="content">
    这条河流流入一个巨大的盆地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Basin -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Water -->
    <ellipse cx="175" cy="120" rx="130" ry="55" class="image" fill="#3498DB" />
    <!-- River -->
    <line x1="50" y1="150" x2="175" y2="120" class="image" />
    <line x1="100" y1="140" x2="175" y2="120" class="image" />
    <line x1="150" y1="130" x2="175" y2="120" class="image" />
  </g>
</svg>