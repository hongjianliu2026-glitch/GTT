<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reposition</text>
  <text x="50" y="120" class="subtitle">[ˌriːpəˈzɪʃən] v. 重新定位，重新安置</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + position (位置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的箭头从地面升起，"再次定位(re-position)"
    <tspan x="50" dy="25">到一个新的位置，这个动作就是重新定位(reposition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to reposition its products in the market.
  </text>
  <text x="50" y="310" class="content">
    公司决定重新定位其产品在市场中的位置。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arrow -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <polygon points="30,50 70,50 50,30" class="image" />
    <polygon points="30,200 70,200 50,220" class="image" />
    <!-- New position -->
    <circle cx="50" cy="250" r="20" class="image" />
    <text x="40" y="260" class="content" fill="#2980B9">New</text>
  </g>
</svg>