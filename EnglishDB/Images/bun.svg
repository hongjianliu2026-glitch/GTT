<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bun</text>
  <text x="50" y="120" class="subtitle">[bʌn] n. 小圆面包，发髻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bun (源自中古英语“bunne”，意为“小圆面包”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个可爱的小圆面包(bun)，它圆圆的形状和柔软的质地让人忍不住想咬一口。
    <tspan x="50" dy="25">或者想象一个女孩把头发盘成一个发髻(bun)，看起来既整洁又可爱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She bought a fresh bun from the bakery.
  </text>
  <text x="50" y="310" class="content">
    她从面包店买了一个新鲜的小圆面包。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" stroke="#D35400" stroke-width="3" />
    <!-- Hair bun -->
    <circle cx="300" cy="100" r="50" fill="#D2B4DE" stroke="#8E44AD" stroke-width="3" />
    <!-- Girl with hair bun -->
    <circle cx="300" cy="200" r="30" fill="#F5B7B1" stroke="#E74C3C" stroke-width="2" />
    <line x1="280" y1="230" x2="320" y2="230" stroke="#E74C3C" stroke-width="2" />
    <line x1="290" y1="230" x2="290" y2="260" stroke="#E74C3C" stroke-width="2" />
    <line x1="310" y1="230" x2="310" y2="260" stroke="#E74C3C" stroke-width="2" />
  </g>
</svg>