<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">apologetically</text>
  <text x="50" y="120" class="subtitle">[əˌpɒləˈdʒetɪkli] adv. 道歉地，辩解地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> apo- (离开) + log (说) + -etic (形容词后缀) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在道歉时，"离开(apo-)"原来的立场，"说(log)"出自己的歉意，
    <tspan x="50" dy="25">这种行为就是"道歉地(apologetically)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spoke apologetically for his mistake.
  </text>
  <text x="50" y="310" class="content">
    他为自己的错误道歉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person bowing -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="20" y2="80" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Speech bubble -->
    <path d="M 100 30 Q 150 30 150 70 Q 150 110 100 110 Q 50 110 50 70 Q 50 30 100 30 Z" class="image" />
    <text x="105" y="75" class="content">Sorry!</text>
  </g>
</svg>