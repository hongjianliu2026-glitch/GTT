<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wellness</text>
  <text x="50" y="120" class="subtitle">[ˈwɛlnəs] n. 健康，幸福</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> well (好) + ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在阳光下，"好(well)"的状态就是"健康(wellness)"。
    <tspan x="50" dy="25">他享受着阳光，感觉无比幸福。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Regular exercise is essential for physical wellness.
  </text>
  <text x="50" y="310" class="content">
    定期锻炼对身体健康至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Person -->
    <circle cx="200" cy="150" r="20" fill="#2ECC71" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="190" x2="170" y2="180" class="image" />
    <line x1="200" y1="190" x2="230" y2="180" class="image" />
    <!-- Ground -->
    <rect x="0" y="250" width="400" height="50" fill="#2C3E50" />
  </g>
</svg>