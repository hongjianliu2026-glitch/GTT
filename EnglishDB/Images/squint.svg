<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">squint</text>
  <text x="50" y="120" class="subtitle">[skwɪnt] v. 眯眼看，斜视；n. 斜视</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> squint (源自中古英语，意为斜视)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在阳光下眯着眼睛，"斜视(squint)"
    <tspan x="50" dy="25">看远处的物体，因为光线太强，眼睛不得不眯成一条缝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She squinted at the bright sun.
  </text>
  <text x="50" y="310" class="content">
    她对着明亮的太阳眯起了眼睛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <line x1="70" y1="90" x2="90" y2="90" class="image" />
    <line x1="110" y1="90" x2="130" y2="90" class="image" />
    <!-- Squinted eyes -->
    <line x1="75" y1="95" x2="85" y2="95" class="image" />
    <line x1="115" y1="95" x2="125" y2="95" class="image" />
    <!-- Sun -->
    <circle cx="200" cy="50" r="30" class="image" />
    <line x1="200" y1="20" x2="200" y2="80" class="image" />
    <line x1="170" y1="50" x2="230" y2="50" class="image" />
    <line x1="185" y1="35" x2="215" y2="65" class="image" />
    <line x1="185" y1="65" x2="215" y2="35" class="image" />
  </g>
</svg>