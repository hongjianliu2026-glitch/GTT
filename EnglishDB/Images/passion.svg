<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">passion</text>
  <text x="50" y="120" class="subtitle">[ˈpæʃən] n. 激情，热情</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pass (忍受) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在忍受(pass)着内心的火焰，
    <tspan x="50" dy="25">这种强烈的情感就是激情(passion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a great passion for painting.
  </text>
  <text x="50" y="310" class="content">
    她对绘画有着极大的热情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Flame -->
    <polygon points="40,30 30,50 50,50" class="image" />
    <polygon points="40,30 30,40 50,40" class="image" />
    <polygon points="40,30 30,30 50,30" class="image" />
  </g>
</svg>