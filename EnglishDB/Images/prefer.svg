<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prefer</text>
  <text x="50" y="120" class="subtitle">[prɪˈfɜːr] v. 更喜欢，宁愿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + fer (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在选择食物，其中一个人"提前拿(pre-fer)"
    <tspan x="50" dy="25">了他更喜欢的食物，这就是"更喜欢(prefer)"的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I prefer coffee over tea.
  </text>
  <text x="50" y="310" class="content">
    我更喜欢咖啡而不是茶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <!-- Food choices -->
    <rect x="30" y="130" width="40" height="30" class="image" />
    <rect x="180" y="130" width="40" height="30" class="image" />
    <!-- Hand reaching for preferred food -->
    <line x1="50" y1="120" x2="60" y2="145" class="image" />
    <line x1="60" y1="145" x2="70" y2="145" class="image" />
  </g>
</svg>