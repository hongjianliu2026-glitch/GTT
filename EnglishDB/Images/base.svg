<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">base</text>
  <text x="50" y="120" class="subtitle">[beɪs] n. 基础，底部；v. 基于</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bas (底部)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高耸的建筑，它的"底部(base)"
    <tspan x="50" dy="25">是整个结构的基础，没有它，建筑就会倒塌。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The theory is based on extensive research.
  </text>
  <text x="50" y="310" class="content">
    这个理论是基于广泛的研究。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Base -->
    <rect x="0" y="150" width="300" height="50" class="image" />
    <!-- Building -->
    <rect x="100" y="0" width="100" height="150" class="image" />
    <!-- Window -->
    <rect x="120" y="30" width="20" height="20" class="image" />
    <rect x="160" y="30" width="20" height="20" class="image" />
    <rect x="120" y="70" width="20" height="20" class="image" />
    <rect x="160" y="70" width="20" height="20" class="image" />
    <rect x="120" y="110" width="20" height="20" class="image" />
    <rect x="160" y="110" width="20" height="20" class="image" />
  </g>
</svg>