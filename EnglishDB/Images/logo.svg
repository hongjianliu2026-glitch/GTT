<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">logo</text>
  <text x="50" y="120" class="subtitle">[ˈloʊɡoʊ] n. 标识，商标</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> log (言，说) + -o (表示名词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个公司用一个"说(log)"出来的标志(logo)，
    <tspan x="50" dy="25">这个标志就像公司的代言人，代表公司的形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's logo is easily recognizable.
  </text>
  <text x="50" y="310" class="content">
    这家公司的标识很容易辨认。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Logo -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="175" x2="50" y2="175" class="image" />
    <line x1="100" y1="175" x2="150" y2="175" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="250" class="image" />
    <!-- Speech bubble -->
    <path d="M100,50 Q150,25 200,50 Q150,75 100,50" class="image" />
    <text x="120" y="60" class="content">说</text>
  </g>
</svg>