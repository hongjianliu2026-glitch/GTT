<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acidity</text>
  <text x="50" y="120" class="subtitle">[əˈsɪdəti] n. 酸度，酸性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> acid (酸) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个实验室里，一瓶"酸(acid)"
    <tspan x="50" dy="25">正在冒泡，发出"嘶嘶"声，这就是酸度(acidity)的体现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The acidity of the lemon juice was too high.
  </text>
  <text x="50" y="310" class="content">
    柠檬汁的酸度太高了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flask -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Bubbles -->
    <circle cx="75" cy="100" r="10" class="image" />
    <circle cx="50" cy="120" r="8" class="image" />
    <circle cx="100" cy="130" r="6" class="image" />
    <circle cx="60" cy="150" r="5" class="image" />
    <circle cx="90" cy="170" r="4" class="image" />
    <!-- Acid -->
    <text x="160" y="100" class="content" style="font-size: 36px; fill: #C0392B;">酸</text>
  </g>
</svg>