<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">motto</text>
  <text x="50" y="120" class="subtitle">[ˈmɒtəʊ] n. 座右铭，格言</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mot (移动) + -to (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在移动(mot)的过程中，心中始终铭记着一句格言(motto)，
    <tspan x="50" dy="25">这句格言就像指南针一样指引着他前进的方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> "Carpe diem" is their motto.
  </text>
  <text x="50" y="310" class="content">
    "及时行乐"是他们的座右铭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compass -->
    <circle cx="175" cy="100" r="70" class="image" />
    <line x1="175" y1="30" x2="175" y2="170" class="image" />
    <line x1="105" y1="100" x2="245" y2="100" class="image" />
    <!-- Motto -->
    <text x="130" y="250" class="content">"Carpe diem"</text>
    <!-- Person -->
    <circle cx="175" cy="300" r="20" class="image" />
    <line x1="175" y1="320" x2="175" y2="360" class="image" />
    <line x1="175" y1="360" x2="155" y2="400" class="image" />
    <line x1="175" y1="360" x2="195" y2="400" class="image" />
    <line x1="175" y1="340" x2="135" y2="350" class="image" />
    <line x1="175" y1="340" x2="215" y2="350" class="image" />
  </g>
</svg>