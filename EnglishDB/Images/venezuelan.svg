<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Venezuelan</text>
  <text x="50" y="120" class="subtitle">[ˌvɛnəˈzweɪlən] adj. 委内瑞拉的；n. 委内瑞拉人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Venezuelan (源自委内瑞拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热情的委内瑞拉人，戴着宽边帽，站在
    <tspan x="50" dy="25">阳光明媚的加拉加斯街头，手里拿着一杯热巧克力，</tspan>
    <tspan x="50" dy="25">这就是典型的Venezuelan形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Venezuelan cuisine is known for its rich flavors.
  </text>
  <text x="50" y="310" class="content">
    委内瑞拉美食以其丰富的味道而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hat -->
    <path d="M 0 0 L 50 0 L 75 25 L 50 50 L 0 50 Z" class="image" />
    <!-- Face -->
    <circle cx="37.5" cy="60" r="20" class="image" />
    <!-- Sun -->
    <circle cx="200" cy="50" r="30" class="image" />
    <!-- Street -->
    <rect x="0" y="100" width="350" height="50" class="image" />
    <!-- Chocolate -->
    <rect x="250" y="20" width="50" height="60" class="image" />
    <line x1="250" y1="30" x2="300" y2="30" class="image" />
    <line x1="250" y1="40" x2="300" y2="40" class="image" />
    <line x1="250" y1="50" x2="300" y2="50" class="image" />
  </g>
</svg>