<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irony</text>
  <text x="50" y="120" class="subtitle">[ˈaɪrəni] n. 反讽，讽刺</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (进入) + on (存在)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在演讲中，"进入(ir-)"
    <tspan x="50" dy="25">一个存在(on)的场景，却说出完全相反的话，</tspan>
    <tspan x="50" dy="25">这就是反讽(irony)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The irony of the situation was not lost on anyone.
  </text>
  <text x="50" y="310" class="content">
    这种情况的讽刺意味没有被任何人忽视。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Speaker -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M 50 80 Q 100 60 150 80 Q 200 100 150 120 Q 100 140 50 120 Z" class="image" />
    <!-- Text in speech bubble -->
    <text x="70" y="100" class="content" text-anchor="middle">
      "What a beautiful day!"
    </text>
    <!-- Rain cloud -->
    <path d="M 100 50 Q 150 30 200 50 Q 250 70 200 90 Q 150 110 100 90 Z" class="image" />
    <line x1="120" y1="60" x2="120" y2="70" class="image" />
    <line x1="140" y1="60" x2="140" y2="70" class="image" />
    <line x1="160" y1="60" x2="160" y2="70" class="image" />
    <line x1="180" y1="60" x2="180" y2="70" class="image" />
  </g>
</svg>