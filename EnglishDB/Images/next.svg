<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">next</text>
  <text x="50" y="120" class="subtitle">[nɛkst] adj. 下一个的，紧接在后的；adv. 接下来</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ne- (靠近) + xt (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象你站在一条时间线上，"靠近(ne-)"
    <tspan x="50" dy="25">下一个时间点(xt)，那就是接下来(next)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> What are you going to do next?
  </text>
  <text x="50" y="310" class="content">
    你接下来打算做什么？
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Time line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Current point -->
    <circle cx="150" cy="0" r="10" class="image" />
    <!-- Next point -->
    <circle cx="250" cy="0" r="10" class="image" />
    <!-- Arrow pointing to next -->
    <line x1="160" y1="0" x2="240" y2="0" class="image" />
    <polygon points="240,0 230,-10 230,10" class="image" />
  </g>
</svg>