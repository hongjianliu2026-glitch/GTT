<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">litter</text>
  <text x="50" y="120" class="subtitle">[ˈlɪtər] n. 垃圾，杂乱；v. 乱扔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lit (放置) + ter (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个公园里，"放置(lit)"
    <tspan x="50" dy="25">各种垃圾(ter)，整个地方就变得杂乱无章(litter)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please don't litter in the park.
  </text>
  <text x="50" y="310" class="content">
    请不要在公园里乱扔垃圾。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Park ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trash items -->
    <circle cx="50" cy="50" r="10" class="image" />
    <rect x="80" y="40" width="20" height="20" class="image" />
    <line x1="120" y1="40" x2="140" y2="60" class="image" />
    <line x1="120" y1="60" x2="140" y2="40" class="image" />
    <rect x="160" y="40" width="20" height="20" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <rect x="230" y="40" width="20" height="20" class="image" />
    <line x1="270" y1="40" x2="290" y2="60" class="image" />
    <line x1="270" y1="60" x2="290" y2="40" class="image" />
    <rect x="310" y="40" width="20" height="20" class="image" />
  </g>
</svg>