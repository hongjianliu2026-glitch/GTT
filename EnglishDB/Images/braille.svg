<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">braille</text>
  <text x="50" y="120" class="subtitle">[breɪl] n. 盲文</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> braille (源自法国盲人路易·布莱叶的名字)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个盲人用手触摸"布莱叶(braille)"
    <tspan x="50" dy="25">点字板，通过凸起的点来阅读文字。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The book was translated into braille for the visually impaired.
  </text>
  <text x="50" y="310" class="content">
    这本书被翻译成了盲文，供视力受损者阅读。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Braille dots -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="80" cy="50" r="10" class="image" />
    <circle cx="110" cy="50" r="10" class="image" />
    <circle cx="50" cy="80" r="10" class="image" />
    <circle cx="80" cy="80" r="10" class="image" />
    <circle cx="110" cy="80" r="10" class="image" />
    <!-- Hand touching the dots -->
    <line x1="140" y1="65" x2="180" y2="65" class="image" />
    <line x1="180" y1="65" x2="180" y2="100" class="image" />
    <line x1="180" y1="100" x2="160" y2="120" class="image" />
    <line x1="180" y1="100" x2="200" y2="120" class="image" />
  </g>
</svg>