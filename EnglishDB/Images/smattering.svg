<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smattering</text>
  <text x="50" y="120" class="subtitle">[ˈsmætərɪŋ] n. 少量，肤浅的知识</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smatter (少量) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生，"少量地(smatter)"
    <tspan x="50" dy="25">学习各种知识，结果只掌握了肤浅的知识(smattering)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He has a smattering of French, but can't hold a conversation.
  </text>
  <text x="50" y="310" class="content">
    他懂一点法语，但无法进行对话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Student -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Books -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="160" y="20" width="100" height="160" class="image" />
    <rect x="270" y="20" width="100" height="160" class="image" />
    <!-- Dots representing smattering -->
    <circle cx="70" cy="40" r="5" class="image" />
    <circle cx="180" cy="60" r="5" class="image" />
    <circle cx="290" cy="80" r="5" class="image" />
    <circle cx="80" cy="100" r="5" class="image" />
    <circle cx="190" cy="120" r="5" class="image" />
    <circle cx="300" cy="140" r="5" class="image" />
  </g>
</svg>