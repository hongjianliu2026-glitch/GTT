<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gouge</text>
  <text x="50" y="120" class="subtitle">[ɡaʊdʒ] v. 凿，挖出；n. 凿子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> goug (挖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个木匠用凿子"挖(goug)"出一个深深的凹槽，
    <tspan x="50" dy="25">这个动作就是gouge。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The carpenter used a gouge to carve the wooden bowl.
  </text>
  <text x="50" y="310" class="content">
    木匠用凿子雕刻木碗。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wood block -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gouge -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <!-- Carved groove -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="120" x2="250" y2="120" class="image" />
    <line x1="100" y1="140" x2="250" y2="140" class="image" />
  </g>
</svg>