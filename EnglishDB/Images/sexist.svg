<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sexist</text>
  <text x="50" y="120" class="subtitle">[ˈsɛksɪst] n. 性别歧视者；adj. 性别歧视的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sex (性别) + -ist (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个性别歧视者，他/她总是"性别(sex)"
    <tspan x="50" dy="25">为先，认为某些性别比其他性别更优越。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It's important to recognize and challenge sexist attitudes.
  </text>
  <text x="50" y="310" class="content">
    认识到并挑战性别歧视的态度很重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Male and Female symbols -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="50" y1="100" x2="20" y2="80" class="image" />
    <line x1="50" y1="100" x2="80" y2="80" class="image" />
    <line x1="50" y1="120" x2="20" y2="140" class="image" />
    <line x1="50" y1="120" x2="80" y2="140" class="image" />

    <rect x="150" y="20" width="60" height="100" class="image" />
    <circle cx="180" cy="50" r="30" class="image" />
    <line x1="180" y1="120" x2="180" y2="160" class="image" />
    <line x1="180" y1="140" x2="150" y2="120" class="image" />
    <line x1="180" y1="140" x2="210" y2="120" class="image" />

    <!-- Arrow pointing to male -->
    <line x1="100" y1="50" x2="140" y2="50" class="image" />
    <polygon points="140,45 140,55 150,50" class="image" />

    <!-- Text -->
    <text x="250" y="80" class="content">Better</text>
  </g>
</svg>