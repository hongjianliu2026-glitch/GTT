<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">self-doubt</text>
  <text x="50" y="120" class="subtitle">[ˌsɛlf dˈaʊt] n. 自我怀疑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> self- (自己) + doubt (怀疑)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"自己(self)"
    <tspan x="50" dy="25">对自己产生"怀疑(doubt)"，</tspan>
    <tspan x="50" dy="25">这种内心的挣扎让人感到不安。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His self-doubt held him back from applying for the job.
  </text>
  <text x="50" y="310" class="content">
    他的自我怀疑使他不敢申请那份工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="130" class="image" />
    <line x1="100" y1="150" x2="130" y2="130" class="image" />
    <line x1="100" y1="180" x2="70" y2="210" class="image" />
    <line x1="100" y1="180" x2="130" y2="210" class="image" />
    <!-- Doubt symbol -->
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="250" y2="150" class="image" />
  </g>
</svg>