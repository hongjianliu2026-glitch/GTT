<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">babble</text>
  <text x="50" y="120" class="subtitle">[ˈbæbl] v. 喋喋不休，含糊不清地说</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bab (婴儿) + -le (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个婴儿在床上，"反复地发出(bab-le)"
    <tspan x="50" dy="25">含糊不清的声音，就像在喋喋不休(babble)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby babbled all night, keeping us awake.
  </text>
  <text x="50" y="310" class="content">
    婴儿整晚喋喋不休，让我们无法入睡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baby -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Speech bubbles -->
    <path d="M100,80 Q150,70 200,80 Q250,90 300,80" class="image" />
    <path d="M100,120 Q150,110 200,120 Q250,130 300,120" class="image" />
    <path d="M100,160 Q150,150 200,160 Q250,170 300,160" class="image" />
  </g>
</svg>