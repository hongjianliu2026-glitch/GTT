<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cilantro</text>
  <text x="50" y="120" class="subtitle">[sɪˈlæntroʊ] n. 香菜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cil (卷曲) + an (植物) + tro (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片卷曲的叶子(cil)生长在植物(an)的特定地方(tro)，
    <tspan x="50" dy="25">这就是香菜(cilantro)的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Add some cilantro to the soup for extra flavor.
  </text>
  <text x="50" y="310" class="content">
    在汤里加些香菜以增加风味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cilantro plant -->
    <line x1="50" y1="100" x2="50" y2="200" class="image" />
    <line x1="50" y1="120" x2="30" y2="140" class="image" />
    <line x1="50" y1="120" x2="70" y2="140" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="180" class="image" />
    <line x1="50" y1="160" x2="70" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Leaves -->
    <path d="M50,120 C30,140 70,140 50,120" class="image" />
    <path d="M50,140 C30,160 70,160 50,140" class="image" />
    <path d="M50,160 C30,180 70,180 50,160" class="image" />
    <path d="M50,180 C30,200 70,200 50,180" class="image" />
  </g>
</svg>