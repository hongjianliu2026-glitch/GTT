<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hiss</text>
  <text x="50" y="120" class="subtitle">[hɪs] v. 发出嘶嘶声，嘘声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hiss (嘶嘶声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条蛇在草丛中，"嘶嘶(hiss)"
    <tspan x="50" dy="25">地发出警告声，让人不寒而栗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snake hissed at the intruder.
  </text>
  <text x="50" y="310" class="content">
    蛇对着入侵者发出嘶嘶声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snake -->
    <path d="M50 100 C50 50 150 50 150 100 S250 150 250 200" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
    <!-- Hissing sound -->
    <line x1="100" y1="170" x2="120" y2="190" class="image" />
    <line x1="120" y1="170" x2="140" y2="190" class="image" />
    <line x1="140" y1="170" x2="160" y2="190" class="image" />
    <line x1="160" y1="170" x2="180" y2="190" class="image" />
    <line x1="180" y1="170" x2="200" y2="190" class="image" />
  </g>
</svg>