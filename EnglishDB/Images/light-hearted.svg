<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F39C12; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">light-hearted</text>
  <text x="50" y="120" class="subtitle">[ˌlaɪtˈhɑːrtɪd] adj. 轻松愉快的，无忧无虑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> light (轻) + heart (心) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人，他的心像羽毛一样轻盈，脸上挂着灿烂的笑容，
    <tspan x="50" dy="25">无忧无虑地享受着生活，这就是light-hearted的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always has a light-hearted attitude towards life.
  </text>
  <text x="50" y="310" class="content">
    她总是以轻松愉快的心态面对生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 40 C10 10, 40 10, 40 40 S70 70, 40 90 S10 70, 10 40" class="image" fill="#E74C3C" />
    <!-- Feather -->
    <path d="M100 50 L120 30 L140 50 L160 30 L180 50 L200 30 L220 50 L240 30 L260 50 L280 30 L300 50" class="image" fill="#F1C40F" />
    <!-- Smile -->
    <path d="M50 150 Q75 180, 100 150" class="image" fill="none" stroke="#2ECC71" stroke-width="5" />
    <!-- Eyes -->
    <circle cx="60" cy="130" r="5" class="image" fill="#2C3E50" />
    <circle cx="90" cy="130" r="5" class="image" fill="#2C3E50" />
  </g>
</svg>