<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Jamaican</text>
  <text x="50" y="120" class="subtitle">[dʒəˈmeɪkən] adj. 牙买加的；n. 牙买加人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Jamaic- (牙买加) + -an (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热情的牙买加人，站在阳光明媚的海滩上，
    <tspan x="50" dy="25">手里拿着一杯冰凉的果汁，享受着加勒比海的微风。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Jamaican reggae music is very popular worldwide.
  </text>
  <text x="50" y="310" class="content">
    牙买加的雷鬼音乐在全球非常受欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Beach -->
    <rect x="0" y="150" width="350" height="100" fill="#3498DB" />
    <!-- Person -->
    <circle cx="100" cy="180" r="20" fill="#2ECC71" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="280" class="image" />
    <line x1="100" y1="250" x2="120" y2="280" class="image" />
    <line x1="100" y1="220" x2="130" y2="210" class="image" />
    <!-- Juice -->
    <rect x="150" y="170" width="30" height="50" fill="#E74C3C" />
    <line x1="165" y1="170" x2="165" y2="120" class="image" />
  </g>
</svg>