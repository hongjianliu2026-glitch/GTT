<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flexible</text>
  <text x="50" y="120" class="subtitle">[ˈflɛksəbl] adj. 灵活的，柔韧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flex (弯曲) + -ible (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根橡皮筋，"能够弯曲(flex-ible)"
    <tspan x="50" dy="25">并且恢复原状，这就是灵活(flexible)的特性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a flexible schedule and can work from home.
  </text>
  <text x="50" y="310" class="content">
    她的日程安排很灵活，可以在家工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Rubber band -->
    <path d="M50 100 Q100 50 150 100 T250 100" class="image" />
    <path d="M50 100 Q100 150 150 100 T250 100" class="image" />
    <!-- Arrow -->
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <polygon points="250,100 240,90 240,110" class="image" />
    <!-- Text -->
    <text x="150" y="180" class="content" text-anchor="middle">弯曲</text>
  </g>
</svg>