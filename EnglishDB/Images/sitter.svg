<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sitter</text>
  <text x="50" y="120" class="subtitle">[ˈsɪtər] n. 坐着的人，临时保姆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sit (坐) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"坐着的人(sitter)"，
    <tspan x="50" dy="25">他/她可能是一个临时保姆，静静地坐在那里照顾孩子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She hired a sitter to watch her kids while she was at work.
  </text>
  <text x="50" y="310" class="content">
    她请了一个临时保姆在她工作时照顾孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Person sitting -->
    <circle cx="100" cy="60" r="15" class="image" />
    <line x1="100" y1="75" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="130" class="image" />
    <line x1="100" y1="100" x2="120" y2="130" class="image" />
    <line x1="100" y1="85" x2="130" y2="75" class="image" />
    <!-- Child -->
    <circle cx="150" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="140" y2="130" class="image" />
    <line x1="150" y1="120" x2="160" y2="130" class="image" />
  </g>
</svg>