<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wearily</text>
  <text x="50" y="120" class="subtitle">[ˈwɪərəli] adv. 疲倦地，厌倦地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wear (疲倦) + -ily (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在漫长的一天后，"疲倦地(wearily)"
    <tspan x="50" dy="25">拖着沉重的步伐回家，脸上写满了疲惫。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He walked wearily into the house after a long day at work.
  </text>
  <text x="50" y="310" class="content">
    他在漫长的一天工作后，疲倦地走进了房子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- House -->
    <rect x="100" y="120" width="100" height="80" class="image" />
    <line x1="120" y1="120" x2="180" y2="120" class="image" />
    <line x1="150" y1="120" x2="150" y2="80" class="image" />
    <!-- Path -->
    <line x1="50" y1="220" x2="200" y2="220" class="image" />
  </g>
</svg>