<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dignified</text>
  <text x="50" y="120" class="subtitle">[ˈdɪɡnɪfaɪd] adj. 有尊严的，高贵的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dign (价值) + -ified (使...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位穿着华丽长袍的国王，"使(ified)"
    <tspan x="50" dy="25">自己显得"有价值(dign)"，展现出高贵的气质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The queen walked with a dignified manner.
  </text>
  <text x="50" y="310" class="content">
    女王以一种有尊严的方式行走。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- King -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="130" class="image" />
    <!-- Robe -->
    <rect x="20" y="200" width="60" height="50" class="image" />
    <!-- Crown -->
    <polygon points="50,50 30,70 70,70" class="image" />
  </g>
</svg>