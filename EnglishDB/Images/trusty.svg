<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trusty</text>
  <text x="50" y="120" class="subtitle">[ˈtrʌsti] adj. 可信赖的，可靠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trust (信任) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"信任(trust)"的守护者，他总是"可靠(trusty)"地保护着你的秘密，
    <tspan x="50" dy="25">就像一个忠诚的卫士，永远不会背叛你。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a trusty friend who always keeps my secrets.
  </text>
  <text x="50" y="310" class="content">
    她是一个可靠的朋友，总是保守我的秘密。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <polygon points="100,0 200,0 250,50 200,100 100,100 50,50" class="image" />
    <!-- Heart -->
    <path d="M150,50 C130,20 100,20 80,50 S130,100 150,70" class="image" />
    <!-- Guard -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="130" y2="250" class="image" />
    <line x1="150" y1="220" x2="170" y2="250" class="image" />
    <line x1="150" y1="190" x2="120" y2="180" class="image" />
    <line x1="150" y1="190" x2="180" y2="180" class="image" />
  </g>
</svg>