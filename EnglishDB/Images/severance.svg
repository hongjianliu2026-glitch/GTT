<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">severance</text>
  <text x="50" y="120" class="subtitle">[ˈsɛvərəns] n. 分离，断绝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sever (切断) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把巨大的剪刀"切断(sever)"
    <tspan x="50" dy="25">两根绳子，这种"切断"的动作就形成了分离(severance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The severance of the old ties was painful but necessary.
  </text>
  <text x="50" y="310" class="content">
    断绝旧关系虽然痛苦，但却是必要的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scissors -->
    <path d="M50 50 L100 50 L100 100 L50 100 Z" class="image" />
    <path d="M100 50 L150 50 L150 100 L100 100 Z" class="image" />
    <!-- Ropes -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <!-- Cut lines -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
  </g>
</svg>