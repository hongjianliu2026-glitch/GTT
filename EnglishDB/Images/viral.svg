<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">viral</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪrəl] adj. 病毒的，病毒式的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vir (病毒) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个病毒(vir)在网络上迅速传播，
    <tspan x="50" dy="25">就像病毒式的(viral)视频一样，瞬间席卷全球。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The video went viral within hours.
  </text>
  <text x="50" y="310" class="content">
    这个视频在几小时内就火了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Virus -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="100" cy="50" r="30" class="image" />
    <circle cx="75" cy="100" r="30" class="image" />
    <!-- Network lines -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="75" y1="50" x2="75" y2="100" class="image" />
    <line x1="50" y1="50" x2="75" y2="100" class="image" />
    <line x1="100" y1="50" x2="75" y2="100" class="image" />
    <!-- Globe -->
    <circle cx="200" cy="75" r="50" class="image" />
    <!-- Spread arrows -->
    <line x1="200" y1="25" x2="200" y2="125" class="image" />
    <line x1="200" y1="25" x2="180" y2="45" class="image" />
    <line x1="200" y1="25" x2="220" y2="45" class="image" />
    <line x1="200" y1="125" x2="180" y2="105" class="image" />
    <line x1="200" y1="125" x2="220" y2="105" class="image" />
  </g>
</svg>