<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ambush</text>
  <text x="50" y="120" class="subtitle">[ˈæmbʊʃ] n. 埋伏，伏击；v. 埋伏，伏击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ambi- (周围) + -ush (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群士兵在森林中"周围埋伏(ambi-ush)"，
    <tspan x="50" dy="25">等待敌人进入他们的包围圈，准备发动突袭。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soldiers set an ambush in the forest.
  </text>
  <text x="50" y="310" class="content">
    士兵们在森林中设下了埋伏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="300" class="image" />
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <line x1="200" y1="50" x2="250" y2="100" class="image" />
    <line x1="250" y1="50" x2="300" y2="100" class="image" />
    <!-- Soldiers -->
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <!-- Ambush -->
    <line x1="100" y1="160" x2="100" y2="200" class="image" />
    <line x1="150" y1="160" x2="150" y2="200" class="image" />
    <line x1="200" y1="160" x2="200" y2="200" class="image" />
    <line x1="250" y1="160" x2="250" y2="200" class="image" />
  </g>
</svg>