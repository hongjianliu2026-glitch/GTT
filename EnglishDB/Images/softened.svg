<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">softened</text>
  <text x="50" y="120" class="subtitle">[ˈsɔftnd] v. 使变软，使柔和</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soft (软) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块坚硬的石头被"软化(soft-en)"成柔软的泥土，
    <tspan x="50" dy="25">这个过程就像是用温柔的力量改变了它的本质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The harsh tone was softened by her gentle words.
  </text>
  <text x="50" y="310" class="content">
    她温柔的话语使严厉的语气变得柔和。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hard stone -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <!-- Softened stone -->
    <rect x="150" y="0" width="100" height="100" class="image" />
    <circle cx="200" cy="50" r="30" class="image" />
    <circle cx="170" cy="70" r="20" class="image" />
    <circle cx="230" cy="70" r="20" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <polygon points="145,45 150,50 145,55" class="image" />
  </g>
</svg>