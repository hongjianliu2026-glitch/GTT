<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">giveaway</text>
  <text x="50" y="120" class="subtitle">[ˈɡɪvəweɪ] n. 赠品，泄露</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> give (给予) + away (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的礼物盒，"给予(give)"
    <tspan x="50" dy="25">并"离开(away)"，这就是赠品(giveaway)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's new product was a giveaway at the event.
  </text>
  <text x="50" y="310" class="content">
    公司的新产品在活动中作为赠品发放。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gift box -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="20" y="20" width="160" height="110" class="image" />
    <!-- Ribbon -->
    <line x1="100" y1="20" x2="100" y2="0" class="image" />
    <line x1="100" y1="0" x2="80" y2="-20" class="image" />
    <line x1="100" y1="0" x2="120" y2="-20" class="image" />
    <!-- Arrow -->
    <line x1="220" y1="75" x2="300" y2="75" class="image" />
    <polygon points="300,75 290,65 290,85" class="image" />
  </g>
</svg>