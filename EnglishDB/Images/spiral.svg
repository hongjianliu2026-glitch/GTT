<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spiral</text>
  <text x="50" y="120" class="subtitle">[ˈspaɪrəl] n. 螺旋，螺旋形；v. 盘旋上升或下降</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spir (呼吸，生命) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶在空中"呼吸(spir)"，它的飞行轨迹形成了一个美丽的螺旋(spiral)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smoke spiraled up into the sky.
  </text>
  <text x="50" y="310" class="content">
    烟雾螺旋上升到天空。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Spiral path -->
    <path d="M 0 0 C 50 -50, 100 -100, 150 -150, 200 -200, 250 -250, 300 -300, 350 -350, 400 -400" class="image" />
    <!-- Butterfly -->
    <circle cx="50" cy="-50" r="10" class="image" />
    <line x1="50" y1="-40" x2="50" y2="-20" class="image" />
    <line x1="50" y1="-20" x2="40" y2="-10" class="image" />
    <line x1="50" y1="-20" x2="60" y2="-10" class="image" />
    <line x1="50" y1="-40" x2="40" y2="-30" class="image" />
    <line x1="50" y1="-40" x2="60" y2="-30" class="image" />
  </g>
</svg>