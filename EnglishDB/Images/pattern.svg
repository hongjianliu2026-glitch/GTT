<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pattern</text>
  <text x="50" y="120" class="subtitle">[ˈpætərn] n. 模式，图案；v. 模仿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pat (父) + tern (三)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个父亲(pat)和他的三个孩子(tern)，他们一起
    <tspan x="50" dy="25">创造了一个重复的图案(pattern)，这个图案就像他们</tspan>
    <tspan x="50" dy="25">之间的家庭模式一样，不断重复和模仿。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The designer created a beautiful pattern for the fabric.
  </text>
  <text x="50" y="310" class="content">
    设计师为布料设计了一个美丽的图案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Father -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <!-- Children -->
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />

    <!-- Pattern -->
    <rect x="50" y="220" width="200" height="50" class="image" />
    <rect x="50" y="280" width="200" height="50" class="image" />
    <rect x="50" y="340" width="200" height="50" class="image" />
  </g>
</svg>