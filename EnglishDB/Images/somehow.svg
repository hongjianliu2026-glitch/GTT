<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">somehow</text>
  <text x="50" y="120" class="subtitle">[ˈsʌmhaʊ] adv. 以某种方式，不知怎么地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> some (一些) + how (方式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在迷宫中，"以某种方式(some-how)"
    <tspan x="50" dy="25">找到了出口，尽管过程曲折。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Somehow, she managed to finish the project on time.
  </text>
  <text x="50" y="310" class="content">
    不知怎么地，她按时完成了项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Maze -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <line x1="50" y1="20" x2="50" y2="170" class="image" />
    <line x1="100" y1="20" x2="100" y2="170" class="image" />
    <line x1="150" y1="20" x2="150" y2="170" class="image" />
    <line x1="200" y1="20" x2="200" y2="170" class="image" />
    <line x1="250" y1="20" x2="250" y2="170" class="image" />
    <line x1="300" y1="20" x2="300" y2="170" class="image" />
    <!-- Exit -->
    <rect x="300" y="170" width="50" height="30" class="image" />
    <!-- Person -->
    <circle cx="75" cy="100" r="15" class="image" />
    <line x1="75" y1="115" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="60" y2="180" class="image" />
    <line x1="75" y1="150" x2="90" y2="180" class="image" />
    <line x1="75" y1="130" x2="100" y2="120" class="image" />
  </g>
</svg>