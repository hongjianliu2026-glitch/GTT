<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">screech</text>
  <text x="50" y="120" class="subtitle">[skriːtʃ] v. 尖叫，发出尖锐刺耳的声音</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> screech (尖叫声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫被踩到尾巴，发出"尖锐刺耳(screech)"的声音，
    <tspan x="50" dy="25">声音直冲云霄，让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The car screeched to a halt.
  </text>
  <text x="50" y="310" class="content">
    汽车发出尖锐的刹车声停了下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <line x1="50" y1="140" x2="20" y2="130" class="image" />
    <!-- Tail -->
    <path d="M 50 160 Q 70 180 90 160" class="image" />
    <!-- Screech sound -->
    <path d="M 100 80 Q 120 60 140 80" class="image" />
    <path d="M 100 90 Q 120 70 140 90" class="image" />
    <path d="M 100 100 Q 120 80 140 100" class="image" />
  </g>
</svg>