<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oriental</text>
  <text x="50" y="120" class="subtitle">[ˌɔːriˈɛntl] adj. 东方的，东方人的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ori- (升起) + ental (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳从东方"升起(ori-)"，照亮了整个东方(oriental)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oriental art exhibition was a great success.
  </text>
  <text x="50" y="310" class="content">
    东方艺术展取得了巨大的成功。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun rising -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="50" x2="50" y2="50" class="image" />
    <line x1="100" y1="50" x2="130" y2="20" class="image" />
    <line x1="100" y1="50" x2="70" y2="20" class="image" />
    <!-- Horizon line -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <!-- Mountains -->
    <polyline points="50,200 75,150 100,200" class="image" fill="#7F8C8D" />
    <polyline points="100,200 125,150 150,200" class="image" fill="#7F8C8D" />
  </g>
</svg>