<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deluxe</text>
  <text x="50" y="120" class="subtitle">[dɪˈlʌks] adj. 豪华的，高级的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + luxe (豪华)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个豪华的酒店房间，"强调豪华(de-luxe)"
    <tspan x="50" dy="25">的装饰和设施，让人感觉无比奢华。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hotel offers a deluxe suite with a panoramic view.
  </text>
  <text x="50" y="310" class="content">
    这家酒店提供一间豪华套房，拥有全景视野。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hotel room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bed -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Pillows -->
    <circle cx="80" cy="60" r="15" class="image" />
    <circle cx="120" cy="60" r="15" class="image" />
    <!-- Nightstand -->
    <rect x="50" y="130" width="50" height="50" class="image" />
    <!-- Lamp -->
    <line x1="75" y1="130" x2="75" y2="100" class="image" />
    <circle cx="75" cy="95" r="10" class="image" />
    <!-- Window -->
    <rect x="200" y="20" width="100" height="100" class="image" />
    <!-- Curtains -->
    <line x1="200" y1="20" x2="200" y2="0" class="image" />
    <line x1="300" y1="20" x2="300" y2="0" class="image" />
  </g>
</svg>