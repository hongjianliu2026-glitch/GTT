<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fruity</text>
  <text x="50" y="120" class="subtitle">[ˈfruːti] adj. 果味的，有水果味的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fruit (水果) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水果篮，里面装满了各种水果，
    <tspan x="50" dy="25">每一种水果都散发着浓郁的果香，这就是"果味的(fruity)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This juice has a very fruity taste.
  </text>
  <text x="50" y="310" class="content">
    这种果汁有非常浓郁的果味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fruit basket -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Fruits -->
    <circle cx="50" cy="100" r="20" fill="#FF6F61" />
    <circle cx="100" cy="120" r="25" fill="#FFCC29" />
    <circle cx="150" cy="80" r="30" fill="#88C057" />
    <circle cx="200" cy="110" r="25" fill="#A23B72" />
    <circle cx="250" cy="90" r="20" fill="#45B5AA" />
    <!-- Fruit basket handle -->
    <line x1="100" y1="20" x2="250" y2="20" class="image" />
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <line x1="250" y1="20" x2="250" y2="40" class="image" />
  </g>
</svg>