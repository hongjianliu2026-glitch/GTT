<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contend</text>
  <text x="50" y="120" class="subtitle">[kənˈtend] v. 竞争，斗争；主张</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tend (伸展)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在拳击场上，"一起伸展(con-tend)"
    <tspan x="50" dy="25">他们的手臂，互相竞争(contend)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two teams are contending for the championship.
  </text>
  <text x="50" y="310" class="content">
    两支队伍正在争夺冠军。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boxing ring -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boxers -->
    <circle cx="80" cy="100" r="20" class="image" />
    <circle cx="270" cy="100" r="20" class="image" />
    <!-- Arms -->
    <line x1="80" y1="120" x2="40" y2="160" class="image" />
    <line x1="80" y1="120" x2="120" y2="160" class="image" />
    <line x1="270" y1="120" x2="230" y2="160" class="image" />
    <line x1="270" y1="120" x2="310" y2="160" class="image" />
    <!-- Gloves -->
    <circle cx="40" cy="160" r="10" class="image" />
    <circle cx="120" cy="160" r="10" class="image" />
    <circle cx="230" cy="160" r="10" class="image" />
    <circle cx="310" cy="160" r="10" class="image" />
  </g>
</svg>