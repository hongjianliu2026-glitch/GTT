<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decline</text>
  <text x="50" y="120" class="subtitle">[dɪˈklaɪn] v. 下降，衰退；n. 下降，衰退</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + clin (倾斜)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个物体从高处"向下倾斜(de-clin)"，
    <tspan x="50" dy="25">逐渐下降，最终衰退(decline)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's profits have declined over the past year.
  </text>
  <text x="50" y="310" class="content">
    公司的利润在过去一年中有所下降。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- High point -->
    <line x1="0" y1="0" x2="150" y2="0" class="image" />
    <!-- Low point -->
    <line x1="150" y1="0" x2="300" y2="150" class="image" />
    <!-- Arrow indicating decline -->
    <polygon points="300,150 280,130 280,170" class="image" />
    <!-- Object at high point -->
    <circle cx="75" cy="0" r="10" class="image" />
    <!-- Object at low point -->
    <circle cx="225" cy="150" r="10" class="image" />
  </g>
</svg>