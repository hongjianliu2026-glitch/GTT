<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">preconception</text>
  <text x="50" y="120" class="subtitle">[ˌpriːkənˈsepʃən] n. 先入之见，偏见</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + con- (共同) + cept (拿) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考前，"提前拿(pre-cept)"
    <tspan x="50" dy="25">了一些共同的想法(con-ception)，这些想法就形成了偏见(preconception)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had many preconceptions about the new job before she started.
  </text>
  <text x="50" y="310" class="content">
    她在开始新工作之前有很多先入之见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Thought bubbles -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="100" cy="150" r="20" class="image" />
    <!-- Arrow pointing to preconception -->
    <line x1="100" y1="180" x2="100" y2="250" class="image" />
    <polygon points="90,250 110,250 100,260" class="image" />
    <!-- Preconception text -->
    <text x="70" y="280" class="content">Preconception</text>
  </g>
</svg>