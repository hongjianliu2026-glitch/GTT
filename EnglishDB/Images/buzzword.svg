<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buzzword</text>
  <text x="50" y="120" class="subtitle">[ˈbʌzwɜːrd] n. 流行语，时髦词</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> buzz (嗡嗡声) + word (词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个会议室里，人们都在讨论最新的"时髦词(buzzword)"，
    <tspan x="50" dy="25">这个词像蜜蜂一样"嗡嗡(buzz)"作响，引起了大家的注意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> "Synergy" is a common buzzword in corporate meetings.
  </text>
  <text x="50" y="310" class="content">
    "协同效应"是公司会议中常见的时髦词。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <!-- Buzzword -->
    <text x="100" y="100" class="highlight" font-size="24">Synergy</text>
    <!-- Buzzing effect -->
    <line x1="100" y1="120" x2="120" y2="140" class="image" />
    <line x1="120" y1="120" x2="100" y2="140" class="image" />
    <line x1="110" y1="130" x2="130" y2="150" class="image" />
    <line x1="130" y1="130" x2="110" y2="150" class="image" />
  </g>
</svg>