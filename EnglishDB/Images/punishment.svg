<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">punishment</text>
  <text x="50" y="120" class="subtitle">[ˈpʌnɪʃmənt] n. 惩罚，处罚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> puni (惩罚) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调皮的孩子被"惩罚(puni)"，
    <tspan x="50" dy="25">站在角落里，脸上带着委屈的表情，这就是"惩罚(punishment)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher gave him a punishment for cheating.
  </text>
  <text x="50" y="310" class="content">
    老师因为他作弊而惩罚了他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Corner -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <!-- Child -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Sad face -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <line x1="45" y1="105" x2="65" y2="105" class="image" />
  </g>
</svg>