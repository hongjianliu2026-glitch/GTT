<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">biblical</text>
  <text x="50" y="120" class="subtitle">[ˈbɪblɪkl] adj. 圣经的，圣经中的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> biblia (书) + -cal (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本巨大的书，书页上写满了"圣经(biblia)"中的故事，
    <tspan x="50" dy="25">这些故事充满了智慧和启示，让人感受到圣经的庄严和神圣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The preacher quoted a biblical passage during the sermon.
  </text>
  <text x="50" y="310" class="content">
    牧师在布道中引用了一段圣经经文。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large book -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Book pages -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Holy symbols -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Cross symbol -->
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="180" y1="100" x2="220" y2="100" class="image" />
  </g>
</svg>