<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">venue</text>
  <text x="50" y="120" class="subtitle">[ˈvɛnjuː] n. 场地，会场</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ven- (来) + ue (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的场地，人们从四面八方"来(ven-)"到这里，
    <tspan x="50" dy="25">参加一个盛大的活动，这个地方就是"会场(venue)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The venue for the concert was packed with fans.
  </text>
  <text x="50" y="310" class="content">
    音乐会的场地挤满了粉丝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Venue outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People coming -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="75" y1="20" x2="75" y2="50" class="image" />
    <line x1="150" y1="20" x2="200" y2="20" class="image" />
    <line x1="175" y1="20" x2="175" y2="50" class="image" />
    <line x1="250" y1="20" x2="300" y2="20" class="image" />
    <line x1="275" y1="20" x2="275" y2="50" class="image" />
    <!-- Venue entrance -->
    <rect x="150" y="100" width="50" height="50" class="image" />
    <!-- People inside -->
    <circle cx="175" cy="125" r="5" class="image" />
    <circle cx="200" cy="125" r="5" class="image" />
    <circle cx="175" cy="150" r="5" class="image" />
    <circle cx="200" cy="150" r="5" class="image" />
  </g>
</svg>