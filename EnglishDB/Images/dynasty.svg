<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dynasty</text>
  <text x="50" y="120" class="subtitle">[ˈdaɪnəsti] n. 王朝，朝代</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dyn- (力量) + -asty (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强大的"力量(dyn-)"统治者，他建立了一个"状态(asty)"，
    <tspan x="50" dy="25">这个状态持续了数百年，这就是一个王朝(dynasty)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Ming Dynasty was one of the greatest in Chinese history.
  </text>
  <text x="50" y="310" class="content">
    明朝是中国历史上最伟大的朝代之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crown -->
    <circle cx="100" cy="50" r="30" class="image" />
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <line x1="80" y1="30" x2="120" y2="30" class="image" />
    <line x1="90" y1="10" x2="110" y2="10" class="image" />
    <!-- Throne -->
    <rect x="50" y="80" width="100" height="100" class="image" />
    <!-- Ruler -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="70" y2="180" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
  </g>
</svg>