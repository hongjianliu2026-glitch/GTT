<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consolidation</text>
  <text x="50" y="120" class="subtitle">[kənˌsɒlɪˈdeɪʃn] n. 巩固，合并</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + solid (坚固) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆松散的砖块被"一起(con-)"堆砌成一个"坚固(solid)"的墙，
    <tspan x="50" dy="25">这个过程就是"巩固(consolidation)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's recent consolidation of its branches has strengthened its market position.
  </text>
  <text x="50" y="310" class="content">
    公司最近对其分支机构的合并加强了其市场地位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bricks -->
    <rect x="50" y="20" width="50" height="30" class="image" />
    <rect x="110" y="20" width="50" height="30" class="image" />
    <rect x="170" y="20" width="50" height="30" class="image" />
    <rect x="230" y="20" width="50" height="30" class="image" />
    <rect x="80" y="60" width="50" height="30" class="image" />
    <rect x="140" y="60" width="50" height="30" class="image" />
    <rect x="200" y="60" width="50" height="30" class="image" />
    <rect x="110" y="100" width="50" height="30" class="image" />
    <rect x="170" y="100" width="50" height="30" class="image" />
    <rect x="140" y="140" width="50" height="30" class="image" />
    <!-- Mortar -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="80" y1="90" x2="270" y2="90" class="image" />
    <line x1="110" y1="130" x2="240" y2="130" class="image" />
  </g>
</svg>