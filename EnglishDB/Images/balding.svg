<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">balding</text>
  <text x="50" y="120" class="subtitle">[ˈbɔːldɪŋ] adj. 正在变秃的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bald (秃的) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人头顶的头发正在逐渐消失，"秃头(bald)"
    <tspan x="50" dy="25">的过程正在进行中，这就是"正在变秃的(balding)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He noticed his hairline was balding.
  </text>
  <text x="50" y="310" class="content">
    他注意到自己的发际线正在变秃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Hair -->
    <line x1="40" y1="40" x2="160" y2="40" class="image" />
    <line x1="50" y1="60" x2="150" y2="60" class="image" />
    <line x1="60" y1="80" x2="140" y2="80" class="image" />
    <!-- Balding area -->
    <rect x="80" y="90" width="40" height="10" class="image" />
    <!-- Text annotation -->
    <text x="100" y="120" class="content" text-anchor="middle">Balding</text>
  </g>
</svg>