<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cover</text>
  <text x="50" y="120" class="subtitle">[ˈkʌvər] v. 覆盖，掩盖；n. 封面，盖子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cov- (覆盖) + -er (表示动作的执行者或工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的手，"覆盖(cov-er)"
    <tspan x="50" dy="25">整个地球，就像给地球穿上了一件外套。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She covered the table with a cloth.
  </text>
  <text x="50" y="310" class="content">
    她用一块布盖住了桌子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Hand covering the Earth -->
    <path d="M 50 50 Q 100 20 150 50 L 150 100 Q 100 130 50 100 Z" class="image" />
    <!-- Cloth -->
    <rect x="20" y="120" width="160" height="40" class="image" />
  </g>
</svg>