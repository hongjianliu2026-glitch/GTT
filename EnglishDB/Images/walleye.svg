<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">walleye</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːliˌaɪ] n. 白眼鱼，斜视眼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wall (墙) + eye (眼睛)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鱼，它的眼睛像墙一样厚，"墙眼(wall-eye)"
    <tspan x="50" dy="25">看起来像是斜视，这就是白眼鱼(walleye)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The walleye in the lake is known for its large, wall-like eyes.
  </text>
  <text x="50" y="310" class="content">
    湖里的白眼鱼以其大而像墙一样的眼睛而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Fish eye -->
    <circle cx="220" cy="80" r="30" class="image" />
    <!-- Wall-like eye -->
    <rect x="200" y="50" width="40" height="60" class="image" />
    <!-- Fish tail -->
    <polygon points="50,100 0,75 0,125" class="image" />
  </g>
</svg>