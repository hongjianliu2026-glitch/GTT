<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gratification</text>
  <text x="50" y="120" class="subtitle">[ˌɡrætɪfɪˈkeɪʃn] n. 满足，满意</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grat (高兴) + -ification (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人收到礼物后，脸上露出"高兴(grat)"的笑容，
    <tspan x="50" dy="25">这种满足感就是gratification。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child's face showed immediate gratification upon receiving the toy.
  </text>
  <text x="50" y="310" class="content">
    孩子收到玩具后脸上立刻露出了满足的表情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gift box -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Happy face -->
    <circle cx="200" cy="50" r="30" class="image" />
    <circle cx="185" cy="40" r="5" class="image" />
    <circle cx="215" cy="40" r="5" class="image" />
    <path d="M185 60 Q200 80 215 60" class="image" />
  </g>
</svg>