<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aura</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrə] n. 气氛，光环</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aur- (光)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在阳光下，周围环绕着一圈
    <tspan x="50" dy="25">金色的光环(aura)，这种光环给人一种神秘而神圣的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The aura of the ancient temple was serene and peaceful.
  </text>
  <text x="50" y="310" class="content">
    这座古老寺庙的气氛宁静而祥和。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Aura -->
    <circle cx="100" cy="100" r="50" class="image" stroke-dasharray="5,5" />
    <!-- Sun -->
    <circle cx="200" cy="100" r="20" class="image" fill="#F1C40F" />
    <!-- Rays of the sun -->
    <line x1="200" y1="80" x2="200" y2="20" class="image" />
    <line x1="220" y1="80" x2="240" y2="20" class="image" />
    <line x1="180" y1="80" x2="160" y2="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="220" y1="120" x2="240" y2="180" class="image" />
    <line x1="180" y1="120" x2="160" y2="180" class="image" />
  </g>
</svg>