<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">longtime</text>
  <text x="50" y="120" class="subtitle">[ˈlɒŋtaɪm] adj. 长时间的，长期的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> long (长) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一条"长(long)"的"时间(time)"线上，
    <tspan x="50" dy="25">这条线延伸到远方，象征着长时间的持续。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They have been friends for a longtime.
  </text>
  <text x="50" y="310" class="content">
    他们已经是多年的朋友了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Long time line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person standing on the line -->
    <circle cx="20" cy="0" r="15" class="image" />
    <line x1="20" y1="15" x2="20" y2="50" class="image" />
    <line x1="20" y1="50" x2="0" y2="80" class="image" />
    <line x1="20" y1="50" x2="40" y2="80" class="image" />
    <line x1="20" y1="30" x2="50" y2="20" class="image" />
  </g>
</svg>