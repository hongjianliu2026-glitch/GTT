<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tactile</text>
  <text x="50" y="120" class="subtitle">[ˈtæktəl] adj. 触觉的，有触觉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tact (接触) + -ile (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个盲人通过触摸(tact)来感知世界，
    <tspan x="50" dy="25">这种通过触觉(tactile)感知的方式让他能够"接触"到事物的本质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tactile feedback of the device makes it easier to use.
  </text>
  <text x="50" y="310" class="content">
    设备的触觉反馈使其更易于使用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand touching a texture -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Texture -->
    <rect x="100" y="80" width="200" height="100" class="image" />
    <line x1="120" y1="100" x2="280" y2="100" class="image" />
    <line x1="120" y1="120" x2="280" y2="120" class="image" />
    <line x1="120" y1="140" x2="280" y2="140" class="image" />
    <line x1="120" y1="160" x2="280" y2="160" class="image" />
  </g>
</svg>