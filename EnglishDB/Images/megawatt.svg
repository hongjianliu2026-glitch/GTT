<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">megawatt</text>
  <text x="50" y="120" class="subtitle">[ˈmɛɡəˌwɒt] n. 兆瓦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mega- (百万) + watt (瓦特)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的发电厂，"百万瓦特(mega-watt)"
    <tspan x="50" dy="25">的能量源源不断地涌出，照亮了整个城市。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new power plant generates 100 megawatts of electricity.
  </text>
  <text x="50" y="310" class="content">
    新的发电厂能产生100兆瓦的电力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Power plant -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimneys -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <!-- Electricity lines -->
    <line x1="75" y1="100" x2="75" y2="180" class="image" />
    <line x1="125" y1="100" x2="125" y2="180" class="image" />
    <line x1="175" y1="100" x2="175" y2="180" class="image" />
    <!-- City lights -->
    <circle cx="250" cy="150" r="10" class="image" />
    <circle cx="270" cy="150" r="10" class="image" />
    <circle cx="290" cy="150" r="10" class="image" />
    <circle cx="310" cy="150" r="10" class="image" />
  </g>
</svg>