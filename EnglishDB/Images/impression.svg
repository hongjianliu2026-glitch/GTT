<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impression</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpreʃn] n. 印象，影响</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + press (压) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的印章"压入(im-press)"一张纸上，
    <tspan x="50" dy="25">留下深深的"印象(impression)"，让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His speech made a strong impression on the audience.
  </text>
  <text x="50" y="310" class="content">
    他的演讲给观众留下了深刻的印象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stamp -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Impression -->
    <text x="120" y="100" class="content" style="font-size: 48px; fill: #C0392B;">IMPRESSION</text>
  </g>
</svg>