<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">autocratic</text>
  <text x="50" y="120" class="subtitle">[ˌɔːtəˈkrætɪk] adj. 独裁的，专制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auto- (自己) + crat (统治) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个独裁者坐在宝座上，"自己统治(auto-crat)"
    <tspan x="50" dy="25">整个国家，他的决定不容置疑，这就是独裁(autocratic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The autocratic ruler made all the decisions without consulting anyone.
  </text>
  <text x="50" y="310" class="content">
    独裁统治者不征求任何人的意见就做出了所有决定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- King on throne -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="140" y2="130" class="image" />
    <line x1="175" y1="150" x2="210" y2="130" class="image" />
    <line x1="175" y1="180" x2="140" y2="200" class="image" />
    <line x1="175" y1="180" x2="210" y2="200" class="image" />
    <!-- Crown -->
    <polyline points="155,70 175,50 195,70" class="image" />
    <line x1="155" y1="70" x2="195" y2="70" class="image" />
  </g>
</svg>