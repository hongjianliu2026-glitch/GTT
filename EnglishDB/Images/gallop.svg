<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gallop</text>
  <text x="50" y="120" class="subtitle">[ˈɡæləp] v. 飞奔，疾驰；n. 飞奔，疾驰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gallo- (马) + -op (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一匹马在草原上"飞奔(gallop)"，
    <tspan x="50" dy="25">四蹄腾空，速度极快，仿佛在空中"飞翔"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The horse galloped across the field.
  </text>
  <text x="50" y="310" class="content">
    那匹马飞奔过田野。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horse body -->
    <ellipse cx="100" cy="100" rx="80" ry="50" class="image" />
    <!-- Horse head -->
    <circle cx="180" cy="80" r="30" class="image" />
    <!-- Horse legs -->
    <line x1="40" y1="100" x2="40" y2="180" class="image" />
    <line x1="160" y1="100" x2="160" y2="180" class="image" />
    <line x1="80" y1="100" x2="80" y2="180" class="image" />
    <line x1="120" y1="100" x2="120" y2="180" class="image" />
    <!-- Horse tail -->
    <path d="M100,150 Q120,130 140,150" class="image" />
    <!-- Horse gallop motion -->
    <path d="M40,180 Q60,160 80,180" class="image" />
    <path d="M120,180 Q140,160 160,180" class="image" />
  </g>
</svg>