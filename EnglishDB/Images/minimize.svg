<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">minimize</text>
  <text x="50" y="120" class="subtitle">[ˈmɪnɪmaɪz] v. 最小化，减少</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mini (小) + -ize (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师将一个巨大的物体"缩小(mini-)"
    <tspan x="50" dy="25">成一个小小的物品，这就是最小化(minimize)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tried to minimize the impact of her mistake.
  </text>
  <text x="50" y="310" class="content">
    她试图减少她错误的影响。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large object -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Small object -->
    <rect x="250" y="50" width="50" height="37.5" class="image" />
    <!-- Arrow -->
    <line x1="200" y1="75" x2="250" y2="75" class="image" />
    <polygon points="250,75 240,65 240,85" class="image" />
    <!-- Text -->
    <text x="100" y="200" class="content">缩小前</text>
    <text x="275" y="200" class="content">缩小后</text>
  </g>
</svg>