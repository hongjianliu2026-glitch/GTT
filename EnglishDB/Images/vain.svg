<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vain</text>
  <text x="50" y="120" class="subtitle">[veɪn] adj. 自负的，徒劳的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> van (空)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个自负的人，"空(van)"有外表，
    <tspan x="50" dy="25">内心却空无一物，徒劳无功(vain)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was vain about her appearance and spent hours in front of the mirror.
  </text>
  <text x="50" y="310" class="content">
    她对自己的外貌很自负，在镜子前花了好几个小时。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mirror -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="170" y2="220" class="image" />
    <line x1="200" y1="180" x2="230" y2="220" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
    <!-- Empty heart -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="90" y1="90" x2="110" y2="110" class="image" />
    <line x1="90" y1="110" x2="110" y2="90" class="image" />
  </g>
</svg>