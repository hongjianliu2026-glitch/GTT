<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">laudable</text>
  <text x="50" y="120" class="subtitle">[ˈlɔːdəbl] adj. 值得赞扬的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> laud (赞美) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为做了好事而被众人"赞美(laud)"，
    <tspan x="50" dy="25">他的行为因此变得"值得赞扬(laudable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her efforts to help the community are laudable.
  </text>
  <text x="50" y="310" class="content">
    她帮助社区的努力是值得赞扬的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person being praised -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />

    <!-- Crowd praising -->
    <circle cx="150" cy="80" r="15" class="image" />
    <circle cx="200" cy="80" r="15" class="image" />
    <circle cx="250" cy="80" r="15" class="image" />
    <line x1="150" y1="95" x2="150" y2="120" class="image" />
    <line x1="200" y1="95" x2="200" y2="120" class="image" />
    <line x1="250" y1="95" x2="250" y2="120" class="image" />
    <line x1="150" y1="120" x2="120" y2="150" class="image" />
    <line x1="200" y1="120" x2="170" y2="150" class="image" />
    <line x1="250" y1="120" x2="220" y2="150" class="image" />

    <!-- Applause -->
    <path d="M140,150 Q130,160 120,150" class="image" />
    <path d="M190,150 Q180,160 170,150" class="image" />
    <path d="M240,150 Q230,160 220,150" class="image" />
  </g>
</svg>