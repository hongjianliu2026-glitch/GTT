<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reed</text>
  <text x="50" y="120" class="subtitle">[riːd] n. 芦苇，簧片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (芦苇) + ed (表示名词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片芦苇(re-)在风中摇曳，发出沙沙的声音，
    <tspan x="50" dy="25">这些芦苇就是簧片(reed)，可以用来制作乐器。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The musician played a tune on the clarinet, using the reed to produce sound.
  </text>
  <text x="50" y="310" class="content">
    音乐家用单簧管演奏曲调，用簧片产生声音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Reeds -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <line x1="100" y1="0" x2="100" y2="150" class="image" />
    <line x1="150" y1="0" x2="150" y2="150" class="image" />
    <line x1="200" y1="0" x2="200" y2="150" class="image" />
    <line x1="250" y1="0" x2="250" y2="150" class="image" />
    <!-- Wind -->
    <path d="M50,150 Q100,100 150,150 Q200,100 250,150" class="image" />
  </g>
</svg>