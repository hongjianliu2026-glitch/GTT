<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resurface</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈsɜːrfɪs] v. 重新浮现，重新出现</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + surface (表面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个潜水员在海底发现了一个古老的宝藏，当他"再次浮出(re-surface)"水面时，
    <tspan x="50" dy="25">宝藏也随之重新出现在人们的视野中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old memories resurfaced as she looked at the old photos.
  </text>
  <text x="50" y="310" class="content">
    当她看着旧照片时，旧日的记忆重新浮现。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diver -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Treasure chest -->
    <rect x="100" y="120" width="80" height="60" class="image" />
    <line x1="120" y1="140" x2="160" y2="140" class="image" />
    <line x1="120" y1="160" x2="160" y2="160" class="image" />
    <line x1="120" y1="180" x2="160" y2="180" class="image" />
    <!-- Water surface -->
    <line x1="0" y1="250" x2="300" y2="250" class="image" />
    <line x1="0" y1="255" x2="300" y2="255" class="image" />
    <line x1="0" y1="260" x2="300" y2="260" class="image" />
  </g>
</svg>