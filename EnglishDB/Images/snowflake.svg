<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snowflake</text>
  <text x="50" y="120" class="subtitle">[ˈsnoʊfleɪk] n. 雪花，雪片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snow (雪) + flake (薄片)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片雪花(snowflake)从天而降，每一片都是独一无二的，
    <tspan x="50" dy="25">就像大自然精心雕刻的艺术品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snowflakes were falling gently outside the window.
  </text>
  <text x="50" y="310" class="content">
    雪花轻轻地飘落在窗外。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowflake -->
    <line x1="175" y1="50" x2="175" y2="250" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
    <line x1="125" y1="100" x2="225" y2="200" class="image" />
    <line x1="125" y1="200" x2="225" y2="100" class="image" />
    <line x1="150" y1="75" x2="200" y2="225" class="image" />
    <line x1="150" y1="225" x2="200" y2="75" class="image" />
    <line x1="175" y1="100" x2="175" y2="200" class="image" />
    <line x1="100" y1="175" x2="250" y2="175" class="image" />
  </g>
</svg>