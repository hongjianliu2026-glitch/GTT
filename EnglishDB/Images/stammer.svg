<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stammer</text>
  <text x="50" y="120" class="subtitle">[ˈstæmər] v. 结巴，口吃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stamm (结巴) + -er (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在说话时，"结巴(stamm)"得像被卡住的录音带，
    <tspan x="50" dy="25">每个字都像是在挣扎着出来，这就是口吃(stammer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He stammered through his speech at the wedding.
  </text>
  <text x="50" y="310" class="content">
    他在婚礼上的讲话结结巴巴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person stammering -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Speech bubbles -->
    <path d="M 70 80 Q 100 50 130 80 Q 100 110 70 80" class="image" />
    <text x="80" y="90" class="content">S... S... S...</text>
    <path d="M 150 80 Q 180 50 210 80 Q 180 110 150 80" class="image" />
    <text x="160" y="90" class="content">T... T... T...</text>
    <path d="M 230 80 Q 260 50 290 80 Q 260 110 230 80" class="image" />
    <text x="240" y="90" class="content">A... A... A...</text>
  </g>
</svg>