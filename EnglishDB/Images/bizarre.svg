<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bizarre</text>
  <text x="50" y="120" class="subtitle">[bɪˈzɑːr] adj. 奇异的，古怪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bizarr (拉丁语，意为“奇怪的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着奇装异服的人，"奇怪的(bizarre)"
    <tspan x="50" dy="25">走在街上，吸引了所有人的目光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clown's bizarre outfit made everyone laugh.
  </text>
  <text x="50" y="310" class="content">
    小丑奇异的服装让每个人都笑了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Strange outfit -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <line x1="50" y1="150" x2="0" y2="140" class="image" />
    <!-- Strange hat -->
    <rect x="30" y="50" width="40" height="20" class="image" />
    <line x1="50" y1="50" x2="50" y2="70" class="image" />
    <!-- Strange shoes -->
    <rect x="20" y="220" width="20" height="10" class="image" />
    <rect x="60" y="220" width="20" height="10" class="image" />
  </g>
</svg>