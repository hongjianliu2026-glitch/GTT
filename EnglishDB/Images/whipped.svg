<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whipped</text>
  <text x="50" y="120" class="subtitle">[wɪpt] adj. 被打败的，被鞭打的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> whip (鞭打) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被鞭子"鞭打(whip)"后，
    <tspan x="50" dy="25">变得"被打败的(whipped)"，无力地倒在地上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team felt whipped after the intense match.
  </text>
  <text x="50" y="310" class="content">
    经过激烈的比赛后，队伍感到被打败了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Whip -->
    <line x1="0" y1="0" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="200" y2="100" class="image" />
    <!-- Person -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="230" y2="220" class="image" />
    <line x1="250" y1="180" x2="270" y2="220" class="image" />
    <line x1="250" y1="140" x2="220" y2="160" class="image" />
    <line x1="250" y1="140" x2="280" y2="160" class="image" />
    <!-- Ground -->
    <line x1="200" y1="220" x2="300" y2="220" class="image" />
  </g>
</svg>