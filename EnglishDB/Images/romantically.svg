<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">romantically</text>
  <text x="50" y="120" class="subtitle">[roʊˈmæntɪkli] adv. 浪漫地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roman (浪漫) + -tic (形容词后缀) + -ally (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一对情侣在月光下，"浪漫地(romantically)"
    <tspan x="50" dy="25">漫步在河边，享受着甜蜜的时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They walked romantically along the riverbank.
  </text>
  <text x="50" y="310" class="content">
    他们浪漫地沿着河岸散步。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- River -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#1E90FF" />
    <!-- Couple -->
    <circle cx="50" cy="130" r="15" class="image" fill="#FF69B4" />
    <circle cx="70" cy="130" r="15" class="image" fill="#FF69B4" />
    <line x1="50" y1="145" x2="70" y2="145" class="image" />
    <line x1="50" y1="145" x2="40" y2="160" class="image" />
    <line x1="70" y1="145" x2="80" y2="160" class="image" />
    <line x1="50" y1="145" x2="60" y2="170" class="image" />
  </g>
</svg>