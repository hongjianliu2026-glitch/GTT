<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">emblem</text>
  <text x="50" y="120" class="subtitle">[ˈɛmbəlm] n. 象征，徽章</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (在...上) + blem (打标记)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的徽章，"在上面打上标记(em-blem)"，
    <tspan x="50" dy="25">这个标记就成为了某个团体的象征(emblem)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The eagle is an emblem of the United States.
  </text>
  <text x="50" y="310" class="content">
    鹰是美国的一个象征。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large emblem -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eagle inside the emblem -->
    <path d="M 50 100 L 100 50 L 150 100 Z" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="70" y2="200" class="image" />
    <line x1="100" y1="150" x2="130" y2="200" class="image" />
    <!-- Text label -->
    <text x="100" y="250" class="content" text-anchor="middle">Eagle</text>
  </g>
</svg>