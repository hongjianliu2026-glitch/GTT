<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fluctuating</text>
  <text x="50" y="120" class="subtitle">[ˈflʌktʃueɪtɪŋ] adj. 波动的，起伏的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flu (流动) + -ate (动词后缀) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，水流不断"流动(flu)"，
    <tspan x="50" dy="25">时而平静，时而汹涌，这就是"波动的(fluctuating)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stock market is known for its fluctuating prices.
  </text>
  <text x="50" y="310" class="content">
    股市以其波动的价格而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- River -->
    <path d="M0 100 Q50 50 100 100 T200 100 T300 100 T400 100 T500 100 T600 100 T700 100" class="image" />
    <path d="M0 120 Q50 170 100 120 T200 120 T300 120 T400 120 T500 120 T600 120 T700 120" class="image" />
    <path d="M0 140 Q50 90 100 140 T200 140 T300 140 T400 140 T500 140 T600 140 T700 140" class="image" />
    <path d="M0 160 Q50 210 100 160 T200 160 T300 160 T400 160 T500 160 T600 160 T700 160" class="image" />
  </g>
</svg>