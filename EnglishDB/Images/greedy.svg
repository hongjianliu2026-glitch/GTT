<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">greedy</text>
  <text x="50" y="120" class="subtitle">[ˈɡriːdi] adj. 贪婪的，贪心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> greed (贪婪) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个贪婪的人，"贪婪地(greedy)"
    <tspan x="50" dy="25">盯着一堆金币，恨不得全部据为己有。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The greedy man tried to take all the gold for himself.
  </text>
  <text x="50" y="310" class="content">
    那个贪婪的人试图把所有的金子都据为己有。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gold coins -->
    <circle cx="50" cy="50" r="20" class="image" fill="#FFD700" />
    <circle cx="100" cy="50" r="20" class="image" fill="#FFD700" />
    <circle cx="150" cy="50" r="20" class="image" fill="#FFD700" />
    <circle cx="200" cy="50" r="20" class="image" fill="#FFD700" />
    <circle cx="250" cy="50" r="20" class="image" fill="#FFD700" />

    <!-- Greedy person -->
    <circle cx="150" cy="150" r="30" class="image" fill="#F1C40F" />
    <line x1="150" y1="180" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="120" y2="300" class="image" />
    <line x1="150" y1="250" x2="180" y2="300" class="image" />
    <line x1="150" y1="200" x2="100" y2="220" class="image" />
    <line x1="150" y1="200" x2="200" y2="220" class="image" />

    <!-- Eyes -->
    <circle cx="135" cy="140" r="5" class="image" fill="#000" />
    <circle cx="165" cy="140" r="5" class="image" fill="#000" />

    <!-- Mouth -->
    <path d="M130,170 Q150,190 170,170" class="image" fill="none" stroke="#000" stroke-width="3" />
  </g>
</svg>