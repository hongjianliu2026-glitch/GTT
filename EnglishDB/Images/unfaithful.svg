<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unfaithful</text>
  <text x="50" y="120" class="subtitle">[ʌnˈfeɪθfəl] adj. 不忠实的，不忠诚的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + faith (信任) + -ful (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人背对着另一个人，手里拿着一个破碎的心，
    <tspan x="50" dy="25">象征着"不信任(un-faith-ful)"和背叛。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was unfaithful to her husband.
  </text>
  <text x="50" y="310" class="content">
    她对她的丈夫不忠。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken heart -->
    <path d="M50,50 Q75,25 100,50 T150,50" class="image" />
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Back turned -->
    <line x1="20" y1="100" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="140" class="image" />
    <line x1="50" y1="120" x2="70" y2="140" class="image" />
  </g>
</svg>