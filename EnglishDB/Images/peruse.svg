<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">peruse</text>
  <text x="50" y="120" class="subtitle">[pəˈruːz] v. 仔细阅读，细读</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + use (使用)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着放大镜，"完全使用(per-use)"
    <tspan x="50" dy="25">放大镜仔细阅读(peruse)一本书。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She perused the contract before signing it.
  </text>
  <text x="50" y="310" class="content">
    她在签字前仔细阅读了合同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Pages -->
    <line x1="20" y1="20" x2="180" y2="20" class="image" />
    <line x1="20" y1="50" x2="180" y2="50" class="image" />
    <line x1="20" y1="80" x2="180" y2="80" class="image" />
    <line x1="20" y1="110" x2="180" y2="110" class="image" />
    <!-- Magnifying glass -->
    <circle cx="250" cy="75" r="30" class="image" />
    <line x1="250" y1="105" x2="300" y2="150" class="image" />
    <!-- Person -->
    <circle cx="250" cy="180" r="20" class="image" />
    <line x1="250" y1="200" x2="250" y2="240" class="image" />
    <line x1="250" y1="240" x2="230" y2="270" class="image" />
    <line x1="250" y1="240" x2="270" y2="270" class="image" />
    <line x1="250" y1="220" x2="220" y2="210" class="image" />
    <line x1="250" y1="220" x2="280" y2="210" class="image" />
  </g>
</svg>