<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">steely</text>
  <text x="50" y="120" class="subtitle">[ˈstiːli] adj. 钢铁般的，坚硬的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> steel (钢铁) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一块巨大的钢铁前，他的眼神如同钢铁般坚硬，
    <tspan x="50" dy="25">仿佛任何困难都无法动摇他的决心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His steely determination helped him overcome all obstacles.
  </text>
  <text x="50" y="310" class="content">
    他钢铁般的决心帮助他克服了所有障碍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Steel block -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Person -->
    <circle cx="250" cy="75" r="20" class="image" />
    <line x1="250" y1="95" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="120" x2="220" y2="110" class="image" />
    <line x1="250" y1="120" x2="280" y2="110" class="image" />
    <!-- Eyes -->
    <circle cx="240" cy="65" r="5" class="image" fill="#000" />
    <circle cx="260" cy="65" r="5" class="image" fill="#000" />
  </g>
</svg>