<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shout</text>
  <text x="50" y="120" class="subtitle">[ʃaʊt] v. 呼喊，喊叫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shout (源自中古英语 shouten，意为“大声喊叫”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在山顶上，"大声喊叫(shout)"，
    <tspan x="50" dy="25">声音在山谷中回荡，仿佛整个世界都能听到他的呼喊。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She shouted for help when she saw the accident.
  </text>
  <text x="50" y="310" class="content">
    她看到事故时大声呼救。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,200 L100,0 L200,200 Z" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Sound waves -->
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="170" cy="150" r="15" class="image" />
    <circle cx="190" cy="150" r="20" class="image" />
  </g>
</svg>