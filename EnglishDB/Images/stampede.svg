<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stampede</text>
  <text x="50" y="120" class="subtitle">[stæmˈpid] n. 踩踏事件，惊逃；v. 惊逃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stamp (踩踏) + -ede (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群动物在草原上，"踩踏(stamp)"
    <tspan x="50" dy="25">着地面，惊慌失措地"逃(ede)"跑，</tspan>
    <tspan x="50" dy="25">这就是"stampede"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd stampeded when the fire alarm went off.
  </text>
  <text x="50" y="310" class="content">
    火警响起时，人群惊慌失措地逃跑了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Animals -->
    <circle cx="50" cy="130" r="15" class="image" />
    <circle cx="100" cy="120" r="15" class="image" />
    <circle cx="150" cy="110" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="90" r="15" class="image" />
    <!-- Stamping -->
    <line x1="50" y1="130" x2="50" y2="150" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="150" y1="110" x2="150" y2="150" class="image" />
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="250" y1="90" x2="250" y2="150" class="image" />
  </g>
</svg>