<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">transfer</text>
  <text x="50" y="120" class="subtitle">[trænsˈfɜːr] v. 转移，调动；n. 转移，转让</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trans- (跨越) + fer (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人将一个大包裹"跨越(trans-)"
    <tspan x="50" dy="25">空间，"携带(fer)"到另一个地方，这就是转移(transfer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He decided to transfer his funds to a different bank.
  </text>
  <text x="50" y="310" class="content">
    他决定将资金转移到另一家银行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person carrying a package -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="150" class="image" /> <!-- Right arm -->
    <rect x="70" y="140" width="60" height="40" class="image" /> <!-- Package -->
    <line x1="130" y1="160" x2="200" y2="160" class="image" /> <!-- Path -->
    <circle cx="200" cy="100" r="20" class="image" /> <!-- Destination -->
  </g>
</svg>