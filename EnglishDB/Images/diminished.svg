<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diminished</text>
  <text x="50" y="120" class="subtitle">[dɪˈmɪnɪʃt] adj. 减少的，减弱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + min (小) + -ish (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，"被分开(di-)"成许多小气球，
    <tspan x="50" dy="25">每个气球都"变小(min)"了，这就是"减少(diminish)"的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's profits have diminished over the past year.
  </text>
  <text x="50" y="310" class="content">
    公司的利润在过去一年中有所减少。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Small balloons -->
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="150" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <circle cx="350" cy="150" r="20" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="100" x2="190" y2="100" class="image" />
    <polygon points="190,90 200,100 190,110" class="image" />
  </g>
</svg>