<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #D32F2F; }
      .subtitle { font: italic 24px serif; fill: #455A64; }
      .content { font: 18px sans-serif; fill: #333333; }
      .highlight { font-weight: bold; fill: #FF5722; }
      .story { font: 16px serif; fill: #1976D2; }
      .image { stroke: #757575; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Marxism</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrksɪzəm] n. 马克思主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Marx (马克思) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象马克思(Marx)站在一个巨大的书堆上，手中拿着一本厚重的书，
    <tspan x="50" dy="25">书上写着"主义(ism)"，象征着他的思想和理论体系——马克思主义(Marxism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He studied Marxism in university.
  </text>
  <text x="50" y="310" class="content">
    他在大学里学习了马克思主义。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Marx -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Book -->
    <rect x="100" y="80" width="150" height="140" class="image" />
    <text x="120" y="150" class="content" style="font-size: 24px;">主义</text>
    <!-- Bookshelf -->
    <rect x="0" y="220" width="350" height="50" class="image" />
    <rect x="0" y="270" width="350" height="50" class="image" />
    <rect x="0" y="320" width="350" height="50" class="image" />
  </g>
</svg>