<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .snow { fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snowy</text>
  <text x="50" y="120" class="subtitle">[ˈsnoʊi] adj. 下雪的，多雪的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snow (雪) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冬天的早晨，"雪(snow)"
    <tspan x="50" dy="25">覆盖了整个世界，到处都是白茫茫的，这就是"下雪的(snowy)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mountains were covered in a thick, snowy blanket.
  </text>
  <text x="50" y="310" class="content">
    山脉被厚厚的雪覆盖，像盖了一层雪白的毯子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snowy landscape -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Snowflakes -->
    <circle cx="50" cy="50" r="10" class="snow" />
    <circle cx="100" cy="70" r="10" class="snow" />
    <circle cx="150" cy="90" r="10" class="snow" />
    <circle cx="200" cy="110" r="10" class="snow" />
    <circle cx="250" cy="130" r="10" class="snow" />
    <circle cx="300" cy="150" r="10" class="snow" />
    <!-- Snow-covered ground -->
    <rect x="0" y="180" width="350" height="20" class="snow" />
  </g>
</svg>