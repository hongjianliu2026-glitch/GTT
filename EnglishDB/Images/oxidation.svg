<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oxidation</text>
  <text x="50" y="120" class="subtitle">[ˌɒksɪˈdeɪʃən] n. 氧化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ox- (氧) + id (状态) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个金属物体在空气中，"氧(ox-)"
    <tspan x="50" dy="25">气逐渐侵蚀它，使其表面变得"状态(id)"</tspan>
    <tspan x="50" dy="25">不佳，这就是"氧化(oxidation)"的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The oxidation of the metal caused it to rust.
  </text>
  <text x="50" y="310" class="content">
    金属的氧化导致它生锈了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Metal object -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Oxygen molecules -->
    <circle cx="20" cy="120" r="10" class="image" />
    <circle cx="50" cy="120" r="10" class="image" />
    <circle cx="80" cy="120" r="10" class="image" />
    <circle cx="110" cy="120" r="10" class="image" />
    <circle cx="140" cy="120" r="10" class="image" />
    <!-- Rust effect -->
    <rect x="20" y="20" width="110" height="60" class="image" />
    <line x1="30" y1="30" x2="120" y2="30" class="image" />
    <line x1="30" y1="40" x2="120" y2="40" class="image" />
    <line x1="30" y1="50" x2="120" y2="50" class="image" />
    <line x1="30" y1="60" x2="120" y2="60" class="image" />
  </g>
</svg>