<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reign</text>
  <text x="50" y="120" class="subtitle">[reɪn] n. 统治，支配；v. 统治，占主导地位</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再，重新) + ign (火)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个国王坐在宝座上，"重新点燃(re-ign)"
    <tspan x="50" dy="25">他的统治之火，继续统治(reign)他的王国。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The queen's reign lasted for 50 years.
  </text>
  <text x="50" y="310" class="content">
    女王的统治持续了50年。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Throne -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- King on throne -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="210" class="image" />
    <line x1="175" y1="180" x2="200" y2="210" class="image" />
    <line x1="175" y1="150" x2="120" y2="140" class="image" />
    <line x1="175" y1="150" x2="230" y2="140" class="image" />
    <!-- Fire -->
    <path d="M200,50 C210,30 240,30 250,50 C260,70 230,70 220,50 Z" class="image" />
    <path d="M210,60 C220,40 250,40 260,60 C270,80 240,80 230,60 Z" class="image" />
  </g>
</svg>