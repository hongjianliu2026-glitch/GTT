<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">triad</text>
  <text x="50" y="120" class="subtitle">[ˈtraɪæd] n. 三人组合，三合一</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tri- (三) + ad (组合)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个舞台上有三个表演者，他们紧密合作，
    <tspan x="50" dy="25">形成了一个完美的"三合一(tri-ad)"组合，这就是triad。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The band is known for their unique triad of vocalists.
  </text>
  <text x="50" y="310" class="content">
    这个乐队以其独特的三位主唱组合而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Performers -->
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
    <!-- Connecting lines -->
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <line x1="220" y1="100" x2="280" y2="100" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
  </g>
</svg>