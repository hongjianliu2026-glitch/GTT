<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">objective</text>
  <text x="50" y="120" class="subtitle">[əbˈdʒektɪv] n. 目标，目的；adj. 客观的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (朝向) + ject (投掷) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在靶场，"朝向(ob-)"靶子"投掷(ject)"飞镖，
    <tspan x="50" dy="25">他的目标(objective)就是击中靶心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His objective is to finish the project by the end of the month.
  </text>
  <text x="50" y="310" class="content">
    他的目标是月底前完成这个项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Target -->
    <circle cx="175" cy="100" r="80" class="image" />
    <circle cx="175" cy="100" r="60" class="image" />
    <circle cx="175" cy="100" r="40" class="image" />
    <circle cx="175" cy="100" r="20" class="image" />
    <!-- Dart -->
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <polygon points="150,100 140,95 140,105" class="image" />
  </g>
</svg>