<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clink</text>
  <text x="50" y="120" class="subtitle">[klɪŋk] v. 发出叮当声；n. 叮当声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clink (源自拟声词，模仿金属碰撞声)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个金属杯子在空中碰撞，发出清脆的"叮当(clink)"声，
    <tspan x="50" dy="25">这声音就像是在庆祝一场欢乐的聚会。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The glasses clinked as they toasted to the bride and groom.
  </text>
  <text x="50" y="310" class="content">
    他们举杯庆祝新郎新娘时，杯子发出了叮当声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two glasses clinking -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="130" y1="100" x2="220" y2="100" class="image" />
    <!-- Sound waves -->
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
  </g>
</svg>