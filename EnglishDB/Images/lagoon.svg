<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .sand { fill: #F1C40F; }
      .island { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lagoon</text>
  <text x="50" y="120" class="subtitle">[ləˈɡuːn] n. 泻湖，环礁湖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lag (隐藏) + -oon (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片被珊瑚礁"隐藏(lag)"的海水，形成了一个"泻湖(lagoon)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boat sailed into the calm lagoon.
  </text>
  <text x="50" y="310" class="content">
    船驶入了平静的泻湖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Water -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- Sand -->
    <rect x="50" y="150" width="250" height="50" class="sand" />
    <!-- Island -->
    <circle cx="200" cy="100" r="50" class="island" />
    <!-- Coral reef -->
    <path d="M50,0 Q100,50 150,0 T250,0" class="image" />
    <path d="M50,200 Q100,150 150,200 T250,200" class="image" />
  </g>
</svg>