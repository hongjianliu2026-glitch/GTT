<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infiltration</text>
  <text x="50" y="120" class="subtitle">[ˌɪnfɪlˈtreɪʃn] n. 渗透，潜入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + fil (线) + tration (过程)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条细线"悄悄进入(in-fil)"一个密闭的空间，
    <tspan x="50" dy="25">这个过程就是"渗透(tration)"，就像间谍潜入敌营。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The infiltration of the enemy base was successful.
  </text>
  <text x="50" y="310" class="content">
    潜入敌方基地的行动成功了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Closed space -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Infiltrating line -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- Spy -->
    <circle cx="30" cy="100" r="15" class="image" />
    <line x1="30" y1="115" x2="30" y2="150" class="image" />
    <line x1="30" y1="150" x2="10" y2="180" class="image" />
    <line x1="30" y1="150" x2="50" y2="180" class="image" />
    <line x1="30" y1="130" x2="60" y2="120" class="image" />
  </g>
</svg>