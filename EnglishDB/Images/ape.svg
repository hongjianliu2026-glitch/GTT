<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ape</text>
  <text x="50" y="120" class="subtitle">[eɪp] n. 猿，类人猿；v. 模仿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ape (源自拉丁语 "apēs"，意为猿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的猿猴(ape)在森林中模仿人类的动作，
    <tspan x="50" dy="25">它笨拙地挥舞着树枝，仿佛在模仿人类的舞蹈。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The comedian's act was so funny that everyone started to ape his gestures.
  </text>
  <text x="50" y="310" class="content">
    喜剧演员的表演太有趣了，大家都开始模仿他的动作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ape -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="160" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="240" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="240" class="image" /> <!-- Right leg -->
    <!-- Tree branch -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <line x1="125" y1="50" x2="125" y2="100" class="image" />
    <!-- Ape holding branch -->
    <line x1="50" y1="160" x2="125" y2="80" class="image" />
  </g>
</svg>