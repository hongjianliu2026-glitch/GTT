<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mosquito</text>
  <text x="50" y="120" class="subtitle">[məˈskiːtoʊ] n. 蚊子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mosqui (小虫) + -to (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小虫子(mosqui)在夜晚嗡嗡作响，
    <tspan x="50" dy="25">它轻轻地(to)叮咬你，这就是蚊子(mosquito)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mosquito bite left an itchy red spot on my arm.
  </text>
  <text x="50" y="310" class="content">
    蚊子叮咬在我手臂上留下了一个痒痒的红点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mosquito body -->
    <ellipse cx="100" cy="100" rx="30" ry="15" class="image" />
    <!-- Mosquito wings -->
    <line x1="70" y1="85" x2="40" y2="70" class="image" />
    <line x1="70" y1="115" x2="40" y2="130" class="image" />
    <line x1="130" y1="85" x2="160" y2="70" class="image" />
    <line x1="130" y1="115" x2="160" y2="130" class="image" />
    <!-- Mosquito legs -->
    <line x1="70" y1="100" x2="50" y2="80" class="image" />
    <line x1="70" y1="100" x2="50" y2="120" class="image" />
    <line x1="130" y1="100" x2="150" y2="80" class="image" />
    <line x1="130" y1="100" x2="150" y2="120" class="image" />
    <!-- Mosquito proboscis -->
    <line x1="100" y1="80" x2="100" y2="50" class="image" />
  </g>
</svg>