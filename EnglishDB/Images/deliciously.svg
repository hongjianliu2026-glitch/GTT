<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F57F17; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deliciously</text>
  <text x="50" y="120" class="subtitle">[dɪˈlɪʃəsli] adv. 美味地，可口地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + lic (引诱) + ious (形容词后缀) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"强调地引诱(de-lic-ious-ly)"
    <tspan x="50" dy="25">食客们品尝他的美食，美味得让人无法抗拒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake was deliciously sweet.
  </text>
  <text x="50" y="310" class="content">
    蛋糕甜得美味可口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Kitchen -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Food -->
    <circle cx="100" cy="80" r="20" class="image" /> <!-- Cake -->
    <rect x="150" y="60" width="40" height="40" class="image" /> <!-- Vegetable -->
    <rect x="200" y="60" width="40" height="40" class="image" /> <!-- Meat -->
    <!-- Smiling face -->
    <circle cx="300" cy="80" r="20" class="image" />
    <line x1="290" y1="70" x2="310" y2="70" class="image" />
    <line x1="295" y1="90" x2="305" y2="90" class="image" />
  </g>
</svg>