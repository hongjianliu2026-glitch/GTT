<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chile</text>
  <text x="50" y="120" class="subtitle">[ˈtʃaɪl] n. 辣椒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chil- (来自Nahuatl语言的“chilli”，意为辣椒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的辣椒，"chil-"
    <tspan x="50" dy="25">在阳光下闪闪发光，辣得让人直流汗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added a chile to the soup to make it spicy.
  </text>
  <text x="50" y="310" class="content">
    她在汤里加了一个辣椒，让它变得辣味十足。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chili pepper -->
    <path d="M50,50 Q100,20 150,50 T250,50" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <!-- Sun -->
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Sweat drops -->
    <circle cx="100" cy="120" r="5" class="image" />
    <circle cx="110" cy="130" r="5" class="image" />
    <circle cx="120" cy="140" r="5" class="image" />
  </g>
</svg>