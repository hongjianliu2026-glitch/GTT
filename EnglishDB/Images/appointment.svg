<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">appointment</text>
  <text x="50" y="120" class="subtitle">[əˈpɔɪntmənt] n. 约会，任命</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (加强) + point (指) + -ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用手指着日历，"加强指出(ap-point)"
    <tspan x="50" dy="25">某个时间点，这个时间点就是他的约会(appointment)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I made an appointment with the doctor for tomorrow.
  </text>
  <text x="50" y="310" class="content">
    我预约了明天和医生的会面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Dates -->
    <text x="70" y="50" class="content">1</text>
    <text x="120" y="50" class="content">2</text>
    <text x="170" y="50" class="content">3</text>
    <text x="220" y="50" class="content">4</text>
    <text x="270" y="50" class="content">5</text>
    <text x="70" y="80" class="content">6</text>
    <text x="120" y="80" class="content">7</text>
    <text x="170" y="80" class="content">8</text>
    <text x="220" y="80" class="content">9</text>
    <text x="270" y="80" class="content">10</text>
    <!-- Pointer -->
    <line x1="170" y1="110" x2="170" y2="140" class="image" />
    <line x1="170" y1="140" x2="150" y2="160" class="image" />
    <line x1="170" y1="140" x2="190" y2="160" class="image" />
  </g>
</svg>