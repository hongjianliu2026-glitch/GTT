<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liqueur</text>
  <text x="50" y="120" class="subtitle">[lɪˈkʊər] n. 利口酒，甜酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liqu (液体) + eur (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调酒师在调制一杯"液体(liqu)"，
    <tspan x="50" dy="25">这杯酒因为加入了各种香料而变得特别甜美，</tspan>
    <tspan x="50" dy="25">这就是利口酒(liqueur)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He enjoyed a glass of cherry liqueur after dinner.
  </text>
  <text x="50" y="310" class="content">
    他晚餐后喜欢喝一杯樱桃利口酒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="10" y="10" width="80" height="140" class="image" />
    <!-- Liquid -->
    <rect x="15" y="15" width="70" height="130" fill="#FF6F61" />
    <!-- Cherry -->
    <circle cx="50" cy="120" r="10" fill="#8B0000" />
    <circle cx="50" cy="120" r="5" fill="#FFD700" />
  </g>
</svg>