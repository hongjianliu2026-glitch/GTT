<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">balmy</text>
  <text x="50" y="120" class="subtitle">[ˈbɑːmɪ] adj. 温和的，芳香的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> balm (香脂) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温暖的夏日，空气中弥漫着香脂(balm)的芳香，
    <tspan x="50" dy="25">这种温和(balmy)的香气让人感到无比舒适。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The balmy breeze made the beach a perfect spot for relaxation.
  </text>
  <text x="50" y="310" class="content">
    温和的海风使得海滩成为了一个完美的放松之地。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Beach -->
    <rect x="0" y="150" width="350" height="150" fill="#D4AC0D" />
    <!-- Palm tree -->
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="30" y2="80" class="image" />
    <line x1="50" y1="50" x2="70" y2="80" class="image" />
    <line x1="50" y1="50" x2="40" y2="100" class="image" />
    <line x1="50" y1="50" x2="60" y2="100" class="image" />
    <!-- Person relaxing -->
    <circle cx="200" cy="200" r="20" fill="#2C3E50" />
    <line x1="200" y1="220" x2="200" y2="260" class="image" />
    <line x1="200" y1="260" x2="180" y2="300" class="image" />
    <line x1="200" y1="260" x2="220" y2="300" class="image" />
    <line x1="200" y1="240" x2="170" y2="230" class="image" />
    <line x1="200" y1="240" x2="230" y2="230" class="image" />
  </g>
</svg>