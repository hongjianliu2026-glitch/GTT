<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tree</text>
  <text x="50" y="120" class="subtitle">[triː] n. 树</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tre- (树木)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵高大的树，"树(tre-)"
    <tspan x="50" dy="25">在森林中屹立不倒，象征着生命与自然。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old oak tree provided shade in the summer.
  </text>
  <text x="50" y="310" class="content">
    那棵老橡树在夏天提供了阴凉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree trunk -->
    <rect x="150" y="100" width="20" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="160" y1="100" x2="100" y2="50" class="image" />
    <line x1="160" y1="100" x2="220" y2="50" class="image" />
    <line x1="160" y1="150" x2="100" y2="100" class="image" />
    <line x1="160" y1="150" x2="220" y2="100" class="image" />
    <line x1="160" y1="200" x2="100" y2="150" class="image" />
    <line x1="160" y1="200" x2="220" y2="150" class="image" />
    <!-- Tree leaves -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="220" cy="50" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="220" cy="150" r="10" class="image" />
  </g>
</svg>