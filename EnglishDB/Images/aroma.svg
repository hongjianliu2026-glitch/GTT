<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aroma</text>
  <text x="50" y="120" class="subtitle">[əˈroʊmə] n. 芳香，香气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + roma (气味)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个花园里，"加强的气味(a-roma)"
    <tspan x="50" dy="25">弥漫在空气中，让人陶醉其中。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The aroma of freshly baked bread filled the kitchen.
  </text>
  <text x="50" y="310" class="content">
    新鲜出炉的面包的香气充满了厨房。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flowers -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Aroma -->
    <path d="M50 120 Q100 50 150 120 T250 120" class="image" />
    <path d="M50 130 Q100 60 150 130 T250 130" class="image" />
    <path d="M50 140 Q100 70 150 140 T250 140" class="image" />
  </g>
</svg>