<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FFC107; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #FF5722; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">solar</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊlər] adj. 太阳的，日光的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sol (太阳) + -ar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太阳(sol)在天空中，
    <tspan x="50" dy="25">它的光芒照亮了整个世界，这就是"太阳的(solar)"力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The solar panels generate electricity from sunlight.
  </text>
  <text x="50" y="310" class="content">
    太阳能电池板利用阳光发电。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Sun -->
    <circle cx="150" cy="150" r="100" class="image" fill="#FFEB3B" />
    <!-- Rays -->
    <line x1="150" y1="50" x2="150" y2="0" class="image" />
    <line x1="250" y1="150" x2="300" y2="150" class="image" />
    <line x1="150" y1="250" x2="150" y2="300" class="image" />
    <line x1="50" y1="150" x2="0" y2="150" class="image" />
    <line x1="100" y1="100" x2="50" y2="50" class="image" />
    <line x1="200" y1="100" x2="250" y2="50" class="image" />
    <line x1="200" y1="200" x2="250" y2="250" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
  </g>
</svg>