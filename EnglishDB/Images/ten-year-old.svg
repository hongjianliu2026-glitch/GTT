<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ten-year-old</text>
  <text x="50" y="120" class="subtitle">[ˈten jɪr əʊld] n. 十岁的小孩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ten (十) + year (年) + old (老的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个十岁的小孩，"十年的岁月(ten-year)"
    <tspan x="50" dy="25">让他/她变得有些"老成(old)"，但依然充满活力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ten-year-old boy loves playing soccer.
  </text>
  <text x="50" y="310" class="content">
    这个十岁的小男孩喜欢踢足球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ten-year-old child -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Right arm -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <!-- Number 10 -->
    <text x="100" y="120" class="content" font-size="60">10</text>
  </g>
</svg>