<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hour</text>
  <text x="50" y="120" class="subtitle">[ˈaʊər] n. 小时</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hor (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的时钟，"时间(hor)"
    <tspan x="50" dy="25">在指针的转动中流逝，每一小时(hour)都</tspan>
    <tspan x="50" dy="25">是生命的一部分。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I spent an hour reading this book.
  </text>
  <text x="50" y="310" class="content">
    我花了一个小时读这本书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="100" y1="100" x2="100" y2="30" class="image" />
    <line x1="100" y1="100" x2="170" y2="100" class="image" />
    <!-- Clock numbers -->
    <text x="85" y="40" class="content">12</text>
    <text x="175" y="110" class="content">3</text>
    <text x="100" y="185" class="content">6</text>
    <text x="25" y="110" class="content">9</text>
  </g>
</svg>