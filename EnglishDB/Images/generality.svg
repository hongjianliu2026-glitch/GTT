<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">generality</text>
  <text x="50" y="120" class="subtitle">[ˌdʒɛnəˈrælɪti] n. 一般性，普遍性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gen- (产生) + -er- (连接词) + -al- (形容词后缀) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"产生(gen-)"机器，它"普遍(general)"地
    <tspan x="50" dy="25">生产出各种物品，这些物品代表了"一般性(generality)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The generality of people prefer peace over war.
  </text>
  <text x="50" y="310" class="content">
    大多数人更喜欢和平而不是战争。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Machine -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Production line -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Products -->
    <circle cx="70" cy="65" r="10" class="image" />
    <circle cx="120" cy="65" r="10" class="image" />
    <circle cx="170" cy="65" r="10" class="image" />
    <circle cx="220" cy="65" r="10" class="image" />
    <circle cx="270" cy="65" r="10" class="image" />
    <!-- General symbol -->
    <text x="150" y="180" class="content" style="font-size: 48px;">∀</text>
  </g>
</svg>