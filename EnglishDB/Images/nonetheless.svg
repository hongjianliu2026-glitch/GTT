<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nonetheless</text>
  <text x="50" y="120" class="subtitle">[ˌnʌnðəˈlɛs] adv. 尽管如此，然而</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> non- (不) + the (这) + less (更少)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在面对困难时，"尽管不(non-)"
    <tspan x="50" dy="25">那么容易(the less)，但仍然坚持(nonetheless)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The weather was bad, but we went out nonetheless.
  </text>
  <text x="50" y="310" class="content">
    尽管天气不好，我们还是出去了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person facing a challenge -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Obstacle -->
    <rect x="70" y="80" width="100" height="40" class="image" />
    <!-- Arrow pointing to obstacle -->
    <line x1="20" y1="100" x2="120" y2="100" class="image" />
    <polygon points="120,100 110,90 110,110" class="image" />
    <!-- Text above obstacle -->
    <text x="100" y="70" class="content" text-anchor="middle">Challenge</text>
    <!-- Text below person -->
    <text x="20" y="200" class="content" text-anchor="middle">Nonetheless</text>
  </g>
</svg>