<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tern</text>
  <text x="50" y="120" class="subtitle">[tɜːrn] n. 燕鸥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tern (源自拉丁语 "ternus"，意为"三")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只燕鸥在空中优雅地飞翔，它的名字"tern"
    <tspan x="50" dy="25">源自拉丁语的"三"，象征着它独特的三趾爪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tern gracefully glided over the ocean waves.
  </text>
  <text x="50" y="310" class="content">
    燕鸥优雅地滑翔在海浪之上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bird body -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Beak -->
    <line x1="130" y1="100" x2="160" y2="100" class="image" />
    <!-- Wings -->
    <line x1="70" y1="80" x2="40" y2="50" class="image" />
    <line x1="70" y1="120" x2="40" y2="150" class="image" />
    <!-- Tail -->
    <line x1="100" y1="130" x2="100" y2="160" class="image" />
    <!-- Legs -->
    <line x1="90" y1="160" x2="90" y2="180" class="image" />
    <line x1="110" y1="160" x2="110" y2="180" class="image" />
    <!-- Three toes -->
    <line x1="90" y1="180" x2="80" y2="190" class="image" />
    <line x1="90" y1="180" x2="90" y2="190" class="image" />
    <line x1="90" y1="180" x2="100" y2="190" class="image" />
    <line x1="110" y1="180" x2="100" y2="190" class="image" />
    <line x1="110" y1="180" x2="110" y2="190" class="image" />
    <line x1="110" y1="180" x2="120" y2="190" class="image" />
  </g>
</svg>