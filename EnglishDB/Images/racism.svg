<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">racism</text>
  <text x="50" y="120" class="subtitle">[ˈreɪsɪzəm] n. 种族主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rac (种族) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"种族(rac)"标志被锁链束缚，象征着"种族主义(racism)"
    <tspan x="50" dy="25">对不同种族的压迫和歧视。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Racism is a major issue in many societies.
  </text>
  <text x="50" y="310" class="content">
    种族主义是许多社会中的一个主要问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Racial symbol -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Chains -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="70" y1="180" x2="130" y2="220" class="image" />
    <line x1="70" y1="220" x2="130" y2="180" class="image" />
    <!-- Lock -->
    <rect x="85" y="250" width="30" height="20" class="image" />
    <circle cx="100" cy="260" r="5" class="image" />
  </g>
</svg>