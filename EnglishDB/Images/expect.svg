<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">expect</text>
  <text x="50" y="120" class="subtitle">[ɪkˈspekt] v. 期望，预期</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + spect (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在门口，"向外看(ex-spect)"，
    <tspan x="50" dy="25">期待着某人的到来，这就是期望(expect)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We expect the package to arrive tomorrow.
  </text>
  <text x="50" y="310" class="content">
    我们预期包裹明天会到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Door -->
    <rect x="0" y="0" width="150" height="250" class="image" />
    <!-- Person -->
    <circle cx="75" cy="120" r="20" class="image" />
    <line x1="75" y1="140" x2="75" y2="200" class="image" />
    <line x1="75" y1="200" x2="50" y2="230" class="image" />
    <line x1="75" y1="200" x2="100" y2="230" class="image" />
    <line x1="75" y1="160" x2="100" y2="150" class="image" />
    <!-- Eye -->
    <circle cx="90" cy="110" r="5" class="image" />
  </g>
</svg>