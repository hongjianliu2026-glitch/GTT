<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .iceberg { fill: #AED6F1; }
      .water { fill: #85C1E9; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">iceberg</text>
  <text x="50" y="120" class="subtitle">[ˈaɪsbɜːrɡ] n. 冰山</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ice (冰) + berg (山)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的冰山，只有一小部分露出水面，
    <tspan x="50" dy="25">而大部分隐藏在水下，就像冰山(iceberg)一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Titanic sank after hitting an iceberg.
  </text>
  <text x="50" y="310" class="content">
    泰坦尼克号撞上冰山后沉没了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water -->
    <rect x="0" y="100" width="350" height="100" class="water" />
    <!-- Iceberg -->
    <polygon points="100,100 250,100 200,50 150,50" class="iceberg" />
    <polygon points="125,100 175,100 150,75" class="iceberg" />
    <polygon points="150,100 200,100 175,75" class="iceberg" />
    <!-- Hidden part -->
    <polygon points="125,100 175,100 150,125" class="iceberg" />
    <polygon points="150,100 200,100 175,125" class="iceberg" />
  </g>
</svg>