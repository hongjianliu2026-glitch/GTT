<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swivel</text>
  <text x="50" y="120" class="subtitle">[ˈswɪvəl] v. 旋转，转动；n. 旋转接头</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swiv (旋转) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小球在一个旋转接头上，"小(el)"
    <tspan x="50" dy="25">球不停地"旋转(swiv)"，就像一个旋转的舞者。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chair swiveled around when I sat down.
  </text>
  <text x="50" y="310" class="content">
    我坐下时，椅子转了一圈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Swivel joint -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Small ball -->
    <circle cx="100" cy="100" r="10" fill="#E74C3C" />
    <!-- Rotating lines -->
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="100" x2="50" y2="100" class="image" />
  </g>
</svg>