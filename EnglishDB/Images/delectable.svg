<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .food { fill: #FFD700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">delectable</text>
  <text x="50" y="120" class="subtitle">[dɪˈlɛktəbl] adj. 美味的，令人愉快的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + lect (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个美食家在品尝一道菜，"离开(de-)选择(lect)"
    <tspan x="50" dy="25">其他所有食物，只专注于这道美味(delectable)的佳肴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dessert was so delectable that I couldn't stop eating.
  </text>
  <text x="50" y="310" class="content">
    甜点太美味了，我停不下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="50" class="food" />
    <circle cx="200" cy="100" r="50" class="food" />
    <circle cx="300" cy="100" r="50" class="food" />
    <!-- Fork -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="170" y2="70" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>