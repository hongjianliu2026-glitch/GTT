<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">croon</text>
  <text x="50" y="120" class="subtitle">[kruːn] v. 低声哼唱，轻声歌唱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> croon (源自中古英语 crounen，意为低声哼唱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个歌手在月光下，"低声哼唱(croon)"
    <tspan x="50" dy="25">着温柔的旋律，仿佛在诉说一个动人的故事。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She crooned a lullaby to her baby.
  </text>
  <text x="50" y="310" class="content">
    她为她的宝宝轻声哼唱了一首摇篮曲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Singer -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="200" x2="240" y2="190" class="image" />
    <!-- Music notes -->
    <path d="M250,150 Q270,130 290,150 T330,150" class="image" />
    <path d="M260,170 Q280,150 300,170 T340,170" class="image" />
    <path d="M270,190 Q290,170 310,190 T350,190" class="image" />
  </g>
</svg>