<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">best-seller</text>
  <text x="50" y="120" class="subtitle">[ˈbɛstˈsɛlər] n. 畅销书</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> best (最好的) + sell (卖) + -er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一本书在书店里，"卖得最好(best-sell-er)"，
    <tspan x="50" dy="25">人们争相购买，书架上只剩下寥寥几本。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This novel became a best-seller within a week.
  </text>
  <text x="50" y="310" class="content">
    这本小说在一周内成为了畅销书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Book -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <line x1="10" y1="10" x2="140" y2="10" class="image" />
    <line x1="10" y1="50" x2="140" y2="50" class="image" />
    <line x1="10" y1="90" x2="140" y2="90" class="image" />
    <line x1="10" y1="130" x2="140" y2="130" class="image" />
    <line x1="10" y1="170" x2="140" y2="170" class="image" />
    <!-- People -->
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="200" y1="80" x2="230" y2="70" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <line x1="250" y1="65" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="130" class="image" />
    <line x1="250" y1="100" x2="270" y2="130" class="image" />
    <line x1="250" y1="80" x2="280" y2="70" class="image" />
    <!-- Shelves -->
    <rect x="300" y="0" width="100" height="200" class="image" />
    <line x1="310" y1="10" x2="390" y2="10" class="image" />
    <line x1="310" y1="50" x2="390" y2="50" class="image" />
    <line x1="310" y1="90" x2="390" y2="90" class="image" />
    <line x1="310" y1="130" x2="390" y2="130" class="image" />
    <line x1="310" y1="170" x2="390" y2="170" class="image" />
  </g>
</svg>