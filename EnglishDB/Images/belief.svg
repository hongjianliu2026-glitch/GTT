      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">belief</text>
  <text x="50" y="120" class="subtitle">[bɪˈliːf] n. 信仰，信念</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> be- (使) + lief (爱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人心中充满了"爱(lief)"，这种爱使他"坚信(be-lief)"
    <tspan x="50" dy="25">某种信仰或信念，这种信念让他感到无比坚定。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her strong belief in justice motivated her to become a lawyer.
  </text>
  <text x="50" y="310" class="content">
    她对正义的坚定信念激励她成为了一名律师。
  </text>

