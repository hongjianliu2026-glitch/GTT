<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">find</text>
  <text x="50" y="120" class="subtitle">[faɪnd] v. 找到，发现</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fin (结束) + -d (过去式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个探险家在森林中，"结束(fin)"
    <tspan x="50" dy="25">寻找(find)，终于找到了宝藏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She finally found her lost keys under the sofa.
  </text>
  <text x="50" y="310" class="content">
    她终于在沙发下找到了丢失的钥匙。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="180" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="180" class="image" />
    <line x1="120" y1="180" x2="170" y2="100" class="image" />
    <line x1="170" y1="100" x2="220" y2="180" class="image" />
    <line x1="240" y1="180" x2="290" y2="100" class="image" />
    <line x1="290" y1="100" x2="340" y2="180" class="image" />
    <!-- Explorer -->
    <circle cx="200" cy="150" r="15" class="image" />
    <line x1="200" y1="165" x2="200" y2="190" class="image" />
    <line x1="200" y1="190" x2="180" y2="220" class="image" />
    <line x1="200" y1="190" x2="220" y2="220" class="image" />
    <line x1="200" y1="175" x2="230" y2="165" class="image" />
    <!-- Treasure -->
    <rect x="250" y="130" width="30" height="30" class="image" />
    <line x1="260" y1="140" x2="280" y2="160" class="image" />
    <line x1="260" y1="160" x2="280" y2="140" class="image" />
  </g>
</svg>