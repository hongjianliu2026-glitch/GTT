<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #34495E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chastity</text>
  <text x="50" y="120" class="subtitle">[ˈtʃæstɪti] n. 贞洁，纯洁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chaste (贞洁的) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个身穿白色长袍的女子，手持一朵洁白的百合花，象征着她的贞洁与纯洁。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She maintained her chastity throughout her life.
  </text>
  <text x="50" y="310" class="content">
    她一生都保持着贞洁。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Woman in white robe -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="70" y2="180" class="image" />
    <line x1="100" y1="150" x2="130" y2="180" class="image" />
    <line x1="100" y1="200" x2="70" y2="250" class="image" />
    <line x1="100" y1="200" x2="130" y2="250" class="image" />
    <!-- White robe -->
    <rect x="70" y="130" width="60" height="120" class="image" />
    <!-- White lily -->
    <line x1="100" y1="250" x2="100" y2="300" class="image" />
    <circle cx="100" cy="300" r="10" class="image" />
    <circle cx="90" cy="290" r="10" class="image" />
    <circle cx="110" cy="290" r="10" class="image" />
    <circle cx="100" cy="280" r="10" class="image" />
  </g>
</svg>