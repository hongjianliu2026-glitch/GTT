<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marine</text>
  <text x="50" y="120" class="subtitle">[məˈriːn] adj. 海的，海生的；n. 海军陆战队士兵</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar (海) + ine (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的海军陆战队士兵，站在波涛汹涌的"海(mar)"边，
    <tspan x="50" dy="25">他的身影与大海融为一体，展现出"海的(marine)"力量与威严。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The marine biologist studied the behavior of dolphins.
  </text>
  <text x="50" y="310" class="content">
    这位海洋生物学家研究了海豚的行为。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ocean waves -->
    <path d="M0 0 C 100 100, 200 100, 300 0 S 500 100, 600 0" class="image" />
    <path d="M0 50 C 100 150, 200 150, 300 50 S 500 150, 600 50" class="image" />
    <path d="M0 100 C 100 200, 200 200, 300 100 S 500 200, 600 100" class="image" />
    <!-- Soldier -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="130" y2="250" class="image" />
    <line x1="150" y1="220" x2="170" y2="250" class="image" />
    <line x1="150" y1="190" x2="180" y2="180" class="image" />
  </g>
</svg>