<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cockroach</text>
  <text x="50" y="120" class="subtitle">[ˈkɒkrəʊtʃ] n. 蟑螂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cock (公鸡) + roach (鱼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只"公鸡(cock)"和一条"鱼(roach)"结合，
    <tspan x="50" dy="25">变成了一个巨大的、令人毛骨悚然的蟑螂(cockroach)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cockroach scurried across the kitchen floor.
  </text>
  <text x="50" y="310" class="content">
    那只蟑螂飞快地穿过厨房地板。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cockroach body -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" />
    <!-- Cockroach head -->
    <circle cx="100" cy="70" r="20" class="image" />
    <!-- Cockroach antennae -->
    <line x1="80" y1="50" x2="60" y2="30" class="image" />
    <line x1="120" y1="50" x2="140" y2="30" class="image" />
    <!-- Cockroach legs -->
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />
    <line x1="70" y1="130" x2="50" y2="150" class="image" />
    <line x1="130" y1="130" x2="150" y2="150" class="image" />
  </g>
</svg>