<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">undaunted</text>
  <text x="50" y="120" class="subtitle">[ʌnˈdɔːntɪd] adj. 无畏的，勇敢的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + daunt (使胆怯)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇士面对巨龙，"不胆怯(un-daunt)"，
    <tspan x="50" dy="25">勇敢地挥舞着剑，展现出无畏的精神(undaunted)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Despite the storm, the sailors remained undaunted.
  </text>
  <text x="50" y="310" class="content">
    尽管遭遇风暴，水手们依然无所畏惧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dragon -->
    <path d="M50 50 C100 20, 150 20, 200 50 S300 80, 350 50" class="image" />
    <circle cx="350" cy="50" r="20" class="image" />
    <line x1="350" y1="70" x2="350" y2="100" class="image" />
    <line x1="350" y1="100" x2="330" y2="130" class="image" />
    <line x1="350" y1="100" x2="370" y2="130" class="image" />
    <!-- Warrior -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <line x1="100" y1="180" x2="70" y2="170" class="image" />
    <!-- Sword -->
    <line x1="100" y1="170" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="80" y2="100" class="image" />
    <line x1="100" y1="130" x2="120" y2="100" class="image" />
  </g>
</svg>