<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">singularity</text>
  <text x="50" y="120" class="subtitle">[ˌsɪŋɡjəˈlærəti] n. 单一，独特，奇点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> singul (单一) + -arity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个宇宙中的奇点，"单一(singul)"
    <tspan x="50" dy="25">且独特，它是一个无限小的点，却拥有无限大的能量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The singularity of the black hole is a fascinating concept.
  </text>
  <text x="50" y="310" class="content">
    黑洞的奇点是一个迷人的概念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Black hole -->
    <circle cx="175" cy="100" r="70" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="250" cy="70" r="5" class="image" />
    <circle cx="150" cy="150" r="5" class="image" />
    <!-- Light rays -->
    <line x1="175" y1="30" x2="175" y2="0" class="image" />
    <line x1="175" y1="170" x2="175" y2="200" class="image" />
    <line x1="105" y1="100" x2="0" y2="100" class="image" />
    <line x1="245" y1="100" x2="350" y2="100" class="image" />
  </g>
</svg>