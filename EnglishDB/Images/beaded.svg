<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beaded</text>
  <text x="50" y="120" class="subtitle">[ˈbidɪd] adj. 有珠子的，珠状的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bead (珠子) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条项链上挂满了闪闪发光的珠子，这些珠子就像星星一样点缀在夜空中，形成了一幅美丽的画面。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a beaded necklace to the party.
  </text>
  <text x="50" y="310" class="content">
    她戴着一条珠子项链去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Necklace -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <!-- Beads -->
    <circle cx="50" cy="20" r="10" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="50" cy="80" r="10" class="image" />
    <circle cx="50" cy="110" r="10" class="image" />
    <circle cx="50" cy="140" r="10" class="image" />
    <circle cx="50" cy="170" r="10" class="image" />
  </g>
</svg>