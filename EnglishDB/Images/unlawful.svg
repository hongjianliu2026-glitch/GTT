<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unlawful</text>
  <text x="50" y="120" class="subtitle">[ʌnˈlɔːfəl] adj. 非法的，违法的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + law (法律) + -ful (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个警察在追捕一个"不遵守法律(un-law-ful)"
    <tspan x="50" dy="25">的人，这个人因为违法行为而被通缉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police arrested him for unlawful possession of a weapon.
  </text>
  <text x="50" y="310" class="content">
    警察因他非法持有武器而逮捕了他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Police officer -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <rect x="10" y="180" width="20" height="10" class="image" />
    <line x1="20" y1="190" x2="20" y2="200" class="image" />

    <!-- Criminal -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <rect x="90" y="180" width="20" height="10" class="image" />
    <line x1="100" y1="190" x2="100" y2="200" class="image" />

    <!-- Handcuffs -->
    <line x1="20" y1="200" x2="100" y2="200" class="image" />
    <circle cx="20" cy="200" r="5" class="image" />
    <circle cx="100" cy="200" r="5" class="image" />
  </g>
</svg>