<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">situate</text>
  <text x="50" y="120" class="subtitle">[ˈsɪtʃuˌeɪt] v. 使位于，使处于</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sit (坐) + -u- + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在(sit)一个特定的位置，这个位置就是他所在的(situate)地方。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The school is situated in the heart of the city.
  </text>
  <text x="50" y="310" class="content">
    学校位于市中心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person sitting -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="160" class="image" />
    <line x1="50" y1="120" x2="70" y2="160" class="image" />
    <line x1="50" y1="90" x2="30" y2="100" class="image" />
    <line x1="50" y1="90" x2="70" y2="100" class="image" />

    <!-- Location marker -->
    <rect x="100" y="40" width="50" height="50" class="image" />
    <line x1="125" y1="90" x2="125" y2="150" class="image" />
    <line x1="125" y1="150" x2="105" y2="180" class="image" />
    <line x1="125" y1="150" x2="145" y2="180" class="image" />
  </g>
</svg>