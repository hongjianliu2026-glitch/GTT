<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .brass { fill: #DAA520; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brass</text>
  <text x="50" y="120" class="subtitle">[bræs] n. 黄铜，黄铜制品；厚脸皮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> br- (燃烧) + ass (驴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头燃烧的驴子(br-ass)，它的皮肤变成了黄铜色，
    <tspan x="50" dy="25">象征着坚韧和厚脸皮。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The brass doorknob was cold to the touch.
  </text>
  <text x="50" y="310" class="content">
    黄铜门把手摸起来很凉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Burning donkey -->
    <circle cx="100" cy="100" r="50" class="brass" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="250" class="image" />
    <line x1="100" y1="170" x2="150" y2="160" class="image" />
    <!-- Fire -->
    <circle cx="80" cy="80" r="10" class="brass" />
    <circle cx="120" cy="80" r="10" class="brass" />
    <circle cx="100" cy="60" r="10" class="brass" />
  </g>
</svg>