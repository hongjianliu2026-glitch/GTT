<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drop-off</text>
  <text x="50" y="120" class="subtitle">[ˈdrɒp ɒf] n. 下降，减少；卸货处</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drop (下降) + off (离开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在卸货处，"下降(drop)"货物后"离开(off)"，
    <tspan x="50" dy="25">这个过程就是drop-off。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The drop-off in sales was unexpected.
  </text>
  <text x="50" y="310" class="content">
    销售额的下降是出乎意料的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car -->
    <rect x="0" y="0" width="150" height="50" class="image" />
    <rect x="20" y="10" width="110" height="30" class="image" />
    <circle cx="40" cy="50" r="10" class="image" />
    <circle cx="120" cy="50" r="10" class="image" />
    <!-- Drop-off area -->
    <rect x="170" y="0" width="100" height="50" class="image" />
    <line x1="170" y1="25" x2="270" y2="25" class="image" />
    <line x1="220" y1="0" x2="220" y2="50" class="image" />
    <!-- Dropped item -->
    <rect x="200" y="30" width="20" height="20" class="image" />
  </g>
</svg>