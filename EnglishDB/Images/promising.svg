<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">promising</text>
  <text x="50" y="120" class="subtitle">[ˈprɑːmɪsɪŋ] adj. 有希望的，有前途的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + mise (发送)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个年轻人站在舞台上，"向前发送(pro-mise)"
    <tspan x="50" dy="25">出充满希望的信号，大家都认为他很有前途(promising)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The young artist is very promising.
  </text>
  <text x="50" y="310" class="content">
    这位年轻艺术家非常有前途。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person on stage -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="155" y2="190" class="image" />
    <line x1="175" y1="160" x2="195" y2="190" class="image" />
    <line x1="175" y1="140" x2="205" y2="130" class="image" />
    <!-- Signal -->
    <line x1="175" y1="100" x2="250" y2="50" class="image" />
    <line x1="250" y1="50" x2="270" y2="30" class="image" />
    <line x1="250" y1="50" x2="270" y2="70" class="image" />
  </g>
</svg>