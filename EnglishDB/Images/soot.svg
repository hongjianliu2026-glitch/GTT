<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .soot { fill: #34495E; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soot</text>
  <text x="50" y="120" class="subtitle">[sʊt] n. 煤烟，烟灰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soot (源自中古英语 soot，意为“烟灰”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个烟囱里冒出滚滚黑烟，"烟灰(soot)"
    <tspan x="50" dy="25">覆盖了整个天空，形成了一层厚厚的煤烟。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chimney emitted a cloud of soot.
  </text>
  <text x="50" y="310" class="content">
    烟囱冒出一团烟灰。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chimney -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Smoke -->
    <ellipse cx="50" cy="0" rx="50" ry="20" class="soot" />
    <ellipse cx="50" cy="-30" rx="60" ry="25" class="soot" />
    <ellipse cx="50" cy="-60" rx="70" ry="30" class="soot" />
    <ellipse cx="50" cy="-90" rx="80" ry="35" class="soot" />
  </g>
</svg>