<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">milling</text>
  <text x="50" y="120" class="subtitle">[ˈmɪlɪŋ] n. 碾磨，铣削；v. 碾磨，铣削</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mill (磨坊) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磨坊(mill)，里面有巨大的齿轮在转动，
    <tspan x="50" dy="25">将谷物碾磨成粉末，这个过程就是碾磨(milling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wheat is sent to the mill for milling.
  </text>
  <text x="50" y="310" class="content">
    小麦被送到磨坊进行碾磨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mill -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gear -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Wheat -->
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="220" y1="50" x2="220" y2="150" class="image" />
    <line x1="240" y1="50" x2="240" y2="150" class="image" />
    <line x1="260" y1="50" x2="260" y2="150" class="image" />
    <!-- Flour -->
    <line x1="300" y1="50" x2="300" y2="150" class="image" />
    <line x1="320" y1="50" x2="320" y2="150" class="image" />
    <line x1="340" y1="50" x2="340" y2="150" class="image" />
    <line x1="360" y1="50" x2="360" y2="150" class="image" />
  </g>
</svg>