<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #641E16; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">old</text>
  <text x="50" y="120" class="subtitle">[oʊld] adj. 老的，旧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ol (古)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的时钟，"古(ol)"
    <tspan x="50" dy="25">老的时钟滴答作响，象征着时间的流逝。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man sat by the window, watching the sunset.
  </text>
  <text x="50" y="310" class="content">
    老人坐在窗边，看着日落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old clock -->
    <circle cx="100" cy="100" r="80" class="image" />
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Old man -->
    <circle cx="300" cy="100" r="20" class="image" />
    <line x1="300" y1="120" x2="300" y2="180" class="image" />
    <line x1="300" y1="180" x2="280" y2="220" class="image" />
    <line x1="300" y1="180" x2="320" y2="220" class="image" />
    <line x1="300" y1="140" x2="280" y2="130" class="image" />
    <line x1="300" y1="140" x2="320" y2="130" class="image" />
    <!-- Window -->
    <rect x="250" y="50" width="100" height="100" class="image" />
    <line x1="275" y1="50" x2="275" y2="150" class="image" />
    <line x1="300" y1="50" x2="300" y2="150" class="image" />
    <line x1="325" y1="50" x2="325" y2="150" class="image" />
  </g>
</svg>