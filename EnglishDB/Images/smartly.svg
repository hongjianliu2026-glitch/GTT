<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">smartly</text>
  <text x="50" y="120" class="subtitle">[ˈsmɑːrtli] adv. 聪明地，机智地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> smart (聪明的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着西装的商人，"聪明地(smartly)"
    <tspan x="50" dy="25">在谈判桌上迅速做出决策，展现出他的智慧。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He handled the situation smartly.
  </text>
  <text x="50" y="310" class="content">
    他机智地处理了那个情况。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Businessman -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <circle cx="75" cy="50" r="30" class="image" />
    <line x1="75" y1="80" x2="75" y2="150" class="image" />
    <line x1="75" y1="150" x2="50" y2="180" class="image" />
    <line x1="75" y1="150" x2="100" y2="180" class="image" />
    <line x1="75" y1="110" x2="120" y2="100" class="image" />
    <line x1="75" y1="110" x2="30" y2="100" class="image" />
    <!-- Suit -->
    <rect x="50" y="80" width="50" height="70" class="image" />
    <rect x="40" y="150" width="70" height="50" class="image" />
    <!-- Table -->
    <rect x="170" y="100" width="200" height="100" class="image" />
    <!-- Documents -->
    <line x1="180" y1="120" x2="220" y2="120" class="image" />
    <line x1="180" y1="140" x2="220" y2="140" class="image" />
    <line x1="180" y1="160" x2="220" y2="160" class="image" />
  </g>
</svg>