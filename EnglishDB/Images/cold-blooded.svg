<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cold { fill: #3498DB; }
      .blood { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cold-blooded</text>
  <text x="50" y="120" class="subtitle">[ˌkoʊld ˈblʌdɪd] adj. 冷血的，无情的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cold (冷) + blood (血)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个冷血的蛇，它的血液是冷的，
    <tspan x="50" dy="25">所以它不会感到同情或怜悯，这就是“冷血的(cold-blooded)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The villain was described as cold-blooded.
  </text>
  <text x="50" y="310" class="content">
    反派被描述为冷血的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cold blood -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="40" class="cold" />
    <circle cx="150" cy="100" r="40" class="blood" />
    <!-- Snake -->
    <path d="M200,100 C220,50 280,50 300,100" class="image" />
    <path d="M300,100 C320,150 380,150 400,100" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="400" cy="100" r="10" class="image" />
  </g>
</svg>