<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .warning { fill: #E74C3C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">warning</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːrnɪŋ] n. 警告，告诫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> warn (警告) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的红色警示标志，上面写着"警告(warn)"，
    <tspan x="50" dy="25">提醒人们注意危险，这就是"警告(warning)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The warning sign was clearly visible.
  </text>
  <text x="50" y="310" class="content">
    警告标志清晰可见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warning sign -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,20 300,20 300,180 50,180" class="warning" />
    <text x="175" y="110" class="title" text-anchor="middle">WARNING</text>
    <!-- Exclamation mark -->
    <circle cx="175" cy="150" r="10" class="warning" />
    <line x1="175" y1="160" x2="175" y2="180" class="warning" />
  </g>
</svg>