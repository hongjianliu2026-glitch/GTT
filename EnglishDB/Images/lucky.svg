<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lucky</text>
  <text x="50" y="120" class="subtitle">[ˈlʌki] adj. 幸运的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> luck (运气) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在四叶草丛中，"运气(luck)"
    <tspan x="50" dy="25">爆棚，找到了一片四叶草，这就是幸运(lucky)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt lucky to have found such a great job.
  </text>
  <text x="50" y="310" class="content">
    她觉得自己很幸运能找到这么好的工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Four-leaf clover -->
    <path d="M 0 0 L 20 40 L 40 0 Z" class="image" />
    <path d="M 10 10 L 30 50 L 50 10 Z" class="image" />
    <path d="M 20 20 L 40 60 L 60 20 Z" class="image" />
    <path d="M 30 30 L 50 70 L 70 30 Z" class="image" />
    <!-- Person -->
    <circle cx="40" cy="100" r="15" class="image" />
    <line x1="40" y1="115" x2="40" y2="150" class="image" />
    <line x1="40" y1="150" x2="20" y2="180" class="image" />
    <line x1="40" y1="150" x2="60" y2="180" class="image" />
    <line x1="40" y1="130" x2="70" y2="120" class="image" />
  </g>
</svg>