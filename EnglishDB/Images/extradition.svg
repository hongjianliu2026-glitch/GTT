<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extradition</text>
  <text x="50" y="120" class="subtitle">[ˌekstrəˈdɪʃn] n. 引渡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + traditio (移交)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个罪犯被"向外移交(ex-traditio)"
    <tspan x="50" dy="25">给另一个国家，这个过程就是引渡(extradition)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The extradition of the fugitive was approved by the court.
  </text>
  <text x="50" y="310" class="content">
    法院批准了对逃犯的引渡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Border -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Handcuffs -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="250" y="20" width="50" height="100" class="image" />
    <!-- Arrow -->
    <line x1="125" y1="120" x2="225" y2="120" class="image" />
    <polygon points="225,120 215,115 215,125" class="image" />
    <!-- Criminal -->
    <circle cx="100" cy="70" r="15" class="image" />
    <line x1="100" y1="85" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="150" class="image" />
    <line x1="100" y1="100" x2="130" y2="90" class="image" />
  </g>
</svg>