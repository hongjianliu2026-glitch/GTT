<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aficionado</text>
  <text x="50" y="120" class="subtitle">[əˌfɪʃiəˈnɑːdoʊ] n. 狂热爱好者，迷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (加强) + fic (做) + ion (名词后缀) + ado (表示状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狂热爱好者，"加强做(a-fic-ion-ado)"
    <tspan x="50" dy="25">某件事，以至于他/她对这件事达到了痴迷的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is an aficionado of classic cars.
  </text>
  <text x="50" y="310" class="content">
    他是经典汽车的狂热爱好者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M50 150 C50 100 100 50 150 50 C200 50 250 100 250 150" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="120" y2="120" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Car -->
    <rect x="100" y="200" width="100" height="50" class="image" />
    <rect x="110" y="210" width="80" height="30" class="image" />
    <circle cx="120" cy="250" r="10" class="image" />
    <circle cx="180" cy="250" r="10" class="image" />
  </g>
</svg>