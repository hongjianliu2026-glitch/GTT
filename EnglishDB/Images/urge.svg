<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">urge</text>
  <text x="50" y="120" class="subtitle">[ɜːrdʒ] v. 催促，强烈要求；n. 强烈的欲望</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ur- (原始) + -ge (力量)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原始人(ur-)，他内心充满了力量(-ge)，
    <tspan x="50" dy="25">强烈地催促(urge)同伴们去狩猎。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He urged his team to work harder.
  </text>
  <text x="50" y="310" class="content">
    他催促他的团队更加努力工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Primitive figure -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="130" class="image" />
    <line x1="50" y1="150" x2="0" y2="130" class="image" />

    <!-- Arrow indicating urge -->
    <line x1="120" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />

    <!-- Group of people -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="300" y2="130" class="image" />
    <line x1="250" y1="140" x2="200" y2="130" class="image" />
  </g>
</svg>