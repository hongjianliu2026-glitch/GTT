<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pouring</text>
  <text x="50" y="120" class="subtitle">[ˈpɔːrɪŋ] v. 倾倒，倾泻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pour (倒) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水壶，"倾倒(pour)"
    <tspan x="50" dy="25">出源源不断的水流，就像暴雨倾盆而下。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It started pouring rain as soon as we stepped outside.
  </text>
  <text x="50" y="310" class="content">
    我们刚一出门，就开始下起了倾盆大雨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kettle -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="160" r="10" class="image" />
    <!-- Water pouring out -->
    <line x1="50" y1="160" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="30" y2="300" class="image" />
    <line x1="50" y1="250" x2="70" y2="300" class="image" />
    <line x1="50" y1="250" x2="50" y2="300" class="image" />
  </g>
</svg>