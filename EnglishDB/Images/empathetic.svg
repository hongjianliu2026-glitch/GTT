<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">empathetic</text>
  <text x="50" y="120" class="subtitle">[ˌɛmpəˈθɛtɪk] adj. 有同理心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> em- (进入) + path (感情) + -etic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人能够"进入(em-)"他人的"感情(path)"，
    <tspan x="50" dy="25">完全理解并感同身受，这就是有同理心(empathetic)的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is very empathetic and always listens to others' problems.
  </text>
  <text x="50" y="310" class="content">
    她非常有同理心，总是倾听他人的问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart -->
    <path d="M50,50 C50,25 90,25 90,50 S130,75 130,50 S170,25 170,50 S210,75 210,50 S250,25 250,50" class="image" />
    <!-- Person -->
    <circle cx="150" cy="150" r="30" class="image" />
    <line x1="150" y1="180" x2="150" y2="250" class="image" />
    <line x1="150" y1="250" x2="120" y2="300" class="image" />
    <line x1="150" y1="250" x2="180" y2="300" class="image" />
    <line x1="150" y1="200" x2="100" y2="180" class="image" />
    <line x1="150" y1="200" x2="200" y2="180" class="image" />
    <!-- Connection -->
    <line x1="150" y1="150" x2="150" y2="50" class="image" />
  </g>
</svg>