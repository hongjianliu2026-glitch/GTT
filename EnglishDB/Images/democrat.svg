<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Democrat</text>
  <text x="50" y="120" class="subtitle">[ˈdɛməkræt] n. 民主党人，民主主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> demo- (人民) + -cracy (统治)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人民(demo-)聚集在一起，共同决定(cracy)
    <tspan x="50" dy="25">国家的未来，这些人就是民主党人(Democrat)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a strong supporter of the Democrat Party.
  </text>
  <text x="50" y="310" class="content">
    他是民主党的大力支持者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <!-- Voting -->
    <line x1="50" y1="80" x2="200" y2="80" class="image" />
    <line x1="50" y1="80" x2="50" y2="120" class="image" />
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="200" y1="80" x2="200" y2="120" class="image" />
    <!-- Ballot box -->
    <rect x="50" y="130" width="150" height="50" class="image" />
    <line x1="125" y1="130" x2="125" y2="180" class="image" />
  </g>
</svg>