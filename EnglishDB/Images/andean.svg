<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Andean</text>
  <text x="50" y="120" class="subtitle">[ˈændiən] adj. 安第斯山的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Andes (安第斯山脉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的山脉，"安第斯山脉(Andes)"
    <tspan x="50" dy="25">高耸入云，它的存在让人联想到"安第斯山的(Andean)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Andean region is known for its unique biodiversity.
  </text>
  <text x="50" y="310" class="content">
    安第斯地区以其独特的生物多样性而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,150 100,0 200,150" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="50" rx="50" ry="20" class="image" />
    <ellipse cx="150" cy="30" rx="40" ry="15" class="image" />
  </g>
</svg>