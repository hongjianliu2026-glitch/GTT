<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">plague</text>
  <text x="50" y="120" class="subtitle">[pleɪɡ] n. 瘟疫，灾祸；v. 折磨，烦扰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> plag (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场瘟疫(plague)像"打击(plag)"一样席卷整个城市，
    <tspan x="50" dy="25">人们四处逃窜，试图躲避这场灾难。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Black Death was one of the most devastating plagues in history.
  </text>
  <text x="50" y="310" class="content">
    黑死病是历史上最严重的瘟疫之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="10" width="50" height="120" class="image" />
    <rect x="190" y="30" width="50" height="90" class="image" />
    <rect x="260" y="50" width="50" height="70" class="image" />
    <!-- Plague cloud -->
    <ellipse cx="200" cy="100" rx="150" ry="50" class="image" />
    <!-- People running -->
    <circle cx="80" cy="150" r="10" class="image" />
    <line x1="80" y1="160" x2="80" y2="180" class="image" />
    <line x1="80" y1="180" x2="70" y2="200" class="image" />
    <line x1="80" y1="180" x2="90" y2="200" class="image" />
    <line x1="80" y1="170" x2="100" y2="160" class="image" />
    <circle cx="150" cy="140" r="10" class="image" />
    <line x1="150" y1="150" x2="150" y2="170" class="image" />
    <line x1="150" y1="170" x2="140" y2="190" class="image" />
    <line x1="150" y1="170" x2="160" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="150" class="image" />
  </g>
</svg>