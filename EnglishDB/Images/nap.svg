<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nap</text>
  <text x="50" y="120" class="subtitle">[næp] n. 小睡，打盹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nap (源自中古英语，意为“打盹”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在阳光下，"打个小盹(nap)"，
    <tspan x="50" dy="25">它的眼睛微微闭上，身体放松，享受着短暂的休息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I usually take a nap after lunch.
  </text>
  <text x="50" y="310" class="content">
    我通常午饭后会小睡一会儿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="30" fill="#F1C40F" />
    <!-- Cat -->
    <circle cx="150" cy="100" r="20" fill="#34495E" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="140" x2="130" y2="130" class="image" />
    <line x1="150" y1="140" x2="170" y2="130" class="image" />
    <line x1="150" y1="160" x2="130" y2="180" class="image" />
    <line x1="150" y1="160" x2="170" y2="180" class="image" />
    <!-- Zzz -->
    <text x="180" y="120" font-size="30" fill="#7F8C8D">Zzz</text>
  </g>
</svg>