<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scrub</text>
  <text x="50" y="120" class="subtitle">[skrʌb] v. 擦洗，刷洗；n. 灌木丛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scru- (擦) + b (动作完成)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个顽皮的小孩，"用力擦(scru-b)"
    <tspan x="50" dy="25">地板上的污渍，直到它们消失不见。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spent hours scrubbing the kitchen floor.
  </text>
  <text x="50" y="310" class="content">
    她花了几个小时擦洗厨房地板。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Child -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Sponge -->
    <rect x="100" y="120" width="50" height="30" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <!-- Dirt -->
    <circle cx="200" cy="130" r="10" class="image" />
    <circle cx="220" cy="140" r="10" class="image" />
    <circle cx="240" cy="130" r="10" class="image" />
  </g>
</svg>