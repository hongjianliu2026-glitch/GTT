<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jeep</text>
  <text x="50" y="120" class="subtitle">[dʒiːp] n. 吉普车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自二战时期的军用车辆，后泛指小型越野车
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆吉普车在崎岖的山路上"颠簸前行(jeep)"，
    <tspan x="50" dy="25">它的坚固和灵活性让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They drove a jeep through the rugged terrain.
  </text>
  <text x="50" y="310" class="content">
    他们开着吉普车穿越崎岖的地形。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jeep outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Jeep body -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Wheels -->
    <circle cx="80" cy="140" r="20" class="image" />
    <circle cx="270" cy="140" r="20" class="image" />
    <!-- Windows -->
    <rect x="70" y="40" width="50" height="40" class="image" />
    <rect x="180" y="40" width="50" height="40" class="image" />
    <!-- Bumpers -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
  </g>
</svg>