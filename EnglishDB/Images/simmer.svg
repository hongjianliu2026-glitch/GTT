<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">simmer</text>
  <text x="50" y="120" class="subtitle">[ˈsɪmər] v. 煨，炖；n. 文火，煨</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sim (相似) + mer (海洋)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一锅汤在炉子上，"相似于海洋(sim-mer)"
    <tspan x="50" dy="25">的平静表面下，内部却在缓慢沸腾。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Let the soup simmer for 30 minutes.
  </text>
  <text x="50" y="310" class="content">
    让汤煨30分钟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pot -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Liquid -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#85C1E9" />
    <!-- Bubbles -->
    <circle cx="100" cy="100" r="10" class="image" fill="#F1C40F" />
    <circle cx="150" cy="120" r="10" class="image" fill="#F1C40F" />
    <circle cx="200" cy="140" r="10" class="image" fill="#F1C40F" />
    <!-- Stove -->
    <rect x="50" y="180" width="250" height="20" class="image" fill="#D35400" />
  </g>
</svg>