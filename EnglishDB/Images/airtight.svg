<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">airtight</text>
  <text x="50" y="120" class="subtitle">[ˈerˌtaɪt] adj. 密封的，不透气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> air (空气) + tight (紧的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个密封的罐子，"空气(air)被紧紧地锁住(tight)"，
    <tspan x="50" dy="25">一点空气都透不出去，这就是airtight(密封的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The jar is airtight, so the food stays fresh.
  </text>
  <text x="50" y="310" class="content">
    这个罐子是密封的，所以食物保持新鲜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jar -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Lid -->
    <rect x="0" y="0" width="200" height="50" class="image" />
    <!-- Air bubble -->
    <circle cx="100" cy="150" r="20" class="image" />
    <!-- Tight seal -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="50" y1="60" x2="150" y2="60" class="image" />
    <line x1="50" y1="70" x2="150" y2="70" class="image" />
  </g>
</svg>