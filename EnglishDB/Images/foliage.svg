<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">foliage</text>
  <text x="50" y="120" class="subtitle">[ˈfoʊliɪdʒ] n. 叶子，植物的叶子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> foli (叶子) + -age (集合名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林，"叶子(foli)"
    <tspan x="50" dy="25">聚集在一起(age)，形成了一片茂密的树叶(foliage)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sunlight filtered through the dense foliage.
  </text>
  <text x="50" y="310" class="content">
    阳光透过茂密的树叶洒下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree trunk -->
    <rect x="150" y="0" width="20" height="200" class="image" />
    <!-- Leaves -->
    <circle cx="160" cy="100" r="50" class="leaf" />
    <circle cx="120" cy="120" r="40" class="leaf" />
    <circle cx="200" cy="120" r="40" class="leaf" />
    <circle cx="160" cy="150" r="30" class="leaf" />
    <circle cx="130" cy="160" r="20" class="leaf" />
    <circle cx="190" cy="160" r="20" class="leaf" />
  </g>
</svg>