<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">actuality</text>
  <text x="50" y="120" class="subtitle">[ˌæktʃuˈælɪti] n. 现实，实际存在的事物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> act (做) + -ual (形容词后缀) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师在舞台上表演，"做(act)"
    <tspan x="50" dy="25">出各种神奇的戏法，但最终观众发现这些都只是幻象，</tspan>
    <tspan x="50" dy="25">而真正的现实(actuality)是魔术师在幕后默默工作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The actuality of the situation was much different from what we had imagined.
  </text>
  <text x="50" y="310" class="content">
    实际情况与我们想象的截然不同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Magician -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Illusion -->
    <rect x="150" y="50" width="100" height="100" class="image" />
    <!-- Reality -->
    <rect x="270" y="50" width="50" height="100" class="image" />
    <line x1="295" y1="50" x2="295" y2="150" class="image" />
    <line x1="270" y1="75" x2="320" y2="75" class="image" />
    <line x1="270" y1="100" x2="320" y2="100" class="image" />
    <line x1="270" y1="125" x2="320" y2="125" class="image" />
  </g>
</svg>