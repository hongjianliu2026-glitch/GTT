<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9FBE7; }
      .title { font: bold 48px sans-serif; fill: #F39C12; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">luminous</text>
  <text x="50" y="120" class="subtitle">[ˈluːmɪnəs] adj. 发光的，明亮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lumin (光) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚，"光(lumin)"从天空中洒下，
    <tspan x="50" dy="25">整个世界都被照亮，变得"明亮(luminous)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stars in the sky were luminous, even in the city.
  </text>
  <text x="50" y="310" class="content">
    即使在城市里，天上的星星也闪闪发光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Moon -->
    <circle cx="50" cy="50" r="30" fill="#F1C40F" />
    <!-- Stars -->
    <circle cx="150" cy="30" r="5" fill="#F1C40F" />
    <circle cx="200" cy="60" r="5" fill="#F1C40F" />
    <circle cx="250" cy="40" r="5" fill="#F1C40F" />
    <circle cx="300" cy="70" r="5" fill="#F1C40F" />
    <!-- Light rays -->
    <line x1="50" y1="80" x2="50" y2="200" class="image" />
    <line x1="30" y1="100" x2="70" y2="100" class="image" />
    <line x1="20" y1="120" x2="80" y2="120" class="image" />
    <line x1="10" y1="140" x2="90" y2="140" class="image" />
  </g>
</svg>