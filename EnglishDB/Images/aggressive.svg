<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aggressive</text>
  <text x="50" y="120" class="subtitle">[əˈɡresɪv] adj. 侵略性的，好斗的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ag- (朝向) + gress (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狮子"朝向(ag-)"猎物"走(gress)"去，
    <tspan x="50" dy="25">它的动作充满了侵略性(aggressive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company took an aggressive approach to market expansion.
  </text>
  <text x="50" y="310" class="content">
    公司采取了激进的市场扩张策略。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="20" y2="220" class="image" />
    <line x1="50" y1="180" x2="80" y2="220" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Arrow -->
    <line x1="120" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
    <!-- Target -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="80" x2="250" y2="120" class="image" />
    <line x1="230" y1="100" x2="270" y2="100" class="image" />
  </g>
</svg>