<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retire</text>
  <text x="50" y="120" class="subtitle">[rɪˈtaɪər] v. 退休，撤退</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (向后) + tire (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在工作中感到疲惫，"向后拉(re-tire)"
    <tspan x="50" dy="25">自己，决定退休(retire)，享受悠闲的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He decided to retire at the age of 60.
  </text>
  <text x="50" y="310" class="content">
    他决定在60岁时退休。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person sitting on a chair -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="160" class="image" />
    <line x1="50" y1="120" x2="70" y2="160" class="image" />
    <line x1="50" y1="90" x2="30" y2="100" class="image" />
    <line x1="50" y1="90" x2="70" y2="100" class="image" />
    <!-- Chair -->
    <rect x="30" y="160" width="40" height="20" class="image" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="30" class="image" />
    <!-- Relaxing -->
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="150" y1="100" x2="130" y2="90" class="image" />
    <line x1="150" y1="100" x2="170" y2="90" class="image" />
  </g>
</svg>