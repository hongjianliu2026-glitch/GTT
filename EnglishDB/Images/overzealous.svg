<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">overzealous</text>
  <text x="50" y="120" class="subtitle">[ˌoʊvərˈziləs] adj. 过分热心的，过度狂热的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> over- (过度) + zealous (热心的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在工作中"过度热心(over-zealous)"，
    <tspan x="50" dy="25">以至于他的热情像火焰一样燃烧，甚至烧到了自己。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His overzealous approach to the project scared off potential investors.
  </text>
  <text x="50" y="310" class="content">
    他对项目过分热心的态度吓跑了潜在的投资者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flame -->
    <path d="M 0 100 Q 50 50 100 100 T 200 100" class="image" />
    <path d="M 0 100 Q 50 150 100 100 T 200 100" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="190" x2="70" y2="180" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
    <!-- Flame around person -->
    <path d="M 80 150 Q 100 130 120 150" class="image" />
    <path d="M 80 150 Q 100 170 120 150" class="image" />
  </g>
</svg>