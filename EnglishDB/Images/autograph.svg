<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">autograph</text>
  <text x="50" y="120" class="subtitle">[ˈɔːtəɡræf] n. 亲笔签名</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> auto- (自己) + graph (写)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个名人，"自己写下(auto-graph)"
    <tspan x="50" dy="25">他的名字，这个签名就是他的亲笔签名(autograph)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fans were thrilled to get the actor's autograph.
  </text>
  <text x="50" y="310" class="content">
    粉丝们非常激动地得到了这位演员的亲笔签名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Signature -->
    <path d="M50 50 C60 30, 100 30, 120 50 S180 70, 200 50" class="image" />
    <!-- Hand writing -->
    <circle cx="30" cy="40" r="10" class="image" />
    <line x1="30" y1="50" x2="30" y2="80" class="image" />
    <line x1="30" y1="80" x2="20" y2="100" class="image" />
    <line x1="30" y1="80" x2="40" y2="100" class="image" />
    <line x1="30" y1="60" x2="50" y2="50" class="image" />
  </g>
</svg>