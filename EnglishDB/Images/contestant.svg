<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contestant</text>
  <text x="50" y="120" class="subtitle">[kənˈtɛstənt] n. 参赛者，竞争者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + test (测试) + -ant (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人共同参与一个测试，他们都是参赛者(contestant)，
    <tspan x="50" dy="25">每个人都渴望在比赛中脱颖而出。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The contestant from Team A won the first prize.
  </text>
  <text x="50" y="310" class="content">
    来自A队的参赛者赢得了第一名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Contestant -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Podium -->
    <rect x="0" y="200" width="100" height="20" class="image" />
    <rect x="20" y="220" width="60" height="20" class="image" />
    <rect x="35" y="240" width="30" height="20" class="image" />
    <!-- Trophy -->
    <polygon points="100,200 120,240 80,240" class="image" />
    <line x1="100" y1="200" x2="100" y2="240" class="image" />
  </g>
</svg>