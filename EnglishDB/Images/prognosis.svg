<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prognosis</text>
  <text x="50" y="120" class="subtitle">[prɒɡˈnəʊsɪs] n. 预后，预测</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (在前面) + gnosis (知道)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在病人面前，"提前知道(pro-gnosis)"
    <tspan x="50" dy="25">病人的病情发展，这就是预后(prognosis)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The prognosis for recovery is good.
  </text>
  <text x="50" y="310" class="content">
    康复的预后很好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doctor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Patient -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="200" y2="120" class="image" />
    <!-- Thought bubble -->
    <path d="M 20 80 Q 50 50 80 80 Q 110 110 140 80 Q 170 50 200 80" class="image" />
    <text x="100" y="90" class="content" text-anchor="middle">预后</text>
  </g>
</svg>