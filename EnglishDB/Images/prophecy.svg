<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prophecy</text>
  <text x="50" y="120" class="subtitle">[ˈprɒfəsi] n. 预言，预言能力</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (在前面) + phec (说)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个先知站在高山上，"提前说出(pro-phec)"
    <tspan x="50" dy="25">未来的事件，这些话语就构成了一个预言(prophecy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient book contains many prophecies about the future.
  </text>
  <text x="50" y="310" class="content">
    这本古书包含了许多关于未来的预言。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <polygon points="0,200 175,0 350,200" class="image" />
    <!-- Prophet -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Speech bubble -->
    <path d="M175,80 Q225,70 225,40 Q225,10 175,20 Q125,10 125,40 Q125,70 175,80" class="image" />
    <text x="150" y="60" class="content" text-anchor="middle">未来</text>
  </g>
</svg>