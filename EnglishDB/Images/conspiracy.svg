<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conspiracy</text>
  <text x="50" y="120" class="subtitle">[kənˈspɪrəsi] n. 阴谋，共谋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + spir (呼吸) + -acy (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"共同呼吸(con-spir)"，
    <tspan x="50" dy="25">密谋着某个计划，这就是阴谋(conspiracy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police uncovered a conspiracy to steal the jewels.
  </text>
  <text x="50" y="310" class="content">
    警方揭露了一起盗窃珠宝的阴谋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Whispering -->
    <line x1="50" y1="115" x2="100" y2="115" class="image" />
    <line x1="100" y1="115" x2="150" y2="115" class="image" />
    <line x1="150" y1="115" x2="200" y2="115" class="image" />
    <!-- Secret plan -->
    <rect x="250" y="80" width="80" height="40" class="image" />
    <text x="260" y="105" class="content" fill="#34495E">Plan</text>
  </g>
</svg>