<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bounty</text>
  <text x="50" y="120" class="subtitle">[ˈbaʊnti] n. 慷慨，赏金，奖励</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bount (给予) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个慷慨的国王，"给予(bount)"
    <tspan x="50" dy="25">大量的赏金(bounty)给他的勇士们，</tspan>
    <tspan x="50" dy="25">以表彰他们的英勇。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company offered a bounty for the best new idea.
  </text>
  <text x="50" y="310" class="content">
    公司为最佳新创意提供了赏金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- King -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <!-- Crown -->
    <polygon points="40,80 60,80 55,60 45,60" class="image" />
    <!-- Treasure Chest -->
    <rect x="100" y="120" width="150" height="80" class="image" />
    <line x1="100" y1="160" x2="250" y2="160" class="image" />
    <line x1="175" y1="120" x2="175" y2="80" class="image" />
    <line x1="175" y1="80" x2="150" y2="100" class="image" />
    <line x1="175" y1="80" x2="200" y2="100" class="image" />
    <!-- Coins -->
    <circle cx="120" cy="140" r="10" class="image" />
    <circle cx="140" cy="140" r="10" class="image" />
    <circle cx="160" cy="140" r="10" class="image" />
    <circle cx="180" cy="140" r="10" class="image" />
    <circle cx="200" cy="140" r="10" class="image" />
  </g>
</svg>