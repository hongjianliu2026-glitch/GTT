<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commune</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmjuːn] n. 公社，社区；v. 亲密交谈</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + mun (服务)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"共同服务(com-mun)"
    <tspan x="50" dy="25">社区，分享资源和知识，这就是公社(commune)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to form a commune to share resources.
  </text>
  <text x="50" y="310" class="content">
    他们决定成立一个公社来共享资源。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People sitting in a circle -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="150" r="50" class="image" />
    <circle cx="200" cy="100" r="50" class="image" />
    <circle cx="150" cy="50" r="50" class="image" />
    <!-- Table -->
    <rect x="50" y="75" width="200" height="50" class="image" />
    <!-- Sharing items -->
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="200" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
  </g>
</svg>