<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">husky</text>
  <text x="50" y="120" class="subtitle">[ˈhʌski] adj. 声音沙哑的；n. 哈士奇犬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> husk (外壳) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只哈士奇犬，它的声音像是从厚厚的外壳(husk)中传出，
    <tspan x="50" dy="25">沙哑而有力，这就是"husky"的声音。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The husky dog barked loudly in the snow.
  </text>
  <text x="50" y="310" class="content">
    那只哈士奇犬在雪地里大声吠叫。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Dog outline -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="300" class="image" />
    <line x1="100" y1="250" x2="150" y2="300" class="image" />
    <line x1="100" y1="180" x2="50" y2="200" class="image" />
    <line x1="100" y1="180" x2="150" y2="200" class="image" />
    <!-- Snow -->
    <line x1="0" y1="350" x2="200" y2="350" class="image" />
    <line x1="0" y1="370" x2="200" y2="370" class="image" />
    <line x1="0" y1="390" x2="200" y2="390" class="image" />
  </g>
</svg>