<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tolerance</text>
  <text x="50" y="120" class="subtitle">[ˈtɒlərəns] n. 容忍，宽容</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> toler (忍受) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在两个对立的观点之间，"忍受(toler)"
    <tspan x="50" dy="25">并保持平静，这就是宽容(tolerance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She showed great tolerance towards her colleague's mistakes.
  </text>
  <text x="50" y="310" class="content">
    她对同事的错误表现出了极大的宽容。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing between two opinions -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="140" x2="160" y2="160" class="image" />
    <line x1="200" y1="140" x2="240" y2="160" class="image" />
    <!-- Two opposing opinions -->
    <line x1="100" y1="50" x2="150" y2="100" class="image" />
    <line x1="300" y1="50" x2="250" y2="100" class="image" />
    <text x="80" y="40" class="content">Opinion A</text>
    <text x="280" y="40" class="content">Opinion B</text>
  </g>
</svg>