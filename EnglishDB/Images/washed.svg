<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">washed</text>
  <text x="50" y="120" class="subtitle">[wɒʃt] adj. 洗过的，洗净的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wash (洗) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件衣服被"洗(wash)"得干干净净，
    <tspan x="50" dy="25">上面的污渍都被冲走了，变得"洗过的(washed)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clothes are freshly washed and smell great.
  </text>
  <text x="50" y="310" class="content">
    这些衣服刚洗过，闻起来很香。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Washing machine -->
    <rect x="0" y="0" width="200" height="200" class="image" />
    <!-- Clothes -->
    <rect x="50" y="50" width="100" height="100" class="image" />
    <!-- Water drops -->
    <circle cx="70" cy="70" r="10" class="image" />
    <circle cx="130" cy="70" r="10" class="image" />
    <circle cx="100" cy="130" r="10" class="image" />
  </g>
</svg>