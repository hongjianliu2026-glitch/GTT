<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">second-degree</text>
  <text x="50" y="120" class="subtitle">[ˈsɛkənd dɪˈɡriː] adj. 第二度的，二级的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> second (第二) + degree (程度)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个烧伤的病人，他的皮肤上有两个层次的伤痕，
    <tspan x="50" dy="25">第一层是轻微的，第二层是更严重的，这就是"第二度(second-degree)"烧伤。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffered second-degree burns in the accident.
  </text>
  <text x="50" y="310" class="content">
    他在事故中遭受了二度烧伤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skin layers -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="60" class="image" />
    <rect x="50" y="80" width="250" height="60" class="image" />
    <!-- Labels -->
    <text x="60" y="50" class="content">First Degree</text>
    <text x="60" y="110" class="content">Second Degree</text>
  </g>
</svg>