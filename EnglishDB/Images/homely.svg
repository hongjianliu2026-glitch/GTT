<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">homely</text>
  <text x="50" y="120" class="subtitle">[ˈhoʊmli] adj. 朴素的，家常的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> home (家) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个温馨的家，"家(home)"里充满了
    <tspan x="50" dy="25">朴素(homely)的装饰和家常的氛围。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prepared a homely meal for her family.
  </text>
  <text x="50" y="310" class="content">
    她为家人准备了一顿家常饭。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,50 350,180" class="image" />
    <!-- Door -->
    <rect x="150" y="120" width="50" height="60" class="image" />
    <!-- Window -->
    <rect x="80" y="100" width="40" height="40" class="image" />
    <rect x="230" y="100" width="40" height="40" class="image" />
    <!-- Chimney -->
    <rect x="180" y="20" width="20" height="30" class="image" />
    <!-- Smoke -->
    <line x1="190" y1="20" x2="190" y2="10" class="image" />
    <line x1="190" y1="10" x2="180" y2="0" class="image" />
    <line x1="190" y1="10" x2="200" y2="0" class="image" />
  </g>
</svg>