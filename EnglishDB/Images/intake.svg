<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intake</text>
  <text x="50" y="120" class="subtitle">[ˈɪnteɪk] n. 摄入，吸入；v. 吸入</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + take (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的嘴巴，"进入(in)"并"拿(take)"
    <tspan x="50" dy="25">大量的食物，这就是摄入(intake)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor advised a low-salt intake for the patient.
  </text>
  <text x="50" y="310" class="content">
    医生建议病人减少盐的摄入。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <path d="M50 50 Q100 100 150 50" class="image" />
    <path d="M50 50 Q0 100 50 150" class="image" />
    <path d="M150 50 Q200 100 150 150" class="image" />
    <!-- Food -->
    <circle cx="100" cy="100" r="20" class="image" />
    <rect x="80" y="120" width="40" height="20" class="image" />
    <line x1="100" y1="140" x2="100" y2="160" class="image" />
  </g>
</svg>