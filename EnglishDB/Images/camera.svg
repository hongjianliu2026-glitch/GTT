<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">camera</text>
  <text x="50" y="120" class="subtitle">[ˈkæmərə] n. 照相机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cam- (弯曲) + -era (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的相机，它的镜头是弯曲的(cam-)，
    <tspan x="50" dy="25">这个工具(-era)帮助人们捕捉美丽的瞬间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used her camera to capture the sunset.
  </text>
  <text x="50" y="310" class="content">
    她用她的相机捕捉日落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Camera body -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <!-- Lens -->
    <ellipse cx="100" cy="75" rx="50" ry="30" class="image" />
    <!-- Viewfinder -->
    <rect x="150" y="50" width="20" height="20" class="image" />
    <!-- Shutter button -->
    <circle cx="180" cy="120" r="10" class="image" />
  </g>
</svg>