<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">upheaval</text>
  <text x="50" y="120" class="subtitle">[ʌpˈhiːvl] n. 剧变，动乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + heave (举起)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场巨大的地震，地面突然"向上举起(up-heave)"，
    <tspan x="50" dy="25">整个城市陷入混乱，这就是剧变(upheaval)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The political upheaval caused many people to flee the country.
  </text>
  <text x="50" y="310" class="content">
    政治剧变导致许多人逃离了国家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Cracked ground -->
    <line x1="50" y1="150" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="300" y2="100" class="image" />
    <line x1="300" y1="100" x2="350" y2="150" class="image" />
    <!-- Buildings -->
    <rect x="50" y="50" width="50" height="100" class="image" />
    <rect x="150" y="50" width="50" height="100" class="image" />
    <rect x="250" y="50" width="50" height="100" class="image" />
    <!-- People -->
    <circle cx="75" cy="130" r="10" class="image" />
    <circle cx="175" cy="130" r="10" class="image" />
    <circle cx="275" cy="130" r="10" class="image" />
  </g>
</svg>