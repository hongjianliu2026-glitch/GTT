      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lantern</text>
  <text x="50" y="120" class="subtitle">[ˈlæntərn] n. 灯笼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lant- (光) + -ern (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的街道上，"光(lant-)"
    <tspan x="50" dy="25">在夜晚照亮了整个小巷，这就是灯笼(lantern)的作用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carried a lantern to light her way in the dark forest.
  </text>
  <text x="50" y="310" class="content">
    她在黑暗的森林中提着灯笼照亮道路。
  </text>

