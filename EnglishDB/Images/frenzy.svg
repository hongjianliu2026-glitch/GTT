<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frenzy</text>
  <text x="50" y="120" class="subtitle">[ˈfrɛnzi] n. 狂乱，狂热</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fren- (狂乱) + -zy (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在街头疯狂奔跑，"狂乱(fren-)"
    <tspan x="50" dy="25">的状态(zy)让他失去了理智，这就是狂热(frenzy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd went into a frenzy when the star appeared.
  </text>
  <text x="50" y="310" class="content">
    当明星出现时，人群陷入了狂热。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Running person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Exclamation marks -->
    <text x="100" y="120" class="image" font-size="40">!!!</text>
  </g>
</svg>