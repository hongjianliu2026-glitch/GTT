<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suspend</text>
  <text x="50" y="120" class="subtitle">[səˈspend] v. 暂停，悬挂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sus- (在下面) + pend (悬挂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的钟摆，"在下面悬挂(sus-pend)"，
    <tspan x="50" dy="25">它暂时停止了摆动，就像某个活动被暂停了一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher suspended the class for a short break.
  </text>
  <text x="50" y="310" class="content">
    老师暂停了课堂，让大家休息一会儿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pendulum -->
    <line x1="175" y1="0" x2="175" y2="150" class="image" />
    <circle cx="175" cy="20" r="10" class="image" />
    <rect x="165" y="150" width="20" height="50" class="image" />
    <!-- Suspended -->
    <line x1="175" y1="200" x2="175" y2="250" class="image" />
    <circle cx="175" cy="210" r="10" class="image" />
    <rect x="165" y="250" width="20" height="50" class="image" />
  </g>
</svg>