<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ghost { fill: #CCCCCC; stroke: #7F8C8D; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ghostly</text>
  <text x="50" y="120" class="subtitle">[ˈɡoʊstli] adj. 鬼魂似的，幽灵般的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ghost (鬼魂) + -ly (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个幽灵(ghost)在夜晚飘荡，它的身影模糊不清，
    <tspan x="50" dy="25">仿佛随时会消失，这种幽灵般的感觉就是ghostly。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house had a ghostly atmosphere.
  </text>
  <text x="50" y="310" class="content">
    那座老房子有一种幽灵般的氛围。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ghost -->
    <circle cx="100" cy="100" r="50" class="ghost" />
    <line x1="100" y1="150" x2="100" y2="250" class="ghost" />
    <line x1="100" y1="250" x2="50" y2="300" class="ghost" />
    <line x1="100" y1="250" x2="150" y2="300" class="ghost" />
    <line x1="100" y1="180" x2="50" y2="180" class="ghost" />
    <line x1="100" y1="180" x2="150" y2="180" class="ghost" />
    <line x1="100" y1="200" x2="50" y2="200" class="ghost" />
    <line x1="100" y1="200" x2="150" y2="200" class="ghost" />
  </g>
</svg>