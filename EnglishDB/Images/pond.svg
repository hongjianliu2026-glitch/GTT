<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
      .land { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pond</text>
  <text x="50" y="120" class="subtitle">[pɑnd] n. 池塘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pond (源自拉丁语 "pondus"，意为"重量")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"重量(pondus)"压在地面，形成了一个深深的池塘(pond)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ducks were swimming in the pond.
  </text>
  <text x="50" y="310" class="content">
    鸭子们在池塘里游泳。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Pond -->
    <rect x="0" y="0" width="350" height="200" class="water" />
    <!-- Land -->
    <rect x="0" y="150" width="350" height="50" class="land" />
    <!-- Weight -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="100" x2="175" y2="150" class="image" />
  </g>
</svg>