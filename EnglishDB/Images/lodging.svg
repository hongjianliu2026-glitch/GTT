<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lodging</text>
  <text x="50" y="120" class="subtitle">[ˈlɑːdʒɪŋ] n. 寄宿，住宿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lodge (小屋) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小屋(lodge)里，人们正在寻找"住宿(lodging)"，
    <tspan x="50" dy="25">这个小屋成为了他们的临时住所。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They found a comfortable lodging for the night.
  </text>
  <text x="50" y="310" class="content">
    他们找到了一个舒适的过夜住宿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Small house -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="20" y="20" width="30" height="30" class="image" /> <!-- Window -->
    <rect x="100" y="20" width="30" height="30" class="image" /> <!-- Window -->
    <rect x="60" y="50" width="30" height="50" class="image" /> <!-- Door -->
    <line x1="0" y1="100" x2="150" y2="100" class="image" /> <!-- Roof -->
    <line x1="75" y1="50" x2="75" y2="0" class="image" /> <!-- Roof -->
  </g>
</svg>