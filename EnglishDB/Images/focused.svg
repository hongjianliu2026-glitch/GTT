<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">focused</text>
  <text x="50" y="120" class="subtitle">[ˈfoʊkəst] adj. 专注的，集中的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> focus (焦点) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在桌子前，眼睛紧紧盯着"焦点(focus)"，
    <tspan x="50" dy="25">周围的一切都被忽略，只有目标清晰可见。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He remained focused on his studies despite the distractions.
  </text>
  <text x="50" y="310" class="content">
    尽管有干扰，他仍然专注于他的学习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Focused eyes -->
    <circle cx="50" cy="90" r="5" class="image" fill="#000" />
    <circle cx="60" cy="90" r="5" class="image" fill="#000" />
    <!-- Target -->
    <circle cx="250" cy="100" r="30" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
  </g>
</svg>