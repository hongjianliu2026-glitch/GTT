<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intoxicate</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtɑksɪkeɪt] v. 使陶醉，使醉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + toxic (毒) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人喝了一杯酒，"进入(in-)"了"毒(toxic)"的状态，
    <tspan x="50" dy="25">变得陶醉(intoxicate)，仿佛整个世界都在旋转。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The music was so intoxicating that everyone started dancing.
  </text>
  <text x="50" y="310" class="content">
    音乐如此醉人，以至于每个人都开始跳舞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass of wine -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <circle cx="50" cy="160" r="40" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Spinning world -->
    <circle cx="350" cy="100" r="50" class="image" />
    <line x1="350" y1="50" x2="350" y2="150" class="image" />
    <line x1="300" y1="100" x2="400" y2="100" class="image" />
    <line x1="335" y1="70" x2="365" y2="130" class="image" />
    <line x1="365" y1="70" x2="335" y2="130" class="image" />
  </g>
</svg>