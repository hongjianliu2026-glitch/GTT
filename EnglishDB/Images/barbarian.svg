<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #9B59B6; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">barbarian</text>
  <text x="50" y="120" class="subtitle">[bɑːrˈbeəriən] n. 野蛮人，未开化的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> barba (胡须) + -arian (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个满脸胡须的野蛮人(barbarian)，
    <tspan x="50" dy="25">他挥舞着巨大的石斧，咆哮着冲向敌人。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The barbarian tribes were known for their fierce battles.
  </text>
  <text x="50" y="310" class="content">
    这些野蛮部落以其激烈的战斗而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Barbarian face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <!-- Beard -->
    <path d="M30 70 Q40 90 50 70 T70 70" class="image" />
    <path d="M30 80 Q40 100 50 80 T70 80" class="image" />
    <path d="M30 90 Q40 110 50 90 T70 90" class="image" />
    <!-- Axe -->
    <rect x="80" y="30" width="50" height="10" class="image" />
    <rect x="90" y="20" width="30" height="20" class="image" />
    <!-- Body -->
    <line x1="50" y1="90" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="120" x2="20" y2="110" class="image" />
    <line x1="50" y1="120" x2="80" y2="110" class="image" />
  </g>
</svg>