<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">breathlessly</text>
  <text x="50" y="120" class="subtitle">[ˈbrɛθləsli] adv. 气喘吁吁地，屏息地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> breath (呼吸) + less (没有) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在跑完马拉松后，"没有呼吸(breath-less)"
    <tspan x="50" dy="25">地喘着气，这种状态就是breathlessly。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She arrived breathlessly at the finish line.
  </text>
  <text x="50" y="310" class="content">
    她气喘吁吁地到达了终点线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person running -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Exhausted face -->
    <circle cx="50" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <line x1="50" y1="110" x2="60" y2="110" class="image" />
    <!-- Breath lines -->
    <line x1="40" y1="80" x2="30" y2="70" class="image" />
    <line x1="50" y1="80" x2="40" y2="70" class="image" />
    <line x1="60" y1="80" x2="70" y2="70" class="image" />
  </g>
</svg>