<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Saudi</text>
  <text x="50" y="120" class="subtitle">[ˈsaʊdi] adj. 沙特阿拉伯的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自阿拉伯语，指沙特阿拉伯
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着传统头巾的沙特人，站在沙漠中，
    <tspan x="50" dy="25">背景是壮丽的沙特阿拉伯建筑，这就是"沙特(Saudi)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Saudi government has invested heavily in renewable energy.
  </text>
  <text x="50" y="310" class="content">
    沙特政府在可再生能源方面投入了大量资金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Headscarf -->
    <circle cx="100" cy="80" r="30" class="image" />
    <line x1="100" y1="110" x2="100" y2="150" class="image" />
    <line x1="100" y1="130" x2="70" y2="120" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Building -->
    <rect x="200" y="20" width="100" height="160" class="image" />
    <line x1="220" y1="40" x2="280" y2="40" class="image" />
    <line x1="220" y1="70" x2="280" y2="70" class="image" />
    <line x1="220" y1="100" x2="280" y2="100" class="image" />
    <line x1="220" y1="130" x2="280" y2="130" class="image" />
  </g>
</svg>