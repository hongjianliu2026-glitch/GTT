<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beneficiary</text>
  <text x="50" y="120" class="subtitle">[ˌbenɪˈfɪʃieri] n. 受益人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bene- (好) + fic (做) + -ary (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"做好事(bene-fic)"的人，他因为做了好事而成为"受益人(beneficiary)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was the primary beneficiary of her father's will.
  </text>
  <text x="50" y="310" class="content">
    她是她父亲遗嘱的主要受益人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beneficiary -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Gift -->
    <rect x="120" y="80" width="60" height="60" class="image" />
    <line x1="120" y1="80" x2="180" y2="140" class="image" />
    <line x1="180" y1="80" x2="120" y2="140" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="140" x2="70" y2="140" class="image" />
    <polygon points="150,140 140,130 140,150" class="image" />
  </g>
</svg>