<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fortress</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrtrəs] n. 堡垒，要塞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fort (强壮) + -ress (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的堡垒，"强壮(fort)"
    <tspan x="50" dy="25">如山，坚不可摧，这就是堡垒(fortress)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient fortress stood tall against the invaders.
  </text>
  <text x="50" y="310" class="content">
    这座古老的堡垒在入侵者面前屹立不倒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fortress -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Tower -->
    <rect x="150" y="0" width="50" height="100" class="image" />
    <line x1="175" y1="0" x2="175" y2="100" class="image" />
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
    <!-- Wall -->
    <rect x="50" y="120" width="250" height="80" class="image" />
    <line x1="70" y1="140" x2="280" y2="140" class="image" />
    <line x1="70" y1="170" x2="250" y2="170" class="image" />
    <line x1="70" y1="200" x2="270" y2="200" class="image" />
  </g>
</svg>