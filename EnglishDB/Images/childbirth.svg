<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">childbirth</text>
  <text x="50" y="120" class="subtitle">[ˈtʃaɪldbɜːrθ] n. 分娩，生产</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> child (孩子) + birth (出生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个母亲在产房里，"孩子(child)"
    <tspan x="50" dy="25">正在"出生(birth)"，这个过程就是分娩(childbirth)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She experienced a smooth childbirth last night.
  </text>
  <text x="50" y="310" class="content">
    她昨晚经历了一次顺利的分娩。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mother -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Baby -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="120" y2="130" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Birth process -->
    <line x1="50" y1="180" x2="150" y2="120" class="image" />
  </g>
</svg>