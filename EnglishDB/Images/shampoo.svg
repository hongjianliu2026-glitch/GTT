<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shampoo</text>
  <text x="50" y="120" class="subtitle">[ʃæmˈpuː] n. 洗发水；v. 洗发</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sham (洗) + poo (头发)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的洗发水瓶子，瓶口喷出无数泡沫，
    <tspan x="50" dy="25">泡沫像瀑布一样倾泻而下，覆盖了整个城市，</tspan>
    <tspan x="50" dy="25">每个人都变成了泡沫人，这就是"洗发(sham-poo)"的夸张画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> She uses a special shampoo for her sensitive scalp.
  </text>
  <text x="50" y="330" class="content">
    她使用一种专门针对敏感头皮的洗发水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shampoo bottle -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Foam -->
    <circle cx="75" cy="220" r="30" class="image" />
    <circle cx="100" cy="250" r="25" class="image" />
    <circle cx="50" cy="250" r="25" class="image" />
    <circle cx="75" cy="280" r="20" class="image" />
    <!-- City skyline -->
    <rect x="200" y="180" width="50" height="50" class="image" />
    <rect x="250" y="160" width="50" height="70" class="image" />
    <rect x="300" y="190" width="50" height="40" class="image" />
    <!-- People covered in foam -->
    <circle cx="225" cy="250" r="15" class="image" />
    <line x1="225" y1="265" x2="225" y2="300" class="image" />
    <line x1="225" y1="300" x2="210" y2="330" class="image" />
    <line x1="225" y1="300" x2="240" y2="330" class="image" />
    <line x1="225" y1="280" x2="250" y2="270" class="image" />
    <circle cx="275" cy="270" r="15" class="image" />
    <line x1="275" y1="285" x2="275" y2="320" class="image" />
    <line x1="275" y1="320" x2="260" y2="350" class="image" />
    <line x1="275" y1="320" x2="290" y2="350" class="image" />
    <line x1="275" y1="300" x2="300" y2="290" class="image" />
  </g>
</svg>