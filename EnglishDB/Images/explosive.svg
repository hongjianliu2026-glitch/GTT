<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .explosion { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">explosive</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsploʊsɪv] adj. 爆炸的，爆发的；n. 炸药</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + plos (爆裂) + -ive (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的炸弹，"向外爆裂(ex-plos)"，
    <tspan x="50" dy="25">瞬间释放出巨大的能量，这就是爆炸(explosive)的场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fireworks display included several explosive effects.
  </text>
  <text x="50" y="310" class="content">
    烟花表演中包括了几个爆炸效果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bomb -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <!-- Explosion -->
    <circle cx="50" cy="50" r="40" class="explosion" />
    <circle cx="50" cy="50" r="30" class="explosion" />
    <circle cx="50" cy="50" r="20" class="explosion" />
    <circle cx="50" cy="50" r="10" class="explosion" />
  </g>
</svg>