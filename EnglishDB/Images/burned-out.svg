<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">burned-out</text>
  <text x="50" y="120" class="subtitle">[bɜːrnd aʊt] adj. 精疲力尽的，耗尽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> burn (燃烧) + out (出去)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人像蜡烛一样"燃烧(burn)"到"尽头(out)"，
    <tspan x="50" dy="25">最终精疲力尽，完全耗尽(burned-out)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After working overtime for weeks, he felt completely burned-out.
  </text>
  <text x="50" y="310" class="content">
    连续加班几周后，他感到完全精疲力尽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Candle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <line x1="50" y1="0" x2="50" y2="20" class="image" />
    <line x1="45" y1="20" x2="55" y2="20" class="image" />
    <line x1="40" y1="40" x2="60" y2="40" class="image" />
    <line x1="35" y1="60" x2="65" y2="60" class="image" />
    <line x1="30" y1="80" x2="70" y2="80" class="image" />
    <line x1="25" y1="100" x2="75" y2="100" class="image" />
    <line x1="20" y1="120" x2="80" y2="120" class="image" />
    <line x1="15" y1="140" x2="85" y2="140" class="image" />
    <line x1="10" y1="160" x2="90" y2="160" class="image" />
    <line x1="5" y1="180" x2="95" y2="180" class="image" />
    <line x1="0" y1="200" x2="100" y2="200" class="image" />
    <!-- Burned out flame -->
    <line x1="50" y1="20" x2="50" y2="40" class="image" />
    <line x1="45" y1="40" x2="55" y2="40" class="image" />
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <line x1="35" y1="80" x2="65" y2="80" class="image" />
    <line x1="30" y1="100" x2="70" y2="100" class="image" />
    <line x1="25" y1="120" x2="75" y2="120" class="image" />
    <line x1="20" y1="140" x2="80" y2="140" class="image" />
    <line x1="15" y1="160" x2="85" y2="160" class="image" />
    <line x1="10" y1="180" x2="90" y2="180" class="image" />
    <line x1="5" y1="200" x2="95" y2="200" class="image" />
    <line x1="0" y1="220" x2="100" y2="220" class="image" />
  </g>
</svg>