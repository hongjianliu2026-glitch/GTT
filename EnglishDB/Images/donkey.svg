<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">donkey</text>
  <text x="50" y="120" class="subtitle">[ˈdɒŋki] n. 驴子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> don (来自拉丁语 "donum"，意为“礼物”) + key (联想为“钥匙”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的村庄，村民们用驴子(donkey)驮着“礼物(don)”，
    <tspan x="50" dy="25">这些礼物就像打开幸福之门的“钥匙(key)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer used a donkey to carry his goods to the market.
  </text>
  <text x="50" y="310" class="content">
    农夫用驴子把货物驮到市场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Donkey -->
    <ellipse cx="100" cy="100" rx="50" ry="30" class="image" /> <!-- Body -->
    <circle cx="70" cy="80" r="20" class="image" /> <!-- Head -->
    <line x1="100" y1="130" x2="100" y2="180" class="image" /> <!-- Leg 1 -->
    <line x1="130" y1="130" x2="130" y2="180" class="image" /> <!-- Leg 2 -->
    <line x1="70" y1="130" x2="70" y2="180" class="image" /> <!-- Leg 3 -->
    <line x1="40" y1="130" x2="40" y2="180" class="image" /> <!-- Leg 4 -->
    <line x1="70" y1="100" x2="50" y2="120" class="image" /> <!-- Ear 1 -->
    <line x1="70" y1="100" x2="90" y2="120" class="image" /> <!-- Ear 2 -->
    <circle cx="80" cy="90" r="5" class="image" /> <!-- Eye -->
    <line x1="80" y1="100" x2="80" y2="110" class="image" /> <!-- Mouth -->

    <!-- Gift -->
    <rect x="150" y="80" width="40" height="40" class="image" />
    <line x1="170" y1="80" x2="170" y2="120" class="image" />
    <line x1="150" y1="100" x2="190" y2="100" class="image" />
  </g>
</svg>