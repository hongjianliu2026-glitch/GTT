<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">French</text>
  <text x="50" y="120" class="subtitle">[frɛntʃ] adj. 法国的，法语的；n. 法语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中世纪拉丁语 Francia (法国)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着贝雷帽的法国人，站在埃菲尔铁塔前，
    <tspan x="50" dy="25">说着流利的法语，这就是"French"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks fluent French.
  </text>
  <text x="50" y="310" class="content">
    她说法语很流利。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Eiffel Tower -->
    <path d="M0 150 L50 50 L100 150 Z" class="image" />
    <path d="M50 50 L150 150 Z" class="image" />
    <path d="M100 150 L150 50 L200 150 Z" class="image" />
    <!-- French person -->
    <circle cx="100" cy="200" r="20" class="image" />
    <line x1="100" y1="220" x2="100" y2="260" class="image" />
    <line x1="100" y1="260" x2="80" y2="300" class="image" />
    <line x1="100" y1="260" x2="120" y2="300" class="image" />
    <line x1="100" y1="240" x2="140" y2="230" class="image" />
    <!-- Beret -->
    <path d="M80 200 Q100 180 120 200" class="image" />
  </g>
</svg>