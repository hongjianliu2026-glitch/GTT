<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">funding</text>
  <text x="50" y="120" class="subtitle">[ˈfʌndɪŋ] n. 资金，资助</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fund (基础) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的金库，里面堆满了金币，
    <tspan x="50" dy="25">"基础(fund)"资金源源不断地流入，</tspan>
    <tspan x="50" dy="25">这就是"资助(funding)"的来源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project received significant funding from the government.
  </text>
  <text x="50" y="310" class="content">
    该项目从政府获得了大量资金。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vault -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Coins -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="80" cy="50" r="15" class="image" />
    <circle cx="110" cy="50" r="15" class="image" />
    <circle cx="140" cy="50" r="15" class="image" />
    <circle cx="170" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="230" cy="50" r="15" class="image" />
    <circle cx="260" cy="50" r="15" class="image" />
    <circle cx="290" cy="50" r="15" class="image" />
    <circle cx="320" cy="50" r="15" class="image" />
    <!-- Money bag -->
    <path d="M30,100 Q50,150 70,100" class="image" />
    <path d="M70,100 Q90,150 110,100" class="image" />
    <path d="M110,100 Q130,150 150,100" class="image" />
    <path d="M150,100 Q170,150 190,100" class="image" />
    <path d="M190,100 Q210,150 230,100" class="image" />
    <path d="M230,100 Q250,150 270,100" class="image" />
    <path d="M270,100 Q290,150 310,100" class="image" />
    <path d="M310,100 Q330,150 350,100" class="image" />
  </g>
</svg>