<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trot</text>
  <text x="50" y="120" class="subtitle">[trɒt] v. 小跑，快步走</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> trot (源自中古英语，意为“小跑”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一匹马在草地上<tspan x="50" dy="25">"小跑(trot)"</tspan>，
    <tspan x="50" dy="25">蹄子轻快地敲击地面，形成一种节奏感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The horse trotted down the path.
  </text>
  <text x="50" y="310" class="content">
    马沿着小路小跑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Horse body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Horse head -->
    <circle cx="230" cy="80" r="30" class="image" />
    <!-- Horse legs -->
    <line x1="80" y1="150" x2="80" y2="200" class="image" />
    <line x1="120" y1="150" x2="120" y2="200" class="image" />
    <line x1="180" y1="150" x2="180" y2="200" class="image" />
    <line x1="220" y1="150" x2="220" y2="200" class="image" />
    <!-- Trotting motion -->
    <line x1="80" y1="200" x2="60" y2="220" class="image" />
    <line x1="120" y1="200" x2="140" y2="220" class="image" />
    <line x1="180" y1="200" x2="160" y2="220" class="image" />
    <line x1="220" y1="200" x2="240" y2="220" class="image" />
  </g>
</svg>