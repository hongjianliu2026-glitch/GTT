<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fallout</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːlaʊt] n. 放射性尘埃，后果</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fall (落下) + out (外面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场核爆炸后，"尘埃(fall)"从天而降，"落在外面(out)"，
    <tspan x="50" dy="25">这些放射性尘埃(fallout)带来了严重的后果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fallout from the nuclear accident was devastating.
  </text>
  <text x="50" y="310" class="content">
    核事故的后果是毁灭性的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Explosion -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Fallout particles -->
    <line x1="175" y1="150" x2="100" y2="250" class="image" />
    <line x1="175" y1="150" x2="250" y2="250" class="image" />
    <line x1="175" y1="150" x2="175" y2="250" class="image" />
    <line x1="175" y1="150" x2="135" y2="250" class="image" />
    <line x1="175" y1="150" x2="215" y2="250" class="image" />
    <!-- Ground -->
    <rect x="50" y="250" width="250" height="50" class="image" />
  </g>
</svg>