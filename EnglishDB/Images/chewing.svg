<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chewing</text>
  <text x="50" y="120" class="subtitle">[ˈtʃuːɪŋ] v. 咀嚼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chew (咀嚼) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人正在"咀嚼(chew)"一块巨大的牛排，
    <tspan x="50" dy="25">他的嘴巴不停地动，仿佛要把牛排"嚼碎(chewing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He spent hours chewing on that tough steak.
  </text>
  <text x="50" y="310" class="content">
    他花了几个小时咀嚼那块难嚼的牛排。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <circle cx="100" cy="100" r="30" class="image" />
    <!-- Teeth -->
    <line x1="80" y1="90" x2="120" y2="90" class="image" />
    <line x1="80" y1="110" x2="120" y2="110" class="image" />
    <!-- Steak -->
    <rect x="130" y="80" width="100" height="40" class="image" />
    <!-- Chewing motion -->
    <line x1="100" y1="130" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="170" class="image" />
    <line x1="100" y1="150" x2="120" y2="170" class="image" />
  </g>
</svg>