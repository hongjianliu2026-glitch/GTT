<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hyperactivity</text>
  <text x="50" y="120" class="subtitle">[ˌhaɪpərækˈtɪvɪti] n. 多动症，过度活跃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hyper- (过度) + activity (活动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子像"超人(hyper)"一样，
    <tspan x="50" dy="25">不停地跳跃、奔跑，表现出过度的活动(activity)，</tspan>
    <tspan x="50" dy="25">这就是多动症(hyperactivity)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor diagnosed him with hyperactivity.
  </text>
  <text x="50" y="310" class="content">
    医生诊断他患有多动症。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hyperactive child -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="140" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="160" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <!-- Jumping motion -->
    <line x1="50" y1="180" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="240" class="image" />
    <line x1="50" y1="220" x2="70" y2="240" class="image" />
    <!-- Hyper symbol -->
    <text x="100" y="150" class="image" font-size="48" fill="#C0392B">H</text>
  </g>
</svg>