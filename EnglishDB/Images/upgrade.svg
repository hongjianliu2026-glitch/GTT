<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">upgrade</text>
  <text x="50" y="120" class="subtitle">[ˌʌpˈɡreɪd] v. 升级，提升；n. 升级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + grade (等级)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个火箭从地面"向上(up)"飞升，"提升(grade)"
    <tspan x="50" dy="25">到更高的轨道，这就是升级(upgrade)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to upgrade its software system.
  </text>
  <text x="50" y="310" class="content">
    公司决定升级其软件系统。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rocket -->
    <polygon points="50,150 100,50 150,150" class="image" />
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <!-- Flame -->
    <polyline points="80,150 100,180 120,150" class="image" />
    <polyline points="70,160 100,190 130,160" class="image" />
    <polyline points="60,170 100,200 140,170" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
  </g>
</svg>