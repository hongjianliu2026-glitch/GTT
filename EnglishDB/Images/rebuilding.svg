<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rebuilding</text>
  <text x="50" y="120" class="subtitle">[ˌriːˈbɪldɪŋ] v. 重建，改造</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + build (建造)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座被摧毁的房子，工人们正在"再次建造(re-build)"
    <tspan x="50" dy="25">它，使其焕然一新，这就是重建(rebuilding)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city is undergoing a massive rebuilding project.
  </text>
  <text x="50" y="310" class="content">
    这座城市正在进行大规模的重建工程。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Destroyed house -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="20" x2="75" y2="0" class="image" />
    <line x1="130" y1="20" x2="75" y2="0" class="image" />
    <line x1="20" y1="20" x2="20" y2="100" class="image" />
    <line x1="130" y1="20" x2="130" y2="100" class="image" />
    <line x1="20" y1="100" x2="130" y2="100" class="image" />
    <line x1="75" y1="50" x2="75" y2="100" class="image" />

    <!-- Workers rebuilding -->
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="130" class="image" />
    <line x1="200" y1="100" x2="220" y2="130" class="image" />
    <line x1="200" y1="80" x2="230" y2="70" class="image" />
    <line x1="200" y1="80" x2="170" y2="70" class="image" />

    <!-- New house -->
    <rect x="250" y="0" width="150" height="100" class="image" />
    <line x1="270" y1="20" x2="380" y2="20" class="image" />
    <line x1="270" y1="20" x2="325" y2="0" class="image" />
    <line x1="380" y1="20" x2="325" y2="0" class="image" />
    <line x1="270" y1="20" x2="270" y2="100" class="image" />
    <line x1="380" y1="20" x2="380" y2="100" class="image" />
    <line x1="270" y1="100" x2="380" y2="100" class="image" />
    <line x1="325" y1="50" x2="325" y2="100" class="image" />
  </g>
</svg>