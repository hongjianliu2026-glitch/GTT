<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hypnotize</text>
  <text x="50" y="120" class="subtitle">[ˈhɪpnətaɪz] v. 使着迷，使恍惚</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hypno- (睡眠) + -ize (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个催眠师用他的怀表，"使(ize)"
    <tspan x="50" dy="25">人们进入"睡眠(hypno)"状态，这就是催眠(hypnotize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The magician hypnotized the audience with his mesmerizing performance.
  </text>
  <text x="50" y="310" class="content">
    魔术师用他迷人的表演催眠了观众。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hypnotist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Watch -->
    <rect x="70" y="90" width="50" height="50" class="image" />
    <line x1="95" y1="90" x2="95" y2="140" class="image" />
    <line x1="70" y1="115" x2="120" y2="115" class="image" />
    <!-- Audience -->
    <circle cx="180" cy="100" r="10" class="image" />
    <circle cx="210" cy="100" r="10" class="image" />
    <circle cx="240" cy="100" r="10" class="image" />
  </g>
</svg>