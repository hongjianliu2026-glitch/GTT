<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">miserable</text>
  <text x="50" y="120" class="subtitle">[ˈmɪzərəbl] adj. 悲惨的，痛苦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> miser (可怜) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个可怜的人(miser)，他的生活充满了痛苦和不幸，
    <tspan x="50" dy="25">这种状态就是"悲惨的(miserable)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The homeless man looked miserable in the cold rain.
  </text>
  <text x="50" y="310" class="content">
    那个无家可归的人在冷雨中看起来很悲惨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rain cloud -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Rain drops -->
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="150" y1="120" x2="150" y2="150" class="image" />
    <line x1="200" y1="120" x2="200" y2="150" class="image" />
    <!-- Homeless man -->
    <circle cx="175" cy="200" r="20" class="image" />
    <line x1="175" y1="220" x2="175" y2="260" class="image" />
    <line x1="175" y1="260" x2="155" y2="300" class="image" />
    <line x1="175" y1="260" x2="195" y2="300" class="image" />
    <line x1="175" y1="240" x2="135" y2="230" class="image" />
    <line x1="175" y1="240" x2="215" y2="230" class="image" />
    <!-- Torn clothes -->
    <line x1="155" y1="230" x2="135" y2="250" class="image" />
    <line x1="195" y1="230" x2="215" y2="250" class="image" />
  </g>
</svg>