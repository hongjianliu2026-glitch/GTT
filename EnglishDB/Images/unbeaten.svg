<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unbeaten</text>
  <text x="50" y="120" class="subtitle">[ʌnˈbiːtən] adj. 未被打败的，未被超越的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + beat (打败) + -en (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个无敌的战士，"未被(un-)打败(beat)"
    <tspan x="50" dy="25">过，他站在战场上，无人能敌，这就是未被打败的(unbeaten)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team remained unbeaten throughout the season.
  </text>
  <text x="50" y="310" class="content">
    这支队伍在整个赛季中保持不败。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warrior -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Shield -->
    <rect x="20" y="180" width="60" height="40" class="image" />
    <!-- Sword -->
    <line x1="50" y1="200" x2="50" y2="280" class="image" />
    <line x1="50" y1="280" x2="30" y2="300" class="image" />
    <line x1="50" y1="280" x2="70" y2="300" class="image" />
  </g>
</svg>