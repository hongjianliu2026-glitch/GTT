<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nice</text>
  <text x="50" y="120" class="subtitle">[naɪs] adj. 好的，愉快的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nescius (不知道的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古代的智者，他"不知道(nescius)"
    <tspan x="50" dy="25">但却总是表现得非常友好和愉快，</tspan>
    <tspan x="50" dy="25">这种无知中的善意(nice)让人感到温暖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a nice person to be around.
  </text>
  <text x="50" y="310" class="content">
    她是一个相处起来很愉快的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ancient sage -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="100" y2="90" class="image" />
    <line x1="50" y1="100" x2="0" y2="90" class="image" />
    <!-- Smile -->
    <path d="M30 60 Q50 70 70 60" class="image" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="30" x2="150" y2="10" class="image" />
    <line x1="150" y1="70" x2="150" y2="90" class="image" />
    <line x1="130" y1="50" x2="110" y2="50" class="image" />
    <line x1="170" y1="50" x2="190" y2="50" class="image" />
  </g>
</svg>