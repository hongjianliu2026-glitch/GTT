<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">servant</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrvənt] n. 仆人，佣人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> serv (服务) + ant (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个仆人(servant)在厨房里忙碌，"服务(serv)"
    <tspan x="50" dy="25">着主人，为主人准备美味的食物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The servant prepared a delicious meal for the guests.
  </text>
  <text x="50" y="310" class="content">
    仆人为客人准备了一顿美味的饭菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kitchen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Stove -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <!-- Pot -->
    <circle cx="100" cy="70" r="20" class="image" />
    <!-- Servant -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>