<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hideous</text>
  <text x="50" y="120" class="subtitle">[ˈhɪdiəs] adj. 极其丑陋的，可怕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hide (隐藏) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个怪物，"隐藏(hide)"在黑暗中，
    <tspan x="50" dy="25">它的面容"极其丑陋(hideous)"，让人不敢直视。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The monster's hideous face scared the villagers.
  </text>
  <text x="50" y="310" class="content">
    怪物那极其丑陋的面容吓坏了村民。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#2C3E50" />
    <!-- Monster face -->
    <circle cx="175" cy="100" r="60" class="image" fill="#8E44AD" />
    <circle cx="140" cy="80" r="10" class="image" fill="#ECF0F1" />
    <circle cx="210" cy="80" r="10" class="image" fill="#ECF0F1" />
    <line x1="140" y1="120" x2="210" y2="120" class="image" stroke="#ECF0F1" stroke-width="4" />
    <line x1="175" y1="140" x2="175" y2="180" class="image" stroke="#ECF0F1" stroke-width="4" />
    <line x1="155" y1="160" x2="195" y2="160" class="image" stroke="#ECF0F1" stroke-width="4" />
  </g>
</svg>