<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antibody</text>
  <text x="50" y="120" class="subtitle">[ˈæntɪˌbɒdi] n. 抗体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (对抗) + body (身体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微小的"抗体(anti-body)"战士，
    <tspan x="50" dy="25">它勇敢地"对抗(anti-)"入侵的病毒，保护我们的身体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The body produces antibodies to fight off infections.
  </text>
  <text x="50" y="310" class="content">
    身体产生抗体来对抗感染。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Virus -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="70" x2="50" y2="130" class="image" />
    <line x1="30" y1="100" x2="70" y2="100" class="image" />
    <line x1="40" y1="85" x2="60" y2="115" class="image" />
    <line x1="40" y1="115" x2="60" y2="85" class="image" />

    <!-- Antibody -->
    <rect x="150" y="80" width="100" height="40" class="image" />
    <line x1="150" y1="100" x2="250" y2="100" class="image" />
    <line x1="170" y1="80" x2="170" y2="120" class="image" />
    <line x1="230" y1="80" x2="230" y2="120" class="image" />
    <line x1="150" y1="100" x2="170" y2="80" class="image" />
    <line x1="250" y1="100" x2="230" y2="80" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />
    <line x1="250" y1="100" x2="230" y2="120" class="image" />

    <!-- Battle -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="125" y1="85" x2="125" y2="115" class="image" />
  </g>
</svg>