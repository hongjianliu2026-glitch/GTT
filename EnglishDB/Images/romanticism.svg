<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">romanticism</text>
  <text x="50" y="120" class="subtitle">[roʊˈmæntɪsɪzəm] n. 浪漫主义</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roman (浪漫) + -tic (形容词后缀) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满"浪漫(roman)"气息的夜晚，
    <tspan x="50" dy="25">月光下，一对情侣在河边漫步，</tspan>
    <tspan x="50" dy="25">这种情感的表达就是浪漫主义(romanticism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The painting captures the essence of romanticism.
  </text>
  <text x="50" y="310" class="content">
    这幅画捕捉了浪漫主义的精髓。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- River -->
    <rect x="0" y="100" width="350" height="100" class="image" fill="#3498DB" />
    <!-- Couple -->
    <circle cx="50" cy="120" r="15" class="image" fill="#E74C3C" />
    <circle cx="100" cy="120" r="15" class="image" fill="#E74C3C" />
    <line x1="50" y1="135" x2="100" y2="135" class="image" />
    <line x1="50" y1="135" x2="50" y2="160" class="image" />
    <line x1="100" y1="135" x2="100" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="180" class="image" />
    <line x1="100" y1="160" x2="120" y2="180" class="image" />
    <line x1="50" y1="145" x2="70" y2="135" class="image" />
    <line x1="100" y1="145" x2="80" y2="135" class="image" />
  </g>
</svg>