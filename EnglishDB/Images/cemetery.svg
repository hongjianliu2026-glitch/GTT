<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E9E2; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #6D4C3D; }
      .content { font: 18px sans-serif; fill: #5D4037; }
      .highlight { font-weight: bold; fill: #D32F2F; }
      .story { font: 16px serif; fill: #4E342E; }
      .image { stroke: #795548; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cemetery</text>
  <text x="50" y="120" class="subtitle">[ˈsɛmətri] n. 墓地，公墓</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cem (埋葬) + -ery (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的墓地，"埋葬(cem)"
    <tspan x="50" dy="25">的地方(-ery)，那里有许多墓碑和十字架。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cemetery is located on the hill overlooking the town.
  </text>
  <text x="50" y="310" class="content">
    墓地位于俯瞰城镇的山上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Tombstones -->
    <rect x="50" y="20" width="50" height="80" class="image" />
    <rect x="150" y="20" width="50" height="80" class="image" />
    <rect x="250" y="20" width="50" height="80" class="image" />
    <!-- Crosses -->
    <line x1="75" y1="20" x2="75" y2="60" class="image" />
    <line x1="50" y1="40" x2="100" y2="40" class="image" />
    <line x1="175" y1="20" x2="175" y2="60" class="image" />
    <line x1="150" y1="40" x2="200" y2="40" class="image" />
    <line x1="275" y1="20" x2="275" y2="60" class="image" />
    <line x1="250" y1="40" x2="300" y2="40" class="image" />
  </g>
</svg>