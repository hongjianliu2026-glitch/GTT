<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rung</text>
  <text x="50" y="120" class="subtitle">[rʌŋ] n. 梯子的横档，梯级</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> run (跑) + g (表示动作的延续)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在梯子上"跑(run)"，每一步都踩在"横档(rung)"上，
    <tspan x="50" dy="25">就像在梯子上奔跑一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He climbed up the ladder by stepping on each rung.
  </text>
  <text x="50" y="310" class="content">
    他通过踩着梯子的每一级横档爬了上去。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ladder -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <!-- Rungs -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="50" y1="150" x2="100" y2="150" class="image" />
    <!-- Person on the ladder -->
    <circle cx="75" cy="125" r="10" class="image" />
    <line x1="75" y1="135" x2="75" y2="160" class="image" />
    <line x1="75" y1="160" x2="60" y2="180" class="image" />
    <line x1="75" y1="160" x2="90" y2="180" class="image" />
    <line x1="75" y1="145" x2="100" y2="135" class="image" />
  </g>
</svg>