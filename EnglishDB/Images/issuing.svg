<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">issuing</text>
  <text x="50" y="120" class="subtitle">[ˈɪʃuɪŋ] v. 发行，发布</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> is (存在) + sue (跟随)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个权威人士站在高台上，"存在(is)"
    <tspan x="50" dy="25">并"跟随(sue)"着发布(issuing)重要文件，</tspan>
    <tspan x="50" dy="25">这些文件像瀑布一样倾泻而下。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bank is issuing new credit cards next month.
  </text>
  <text x="50" y="310" class="content">
    银行下个月将发行新的信用卡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Authority figure -->
    <circle cx="20" cy="30" r="15" class="image" />
    <line x1="20" y1="45" x2="20" y2="80" class="image" />
    <line x1="20" y1="80" x2="0" y2="110" class="image" />
    <line x1="20" y1="80" x2="40" y2="110" class="image" />
    <line x1="20" y1="60" x2="50" y2="50" class="image" />
    <!-- Documents -->
    <line x1="70" y1="20" x2="70" y2="180" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="130" y1="20" x2="130" y2="180" class="image" />
    <line x1="160" y1="20" x2="160" y2="180" class="image" />
    <line x1="190" y1="20" x2="190" y2="180" class="image" />
    <line x1="220" y1="20" x2="220" y2="180" class="image" />
    <line x1="250" y1="20" x2="250" y2="180" class="image" />
    <line x1="280" y1="20" x2="280" y2="180" class="image" />
    <line x1="310" y1="20" x2="310" y2="180" class="image" />
    <line x1="340" y1="20" x2="340" y2="180" class="image" />
  </g>
</svg>