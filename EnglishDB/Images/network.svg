<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">network</text>
  <text x="50" y="120" class="subtitle">[ˈnɛtwɜrk] n. 网络，网状系统</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> net (网) + work (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一张巨大的网，"网(net)"上连接着无数的节点，
    <tspan x="50" dy="25">这些节点共同"工作(work)"，形成了一个复杂的网络(network)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has a large network of suppliers.
  </text>
  <text x="50" y="310" class="content">
    这家公司有一个庞大的供应商网络。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Network nodes -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="50" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
    <!-- Network connections -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="250" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>