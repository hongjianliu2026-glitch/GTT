<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spoiled</text>
  <text x="50" y="120" class="subtitle">[spɔɪld] adj. 宠坏的，变质的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spol- (掠夺) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被宠坏的孩子，"掠夺(spol-)"了所有的爱，
    <tspan x="50" dy="25">变得任性且难以满足，就像变质的(spoiled)食物一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child was spoiled by his parents' constant indulgence.
  </text>
  <text x="50" y="310" class="content">
    这个孩子被父母不断的溺爱宠坏了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spoiled child -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Toys -->
    <rect x="100" y="80" width="50" height="50" class="image" />
    <rect x="160" y="80" width="50" height="50" class="image" />
    <rect x="220" y="80" width="50" height="50" class="image" />
    <!-- Rotten food -->
    <rect x="100" y="150" width="50" height="50" class="image" />
    <rect x="160" y="150" width="50" height="50" class="image" />
    <rect x="220" y="150" width="50" height="50" class="image" />
  </g>
</svg>