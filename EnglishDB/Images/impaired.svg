<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impaired</text>
  <text x="50" y="120" class="subtitle">[ɪmˈperd] adj. 受损的，有缺陷的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + pair (一对)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人试图"进入(im-)"一个完美的"一对(pair)"，
    <tspan x="50" dy="25">但因为某些原因，他的一只脚"受损(impaired)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His driving skills were impaired after the accident.
  </text>
  <text x="50" y="310" class="content">
    事故后，他的驾驶技能受损了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with impaired leg -->
    <circle cx="50" cy="50" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="70" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="120" x2="30" y2="160" class="image" /> <!-- Left leg -->
    <line x1="50" y1="120" x2="70" y2="160" class="image" /> <!-- Right leg (impaired) -->
    <line x1="70" y1="160" x2="70" y2="140" class="image" /> <!-- Crutch -->
    <line x1="70" y1="140" x2="90" y2="140" class="image" /> <!-- Crutch handle -->
    <line x1="50" y1="90" x2="30" y2="100" class="image" /> <!-- Left arm -->
    <line x1="50" y1="90" x2="70" y2="100" class="image" /> <!-- Right arm -->
  </g>
</svg>