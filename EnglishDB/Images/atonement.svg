<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">atonement</text>
  <text x="50" y="120" class="subtitle">[əˈtoʊnmənt] n. 赎罪，补偿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> at- (加强) + one (单一) + ment (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在教堂里，"加强(at-)"
    <tspan x="50" dy="25">他的"单一(one)"信仰，通过祈祷和忏悔来"赎罪(atonement)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His act of atonement was to donate all his wealth to charity.
  </text>
  <text x="50" y="310" class="content">
    他的赎罪行为是将所有财富捐赠给慈善机构。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cross -->
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <!-- Person praying -->
    <circle cx="175" cy="220" r="15" class="image" />
    <line x1="175" y1="235" x2="175" y2="270" class="image" />
    <line x1="175" y1="270" x2="155" y2="300" class="image" />
    <line x1="175" y1="270" x2="195" y2="300" class="image" />
    <line x1="175" y1="250" x2="205" y2="240" class="image" />
  </g>
</svg>