<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parallel</text>
  <text x="50" y="120" class="subtitle">[ˈpærəˌlɛl] adj. 平行的；n. 平行线</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (旁边) + allel (彼此)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两条铁轨，"彼此旁边(para-allel)"
    <tspan x="50" dy="25">永远保持相同的距离，这就是平行的概念。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The road runs parallel to the river.
  </text>
  <text x="50" y="310" class="content">
    这条路与河流平行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Parallel lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <!-- Rails -->
    <rect x="50" y="40" width="250" height="10" class="image" />
    <rect x="50" y="90" width="250" height="10" class="image" />
    <!-- Train -->
    <rect x="100" y="55" width="100" height="30" class="image" />
    <circle cx="120" cy="70" r="10" class="image" />
    <circle cx="180" cy="70" r="10" class="image" />
  </g>
</svg>