<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">barrel</text>
  <text x="50" y="120" class="subtitle">[ˈbærəl] n. 桶，枪管；v. 快速移动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bar (木头) + rel (容器)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的木桶(barrel)，里面装满了
    <tspan x="50" dy="25">各种东西，突然它开始"快速移动(barrel)"，</tspan>
    <tspan x="50" dy="25">里面的东西都飞了出来，场面非常混乱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The barrel of apples rolled down the hill.
  </text>
  <text x="50" y="310" class="content">
    苹果桶滚下了山。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Barrel -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <ellipse cx="175" cy="100" rx="140" ry="65" class="image" />
    <!-- Flying items -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="30" r="10" class="image" />
    <circle cx="250" cy="70" r="10" class="image" />
    <circle cx="300" cy="40" r="10" class="image" />
    <!-- Movement lines -->
    <line x1="175" y1="100" x2="100" y2="200" class="image" />
    <line x1="175" y1="100" x2="250" y2="200" class="image" />
  </g>
</svg>