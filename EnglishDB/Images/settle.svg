<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">settle</text>
  <text x="50" y="120" class="subtitle">[ˈsɛtl] v. 安顿，解决，定居</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> set (放置) + -tle (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疲惫的旅人，"放置(set)"
    <tspan x="50" dy="25">他的行李，安顿下来(settle)，开始新的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After years of traveling, he finally settled down in a small village.
  </text>
  <text x="50" y="310" class="content">
    经过多年的旅行，他终于在一个小村庄安顿下来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- House -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="100" x2="130" y2="100" class="image" />
    <line x1="75" y1="100" x2="75" y2="150" class="image" />
    <!-- Person -->
    <circle cx="80" cy="170" r="15" class="image" />
    <line x1="80" y1="185" x2="80" y2="220" class="image" />
    <line x1="80" y1="220" x2="60" y2="250" class="image" />
    <line x1="80" y1="220" x2="100" y2="250" class="image" />
    <line x1="80" y1="200" x2="110" y2="190" class="image" />
    <!-- Luggage -->
    <rect x="50" y="250" width="60" height="30" class="image" />
  </g>
</svg>