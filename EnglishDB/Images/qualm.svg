<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">qualm</text>
  <text x="50" y="120" class="subtitle">[kwɑːm] n. 疑虑，不安</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> qua- (疑问) + lm (不安)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在十字路口，心中充满"疑问(qua-)"，
    <tspan x="50" dy="25">脸上露出"不安(lm)"的表情，这就是qualm的感觉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He had no qualms about lying to his boss.
  </text>
  <text x="50" y="310" class="content">
    他对向老板撒谎没有丝毫疑虑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crossroads -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="150" y2="190" class="image" />
    <line x1="175" y1="160" x2="200" y2="190" class="image" />
    <line x1="175" y1="140" x2="140" y2="130" class="image" />
    <line x1="175" y1="140" x2="210" y2="130" class="image" />
    <!-- Question mark -->
    <text x="220" y="120" class="image" font-size="48">?</text>
  </g>
</svg>