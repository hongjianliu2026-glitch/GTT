<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shrub</text>
  <text x="50" y="120" class="subtitle">[ʃrʌb] n. 灌木</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shrub (源自中古英语，意为“灌木”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片森林中，"灌木丛(shrub)"
    <tspan x="50" dy="25">像一群小矮人一样，密密麻麻地生长在一起。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden was filled with colorful shrubs.
  </text>
  <text x="50" y="310" class="content">
    花园里种满了五颜六色的灌木。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Shrubs -->
    <circle cx="50" cy="140" r="20" class="image" />
    <circle cx="100" cy="130" r="25" class="image" />
    <circle cx="150" cy="145" r="30" class="image" />
    <circle cx="200" cy="135" r="25" class="image" />
    <circle cx="250" cy="140" r="20" class="image" />
    <circle cx="300" cy="130" r="25" class="image" />
  </g>
</svg>