<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">function</text>
  <text x="50" y="120" class="subtitle">[ˈfʌŋkʃən] n. 功能，作用；v. 运行，起作用</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> funct- (做) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的齿轮机器，每个齿轮都在"做(funct-)"
    <tspan x="50" dy="25">自己的工作，整个机器才能正常运行，这就是功能(function)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The function of the heart is to pump blood.
  </text>
  <text x="50" y="310" class="content">
    心脏的功能是泵血。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gear machine -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="200" cy="100" r="50" class="image" />
    <circle cx="300" cy="100" r="50" class="image" />
    <!-- Teeth of gears -->
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <line x1="70" y1="70" x2="130" y2="70" class="image" />
    <line x1="70" y1="90" x2="130" y2="90" class="image" />
    <line x1="170" y1="50" x2="230" y2="50" class="image" />
    <line x1="170" y1="70" x2="230" y2="70" class="image" />
    <line x1="170" y1="90" x2="230" y2="90" class="image" />
    <line x1="270" y1="50" x2="330" y2="50" class="image" />
    <line x1="270" y1="70" x2="330" y2="70" class="image" />
    <line x1="270" y1="90" x2="330" y2="90" class="image" />
    <!-- Connecting lines -->
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
  </g>
</svg>