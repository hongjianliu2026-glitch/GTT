<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .flower { fill: #F1C40F; }
      .leaf { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dandelion</text>
  <text x="50" y="120" class="subtitle">[ˈdændəlaɪən] n. 蒲公英</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dent- (牙齿) + -lion (狮子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只狮子(lion)在草地上，它的牙齿(dent-)
    <tspan x="50" dy="25">咬住了一朵蒲公英(dandelion)，蒲公英的种子随风飘散。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dandelion's seeds floated away in the breeze.
  </text>
  <text x="50" y="310" class="content">
    蒲公英的种子在微风中飘散。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion head -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="50" y1="70" x2="50" y2="110" class="image" />
    <line x1="50" y1="90" x2="30" y2="80" class="image" />
    <line x1="50" y1="90" x2="70" y2="80" class="image" />
    <line x1="50" y1="110" x2="30" y2="130" class="image" />
    <line x1="50" y1="110" x2="70" y2="130" class="image" />

    <!-- Dandelion -->
    <circle cx="200" cy="50" r="20" class="flower" />
    <line x1="200" y1="70" x2="200" y2="150" class="image" />
    <circle cx="190" cy="80" r="5" class="flower" />
    <circle cx="210" cy="80" r="5" class="flower" />
    <circle cx="180" cy="100" r="5" class="flower" />
    <circle cx="220" cy="100" r="5" class="flower" />
    <circle cx="190" cy="120" r="5" class="flower" />
    <circle cx="210" cy="120" r="5" class="flower" />

    <!-- Leaves -->
    <path d="M200,150 Q220,130 240,150 Q220,170 200,150" class="leaf" />
    <path d="M200,150 Q180,130 160,150 Q180,170 200,150" class="leaf" />
  </g>
</svg>