<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">squat</text>
  <text x="50" y="120" class="subtitle">[skwɑːt] v. 蹲下，蹲坐；n. 蹲坐，蹲姿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> squa- (方形的) + -t (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人像"方形(squa-)"一样蹲下，
    <tspan x="50" dy="25">双腿弯曲，身体下沉，形成一个稳定的蹲姿(squat)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He squatted down to tie his shoelaces.
  </text>
  <text x="50" y="310" class="content">
    他蹲下来系鞋带。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person squatting -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="140" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <line x1="50" y1="160" x2="30" y2="140" class="image" /> <!-- Left arm -->
    <line x1="50" y1="160" x2="70" y2="140" class="image" /> <!-- Right arm -->
  </g>
</svg>