<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .blue { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blue</text>
  <text x="50" y="120" class="subtitle">[bluː] adj. 蓝色的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "bleu"，源自法语 "bleu"，意为蓝色。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的蓝天，"蓝色(blue)"
    <tspan x="50" dy="25">覆盖了整个天空，让人感到宁静与自由。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sky was a deep blue color.
  </text>
  <text x="50" y="310" class="content">
    天空是深蓝色的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="blue" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="20" class="image" />
    <!-- Clouds -->
    <ellipse cx="100" cy="50" rx="40" ry="20" class="image" />
    <ellipse cx="150" cy="70" rx="30" ry="15" class="image" />
    <ellipse cx="200" cy="60" rx="35" ry="18" class="image" />
  </g>
</svg>