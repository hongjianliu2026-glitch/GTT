<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">root</text>
  <text x="50" y="120" class="subtitle">[rut] n. 根，根源；v. 生根，扎根</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roo- (根)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树，它的"根(roo-)"深深地扎入土壤中，
    <tspan x="50" dy="25">支撑着整棵树的生长，这就是"根(root)"的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The roots of the tree spread far and wide.
  </text>
  <text x="50" y="310" class="content">
    这棵树的根向四面八方伸展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Tree trunk -->
    <rect x="150" y="100" width="20" height="200" class="image" />
    <!-- Tree branches -->
    <line x1="160" y1="100" x2="100" y2="50" class="image" />
    <line x1="160" y1="100" x2="220" y2="50" class="image" />
    <line x1="160" y1="100" x2="160" y2="0" class="image" />
    <!-- Roots -->
    <line x1="150" y1="300" x2="100" y2="350" class="image" />
    <line x1="170" y1="300" x2="220" y2="350" class="image" />
    <line x1="160" y1="300" x2="160" y2="350" class="image" />
    <!-- Soil -->
    <rect x="0" y="350" width="350" height="50" class="image" />
  </g>
</svg>