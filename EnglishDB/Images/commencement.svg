<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commencement</text>
  <text x="50" y="120" class="subtitle">[kəˈmɛnsmənt] n. 开始，毕业典礼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + men (开始) + -cement (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群毕业生穿着学士服，"一起开始(com-men-cement)"
    <tspan x="50" dy="25">他们的新生活，这就是毕业典礼(commencement)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The commencement ceremony was held in the university stadium.
  </text>
  <text x="50" y="310" class="content">
    毕业典礼在大学体育场举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Graduation cap -->
    <path d="M50 20 L70 60 L30 60 Z" class="image" />
    <!-- Graduates -->
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <!-- Stage -->
    <rect x="50" y="120" width="200" height="50" class="image" />
    <!-- Audience -->
    <line x1="50" y1="180" x2="250" y2="180" class="image" />
    <line x1="50" y1="200" x2="250" y2="200" class="image" />
    <line x1="50" y1="220" x2="250" y2="220" class="image" />
  </g>
</svg>