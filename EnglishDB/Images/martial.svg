<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">martial</text>
  <text x="50" y="120" class="subtitle">[ˈmɑːrʃl] adj. 军事的，战争的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> marti- (战神Mars)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象战神Mars手持剑盾，"战神(marti-)"
    <tspan x="50" dy="25">的威严与力量，象征着军事(martial)的强大。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The general gave a martial speech to inspire his troops.
  </text>
  <text x="50" y="310" class="content">
    将军发表了一场鼓舞士气的军事演讲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shield -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Sword -->
    <rect x="150" y="70" width="100" height="10" class="image" />
    <line x1="250" y1="70" x2="250" y2="130" class="image" />
    <line x1="250" y1="130" x2="230" y2="110" class="image" />
    <line x1="250" y1="130" x2="270" y2="110" class="image" />
    <!-- Mars -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
  </g>
</svg>