<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .lucky { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fortunate</text>
  <text x="50" y="120" class="subtitle">[ˈfɔːrtʃənət] adj. 幸运的，侥幸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fort (力量) + -une (状态) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在沙滩上，突然发现了一个装满金币的宝箱，
    <tspan x="50" dy="25">"力量(fort)"让他能够打开宝箱，</tspan>
    <tspan x="50" dy="25">这种"状态(une)"让他感到非常"幸运(fortunate)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was fortunate to find a good job in such a short time.
  </text>
  <text x="50" y="310" class="content">
    她在这么短的时间内找到一份好工作，真是幸运。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Beach -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sand -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Treasure chest -->
    <rect x="150" y="100" width="50" height="50" class="image lucky" />
    <!-- Coins -->
    <circle cx="175" cy="125" r="5" class="image lucky" />
    <circle cx="165" cy="115" r="5" class="image lucky" />
    <circle cx="185" cy="115" r="5" class="image lucky" />
    <!-- Person -->
    <circle cx="100" cy="140" r="15" class="image" />
    <line x1="100" y1="155" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="200" class="image" />
    <line x1="100" y1="180" x2="120" y2="200" class="image" />
    <line x1="100" y1="165" x2="130" y2="155" class="image" />
  </g>
</svg>