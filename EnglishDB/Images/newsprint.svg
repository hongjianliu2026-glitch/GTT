<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">newsprint</text>
  <text x="50" y="120" class="subtitle">[ˈnjuːzprɪnt] n. 新闻纸，报纸印刷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> news (新闻) + print (印刷)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的印刷机，"印刷(print)"
    <tspan x="50" dy="25">出无数张"新闻(news)"纸，这些纸张堆叠在一起，</tspan>
    <tspan x="50" dy="25">形成了厚厚的一摞报纸(newsprint)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The newspaper was printed on cheap newsprint.
  </text>
  <text x="50" y="310" class="content">
    这份报纸是用廉价的新闻纸印刷的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Printing press -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Paper stack -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- News text -->
    <text x="70" y="50" class="content">Breaking News</text>
    <text x="70" y="80" class="content">Local Events</text>
    <text x="70" y="110" class="content">Sports</text>
    <text x="70" y="140" class="content">Weather</text>
    <!-- Printing press handle -->
    <line x1="20" y1="100" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
  </g>
</svg>