<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">floor</text>
  <text x="50" y="120" class="subtitle">[flɔːr] n. 地板，楼层</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flor (花) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间的地板，"铺满了(flor)"
    <tspan x="50" dy="25">鲜花，就像一片花海(floor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She dropped her keys on the floor.
  </text>
  <text x="50" y="310" class="content">
    她把钥匙掉在了地板上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room floor -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flowers -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="70" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="70" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="300" cy="70" r="15" class="image" />
    <!-- Keys -->
    <rect x="150" y="120" width="30" height="10" class="image" />
    <line x1="150" y1="120" x2="180" y2="120" class="image" />
    <line x1="150" y1="130" x2="180" y2="130" class="image" />
  </g>
</svg>