<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hormone</text>
  <text x="50" y="120" class="subtitle">[ˈhɔːrmoʊn] n. 荷尔蒙，激素</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hormo- (刺激) + -one (化学物质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"刺激(hormo-)"
    <tspan x="50" dy="25">细胞产生一种化学物质(hormone)，这种物质能</tspan>
    <tspan x="50" dy="25">影响身体的各种功能。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The release of adrenaline is a response to stress.
  </text>
  <text x="50" y="310" class="content">
    肾上腺素的释放是对压力的反应。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lab coat -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Beaker -->
    <rect x="100" y="50" width="100" height="100" class="image" />
    <line x1="120" y1="70" x2="180" y2="70" class="image" />
    <line x1="120" y1="90" x2="180" y2="90" class="image" />
    <line x1="120" y1="110" x2="180" y2="110" class="image" />
    <!-- Hormone molecule -->
    <circle cx="150" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="140" y2="150" class="image" />
    <line x1="150" y1="130" x2="160" y2="150" class="image" />
  </g>
</svg>