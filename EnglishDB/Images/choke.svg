<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">choke</text>
  <text x="50" y="120" class="subtitle">[tʃoʊk] v. 窒息，哽住；n. 窒息</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chok (窒息)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被一根巨大的面条"窒息(chok)"住，
    <tspan x="50" dy="25">面条从他的嘴里伸出，形成了一个夸张的窒息场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He almost choked on a piece of chicken.
  </text>
  <text x="50" y="310" class="content">
    他差点被一块鸡肉噎住。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Person -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="70" y2="180" class="image" />
    <line x1="100" y1="150" x2="130" y2="180" class="image" />
    <line x1="100" y1="200" x2="70" y2="250" class="image" />
    <line x1="100" y1="200" x2="130" y2="250" class="image" />

    <!-- Noodle -->
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="70" y2="20" class="image" />
    <line x1="100" y1="50" x2="130" y2="20" class="image" />
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
  </g>
</svg>