<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bottom</text>
  <text x="50" y="120" class="subtitle">[ˈbɒtəm] n. 底部，底端；adj. 底部的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bot (底部) + -tom (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的杯子，"底部(bot-tom)"
    <tspan x="50" dy="25">有一个小人在那里探险，这就是底部的世界(bottom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The treasure was hidden at the bottom of the sea.
  </text>
  <text x="50" y="310" class="content">
    宝藏被藏在海底。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bottom of the cup -->
    <rect x="50" y="180" width="250" height="20" class="image" />
    <!-- Little person -->
    <circle cx="175" cy="190" r="10" class="image" />
    <line x1="175" y1="200" x2="175" y2="220" class="image" />
    <line x1="175" y1="220" x2="165" y2="240" class="image" />
    <line x1="175" y1="220" x2="185" y2="240" class="image" />
    <line x1="175" y1="210" x2="195" y2="200" class="image" />
  </g>
</svg>