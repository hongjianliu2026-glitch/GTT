<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">worship</text>
  <text x="50" y="120" class="subtitle">[ˈwɜːrʃɪp] n. 崇拜，礼拜；v. 崇拜，尊敬</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wor (价值) + ship (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围着一个神像，"赋予(wor)"
    <tspan x="50" dy="25">它极高的价值，并表现出尊敬(ship)，这就是崇拜(worship)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They worship the sun god every morning.
  </text>
  <text x="50" y="310" class="content">
    他们每天早晨都崇拜太阳神。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Altar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Idol -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Worshippers -->
    <line x1="50" y1="180" x2="50" y2="200" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="150" y1="180" x2="150" y2="200" class="image" />
    <line x1="200" y1="180" x2="200" y2="200" class="image" />
    <line x1="250" y1="180" x2="250" y2="200" class="image" />
    <line x1="300" y1="180" x2="300" y2="200" class="image" />
    <!-- Hands raised -->
    <line x1="50" y1="180" x2="30" y2="150" class="image" />
    <line x1="100" y1="180" x2="80" y2="150" class="image" />
    <line x1="150" y1="180" x2="130" y2="150" class="image" />
    <line x1="200" y1="180" x2="180" y2="150" class="image" />
    <line x1="250" y1="180" x2="230" y2="150" class="image" />
    <line x1="300" y1="180" x2="280" y2="150" class="image" />
  </g>
</svg>