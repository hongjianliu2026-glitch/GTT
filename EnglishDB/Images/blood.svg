<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .blood { fill: #C0392B; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blood</text>
  <text x="50" y="120" class="subtitle">[blʌd] n. 血液</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bl- (表示液体) + -ood (表示状态或性质)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士在战场上，"液体(bl-)"
    <tspan x="50" dy="25">从他的伤口流出，这就是血液(blood)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor drew some blood for testing.
  </text>
  <text x="50" y="310" class="content">
    医生抽了一些血进行检测。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blood drop -->
    <circle cx="50" cy="50" r="30" class="blood" />
    <!-- Blood splatter -->
    <circle cx="100" cy="40" r="20" class="blood" />
    <circle cx="120" cy="60" r="15" class="blood" />
    <circle cx="80" cy="70" r="25" class="blood" />
    <!-- Warrior -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="150" x2="180" y2="130" class="image" />
    <line x1="200" y1="150" x2="220" y2="130" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
  </g>
</svg>