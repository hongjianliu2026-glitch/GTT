<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">highland</text>
  <text x="50" y="120" class="subtitle">[ˈhaɪlənd] n. 高地，高原</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> high (高) + land (土地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片"高(high)"耸入云的"土地(land)"，
    <tspan x="50" dy="25">这就是高地(highland)，山峦起伏，云雾缭绕。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Scottish highlands are famous for their breathtaking scenery.
  </text>
  <text x="50" y="310" class="content">
    苏格兰高地以其令人叹为观止的景色而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain peaks -->
    <polygon points="0,150 100,0 200,150" class="image" />
    <polygon points="50,150 150,50 250,150" class="image" />
    <polygon points="100,150 200,100 300,150" class="image" />
    <!-- Clouds -->
    <ellipse cx="150" cy="50" rx="100" ry="30" class="image" />
    <ellipse cx="250" cy="70" rx="80" ry="20" class="image" />
  </g>
</svg>