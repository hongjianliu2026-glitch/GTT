<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">leftist</text>
  <text x="50" y="120" class="subtitle">[ˈlɛftɪst] n. 左派分子，左翼人士</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> left (左) + -ist (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个政治集会上，一个"左派分子(leftist)"
    <tspan x="50" dy="25">高举着左手的旗帜，象征着他的左翼立场。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The leftist party won the election.
  </text>
  <text x="50" y="310" class="content">
    左翼政党赢得了选举。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person holding a flag -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="30" y2="220" class="image" /> <!-- Left leg -->
    <line x1="50" y1="180" x2="70" y2="220" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="160" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="160" class="image" /> <!-- Right arm -->
    <line x1="70" y1="160" x2="100" y2="160" class="image" /> <!-- Flag pole -->
    <polygon points="100,160 120,140 120,180" class="image" fill="#E74C3C" /> <!-- Flag -->
  </g>
</svg>