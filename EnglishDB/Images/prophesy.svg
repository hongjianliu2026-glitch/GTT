<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">prophesy</text>
  <text x="50" y="120" class="subtitle">[ˈprɒfɪsaɪ] v. 预言，预示</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (在前面) + phe (说) + -sy (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个先知站在高台上，"提前说出(pro-phe-sy)"
    <tspan x="50" dy="25">未来的事情，这就是预言(prophesy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man claimed to be able to prophesy the future.
  </text>
  <text x="50" y="310" class="content">
    那位老人声称能够预言未来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Prophet -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <line x1="175" y1="140" x2="120" y2="130" class="image" />
    <line x1="175" y1="140" x2="230" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M200,80 Q250,80 250,120 Q200,120 200,80 Z" class="image" />
    <text x="210" y="100" class="content">未来</text>
  </g>
</svg>