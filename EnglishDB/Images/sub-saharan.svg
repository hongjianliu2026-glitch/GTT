<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sub-Saharan</text>
  <text x="50" y="120" class="subtitle">[ˌsʌb səˈhɑːrən] adj. 撒哈拉以南的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在...下面) + Sahara (撒哈拉沙漠)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象撒哈拉沙漠像一个巨大的"盖子"，
    <tspan x="50" dy="25">"盖子下面(sub-)"就是撒哈拉以南的地区。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sub-Saharan region is known for its diverse wildlife.
  </text>
  <text x="50" y="310" class="content">
    撒哈拉以南地区以其多样的野生动物而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sahara Desert "lid" -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <text x="175" y="30" text-anchor="middle" class="content">Sahara</text>
    <!-- Sub-Saharan region -->
    <rect x="50" y="60" width="250" height="140" class="image" />
    <text x="175" y="140" text-anchor="middle" class="content">sub-Saharan</text>
    <!-- Trees and animals -->
    <line x1="70" y1="80" x2="70" y2="120" class="image" />
    <line x1="70" y1="80" x2="60" y2="100" class="image" />
    <line x1="70" y1="80" x2="80" y2="100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="90" y2="140" class="image" />
    <line x1="100" y1="130" x2="110" y2="140" class="image" />
    <line x1="100" y1="120" x2="120" y2="110" class="image" />
  </g>
</svg>