<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interracial</text>
  <text x="50" y="120" class="subtitle">[ˌɪntəˈreɪʃl] adj. 种族间的，跨种族的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + racial (种族的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个不同肤色的人手牵手，"在种族之间(inter-racial)"
    <tspan x="50" dy="25">建立起友谊和理解，这就是跨种族(interracial)的和谐画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event promoted interracial understanding.
  </text>
  <text x="50" y="310" class="content">
    这个活动促进了种族间的理解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people holding hands -->
    <circle cx="50" cy="100" r="20" class="image" fill="#FFD700" /> <!-- Yellow person -->
    <circle cx="150" cy="100" r="20" class="image" fill="#8B4513" /> <!-- Brown person -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" /> <!-- Hands holding -->
    <!-- Hearts -->
    <path d="M 50 130 Q 100 150 150 130" class="image" fill="#FF69B4" />
    <path d="M 50 130 Q 100 160 150 130" class="image" fill="#FF69B4" />
  </g>
</svg>