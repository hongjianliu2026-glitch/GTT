<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">median</text>
  <text x="50" y="120" class="subtitle">[ˈmiːdiən] n. 中位数，中线</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> medi- (中间) + -an (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条道路被分成两半，中间的"中线(median)"
    <tspan x="50" dy="25">就像一个中位数，把数据分成两部分。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The median income in this city is $50,000.
  </text>
  <text x="50" y="310" class="content">
    这个城市的中位收入是50,000美元。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Median line -->
    <line x1="175" y1="0" x2="175" y2="100" class="image" stroke-width="4" stroke="#E74C3C" />
    <!-- Cars -->
    <rect x="50" y="20" width="30" height="30" class="image" />
    <rect x="100" y="20" width="30" height="30" class="image" />
    <rect x="250" y="20" width="30" height="30" class="image" />
    <rect x="300" y="20" width="30" height="30" class="image" />
  </g>
</svg>