<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">toad</text>
  <text x="50" y="120" class="subtitle">[toʊd] n. 蟾蜍，癞蛤蟆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> toad (源自中古英语 tadde, 意为蟾蜍)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蟾蜍(toad)在夜晚的池塘边，"呱呱(toad)"
    <tspan x="50" dy="25">地叫着，它的皮肤上布满了疙瘩，让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The toad hopped across the garden.
  </text>
  <text x="50" y="310" class="content">
    那只蟾蜍跳过了花园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pond -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Toad -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="90" cy="90" r="5" class="image" />
    <circle cx="110" cy="90" r="5" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="70" y2="120" class="image" />
    <line x1="100" y1="130" x2="130" y2="120" class="image" />
    <!-- Warts -->
    <circle cx="80" cy="110" r="5" class="image" />
    <circle cx="120" cy="110" r="5" class="image" />
    <circle cx="100" cy="130" r="5" class="image" />
  </g>
</svg>