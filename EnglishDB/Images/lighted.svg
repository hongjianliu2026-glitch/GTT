<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lighted</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪtɪd] adj. 点亮的，照亮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> light (光) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚，"光(light)"照亮了整个房间，
    <tspan x="50" dy="25">房间变得明亮(lighted)，仿佛白昼一般。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was lighted by a single candle.
  </text>
  <text x="50" y="310" class="content">
    房间被一支蜡烛照亮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Light source -->
    <circle cx="175" cy="100" r="30" fill="#F39C12" />
    <!-- Rays of light -->
    <line x1="175" y1="100" x2="0" y2="0" class="image" />
    <line x1="175" y1="100" x2="350" y2="0" class="image" />
    <line x1="175" y1="100" x2="0" y2="200" class="image" />
    <line x1="175" y1="100" x2="350" y2="200" class="image" />
    <!-- Furniture -->
    <rect x="50" y="120" width="100" height="60" class="image" />
    <rect x="200" y="120" width="100" height="60" class="image" />
  </g>
</svg>