<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shop</text>
  <text x="50" y="120" class="subtitle">[ʃɒp] n. 商店，店铺；v. 购物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shop (源自中古英语 "shoppe"，意为"工作坊")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的"工作坊(shop)"，里面摆满了各种工具和商品，
    <tspan x="50" dy="25">人们在这里"购物(shop)"，挑选自己需要的物品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She went to the shop to buy some groceries.
  </text>
  <text x="50" y="310" class="content">
    她去商店买了一些杂货。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shop front -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Shop sign -->
    <rect x="50" y="20" width="250" height="50" class="image" />
    <text x="125" y="55" class="content" fill="#FFFFFF">SHOP</text>
    <!-- Shop window -->
    <rect x="50" y="80" width="250" height="100" class="image" />
    <!-- Items in the shop -->
    <circle cx="80" cy="130" r="15" class="image" /> <!-- Apple -->
    <rect x="110" y="120" width="20" height="20" class="image" /> <!-- Bread -->
    <line x1="150" y1="120" x2="170" y2="140" class="image" />
    <line x1="170" y1="140" x2="150" y2="160" class="image" /> <!-- Knife -->
    <!-- Person shopping -->
    <circle cx="280" cy="130" r="15" class="image" />
    <line x1="280" y1="145" x2="280" y2="180" class="image" />
    <line x1="280" y1="180" x2="260" y2="210" class="image" />
    <line x1="280" y1="180" x2="300" y2="210" class="image" />
    <line x1="280" y1="160" x2="310" y2="150" class="image" />
  </g>
</svg>