<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .hotbed { fill: #FF5733; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hotbed</text>
  <text x="50" y="120" class="subtitle">[ˈhɒtbɛd] n. 温床，滋生地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hot (热的) + bed (床)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"热床(hot-bed)"，上面长满了快速生长的植物，
    <tspan x="50" dy="25">这个床就成了各种事物迅速发展的"温床(hotbed)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city became a hotbed of political unrest.
  </text>
  <text x="50" y="310" class="content">
    这座城市成了政治动荡的温床。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hotbed -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="hotbed" />
    <!-- Plants -->
    <line x1="70" y1="50" x2="70" y2="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="120" class="image" />
    <line x1="130" y1="50" x2="130" y2="140" class="image" />
    <line x1="160" y1="50" x2="160" y2="160" class="image" />
    <line x1="190" y1="50" x2="190" y2="180" class="image" />
    <line x1="220" y1="50" x2="220" y2="200" class="image" />
    <line x1="250" y1="50" x2="250" y2="220" class="image" />
  </g>
</svg>