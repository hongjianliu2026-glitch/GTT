<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sunspot</text>
  <text x="50" y="120" class="subtitle">[ˈsʌnˌspɒt] n. 太阳黑子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sun (太阳) + spot (斑点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳表面有一个巨大的黑色斑点，
    <tspan x="50" dy="25">这个斑点就是太阳黑子(sunspot)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Scientists study sunspots to understand solar activity.
  </text>
  <text x="50" y="310" class="content">
    科学家研究太阳黑子以了解太阳活动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="175" cy="100" r="80" class="image" fill="#F1C40F" />
    <!-- Sunspot -->
    <circle cx="120" cy="80" r="20" class="image" fill="#34495E" />
    <!-- Sun rays -->
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <line x1="255" y1="100" x2="300" y2="100" class="image" />
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
    <line x1="95" y1="100" x2="50" y2="100" class="image" />
  </g>
</svg>