<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sever</text>
  <text x="50" y="120" class="subtitle">[ˈsɛvər] v. 切断，割断</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + ver (转)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把锋利的刀，"分开(se-)"并"转动(ver)"，
    <tspan x="50" dy="25">将物体切断(sever)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The surgeon had to sever the damaged nerve.
  </text>
  <text x="50" y="310" class="content">
    外科医生不得不切断受损的神经。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Knife -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="50" y2="150" class="image" />
    <!-- Object being severed -->
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <line x1="200" y1="120" x2="300" y2="120" class="image" />
    <line x1="200" y1="140" x2="300" y2="140" class="image" />
    <line x1="200" y1="160" x2="300" y2="160" class="image" />
    <line x1="200" y1="180" x2="300" y2="180" class="image" />
    <!-- Cut line -->
    <line x1="250" y1="80" x2="250" y2="200" class="image" stroke-dasharray="5,5" />
  </g>
</svg>