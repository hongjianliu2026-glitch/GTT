<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">topical</text>
  <text x="50" y="120" class="subtitle">[ˈtɒpɪkl] adj. 主题的，时事的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> top (主题) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新闻主播站在一个巨大的地球仪前，"主题(top)"
    <tspan x="50" dy="25">和时事(ical)紧密相连，这就是topical。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The discussion was very topical, focusing on current events.
  </text>
  <text x="50" y="310" class="content">
    讨论非常时事，聚焦于当前事件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Globe -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- News anchor -->
    <circle cx="175" cy="200" r="15" class="image" />
    <line x1="175" y1="215" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="155" y2="280" class="image" />
    <line x1="175" y1="250" x2="195" y2="280" class="image" />
    <line x1="175" y1="230" x2="205" y2="220" class="image" />
    <!-- Microphone -->
    <line x1="175" y1="215" x2="175" y2="180" class="image" />
    <rect x="165" y="180" width="20" height="10" class="image" />
  </g>
</svg>