<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mentally</text>
  <text x="50" y="120" class="subtitle">[ˈmɛntəli] adv. 精神上，智力上</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ment (心智) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在思考问题，"心智(ment)"
    <tspan x="50" dy="25">上不断运转，这就是精神上(mentally)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She solved the puzzle mentally without writing anything down.
  </text>
  <text x="50" y="310" class="content">
    她没有写下任何东西，全凭心智解决了这个谜题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Thought lines -->
    <line x1="100" y1="50" x2="150" y2="20" class="image" />
    <line x1="100" y1="50" x2="50" y2="20" class="image" />
    <line x1="100" y1="150" x2="150" y2="180" class="image" />
    <line x1="100" y1="150" x2="50" y2="180" class="image" />
    <!-- Person thinking -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
  </g>
</svg>