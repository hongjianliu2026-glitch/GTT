<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">party</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːrti] n. 聚会，政党；v. 参加聚会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> part (部分) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人聚集在一起，"部分(part)"
    <tspan x="50" dy="25">的人组成了一个欢乐的聚会(party)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had a great time at the party last night.
  </text>
  <text x="50" y="310" class="content">
    昨晚的聚会上我们玩得很开心。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Party scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Table with drinks -->
    <rect x="50" y="130" width="200" height="30" class="image" />
    <circle cx="70" cy="145" r="5" class="image" />
    <circle cx="100" cy="145" r="5" class="image" />
    <circle cx="130" cy="145" r="5" class="image" />
    <circle cx="160" cy="145" r="5" class="image" />
    <circle cx="190" cy="145" r="5" class="image" />
    <circle cx="220" cy="145" r="5" class="image" />
    <!-- Balloons -->
    <line x1="50" y1="50" x2="70" y2="70" class="image" />
    <line x1="100" y1="50" x2="120" y2="70" class="image" />
    <line x1="150" y1="50" x2="170" y2="70" class="image" />
    <line x1="200" y1="50" x2="220" y2="70" class="image" />
    <line x1="250" y1="50" x2="270" y2="70" class="image" />
  </g>
</svg>