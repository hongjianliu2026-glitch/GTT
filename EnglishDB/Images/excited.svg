<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">excited</text>
  <text x="50" y="120" class="subtitle">[ɪkˈsaɪtɪd] adj. 兴奋的，激动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (出) + cit (唤起) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"唤起(cit)"了内心的激情，"出(ex-)"现了兴奋的状态，
    <tspan x="50" dy="25">就像一个气球被充气到极限，即将爆炸一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children were excited about the upcoming trip.
  </text>
  <text x="50" y="310" class="content">
    孩子们对即将到来的旅行感到兴奋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- String -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Person -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="180" y2="250" class="image" />
    <line x1="200" y1="220" x2="220" y2="250" class="image" />
    <line x1="200" y1="190" x2="240" y2="180" class="image" />
    <!-- Exclamation marks -->
    <text x="210" y="140" class="highlight">!</text>
    <text x="220" y="130" class="highlight">!</text>
    <text x="230" y="120" class="highlight">!</text>
  </g>
</svg>