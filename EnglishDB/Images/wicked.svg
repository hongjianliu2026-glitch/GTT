<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wicked</text>
  <text x="50" y="120" class="subtitle">[ˈwɪkɪd] adj. 邪恶的，淘气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wic- (巫术) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个淘气的孩子，他偷偷学会了"巫术(wic-)"，
    <tspan x="50" dy="25">用这些魔法捉弄别人，真是"邪恶的(wicked)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wicked witch cast a spell on the princess.
  </text>
  <text x="50" y="310" class="content">
    邪恶的女巫对公主施了咒语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Witch's hat -->
    <path d="M 0 0 L 50 50 L 100 0 Z" class="image" />
    <!-- Witch's face -->
    <circle cx="50" cy="70" r="20" class="image" />
    <!-- Eyes -->
    <circle cx="40" cy="65" r="5" class="image" />
    <circle cx="60" cy="65" r="5" class="image" />
    <!-- Nose -->
    <line x1="50" y1="80" x2="50" y2="90" class="image" />
    <!-- Mouth -->
    <path d="M 40 95 Q 50 100 60 95" class="image" />
    <!-- Broom -->
    <line x1="20" y1="120" x2="80" y2="120" class="image" />
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
  </g>
</svg>