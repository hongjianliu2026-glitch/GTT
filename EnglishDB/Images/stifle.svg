<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stifle</text>
  <text x="50" y="120" class="subtitle">[ˈstaɪfəl] v. 抑制，窒息</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + -ifle (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"站立(st-)"着"使(ifle)"得无法呼吸，
    <tspan x="50" dy="25">就像是被窒息(stifle)了一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heavy blanket stifled her breathing.
  </text>
  <text x="50" y="310" class="content">
    厚重的毯子让她呼吸困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Blanket -->
    <rect x="30" y="80" width="40" height="40" class="image" />
    <!-- Struggling arms -->
    <line x1="30" y1="100" x2="10" y2="120" class="image" />
    <line x1="70" y1="100" x2="90" y2="120" class="image" />
  </g>
</svg>