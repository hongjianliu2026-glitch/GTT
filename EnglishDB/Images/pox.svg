<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .dots { fill: #C0392B; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pox</text>
  <text x="50" y="120" class="subtitle">[pɒks] n. 痘，天花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pox (源自拉丁语 "pustula"，意为脓疱)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个满脸脓疱(pox)的人，这些脓疱就像
    <tspan x="50" dy="25">天上的星星一样多，这就是天花的可怕景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The smallpox vaccine has eradicated the disease.
  </text>
  <text x="50" y="310" class="content">
    天花疫苗已经根除了这种疾病。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Pox -->
    <circle cx="60" cy="60" r="10" class="dots" />
    <circle cx="140" cy="60" r="10" class="dots" />
    <circle cx="100" cy="140" r="10" class="dots" />
    <circle cx="80" cy="120" r="10" class="dots" />
    <circle cx="120" cy="120" r="10" class="dots" />
    <circle cx="100" cy="80" r="10" class="dots" />
  </g>
</svg>