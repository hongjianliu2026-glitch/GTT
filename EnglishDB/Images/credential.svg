<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">credential</text>
  <text x="50" y="120" class="subtitle">[krəˈdɛnʃəl] n. 证书，凭证；信任状</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cred (相信) + ent (名词后缀) + ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的证书(credential)，上面写着"相信我(cred)"，
    <tspan x="50" dy="25">这个证书就是你的信任状(credential)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She presented her credentials to the security guard.
  </text>
  <text x="50" y="310" class="content">
    她向保安出示了她的证件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Certificate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ribbon -->
    <rect x="150" y="20" width="50" height="160" class="image" transform="rotate(45 175 100)" />
    <!-- Text on certificate -->
    <text x="50" y="100" class="content" style="font-size: 24px; fill: #2C3E50;">相信我(cred)</text>
  </g>
</svg>