<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gymnastics</text>
  <text x="50" y="120" class="subtitle">[dʒɪmˈnæstɪks] n. 体操</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gymno- (裸体) + -st (站立) + -ics (学科)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象古代的运动员在训练场上，"裸体站立(gymno-st)"
    <tspan x="50" dy="25">展示他们的力量和灵活性，这就是体操(gymnastics)的起源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She excels in artistic gymnastics.
  </text>
  <text x="50" y="310" class="content">
    她在艺术体操方面表现出色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gymnast -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <!-- Balance beam -->
    <line x1="0" y1="250" x2="100" y2="250" class="image" />
    <!-- Gymnast on balance beam -->
    <circle cx="50" cy="240" r="10" class="image" />
    <line x1="50" y1="250" x2="50" y2="280" class="image" />
    <line x1="50" y1="280" x2="40" y2="300" class="image" />
    <line x1="50" y1="280" x2="60" y2="300" class="image" />
  </g>
</svg>