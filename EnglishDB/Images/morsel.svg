<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">morsel</text>
  <text x="50" y="120" class="subtitle">[ˈmɔːrsl] n. 一小口食物，少量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mors (咬) + -el (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小老鼠在偷吃"一小口(morsel)"奶酪，
    <tspan x="50" dy="25">它小心翼翼地咬下一块，这就是morsel的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She took a tiny morsel of cake and savored it.
  </text>
  <text x="50" y="310" class="content">
    她拿了一小块蛋糕，细细品味。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cheese -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Morsel of cheese -->
    <rect x="50" y="20" width="30" height="30" class="image" />
    <!-- Mouse -->
    <circle cx="20" cy="80" r="15" class="image" />
    <line x1="20" y1="95" x2="20" y2="120" class="image" />
    <line x1="20" y1="120" x2="0" y2="140" class="image" />
    <line x1="20" y1="120" x2="40" y2="140" class="image" />
    <line x1="20" y1="105" x2="50" y2="95" class="image" />
  </g>
</svg>