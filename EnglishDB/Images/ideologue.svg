<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ideologue</text>
  <text x="50" y="120" class="subtitle">[ˈaɪdiəˌlɔɡ] n. 理论家，空想家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ideo- (思想) + -logue (说话者)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个理论家站在讲台上，"滔滔不绝地(logue)"
    <tspan x="50" dy="25">讲述他的思想(ideo)，他就是个空想家(ideologue)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ideologue's speeches were filled with abstract ideas.
  </text>
  <text x="50" y="310" class="content">
    这位理论家的演讲充满了抽象的思想。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lectern -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="200" cy="100" r="30" class="image" />
    <line x1="200" y1="130" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="200" class="image" />
    <line x1="200" y1="180" x2="220" y2="200" class="image" />
    <line x1="200" y1="150" x2="250" y2="140" class="image" />
    <!-- Speech bubble -->
    <path d="M250,80 Q300,80 300,120 Q250,120 250,80 Z" class="image" />
    <text x="260" y="100" class="content" text-anchor="middle">Ideas</text>
  </g>
</svg>