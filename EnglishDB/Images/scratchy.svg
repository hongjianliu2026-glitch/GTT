<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scratchy</text>
  <text x="50" y="120" class="subtitle">[ˈskrætʃi] adj. 刺耳的，粗糙的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scratch (抓) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猫用爪子在黑板上"抓(scratch)"，
    <tspan x="50" dy="25">发出刺耳的声音，这种声音就是"scratchy"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old record player produced a scratchy sound.
  </text>
  <text x="50" y="310" class="content">
    老式唱片机发出了刺耳的声音。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blackboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cat's claw -->
    <line x1="50" y1="50" x2="100" y2="100" class="image" />
    <line x1="50" y1="70" x2="100" y2="120" class="image" />
    <line x1="50" y1="90" x2="100" y2="140" class="image" />
    <!-- Cat's body -->
    <circle cx="30" cy="70" r="20" class="image" />
    <line x1="30" y1="90" x2="30" y2="120" class="image" />
    <line x1="30" y1="120" x2="10" y2="150" class="image" />
    <line x1="30" y1="120" x2="50" y2="150" class="image" />
    <line x1="30" y1="100" x2="0" y2="90" class="image" />
    <line x1="30" y1="100" x2="60" y2="90" class="image" />
  </g>
</svg>