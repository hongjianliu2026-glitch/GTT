<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mid-century</text>
  <text x="50" y="120" class="subtitle">[ˌmɪdˈsɛntʃəri] adj. 中世纪的，20世纪中叶的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mid- (中间) + century (世纪)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时间轴，"中间的世纪(mid-century)"
    <tspan x="50" dy="25">就像一个钟摆，摆动在两个世纪之间，象征着中世纪或20世纪中叶。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The mid-century modern architecture is iconic.
  </text>
  <text x="50" y="310" class="content">
    20世纪中叶的现代建筑风格非常具有标志性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Time axis -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Mid-century mark -->
    <line x1="175" y1="-10" x2="175" y2="10" class="image" />
    <!-- Century marks -->
    <line x1="50" y1="-5" x2="50" y2="5" class="image" />
    <line x1="300" y1="-5" x2="300" y2="5" class="image" />
    <!-- Labels -->
    <text x="45" y="-20" class="content">1900</text>
    <text x="170" y="-20" class="content">1950</text>
    <text x="295" y="-20" class="content">2000</text>
    <!-- Pendulum -->
    <line x1="175" y1="0" x2="175" y2="50" class="image" />
    <circle cx="175" cy="50" r="10" class="image" />
  </g>
</svg>