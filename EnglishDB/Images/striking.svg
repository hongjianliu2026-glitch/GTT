<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">striking</text>
  <text x="50" y="120" class="subtitle">[ˈstraɪkɪŋ] adj. 显著的，引人注目的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> strike (打击) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的锤子"打击(strike)"在一块石头上，
    <tspan x="50" dy="25">石头瞬间裂开，这个画面非常"引人注目(striking)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The striking contrast between the two colors made the painting stand out.
  </text>
  <text x="50" y="310" class="content">
    两种颜色的显著对比使得这幅画格外引人注目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hammer -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="50" y1="20" x2="30" y2="40" class="image" />
    <line x1="50" y1="20" x2="70" y2="40" class="image" />
    <line x1="50" y1="100" x2="30" y2="120" class="image" />
    <line x1="50" y1="100" x2="70" y2="120" class="image" />
    <!-- Stone -->
    <rect x="100" y="80" width="150" height="50" class="image" />
    <line x1="120" y1="80" x2="120" y2="130" class="image" />
    <line x1="140" y1="80" x2="140" y2="130" class="image" />
    <line x1="160" y1="80" x2="160" y2="130" class="image" />
    <line x1="180" y1="80" x2="180" y2="130" class="image" />
    <line x1="200" y1="80" x2="200" y2="130" class="image" />
    <line x1="220" y1="80" x2="220" y2="130" class="image" />
  </g>
</svg>