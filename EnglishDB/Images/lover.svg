<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lover</text>
  <text x="50" y="120" class="subtitle">[ˈlʌvər] n. 爱人，情人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> love (爱) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满爱意的场景，"爱(love)"
    <tspan x="50" dy="25">的人(er)相互依偎，这就是爱人(lover)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a devoted lover of classical music.
  </text>
  <text x="50" y="310" class="content">
    她是一个忠实的古典音乐爱好者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q25 10 40 30 T70 30" class="image" />
    <path d="M10 30 Q25 50 40 30 T70 30" class="image" />
    <!-- Two people -->
    <circle cx="30" cy="100" r="15" class="image" />
    <line x1="30" y1="115" x2="30" y2="150" class="image" />
    <line x1="30" y1="150" x2="15" y2="180" class="image" />
    <line x1="30" y1="150" x2="45" y2="180" class="image" />
    <line x1="30" y1="130" x2="60" y2="120" class="image" />
    <circle cx="60" cy="100" r="15" class="image" />
    <line x1="60" y1="115" x2="60" y2="150" class="image" />
    <line x1="60" y1="150" x2="45" y2="180" class="image" />
    <line x1="60" y1="150" x2="75" y2="180" class="image" />
    <line x1="60" y1="130" x2="30" y2="120" class="image" />
  </g>
</svg>