<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incorporate</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkɔːrpəreɪt] v. 合并，结合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + corpor (身体) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的身体(corpor)，两个小物体(in)
    <tspan x="50" dy="25">被吸收进这个身体，最终融合成一个整体(incorporate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company decided to incorporate new technology into its products.
  </text>
  <text x="50" y="310" class="content">
    公司决定将新技术融入其产品中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large body -->
    <circle cx="150" cy="100" r="80" class="image" />
    <!-- Small objects -->
    <circle cx="70" cy="100" r="20" class="image" />
    <circle cx="230" cy="100" r="20" class="image" />
    <!-- Arrows -->
    <line x1="90" y1="100" x2="130" y2="100" class="image" />
    <line x1="210" y1="100" x2="170" y2="100" class="image" />
    <polygon points="130,95 130,105 140,100" class="image" />
    <polygon points="170,95 170,105 160,100" class="image" />
  </g>
</svg>