<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">considerable</text>
  <text x="50" y="120" class="subtitle">[kənˈsɪdərəbl] adj. 相当大的，重要的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + sider (星星) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一起，"一起看星星(con-sider)"，
    <tspan x="50" dy="25">发现星星的数量"相当大(considerable)"，令人惊叹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project required a considerable amount of time and effort.
  </text>
  <text x="50" y="310" class="content">
    这个项目需要相当多的时间和精力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People sitting around -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Stars -->
    <circle cx="50" cy="100" r="5" class="image" />
    <circle cx="70" cy="120" r="5" class="image" />
    <circle cx="90" cy="100" r="5" class="image" />
    <circle cx="110" cy="120" r="5" class="image" />
    <circle cx="130" cy="100" r="5" class="image" />
    <circle cx="150" cy="120" r="5" class="image" />
    <circle cx="170" cy="100" r="5" class="image" />
    <circle cx="190" cy="120" r="5" class="image" />
    <circle cx="210" cy="100" r="5" class="image" />
    <circle cx="230" cy="120" r="5" class="image" />
    <circle cx="250" cy="100" r="5" class="image" />
    <!-- Connecting lines -->
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="100" y1="50" x2="70" y2="120" class="image" />
    <line x1="150" y1="50" x2="90" y2="100" class="image" />
    <line x1="200" y1="50" x2="110" y2="120" class="image" />
    <line x1="250" y1="50" x2="130" y2="100" class="image" />
  </g>
</svg>