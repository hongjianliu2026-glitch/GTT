<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">three-fourths</text>
  <text x="50" y="120" class="subtitle">[θriːˈfɔːrθs] n. 四分之三</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> three (三) + fourths (四分之一)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的披萨被切成四块，其中三块被吃掉了，
    <tspan x="50" dy="25">剩下的就是"四分之三(three-fourths)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She ate three-fourths of the pizza.
  </text>
  <text x="50" y="310" class="content">
    她吃了四分之三的披萨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pizza base -->
    <circle cx="150" cy="100" r="80" class="image" />
    <!-- Slices -->
    <path d="M150,20 A80,80 0 0,1 230,100 L150,100 Z" class="image" />
    <path d="M150,20 A80,80 0 0,1 70,100 L150,100 Z" class="image" />
    <path d="M150,20 A80,80 0 0,1 150,180 Z" class="image" />
    <!-- Eaten slices -->
    <path d="M150,20 A80,80 0 0,1 230,100 L150,100 Z" class="image" fill="#E74C3C" />
    <path d="M150,20 A80,80 0 0,1 70,100 L150,100 Z" class="image" fill="#E74C3C" />
    <path d="M150,20 A80,80 0 0,1 150,180 Z" class="image" fill="#E74C3C" />
  </g>
</svg>