<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">colt</text>
  <text x="50" y="120" class="subtitle">[koʊlt] n. 小马驹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> col- (小) + t (马驹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小马驹(colt)在草原上欢快地奔跑，
    <tspan x="50" dy="25">它的蹄子轻盈地踏在草地上，留下一串串小脚印。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The farmer raised a healthy colt.
  </text>
  <text x="50" y="310" class="content">
    农夫养了一只健康的小马驹。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="150" width="350" height="50" class="image" fill="#27AE60" />
    <!-- Colt -->
    <circle cx="100" cy="100" r="30" class="image" fill="#D35400" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="80" y2="210" class="image" />
    <line x1="100" y1="180" x2="120" y2="210" class="image" />
    <line x1="100" y1="150" x2="140" y2="140" class="image" />
    <line x1="100" y1="150" x2="60" y2="140" class="image" />
  </g>
</svg>