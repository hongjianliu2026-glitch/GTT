<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uptake</text>
  <text x="50" y="120" class="subtitle">[ˈʌpˌteɪk] n. 吸收，摄取</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + take (拿)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的吸管，"向上拿取(up-take)"
    <tspan x="50" dy="25">液体或营养，这就是吸收(uptake)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The body's uptake of vitamins is crucial for health.
  </text>
  <text x="50" y="310" class="content">
    身体对维生素的吸收对健康至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Straw -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="50" y1="0" x2="70" y2="20" class="image" />
    <line x1="50" y1="0" x2="30" y2="20" class="image" />
    <!-- Liquid -->
    <rect x="0" y="200" width="100" height="20" class="image" />
    <line x1="50" y1="200" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="70" y2="240" class="image" />
    <line x1="50" y1="220" x2="30" y2="240" class="image" />
  </g>
</svg>