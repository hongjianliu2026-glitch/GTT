<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skillfully</text>
  <text x="50" y="120" class="subtitle">[ˈskɪlfəli] adv. 熟练地，巧妙地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skill (技能) + -ful (充满) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个工匠在雕刻，他"充满技能(skill-ful)"地
    <tspan x="50" dy="25">操作工具，动作"熟练地(skillfully)"，仿佛与工具融为一体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She played the piano skillfully at the concert.
  </text>
  <text x="50" y="310" class="content">
    她在音乐会上熟练地弹奏钢琴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Craftsman -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Tools -->
    <rect x="50" y="80" width="30" height="50" class="image" />
    <rect x="90" y="80" width="30" height="50" class="image" />
    <rect x="130" y="80" width="30" height="50" class="image" />
    <!-- Workbench -->
    <rect x="0" y="180" width="180" height="50" class="image" />
    <!-- Carving -->
    <line x1="20" y1="100" x2="160" y2="100" class="image" />
    <line x1="20" y1="120" x2="160" y2="120" class="image" />
    <line x1="20" y1="140" x2="160" y2="140" class="image" />
  </g>
</svg>