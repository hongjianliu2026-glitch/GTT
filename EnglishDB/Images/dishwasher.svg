<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dishwasher</text>
  <text x="50" y="120" class="subtitle">[ˈdɪʃwɒʃər] n. 洗碗机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dish (盘子) + wash (洗) + er (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的盘子(dish)在自动洗碗机(washer)里，
    <tspan x="50" dy="25">水流喷射出来，把盘子洗得干干净净。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loaded the dishwasher with dirty dishes.
  </text>
  <text x="50" y="310" class="content">
    她把脏盘子放进洗碗机里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dishwasher -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dish -->
    <rect x="50" y="50" width="100" height="20" class="image" />
    <!-- Water spray -->
    <line x1="100" y1="30" x2="150" y2="10" class="image" />
    <line x1="100" y1="30" x2="150" y2="50" class="image" />
    <line x1="100" y1="30" x2="150" y2="30" class="image" />
    <!-- Water spray -->
    <line x1="200" y1="30" x2="250" y2="10" class="image" />
    <line x1="200" y1="30" x2="250" y2="50" class="image" />
    <line x1="200" y1="30" x2="250" y2="30" class="image" />
  </g>
</svg>