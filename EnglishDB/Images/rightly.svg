<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rightly</text>
  <text x="50" y="120" class="subtitle">[ˈraɪtli] adv. 正确地，恰当地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> right (正确的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一条直线上，"正确地(rightly)"
    <tspan x="50" dy="25">行走，每一步都精准无误。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She rightly guessed the answer.
  </text>
  <text x="50" y="310" class="content">
    她正确地猜出了答案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Straight line -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person walking -->
    <circle cx="50" cy="0" r="15" class="image" />
    <line x1="50" y1="15" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="30" y2="80" class="image" />
    <line x1="50" y1="50" x2="70" y2="80" class="image" />
    <line x1="50" y1="30" x2="80" y2="20" class="image" />
    <!-- Another step -->
    <circle cx="150" cy="0" r="15" class="image" />
    <line x1="150" y1="15" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="130" y2="80" class="image" />
    <line x1="150" y1="50" x2="170" y2="80" class="image" />
    <line x1="150" y1="30" x2="180" y2="20" class="image" />
  </g>
</svg>