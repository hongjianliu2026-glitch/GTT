<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insult</text>
  <text x="50" y="120" class="subtitle">[ˈɪnsʌlt] n. 侮辱，冒犯；v. 侮辱，冒犯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + sult (跳跃)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人突然"跳入(in-sult)"你的私人空间，
    <tspan x="50" dy="25">用言语或行为"冒犯(insult)"你。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His rude comment was an insult to her intelligence.
  </text>
  <text x="50" y="310" class="content">
    他粗鲁的评论是对她智力的侮辱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />

    <!-- Insulting gesture -->
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="130" class="image" />
    <line x1="150" y1="150" x2="170" y2="130" class="image" />

    <!-- Speech bubble -->
    <path d="M160,50 Q200,50 200,80 Q160,80 160,50 Z" class="image" />
    <text x="170" y="70" class="content" text-anchor="middle">Rude!</text>
  </g>
</svg>