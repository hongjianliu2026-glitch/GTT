<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">well-trained</text>
  <text x="50" y="120" class="subtitle">[ˌwɛlˈtreɪnd] adj. 训练有素的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> well (好) + train (训练) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只经过"良好训练(well-trained)"的狗，
    <tspan x="50" dy="25">它能够完美地执行各种指令，展现出卓越的技能。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The well-trained dog performed tricks flawlessly.
  </text>
  <text x="50" y="310" class="content">
    这只训练有素的狗完美地表演了各种把戏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Front leg -->
    <line x1="50" y1="140" x2="20" y2="160" class="image" /> <!-- Tail -->
    <!-- Trainer -->
    <circle cx="150" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="150" y1="120" x2="150" y2="160" class="image" /> <!-- Body -->
    <line x1="150" y1="160" x2="130" y2="200" class="image" /> <!-- Left leg -->
    <line x1="150" y1="160" x2="170" y2="200" class="image" /> <!-- Right leg -->
    <line x1="150" y1="130" x2="120" y2="150" class="image" /> <!-- Left arm -->
    <line x1="150" y1="130" x2="180" y2="150" class="image" /> <!-- Right arm -->
    <!-- Leash -->
    <line x1="80" y1="130" x2="140" y2="130" class="image" />
  </g>
</svg>