<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yen</text>
  <text x="50" y="120" class="subtitle">[jen] n. 日元；渴望</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> yen (源自日语“円”，意为日元)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个旅行者在日本，看到满地的日元(yen)，
    <tspan x="50" dy="25">他突然感到一种强烈的渴望(yen)，想要收集所有的日元。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He has a yen for collecting rare coins.
  </text>
  <text x="50" y="310" class="content">
    他有一种收集稀有硬币的渴望。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Japanese flag -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="60" fill="#F4D03F" />
    <!-- Yen coins -->
    <circle cx="70" cy="100" r="20" fill="#C0392B" />
    <circle cx="120" cy="100" r="20" fill="#C0392B" />
    <circle cx="220" cy="100" r="20" fill="#C0392B" />
    <circle cx="270" cy="100" r="20" fill="#C0392B" />
    <!-- Traveler -->
    <circle cx="30" cy="150" r="15" class="image" />
    <line x1="30" y1="165" x2="30" y2="200" class="image" />
    <line x1="30" y1="200" x2="10" y2="230" class="image" />
    <line x1="30" y1="200" x2="50" y2="230" class="image" />
    <line x1="30" y1="180" x2="60" y2="170" class="image" />
  </g>
</svg>