<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #F57F17; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tasty</text>
  <text x="50" y="120" class="subtitle">[ˈteɪsti] adj. 美味的，可口的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tast (味道) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"品尝(tast)"
    <tspan x="50" dy="25">一道刚做好的菜，脸上露出满意的笑容，</tspan>
    <tspan x="50" dy="25">这道菜就是"美味的(tasty)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake was so tasty that I had a second slice.
  </text>
  <text x="50" y="310" class="content">
    蛋糕太好吃了，我又吃了一块。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chef's hat -->
    <circle cx="20" cy="20" r="15" class="image" />
    <rect x="10" y="35" width="20" height="10" class="image" />
    <!-- Chef's body -->
    <line x1="20" y1="45" x2="20" y2="80" class="image" />
    <line x1="20" y1="80" x2="0" y2="110" class="image" />
    <line x1="20" y1="80" x2="40" y2="110" class="image" />
    <line x1="20" y1="60" x2="50" y2="50" class="image" />
    <!-- Plate with food -->
    <rect x="60" y="20" width="100" height="80" class="image" />
    <circle cx="80" cy="60" r="10" class="image" />
    <circle cx="100" cy="60" r="10" class="image" />
    <circle cx="120" cy="60" r="10" class="image" />
    <!-- Smiling face -->
    <circle cx="20" cy="20" r="15" class="image" />
    <line x1="15" y1="25" x2="25" y2="25" class="image" />
    <line x1="15" y1="35" x2="25" y2="35" class="image" />
    <path d="M15 40 Q20 50 25 40" class="image" />
  </g>
</svg>