<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flash</text>
  <text x="50" y="120" class="subtitle">[flæʃ] n. 闪光，闪现；v. 闪光，闪现</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flash (源自中古英语 flasche，意为“突然闪现”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一道闪电突然"闪现(flash)"在天空中，
    <tspan x="50" dy="25">照亮了整个夜晚，这就是flash的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The camera's flash went off unexpectedly.
  </text>
  <text x="50" y="310" class="content">
    相机的闪光灯出乎意料地闪了一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lightning bolt -->
    <path d="M10 100 L50 50 L90 100 L130 50 L170 100" class="image" />
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
  </g>
</svg>