<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grandeur</text>
  <text x="50" y="120" class="subtitle">[ɡrænˈdʒər] n. 宏伟，壮丽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grand (大) + -eur (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的城堡，"大(grand)"到让人惊叹，
    <tspan x="50" dy="25">这种"大"的气势就是"宏伟(grandeur)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The grandeur of the ancient temple left us speechless.
  </text>
  <text x="50" y="310" class="content">
    这座古老寺庙的宏伟让我们无言以对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <rect x="70" y="40" width="210" height="120" class="image" />
    <rect x="90" y="60" width="170" height="80" class="image" />
    <rect x="110" y="80" width="130" height="40" class="image" />
    <!-- Towers -->
    <rect x="50" y="20" width="20" height="160" class="image" />
    <rect x="280" y="20" width="20" height="160" class="image" />
    <!-- Flags -->
    <line x1="60" y1="20" x2="60" y2="0" class="image" />
    <line x1="290" y1="20" x2="290" y2="0" class="image" />
    <rect x="55" y="-10" width="10" height="20" class="image" />
    <rect x="285" y="-10" width="10" height="20" class="image" />
  </g>
</svg>