<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">command</text>
  <text x="50" y="120" class="subtitle">[kəˈmænd] n. 命令，指挥；v. 命令，指挥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (加强) + mand (命令)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位将军站在高台上，"加强命令(com-mand)"
    <tspan x="50" dy="25">士兵们整齐划一地执行命令，这就是指挥(command)的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The general commanded his troops to advance.
  </text>
  <text x="50" y="310" class="content">
    将军命令他的部队前进。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- General on a platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="150" y="20" width="50" height="100" class="image" />
    <circle cx="175" cy="140" r="20" class="image" />
    <!-- Soldiers -->
    <line x1="50" y1="180" x2="100" y2="180" class="image" />
    <line x1="50" y1="180" x2="50" y2="200" class="image" />
    <line x1="100" y1="180" x2="100" y2="200" class="image" />
    <line x1="75" y1="200" x2="75" y2="220" class="image" />
    <line x1="75" y1="220" x2="50" y2="240" class="image" />
    <line x1="75" y1="220" x2="100" y2="240" class="image" />
    <!-- Command -->
    <line x1="175" y1="160" x2="175" y2="200" class="image" />
    <line x1="175" y1="180" x2="150" y2="180" class="image" />
    <line x1="175" y1="180" x2="200" y2="180" class="image" />
  </g>
</svg>