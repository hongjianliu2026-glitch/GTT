<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shyness</text>
  <text x="50" y="120" class="subtitle">[ˈʃaɪnəs] n. 害羞，羞怯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shy (害羞) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小女孩在人群中，"害羞地(shy)"
    <tspan x="50" dy="25">低下头，脸颊泛红，这就是她的羞怯(shyness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her shyness made it hard for her to speak in public.
  </text>
  <text x="50" y="310" class="content">
    她的害羞使她在公共场合说话变得困难。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Girl -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="200" class="image" />
    <line x1="50" y1="150" x2="70" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Blushing cheeks -->
    <circle cx="35" cy="40" r="10" fill="#FF6961" />
    <circle cx="65" cy="40" r="10" fill="#FF6961" />
    <!-- Downward gaze -->
    <line x1="50" y1="60" x2="50" y2="80" class="image" />
  </g>
</svg>