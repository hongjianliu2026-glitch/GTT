<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F4F4; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #888888; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arid</text>
  <text x="50" y="120" class="subtitle">[ˈærɪd] adj. 干旱的，贫瘠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arid (来自拉丁语 aridus，意为“干燥的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片干旱的沙漠，"干燥(arid)"
    <tspan x="50" dy="25">的土地上几乎没有植被，只有几棵枯萎的树。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The arid region receives very little rainfall.
  </text>
  <text x="50" y="310" class="content">
    这片干旱地区几乎不下雨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert landscape -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" fill="#FFD700" />
    <!-- Sand dunes -->
    <path d="M50,180 Q100,100 150,180 T250,180" class="image" fill="#F4A460" />
    <path d="M100,180 Q150,120 200,180 T300,180" class="image" fill="#F4A460" />
    <!-- Dead tree -->
    <line x1="175" y1="100" x2="175" y2="160" class="image" />
    <line x1="175" y1="120" x2="160" y2="140" class="image" />
    <line x1="175" y1="120" x2="190" y2="140" class="image" />
  </g>
</svg>