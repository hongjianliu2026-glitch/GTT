<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vernacular</text>
  <text x="50" y="120" class="subtitle">[vəˈnækjələr] n. 方言，白话</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vern (春天) + -acular (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象春天(vern)到来，万物复苏，人们用最自然的语言(vernacular)
    <tspan x="50" dy="25">交流，这种语言就像春天的花朵一样自然绽放。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The play was written in the vernacular of the region.
  </text>
  <text x="50" y="310" class="content">
    这部戏剧是用该地区的方言写的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spring scene -->
    <circle cx="50" cy="100" r="30" class="image" fill="#2ECC71" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="20" class="image" fill="#F1C40F" />
    <!-- Flowers -->
    <rect x="100" y="120" width="20" height="40" class="image" fill="#E74C3C" />
    <rect x="150" y="120" width="20" height="40" class="image" fill="#E74C3C" />
    <rect x="200" y="120" width="20" height="40" class="image" fill="#E74C3C" />
    <!-- People talking -->
    <circle cx="120" cy="180" r="15" class="image" />
    <circle cx="170" cy="180" r="15" class="image" />
    <line x1="120" y1="195" x2="170" y2="195" class="image" />
    <line x1="120" y1="210" x2="170" y2="210" class="image" />
    <line x1="120" y1="225" x2="170" y2="225" class="image" />
  </g>
</svg>