<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dedicated</text>
  <text x="50" y="120" class="subtitle">[ˈdɛdɪkeɪtɪd] adj. 专注的，献身的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + dic (说) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在演讲台上，"强调地说(de-dic)"
    <tspan x="50" dy="25">出自己的承诺，表现出专注和献身的精神(dedicated)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a dedicated teacher who always puts her students first.
  </text>
  <text x="50" y="310" class="content">
    她是一位总是把学生放在首位的专注教师。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lectern -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="40" r="15" class="image" />
    <line x1="175" y1="55" x2="175" y2="100" class="image" />
    <line x1="175" y1="100" x2="150" y2="130" class="image" />
    <line x1="175" y1="100" x2="200" y2="130" class="image" />
    <line x1="175" y1="70" x2="220" y2="60" class="image" />
    <!-- Speech bubble -->
    <path d="M250,20 Q300,20 300,70 Q250,70 250,120" class="image" />
    <text x="260" y="60" class="content">I promise!</text>
  </g>
</svg>