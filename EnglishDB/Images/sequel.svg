<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sequel</text>
  <text x="50" y="120" class="subtitle">[ˈsiːkwəl] n. 续集，后续</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sequ (跟随) + -el (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一部电影的续集，"跟随(sequ)"
    <tspan x="50" dy="25">前作的故事继续发展，这就是续集(sequel)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sequel to the movie was even more popular than the original.
  </text>
  <text x="50" y="310" class="content">
    这部电影的续集比原作更受欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Movie screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Movie reel -->
    <circle cx="50" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="50" y1="100" x2="100" y2="100" class="image" />
    <line x1="50" y1="70" x2="100" y2="70" class="image" />
    <line x1="50" y1="130" x2="100" y2="130" class="image" />
    <!-- Sequel arrow -->
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,95 190,105" class="image" />
    <!-- Sequel text -->
    <text x="210" y="105" class="content">Sequel</text>
  </g>
</svg>