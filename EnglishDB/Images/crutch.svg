<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crutch</text>
  <text x="50" y="120" class="subtitle">[krʌtʃ] n. 拐杖，支撑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cru- (弯曲) + -tch (工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个受伤的人，"弯曲(cru-)"
    <tspan x="50" dy="25">身体依靠着"工具(tch)"，这个工具就是拐杖(crutch)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a crutch to help him walk after the accident.
  </text>
  <text x="50" y="310" class="content">
    事故后，他使用拐杖帮助行走。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crutch -->
    <line x1="50" y1="20" x2="50" y2="200" class="image" />
    <line x1="50" y1="20" x2="80" y2="50" class="image" />
    <line x1="80" y1="50" x2="110" y2="50" class="image" />
    <line x1="110" y1="50" x2="110" y2="80" class="image" />
    <!-- Person -->
    <circle cx="150" cy="150" r="20" class="image" />
    <line x1="150" y1="170" x2="150" y2="220" class="image" />
    <line x1="150" y1="220" x2="130" y2="250" class="image" />
    <line x1="150" y1="220" x2="170" y2="250" class="image" />
    <line x1="150" y1="190" x2="110" y2="180" class="image" />
  </g>
</svg>