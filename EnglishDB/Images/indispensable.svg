<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indispensable</text>
  <text x="50" y="120" class="subtitle">[ˌɪndɪˈspensəbl] adj. 不可或缺的，必需的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + dis- (分开) + pens (称重) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天平，"不能分开称重(in-dis-pens-able)"
    <tspan x="50" dy="25">的东西，就是不可或缺的(indispensable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Water is indispensable for life.
  </text>
  <text x="50" y="310" class="content">
    水对生命是不可或缺的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <line x1="20" y1="50" x2="35" y2="70" class="image" />
    <line x1="80" y1="50" x2="65" y2="70" class="image" />
    <!-- Weights -->
    <circle cx="35" cy="100" r="15" class="image" />
    <circle cx="65" cy="100" r="15" class="image" />
    <!-- Indispensable item -->
    <rect x="45" y="120" width="10" height="20" class="image" />
    <text x="40" y="150" class="content" text-anchor="middle">X</text>
  </g>
</svg>