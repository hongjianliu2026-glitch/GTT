<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">U-turn</text>
  <text x="50" y="120" class="subtitle">[ˈjuːtɜːrn] n. 掉头，彻底改变</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> U (形状) + turn (转向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在路上行驶，突然需要"掉头(U-turn)"，
    <tspan x="50" dy="25">它转了一个U形的弯，回到了原来的方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The driver made a sudden U-turn to avoid the accident.
  </text>
  <text x="50" y="310" class="content">
    司机突然掉头以避免事故。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <!-- Car -->
    <rect x="50" y="70" width="100" height="60" class="image" />
    <rect x="60" y="80" width="80" height="40" class="image" />
    <!-- U-turn -->
    <path d="M 150 100 Q 200 50 250 100" class="image" />
    <path d="M 250 100 Q 200 150 150 100" class="image" />
  </g>
</svg>