<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">battleground</text>
  <text x="50" y="120" class="subtitle">[ˈbætəlɡraʊnd] n. 战场，斗争场所</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> battle (战斗) + ground (地面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的"地面(ground)"上，两军对峙，
    <tspan x="50" dy="25">激烈的"战斗(battle)"正在进行，这就是战场(battleground)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The town became a battleground during the civil war.
  </text>
  <text x="50" y="310" class="content">
    这个小镇在内战期间变成了战场。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soldiers -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="70" y2="80" class="image" />
    <line x1="100" y1="50" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="80" y2="80" class="image" />
    <line x1="200" y1="50" x2="250" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="220" y2="80" class="image" />
    <line x1="250" y1="50" x2="250" y2="100" class="image" />
    <line x1="250" y1="100" x2="230" y2="80" class="image" />
    <!-- Battle -->
    <line x1="75" y1="75" x2="225" y2="75" class="image" />
    <line x1="75" y1="85" x2="225" y2="85" class="image" />
    <line x1="75" y1="95" x2="225" y2="95" class="image" />
  </g>
</svg>