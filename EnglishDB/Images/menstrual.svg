<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">menstrual</text>
  <text x="50" y="120" class="subtitle">[ˈmɛnstrʊəl] adj. 月经的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mens (月) + -ual (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个月亮女神，每个月(mens)都会带来一次"月经(menstrual)"的周期。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She experienced severe menstrual cramps.
  </text>
  <text x="50" y="310" class="content">
    她经历了严重的月经疼痛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Woman -->
    <circle cx="200" cy="100" r="20" class="image" fill="#E74C3C" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="160" y2="130" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Cycle -->
    <path d="M100,150 A50,50 0 0,1 200,150" class="image" stroke-dasharray="5,5" />
  </g>
</svg>