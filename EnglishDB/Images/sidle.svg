<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sidle</text>
  <text x="50" y="120" class="subtitle">[ˈsaɪdl] v. 侧身而行，悄悄地走</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sid (坐) + -le (表示反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在地上，然后反复地侧身移动，就像是在悄悄地走动。
    <tspan x="50" dy="25">这种动作就是sidle。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sidled up to the table and whispered the secret.
  </text>
  <text x="50" y="310" class="content">
    她悄悄地走到桌边，低声说出了秘密。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person sitting -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Sideways movement -->
    <line x1="50" y1="160" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="240" class="image" />
    <line x1="100" y1="200" x2="120" y2="240" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
  </g>
</svg>