<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sadistic</text>
  <text x="50" y="120" class="subtitle">[səˈdɪstɪk] adj. 施虐狂的，以虐待他人为乐的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sade (痛苦) + -istic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个施虐狂(sadistic)，他以制造痛苦(sade)为乐，
    <tspan x="50" dy="25">他的脸上露出邪恶的笑容，手中拿着鞭子，准备施加痛苦。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sadistic torturer enjoyed inflicting pain on his victims.
  </text>
  <text x="50" y="310" class="content">
    那个施虐的酷刑者喜欢对他的受害者施加痛苦。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Evil face -->
    <circle cx="50" cy="50" r="30" class="image" />
    <circle cx="40" cy="40" r="5" class="image" />
    <circle cx="60" cy="40" r="5" class="image" />
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <path d="M40 70 Q50 80 60 70" class="image" />

    <!-- Whip -->
    <line x1="80" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="140" y2="40" class="image" />
    <line x1="150" y1="50" x2="140" y2="60" class="image" />
    <line x1="140" y1="40" x2="130" y2="30" class="image" />
    <line x1="140" y1="60" x2="130" y2="70" class="image" />
  </g>
</svg>