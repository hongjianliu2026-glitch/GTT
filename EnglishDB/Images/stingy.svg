<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stingy</text>
  <text x="50" y="120" class="subtitle">[ˈstɪndʒi] adj. 吝啬的，小气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sting (刺) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个吝啬的人，像被"刺(sting)"了一样，
    <tspan x="50" dy="25">不愿意花钱，总是小心翼翼地保护自己的钱包。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is so stingy that he never buys lunch for his colleagues.
  </text>
  <text x="50" y="310" class="content">
    他非常吝啬，从不给同事买午餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Wallet -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Sting -->
    <line x1="75" y1="100" x2="75" y2="150" class="image" />
    <polygon points="75,150 60,180 90,180" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Hand holding wallet -->
    <line x1="200" y1="150" x2="150" y2="100" class="image" />
  </g>
</svg>