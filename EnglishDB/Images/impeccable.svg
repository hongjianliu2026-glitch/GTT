<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impeccable</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpɛkəbl] adj. 无瑕疵的，完美的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + pecc (过失) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完美无瑕的钻石，"没有任何过失(im-pecc-able)"，
    <tspan x="50" dy="25">它在阳光下闪耀，没有任何瑕疵。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her performance was impeccable, receiving a standing ovation.
  </text>
  <text x="50" y="310" class="content">
    她的表演完美无瑕，赢得了全场起立鼓掌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diamond -->
    <polygon points="175,10 225,10 250,75 225,140 175,140 150,75" class="image" />
    <!-- Sunlight -->
    <line x1="175" y1="10" x2="150" y2="50" class="image" />
    <line x1="225" y1="10" x2="250" y2="50" class="image" />
    <line x1="250" y1="75" x2="275" y2="100" class="image" />
    <line x1="225" y1="140" x2="250" y2="180" class="image" />
    <line x1="175" y1="140" x2="150" y2="180" class="image" />
    <line x1="150" y1="75" x2="125" y2="100" class="image" />
  </g>
</svg>