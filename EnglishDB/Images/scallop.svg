<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scallop</text>
  <text x="50" y="120" class="subtitle">[ˈskæləp] n. 扇贝，扇形装饰</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scal (梯子) + lop (砍)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的扇贝，它的壳像梯子(scal)一样层层叠叠，
    <tspan x="50" dy="25">而它的边缘被砍(lop)成了美丽的扇形装饰(scallop)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The chef prepared a delicious scallop dish for the guests.
  </text>
  <text x="50" y="310" class="content">
    厨师为客人们准备了一道美味的扇贝菜肴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scallop shell -->
    <path d="M 0 0 C 50 -50, 100 -50, 150 0 C 200 50, 250 50, 300 0" class="image" />
    <path d="M 0 0 C 50 50, 100 50, 150 0 C 200 -50, 250 -50, 300 0" class="image" />
    <!-- Ladder-like structure -->
    <line x1="25" y1="0" x2="25" y2="100" class="image" />
    <line x1="75" y1="0" x2="75" y2="100" class="image" />
    <line x1="125" y1="0" x2="125" y2="100" class="image" />
    <line x1="175" y1="0" x2="175" y2="100" class="image" />
    <line x1="225" y1="0" x2="225" y2="100" class="image" />
    <line x1="275" y1="0" x2="275" y2="100" class="image" />
    <!-- Cut edges -->
    <line x1="0" y1="0" x2="300" y2="0" class="image" />
    <line x1="0" y1="100" x2="300" y2="100" class="image" />
  </g>
</svg>