<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insignificant</text>
  <text x="50" y="120" class="subtitle">[ˌɪnsɪɡˈnɪfɪkənt] adj. 无关紧要的，微不足道的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + sign (标记) + -ificant (有意义的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微小的蚂蚁在巨大的地图上，"没有标记(in-sign)"
    <tspan x="50" dy="25">，因此显得微不足道(insignificant)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His contribution to the project was insignificant.
  </text>
  <text x="50" y="310" class="content">
    他对这个项目的贡献微不足道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Small ant -->
    <circle cx="50" cy="100" r="5" class="image" />
    <line x1="50" y1="105" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="40" y2="130" class="image" />
    <line x1="50" y1="120" x2="60" y2="130" class="image" />
    <line x1="50" y1="110" x2="45" y2="100" class="image" />
    <line x1="50" y1="110" x2="55" y2="100" class="image" />
  </g>
</svg>