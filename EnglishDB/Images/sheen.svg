<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sheen</text>
  <text x="50" y="120" class="subtitle">[ʃiːn] n. 光泽，光彩；v. 发光，闪耀</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sheen (来自古英语 scīn，意为“光”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块宝石在阳光下闪耀，"光(sheen)"
    <tspan x="50" dy="25">芒四射，仿佛整个世界都被它的光彩所吸引。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The diamond has a beautiful sheen.
  </text>
  <text x="50" y="310" class="content">
    这颗钻石有着美丽的光泽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diamond -->
    <polygon points="175,10 225,10 250,75 225,140 175,140 150,75" style="fill:none;stroke:#7F8C8D;stroke-width:2" />
    <!-- Sun rays -->
    <line x1="200" y1="10" x2="200" y2="50" class="image" />
    <line x1="225" y1="25" x2="250" y2="50" class="image" />
    <line x1="175" y1="25" x2="150" y2="50" class="image" />
    <line x1="200" y1="140" x2="200" y2="180" class="image" />
    <line x1="225" y1="155" x2="250" y2="180" class="image" />
    <line x1="175" y1="155" x2="150" y2="180" class="image" />
  </g>
</svg>