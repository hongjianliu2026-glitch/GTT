<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">check</text>
  <text x="50" y="120" class="subtitle">[tʃek] n. 检查，支票；v. 检查，核对</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chec (来自古法语 eschec，意为“棋盘上的方格”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个棋盘上的方格(chec)，棋手在每一步都要仔细检查(check)，
    <tspan x="50" dy="25">确保没有错误，就像我们在生活中检查细节一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Please check your email for the confirmation.
  </text>
  <text x="50" y="310" class="content">
    请检查你的电子邮件以获取确认信息。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chessboard -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="100" class="image" />
    <rect x="150" y="20" width="100" height="100" class="image" />
    <rect x="250" y="20" width="100" height="100" class="image" />
    <rect x="50" y="120" width="100" height="100" class="image" />
    <rect x="150" y="120" width="100" height="100" class="image" />
    <rect x="250" y="120" width="100" height="100" class="image" />
    <!-- Chess pieces -->
    <circle cx="100" cy="70" r="15" class="image" />
    <circle cx="200" cy="70" r="15" class="image" />
    <circle cx="300" cy="70" r="15" class="image" />
    <circle cx="100" cy="170" r="15" class="image" />
    <circle cx="200" cy="170" r="15" class="image" />
    <circle cx="300" cy="170" r="15" class="image" />
    <!-- Check mark -->
    <line x1="50" y1="170" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="150" y2="120" class="image" />
  </g>
</svg>