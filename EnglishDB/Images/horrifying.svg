<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">horrifying</text>
  <text x="50" y="120" class="subtitle">[ˈhɒrɪfaɪɪŋ] adj. 令人恐惧的，可怕的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> horr (恐惧) + -ify (使) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个恐怖电影场景，"恐惧(horr)"
    <tspan x="50" dy="25">的画面让人心跳加速，这就是"令人恐惧的(horrifying)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sight of the accident was horrifying.
  </text>
  <text x="50" y="310" class="content">
    事故现场的景象令人恐惧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Horror movie scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Ghost -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Blood splatter -->
    <circle cx="150" cy="100" r="10" class="image" fill="#B03A2E" />
    <circle cx="170" cy="120" r="10" class="image" fill="#B03A2E" />
    <circle cx="190" cy="140" r="10" class="image" fill="#B03A2E" />
    <circle cx="210" cy="160" r="10" class="image" fill="#B03A2E" />
    <circle cx="230" cy="180" r="10" class="image" fill="#B03A2E" />
  </g>
</svg>