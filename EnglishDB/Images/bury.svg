<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bury</text>
  <text x="50" y="120" class="subtitle">[ˈbɛri] v. 埋葬，隐藏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bur (土堆) + -y (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在土堆(bur)前，用力将某物埋入土中，
    <tspan x="50" dy="25">这个动作就是"埋葬(bury)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to bury the treasure in the backyard.
  </text>
  <text x="50" y="310" class="content">
    他们决定把宝藏埋在后院。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Dirt mound -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Person burying -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <!-- Object being buried -->
    <rect x="100" y="100" width="50" height="50" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="100" x2="100" y2="150" class="image" />
  </g>
</svg>