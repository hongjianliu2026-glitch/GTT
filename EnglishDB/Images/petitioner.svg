<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">petitioner</text>
  <text x="50" y="120" class="subtitle">[pəˈtɪʃənər] n. 请愿者，申请人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pet (寻求) + ition (行为) + er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个请愿者手持一份"寻求(pet)"
    <tspan x="50" dy="25">帮助的文件，站在法院门口，</tspan>
    <tspan x="50" dy="25">期待得到回应。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The petitioner filed a formal request for a hearing.
  </text>
  <text x="50" y="310" class="content">
    请愿者提交了一份正式的听证请求。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Court building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Petitioner -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Document -->
    <rect x="100" y="80" width="150" height="100" class="image" />
    <line x1="110" y1="90" x2="240" y2="90" class="image" />
    <line x1="110" y1="110" x2="230" y2="110" class="image" />
    <line x1="110" y1="130" x2="220" y2="130" class="image" />
    <line x1="110" y1="150" x2="210" y2="150" class="image" />
  </g>
</svg>