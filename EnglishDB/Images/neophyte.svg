<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neophyte</text>
  <text x="50" y="120" class="subtitle">[ˈniːəˌfaɪt] n. 新手，初学者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neo- (新) + phyte (植物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个新手就像一株"新植物(neo-phyte)"，
    <tspan x="50" dy="25">刚刚开始生长，需要时间和经验来成长。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> As a neophyte in the field, she was eager to learn.
  </text>
  <text x="50" y="310" class="content">
    作为一个领域的新手，她渴望学习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seed -->
    <circle cx="50" cy="100" r="20" class="image" />
    <!-- Sprout -->
    <line x1="50" y1="80" x2="50" y2="40" class="image" />
    <line x1="50" y1="40" x2="40" y2="20" class="image" />
    <line x1="50" y1="40" x2="60" y2="20" class="image" />
    <line x1="50" y1="40" x2="30" y2="50" class="image" />
    <line x1="50" y1="40" x2="70" y2="50" class="image" />
    <!-- Ground -->
    <rect x="0" y="120" width="100" height="10" class="image" />
  </g>
</svg>