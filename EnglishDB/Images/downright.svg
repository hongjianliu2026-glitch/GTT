<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">downright</text>
  <text x="50" y="120" class="subtitle">[ˈdaʊnraɪt] adj. 完全的，彻底的；adv. 径直地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> down (向下) + right (正确的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人从高处"径直地(downright)"跳下，
    <tspan x="50" dy="25">完全不顾一切，这种行为就是"彻底的(downright)"勇敢。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was downright rude to his boss.
  </text>
  <text x="50" y="310" class="content">
    他对老板非常无礼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- High point -->
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <!-- Person jumping -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <!-- Ground -->
    <line x1="0" y1="250" x2="100" y2="250" class="image" />
  </g>
</svg>