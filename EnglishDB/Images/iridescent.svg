<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .rainbow { fill: url(#rainbow-gradient); }
    </style>
    <linearGradient id="rainbow-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:red;stop-opacity:1" />
      <stop offset="14%" style="stop-color:orange;stop-opacity:1" />
      <stop offset="28%" style="stop-color:yellow;stop-opacity:1" />
      <stop offset="42%" style="stop-color:green;stop-opacity:1" />
      <stop offset="56%" style="stop-color:blue;stop-opacity:1" />
      <stop offset="70%" style="stop-color:indigo;stop-opacity:1" />
      <stop offset="84%" style="stop-color:violet;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">iridescent</text>
  <text x="50" y="120" class="subtitle">[ˌɪrɪˈdɛsnt] adj. 彩虹色的，闪光的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> iris (彩虹) + -escent (形容词后缀，表示“有...性质的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只蝴蝶在阳光下飞舞，它的翅膀闪烁着
    <tspan x="50" dy="25">七彩光芒，就像彩虹一样，这就是iridescent。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The iridescent wings of the butterfly caught everyone's eye.
  </text>
  <text x="50" y="310" class="content">
    蝴蝶那彩虹般的翅膀吸引了所有人的目光。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Butterfly body -->
    <circle cx="100" cy="100" r="20" class="image" />
    <!-- Butterfly wings -->
    <ellipse cx="100" cy="70" rx="50" ry="30" class="rainbow" />
    <ellipse cx="100" cy="130" rx="50" ry="30" class="rainbow" />
    <ellipse cx="50" cy="100" rx="50" ry="30" class="rainbow" />
    <ellipse cx="150" cy="100" rx="50" ry="30" class="rainbow" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" fill="yellow" />
    <line x1="250" y1="20" x2="250" y2="0" class="image" />
    <line x1="270" y1="30" x2="290" y2="10" class="image" />
    <line x1="280" y1="50" x2="300" y2="50" class="image" />
    <line x1="270" y1="70" x2="290" y2="90" class="image" />
    <line x1="250" y1="80" x2="250" y2="100" class="image" />
    <line x1="230" y1="70" x2="210" y2="90" class="image" />
    <line x1="220" y1="50" x2="200" y2="50" class="image" />
    <line x1="230" y1="30" x2="210" y2="10" class="image" />
  </g>
</svg>