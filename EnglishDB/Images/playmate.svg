<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">playmate</text>
  <text x="50" y="120" class="subtitle">[ˈpleɪmeɪt] n. 玩伴，游戏伙伴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> play (玩耍) + mate (伙伴)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个孩子在公园里，"一起玩耍(play)"
    <tspan x="50" dy="25">的伙伴(mate)，他们就是玩伴(playmate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She found a new playmate at the playground.
  </text>
  <text x="50" y="310" class="content">
    她在操场上找到了一个新玩伴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Park background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Child 1 -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Child 2 -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="190" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />
    <!-- Play symbol -->
    <circle cx="100" cy="50" r="10" class="image" />
    <line x1="100" y1="60" x2="100" y2="100" class="image" />
    <line x1="100" y1="80" x2="80" y2="60" class="image" />
    <line x1="100" y1="80" x2="120" y2="60" class="image" />
  </g>
</svg>