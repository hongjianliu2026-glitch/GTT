<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF9E6; }
      .title { font: bold 48px sans-serif; fill: #FFA500; }
      .subtitle { font: italic 24px serif; fill: #8B4513; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">yummy</text>
  <text x="50" y="120" class="subtitle">[ˈjʌmi] adj. 美味的，好吃的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> yum (美味) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子吃到一块巧克力蛋糕，脸上露出满足的笑容，
    <tspan x="50" dy="25">嘴里不停地说着"yummy, yummy"，这就是美味的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cake tastes so yummy that everyone wants a second piece.
  </text>
  <text x="50" y="310" class="content">
    蛋糕太好吃了，每个人都想再来一块。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <circle cx="100" cy="100" r="50" fill="#FFD700" />
    <rect x="50" y="150" width="100" height="20" fill="#CD853F" />
    <!-- Face -->
    <circle cx="200" cy="100" r="30" fill="#FFE4B5" />
    <circle cx="190" cy="90" r="5" fill="#000" />
    <circle cx="210" cy="90" r="5" fill="#000" />
    <path d="M190 110 Q200 120 210 110" fill="none" stroke="#000" stroke-width="2" />
    <!-- Happy expression -->
    <path d="M180 130 Q200 140 220 130" fill="none" stroke="#FF6347" stroke-width="2" />
  </g>
</svg>