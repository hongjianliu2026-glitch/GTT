<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perceptible</text>
  <text x="50" y="120" class="subtitle">[pəˈsɛptəbl] adj. 可感知的，可察觉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (完全) + cept (拿) + -ible (可...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的放大镜，"完全拿住(per-cept)"
    <tspan x="50" dy="25">微小的细节，这些细节变得可感知(perceptible)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The difference in color was barely perceptible to the naked eye.
  </text>
  <text x="50" y="310" class="content">
    颜色的差异用肉眼几乎察觉不到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnifying glass -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="200" y2="250" class="image" />
    <!-- Detail -->
    <circle cx="250" cy="200" r="10" class="image" />
    <text x="240" y="220" class="content" fill="#7F8C8D">细节</text>
  </g>
</svg>