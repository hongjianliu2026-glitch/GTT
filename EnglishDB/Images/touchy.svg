<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">touchy</text>
  <text x="50" y="120" class="subtitle">[ˈtʌtʃi] adj. 易怒的，敏感的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> touch (接触) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人像"易碎的玻璃(touch)"一样，
    <tspan x="50" dy="25">轻轻一碰(touch)就会生气(y)，这就是touchy。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is very touchy about her new haircut.
  </text>
  <text x="50" y="310" class="content">
    她对她的新发型非常敏感。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Glass figure -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="50" x2="130" y2="50" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <line x1="20" y1="110" x2="130" y2="110" class="image" />
    <line x1="20" y1="140" x2="130" y2="140" class="image" />
    <line x1="20" y1="170" x2="130" y2="170" class="image" />
    <!-- Angry face -->
    <circle cx="75" cy="100" r="30" class="image" />
    <line x1="60" y1="90" x2="90" y2="90" class="image" />
    <line x1="60" y1="110" x2="90" y2="110" class="image" />
    <line x1="75" y1="120" x2="75" y2="140" class="image" />
    <line x1="65" y1="130" x2="85" y2="130" class="image" />
  </g>
</svg>