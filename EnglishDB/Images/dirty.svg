<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dirty</text>
  <text x="50" y="120" class="subtitle">[ˈdɜːrti] adj. 脏的，污秽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dirt (泥土) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在泥地里打滚，全身沾满了"泥土(dirt)"，
    <tspan x="50" dy="25">变得"脏(dirty)"兮兮的。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The child came back from the playground with dirty clothes.
  </text>
  <text x="50" y="310" class="content">
    孩子从操场回来时衣服很脏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dirt ground -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#8B4513" />
    <!-- Person rolling in dirt -->
    <circle cx="100" cy="100" r="30" class="image" fill="#FFD700" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="170" class="image" />
    <line x1="100" y1="150" x2="130" y2="170" class="image" />
    <line x1="100" y1="180" x2="70" y2="200" class="image" />
    <line x1="100" y1="180" x2="130" y2="200" class="image" />
    <!-- Dirt splashes -->
    <circle cx="150" cy="120" r="10" class="image" fill="#8B4513" />
    <circle cx="170" cy="140" r="10" class="image" fill="#8B4513" />
    <circle cx="190" cy="110" r="10" class="image" fill="#8B4513" />
  </g>
</svg>