<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">replete</text>
  <text x="50" y="120" class="subtitle">[rɪˈpliːt] adj. 充满的，饱满的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + ple (充满)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的碗，"再次充满(re-plete)"
    <tspan x="50" dy="25">了食物，以至于溢出来了，这就是replete的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The table was replete with delicious food.
  </text>
  <text x="50" y="310" class="content">
    桌子上摆满了美味的食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bowl -->
    <ellipse cx="175" cy="100" rx="150" ry="75" class="image" />
    <!-- Food -->
    <circle cx="100" cy="70" r="20" class="image" />
    <circle cx="150" cy="80" r="25" class="image" />
    <circle cx="200" cy="60" r="30" class="image" />
    <circle cx="250" cy="75" r="25" class="image" />
    <!-- Overflowing food -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
  </g>
</svg>