<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hesitantly</text>
  <text x="50" y="120" class="subtitle">[ˈhɛzɪtəntli] adv. 犹豫地，迟疑地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hesi- (犹豫) + -tantly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"犹豫不决(hesi-tantly)"，
    <tspan x="50" dy="25">每一步都小心翼翼，生怕掉下去。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She spoke hesitantly, unsure of what to say.
  </text>
  <text x="50" y="310" class="content">
    她说话时犹豫不决，不确定该说什么。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="35" y2="210" class="image" />
    <line x1="50" y1="190" x2="65" y2="210" class="image" />
    <line x1="50" y1="175" x2="70" y2="165" class="image" />
    <!-- Steps -->
    <line x1="70" y1="150" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="130" y2="150" class="image" />
    <line x1="130" y1="150" x2="160" y2="150" class="image" />
    <line x1="160" y1="150" x2="190" y2="150" class="image" />
    <!-- Question marks -->
    <text x="210" y="160" class="image" font-size="30">?</text>
    <text x="230" y="160" class="image" font-size="30">?</text>
    <text x="250" y="160" class="image" font-size="30">?</text>
  </g>
</svg>