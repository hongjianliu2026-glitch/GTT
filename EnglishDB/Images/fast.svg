<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fast</text>
  <text x="50" y="120" class="subtitle">[fæst] adj. 快的，迅速的；adv. 快速地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fast (源自中古英语，意为“牢固的，稳定的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猎豹在草原上飞奔，"牢固地(fast)"
    <tspan x="50" dy="25">抓住地面，迅速地(fast)奔跑，速度快得让人惊叹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He ran so fast that he left everyone behind.
  </text>
  <text x="50" y="310" class="content">
    他跑得如此之快，以至于把所有人都甩在了后面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Cheetah -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="190" x2="80" y2="180" class="image" />
    <line x1="50" y1="190" x2="20" y2="180" class="image" />
    <!-- Speed lines -->
    <line x1="100" y1="150" x2="150" y2="150" class="image" />
    <line x1="100" y1="160" x2="140" y2="160" class="image" />
    <line x1="100" y1="170" x2="130" y2="170" class="image" />
  </g>
</svg>