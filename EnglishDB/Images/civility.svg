<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">civility</text>
  <text x="50" y="120" class="subtitle">[sɪˈvɪlɪti] n. 礼貌，礼仪</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> civ (公民) + -ility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个公民(civ)在公共场合，
    <tspan x="50" dy="25">以优雅的姿态(ility)展现礼貌(civility)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hostess greeted her guests with great civility.
  </text>
  <text x="50" y="310" class="content">
    女主人非常礼貌地迎接了她的客人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Citizen -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Greeting -->
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="100" y2="140" class="image" />
    <line x1="100" y1="140" x2="80" y2="140" class="image" />
    <!-- Smile -->
    <path d="M50 110 Q55 105, 60 110" class="image" />
  </g>
</svg>