<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bodice</text>
  <text x="50" y="120" class="subtitle">[ˈbɒdɪs] n. 紧身上衣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bod- (身体) + -ice (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个优雅的女士，穿着一件紧身上衣(bodice)，
    <tspan x="50" dy="25">这件上衣紧紧包裹着她的身体(bod-)，展现出她的曲线美。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a beautiful bodice to the ball.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件漂亮的紧身上衣去参加舞会。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Bodice outline -->
    <rect x="50" y="50" width="200" height="250" class="image" />
    <!-- Shoulder straps -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="50" x2="150" y2="0" class="image" />
    <!-- Waistline -->
    <line x1="50" y1="150" x2="250" y2="150" class="image" />
    <!-- Bust line -->
    <line x1="50" y1="100" x2="250" y2="100" class="image" />
    <!-- Hemline -->
    <line x1="50" y1="300" x2="250" y2="300" class="image" />
  </g>
</svg>