<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scheduled</text>
  <text x="50" y="120" class="subtitle">[ˈʃɛdjuːld] adj. 预定的，安排好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sched (时间) + -ule (小) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时间表上，"小时间(sched-ule)"被精确地安排好，
    <tspan x="50" dy="25">每个时间段都被标记为"预定的(scheduled)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meeting is scheduled for 3 PM.
  </text>
  <text x="50" y="310" class="content">
    会议定于下午3点举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="100" x2="100" y2="50" class="image" />
    <line x1="100" y1="100" x2="130" y2="100" class="image" />
    <!-- Time table -->
    <rect x="160" y="50" width="200" height="100" class="image" />
    <line x1="170" y1="70" x2="350" y2="70" class="image" />
    <line x1="170" y1="90" x2="350" y2="90" class="image" />
    <line x1="170" y1="110" x2="350" y2="110" class="image" />
    <line x1="170" y1="130" x2="350" y2="130" class="image" />
    <!-- Scheduled event -->
    <rect x="180" y="80" width="50" height="20" class="image" />
    <text x="190" y="95" class="content">3 PM</text>
  </g>
</svg>