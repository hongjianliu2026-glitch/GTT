<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fury</text>
  <text x="50" y="120" class="subtitle">[ˈfjʊəri] n. 狂怒，暴怒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fur- (火) + -y (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"火焰(fur-)"包围，
    <tspan x="50" dy="25">愤怒的情绪如同烈火般燃烧，这就是狂怒(fury)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His fury was so intense that he broke the table.
  </text>
  <text x="50" y="310" class="content">
    他的狂怒如此强烈，以至于他砸碎了桌子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <circle cx="50" cy="50" r="30" class="image" fill="#FF6347" />
    <circle cx="80" cy="70" r="25" class="image" fill="#FF4500" />
    <circle cx="110" cy="50" r="30" class="image" fill="#FF6347" />
    <!-- Angry face -->
    <circle cx="150" cy="100" r="40" class="image" fill="#FFD700" />
    <line x1="135" y1="90" x2="145" y2="90" class="image" />
    <line x1="155" y1="90" x2="165" y2="90" class="image" />
    <line x1="140" y1="110" x2="160" y2="110" class="image" />
    <line x1="150" y1="120" x2="150" y2="130" class="image" />
  </g>
</svg>