<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">capitulate</text>
  <text x="50" y="120" class="subtitle">[kəˈpɪtʃəleɪt] v. 投降，屈服</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> caput (头) + -ulate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个士兵在战场上，"低下头(caput)"
    <tspan x="50" dy="25">表示投降(capitulate)，放弃抵抗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The enemy finally capitulated after a long siege.
  </text>
  <text x="50" y="310" class="content">
    经过长时间的围困，敌人最终投降了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Head bowed -->
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="140" class="image" />
    <line x1="50" y1="150" x2="70" y2="140" class="image" />
    <!-- White flag -->
    <line x1="50" y1="100" x2="50" y2="50" class="image" />
    <line x1="50" y1="50" x2="30" y2="60" class="image" />
    <line x1="50" y1="50" x2="70" y2="60" class="image" />
    <line x1="50" y1="50" x2="40" y2="40" class="image" />
    <line x1="50" y1="50" x2="60" y2="40" class="image" />
  </g>
</svg>