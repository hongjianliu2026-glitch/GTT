<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blissful</text>
  <text x="50" y="120" class="subtitle">[ˈblɪsfl] adj. 极乐的，幸福的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bliss (极乐) + -ful (充满...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在一片金色的麦田中，阳光洒在身上，
    <tspan x="50" dy="25">周围是盛开的花朵，这种极致的幸福感就是"blissful"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt blissful after the vacation.
  </text>
  <text x="50" y="310" class="content">
    度假后她感到非常幸福。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Field -->
    <rect x="0" y="150" width="350" height="150" fill="#D4AC0D" />
    <!-- Flowers -->
    <circle cx="50" cy="180" r="10" fill="#27AE60" />
    <circle cx="80" cy="170" r="10" fill="#27AE60" />
    <circle cx="110" cy="190" r="10" fill="#27AE60" />
    <circle cx="140" cy="160" r="10" fill="#27AE60" />
    <!-- Person -->
    <circle cx="200" cy="200" r="20" fill="#E74C3C" />
    <line x1="200" y1="220" x2="200" y2="280" class="image" />
    <line x1="200" y1="280" x2="180" y2="320" class="image" />
    <line x1="200" y1="280" x2="220" y2="320" class="image" />
    <line x1="200" y1="250" x2="170" y2="240" class="image" />
    <line x1="200" y1="250" x2="230" y2="240" class="image" />
  </g>
</svg>