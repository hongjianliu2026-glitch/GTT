<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">competitor</text>
  <text x="50" y="120" class="subtitle">[kəmˈpetɪtər] n. 竞争者，对手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + pet (追求) + -itor (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个运动员在赛场上，"一起追求(com-pet)"
    <tspan x="50" dy="25">胜利，他们就是竞争对手(competitor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has many strong competitors in the market.
  </text>
  <text x="50" y="310" class="content">
    这家公司在市场上有很多强大的竞争对手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Track -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Athletes -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <!-- Running lines -->
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="170" y1="100" x2="230" y2="100" class="image" />
    <!-- Finish line -->
    <line x1="300" y1="50" x2="300" y2="150" class="image" />
    <text x="310" y="100" class="content" text-anchor="start">Finish</text>
  </g>
</svg>