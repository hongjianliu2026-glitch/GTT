<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lipstick</text>
  <text x="50" y="120" class="subtitle">[ˈlɪpstɪk] n. 口红</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lip (嘴唇) + stick (棒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女人拿着一根"棒(stick)"，轻轻地在她的"嘴唇(lip)"上涂抹，
    <tspan x="50" dy="25">瞬间她的嘴唇变得鲜艳动人，这就是口红(lipstick)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She applied a new shade of lipstick before going out.
  </text>
  <text x="50" y="310" class="content">
    她出门前涂上了一种新色号的口红。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lipstick tube -->
    <rect x="0" y="0" width="100" height="300" class="image" />
    <rect x="20" y="20" width="60" height="280" class="image" />
    <!-- Lipstick color -->
    <rect x="25" y="25" width="50" height="270" fill="#E74C3C" />
    <!-- Lips -->
    <path d="M150,150 Q200,100 250,150 Q200,200 150,150" class="image" />
    <path d="M150,150 Q200,100 250,150 Q200,200 150,150" class="image" transform="translate(0,50)" />
  </g>
</svg>