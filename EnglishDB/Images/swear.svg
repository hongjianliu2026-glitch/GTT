<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swear</text>
  <text x="50" y="120" class="subtitle">[swɛr] v. 发誓，咒骂</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sw- (表示强烈的动作) + ear (与“誓言”相关)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人举起手，"强烈地(sw-)"
    <tspan x="50" dy="25">发誓(ear)，表达他的决心或愤怒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He swore to tell the truth in court.
  </text>
  <text x="50" y="310" class="content">
    他在法庭上发誓要说真话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person raising hand -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="100" y2="80" class="image" />
    <!-- Swear gesture -->
    <line x1="50" y1="70" x2="100" y2="70" class="image" />
    <line x1="100" y1="70" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="120" y2="100" class="image" />
  </g>
</svg>