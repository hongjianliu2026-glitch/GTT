<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tirade</text>
  <text x="50" y="120" class="subtitle">[taɪˈreɪd] n. 长篇激烈的演说，长篇指责</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tir (拉) + ade (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在讲台上，"用力拉(tir)"
    <tspan x="50" dy="25">着嗓子发表一篇长篇激烈的演说(tirade)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The politician delivered a tirade against corruption.
  </text>
  <text x="50" y="310" class="content">
    这位政治家发表了一篇反对腐败的长篇演说。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Podium -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker -->
    <circle cx="175" cy="50" r="20" class="image" />
    <line x1="175" y1="70" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="100" x2="120" y2="90" class="image" />
    <line x1="175" y1="100" x2="230" y2="90" class="image" />
    <!-- Speech bubbles -->
    <path d="M200,30 Q250,30 250,60 Q200,60 200,30 Z" class="image" />
    <path d="M220,40 Q270,40 270,70 Q220,70 220,40 Z" class="image" />
    <path d="M240,50 Q290,50 290,80 Q240,80 240,50 Z" class="image" />
  </g>
</svg>