<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hut</text>
  <text x="50" y="120" class="subtitle">[hʌt] n. 小屋，棚屋</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "hutte"，意为小屋
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个简陋的小屋(hut)，
    <tspan x="50" dy="25">屋顶倾斜，墙壁由木板拼接而成，</tspan>
    <tspan x="50" dy="25">里面住着一位隐士，过着简单的生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They built a hut in the woods for camping.
  </text>
  <text x="50" y="310" class="content">
    他们在树林里建了一个小屋用于露营。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hut -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <polygon points="0,0 200,0 150,50 50,50" class="image" />
    <!-- Door -->
    <rect x="80" y="100" width="40" height="50" class="image" />
    <!-- Window -->
    <rect x="150" y="50" width="30" height="30" class="image" />
  </g>
</svg>