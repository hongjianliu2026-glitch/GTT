<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crater</text>
  <text x="50" y="120" class="subtitle">[ˈkreɪtər] n. 火山口，弹坑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cata- (向下) + er (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗巨大的陨石从天而降，"向下(cata-)"
    <tspan x="50" dy="25">砸出一个深坑，这个坑就是"地方(er)"，也就是火山口(crater)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The meteorite left a large crater on the surface of the moon.
  </text>
  <text x="50" y="310" class="content">
    陨石在月球表面留下了一个巨大的弹坑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crater -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Meteorite -->
    <circle cx="175" cy="20" r="20" class="image" />
    <line x1="175" y1="40" x2="175" y2="80" class="image" />
    <!-- Smoke -->
    <path d="M175,40 Q150,60 175,80 Q200,60 175,40" class="image" />
  </g>
</svg>