<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">forget</text>
  <text x="50" y="120" class="subtitle">[fərˈɡet] v. 忘记，遗忘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> for- (离开) + get (得到)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在寻找钥匙，"离开(for-)"
    <tspan x="50" dy="25">却"得不到(get)"，因为他忘记了钥匙放在哪里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I always forget where I put my keys.
  </text>
  <text x="50" y="310" class="content">
    我总是忘记我把钥匙放在哪里了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person looking for keys -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Keys -->
    <rect x="100" y="80" width="30" height="20" class="image" />
    <line x1="115" y1="80" x2="115" y2="60" class="image" />
    <line x1="125" y1="80" x2="125" y2="60" class="image" />
    <line x1="135" y1="80" x2="135" y2="60" class="image" />
    <!-- Question mark -->
    <text x="150" y="100" class="image" font-size="48">?</text>
  </g>
</svg>