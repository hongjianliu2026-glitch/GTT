<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pronoun</text>
  <text x="50" y="120" class="subtitle">[ˈproʊnaʊn] n. 代词</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (代替) + noun (名词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师用"代替(pro-)"的咒语，将一个名词(noun)
    <tspan x="50" dy="25">变成了一个代词(pronoun)，这样说话时就不用重复提到那个名词了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> "He" is a pronoun that replaces "John".
  </text>
  <text x="50" y="310" class="content">
    "He"是一个代词，代替了"John"。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magic wand -->
    <line x1="0" y1="0" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="120" y2="80" class="image" />
    <!-- Noun -->
    <text x="150" y="100" class="content">noun</text>
    <!-- Transformation -->
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <!-- Pronoun -->
    <text x="350" y="100" class="content">pronoun</text>
  </g>
</svg>