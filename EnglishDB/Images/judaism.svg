<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #641E16; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Judaism</text>
  <text x="50" y="120" class="subtitle">[ˈdʒuːdeɪɪzəm] n. 犹太教</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Judea (古犹太国) + -ism (表示宗教或信仰)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的犹太国(Judea)，那里的人们信仰着一种宗教，
    <tspan x="50" dy="25">这种宗教就是犹太教(Judaism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He practices Judaism and observes all the religious holidays.
  </text>
  <text x="50" y="310" class="content">
    他信奉犹太教，并遵守所有的宗教节日。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star of David -->
    <polygon points="100,20 130,100 200,100 140,140 160,220 100,180 40,220 60,140 0,100 70,100" class="image" />
    <!-- Menorah -->
    <rect x="220" y="20" width="20" height="200" class="image" />
    <rect x="250" y="40" width="20" height="180" class="image" />
    <rect x="280" y="60" width="20" height="160" class="image" />
    <rect x="310" y="80" width="20" height="140" class="image" />
    <rect x="340" y="100" width="20" height="120" class="image" />
    <rect x="370" y="120" width="20" height="100" class="image" />
    <rect x="400" y="140" width="20" height="80" class="image" />
  </g>
</svg>