<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">separating</text>
  <text x="50" y="120" class="subtitle">[ˈsepəreɪtɪŋ] v. 分离，分开</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> se- (分开) + par (准备) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人原本在一起，突然被一道闪电"分开(se-par)"，
    <tspan x="50" dy="25">他们各自"准备(par)"面对新的生活，这就是分离(separating)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher asked the students to separate into groups.
  </text>
  <text x="50" y="310" class="content">
    老师让学生们分成小组。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <!-- Lightning bolt -->
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="150" y1="50" x2="130" y2="70" class="image" />
    <line x1="150" y1="50" x2="170" y2="70" class="image" />
    <line x1="150" y1="150" x2="130" y2="130" class="image" />
    <line x1="150" y1="150" x2="170" y2="130" class="image" />
    <!-- Separating lines -->
    <line x1="150" y1="100" x2="350" y2="100" class="image" />
  </g>
</svg>