<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">payback</text>
  <text x="50" y="120" class="subtitle">[ˈpeɪbæk] n. 报复，回报</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pay (支付) + back (回来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被欺负后，"支付(pay)"
    <tspan x="50" dy="25">了痛苦，然后"回来(back)"</tspan>
    <tspan x="50" dy="25">报复，这就是payback。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He vowed to exact payback for the betrayal.
  </text>
  <text x="50" y="310" class="content">
    他发誓要为背叛进行报复。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person being bullied -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />

    <!-- Bully -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="200" class="image" />
    <line x1="200" y1="160" x2="220" y2="200" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />

    <!-- Arrow of payback -->
    <line x1="100" y1="150" x2="180" y2="150" class="image" />
    <polygon points="180,150 170,145 170,155" class="image" />
  </g>
</svg>