<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interstellar</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈstɛlər] adj. 星际的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + stellar (星的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘宇宙飞船在星际之间穿梭，"在星星之间(inter-stellar)"
    <tspan x="50" dy="25">航行，这就是星际(interstellar)的旅程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie "Interstellar" explores the concept of interstellar travel.
  </text>
  <text x="50" y="310" class="content">
    电影《星际穿越》探讨了星际旅行的概念。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spaceship -->
    <polygon points="0,0 50,0 75,25 50,50 0,50" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="25" r="5" class="image" />
    <circle cx="150" cy="50" r="5" class="image" />
    <circle cx="200" cy="75" r="5" class="image" />
    <circle cx="250" cy="100" r="5" class="image" />
    <circle cx="300" cy="125" r="5" class="image" />
    <!-- Path -->
    <path d="M 0,25 Q 150,100 300,125" class="image" />
  </g>
</svg>