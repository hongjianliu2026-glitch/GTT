<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grilled</text>
  <text x="50" y="120" class="subtitle">[ɡrɪld] adj. 烤的，炙烤的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> grill (烤架)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块肉在烤架上"炙烤(grill)"，发出滋滋的声音，
    <tspan x="50" dy="25">散发出诱人的香气，这就是"烤的(grilled)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We had grilled chicken for dinner.
  </text>
  <text x="50" y="310" class="content">
    我们晚餐吃了烤鸡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grill -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Meat on the grill -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Grill marks -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Smoke -->
    <circle cx="300" cy="30" r="15" class="image" />
    <circle cx="320" cy="40" r="15" class="image" />
    <circle cx="340" cy="50" r="15" class="image" />
  </g>
</svg>