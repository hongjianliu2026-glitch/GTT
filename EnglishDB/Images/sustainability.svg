<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sustainability</text>
  <text x="50" y="120" class="subtitle">[səˌsteɪnəˈbɪləti] n. 可持续性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sus- (在下面) + tain (保持) + -ability (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一棵大树，"在下面保持(sus-tain)"
    <tspan x="50" dy="25">着土壤，使其能够持续生长，这就是可持续性(sustainability)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company focuses on sustainability in its business practices.
  </text>
  <text x="50" y="310" class="content">
    该公司在其业务实践中注重可持续性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree -->
    <line x1="100" y1="0" x2="100" y2="200" class="image" />
    <circle cx="100" cy="50" r="30" class="image" />
    <line x1="100" y1="80" x2="70" y2="120" class="image" />
    <line x1="100" y1="80" x2="130" y2="120" class="image" />
    <line x1="100" y1="120" x2="70" y2="160" class="image" />
    <line x1="100" y1="120" x2="130" y2="160" class="image" />
    <!-- Ground -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <line x1="0" y1="200" x2="20" y2="180" class="image" />
    <line x1="20" y1="180" x2="40" y2="200" class="image" />
    <line x1="40" y1="200" x2="60" y2="180" class="image" />
    <line x1="60" y1="180" x2="80" y2="200" class="image" />
    <line x1="80" y1="200" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="120" y2="200" class="image" />
    <line x1="120" y1="200" x2="140" y2="180" class="image" />
    <line x1="140" y1="180" x2="160" y2="200" class="image" />
    <line x1="160" y1="200" x2="180" y2="180" class="image" />
    <line x1="180" y1="180" x2="200" y2="200" class="image" />
  </g>
</svg>