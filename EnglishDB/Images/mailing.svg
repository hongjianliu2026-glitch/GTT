<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mailing</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪlɪŋ] n. 邮寄，邮递</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mail (邮件) + -ing (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个邮递员背着一大袋信件，"邮寄(mailing)"
    <tspan x="50" dy="25">的动作就像他在传递希望和信息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company sends out a mailing list every month.
  </text>
  <text x="50" y="310" class="content">
    公司每个月都会发送一份邮寄名单。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mailbag -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Letters -->
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Mailman -->
    <circle cx="200" cy="50" r="20" class="image" />
    <line x1="200" y1="70" x2="200" y2="120" class="image" />
    <line x1="200" y1="120" x2="180" y2="150" class="image" />
    <line x1="200" y1="120" x2="220" y2="150" class="image" />
    <line x1="200" y1="90" x2="230" y2="80" class="image" />
    <line x1="200" y1="90" x2="170" y2="80" class="image" />
    <!-- Mailbag strap -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
  </g>
</svg>