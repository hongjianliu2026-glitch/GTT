<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uncontrolled</text>
  <text x="50" y="120" class="subtitle">[ˌʌnkənˈtroʊld] adj. 不受控制的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + control (控制)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个失控的火焰，"无法控制(un-controlled)"
    <tspan x="50" dy="25">地蔓延，形成一片火海。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fire became uncontrolled and spread quickly.
  </text>
  <text x="50" y="310" class="content">
    火势变得无法控制，迅速蔓延。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fire -->
    <path d="M0 0 C50 100, 150 100, 200 0" class="image" stroke="#E74C3C" fill="none" />
    <path d="M20 20 C70 120, 170 120, 220 20" class="image" stroke="#E74C3C" fill="none" />
    <path d="M40 40 C90 140, 190 140, 240 40" class="image" stroke="#E74C3C" fill="none" />
    <!-- Smoke -->
    <ellipse cx="100" cy="50" rx="50" ry="20" class="image" stroke="#7F8C8D" fill="none" />
    <ellipse cx="120" cy="70" rx="40" ry="15" class="image" stroke="#7F8C8D" fill="none" />
    <ellipse cx="140" cy="90" rx="30" ry="10" class="image" stroke="#7F8C8D" fill="none" />
  </g>
</svg>