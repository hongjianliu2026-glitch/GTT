<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">generator</text>
  <text x="50" y="120" class="subtitle">[ˈdʒenəreɪtər] n. 发电机，发生器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gen- (产生) + -ator (做...的机器)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的机器，"产生(gen-)"
    <tspan x="50" dy="25">能量，这个机器就是发电机(generator)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The generator provides electricity for the entire village.
  </text>
  <text x="50" y="310" class="content">
    发电机为整个村庄提供电力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Generator -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rotor -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Stator -->
    <rect x="125" y="50" width="100" height="100" class="image" />
    <!-- Output lines -->
    <line x1="250" y1="100" x2="350" y2="100" class="image" />
    <line x1="250" y1="100" x2="250" y2="200" class="image" />
    <!-- Electricity symbol -->
    <line x1="350" y1="100" x2="370" y2="80" class="image" />
    <line x1="350" y1="100" x2="370" y2="120" class="image" />
  </g>
</svg>