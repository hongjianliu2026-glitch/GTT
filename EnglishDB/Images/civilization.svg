<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">civilization</text>
  <text x="50" y="120" class="subtitle">[ˌsɪvələˈzeɪʃn] n. 文明，文化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> civ (公民) + -il (形容词后缀) + -iz (动词后缀) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群公民(civ)聚集在一起，通过合作和交流，逐渐形成了文明(civilization)。
    <tspan x="50" dy="25">他们建造城市，发展科技，创造艺术，这一切都是文明的表现。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ancient Egyptians made significant contributions to civilization.
  </text>
  <text x="50" y="310" class="content">
    古埃及人对文明做出了重大贡献。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="40" width="50" height="80" class="image" />
    <rect x="190" y="60" width="50" height="60" class="image" />
    <rect x="260" y="80" width="50" height="40" class="image" />
    <!-- People -->
    <circle cx="70" cy="150" r="10" class="image" />
    <circle cx="140" cy="130" r="10" class="image" />
    <circle cx="210" cy="110" r="10" class="image" />
    <circle cx="280" cy="90" r="10" class="image" />
    <!-- Roads -->
    <line x1="0" y1="180" x2="350" y2="180" class="image" />
    <line x1="0" y1="190" x2="350" y2="190" class="image" />
  </g>
</svg>