<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">necessarily</text>
  <text x="50" y="120" class="subtitle">[ˌnesəˈserəli] adv. 必然地，必定地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ne- (不) + cess (走) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个场景，一个人试图"不走(ne-cess)"
    <tspan x="50" dy="25">出一条路，但最终还是"必然地(necessarily)"找到了方向。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It is not necessarily true that all rich people are happy.
  </text>
  <text x="50" y="310" class="content">
    并不是所有富有的人都必然幸福。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Path -->
    <path d="M50 50 Q100 150 150 50 T250 50" class="image" />
    <!-- Person -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="30" y2="130" class="image" />
    <line x1="50" y1="100" x2="70" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />
    <!-- Arrow -->
    <polygon points="250,50 240,40 240,60" class="image" />
  </g>
</svg>