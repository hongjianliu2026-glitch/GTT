<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">discussion</text>
  <text x="50" y="120" class="subtitle">[dɪˈskʌʃən] n. 讨论，辩论</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + cuss (摇动) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在会议室里，"分开摇动(dis-cuss)"
    <tspan x="50" dy="25">他们的观点，激烈地讨论(discussion)着某个话题。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The discussion on climate change was very heated.
  </text>
  <text x="50" y="310" class="content">
    关于气候变化的讨论非常激烈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People -->
    <circle cx="80" cy="60" r="15" class="image" />
    <circle cx="180" cy="60" r="15" class="image" />
    <circle cx="280" cy="60" r="15" class="image" />
    <!-- Speech bubbles -->
    <path d="M 80 80 Q 100 100 120 80" class="image" />
    <path d="M 180 80 Q 200 100 220 80" class="image" />
    <path d="M 280 80 Q 300 100 320 80" class="image" />
  </g>
</svg>