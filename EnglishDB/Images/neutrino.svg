<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neutrino</text>
  <text x="50" y="120" class="subtitle">[njuːˈtriːnəʊ] n. 中微子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neutro- (中性) + -ino (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个微小的"中性(neutro-)"粒子，它像幽灵一样穿过一切，几乎不与任何物质发生作用，这就是"中微子(neutrino)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Scientists are studying neutrinos to understand the nature of the universe.
  </text>
  <text x="50" y="310" class="content">
    科学家们正在研究中微子以了解宇宙的本质。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Neutrino particle -->
    <circle cx="50" cy="100" r="10" class="image" />
    <!-- Path of the neutrino -->
    <path d="M50 100 Q 150 50 250 100" class="image" />
    <!-- Detector -->
    <rect x="280" y="80" width="40" height="40" class="image" />
    <!-- Label -->
    <text x="290" y="110" class="content" text-anchor="middle">Detector</text>
  </g>
</svg>