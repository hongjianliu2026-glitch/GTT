<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thunder</text>
  <text x="50" y="120" class="subtitle">[ˈθʌndər] n. 雷声；v. 打雷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thun- (雷声) + -der (表示动作或状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的雷声(thun-)在天空轰鸣(-der)，
    <tspan x="50" dy="25">整个世界都被这震耳欲聋的声音所震撼。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thunder roared as the storm approached.
  </text>
  <text x="50" y="310" class="content">
    随着风暴的临近，雷声轰鸣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sky -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clouds -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" />
    <!-- Lightning -->
    <line x1="100" y1="50" x2="250" y2="150" class="image" />
    <line x1="120" y1="50" x2="270" y2="150" class="image" />
    <line x1="140" y1="50" x2="290" y2="150" class="image" />
    <!-- Thunder -->
    <text x="175" y="120" class="title" text-anchor="middle">THUNDER</text>
  </g>
</svg>