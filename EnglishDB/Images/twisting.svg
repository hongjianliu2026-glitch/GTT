<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF5733; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twisting</text>
  <text x="50" y="120" class="subtitle">[ˈtwɪstɪŋ] v. 扭曲，缠绕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twist (扭曲) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根绳子被"扭曲(twist)"成各种形状，
    <tspan x="50" dy="25">就像一条蛇在缠绕(twisting)自己的身体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The vines were twisting around the tree trunk.
  </text>
  <text x="50" y="310" class="content">
    藤蔓正缠绕在树干上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Twisted rope -->
    <path d="M50,50 Q100,20 150,50 T250,50" class="image" />
    <path d="M50,100 Q100,130 150,100 T250,100" class="image" />
    <path d="M50,150 Q100,180 150,150 T250,150" class="image" />
    <!-- Snake -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <circle cx="50" cy="100" r="10" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="200" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
  </g>
</svg>