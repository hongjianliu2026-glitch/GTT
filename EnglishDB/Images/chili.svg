<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .chili { fill: #FF6347; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chili</text>
  <text x="50" y="120" class="subtitle">[ˈtʃɪli] n. 辣椒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chili (来自Nahuatl语言的“chilli”，意为辣椒)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的辣椒，"chili"
    <tspan x="50" dy="25">在餐桌上燃烧，辣得让人直冒汗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added some chili to the soup to make it spicy.
  </text>
  <text x="50" y="310" class="content">
    她在汤里加了一些辣椒，让它变得辣味十足。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chili pepper -->
    <path d="M 0 0 C 50 -50 100 -50 150 0" class="image chili" />
    <circle cx="75" cy="0" r="20" class="image chili" />
    <!-- Steam -->
    <line x1="75" y1="0" x2="75" y2="-50" class="image" />
    <line x1="75" y1="0" x2="50" y2="-40" class="image" />
    <line x1="75" y1="0" x2="100" y2="-40" class="image" />
  </g>
</svg>