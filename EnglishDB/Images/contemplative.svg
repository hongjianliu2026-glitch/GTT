<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">contemplative</text>
  <text x="50" y="120" class="subtitle">[kənˈtɛmplətɪv] adj. 沉思的，冥想的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + templ (思考) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在山顶，"一起思考(con-templ)"
    <tspan x="50" dy="25">着宇宙的奥秘，他的表情是如此沉思(contemplative)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man's contemplative gaze seemed to pierce through time.
  </text>
  <text x="50" y="310" class="content">
    老人的沉思目光似乎能穿透时间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,200 L400,200 L200,0 Z" class="image" />
    <!-- Person -->
    <circle cx="200" cy="150" r="20" class="image" />
    <line x1="200" y1="170" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="180" y2="230" class="image" />
    <line x1="200" y1="200" x2="220" y2="230" class="image" />
    <line x1="200" y1="180" x2="170" y2="170" class="image" />
    <line x1="200" y1="180" x2="230" y2="170" class="image" />
    <!-- Thought bubble -->
    <circle cx="250" cy="100" r="30" class="image" />
    <circle cx="270" cy="80" r="10" class="image" />
    <circle cx="290" cy="100" r="15" class="image" />
  </g>
</svg>