<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E9F7; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dreamy</text>
  <text x="50" y="120" class="subtitle">[ˈdriːmi] adj. 梦幻的，不切实际的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dream (梦) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在夜晚，"沉浸在梦境(dream)"
    <tspan x="50" dy="25">中，周围是飘渺的云雾，仿佛置身于梦幻(dreamy)的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a dreamy expression on her face.
  </text>
  <text x="50" y="310" class="content">
    她脸上带着梦幻般的表情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cloud -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <ellipse cx="250" cy="120" rx="80" ry="40" class="image" />
    <ellipse cx="100" cy="130" rx="90" ry="45" class="image" />
    <!-- Person -->
    <circle cx="200" cy="180" r="20" class="image" />
    <line x1="200" y1="200" x2="200" y2="240" class="image" />
    <line x1="200" y1="240" x2="180" y2="270" class="image" />
    <line x1="200" y1="240" x2="220" y2="270" class="image" />
    <line x1="200" y1="220" x2="240" y2="210" class="image" />
    <!-- Stars -->
    <circle cx="100" cy="80" r="5" class="image" />
    <circle cx="300" cy="90" r="5" class="image" />
    <circle cx="200" cy="70" r="5" class="image" />
  </g>
</svg>