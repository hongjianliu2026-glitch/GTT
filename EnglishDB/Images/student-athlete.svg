<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">student-athlete</text>
  <text x="50" y="120" class="subtitle">[ˈstuːdnt ˈæθliːt] n. 学生运动员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> student (学生) + athlete (运动员)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生运动员，"既是学生(student)又是运动员(athlete)"，
    <tspan x="50" dy="25">他/她在操场上奔跑，同时也不忘在教室里学习。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a dedicated student-athlete, balancing both academics and sports.
  </text>
  <text x="50" y="310" class="content">
    她是一个敬业的学生运动员，平衡了学业和运动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Student -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <line x1="50" y1="140" x2="10" y2="130" class="image" />
    <!-- Athlete -->
    <line x1="150" y1="100" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="190" y2="130" class="image" />
    <line x1="150" y1="140" x2="110" y2="130" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="180" y2="80" class="image" />
    <line x1="200" y1="100" x2="220" y2="80" class="image" />
    <!-- Books -->
    <rect x="20" y="20" width="30" height="40" class="image" />
    <rect x="30" y="20" width="30" height="40" class="image" />
    <rect x="40" y="20" width="30" height="40" class="image" />
    <!-- Track -->
    <line x1="100" y1="220" x2="300" y2="220" class="image" />
    <line x1="100" y1="240" x2="300" y2="240" class="image" />
    <line x1="100" y1="260" x2="300" y2="260" class="image" />
  </g>
</svg>