<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glower</text>
  <text x="50" y="120" class="subtitle">[ˈɡlaʊər] v. 怒视，瞪眼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glow (发光) + -er (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人愤怒地瞪着你，眼睛里仿佛"发光(glow)"，
    <tspan x="50" dy="25">这种强烈的目光就是"怒视(glower)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He glowered at me when I accidentally bumped into him.
  </text>
  <text x="50" y="310" class="content">
    我无意中撞到他时，他怒视着我。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="85" r="10" class="image" />
    <circle cx="125" cy="85" r="10" class="image" />
    <!-- Eyebrows -->
    <line x1="60" y1="70" x2="90" y2="70" class="image" />
    <line x1="110" y1="70" x2="140" y2="70" class="image" />
    <!-- Mouth -->
    <line x1="75" y1="120" x2="125" y2="120" class="image" />
    <!-- Glow effect -->
    <circle cx="100" cy="100" r="30" class="image" stroke-dasharray="5,5" />
  </g>
</svg>