<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">optimistic</text>
  <text x="50" y="120" class="subtitle">[ˌɒptɪˈmɪstɪk] adj. 乐观的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> opti- (最好) + -istic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人总是看到"最好的(opti-)"一面，
    <tspan x="50" dy="25">无论遇到什么困难，他总是保持乐观(optimistic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Despite the challenges, she remained optimistic about the future.
  </text>
  <text x="50" y="310" class="content">
    尽管面临挑战，她对未来仍然保持乐观。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Happy face -->
    <circle cx="100" cy="100" r="40" fill="#FFF" stroke="#7F8C8D" stroke-width="2" />
    <circle cx="80" cy="85" r="5" fill="#7F8C8D" />
    <circle cx="120" cy="85" r="5" fill="#7F8C8D" />
    <path d="M80 115 Q100 130 120 115" stroke="#7F8C8D" stroke-width="2" fill="none" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" fill="#7F8C8D" />
    <line x1="200" y1="120" x2="200" y2="180" stroke="#7F8C8D" stroke-width="2" />
    <line x1="200" y1="150" x2="180" y2="130" stroke="#7F8C8D" stroke-width="2" />
    <line x1="200" y1="150" x2="220" y2="130" stroke="#7F8C8D" stroke-width="2" />
    <line x1="200" y1="180" x2="180" y2="200" stroke="#7F8C8D" stroke-width="2" />
    <line x1="200" y1="180" x2="220" y2="200" stroke="#7F8C8D" stroke-width="2" />
  </g>
</svg>