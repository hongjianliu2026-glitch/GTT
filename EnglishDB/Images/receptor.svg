<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">receptor</text>
  <text x="50" y="120" class="subtitle">[rɪˈseptər] n. 受体，接收器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + cept (拿) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个细胞表面有一个"接收器(receptor)"，
    <tspan x="50" dy="25">它能够"拿回(re-cept)"信号分子，并传递给细胞内部。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The drug binds to a specific receptor on the cell surface.
  </text>
  <text x="50" y="310" class="content">
    这种药物会结合到细胞表面的特定受体上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cell -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Receptor -->
    <rect x="120" y="120" width="60" height="60" class="image" />
    <!-- Signal molecule -->
    <circle cx="250" cy="150" r="20" class="image" />
    <!-- Arrow -->
    <line x1="250" y1="150" x2="180" y2="150" class="image" />
    <polygon points="180,150 170,145 170,155" class="image" />
  </g>
</svg>