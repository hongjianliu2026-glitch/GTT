<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">molecular</text>
  <text x="50" y="120" class="subtitle">[məˈlɛkjələr] adj. 分子的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mole (摩尔) + -cular (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的分子(molecule)，它像一个微小的星球，
    <tspan x="50" dy="25">周围环绕着无数更小的粒子，这些粒子构成了分子的世界(molecular)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scientist studied the molecular structure of the compound.
  </text>
  <text x="50" y="310" class="content">
    科学家研究了该化合物的分子结构。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Molecule -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Small particles -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
    <!-- Connecting lines -->
    <line x1="100" y1="100" x2="50" y2="50" class="image" />
    <line x1="100" y1="100" x2="150" y2="50" class="image" />
    <line x1="100" y1="100" x2="50" y2="150" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
  </g>
</svg>