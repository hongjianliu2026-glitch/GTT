<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5E9E2; }
      .title { font: bold 48px sans-serif; fill: #8B4513; }
      .subtitle { font: italic 24px serif; fill: #6D4C41; }
      .content { font: 18px sans-serif; fill: #5D4037; }
      .highlight { font-weight: bold; fill: #B71C1C; }
      .story { font: 16px serif; fill: #4E342E; }
      .image { stroke: #795548; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">funeral</text>
  <text x="50" y="120" class="subtitle">[ˈfjuːnərəl] n. 葬礼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fune- (烟) + -ral (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的葬礼仪式，"烟雾(fune-)"
    <tspan x="50" dy="25">缭绕在空中，象征着灵魂的升天，这就是葬礼(funeral)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The funeral was held at the local church.
  </text>
  <text x="50" y="310" class="content">
    葬礼在当地教堂举行。
  </text>

