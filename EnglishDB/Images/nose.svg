<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nose</text>
  <text x="50" y="120" class="subtitle">[noʊz] n. 鼻子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nas- (鼻子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只大象用它那巨大的"鼻子(nas-)"
    <tspan x="50" dy="25">在森林中探险，鼻子不仅能闻气味，还能卷起食物。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wrinkled her nose at the smell.
  </text>
  <text x="50" y="310" class="content">
    她对那气味皱起了鼻子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Elephant head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Elephant trunk (nose) -->
    <path d="M 100 180 Q 150 250 200 180" class="image" />
    <!-- Eyes -->
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <!-- Ears -->
    <ellipse cx="30" cy="100" rx="30" ry="50" class="image" />
    <ellipse cx="170" cy="100" rx="30" ry="50" class="image" />
  </g>
</svg>