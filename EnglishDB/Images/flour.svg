<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">flour</text>
  <text x="50" y="120" class="subtitle">[ˈflaʊər] n. 面粉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> flour (源自拉丁语 "flos"，意为“花”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一粒粒小麦像花朵一样绽放，"花(flos)"
    <tspan x="50" dy="25">变成了面粉(flour)，洒在面包上，就像花瓣一样美丽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used flour to make bread.
  </text>
  <text x="50" y="310" class="content">
    她用面粉做面包。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flour bag -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flour pouring out -->
    <polyline points="50,100 100,50 150,100 200,50 250,100 300,50" class="image" />
    <!-- Bread -->
    <rect x="100" y="120" width="150" height="60" class="image" />
    <!-- Flower -->
    <circle cx="20" cy="20" r="15" class="image" />
    <circle cx="30" cy="30" r="10" class="image" />
    <circle cx="10" cy="30" r="10" class="image" />
    <circle cx="20" cy="40" r="10" class="image" />
  </g>
</svg>