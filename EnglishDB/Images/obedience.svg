<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">obedience</text>
  <text x="50" y="120" class="subtitle">[əˈbiːdiəns] n. 服从，顺从</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (向) + ed (做) + ience (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个士兵在指挥官面前，"向着(ob-)"
    <tspan x="50" dy="25">指挥官的命令"做(ed)"出服从的动作，</tspan>
    <tspan x="50" dy="25">这就是顺从(obedience)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog showed great obedience to its owner.
  </text>
  <text x="50" y="310" class="content">
    这只狗对主人表现出极大的服从。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Commander -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="190" class="image" />
    <line x1="150" y1="160" x2="170" y2="190" class="image" />
    <line x1="150" y1="140" x2="200" y2="130" class="image" />
    <!-- Arrow -->
    <line x1="150" y1="120" x2="50" y2="120" class="image" />
    <polygon points="50,120 45,115 45,125" class="image" />
  </g>
</svg>