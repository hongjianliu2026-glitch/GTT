<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">culprit</text>
  <text x="50" y="120" class="subtitle">[ˈkʌlprɪt] n. 罪犯，犯人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> culp (罪) + -it (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被警察抓住的"罪人(culp-it)"，
    <tspan x="50" dy="25">他双手被铐，满脸惊恐，这就是"罪犯(culprit)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police quickly identified the culprit.
  </text>
  <text x="50" y="310" class="content">
    警察很快确定了罪犯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Police officer -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <line x1="50" y1="150" x2="10" y2="140" class="image" />
    <!-- Handcuffs -->
    <rect x="30" y="180" width="40" height="10" class="image" />
    <rect x="30" y="190" width="40" height="10" class="image" />
    <!-- Culprit -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
    <line x1="150" y1="150" x2="190" y2="140" class="image" />
    <line x1="150" y1="150" x2="110" y2="140" class="image" />
    <!-- Handcuffs -->
    <rect x="130" y="180" width="40" height="10" class="image" />
    <rect x="130" y="190" width="40" height="10" class="image" />
  </g>
</svg>