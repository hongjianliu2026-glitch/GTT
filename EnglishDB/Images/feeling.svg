<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feeling</text>
  <text x="50" y="120" class="subtitle">[ˈfiːlɪŋ] n. 感觉，情感；v. 感觉，认为</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> feel (感觉) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人闭上眼睛，用手触摸物体，"感受(feel)"
    <tspan x="50" dy="25">物体的质地和温度，这种体验就是感觉(feeling)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a good feeling about this project.
  </text>
  <text x="50" y="310" class="content">
    她对这个项目有一种好的感觉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <!-- Object -->
    <rect x="120" y="100" width="60" height="60" class="image" />
    <!-- Hand -->
    <line x1="50" y1="150" x2="120" y2="130" class="image" />
    <line x1="120" y1="130" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="140" y2="140" class="image" />
  </g>
</svg>