<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">urinary</text>
  <text x="50" y="120" class="subtitle">[ˈjʊərɪnəri] adj. 尿的，泌尿的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> urin (尿) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个医生在检查一个巨大的尿液瓶，瓶子上写着"urinary"，
    <tspan x="50" dy="25">表示这是与尿液相关的检查。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor asked for a urinary test to check for infections.
  </text>
  <text x="50" y="310" class="content">
    医生要求进行尿液检查以检查是否有感染。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large urine bottle -->
    <rect x="0" y="0" width="200" height="300" class="image" />
    <!-- Label on the bottle -->
    <text x="50" y="150" class="content" style="font-size: 36px; fill: #2C3E50;">urinary</text>
    <!-- Doctor -->
    <circle cx="250" cy="150" r="20" class="image" />
    <line x1="250" y1="170" x2="250" y2="220" class="image" />
    <line x1="250" y1="220" x2="230" y2="250" class="image" />
    <line x1="250" y1="220" x2="270" y2="250" class="image" />
    <line x1="250" y1="190" x2="220" y2="180" class="image" />
    <line x1="250" y1="190" x2="280" y2="180" class="image" />
  </g>
</svg>