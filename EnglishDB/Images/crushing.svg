<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crushing</text>
  <text x="50" y="120" class="subtitle">[ˈkrʌʃɪŋ] adj. 压倒性的，毁灭性的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crus (压碎) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的石头从天而降，"压碎(crus)"
    <tspan x="50" dy="25">一切，这种毁灭性的力量就是"压倒性的(crushing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crushing defeat demoralized the team.
  </text>
  <text x="50" y="310" class="content">
    这场压倒性的失败让队伍士气低落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Giant rock -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Crushed objects -->
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="190" x2="300" y2="190" class="image" />
    <line x1="50" y1="200" x2="300" y2="200" class="image" />
    <!-- Crushed objects -->
    <line x1="50" y1="210" x2="300" y2="210" class="image" />
    <line x1="50" y1="220" x2="300" y2="220" class="image" />
    <line x1="50" y1="230" x2="300" y2="230" class="image" />
  </g>
</svg>