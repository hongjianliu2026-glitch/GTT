<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adopt</text>
  <text x="50" y="120" class="subtitle">[əˈdɑːpt] v. 采用，收养</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ad- (朝向) + opt (选择)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个家庭"朝向(ad-)"一个孩子，"选择(opt)"
    <tspan x="50" dy="25">他作为自己的家庭成员，这就是收养(adopt)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The couple decided to adopt a child from the orphanage.
  </text>
  <text x="50" y="310" class="content">
    这对夫妇决定从孤儿院收养一个孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Family -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Father -->
    <circle cx="100" cy="100" r="20" class="image" /> <!-- Mother -->
    <circle cx="75" cy="150" r="15" class="image" /> <!-- Child -->
    <!-- Arrows -->
    <line x1="75" y1="115" x2="75" y2="135" class="image" />
    <line x1="70" y1="135" x2="80" y2="135" class="image" />
    <line x1="70" y1="135" x2="75" y2="145" class="image" />
    <line x1="80" y1="135" x2="75" y2="145" class="image" />
  </g>
</svg>