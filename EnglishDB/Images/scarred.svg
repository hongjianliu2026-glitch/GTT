<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scarred</text>
  <text x="50" y="120" class="subtitle">[skɑrd] adj. 有伤痕的，受创伤的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scar (伤痕) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人脸上有一道深深的"伤痕(scar)"，
    <tspan x="50" dy="25">这道伤痕让他看起来"有伤痕的(scarred)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The war left him emotionally scarred.
  </text>
  <text x="50" y="310" class="content">
    战争让他情感上留下了创伤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Scar -->
    <line x1="40" y1="100" x2="160" y2="100" class="image" />
    <line x1="40" y1="100" x2="50" y2="90" class="image" />
    <line x1="40" y1="100" x2="50" y2="110" class="image" />
    <line x1="160" y1="100" x2="150" y2="90" class="image" />
    <line x1="160" y1="100" x2="150" y2="110" class="image" />
  </g>
</svg>