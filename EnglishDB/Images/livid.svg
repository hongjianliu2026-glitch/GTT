<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">livid</text>
  <text x="50" y="120" class="subtitle">[ˈlɪvɪd] adj. 青灰色的，生气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liv (生命) + id (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为极度愤怒而脸色变得"青灰色(livid)"，
    <tspan x="50" dy="25">仿佛生命(liv)的活力被愤怒所吞噬。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was livid when she found out about the mistake.
  </text>
  <text x="50" y="310" class="content">
    当她发现这个错误时，她非常生气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Angry expression -->
    <line x1="70" y1="70" x2="90" y2="90" class="image" />
    <line x1="110" y1="70" x2="130" y2="90" class="image" />
    <!-- Livid color -->
    <circle cx="100" cy="100" r="45" fill="#4A235A" />
  </g>
</svg>