<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">paralyze</text>
  <text x="50" y="120" class="subtitle">[ˈpærəlaɪz] v. 使瘫痪，使麻痹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> para- (旁边) + lyze (松开)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在旁边(para-)，突然他的腿松开(lyze)，
    <tspan x="50" dy="25">无法移动，就像被瘫痪了一样(paralyze)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident paralyzed him from the waist down.
  </text>
  <text x="50" y="310" class="content">
    那次事故使他腰部以下瘫痪。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Paralyzed legs -->
    <line x1="50" y1="180" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="260" class="image" />
    <line x1="50" y1="220" x2="70" y2="260" class="image" />
    <!-- Ground -->
    <line x1="0" y1="260" x2="100" y2="260" class="image" />
  </g>
</svg>