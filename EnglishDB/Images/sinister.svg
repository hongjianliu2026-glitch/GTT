<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sinister</text>
  <text x="50" y="120" class="subtitle">[ˈsɪnɪstər] adj. 不祥的，邪恶的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sin- (罪恶) + -ister (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个黑暗的夜晚，"罪恶(sin-)"的阴影笼罩着，
    <tspan x="50" dy="25">一切都显得"不祥(sinister)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house had a sinister atmosphere.
  </text>
  <text x="50" y="310" class="content">
    那栋老房子有一种不祥的气氛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dark night -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#1B2631" />
    <!-- Moon -->
    <circle cx="300" cy="50" r="30" class="image" fill="#F1C40F" />
    <!-- Shadow -->
    <path d="M50,150 Q100,50 150,150 T250,150" class="image" fill="#0E6251" />
    <!-- Evil figure -->
    <circle cx="100" cy="100" r="20" class="image" fill="#212F3C" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="130" y2="130" class="image" />
  </g>
</svg>