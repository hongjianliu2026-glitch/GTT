<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inaction</text>
  <text x="50" y="120" class="subtitle">[ɪˈnækʃən] n. 不作为，无行动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + action (行动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在椅子上，"不(in-)"
    <tspan x="50" dy="25">采取任何行动(action)，这就是不作为(inaction)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The inaction of the government led to the crisis.
  </text>
  <text x="50" y="310" class="content">
    政府的无所作为导致了危机。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="50" y1="150" x2="100" y2="150" class="image" />
    <!-- Person sitting -->
    <circle cx="75" cy="70" r="20" class="image" />
    <line x1="75" y1="90" x2="75" y2="120" class="image" />
    <line x1="75" y1="120" x2="50" y2="140" class="image" />
    <line x1="75" y1="120" x2="100" y2="140" class="image" />
    <line x1="75" y1="100" x2="50" y2="90" class="image" />
    <line x1="75" y1="100" x2="100" y2="90" class="image" />
  </g>
</svg>