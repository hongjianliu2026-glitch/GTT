<svg xmlns="http://www.w33.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">solving</text>
  <text x="50" y="120" class="subtitle">[ˈsɒlvɪŋ] v. 解决，解答</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> solv (松开) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个侦探在"松开(solv)"一个复杂的谜题，
    <tspan x="50" dy="25">逐步解开线索，最终"解决(solving)"了案件。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is good at solving complex problems.
  </text>
  <text x="50" y="310" class="content">
    她擅长解决复杂的问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Detective -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Puzzle pieces -->
    <rect x="70" y="80" width="50" height="50" class="image" />
    <rect x="130" y="80" width="50" height="50" class="image" />
    <rect x="190" y="80" width="50" height="50" class="image" />
    <!-- Solved puzzle -->
    <rect x="70" y="150" width="170" height="50" class="image" />
    <text x="90" y="180" class="content" fill="#2980B9">Solved</text>
  </g>
</svg>