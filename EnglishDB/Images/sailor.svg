<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sailor</text>
  <text x="50" y="120" class="subtitle">[ˈseɪlər] n. 水手，海员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sail (航行) + -or (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个勇敢的水手，站在船头，迎着海风，"航行(sail)"
    <tspan x="50" dy="25">在大海上，他就是那个"航行的人(sail-or)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sailor navigated the ship through the stormy sea.
  </text>
  <text x="50" y="310" class="content">
    水手在暴风雨的海上驾驶着船。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ship -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,180 200,180 175,150 75,150" class="image" />
    <!-- Sailor -->
    <circle cx="125" cy="130" r="15" class="image" />
    <line x1="125" y1="145" x2="125" y2="180" class="image" />
    <line x1="125" y1="160" x2="100" y2="150" class="image" />
    <line x1="125" y1="160" x2="150" y2="150" class="image" />
    <line x1="125" y1="180" x2="100" y2="200" class="image" />
    <line x1="125" y1="180" x2="150" y2="200" class="image" />
    <!-- Waves -->
    <path d="M50,200 Q75,170 100,200 Q125,170 150,200 Q175,170 200,200" class="image" />
  </g>
</svg>