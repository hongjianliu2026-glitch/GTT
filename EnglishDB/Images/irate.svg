<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">irate</text>
  <text x="50" y="120" class="subtitle">[aɪˈreɪt] adj. 愤怒的，生气的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ir- (进入) + -ate (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"推进(ir-)"愤怒的情绪中，
    <tspan x="50" dy="25">他的脸变得通红，眼睛瞪得大大的，这就是"愤怒的(irate)"状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The irate customer demanded a refund.
  </text>
  <text x="50" y="310" class="content">
    愤怒的顾客要求退款。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="140" cy="80" r="10" class="image" />
    <line x1="60" y1="140" x2="140" y2="140" class="image" />
    <path d="M60 140 Q100 180 140 140" class="image" />
  </g>
</svg>