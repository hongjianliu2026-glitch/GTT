<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ham</text>
  <text x="50" y="120" class="subtitle">[hæm] n. 火腿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "hamme"，意为“动物的后腿”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猪的后腿被腌制并熏制，变成了美味的火腿(ham)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sliced the ham for the sandwich.
  </text>
  <text x="50" y="310" class="content">
    她为三明治切了火腿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Pig leg -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Ham -->
    <rect x="50" y="20" width="100" height="60" class="image" />
    <!-- Smoke -->
    <line x1="60" y1="10" x2="70" y2="0" class="image" />
    <line x1="70" y1="10" x2="80" y2="0" class="image" />
    <line x1="80" y1="10" x2="90" y2="0" class="image" />
    <line x1="90" y1="10" x2="100" y2="0" class="image" />
    <line x1="100" y1="10" x2="110" y2="0" class="image" />
    <line x1="110" y1="10" x2="120" y2="0" class="image" />
  </g>
</svg>