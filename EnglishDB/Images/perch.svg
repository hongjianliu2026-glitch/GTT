<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">perch</text>
  <text x="50" y="120" class="subtitle">[pɜːrtʃ] n. 栖木，高处；v. 栖息，坐落</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> per- (通过) + -ch (表示位置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鸟儿"通过(per-)"树枝"位置(ch)"，
    <tspan x="50" dy="25">稳稳地栖息在树枝上，这就是perch的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bird perched on the highest branch.
  </text>
  <text x="50" y="310" class="content">
    鸟儿栖息在最高的树枝上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree branch -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Bird -->
    <circle cx="175" cy="0" r="20" class="image" />
    <line x1="175" y1="20" x2="175" y2="50" class="image" />
    <line x1="175" y1="35" x2="155" y2="25" class="image" />
    <line x1="175" y1="35" x2="195" y2="25" class="image" />
    <line x1="175" y1="50" x2="155" y2="70" class="image" />
    <line x1="175" y1="50" x2="195" y2="70" class="image" />
  </g>
</svg>