<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">skeptical</text>
  <text x="50" y="120" class="subtitle">[ˈskɛptɪkəl] adj. 怀疑的，持怀疑态度的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> skept (思考) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人皱着眉头，"思考(skept)"
    <tspan x="50" dy="25">着每一个细节，对一切持怀疑态度(skeptical)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She remained skeptical about the new project.
  </text>
  <text x="50" y="310" class="content">
    她对新项目仍然持怀疑态度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with a skeptical expression -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Eyebrows -->
    <line x1="10" y1="90" x2="30" y2="90" class="image" />
    <!-- Mouth -->
    <line x1="15" y1="110" x2="25" y2="110" class="image" />
    <!-- Thought bubble -->
    <ellipse cx="100" cy="50" rx="50" ry="30" class="image" />
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="140" class="image" />
    <line x1="100" y1="120" x2="120" y2="140" class="image" />
  </g>
</svg>