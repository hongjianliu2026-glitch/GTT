<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ultraviolet</text>
  <text x="50" y="120" class="subtitle">[ˌʌltrəˈvaɪəlɪt] adj. 紫外线的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ultra- (超过) + violet (紫色)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在实验室里，"超过(ultra)"
    <tspan x="50" dy="25">紫色的光(violet)，这种光就是紫外线(ultraviolet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Ultraviolet rays can cause skin damage.
  </text>
  <text x="50" y="310" class="content">
    紫外线可以导致皮肤损伤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Scientist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Lab equipment -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Light rays -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Violet light -->
    <circle cx="160" cy="90" r="20" fill="#8A2BE2" />
  </g>
</svg>