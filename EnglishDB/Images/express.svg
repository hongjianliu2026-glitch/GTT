<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">express</text>
  <text x="50" y="120" class="subtitle">[ɪkˈspres] v. 表达，表示；n. 快车，快递</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ex- (向外) + press (压)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用力"向外压(ex-press)"出自己的情感，
    <tspan x="50" dy="25">就像快递员快速传递包裹一样，表达(express)自己的想法。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She expressed her gratitude with a heartfelt letter.
  </text>
  <text x="50" y="310" class="content">
    她用一封真挚的信表达了她的感激之情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person expressing emotion -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <!-- Heart symbol -->
    <path d="M100,100 C100,50 150,50 150,100 C150,150 100,150 100,100 Z" class="image" />
    <!-- Arrow pointing out -->
    <line x1="125" y1="100" x2="200" y2="100" class="image" />
    <polygon points="200,100 190,90 190,110" class="image" />
  </g>
</svg>