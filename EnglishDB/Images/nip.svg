<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nip</text>
  <text x="50" y="120" class="subtitle">[nɪp] v. 捏，夹；n. 捏，夹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nip (捏，夹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫用爪子轻轻"捏(nip)"你的手指，
    <tspan x="50" dy="25">那种感觉既轻微又让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The kitten gave me a playful nip on the finger.
  </text>
  <text x="50" y="310" class="content">
    小猫调皮地轻轻捏了一下我的手指。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,250)">
    <!-- Cat -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="80" x2="50" y2="120" class="image" /> <!-- Body -->
    <line x1="50" y1="100" x2="20" y2="100" class="image" /> <!-- Front leg -->
    <line x1="50" y1="100" x2="80" y2="100" class="image" /> <!-- Back leg -->
    <line x1="50" y1="120" x2="20" y2="150" class="image" /> <!-- Tail -->
    <!-- Finger -->
    <line x1="150" y1="50" x2="150" y2="100" class="image" />
    <circle cx="150" cy="40" r="5" class="image" />
    <!-- Nip action -->
    <line x1="80" y1="80" x2="140" y2="60" class="image" />
  </g>
</svg>