<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stomp</text>
  <text x="50" y="120" class="subtitle">[stɒmp] v. 跺脚，重踏；n. 跺脚声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> st- (站立) + -omp (重击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人愤怒地"站立并重击(st-omp)"地面，
    <tspan x="50" dy="25">发出巨大的跺脚声(stomp)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stomped her foot in frustration.
  </text>
  <text x="50" y="310" class="content">
    她因沮丧而跺脚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Footprint -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="180" class="image" />
    <line x1="100" y1="130" x2="70" y2="150" class="image" />
    <line x1="100" y1="130" x2="130" y2="150" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="180" class="image" />
    <line x1="200" y1="160" x2="220" y2="180" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
  </g>
</svg>