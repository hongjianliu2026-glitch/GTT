<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">epitome</text>
  <text x="50" y="120" class="subtitle">[ɪˈpɪtəmi] n. 缩影，典型</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> epi- (在...之上) + tyme (类型)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的雕塑，"在类型之上(epi-tyme)"
    <tspan x="50" dy="25">代表了所有同类事物的精华，这就是缩影(epitome)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is the epitome of elegance.
  </text>
  <text x="50" y="310" class="content">
    她是优雅的缩影。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sculpture -->
    <circle cx="175" cy="100" r="50" class="image" />
    <line x1="175" y1="150" x2="175" y2="200" class="image" />
    <line x1="175" y1="150" x2="125" y2="200" class="image" />
    <line x1="175" y1="150" x2="225" y2="200" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <!-- Epitome text -->
    <text x="150" y="250" class="content" text-anchor="middle">Epitome</text>
  </g>
</svg>