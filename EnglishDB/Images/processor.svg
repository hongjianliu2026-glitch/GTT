<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">processor</text>
  <text x="50" y="120" class="subtitle">[ˈproʊsesər] n. 处理器，加工者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + cess (走) + -or (人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"向前走(pro-cess)"的机器，它不停地处理数据，就像一个勤劳的"加工者(processor)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new processor can handle complex calculations in seconds.
  </text>
  <text x="50" y="310" class="content">
    新的处理器可以在几秒钟内处理复杂的计算。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Processor chip -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Data lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Processing symbol -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="155" y1="150" x2="195" y2="150" class="image" />
  </g>
</svg>