<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">resurrection</text>
  <text x="50" y="120" class="subtitle">[ˌrɛzəˈrɛkʃən] n. 复活，复兴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + surrect (升起) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个已经倒下的英雄，"再次升起(re-surrect)"，
    <tspan x="50" dy="25">从死亡中复活，象征着希望与重生。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The resurrection of the company after bankruptcy was remarkable.
  </text>
  <text x="50" y="310" class="content">
    公司在破产后复活，这一过程令人瞩目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tombstone -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Cross on tombstone -->
    <line x1="75" y1="20" x2="75" y2="180" class="image" />
    <line x1="25" y1="100" x2="125" y2="100" class="image" />
    <!-- Rising figure -->
    <circle cx="225" cy="150" r="30" class="image" />
    <line x1="225" y1="180" x2="225" y2="250" class="image" />
    <line x1="225" y1="250" x2="195" y2="300" class="image" />
    <line x1="225" y1="250" x2="255" y2="300" class="image" />
    <line x1="225" y1="220" x2="275" y2="200" class="image" />
    <line x1="225" y1="220" x2="175" y2="200" class="image" />
    <!-- Sunlight -->
    <line x1="300" y1="50" x2="350" y2="100" class="image" />
    <line x1="300" y1="50" x2="250" y2="100" class="image" />
    <line x1="300" y1="50" x2="300" y2="100" class="image" />
  </g>
</svg>