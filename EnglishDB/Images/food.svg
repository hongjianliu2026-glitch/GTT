<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">food</text>
  <text x="50" y="120" class="subtitle">[fuːd] n. 食物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "fode"，意为"食物"
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个饥饿的人，"吃下(food)"
    <tspan x="50" dy="25">美味的食物，瞬间恢复了活力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prepared a variety of foods for the party.
  </text>
  <text x="50" y="310" class="content">
    她为派对准备了许多种类的食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Plate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Food items -->
    <circle cx="50" cy="100" r="30" class="image" fill="#F39C12" /> <!-- Orange -->
    <rect x="100" y="70" width="60" height="60" class="image" fill="#27AE60" /> <!-- Broccoli -->
    <rect x="180" y="70" width="60" height="60" class="image" fill="#E67E22" /> <!-- Carrot -->
    <circle cx="260" cy="100" r="30" class="image" fill="#3498DB" /> <!-- Blueberry -->
    <!-- Person -->
    <circle cx="20" cy="180" r="15" class="image" />
    <line x1="20" y1="195" x2="20" y2="230" class="image" />
    <line x1="20" y1="230" x2="0" y2="260" class="image" />
    <line x1="20" y1="230" x2="40" y2="260" class="image" />
    <line x1="20" y1="210" x2="50" y2="200" class="image" />
  </g>
</svg>