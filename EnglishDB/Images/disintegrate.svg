<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disintegrate</text>
  <text x="50" y="120" class="subtitle">[dɪsˈɪntɪɡreɪt] v. 分解，瓦解</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + integr (整体) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的积木城堡，突然间"分开(dis-)"
    <tspan x="50" dy="25">成了一堆散落的积木，"整体(integr)"不复存在，</tspan>
    <tspan x="50" dy="25">这就是"分解(disintegrate)"的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old building disintegrated over time.
  </text>
  <text x="50" y="310" class="content">
    那座旧建筑随着时间的推移逐渐瓦解。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Castle blocks -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <rect x="50" y="90" width="50" height="50" class="image" />
    <rect x="120" y="90" width="50" height="50" class="image" />
    <rect x="190" y="90" width="50" height="50" class="image" />
    <!-- Falling blocks -->
    <rect x="260" y="20" width="50" height="50" class="image" />
    <rect x="260" y="90" width="50" height="50" class="image" />
    <rect x="260" y="160" width="50" height="50" class="image" />
  </g>
</svg>