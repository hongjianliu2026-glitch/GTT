<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">matte</text>
  <text x="50" y="120" class="subtitle">[mæt] adj. 无光泽的，暗淡的；n. 无光泽的表面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mat (来自拉丁语 "mattus"，意为“平滑的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家在画布上涂抹，"平滑的(mat)"
    <tspan x="50" dy="25">颜料覆盖了整个表面，形成了一个无光泽的(matte)画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The painting had a matte finish, giving it a soft, velvety look.
  </text>
  <text x="50" y="310" class="content">
    这幅画的表面是无光泽的，给人一种柔软天鹅绒般的感觉。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canvas -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Paintbrush -->
    <line x1="50" y1="20" x2="100" y2="180" class="image" />
    <circle cx="50" cy="20" r="10" class="image" />
    <!-- Paint splatter -->
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="120" r="10" class="image" />
    <circle cx="250" cy="80" r="12" class="image" />
    <!-- Artist -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>