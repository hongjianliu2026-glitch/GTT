<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soybean</text>
  <text x="50" y="120" class="subtitle">[ˈsɔɪbiːn] n. 大豆</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soy (大豆) + bean (豆)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的豆荚，里面装满了"大豆(soy)"，
    <tspan x="50" dy="25">每一颗豆子都饱满圆润，这就是大豆(soybean)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Soybean is a major source of protein in many diets.
  </text>
  <text x="50" y="310" class="content">
    大豆是许多饮食中蛋白质的主要来源。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pod -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Soybeans -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
  </g>
</svg>