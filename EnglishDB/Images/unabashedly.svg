<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unabashedly</text>
  <text x="50" y="120" class="subtitle">[ˌʌnəˈbæʃtli] adv. 不害羞地，无耻地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + abashed (害羞的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在众人面前，"毫不害羞地(un-abashedly)"
    <tspan x="50" dy="25">展示自己的才华，完全不在乎别人的眼光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She unabashedly sang her favorite song in front of the crowd.
  </text>
  <text x="50" y="310" class="content">
    她毫不害羞地在人群前唱起了她最喜欢的歌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="20" y2="130" class="image" />
    <line x1="50" y1="150" x2="80" y2="130" class="image" />
    <!-- Microphone -->
    <line x1="50" y1="100" x2="50" y2="50" class="image" />
    <circle cx="50" cy="40" r="10" class="image" />
    <!-- Crowd -->
    <circle cx="150" cy="100" r="20" class="image" />
    <circle cx="200" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <circle cx="300" cy="100" r="20" class="image" />
  </g>
</svg>