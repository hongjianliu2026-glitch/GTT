<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">regional</text>
  <text x="50" y="120" class="subtitle">[ˈriːdʒənl] adj. 地区的，区域的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> reg (统治) + -ion (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个国王站在地图前，"统治(reg)"
    <tspan x="50" dy="25">着他的领土，这片领土就是他的"地区(regional)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The regional government is responsible for local affairs.
  </text>
  <text x="50" y="310" class="content">
    地区政府负责当地事务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- King -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Crown -->
    <polygon points="40,80 60,80 70,90 50,100 30,90" class="image" />
    <!-- Territory -->
    <rect x="100" y="20" width="200" height="160" class="image" />
    <line x1="120" y1="40" x2="280" y2="40" class="image" />
    <line x1="120" y1="70" x2="250" y2="70" class="image" />
    <line x1="120" y1="100" x2="270" y2="100" class="image" />
    <line x1="120" y1="130" x2="240" y2="130" class="image" />
  </g>
</svg>