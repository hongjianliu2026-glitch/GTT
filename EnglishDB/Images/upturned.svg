<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">upturned</text>
  <text x="50" y="120" class="subtitle">[ʌpˈtɜːrnd] adj. 翻转的，朝上的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + turn (转动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个杯子被"向上转动(up-turn)"，
    <tspan x="50" dy="25">杯底朝天，水洒了出来，这就是翻转的(upturned)状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The upturned boat was floating in the river.
  </text>
  <text x="50" y="310" class="content">
    翻转的小船在河上漂浮。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cup -->
    <rect x="50" y="20" width="100" height="100" class="image" />
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="20" x2="50" y2="120" class="image" />
    <line x1="100" y1="20" x2="100" y2="120" class="image" />
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <!-- Water spill -->
    <polyline points="50,120 75,150 100,120" class="image" />
    <polyline points="50,120 75,140 100,120" class="image" />
    <polyline points="50,120 75,130 100,120" class="image" />
  </g>
</svg>