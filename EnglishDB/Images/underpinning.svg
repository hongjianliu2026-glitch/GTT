<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underpinning</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈpɪnɪŋ] n. 基础，支撑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在下面) + pin (钉) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高楼，"在下面钉(under-pin)"
    <tspan x="50" dy="25">着支撑的柱子，这些柱子就是高楼的基础(underpinning)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The underpinning of this theory is based on extensive research.
  </text>
  <text x="50" y="310" class="content">
    这个理论的基础是基于广泛的研究。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Pillars -->
    <line x1="70" y1="20" x2="70" y2="180" class="image" />
    <line x1="170" y1="20" x2="170" y2="180" class="image" />
    <line x1="270" y1="20" x2="270" y2="180" class="image" />
    <!-- Nails -->
    <circle cx="70" cy="10" r="5" class="image" />
    <circle cx="170" cy="10" r="5" class="image" />
    <circle cx="270" cy="10" r="5" class="image" />
  </g>
</svg>