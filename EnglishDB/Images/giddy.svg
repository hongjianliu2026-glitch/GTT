<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">giddy</text>
  <text x="50" y="120" class="subtitle">[ˈɡɪdi] adj. 头晕的，眼花缭乱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gid (旋转) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在旋转木马上，"旋转(gid)"
    <tspan x="50" dy="25">得头晕目眩，感到眼花缭乱(giddy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The merry-go-round made her feel giddy.
  </text>
  <text x="50" y="310" class="content">
    旋转木马让她感到头晕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Merry-go-round -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- Horse -->
    <rect x="120" y="20" width="50" height="60" class="image" />
    <line x1="145" y1="20" x2="145" y2="0" class="image" />
    <line x1="120" y1="50" x2="100" y2="70" class="image" />
    <line x1="170" y1="50" x2="190" y2="70" class="image" />
    <!-- Person -->
    <circle cx="175" cy="180" r="15" class="image" />
    <line x1="175" y1="195" x2="175" y2="230" class="image" />
    <line x1="175" y1="230" x2="155" y2="260" class="image" />
    <line x1="175" y1="230" x2="195" y2="260" class="image" />
    <line x1="175" y1="210" x2="205" y2="200" class="image" />
  </g>
</svg>