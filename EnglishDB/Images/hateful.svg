<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hateful</text>
  <text x="50" y="120" class="subtitle">[ˈheɪtfəl] adj. 可恨的，充满仇恨的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hate (恨) + -ful (充满...)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人心中充满了"恨(hate)"，
    <tspan x="50" dy="25">他的表情扭曲，眼神充满仇恨，这就是"充满恨的(hateful)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hateful words he spoke hurt her deeply.
  </text>
  <text x="50" y="310" class="content">
    他说的那些充满仇恨的话深深地伤害了她。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="90" y1="130" x2="110" y2="130" class="image" />
    <line x1="100" y1="140" x2="100" y2="140" class="image" />
    <!-- Crossed eyes -->
    <line x1="80" y1="90" x2="120" y2="110" class="image" />
    <line x1="120" y1="90" x2="80" y2="110" class="image" />
    <!-- Mouth -->
    <path d="M70,150 Q100,170 130,150" class="image" />
  </g>
</svg>