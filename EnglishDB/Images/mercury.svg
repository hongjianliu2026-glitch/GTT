<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mercury</text>
  <text x="50" y="120" class="subtitle">[ˈmɜːrkjəri] n. 水银，汞；墨丘利（罗马神话中的信使神）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mercur- (墨丘利，罗马神话中的信使神)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象墨丘利神手持一根魔杖，魔杖顶端滴下
    <tspan x="50" dy="25">闪闪发光的水银，象征着信息的快速传递和流动性。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thermometer uses mercury to measure temperature.
  </text>
  <text x="50" y="310" class="content">
    温度计使用水银来测量温度。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mercury droplet -->
    <circle cx="100" cy="100" r="30" fill="#C0C0C0" />
    <!-- Mercury droplet reflection -->
    <circle cx="100" cy="100" r="25" fill="#D3D3D3" />
    <!-- Mercury droplet highlight -->
    <circle cx="110" cy="90" r="10" fill="#E0E0E0" />

    <!-- Winged helmet -->
    <path d="M150,50 Q170,30 190,50 T230,50" stroke="#7F8C8D" stroke-width="2" fill="none" />
    <path d="M150,50 Q170,70 190,50 T230,50" stroke="#7F8C8D" stroke-width="2" fill="none" />
    <circle cx="170" cy="50" r="10" fill="#7F8C8D" />

    <!-- Staff -->
    <line x1="170" y1="60" x2="170" y2="150" stroke="#7F8C8D" stroke-width="2" />
    <circle cx="170" cy="150" r="10" fill="#7F8C8D" />
  </g>
</svg>