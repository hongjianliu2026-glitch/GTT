<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ceremony</text>
  <text x="50" y="120" class="subtitle">[ˈsɛrəˌmoʊni] n. 仪式，典礼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cerem (神圣) + -ony (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象在一个神圣的仪式上，人们穿着华丽的服装，
    <tspan x="50" dy="25">举行庄重的典礼，这就是ceremony(仪式)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wedding ceremony was held in the grand hall.
  </text>
  <text x="50" y="310" class="content">
    婚礼仪式在大厅里举行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <!-- Clothing -->
    <line x1="40" y1="65" x2="60" y2="65" class="image" />
    <line x1="90" y1="65" x2="110" y2="65" class="image" />
    <line x1="140" y1="65" x2="160" y2="65" class="image" />
    <!-- Ceremony items -->
    <rect x="200" y="20" width="50" height="50" class="image" />
    <rect x="270" y="20" width="50" height="50" class="image" />
  </g>
</svg>