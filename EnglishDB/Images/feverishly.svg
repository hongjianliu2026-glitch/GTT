<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">feverishly</text>
  <text x="50" y="120" class="subtitle">[ˈfiːvərɪʃli] adv. 狂热地，兴奋地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fever (发烧) + -ish (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为发烧而满脸通红，"狂热地(feverishly)"
    <tspan x="50" dy="25">在房间里走来走去，仿佛被某种激情所驱使。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She worked feverishly to finish the project on time.
  </text>
  <text x="50" y="310" class="content">
    她狂热地工作，以按时完成项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with fever -->
    <circle cx="50" cy="100" r="30" class="image" fill="#FF6347" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="230" class="image" />
    <line x1="50" y1="200" x2="80" y2="230" class="image" />
    <!-- Room -->
    <rect x="0" y="250" width="100" height="50" class="image" />
    <line x1="20" y1="270" x2="80" y2="270" class="image" />
    <line x1="20" y1="290" x2="80" y2="290" class="image" />
    <line x1="20" y1="310" x2="80" y2="310" class="image" />
  </g>
</svg>