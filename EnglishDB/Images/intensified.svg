<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intensified</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtensɪfaɪd] v. 加强，加剧</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> intens (加强) + -ify (使) + -ed (过去分词)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个火焰在燃烧，"使(ify)"
    <tspan x="50" dy="25">火焰"加强(intens)"，火焰变得更加猛烈(intensified)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heat intensified as the sun rose higher.
  </text>
  <text x="50" y="310" class="content">
    随着太阳升得更高，热度加剧了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flame -->
    <polygon points="0,100 50,0 100,100" class="image" fill="#FF6347" />
    <polygon points="25,75 75,75 50,50" class="image" fill="#FF4500" />
    <polygon points="40,60 60,60 50,40" class="image" fill="#FF8C00" />
    <!-- Intensified flame -->
    <polygon points="150,100 200,0 250,100" class="image" fill="#FF6347" />
    <polygon points="175,75 225,75 200,50" class="image" fill="#FF4500" />
    <polygon points="190,60 210,60 200,40" class="image" fill="#FF8C00" />
    <polygon points="180,80 220,80 200,60" class="image" fill="#FF8C00" />
    <polygon points="195,70 205,70 200,55" class="image" fill="#FF8C00" />
  </g>
</svg>