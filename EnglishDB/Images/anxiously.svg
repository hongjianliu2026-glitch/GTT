<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anxiously</text>
  <text x="50" y="120" class="subtitle">[ˈæŋkʃəsli] adv. 焦虑地，不安地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anx (痛苦) + ious (形容词后缀) + ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在等待重要消息时，"痛苦地(anx)"
    <tspan x="50" dy="25">来回踱步，脸上写满了焦虑(anxiously)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She waited anxiously for the test results.
  </text>
  <text x="50" y="310" class="content">
    她焦虑地等待着考试结果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person pacing -->
    <line x1="50" y1="50" x2="150" y2="50" class="image" />
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="50" y2="50" class="image" />
    <!-- Anxious face -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="80" y1="90" x2="120" y2="90" class="image" />
    <line x1="90" y1="110" x2="110" y2="110" class="image" />
    <line x1="100" y1="120" x2="100" y2="130" class="image" />
  </g>
</svg>