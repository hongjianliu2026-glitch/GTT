<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chew</text>
  <text x="50" y="120" class="subtitle">[tʃuː] v. 咀嚼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chew (源自中古英语，意为咀嚼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小动物在"咀嚼(chew)"
    <tspan x="50" dy="25">一块美味的骨头，它的牙齿不停地上下移动，</tspan>
    <tspan x="50" dy="25">享受着咀嚼的乐趣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She likes to chew gum while studying.
  </text>
  <text x="50" y="310" class="content">
    她喜欢在学习时嚼口香糖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bone -->
    <rect x="50" y="20" width="200" height="20" class="image" />
    <!-- Teeth marks -->
    <line x1="70" y1="20" x2="70" y2="40" class="image" />
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
    <line x1="130" y1="20" x2="130" y2="40" class="image" />
    <line x1="160" y1="20" x2="160" y2="40" class="image" />
    <line x1="190" y1="20" x2="190" y2="40" class="image" />
    <!-- Animal head -->
    <circle cx="20" cy="30" r="20" class="image" />
    <line x1="20" y1="50" x2="20" y2="70" class="image" />
    <line x1="20" y1="70" x2="0" y2="100" class="image" />
    <line x1="20" y1="70" x2="40" y2="100" class="image" />
    <line x1="20" y1="60" x2="50" y2="50" class="image" />
  </g>
</svg>