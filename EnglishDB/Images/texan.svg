<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Texan</text>
  <text x="50" y="120" class="subtitle">[ˈtɛksən] n. 德克萨斯人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Tex- (德克萨斯) + -an (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着牛仔帽的德克萨斯人，骑着马在广阔的草原上驰骋，
    <tspan x="50" dy="25">他就是典型的"德克萨斯人(Texan)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Texan cowboy showed great hospitality.
  </text>
  <text x="50" y="310" class="content">
    这位德克萨斯牛仔展现了极大的热情好客。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cowboy hat -->
    <path d="M50 50 L100 50 L120 100 L30 100 Z" class="image" />
    <!-- Face -->
    <circle cx="75" cy="120" r="20" class="image" />
    <!-- Body -->
    <line x1="75" y1="140" x2="75" y2="200" class="image" />
    <!-- Legs -->
    <line x1="75" y1="200" x2="50" y2="250" class="image" />
    <line x1="75" y1="200" x2="100" y2="250" class="image" />
    <!-- Horse -->
    <rect x="20" y="250" width="110" height="50" class="image" />
    <!-- Horse legs -->
    <line x1="30" y1="300" x2="30" y2="350" class="image" />
    <line x1="50" y1="300" x2="50" y2="350" class="image" />
    <line x1="80" y1="300" x2="80" y2="350" class="image" />
    <line x1="100" y1="300" x2="100" y2="350" class="image" />
  </g>
</svg>