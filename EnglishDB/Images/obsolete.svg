<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">obsolete</text>
  <text x="50" y="120" class="subtitle">[ˈɑːbsəliːt] adj. 过时的，废弃的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ob- (离开) + sol (使用) + -ete (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的打字机被"离开使用(ob-sol-ete)"，
    <tspan x="50" dy="25">它静静地躺在角落，被现代的电脑所取代。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The typewriter is now obsolete, replaced by computers.
  </text>
  <text x="50" y="310" class="content">
    打字机现在已经过时了，被电脑所取代。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old typewriter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Modern computer -->
    <rect x="100" y="100" width="150" height="100" class="image" />
    <line x1="120" y1="120" x2="230" y2="120" class="image" />
    <line x1="120" y1="150" x2="200" y2="150" class="image" />
    <line x1="120" y1="180" x2="220" y2="180" class="image" />
  </g>
</svg>