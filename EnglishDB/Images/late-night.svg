<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #666666; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">late-night</text>
  <text x="50" y="120" class="subtitle">[ˈleɪtˈnaɪt] adj. 深夜的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> late (晚的) + night (夜晚)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个深夜，月亮高挂，星星闪烁，
    <tspan x="50" dy="25">人们都已入睡，只有少数人在熬夜工作或娱乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She often works late-night on her projects.
  </text>
  <text x="50" y="310" class="content">
    她经常在深夜做她的项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="100" r="50" class="image" fill="#FFD700" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="5" class="image" fill="#FFFFFF" />
    <circle cx="150" cy="50" r="5" class="image" fill="#FFFFFF" />
    <circle cx="200" cy="100" r="5" class="image" fill="#FFFFFF" />
    <circle cx="250" cy="150" r="5" class="image" fill="#FFFFFF" />
    <!-- Person -->
    <circle cx="100" cy="200" r="15" class="image" fill="#7F8C8D" />
    <line x1="100" y1="215" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="280" class="image" />
    <line x1="100" y1="250" x2="120" y2="280" class="image" />
    <line x1="100" y1="230" x2="130" y2="220" class="image" />
    <!-- Computer screen -->
    <rect x="50" y="280" width="100" height="60" class="image" />
    <!-- Code lines -->
    <line x1="60" y1="300" x2="140" y2="300" class="image" />
    <line x1="60" y1="320" x2="130" y2="320" class="image" />
  </g>
</svg>