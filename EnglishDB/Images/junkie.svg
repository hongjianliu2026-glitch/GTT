<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">junkie</text>
  <text x="50" y="120" class="subtitle">[ˈdʒʌŋki] n. 瘾君子，对某事物上瘾的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> junk (废弃物) + -ie (表示“人”的后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个对某种事物上瘾的人，就像一个"废弃物(junk)"的"人(ie)"，
    <tspan x="50" dy="25">他沉迷于某种东西，无法自拔，就像被废弃物缠身一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He became a coffee junkie after working at the startup.
  </text>
  <text x="50" y="310" class="content">
    他在创业公司工作后变成了一个咖啡瘾君子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Junkie -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Junk -->
    <rect x="50" y="80" width="30" height="30" class="image" />
    <rect x="80" y="80" width="30" height="30" class="image" />
    <rect x="110" y="80" width="30" height="30" class="image" />
    <rect x="140" y="80" width="30" height="30" class="image" />
    <!-- Addiction -->
    <line x1="20" y1="150" x2="150" y2="150" class="image" />
    <line x1="20" y1="150" x2="150" y2="150" class="image" />
    <line x1="20" y1="150" x2="150" y2="150" class="image" />
  </g>
</svg>