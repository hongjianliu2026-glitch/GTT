<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">multiple</text>
  <text x="50" y="120" class="subtitle">[ˈmʌltɪpl] adj. 多个的，多重的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> multi- (多) + ple (倍)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师变出"多个(multi-)"
    <tspan x="50" dy="25">相同的物体，这些物体倍增(ple)，</tspan>
    <tspan x="50" dy="25">形成了多个(multiple)的景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The problem has multiple solutions.
  </text>
  <text x="50" y="310" class="content">
    这个问题有多个解决方案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Multiple objects -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="120" cy="50" r="20" class="image" />
    <circle cx="190" cy="50" r="20" class="image" />
    <circle cx="260" cy="50" r="20" class="image" />
    <!-- Magician -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="200" class="image" />
    <line x1="20" y1="200" x2="0" y2="230" class="image" />
    <line x1="20" y1="200" x2="40" y2="230" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
    <!-- Magic wand -->
    <line x1="20" y1="165" x2="100" y2="50" class="image" />
  </g>
</svg>