<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">twig</text>
  <text x="50" y="120" class="subtitle">[twɪɡ] n. 小枝，嫩枝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> twig (源自中古英语 twigge，意为“小枝”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小鸟在树枝上跳跃，"啄食(twig)"
    <tspan x="50" dy="25">那些嫩嫩的小枝，画面生动有趣。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bird perched on a twig and sang a sweet melody.
  </text>
  <text x="50" y="310" class="content">
    小鸟停在一根小枝上，唱起了甜美的旋律。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tree branch -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Twigs -->
    <line x1="50" y1="0" x2="50" y2="50" class="image" />
    <line x1="100" y1="0" x2="100" y2="70" class="image" />
    <line x1="150" y1="0" x2="150" y2="60" class="image" />
    <line x1="200" y1="0" x2="200" y2="40" class="image" />
    <line x1="250" y1="0" x2="250" y2="30" class="image" />
    <!-- Bird -->
    <circle cx="300" cy="20" r="15" class="image" />
    <line x1="300" y1="35" x2="300" y2="60" class="image" />
    <line x1="300" y1="60" x2="280" y2="90" class="image" />
    <line x1="300" y1="60" x2="320" y2="90" class="image" />
    <line x1="300" y1="45" x2="330" y2="35" class="image" />
  </g>
</svg>