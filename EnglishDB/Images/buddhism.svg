<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Buddhism</text>
  <text x="50" y="120" class="subtitle">[ˈbʊdɪzəm] n. 佛教</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Buddha (佛陀) + -ism (主义)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个佛陀坐在莲花上，"佛陀的教义(Buddha-ism)"
    <tspan x="50" dy="25">传播开来，形成了佛教(Buddhism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Buddhism is one of the major religions in the world.
  </text>
  <text x="50" y="310" class="content">
    佛教是世界上主要的宗教之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lotus flower -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="120" cy="80" r="20" class="image" />
    <circle cx="80" cy="80" r="20" class="image" />
    <circle cx="140" cy="100" r="20" class="image" />
    <circle cx="60" cy="100" r="20" class="image" />
    <circle cx="120" cy="120" r="20" class="image" />
    <circle cx="80" cy="120" r="20" class="image" />
    <!-- Buddha -->
    <circle cx="100" cy="150" r="30" class="image" />
    <line x1="100" y1="180" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="200" x2="130" y2="190" class="image" />
    <line x1="100" y1="200" x2="70" y2="190" class="image" />
  </g>
</svg>