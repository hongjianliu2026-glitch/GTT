<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">procedure</text>
  <text x="50" y="120" class="subtitle">[prəˈsiːdʒər] n. 程序，步骤，手续</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + ced (走) + ure (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机器人按照"向前走(pro-ced)"的步骤，
    <tspan x="50" dy="25">一步一步地完成任务，这些步骤就构成了一个程序(procedure)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The procedure for applying for a visa is quite complicated.
  </text>
  <text x="50" y="310" class="content">
    申请签证的程序相当复杂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Steps -->
    <rect x="120" y="80" width="30" height="30" class="image" />
    <rect x="160" y="80" width="30" height="30" class="image" />
    <rect x="200" y="80" width="30" height="30" class="image" />
    <rect x="240" y="80" width="30" height="30" class="image" />
    <!-- Arrows -->
    <line x1="150" y1="100" x2="190" y2="100" class="image" />
    <line x1="190" y1="100" x2="170" y2="80" class="image" />
    <line x1="190" y1="100" x2="170" y2="120" class="image" />
  </g>
</svg>