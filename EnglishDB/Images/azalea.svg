<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">azalea</text>
  <text x="50" y="120" class="subtitle">[əˈzeɪliə] n. 杜鹃花</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aza (来自希腊语，意为“干旱”) + lea (草地)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片干旱的草地(aza-lea)上，
    <tspan x="50" dy="25">突然绽放出鲜艳的杜鹃花(azalea)，</tspan>
    <tspan x="50" dy="25">给这片土地带来了生机和色彩。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The garden was filled with blooming azaleas.
  </text>
  <text x="50" y="310" class="content">
    花园里开满了盛开的杜鹃花。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dry grassland -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Azalea flowers -->
    <circle cx="100" cy="100" r="20" fill="#E74C3C" />
    <circle cx="150" cy="100" r="20" fill="#E74C3C" />
    <circle cx="200" cy="100" r="20" fill="#E74C3C" />
    <circle cx="250" cy="100" r="20" fill="#E74C3C" />
    <circle cx="300" cy="100" r="20" fill="#E74C3C" />
  </g>
</svg>