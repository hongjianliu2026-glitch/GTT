<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">subgroup</text>
  <text x="50" y="120" class="subtitle">[ˈsʌbɡruːp] n. 子群，小组</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + group (群)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个大群(group)中，有一个小群(sub-group)
    <tspan x="50" dy="25">在下面悄悄地聚集，就像一群小鸟在树下聚集。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The subgroup discussed the project in detail.
  </text>
  <text x="50" y="310" class="content">
    小组详细讨论了项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large group -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="150" cy="100" r="50" class="image" />
    <circle cx="200" cy="100" r="50" class="image" />
    <circle cx="250" cy="100" r="50" class="image" />
    <!-- Subgroup -->
    <circle cx="125" cy="150" r="20" class="image" />
    <circle cx="175" cy="150" r="20" class="image" />
    <circle cx="225" cy="150" r="20" class="image" />
    <!-- Tree -->
    <line x1="100" y1="0" x2="100" y2="100" class="image" />
    <line x1="150" y1="0" x2="150" y2="100" class="image" />
    <line x1="200" y1="0" x2="200" y2="100" class="image" />
    <line x1="250" y1="0" x2="250" y2="100" class="image" />
  </g>
</svg>