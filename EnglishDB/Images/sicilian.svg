<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Sicilian</text>
  <text x="50" y="120" class="subtitle">[sɪˈsɪliən] adj. 西西里岛的；n. 西西里人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Sicil (西西里岛) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个西西里岛的居民，站在阳光明媚的
    <tspan x="50" dy="25">海滩上，手里拿着一个巨大的柠檬，脸上洋溢着</tspan>
    <tspan x="50" dy="25">热情的笑容。这就是西西里岛的象征，热情与</tspan>
    <tspan x="50" dy="25">阳光的结合，让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The Sicilian cuisine is famous for its rich flavors.
  </text>
  <text x="50" y="330" class="content">
    西西里岛的菜肴以其丰富的味道而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Beach -->
    <rect x="0" y="150" width="350" height="100" fill="#F4D03F" />
    <!-- Person -->
    <circle cx="100" cy="180" r="20" fill="#2C3E50" />
    <line x1="100" y1="200" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="280" class="image" />
    <line x1="100" y1="250" x2="120" y2="280" class="image" />
    <line x1="100" y1="220" x2="130" y2="210" class="image" />
    <!-- Lemon -->
    <circle cx="150" cy="180" r="30" fill="#F1C40F" />
    <line x1="150" y1="210" x2="150" y2="250" class="image" />
  </g>
</svg>