<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swiftly</text>
  <text x="50" y="120" class="subtitle">[ˈswɪftli] adv. 迅速地，敏捷地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> swift (迅速的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只猎豹在草原上"迅速地(swiftly)"奔跑，
    <tspan x="50" dy="25">它的身影如闪电般掠过，留下一道模糊的轨迹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She moved swiftly across the room to catch the falling vase.
  </text>
  <text x="50" y="310" class="content">
    她迅速地穿过房间去接住掉落的花瓶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Cheetah -->
    <line x1="50" y1="150" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="150" class="image" />
    <!-- Tail -->
    <line x1="250" y1="150" x2="300" y2="100" class="image" />
    <!-- Head -->
    <circle cx="50" cy="150" r="10" class="image" />
    <!-- Speed lines -->
    <line x1="70" y1="140" x2="80" y2="130" class="image" />
    <line x1="80" y1="130" x2="90" y2="120" class="image" />
    <line x1="90" y1="120" x2="100" y2="110" class="image" />
    <line x1="100" y1="110" x2="110" y2="100" class="image" />
  </g>
</svg>