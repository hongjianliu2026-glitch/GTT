<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slalom</text>
  <text x="50" y="120" class="subtitle">[ˈslɑːləm] n. 障碍滑雪赛</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sl- (滑) + al (向) + om (移动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个滑雪者在雪地上"滑向(sl-al-om)"
    <tspan x="50" dy="25">一系列障碍，灵活地避开它们，这就是障碍滑雪赛(slalom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He won the slalom race at the winter Olympics.
  </text>
  <text x="50" y="310" class="content">
    他在冬奥会的障碍滑雪赛中获胜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skiier -->
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="100" y2="100" class="image" />
    <line x1="150" y1="150" x2="100" y2="200" class="image" />
    <!-- Obstacles -->
    <rect x="200" y="100" width="20" height="100" class="image" />
    <rect x="250" y="120" width="20" height="80" class="image" />
    <rect x="300" y="140" width="20" height="60" class="image" />
    <!-- Snow -->
    <line x1="0" y1="250" x2="400" y2="250" class="image" />
    <line x1="0" y1="260" x2="400" y2="260" class="image" />
    <line x1="0" y1="270" x2="400" y2="270" class="image" />
  </g>
</svg>