<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">variety</text>
  <text x="50" y="120" class="subtitle">[vəˈraɪəti] n. 多样性，种类</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vari (变化) + -ety (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的调色板，上面有各种颜色，"变化(vari)"
    <tspan x="50" dy="25">无穷无尽，这就是多样性(variety)的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store offers a wide variety of fruits.
  </text>
  <text x="50" y="310" class="content">
    这家商店提供各种各样的水果。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Palette -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Colors -->
    <circle cx="50" cy="50" r="20" fill="#FF5733" />
    <circle cx="120" cy="50" r="20" fill="#33FF57" />
    <circle cx="190" cy="50" r="20" fill="#3357FF" />
    <circle cx="260" cy="50" r="20" fill="#FF33A6" />
    <circle cx="330" cy="50" r="20" fill="#A633FF" />
    <!-- Variety text -->
    <text x="150" y="150" class="content" fill="#2C3E50">Variety</text>
  </g>
</svg>