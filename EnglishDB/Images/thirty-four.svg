<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thirty-four</text>
  <text x="50" y="120" class="subtitle">[ˈθɜːrti-fɔːr] n. 三十四</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thirty (三十) + four (四)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“34”漂浮在空中，
    <tspan x="50" dy="25">像一个巨大的气球，上面写着“三十四”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> There are thirty-four students in the class.
  </text>
  <text x="50" y="310" class="content">
    班里有三十四个学生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number "34" -->
    <text x="50" y="100" font-size="150" fill="#E74C3C">34</text>
    <!-- Balloon -->
    <circle cx="125" cy="150" r="50" fill="#F1C40F" />
    <line x1="125" y1="200" x2="125" y2="300" stroke="#7F8C8D" stroke-width="2" />
    <line x1="125" y1="300" x2="100" y2="350" stroke="#7F8C8D" stroke-width="2" />
    <line x1="125" y1="300" x2="150" y2="350" stroke="#7F8C8D" stroke-width="2" />
  </g>
</svg>