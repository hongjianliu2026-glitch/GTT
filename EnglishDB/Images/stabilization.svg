<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stabilization</text>
  <text x="50" y="120" class="subtitle">[ˌsteɪbələˈzeɪʃn] n. 稳定化，安定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sta- (站立) + -bil (能够) + -ize (使动) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个不稳定的物体，通过"使能够站立(sta-bil-ize)"
    <tspan x="50" dy="25">的过程，最终变得稳定(stabilization)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stabilization of the economy was a top priority.
  </text>
  <text x="50" y="310" class="content">
    经济的稳定化是首要任务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Unstable object -->
    <rect x="0" y="0" width="100" height="100" class="image" transform="rotate(10,50,50)" />
    <!-- Stable object -->
    <rect x="150" y="0" width="100" height="100" class="image" />
    <!-- Arrow -->
    <line x1="100" y1="50" x2="150" y2="50" class="image" />
    <polygon points="145,45 155,50 145,55" class="image" />
    <!-- Labels -->
    <text x="20" y="120" class="content">不稳定</text>
    <text x="170" y="120" class="content">稳定</text>
  </g>
</svg>