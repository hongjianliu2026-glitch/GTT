<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lid</text>
  <text x="50" y="120" class="subtitle">[lɪd] n. 盖子，眼睑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lid (盖子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的盖子(lid)，它不仅能盖住一个罐子，
    <tspan x="50" dy="25">还能盖住整个城市，防止雨水进入。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carefully placed the lid on the jar.
  </text>
  <text x="50" y="310" class="content">
    她小心地把盖子放在罐子上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large lid -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Jar -->
    <rect x="100" y="50" width="150" height="150" class="image" />
    <!-- Rain drops -->
    <line x1="50" y1="10" x2="50" y2="20" class="image" />
    <line x1="70" y1="10" x2="70" y2="20" class="image" />
    <line x1="90" y1="10" x2="90" y2="20" class="image" />
    <line x1="110" y1="10" x2="110" y2="20" class="image" />
    <line x1="130" y1="10" x2="130" y2="20" class="image" />
  </g>
</svg>