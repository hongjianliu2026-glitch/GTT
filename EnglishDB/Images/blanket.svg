<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .blanket { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blanket</text>
  <text x="50" y="120" class="subtitle">[ˈblæŋkɪt] n. 毯子，覆盖物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> blank (空白) + -et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"空白(blank)"毯子，它覆盖了整个房间，
    <tspan x="50" dy="25">就像一张温暖的毯子(blanket)，保护你免受寒冷。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wrapped herself in a blanket to stay warm.
  </text>
  <text x="50" y="310" class="content">
    她用毯子裹住自己以保暖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Blanket -->
    <rect x="0" y="0" width="350" height="200" class="blanket" />
    <!-- Person under the blanket -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="180" x2="145" y2="210" class="image" />
    <line x1="175" y1="180" x2="205" y2="210" class="image" />
    <line x1="175" y1="150" x2="225" y2="140" class="image" />
  </g>
</svg>