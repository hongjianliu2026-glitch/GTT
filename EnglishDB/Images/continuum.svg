<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">continuum</text>
  <text x="50" y="120" class="subtitle">[kənˈtɪnjuəm] n. 连续统一体，连续体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + tinu (保持) + -um (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条无限延伸的线，"保持在一起(con-tinu)"
    <tspan x="50" dy="25">形成一个连续的统一体(continuum)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The universe is often described as a continuum of space and time.
  </text>
  <text x="50" y="310" class="content">
    宇宙通常被描述为空间和时间的连续统一体。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Continuum line -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Dots representing continuity -->
    <circle cx="50" cy="100" r="5" class="image" />
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="150" cy="100" r="5" class="image" />
    <circle cx="200" cy="100" r="5" class="image" />
    <circle cx="250" cy="100" r="5" class="image" />
    <circle cx="300" cy="100" r="5" class="image" />
    <!-- Arrows indicating infinite extension -->
    <line x1="0" y1="100" x2="20" y2="80" class="image" />
    <line x1="0" y1="100" x2="20" y2="120" class="image" />
    <line x1="350" y1="100" x2="330" y2="80" class="image" />
    <line x1="350" y1="100" x2="330" y2="120" class="image" />
  </g>
</svg>