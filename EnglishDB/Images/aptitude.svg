<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aptitude</text>
  <text x="50" y="120" class="subtitle">[ˈæptɪtjuːd] n. 能力，才能</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> apt (适合) + -itude (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个天才少年，"天生适合(apt)"
    <tspan x="50" dy="25">各种挑战，他的才能(aptitude)让人惊叹。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She showed great aptitude for mathematics.
  </text>
  <text x="50" y="310" class="content">
    她在数学方面表现出极大的才能。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="100" y1="170" x2="50" y2="150" class="image" />
    <line x1="100" y1="170" x2="150" y2="150" class="image" />
    <line x1="100" y1="200" x2="50" y2="250" class="image" />
    <line x1="100" y1="200" x2="150" y2="250" class="image" />
    <!-- Lightning bolt -->
    <polyline points="100,50 120,70 80,90 120,110 100,130" class="image" />
    <!-- Star -->
    <polygon points="150,50 160,70 180,75 160,85 170,105 150,90 130,105 140,85 120,75 140,70" class="image" />
  </g>
</svg>