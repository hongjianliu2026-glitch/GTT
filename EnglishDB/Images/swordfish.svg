<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swordfish</text>
  <text x="50" y="120" class="subtitle">[ˈsɔːrdfɪʃ] n. 剑鱼</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sword (剑) + fish (鱼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条鱼，它的鼻子像一把剑(sword)，
    <tspan x="50" dy="25">在海洋中游动，这就是剑鱼(swordfish)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The swordfish is known for its long, sword-like snout.
  </text>
  <text x="50" y="310" class="content">
    剑鱼以其长长的剑状吻部而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fish body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Sword-like snout -->
    <line x1="250" y1="100" x2="350" y2="100" class="image" />
    <!-- Tail fin -->
    <polygon points="50,100 100,70 100,130" class="image" />
    <!-- Eye -->
    <circle cx="100" cy="100" r="10" class="image" />
  </g>
</svg>