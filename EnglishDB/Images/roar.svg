<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">roar</text>
  <text x="50" y="120" class="subtitle">[rɔːr] v. 吼叫，咆哮；n. 吼声，轰鸣声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ro- (吼叫) + ar (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的狮子在草原上，"吼叫(ro-ar)"
    <tspan x="50" dy="25">出震耳欲聋的声音，整个草原都在颤抖。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lion's roar echoed through the jungle.
  </text>
  <text x="50" y="310" class="content">
    狮子的吼声在丛林中回荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion's head -->
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Lion's mane -->
    <circle cx="60" cy="80" r="20" class="image" />
    <circle cx="140" cy="80" r="20" class="image" />
    <circle cx="80" cy="60" r="15" class="image" />
    <circle cx="120" cy="60" r="15" class="image" />
    <!-- Lion's mouth -->
    <path d="M 80 120 Q 100 150 120 120" class="image" />
    <!-- Sound waves -->
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="180" cy="100" r="15" class="image" />
    <circle cx="210" cy="100" r="20" class="image" />
    <circle cx="240" cy="100" r="25" class="image" />
  </g>
</svg>