<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">orbiter</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrbɪtər] n. 轨道飞行器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> orbit (轨道) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太空飞船在宇宙中"绕轨道飞行(orbit-er)"，
    <tspan x="50" dy="25">它像一颗流星一样划过天际，留下一道闪亮的光轨。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The space shuttle orbiter successfully completed its mission.
  </text>
  <text x="50" y="310" class="content">
    航天飞机轨道飞行器成功完成了它的任务。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Space background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#0C343D" />
    <!-- Orbit path -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Spacecraft -->
    <polygon points="100,100 150,80 150,120" class="image" fill="#FFFFFF" />
    <!-- Stars -->
    <circle cx="50" cy="50" r="3" class="image" fill="#FFFFFF" />
    <circle cx="250" cy="30" r="3" class="image" fill="#FFFFFF" />
    <circle cx="300" cy="150" r="3" class="image" fill="#FFFFFF" />
  </g>
</svg>