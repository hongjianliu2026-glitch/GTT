<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">abstraction</text>
  <text x="50" y="120" class="subtitle">[æbˈstrækʃən] n. 抽象，提取</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ab- (离开) + tract (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家从一幅复杂的画中"拉出(tract)"
    <tspan x="50" dy="25">关键元素，形成一个简化的抽象(abstraction)作品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The artist's use of abstraction made the painting more intriguing.
  </text>
  <text x="50" y="310" class="content">
    艺术家使用抽象手法使画作更加引人入胜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Complex painting -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <line x1="20" y1="20" x2="280" y2="20" class="image" />
    <line x1="20" y1="50" x2="250" y2="50" class="image" />
    <line x1="20" y1="80" x2="270" y2="80" class="image" />
    <line x1="20" y1="110" x2="240" y2="110" class="image" />
    <line x1="20" y1="140" x2="260" y2="140" class="image" />
    <line x1="20" y1="170" x2="230" y2="170" class="image" />

    <!-- Abstracted elements -->
    <circle cx="350" cy="100" r="30" class="image" />
    <rect x="400" y="70" width="60" height="60" class="image" />
    <line x1="480" y1="70" x2="480" y2="130" class="image" />
    <line x1="460" y1="100" x2="500" y2="100" class="image" />

    <!-- Arrows -->
    <line x1="300" y1="100" x2="320" y2="100" class="image" />
    <polygon points="320,90 330,100 320,110" class="image" />
    <line x1="300" y1="130" x2="320" y2="130" class="image" />
    <polygon points="320,120 330,130 320,140" class="image" />
  </g>
</svg>