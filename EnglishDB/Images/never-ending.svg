  <text x="50" y="120" class="subtitle">[ˌnevərˈendɪŋ] adj. 永无止境的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> never (从不) + end (结束) + -ing (形容词后缀)
