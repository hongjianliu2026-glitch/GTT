<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clergy</text>
  <text x="50" y="120" class="subtitle">[ˈklɜːrdʒi] n. 牧师，神职人员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cler (教士) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群穿着黑色长袍的教士，他们手持圣经，
    <tspan x="50" dy="25">站在教堂前，庄严地宣读教义，这就是"教士(cler)"的集合(clergy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clergy played a significant role in the community.
  </text>
  <text x="50" y="310" class="content">
    神职人员在社区中扮演了重要角色。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clergy -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Bible -->
    <rect x="100" y="80" width="50" height="40" class="image" />
    <line x1="100" y1="80" x2="150" y2="80" class="image" />
    <line x1="100" y1="100" x2="150" y2="100" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <!-- More clergy -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
    <!-- Bible -->
    <rect x="250" y="80" width="50" height="40" class="image" />
    <line x1="250" y1="80" x2="300" y2="80" class="image" />
    <line x1="250" y1="100" x2="300" y2="100" class="image" />
    <line x1="250" y1="120" x2="300" y2="120" class="image" />
  </g>
</svg>