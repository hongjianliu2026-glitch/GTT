<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">liberating</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪbəreɪtɪŋ] adj. 解放的，释放的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> liber (自由) + -ate (使动) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个被束缚的人突然获得自由，"释放(liber-ate)"
    <tspan x="50" dy="25">自己，感受到无比的解放(liberating)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news of the victory was liberating for the people.
  </text>
  <text x="50" y="310" class="content">
    胜利的消息对人民来说是解放的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chains -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="70" y1="20" x2="70" y2="180" class="image" />
    <line x1="90" y1="20" x2="90" y2="180" class="image" />
    <!-- Broken chains -->
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <line x1="70" y1="180" x2="90" y2="200" class="image" />
    <!-- Person -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="160" class="image" />
    <line x1="150" y1="160" x2="130" y2="200" class="image" />
    <line x1="150" y1="160" x2="170" y2="200" class="image" />
    <line x1="150" y1="140" x2="190" y2="130" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="30" class="image" fill="#F1C40F" />
    <line x1="250" y1="20" x2="250" y2="80" class="image" />
    <line x1="220" y1="50" x2="280" y2="50" class="image" />
    <line x1="235" y1="35" x2="265" y2="65" class="image" />
    <line x1="235" y1="65" x2="265" y2="35" class="image" />
  </g>
</svg>