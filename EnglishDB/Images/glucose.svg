<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">glucose</text>
  <text x="50" y="120" class="subtitle">[ˈɡluːkoʊs] n. 葡萄糖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> glyco- (甜) + -ose (糖)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的甜甜圈，"甜(glyco-)"
    <tspan x="50" dy="25">味四溢，里面充满了葡萄糖(glucose)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The body converts glucose into energy.
  </text>
  <text x="50" y="310" class="content">
    身体将葡萄糖转化为能量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doughnut -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="100" cy="100" r="60" class="image" />
    <!-- Sugar crystals -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
  </g>
</svg>