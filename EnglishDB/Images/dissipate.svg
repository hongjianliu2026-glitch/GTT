<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dissipate</text>
  <text x="50" y="120" class="subtitle">[ˈdɪsɪpeɪt] v. 消散，驱散</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + sip (喝) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一杯热茶，"分开喝(dis-sip)"
    <tspan x="50" dy="25">每一口都让热气逐渐消散(dissipate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fog dissipated as the sun rose.
  </text>
  <text x="50" y="310" class="content">
    太阳升起时，雾气消散了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tea cup -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="10" y="10" width="130" height="80" class="image" />
    <!-- Steam -->
    <line x1="75" y1="10" x2="75" y2="50" class="image" />
    <line x1="75" y1="50" x2="60" y2="80" class="image" />
    <line x1="75" y1="50" x2="90" y2="80" class="image" />
    <line x1="75" y1="50" x2="50" y2="100" class="image" />
    <line x1="75" y1="50" x2="100" y2="100" class="image" />
  </g>
</svg>