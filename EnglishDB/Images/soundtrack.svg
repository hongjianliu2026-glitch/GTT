<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soundtrack</text>
  <text x="50" y="120" class="subtitle">[ˈsaʊndtræk] n. 电影配乐，原声带</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sound (声音) + track (轨道)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一部电影，"声音(sound)"沿着"轨道(track)"
    <tspan x="50" dy="25">流动，这些声音就构成了电影的配乐(soundtrack)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The soundtrack of the movie added to its emotional impact.
  </text>
  <text x="50" y="310" class="content">
    这部电影的配乐增强了它的情感冲击力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Movie screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sound waves -->
    <path d="M50,100 Q70,50 90,100 T130,100 T170,100 T210,100 T250,100 T290,100 T330,100" class="image" />
    <!-- Speaker -->
    <rect x="150" y="150" width="50" height="30" class="image" />
    <line x1="175" y1="150" x2="175" y2="120" class="image" />
    <line x1="150" y1="165" x2="200" y2="165" class="image" />
  </g>
</svg>