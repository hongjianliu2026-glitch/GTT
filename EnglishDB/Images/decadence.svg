<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decadence</text>
  <text x="50" y="120" class="subtitle">[ˈdɛkədəns] n. 颓废，堕落</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + cad (落下) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个曾经辉煌的帝国，"向下坠落(de-cad-ence)"
    <tspan x="50" dy="25">到颓废和堕落的状态，象征着衰败的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The decadence of the once-great empire was evident in its crumbling architecture.
  </text>
  <text x="50" y="310" class="content">
    曾经伟大的帝国在颓废中，其建筑的崩塌显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broken columns -->
    <line x1="0" y1="0" x2="0" y2="200" class="image" />
    <line x1="50" y1="0" x2="50" y2="150" class="image" />
    <line x1="100" y1="0" x2="100" y2="100" class="image" />
    <line x1="150" y1="0" x2="150" y2="50" class="image" />
    <line x1="200" y1="0" x2="200" y2="0" class="image" />
    <!-- Falling debris -->
    <line x1="20" y1="200" x2="40" y2="220" class="image" />
    <line x1="70" y1="150" x2="90" y2="170" class="image" />
    <line x1="120" y1="100" x2="140" y2="120" class="image" />
    <line x1="170" y1="50" x2="190" y2="70" class="image" />
  </g>
</svg>