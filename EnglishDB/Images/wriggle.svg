<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wriggle</text>
  <text x="50" y="120" class="subtitle">[ˈrɪɡl] v. 扭动，蠕动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wrig (扭动) + -le (反复动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条小蛇在草地上"反复扭动(wrig-le)"，
    <tspan x="50" dy="25">它的身体像波浪一样起伏，这就是wriggle的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The worm wriggled out of the hole.
  </text>
  <text x="50" y="310" class="content">
    那条虫子从洞里扭动着爬了出来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Snake body -->
    <path d="M50,100 C60,80 100,80 110,100 C120,120 160,120 170,100 C180,80 220,80 230,100" class="image" />
    <!-- Snake head -->
    <circle cx="40" cy="100" r="10" class="image" />
    <!-- Snake eyes -->
    <circle cx="35" cy="95" r="2" class="image" />
    <circle cx="45" cy="95" r="2" class="image" />
  </g>
</svg>