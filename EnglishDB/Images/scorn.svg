<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scorn</text>
  <text x="50" y="120" class="subtitle">[skɔːrn] n. 轻蔑，鄙视；v. 轻蔑，鄙视</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (表示加强) + corn (角)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用"加强的角(s-corn)"
    <tspan x="50" dy="25">顶撞别人，表达强烈的轻蔑和鄙视。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She looked at him with scorn.
  </text>
  <text x="50" y="310" class="content">
    她轻蔑地看着他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with horns -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="30" y1="30" x2="10" y2="10" class="image" />
    <line x1="70" y1="30" x2="90" y2="10" class="image" />
    <!-- Person looking down -->
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="120" x2="20" y2="110" class="image" />
    <line x1="50" y1="120" x2="80" y2="110" class="image" />
    <!-- Target of scorn -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="210" class="image" />
    <line x1="200" y1="180" x2="220" y2="210" class="image" />
    <line x1="200" y1="150" x2="170" y2="140" class="image" />
    <line x1="200" y1="150" x2="230" y2="140" class="image" />
  </g>
</svg>