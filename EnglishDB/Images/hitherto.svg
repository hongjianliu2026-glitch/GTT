<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hitherto</text>
  <text x="50" y="120" class="subtitle">[ˌhɪðərˈtuː] adv. 迄今为止</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hither (这里) + to (到)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个时间轴上，"从这里(hither)到目前为止(to)"，
    <tspan x="50" dy="25">表示迄今为止(hitherto)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Hitherto, we have not encountered any problems.
  </text>
  <text x="50" y="310" class="content">
    迄今为止，我们还没有遇到任何问题。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Timeline -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Person on timeline -->
    <circle cx="100" cy="0" r="15" class="image" />
    <!-- Arrow pointing to the right -->
    <line x1="120" y1="0" x2="350" y2="0" class="image" />
    <polygon points="350,0 340,-10 340,10" class="image" />
    <!-- Text labels -->
    <text x="50" y="-20" class="content">hither</text>
    <text x="360" y="-20" class="content">to</text>
  </g>
</svg>