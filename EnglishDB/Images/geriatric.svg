<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">geriatric</text>
  <text x="50" y="120" class="subtitle">[ˌdʒɛrɪˈætrɪk] adj. 老年医学的，老年的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ger (老) + iatric (治疗)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位医生在为一位年长的病人进行治疗，"老(ger)"
    <tspan x="50" dy="25">年人的治疗(iatric)就是老年医学(geriatric)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hospital has a special geriatric ward.
  </text>
  <text x="50" y="310" class="content">
    这家医院有一个专门的老年病房。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Doctor -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Elderly patient -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="100" y1="160" x2="80" y2="190" class="image" />
    <line x1="100" y1="160" x2="120" y2="190" class="image" />
    <line x1="100" y1="140" x2="150" y2="130" class="image" />
    <!-- Medical equipment -->
    <rect x="160" y="80" width="50" height="100" class="image" />
    <line x1="185" y1="80" x2="185" y2="30" class="image" />
    <line x1="185" y1="30" x2="165" y2="50" class="image" />
    <line x1="185" y1="30" x2="205" y2="50" class="image" />
  </g>
</svg>