<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">saddle</text>
  <text x="50" y="120" class="subtitle">[ˈsædl] n. 马鞍，鞍状物；v. 给...装鞍</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sad (坐) + -le (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个骑士坐在一个"小座位(sad-le)"上，
    <tspan x="50" dy="25">这个座位就是马鞍(saddle)，让他可以舒适地骑马。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He carefully placed the saddle on the horse.
  </text>
  <text x="50" y="310" class="content">
    他小心地把马鞍放在马背上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Horse -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Saddle -->
    <rect x="50" y="20" width="100" height="40" class="image" />
    <!-- Rider -->
    <circle cx="100" cy="70" r="15" class="image" />
    <line x1="100" y1="85" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="80" y2="150" class="image" />
    <line x1="100" y1="120" x2="120" y2="150" class="image" />
    <line x1="100" y1="100" x2="130" y2="90" class="image" />
  </g>
</svg>