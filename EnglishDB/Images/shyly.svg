<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shyly</text>
  <text x="50" y="120" class="subtitle">[ˈʃaɪli] adv. 害羞地，腼腆地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shy (害羞) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小女孩，"害羞地(shyly)"
    <tspan x="50" dy="25">躲在妈妈身后，只露出半张脸，偷偷看向外面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She shyly accepted the compliment.
  </text>
  <text x="50" y="310" class="content">
    她害羞地接受了赞美。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Girl hiding behind mother -->
    <circle cx="100" cy="100" r="30" class="image" /> <!-- Mother's head -->
    <line x1="100" y1="130" x2="100" y2="200" class="image" /> <!-- Mother's body -->
    <line x1="100" y1="150" x2="50" y2="180" class="image" /> <!-- Mother's left arm -->
    <line x1="100" y1="150" x2="150" y2="180" class="image" /> <!-- Mother's right arm -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Girl's head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Girl's body -->
    <line x1="50" y1="140" x2="30" y2="150" class="image" /> <!-- Girl's left arm -->
    <line x1="50" y1="140" x2="70" y2="150" class="image" /> <!-- Girl's right arm -->
    <line x1="50" y1="120" x2="100" y2="120" class="image" /> <!-- Connection between mother and girl -->
  </g>
</svg>