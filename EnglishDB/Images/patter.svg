<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">patter</text>
  <text x="50" y="120" class="subtitle">[ˈpætər] n. 模式，图案；v. 发出嗒嗒声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pat (轻拍) + -ter (反复)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫在地板上"轻拍(pat)"，
    <tspan x="50" dy="25">发出"嗒嗒(ter)"的声音，这种重复的动作形成了</tspan>
    <tspan x="50" dy="25">一种"模式(patter)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rain pattered on the roof all night.
  </text>
  <text x="50" y="310" class="content">
    雨整夜打在屋顶上发出嗒嗒声。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Paws -->
    <circle cx="30" cy="180" r="5" class="image" />
    <circle cx="70" cy="180" r="5" class="image" />
    <circle cx="40" cy="200" r="5" class="image" />
    <circle cx="60" cy="200" r="5" class="image" />
    <!-- Pattern -->
    <rect x="100" y="80" width="200" height="100" class="image" />
    <line x1="120" y1="90" x2="280" y2="90" class="image" />
    <line x1="120" y1="110" x2="280" y2="110" class="image" />
    <line x1="120" y1="130" x2="280" y2="130" class="image" />
    <line x1="120" y1="150" x2="280" y2="150" class="image" />
  </g>
</svg>