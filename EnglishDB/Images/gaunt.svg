<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #555555; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gaunt</text>
  <text x="50" y="120" class="subtitle">[ɡɔːnt] adj. 憔悴的，瘦削的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gaut (古英语，意为“骨头”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个瘦骨嶙峋的人，"骨头(gaut)"
    <tspan x="50" dy="25">突出，面容憔悴，这就是gaunt(憔悴的)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The long illness left him looking gaunt.
  </text>
  <text x="50" y="310" class="content">
    长期的疾病使他看起来很憔悴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Cheekbones -->
    <line x1="60" y1="120" x2="80" y2="110" class="image" />
    <line x1="140" y1="120" x2="120" y2="110" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="130" x2="120" y2="130" class="image" />
    <!-- Neck -->
    <line x1="100" y1="150" x2="100" y2="180" class="image" />
    <!-- Shoulders -->
    <line x1="60" y1="180" x2="140" y2="180" class="image" />
    <!-- Ribs -->
    <line x1="80" y1="190" x2="120" y2="190" class="image" />
    <line x1="80" y1="200" x2="120" y2="200" class="image" />
    <line x1="80" y1="210" x2="120" y2="210" class="image" />
  </g>
</svg>