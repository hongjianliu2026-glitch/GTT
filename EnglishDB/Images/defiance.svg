<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">defiance</text>
  <text x="50" y="120" class="subtitle">[dɪˈfaɪəns] n. 违抗，蔑视</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + fiant (信任)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在悬崖边，"离开(de-)"
    <tspan x="50" dy="25">信任(fiant)，表现出对规则的蔑视(defiance)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His defiance of the law landed him in jail.
  </text>
  <text x="50" y="310" class="content">
    他对法律的蔑视让他进了监狱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cliff -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Arrow pointing down -->
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <polygon points="95,150 105,150 100,160" class="image" />
    <!-- Text -->
    <text x="120" y="100" class="content">Defiance</text>
  </g>
</svg>