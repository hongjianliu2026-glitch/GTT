<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mascot</text>
  <text x="50" y="120" class="subtitle">[ˈmæskət] n. 吉祥物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> masc (魔法) + -ot (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满魔力的小动物，"魔法(masc)"
    <tspan x="50" dy="25">化身(ot)为吉祥物(mascot)，带来好运和欢乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team's mascot is a friendly lion.
  </text>
  <text x="50" y="310" class="content">
    这支球队的吉祥物是一只友好的狮子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magic circle -->
    <circle cx="175" cy="100" r="70" class="image" />
    <!-- Mascot (a lion) -->
    <circle cx="175" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="175" y1="130" x2="175" y2="180" class="image" /> <!-- Body -->
    <line x1="175" y1="150" x2="140" y2="140" class="image" /> <!-- Left leg -->
    <line x1="175" y1="150" x2="210" y2="140" class="image" /> <!-- Right leg -->
    <line x1="175" y1="140" x2="140" y2="170" class="image" /> <!-- Left arm -->
    <line x1="175" y1="140" x2="210" y2="170" class="image" /> <!-- Right arm -->
    <!-- Magic sparkles -->
    <circle cx="130" cy="70" r="5" class="image" />
    <circle cx="220" cy="70" r="5" class="image" />
    <circle cx="175" cy="50" r="5" class="image" />
  </g>
</svg>