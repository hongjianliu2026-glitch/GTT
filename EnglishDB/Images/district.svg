<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">district</text>
  <text x="50" y="120" class="subtitle">[ˈdɪstrɪkt] n. 区域，地区</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + trict (拉丁语：拉紧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的城市被"拉紧(trict)"的边界线"分开(dis-)"成不同的区域，
    <tspan x="50" dy="25">每个区域都有自己的特色和功能，这就是一个district。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The financial district is bustling with activity.
  </text>
  <text x="50" y="310" class="content">
    金融区里熙熙攘攘，热闹非凡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- District boundaries -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- District labels -->
    <text x="70" y="40" class="content">Residential</text>
    <text x="70" y="80" class="content">Commercial</text>
    <text x="70" y="120" class="content">Industrial</text>
    <text x="70" y="160" class="content">Tourist</text>
  </g>
</svg>