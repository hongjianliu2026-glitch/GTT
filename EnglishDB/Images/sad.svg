<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #7E5109; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #1A5276; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sad</text>
  <text x="50" y="120" class="subtitle">[sæd] adj. 悲伤的，难过的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sade (源自中古英语，意为“悲伤的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在角落里，脸上挂着泪珠，
    <tspan x="50" dy="25">周围是灰暗的色调，这就是“悲伤(sad)”的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt sad after hearing the bad news.
  </text>
  <text x="50" y="310" class="content">
    听到坏消息后，她感到很难过。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person sitting -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="30" y2="140" class="image" />
    <line x1="50" y1="150" x2="70" y2="140" class="image" />
    <!-- Tears -->
    <line x1="40" y1="105" x2="30" y2="95" class="image" />
    <line x1="60" y1="105" x2="70" y2="95" class="image" />
    <!-- Dark background -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#D7DBDD" />
  </g>
</svg>