<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">co-op</text>
  <text x="50" y="120" class="subtitle">[ˈkoʊˌɑp] n. 合作社，合作企业</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> co- (共同) + op (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围坐在一张大桌子旁，"共同工作(co-op)"
    <tspan x="50" dy="25">，每个人都在为同一个目标努力，这就是合作社(co-op)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She works at a co-op that sells organic produce.
  </text>
  <text x="50" y="310" class="content">
    她在一家销售有机产品的合作社工作。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Hands -->
    <line x1="50" y1="115" x2="150" y2="115" class="image" />
    <line x1="150" y1="115" x2="250" y2="115" class="image" />
    <!-- Goal -->
    <text x="150" y="180" class="content" text-anchor="middle">共同目标</text>
  </g>
</svg>