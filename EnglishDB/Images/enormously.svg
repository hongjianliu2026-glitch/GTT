<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">enormously</text>
  <text x="50" y="120" class="subtitle">[ɪˈnɔːrməsli] adv. 非常，极其</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + norm (标准) + -ous (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的气球，"超出(e-)"
    <tspan x="50" dy="25">标准(norm)，变得极其(enormously)大。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The movie was enormously popular.
  </text>
  <text x="50" y="310" class="content">
    这部电影非常受欢迎。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balloon -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- String -->
    <line x1="100" y1="180" x2="100" y2="300" class="image" />
    <!-- Ground -->
    <line x1="0" y1="300" x2="200" y2="300" class="image" />
    <!-- Text -->
    <text x="100" y="350" class="content" text-anchor="middle">超出标准</text>
  </g>
</svg>