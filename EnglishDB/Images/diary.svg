<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diary</text>
  <text x="50" y="120" class="subtitle">[ˈdaɪəri] n. 日记，日志</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (日) + -ary (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个女孩每天晚上坐在桌前，"记录下(di-ary)"
    <tspan x="50" dy="25">她一天的生活，这些记录就构成了她的日记(diary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She keeps a diary to record her daily thoughts.
  </text>
  <text x="50" y="310" class="content">
    她用日记记录她的日常想法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Diary book -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Pages -->
    <line x1="70" y1="50" x2="300" y2="50" class="image" />
    <line x1="70" y1="80" x2="300" y2="80" class="image" />
    <line x1="70" y1="110" x2="300" y2="110" class="image" />
    <line x1="70" y1="140" x2="300" y2="140" class="image" />
    <!-- Girl writing -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Pen -->
    <line x1="20" y1="130" x2="70" y2="120" class="image" />
    <line x1="70" y1="120" x2="70" y2="140" class="image" />
  </g>
</svg>