<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">agribusiness</text>
  <text x="50" y="120" class="subtitle">[ˈæɡrɪˌbɪznəs] n. 农业综合企业</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> agri- (土地) + business (商业)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的农田上，"土地(agri-)"上种植着各种作物，
    <tspan x="50" dy="25">旁边有一座现代化的工厂，"商业(business)"运作着，</tspan>
    <tspan x="50" dy="25">将农产品加工成各种商品，这就是农业综合企业(agribusiness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The agribusiness sector is a major contributor to the economy.
  </text>
  <text x="50" y="310" class="content">
    农业综合企业部门是经济的主要贡献者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Crops -->
    <line x1="50" y1="20" x2="100" y2="20" class="image" />
    <line x1="50" y1="40" x2="100" y2="40" class="image" />
    <line x1="50" y1="60" x2="100" y2="60" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <!-- Factory -->
    <rect x="200" y="20" width="100" height="160" class="image" />
    <!-- Factory smoke -->
    <line x1="250" y1="20" x2="250" y2="10" class="image" />
    <line x1="250" y1="10" x2="240" y2="0" class="image" />
    <line x1="250" y1="10" x2="260" y2="0" class="image" />
  </g>
</svg>