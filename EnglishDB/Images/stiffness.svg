<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stiffness</text>
  <text x="50" y="120" class="subtitle">[ˈstɪfnəs] n. 僵硬，不灵活</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stiff (僵硬的) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人因为长时间保持一个姿势，身体变得"僵硬(stiff)"，
    <tspan x="50" dy="25">无法灵活移动，这种状态就是僵硬(stiffness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After sitting for hours, she felt a stiffness in her back.
  </text>
  <text x="50" y="310" class="content">
    坐了几个小时后，她感到背部僵硬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <!-- Stiffness -->
    <line x1="50" y1="150" x2="50" y2="250" class="image" />
    <line x1="50" y1="250" x2="20" y2="300" class="image" />
    <line x1="50" y1="250" x2="80" y2="300" class="image" />
    <line x1="50" y1="200" x2="20" y2="220" class="image" />
    <line x1="50" y1="200" x2="80" y2="220" class="image" />
  </g>
</svg>