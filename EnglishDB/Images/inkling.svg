<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inkling</text>
  <text x="50" y="120" class="subtitle">[ˈɪŋklɪŋ] n. 模糊的想法，暗示</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + kling (粘附)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个模糊的想法像"粘附(kling)"在你的脑海中，
    <tspan x="50" dy="25">你只能捕捉到一点点"进入(in)"的线索，这就是inkling。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I had an inkling that something was wrong.
  </text>
  <text x="50" y="310" class="content">
    我隐约觉得有些不对劲。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Idea bubble -->
    <ellipse cx="250" cy="100" rx="50" ry="30" class="image" />
    <!-- Idea line -->
    <line x1="180" y1="100" x2="200" y2="100" class="image" />
    <!-- Idea spark -->
    <circle cx="250" cy="100" r="10" class="image" />
    <!-- Idea text -->
    <text x="260" y="105" class="content">?</text>
  </g>
</svg>