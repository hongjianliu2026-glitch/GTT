<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snub</text>
  <text x="50" y="120" class="subtitle">[snʌb] v. 冷落，不理睬；n. 冷落，怠慢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sn- (接近) + ub (向上)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人故意"接近(sn-)"你，却"向上(ub)"看，
    <tspan x="50" dy="25">完全不理睬你，这就是"冷落(snub)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt snubbed when he didn't acknowledge her greeting.
  </text>
  <text x="50" y="310" class="content">
    当他没有回应她的问候时，她感到被冷落了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person looking up -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Eyes looking up -->
    <line x1="40" y1="45" x2="45" y2="40" class="image" />
    <line x1="60" y1="45" x2="55" y2="40" class="image" />
    <!-- Person being ignored -->
    <circle cx="150" cy="50" r="20" class="image" />
    <line x1="150" y1="70" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="130" y2="150" class="image" />
    <line x1="150" y1="120" x2="170" y2="150" class="image" />
    <line x1="150" y1="90" x2="120" y2="80" class="image" />
    <!-- Eyes looking forward -->
    <line x1="140" y1="45" x2="145" y2="45" class="image" />
    <line x1="160" y1="45" x2="165" y2="45" class="image" />
  </g>
</svg>