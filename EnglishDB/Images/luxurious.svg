<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">luxurious</text>
  <text x="50" y="120" class="subtitle">[lʌɡˈʒʊəriəs] adj. 奢侈的，豪华的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lux (光) + -urious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里充满了"光(lux)"，
    <tspan x="50" dy="25">所有的家具和装饰都闪闪发光，</tspan>
    <tspan x="50" dy="25">这就是一个"豪华的(luxurious)"场景。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She stayed in a luxurious hotel during her vacation.
  </text>
  <text x="50" y="310" class="content">
    她在度假期间住在一个豪华的酒店。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Light -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <!-- Furniture -->
    <rect x="70" y="100" width="100" height="60" class="image" />
    <rect x="200" y="100" width="100" height="60" class="image" />
    <!-- Decorations -->
    <circle cx="120" cy="130" r="10" class="image" />
    <circle cx="250" cy="130" r="10" class="image" />
  </g>
</svg>