<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">proceedings</text>
  <text x="50" y="120" class="subtitle">[prəˈsiːdɪŋz] n. 进程，程序；会议记录</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + ceed (走) + -ing (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在会议室里，"向前走(pro-ceed)"
    <tspan x="50" dy="25">并记录下他们的讨论，这些记录就是会议记录(proceedings)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The proceedings of the conference were published in a book.
  </text>
  <text x="50" y="310" class="content">
    会议的记录被出版成了一本书。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- People -->
    <circle cx="80" cy="60" r="15" class="image" />
    <circle cx="150" cy="60" r="15" class="image" />
    <circle cx="220" cy="60" r="15" class="image" />
    <!-- Discussion lines -->
    <line x1="95" y1="75" x2="135" y2="75" class="image" />
    <line x1="165" y1="75" x2="205" y2="75" class="image" />
    <!-- Note -->
    <rect x="280" y="20" width="50" height="70" class="image" />
    <line x1="290" y1="40" x2="320" y2="40" class="image" />
    <line x1="290" y1="60" x2="320" y2="60" class="image" />
  </g>
</svg>