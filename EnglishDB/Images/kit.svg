<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kit</text>
  <text x="50" y="120" class="subtitle">[kɪt] n. 成套工具，装备</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> kit (源自中古英语 "kitte"，意为“小猫”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫(kit)带着它的“工具包(kit)”，里面装满了各种小工具，准备去修理东西。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He packed his camping kit before the trip.
  </text>
  <text x="50" y="310" class="content">
    他在旅行前打包了他的露营装备。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cat -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="200" class="image" />
    <line x1="50" y1="150" x2="80" y2="200" class="image" />
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />

    <!-- Toolbox -->
    <rect x="120" y="20" width="150" height="100" class="image" />
    <line x1="130" y1="30" x2="260" y2="30" class="image" />
    <line x1="130" y1="60" x2="260" y2="60" class="image" />
    <line x1="130" y1="90" x2="260" y2="90" class="image" />
  </g>
</svg>