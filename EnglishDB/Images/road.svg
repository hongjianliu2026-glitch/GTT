<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">road</text>
  <text x="50" y="120" class="subtitle">[roʊd] n. 道路，公路</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ro (拉丁语 "rota" 轮子) + ad (朝向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆马车在一条宽阔的道路上行驶，"轮子(rota)"
    <tspan x="50" dy="25">朝向(ad)远方，这条路就是我们的道路(road)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The road to success is not easy.
  </text>
  <text x="50" y="310" class="content">
    通往成功的道路并不容易。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Carriage -->
    <rect x="70" y="20" width="80" height="60" class="image" />
    <!-- Direction arrow -->
    <line x1="300" y1="50" x2="350" y2="50" class="image" />
    <polygon points="350,45 350,55 360,50" class="image" />
  </g>
</svg>