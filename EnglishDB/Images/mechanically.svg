<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mechanically</text>
  <text x="50" y="120" class="subtitle">[məˈkænɪkli] adv. 机械地，呆板地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mechan (机器) + -ical (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机器人按照预设的程序，"机械地(mechanically)"
    <tspan x="50" dy="25">重复着同样的动作，毫无情感和变化。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The robot moved mechanically across the room.
  </text>
  <text x="50" y="310" class="content">
    机器人机械地穿过房间。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot -->
    <circle cx="50" cy="50" r="30" class="image" /> <!-- Head -->
    <rect x="35" y="80" width="30" height="60" class="image" /> <!-- Body -->
    <line x1="50" y1="140" x2="50" y2="200" class="image" /> <!-- Leg -->
    <line x1="50" y1="100" x2="0" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="100" x2="100" y2="150" class="image" /> <!-- Right arm -->
    <!-- Repeat action -->
    <line x1="150" y1="50" x2="250" y2="50" class="image" />
    <line x1="150" y1="80" x2="250" y2="80" class="image" />
    <line x1="150" y1="110" x2="250" y2="110" class="image" />
    <line x1="150" y1="140" x2="250" y2="140" class="image" />
  </g>
</svg>