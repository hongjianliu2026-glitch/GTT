<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">additionally</text>
  <text x="50" y="120" class="subtitle">[əˈdɪʃənəli] adv. 另外，加之</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> add (增加) + -ition (名词后缀) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个魔术师在表演中，"增加(add)"
    <tspan x="50" dy="25">了一只兔子，然后又"增加(add)"了一只鸽子，</tspan>
    <tspan x="50" dy="25">最后"增加(add)"了一只猫，这就是"另外(additionally)"的效果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> Additionally, we need to consider the budget.
  </text>
  <text x="50" y="330" class="content">
    另外，我们需要考虑预算。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magician -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Hat -->
    <rect x="0" y="80" width="40" height="20" class="image" />
    <!-- Rabbit -->
    <circle cx="100" cy="100" r="10" class="image" />
    <line x1="100" y1="110" x2="100" y2="130" class="image" />
    <line x1="100" y1="130" x2="90" y2="150" class="image" />
    <line x1="100" y1="130" x2="110" y2="150" class="image" />
    <!-- Dove -->
    <circle cx="150" cy="100" r="10" class="image" />
    <line x1="150" y1="110" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="140" y2="150" class="image" />
    <line x1="150" y1="130" x2="160" y2="150" class="image" />
    <!-- Cat -->
    <circle cx="200" cy="100" r="10" class="image" />
    <line x1="200" y1="110" x2="200" y2="130" class="image" />
    <line x1="200" y1="130" x2="190" y2="150" class="image" />
    <line x1="200" y1="130" x2="210" y2="150" class="image" />
  </g>
</svg>