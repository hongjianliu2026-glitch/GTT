<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">MRI</text>
  <text x="50" y="120" class="subtitle">[ɛm ɑr ˈaɪ] n. 磁共振成像</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Magnetic Resonance Imaging
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的磁铁在人体周围旋转，"磁共振(Magnetic Resonance)"
    <tspan x="50" dy="25">产生图像，这些图像就构成了磁共振成像(MRI)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor ordered an MRI to check for any abnormalities.
  </text>
  <text x="50" y="310" class="content">
    医生安排了磁共振成像检查是否有异常。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Magnetic field lines -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="200" x2="350" y2="0" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="175" y1="0" x2="175" y2="200" class="image" />
    <!-- Human body -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- MRI machine -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
  </g>
</svg>