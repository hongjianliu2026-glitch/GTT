<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">indelible</text>
  <text x="50" y="120" class="subtitle">[ɪnˈdɛlɪbəl] adj. 擦不掉的，持久的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + del (擦掉) + -ible (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一支永不褪色的笔，"无法擦掉(in-del-ible)"
    <tspan x="50" dy="25">的墨水在纸上留下持久的痕迹，这就是indelible。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The indelible ink on the ballot made it impossible to alter the vote.
  </text>
  <text x="50" y="310" class="content">
    选票上的不可擦墨水使得投票无法被篡改。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pen -->
    <line x1="0" y1="0" x2="50" y2="0" class="image" />
    <line x1="50" y1="0" x2="40" y2="10" class="image" />
    <line x1="40" y1="10" x2="60" y2="10" class="image" />
    <line x1="60" y1="10" x2="50" y2="0" class="image" />
    <!-- Paper -->
    <rect x="70" y="0" width="200" height="150" class="image" />
    <!-- Ink mark -->
    <circle cx="170" cy="75" r="30" class="image" />
  </g>
</svg>