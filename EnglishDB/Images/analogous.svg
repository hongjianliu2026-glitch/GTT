<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">analogous</text>
  <text x="50" y="120" class="subtitle">[əˈnæləɡəs] adj. 类似的，相似的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ana- (向上) + log (说) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在讨论，"向上说(ana-log)"
    <tspan x="50" dy="25">出相似的观点，他们就像两片相似的叶子(analogous)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The relationship between the two concepts is analogous to that of a tree and its branches.
  </text>
  <text x="50" y="310" class="content">
    这两个概念之间的关系类似于树和它的树枝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two similar leaves -->
    <path d="M50,50 Q100,20 150,50 Q100,80 50,50" class="image" />
    <path d="M50,100 Q100,70 150,100 Q100,130 50,100" class="image" />
    <!-- Two people talking -->
    <circle cx="200" cy="70" r="15" class="image" />
    <circle cx="250" cy="70" r="15" class="image" />
    <line x1="200" y1="85" x2="250" y2="85" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <line x1="200" y1="115" x2="250" y2="115" class="image" />
  </g>
</svg>