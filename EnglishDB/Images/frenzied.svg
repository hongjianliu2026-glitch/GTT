<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">frenzied</text>
  <text x="50" y="120" class="subtitle">[ˈfrɛnzaɪd] adj. 狂乱的，疯狂的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fren- (疯狂) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在疯狂地奔跑，"疯狂(fren-)"
    <tspan x="50" dy="25">地追逐着什么，这种状态就是狂乱的(frenzied)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd became frenzied as the concert began.
  </text>
  <text x="50" y="310" class="content">
    音乐会开始时，人群变得狂乱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Running person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <!-- Path -->
    <line x1="50" y1="220" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="250" y2="180" class="image" />
    <line x1="250" y1="180" x2="300" y2="220" class="image" />
    <line x1="300" y1="220" x2="350" y2="180" class="image" />
    <line x1="350" y1="180" x2="400" y2="220" class="image" />
  </g>
</svg>