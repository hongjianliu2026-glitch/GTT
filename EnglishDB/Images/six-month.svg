<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">six-month</text>
  <text x="50" y="120" class="subtitle">[sɪks mʌnθ] adj. 六个月的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> six (六) + month (月)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个日历上，"六个(six)"
    <tspan x="50" dy="25">月亮的符号(month)，代表六个月的时间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a six-month contract with the company.
  </text>
  <text x="50" y="310" class="content">
    她与公司签订了为期六个月的合同。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Six moons -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="120" cy="50" r="20" class="image" />
    <circle cx="190" cy="50" r="20" class="image" />
    <circle cx="260" cy="50" r="20" class="image" />
    <circle cx="330" cy="50" r="20" class="image" />
    <circle cx="400" cy="50" r="20" class="image" />
    <!-- Text -->
    <text x="50" y="100" class="content">六个月</text>
  </g>
</svg>