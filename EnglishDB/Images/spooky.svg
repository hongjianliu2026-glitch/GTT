<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .ghost { fill: #FFFFFF; stroke: #000000; stroke-width: 2; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spooky</text>
  <text x="50" y="120" class="subtitle">[ˈspuːki] adj. 令人毛骨悚然的，阴森恐怖的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spook (鬼) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夜晚，一个"鬼(spook)"突然出现在你面前，
    <tspan x="50" dy="25">你感到"毛骨悚然(spooky)"，心跳加速。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old house on the hill is spooky at night.
  </text>
  <text x="50" y="310" class="content">
    山上的那座老房子在夜晚显得阴森恐怖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon -->
    <circle cx="100" cy="50" r="30" fill="#F1C40F" />
    <!-- Ghost -->
    <circle cx="150" cy="150" r="30" class="ghost" />
    <rect x="120" y="180" width="60" height="40" class="ghost" />
    <line x1="140" y1="220" x2="140" y2="260" class="ghost" />
    <line x1="160" y1="220" x2="160" y2="260" class="ghost" />
    <line x1="130" y1="240" x2="120" y2="230" class="ghost" />
    <line x1="170" y1="240" x2="180" y2="230" class="ghost" />
    <!-- Tree -->
    <rect x="250" y="100" width="20" height="150" fill="#2C3E50" />
    <polygon points="240,100 270,100 255,50" fill="#27AE60" />
    <polygon points="230,80 280,80 255,30" fill="#27AE60" />
  </g>
</svg>