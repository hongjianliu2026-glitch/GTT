<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slugger</text>
  <text x="50" y="120" class="subtitle">[ˈslʌɡər] n. 重击者，强击手</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slug (重击) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强壮的棒球手，他挥动球棒，"重击(slug)"
    <tspan x="50" dy="25">球飞出球场，他就是那个"重击者(slugger)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is known as the best slugger in the league.
  </text>
  <text x="50" y="310" class="content">
    他被称为联盟中最强的击球手。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Baseball player -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="30" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="70" y2="250" class="image" /> <!-- Right leg -->
    <!-- Bat -->
    <line x1="80" y1="180" x2="150" y2="100" class="image" />
    <!-- Ball -->
    <circle cx="180" cy="80" r="15" class="image" />
  </g>
</svg>