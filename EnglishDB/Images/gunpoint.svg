<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gunpoint</text>
  <text x="50" y="120" class="subtitle">[ˈɡʌnˌpɔɪnt] n. 枪口，用枪指着</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gun (枪) + point (点)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被枪指着，"枪口(gunpoint)"
    <tspan x="50" dy="25">顶在他的胸前，这种紧张的场景让人难以忘怀。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was forced to hand over the money at gunpoint.
  </text>
  <text x="50" y="310" class="content">
    他被枪指着被迫交出了钱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gun -->
    <rect x="0" y="0" width="200" height="50" class="image" />
    <rect x="10" y="10" width="180" height="30" class="image" />
    <rect x="150" y="10" width="40" height="30" class="image" />
    <!-- Person -->
    <circle cx="250" cy="25" r="20" class="image" />
    <line x1="250" y1="45" x2="250" y2="80" class="image" />
    <line x1="250" y1="80" x2="230" y2="110" class="image" />
    <line x1="250" y1="80" x2="270" y2="110" class="image" />
    <line x1="250" y1="60" x2="220" y2="50" class="image" />
    <line x1="250" y1="60" x2="280" y2="50" class="image" />
  </g>
</svg>