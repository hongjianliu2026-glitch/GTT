<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ostrich</text>
  <text x="50" y="120" class="subtitle">[ˈɒstrɪtʃ] n. 鸵鸟</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ostro- (鸵鸟) + -rich (表示“属于”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的鸵鸟(ostrich)，它把头埋在沙子里，
    <tspan x="50" dy="25">假装看不见危险，这种行为让人印象深刻。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ostrich buried its head in the sand.
  </text>
  <text x="50" y="310" class="content">
    鸵鸟把头埋在沙子里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ostrich body -->
    <ellipse cx="150" cy="100" rx="100" ry="50" class="image" />
    <!-- Ostrich neck -->
    <line x1="150" y1="100" x2="150" y2="20" class="image" />
    <!-- Ostrich head -->
    <circle cx="150" cy="10" r="15" class="image" />
    <!-- Ostrich legs -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="200" y1="150" x2="200" y2="250" class="image" />
    <!-- Sand -->
    <rect x="0" y="250" width="300" height="50" class="image" />
  </g>
</svg>