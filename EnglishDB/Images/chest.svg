<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chest</text>
  <text x="50" y="120" class="subtitle">[tʃest] n. 胸部，箱子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cest (盒子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的宝箱(chest)，里面装满了珍贵的宝物，
    <tspan x="50" dy="25">而你的胸部(chest)就像这个宝箱，蕴藏着生命的宝藏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She placed the treasure in an old wooden chest.
  </text>
  <text x="50" y="310" class="content">
    她把宝物放在了一个古老的木箱里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Chest -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="10" y="10" width="180" height="130" class="image" />
    <line x1="20" y1="30" x2="180" y2="30" class="image" />
    <line x1="20" y1="60" x2="160" y2="60" class="image" />
    <line x1="20" y1="90" x2="170" y2="90" class="image" />
    <line x1="20" y1="120" x2="150" y2="120" class="image" />
    <!-- Treasure -->
    <circle cx="50" cy="75" r="10" class="image" />
    <circle cx="80" cy="75" r="10" class="image" />
    <circle cx="110" cy="75" r="10" class="image" />
    <circle cx="140" cy="75" r="10" class="image" />
  </g>
</svg>