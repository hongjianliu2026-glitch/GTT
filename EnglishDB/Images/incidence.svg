<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incidence</text>
  <text x="50" y="120" class="subtitle">[ˈɪndɪdəns] n. 发生率，影响范围</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + cid (落下) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的陨石"落入(in-cid)"地球，
    <tspan x="50" dy="25">它的影响范围(incidence)覆盖了整个城市。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The incidence of flu has increased this winter.
  </text>
  <text x="50" y="310" class="content">
    今年冬天流感的发病率有所增加。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meteor -->
    <circle cx="100" cy="100" r="30" class="image" fill="#E74C3C" />
    <line x1="100" y1="100" x2="100" y2="200" class="image" />
    <!-- Impact area -->
    <circle cx="100" cy="200" r="50" class="image" fill="#F1C40F" opacity="0.5" />
    <!-- City -->
    <rect x="50" y="250" width="100" height="50" class="image" fill="#34495E" />
    <rect x="70" y="260" width="20" height="30" class="image" fill="#ECF0F1" />
    <rect x="110" y="260" width="20" height="30" class="image" fill="#ECF0F1" />
  </g>
</svg>