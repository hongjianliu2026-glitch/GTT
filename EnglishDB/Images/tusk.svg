<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tusk</text>
  <text x="50" y="120" class="subtitle">[tʌsk] n. 长牙，獠牙</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tus (来自古英语，意为“牙”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头巨大的象，它的长牙(tusk)
    <tspan x="50" dy="25">如同两把锋利的剑，刺破天空，震撼人心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The elephant's tusks were enormous and impressive.
  </text>
  <text x="50" y="310" class="content">
    这头大象的长牙巨大且令人印象深刻。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Elephant body -->
    <ellipse cx="200" cy="200" rx="150" ry="100" class="image" />
    <!-- Elephant head -->
    <ellipse cx="200" cy="120" rx="80" ry="50" class="image" />
    <!-- Tusks -->
    <line x1="150" y1="120" x2="100" y2="80" class="image" />
    <line x1="250" y1="120" x2="300" y2="80" class="image" />
    <!-- Eyes -->
    <circle cx="180" cy="110" r="10" class="image" />
    <circle cx="220" cy="110" r="10" class="image" />
    <!-- Trunk -->
    <path d="M200,120 Q250,150 200,180" class="image" />
  </g>
</svg>