<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">portion</text>
  <text x="50" y="120" class="subtitle">[ˈpɔːrʃn] n. 部分，一份</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> port (部分) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕被切成多份，每一份都是"部分(port)"，
    <tspan x="50" dy="25">这些部分合起来就是整个蛋糕。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She ate a small portion of the cake.
  </text>
  <text x="50" y="310" class="content">
    她吃了一小块蛋糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Cake -->
    <circle cx="150" cy="150" r="100" class="image" />
    <!-- Slices -->
    <line x1="150" y1="150" x2="50" y2="50" class="image" />
    <line x1="150" y1="150" x2="250" y2="50" class="image" />
    <line x1="150" y1="150" x2="150" y2="250" class="image" />
    <!-- Portion -->
    <rect x="50" y="50" width="100" height="100" class="image" />
    <text x="100" y="100" class="content" text-anchor="middle" dominant-baseline="middle">部分</text>
  </g>
</svg>