<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drive</text>
  <text x="50" y="120" class="subtitle">[draɪv] v. 驾驶，驱使；n. 驱动力，干劲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dr- (拉) + ive (使)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车在道路上"拉(dr-)"着人前进，
    <tspan x="50" dy="25">这种"使(ive)"人前进的力量就是驱动力(drive)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He drives a truck for a living.
  </text>
  <text x="50" y="310" class="content">
    他以开卡车为生。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car -->
    <rect x="50" y="50" width="100" height="50" class="image" />
    <rect x="60" y="60" width="80" height="30" class="image" />
    <!-- Wheels -->
    <circle cx="70" cy="100" r="15" class="image" />
    <circle cx="130" cy="100" r="15" class="image" />
    <!-- Driver -->
    <circle cx="100" cy="75" r="10" class="image" />
    <line x1="100" y1="85" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="90" y2="120" class="image" />
    <line x1="100" y1="100" x2="110" y2="120" class="image" />
  </g>
</svg>