<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stacked</text>
  <text x="50" y="120" class="subtitle">[stækt] adj. 堆叠的，堆积的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stack (堆叠) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆书本被"堆叠(stack)"在一起，形成了一个高高的"堆(stacked)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The library had a stacked collection of ancient manuscripts.
  </text>
  <text x="50" y="310" class="content">
    图书馆里有一堆堆叠的古代手稿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Stacked books -->
    <rect x="0" y="0" width="100" height="20" class="image" />
    <rect x="10" y="25" width="80" height="20" class="image" />
    <rect x="20" y="50" width="60" height="20" class="image" />
    <rect x="30" y="75" width="40" height="20" class="image" />
    <rect x="40" y="100" width="20" height="20" class="image" />
  </g>
</svg>