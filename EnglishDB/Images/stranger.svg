<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stranger</text>
  <text x="50" y="120" class="subtitle">[ˈstreɪndʒər] n. 陌生人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> strange (奇怪的) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个戴着奇怪面具的人，"奇怪的(strange)"
    <tspan x="50" dy="25">人(er)，他就是陌生人(stranger)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt uneasy around strangers.
  </text>
  <text x="50" y="310" class="content">
    她在陌生人周围感到不安。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Strange mask -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="50" y1="90" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="90" y2="120" class="image" />
    <!-- Eyes -->
    <circle cx="35" cy="40" r="5" class="image" />
    <circle cx="65" cy="40" r="5" class="image" />
    <!-- Mouth -->
    <line x1="40" y1="70" x2="60" y2="70" class="image" />
  </g>
</svg>