<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">atom</text>
  <text x="50" y="120" class="subtitle">[ˈætəm] n. 原子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (不) + tomos (切割)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家试图"不(a-)切割(tomos)"
    <tspan x="50" dy="25">一个微小的粒子，这个粒子就是原子(atom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The structure of an atom is fascinating.
  </text>
  <text x="50" y="310" class="content">
    原子的结构非常迷人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Atom nucleus -->
    <circle cx="100" cy="100" r="20" class="image" fill="#2980B9" />
    <!-- Electron orbits -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="100" cy="100" r="110" class="image" />
    <!-- Electrons -->
    <circle cx="150" cy="100" r="5" class="image" fill="#E74C3C" />
    <circle cx="100" cy="180" r="5" class="image" fill="#E74C3C" />
    <circle cx="50" cy="100" r="5" class="image" fill="#E74C3C" />
    <circle cx="100" cy="20" r="5" class="image" fill="#E74C3C" />
  </g>
</svg>