<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">concussion</text>
  <text x="50" y="120" class="subtitle">[kənˈkʌʃən] n. 脑震荡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + cuss (摇动) + ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被重击头部，"一起摇动(con-cuss)"
    <tspan x="50" dy="25">大脑，导致脑震荡(concussion)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He suffered a concussion after falling off his bike.
  </text>
  <text x="50" y="310" class="content">
    他从自行车上摔下来后，脑部受到了震荡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Brain -->
    <ellipse cx="100" cy="100" rx="40" ry="30" class="image" />
    <!-- Impact -->
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
    <!-- Stars -->
    <circle cx="80" cy="80" r="5" class="image" />
    <circle cx="120" cy="80" r="5" class="image" />
    <circle cx="100" cy="120" r="5" class="image" />
  </g>
</svg>