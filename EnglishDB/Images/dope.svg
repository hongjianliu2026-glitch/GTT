<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dope</text>
  <text x="50" y="120" class="subtitle">[doʊp] n. 毒品，笨蛋；v. 给...服毒品</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dope (源自荷兰语 "doop"，意为"液体")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个笨蛋(dope)在喝一种神秘的"液体(dope)"，
    <tspan x="50" dy="25">结果变得神志不清，这就是"毒品(dope)"的效果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The athlete was caught using dope during the competition.
  </text>
  <text x="50" y="310" class="content">
    这名运动员在比赛中被发现使用了毒品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dumbbell -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="20" r="20" class="image" />
    <circle cx="50" cy="180" r="20" class="image" />
    <!-- Liquid in a bottle -->
    <rect x="120" y="50" width="50" height="150" class="image" />
    <line x1="145" y1="50" x2="145" y2="200" class="image" />
    <line x1="120" y1="100" x2="170" y2="100" class="image" />
    <line x1="120" y1="150" x2="170" y2="150" class="image" />
    <!-- Confused face -->
    <circle cx="250" cy="100" r="30" class="image" />
    <line x1="235" y1="100" x2="265" y2="100" class="image" />
    <line x1="245" y1="90" x2="255" y2="90" class="image" />
    <line x1="245" y1="110" x2="255" y2="110" class="image" />
    <line x1="240" y1="120" x2="260" y2="120" class="image" />
  </g>
</svg>