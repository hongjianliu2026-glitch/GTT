<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">titan</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪtən] n. 巨人，大力士</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> titan (源自希腊神话中的泰坦神族)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的泰坦神族成员，"泰坦(titan)"
    <tspan x="50" dy="25">站在山巅，手持巨石，象征着无与伦比的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The wrestler was a real titan in the ring.
  </text>
  <text x="50" y="310" class="content">
    这位摔跤手在擂台上真是个大力士。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Titan -->
    <circle cx="50" cy="100" r="40" class="image" /> <!-- Head -->
    <line x1="50" y1="140" x2="50" y2="240" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="0" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="180" x2="100" y2="150" class="image" /> <!-- Right arm -->
    <line x1="50" y1="240" x2="0" y2="300" class="image" /> <!-- Left leg -->
    <line x1="50" y1="240" x2="100" y2="300" class="image" /> <!-- Right leg -->
    <!-- Boulder -->
    <rect x="120" y="150" width="80" height="80" class="image" />
    <line x1="120" y1="150" x2="200" y2="150" class="image" />
    <line x1="120" y1="230" x2="200" y2="230" class="image" />
    <line x1="120" y1="150" x2="120" y2="230" class="image" />
    <line x1="200" y1="150" x2="200" y2="230" class="image" />
  </g>
</svg>