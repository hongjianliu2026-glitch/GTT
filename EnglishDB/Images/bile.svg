<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bile</text>
  <text x="50" y="120" class="subtitle">[baɪl] n. 胆汁</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bili- (胆汁)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个愤怒的狮子，它的胆囊里充满了"胆汁(bile)"，
    <tspan x="50" dy="25">这些胆汁让它变得更加凶猛和愤怒。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The doctor checked his bile levels.
  </text>
  <text x="50" y="310" class="content">
    医生检查了他的胆汁水平。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lion's head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Nose -->
    <line x1="90" y1="110" x2="110" y2="110" class="image" />
    <!-- Mouth -->
    <path d="M 60 130 Q 100 150 140 130" class="image" />
    <!-- Bile -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <text x="160" y="110" class="content" fill="#E74C3C">bile</text>
  </g>
</svg>