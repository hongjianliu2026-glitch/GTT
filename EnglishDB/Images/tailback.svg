<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tailback</text>
  <text x="50" y="120" class="subtitle">[ˈteɪlbæk] n. 交通堵塞，后卫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tail (尾巴) + back (后面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车在公路上，"尾巴后面(tail-back)"
    <tspan x="50" dy="25">排起了长长的队伍，这就是交通堵塞(tailback)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident caused a severe tailback on the highway.
  </text>
  <text x="50" y="310" class="content">
    事故导致高速公路上出现了严重的交通堵塞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cars -->
    <rect x="50" y="50" width="50" height="30" class="image" />
    <rect x="120" y="50" width="50" height="30" class="image" />
    <rect x="190" y="50" width="50" height="30" class="image" />
    <rect x="260" y="50" width="50" height="30" class="image" />
    <!-- Tail -->
    <line x1="310" y1="65" x2="350" y2="65" class="image" />
    <line x1="310" y1="75" x2="350" y2="75" class="image" />
    <line x1="310" y1="85" x2="350" y2="85" class="image" />
  </g>
</svg>