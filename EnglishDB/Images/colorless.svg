<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">colorless</text>
  <text x="50" y="120" class="subtitle">[ˈkʌlərləs] adj. 无色的，乏味的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> color (颜色) + -less (无)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个没有颜色的世界，一切都是灰色的，
    <tspan x="50" dy="25">就像一杯无色的水，平淡无奇，毫无生气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The lecture was so colorless that I fell asleep.
  </text>
  <text x="50" y="310" class="content">
    讲座如此乏味，以至于我睡着了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gray world -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gray sky -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Gray ground -->
    <rect x="50" y="180" width="250" height="20" class="image" />
    <!-- Gray tree -->
    <line x1="150" y1="180" x2="150" y2="100" class="image" />
    <line x1="150" y1="100" x2="130" y2="120" class="image" />
    <line x1="150" y1="100" x2="170" y2="120" class="image" />
    <!-- Gray person -->
    <circle cx="200" cy="150" r="15" class="image" />
    <line x1="200" y1="165" x2="200" y2="190" class="image" />
    <line x1="200" y1="190" x2="180" y2="210" class="image" />
    <line x1="200" y1="190" x2="220" y2="210" class="image" />
    <line x1="200" y1="175" x2="230" y2="165" class="image" />
  </g>
</svg>