<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bulletin</text>
  <text x="50" y="120" class="subtitle">[ˈbʊlətɪn] n. 公告，公报</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bull (公牛) + -et (小) + -in (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头小公牛(bull-et)在公告板上(bulletin)
    <tspan x="50" dy="25">发出强有力的声音，宣布重要消息。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The school bulletin announced the new schedule.
  </text>
  <text x="50" y="310" class="content">
    学校的公告宣布了新的时间表。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bulletin board -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bull -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Announcement -->
    <rect x="120" y="20" width="200" height="160" class="image" />
    <text x="130" y="60" class="content" fill="#000">New Schedule</text>
    <text x="130" y="90" class="content" fill="#000">Announced</text>
  </g>
</svg>