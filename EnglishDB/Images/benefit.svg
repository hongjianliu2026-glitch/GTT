<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">benefit</text>
  <text x="50" y="120" class="subtitle">[ˈbɛnɪfɪt] n. 利益，好处；v. 受益</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bene- (好) + fit (做)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在做一件好事("bene-fit")，
    <tspan x="50" dy="25">结果他得到了很多好处(benefit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Regular exercise can bring many health benefits.
  </text>
  <text x="50" y="310" class="content">
    定期锻炼可以带来许多健康益处。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person doing good -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="30" y2="130" class="image" />
    <line x1="50" y1="150" x2="70" y2="130" class="image" />
    <line x1="50" y1="180" x2="30" y2="210" class="image" />
    <line x1="50" y1="180" x2="70" y2="210" class="image" />
    <!-- Benefits -->
    <rect x="100" y="80" width="100" height="40" class="image" />
    <rect x="100" y="130" width="100" height="40" class="image" />
    <rect x="100" y="180" width="100" height="40" class="image" />
    <text x="110" y="105" class="content">好处1</text>
    <text x="110" y="155" class="content">好处2</text>
    <text x="110" y="205" class="content">好处3</text>
  </g>
</svg>