<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humanly</text>
  <text x="50" y="120" class="subtitle">[ˈhjuːmənli] adv. 以人的方式，在人力范围内</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> human (人) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人类在尽力完成一项任务，"以人的方式(humanly)"
    <tspan x="50" dy="25">去解决问题，尽管可能会有局限，但依然全力以赴。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It is not humanly possible to run a marathon in under two hours.
  </text>
  <text x="50" y="310" class="content">
    在人力范围内，不可能在两小时内跑完马拉松。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Human figure -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />
    <!-- Task symbol -->
    <rect x="100" y="80" width="100" height="100" class="image" />
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <line x1="120" y1="120" x2="180" y2="120" class="image" />
    <line x1="120" y1="140" x2="180" y2="140" class="image" />
    <line x1="120" y1="160" x2="180" y2="160" class="image" />
    <!-- Limitation symbol -->
    <line x1="250" y1="80" x2="250" y2="180" class="image" />
    <line x1="230" y1="100" x2="270" y2="100" class="image" />
    <line x1="230" y1="140" x2="270" y2="140" class="image" />
    <line x1="230" y1="180" x2="270" y2="180" class="image" />
  </g>
</svg>