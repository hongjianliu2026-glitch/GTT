<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">newsroom</text>
  <text x="50" y="120" class="subtitle">[ˈnuːzruːm] n. 新闻编辑室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> news (新闻) + room (房间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满活力的房间，里面挤满了记者和编辑，
    <tspan x="50" dy="25">他们正在"房间(room)"里"报道新闻(news)"，</tspan>
    <tspan x="50" dy="25">这就是新闻编辑室(newsroom)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The newsroom was buzzing with activity as the deadline approached.
  </text>
  <text x="50" y="310" class="content">
    随着截止日期的临近，新闻编辑室里充满了忙碌的气氛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Desks -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="170" y="20" width="100" height="160" class="image" />
    <rect x="290" y="20" width="50" height="160" class="image" />
    <!-- Computers -->
    <rect x="60" y="30" width="80" height="50" class="image" />
    <rect x="180" y="30" width="80" height="50" class="image" />
    <rect x="300" y="30" width="30" height="50" class="image" />
    <!-- People -->
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="315" cy="100" r="15" class="image" />
    <!-- News symbols -->
    <line x1="70" y1="130" x2="90" y2="130" class="image" />
    <line x1="190" y1="130" x2="210" y2="130" class="image" />
    <line x1="305" y1="130" x2="325" y2="130" class="image" />
  </g>
</svg>