<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .humid { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">humid</text>
  <text x="50" y="120" class="subtitle">[ˈhjuːmɪd] adj. 潮湿的，湿润的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hum (湿) + -id (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热带雨林，"湿(hum)"气弥漫，
    <tspan x="50" dy="25">到处都是湿润的(humid)感觉，仿佛空气都能拧出水来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The air in the rainforest was humid and thick.
  </text>
  <text x="50" y="310" class="content">
    雨林中的空气潮湿而厚重。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rainforest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trees -->
    <line x1="50" y1="100" x2="50" y2="20" class="image" />
    <line x1="70" y1="100" x2="70" y2="20" class="image" />
    <line x1="90" y1="100" x2="90" y2="20" class="image" />
    <!-- Leaves -->
    <circle cx="50" cy="20" r="15" class="image" />
    <circle cx="70" cy="20" r="15" class="image" />
    <circle cx="90" cy="20" r="15" class="image" />
    <!-- Water droplets -->
    <circle cx="120" cy="50" r="5" class="humid" />
    <circle cx="140" cy="60" r="5" class="humid" />
    <circle cx="160" cy="70" r="5" class="humid" />
    <circle cx="180" cy="80" r="5" class="humid" />
    <circle cx="200" cy="90" r="5" class="humid" />
  </g>
</svg>