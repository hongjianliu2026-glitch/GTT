<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accreditation</text>
  <text x="50" y="120" class="subtitle">[əˌkrɛdɪˈteɪʃən] n. 认证，认可</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (加强) + cred (相信) + it (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个权威机构在颁发证书，"加强相信(ac-cred)"
    <tspan x="50" dy="25">的力量，这个证书就是认证(accreditation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The university received accreditation from the ministry.
  </text>
  <text x="50" y="310" class="content">
    这所大学获得了教育部的认证。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Certificate -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Seal -->
    <circle cx="200" cy="100" r="30" class="image" />
    <!-- Text on certificate -->
    <text x="70" y="80" class="content" fill="#2C3E50">Accreditation</text>
    <text x="70" y="110" class="content" fill="#2C3E50">Authorized by</text>
    <text x="70" y="140" class="content" fill="#2C3E50">Ministry of Education</text>
  </g>
</svg>