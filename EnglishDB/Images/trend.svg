<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">trend</text>
  <text x="50" y="120" class="subtitle">[trɛnd] n. 趋势，潮流；v. 趋向，倾向</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tend (伸展)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条河流，水流不断"伸展(tend)"向前，
    <tspan x="50" dy="25">形成了一种趋势(trend)，引领着潮流。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The trend of the stock market is upward.
  </text>
  <text x="50" y="310" class="content">
    股市的趋势是向上的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- River -->
    <path d="M0 100 Q100 50 200 100 T400 100" class="image" />
    <!-- Water flow -->
    <path d="M0 105 Q100 55 200 105 T400 105" class="image" />
    <path d="M0 110 Q100 60 200 110 T400 110" class="image" />
    <path d="M0 115 Q100 65 200 115 T400 115" class="image" />
    <!-- Trend arrow -->
    <polygon points="420,100 400,90 400,110" class="image" />
  </g>
</svg>