<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">muscular</text>
  <text x="50" y="120" class="subtitle">[ˈmʌskjələr] adj. 肌肉发达的，强壮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> muscul (肌肉) + -ar (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个健美运动员，全身都是"肌肉(muscul)"，
    <tspan x="50" dy="25">看起来非常"发达(ar)"，这就是muscular。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He has a muscular build and can lift heavy weights.
  </text>
  <text x="50" y="310" class="content">
    他肌肉发达，能举起很重的重量。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Body outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Muscles -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Head -->
    <circle cx="175" cy="100" r="30" class="image" />
    <!-- Arms -->
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <line x1="300" y1="100" x2="350" y2="150" class="image" />
  </g>
</svg>