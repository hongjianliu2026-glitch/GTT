<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vigorous</text>
  <text x="50" y="120" class="subtitle">[ˈvɪɡərəs] adj. 精力充沛的，有力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vigor (活力) + -ous (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满活力的人，像"活力(vigor)"的化身，
    <tspan x="50" dy="25">他/她精力充沛，动作有力，就像一台永不停歇的机器。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The athlete's vigorous training paid off in the competition.
  </text>
  <text x="50" y="310" class="content">
    这位运动员的刻苦训练在比赛中得到了回报。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person with energy -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="120" class="image" /> <!-- Right arm -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Right leg -->
    <!-- Energy lines -->
    <line x1="50" y1="100" x2="20" y2="50" class="image" />
    <line x1="50" y1="100" x2="80" y2="50" class="image" />
    <line x1="50" y1="130" x2="20" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="180" class="image" />
  </g>
</svg>