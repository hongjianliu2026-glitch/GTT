<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">culinary</text>
  <text x="50" y="120" class="subtitle">[ˈkʌlɪnəri] adj. 烹饪的，厨房的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> culin (厨房) + -ary (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个厨师在厨房里，"厨房(culin)"
    <tspan x="50" dy="25">里的一切都是烹饪的(culinary)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has a passion for culinary arts.
  </text>
  <text x="50" y="310" class="content">
    她对烹饪艺术充满热情。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Kitchen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chef -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Stove -->
    <rect x="100" y="120" width="150" height="60" class="image" />
    <circle cx="120" cy="150" r="10" class="image" />
    <circle cx="160" cy="150" r="10" class="image" />
    <circle cx="200" cy="150" r="10" class="image" />
    <!-- Pot -->
    <rect x="260" y="100" width="60" height="80" class="image" />
    <line x1="260" y1="100" x2="260" y2="180" class="image" />
    <line x1="320" y1="100" x2="320" y2="180" class="image" />
  </g>
</svg>