<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dove</text>
  <text x="50" y="120" class="subtitle">[dʌv] n. 鸽子；v. 潜水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 dove，意为“鸽子”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鸽子(dove)在天空中自由飞翔，突然它决定
    <tspan x="50" dy="25">“潜水(dove)”到湖中，溅起一片水花。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dove flew gracefully across the sky.
  </text>
  <text x="50" y="310" class="content">
    鸽子优雅地飞过天空。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dove -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="100" x2="20" y2="120" class="image" />
    <line x1="50" y1="100" x2="80" y2="120" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <!-- Water splash -->
    <circle cx="50" cy="200" r="20" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="200" x2="50" y2="230" class="image" />
  </g>
</svg>