<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">adrenaline</text>
  <text x="50" y="120" class="subtitle">[əˈdrɛnəˌlin] n. 肾上腺素</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> adreno- (肾上腺) + -line (化学名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在极限运动中，肾上腺(adreno-)
    <tspan x="50" dy="25">分泌出一种"化学物质(line)"，让他充满能量和兴奋感。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The thrill of the roller coaster sent adrenaline rushing through her veins.
  </text>
  <text x="50" y="310" class="content">
    过山车的刺激让肾上腺素在她体内奔涌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Adrenal gland -->
    <circle cx="50" cy="100" r="30" class="image" />
    <text x="40" y="110" class="content" fill="#2980B9">肾上腺</text>
    <!-- Chemical molecule -->
    <line x1="100" y1="80" x2="150" y2="80" class="image" />
    <line x1="125" y1="60" x2="125" y2="100" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <text x="110" y="140" class="content" fill="#2980B9">化学物质</text>
    <!-- Person -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="160" class="image" />
    <line x1="200" y1="160" x2="180" y2="190" class="image" />
    <line x1="200" y1="160" x2="220" y2="190" class="image" />
    <line x1="200" y1="140" x2="230" y2="130" class="image" />
    <text x="190" y="210" class="content" fill="#2980B9">人</text>
  </g>
</svg>