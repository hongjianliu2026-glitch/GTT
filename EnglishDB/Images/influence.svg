<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">influence</text>
  <text x="50" y="120" class="subtitle">[ˈɪnfluəns] n. 影响，影响力；v. 影响</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + flu (流动) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一股无形的力量"流入(in-flu)"
    <tspan x="50" dy="25">并"流动(flu)"到一个人的思想中，</tspan>
    <tspan x="50" dy="25">这种力量就是"影响(influence)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her parents' influence shaped her career choices.
  </text>
  <text x="50" y="310" class="content">
    她父母的影响塑造了她的职业选择。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Invisible force -->
    <line x1="0" y1="0" x2="350" y2="200" class="image" />
    <line x1="0" y1="20" x2="350" y2="220" class="image" />
    <line x1="0" y1="40" x2="350" y2="240" class="image" />
    <line x1="0" y1="60" x2="350" y2="260" class="image" />
    <line x1="0" y1="80" x2="350" y2="280" class="image" />
    <line x1="0" y1="100" x2="350" y2="300" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="230" y2="120" class="image" />
  </g>
</svg>