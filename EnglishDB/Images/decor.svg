<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">decor</text>
  <text x="50" y="120" class="subtitle">[ˈdeɪkɔːr] n. 装饰，装潢</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (强调) + cor (心)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，"用心(cor)"
    <tspan x="50" dy="25">装饰(de-cor)，使其变得美丽和舒适。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The room was filled with beautiful decor.
  </text>
  <text x="50" y="310" class="content">
    房间里摆满了美丽的装饰品。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Wall -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Decorations -->
    <circle cx="100" cy="100" r="20" class="image" />
    <rect x="150" y="80" width="40" height="40" class="image" />
    <line x1="220" y1="80" x2="220" y2="120" class="image" />
    <line x1="200" y1="100" x2="240" y2="100" class="image" />
    <!-- Heart -->
    <path d="M300,100 C310,80 330,80 340,100 C330,120 310,120 300,100" class="image" />
  </g>
</svg>