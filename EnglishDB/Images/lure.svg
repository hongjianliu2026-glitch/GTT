<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lure</text>
  <text x="50" y="120" class="subtitle">[lʊr] n. 诱惑，诱饵；v. 引诱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> l- (拉) + ure (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只鱼被"拉(l-)"向水面，因为水面上的"诱饵(ure)"
    <tspan x="50" dy="25">在引诱它，这就是"诱惑(lure)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fisherman used a shiny lure to catch the fish.
  </text>
  <text x="50" y="310" class="content">
    渔夫用闪亮的诱饵来捕鱼。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water surface -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Fish -->
    <path d="M50,50 Q100,20 150,50 T250,50" class="image" />
    <!-- Bait -->
    <circle cx="300" cy="20" r="10" class="image" />
    <!-- Line pulling the fish -->
    <line x1="150" y1="50" x2="300" y2="20" class="image" />
  </g>
</svg>