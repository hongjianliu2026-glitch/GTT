<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cinnamon</text>
  <text x="50" y="120" class="subtitle">[ˈsɪnəmən] n. 肉桂，肉桂色</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cinnam(o)- (肉桂) + -um (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的香料店，"肉桂(cinnam)"
    <tspan x="50" dy="25">的香气弥漫在空气中，吸引着顾客前来购买。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added a pinch of cinnamon to her coffee.
  </text>
  <text x="50" y="310" class="content">
    她在咖啡里加了一小撮肉桂。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Spice shop -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Cinnamon sticks -->
    <line x1="50" y1="50" x2="100" y2="50" class="image" />
    <line x1="50" y1="70" x2="100" y2="70" class="image" />
    <line x1="50" y1="90" x2="100" y2="90" class="image" />
    <line x1="50" y1="110" x2="100" y2="110" class="image" />
    <!-- Aroma -->
    <circle cx="150" cy="80" r="10" class="image" />
    <circle cx="170" cy="80" r="10" class="image" />
    <circle cx="190" cy="80" r="10" class="image" />
    <circle cx="210" cy="80" r="10" class="image" />
    <!-- Customer -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>