<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">destabilize</text>
  <text x="50" y="120" class="subtitle">[diːˈsteɪbəlaɪz] v. 使不稳定，动摇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (去掉) + stabil (稳定) + -ize (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个平衡的跷跷板，突然有人"去掉(de-)"
    <tspan x="50" dy="25">它的支撑点，跷跷板立刻变得不稳定(destabilize)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy could destabilize the economy.
  </text>
  <text x="50" y="310" class="content">
    新政策可能会使经济不稳定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Seesaw -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="200" y1="20" x2="200" y2="100" class="image" />
    <!-- Support removed -->
    <line x1="200" y1="100" x2="200" y2="150" class="image" stroke-dasharray="5,5" />
    <!-- Person on one side -->
    <circle cx="100" cy="20" r="15" class="image" />
    <line x1="100" y1="35" x2="100" y2="70" class="image" />
    <line x1="100" y1="70" x2="80" y2="100" class="image" />
    <line x1="100" y1="70" x2="120" y2="100" class="image" />
    <line x1="100" y1="50" x2="130" y2="40" class="image" />
    <!-- Person on the other side -->
    <circle cx="300" cy="20" r="15" class="image" />
    <line x1="300" y1="35" x2="300" y2="70" class="image" />
    <line x1="300" y1="70" x2="280" y2="100" class="image" />
    <line x1="300" y1="70" x2="320" y2="100" class="image" />
    <line x1="300" y1="50" x2="330" y2="40" class="image" />
  </g>
</svg>