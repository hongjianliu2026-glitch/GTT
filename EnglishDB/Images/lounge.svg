<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lounge</text>
  <text x="50" y="120" class="subtitle">[laʊndʒ] n. 休息室，闲逛；v. 懒散地坐或站</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> loun (放松) + ge (地方)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个舒适的休息室，人们"放松(loun)"
    <tspan x="50" dy="25">地坐在那里，享受闲暇时光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We spent the afternoon lounging by the pool.
  </text>
  <text x="50" y="310" class="content">
    我们整个下午都在泳池边闲逛。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Lounge area -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sofa -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Person lounging -->
    <circle cx="150" cy="80" r="15" class="image" />
    <line x1="150" y1="95" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="130" y2="160" class="image" />
    <line x1="150" y1="130" x2="170" y2="160" class="image" />
    <line x1="150" y1="110" x2="190" y2="100" class="image" />
  </g>
</svg>