<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">head</text>
  <text x="50" y="120" class="subtitle">[hed] n. 头，首领；v. 率领，朝向</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hea- (头)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的头(hea-)，它不仅是一个人的头部，
    <tspan x="50" dy="25">还象征着领导者和方向。这个头(head)带领着一群人前进。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The captain heads the team during the match.
  </text>
  <text x="50" y="310" class="content">
    队长在比赛中率领队伍。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="5" class="image" />
    <circle cx="120" cy="90" r="5" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Leader symbol -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="70" y2="300" class="image" />
    <line x1="100" y1="250" x2="130" y2="300" class="image" />
    <line x1="100" y1="200" x2="50" y2="200" class="image" />
    <line x1="100" y1="200" x2="150" y2="200" class="image" />
  </g>
</svg>