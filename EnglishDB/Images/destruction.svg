<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">destruction</text>
  <text x="50" y="120" class="subtitle">[dɪˈstrʌkʃən] n. 破坏，毁灭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (向下) + struct (建造) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座高耸的建筑，突然被"向下建造(de-struct)"的力量摧毁，
    <tspan x="50" dy="25">整个场景如同末日降临，这就是破坏(destruction)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm caused widespread destruction.
  </text>
  <text x="50" y="310" class="content">
    这场风暴造成了广泛的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Building -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <!-- Cracked building -->
    <line x1="20" y1="50" x2="130" y2="150" class="image" />
    <line x1="20" y1="150" x2="130" y2="50" class="image" />
    <!-- Falling debris -->
    <rect x="100" y="20" width="20" height="20" class="image" />
    <rect x="120" y="40" width="20" height="20" class="image" />
    <rect x="80" y="60" width="20" height="20" class="image" />
    <rect x="110" y="80" width="20" height="20" class="image" />
  </g>
</svg>