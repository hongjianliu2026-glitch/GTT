<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hesitant</text>
  <text x="50" y="120" class="subtitle">[ˈhɛzɪtənt] adj. 犹豫的，迟疑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hesi- (粘住) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在十字路口，脚像被"粘住(hesi-)"了一样，
    <tspan x="50" dy="25">无法决定往哪个方向走，表现出犹豫不决的样子。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was hesitant to make the decision.
  </text>
  <text x="50" y="310" class="content">
    她对做出决定犹豫不决。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crossroads -->
    <line x1="50" y1="50" x2="50" y2="200" class="image" />
    <line x1="50" y1="125" x2="200" y2="125" class="image" />
    <!-- Person -->
    <circle cx="50" cy="125" r="15" class="image" />
    <line x1="50" y1="140" x2="50" y2="170" class="image" />
    <line x1="50" y1="170" x2="35" y2="200" class="image" />
    <line x1="50" y1="170" x2="65" y2="200" class="image" />
    <line x1="50" y1="155" x2="70" y2="145" class="image" />
    <!-- Glue -->
    <rect x="30" y="120" width="40" height="5" class="image" />
  </g>
</svg>