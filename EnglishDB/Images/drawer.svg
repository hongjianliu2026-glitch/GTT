<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drawer</text>
  <text x="50" y="120" class="subtitle">[ˈdrɔːrər] n. 抽屉，绘图员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> draw (拉) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的抽屉，"拉(draw)"出来后，里面装满了各种绘图工具，
    <tspan x="50" dy="25">这个抽屉就是绘图员的宝库(drawer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She opened the drawer to find her pens.
  </text>
  <text x="50" y="310" class="content">
    她打开抽屉找她的笔。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Drawer -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <!-- Handle -->
    <rect x="140" y="10" width="20" height="30" class="image" />
    <!-- Tools inside the drawer -->
    <line x1="20" y1="50" x2="280" y2="50" class="image" />
    <line x1="20" y1="80" x2="250" y2="80" class="image" />
    <line x1="20" y1="110" x2="270" y2="110" class="image" />
    <line x1="20" y1="140" x2="240" y2="140" class="image" />
    <!-- Pencil -->
    <rect x="50" y="60" width="100" height="10" class="image" />
    <!-- Ruler -->
    <rect x="170" y="60" width="100" height="10" class="image" />
    <!-- Eraser -->
    <rect x="50" y="90" width="30" height="20" class="image" />
  </g>
</svg>