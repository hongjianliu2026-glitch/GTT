<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tough</text>
  <text x="50" y="120" class="subtitle">[tʌf] adj. 坚韧的，坚强的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tuf (来自古英语，意为“坚韧”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个战士，他的皮肤像"坚韧的皮革(tuf)"一样，
    <tspan x="50" dy="25">无论多么艰难的战斗，他都能坚持下来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a tough negotiator; she never gives up easily.
  </text>
  <text x="50" y="310" class="content">
    她是一个坚韧的谈判者；她从不轻易放弃。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Warrior -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="130" class="image" />
    <line x1="50" y1="150" x2="0" y2="130" class="image" />
    <!-- Shield -->
    <rect x="20" y="130" width="60" height="40" class="image" />
    <!-- Sword -->
    <line x1="100" y1="130" x2="150" y2="130" class="image" />
    <line x1="150" y1="130" x2="130" y2="110" class="image" />
    <line x1="150" y1="130" x2="130" y2="150" class="image" />
  </g>
</svg>