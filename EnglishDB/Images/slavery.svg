<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #6E2C00; }
      .subtitle { font: italic 24px serif; fill: #7B7D7D; }
      .content { font: 18px sans-serif; fill: #1B2631; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #21618C; }
      .image { stroke: #5D6D7E; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slavery</text>
  <text x="50" y="120" class="subtitle">[ˈsleɪvəri] n. 奴隶制，奴役</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> slave (奴隶) + -ry (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个奴隶被铁链束缚，"奴隶(slave)"
    <tspan x="50" dy="25">的状态和制度就是奴隶制(slavery)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The abolition of slavery was a significant milestone in history.
  </text>
  <text x="50" y="310" class="content">
    废除奴隶制是历史上一个重要的里程碑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chains -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="70" y1="50" x2="70" y2="150" class="image" />
    <line x1="90" y1="50" x2="90" y2="150" class="image" />
    <line x1="110" y1="50" x2="110" y2="150" class="image" />
    <!-- Slave -->
    <circle cx="80" cy="170" r="20" class="image" />
    <line x1="80" y1="190" x2="80" y2="230" class="image" />
    <line x1="80" y1="230" x2="60" y2="260" class="image" />
    <line x1="80" y1="230" x2="100" y2="260" class="image" />
    <line x1="80" y1="210" x2="110" y2="200" class="image" />
  </g>
</svg>