<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hold</text>
  <text x="50" y="120" class="subtitle">[həʊld] v. 持有，握住；n. 控制，掌握</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hol- (来自古英语 healdan，意为“持有”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人紧紧握住(hold)一个巨大的金块，
    <tspan x="50" dy="25">金块的重量让他不得不全力以赴，这就是“持有”的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She held the trophy tightly, afraid it might slip.
  </text>
  <text x="50" y="310" class="content">
    她紧紧握住奖杯，生怕它会滑落。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person holding a large gold bar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Gold bar -->
    <rect x="100" y="50" width="150" height="100" class="image" fill="#FFD700" />
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="150" x2="20" y2="130" class="image" />
    <line x1="50" y1="150" x2="80" y2="130" class="image" />
    <line x1="50" y1="180" x2="20" y2="200" class="image" />
    <line x1="50" y1="180" x2="80" y2="200" class="image" />
    <!-- Hand holding the gold bar -->
    <line x1="50" y1="150" x2="100" y2="100" class="image" />
  </g>
</svg>