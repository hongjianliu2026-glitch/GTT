<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thought</text>
  <text x="50" y="120" class="subtitle">[θɔːt] n. 思想，想法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> th- (思考) + ought (应该)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在沉思，"思考(th-)"
    <tspan x="50" dy="25">着应该(ought)如何行动，这个过程就产生了思想(thought)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a thought that changed her life.
  </text>
  <text x="50" y="310" class="content">
    她有一个改变了她生活的想法。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Brain -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Thought bubble -->
    <path d="M 100 20 Q 150 50 100 80 Q 50 50 100 20" class="image" />
    <!-- Thought lines -->
    <line x1="100" y1="100" x2="100" y2="180" class="image" />
    <line x1="100" y1="140" x2="150" y2="120" class="image" />
    <line x1="100" y1="140" x2="50" y2="120" class="image" />
  </g>
</svg>