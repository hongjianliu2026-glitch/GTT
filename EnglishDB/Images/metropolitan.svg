<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">metropolitan</text>
  <text x="50" y="120" class="subtitle">[ˌmetrəˈpɒlɪtən] adj. 大都市的，大都会的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> metro- (母亲) + polit (城市) + -an (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的城市，就像一个"母亲(metro)"
    <tspan x="50" dy="25">一样包容着无数的"城市(polit)"，这就是大都市(metropolitan)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The metropolitan area is home to over 10 million people.
  </text>
  <text x="50" y="310" class="content">
    这个大都市地区居住着超过1000万人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="30" height="100" class="image" />
    <rect x="100" y="40" width="30" height="80" class="image" />
    <rect x="150" y="10" width="30" height="120" class="image" />
    <rect x="200" y="30" width="30" height="90" class="image" />
    <rect x="250" y="50" width="30" height="70" class="image" />
    <!-- Mother figure -->
    <circle cx="20" cy="150" r="15" class="image" />
    <line x1="20" y1="165" x2="20" y2="190" class="image" />
    <line x1="20" y1="190" x2="0" y2="220" class="image" />
    <line x1="20" y1="190" x2="40" y2="220" class="image" />
    <line x1="20" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>