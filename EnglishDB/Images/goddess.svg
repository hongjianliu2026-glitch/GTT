<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">goddess</text>
  <text x="50" y="120" class="subtitle">[ˈɡɒdes] n. 女神</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> god (神) + -ess (表示女性)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位美丽的女神，她拥有无与伦比的力量和智慧，
    <tspan x="50" dy="25">她是众神中的女性代表，被人们崇拜和敬仰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was worshipped as a goddess in ancient times.
  </text>
  <text x="50" y="310" class="content">
    她在古代被奉为女神。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Goddess figure -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="50" y2="350" class="image" />
    <line x1="100" y1="250" x2="150" y2="350" class="image" />
    <line x1="100" y1="180" x2="50" y2="220" class="image" />
    <line x1="100" y1="180" x2="150" y2="220" class="image" />
    <!-- Halo -->
    <circle cx="100" cy="70" r="20" class="image" />
    <!-- Symbols -->
    <rect x="50" y="300" width="100" height="50" class="image" />
    <line x1="75" y1="310" x2="125" y2="310" class="image" />
    <line x1="75" y1="330" x2="125" y2="330" class="image" />
  </g>
</svg>