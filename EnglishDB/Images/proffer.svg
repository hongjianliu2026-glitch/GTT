<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">proffer</text>
  <text x="50" y="120" class="subtitle">[ˈprɒfə(r)] v. 提供，提出</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pro- (向前) + fer (带来)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"向前带来(pro-fer)"
    <tspan x="50" dy="25">一份礼物，这就是提供(proffer)的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He proffered a solution to the problem.
  </text>
  <text x="50" y="310" class="content">
    他提出了解决问题的方案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Gift -->
    <rect x="100" y="120" width="60" height="40" class="image" />
    <line x1="100" y1="120" x2="160" y2="120" class="image" />
    <line x1="100" y1="160" x2="160" y2="160" class="image" />
    <line x1="100" y1="120" x2="100" y2="160" class="image" />
    <line x1="160" y1="120" x2="160" y2="160" class="image" />
    <!-- Arrow -->
    <line x1="80" y1="140" x2="100" y2="140" class="image" />
    <line x1="90" y1="135" x2="100" y2="140" class="image" />
    <line x1="90" y1="145" x2="100" y2="140" class="image" />
  </g>
</svg>