<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handy</text>
  <text x="50" y="120" class="subtitle">[ˈhændi] adj. 方便的，手巧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hand (手) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个手巧的人，"手(hand)"
    <tspan x="50" dy="25">能轻松完成各种任务，这样的人非常方便(handy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This tool is really handy for fixing things around the house.
  </text>
  <text x="50" y="310" class="content">
    这个工具在家里修理东西时非常方便。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="150" x2="65" y2="120" class="image" />
    <line x1="50" y1="150" x2="35" y2="120" class="image" />
    <!-- Tool -->
    <rect x="100" y="150" width="100" height="50" class="image" />
    <line x1="120" y1="170" x2="180" y2="170" class="image" />
    <line x1="150" y1="170" x2="150" y2="200" class="image" />
  </g>
</svg>