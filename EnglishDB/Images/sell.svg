<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sell</text>
  <text x="50" y="120" class="subtitle">[sel] v. 卖，销售</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sel- (来自古英语 sellan，意为“给予”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个商人站在摊位前，手里拿着商品，大声喊着：“快来买(sell)，快来买！”
    <tspan x="50" dy="25">他正在“给予(sel-)”商品，换取金钱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sold her old car to buy a new one.
  </text>
  <text x="50" y="310" class="content">
    她卖掉了旧车，买了一辆新车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stall -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Merchant -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Product -->
    <rect x="100" y="80" width="50" height="50" class="image" />
    <rect x="160" y="80" width="50" height="50" class="image" />
    <rect x="220" y="80" width="50" height="50" class="image" />
    <!-- Money -->
    <circle cx="125" cy="150" r="10" class="image" />
    <circle cx="185" cy="150" r="10" class="image" />
    <circle cx="245" cy="150" r="10" class="image" />
  </g>
</svg>