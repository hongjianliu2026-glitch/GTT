<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">helm</text>
  <text x="50" y="120" class="subtitle">[hɛlm] n. 舵，舵轮</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hel- (来自古英语 hēolm, 意为“船的中央部分”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘船的中央部分，船长紧握着舵轮(helm)，
    <tspan x="50" dy="25">掌控着船的方向，带领船只安全航行。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The captain took the helm and steered the ship through the storm.
  </text>
  <text x="50" y="310" class="content">
    船长掌舵，带领船只穿过风暴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ship's helm -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <!-- Captain -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Ship -->
    <rect x="0" y="200" width="300" height="50" class="image" />
    <line x1="50" y1="200" x2="50" y2="150" class="image" />
    <line x1="250" y1="200" x2="250" y2="150" class="image" />
  </g>
</svg>