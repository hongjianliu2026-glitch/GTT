<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">constructivist</text>
  <text x="50" y="120" class="subtitle">[kənˈstrʌktɪvɪst] n. 建构主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + struct (建造) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在一起"建造(con-struct)"一个巨大的知识城堡，
    <tspan x="50" dy="25">他们就是建构主义者(constructivist)，通过合作构建知识。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The constructivist approach emphasizes learning through active participation.
  </text>
  <text x="50" y="310" class="content">
    建构主义方法强调通过积极参与来学习。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle base -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Castle towers -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="150" y="20" width="50" height="100" class="image" />
    <rect x="250" y="20" width="50" height="100" class="image" />
    <!-- Castle walls -->
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <!-- People -->
    <circle cx="75" cy="180" r="15" class="image" />
    <circle cx="175" cy="180" r="15" class="image" />
    <circle cx="275" cy="180" r="15" class="image" />
    <!-- Arms -->
    <line x1="75" y1="195" x2="50" y2="180" class="image" />
    <line x1="175" y1="195" x2="150" y2="180" class="image" />
    <line x1="275" y1="195" x2="300" y2="180" class="image" />
  </g>
</svg>