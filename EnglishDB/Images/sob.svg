<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sob</text>
  <text x="50" y="120" class="subtitle">[sɒb] v. 啜泣，呜咽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sob (源自中古英语，意为哭泣)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在角落里，"啜泣(sob)"，眼泪一滴一滴地落下，
    <tspan x="50" dy="25">声音微弱却充满了悲伤。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She sobbed quietly in the dark room.
  </text>
  <text x="50" y="310" class="content">
    她在黑暗的房间里悄悄啜泣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="50" r="30" class="image" />
    <line x1="50" y1="80" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="100" x2="20" y2="90" class="image" />
    <line x1="50" y1="100" x2="80" y2="90" class="image" />
    <!-- Tears -->
    <line x1="40" y1="40" x2="30" y2="20" class="image" />
    <line x1="60" y1="40" x2="70" y2="20" class="image" />
    <line x1="50" y1="80" x2="50" y2="100" class="image" />
  </g>
</svg>