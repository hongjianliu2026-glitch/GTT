<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">taunt</text>
  <text x="50" y="120" class="subtitle">[tɔːnt] v. 嘲弄，奚落</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> taun (来自古法语，意为“嘲笑”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个调皮的小孩，站在高处，"嘲笑(taunt)"
    <tspan x="50" dy="25">下面的同学，手里还拿着一面镜子，反射阳光，</tspan>
    <tspan x="50" dy="25">让阳光刺眼地照在同学的脸上。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bully taunted the smaller kids.
  </text>
  <text x="50" y="310" class="content">
    那个恶霸嘲弄了那些较小的孩子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Child on a platform -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Mirror -->
    <rect x="220" y="80" width="30" height="30" class="image" />
    <!-- Sunlight -->
    <line x1="235" y1="80" x2="235" y2="20" class="image" />
    <line x1="235" y1="80" x2="265" y2="50" class="image" />
    <line x1="235" y1="80" x2="205" y2="50" class="image" />
  </g>
</svg>