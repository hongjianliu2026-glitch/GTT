<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gentleman</text>
  <text x="50" y="120" class="subtitle">[ˈdʒentlmən] n. 绅士，先生</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gentle (温和的) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着西装、举止优雅的"温和的人(gentle-man)"，
    <tspan x="50" dy="25">他总是彬彬有礼，这就是绅士(gentleman)的形象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The gentleman opened the door for the lady.
  </text>
  <text x="50" y="310" class="content">
    那位绅士为女士打开了门。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Suit -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Tie -->
    <line x1="75" y1="20" x2="75" y2="60" class="image" />
    <line x1="75" y1="40" x2="50" y2="30" class="image" />
    <line x1="75" y1="40" x2="100" y2="30" class="image" />
    <!-- Face -->
    <circle cx="75" cy="100" r="20" class="image" />
    <!-- Smile -->
    <path d="M65,105 Q75,115 85,105" class="image" />
    <!-- Eyes -->
    <circle cx="65" cy="90" r="3" class="image" />
    <circle cx="85" cy="90" r="3" class="image" />
  </g>
</svg>