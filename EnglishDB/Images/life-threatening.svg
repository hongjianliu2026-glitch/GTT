<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">life-threatening</text>
  <text x="50" y="120" class="subtitle">[ˈlaɪf ˈθretnɪŋ] adj. 危及生命的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> life (生命) + threaten (威胁)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的骷髅头在追逐一个奔跑的人，"生命(life)受到威胁(threaten)"，
    <tspan x="50" dy="25">这种情景让人感到极度危险，即危及生命的(life-threatening)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm was life-threatening, so we had to evacuate.
  </text>
  <text x="50" y="310" class="content">
    这场风暴危及生命，所以我们不得不撤离。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Skull -->
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <line x1="100" y1="120" x2="100" y2="150" class="image" />
    <line x1="80" y1="150" x2="120" y2="150" class="image" />
    <!-- Person running -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
    <line x1="250" y1="130" x2="220" y2="120" class="image" />
  </g>
</svg>