<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .water { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">water</text>
  <text x="50" y="120" class="subtitle">[ˈwɔːtər] n. 水；v. 浇水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自原始印欧语 *wed- (湿润)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的水滴从天而降，"湿润(wed-)"
    <tspan x="50" dy="25">大地，这就是水的力量(water)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She drinks a glass of water every morning.
  </text>
  <text x="50" y="310" class="content">
    她每天早上喝一杯水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water droplet -->
    <ellipse cx="100" cy="100" rx="80" ry="100" class="water" />
    <!-- Ground -->
    <rect x="0" y="200" width="350" height="50" class="image" />
    <!-- Water splashing -->
    <path d="M 100 100 Q 150 50 200 100 T 300 100" class="water" />
    <path d="M 100 100 Q 150 150 200 100 T 300 100" class="water" />
  </g>
</svg>