<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">thirteenth</text>
  <text x="50" y="120" class="subtitle">[ˌθɜːrˈtiːnθ] adj. 第十三的；n. 第十三</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> thirte(en) (十三) + -th (序数词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的数字“13”，它像一个巨人一样站在一群小数字前面，
    <tspan x="50" dy="25">宣告自己是“第十三(thirteenth)”，显得格外突出。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She was the thirteenth person to arrive at the party.
  </text>
  <text x="50" y="310" class="content">
    她是第十三个到达派对的人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large number 13 -->
    <text x="0" y="100" font-size="200" fill="#E74C3C">13</text>
    <!-- Smaller numbers -->
    <text x="100" y="50" font-size="50" fill="#34495E">1</text>
    <text x="150" y="50" font-size="50" fill="#34495E">2</text>
    <text x="200" y="50" font-size="50" fill="#34495E">3</text>
    <text x="250" y="50" font-size="50" fill="#34495E">4</text>
    <text x="300" y="50" font-size="50" fill="#34495E">5</text>
    <text x="350" y="50" font-size="50" fill="#34495E">6</text>
    <text x="400" y="50" font-size="50" fill="#34495E">7</text>
    <text x="450" y="50" font-size="50" fill="#34495E">8</text>
    <text x="500" y="50" font-size="50" fill="#34495E">9</text>
    <text x="550" y="50" font-size="50" fill="#34495E">10</text>
    <text x="600" y="50" font-size="50" fill="#34495E">11</text>
    <text x="650" y="50" font-size="50" fill="#34495E">12</text>
  </g>
</svg>