<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rolled</text>
  <text x="50" y="120" class="subtitle">[roʊld] v. 滚动，卷起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> roll (滚动) + -ed (过去式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的纸卷，"滚动(roll)"
    <tspan x="50" dy="25">在地面上，卷起(rolled)了一切。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ball rolled down the hill.
  </text>
  <text x="50" y="310" class="content">
    球滚下了山。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- Rolling paper -->
    <rect x="50" y="100" width="250" height="80" class="image" />
    <!-- Rolling motion -->
    <line x1="70" y1="100" x2="280" y2="100" class="image" />
    <line x1="70" y1="120" x2="250" y2="120" class="image" />
    <line x1="70" y1="140" x2="270" y2="140" class="image" />
    <line x1="70" y1="160" x2="240" y2="160" class="image" />
    <!-- Rolling effect -->
    <circle cx="20" cy="190" r="15" class="image" />
    <line x1="20" y1="205" x2="20" y2="240" class="image" />
    <line x1="20" y1="240" x2="0" y2="270" class="image" />
    <line x1="20" y1="240" x2="40" y2="270" class="image" />
    <line x1="20" y1="220" x2="50" y2="210" class="image" />
  </g>
</svg>