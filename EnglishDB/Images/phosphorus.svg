<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDF2E9; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">phosphorus</text>
  <text x="50" y="120" class="subtitle">[ˈfɒsfərəs] n. 磷</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> phos- (光) + phor (携带)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的矿石，"携带光(phos-phor)"
    <tspan x="50" dy="25">芒，在黑暗中闪烁，这就是磷(phosphorus)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Phosphorus is essential for plant growth.
  </text>
  <text x="50" y="310" class="content">
    磷对植物生长至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Light emitting stone -->
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="100" y1="50" x2="100" y2="150" class="image" />
    <line x1="50" y1="100" x2="150" y2="100" class="image" />
    <line x1="75" y1="75" x2="125" y2="125" class="image" />
    <line x1="75" y1="125" x2="125" y2="75" class="image" />
    <!-- Light rays -->
    <line x1="100" y1="50" x2="100" y2="20" class="image" />
    <line x1="100" y1="150" x2="100" y2="180" class="image" />
    <line x1="50" y1="100" x2="20" y2="100" class="image" />
    <line x1="150" y1="100" x2="180" y2="100" class="image" />
  </g>
</svg>