<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">interchangeable</text>
  <text x="50" y="120" class="subtitle">[ˌɪntərˈtʃeɪndʒəbl] adj. 可互换的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inter- (在...之间) + change (改变) + -able (能够)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个盒子，里面装着相同的物品，你可以随意"在它们之间改变(inter-change)"
    <tspan x="50" dy="25">位置，因为它们是可互换的(interchangeable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> These parts are interchangeable, so you can replace one with the other.
  </text>
  <text x="50" y="310" class="content">
    这些零件是可互换的，所以你可以用一个替换另一个。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="150" height="150" class="image" />
    <!-- Box 2 -->
    <rect x="200" y="0" width="150" height="150" class="image" />
    <!-- Item in Box 1 -->
    <circle cx="75" cy="75" r="30" class="image" />
    <!-- Item in Box 2 -->
    <circle cx="275" cy="75" r="30" class="image" />
    <!-- Arrow indicating interchangeability -->
    <line x1="150" y1="75" x2="200" y2="75" class="image" />
    <polygon points="190,65 200,75 190,85" class="image" />
  </g>
</svg>