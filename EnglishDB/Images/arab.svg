<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Arab</text>
  <text x="50" y="120" class="subtitle">[ˈærəb] n. 阿拉伯人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自阿拉伯语 "عرب" (ʿarab)，意为“沙漠居民”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个阿拉伯人骑着骆驼在沙漠中穿行，
    <tspan x="50" dy="25">骆驼的驼峰高高耸立，象征着阿拉伯人的坚韧与耐力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Arab traders brought spices from the East.
  </text>
  <text x="50" y="310" class="content">
    阿拉伯商人从东方带来了香料。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Camel -->
    <circle cx="100" cy="150" r="50" class="image" /> <!-- Camel's hump -->
    <circle cx="100" cy="100" r="30" class="image" /> <!-- Camel's body -->
    <line x1="100" y1="100" x2="100" y2="50" class="image" /> <!-- Camel's neck -->
    <circle cx="100" cy="50" r="10" class="image" /> <!-- Camel's head -->
    <line x1="90" y1="50" x2="80" y2="40" class="image" /> <!-- Camel's ear -->
    <line x1="110" y1="50" x2="120" y2="40" class="image" /> <!-- Camel's ear -->
    <line x1="100" y1="100" x2="50" y2="150" class="image" /> <!-- Camel's leg -->
    <line x1="100" y1="100" x2="150" y2="150" class="image" /> <!-- Camel's leg -->
    <line x1="100" y1="150" x2="50" y2="200" class="image" /> <!-- Camel's leg -->
    <line x1="100" y1="150" x2="150" y2="200" class="image" /> <!-- Camel's leg -->

    <!-- Desert -->
    <rect x="0" y="200" width="300" height="100" class="image" />
    <line x1="0" y1="200" x2="300" y2="200" class="image" />
    <line x1="0" y1="220" x2="300" y2="220" class="image" />
    <line x1="0" y1="240" x2="300" y2="240" class="image" />
    <line x1="0" y1="260" x2="300" y2="260" class="image" />
    <line x1="0" y1="280" x2="300" y2="280" class="image" />
    <line x1="0" y1="300" x2="300" y2="300" class="image" />
  </g>
</svg>