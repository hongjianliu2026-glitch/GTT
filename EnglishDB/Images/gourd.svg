<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9E79F; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gourd</text>
  <text x="50" y="120" class="subtitle">[ɡʊərd] n. 葫芦，葫芦科植物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gourd (源自中古英语，意为葫芦)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的葫芦(gourd)挂在藤蔓上，
    <tspan x="50" dy="25">它的形状像一个巨大的水壶，里面装满了神奇的液体。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She used a gourd to carry water from the well.
  </text>
  <text x="50" y="310" class="content">
    她用一个葫芦从井里打水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Vine -->
    <line x1="0" y1="200" x2="400" y2="200" class="image" />
    <line x1="50" y1="200" x2="50" y2="100" class="image" />
    <line x1="150" y1="200" x2="150" y2="150" class="image" />
    <line x1="250" y1="200" x2="250" y2="180" class="image" />
    <line x1="350" y1="200" x2="350" y2="120" class="image" />

    <!-- Gourd -->
    <ellipse cx="50" cy="80" rx="30" ry="40" class="image" />
    <ellipse cx="150" cy="130" rx="40" ry="50" class="image" />
    <ellipse cx="250" cy="160" rx="50" ry="60" class="image" />
    <ellipse cx="350" cy="100" rx="35" ry="45" class="image" />
  </g>
</svg>