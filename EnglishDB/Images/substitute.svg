<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">substitute</text>
  <text x="50" y="120" class="subtitle">[ˈsʌbstɪtjuːt] n. 代替者，代用品；v. 代替</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sub- (在下面) + stitut (站立)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在另一个人的"下面(sub-)"，准备随时"站立(stitut)"起来代替他。
    <tspan x="50" dy="25">这个人就是"代替者(substitute)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coach used a substitute player in the second half.
  </text>
  <text x="50" y="310" class="content">
    教练在下半场使用了一名替补球员。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing below -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />

    <!-- Person being replaced -->
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="150" y1="120" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="130" y2="220" class="image" />
    <line x1="150" y1="180" x2="170" y2="220" class="image" />
    <line x1="150" y1="140" x2="180" y2="130" class="image" />

    <!-- Arrow indicating substitution -->
    <line x1="80" y1="150" x2="120" y2="150" class="image" />
    <polygon points="120,145 130,150 120,155" class="image" />
  </g>
</svg>