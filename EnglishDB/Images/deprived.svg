<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">deprived</text>
  <text x="50" y="120" class="subtitle">[dɪˈpraɪvd] adj. 被剥夺的，贫困的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (离开) + priv (剥夺) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"剥夺(de-priv)"了所有基本需求，
    <tspan x="50" dy="25">变得"贫困(deprived)"，只能蜷缩在角落里。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The children in the orphanage were deprived of love and care.
  </text>
  <text x="50" y="310" class="content">
    孤儿院的孩子们被剥夺了爱和关怀。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person in a corner -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Corner -->
    <line x1="0" y1="240" x2="100" y2="240" class="image" />
    <line x1="0" y1="240" x2="0" y2="340" class="image" />
    <line x1="0" y1="340" x2="100" y2="340" class="image" />
    <line x1="100" y1="240" x2="100" y2="340" class="image" />
  </g>
</svg>