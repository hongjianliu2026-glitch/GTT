  <!-- Title -->
  <text x="50" y="80" class="title">estranged</text>
  <text x="50" y="120" class="subtitle">[ɪˈstreɪndʒd] adj. 疏远的，分离的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> e- (出) + strange (陌生的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"推出(e-)"了熟悉的环境，变得"陌生(strange)"，
    <tspan x="50" dy="25">最终变得疏远(estranged)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After the argument, they became estranged from each other.
  </text>
  <text x="50" y="310" class="content">
    争吵之后，他们彼此疏远了。
  </text>

