<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">handling</text>
  <text x="50" y="120" class="subtitle">[ˈhændlɪŋ] n. 处理，操作；v. 处理（handle的ing形式）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hand (手) + -ling (表示动作或状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人用双手"处理(handling)"一堆文件，
    <tspan x="50" dy="25">每一份文件都需要仔细操作，确保无误。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company has improved its handling of customer complaints.
  </text>
  <text x="50" y="310" class="content">
    公司改进了处理客户投诉的方式。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Papers -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="170" y="20" width="100" height="160" class="image" />
    <rect x="290" y="20" width="50" height="160" class="image" />
    <!-- Hands -->
    <circle cx="100" cy="180" r="15" class="image" />
    <circle cx="220" cy="180" r="15" class="image" />
    <line x1="100" y1="195" x2="100" y2="220" class="image" />
    <line x1="220" y1="195" x2="220" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="240" class="image" />
    <line x1="100" y1="220" x2="120" y2="240" class="image" />
    <line x1="220" y1="220" x2="200" y2="240" class="image" />
    <line x1="220" y1="220" x2="240" y2="240" class="image" />
  </g>
</svg>