<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">newsman</text>
  <text x="50" y="120" class="subtitle">[ˈnuːzmən] n. 新闻记者，报人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> news (新闻) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个记者拿着麦克风，站在新闻现场，"报道新闻(news)"
    <tspan x="50" dy="25">的人(man)，他就是新闻记者(newsman)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The newsman reported the latest developments in the city.
  </text>
  <text x="50" y="310" class="content">
    这位新闻记者报道了城市的最新发展。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Microphone -->
    <rect x="50" y="20" width="20" height="160" class="image" />
    <circle cx="60" cy="180" r="20" class="image" />
    <!-- Newsman -->
    <circle cx="60" cy="100" r="15" class="image" />
    <line x1="60" y1="115" x2="60" y2="150" class="image" />
    <line x1="60" y1="150" x2="40" y2="180" class="image" />
    <line x1="60" y1="150" x2="80" y2="180" class="image" />
    <line x1="60" y1="130" x2="90" y2="120" class="image" />
    <!-- News scene -->
    <rect x="120" y="20" width="200" height="160" class="image" />
    <text x="130" y="100" class="content" fill="#7F8C8D">News Scene</text>
  </g>
</svg>