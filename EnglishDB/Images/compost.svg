<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compost</text>
  <text x="50" y="120" class="subtitle">[ˈkɒmpɒst] n. 堆肥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + post (放置)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一堆垃圾和植物残渣被"一起放置(com-post)"
    <tspan x="50" dy="25">在一个大坑里，经过时间的魔法，它们变成了肥沃的堆肥(compost)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She added compost to her garden to enrich the soil.
  </text>
  <text x="50" y="310" class="content">
    她往花园里添加了堆肥以丰富土壤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Compost pile -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Trash and plant debris -->
    <rect x="50" y="20" width="100" height="50" class="image" />
    <rect x="160" y="20" width="100" height="50" class="image" />
    <rect x="270" y="20" width="50" height="50" class="image" />
    <rect x="50" y="80" width="100" height="50" class="image" />
    <rect x="160" y="80" width="100" height="50" class="image" />
    <rect x="270" y="80" width="50" height="50" class="image" />
    <!-- Compost pile -->
    <rect x="50" y="140" width="270" height="50" class="image" />
    <!-- Soil -->
    <rect x="50" y="190" width="270" height="10" class="image" />
  </g>
</svg>