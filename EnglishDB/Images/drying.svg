<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drying</text>
  <text x="50" y="120" class="subtitle">[ˈdraɪɪŋ] adj. 干燥的，正在变干的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dry (干燥) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一件湿衣服挂在晾衣架上，"正在变干(drying)"，
    <tspan x="50" dy="25">水滴从衣服上慢慢滴落，衣服逐渐变得干燥。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The drying clothes on the line smell fresh.
  </text>
  <text x="50" y="310" class="content">
    晾衣绳上正在变干的衣物闻起来很清新。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clothesline -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Drying clothes -->
    <rect x="50" y="20" width="50" height="80" class="image" />
    <rect x="150" y="20" width="50" height="80" class="image" />
    <rect x="250" y="20" width="50" height="80" class="image" />
    <!-- Drops of water -->
    <circle cx="75" cy="110" r="10" class="image" />
    <circle cx="175" cy="110" r="10" class="image" />
    <circle cx="275" cy="110" r="10" class="image" />
  </g>
</svg>