<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FF6F61; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .rose { fill: #FF6F61; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rosy</text>
  <text x="50" y="120" class="subtitle">[ˈroʊzi] adj. 玫瑰色的，美好的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ros (玫瑰) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一朵盛开的玫瑰花，它的颜色是如此鲜艳，
    <tspan x="50" dy="25">以至于整个世界都变得"玫瑰色(rosy)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She had a rosy future ahead of her.
  </text>
  <text x="50" y="310" class="content">
    她有一个美好的未来。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rose flower -->
    <circle cx="100" cy="100" r="50" class="rose" />
    <circle cx="130" cy="70" r="30" class="rose" />
    <circle cx="160" cy="100" r="30" class="rose" />
    <circle cx="115" cy="120" r="30" class="rose" />
    <circle cx="145" cy="120" r="30" class="rose" />
    <!-- Stem -->
    <line x1="130" y1="150" x2="130" y2="250" class="image" />
    <!-- Leaves -->
    <path d="M120,250 Q100,230 120,210 Q140,230 120,250" class="image" />
    <path d="M140,250 Q160,230 140,210 Q120,230 140,250" class="image" />
  </g>
</svg>