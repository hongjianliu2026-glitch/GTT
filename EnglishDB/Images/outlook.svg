<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outlook</text>
  <text x="50" y="120" class="subtitle">[ˈaʊtlʊk] n. 展望，前景；观点，看法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (向外) + look (看)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在山顶，"向外看(out-look)"
    <tspan x="50" dy="25">整个世界，他的视野决定了他的展望(outlook)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The economic outlook for the next year is promising.
  </text>
  <text x="50" y="310" class="content">
    明年的经济前景是乐观的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,200 L100,0 L200,200 Z" class="image" />
    <!-- Person -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
    <!-- Horizon -->
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <!-- Sun -->
    <circle cx="180" cy="100" r="20" class="image" fill="#F1C40F" />
  </g>
</svg>