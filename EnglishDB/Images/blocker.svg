<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blocker</text>
  <text x="50" y="120" class="subtitle">[ˈblɒkə(r)] n. 障碍物，阻碍者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> block (阻挡) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"阻挡者(blocker)"站在路中间，
    <tspan x="50" dy="25">像一堵墙一样挡住了所有前进的道路。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The security guard acted as a blocker to prevent unauthorized access.
  </text>
  <text x="50" y="310" class="content">
    保安充当了一个阻挡者，防止未经授权的进入。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Blocker -->
    <rect x="150" y="50" width="50" height="100" class="image" />
    <!-- Arms -->
    <line x1="150" y1="50" x2="120" y2="20" class="image" />
    <line x1="200" y1="50" x2="230" y2="20" class="image" />
    <!-- Legs -->
    <line x1="150" y1="150" x2="120" y2="180" class="image" />
    <line x1="200" y1="150" x2="230" y2="180" class="image" />
  </g>
</svg>