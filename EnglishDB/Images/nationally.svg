<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">nationally</text>
  <text x="50" y="120" class="subtitle">[ˈnæʃnəli] adv. 全国性地，国家范围地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> nation (国家) + -al (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的地图，上面覆盖着国旗，象征着"全国性地(nationally)"
    <tspan x="50" dy="25">的活动或事件，比如全国性的选举或节日。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The event was broadcast nationally.
  </text>
  <text x="50" y="310" class="content">
    这个活动在全国范围内播出。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Map -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Flag -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Stars -->
    <circle cx="80" cy="50" r="5" class="image" />
    <circle cx="100" cy="50" r="5" class="image" />
    <circle cx="120" cy="50" r="5" class="image" />
    <circle cx="140" cy="50" r="5" class="image" />
    <circle cx="160" cy="50" r="5" class="image" />
    <!-- Stripes -->
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
  </g>
</svg>