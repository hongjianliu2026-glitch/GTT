<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unlucky</text>
  <text x="50" y="120" class="subtitle">[ʌnˈlʌki] adj. 不幸的，倒霉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + lucky (幸运的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人走在路上，突然被一只乌鸦的粪便"不幸运地(un-lucky)"
    <tspan x="50" dy="25">砸中，这就是不幸的(unlucky)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was unlucky to miss the last bus.
  </text>
  <text x="50" y="310" class="content">
    他不幸错过了最后一班公交车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Bird -->
    <circle cx="200" cy="50" r="15" class="image" />
    <line x1="200" y1="65" x2="200" y2="80" class="image" />
    <line x1="200" y1="80" x2="180" y2="100" class="image" />
    <line x1="200" y1="80" x2="220" y2="100" class="image" />
    <!-- Drop -->
    <line x1="200" y1="80" x2="50" y2="120" class="image" stroke-dasharray="5,5" />
    <circle cx="50" cy="120" r="5" class="image" fill="#7F8C8D" />
  </g>
</svg>