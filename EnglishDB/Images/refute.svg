<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">refute</text>
  <text x="50" y="120" class="subtitle">[rɪˈfjuːt] v. 反驳，驳斥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (反) + fute (打)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在辩论中，"反打(re-fute)"
    <tspan x="50" dy="25">对手的观点，用有力的证据驳斥(refute)对方。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She quickly refuted his argument with solid facts.
  </text>
  <text x="50" y="310" class="content">
    她迅速用确凿的事实反驳了他的论点。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Debate stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Speaker 1 -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="90" y2="120" class="image" />
    <!-- Speaker 2 -->
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="300" y1="150" x2="280" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="300" y1="130" x2="340" y2="120" class="image" />
    <!-- Refuting gesture -->
    <line x1="50" y1="130" x2="300" y2="130" class="image" />
    <polygon points="50,130 300,130 300,120" class="image" />
  </g>
</svg>