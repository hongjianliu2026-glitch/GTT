<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clamor</text>
  <text x="50" y="120" class="subtitle">[ˈklæmər] n. 喧闹，吵闹；v. 喧嚷，大声要求</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> clam (喊叫) + -or (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人在街头，"大声喊叫(clam)"
    <tspan x="50" dy="25">要求什么，整个场面非常喧闹(clamor)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The clamor of the crowd could be heard from miles away.
  </text>
  <text x="50" y="310" class="content">
    人群的喧闹声在几英里外都能听到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crowd -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="100" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="200" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Speech bubbles -->
    <ellipse cx="50" cy="20" rx="20" ry="10" class="image" />
    <ellipse cx="100" cy="20" rx="20" ry="10" class="image" />
    <ellipse cx="150" cy="20" rx="20" ry="10" class="image" />
    <ellipse cx="200" cy="20" rx="20" ry="10" class="image" />
    <ellipse cx="250" cy="20" rx="20" ry="10" class="image" />
    <!-- Lines for speech -->
    <line x1="50" y1="35" x2="50" y2="50" class="image" />
    <line x1="100" y1="35" x2="100" y2="50" class="image" />
    <line x1="150" y1="35" x2="150" y2="50" class="image" />
    <line x1="200" y1="35" x2="200" y2="50" class="image" />
    <line x1="250" y1="35" x2="250" y2="50" class="image" />
  </g>
</svg>