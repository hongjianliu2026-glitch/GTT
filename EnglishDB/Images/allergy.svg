<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">allergy</text>
  <text x="50" y="120" class="subtitle">[ˈælərdʒi] n. 过敏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> allo- (其他的) + erg (工作) + -y (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人对某种物质"其他(allo)"的"工作(erg)"产生了异常反应，
    <tspan x="50" dy="25">这种反应就是过敏(allergy)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She has an allergy to peanuts.
  </text>
  <text x="50" y="310" class="content">
    她对花生过敏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Allergic reaction -->
    <circle cx="150" cy="100" r="10" class="image" fill="#E74C3C" />
    <line x1="150" y1="110" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="190" class="image" />
    <line x1="150" y1="150" x2="170" y2="190" class="image" />
    <line x1="150" y1="130" x2="190" y2="120" class="image" />
    <!-- Allergen -->
    <rect x="250" y="90" width="30" height="30" class="image" fill="#F1C40F" />
    <text x="255" y="115" class="content" fill="#34495E">花生</text>
  </g>
</svg>