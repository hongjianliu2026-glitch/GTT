<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">intractable</text>
  <text x="50" y="120" class="subtitle">[ɪnˈtræktəbl] adj. 难处理的，倔强的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + tract (拉) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头倔强的牛，"拉不动(tract)"，
    <tspan x="50" dy="25">无论你怎么用力，它都"不(in-)"动，这就是难处理的(intractable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The intractable problem took weeks to solve.
  </text>
  <text x="50" y="310" class="content">
    这个难处理的问题花了几个星期才解决。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cow -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="160" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="200" x2="20" y2="220" class="image" /> <!-- Front leg -->
    <line x1="50" y1="200" x2="80" y2="220" class="image" /> <!-- Back leg -->
    <line x1="50" y1="130" x2="20" y2="110" class="image" /> <!-- Horn -->
    <line x1="50" y1="130" x2="80" y2="110" class="image" /> <!-- Horn -->
    <!-- Rope -->
    <line x1="150" y1="100" x2="50" y2="100" class="image" />
    <line x1="150" y1="100" x2="150" y2="200" class="image" />
    <line x1="150" y1="200" x2="200" y2="200" class="image" />
    <line x1="200" y1="200" x2="200" y2="100" class="image" />
    <line x1="200" y1="100" x2="250" y2="100" class="image" />
    <!-- Person pulling the rope -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>