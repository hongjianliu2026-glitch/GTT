<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">drowsy</text>
  <text x="50" y="120" class="subtitle">[ˈdraʊzi] adj. 昏昏欲睡的，困倦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drows (昏昏欲睡) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人坐在椅子上，眼皮沉重，"昏昏欲睡(drowsy)"，
    <tspan x="50" dy="25">仿佛随时都会闭上眼睛进入梦乡。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> After a long day, he felt drowsy and decided to take a nap.
  </text>
  <text x="50" y="310" class="content">
    经过漫长的一天，他感到困倦，决定小睡一会儿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Chair -->
    <rect x="50" y="50" width="150" height="100" class="image" />
    <!-- Person -->
    <circle cx="125" cy="40" r="20" class="image" />
    <line x1="125" y1="60" x2="125" y2="100" class="image" />
    <line x1="125" y1="100" x2="100" y2="130" class="image" />
    <line x1="125" y1="100" x2="150" y2="130" class="image" />
    <line x1="125" y1="70" x2="170" y2="60" class="image" />
    <!-- Eyes -->
    <line x1="115" y1="35" x2="135" y2="35" class="image" />
    <!-- Zzz -->
    <text x="180" y="50" class="content">Zzz</text>
  </g>
</svg>