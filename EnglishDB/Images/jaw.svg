<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jaw</text>
  <text x="50" y="120" class="subtitle">[dʒɔː] n. 颚，下巴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "jaw"，意为“下巴”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只巨大的鳄鱼，它的"下巴(jaw)"张得大大的，
    <tspan x="50" dy="25">仿佛能吞下整个世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crocodile's jaw snapped shut with a loud noise.
  </text>
  <text x="50" y="310" class="content">
    鳄鱼的下巴咔嚓一声合上了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Jaw -->
    <path d="M50 100 Q100 50 150 100 T250 100" class="image" />
    <path d="M50 100 Q100 150 150 100 T250 100" class="image" />
    <!-- Teeth -->
    <rect x="70" y="90" width="20" height="20" class="image" />
    <rect x="110" y="90" width="20" height="20" class="image" />
    <rect x="150" y="90" width="20" height="20" class="image" />
    <rect x="190" y="90" width="20" height="20" class="image" />
    <rect x="230" y="90" width="20" height="20" class="image" />
  </g>
</svg>