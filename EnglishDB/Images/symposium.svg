<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">symposium</text>
  <text x="50" y="120" class="subtitle">[sɪmˈpoʊziəm] n. 座谈会，专题讨论会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sym- (共同) + pos (放) + ium (场所)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群学者围坐在一张大桌子旁，"共同放置(sym-pos)"
    <tspan x="50" dy="25">他们的思想和观点，这个场所(ium)就是座谈会(symposium)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The symposium on climate change attracted many experts.
  </text>
  <text x="50" y="310" class="content">
    关于气候变化的座谈会吸引了许多专家。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Speech bubbles -->
    <path d="M50 70 Q40 90 50 110" class="image" />
    <path d="M150 70 Q140 90 150 110" class="image" />
    <path d="M250 70 Q240 90 250 110" class="image" />
  </g>
</svg>