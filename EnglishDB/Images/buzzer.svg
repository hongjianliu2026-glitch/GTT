<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buzzer</text>
  <text x="50" y="120" class="subtitle">[ˈbʌzər] n. 蜂鸣器，门铃</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> buzz (嗡嗡声) + -er (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个蜂鸣器在门口，"嗡嗡作响(buzz)"
    <tspan x="50" dy="25">提醒你有人来了，这就是门铃(buzzer)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The buzzer rang, signaling the end of the game.
  </text>
  <text x="50" y="310" class="content">
    蜂鸣器响起，标志着比赛的结束。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Buzzer -->
    <rect x="0" y="0" width="100" height="50" class="image" />
    <!-- Buzzing sound -->
    <line x1="20" y1="60" x2="40" y2="80" class="image" />
    <line x1="40" y1="60" x2="20" y2="80" class="image" />
    <line x1="60" y1="60" x2="80" y2="80" class="image" />
    <line x1="80" y1="60" x2="60" y2="80" class="image" />
    <!-- Door -->
    <rect x="120" y="0" width="100" height="200" class="image" />
    <!-- Person -->
    <circle cx="170" cy="220" r="15" class="image" />
    <line x1="170" y1="235" x2="170" y2="270" class="image" />
    <line x1="170" y1="270" x2="150" y2="300" class="image" />
    <line x1="170" y1="270" x2="190" y2="300" class="image" />
    <line x1="170" y1="250" x2="200" y2="240" class="image" />
  </g>
</svg>