<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">crib</text>
  <text x="50" y="120" class="subtitle">[krɪb] n. 婴儿床，抄袭</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> crib (来自古英语cribb，意为“小床”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个婴儿在"小床(crib)"里安睡，
    <tspan x="50" dy="25">而另一个学生在考试时"抄袭(crib)"答案，</tspan>
    <tspan x="50" dy="25">两者都依赖于"crib"这个空间来获取安全和知识。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The baby slept soundly in her crib.
  </text>
  <text x="50" y="310" class="content">
    婴儿在她的婴儿床里睡得很香。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crib -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Baby -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
    <!-- Cheating -->
    <rect x="50" y="200" width="250" height="100" class="image" />
    <line x1="70" y1="230" x2="280" y2="230" class="image" />
    <line x1="70" y1="260" x2="250" y2="260" class="image" />
    <line x1="70" y1="290" x2="270" y2="290" class="image" />
    <line x1="70" y1="320" x2="240" y2="320" class="image" />
    <circle cx="150" cy="280" r="15" class="image" />
    <line x1="150" y1="295" x2="150" y2="330" class="image" />
    <line x1="150" y1="330" x2="130" y2="360" class="image" />
    <line x1="150" y1="330" x2="170" y2="360" class="image" />
    <line x1="150" y1="310" x2="180" y2="300" class="image" />
  </g>
</svg>