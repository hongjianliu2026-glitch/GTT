<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mantle</text>
  <text x="50" y="120" class="subtitle">[ˈmæntl] n. 斗篷，覆盖物；v. 覆盖</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> man (手) + -tle (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手(man)拿着一个小斗篷(mantle)，轻轻地覆盖在某个物体上，就像给物体穿上了一件斗篷。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snow mantled the ground.
  </text>
  <text x="50" y="310" class="content">
    雪覆盖了地面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hand -->
    <line x1="50" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="120" y2="130" class="image" />
    <line x1="100" y1="150" x2="120" y2="170" class="image" />
    <line x1="100" y1="150" x2="140" y2="150" class="image" />
    <line x1="100" y1="150" x2="120" y2="190" class="image" />
    <!-- Mantle -->
    <path d="M150,100 Q200,50 250,100 L250,150 Q200,200 150,150 Z" class="image" />
    <!-- Object -->
    <rect x="180" y="120" width="60" height="60" class="image" />
  </g>
</svg>