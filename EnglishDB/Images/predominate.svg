<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">predominate</text>
  <text x="50" y="120" class="subtitle">[prɪˈdɒmɪneɪt] v. 占主导地位，占优势</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pre- (在前面) + domin (统治) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的国王站在前面，"统治(domin)"
    <tspan x="50" dy="25">着整个王国，他的力量"占主导地位(predominate)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The red team predominated in the game.
  </text>
  <text x="50" y="310" class="content">
    红队在比赛中占主导地位。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- King -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="160" x2="100" y2="140" class="image" />
    <!-- Crown -->
    <polygon points="50,50 30,70 70,70" class="image" />
    <!-- Kingdom -->
    <rect x="0" y="250" width="300" height="50" class="image" />
    <line x1="20" y1="270" x2="280" y2="270" class="image" />
    <line x1="20" y1="290" x2="280" y2="290" class="image" />
  </g>
</svg>