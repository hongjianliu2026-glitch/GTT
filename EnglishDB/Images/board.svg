<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">board</text>
  <text x="50" y="120" class="subtitle">[bɔːrd] n. 木板，董事会；v. 上船，上飞机</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bord (边缘)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块木板(board)，它的边缘(bord)
    <tspan x="50" dy="25">被用来搭建房屋或制作家具。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He nailed the boards together to make a table.
  </text>
  <text x="50" y="310" class="content">
    他把木板钉在一起做了一张桌子。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Board -->
    <rect x="0" y="0" width="300" height="100" class="image" />
    <!-- Nails -->
    <circle cx="50" cy="50" r="5" class="image" />
    <circle cx="150" cy="50" r="5" class="image" />
    <circle cx="250" cy="50" r="5" class="image" />
    <!-- Hammer -->
    <line x1="320" y1="20" x2="320" y2="80" class="image" />
    <line x1="320" y1="20" x2="300" y2="40" class="image" />
    <line x1="320" y1="20" x2="340" y2="40" class="image" />
  </g>
</svg>