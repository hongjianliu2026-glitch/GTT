<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">snout</text>
  <text x="50" y="120" class="subtitle">[snaʊt] n. 鼻子，猪嘴</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> snout (源自中古英语 snoute，意为鼻子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猪，它的"鼻子(snout)"
    <tspan x="50" dy="25">又长又翘，像个小喇叭，特别引人注目。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pig's snout was covered in mud.
  </text>
  <text x="50" y="310" class="content">
    那只猪的鼻子沾满了泥巴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pig's head -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Pig's snout -->
    <rect x="50" y="120" width="100" height="60" class="image" />
    <!-- Pig's eyes -->
    <circle cx="70" cy="80" r="10" class="image" />
    <circle cx="130" cy="80" r="10" class="image" />
    <!-- Pig's ears -->
    <ellipse cx="40" cy="60" rx="20" ry="30" class="image" />
    <ellipse cx="160" cy="60" rx="20" ry="30" class="image" />
  </g>
</svg>