<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">year-round</text>
  <text x="50" y="120" class="subtitle">[ˈjɪər raʊnd] adj. 全年的，整年的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> year (年) + round (周围)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个四季轮回的地球，"全年(year)围绕(round)"
    <tspan x="50" dy="25">着太阳旋转，这就是全年的概念(year-round)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store is open year-round.
  </text>
  <text x="50" y="310" class="content">
    这家商店全年营业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="100" r="30" class="image" />
    <!-- Orbit -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Seasons -->
    <text x="50" y="50" class="content">春</text>
    <text x="150" y="20" class="content">夏</text>
    <text x="250" y="50" class="content">秋</text>
    <text x="175" y="150" class="content">冬</text>
  </g>
</svg>