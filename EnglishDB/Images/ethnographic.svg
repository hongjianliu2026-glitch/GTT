<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ethnographic</text>
  <text x="50" y="120" class="subtitle">[ˌɛθnəˈɡræfɪk] adj. 人种志的，民族志的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ethno- (种族) + graph (写) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位学者在田野中，"写下(graph)"
    <tspan x="50" dy="25">不同种族(ethno)的文化和习俗，</tspan>
    <tspan x="50" dy="25">这些记录就构成了人种志(ethnographic)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The museum's ethnographic collection is renowned worldwide.
  </text>
  <text x="50" y="310" class="content">
    该博物馆的人种志收藏品享誉全球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Scholar -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Notebook -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <!-- Writing -->
    <line x1="70" y1="50" x2="130" y2="50" class="image" />
    <line x1="70" y1="80" x2="130" y2="80" class="image" />
    <line x1="70" y1="110" x2="130" y2="110" class="image" />
    <line x1="70" y1="140" x2="130" y2="140" class="image" />
    <!-- Ethnic symbols -->
    <circle cx="200" cy="50" r="20" class="image" />
    <rect x="250" y="30" width="40" height="40" class="image" />
    <polygon points="200,150 220,180 180,180" class="image" />
  </g>
</svg>