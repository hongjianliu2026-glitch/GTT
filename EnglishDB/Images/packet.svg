<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">packet</text>
  <text x="50" y="120" class="subtitle">[ˈpækɪt] n. 小包，数据包</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pack (打包) + -et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个邮递员在整理邮件，"打包(pack)"
    <tspan x="50" dy="25">成一个个小包(packet)，准备投递。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The internet data is transmitted in packets.
  </text>
  <text x="50" y="310" class="content">
    互联网数据以数据包的形式传输。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Packet -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- Packing tape -->
    <line x1="10" y1="10" x2="140" y2="10" class="image" />
    <line x1="10" y1="20" x2="140" y2="20" class="image" />
    <line x1="10" y1="30" x2="140" y2="30" class="image" />
    <!-- Address label -->
    <rect x="20" y="40" width="110" height="40" class="image" />
    <text x="30" y="65" class="content">To: Recipient</text>
  </g>
</svg>