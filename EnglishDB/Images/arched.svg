<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">arched</text>
  <text x="50" y="120" class="subtitle">[ɑːrtʃt] adj. 拱形的，弓形的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> arch (拱形) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座古老的桥梁，桥面呈拱形(arch)，
    <tspan x="50" dy="25">桥下流水潺潺，桥上行人如织，这就是拱形的(arched)世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ceiling of the cathedral was arched and majestic.
  </text>
  <text x="50" y="310" class="content">
    大教堂的天花板是拱形的，宏伟壮观。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Arch bridge -->
    <path d="M 0 200 Q 175 0 350 200" class="image" />
    <!-- Water -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="205" x2="350" y2="205" class="image" />
    <line x1="0" y1="210" x2="350" y2="210" class="image" />
    <!-- People -->
    <circle cx="50" cy="180" r="5" class="image" />
    <circle cx="100" cy="180" r="5" class="image" />
    <circle cx="150" cy="180" r="5" class="image" />
    <circle cx="200" cy="180" r="5" class="image" />
    <circle cx="250" cy="180" r="5" class="image" />
    <circle cx="300" cy="180" r="5" class="image" />
  </g>
</svg>