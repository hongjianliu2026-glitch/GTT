<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wreak</text>
  <text x="50" y="120" class="subtitle">[riːk] v. 造成，发泄（愤怒）</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wreak (源自中古英语wreken，意为报复)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个愤怒的人，"发泄(wreak)"
    <tspan x="50" dy="25">他的怒火，造成(wreak)了巨大的破坏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm wreaked havoc on the coastal town.
  </text>
  <text x="50" y="310" class="content">
    风暴给沿海小镇造成了巨大的破坏。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Angry face -->
    <circle cx="50" cy="50" r="40" class="image" />
    <line x1="30" y1="40" x2="40" y2="50" class="image" />
    <line x1="60" y1="40" x2="70" y2="50" class="image" />
    <line x1="40" y1="60" x2="60" y2="60" class="image" />
    <line x1="50" y1="70" x2="50" y2="80" class="image" />
    <!-- Explosion -->
    <circle cx="150" cy="50" r="30" class="image" />
    <line x1="120" y1="50" x2="180" y2="50" class="image" />
    <line x1="150" y1="20" x2="150" y2="80" class="image" />
    <line x1="135" y1="35" x2="165" y2="65" class="image" />
    <line x1="165" y1="35" x2="135" y2="65" class="image" />
  </g>
</svg>