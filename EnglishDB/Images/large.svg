<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">large</text>
  <text x="50" y="120" class="subtitle">[lɑːrdʒ] adj. 大的，巨大的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> larg (大)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的鲸鱼在海洋中游动，它的体型如此之大，以至于它"大(larg)"得让人惊叹。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The whale was so large that it could be seen from miles away.
  </text>
  <text x="50" y="310" class="content">
    那只鲸鱼如此巨大，以至于从几英里外就能看到它。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ocean -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#4CAF50" />
    <!-- Whale -->
    <ellipse cx="175" cy="100" rx="150" ry="50" class="image" fill="#8BC34A" />
    <ellipse cx="250" cy="100" rx="20" ry="10" class="image" fill="#8BC34A" />
    <ellipse cx="100" cy="100" rx="20" ry="10" class="image" fill="#8BC34A" />
    <!-- Eye -->
    <circle cx="220" cy="90" r="5" class="image" fill="#000" />
  </g>
</svg>