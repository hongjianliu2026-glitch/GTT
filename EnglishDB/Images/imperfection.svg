<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">imperfection</text>
  <text x="50" y="120" class="subtitle">[ˌɪmpərˈfekʃn] n. 不完美，缺点</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (不) + perfect (完美) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个完美的苹果上有一个小洞，"不完美(im-perfect)"
    <tspan x="50" dy="25">的存在，这就是imperfection。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her imperfection made her more human.
  </text>
  <text x="50" y="310" class="content">
    她的不完美使她更有人性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apple -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Imperfection -->
    <circle cx="150" cy="80" r="10" class="image" fill="#C0392B" />
    <!-- Stem -->
    <line x1="100" y1="20" x2="100" y2="40" class="image" />
  </g>
</svg>