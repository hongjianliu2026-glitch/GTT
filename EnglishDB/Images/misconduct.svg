<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">misconduct</text>
  <text x="50" y="120" class="subtitle">[ˌmɪskənˈdʌkt] n. 行为不端，不当行为</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mis- (错误) + conduct (行为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个员工在办公室里，"错误地行为(mis-conduct)"，
    <tspan x="50" dy="25">导致他被老板训斥，这就是不当行为(misconduct)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The manager was fired for misconduct.
  </text>
  <text x="50" y="310" class="content">
    经理因行为不端被解雇了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Office desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Employee -->
    <circle cx="50" cy="100" r="15" class="image" />
    <line x1="50" y1="115" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <line x1="50" y1="130" x2="80" y2="120" class="image" />
    <!-- Boss -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Speech bubble -->
    <path d="M 250 80 Q 300 80 300 50 Q 300 20 250 20 Q 200 20 200 50 Q 200 80 250 80 Z" class="image" />
    <text x="220" y="60" class="content" text-anchor="middle">训斥</text>
  </g>
</svg>