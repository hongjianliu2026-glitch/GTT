<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">conference</text>
  <text x="50" y="120" class="subtitle">[ˈkɒnfərəns] n. 会议，讨论会</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + fer (带来) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"一起带来(con-fer)"
    <tspan x="50" dy="25">他们的观点和想法，聚集在一起讨论，这就是会议(conference)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They held a conference to discuss the new project.
  </text>
  <text x="50" y="310" class="content">
    他们召开了一个会议来讨论新项目。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Conference room -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Table -->
    <rect x="50" y="50" width="250" height="100" class="image" />
    <!-- People -->
    <circle cx="80" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="220" cy="100" r="15" class="image" />
    <!-- Discussion -->
    <line x1="80" y1="120" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="220" y2="120" class="image" />
    <line x1="220" y1="120" x2="80" y2="120" class="image" />
  </g>
</svg>