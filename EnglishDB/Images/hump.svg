<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hump</text>
  <text x="50" y="120" class="subtitle">[hʌmp] n. 驼峰，隆起；v. 隆起，弓起</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hum (土，地) + p (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只骆驼在沙漠中行走，它的背上有一个巨大的"土块(hum)"
    <tspan x="50" dy="25">隆起(p)，这就是骆驼的驼峰(hump)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The camel has a large hump on its back.
  </text>
  <text x="50" y="310" class="content">
    骆驼的背上有一个大驼峰。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Camel body -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Camel hump -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <!-- Camel head -->
    <circle cx="320" cy="100" r="30" class="image" />
    <line x1="320" y1="130" x2="320" y2="180" class="image" />
    <line x1="320" y1="180" x2="290" y2="210" class="image" />
    <line x1="320" y1="180" x2="350" y2="210" class="image" />
    <!-- Camel legs -->
    <line x1="70" y1="200" x2="70" y2="250" class="image" />
    <line x1="120" y1="200" x2="120" y2="250" class="image" />
    <line x1="220" y1="200" x2="220" y2="250" class="image" />
    <line x1="270" y1="200" x2="270" y2="250" class="image" />
  </g>
</svg>