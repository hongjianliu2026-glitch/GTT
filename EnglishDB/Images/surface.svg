<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">surface</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrfɪs] n. 表面，外表；v. 浮出水面</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sur- (在上面) + face (面)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个潜水员从水下"浮出(sur-)"水面，
    <tspan x="50" dy="25">他的脸(face)终于露出了水面(surface)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The submarine surfaced after a deep dive.
  </text>
  <text x="50" y="310" class="content">
    潜艇在深潜后浮出了水面。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Water surface -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <!-- Diver -->
    <circle cx="175" cy="80" r="15" class="image" />
    <line x1="175" y1="95" x2="175" y2="130" class="image" />
    <line x1="175" y1="130" x2="155" y2="160" class="image" />
    <line x1="175" y1="130" x2="195" y2="160" class="image" />
    <line x1="175" y1="110" x2="205" y2="100" class="image" />
  </g>
</svg>