<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stubbornly</text>
  <text x="50" y="120" class="subtitle">[ˈstʌbərnli] adv. 顽固地，固执地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stubborn (顽固的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一头顽固的牛，"固执地(stubbornly)"
    <tspan x="50" dy="25">站在原地，无论你怎么拉它，它都不动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He stubbornly refused to admit his mistake.
  </text>
  <text x="50" y="310" class="content">
    他固执地拒绝承认自己的错误。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stubborn cow -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Front leg -->
    <line x1="50" y1="180" x2="80" y2="200" class="image" /> <!-- Back leg -->
    <line x1="50" y1="130" x2="20" y2="120" class="image" /> <!-- Front horn -->
    <line x1="50" y1="130" x2="80" y2="120" class="image" /> <!-- Back horn -->
    <!-- Rope trying to pull the cow -->
    <line x1="150" y1="100" x2="50" y2="100" class="image" />
    <line x1="150" y1="100" x2="140" y2="90" class="image" />
    <line x1="150" y1="100" x2="140" y2="110" class="image" />
  </g>
</svg>