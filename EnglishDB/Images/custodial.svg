<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">custodial</text>
  <text x="50" y="120" class="subtitle">[kʌˈstoʊdiəl] adj. 保管的，监护的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> custos (看守) + -ial (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个看守人(custos)，他像守护神一样，
    <tspan x="50" dy="25">守护着重要的物品，确保它们安全无虞。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The custodial staff ensures the museum's artifacts are well-protected.
  </text>
  <text x="50" y="310" class="content">
    保管人员确保博物馆的文物得到妥善保护。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Guard -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Shield -->
    <rect x="100" y="80" width="100" height="100" class="image" />
    <line x1="150" y1="80" x2="150" y2="180" class="image" />
    <!-- Artifact -->
    <rect x="250" y="100" width="50" height="50" class="image" />
    <line x1="250" y1="100" x2="300" y2="100" class="image" />
    <line x1="250" y1="150" x2="300" y2="150" class="image" />
    <line x1="250" y1="100" x2="250" y2="150" class="image" />
    <line x1="300" y1="100" x2="300" y2="150" class="image" />
  </g>
</svg>