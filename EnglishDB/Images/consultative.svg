<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">consultative</text>
  <text x="50" y="120" class="subtitle">[kənˈsʌltətɪv] adj. 咨询的，顾问的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (共同) + sult (坐) + -ative (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群专家围坐在一起，"共同坐下(con-sult)"
    <tspan x="50" dy="25">讨论问题，提供咨询意见，这就是咨询的(consultative)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The committee has a consultative role in the decision-making process.
  </text>
  <text x="50" y="310" class="content">
    委员会在决策过程中具有咨询作用。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Experts sitting around the table -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="200" cy="150" r="15" class="image" />
    <!-- Discussion bubbles -->
    <path d="M 50 70 Q 100 100 150 70" class="image" />
    <path d="M 150 70 Q 200 100 250 70" class="image" />
    <path d="M 100 170 Q 150 200 200 170" class="image" />
  </g>
</svg>