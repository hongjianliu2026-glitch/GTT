<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bracelet</text>
  <text x="50" y="120" class="subtitle">[ˈbreɪslət] n. 手镯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> brace (支撑) + let (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小巧的"支撑(brace)"物，"小(let)"到可以环绕在手腕上，
    <tspan x="50" dy="25">这就是手镯(bracelet)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a delicate gold bracelet on her wrist.
  </text>
  <text x="50" y="310" class="content">
    她手腕上戴着一只精致的黄金手镯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Wrist -->
    <circle cx="200" cy="150" r="50" class="image" />
    <!-- Bracelet -->
    <rect x="150" y="100" width="100" height="100" class="image" />
    <!-- Decoration -->
    <circle cx="175" cy="150" r="10" class="image" />
    <circle cx="225" cy="150" r="10" class="image" />
  </g>
</svg>