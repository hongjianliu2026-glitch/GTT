<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">chide</text>
  <text x="50" y="120" class="subtitle">[tʃaɪd] v. 责骂，斥责</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chid (责骂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个严厉的老师，"责骂(chid)"
    <tspan x="50" dy="25">一个调皮的学生，声音如雷贯耳，</tspan>
    <tspan x="50" dy="25">让学生不敢再犯错。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The teacher chided the student for not doing his homework.
  </text>
  <text x="50" y="310" class="content">
    老师因为学生没做作业而责骂他。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Teacher -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <!-- Mouth -->
    <path d="M10 105 Q20 115 30 105" class="image" />
    <!-- Student -->
    <circle cx="100" cy="100" r="15" class="image" />
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <line x1="100" y1="130" x2="150" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M20 80 Q40 70 60 80 Q40 90 20 80" class="image" />
    <text x="30" y="85" class="content" style="font-size: 12px;">Chide!</text>
  </g>
</svg>