<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">album</text>
  <text x="50" y="120" class="subtitle">[ˈælbəm] n. 相册，专辑</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> albus (白色) + -um (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的白色(albus)相册，里面装满了珍贵的照片，
    <tspan x="50" dy="25">这些照片记录了美好的回忆，就像音乐专辑(album)记录了动人的旋律。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She carefully arranged the photos in her album.
  </text>
  <text x="50" y="310" class="content">
    她小心翼翼地将照片整理到她的相册中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Album cover -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- White background -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#FFFFFF" />
    <!-- Photos -->
    <rect x="70" y="40" width="80" height="60" class="image" fill="#FFD700" />
    <rect x="170" y="40" width="80" height="60" class="image" fill="#FFD700" />
    <rect x="70" y="120" width="80" height="60" class="image" fill="#FFD700" />
    <rect x="170" y="120" width="80" height="60" class="image" fill="#FFD700" />
    <!-- Album spine -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
  </g>
</svg>