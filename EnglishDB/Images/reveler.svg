<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reveler</text>
  <text x="50" y="120" class="subtitle">[ˈrɛvələr] n. 狂欢者，寻欢作乐者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + vel (欢呼)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狂欢者，"再次欢呼(re-vel)"
    <tspan x="50" dy="25">在派对上尽情享受，这就是一个狂欢者(reveler)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The revelers danced all night at the festival.
  </text>
  <text x="50" y="310" class="content">
    狂欢者在节日里彻夜跳舞。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Party scene -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Dancing reveler -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="140" x2="30" y2="130" class="image" />
    <line x1="50" y1="140" x2="70" y2="130" class="image" />
    <line x1="50" y1="160" x2="30" y2="180" class="image" />
    <line x1="50" y1="160" x2="70" y2="180" class="image" />
    <!-- Party lights -->
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="50" r="10" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <!-- Music notes -->
    <path d="M100 50 Q120 30 140 50 T180 50" class="image" />
    <path d="M110 70 Q130 50 150 70 T190 70" class="image" />
  </g>
</svg>