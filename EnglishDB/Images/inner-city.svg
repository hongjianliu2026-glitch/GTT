<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inner-city</text>
  <text x="50" y="120" class="subtitle">[ˈɪnər ˈsɪti] adj. 市中心的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> inner (内部的) + city (城市)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个城市的中心区域，高楼林立，车水马龙，这就是"内部的(inner)城市(city)"，即市中心(inner-city)。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The inner-city schools are facing many challenges.
  </text>
  <text x="50" y="310" class="content">
    市中心的学校面临着许多挑战。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="30" height="100" class="image" />
    <rect x="100" y="20" width="30" height="120" class="image" />
    <rect x="150" y="20" width="30" height="140" class="image" />
    <rect x="200" y="20" width="30" height="160" class="image" />
    <rect x="250" y="20" width="30" height="180" class="image" />
    <rect x="300" y="20" width="30" height="200" class="image" />
    <!-- Roads -->
    <line x1="0" y1="200" x2="350" y2="200" class="image" />
    <line x1="0" y1="220" x2="350" y2="220" class="image" />
    <line x1="0" y1="240" x2="350" y2="240" class="image" />
    <!-- Cars -->
    <rect x="70" y="210" width="20" height="10" class="image" />
    <rect x="120" y="210" width="20" height="10" class="image" />
    <rect x="170" y="210" width="20" height="10" class="image" />
    <rect x="220" y="210" width="20" height="10" class="image" />
    <rect x="270" y="210" width="20" height="10" class="image" />
  </g>
</svg>