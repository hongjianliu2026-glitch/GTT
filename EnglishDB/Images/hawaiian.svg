<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4F1DE; }
      .title { font: bold 48px sans-serif; fill: #81B29A; }
      .subtitle { font: italic 24px serif; fill: #3D405B; }
      .content { font: 18px sans-serif; fill: #3D405B; }
      .highlight { font-weight: bold; fill: #E07A5F; }
      .story { font: 16px serif; fill: #F2CC8F; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Hawaiian</text>
  <text x="50" y="120" class="subtitle">[həˈwaɪiən] adj. 夏威夷的；n. 夏威夷人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Hawa (夏威夷) + -ian (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夏威夷人穿着传统的草裙，在阳光明媚的沙滩上跳舞，
    <tspan x="50" dy="25">周围是椰子树和蓝色的海洋，这就是夏威夷(Hawa)的美丽景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves the Hawaiian music and dance.
  </text>
  <text x="50" y="310" class="content">
    她喜欢夏威夷的音乐和舞蹈。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Beach -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="30" cy="30" r="20" fill="#F2CC8F" />
    <!-- Palm tree -->
    <line x1="150" y1="20" x2="150" y2="150" class="image" />
    <line x1="150" y1="50" x2="120" y2="80" class="image" />
    <line x1="150" y1="50" x2="180" y2="80" class="image" />
    <line x1="150" y1="100" x2="120" y2="130" class="image" />
    <line x1="150" y1="100" x2="180" y2="130" class="image" />
    <!-- Hawaiian dancer -->
    <circle cx="250" cy="100" r="15" fill="#E07A5F" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="220" y2="120" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>