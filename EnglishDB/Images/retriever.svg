<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">retriever</text>
  <text x="50" y="120" class="subtitle">[rɪˈtriːvər] n. 寻回犬，取回者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + trieve (找到) + -er (人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只金毛寻回犬，"再次找到(re-trieve)"
    <tspan x="50" dy="25">并取回主人扔出的球，它就是一只寻回犬(retriever)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The retriever fetched the ball from the lake.
  </text>
  <text x="50" y="310" class="content">
    那只寻回犬从湖里取回了球。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Dog -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="180" x2="20" y2="220" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="80" y2="220" class="image" /> <!-- Front leg -->
    <line x1="50" y1="140" x2="20" y2="160" class="image" /> <!-- Tail -->
    <!-- Ball -->
    <circle cx="120" cy="150" r="15" class="image" />
    <!-- Action line -->
    <line x1="80" y1="150" x2="120" y2="150" class="image" />
  </g>
</svg>