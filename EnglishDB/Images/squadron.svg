<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">squadron</text>
  <text x="50" y="120" class="subtitle">[ˈskwɑːdrən] n. 中队，飞行队</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> squad (小队) + -ron (表示集体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群战斗机飞行员，他们组成了一支"小队(squad)"，
    <tspan x="50" dy="25">共同执行任务，这个集体就是"中队(squadron)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The squadron was deployed to the front line.
  </text>
  <text x="50" y="310" class="content">
    这个中队被部署到了前线。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Fighter jets -->
    <line x1="0" y1="0" x2="100" y2="0" class="image" />
    <line x1="10" y1="10" x2="90" y2="10" class="image" />
    <line x1="20" y1="20" x2="80" y2="20" class="image" />
    <line x1="30" y1="30" x2="70" y2="30" class="image" />
    <line x1="40" y1="40" x2="60" y2="40" class="image" />
    <line x1="50" y1="50" x2="50" y2="50" class="image" />
    <line x1="60" y1="60" x2="40" y2="60" class="image" />
    <line x1="70" y1="70" x2="30" y2="70" class="image" />
    <line x1="80" y1="80" x2="20" y2="80" class="image" />
    <line x1="90" y1="90" x2="10" y2="90" class="image" />
    <line x1="100" y1="100" x2="0" y2="100" class="image" />
  </g>
</svg>