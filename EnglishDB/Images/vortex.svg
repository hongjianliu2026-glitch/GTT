<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vortex</text>
  <text x="50" y="120" class="subtitle">[ˈvɔːrteks] n. 漩涡，涡流</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> vort (旋转) + ex (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的漩涡(vortex)，水流围绕着中心点旋转，
    <tspan x="50" dy="25">仿佛一个无尽的"旋转(vort)"循环，让人无法逃脱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boat was caught in a vortex and nearly capsized.
  </text>
  <text x="50" y="310" class="content">
    小船被卷入漩涡，差点翻覆。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Vortex -->
    <path d="M 0 0 A 100 100 0 0 1 200 0 L 100 100 A 50 50 0 0 0 0 0 Z" class="image" />
    <path d="M 0 0 A 150 150 0 0 1 300 0 L 150 150 A 75 75 0 0 0 0 0 Z" class="image" />
    <path d="M 0 0 A 200 200 0 0 1 400 0 L 200 200 A 100 100 0 0 0 0 0 Z" class="image" />
  </g>
</svg>