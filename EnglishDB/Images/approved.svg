<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .checkmark { fill: #27AE60; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">approved</text>
  <text x="50" y="120" class="subtitle">[əˈpruːvd] adj. 被批准的，被认可的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (加强) + prov (证明) + -ed (过去分词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个文件被"加强证明(ap-prov-ed)"，
    <tspan x="50" dy="25">上面盖着一个大大的绿色勾勾，表示它已经被批准(approved)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was finally approved by the board.
  </text>
  <text x="50" y="310" class="content">
    这个项目最终被董事会批准了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Document -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Checkmark -->
    <path d="M 50 100 L 150 200 L 300 50" class="checkmark" />
    <!-- Document lines -->
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
  </g>
</svg>