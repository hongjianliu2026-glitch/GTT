<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">steel</text>
  <text x="50" y="120" class="subtitle">[stiːl] n. 钢，钢铁；v. 使坚强</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stel (星) + -e (后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗星星(stel)坠落到地球，变成了坚硬的钢铁(steel)，
    <tspan x="50" dy="25">这种钢铁可以用来建造高楼大厦，象征着坚固和力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The bridge was built with high-strength steel.
  </text>
  <text x="50" y="310" class="content">
    这座桥是用高强度钢建造的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Star -->
    <polygon points="0,0 20,30 50,30 30,50 40,80 20,60 0,80 -20,50 -30,30 -50,30" class="image" />
    <!-- Steel bar -->
    <rect x="70" y="20" width="200" height="30" class="image" />
    <!-- Building -->
    <rect x="100" y="70" width="150" height="100" class="image" />
    <rect x="110" y="80" width="10" height="80" class="image" />
    <rect x="130" y="80" width="10" height="80" class="image" />
    <rect x="150" y="80" width="10" height="80" class="image" />
    <rect x="170" y="80" width="10" height="80" class="image" />
    <rect x="190" y="80" width="10" height="80" class="image" />
  </g>
</svg>