<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sit-up</text>
  <text x="50" y="120" class="subtitle">[ˈsɪt ʌp] n. 仰卧起坐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sit (坐) + up (向上)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人躺在地上，"坐起来(sit-up)"
    <tspan x="50" dy="25">做仰卧起坐，锻炼腹部肌肉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She does 50 sit-ups every morning.
  </text>
  <text x="50" y="310" class="content">
    她每天早上做50个仰卧起坐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person lying down -->
    <rect x="50" y="20" width="200" height="50" class="image" />
    <!-- Person sitting up -->
    <rect x="50" y="80" width="200" height="50" class="image" />
    <!-- Head -->
    <circle cx="150" cy="45" r="15" class="image" />
    <circle cx="150" cy="105" r="15" class="image" />
    <!-- Arms -->
    <line x1="135" y1="60" x2="100" y2="80" class="image" />
    <line x1="165" y1="60" x2="200" y2="80" class="image" />
    <line x1="135" y1="120" x2="100" y2="140" class="image" />
    <line x1="165" y1="120" x2="200" y2="140" class="image" />
    <!-- Legs -->
    <line x1="140" y1="70" x2="140" y2="100" class="image" />
    <line x1="160" y1="70" x2="160" y2="100" class="image" />
    <line x1="140" y1="130" x2="140" y2="160" class="image" />
    <line x1="160" y1="130" x2="160" y2="160" class="image" />
  </g>
</svg>