<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pyramid</text>
  <text x="50" y="120" class="subtitle">[ˈpɪrəmɪd] n. 金字塔</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pyra (火) + mid (中间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的金字塔，"火(pyra)在中间(mid)"
    <tspan x="50" dy="25">燃烧，象征着古代文明的辉煌与神秘。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Great Pyramid of Giza is one of the Seven Wonders of the Ancient World.
  </text>
  <text x="50" y="310" class="content">
    吉萨大金字塔是古代世界七大奇迹之一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Pyramid -->
    <polygon points="150,0 0,200 300,200" class="image" />
    <!-- Sun -->
    <circle cx="150" cy="50" r="30" class="image" />
    <!-- Sand -->
    <rect x="0" y="200" width="300" height="50" class="image" />
  </g>
</svg>