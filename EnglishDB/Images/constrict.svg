<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">constrict</text>
  <text x="50" y="120" class="subtitle">[kənˈstrɪkt] v. 压缩，收缩</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + strict (拉紧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一条蛇缠绕住猎物，"一起拉紧(con-strict)"，
    <tspan x="50" dy="25">猎物被紧紧束缚，无法逃脱。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The snake constricted its prey until it stopped moving.
  </text>
  <text x="50" y="310" class="content">
    蛇缠绕住猎物，直到它停止移动。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Snake -->
    <path d="M50 100 C 100 50, 200 50, 250 100 S 350 150, 400 100" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="300" cy="100" r="10" class="image" />
    <!-- Prey -->
    <rect x="150" y="80" width="100" height="40" class="image" />
    <line x1="150" y1="80" x2="250" y2="80" class="image" />
    <line x1="150" y1="120" x2="250" y2="120" class="image" />
    <line x1="150" y1="80" x2="150" y2="120" class="image" />
    <line x1="250" y1="80" x2="250" y2="120" class="image" />
  </g>
</svg>