<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">afloat</text>
  <text x="50" y="120" class="subtitle">[əˈfloʊt] adv. 漂浮着；adj. 漂浮的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> a- (在...状态) + float (漂浮)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘小船在海面上"漂浮(float)"，
    <tspan x="50" dy="25">它保持着"漂浮的状态(afloat)"，随波逐流。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The boat remained afloat despite the storm.
  </text>
  <text x="50" y="310" class="content">
    尽管有风暴，船仍然漂浮着。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Ocean -->
    <rect x="0" y="150" width="400" height="200" fill="#3498DB" />
    <!-- Boat -->
    <polygon points="150,150 250,150 200,100" fill="#F39C12" stroke="#D35400" stroke-width="2" />
    <!-- Waves -->
    <path d="M0,150 Q50,130 100,150 T200,150 T300,150 T400,150" stroke="#2980B9" stroke-width="3" fill="none" />
    <path d="M0,170 Q50,190 100,170 T200,170 T300,170 T400,170" stroke="#2980B9" stroke-width="3" fill="none" />
    <path d="M0,190 Q50,210 100,190 T200,190 T300,190 T400,190" stroke="#2980B9" stroke-width="3" fill="none" />
  </g>
</svg>