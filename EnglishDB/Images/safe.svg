<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">safe</text>
  <text x="50" y="120" class="subtitle">[seɪf] adj. 安全的，可靠的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> s- (表示“离开”) + -afe (表示“伤害”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个孩子被一个巨大的保护罩包围，"离开(s-)"
    <tspan x="50" dy="25">所有可能的伤害(afe)，这就是安全(safe)的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Keep your valuables in a safe place.
  </text>
  <text x="50" y="310" class="content">
    把你的贵重物品放在安全的地方。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Protective shield -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Child -->
    <circle cx="100" cy="100" r="15" class="image" fill="#2ECC71" />
    <!-- Arms -->
    <line x1="100" y1="115" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="80" y2="180" class="image" />
    <line x1="100" y1="150" x2="120" y2="180" class="image" />
    <!-- Legs -->
    <line x1="100" y1="150" x2="80" y2="200" class="image" />
    <line x1="100" y1="150" x2="120" y2="200" class="image" />
  </g>
</svg>