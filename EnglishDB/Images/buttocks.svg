<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">buttocks</text>
  <text x="50" y="120" class="subtitle">[ˈbʌtəks] n. 臀部</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> butto (底部) + cks (复数)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在镜子前，"底部(butto)"
    <tspan x="50" dy="25">的两块肉(cks)，就是他的臀部(buttocks)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She exercised to tone her buttocks.
  </text>
  <text x="50" y="310" class="content">
    她锻炼以塑造她的臀部。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="200" class="image" /> <!-- Body -->
    <line x1="50" y1="200" x2="20" y2="250" class="image" /> <!-- Left leg -->
    <line x1="50" y1="200" x2="80" y2="250" class="image" /> <!-- Right leg -->
    <line x1="50" y1="150" x2="20" y2="180" class="image" /> <!-- Left arm -->
    <line x1="50" y1="150" x2="80" y2="180" class="image" /> <!-- Right arm -->
    <!-- Buttocks -->
    <ellipse cx="50" cy="220" rx="30" ry="15" class="image" />
    <ellipse cx="50" cy="240" rx="30" ry="15" class="image" />
  </g>
</svg>