<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">afternoon</text>
  <text x="50" y="120" class="subtitle">[ˌæftərˈnuːn] n. 下午</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> after (之后) + noon (中午)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象太阳从中午的顶峰缓缓落下，"之后(after)"
    <tspan x="50" dy="25">的时间就是下午(afternoon)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We usually have a nap in the afternoon.
  </text>
  <text x="50" y="310" class="content">
    我们通常在下午小睡一会儿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" />
    <!-- Sun rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="100" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="100" x2="0" y2="100" class="image" />
    <!-- Ground -->
    <rect x="0" y="200" width="350" height="50" fill="#2ECC71" />
    <!-- Tree -->
    <rect x="250" y="150" width="20" height="50" fill="#27AE60" />
    <circle cx="260" cy="140" r="15" fill="#27AE60" />
    <circle cx="240" cy="140" r="15" fill="#27AE60" />
    <circle cx="250" cy="125" r="15" fill="#27AE60" />
  </g>
</svg>