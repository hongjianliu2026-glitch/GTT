<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">revelation</text>
  <text x="50" y="120" class="subtitle">[ˌrevəˈleɪʃn] n. 启示，揭露</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + vel (面纱) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神秘的面纱被"再次揭开(re-vel)"，
    <tspan x="50" dy="25">露出隐藏的真相，这就是启示(revelation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The revelation of the truth shocked everyone.
  </text>
  <text x="50" y="310" class="content">
    真相的揭露震惊了所有人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Veil -->
    <rect x="0" y="0" width="300" height="200" class="image" />
    <rect x="50" y="50" width="200" height="100" class="image" />
    <!-- Hand pulling the veil -->
    <line x1="150" y1="50" x2="150" y2="0" class="image" />
    <circle cx="150" cy="20" r="10" class="image" />
    <!-- Hidden truth -->
    <text x="100" y="120" class="content" fill="#2980B9">Truth</text>
  </g>
</svg>