<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">partially</text>
  <text x="50" y="120" class="subtitle">[ˈpɑːrʃəli] adv. 部分地，不完全地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> part (部分) + -ial (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蛋糕，被切成了几块，其中一块被吃掉了，"部分地(partially)"
    <tspan x="50" dy="25">被享用，剩下的部分还在等待。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The project was completed partially due to unforeseen issues.
  </text>
  <text x="50" y="310" class="content">
    由于意外问题，项目只完成了部分。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Slices of cake -->
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="170" y="20" width="100" height="160" class="image" />
    <rect x="290" y="20" width="50" height="160" class="image" />
    <!-- Missing slice -->
    <rect x="290" y="20" width="50" height="160" class="image" fill="#E8F6F3" stroke="none" />
    <!-- Fork and knife -->
    <line x1="300" y1="180" x2="350" y2="180" class="image" />
    <line x1="325" y1="180" x2="325" y2="120" class="image" />
  </g>
</svg>