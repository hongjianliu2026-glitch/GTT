<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">underlie</text>
  <text x="50" y="120" class="subtitle">[ˌʌndərˈlaɪ] v. 位于...之下，构成...的基础</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> under- (在...下面) + lie (躺)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块巨大的石头"躺在(lie)"地面之下，
    <tspan x="50" dy="25">支撑着整个建筑，这就是"位于...之下(underlie)"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The principles that underlie our company's success are integrity and innovation.
  </text>
  <text x="50" y="310" class="content">
    我们公司成功的基石是诚信和创新。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Building -->
    <rect x="100" y="20" width="150" height="80" class="image" />
    <!-- Stone -->
    <rect x="120" y="100" width="110" height="20" class="image" />
    <!-- Arrows -->
    <line x1="175" y1="100" x2="175" y2="40" class="image" />
    <polygon points="175,40 165,50 185,50" class="image" />
  </g>
</svg>