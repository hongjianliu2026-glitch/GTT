<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Viking</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪkɪŋ] n. 维京人，北欧海盗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Vik (海湾) + ing (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个维京人站在海湾边，手持战斧，准备出海掠夺。
    <tspan x="50" dy="25">他们以勇敢和冒险著称，是北欧的传奇海盗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Viking ships were known for their speed and agility.
  </text>
  <text x="50" y="310" class="content">
    维京船以其速度和敏捷性而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Viking -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Head -->
    <line x1="50" y1="120" x2="50" y2="160" class="image" /> <!-- Body -->
    <line x1="50" y1="160" x2="30" y2="200" class="image" /> <!-- Left leg -->
    <line x1="50" y1="160" x2="70" y2="200" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="150" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="150" class="image" /> <!-- Right arm -->
    <line x1="70" y1="150" x2="80" y2="140" class="image" /> <!-- Axe -->

    <!-- Bay -->
    <rect x="0" y="200" width="200" height="50" class="image" />
    <line x1="0" y1="200" x2="200" y2="200" class="image" />
    <line x1="0" y1="250" x2="200" y2="250" class="image" />
    <line x1="0" y1="200" x2="0" y2="250" class="image" />
    <line x1="200" y1="200" x2="200" y2="250" class="image" />
  </g>
</svg>