<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gait</text>
  <text x="50" y="120" class="subtitle">[ɡeɪt] n. 步态，步法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> g- (走) + -ait (方式)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在走路，"走的方式(g-ait)"
    <tspan x="50" dy="25">决定了他的步态(gait)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The detective noticed the suspect's unusual gait.
  </text>
  <text x="50" y="310" class="content">
    侦探注意到了嫌疑人的不寻常步态。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person walking -->
    <circle cx="50" cy="100" r="15" class="image" /> <!-- Head -->
    <line x1="50" y1="115" x2="50" y2="150" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="30" y2="180" class="image" /> <!-- Left leg -->
    <line x1="50" y1="150" x2="70" y2="180" class="image" /> <!-- Right leg -->
    <line x1="50" y1="130" x2="30" y2="120" class="image" /> <!-- Left arm -->
    <line x1="50" y1="130" x2="70" y2="120" class="image" /> <!-- Right arm -->
    <!-- Gait lines -->
    <line x1="30" y1="180" x2="70" y2="180" class="image" />
    <line x1="30" y1="180" x2="50" y2="170" class="image" />
    <line x1="70" y1="180" x2="50" y2="170" class="image" />
  </g>
</svg>