<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">spore</text>
  <text x="50" y="120" class="subtitle">[spɔːr] n. 孢子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> spore (源自希腊语 spora，意为种子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的蘑菇，"喷射出(spore)"
    <tspan x="50" dy="25">无数微小的种子，这些种子就是孢子(spore)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The fungus releases spores into the air.
  </text>
  <text x="50" y="310" class="content">
    真菌将孢子释放到空气中。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mushroom -->
    <ellipse cx="175" cy="100" rx="100" ry="50" class="image" />
    <circle cx="175" cy="50" r="50" class="image" />
    <!-- Spores -->
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <circle cx="175" cy="200" r="10" class="image" />
    <circle cx="75" cy="200" r="10" class="image" />
    <circle cx="275" cy="200" r="10" class="image" />
  </g>
</svg>