<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">beating</text>
  <text x="50" y="120" class="subtitle">[ˈbiːtɪŋ] n. 打，敲打；v. beat的现在分词</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> beat (打，敲打)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个拳击手在擂台上，"不停地敲打(beating)"
    <tspan x="50" dy="25">对手，每一次击打都充满了力量和节奏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The drummer's beating on the drums was mesmerizing.
  </text>
  <text x="50" y="310" class="content">
    鼓手的鼓声敲打令人着迷。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boxing ring -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Boxer -->
    <circle cx="100" cy="100" r="20" class="image" />
    <line x1="100" y1="120" x2="100" y2="180" class="image" />
    <line x1="100" y1="150" x2="70" y2="130" class="image" />
    <line x1="100" y1="150" x2="130" y2="130" class="image" />
    <!-- Opponent -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="180" class="image" />
    <line x1="250" y1="150" x2="220" y2="130" class="image" />
    <line x1="250" y1="150" x2="280" y2="130" class="image" />
    <!-- Beating action -->
    <line x1="100" y1="130" x2="250" y2="130" class="image" />
    <line x1="100" y1="140" x2="250" y2="140" class="image" />
    <line x1="100" y1="150" x2="250" y2="150" class="image" />
  </g>
</svg>