<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">divergence</text>
  <text x="50" y="120" class="subtitle">[daɪˈvɜːrdʒəns] n. 分歧，偏离</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + verg (转向) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两条原本平行的道路，突然"分开转向(di-verg)"，
    <tspan x="50" dy="25">形成了明显的分歧(divergence)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The divergence of opinions led to a heated debate.
  </text>
  <text x="50" y="310" class="content">
    意见分歧导致了激烈的辩论。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two roads -->
    <line x1="0" y1="0" x2="200" y2="0" class="image" />
    <line x1="0" y1="20" x2="200" y2="20" class="image" />
    <!-- Diverging paths -->
    <line x1="200" y1="0" x2="300" y2="-50" class="image" />
    <line x1="200" y1="20" x2="300" y2="70" class="image" />
    <!-- Arrows -->
    <polygon points="300,-50 280,-40 280,-60" class="image" />
    <polygon points="300,70 280,60 280,80" class="image" />
  </g>
</svg>