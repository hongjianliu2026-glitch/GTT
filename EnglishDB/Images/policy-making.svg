<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">policy-making</text>
  <text x="50" y="120" class="subtitle">[ˈpɒləsi meɪkɪŋ] n. 政策制定</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> policy (政策) + making (制作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群决策者在会议室里，"制作(making)"
    <tspan x="50" dy="25">出一系列政策(policy)，这些政策将影响整个国家。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The committee is responsible for policy-making.
  </text>
  <text x="50" y="310" class="content">
    委员会负责政策制定。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Meeting table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="150" cy="50" r="15" class="image" />
    <circle cx="250" cy="50" r="15" class="image" />
    <!-- Documents -->
    <rect x="50" y="80" width="50" height="50" class="image" />
    <rect x="150" y="80" width="50" height="50" class="image" />
    <rect x="250" y="80" width="50" height="50" class="image" />
    <!-- Pens -->
    <line x1="50" y1="140" x2="70" y2="140" class="image" />
    <line x1="150" y1="140" x2="170" y2="140" class="image" />
    <line x1="250" y1="140" x2="270" y2="140" class="image" />
  </g>
</svg>