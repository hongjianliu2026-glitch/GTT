<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lunchtime</text>
  <text x="50" y="120" class="subtitle">[ˈlʌntʃtaɪm] n. 午餐时间</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> lunch (午餐) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群同事在办公室里，"午餐时间(lunchtime)"
    <tspan x="50" dy="25">大家围坐在一起，享受美食，放松心情。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We usually have lunchtime at 12:30.
  </text>
  <text x="50" y="310" class="content">
    我们通常在12:30吃午餐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lunch box -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <!-- Fork and knife -->
    <line x1="170" y1="40" x2="200" y2="40" class="image" />
    <line x1="185" y1="40" x2="185" y2="70" class="image" />
    <line x1="210" y1="40" x2="240" y2="40" class="image" />
    <line x1="225" y1="40" x2="225" y2="70" class="image" />
    <!-- People -->
    <circle cx="70" cy="150" r="15" class="image" />
    <circle cx="150" cy="150" r="15" class="image" />
    <circle cx="230" cy="150" r="15" class="image" />
    <!-- Food -->
    <rect x="50" y="100" width="30" height="20" class="image" />
    <rect x="90" y="100" width="30" height="20" class="image" />
    <rect x="130" y="100" width="30" height="20" class="image" />
  </g>
</svg>