<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gin</text>
  <text x="50" y="120" class="subtitle">[dʒɪn] n. 杜松子酒</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自荷兰语 "jenever"，意为“杜松子”
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的酒馆，"杜松子(gin)"
    <tspan x="50" dy="25">酒瓶摆在吧台上，散发着独特的香气。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He ordered a gin and tonic at the bar.
  </text>
  <text x="50" y="310" class="content">
    他在酒吧点了一杯金汤力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bar counter -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Bottle -->
    <rect x="50" y="20" width="50" height="160" class="image" />
    <!-- Label -->
    <text x="60" y="110" class="content" style="font-size: 12px;">GIN</text>
    <!-- Glass -->
    <rect x="120" y="80" width="30" height="100" class="image" />
    <!-- Liquid -->
    <rect x="122" y="82" width="26" height="96" fill="#E74C3C" />
    <!-- Ice cubes -->
    <rect x="125" y="85" width="20" height="20" class="image" />
    <rect x="130" y="110" width="10" height="10" class="image" />
    <rect x="140" y="95" width="15" height="15" class="image" />
  </g>
</svg>