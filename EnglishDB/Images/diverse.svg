<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">diverse</text>
  <text x="50" y="120" class="subtitle">[daɪˈvɜːrs] adj. 多样的，不同的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> di- (分开) + verse (转向)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的转盘，上面有各种不同的颜色和形状，"分开转向(di-verse)"
    <tspan x="50" dy="25">形成了多样的图案，这就是diverse的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The city is known for its diverse population.
  </text>
  <text x="50" y="310" class="content">
    这座城市以其多样的人口而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large circle -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- Small circles representing diversity -->
    <circle cx="140" cy="60" r="15" class="image" fill="#E74C3C" />
    <circle cx="260" cy="60" r="15" class="image" fill="#3498DB" />
    <circle cx="170" cy="140" r="15" class="image" fill="#2ECC71" />
    <circle cx="230" cy="140" r="15" class="image" fill="#F1C40F" />
    <circle cx="200" cy="170" r="15" class="image" fill="#9B59B6" />
  </g>
</svg>