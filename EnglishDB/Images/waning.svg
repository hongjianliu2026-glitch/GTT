<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">waning</text>
  <text x="50" y="120" class="subtitle">[ˈweɪnɪŋ] adj. 减少的，减弱的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wan (变弱) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个逐渐变暗的月亮，"变弱(wan)"
    <tspan x="50" dy="25">的光芒象征着事物的减少或减弱(waning)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The waning popularity of the brand is concerning.
  </text>
  <text x="50" y="310" class="content">
    该品牌逐渐下降的人气令人担忧。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Moon phases -->
    <circle cx="100" cy="100" r="80" class="image" />
    <path d="M 100 20 A 80 80 0 0 1 180 100 L 100 100 Z" class="image" />
    <circle cx="100" cy="100" r="70" class="image" />
    <path d="M 100 30 A 70 70 0 0 1 170 100 L 100 100 Z" class="image" />
    <circle cx="100" cy="100" r="60" class="image" />
    <path d="M 100 40 A 60 60 0 0 1 160 100 L 100 100 Z" class="image" />
    <circle cx="100" cy="100" r="50" class="image" />
    <path d="M 100 50 A 50 50 0 0 1 150 100 L 100 100 Z" class="image" />
  </g>
</svg>