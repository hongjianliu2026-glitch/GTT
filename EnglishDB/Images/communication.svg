<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">communication</text>
  <text x="50" y="120" class="subtitle">[kəˌmjuːnɪˈkeɪʃn] n. 交流，通讯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + mun (服务) + -ication (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人通过电话线"共同服务(com-mun)"，
    <tspan x="50" dy="25">传递信息，这就是交流(communication)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Effective communication is key to a successful team.
  </text>
  <text x="50" y="310" class="content">
    有效的沟通是团队成功的关键。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Phone -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="100" r="40" class="image" />
    <line x1="50" y1="140" x2="50" y2="200" class="image" />
    <!-- Phone line -->
    <line x1="50" y1="0" x2="50" y2="100" class="image" />
    <line x1="50" y1="0" x2="200" y2="0" class="image" />
    <!-- Person 1 -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="200" class="image" />
    <line x1="250" y1="160" x2="270" y2="200" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Person 2 -->
    <circle cx="350" cy="100" r="20" class="image" />
    <line x1="350" y1="120" x2="350" y2="160" class="image" />
    <line x1="350" y1="160" x2="330" y2="200" class="image" />
    <line x1="350" y1="160" x2="370" y2="200" class="image" />
    <line x1="350" y1="140" x2="380" y2="130" class="image" />
  </g>
</svg>