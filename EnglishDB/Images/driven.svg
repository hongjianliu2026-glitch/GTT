<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">driven</text>
  <text x="50" y="120" class="subtitle">[ˈdrɪvən] adj. 有动力的，被驱动的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> drive (驱动) + -en (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆汽车被"驱动(drive)"着前进，
    <tspan x="50" dy="25">它的引擎"使(en)"它成为一辆"有动力的(driven)"车。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a driven person who always achieves her goals.
  </text>
  <text x="50" y="310" class="content">
    她是一个有动力的人，总是能实现她的目标。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Car body -->
    <rect x="0" y="0" width="350" height="100" class="image" />
    <!-- Wheels -->
    <circle cx="50" cy="120" r="20" class="image" />
    <circle cx="300" cy="120" r="20" class="image" />
    <!-- Engine -->
    <rect x="150" y="20" width="50" height="60" class="image" />
    <!-- Arrow -->
    <line x1="175" y1="80" x2="175" y2="120" class="image" />
    <polygon points="175,80 160,95 190,95" class="image" />
  </g>
</svg>