<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">harmonious</text>
  <text x="50" y="120" class="subtitle">[hɑːrˈmoʊniəs] adj. 和谐的，和睦的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> harmo- (和谐) + -nious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人围成一个圆圈，手拉手，脸上洋溢着笑容，
    <tspan x="50" dy="25">他们之间的和谐(harmo-nious)就像一首美妙的交响乐。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The couple has a harmonious relationship.
  </text>
  <text x="50" y="310" class="content">
    这对夫妻的关系很和谐。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle of people -->
    <circle cx="175" cy="100" r="80" class="image" />
    <!-- People -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="250" cy="100" r="10" class="image" />
    <circle cx="175" cy="20" r="10" class="image" />
    <circle cx="175" cy="180" r="10" class="image" />
    <!-- Hands -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <!-- Smiling faces -->
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="250" cy="100" r="5" class="image" />
    <circle cx="175" cy="20" r="5" class="image" />
    <circle cx="175" cy="180" r="5" class="image" />
  </g>
</svg>