<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">outspoken</text>
  <text x="50" y="120" class="subtitle">[aʊtˈspoʊkən] adj. 直言不讳的，坦率的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> out- (向外) + speak (说话) + -en (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在舞台上，"向外说出(out-speak-en)"
    <tspan x="50" dy="25">自己的想法，毫不掩饰，这就是直言不讳(outspoken)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is an outspoken advocate for women's rights.
  </text>
  <text x="50" y="310" class="content">
    她是妇女权利的直言不讳的倡导者。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Person speaking -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="150" y2="130" class="image" />
    <line x1="175" y1="150" x2="200" y2="130" class="image" />
    <line x1="175" y1="180" x2="150" y2="200" class="image" />
    <line x1="175" y1="180" x2="200" y2="200" class="image" />
    <!-- Speech bubble -->
    <path d="M200,80 Q250,80 250,120 Q200,120 200,80 Z" class="image" />
    <text x="210" y="100" class="content">"I say what I think!"</text>
  </g>
</svg>