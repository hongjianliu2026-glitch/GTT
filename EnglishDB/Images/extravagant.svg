<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">extravagant</text>
  <text x="50" y="120" class="subtitle">[ɪkˈstrævəɡənt] adj. 奢侈的，过度的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> extra- (超出) + vag (漫游) + -ant (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在购物时，"超出(extra)"了预算，"漫游(vag)"在奢侈品店中，
    <tspan x="50" dy="25">买下了所有昂贵的物品，这就是"奢侈的(extravagant)"行为。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She made an extravagant purchase of a diamond necklace.
  </text>
  <text x="50" y="310" class="content">
    她买了一条钻石项链，这是一次奢侈的购买。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shopping bag -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <line x1="20" y1="20" x2="130" y2="20" class="image" />
    <line x1="20" y1="40" x2="130" y2="40" class="image" />
    <line x1="20" y1="60" x2="130" y2="60" class="image" />
    <line x1="20" y1="80" x2="130" y2="80" class="image" />
    <!-- Diamond necklace -->
    <circle cx="80" cy="50" r="10" class="image" />
    <line x1="80" y1="60" x2="80" y2="100" class="image" />
    <line x1="80" y1="100" x2="60" y2="120" class="image" />
    <line x1="80" y1="100" x2="100" y2="120" class="image" />
    <!-- Person -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>