<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">personnel</text>
  <text x="50" y="120" class="subtitle">[ˌpɜːrsəˈnel] n. 人员，职员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> person (人) + -nel (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的办公室里，"人(person)"
    <tspan x="50" dy="25">们聚集在一起，形成了一个团队(personnel)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company is hiring new personnel for the marketing department.
  </text>
  <text x="50" y="310" class="content">
    公司正在为市场部招聘新员工。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Office desk -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="50" r="15" class="image" />
    <line x1="50" y1="65" x2="50" y2="100" class="image" />
    <line x1="50" y1="100" x2="35" y2="130" class="image" />
    <line x1="50" y1="100" x2="65" y2="130" class="image" />
    <line x1="50" y1="80" x2="80" y2="70" class="image" />

    <circle cx="120" cy="50" r="15" class="image" />
    <line x1="120" y1="65" x2="120" y2="100" class="image" />
    <line x1="120" y1="100" x2="105" y2="130" class="image" />
    <line x1="120" y1="100" x2="135" y2="130" class="image" />
    <line x1="120" y1="80" x2="150" y2="70" class="image" />

    <circle cx="190" cy="50" r="15" class="image" />
    <line x1="190" y1="65" x2="190" y2="100" class="image" />
    <line x1="190" y1="100" x2="175" y2="130" class="image" />
    <line x1="190" y1="100" x2="205" y2="130" class="image" />
    <line x1="190" y1="80" x2="220" y2="70" class="image" />
  </g>
</svg>