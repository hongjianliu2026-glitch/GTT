<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">appease</text>
  <text x="50" y="120" class="subtitle">[əˈpiːz] v. 安抚，平息</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (向) + pease (和平)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人拿着一束鲜花，"向(ap-)"
    <tspan x="50" dy="25">愤怒的人递过去，试图"和平(pease)"他们的情绪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She tried to appease her angry boss with a gift.
  </text>
  <text x="50" y="310" class="content">
    她试图用礼物安抚她生气的老板。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="200" class="image" />
    <line x1="50" y1="160" x2="70" y2="200" class="image" />
    <line x1="50" y1="140" x2="90" y2="130" class="image" />
    <!-- Flower -->
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="130" cy="90" r="10" class="image" />
    <circle cx="140" cy="100" r="10" class="image" />
    <line x1="130" y1="110" x2="130" y2="140" class="image" />
    <!-- Hand holding flower -->
    <line x1="90" y1="130" x2="120" y2="100" class="image" />
  </g>
</svg>