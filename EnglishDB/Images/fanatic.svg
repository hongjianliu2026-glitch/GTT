<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fanatic</text>
  <text x="50" y="120" class="subtitle">[fəˈnætɪk] n. 狂热者，入迷者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fan (狂热) + -atic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个狂热者(fanatic)，他的眼睛里闪烁着狂热的光芒，
    <tspan x="50" dy="25">仿佛被某种力量完全控制，无法自拔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a fanatic of the football team.
  </text>
  <text x="50" y="310" class="content">
    他是那支足球队的狂热粉丝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="85" r="10" class="image" />
    <circle cx="125" cy="85" r="10" class="image" />
    <!-- Mouth -->
    <line x1="75" y1="125" x2="125" y2="125" class="image" />
    <!-- Body -->
    <line x1="100" y1="150" x2="100" y2="250" class="image" />
    <!-- Arms -->
    <line x1="50" y1="180" x2="150" y2="180" class="image" />
    <!-- Legs -->
    <line x1="80" y1="250" x2="80" y2="300" class="image" />
    <line x1="120" y1="250" x2="120" y2="300" class="image" />
    <!-- Flame -->
    <polygon points="100,50 80,70 120,70" class="image" />
    <polygon points="100,40 70,60 130,60" class="image" />
    <polygon points="100,30 60,50 140,50" class="image" />
  </g>
</svg>