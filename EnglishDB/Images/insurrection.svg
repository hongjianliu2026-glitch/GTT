<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">insurrection</text>
  <text x="50" y="120" class="subtitle">[ˌɪnsəˈrekʃən] n. 起义，暴动</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (向内) + surrect (升起) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"向内升起(in-surrect)"，
    <tspan x="50" dy="25">他们手持火把和旗帜，准备起义(insurrection)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The insurrection was quickly quelled by the government.
  </text>
  <text x="50" y="310" class="content">
    起义很快被政府镇压了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="180" width="350" height="20" class="image" />
    <!-- People -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="35" y2="200" class="image" />
    <line x1="50" y1="180" x2="65" y2="200" class="image" />
    <line x1="50" y1="170" x2="70" y2="160" class="image" />

    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="180" class="image" />
    <line x1="100" y1="180" x2="85" y2="200" class="image" />
    <line x1="100" y1="180" x2="115" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="160" class="image" />

    <circle cx="150" cy="150" r="15" class="image" />
    <line x1="150" y1="165" x2="150" y2="180" class="image" />
    <line x1="150" y1="180" x2="135" y2="200" class="image" />
    <line x1="150" y1="180" x2="165" y2="200" class="image" />
    <line x1="150" y1="170" x2="170" y2="160" class="image" />

    <!-- Torches -->
    <line x1="40" y1="140" x2="40" y2="100" class="image" />
    <line x1="40" y1="100" x2="30" y2="110" class="image" />
    <line x1="40" y1="100" x2="50" y2="110" class="image" />

    <line x1="90" y1="140" x2="90" y2="100" class="image" />
    <line x1="90" y1="100" x2="80" y2="110" class="image" />
    <line x1="90" y1="100" x2="100" y2="110" class="image" />

    <line x1="140" y1="140" x2="140" y2="100" class="image" />
    <line x1="140" y1="100" x2="130" y2="110" class="image" />
    <line x1="140" y1="100" x2="150" y2="110" class="image" />

    <!-- Flag -->
    <line x1="180" y1="140" x2="180" y2="80" class="image" />
    <rect x="180" y="80" width="30" height="40" class="image" />
  </g>
</svg>