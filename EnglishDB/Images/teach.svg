<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">teach</text>
  <text x="50" y="120" class="subtitle">[tiːtʃ] v. 教，教授</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> te- (手) + ach (给予)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一位老师用手(te-)将知识传递(ach)给学生，
    <tspan x="50" dy="25">这种传递的过程就是"教(teach)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She teaches English to children.
  </text>
  <text x="50" y="310" class="content">
    她教孩子们英语。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Teacher -->
    <circle cx="50" cy="50" r="20" class="image" />
    <line x1="50" y1="70" x2="50" y2="120" class="image" />
    <line x1="50" y1="120" x2="30" y2="150" class="image" />
    <line x1="50" y1="120" x2="70" y2="150" class="image" />
    <line x1="50" y1="90" x2="80" y2="80" class="image" />
    <!-- Student -->
    <circle cx="150" cy="50" r="15" class="image" />
    <line x1="150" y1="65" x2="150" y2="110" class="image" />
    <line x1="150" y1="110" x2="130" y2="140" class="image" />
    <line x1="150" y1="110" x2="170" y2="140" class="image" />
    <line x1="150" y1="85" x2="180" y2="75" class="image" />
    <!-- Knowledge transfer -->
    <line x1="80" y1="80" x2="150" y2="80" class="image" />
    <polygon points="115,80 105,70 125,70" class="image" />
  </g>
</svg>