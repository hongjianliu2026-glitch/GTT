<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">Stalinist</text>
  <text x="50" y="120" class="subtitle">[ˈstælɪnɪst] adj. 斯大林主义的；n. 斯大林主义者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Stalin (斯大林) + -ist (表示“人”或“主义者”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个身穿军装的人，胸前挂着斯大林的肖像，
    <tspan x="50" dy="25">他坚定地宣扬斯大林主义(Stalinist)，仿佛斯大林就在他身边。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The Stalinist regime was known for its strict control over society.
  </text>
  <text x="50" y="310" class="content">
    斯大林主义政权以其对社会的严格控制而闻名。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soldier -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Stalin portrait -->
    <rect x="120" y="50" width="100" height="100" class="image" />
    <line x1="130" y1="60" x2="210" y2="60" class="image" />
    <line x1="130" y1="80" x2="200" y2="80" class="image" />
    <line x1="130" y1="100" x2="190" y2="100" class="image" />
    <line x1="130" y1="120" x2="180" y2="120" class="image" />
    <!-- Banner -->
    <line x1="250" y1="50" x2="250" y2="150" class="image" />
    <line x1="250" y1="50" x2="330" y2="50" class="image" />
    <line x1="250" y1="150" x2="330" y2="150" class="image" />
    <text x="260" y="100" class="content" style="font-size: 24px; fill: #C0392B;">Stalinist</text>
  </g>
</svg>