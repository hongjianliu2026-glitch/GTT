<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sodium</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊdiəm] n. 钠</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sod (苏打) + -ium (化学元素后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个化学实验室里，"苏打(sod)"
    <tspan x="50" dy="25">被提取出来，变成了一个闪亮的金属元素(sodium)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Sodium is an essential element for human health.
  </text>
  <text x="50" y="310" class="content">
    钠是人体健康必需的元素。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Flask -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Bubbles -->
    <circle cx="100" cy="100" r="10" class="image" />
    <circle cx="150" cy="120" r="10" class="image" />
    <circle cx="200" cy="140" r="10" class="image" />
    <circle cx="250" cy="160" r="10" class="image" />
    <!-- Sodium symbol -->
    <text x="150" y="180" class="content" style="font-size: 36px;">Na</text>
  </g>
</svg>