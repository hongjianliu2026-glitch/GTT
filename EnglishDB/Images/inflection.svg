<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inflection</text>
  <text x="50" y="120" class="subtitle">[ɪnˈflekʃən] n. 词形变化，音调变化</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (向内) + flex (弯曲) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个声音"向内弯曲(in-flex)"，
    <tspan x="50" dy="25">形成不同的音调变化，这就是词形变化(inflection)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The inflection of his voice indicated surprise.
  </text>
  <text x="50" y="310" class="content">
    他声音的音调变化表明他很惊讶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sound wave -->
    <path d="M0,100 C50,50 150,150 200,100 C250,50 350,150 400,100" class="image" />
    <!-- Arrow indicating inflection -->
    <line x1="100" y1="80" x2="150" y2="120" class="image" />
    <polygon points="150,120 145,115 145,125" class="image" />
    <!-- Speaker -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="150" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
  </g>
</svg>