<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uncommon</text>
  <text x="50" y="120" class="subtitle">[ʌnˈkɒmən] adj. 不寻常的，罕见的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (不) + common (普通的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通的街道上，突然出现了一只巨大的
    <tspan x="50" dy="25">独角兽，这显然是"不普通的(uncommon)"景象。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> It was an uncommon sight to see a rainbow in the middle of the night.
  </text>
  <text x="50" y="310" class="content">
    在半夜看到彩虹是一个不寻常的景象。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Street -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses -->
    <rect x="50" y="20" width="50" height="100" class="image" />
    <rect x="120" y="20" width="50" height="100" class="image" />
    <rect x="190" y="20" width="50" height="100" class="image" />
    <!-- Unicorn -->
    <circle cx="280" cy="100" r="30" class="image" />
    <line x1="280" y1="130" x2="280" y2="180" class="image" />
    <line x1="280" y1="180" x2="260" y2="220" class="image" />
    <line x1="280" y1="180" x2="300" y2="220" class="image" />
    <line x1="280" y1="150" x2="320" y2="140" class="image" />
    <line x1="280" y1="150" x2="240" y2="140" class="image" />
    <!-- Horn -->
    <line x1="280" y1="70" x2="280" y2="40" class="image" />
  </g>
</svg>