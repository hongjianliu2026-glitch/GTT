<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFFDE7; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .sun { fill: #FFD700; }
      .light { stroke: #FFD700; stroke-width: 3; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">brightly</text>
  <text x="50" y="120" class="subtitle">[ˈbraɪtli] adv. 明亮地，灿烂地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bright (明亮的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个太阳高高挂在天空，"明亮地(brightly)"
    <tspan x="50" dy="25">照耀着大地，万物都被阳光照得闪闪发光。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The stars shone brightly in the night sky.
  </text>
  <text x="50" y="310" class="content">
    星星在夜空中闪烁着明亮的光芒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="sun" />
    <!-- Light rays -->
    <line x1="100" y1="50" x2="100" y2="0" class="light" />
    <line x1="150" y1="100" x2="200" y2="100" class="light" />
    <line x1="100" y1="150" x2="100" y2="200" class="light" />
    <line x1="50" y1="100" x2="0" y2="100" class="light" />
    <!-- Ground -->
    <rect x="0" y="200" width="200" height="50" class="image" />
    <!-- Shining objects -->
    <circle cx="50" cy="150" r="10" class="image" />
    <circle cx="150" cy="150" r="10" class="image" />
  </g>
</svg>