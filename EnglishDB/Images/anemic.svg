<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anemic</text>
  <text x="50" y="120" class="subtitle">[əˈniːmɪk] adj. 贫血的，无力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> an- (无) + em (血) + -ic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人脸色苍白，"没有血(an-em)"，
    <tspan x="50" dy="25">看起来非常虚弱，这就是贫血(anemic)的状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She felt anemic after donating blood.
  </text>
  <text x="50" y="310" class="content">
    她献血后感到贫血。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="75" cy="85" r="5" class="image" />
    <circle cx="125" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Blood drop -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="170" class="image" />
    <line x1="200" y1="150" x2="220" y2="170" class="image" />
  </g>
</svg>