<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">lasting</text>
  <text x="50" y="120" class="subtitle">[ˈlɑːstɪŋ] adj. 持久的，耐久的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> last (持续) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块石头，"持续(last)"
    <tspan x="50" dy="25">在时间的河流中，历经千年而不变，</tspan>
    <tspan x="50" dy="25">这就是持久的(lasting)力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The effects of the earthquake were lasting.
  </text>
  <text x="50" y="310" class="content">
    地震的影响是持久的。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stone -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <!-- River -->
    <line x1="0" y1="120" x2="150" y2="120" class="image" />
    <line x1="0" y1="130" x2="150" y2="130" class="image" />
    <line x1="0" y1="140" x2="150" y2="140" class="image" />
    <line x1="0" y1="150" x2="150" y2="150" class="image" />
    <!-- Time -->
    <text x="170" y="100" class="content">Time</text>
    <line x1="170" y1="110" x2="300" y2="110" class="image" />
    <line x1="170" y1="120" x2="300" y2="120" class="image" />
    <line x1="170" y1="130" x2="300" y2="130" class="image" />
    <line x1="170" y1="140" x2="300" y2="140" class="image" />
  </g>
</svg>