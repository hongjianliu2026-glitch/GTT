<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">toothpick</text>
  <text x="50" y="120" class="subtitle">[ˈtuːθpɪk] n. 牙签</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tooth (牙齿) + pick (挑选)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个夸张的场景，一个人用一根巨大的牙签，"挑选(pick)"
    <tspan x="50" dy="25">他巨大的牙齿(tooth)，这个牙签(toothpick)就成了清理牙齿的工具。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a toothpick to remove food from between his teeth.
  </text>
  <text x="50" y="310" class="content">
    他用牙签剔除牙齿间的食物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tooth -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="100" cy="100" r="50" class="image" />
    <line x1="70" y1="100" x2="130" y2="100" class="image" />
    <line x1="100" y1="70" x2="100" y2="130" class="image" />
    <!-- Toothpick -->
    <line x1="200" y1="100" x2="300" y2="100" class="image" />
    <line x1="200" y1="90" x2="200" y2="110" class="image" />
    <line x1="300" y1="90" x2="300" y2="110" class="image" />
  </g>
</svg>