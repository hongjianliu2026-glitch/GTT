<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">monumental</text>
  <text x="50" y="120" class="subtitle">[ˌmɒnjuˈmentl] adj. 巨大的，纪念碑的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> monu (纪念碑) + -ment (名词后缀) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的纪念碑(monu-ment)，它高耸入云，
    <tspan x="50" dy="25">象征着伟大的成就和历史，这就是"monumental"的含义。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The architect designed a monumental building.
  </text>
  <text x="50" y="310" class="content">
    建筑师设计了一座巨大的建筑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Monument -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="150" y="20" width="50" height="160" class="image" />
    <line x1="175" y1="20" x2="175" y2="0" class="image" />
    <line x1="175" y1="180" x2="175" y2="200" class="image" />
    <line x1="150" y1="100" x2="200" y2="100" class="image" />
    <line x1="150" y1="120" x2="200" y2="120" class="image" />
    <line x1="150" y1="140" x2="200" y2="140" class="image" />
    <line x1="150" y1="160" x2="200" y2="160" class="image" />
    <!-- Clouds -->
    <circle cx="100" cy="20" r="20" class="image" />
    <circle cx="130" cy="30" r="20" class="image" />
    <circle cx="160" cy="20" r="20" class="image" />
    <circle cx="190" cy="30" r="20" class="image" />
    <circle cx="220" cy="20" r="20" class="image" />
  </g>
</svg>