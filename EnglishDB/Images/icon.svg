<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">icon</text>
  <text x="50" y="120" class="subtitle">[ˈaɪkɒn] n. 图标，偶像</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eikon (图像)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的屏幕上，一个小小的"图像(eikon)"
    <tspan x="50" dy="25">变成了人们崇拜的"偶像(icon)"，</tspan>
    <tspan x="50" dy="25">它不仅代表了一个功能，还成为了象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The app's icon is easily recognizable.
  </text>
  <text x="50" y="310" class="content">
    这个应用的图标很容易辨认。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Small icon -->
    <rect x="150" y="70" width="50" height="50" class="image" />
    <!-- Admiring people -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="190" class="image" />
    <line x1="50" y1="190" x2="35" y2="210" class="image" />
    <line x1="50" y1="190" x2="65" y2="210" class="image" />
    <line x1="50" y1="175" x2="80" y2="165" class="image" />

    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="85" y2="210" class="image" />
    <line x1="100" y1="190" x2="115" y2="210" class="image" />
    <line x1="100" y1="175" x2="130" y2="165" class="image" />

    <circle cx="250" cy="150" r="15" class="image" />
    <line x1="250" y1="165" x2="250" y2="190" class="image" />
    <line x1="250" y1="190" x2="235" y2="210" class="image" />
    <line x1="250" y1="190" x2="265" y2="210" class="image" />
    <line x1="250" y1="175" x2="280" y2="165" class="image" />
  </g>
</svg>