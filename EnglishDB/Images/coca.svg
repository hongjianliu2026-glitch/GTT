<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coca</text>
  <text x="50" y="120" class="subtitle">[ˈkoʊkə] n. 古柯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自南美洲原住民语言，指古柯植物
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片南美洲的热带雨林，"古柯(coca)"
    <tspan x="50" dy="25">植物在阳光下茁壮成长，当地人采摘叶子制作传统饮品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The coca plant is native to the Andean region.
  </text>
  <text x="50" y="310" class="content">
    古柯植物原产于安第斯地区。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rainforest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" fill="#F1C40F" />
    <!-- Coca plant -->
    <line x1="150" y1="100" x2="150" y2="180" class="image" />
    <line x1="150" y1="120" x2="130" y2="140" class="image" />
    <line x1="150" y1="120" x2="170" y2="140" class="image" />
    <line x1="150" y1="140" x2="130" y2="160" class="image" />
    <line x1="150" y1="140" x2="170" y2="160" class="image" />
    <!-- Leaves -->
    <polygon points="150,100 120,70 180,70" fill="#27AE60" />
    <polygon points="150,120 110,90 190,90" fill="#27AE60" />
    <polygon points="150,140 100,110 200,110" fill="#27AE60" />
    <polygon points="150,160 90,130 210,130" fill="#27AE60" />
  </g>
</svg>