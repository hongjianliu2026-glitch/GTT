<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hail</text>
  <text x="50" y="120" class="subtitle">[heɪl] v. 向...欢呼，致敬；n. 冰雹</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> hailst (冰雹)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场冰雹(hail)从天而降，人们欢呼(hail)着躲避，
    <tspan x="50" dy="25">这场冰雹就像是对大地的致敬(hail)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd hailed the hero with cheers.
  </text>
  <text x="50" y="310" class="content">
    人群向英雄欢呼致敬。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hailstones -->
    <circle cx="50" cy="50" r="10" class="image" />
    <circle cx="100" cy="70" r="12" class="image" />
    <circle cx="150" cy="60" r="8" class="image" />
    <circle cx="200" cy="80" r="15" class="image" />
    <circle cx="250" cy="50" r="10" class="image" />
    <!-- People cheering -->
    <circle cx="50" cy="150" r="15" class="image" />
    <line x1="50" y1="165" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="30" y2="230" class="image" />
    <line x1="50" y1="200" x2="70" y2="230" class="image" />
    <line x1="50" y1="180" x2="80" y2="170" class="image" />
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
  </g>
</svg>