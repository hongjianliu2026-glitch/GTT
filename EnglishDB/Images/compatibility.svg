<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compatibility</text>
  <text x="50" y="120" class="subtitle">[kəmˌpætəˈbɪləti] n. 兼容性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + pati (忍受) + -bility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两台电脑，一台是苹果，一台是PC，它们"共同忍受(com-pati)"
    <tspan x="50" dy="25">彼此的差异，和谐地工作，这就是兼容性(compatibility)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The software has excellent compatibility with various operating systems.
  </text>
  <text x="50" y="310" class="content">
    这款软件与各种操作系统具有极佳的兼容性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Apple computer -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <circle cx="20" cy="20" r="10" class="image" />
    <line x1="40" y1="20" x2="140" y2="20" class="image" />
    <line x1="40" y1="40" x2="140" y2="40" class="image" />
    <line x1="40" y1="60" x2="140" y2="60" class="image" />
    <line x1="40" y1="80" x2="140" y2="80" class="image" />

    <!-- PC computer -->
    <rect x="200" y="0" width="150" height="100" class="image" />
    <rect x="210" y="10" width="130" height="80" class="image" />
    <line x1="220" y1="30" x2="320" y2="30" class="image" />
    <line x1="220" y1="50" x2="320" y2="50" class="image" />
    <line x1="220" y1="70" x2="320" y2="70" class="image" />

    <!-- Connecting line -->
    <line x1="150" y1="50" x2="200" y2="50" class="image" />
  </g>
</svg>