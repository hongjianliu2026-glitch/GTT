<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scent</text>
  <text x="50" y="120" class="subtitle">[sent] n. 气味，香味；v. 闻到，嗅到</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sent (感觉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小狗在花园里，"嗅到(sent)"
    <tspan x="50" dy="25">一朵盛开的玫瑰，那迷人的香味(scent)让它陶醉。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The scent of roses filled the garden.
  </text>
  <text x="50" y="310" class="content">
    玫瑰的香味充满了花园。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Garden -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rose -->
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="120" cy="80" r="20" class="image" />
    <circle cx="140" cy="100" r="25" class="image" />
    <circle cx="110" cy="120" r="20" class="image" />
    <circle cx="130" cy="120" r="20" class="image" />
    <!-- Dog -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
    <!-- Scent lines -->
    <line x1="100" y1="70" x2="240" y2="70" class="image" />
    <line x1="100" y1="50" x2="240" y2="50" class="image" />
    <line x1="100" y1="30" x2="240" y2="30" class="image" />
  </g>
</svg>