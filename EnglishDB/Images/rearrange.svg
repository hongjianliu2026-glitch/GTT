<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rearrange</text>
  <text x="50" y="120" class="subtitle">[ˌriːəˈreɪndʒ] v. 重新安排，重新排列</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + arrange (安排)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个房间里，所有的家具都被"再次安排(re-arrange)"
    <tspan x="50" dy="25">成新的布局，整个房间焕然一新。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She decided to rearrange the furniture in her living room.
  </text>
  <text x="50" y="310" class="content">
    她决定重新安排客厅的家具。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Room outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Old furniture -->
    <rect x="50" y="20" width="60" height="60" class="image" />
    <rect x="150" y="20" width="60" height="60" class="image" />
    <rect x="250" y="20" width="60" height="60" class="image" />
    <!-- New furniture -->
    <rect x="50" y="120" width="60" height="60" class="image" />
    <rect x="150" y="120" width="60" height="60" class="image" />
    <rect x="250" y="120" width="60" height="60" class="image" />
    <!-- Arrows indicating movement -->
    <line x1="80" y1="50" x2="80" y2="150" class="image" />
    <line x1="180" y1="50" x2="180" y2="150" class="image" />
    <line x1="280" y1="50" x2="280" y2="150" class="image" />
    <polygon points="75,150 85,150 80,160" class="image" />
    <polygon points="175,150 185,150 180,160" class="image" />
    <polygon points="275,150 285,150 280,160" class="image" />
  </g>
</svg>