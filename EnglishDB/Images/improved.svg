<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">improved</text>
  <text x="50" y="120" class="subtitle">[ɪmˈpruːvd] adj. 改进的，改善的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (进入) + prove (证明)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个产品从"进入(im-)"市场后，经过"证明(prove)"
    <tspan x="50" dy="25">其价值，最终变得"改进的(improved)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The improved version of the software is more user-friendly.
  </text>
  <text x="50" y="310" class="content">
    改进后的软件版本更加用户友好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Old product -->
    <rect x="0" y="0" width="100" height="100" class="image" />
    <text x="50" y="50" text-anchor="middle" class="content">Old</text>
    <!-- Arrow -->
    <line x1="120" y1="50" x2="200" y2="50" class="image" />
    <polygon points="200,50 190,45 190,55" class="image" />
    <!-- Improved product -->
    <rect x="220" y="0" width="100" height="100" class="image" />
    <text x="270" y="50" text-anchor="middle" class="content">Improved</text>
  </g>
</svg>