<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">desegregation</text>
  <text x="50" y="120" class="subtitle">[ˌdiːˌseɡrɪˈɡeɪʃən] n. 废除种族隔离</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (去除) + segreg (分离) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人原本被"分离(segreg)"在不同的区域，
    <tspan x="50" dy="25">突然有一只巨大的手"去除(de-)"了这些隔离的墙壁，</tspan>
    <tspan x="50" dy="25">人们开始自由地混合在一起，这就是"废除种族隔离(desegregation)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="300" class="content">
    <tspan class="highlight">例句:</tspan> The desegregation of schools was a major milestone in civil rights history.
  </text>
  <text x="50" y="330" class="content">
    学校的废除种族隔离是民权历史上的一个重要里程碑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Walls -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <rect x="150" y="0" width="100" height="200" class="image" />
    <!-- Giant hand removing walls -->
    <line x1="50" y1="0" x2="50" y2="200" class="image" />
    <line x1="200" y1="0" x2="200" y2="200" class="image" />
    <line x1="50" y1="100" x2="200" y2="100" class="image" />
    <!-- People -->
    <circle cx="75" cy="50" r="15" class="image" />
    <circle cx="225" cy="50" r="15" class="image" />
    <circle cx="75" cy="150" r="15" class="image" />
    <circle cx="225" cy="150" r="15" class="image" />
  </g>
</svg>