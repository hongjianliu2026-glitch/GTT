<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ICU</text>
  <text x="50" y="120" class="subtitle">[aɪ siː juː] n. 重症监护室</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Intensive Care Unit
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个病人躺在病床上，周围是各种医疗设备，
    <tspan x="50" dy="25">医生和护士在紧张地工作，这就是重症监护室(ICU)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The patient was transferred to the ICU after surgery.
  </text>
  <text x="50" y="310" class="content">
    病人在手术后被转移到重症监护室。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bed -->
    <rect x="50" y="20" width="250" height="100" class="image" />
    <!-- Patient -->
    <circle cx="175" cy="70" r="15" class="image" />
    <line x1="175" y1="85" x2="175" y2="120" class="image" />
    <line x1="175" y1="120" x2="155" y2="140" class="image" />
    <line x1="175" y1="120" x2="195" y2="140" class="image" />
    <!-- Medical equipment -->
    <rect x="30" y="130" width="50" height="50" class="image" />
    <rect x="120" y="130" width="50" height="50" class="image" />
    <rect x="210" y="130" width="50" height="50" class="image" />
    <!-- Doctor and nurse -->
    <circle cx="100" cy="200" r="15" class="image" />
    <line x1="100" y1="215" x2="100" y2="250" class="image" />
    <line x1="100" y1="250" x2="80" y2="280" class="image" />
    <line x1="100" y1="250" x2="120" y2="280" class="image" />
    <line x1="100" y1="230" x2="130" y2="220" class="image" />
    <circle cx="250" cy="200" r="15" class="image" />
    <line x1="250" y1="215" x2="250" y2="250" class="image" />
    <line x1="250" y1="250" x2="230" y2="280" class="image" />
    <line x1="250" y1="250" x2="270" y2="280" class="image" />
    <line x1="250" y1="230" x2="280" y2="220" class="image" />
  </g>
</svg>