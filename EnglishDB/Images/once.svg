<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">once</text>
  <text x="50" y="120" class="subtitle">[wʌns] adv. 一次，曾经</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> on- (在...上) + ce (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时钟，指针"在时间上(on-ce)"只走了一圈，
    <tspan x="50" dy="25">这就是"一次(once)"的意思。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> I saw him once at the party.
  </text>
  <text x="50" y="310" class="content">
    我在聚会上见过他一次。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Clock face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Clock hands -->
    <line x1="100" y1="100" x2="100" y2="20" class="image" />
    <line x1="100" y1="100" x2="180" y2="100" class="image" />
    <!-- Time marker -->
    <text x="90" y="25" class="content">1</text>
  </g>
</svg>