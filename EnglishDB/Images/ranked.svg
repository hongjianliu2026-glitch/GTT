<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ranked</text>
  <text x="50" y="120" class="subtitle">[ræŋkt] adj. 排名的，分等级的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rank (排列) + -ed (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人按照身高"排列(rank)"，
    <tspan x="50" dy="25">最高的在最前面，形成了一个"排名的(ranked)"队伍。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The team is ranked first in the league.
  </text>
  <text x="50" y="310" class="content">
    这支队伍在联赛中排名第一。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- People in a line -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <circle cx="50" cy="40" r="15" class="image" />
    <line x1="50" y1="55" x2="50" y2="80" class="image" />
    <line x1="50" y1="80" x2="35" y2="110" class="image" />
    <line x1="50" y1="80" x2="65" y2="110" class="image" />
    <line x1="50" y1="65" x2="70" y2="55" class="image" />

    <circle cx="100" cy="60" r="15" class="image" />
    <line x1="100" y1="75" x2="100" y2="100" class="image" />
    <line x1="100" y1="100" x2="85" y2="130" class="image" />
    <line x1="100" y1="100" x2="115" y2="130" class="image" />
    <line x1="100" y1="85" x2="120" y2="75" class="image" />

    <circle cx="150" cy="80" r="15" class="image" />
    <line x1="150" y1="95" x2="150" y2="120" class="image" />
    <line x1="150" y1="120" x2="135" y2="150" class="image" />
    <line x1="150" y1="120" x2="165" y2="150" class="image" />
    <line x1="150" y1="105" x2="170" y2="95" class="image" />

    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="140" class="image" />
    <line x1="200" y1="140" x2="185" y2="170" class="image" />
    <line x1="200" y1="140" x2="215" y2="170" class="image" />
    <line x1="200" y1="125" x2="220" y2="115" class="image" />
  </g>
</svg>