<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">occupying</text>
  <text x="50" y="120" class="subtitle">[ˈɒkjupaɪŋ] adj. 占领的，占用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oc- (加强) + cup (抓取) + y (状态)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的手"抓住(cup)"整个城市，
    <tspan x="50" dy="25">这个城市就被"占领(occupying)"了。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The occupying forces left the city after the peace treaty was signed.
  </text>
  <text x="50" y="310" class="content">
    和平条约签署后，占领军离开了城市。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="20" height="100" class="image" />
    <rect x="100" y="40" width="20" height="80" class="image" />
    <rect x="150" y="60" width="20" height="60" class="image" />
    <rect x="200" y="80" width="20" height="40" class="image" />
    <rect x="250" y="100" width="20" height="20" class="image" />
    <!-- Giant hand -->
    <line x1="0" y1="100" x2="350" y2="100" class="image" />
    <line x1="0" y1="100" x2="50" y2="0" class="image" />
    <line x1="350" y1="100" x2="300" y2="0" class="image" />
    <line x1="50" y1="0" x2="300" y2="0" class="image" />
    <line x1="50" y1="0" x2="50" y2="20" class="image" />
    <line x1="300" y1="0" x2="300" y2="20" class="image" />
  </g>
</svg>