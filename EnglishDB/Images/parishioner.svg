<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">parishioner</text>
  <text x="50" y="120" class="subtitle">[pəˈrɪʃənər] n. 教区居民</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> par- (准备) + ish (来自) + ion (名词后缀) + er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个教区居民，"准备(par-)"
    <tspan x="50" dy="25">参加教堂活动，他们是教区的一部分(parishioner)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The parishioner attended the Sunday mass regularly.
  </text>
  <text x="50" y="310" class="content">
    这位教区居民定期参加周日的弥撒。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <polygon points="50,20 300,20 325,50 325,180 25,180 25,50" class="image" />
    <!-- Cross on the church -->
    <line x1="185" y1="30" x2="185" y2="70" class="image" />
    <line x1="165" y1="50" x2="205" y2="50" class="image" />
    <!-- Parishioner -->
    <circle cx="100" cy="120" r="15" class="image" />
    <line x1="100" y1="135" x2="100" y2="170" class="image" />
    <line x1="100" y1="170" x2="80" y2="200" class="image" />
    <line x1="100" y1="170" x2="120" y2="200" class="image" />
    <line x1="100" y1="150" x2="130" y2="140" class="image" />
  </g>
</svg>