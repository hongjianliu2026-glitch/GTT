<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pillar</text>
  <text x="50" y="120" class="subtitle">[ˈpɪlər] n. 柱子，支柱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pil (柱子) + -ar (表示物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座古老的城堡，"柱子(pil)"
    <tspan x="50" dy="25">支撑着整个建筑，它是城堡的"支柱(pillar)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The pillar supported the entire roof of the ancient temple.
  </text>
  <text x="50" y="310" class="content">
    这根柱子支撑着整个古老寺庙的屋顶。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pillar -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Castle -->
    <rect x="120" y="100" width="200" height="100" class="image" />
    <!-- Roof -->
    <polygon points="120,100 320,100 220,50" class="image" />
    <!-- Pillar supporting roof -->
    <line x1="50" y1="200" x2="220" y2="100" class="image" />
  </g>
</svg>