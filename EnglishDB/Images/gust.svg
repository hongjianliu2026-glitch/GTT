<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gust</text>
  <text x="50" y="120" class="subtitle">[ɡʌst] n. 一阵强风，突然的一股力量</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gust (风)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一阵强风("gust")突然袭来，吹得树叶四处飞舞，
    <tspan x="50" dy="25">甚至把人吹得摇摇晃晃，这就是"gust"的力量。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> A gust of wind blew the papers off the table.
  </text>
  <text x="50" y="310" class="content">
    一阵风吹走了桌上的文件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Gust of wind -->
    <path d="M0 0 Q100 100 200 0" class="image" />
    <path d="M0 50 Q100 150 200 50" class="image" />
    <path d="M0 100 Q100 200 200 100" class="image" />
    <!-- Leaves -->
    <circle cx="100" cy="50" r="10" class="image" />
    <circle cx="150" cy="70" r="10" class="image" />
    <circle cx="120" cy="100" r="10" class="image" />
    <!-- Person -->
    <circle cx="50" cy="150" r="20" class="image" />
    <line x1="50" y1="170" x2="50" y2="220" class="image" />
    <line x1="50" y1="220" x2="30" y2="250" class="image" />
    <line x1="50" y1="220" x2="70" y2="250" class="image" />
    <line x1="50" y1="190" x2="80" y2="180" class="image" />
  </g>
</svg>