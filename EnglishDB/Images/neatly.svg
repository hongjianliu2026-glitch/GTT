<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">neatly</text>
  <text x="50" y="120" class="subtitle">[ˈniːtli] adv. 整洁地，整齐地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> neat (整洁的) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个强迫症患者，"整洁地(neatly)"
    <tspan x="50" dy="25">整理房间，每件物品都摆放得井井有条。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She folded her clothes neatly and put them in the drawer.
  </text>
  <text x="50" y="310" class="content">
    她把衣服叠得整整齐齐，然后放进抽屉里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Neatly arranged items -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Clothes -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- Drawer -->
    <rect x="50" y="90" width="200" height="80" class="image" />
    <!-- Lines to indicate neat arrangement -->
    <line x1="50" y1="20" x2="240" y2="20" class="image" />
    <line x1="50" y1="70" x2="240" y2="70" class="image" />
    <line x1="50" y1="20" x2="50" y2="70" class="image" />
    <line x1="120" y1="20" x2="120" y2="70" class="image" />
    <line x1="190" y1="20" x2="190" y2="70" class="image" />
    <line x1="240" y1="20" x2="240" y2="70" class="image" />
  </g>
</svg>