<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">infectious</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfekʃəs] adj. 传染性的，有感染力的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + fect (做) + -ious (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个病毒"进入(in-)"人体，"做(fect)"
    <tspan x="50" dy="25">坏事，这种病毒具有传染性(infectious)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The laughter in the room was infectious.
  </text>
  <text x="50" y="310" class="content">
    房间里的笑声很有感染力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Virus -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="70" x2="50" y2="130" class="image" />
    <line x1="30" y1="100" x2="70" y2="100" class="image" />
    <line x1="40" y1="85" x2="60" y2="115" class="image" />
    <line x1="40" y1="115" x2="60" y2="85" class="image" />

    <!-- Human body -->
    <rect x="100" y="70" width="150" height="60" class="image" />
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="175" y1="100" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="150" y2="200" class="image" />
    <line x1="175" y1="160" x2="200" y2="200" class="image" />
    <line x1="175" y1="130" x2="125" y2="120" class="image" />
    <line x1="175" y1="130" x2="225" y2="120" class="image" />

    <!-- Arrow -->
    <line x1="80" y1="100" x2="100" y2="100" class="image" />
    <polygon points="100,90 100,110 120,100" class="image" />
  </g>
</svg>