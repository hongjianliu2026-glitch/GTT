<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">uptown</text>
  <text x="50" y="120" class="subtitle">[ˈʌpˈtaʊn] n. 住宅区，上城区</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up- (向上) + town (城镇)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小镇，"向上(up)"走，你会到达一个更安静、更豪华的住宅区，这就是"上城区(uptown)"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They moved to the uptown area for a quieter life.
  </text>
  <text x="50" y="310" class="content">
    他们搬到了上城区，为了过上更安静的生活。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Town -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Houses in downtown -->
    <rect x="50" y="20" width="50" height="50" class="image" />
    <rect x="120" y="20" width="50" height="50" class="image" />
    <rect x="190" y="20" width="50" height="50" class="image" />
    <!-- Houses in uptown -->
    <rect x="50" y="100" width="70" height="70" class="image" />
    <rect x="140" y="100" width="70" height="70" class="image" />
    <rect x="230" y="100" width="70" height="70" class="image" />
    <!-- Arrow pointing up -->
    <line x1="175" y1="80" x2="175" y2="10" class="image" />
    <polygon points="170,10 180,10 175,5" class="image" />
  </g>
</svg>