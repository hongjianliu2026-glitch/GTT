<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rug</text>
  <text x="50" y="120" class="subtitle">[rʌɡ] n. 小地毯</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "rugge"，意为粗糙的布料
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的粗糙布料(rugge)铺在地上，
    <tspan x="50" dy="25">人们赤脚走在上面，感受到它的温暖和舒适。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She placed a colorful rug in the living room.
  </text>
  <text x="50" y="310" class="content">
    她在客厅里铺了一块色彩鲜艳的小地毯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rug -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Rug texture -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="170" x2="300" y2="170" class="image" />
    <!-- Feet -->
    <circle cx="100" cy="150" r="15" class="image" />
    <circle cx="250" cy="150" r="15" class="image" />
  </g>
</svg>