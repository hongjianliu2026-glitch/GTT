<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">filet</text>
  <text x="50" y="120" class="subtitle">[fiˈleɪ] n. 菲力牛排，鱼片</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fil (线) + et (小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块精致的菲力牛排，"细线般(fil)"
    <tspan x="50" dy="25">的肉质被切成小块(et)，这就是filet。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He ordered a filet mignon at the restaurant.
  </text>
  <text x="50" y="310" class="content">
    他在餐厅点了一份菲力牛排。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Steak -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Lines representing meat fibers -->
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Knife -->
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <line x1="300" y1="20" x2="280" y2="40" class="image" />
    <line x1="300" y1="20" x2="320" y2="40" class="image" />
  </g>
</svg>