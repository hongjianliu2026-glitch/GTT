<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">eater</text>
  <text x="50" y="120" class="subtitle">[ˈiːtər] n. 食者，吃东西的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eat (吃) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的嘴巴，"吃(eat)"
    <tspan x="50" dy="25">下一切，这个嘴巴的主人就是食者(eater)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a big eater and can finish a whole pizza by himself.
  </text>
  <text x="50" y="310" class="content">
    他是个大胃王，能一个人吃完整个披萨。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mouth -->
    <path d="M50 100 Q100 50 150 100" class="image" />
    <path d="M50 100 Q100 150 150 100" class="image" />
    <!-- Food -->
    <rect x="70" y="80" width="20" height="20" class="image" />
    <rect x="110" y="80" width="20" height="20" class="image" />
    <rect x="90" y="60" width="20" height="20" class="image" />
  </g>
</svg>