<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">airwaves</text>
  <text x="50" y="120" class="subtitle">[ˈɛrˌweɪvz] n. 无线电波，广播</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> air (空气) + wave (波)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的广播塔，"空气中的波(air-wave)"
    <tspan x="50" dy="25">传播着声音和信息，这些波就是广播(airwaves)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The news spread quickly through the airwaves.
  </text>
  <text x="50" y="310" class="content">
    新闻通过无线电波迅速传播。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Broadcast tower -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <!-- Waves -->
    <path d="M120,100 Q150,50 180,100 T240,100" class="image" />
    <path d="M120,120 Q150,70 180,120 T240,120" class="image" />
    <path d="M120,140 Q150,90 180,140 T240,140" class="image" />
    <!-- Radio -->
    <rect x="260" y="80" width="100" height="60" class="image" />
    <circle cx="310" cy="110" r="10" class="image" />
    <line x1="310" y1="120" x2="310" y2="140" class="image" />
  </g>
</svg>