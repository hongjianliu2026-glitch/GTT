<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F4ECF7; }
      .title { font: bold 48px sans-serif; fill: #8E44AD; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shaman</text>
  <text x="50" y="120" class="subtitle">[ˈʃɑːmən] n. 萨满，巫师</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sham (神) + an (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个"神人(sham-an)"在森林中，
    <tspan x="50" dy="25">手持法杖，与神灵沟通，他就是萨满(shaman)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shaman performed a ritual to heal the sick.
  </text>
  <text x="50" y="310" class="content">
    萨满进行了一场仪式来治愈病人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Forest background -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="40" x2="300" y2="40" class="image" />
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="50" y1="120" x2="300" y2="120" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <line x1="50" y1="160" x2="300" y2="160" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Shaman -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="160" class="image" />
    <line x1="175" y1="160" x2="150" y2="190" class="image" />
    <line x1="175" y1="160" x2="200" y2="190" class="image" />
    <line x1="175" y1="140" x2="220" y2="130" class="image" />
    <!-- Staff -->
    <line x1="175" y1="100" x2="175" y2="50" class="image" />
    <circle cx="175" cy="45" r="5" class="image" />
  </g>
</svg>