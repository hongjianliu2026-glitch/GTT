<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disrupt</text>
  <text x="50" y="120" class="subtitle">[dɪsˈrʌpt] v. 打断，扰乱</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (分开) + rupt (断裂)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个演讲者正在演讲，突然"断裂(rupt)"
    <tspan x="50" dy="25">的声音"分开(dis)"了整个会场，</tspan>
    <tspan x="50" dy="25">打断了(disrupt)他的演讲。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The construction noise disrupted our meeting.
  </text>
  <text x="50" y="310" class="content">
    建筑噪音打断了我们的会议。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Speaker -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="90" y2="140" class="image" />
    <!-- Broken sound waves -->
    <line x1="120" y1="100" x2="200" y2="100" class="image" />
    <line x1="120" y1="120" x2="200" y2="120" class="image" />
    <line x1="120" y1="140" x2="200" y2="140" class="image" />
    <line x1="160" y1="100" x2="160" y2="140" class="image" stroke-dasharray="5,5" />
  </g>
</svg>