<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reverend</text>
  <text x="50" y="120" class="subtitle">[ˈrevərənd] n. 牧师，尊敬的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (回) + ver (敬畏) + end (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个牧师站在讲台上，他的话语让人"敬畏(ver)"，
    <tspan x="50" dy="25">人们听完后心中充满敬畏之情，仿佛回到了(re-)最初的敬畏状态。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The reverend delivered a powerful sermon.
  </text>
  <text x="50" y="310" class="content">
    牧师发表了一篇有力的布道。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Pulpit -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Reverend -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="160" y2="130" class="image" />
    <line x1="200" y1="140" x2="240" y2="130" class="image" />
    <!-- Book -->
    <rect x="180" y="70" width="40" height="20" class="image" />
    <!-- Awe -->
    <text x="250" y="150" class="content" style="font-size: 36px; fill: #E74C3C;">😮</text>
  </g>
</svg>