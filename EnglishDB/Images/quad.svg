<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">quad</text>
  <text x="50" y="120" class="subtitle">[kwɒd] n. 四边形，四轮车</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> quad- (四)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的四边形(quad)，它有四个角，
    <tspan x="50" dy="25">每个角都有一个轮子，就像一辆四轮车(quad)在草原上飞驰。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The quad bike is perfect for off-road adventures.
  </text>
  <text x="50" y="310" class="content">
    这辆四轮车非常适合越野冒险。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Quadrilateral -->
    <polygon points="0,0 150,0 150,150 0,150" class="image" />
    <!-- Wheels -->
    <circle cx="25" cy="25" r="15" class="image" />
    <circle cx="125" cy="25" r="15" class="image" />
    <circle cx="25" cy="125" r="15" class="image" />
    <circle cx="125" cy="125" r="15" class="image" />
  </g>
</svg>