<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">heir</text>
  <text x="50" y="120" class="subtitle">[ɛr] n. 继承人，后嗣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heir (继承)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的城堡，一位年轻的继承人(heir)
    <tspan x="50" dy="25">站在城堡前，准备接管家族的遗产。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is the heir to the throne.
  </text>
  <text x="50" y="310" class="content">
    他是王位的继承人。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Castle -->
    <rect x="0" y="0" width="200" height="150" class="image" />
    <rect x="50" y="50" width="100" height="100" class="image" />
    <line x1="100" y1="50" x2="100" y2="0" class="image" />
    <line x1="75" y1="25" x2="125" y2="25" class="image" />
    <line x1="50" y1="0" x2="150" y2="0" class="image" />
    <!-- Heir -->
    <circle cx="100" cy="170" r="15" class="image" />
    <line x1="100" y1="185" x2="100" y2="220" class="image" />
    <line x1="100" y1="220" x2="80" y2="250" class="image" />
    <line x1="100" y1="220" x2="120" y2="250" class="image" />
    <line x1="100" y1="200" x2="130" y2="190" class="image" />
  </g>
</svg>