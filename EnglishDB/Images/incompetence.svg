<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">incompetence</text>
  <text x="50" y="120" class="subtitle">[ɪnˈkɒmpɪtəns] n. 无能力，不胜任</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + com- (共同) + pet (追求) + -ence (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在追求目标时，"不共同追求(in-com-pet)"，
    <tspan x="50" dy="25">结果就是无能力(incompetence)，无法胜任任务。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His incompetence led to the project's failure.
  </text>
  <text x="50" y="310" class="content">
    他的无能导致了项目的失败。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person struggling -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <!-- Broken target -->
    <circle cx="200" cy="100" r="40" class="image" />
    <line x1="180" y1="80" x2="220" y2="120" class="image" />
    <line x1="180" y1="120" x2="220" y2="80" class="image" />
    <!-- Arrow missing -->
    <line x1="120" y1="100" x2="180" y2="100" class="image" />
    <polygon points="120,100 110,95 110,105" class="image" />
  </g>
</svg>