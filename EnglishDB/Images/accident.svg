<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">accident</text>
  <text x="50" y="120" class="subtitle">[ˈæksɪdənt] n. 事故，意外事件</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ac- (朝向) + cid (落下) + -ent (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一辆车"朝向(ac-)"突然"落下(cid)"，
    <tspan x="50" dy="25">撞上了另一辆车，这就是一个意外事故(accident)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident happened on the highway.
  </text>
  <text x="50" y="310" class="content">
    事故发生在高速公路上。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Road -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Car 1 -->
    <rect x="50" y="50" width="100" height="50" class="image" />
    <circle cx="70" cy="100" r="10" class="image" />
    <circle cx="130" cy="100" r="10" class="image" />
    <!-- Car 2 -->
    <rect x="200" y="50" width="100" height="50" class="image" />
    <circle cx="220" cy="100" r="10" class="image" />
    <circle cx="280" cy="100" r="10" class="image" />
    <!-- Collision -->
    <line x1="150" y1="50" x2="200" y2="100" class="image" />
    <line x1="150" y1="100" x2="200" y2="50" class="image" />
  </g>
</svg>