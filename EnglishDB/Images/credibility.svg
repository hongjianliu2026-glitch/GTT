<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">credibility</text>
  <text x="50" y="120" class="subtitle">[ˌkredɪˈbɪləti] n. 可信性，可靠性</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cred (相信) + -ibility (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个巨大的天平上，天平的一端是"相信(cred)"，
    <tspan x="50" dy="25">另一端是"怀疑"。当天平向"相信"倾斜时，这个人就拥有了可信性(credibility)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company's credibility was damaged by the scandal.
  </text>
  <text x="50" y="310" class="content">
    公司的可信性因丑闻而受损。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="50" x2="350" y2="50" class="image" />
    <line x1="200" y1="50" x2="200" y2="150" class="image" />
    <line x1="150" y1="150" x2="250" y2="150" class="image" />
    <line x1="150" y1="150" x2="150" y2="200" class="image" />
    <line x1="250" y1="150" x2="250" y2="200" class="image" />
    <!-- Person on the scale -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="150" x2="240" y2="140" class="image" />
    <!-- Trust and doubt -->
    <text x="100" y="80" class="content" fill="#27AE60">Trust</text>
    <text x="300" y="80" class="content" fill="#C0392B">Doubt</text>
  </g>
</svg>