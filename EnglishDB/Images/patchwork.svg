<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">patchwork</text>
  <text x="50" y="120" class="subtitle">[ˈpætʃwɜːrk] n. 拼凑物，拼布</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> patch (补丁) + work (工作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个老奶奶在缝纫机前，"拼凑(patch)"
    <tspan x="50" dy="25">各种布料，这些布料就构成了一个拼布(patchwork)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The quilt was a beautiful patchwork of different fabrics.
  </text>
  <text x="50" y="310" class="content">
    这床被子是由不同布料拼凑而成的美丽拼布。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Sewing machine -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Patchwork pieces -->
    <rect x="70" y="50" width="50" height="50" class="image" />
    <rect x="130" y="50" width="50" height="50" class="image" />
    <rect x="190" y="50" width="50" height="50" class="image" />
    <rect x="70" y="110" width="50" height="50" class="image" />
    <rect x="130" y="110" width="50" height="50" class="image" />
    <rect x="190" y="110" width="50" height="50" class="image" />
    <!-- Sewing needle -->
    <line x1="20" y1="100" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
  </g>
</svg>