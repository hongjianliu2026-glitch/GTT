<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">kiss</text>
  <text x="50" y="120" class="subtitle">[kɪs] n. 吻；v. 亲吻</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自中古英语 "kissen"，意为轻触或亲吻。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，轻轻地"触碰(kiss)"对方的嘴唇，
    <tspan x="50" dy="25">这个动作就是亲吻(kiss)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She gave him a sweet kiss on the cheek.
  </text>
  <text x="50" y="310" class="content">
    她在他脸颊上轻轻地吻了一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face 1 -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Face 2 -->
    <circle cx="250" cy="100" r="50" class="image" />
    <!-- Lips -->
    <path d="M140,120 Q150,110 160,120" class="image" />
    <path d="M200,120 Q210,110 220,120" class="image" />
    <!-- Kissing Lips -->
    <path d="M160,120 Q170,130 180,120" class="image" />
    <path d="M200,120 Q190,130 180,120" class="image" />
  </g>
</svg>