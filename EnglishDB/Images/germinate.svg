<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">germinate</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɜːrmɪneɪt] v. 发芽，萌芽</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> germ (种子) + inate (使动)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一颗种子在土壤中"使动(inate)"，
    <tspan x="50" dy="25">逐渐"发芽(germinate)"，长出嫩绿的芽苗。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The seeds germinated after a week of rain.
  </text>
  <text x="50" y="310" class="content">
    经过一周的雨水，种子发芽了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soil -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Seed -->
    <circle cx="175" cy="140" r="10" class="image" />
    <!-- Sprout -->
    <line x1="175" y1="140" x2="175" y2="100" class="image" />
    <line x1="175" y1="100" x2="160" y2="70" class="image" />
    <line x1="175" y1="100" x2="190" y2="70" class="image" />
    <line x1="175" y1="100" x2="175" y2="70" class="image" />
  </g>
</svg>