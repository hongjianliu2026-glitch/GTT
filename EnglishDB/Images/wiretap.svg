<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">wiretap</text>
  <text x="50" y="120" class="subtitle">[ˈwaɪərtæp] n. 窃听器；v. 窃听</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> wire (电线) + tap (轻敲)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个间谍在电话线上安装了一个"电线轻敲(wire-tap)"
    <tspan x="50" dy="25">装置，偷偷窃听对方的对话。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The police used a wiretap to catch the criminal.
  </text>
  <text x="50" y="310" class="content">
    警察使用窃听器来抓捕罪犯。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Telephone wire -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <!-- Tap device -->
    <rect x="150" y="-20" width="50" height="40" class="image" />
    <!-- Ear -->
    <circle cx="200" cy="50" r="20" class="image" />
    <!-- Spy -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
  </g>
</svg>