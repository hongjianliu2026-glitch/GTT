<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">up-to-date</text>
  <text x="50" y="120" class="subtitle">[ˌʌp tə ˈdeɪt] adj. 最新的，现代的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> up (向上) + to (到) + date (日期)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在日历前，"向上(up)到(to)最新的日期(date)"，
    <tspan x="50" dy="25">表示他总是保持最新状态(up-to-date)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She always keeps her knowledge up-to-date.
  </text>
  <text x="50" y="310" class="content">
    她总是保持知识最新。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Calendar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Dates -->
    <text x="70" y="50" class="content">1</text>
    <text x="120" y="50" class="content">2</text>
    <text x="170" y="50" class="content">3</text>
    <text x="220" y="50" class="content">4</text>
    <text x="270" y="50" class="content">5</text>
    <text x="70" y="80" class="content">6</text>
    <text x="120" y="80" class="content">7</text>
    <text x="170" y="80" class="content">8</text>
    <text x="220" y="80" class="content">9</text>
    <text x="270" y="80" class="content">10</text>
    <text x="70" y="110" class="content">11</text>
    <text x="120" y="110" class="content">12</text>
    <text x="170" y="110" class="content">13</text>
    <text x="220" y="110" class="content">14</text>
    <text x="270" y="110" class="content">15</text>
    <text x="70" y="140" class="content">16</text>
    <text x="120" y="140" class="content">17</text>
    <text x="170" y="140" class="content">18</text>
    <text x="220" y="140" class="content">19</text>
    <text x="270" y="140" class="content">20</text>
    <!-- Person pointing to the latest date -->
    <circle cx="20" cy="100" r="15" class="image" />
    <line x1="20" y1="115" x2="20" y2="150" class="image" />
    <line x1="20" y1="150" x2="0" y2="180" class="image" />
    <line x1="20" y1="150" x2="40" y2="180" class="image" />
    <line x1="20" y1="130" x2="50" y2="120" class="image" />
    <line x1="20" y1="130" x2="270" y2="130" class="image" />
  </g>
</svg>