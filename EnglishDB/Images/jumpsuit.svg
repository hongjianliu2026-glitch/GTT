<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jumpsuit</text>
  <text x="50" y="120" class="subtitle">[ˈdʒʌmpsuːt] n. 连身衣，工装裤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jump (跳跃) + suit (衣服)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着连身衣，"跳跃(jump)"
    <tspan x="50" dy="25">在空中，这件衣服就叫做连身衣(jumpsuit)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a stylish jumpsuit to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件时尚的连身衣去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Jumpsuit -->
    <rect x="50" y="50" width="200" height="300" class="image" />
    <!-- Arms -->
    <line x1="50" y1="100" x2="0" y2="150" class="image" />
    <line x1="250" y1="100" x2="300" y2="150" class="image" />
    <!-- Legs -->
    <line x1="100" y1="350" x2="100" y2="450" class="image" />
    <line x1="200" y1="350" x2="200" y2="450" class="image" />
    <!-- Jumping motion -->
    <line x1="150" y1="50" x2="150" y2="0" class="image" />
  </g>
</svg>