<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ravage</text>
  <text x="50" y="120" class="subtitle">[ˈrævɪdʒ] v. 毁坏，蹂躏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ravag (撕裂) + -e (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一场风暴过后，"撕裂(ravag)"
    <tspan x="50" dy="25">了整个村庄，留下一片废墟，这就是ravage的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The hurricane ravaged the coastal town.
  </text>
  <text x="50" y="310" class="content">
    飓风摧毁了沿海小镇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Torn village -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Torn house -->
    <rect x="50" y="20" width="100" height="80" class="image" />
    <line x1="50" y1="20" x2="150" y2="100" class="image" />
    <line x1="150" y1="20" x2="50" y2="100" class="image" />
    <!-- Torn tree -->
    <line x1="200" y1="20" x2="200" y2="100" class="image" />
    <line x1="180" y1="60" x2="220" y2="60" class="image" />
    <line x1="190" y1="40" x2="210" y2="80" class="image" />
    <!-- Torn ground -->
    <line x1="0" y1="120" x2="350" y2="120" class="image" />
    <line x1="0" y1="140" x2="350" y2="140" class="image" />
    <line x1="0" y1="160" x2="350" y2="160" class="image" />
  </g>
</svg>