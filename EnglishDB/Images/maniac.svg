<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">maniac</text>
  <text x="50" y="120" class="subtitle">[ˈmeɪniæk] n. 狂热者，疯子</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mani- (疯狂) + -ac (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个疯狂的人(mani-ac)在街头狂奔，
    <tspan x="50" dy="25">他的眼睛闪烁着疯狂的光芒，仿佛被某种狂热所驱使。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He is a maniac about collecting stamps.
  </text>
  <text x="50" y="310" class="content">
    他对集邮有着狂热的爱好。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Crazy person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="200" x2="20" y2="250" class="image" />
    <line x1="50" y1="200" x2="80" y2="250" class="image" />
    <line x1="50" y1="150" x2="100" y2="140" class="image" />
    <line x1="50" y1="150" x2="0" y2="140" class="image" />
    <!-- Crazy eyes -->
    <circle cx="35" cy="90" r="5" class="image" fill="#E74C3C" />
    <circle cx="65" cy="90" r="5" class="image" fill="#E74C3C" />
    <!-- Running path -->
    <line x1="50" y1="250" x2="300" y2="250" class="image" />
    <line x1="300" y1="250" x2="300" y2="300" class="image" />
    <line x1="300" y1="300" x2="250" y2="350" class="image" />
    <line x1="250" y1="350" x2="200" y2="300" class="image" />
    <line x1="200" y1="300" x2="150" y2="350" class="image" />
    <line x1="150" y1="350" x2="100" y2="300" class="image" />
    <line x1="100" y1="300" x2="50" y2="350" class="image" />
  </g>
</svg>