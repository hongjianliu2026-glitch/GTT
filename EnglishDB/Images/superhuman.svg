<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">superhuman</text>
  <text x="50" y="120" class="subtitle">[ˌsuːpərˈhjuːmən] adj. 超人的，非凡的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> super- (超过) + human (人类)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个普通人突然获得了超能力，"超过(super-)"
    <tspan x="50" dy="25">普通人类(human)的能力，变得非凡(superhuman)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His strength was superhuman; he lifted the car with ease.
  </text>
  <text x="50" y="310" class="content">
    他的力量非凡，轻松地抬起了汽车。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Human figure -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="30" y2="160" class="image" />
    <line x1="50" y1="140" x2="70" y2="160" class="image" />

    <!-- Superhuman figure -->
    <circle cx="200" cy="100" r="20" class="image" />
    <line x1="200" y1="120" x2="200" y2="180" class="image" />
    <line x1="200" y1="180" x2="180" y2="220" class="image" />
    <line x1="200" y1="180" x2="220" y2="220" class="image" />
    <line x1="200" y1="140" x2="180" y2="160" class="image" />
    <line x1="200" y1="140" x2="220" y2="160" class="image" />
    <line x1="200" y1="100" x2="200" y2="80" class="image" />
    <line x1="200" y1="80" x2="180" y2="60" class="image" />
    <line x1="200" y1="80" x2="220" y2="60" class="image" />

    <!-- Lightning bolt -->
    <polyline points="200,80 220,60 200,40 180,60 200,80" class="image" />
  </g>
</svg>