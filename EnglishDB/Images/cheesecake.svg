<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FFF8E1; }
      .title { font: bold 48px sans-serif; fill: #FFA000; }
      .subtitle { font: italic 24px serif; fill: #FF8F00; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .cake { fill: #FFD700; }
      .cheese { fill: #FFFACD; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cheesecake</text>
  <text x="50" y="120" class="subtitle">[ˈtʃiːzkeɪk] n. 芝士蛋糕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cheese (奶酪) + cake (蛋糕)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一块巨大的芝士蛋糕，上面铺满了金黄色的奶酪，
    <tspan x="50" dy="25">每一口都让人陶醉，这就是芝士蛋糕(cheesecake)的魅力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She baked a delicious cheesecake for the party.
  </text>
  <text x="50" y="310" class="content">
    她为派对烤了一个美味的芝士蛋糕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cake base -->
    <rect x="0" y="0" width="350" height="200" class="cake" />
    <!-- Cheese layer -->
    <rect x="20" y="20" width="310" height="160" class="cheese" />
    <!-- Decoration -->
    <circle cx="50" cy="100" r="10" class="cheese" />
    <circle cx="100" cy="120" r="10" class="cheese" />
    <circle cx="150" cy="80" r="10" class="cheese" />
    <circle cx="200" cy="110" r="10" class="cheese" />
    <circle cx="250" cy="90" r="10" class="cheese" />
    <circle cx="300" cy="130" r="10" class="cheese" />
  </g>
</svg>