<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .puppy { fill: #F1C40F; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">puppy</text>
  <text x="50" y="120" class="subtitle">[ˈpʌpi] n. 小狗</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pup (小) + -y (表示小的事物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小狗狗(pup)，它摇着尾巴，
    <tspan x="50" dy="25">用它那双大大的眼睛看着你，这就是"小狗(puppy)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The puppy wagged its tail happily.
  </text>
  <text x="50" y="310" class="content">
    小狗开心地摇着尾巴。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Puppy body -->
    <circle cx="100" cy="100" r="50" class="puppy" />
    <!-- Puppy head -->
    <circle cx="100" cy="50" r="30" class="puppy" />
    <!-- Puppy eyes -->
    <circle cx="85" cy="40" r="5" class="puppy" />
    <circle cx="115" cy="40" r="5" class="puppy" />
    <!-- Puppy nose -->
    <circle cx="100" cy="60" r="5" class="puppy" />
    <!-- Puppy ears -->
    <ellipse cx="75" cy="30" rx="10" ry="20" class="puppy" />
    <ellipse cx="125" cy="30" rx="10" ry="20" class="puppy" />
    <!-- Puppy tail -->
    <path d="M 150 100 Q 170 80 150 60" class="puppy" />
  </g>
</svg>