<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">stave</text>
  <text x="50" y="120" class="subtitle">[steɪv] n. 木条，五线谱；v. 击穿，避免</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> stav (木条)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个音乐家在演奏时，用木条(stav)
    <tspan x="50" dy="25">击穿(stave)空气，发出美妙的音符，这些音符就构成了五线谱(stave)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He used a stave to stave off the attack.
  </text>
  <text x="50" y="310" class="content">
    他用一根木条挡住了攻击。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Music stave -->
    <line x1="50" y1="20" x2="350" y2="20" class="image" />
    <line x1="50" y1="40" x2="350" y2="40" class="image" />
    <line x1="50" y1="60" x2="350" y2="60" class="image" />
    <line x1="50" y1="80" x2="350" y2="80" class="image" />
    <line x1="50" y1="100" x2="350" y2="100" class="image" />
    <!-- Music notes -->
    <circle cx="100" cy="30" r="10" class="image" />
    <circle cx="150" cy="50" r="10" class="image" />
    <circle cx="200" cy="70" r="10" class="image" />
    <circle cx="250" cy="90" r="10" class="image" />
    <!-- Wooden stave -->
    <rect x="50" y="150" width="250" height="20" class="image" />
    <!-- Musician -->
    <circle cx="20" cy="160" r="15" class="image" />
    <line x1="20" y1="175" x2="20" y2="210" class="image" />
    <line x1="20" y1="210" x2="0" y2="240" class="image" />
    <line x1="20" y1="210" x2="40" y2="240" class="image" />
    <line x1="20" y1="190" x2="50" y2="180" class="image" />
  </g>
</svg>