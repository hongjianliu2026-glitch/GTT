<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">slap</text>
  <text x="50" y="120" class="subtitle">[slæp] v. 拍击，掌击；n. 拍击声</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sl- (表示动作) + ap (表示接触)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只手快速"拍击(sl-ap)"在脸上，发出清脆的声响，这就是"slap"。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He gave her a playful slap on the back.
  </text>
  <text x="50" y="310" class="content">
    他开玩笑地在她背上拍了一下。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Hand -->
    <circle cx="100" cy="100" r="30" class="image" />
    <line x1="100" y1="130" x2="100" y2="200" class="image" />
    <line x1="100" y1="150" x2="70" y2="180" class="image" />
    <line x1="100" y1="150" x2="130" y2="180" class="image" />
    <line x1="100" y1="200" x2="70" y2="230" class="image" />
    <line x1="100" y1="200" x2="130" y2="230" class="image" />

    <!-- Face -->
    <circle cx="250" cy="100" r="50" class="image" />
    <circle cx="230" cy="80" r="10" class="image" />
    <circle cx="270" cy="80" r="10" class="image" />
    <line x1="240" y1="120" x2="260" y2="120" class="image" />

    <!-- Slap effect -->
    <line x1="100" y1="100" x2="250" y2="100" class="image" />
    <line x1="100" y1="100" x2="250" y2="110" class="image" />
    <line x1="100" y1="100" x2="250" y2="90" class="image" />
  </g>
</svg>