<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .bush { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bushy</text>
  <text x="50" y="120" class="subtitle">[ˈbʊʃi] adj. 浓密的，茂密的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bush (灌木) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小熊在森林里，周围是"浓密的(bushy)"
    <tspan x="50" dy="25">灌木丛，它几乎看不到外面的世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The dog's fur was so bushy that it looked like a small bear.
  </text>
  <text x="50" y="310" class="content">
    这只狗的毛如此浓密，看起来像一只小熊。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bushy bushes -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <circle cx="50" cy="100" r="40" class="bush" />
    <circle cx="120" cy="100" r="40" class="bush" />
    <circle cx="190" cy="100" r="40" class="bush" />
    <circle cx="260" cy="100" r="40" class="bush" />
    <circle cx="330" cy="100" r="40" class="bush" />
    <!-- Bear -->
    <circle cx="200" cy="150" r="30" class="image" />
    <line x1="200" y1="180" x2="200" y2="220" class="image" />
    <line x1="200" y1="220" x2="170" y2="250" class="image" />
    <line x1="200" y1="220" x2="230" y2="250" class="image" />
    <line x1="200" y1="200" x2="250" y2="190" class="image" />
  </g>
</svg>