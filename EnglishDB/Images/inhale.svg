<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inhale</text>
  <text x="50" y="120" class="subtitle">[ɪnˈheɪl] v. 吸入，吸气</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (进入) + hale (拉)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人张大嘴巴，"拉入(hale)"
    <tspan x="50" dy="25">空气进入肺部，这就是吸入(inhale)的过程。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She inhaled deeply before diving into the water.
  </text>
  <text x="50" y="310" class="content">
    她在跳入水中之前深吸了一口气。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Mouth -->
    <rect x="70" y="120" width="60" height="20" class="image" />
    <!-- Lungs -->
    <ellipse cx="200" cy="100" rx="40" ry="60" class="image" />
    <ellipse cx="250" cy="100" rx="40" ry="60" class="image" />
    <!-- Air flow -->
    <line x1="100" y1="140" x2="200" y2="140" class="image" />
    <line x1="100" y1="140" x2="250" y2="140" class="image" />
  </g>
</svg>