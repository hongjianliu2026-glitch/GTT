<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">typify</text>
  <text x="50" y="120" class="subtitle">[ˈtɪpɪfaɪ] v. 代表，象征</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> type (类型) + -ify (使成为)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的"类型(type)"标志，它"使成为(ify)"
    <tspan x="50" dy="25">某个事物的代表，象征着它的本质。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> This painting typifies the artist's early style.
  </text>
  <text x="50" y="310" class="content">
    这幅画代表了艺术家早期的风格。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Type symbol -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <text x="175" y="100" class="image" font-size="100" text-anchor="middle" fill="#7F8C8D">T</text>
    <!-- Arrow -->
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <polygon points="175,180 165,160 185,160" class="image" />
    <!-- Symbol -->
    <circle cx="175" cy="220" r="20" class="image" />
  </g>
</svg>