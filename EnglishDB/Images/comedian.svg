<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">comedian</text>
  <text x="50" y="120" class="subtitle">[kəˈmiːdiən] n. 喜剧演员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (共同) + edy (娱乐) + -ian (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个喜剧演员在舞台上，"共同娱乐(com-edy)"
    <tspan x="50" dy="25">观众，带来欢笑，这就是喜剧演员(comedian)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The comedian's jokes made the audience laugh.
  </text>
  <text x="50" y="310" class="content">
    喜剧演员的笑话让观众大笑。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Comedian -->
    <circle cx="175" cy="100" r="30" class="image" />
    <line x1="175" y1="130" x2="175" y2="180" class="image" />
    <line x1="175" y1="150" x2="145" y2="140" class="image" />
    <line x1="175" y1="150" x2="205" y2="140" class="image" />
    <line x1="175" y1="180" x2="145" y2="200" class="image" />
    <line x1="175" y1="180" x2="205" y2="200" class="image" />
    <!-- Audience -->
    <circle cx="75" cy="150" r="10" class="image" />
    <circle cx="100" cy="150" r="10" class="image" />
    <circle cx="125" cy="150" r="10" class="image" />
    <circle cx="225" cy="150" r="10" class="image" />
    <circle cx="250" cy="150" r="10" class="image" />
    <circle cx="275" cy="150" r="10" class="image" />
    <!-- Laughing mouths -->
    <path d="M70,160 Q85,170 100,160" class="image" />
    <path d="M95,160 Q110,170 125,160" class="image" />
    <path d="M120,160 Q135,170 150,160" class="image" />
    <path d="M220,160 Q235,170 250,160" class="image" />
    <path d="M245,160 Q260,170 275,160" class="image" />
    <path d="M270,160 Q285,170 300,160" class="image" />
  </g>
</svg>