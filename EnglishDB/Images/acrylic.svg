<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #333333; }
      .subtitle { font: italic 24px serif; fill: #666666; }
      .content { font: 18px sans-serif; fill: #444444; }
      .highlight { font-weight: bold; fill: #FF6347; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">acrylic</text>
  <text x="50" y="120" class="subtitle">[əˈkrɪlɪk] n. 丙烯酸；adj. 丙烯酸的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> acr (尖锐) + yl (化学后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个艺术家用"尖锐(acr)"的画笔在画布上涂抹"丙烯酸(yl)"颜料，
    <tspan x="50" dy="25">创造出色彩鲜艳的作品。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She painted the portrait with acrylic paints.
  </text>
  <text x="50" y="310" class="content">
    她用丙烯酸颜料画了这幅肖像。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Canvas -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Paintbrush -->
    <line x1="50" y1="20" x2="150" y2="180" class="image" />
    <line x1="50" y1="20" x2="70" y2="20" class="image" />
    <line x1="70" y1="20" x2="70" y2="40" class="image" />
    <!-- Acrylic paint -->
    <circle cx="250" cy="100" r="30" fill="#FF6347" />
    <circle cx="280" cy="130" r="25" fill="#FFD700" />
    <circle cx="220" cy="150" r="20" fill="#00BFFF" />
  </g>
</svg>