<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">vegetable</text>
  <text x="50" y="120" class="subtitle">[ˈvɛdʒtəbl] n. 蔬菜</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> veget (生长) + -able (可...的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片田野，"生长(veget)"着各种"可食用的(able)"植物，
    <tspan x="50" dy="25">这些植物就是蔬菜(vegetable)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She loves to eat a variety of vegetables.
  </text>
  <text x="50" y="310" class="content">
    她喜欢吃各种各样的蔬菜。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Field -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Vegetables -->
    <circle cx="50" cy="100" r="20" class="image" /> <!-- Tomato -->
    <rect x="100" y="80" width="30" height="40" class="image" /> <!-- Carrot -->
    <rect x="150" y="90" width="20" height="30" class="image" /> <!-- Cucumber -->
    <rect x="200" y="85" width="25" height="35" class="image" /> <!-- Bell pepper -->
    <rect x="250" y="95" width="20" height="25" class="image" /> <!-- Broccoli -->
  </g>
</svg>