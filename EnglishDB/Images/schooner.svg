<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">schooner</text>
  <text x="50" y="120" class="subtitle">[ˈskuːnər] n. 纵帆船</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> schoon (美丽的) + er (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一艘美丽的纵帆船(schooner)在海上航行，
    <tspan x="50" dy="25">它的帆如同展开的翅膀，优雅而迅速地穿梭在波涛之间。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The schooner sailed gracefully across the ocean.
  </text>
  <text x="50" y="310" class="content">
    那艘纵帆船优雅地穿越了海洋。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Boat body -->
    <rect x="50" y="50" width="200" height="100" class="image" />
    <!-- Mast -->
    <line x1="150" y1="50" x2="150" y2="0" class="image" />
    <!-- Sails -->
    <polygon points="150,0 100,50 200,50" class="image" />
    <polygon points="150,20 100,70 200,70" class="image" />
    <!-- Waves -->
    <path d="M50,150 Q100,100 150,150 T250,150" class="image" />
    <path d="M50,170 Q100,120 150,170 T250,170" class="image" />
  </g>
</svg>