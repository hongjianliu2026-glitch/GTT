<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">hermit</text>
  <text x="50" y="120" class="subtitle">[ˈhɜːrmɪt] n. 隐士，隐居者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> herm (隐居) + -it (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个隐士(hermit)，他选择"隐居(herm)"在深山老林中，
    <tspan x="50" dy="25">远离尘嚣，独自生活。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old man lived like a hermit in the mountains.
  </text>
  <text x="50" y="310" class="content">
    那位老人像隐士一样住在山里。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mountain -->
    <path d="M0,200 L100,0 L200,200 Z" class="image" />
    <!-- Hermit -->
    <circle cx="100" cy="150" r="15" class="image" />
    <line x1="100" y1="165" x2="100" y2="190" class="image" />
    <line x1="100" y1="190" x2="85" y2="210" class="image" />
    <line x1="100" y1="190" x2="115" y2="210" class="image" />
    <line x1="100" y1="175" x2="120" y2="165" class="image" />
    <!-- Hut -->
    <rect x="80" y="200" width="40" height="30" class="image" />
    <line x1="80" y1="215" x2="120" y2="215" class="image" />
  </g>
</svg>