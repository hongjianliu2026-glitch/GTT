<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">body</text>
  <text x="50" y="120" class="subtitle">[ˈbɒdi] n. 身体，主体</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bod (身体)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的身体(body)，它的主体(body)部分占据了整个画面，
    <tspan x="50" dy="25">它的四肢伸展得非常夸张，仿佛要撑破整个世界。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She exercises regularly to keep her body fit.
  </text>
  <text x="50" y="310" class="content">
    她定期锻炼以保持身体健康。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Body outline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Head -->
    <circle cx="175" cy="50" r="40" class="image" />
    <!-- Torso -->
    <rect x="135" y="90" width="80" height="100" class="image" />
    <!-- Arms -->
    <line x1="135" y1="110" x2="50" y2="150" class="image" />
    <line x1="215" y1="110" x2="290" y2="150" class="image" />
    <!-- Legs -->
    <line x1="155" y1="190" x2="100" y2="280" class="image" />
    <line x1="195" y1="190" x2="250" y2="280" class="image" />
  </g>
</svg>