<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">mound</text>
  <text x="50" y="120" class="subtitle">[maʊnd] n. 土堆，小丘</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mund (世界) + -e (表示小)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个小小的"世界(mund)"，就像一个小土堆(mound)，
    <tspan x="50" dy="25">它虽然小，但充满了无限的可能。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The archaeologists found ancient artifacts on the mound.
  </text>
  <text x="50" y="310" class="content">
    考古学家在小丘上发现了古代文物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Mound -->
    <ellipse cx="175" cy="100" rx="150" ry="70" class="image" />
    <!-- Small world -->
    <circle cx="175" cy="100" r="50" class="image" />
    <!-- Sun -->
    <circle cx="250" cy="50" r="20" class="image" />
    <!-- Tree -->
    <line x1="100" y1="150" x2="100" y2="100" class="image" />
    <ellipse cx="100" cy="90" rx="30" ry="10" class="image" />
  </g>
</svg>