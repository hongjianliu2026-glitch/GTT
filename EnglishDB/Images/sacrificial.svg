<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sacrificial</text>
  <text x="50" y="120" class="subtitle">[ˌsækrəˈfɪʃl] adj. 牺牲的，献祭的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sacr- (神圣) + -ific (产生)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神圣的仪式，"神圣地产生(sacr-ific)"
    <tspan x="50" dy="25">牺牲，为了更大的利益而奉献。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sacrificial lamb was offered to the gods.
  </text>
  <text x="50" y="310" class="content">
    这只牺牲的羔羊被献给了神灵。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Altar -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Lamb -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Blood drop -->
    <circle cx="100" cy="100" r="10" class="image" fill="#C0392B" />
    <!-- Fire -->
    <line x1="150" y1="50" x2="150" y2="150" class="image" />
    <line x1="140" y1="60" x2="160" y2="60" class="image" />
    <line x1="130" y1="70" x2="170" y2="70" class="image" />
    <line x1="120" y1="80" x2="180" y2="80" class="image" />
    <!-- Priest -->
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="250" y1="120" x2="250" y2="160" class="image" />
    <line x1="250" y1="160" x2="230" y2="190" class="image" />
    <line x1="250" y1="160" x2="270" y2="190" class="image" />
    <line x1="250" y1="140" x2="280" y2="130" class="image" />
  </g>
</svg>