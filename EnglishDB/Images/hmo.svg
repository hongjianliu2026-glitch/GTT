<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">HMO</text>
  <text x="50" y="120" class="subtitle">[eɪtʃ em əʊ] n. 健康维护组织</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Health Maintenance Organization
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的医疗中心，"健康维护组织(HMO)"
    <tspan x="50" dy="25">像一座城堡，守护着人们的健康。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She is a member of an HMO for her healthcare needs.
  </text>
  <text x="50" y="310" class="content">
    她是健康维护组织的一员，用于满足她的医疗需求。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Medical center -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Building -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Cross symbol -->
    <line x1="150" y1="50" x2="150" y2="90" class="image" />
    <line x1="130" y1="70" x2="170" y2="70" class="image" />
    <!-- People -->
    <circle cx="80" cy="120" r="10" class="image" />
    <line x1="80" y1="130" x2="80" y2="150" class="image" />
    <line x1="80" y1="150" x2="70" y2="170" class="image" />
    <line x1="80" y1="150" x2="90" y2="170" class="image" />
    <line x1="80" y1="140" x2="100" y2="130" class="image" />
    <circle cx="220" cy="120" r="10" class="image" />
    <line x1="220" y1="130" x2="220" y2="150" class="image" />
    <line x1="220" y1="150" x2="210" y2="170" class="image" />
    <line x1="220" y1="150" x2="230" y2="170" class="image" />
    <line x1="220" y1="140" x2="240" y2="130" class="image" />
  </g>
</svg>