<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sensing</text>
  <text x="50" y="120" class="subtitle">[ˈsɛnsɪŋ] n. 感知，感觉</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sens (感觉) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个机器人，它的大脑里有一个"感觉(sens)"的装置，
    <tspan x="50" dy="25">这个装置让它能够"感知(sensing)"周围的环境。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The robot's sensing system detected an obstacle.
  </text>
  <text x="50" y="310" class="content">
    机器人的感知系统检测到了一个障碍物。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Robot head -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Sensor -->
    <rect x="70" y="50" width="60" height="20" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="90" r="10" class="image" />
    <circle cx="120" cy="90" r="10" class="image" />
    <!-- Antenna -->
    <line x1="100" y1="50" x2="100" y2="20" class="image" />
    <!-- Body -->
    <rect x="50" y="150" width="100" height="100" class="image" />
    <!-- Legs -->
    <line x1="70" y1="250" x2="70" y2="300" class="image" />
    <line x1="130" y1="250" x2="130" y2="300" class="image" />
  </g>
</svg>