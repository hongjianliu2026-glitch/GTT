<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">scar</text>
  <text x="50" y="120" class="subtitle">[skɑːr] n. 伤疤，疤痕；v. 留下伤痕</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> scar (来自古英语 "scær"，意为"切口")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在战斗中被"切开(scar)"，留下了一个永久的伤疤。
    <tspan x="50" dy="25">这个伤疤不仅记录了战斗的痕迹，也成为了他勇气的象征。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The accident left a deep scar on his face.
  </text>
  <text x="50" y="310" class="content">
    那次事故在他的脸上留下了一道深深的疤痕。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="80" class="image" />
    <!-- Scar -->
    <line x1="40" y1="100" x2="160" y2="100" class="image" />
    <line x1="40" y1="100" x2="50" y2="90" class="image" />
    <line x1="40" y1="100" x2="50" y2="110" class="image" />
    <line x1="160" y1="100" x2="150" y2="90" class="image" />
    <line x1="160" y1="100" x2="150" y2="110" class="image" />
  </g>
</svg>