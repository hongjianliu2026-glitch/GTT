<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">soda</text>
  <text x="50" y="120" class="subtitle">[ˈsoʊdə] n. 苏打水，汽水</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> soda (源自阿拉伯语 "suda"，意为 "碱")
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个炎热的夏日，你打开一瓶苏打水，"嘶嘶"声中冒出无数气泡，
    <tspan x="50" dy="25">清凉的液体瞬间让你感到无比舒爽。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She prefers soda over plain water.
  </text>
  <text x="50" y="310" class="content">
    她更喜欢苏打水而不是普通水。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Soda bottle -->
    <rect x="0" y="0" width="100" height="200" class="image" />
    <circle cx="50" cy="220" r="30" class="image" />
    <!-- Bubbles -->
    <circle cx="30" cy="150" r="10" class="image" />
    <circle cx="70" cy="130" r="10" class="image" />
    <circle cx="40" cy="100" r="10" class="image" />
    <circle cx="60" cy="80" r="10" class="image" />
    <circle cx="50" cy="50" r="10" class="image" />
  </g>
</svg>