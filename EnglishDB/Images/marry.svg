<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">marry</text>
  <text x="50" y="120" class="subtitle">[ˈmæri] v. 结婚，嫁，娶</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> mar (海) + -ry (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一对新人在海边举行婚礼，"海(mar)"
    <tspan x="50" dy="25">象征着永恒，他们在这里结为夫妻(marry)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> They decided to marry next summer.
  </text>
  <text x="50" y="310" class="content">
    他们决定明年夏天结婚。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sea -->
    <rect x="0" y="0" width="350" height="200" class="image" fill="#3498DB" />
    <!-- Bride and Groom -->
    <circle cx="100" cy="100" r="20" class="image" fill="#F1C40F" />
    <circle cx="250" cy="100" r="20" class="image" fill="#F1C40F" />
    <line x1="100" y1="120" x2="250" y2="120" class="image" />
    <!-- Wedding rings -->
    <circle cx="100" cy="100" r="10" class="image" fill="#E74C3C" />
    <circle cx="250" cy="100" r="10" class="image" fill="#E74C3C" />
  </g>
</svg>