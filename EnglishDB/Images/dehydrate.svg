<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dehydrate</text>
  <text x="50" y="120" class="subtitle">[diːˈhaɪdreɪt] v. 脱水，使干燥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> de- (去掉) + hydr (水) + -ate (动词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的太阳，"去掉(de-)"
    <tspan x="50" dy="25">水果中的"水(hydr)"，使其变得干燥(dehydrate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heat dehydrated the grapes, making them raisins.
  </text>
  <text x="50" y="310" class="content">
    高温使葡萄脱水，变成了葡萄干。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" class="image" fill="#F1C40F" />
    <!-- Grapes -->
    <circle cx="200" cy="100" r="20" class="image" fill="#8E44AD" />
    <circle cx="230" cy="100" r="20" class="image" fill="#8E44AD" />
    <circle cx="260" cy="100" r="20" class="image" fill="#8E44AD" />
    <!-- Raisins -->
    <circle cx="200" cy="150" r="10" class="image" fill="#8E44AD" />
    <circle cx="230" cy="150" r="10" class="image" fill="#8E44AD" />
    <circle cx="260" cy="150" r="10" class="image" fill="#8E44AD" />
    <!-- Arrows -->
    <line x1="210" y1="120" x2="210" y2="140" class="image" />
    <line x1="240" y1="120" x2="240" y2="140" class="image" />
    <line x1="270" y1="120" x2="270" y2="140" class="image" />
  </g>
</svg>