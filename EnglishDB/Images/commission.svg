<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">commission</text>
  <text x="50" y="120" class="subtitle">[kəˈmɪʃn] n. 委员会；佣金；委托；v. 委托</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + miss (发送) + -ion (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一群人"一起发送(com-miss)"他们的意见和建议，
    <tspan x="50" dy="25">这些意见和建议就构成了一个委员会(commission)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The commission was tasked with investigating the incident.
  </text>
  <text x="50" y="310" class="content">
    委员会的任务是调查这一事件。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Group of people -->
    <circle cx="50" cy="50" r="20" class="image" />
    <circle cx="100" cy="50" r="20" class="image" />
    <circle cx="150" cy="50" r="20" class="image" />
    <circle cx="200" cy="50" r="20" class="image" />
    <!-- Arrows representing communication -->
    <line x1="50" y1="70" x2="100" y2="70" class="image" />
    <line x1="100" y1="70" x2="150" y2="70" class="image" />
    <line x1="150" y1="70" x2="200" y2="70" class="image" />
    <line x1="200" y1="70" x2="50" y2="70" class="image" />
    <!-- Speech bubbles -->
    <rect x="30" y="90" width="40" height="20" class="image" />
    <rect x="80" y="90" width="40" height="20" class="image" />
    <rect x="130" y="90" width="40" height="20" class="image" />
    <rect x="180" y="90" width="40" height="20" class="image" />
  </g>
</svg>