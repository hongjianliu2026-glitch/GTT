<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">English</text>
  <text x="50" y="120" class="subtitle">[ˈɪŋɡlɪʃ] n. 英语</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> Engl- (来自“Angle”，盎格鲁人) + -ish (表示“属于...的”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的字母“E”，它像一座山一样高耸入云，
    <tspan x="50" dy="25">山顶上有一个小屋，里面住着一群盎格鲁人，他们用</tspan>
    <tspan x="50" dy="25">这种语言交流，这就是英语(English)的起源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She speaks fluent English.
  </text>
  <text x="50" y="310" class="content">
    她英语说得很流利。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Large letter "E" -->
    <path d="M0 0 L0 200 L100 200 L100 150 L50 150 L50 100 L100 100 L100 50 L0 50 Z" class="image" />
    <!-- Small house on top -->
    <rect x="30" y="20" width="40" height="30" class="image" />
    <line x1="30" y1="50" x2="70" y2="50" class="image" />
    <line x1="50" y1="50" x2="50" y2="20" class="image" />
  </g>
</svg>