<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">cholesterol</text>
  <text x="50" y="120" class="subtitle">[kəˈlestərɒl] n. 胆固醇</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> chole- (胆汁) + ster- (固体) + -ol (化学名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个胆汁(chole-)变成固体(ster-)的化学物质(-ol)，
    <tspan x="50" dy="25">这个物质就是胆固醇(cholesterol)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> High cholesterol levels can lead to heart disease.
  </text>
  <text x="50" y="310" class="content">
    高胆固醇水平可能导致心脏病。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cholesterol molecule -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="150" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="90" y2="100" class="image" />
    <line x1="120" y1="100" x2="140" y2="100" class="image" />
    <line x1="50" y1="80" x2="100" y2="80" class="image" />
    <line x1="100" y1="80" x2="150" y2="80" class="image" />
    <line x1="50" y1="120" x2="100" y2="120" class="image" />
    <line x1="100" y1="120" x2="150" y2="120" class="image" />
    <!-- Solidified bile -->
    <rect x="200" y="80" width="100" height="40" class="image" />
    <text x="210" y="110" class="content">固体胆汁</text>
  </g>
</svg>