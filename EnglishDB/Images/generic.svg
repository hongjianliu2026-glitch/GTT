<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">generic</text>
  <text x="50" y="120" class="subtitle">[dʒəˈnerɪk] adj. 通用的，一般的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gen- (产生) + -eric (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的工厂，"产生(gen-)"
    <tspan x="50" dy="25">出各种通用的产品，这些产品就是"一般的(generic)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The store sells generic brands of cereal.
  </text>
  <text x="50" y="310" class="content">
    这家商店出售一般品牌的麦片。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Factory -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chimney -->
    <rect x="150" y="20" width="50" height="100" class="image" />
    <!-- Smoke -->
    <ellipse cx="175" cy="10" rx="30" ry="10" class="image" />
    <!-- Products -->
    <rect x="50" y="120" width="50" height="50" class="image" />
    <rect x="150" y="120" width="50" height="50" class="image" />
    <rect x="250" y="120" width="50" height="50" class="image" />
  </g>
</svg>