<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">impotent</text>
  <text x="50" y="120" class="subtitle">[ˈɪmpətnt] adj. 无力的，无效的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + potent (强有力的)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个原本强壮的人突然变得"无力(in-potent)"，
    <tspan x="50" dy="25">就像一个巨大的力量被抽空，变得虚弱无力。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The impotent protest was ignored by the authorities.
  </text>
  <text x="50" y="310" class="content">
    这场无力的抗议被当局忽视了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Weak person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="150" x2="20" y2="140" class="image" />
    <line x1="50" y1="150" x2="80" y2="140" class="image" />
    <!-- Exhausted expression -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <line x1="45" y1="110" x2="55" y2="110" class="image" />
  </g>
</svg>