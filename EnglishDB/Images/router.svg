<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">router</text>
  <text x="50" y="120" class="subtitle">[ˈraʊtər] n. 路由器</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> route (路线) + -er (表示工具)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个神奇的"路线工具(router)"，它能够将网络信号
    <tspan x="50" dy="25">按照最佳路径"路由"到目的地，就像一个聪明的导航员。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The router is essential for connecting multiple devices to the internet.
  </text>
  <text x="50" y="310" class="content">
    路由器对于将多个设备连接到互联网至关重要。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Router box -->
    <rect x="0" y="0" width="200" height="100" class="image" />
    <!-- Antennas -->
    <line x1="50" y1="0" x2="50" y2="-50" class="image" />
    <line x1="150" y1="0" x2="150" y2="-50" class="image" />
    <!-- Lights -->
    <circle cx="70" cy="30" r="10" class="image" fill="#3498DB" />
    <circle cx="130" cy="30" r="10" class="image" fill="#E74C3C" />
    <!-- Wires -->
    <line x1="100" y1="100" x2="100" y2="150" class="image" />
    <line x1="100" y1="150" x2="50" y2="200" class="image" />
    <line x1="100" y1="150" x2="150" y2="200" class="image" />
  </g>
</svg>