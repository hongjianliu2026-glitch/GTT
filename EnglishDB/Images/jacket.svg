<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">jacket</text>
  <text x="50" y="120" class="subtitle">[ˈdʒækɪt] n. 夹克，短上衣</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> jack (源自法语 jaquette，意为“短上衣”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个时尚达人穿着一件酷炫的夹克(jacket)，
    <tspan x="50" dy="25">这件夹克不仅保暖，还能让他成为街头的焦点。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She wore a leather jacket to the party.
  </text>
  <text x="50" y="310" class="content">
    她穿着一件皮夹克去参加派对。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Jacket outline -->
    <rect x="50" y="20" width="200" height="150" class="image" />
    <!-- Sleeves -->
    <rect x="30" y="70" width="20" height="100" class="image" />
    <rect x="250" y="70" width="20" height="100" class="image" />
    <!-- Collar -->
    <polygon points="100,20 150,20 125,0" class="image" />
    <!-- Buttons -->
    <circle cx="100" cy="100" r="5" class="image" />
    <circle cx="125" cy="100" r="5" class="image" />
    <circle cx="150" cy="100" r="5" class="image" />
    <circle cx="175" cy="100" r="5" class="image" />
  </g>
</svg>