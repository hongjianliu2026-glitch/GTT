<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">salesman</text>
  <text x="50" y="120" class="subtitle">[ˈseɪlzmən] n. 售货员，推销员</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sale (卖) + man (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个穿着西装的推销员，手里拿着一堆商品，
    <tspan x="50" dy="25">热情地向顾客推销，"卖(sale)东西的人(man)"就是售货员(salesman)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The salesman convinced me to buy the latest model.
  </text>
  <text x="50" y="310" class="content">
    推销员说服我买了最新款。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Suit -->
    <rect x="0" y="0" width="100" height="150" class="image" />
    <rect x="10" y="10" width="80" height="130" class="image" />
    <!-- Tie -->
    <line x1="45" y1="10" x2="45" y2="30" class="image" />
    <!-- Hand with products -->
    <line x1="50" y1="150" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="200" class="image" />
    <line x1="50" y1="180" x2="70" y2="200" class="image" />
    <rect x="30" y="200" width="40" height="20" class="image" />
    <rect x="35" y="205" width="30" height="10" class="image" />
  </g>
</svg>