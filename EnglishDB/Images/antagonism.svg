<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">antagonism</text>
  <text x="50" y="120" class="subtitle">[ænˈtæɡəˌnɪzəm] n. 对抗，敌对</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (对抗) + agon (斗争)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人面对面，"对抗(anti-)"着彼此，
    <tspan x="50" dy="25">他们的眼神中充满了"斗争(agon)"的火花，这就是敌对(antagonism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The antagonism between the two teams was evident in their heated debate.
  </text>
  <text x="50" y="310" class="content">
    两队之间的敌对在他们的激烈辩论中显而易见。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Two people facing each other -->
    <circle cx="50" cy="100" r="20" class="image" />
    <circle cx="250" cy="100" r="20" class="image" />
    <line x1="70" y1="100" x2="230" y2="100" class="image" />
    <line x1="70" y1="100" x2="70" y2="150" class="image" />
    <line x1="230" y1="100" x2="230" y2="150" class="image" />
    <line x1="70" y1="150" x2="50" y2="180" class="image" />
    <line x1="70" y1="150" x2="90" y2="180" class="image" />
    <line x1="230" y1="150" x2="210" y2="180" class="image" />
    <line x1="230" y1="150" x2="250" y2="180" class="image" />
    <!-- Eye sparks -->
    <line x1="60" y1="90" x2="240" y2="90" class="image" />
    <line x1="60" y1="90" x2="60" y2="80" class="image" />
    <line x1="240" y1="90" x2="240" y2="80" class="image" />
  </g>
</svg>