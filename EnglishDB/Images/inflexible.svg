<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">inflexible</text>
  <text x="50" y="120" class="subtitle">[ɪnˈfleksəbl] adj. 不灵活的，僵硬的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> in- (不) + flex (弯曲) + -ible (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一根"不能弯曲(in-flex-ible)"的铁棒，
    <tspan x="50" dy="25">它僵硬得连最轻微的弯曲都无法承受。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> His inflexible attitude made negotiation impossible.
  </text>
  <text x="50" y="310" class="content">
    他僵硬的态度使得谈判无法进行。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Iron bar -->
    <rect x="0" y="0" width="350" height="50" class="image" />
    <!-- Arrow showing inflexibility -->
    <line x1="50" y1="60" x2="300" y2="60" class="image" />
    <polygon points="300,60 280,50 280,70" class="image" />
    <text x="150" y="90" class="content" text-anchor="middle">无法弯曲</text>
  </g>
</svg>