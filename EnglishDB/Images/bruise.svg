<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #8E44AD; }
      .content { font: 18px sans-serif; fill: #2C3E50; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bruise</text>
  <text x="50" y="120" class="subtitle">[bruːz] n. 瘀伤，擦伤；v. 使受瘀伤</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bruis (打击)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"打击(bruis)"后，皮肤上出现了一块
    <tspan x="50" dy="25">紫色的瘀伤(bruise)，看起来非常明显。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She got a bruise on her knee from falling down.
  </text>
  <text x="50" y="310" class="content">
    她摔倒后膝盖上出现了一块瘀伤。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />

    <!-- Bruise -->
    <circle cx="50" cy="180" r="20" class="image" fill="#800000" />
    <text x="40" y="185" class="content" fill="#FFFFFF">bruise</text>
  </g>
</svg>