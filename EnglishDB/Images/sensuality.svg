<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FCE4EC; }
      .title { font: bold 48px sans-serif; fill: #C2185B; }
      .subtitle { font: italic 24px serif; fill: #880E4F; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E91E63; }
      .story { font: 16px serif; fill: #AD1457; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sensuality</text>
  <text x="50" y="120" class="subtitle">[ˌsɛnʃuˈæləti] n. 感官享受，肉欲</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sens (感觉) + -ual (形容词后缀) + -ity (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满感官享受的场景，"感觉(sens)"
    <tspan x="50" dy="25">被放大到极致，每一寸肌肤都在享受(sensuality)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The sensuality of the massage made her feel completely relaxed.
  </text>
  <text x="50" y="310" class="content">
    按摩的感官享受让她感到完全放松。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sensual scene -->
    <circle cx="100" cy="100" r="80" class="image" />
    <circle cx="100" cy="100" r="70" class="image" />
    <circle cx="100" cy="100" r="60" class="image" />
    <circle cx="100" cy="100" r="50" class="image" />
    <circle cx="100" cy="100" r="40" class="image" />
    <circle cx="100" cy="100" r="30" class="image" />
    <circle cx="100" cy="100" r="20" class="image" />
    <circle cx="100" cy="100" r="10" class="image" />
    <!-- Sensual touch -->
    <line x1="20" y1="100" x2="180" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="50" y1="50" x2="150" y2="150" class="image" />
    <line x1="50" y1="150" x2="150" y2="50" class="image" />
  </g>
</svg>