<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">succulent</text>
  <text x="50" y="120" class="subtitle">[ˈsʌkjələnt] adj. 多汁的，多水分的；n. 肉质植物</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> suc- (在下面) + -ulent (充满)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个水果，"在下面(suc-)"
    <tspan x="50" dy="25">充满了水分(ulent)，一口咬下去汁水四溢，</tspan>
    <tspan x="50" dy="25">这就是多汁的(succulent)水果。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The succulent watermelon was refreshing on a hot day.
  </text>
  <text x="50" y="310" class="content">
    在炎热的天气里，多汁的西瓜让人感到清爽。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Watermelon -->
    <ellipse cx="175" cy="100" rx="150" ry="80" class="image" />
    <!-- Juice dripping -->
    <line x1="175" y1="180" x2="175" y2="250" class="image" />
    <line x1="175" y1="250" x2="150" y2="300" class="image" />
    <line x1="175" y1="250" x2="200" y2="300" class="image" />
    <!-- Slice of watermelon -->
    <path d="M50,100 L250,100 L200,150 L100,150 Z" class="image" />
    <!-- Droplets -->
    <circle cx="150" cy="300" r="10" class="image" />
    <circle cx="200" cy="300" r="10" class="image" />
  </g>
</svg>