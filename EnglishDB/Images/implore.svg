<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">implore</text>
  <text x="50" y="120" class="subtitle">[ɪmˈplɔːr] v. 恳求，哀求</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> im- (向内) + plor (哭泣)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人"向内哭泣(im-plor)"，
    <tspan x="50" dy="25">他的眼泪和哀求声交织在一起，</tspan>
    <tspan x="50" dy="25">形成了一幅恳求的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She implored him to stay, but he left anyway.
  </text>
  <text x="50" y="310" class="content">
    她恳求他留下，但他还是离开了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person -->
    <circle cx="50" cy="100" r="30" class="image" />
    <line x1="50" y1="130" x2="50" y2="200" class="image" />
    <line x1="50" y1="160" x2="20" y2="140" class="image" />
    <line x1="50" y1="160" x2="80" y2="140" class="image" />
    <line x1="50" y1="200" x2="20" y2="240" class="image" />
    <line x1="50" y1="200" x2="80" y2="240" class="image" />
    <!-- Tears -->
    <circle cx="40" cy="90" r="5" class="image" />
    <circle cx="60" cy="90" r="5" class="image" />
    <line x1="40" y1="90" x2="20" y2="70" class="image" />
    <line x1="60" y1="90" x2="80" y2="70" class="image" />
    <!-- Hands -->
    <line x1="50" y1="130" x2="20" y2="110" class="image" />
    <line x1="50" y1="130" x2="80" y2="110" class="image" />
  </g>
</svg>