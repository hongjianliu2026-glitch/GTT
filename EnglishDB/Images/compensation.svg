<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">compensation</text>
  <text x="50" y="120" class="subtitle">[ˌkɒmpenˈseɪʃn] n. 补偿，赔偿</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> com- (一起) + pens (衡量) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在用天平"一起衡量(com-pens)"
    <tspan x="50" dy="25">损失和赔偿，确保两者平衡，这就是补偿(compensation)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company offered him a generous compensation for his injury.
  </text>
  <text x="50" y="310" class="content">
    公司为他提供了丰厚的赔偿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Balance scale -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="20" y1="50" x2="80" y2="50" class="image" />
    <line x1="20" y1="150" x2="80" y2="150" class="image" />
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <!-- Weights -->
    <circle cx="30" cy="100" r="15" class="image" />
    <circle cx="70" cy="100" r="15" class="image" />
    <!-- Loss and compensation -->
    <rect x="100" y="20" width="100" height="160" class="image" />
    <rect x="220" y="20" width="100" height="160" class="image" />
    <text x="120" y="110" class="content" fill="#E74C3C">Loss</text>
    <text x="240" y="110" class="content" fill="#27AE60">Compensation</text>
  </g>
</svg>