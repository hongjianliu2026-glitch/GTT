<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">applicable</text>
  <text x="50" y="120" class="subtitle">[ˈæplɪkəbl] adj. 可适用的，可应用的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (向) + plic (折叠) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的折纸艺术，"向(ap-)"折叠(plic)
    <tspan x="50" dy="25">成各种形状，这些形状都能"适用(applicable)"于不同的场合。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The rule is applicable to all cases.
  </text>
  <text x="50" y="310" class="content">
    这条规则适用于所有情况。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Folded paper -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="100" height="160" class="image" />
    <rect x="170" y="20" width="100" height="160" class="image" />
    <rect x="290" y="20" width="50" height="160" class="image" />
    <!-- Fold lines -->
    <line x1="50" y1="20" x2="50" y2="180" class="image" />
    <line x1="170" y1="20" x2="170" y2="180" class="image" />
    <line x1="290" y1="20" x2="290" y2="180" class="image" />
    <!-- Arrow -->
    <line x1="30" y1="100" x2="450" y2="100" class="image" />
    <polygon points="450,100 440,90 440,110" class="image" />
  </g>
</svg>