<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">searing</text>
  <text x="50" y="120" class="subtitle">[ˈsɪərɪŋ] adj. 灼热的，极热的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sear (烧焦) + -ing (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个太阳炙烤着大地，"烧焦(sear)"
    <tspan x="50" dy="25">一切，整个世界都变得"极热(searing)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The searing heat of the desert made it difficult to breathe.
  </text>
  <text x="50" y="310" class="content">
    沙漠的灼热让人难以呼吸。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="100" cy="100" r="50" fill="#F1C40F" stroke="#D35400" stroke-width="5" />
    <!-- Ground -->
    <rect x="0" y="150" width="200" height="50" fill="#8B4513" />
    <!-- Fire -->
    <line x1="20" y1="150" x2="20" y2="100" class="image" />
    <line x1="40" y1="150" x2="40" y2="110" class="image" />
    <line x1="60" y1="150" x2="60" y2="120" class="image" />
    <line x1="80" y1="150" x2="80" y2="130" class="image" />
    <line x1="100" y1="150" x2="100" y2="140" class="image" />
    <line x1="120" y1="150" x2="120" y2="130" class="image" />
    <line x1="140" y1="150" x2="140" y2="120" class="image" />
    <line x1="160" y1="150" x2="160" y2="110" class="image" />
    <line x1="180" y1="150" x2="180" y2="100" class="image" />
  </g>
</svg>