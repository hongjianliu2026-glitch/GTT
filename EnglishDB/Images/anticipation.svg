<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F5F5F5; }
      .title { font: bold 48px sans-serif; fill: #3498DB; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">anticipation</text>
  <text x="50" y="120" class="subtitle">[ˌæntɪsɪˈpeɪʃn] n. 预期，期待</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> anti- (在前面) + cip (拿) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在时间的前面，"提前拿到(anti-cip)"
    <tspan x="50" dy="25">未来的东西，这种提前的期待就是anticipation。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The crowd waited in anticipation for the concert to start.
  </text>
  <text x="50" y="310" class="content">
    人群满怀期待地等待着音乐会开始。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person standing in front of a clock -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Clock -->
    <circle cx="200" cy="100" r="50" class="image" />
    <line x1="200" y1="100" x2="200" y2="50" class="image" />
    <line x1="200" y1="100" x2="240" y2="100" class="image" />
    <!-- Future item -->
    <rect x="250" y="70" width="50" height="50" class="image" />
    <line x1="250" y1="70" x2="300" y2="70" class="image" />
    <line x1="250" y1="120" x2="300" y2="120" class="image" />
    <line x1="250" y1="70" x2="250" y2="120" class="image" />
    <line x1="300" y1="70" x2="300" y2="120" class="image" />
  </g>
</svg>