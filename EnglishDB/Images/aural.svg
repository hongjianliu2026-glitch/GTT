<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">aural</text>
  <text x="50" y="120" class="subtitle">[ˈɔːrəl] adj. 听觉的，耳的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> aur (耳朵) + -al (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的耳朵(aur)悬浮在空中，
    <tspan x="50" dy="25">它不仅能听到远处的声音，还能"听到"未来的声音，</tspan>
    <tspan x="50" dy="25">这就是aural(听觉的)的夸张画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The aural test was challenging for the students.
  </text>
  <text x="50" y="310" class="content">
    听觉测试对学生们来说很有挑战性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,200)">
    <!-- Large ear -->
    <ellipse cx="200" cy="150" rx="150" ry="100" class="image" />
    <!-- Sound waves -->
    <line x1="50" y1="150" x2="350" y2="150" class="image" />
    <line x1="50" y1="120" x2="350" y2="120" class="image" />
    <line x1="50" y1="180" x2="350" y2="180" class="image" />
    <!-- Future sound wave -->
    <line x1="50" y1="90" x2="350" y2="90" class="image" />
    <line x1="50" y1="210" x2="350" y2="210" class="image" />
  </g>
</svg>