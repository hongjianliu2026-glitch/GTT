<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">constrain</text>
  <text x="50" y="120" class="subtitle">[kənˈstreɪn] v. 限制，约束</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> con- (一起) + strain (拉紧)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被"一起拉紧(con-strain)"，
    <tspan x="50" dy="25">就像被绳子束缚住，无法自由行动。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The tight budget constrained our ability to innovate.
  </text>
  <text x="50" y="310" class="content">
    紧张的预算限制了我们的创新能力。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Rope -->
    <line x1="0" y1="0" x2="350" y2="0" class="image" />
    <line x1="0" y1="20" x2="350" y2="20" class="image" />
    <line x1="0" y1="40" x2="350" y2="40" class="image" />
    <!-- Person -->
    <circle cx="175" cy="100" r="20" class="image" />
    <line x1="175" y1="120" x2="175" y2="180" class="image" />
    <line x1="175" y1="140" x2="150" y2="160" class="image" />
    <line x1="175" y1="140" x2="200" y2="160" class="image" />
    <line x1="175" y1="180" x2="150" y2="220" class="image" />
    <line x1="175" y1="180" x2="200" y2="220" class="image" />
    <!-- Constraints -->
    <line x1="155" y1="100" x2="155" y2="220" class="image" />
    <line x1="195" y1="100" x2="195" y2="220" class="image" />
  </g>
</svg>