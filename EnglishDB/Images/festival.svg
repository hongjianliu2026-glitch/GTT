<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">festival</text>
  <text x="50" y="120" class="subtitle">[ˈfɛstəvəl] n. 节日，庆典</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fest (节日) + -ival (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个热闹的节日，人们载歌载舞，"庆祝(fest)"
    <tspan x="50" dy="25">着美好的时光，这就是一个节日(festival)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The town hosts an annual festival in the summer.
  </text>
  <text x="50" y="310" class="content">
    这个小镇每年夏天都会举办一个节日。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Stage -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- People -->
    <circle cx="50" cy="100" r="15" class="image" />
    <circle cx="100" cy="100" r="15" class="image" />
    <circle cx="150" cy="100" r="15" class="image" />
    <circle cx="200" cy="100" r="15" class="image" />
    <circle cx="250" cy="100" r="15" class="image" />
    <!-- Dancing lines -->
    <line x1="50" y1="120" x2="100" y2="140" class="image" />
    <line x1="100" y1="120" x2="150" y2="140" class="image" />
    <line x1="150" y1="120" x2="200" y2="140" class="image" />
    <line x1="200" y1="120" x2="250" y2="140" class="image" />
    <!-- Fireworks -->
    <line x1="300" y1="20" x2="320" y2="40" class="image" />
    <line x1="300" y1="20" x2="280" y2="40" class="image" />
    <line x1="300" y1="20" x2="310" y2="60" class="image" />
  </g>
</svg>