<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">oath</text>
  <text x="50" y="120" class="subtitle">[oʊθ] n. 誓言，誓约</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> oath (源自古英语，意为誓言)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人举起手，"发誓(oath)"
    <tspan x="50" dy="25">说出的每一句话都像钉子一样钉在心里，</tspan>
    <tspan x="50" dy="25">这种誓言(oath)让人铭记于心。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He took an oath to tell the truth.
  </text>
  <text x="50" y="310" class="content">
    他发誓要说真话。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Hand raised -->
    <line x1="50" y1="50" x2="50" y2="150" class="image" />
    <line x1="50" y1="50" x2="20" y2="80" class="image" />
    <line x1="50" y1="50" x2="80" y2="80" class="image" />
    <line x1="50" y1="150" x2="20" y2="180" class="image" />
    <line x1="50" y1="150" x2="80" y2="180" class="image" />
    <!-- Nail -->
    <rect x="30" y="100" width="40" height="100" class="image" />
    <line x1="50" y1="100" x2="50" y2="200" class="image" />
    <!-- Heart -->
    <path d="M100,150 C100,50 200,50 200,150 S300,250 200,250 S100,250 100,150" class="image" />
    <text x="150" y="200" class="content" text-anchor="middle">心</text>
  </g>
</svg>