<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ruin</text>
  <text x="50" y="120" class="subtitle">[ˈruːɪn] n. 废墟，毁灭；v. 毁灭，破坏</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ru (破坏) + in (进入)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座宏伟的城堡，"破坏进入(ru-in)"
    <tspan x="50" dy="25">后变成了一片废墟(ruin)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm left the town in ruins.
  </text>
  <text x="50" y="310" class="content">
    暴风雨过后，小镇变成了一片废墟。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ruined castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <line x1="70" y1="50" x2="280" y2="50" class="image" />
    <line x1="70" y1="80" x2="250" y2="80" class="image" />
    <line x1="70" y1="110" x2="270" y2="110" class="image" />
    <line x1="70" y1="140" x2="240" y2="140" class="image" />
    <!-- Broken walls -->
    <line x1="100" y1="20" x2="100" y2="180" class="image" />
    <line x1="200" y1="20" x2="200" y2="180" class="image" />
    <line x1="300" y1="20" x2="300" y2="180" class="image" />
    <!-- Collapsed roof -->
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="20" x2="175" y2="100" class="image" />
    <line x1="300" y1="20" x2="175" y2="100" class="image" />
  </g>
</svg>