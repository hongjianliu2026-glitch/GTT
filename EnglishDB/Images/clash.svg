<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">clash</text>
  <text x="50" y="120" class="subtitle">[klæʃ] n. 冲突，碰撞；v. 冲突，碰撞</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cla- (碰撞) + -sh (动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两把剑在空中"碰撞(cla-sh)"，发出刺耳的声音，这就是冲突(clash)的画面。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The two armies clashed in the valley.
  </text>
  <text x="50" y="310" class="content">
    两支军队在山谷中发生了冲突。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Swords clashing -->
    <line x1="50" y1="50" x2="250" y2="200" class="image" />
    <line x1="250" y1="50" x2="50" y2="200" class="image" />
    <!-- Sparks -->
    <circle cx="150" cy="125" r="10" class="image" />
    <circle cx="170" cy="140" r="8" class="image" />
    <circle cx="130" cy="140" r="8" class="image" />
  </g>
</svg>