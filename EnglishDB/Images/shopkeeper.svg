<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">shopkeeper</text>
  <text x="50" y="120" class="subtitle">[ˈʃɒpkiːpə(r)] n. 店主</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> shop (商店) + keep (保持) + -er (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个店主(shopkeeper)在商店里，"保持(keep)"
    <tspan x="50" dy="25">商品的秩序，确保顾客满意。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The shopkeeper greeted us with a smile.
  </text>
  <text x="50" y="310" class="content">
    店主微笑着迎接我们。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Shop -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Shopkeeper -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Counter -->
    <rect x="100" y="50" width="200" height="100" class="image" />
    <!-- Items on counter -->
    <circle cx="120" cy="100" r="10" class="image" />
    <circle cx="150" cy="100" r="10" class="image" />
    <circle cx="180" cy="100" r="10" class="image" />
  </g>
</svg>