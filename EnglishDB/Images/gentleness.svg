<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">gentleness</text>
  <text x="50" y="120" class="subtitle">[ˈdʒɛntlnəs] n. 温柔，温和</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gent (种族，种类) + -le (小) + -ness (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只小猫轻轻地"抚摸(gent-le)"你的手，
    <tspan x="50" dy="25">这种温柔的动作让你感受到无比的温和(gentleness)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her gentleness made everyone feel at ease.
  </text>
  <text x="50" y="310" class="content">
    她的温柔让每个人都感到轻松自在。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Cat -->
    <circle cx="50" cy="100" r="30" class="image" /> <!-- Head -->
    <line x1="50" y1="130" x2="50" y2="180" class="image" /> <!-- Body -->
    <line x1="50" y1="150" x2="20" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="150" x2="80" y2="140" class="image" /> <!-- Front leg -->
    <line x1="50" y1="180" x2="20" y2="200" class="image" /> <!-- Back leg -->
    <line x1="50" y1="180" x2="80" y2="200" class="image" /> <!-- Back leg -->
    <line x1="50" y1="110" x2="20" y2="120" class="image" /> <!-- Ear -->
    <line x1="50" y1="110" x2="80" y2="120" class="image" /> <!-- Ear -->
    <circle cx="40" cy="90" r="5" class="image" /> <!-- Eye -->
    <circle cx="60" cy="90" r="5" class="image" /> <!-- Eye -->
    <line x1="45" y1="100" x2="55" y2="100" class="image" /> <!-- Mouth -->

    <!-- Hand -->
    <line x1="150" y1="150" x2="150" y2="200" class="image" /> <!-- Arm -->
    <line x1="150" y1="150" x2="120" y2="140" class="image" /> <!-- Hand -->
    <line x1="150" y1="150" x2="180" y2="140" class="image" /> <!-- Hand -->
    <line x1="150" y1="150" x2="120" y2="160" class="image" /> <!-- Hand -->
    <line x1="150" y1="150" x2="180" y2="160" class="image" /> <!-- Hand -->
  </g>
</svg>