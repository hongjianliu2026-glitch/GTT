<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .grass { fill: #2ECC71; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">grass</text>
  <text x="50" y="120" class="subtitle">[ɡræs] n. 草，草地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> gramin (草)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片广阔的草地，"草(gramin)"
    <tspan x="50" dy="25">覆盖了整个地面，就像绿色的地毯一样。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The cows were grazing on the grass.
  </text>
  <text x="50" y="310" class="content">
    牛群在草地上吃草。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grass field -->
    <rect x="0" y="0" width="350" height="200" class="grass" />
    <!-- Grass blades -->
    <line x1="50" y1="20" x2="50" y2="100" class="image" />
    <line x1="100" y1="20" x2="100" y2="100" class="image" />
    <line x1="150" y1="20" x2="150" y2="100" class="image" />
    <line x1="200" y1="20" x2="200" y2="100" class="image" />
    <line x1="250" y1="20" x2="250" y2="100" class="image" />
    <line x1="300" y1="20" x2="300" y2="100" class="image" />
    <!-- Cow -->
    <circle cx="100" cy="150" r="20" class="image" />
    <line x1="100" y1="170" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="180" x2="130" y2="170" class="image" />
  </g>
</svg>