<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">disapproval</text>
  <text x="50" y="120" class="subtitle">[ˌdɪsəˈpruːvəl] n. 不赞成，反对</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dis- (不) + approve (赞成)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人皱着眉头，"不(dis-)"
    <tspan x="50" dy="25">赞成(approve)"某件事，脸上写满了不赞成(disapproval)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Her parents showed their disapproval of her decision.
  </text>
  <text x="50" y="310" class="content">
    她的父母对她的决定表示不赞成。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Face -->
    <circle cx="100" cy="100" r="50" class="image" />
    <!-- Eyes -->
    <circle cx="80" cy="85" r="5" class="image" />
    <circle cx="120" cy="85" r="5" class="image" />
    <!-- Mouth -->
    <line x1="80" y1="120" x2="120" y2="120" class="image" />
    <!-- Frown -->
    <line x1="80" y1="80" x2="100" y2="70" class="image" />
    <line x1="100" y1="70" x2="120" y2="80" class="image" />
  </g>
</svg>