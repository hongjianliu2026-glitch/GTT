<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #7B241C; }
      .subtitle { font: italic 24px serif; fill: #512E5F; }
      .content { font: 18px sans-serif; fill: #4A235A; }
      .highlight { font-weight: bold; fill: #C0392B; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">whisky</text>
  <text x="50" y="120" class="subtitle">[ˈwɪski] n. 威士忌</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自盖尔语 uisge beatha (生命之水)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个古老的苏格兰酿酒师，他正在酿造一种被称为"生命之水(uisge beatha)"的神秘液体，
    <tspan x="50" dy="25">这种液体后来被称为威士忌(whisky)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He enjoys a glass of whisky after dinner.
  </text>
  <text x="50" y="310" class="content">
    他喜欢在晚餐后喝一杯威士忌。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Barrel -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Liquid in the barrel -->
    <rect x="50" y="20" width="250" height="160" class="image" fill="#D2B48C" />
    <!-- Bubbles -->
    <circle cx="100" cy="100" r="10" class="image" fill="#FFFFFF" />
    <circle cx="150" cy="120" r="10" class="image" fill="#FFFFFF" />
    <circle cx="200" cy="140" r="10" class="image" fill="#FFFFFF" />
    <!-- Glass of whisky -->
    <rect x="300" y="50" width="50" height="100" class="image" />
    <rect x="310" y="60" width="30" height="90" class="image" fill="#D2B48C" />
  </g>
</svg>