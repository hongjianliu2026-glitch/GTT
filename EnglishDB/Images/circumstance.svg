<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">circumstance</text>
  <text x="50" y="120" class="subtitle">[ˈsɜːrkəmˌstæns] n. 环境，情况</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> circum- (周围) + sta (站立) + -ance (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在一个圆圈的中心，"周围(circum-)"
    <tspan x="50" dy="25">站立(sta)着各种情况(circumstance)，这些情况影响着他的决策。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> We must consider all the circumstances before making a decision.
  </text>
  <text x="50" y="310" class="content">
    在做出决定之前，我们必须考虑所有的情况。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Circle -->
    <circle cx="200" cy="100" r="80" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Situations -->
    <rect x="100" y="20" width="20" height="20" class="image" />
    <rect x="280" y="20" width="20" height="20" class="image" />
    <rect x="100" y="180" width="20" height="20" class="image" />
    <rect x="280" y="180" width="20" height="20" class="image" />
  </g>
</svg>