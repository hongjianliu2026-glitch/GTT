<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #6C3483; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .coffee { fill: #A569BD; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">coffee</text>
  <text x="50" y="120" class="subtitle">[ˈkɔfi] n. 咖啡</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词源:</tspan> 源自阿拉伯语 "qahwah"，意为 "葡萄酒"，后演变为指咖啡。
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个清晨，一位疲惫的旅人发现了一棵神奇的树，树上结满了黑色的果实。
    <tspan x="50" dy="25">他将果实烘烤后磨碎，泡水饮用，瞬间精神焕发，这就是咖啡的起源。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She enjoys a cup of coffee every morning.
  </text>
  <text x="50" y="310" class="content">
    她每天早上都喜欢喝一杯咖啡。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Coffee cup -->
    <rect x="0" y="0" width="150" height="100" class="image" />
    <rect x="10" y="10" width="130" height="80" class="coffee" />
    <!-- Steam -->
    <line x1="75" y1="10" x2="75" y2="0" class="image" />
    <line x1="75" y1="10" x2="65" y2="0" class="image" />
    <line x1="75" y1="10" x2="85" y2="0" class="image" />
    <!-- Coffee beans -->
    <circle cx="20" cy="120" r="10" class="image" />
    <circle cx="50" cy="120" r="10" class="image" />
    <circle cx="80" cy="120" r="10" class="image" />
    <circle cx="110" cy="120" r="10" class="image" />
  </g>
</svg>