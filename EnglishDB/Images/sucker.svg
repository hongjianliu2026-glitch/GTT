<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">sucker</text>
  <text x="50" y="120" class="subtitle">[ˈsʌkər] n. 吸盘，易上当的人</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> suck (吸) + -er (表示人或物)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个易上当的人(sucker)，他总是被"吸(suck)"
    <tspan x="50" dy="25">进各种骗局，就像一个吸盘一样无法自拔。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He was such a sucker for online scams.
  </text>
  <text x="50" y="310" class="content">
    他很容易上当，总是被网络诈骗骗到。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sucker -->
    <circle cx="50" cy="100" r="30" class="image" />
    <!-- Mouth -->
    <circle cx="50" cy="100" r="10" class="image" fill="#F1C40F" />
    <!-- Eyes -->
    <circle cx="35" cy="85" r="5" class="image" fill="#2C3E50" />
    <circle cx="65" cy="85" r="5" class="image" fill="#2C3E50" />
    <!-- Trap -->
    <rect x="100" y="50" width="150" height="100" class="image" />
    <text x="120" y="100" class="content" fill="#2C3E50">Trap</text>
    <!-- Arrow -->
    <line x1="50" y1="130" x2="175" y2="100" class="image" />
    <polygon points="175,100 165,90 165,110" class="image" />
  </g>
</svg>