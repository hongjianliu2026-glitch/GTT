<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">tightrope</text>
  <text x="50" y="120" class="subtitle">[ˈtaɪtˌroʊp] n. 绷索，钢丝</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> tight (紧的) + rope (绳子)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个杂技演员在一条"紧绷的绳子(tight-rope)"上行走，
    <tspan x="50" dy="25">每一步都小心翼翼，生怕掉下来。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The acrobat walked the tightrope with ease.
  </text>
  <text x="50" y="310" class="content">
    杂技演员轻松地走过了钢丝。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Tightrope -->
    <line x1="0" y1="50" x2="350" y2="50" class="image" />
    <!-- Acrobat -->
    <circle cx="175" cy="30" r="15" class="image" />
    <line x1="175" y1="45" x2="175" y2="70" class="image" />
    <line x1="175" y1="70" x2="155" y2="100" class="image" />
    <line x1="175" y1="70" x2="195" y2="100" class="image" />
    <line x1="175" y1="55" x2="205" y2="45" class="image" />
  </g>
</svg>