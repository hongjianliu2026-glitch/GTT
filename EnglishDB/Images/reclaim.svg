<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">reclaim</text>
  <text x="50" y="120" class="subtitle">[rɪˈkleɪm] v. 收回，恢复，开垦</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> re- (再次) + claim (喊叫，要求)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人站在荒地上，"再次喊叫(re-claim)"
    <tspan x="50" dy="25">要求这片土地，经过努力，他成功地开垦了这片荒地。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The government plans to reclaim the desert land for agriculture.
  </text>
  <text x="50" y="310" class="content">
    政府计划将沙漠土地开垦用于农业。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Desert -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <line x1="50" y1="20" x2="300" y2="20" class="image" />
    <line x1="50" y1="50" x2="300" y2="50" class="image" />
    <line x1="50" y1="80" x2="300" y2="80" class="image" />
    <line x1="50" y1="110" x2="300" y2="110" class="image" />
    <line x1="50" y1="140" x2="300" y2="140" class="image" />
    <!-- Person -->
    <circle cx="200" cy="100" r="15" class="image" />
    <line x1="200" y1="115" x2="200" y2="150" class="image" />
    <line x1="200" y1="150" x2="180" y2="180" class="image" />
    <line x1="200" y1="150" x2="220" y2="180" class="image" />
    <line x1="200" y1="130" x2="250" y2="120" class="image" />
    <!-- Reclaimed land -->
    <rect x="100" y="150" width="150" height="30" class="image" />
    <line x1="110" y1="160" x2="240" y2="160" class="image" />
    <line x1="110" y1="170" x2="240" y2="170" class="image" />
    <line x1="110" y1="180" x2="240" y2="180" class="image" />
  </g>
</svg>