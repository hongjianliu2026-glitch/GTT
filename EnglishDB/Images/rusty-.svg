      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">rusty</text>
  <text x="50" y="120" class="subtitle">[ˈrʌsti] adj. 生锈的，陈旧的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> rust (锈) + -y (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一把生锈的剑，"锈迹斑斑(rusty)"，
    <tspan x="50" dy="25">失去了锋利，象征着陈旧和不再有用。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The old gate was rusty and hard to open.
  </text>
  <text x="50" y="310" class="content">
    那扇旧门生锈了，很难打开。
  </text>

