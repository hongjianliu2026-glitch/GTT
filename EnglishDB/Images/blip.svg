<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">blip</text>
  <text x="50" y="120" class="subtitle">[blɪp] n. 短暂的声音或信号</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> 源自拟声词，模拟短暂的声音
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个雷达屏幕上，突然出现一个"短暂的声音或信号(blip)"，
    <tspan x="50" dy="25">就像一个小点在屏幕上闪烁，然后迅速消失。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The radar detected a blip on the screen.
  </text>
  <text x="50" y="310" class="content">
    雷达在屏幕上检测到一个短暂信号。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Radar screen -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Blip -->
    <circle cx="175" cy="100" r="10" fill="#E74C3C" />
    <!-- Radar lines -->
    <line x1="50" y1="100" x2="300" y2="100" class="image" />
    <line x1="175" y1="20" x2="175" y2="180" class="image" />
    <line x1="175" y1="100" x2="300" y2="20" class="image" />
    <line x1="175" y1="100" x2="300" y2="180" class="image" />
  </g>
</svg>