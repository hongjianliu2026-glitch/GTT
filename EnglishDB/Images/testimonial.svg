<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">testimonial</text>
  <text x="50" y="120" class="subtitle">[ˌtestɪˈmoʊniəl] n. 证明书，推荐书</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> testi- (见证) + monial (陈述)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个见证者站在法庭上，"见证并陈述(testi-monial)"
    <tspan x="50" dy="25">事实，这些陈述就构成了证明书(testimonial)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The company received a glowing testimonial from its clients.
  </text>
  <text x="50" y="310" class="content">
    公司收到了客户的高度赞扬的推荐信。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Witness stand -->
    <rect x="50" y="20" width="250" height="160" class="image" />
    <!-- Witness -->
    <circle cx="120" cy="100" r="15" class="image" />
    <line x1="120" y1="115" x2="120" y2="150" class="image" />
    <line x1="120" y1="150" x2="100" y2="180" class="image" />
    <line x1="120" y1="150" x2="140" y2="180" class="image" />
    <line x1="120" y1="130" x2="170" y2="120" class="image" />
    <!-- Speech bubble -->
    <path d="M180,80 Q220,80 220,120 Q180,120 180,80 Z" class="image" />
    <text x="190" y="110" class="content">"I witnessed..."</text>
  </g>
</svg>