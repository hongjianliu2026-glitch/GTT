<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">betting</text>
  <text x="50" y="120" class="subtitle">[ˈbɛtɪŋ] n. 打赌，赌博</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bet (打赌) + -ing (进行时)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象两个人在赌场里，"打赌(bet)"
    <tspan x="50" dy="25">决定谁会赢，这就是赌博(betting)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He lost a lot of money in betting last night.
  </text>
  <text x="50" y="310" class="content">
    他昨晚在赌博中输了很多钱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Casino table -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Chips -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="80" cy="50" r="15" class="image" />
    <circle cx="110" cy="50" r="15" class="image" />
    <!-- Dice -->
    <rect x="150" y="30" width="30" height="30" class="image" />
    <rect x="190" y="30" width="30" height="30" class="image" />
    <!-- Gamblers -->
    <circle cx="250" cy="100" r="15" class="image" />
    <circle cx="300" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="300" y1="115" x2="300" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="300" y1="150" x2="320" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
  </g>
</svg>