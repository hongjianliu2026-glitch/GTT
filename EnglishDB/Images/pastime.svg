<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #A93226; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">pastime</text>
  <text x="50" y="120" class="subtitle">[ˈpæstaɪm] n. 消遣，娱乐</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> pas- (通过) + time (时间)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人在公园里，"通过(pas-)"
    <tspan x="50" dy="25">散步来消磨时间(time)，这就是他的消遣(pastime)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> Reading is her favorite pastime.
  </text>
  <text x="50" y="310" class="content">
    阅读是她最喜欢的消遣。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Park -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Path -->
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <!-- Person -->
    <circle cx="100" cy="160" r="15" class="image" />
    <line x1="100" y1="175" x2="100" y2="200" class="image" />
    <line x1="100" y1="200" x2="80" y2="230" class="image" />
    <line x1="100" y1="200" x2="120" y2="230" class="image" />
    <line x1="100" y1="190" x2="130" y2="180" class="image" />
    <!-- Sun -->
    <circle cx="300" cy="50" r="30" class="image" />
    <!-- Tree -->
    <line x1="200" y1="100" x2="200" y2="150" class="image" />
    <line x1="180" y1="125" x2="220" y2="125" class="image" />
    <line x1="190" y1="110" x2="210" y2="110" class="image" />
  </g>
</svg>