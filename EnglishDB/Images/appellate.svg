<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">appellate</text>
  <text x="50" y="120" class="subtitle">[əˈpɛlət] adj. 上诉的，受理上诉的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> ap- (向) + pell (推) + -ate (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个法官在法庭上，"向(ap-)"
    <tspan x="50" dy="25">推(pell)"动案件进入上诉程序，</tspan>
    <tspan x="50" dy="25">这个法官就是受理上诉的(appellate)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The appellate court reviewed the case.
  </text>
  <text x="50" y="310" class="content">
    上诉法院审理了此案。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Courtroom -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Judge -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Gavel -->
    <rect x="40" y="80" width="20" height="20" class="image" />
    <!-- Case file -->
    <rect x="100" y="80" width="150" height="100" class="image" />
    <line x1="110" y1="90" x2="240" y2="90" class="image" />
    <line x1="110" y1="110" x2="230" y2="110" class="image" />
    <line x1="110" y1="130" x2="220" y2="130" class="image" />
    <line x1="110" y1="150" x2="210" y2="150" class="image" />
  </g>
</svg>