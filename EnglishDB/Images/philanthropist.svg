<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">philanthropist</text>
  <text x="50" y="120" class="subtitle">[fɪˈlænθrəpɪst] n. 慈善家</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> philo- (爱) + anthrop (人) + -ist (人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个充满爱心的人(philo-anthrop-ist)，
    <tspan x="50" dy="25">他/她总是无私地帮助他人，就像一个慈善家(philanthropist)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The philanthropist donated a large sum to the orphanage.
  </text>
  <text x="50" y="310" class="content">
    这位慈善家向孤儿院捐赠了一大笔钱。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Heart shape -->
    <path d="M10 30 Q20 10 30 30 T50 30" class="image" />
    <path d="M10 30 Q20 50 30 30 T50 30" class="image" />
    <!-- Person -->
    <circle cx="30" cy="100" r="15" class="image" />
    <line x1="30" y1="115" x2="30" y2="150" class="image" />
    <line x1="30" y1="150" x2="15" y2="180" class="image" />
    <line x1="30" y1="150" x2="45" y2="180" class="image" />
    <line x1="30" y1="130" x2="60" y2="120" class="image" />
    <!-- Helping hand -->
    <line x1="30" y1="150" x2="70" y2="150" class="image" />
    <line x1="70" y1="150" x2="60" y2="130" class="image" />
    <line x1="70" y1="150" x2="60" y2="170" class="image" />
  </g>
</svg>