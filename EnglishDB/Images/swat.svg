<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">swat</text>
  <text x="50" y="120" class="subtitle">[swɒt] v. 猛击，拍打；n. 猛击</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> sw- (表示快速移动) + at (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一只愤怒的蜜蜂，快速移动(sw-)并猛击(at)
    <tspan x="50" dy="25">你的手臂，这就是“swat”的动作。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He swatted the fly with a newspaper.
  </text>
  <text x="50" y="310" class="content">
    他用报纸拍打了苍蝇。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Bee -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="80" x2="50" y2="60" class="image" />
    <line x1="50" y1="120" x2="50" y2="140" class="image" />
    <line x1="30" y1="100" x2="10" y2="100" class="image" />
    <line x1="70" y1="100" x2="90" y2="100" class="image" />
    <!-- Arm -->
    <rect x="100" y="80" width="150" height="40" class="image" />
    <!-- Newspaper -->
    <rect x="250" y="80" width="100" height="40" class="image" />
    <!-- Swat action -->
    <line x1="250" y1="100" x2="150" y2="100" class="image" />
  </g>
</svg>