<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
      .leaf { fill: #27AE60; }
      .earth { fill: #3498DB; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">ecological</text>
  <text x="50" y="120" class="subtitle">[ˌiːkəˈlɒdʒɪkl] adj. 生态的，生态学的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> eco- (家，环境) + log (学) + -ical (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个科学家在研究"家园(eco)"的"学问(log)"，
    <tspan x="50" dy="25">他发现地球(earth)上的每一片叶子(leaf)都与生态(ecological)息息相关。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The new policy focuses on ecological sustainability.
  </text>
  <text x="50" y="310" class="content">
    新政策专注于生态可持续性。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Earth -->
    <circle cx="100" cy="100" r="80" class="earth" />
    <!-- Leaves -->
    <path d="M 50 100 Q 75 50 100 100 Q 125 150 150 100" class="leaf" />
    <path d="M 75 100 Q 100 50 125 100 Q 150 150 175 100" class="leaf" />
    <path d="M 100 100 Q 125 50 150 100 Q 175 150 200 100" class="leaf" />
  </g>
</svg>