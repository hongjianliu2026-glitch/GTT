<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">catechism</text>
  <text x="50" y="120" class="subtitle">[ˈkætəˌkɪzəm] n. 教义问答，问答教学法</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> cata- (完全) + -chism (问答)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个学生在教堂里，"完全地问答(cata-chism)"
    <tspan x="50" dy="25">教义，这种问答形式就是教义问答(catechism)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The priest used a catechism to teach the children about the faith.
  </text>
  <text x="50" y="310" class="content">
    牧师用教义问答来教孩子们关于信仰的知识。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Church -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <!-- Priest -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="160" class="image" />
    <line x1="50" y1="160" x2="30" y2="190" class="image" />
    <line x1="50" y1="160" x2="70" y2="190" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Student -->
    <circle cx="250" cy="100" r="15" class="image" />
    <line x1="250" y1="115" x2="250" y2="150" class="image" />
    <line x1="250" y1="150" x2="230" y2="180" class="image" />
    <line x1="250" y1="150" x2="270" y2="180" class="image" />
    <line x1="250" y1="130" x2="280" y2="120" class="image" />
    <!-- Question and Answer -->
    <text x="100" y="50" class="content">Q</text>
    <text x="100" y="80" class="content">A</text>
    <line x1="120" y1="50" x2="120" y2="80" class="image" />
    <line x1="120" y1="65" x2="150" y2="65" class="image" />
  </g>
</svg>