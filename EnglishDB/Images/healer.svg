<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">healer</text>
  <text x="50" y="120" class="subtitle">[ˈhiːlər] n. 治疗者，医治者</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> heal (治愈) + -er (表示人)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个治疗者(healer)，手持魔法杖，"治愈(heal)"
    <tspan x="50" dy="25">受伤的生物，使其恢复健康。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The healer used herbs to treat the wound.
  </text>
  <text x="50" y="310" class="content">
    治疗者用草药治疗伤口。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Healing wand -->
    <line x1="50" y1="20" x2="50" y2="150" class="image" />
    <circle cx="50" cy="150" r="10" class="image" />
    <!-- Healing effect -->
    <line x1="50" y1="150" x2="100" y2="100" class="image" />
    <line x1="50" y1="150" x2="100" y2="200" class="image" />
    <line x1="50" y1="150" x2="150" y2="150" class="image" />
    <!-- Healer -->
    <circle cx="50" cy="20" r="20" class="image" />
    <line x1="50" y1="40" x2="50" y2="80" class="image" />
    <line x1="50" y1="60" x2="30" y2="50" class="image" />
    <line x1="50" y1="60" x2="70" y2="50" class="image" />
    <line x1="50" y1="80" x2="30" y2="100" class="image" />
    <line x1="50" y1="80" x2="70" y2="100" class="image" />
  </g>
</svg>