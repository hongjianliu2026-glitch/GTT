<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">bunch</text>
  <text x="50" y="120" class="subtitle">[bʌntʃ] n. 一束，一串；v. 捆成一束</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> bun (捆) + ch (表示动作)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个农夫在田里，"捆(bun)"
    <tspan x="50" dy="25">起一束(ch)成熟的葡萄，这就是一束(bunch)。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She picked a bunch of grapes from the vine.
  </text>
  <text x="50" y="310" class="content">
    她从藤上摘了一串葡萄。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Grapes -->
    <circle cx="50" cy="50" r="15" class="image" />
    <circle cx="80" cy="50" r="15" class="image" />
    <circle cx="110" cy="50" r="15" class="image" />
    <circle cx="140" cy="50" r="15" class="image" />
    <circle cx="170" cy="50" r="15" class="image" />
    <!-- Bundle -->
    <line x1="40" y1="65" x2="180" y2="65" class="image" />
    <line x1="40" y1="70" x2="180" y2="70" class="image" />
    <line x1="40" y1="75" x2="180" y2="75" class="image" />
  </g>
</svg>