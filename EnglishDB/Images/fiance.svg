<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">fiancé</text>
  <text x="50" y="120" class="subtitle">[fiˈɒnseɪ] n. 未婚夫</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> fiancé (源自法语，意为“承诺”)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个浪漫的场景，一位男士单膝跪地，向心爱的女士求婚，
    <tspan x="50" dy="25">他手中拿着戒指，脸上洋溢着幸福的笑容，这就是他的“承诺(fiancé)”。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> She introduced her fiancé to her parents last weekend.
  </text>
  <text x="50" y="310" class="content">
    她上周末把她的未婚夫介绍给了她的父母。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Man kneeling -->
    <line x1="50" y1="100" x2="50" y2="150" class="image" />
    <line x1="50" y1="125" x2="30" y2="100" class="image" />
    <line x1="50" y1="125" x2="70" y2="100" class="image" />
    <line x1="50" y1="150" x2="30" y2="180" class="image" />
    <line x1="50" y1="150" x2="70" y2="180" class="image" />
    <!-- Ring -->
    <circle cx="50" cy="80" r="10" class="image" />
    <!-- Woman -->
    <circle cx="150" cy="100" r="15" class="image" />
    <line x1="150" y1="115" x2="150" y2="150" class="image" />
    <line x1="150" y1="150" x2="130" y2="180" class="image" />
    <line x1="150" y1="150" x2="170" y2="180" class="image" />
    <line x1="150" y1="130" x2="180" y2="120" class="image" />
  </g>
</svg>