<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #D35400; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">unbearable</text>
  <text x="50" y="120" class="subtitle">[ʌnˈberəbl] adj. 无法忍受的，难以承受的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> un- (否定) + bear (忍受) + -able (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人被巨大的压力压得喘不过气，"无法忍受(un-bear-able)"
    <tspan x="50" dy="25">这些压力，表情痛苦不堪。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The heat was unbearable, even in the shade.
  </text>
  <text x="50" y="310" class="content">
    即使在阴凉处，炎热也让人难以忍受。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Person under pressure -->
    <circle cx="50" cy="100" r="20" class="image" />
    <line x1="50" y1="120" x2="50" y2="180" class="image" />
    <line x1="50" y1="180" x2="30" y2="220" class="image" />
    <line x1="50" y1="180" x2="70" y2="220" class="image" />
    <line x1="50" y1="140" x2="80" y2="130" class="image" />
    <!-- Pressure symbol -->
    <line x1="100" y1="80" x2="100" y2="120" class="image" />
    <line x1="100" y1="100" x2="80" y2="100" class="image" />
    <line x1="100" y1="100" x2="120" y2="100" class="image" />
    <line x1="100" y1="100" x2="100" y2="140" class="image" />
    <line x1="100" y1="120" x2="80" y2="120" class="image" />
    <line x1="100" y1="120" x2="120" y2="120" class="image" />
  </g>
</svg>