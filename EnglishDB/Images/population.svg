<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">population</text>
  <text x="50" y="120" class="subtitle">[ˌpɒpjuˈleɪʃn] n. 人口，全体居民</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> populi (人民) + -ation (名词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的城市，"人民(populi)"
    <tspan x="50" dy="25">聚集在一起，形成了"全体居民(population)"。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The population of this city is growing rapidly.
  </text>
  <text x="50" y="310" class="content">
    这个城市的人口正在迅速增长。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- City skyline -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="30" height="100" class="image" />
    <rect x="100" y="10" width="30" height="120" class="image" />
    <rect x="150" y="30" width="30" height="90" class="image" />
    <rect x="200" y="10" width="30" height="110" class="image" />
    <rect x="250" y="20" width="30" height="100" class="image" />
    <rect x="300" y="10" width="30" height="120" class="image" />
    <!-- People -->
    <circle cx="70" cy="150" r="5" class="image" />
    <circle cx="120" cy="140" r="5" class="image" />
    <circle cx="170" cy="160" r="5" class="image" />
    <circle cx="220" cy="140" r="5" class="image" />
    <circle cx="270" cy="150" r="5" class="image" />
    <circle cx="320" cy="140" r="5" class="image" />
  </g>
</svg>