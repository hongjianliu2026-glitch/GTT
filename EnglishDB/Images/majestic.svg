<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #7B241C; }
      .content { font: 18px sans-serif; fill: #512E5F; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #8E44AD; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">majestic</text>
  <text x="50" y="120" class="subtitle">[məˈdʒestɪk] adj. 宏伟的，壮丽的</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> maj (大) + -estic (形容词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一座巨大的(maj)城堡，高耸入云，
    <tspan x="50" dy="25">它的壮丽(estic)景象让人心生敬畏。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The majestic mountains were covered in snow.
  </text>
  <text x="50" y="310" class="content">
    宏伟的山脉被白雪覆盖。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Castle -->
    <rect x="0" y="0" width="350" height="200" class="image" />
    <rect x="50" y="20" width="250" height="160" class="image" />
    <rect x="70" y="40" width="210" height="120" class="image" />
    <rect x="90" y="60" width="170" height="80" class="image" />
    <rect x="110" y="80" width="130" height="40" class="image" />
    <!-- Tower -->
    <rect x="150" y="0" width="50" height="200" class="image" />
    <!-- Flag -->
    <line x1="175" y1="0" x2="175" y2="20" class="image" />
    <rect x="175" y="20" width="20" height="40" class="image" />
  </g>
</svg>