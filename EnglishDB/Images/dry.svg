<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #F9EBEA; }
      .title { font: bold 48px sans-serif; fill: #C0392B; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">dry</text>
  <text x="50" y="120" class="subtitle">[draɪ] adj. 干燥的，干旱的；v. 使干燥</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> dry (干燥)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一片沙漠，太阳炙烤着大地，"干燥(dry)"
    <tspan x="50" dy="25">的沙子在阳光下闪闪发光，没有一滴水。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The ground was so dry that it cracked.
  </text>
  <text x="50" y="310" class="content">
    地面非常干燥，以至于裂开了。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Sun -->
    <circle cx="50" cy="50" r="40" fill="#F1C40F" />
    <!-- Desert -->
    <rect x="0" y="100" width="350" height="200" fill="#D4AC0D" />
    <!-- Cracked ground -->
    <line x1="50" y1="150" x2="300" y2="150" class="image" />
    <line x1="50" y1="180" x2="300" y2="180" class="image" />
    <line x1="50" y1="210" x2="300" y2="210" class="image" />
    <line x1="50" y1="240" x2="300" y2="240" class="image" />
    <!-- Sand particles -->
    <circle cx="100" cy="170" r="5" fill="#F4D03F" />
    <circle cx="150" cy="190" r="5" fill="#F4D03F" />
    <circle cx="200" cy="210" r="5" fill="#F4D03F" />
    <circle cx="250" cy="230" r="5" fill="#F4D03F" />
  </g>
</svg>