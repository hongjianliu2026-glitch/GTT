<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #E8F6F3; }
      .title { font: bold 48px sans-serif; fill: #16A085; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">suit</text>
  <text x="50" y="120" class="subtitle">[suːt] n. 套装，诉讼；v. 适合</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> su- (跟随) + it (走)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个人穿着一套西装，"跟随(su-)"潮流，"走(it)"在时尚的前沿，这套西装(suit)完美地适合他。
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> He wore a black suit to the interview.
  </text>
  <text x="50" y="310" class="content">
    他穿着黑色西装去面试。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Suit -->
    <rect x="0" y="0" width="150" height="200" class="image" />
    <rect x="10" y="10" width="130" height="180" class="image" />
    <!-- Shirt -->
    <rect x="20" y="20" width="110" height="160" class="image" />
    <!-- Tie -->
    <rect x="50" y="30" width="50" height="10" class="image" />
    <!-- Pants -->
    <rect x="10" y="210" width="130" height="80" class="image" />
    <!-- Shoes -->
    <rect x="20" y="290" width="40" height="20" class="image" />
    <rect x="90" y="290" width="40" height="20" class="image" />
  </g>
</svg>