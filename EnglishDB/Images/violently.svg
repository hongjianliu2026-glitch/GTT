<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .background { fill: #FDEBD0; }
      .title { font: bold 48px sans-serif; fill: #B03A2E; }
      .subtitle { font: italic 24px serif; fill: #2C3E50; }
      .content { font: 18px sans-serif; fill: #34495E; }
      .highlight { font-weight: bold; fill: #E74C3C; }
      .story { font: 16px serif; fill: #2980B9; }
      .image { stroke: #7F8C8D; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="background" width="100%" height="100%" />

  <!-- Title -->
  <text x="50" y="80" class="title">violently</text>
  <text x="50" y="120" class="subtitle">[ˈvaɪələntli] adv. 猛烈地，激烈地</text>

  <!-- Etymology -->
  <text x="50" y="170" class="content">
    <tspan class="highlight">词根:</tspan> viol (力量) + -ent (形容词后缀) + -ly (副词后缀)
  </text>

  <!-- Story -->
  <text x="50" y="210" class="story">
    想象一个巨大的拳头"猛烈地(viol-ent-ly)"砸向地面，
    <tspan x="50" dy="25">地面瞬间裂开，这就是"猛烈地(violently)"的画面。</tspan>
  </text>

  <!-- Example -->
  <text x="50" y="280" class="content">
    <tspan class="highlight">例句:</tspan> The storm hit the island violently.
  </text>
  <text x="50" y="310" class="content">
    风暴猛烈地袭击了岛屿。
  </text>

  <!-- Visual representation -->
  <g transform="translate(400,320)">
    <!-- Ground -->
    <rect x="0" y="150" width="350" height="50" class="image" />
    <!-- Fist -->
    <circle cx="175" cy="120" r="30" class="image" />
    <line x1="175" y1="120" x2="175" y2="150" class="image" />
    <line x1="175" y1="150" x2="150" y2="180" class="image" />
    <line x1="175" y1="150" x2="200" y2="180" class="image" />
    <line x1="175" y1="130" x2="220" y2="120" class="image" />
    <!-- Crack in the ground -->
    <line x1="100" y1="175" x2="250" y2="175" class="image" />
    <line x1="175" y1="175" x2="175" y2="200" class="image" />
  </g>
</svg>